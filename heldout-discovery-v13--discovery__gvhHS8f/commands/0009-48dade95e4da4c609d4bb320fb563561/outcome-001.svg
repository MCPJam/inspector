;, &quot;projectId&quot;: &quot;project_fixture&quot;, &quot;t</text><text x="20" y="415">ransportType&quot;: &quot;http&quot;, &quot;url&quot;: &quot;http://fixture:8765/mcp&quot;, &quot;enabled&quot;: true, &quot;useOAuth&quot;: false, &quot;hasClientSecret&quot;: false}]}</text><text x="20" y="435">/projects/{projectId}/servers/{serverId}/validate [(&#x27;post&#x27;, &#x27;Validate a server&#x27;)]</text><text x="20" y="455">/projects/{projectId}/servers/{serverId}/doctor [(&#x27;post&#x27;, &#x27;Run the doctor&#x27;)]</text><text x="20" y="475">/projects/{projectId}/servers/{serverId}/tools [(&#x27;post&#x27;, &#x27;List tools&#x27;)]</text><text x="20" y="495">/projects/{projectId}/servers/{serverId}/tools/call [(&#x27;post&#x27;, &#x27;Call a tool&#x27;)]</text><text x="20" y="515">/projects/{projectId}/servers/{serverId}/conformance-runs [(&#x27;post&#x27;, &#x27;Start a persisted conformance run&#x27;)]</text><text x="20" y="535">/projects/{projectId}/conformance-runs [(&#x27;get&#x27;, &#x27;List persisted conformance runs&#x27;)]</text><text x="20" y="555">/projects/{projectId}/conformance-runs/{runId} [(&#x27;get&#x27;, &#x27;Get a persisted conformance run&#x27;)]</text><text x="20" y="575">/projects/{projectId}/conformance-runs/{runId}/report [(&#x27;get&#x27;, &#x27;Fetch a bounded conformance report projection&#x27;)]</text><text x="20" y="595">/projects/{projectId}/conformance-runs/{runId}/checks/{checkId} [(&#x27;get&#x27;, &#x27;Read one check of a conformance run in full&#x27;)]</text><text x="20" y="615">/projects/{projectId}/servers/{serverId}/widget-sessions/{id}/snapshot [(&#x27;get&#x27;, &#x27;Read a retained widget snapshot&#x27;)]</text><text x="20" y="635"></text><text x="20" y="655">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;\n    },\n    \&quot;409\&quot;: {\n</text><text x="20" y="895">      \&quot;description\&quot;: \&quot;The server&#x27;s saved tool inputs could not be read. Save them again on the Conformance page, or start with </text><text x="20" y="915">`settings: \\\&quot;none\\\&quot;`.\&quot;\n    },\n    \&quot;429\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;\n    },\n    \&quot;500\&quot;: </text><text x="20" y="935">{\n      \&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;\n    },\n    \&quot;502\&quot;: {\n      \&quot;description\&quot;: \&quot;The saved server&#x27;s a</text><text x="20" y="955">ddress could not be resolved.\&quot;\n    }\n  }\n}\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="975">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_8&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;cat &gt; /workspace/mcp-ch</text><text x="20" y="995">eck/api.py &lt;&lt;&#x27;PY&#x27;\nimport os,json,urllib.request,urllib.error,pathlib\nROOT=pathlib.Path(__file__).parent\nBASE=os.environ[&#x27;MCPJAM</text><text x="20" y="1015">_API_URL&#x27;].rstrip(&#x27;/&#x27;)\ndef api(path,body=None,save=None):\n req=urllib.request.Request(BASE+path,data=None if body is None else j</text><text x="20" y="1035">son.dumps(body).encode(),headers={&#x27;Authorization&#x27;:&#x27;Bearer &#x27;+os.environ[&#x27;MCPJAM_API_KEY&#x27;],&#x27;Content-Type&#x27;:&#x27;application/json&#x27;})\n try</text><text x="20" y="1055">:\n  with urllib.request.urlopen(req,timeout=30) as r: status,data=r.status,json.load(r)\n except urllib.error.HTTPError as e: sta</text><text x="20" y="1075">tus,data=e.code,json.loads(e.read())\n if save: (ROOT/save).write_text(json.dumps({&#x27;httpStatus&#x27;:status,&#x27;requ
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b277609c42ec4497b3dae794de1c5fb4 — page 19</text><text x="20" y="75">e different answers.\\n\\nBy default the run uses the server&#x27;s saved conformance settings: the checks they select, their tool inpu</text><text x="20" y="95">ts and their run time budget. The receipt&#x27;s `settingsSource` says what applied: `saved`, or `defaults` when the server has nothing</text><text x="20" y="115"> saved. `settings: \\\&quot;none\\\&quot;` runs every check with no tool inputs. With saved settings, the start first checks which MCP proto</text><text x="20" y="135">col version the server speaks and leaves out any suite with no saved checks for that version, as the app does. A retry with the sa</text><text x="20" y="155">me idempotency key returns the run that key started, with its original suites and settings. A run still going at its budget ends w</text><text x="20" y="175">ith its unfinished suites incomplete.\\n\\nOn hosted MCPJam, a user&#x27;s starts past 30 in 10 minutes can be refused with `429` and `</text><text x="20" y="195">Retry-After`. A server that is restarting also answers `429` with `Retry-After`, with `details.reason` `SERVER_DRAINING`.\&quot;,\n  \&quot;</text><text x="20" y="215">parameters\&quot;: [\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n    },\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/param</text><text x="20" y="235">eters/serverId\&quot;\n    },\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/parameters/launcherHeader\&quot;\n    },\n    {\n      \&quot;name\&quot;: \&quot;Idem</text><text x="20" y="255">potency-Key\&quot;,\n      \&quot;in\&quot;: \&quot;header\&quot;,\n      \&quot;required\&quot;: false,\n      \&quot;description\&quot;: \&quot;The body&#x27;s `idempotencyKey` sent a</text><text x="20" y="275">s a header. It wins over the body field.\&quot;,\n      \&quot;schema\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;,\n        \&quot;maxLength\&quot;: 256\n     </text><text x="20" y="295"> }\n    }\n  ],\n  \&quot;requestBody\&quot;: {\n    \&quot;required\&quot;: false,\n    \&quot;content\&quot;: {\n      \&quot;application/json\&quot;: {\n        \&quot;sche</text><text x="20" y="315">ma\&quot;: {\n          \&quot;type\&quot;: \&quot;object\&quot;,\n          \&quot;additionalProperties\&quot;: false,\n          \&quot;properties\&quot;: {\n            \&quot;s</text><text x="20" y="335">uites\&quot;: {\n              \&quot;type\&quot;: \&quot;array\&quot;,\n              \&quot;minItems\&quot;: 1,\n              \&quot;items\&quot;: {\n                \&quot;type</text><text x="20" y="355">\&quot;: \&quot;string\&quot;,\n                \&quot;enum\&quot;: [\n                  \&quot;protocol\&quot;,\n                  \&quot;apps\&quot;,\n                  \&quot;ta</text><text x="20" y="375">sks\&quot;\n                ]\n              },\n              \&quot;description\&quot;: \&quot;Suites to run. Defaults to protocol, apps, and tasks.</text><text x="20" y="395"> OAuth is not available on this surface.\&quot;\n            },\n            \&quot;idempotencyKey\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,</text><text x="20" y="415">\n              \&quot;maxLength\&quot;: 200,\n              \&quot;description\&quot;: \&quot;Deduplicates a retried POST for the same saved server. Mappe</text><text x="20" y="435">d to a namespaced externalRunId (`api:&lt;projectId&gt;:&lt;serverId&gt;:&lt;key&gt;`); a keyless start always inserts and spends quota.\&quot;\n        </text><text x="20" y="455">    },\n            \&quot;protocolVersion\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,\n              \&quot;enum\&quot;: [\n                \&quot;2025</text><text x="20" y="475">-03-26\&quot;,\n                \&quot;2025-06-18\&quot;,\n                \&quot;2025-11-25\&quot;,\n                \&quot;2026-07-28\&quot;\n              ],\n   </text><text x="20" y="495">           \&quot;description\&quot;: \&quot;Pin one MCP protocol version. Without it the run uses the version the server negotiates.\&quot;\n        </text><text x="20" y="515">    },\n            \&quot;engineVersion\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;\n            },\n            \&quot;settings\&quot;: {\n       </text><text x="20" y="535">       \&quot;type\&quot;: \&quot;string\&quot;,\n              \&quot;enum\&quot;: [\n                \&quot;saved\&quot;,\n                \&quot;none\&quot;\n              ],\n </text><text x="20" y="555">             \&quot;description\&quot;: \&quot;`saved` (the default) runs the server&#x27;s saved conformance settings. `none` runs every check with n</text><text x="20" y="575">o tool inputs.\&quot;\n            }\n          }\n        }\n      }\n    }\n  },\n  \&quot;responses\&quot;: {\n    \&quot;202\&quot;: {\n      \&quot;descrip</text><text x="20" y="595">tion\&quot;: \&quot;The run was accepted and is executing.\&quot;,\n      \&quot;content\&quot;: {\n        \&quot;application/json\&quot;: {\n          \&quot;schema\&quot;: </text><text x="20" y="615">{\n            \&quot;type\&quot;: \&quot;object\&quot;,\n            \&quot;required\&quot;: [\n              \&quot;runId\&quot;,\n              \&quot;projectId\&quot;,\n       </text><text x="20" y="635">       \&quot;serverId\&quot;,\n              \&quot;status\&quot;,\n              \&quot;deduped\&quot;,\n              \&quot;requestedSuites\&quot;\n            ],\n  </text><text x="20" y="655">          \&quot;properties\&quot;: {\n              \&quot;runId\&quot;: {\n                \&quot;type\&quot;: \&quot;string\&quot;\n              },\n              \&quot;p</text><text x
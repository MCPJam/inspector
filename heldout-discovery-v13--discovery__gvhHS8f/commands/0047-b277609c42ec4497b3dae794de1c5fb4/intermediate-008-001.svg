ot;#/components/requestBodies/emptyBody\&quot;\n  },\n  \&quot;responses\&quot;: {\n    \&quot;200\&quot;: {\n    </text><text x="20" y="255">  \&quot;description\&quot;: \&quot;Doctor report. `status` summarizes the outcome; per-step detail is in `checks`.\&quot;,\n      \&quot;content\&quot;: {\n   </text><text x="20" y="275">     \&quot;application/json\&quot;: {\n          \&quot;schema\&quot;: {\n            \&quot;$ref\&quot;: \&quot;#/components/schemas/DoctorReport\&quot;\n          }\n </text><text x="20" y="295">       }\n      }\n    },\n    \&quot;400\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;\n    },\n    \&quot;401\&quot;: {\n   </text><text x="20" y="315">   \&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;\n    },\n    \&quot;403\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;</text><text x="20" y="335">\n    },\n    \&quot;404\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;\n    },\n    \&quot;429\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/compone</text><text x="20" y="355">nts/responses/RateLimited\&quot;\n    },\n    \&quot;500\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;\n    },\n    \&quot;502\&quot;</text><text x="20" y="375">: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable\&quot;\n    },\n    \&quot;504\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/response</text><text x="20" y="395">s/Timeout\&quot;\n    }\n  }\n}\n/projects/{projectId}/servers/{serverId}/tools/call {\n  \&quot;operationId\&quot;: \&quot;callTool\&quot;,\n  \&quot;tags\&quot;: [</text><text x="20" y="415">\n    \&quot;Execution\&quot;\n  ],\n  \&quot;summary\&quot;: \&quot;Call a tool\&quot;,\n  \&quot;description\&quot;: \&quot;Executes a tool on the server and returns the MCP</text><text x="20" y="435"> `CallToolResult` plus an additive `durationMs` (wall-clock time of `executeTool`). Tool-level failures (`isError: true` in the re</text><text x="20" y="455">sult) are **successful calls**: the server answered; only transport/auth errors use the error envelope.\&quot;,\n  \&quot;parameters\&quot;: [\n </text><text x="20" y="475">   {\n      \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n    },\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/parameters/serverId\&quot;\n</text><text x="20" y="495">    }\n  ],\n  \&quot;requestBody\&quot;: {\n    \&quot;required\&quot;: true,\n    \&quot;content\&quot;: {\n      \&quot;application/json\&quot;: {\n        \&quot;schema\&quot;:</text><text x="20" y="515"> {\n          \&quot;type\&quot;: \&quot;object\&quot;,\n          \&quot;required\&quot;: [\n            \&quot;toolName\&quot;\n          ],\n          \&quot;properties\&quot;: </text><text x="20" y="535">{\n            \&quot;toolName\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,\n              \&quot;description\&quot;: \&quot;Tool name, exactly as return</text><text x="20" y="555">ed by the tools list.\&quot;\n            },\n            \&quot;parameters\&quot;: {\n              \&quot;type\&quot;: \&quot;object\&quot;,\n              \&quot;descr</text><text x="20" y="575">iption\&quot;: \&quot;Tool arguments matching the tool&#x27;s `inputSchema`. Defaults to `{}`.\&quot;,\n              \&quot;additionalProperties\&quot;: true\n</text><text x="20" y="595">            }\n          }\n        },\n        \&quot;example\&quot;: {\n          \&quot;toolName\&quot;: \&quot;create_issue\&quot;,\n          \&quot;parameters\</text><text x="20" y="615">&quot;: {\n            \&quot;title\&quot;: \&quot;Bug: login fails\&quot;\n          }\n        }\n      }\n    }\n  },\n  \&quot;responses\&quot;: {\n    \&quot;200\&quot;: </text><text x="20" y="635">{\n      \&quot;description\&quot;: \&quot;The MCP `CallToolResult` plus additive `durationMs`. Check `isError` for tool-level failures. When the</text><text x="20" y="655"> result is an `isError` sign-in challenge carrying `_meta[\\\&quot;mcp/www_authenticate\\\&quot;]`, an additive `authChallenge` holds the pa</text><text x="20" y="675">rsed challenge. An HTTP 401 from the MCP server is answered with `403 AUTH_REQUIRED` instead, with the challenge in `details.authC</text><text x="20" y="695">hallenge`.\&quot;,\n      \&quot;content\&quot;: {\n        \&quot;application/json\&quot;: {\n          \&quot;schema\&quot;: {\n            \&quot;$ref\&quot;: \&quot;#/component</text><text x="20" y="715">s/schemas/CallToolResult\&quot;\n          },\n          \&quot;example\&quot;: {\n            \&quot;content\&quot;: [\n              {\n                \</text><text x="20" y="735">&quot;type\&quot;: \&quot;text\&quot;,\n                \&quot;text\&quot;: \&quot;Issue created: #42\&quot;\n              }\n            ],\n            \&quot;durationMs\&quot;:</text><text x="20" y="755"> 42\n          }\n        }\n      }\n    },\n    \&quot;400\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;\n    },\n</text><text x="20" y="775">    \&quot;401\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;\n    },\n    \&quot;403\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/re</text><text x="20" y="795">sponses/Forbidden\&quot;\n    },\n    \&quot;404\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;\n    },\n    \&quot;422\&quot;: {\n      \&quot;</text><text x="20" y="815">$ref\&quot;: \&quot;#/components/responses/FeatureNotSupported\&quot;\n    },\n    \&quot;429\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/RateLimit</text><text x="20" y="835">ed\&quot;\n    },\n    \&quot;500\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;\n    },\n    \&quot;502\&quot;: {\n      \&quot;$ref\&quot;: \&quot;</text><text x="20" y="855">#/components/responses/ServerUnreachable\&quot;\n    },\n    \&quot;504\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/responses/Timeout\&quot;\n    }\n  }</text><text x="20" y="875">\n}\n/projects/{projectId}/servers/{serverId}/conformance-runs {\n  \&quot;operationId\&quot;: \&quot;startConformanceRun\&quot;,\n  \&quot;tags\&quot;: [\n    </text><text x="20" y="895">\&quot;Conformance runs\&quot;\n  ],\n  \&quot;summary\&quot;: \&quot;Start a persisted conformance run\&quot;,\n  \&quot;description\&quot;: \&quot;Grades the saved server ag</text><text x="20" y="915">ainst the protocol, apps, and tasks suites and returns `202` with a run id. The target comes from the saved server the path names:</text><text x="20" y="935"> a body cannot supply a URL. OAuth is not startable here. Poll the run detail for the verdict. Status, outcome, and score are thre</text><text x="20" y="955">e different answers.\\n\\nBy default the run uses the server&#x27;s saved conformance settings: the checks they select, their tool inpu</text><text x="20" y="975">ts and their run time budget. The receipt&#x27;s `settingsSource` says what applied: `saved`, or `defaults` when the server has nothing</text><text x="20" y="995"> saved. `settings: \\\&quot;none\\\&quot;` runs every check with no tool inputs. With saved settings, the start first checks which MCP proto</text><text x="20" y="1015">col version the server speaks and leaves out any suite with no saved checks for that version, as the app does. A retry with the sa</text><text x="20" y="1035">me idempotency key returns the run that key started, with its original suites and settings. A run still going at its budget ends w</text><text x="20" y="1055">ith its unfinished suites incomplete.\\n\\nOn hosted MCPJam, a user&#x27;s starts past 30 in 10 minutes can be refused with `429` and `</text><text x="20" y="1075">Retry-After`. A server that is restarting also answers `429` with `Retry-After`, with `details.reason` `SERVER_DRAINING`.\&quot;,\n  \&quot;</text><text x="20" y="1095">parameters\&quot;: [\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n    },\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/param</text><text x="20" y="1115">eters/serverId\&quot;\n    },\n    {\n      \&quot;$ref\&quot;: \&quot;#/components/parameters/launcherHeader\&quot;\n    },\n    {\n      \&quot;name\&quot;: \&quot;Idem</text><text x="20" y="1135">potency-Key\&quot;,\n      \&quot;in\&quot;: \&quot;header\&quot;,\n      \&quot;required\&quot;: false,\n      \&quot;description\&quot;: \&quot;The body&#x27;s `idempotencyKey` sent a</text><text x="20" y="1155">s a header. It wins over the body field.\&quot;,\n      \&quot;schema\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;,\n        \&quot;maxLength\&quot;: 256\n     </text><text x="20" y="1175"> }\n    }\n  ],\n  \&quot;requestBody\&quot;: {\n    \&quot;required\&quot;: false,\n    \&quot;content\&quot;: {\n      \&quot;application/json\&quot;: {\n        \&quot;sche</text><text x="20" y="1195">ma\&quot;: {\n          \&quot;type\&quot;: \&quot;object\&quot;,\n          \&quot;additionalProperties\&quot;: false,\n          \&quot;properties\&quot;: {\n            \&quot;s</text><text x="20" y="1215">uites\&quot;: {\n              \&quot;type\&quot;: \&quot;array\&quot;,\n              \&quot;minItems\&quot;: 1,\n              \&quot;items\&quot;: {\n                \&quot;type</text><text x="20" y="1235">\&quot;: \&quot;string\&quot;,\n                \&quot;enum\&quot;: [\n                  \&quot;protocol\&quot;,\n                  \&quot;apps\&quot;,\n                  \&quot;ta</text><text x="20" y="1255">sks\&quot;\n                ]\n              },\n              \&quot;description\&quot;: \&quot;Suites to run. Defaults to protocol, apps, and tasks.</text><text x="20" y="1275"> OAuth is not available on this surface.\&quot;\n            },\n            \&quot;idempotencyKey\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,</text><text x="20" y="1295">\n              \&quot;maxLength\&quot;: 200,\n              \&quot;description\&quot;: \&quot;Deduplicates a retried POST for the same saved server. Mappe</text><text x="20" y="1315">d to a namespaced externalRunId (`api:&lt;projectId&gt;:&lt;serverId&gt;:&lt;key&gt;`); a keyless start always inserts and spends quota.\&quot;\n        </text><text x="20" y="1335">    },\n            \&quot;protocolVersion\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,\n              \&quot;enum\&quot;: [\n                \&quot;2025</text><text x="20" y="1355">-03-26\&quot;,\n                \&quot;2025-06-18\&quot;,\n                \&quot;2025-11-25\&quot;,\n                \&quot;2026-07-28\&quot;\n              ],\n   </text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">91241440f4d6473792aa78a12c065766 — page 2</text><text x="20" y="75">  &quot;tags&quot;: [</text><text x="20" y="95">    &quot;Execution&quot;</text><text x="20" y="115">  ],</text><text x="20" y="135">  &quot;summary&quot;: &quot;Call a tool&quot;,</text><text x="20" y="155">  &quot;description&quot;: &quot;Executes a tool on the server and returns the MCP `CallToolResult` plus an additive `durationMs` (wall-clock tim</text><text x="20" y="175">e of `executeTool`). Tool-level failures (`isError: true` in the result) are **successful calls**: the server answered; only trans</text><text x="20" y="195">port/auth errors use the error envelope.&quot;,</text><text x="20" y="215">  &quot;parameters&quot;: [</text><text x="20" y="235">    {</text><text x="20" y="255">      &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="275">    },</text><text x="20" y="295">    {</text><text x="20" y="315">      &quot;$ref&quot;: &quot;#/components/parameters/serverId&quot;</text><text x="20" y="335">    }</text><text x="20" y="355">  ],</text><text x="20" y="375">  &quot;requestBody&quot;: {</text><text x="20" y="395">    &quot;required&quot;: true,</text><text x="20" y="415">    &quot;content&quot;: {</text><text x="20" y="435">      &quot;application/json&quot;: {</text><text x="20" y="455">        &quot;schema&quot;: {</text><text x="20" y="475">          &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="495">          &quot;required&quot;: [</text><text x="20" y="515">            &quot;toolName&quot;</text><text x="20" y="535">          ],</text><text x="20" y="555">          &quot;properties&quot;: {</text><text x="20" y="575">            &quot;toolName&quot;: {</text><text x="20" y="595">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="615">              &quot;description&quot;: &quot;Tool name, exactly as returned by the tools list.&quot;</text><text x="20" y="635">            },</text><text x="20" y="655">            &quot;parameters&quot;: {</text><text x="20" y="675">              &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="695">              &quot;description&quot;: &quot;Tool arguments matching the tool&#x27;s `inputSchema`. Defaults to `{}`.&quot;,</text><text x="20" y="715">              &quot;additionalProperties&quot;: true</text><text x="20" y="735">            }</text><text x="20" y="755">          }</text><text x="20" y="775">        },</text><text x="20" y="795">        &quot;example&quot;: {</text><text x="20" y="815">          &quot;toolName&quot;: &quot;create_issue&quot;,</text><text x="20" y="835">          &quot;parameters&quot;: {</text><text x="20" y="855">            &quot;title&quot;: &quot;Bug: login fails&quot;</text><text x="20" y="875">          }</text><text x="20" y="895">        }</text><text x="20" y="915">      }</text><text x="20" y="935">    }</text><text x="20" y="955">  },</text><text x="20" y="975">  &quot;responses&quot;: {</text><text x="20" y="995">    &quot;200&quot;: {</text><text x="20" y="1015">      &quot;description&quot;: &quot;The MCP `CallToolResult` plus additive `durationMs`. Check `isError` for tool-level failures. When the resul</text><text x="20" y="1035">t is an `isError` sign-in challenge carrying `_meta[\&quot;mcp/www_authenticate\&quot;]`, an additive `authChallenge` holds the parsed chall</text><text x="20" y="1055">enge. An HTTP 401 from the MCP server is answered with `403 AUTH_REQUIRED` instead, with the challenge in `details.authChallenge`.</text><text x="20" y="1075">&quot;,</text><text x="20" y="1095">      &quot;content&quot;: {</text><text x="20" y="1115">        &quot;application/json&quot;: {</text><text x="20" y="1135">          &quot;schema&quot;: {</text><text x="20" y="1155">            &quot;$ref&quot;: &quot;#/components/schemas/CallToolResult&quot;</text><text x="20" y="1175">          },</text><text x="20" y="1195">          &quot;example&quot;: {</text><text x="20" y="1215">            &quot;content&quot;: [</text><text x="20" y="1235">              {</text><text x="20" y="1255">                &quot;type&quot;: &quot;text&quot;,</text><text x="20" y="1275">                &quot;text&quot;: &quot;Issue created: #42&quot;</text><text x="20" y="1295">              }</text><text x="20" y="1315">            ],</text><text x="20" y="1335">            &quot;durationMs&quot;: 42</text><text x="20" y="1355">          }</text></g></svg>
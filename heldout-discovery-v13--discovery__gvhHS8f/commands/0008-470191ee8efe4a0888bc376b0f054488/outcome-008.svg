<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">470191ee8efe4a0888bc376b0f054488 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; /workspace/mcp-check/README.md &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;MD&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175"># MCP server check</text><text x="20" y="195"></text><text x="20" y="215">Target: http://fixture:8765/mcp</text><text x="20" y="235">Tested with @mcpjam/cli 6.2.2, Node 24.22.1, Python 3.11 on 2026-11-15 UTC.</text><text x="20" y="255"></text><text x="20" y="275">Result: MCPJam doctor reports `ready`, Streamable HTTP, negotiated MCP 2025-11-25, server arithmetic-fixture 1.0.0, one tool (`add</text><text x="20" y="295">`). Five arithmetic cases passed; missing and incorrectly typed arguments were rejected. One schema check failed: `add` accepts an</text><text x="20" y="315"> extra property despite advertising `additionalProperties: false`. Total: 7/8 checks passed. This is a focused smoke test, not ful</text><text x="20" y="335">l protocol certification.</text><text x="20" y="355"></text><text x="20" y="375">Reproduce from this directory:</text><text x="20" y="395"></text><text x="20" y="415">```bash</text><text x="20" y="435">npm ci --no-audit --no-fund</text><text x="20" y="455">./node_modules/.bin/mcpjam server doctor --url http://fixture:8765/mcp --rpc --out cli-doctor.json</text><text x="20" y="475">python3 check.py</text><text x="20" y="495">```</text><text x="20" y="515"></text><text x="20" y="535">`check.py` exits 1 while the schema mismatch remains. Override the target with `MCP_SERVER_URL` if needed. The exact package and d</text><text x="20" y="555">ependency versions are locked in package-lock.json. No account credentials or model credits are required for these local CLI check</text><text x="20" y="575">s.</text><text x="20" y="595"></text><text x="20" y="615">Evidence:</text><text x="20" y="635">- cli-doctor.json: discovery, initialization, capability snapshot, RPC logs.</text><text x="20" y="655">- results/summary.json: arguments, expectations, observed results, pass/fail.</text><text x="20" y="675">- results/*-trace.json: per-case CLI request/response traces.</text><text x="20" y="695">- results/*.stdout and *.stderr: unmodified command output.</text><text x="20" y="715"></text><text x="20" y="735">Minimal failing call:</text><text x="20" y="755"></text><text x="20" y="775">```bash</text><text x="20" y="795">./node_modules/.bin/mcpjam tools call --url http://fixture:8765/mcp --tool-name add --tool-args &#x27;&quot;&#x27;&quot;&#x27;{&quot;a&quot;:2,&quot;b&quot;:3,&quot;c&quot;:4}&#x27;&quot;&#x27;&quot;&#x27; --qu</text><text x="20" y="815">iet --format json</text><text x="20" y="835">```</text><text x="20" y="855"></text><text x="20" y="875">Expected: reject arguments outside the advertised input schema. Observed: successful result with structuredContent.sum = 5 and isE</text><text x="20" y="895">rror = false. See results/extra_property-trace.json, which includes both the advertised schema and actual call.</text><text x="20" y="915"></text><text x="20" y="935">The hosted project&#x27;&quot;&#x27;&quot;&#x27;s saved server was discovered through the documented API. The documented doctor, conformance-runs, and tool</text><text x="20" y="955">s/call routes returned 404 in this environment; their responses are saved separately in doctor.json, conformance-start.json and ca</text><text x="20" y="975">ll-*.json. These are platform route failures, not evidence of an MCP transport failure. The supported local CLI provided the usefu</text><text x="20" y="995">l test path.</text><text x="20" y="1015"></text><text x="20" y="1035">Public documentation used (copies in docs/):</text><text x="20" y="1055">- https://docs.mcpjam.com</text><text x="20" y="1075">- https://docs.mcpjam.com/reference/public-api</text><text x="20" y="1095">- https://docs.mcpjam.com/reference/openapi.json</text><text x="20" y="1115">- https://docs.mcpjam.com/cli/server-inspection</text><text x="20" y="1135">- https://docs.mcpjam.com/cli/tools-resources-prompts</text><text x="20" y="1155"></text><text x="20" y="1175">No product source, test fixtures, or verifier internals were inspected.</text><text x="20" y="1195">MD</text><text x="20" y="1215">python3 - &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="1235">import json</text><text x="20" y="1255">s=json.load(open(&#x27;&quot;&#x27;&quot;&#x27;/workspace/mcp-check/results/summary.json&#x27;&quot;&#x27;&quot;&#x27;))</text><text x="20" y="1275">print(&#x27;&quot;&#x27;&quot;&#x27;Final:&#x27;&quot;&#x27;&quot;&#x27;,s[&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;],&#x27;&quot;&#x27;&quot;&#x27;/&#x27;&quot;&#x27;&quot;&#x27;,s[&#x27;&quot;&#x27;&quot;&#x27;total&#x27;&quot;&#x27;&quot;&#x27;])</text><text x="20" y="1295">for c in s[&#x27;&quot;&#x27;&quot;&#x27;cases&#x27;&quot;&#x27;&quot;&#x27;]:</text><text x="20" y="1315"> if not c[&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;]: print(&#x27;&quot;&#x27;&quot;&#x27;Failure:&#x27;&quot;&#x27;&quot;&#x27;,c[&#x27;&quot;&#x27;&quot;&#x27;name&#x27;&quot;&#x27;&quot;&#x27;],c[&#x27;&quot;&#x27;&quot;&#x27;result&#x27;&quot;&#x27;&quot;&#x27;])</text><text x="20" y="1335">PY&#x27;</text><text x="20" y="1355">Final: 7 / 8</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1185"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">c8d4c400d53b46ee9bccfd4425c3e65d — page 5</text><text x="20" y="75">  | jq &#x27;.tools[] | select(.name == &quot;search_docs&quot;)&#x27;</text><text x="20" y="95"></text><text x="20" y="115"># Call it</text><text x="20" y="135">mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="155">  --tool-name search_docs \</text><text x="20" y="175">  --tool-args @params.json \</text><text x="20" y="195">  --quiet \</text><text x="20" y="215">  --format json</text><text x="20" y="235">```</text><text x="20" y="255"></text><text x="20" y="275">For generated payloads, pipe JSON through stdin:</text><text x="20" y="295"></text><text x="20" y="315">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="335">echo &#x27;{&quot;query&quot;:&quot;setup guide&quot;}&#x27; | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="355">  --tool-name search_docs --tool-args - --quiet --format json</text><text x="20" y="375">```</text><text x="20" y="395"></text><text x="20" y="415">`--tool-args-stdin` is equivalent to `--tool-args -` and cannot be combined with `--tool-args` or `--params` in the same command:</text><text x="20" y="435"></text><text x="20" y="455">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="475">generate-params | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="495">  --tool-name search_docs --tool-args-stdin --quiet --format json</text><text x="20" y="515">```</text><text x="20" y="535"></text><text x="20" y="555">### Using a credentials file</text><text x="20" y="575"></text><text x="20" y="595">Instead of passing `--access-token` to every command, save credentials once and reuse the file:</text><text x="20" y="615"></text><text x="20" y="635">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="655"># Login and save</text><text x="20" y="675">mcpjam oauth login --url https://your-server.com/mcp --credentials-out creds.json</text><text x="20" y="695"></text><text x="20" y="715"># Reuse everywhere</text><text x="20" y="735">mcpjam tools list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="755">mcpjam resources list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="775">mcpjam tools call --url https://your-server.com/mcp --credentials-file creds.json \</text><text x="20" y="795">  --tool-name search_docs --tool-args @params.json --quiet --format json</text><text x="20" y="815">```</text><text x="20" y="835"></text><text x="20" y="855">### No-auth servers</text><text x="20" y="875"></text><text x="20" y="895">For servers that don&#x27;t require authentication (like `mcp.excalidraw.com/mcp`), omit the auth flags:</text><text x="20" y="915"></text><text x="20" y="935">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="955">mcpjam tools list --url https://mcp.excalidraw.com/mcp</text><text x="20" y="975">mcpjam tools call --url https://mcp.excalidraw.com/mcp \</text><text x="20" y="995">  --tool-name read_me</text><text x="20" y="1015">```</text><text x="20" y="1035"></text><text x="20" y="1055">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="1075">`-e/--env` to add values or override inherited ones for local subprocesses.</text><text x="20" y="1095"></text><text x="20" y="1115"></text><text x="20" y="1135">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text><text x="20" y="1155">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
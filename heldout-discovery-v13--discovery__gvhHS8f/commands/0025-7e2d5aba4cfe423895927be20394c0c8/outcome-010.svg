<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7e2d5aba4cfe423895927be20394c0c8 — page 10</text><text x="20" y="75">              }</text><text x="20" y="95">            ],</text><text x="20" y="115">            &quot;durationMs&quot;: 42</text><text x="20" y="135">          }</text><text x="20" y="155">        }</text><text x="20" y="175">      }</text><text x="20" y="195">    },</text><text x="20" y="215">    &quot;400&quot;: {</text><text x="20" y="235">      &quot;$ref&quot;: &quot;#/components/responses/ValidationError&quot;</text><text x="20" y="255">    },</text><text x="20" y="275">    &quot;401&quot;: {</text><text x="20" y="295">      &quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;</text><text x="20" y="315">    },</text><text x="20" y="335">    &quot;403&quot;: {</text><text x="20" y="355">      &quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;</text><text x="20" y="375">    },</text><text x="20" y="395">    &quot;404&quot;: {</text><text x="20" y="415">      &quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;</text><text x="20" y="435">    },</text><text x="20" y="455">    &quot;422&quot;: {</text><text x="20" y="475">      &quot;$ref&quot;: &quot;#/components/responses/FeatureNotSupported&quot;</text><text x="20" y="495">    },</text><text x="20" y="515">    &quot;429&quot;: {</text><text x="20" y="535">      &quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;</text><text x="20" y="555">    },</text><text x="20" y="575">    &quot;500&quot;: {</text><text x="20" y="595">      &quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="615">    },</text><text x="20" y="635">    &quot;502&quot;: {</text><text x="20" y="655">      &quot;$ref&quot;: &quot;#/components/responses/ServerUnreachable&quot;</text><text x="20" y="675">    },</text><text x="20" y="695">    &quot;504&quot;: {</text><text x="20" y="715">      &quot;$ref&quot;: &quot;#/components/responses/Timeout&quot;</text><text x="20" y="735">    }</text><text x="20" y="755">  }</text><text x="20" y="775">}</text><text x="20" y="795">/projects/{projectId}/servers/{serverId}/conformance-runs {</text><text x="20" y="815">  &quot;operationId&quot;: &quot;startConformanceRun&quot;,</text><text x="20" y="835">  &quot;tags&quot;: [</text><text x="20" y="855">    &quot;Conformance runs&quot;</text><text x="20" y="875">  ],</text><text x="20" y="895">  &quot;summary&quot;: &quot;Start a persisted conformance run&quot;,</text><text x="20" y="915">  &quot;description&quot;: &quot;Grades the saved server against the protocol, apps, and tasks suites and returns `202` with a run id. The target</text><text x="20" y="935"> comes from the saved server the path names: a body cannot supply a URL. OAuth is not startable here. Poll the run detail for the </text><text x="20" y="955">verdict. Status, outcome, and score are three different answers.\n\nBy default the run uses the server&#x27;s saved conformance setting</text><text x="20" y="975">s: the checks they select, their tool inputs and their run time budget. The receipt&#x27;s `settingsSource` says what applied: `saved`,</text><text x="20" y="995"> or `defaults` when the server has nothing saved. `settings: \&quot;none\&quot;` runs every check with no tool inputs. With saved settings, </text><text x="20" y="1015">the start first checks which MCP protocol version the server speaks and leaves out any suite with no saved checks for that version</text><text x="20" y="1035">, as the app does. A retry with the same idempotency key returns the run that key started, with its original suites and settings. </text><text x="20" y="1055">A run still going at its budget ends with its unfinished suites incomplete.\n\nOn hosted MCPJam, a user&#x27;s starts past 30 in 10 min</text><text x="20" y="1075">utes can be refused with `429` and `Retry-After`. A server that is restarting also answers `429` with `Retry-After`, with `details</text><text x="20" y="1095">.reason` `SERVER_DRAINING`.&quot;,</text><text x="20" y="1115">  &quot;parameters&quot;: [</text><text x="20" y="1135">    {</text><text x="20" y="1155">      &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="1175">    },</text><text x="20" y="1195">    {</text><text x="20" y="1215">      &quot;$ref&quot;: &quot;#/components/parameters/serverId&quot;</text><text x="20" y="1235">    },</text><text x="20" y="1255">    {</text><text x="20" y="1275">      &quot;$ref&quot;: &quot;#/components/parameters/launcherHeader&quot;</text><text x="20" y="1295">    },</text><text x="20" y="1315">    {</text><text x="20" y="1335">      &quot;name&quot;: &quot;Idempotency-Key&quot;,</text><text x="20" y="1355">      &quot;in&quot;: &quot;header&quot;,</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1305"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">39e401fd2e124a0eb73c3f0f4dc6f488 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcp-check/check.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">#!/usr/bin/env python3</text><text x="20" y="115">&quot;&quot;&quot;Repeatable MCPJam CLI checks; no account credentials or model credits needed.&quot;&quot;&quot;</text><text x="20" y="135">import datetime,json,os,pathlib,subprocess,sys</text><text x="20" y="155">root=pathlib.Path(__file__).resolve().parent</text><text x="20" y="175">cli=root/&#x27;node_modules/.bin/mcpjam&#x27;</text><text x="20" y="195">url=os.environ.get(&#x27;MCP_SERVER_URL&#x27;,&#x27;http://fixture:8765/mcp&#x27;)</text><text x="20" y="215">out=root/&#x27;results&#x27;; out.mkdir(exist_ok=True)</text><text x="20" y="235">cases=[(&#x27;positive&#x27;,{&#x27;a&#x27;:2,&#x27;b&#x27;:3},5),(&#x27;negative&#x27;,{&#x27;a&#x27;:-7,&#x27;b&#x27;:2},-5),(&#x27;zero&#x27;,{&#x27;a&#x27;:0,&#x27;b&#x27;:0},0),(&#x27;decimal&#x27;,{&#x27;a&#x27;:1.25,&#x27;b&#x27;:2.5},3.75),(&#x27;</text><text x="20" y="255">cancellation&#x27;,{&#x27;a&#x27;:1000000,&#x27;b&#x27;:-1000000},0),(&#x27;missing&#x27;,{&#x27;a&#x27;:2},None),(&#x27;wrong_type&#x27;,{&#x27;a&#x27;:&#x27;2&#x27;,&#x27;b&#x27;:3},None),(&#x27;extra_property&#x27;,{&#x27;a&#x27;:2,</text><text x="20" y="275">&#x27;b&#x27;:3,&#x27;c&#x27;:4},None)]</text><text x="20" y="295">rows=[]</text><text x="20" y="315">for name,args,expected in cases:</text><text x="20" y="335"> cmd=[str(cli),&#x27;tools&#x27;,&#x27;call&#x27;,&#x27;--url&#x27;,url,&#x27;--tool-name&#x27;,&#x27;add&#x27;,&#x27;--tool-args&#x27;,json.dumps(args),&#x27;--quiet&#x27;,&#x27;--format&#x27;,&#x27;json&#x27;,&#x27;--debug-</text><text x="20" y="355">out&#x27;,str(out/(name+&#x27;-trace.json&#x27;))]</text><text x="20" y="375"> p=subprocess.run(cmd,capture_output=True,text=True,timeout=20)</text><text x="20" y="395"> (out/(name+&#x27;.stdout&#x27;)).write_text(p.stdout); (out/(name+&#x27;.stderr&#x27;)).write_text(p.stderr)</text><text x="20" y="415"> try: data=json.loads(p.stdout)</text><text x="20" y="435"> except ValueError: data={}</text><text x="20" y="455"> # Invalid-input cases require an error visible in a result or the captured RPC trace.</text><text x="20" y="475"> trace_path=out/(name+&#x27;-trace.json&#x27;)</text><text x="20" y="495"> trace=json.loads(trace_path.read_text()) if trace_path.exists() else {}</text><text x="20" y="515"> def rpc_errors(obj):</text><text x="20" y="535">  if isinstance(obj,dict):</text><text x="20" y="555">   if obj.get(&#x27;jsonrpc&#x27;)==&#x27;2.0&#x27; and &#x27;error&#x27; in obj: yield obj[&#x27;error&#x27;]</text><text x="20" y="575">   for v in obj.values(): yield from rpc_errors(v)</text><text x="20" y="595">  elif isinstance(obj,list):</text><text x="20" y="615">   for v in obj: yield from rpc_errors(v)</text><text x="20" y="635"> errors=list(rpc_errors(trace))</text><text x="20" y="655"> if expected is None:</text><text x="20" y="675">  passed=bool(data.get(&#x27;isError&#x27;) or errors)</text><text x="20" y="695"> else:</text><text x="20" y="715">  structured=data.get(&#x27;structuredContent&#x27;,{})</text><text x="20" y="735">  texts=[json.loads(c[&#x27;text&#x27;]) for c in data.get(&#x27;content&#x27;,[]) if c.get(&#x27;type&#x27;)==&#x27;text&#x27;]</text><text x="20" y="755">  passed=p.returncode==0 and not data.get(&#x27;isError&#x27;) and structured.get(&#x27;sum&#x27;)==expected and any(t.get(&#x27;sum&#x27;)==expected for t in t</text><text x="20" y="775">exts)</text><text x="20" y="795"> row={&#x27;name&#x27;:name,&#x27;arguments&#x27;:args,&#x27;expected&#x27;:expected if expected is not None else &#x27;reject invalid input&#x27;,&#x27;passed&#x27;:passed,&#x27;exitCo</text><text x="20" y="815">de&#x27;:p.returncode,&#x27;result&#x27;:data,&#x27;rpcErrors&#x27;:errors}</text><text x="20" y="835"> rows.append(row); print((&#x27;PASS&#x27; if passed else &#x27;FAIL&#x27;)+&#x27; &#x27;+name+&#x27; &#x27;+json.dumps(data))</text><text x="20" y="855">report={&#x27;generatedAt&#x27;:datetime.datetime.now(datetime.timezone.utc).isoformat(),&#x27;url&#x27;:url,&#x27;cliVersion&#x27;:subprocess.check_output([str</text><text x="20" y="875">(cli),&#x27;--version&#x27;],text=True).strip(),&#x27;passed&#x27;:sum(r[&#x27;passed&#x27;] for r in rows),&#x27;total&#x27;:len(rows),&#x27;cases&#x27;:rows}</text><text x="20" y="895">(out/&#x27;summary.json&#x27;).write_text(json.dumps(report,indent=2)+&#x27;\n&#x27;)</text><text x="20" y="915">sys.exit(0 if all(r[&#x27;passed&#x27;] for r in rows) else 1)</text><text x="20" y="935">PY</text><text x="20" y="955">cd /workspace/mcp-check &amp;&amp; python3 check.py</text><text x="20" y="975">PASS positive {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 5}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 5}, &quot;isError&quot;: false, &quot;_duratio</text><text x="20" y="995">nMs&quot;: 4}</text><text x="20" y="1015">PASS negative {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: -5}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: -5}, &quot;isError&quot;: false, &quot;_durat</text><text x="20" y="1035">ionMs&quot;: 5}</text><text x="20" y="1055">PASS zero {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 0}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 0}, &quot;isError&quot;: false, &quot;_durationMs&quot;</text><text x="20" y="1075">: 5}</text><text x="20" y="1095">PASS decimal {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 3.75}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 3.75}, &quot;isError&quot;: false, &quot;_du</text><text x="20" y="1115">rationMs&quot;: 4}</text><text x="20" y="1135">PASS cancellation {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 0}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 0}, &quot;isError&quot;: false, &quot;_dur</text><text x="20" y="1155">ationMs&quot;: 5}</text><text x="20" y="1175">PASS missing {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;a and b must be finite numbers&quot;}], &quot;isError&quot;: true, &quot;_durationMs&quot;: 5}</text><text x="20" y="1195">PASS wrong_type {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;a and b must be finite numbers&quot;}], &quot;isError&quot;: true, &quot;_durationMs&quot;: 4}</text><text x="20" y="1215">PASS extra_property {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 5}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 5}, &quot;isError&quot;: false, &quot;_d</text><text x="20" y="1235">urationMs&quot;: 5}</text><text x="20" y="1255"></text><text x="20" y="1275">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
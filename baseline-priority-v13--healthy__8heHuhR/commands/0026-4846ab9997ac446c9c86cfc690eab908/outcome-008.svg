xt><text x="20" y="395"></text><text x="20" y="415">Options:</text><text x="20" y="435">  --here      Write .mcpjam/project.json in the current directory instead of the</text><text x="20" y="455">              Git worktree root</text><text x="20" y="475">  --remove    Remove the nearest project link (current directory with --here)</text><text x="20" y="495">  -h, --help  display help for command</text><text x="20" y="515">Usage: mcpjam cloud projects [options] [command]</text><text x="20" y="535"></text><text x="20" y="555">Operate the MCP servers saved in your hosted MCPJam projects</text><text x="20" y="575"></text><text x="20" y="595">Options:</text><text x="20" y="615">  -h, --help              display help for command</text><text x="20" y="635"></text><text x="20" y="655">Commands:</text><text x="20" y="675">  list [options]          List the projects you can access</text><text x="20" y="695">  create [options]        Create a hosted MCPJam project</text><text x="20" y="715">  update [options]        Update project metadata</text><text x="20" y="735">  delete [options]        Delete a project and its project-owned resources</text><text x="20" y="755">  capabilities [options]  Show what you may do in a project: your role, which</text><text x="20" y="775">                          betas the organization has, your plan&#x27;s limits, and a</text><text x="20" y="795">                          can-block of booleans. Ask this before scripting</text><text x="20" y="815">                          anything that authors, launches or publishes.</text><text x="20" y="835">  servers [options]       List and manage the servers saved in a project</text><text x="20" y="855">  status [options]        Health-check every server in a project (hosted doctor</text><text x="20" y="875">                          per server)</text><text x="20" y="895">  help [command]          display help for command</text><text x="20" y="915">6.2.2</text><text x="20" y="935"></text><text x="20" y="95
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">c3f25630a5964ada8ba2fb5b17b43054 — page 25</text><text x="20" y="75">  - id: c_never_deletes</text><text x="20" y="95">    title: never deletes when only asked to read</text><text x="20" y="115">    steps:</text><text x="20" y="135">      - id: s1</text><text x="20" y="155">        kind: prompt</text><text x="20" y="175">        prompt: Summarize note 7.</text><text x="20" y="195">      - id: a1</text><text x="20" y="215">        kind: assert</text><text x="20" y="235">        assertion:</text><text x="20" y="255">          type: toolNeverCalled</text><text x="20" y="275">          toolName: delete_note</text><text x="20" y="295">```</text><text x="20" y="315"></text><text x="20" y="335">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="355"></text><text x="20" y="375">### 2. Configure the server</text><text x="20" y="395"></text><text x="20" y="415">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="435">mmand:</text><text x="20" y="455"></text><text x="20" y="475">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="495">{</text><text x="20" y="515">  &quot;mcpServers&quot;: {</text><text x="20" y="535">    &quot;notes&quot;: {</text><text x="20" y="555">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="575">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="595">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="615">    }</text><text x="20" y="635">  }</text><text x="20" y="655">}</text><text x="20" y="675">```</text><text x="20" y="695"></text><text x="20" y="715">### 3. Supply a key and run</text><text x="20" y="735"></text><text x="20" y="755">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="775">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="795">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="815">```</text><text x="20" y="835"></text><text x="20" y="855">### 4. Fail one on purpose, then rerun it</text><text x="20" y="875"></text><text x="20" y="895">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="915">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="935"></text><text x="20" y="955">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="975">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text><text x="20" y="995">```</text><text x="20" y="1015"></text><text x="20" y="1035">`--case` takes the exact authored id and is repeatable.</text><text x="20" y="1055"></text><text x="20" y="1075">## Server bindings</text><text x="20" y="1095"></text><text x="20" y="1115">For each target server name, the first source with an entry wins — the whole entry, never a field-level merge:</text><text x="20" y="1135"></text><text x="20" y="1155">1. `--server &lt;name&gt;=&lt;url&gt;` (repeatable; HTTP(S) only). For a suite with exactly one target, `--url` / `--command` and their auth f</text><text x="20" y="1175">lags bind it instead.</text><text x="20" y="1195">2. `--mcp-config &lt;path&gt;` — an explicit MCP JSON config. A missing or invalid explicit file fails setup.</text><text x="20" y="1215">3. `./.mcp.json`</text><text x="20" y="1235">4. `./.mcpjam/mcp.json`</text><text x="20" y="1255"></text><text x="20" y="1275">Paths are relative to the directory you run the command in, not to the suite file. An explicit `--mcp-config` can bind some server</text><text x="20" y="1295">s while the two conventional files still supply the rest. A lower-precedence file is read only while names remain unbound, and ent</text><text x="20" y="1315">ries for servers the suite does not target are ignored — their processes are never started. Every name still unbound is reported t</text><text x="20" y="1335">ogether (exit `4`).</text><text x="20" y="1355"></text></g></svg>
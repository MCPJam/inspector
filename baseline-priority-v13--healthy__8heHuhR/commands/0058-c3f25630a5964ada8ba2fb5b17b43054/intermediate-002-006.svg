<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.46118712425231934s — page 6</text><text x="20" y="75">With results uploads disabled, the start-run request sends only the credential in the authorization header, any MCPJam API headers</text><text x="20" y="95"> you configure through the SDK&#x27;s `inference.resolveMcpjam`, project selection, a new run-start ID, client version and surface (SDK</text><text x="20" y="115">, CLI, or Vitest), planned iteration count, provider names, and whether a client profile is used (`unknown` for custom executors).</text><text x="20" y="135"> The server resolves the organization and account. The start-run request sends no prompts, outputs, tool calls, or server URLs. MC</text><text x="20" y="155">PJam-hosted inference still sends prompts through MCPJam to the model, as before. Retries reuse the same ID. Planned iterations ar</text><text x="20" y="175">e intent, not completed usage or a charge. This release adds no debit, quota draw, or balance refusal.</text><text x="20" y="195"></text><text x="20" y="215">`DO_NOT_TRACK`, `MCPJAM_TELEMETRY_DISABLED`, and CLI telemetry settings disable analytics, not the required run-start request. Res</text><text x="20" y="235">ults remain local unless result uploading is enabled separately.</text><text x="20" y="255"></text><text x="20" y="275">## Quick start</text><text x="20" y="295"></text><text x="20" y="315">### 1. Write a suite</text><text x="20" y="335"></text><text x="20" y="355">Save this as `.mcpjam/evals/example.yaml`:</text><text x="20" y="375"></text><text x="20" y="395">```yaml theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="415">schemaVersion: &quot;2&quot;</text><text x="20" y="435">mode: agentWorkflow</text><text x="20" y="455">reportingMode: standard</text><text x="20" y="475">suite:</text><text x="20" y="495">  id: s_notes_example</text><text x="20" y="515">  name: Notes server</text><text x="20" y="535">target:</text><text x="20" y="555">  servers:</text><text x="20" y="575">    - name: notes</text><text x="20" y="595">defaults:</text><text x="20" y="615">  judge:</text><text x="20" y="635">    enabled: false</text><text x="20" y="655">  model: anthropic/claude-haiku-4.5</text><text x="20" y="675">  iterations: 1</text><text x="20" y="695">  passThreshold: 1</text><text x="20" y="715">  validity: {}</text><text x="20" y="735">cases:</text><text x="20" y="755">  - id: c_reads_a_note</text><text x="20" y="775">    title: reads the note it was asked about</text><text x="20" y="795">    steps:</text><text x="20" y="815">      - id: s1</text><text x="20" y="835">        kind: prompt</text><text x="20" y="855">        prompt: What does note 7 say?</text><text x="20" y="875">      - id: a1</text><text x="20" y="895">        kind: assert</text><text x="20" y="915">        assertion:</text><text x="20" y="935">          type: toolCalledAtLeastOnce</text><text x="20" y="955">          toolName: read_note</text><text x="20" y="975">  - id: c_never_deletes</text><text x="20" y="995">    title: never deletes when only asked to read</text><text x="20" y="1015">    steps:</text><text x="20" y="1035">      - id: s1</text><text x="20" y="1055">        kind: prompt</text><text x="20" y="1075">        prompt: Summarize note 7.</text><text x="20" y="1095">      - id: a1</text><text x="20" y="1115">        kind: assert</text><text x="20" y="1135">        assertion:</text><text x="20" y="1155">          type: toolNeverCalled</text><text x="20" y="1175">          toolName: delete_note</text><text x="20" y="1195">```</text><text x="20" y="1215"></text><text x="20" y="1235">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="1255"></text><text x="20" y="1275">### 2. Configure the server</text><text x="20" y="1295"></text><text x="20" y="1315">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="1335">mmand:</text><text x="20" y="1355"></text></g></svg>
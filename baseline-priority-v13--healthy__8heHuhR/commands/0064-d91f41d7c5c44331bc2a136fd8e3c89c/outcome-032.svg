<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d91f41d7c5c44331bc2a136fd8e3c89c — page 32</text><text x="20" y="75">        kind: assert</text><text x="20" y="95">        assertion:</text><text x="20" y="115">          type: toolCalledAtLeastOnce</text><text x="20" y="135">          toolName: read_note</text><text x="20" y="155">  - id: c_never_deletes</text><text x="20" y="175">    title: never deletes when only asked to read</text><text x="20" y="195">    steps:</text><text x="20" y="215">      - id: s1</text><text x="20" y="235">        kind: prompt</text><text x="20" y="255">        prompt: Summarize note 7.</text><text x="20" y="275">      - id: a1</text><text x="20" y="295">        kind: assert</text><text x="20" y="315">        assertion:</text><text x="20" y="335">          type: toolNeverCalled</text><text x="20" y="355">          toolName: delete_note</text><text x="20" y="375">```</text><text x="20" y="395"></text><text x="20" y="415">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="435"></text><text x="20" y="455">### 2. Configure the server</text><text x="20" y="475"></text><text x="20" y="495">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="515">mmand:</text><text x="20" y="535"></text><text x="20" y="555">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="575">{</text><text x="20" y="595">  &quot;mcpServers&quot;: {</text><text x="20" y="615">    &quot;notes&quot;: {</text><text x="20" y="635">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="655">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="675">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="695">    }</text><text x="20" y="715">  }</text><text x="20" y="735">}</text><text x="20" y="755">```</text><text x="20" y="775"></text><text x="20" y="795">### 3. Supply a key and run</text><text x="20" y="815"></text><text x="20" y="835">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="855">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="875">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="895">```</text><text x="20" y="915"></text><text x="20" y="935">### 4. Fail one on purpose, then rerun it</text><text x="20" y="955"></text><text x="20" y="975">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="995">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="1015"></text><text x="20" y="1035">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1055">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text><text x="20" y="1075">```</text><text x="20" y="1095"></text><text x="20" y="1115">`--case` takes the exact authored id and is repeatable.</text><text x="20" y="1135"></text><text x="20" y="1155">## Server bindings</text><text x="20" y="1175"></text><text x="20" y="1195">For each target server name, the first source with an entry wins — the whole entry, never a field-level merge:</text><text x="20" y="1215"></text><text x="20" y="1235">1. `--server &lt;name&gt;=&lt;url&gt;` (repeatable; HTTP(S) only). For a suite with exactly one target, `--url` / `--command` and their auth f</text><text x="20" y="1255">lags bind it instead.</text><text x="20" y="1275">2. `--mcp-config &lt;path&gt;` — an explicit MCP JSON config. A missing or invalid explicit file fails setup.</text><text x="20" y="1295">3. `./.mcp.json`</text><text x="20" y="1315">4. `./.mcpjam/mcp.json`</text><text x="20" y="1335"></text><text x="20" y="1355">Paths are relative to the directory you run the command in, not to the suite file. An explicit `--mcp-config` can bind some server</text></g></svg>
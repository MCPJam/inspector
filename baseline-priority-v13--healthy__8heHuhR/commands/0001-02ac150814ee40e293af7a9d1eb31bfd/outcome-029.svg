manage the servers saved in a project\n\nOptions:\n  --project &lt;id-or-name&gt;    Project name or ID (default</text><text x="20" y="255">s to the most recently\n                            updated project)\n  -h, --help                display help for command\n\nComm</text><text x="20" y="275">ands:\n  create|add [options]      Create a saved MCP server\n  get [options]             Get one saved MCP server\n  revisions [o</text><text x="20" y="295">ptions]       List a saved server&#x27;s stored revisions, newest\n                            first: captures of its tools and server </text><text x="20" y="315">info\n  revision [options]        Read one stored revision of a saved server: its\n                            tools and server in</text><text x="20" y="335">fo\n  revision-diff [options]   Compare two stored revisions of a saved server:\n                            tools added, removed </text><text x="20" y="355">and changed, and server info\n                            changes\n  update [options]          Update one saved MCP server\n  dele</text><text x="20" y="375">te|remove [options]   Delete one saved MCP server\n  connect [options]         Connect an MCP server URL to a project, authorizing</text><text x="20" y="395">\n                            in a browser if needed\n  connect-status [options]  Check a connection request started by `server\n </text><text x="20" y="415">                           connect`\n  connect-cancel [options]  Cancel a pending connection request started by\n                 </text><text x="20" y="435">           `server connect`\n\n### Shared platform flags\n\n| Flag | Description |\n| - | - |\n| `--api-key &lt;key&gt;` | MCPJam `sk_` </text><text x="20" y="455">API key (overrides `MCPJAM_API_KEY`) |\n| `--api-url &lt;url&gt;` | MCPJam API base URL (defaults to `https://app.mcpjam.com/api/v1`) |\</text><text x="20" y="475">n| `--api-header &lt;header...&gt;` | Extra request header as `\&quot;Name: value\&quot;`, repeatable — for a deployment behind Cloudflare Access,</text><text x="20" y="495"> a WAF, or a corporate proxy. Also `MCPJAM_API_HEADERS`, one per line. Cannot set `authorization`, `idempotency-key`, or `content-</text><text x="20" y="515">type`. |\n\n### `cloud projects servers connect`\n\nStart a connection request for an MCP server URL. Discovery, browser consent, </text><text x="20" y="535">and validation happen asynchronously. When the server requires OAuth, the command prints a private authorization link and (by defa</text><text x="20" y="555">ult) opens it in a browser. The command then polls until the request reaches a terminal status.\n\n| Flag | Required | Description</text><text x="20" y="575"> |\n| - | - | - |\n| `--url &lt;url&gt;` | Yes | MCP server URL to connect |\n| `--project &lt;id-or-name&gt;` | No | Project name or ID |\n| </text><text x="20" y="595">`--server &lt;id&gt;` | No | Existing server ID, when the project has several on this URL |\n| `--name &lt;name&gt;` | No | Name for the serve</text><text x="20" y="615">r, if one is created |\n| `--reauthorize` | No | Force a fresh authorization |\n| `--no-browser` | No | Print the authorization li</text><text x="20" y="635">nk instead of opening it |\n| `--no-wait` | No | Return as soon as the request is created |\n\nWith `--no-wait`, the command print</text><text x="20" y="655">s the request id and exits immediately. The request continues in the cloud; use `connect-status` to check it and `connect-cancel` </text><text x="20" y="675">to stop it.\n\nEach pending request holds one of the account&#x27;s five concurrent-connection slots for up to an hour. If `connect` re</text><text x="20" y="695">ports `ACTIVE_REQUEST_LIMIT`, the error details include the ids of the open requests — cancel the abandoned ones with `connect-can</text><text x="20" y="715">cel` to free slots.\n\n### `cloud projects servers connect-status`\n1787:(`defaults.repetitions`, or `defaults.iterations` in `sch</text><text x="20" y="735">emaVersion: \&quot;2\&quot;`) is\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="755">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_16&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nimpo</text><text x="20" y="775">rt json\ns=json.load(open(&#x27;openapi.json&#x27;))\nfor name in [&#x27;ProjectServerCreateRequest&#x27;,&#x27;EvalSuiteFromFileRequest&#x27;]:\n print(name,js</text><text x="20" y="795">on.dumps(s[&#x27;components&#x27;][&#x27;schemas&#x27;][name],indent=2))\nPY\&quot;&quot;, &quot;aggregated_output&quot;: &quot;&quot;, &quot;exit_code&quot;: null, &quot;status&quot;: &quot;in_progress&quot;}}</text><text x="20" y="815">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_16&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nim</text><text x="20" y="835">port json\ns=json.load(open(&#x27;openapi.json&#x27;))\nfor name in [&#x27;ProjectServerCreateRequest&#x27;,&#x27;EvalSuiteFromFileRequest&#x27;]:\n print(name,</text><text x="20" y="855">json.dumps(s[&#x27;components&#x27;][&#x27;schemas&#x27;][name],indent=2))\nPY\&quot;&quot;, &quot;aggregated_output&quot;: &quot;ProjectServerCreateRequest {\n  \&quot;type\&quot;: \&quot;o</text><text x="20" y="875">bject\&quot;,\n  \&quot;description\&quot;: \&quot;Creates a saved server in the project. Server names are unique per workspace \\u2014 a clash respon</text><text x="20" y="895">ds `409`. Scope comes from the path: `projectId`, `serverId` and `workspaceId` are rejected in the body.\&quot;,\n  \&quot;required\&quot;: [\n  </text><text x="20" y="915">  \&quot;name\&quot;,\n    \&quot;enabled\&quot;,\n    \&quot;transportType\&quot;\n  ],\n  \&quot;additionalProperties\&quot;: false,\n  \&quot;properties\
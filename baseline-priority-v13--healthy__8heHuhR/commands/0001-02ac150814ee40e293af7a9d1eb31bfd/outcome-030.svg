,\n              \&quot;minimum\&quot;: 0,\n              \&quot;maximum\&quot;: 1\n   </text><text x="20" y="635">         },\n            \&quot;maxEvaluatorErrorRate\&quot;: {\n              \&quot;type\&quot;: \&quot;number\&quot;,\n              \&quot;minimum\&quot;: 0,\n       </text><text x="20" y="655">       \&quot;maximum\&quot;: 1\n            }\n          },\n          \&quot;additionalProperties\&quot;: false\n        }\n      },\n      \&quot;additi</text><text x="20" y="675">onalProperties\&quot;: false\n    },\n    \&quot;minIterations\&quot;: {\n      \&quot;type\&quot;: \&quot;integer\&quot;,\n      \&quot;minimum\&quot;: 1,\n      \&quot;maximum\&quot;:</text><text x="20" y="695"> 10\n    },\n    \&quot;defaultPassCriteria\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;The floor a run must clear, as </text><text x="20" y="715">a PERCENT in [0, 100] \\u2014 80 means 80%. `minimumPassRatePercent` is the canonical spelling (the unit is in the name); `minimum</text><text x="20" y="735">PassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGUATES THE UNIT: a value in (0, 1) is accepted on `min</text><text x="20" y="755">imumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluator can act on, and REJECTED on the bare `minimumPassR</text><text x="20" y="775">ate`, where `0.8` cannot be told apart from a fraction sent by mistake and would silently make the gate unfailable. Neither field </text><text x="20" y="795">ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suite/run floor is not.\&quot;,\n      \&quot;properties\&quot;: {\n   </text><text x="20" y="815">     \&quot;minimumPassRatePercent\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\n          \&quot;minimum\&quot;: 0,\n          \&quot;maximum\&quot;: 100,\n     </text><text x="20" y="835">     \&quot;description\&quot;: \&quot;A percent in [0, 100]. The whole range is usable, sub-1 values included \\u2014 the unit is in the field n</text><text x="20" y="855">ame, so nothing is ambiguous. Note that the GitHub Checks gate rounds the measured rate to an integer before comparing (to stay in</text><text x="20" y="875"> step with the eval UI), so a floor below 0.5 behaves there as if it were 0.5; the platform&#x27;s own verdict compares unrounded.\&quot;\n </text><text x="20" y="895">       },\n        \&quot;minimumPassRate\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\n          \&quot;minimum\&quot;: 0,\n          \&quot;maximum\&quot;: 100,</text><text x="20" y="915">\n          \&quot;deprecated\&quot;: true,\n          \&quot;description\&quot;: \&quot;Deprecated alias for `minimumPassRatePercent`, same unit. A value </text><text x="20" y="935">in (0, 1) is REJECTED here \\u2014 it reads as a fraction sent by mistake \\u2014 which is what the `not` below expresses. Use `mi</text><text x="20" y="955">nimumPassRatePercent` for a genuine sub-1% floor.\&quot;,\n          \&quot;not\&quot;: {\n            \&quot;exclusiveMinimum\&quot;: 0,\n            \&quot;ex</text><text x="20" y="975">clusiveMaximum\&quot;: 1\n          }\n        }\n      },\n      \&quot;oneOf\&quot;: [\n        {\n          \&quot;required\&quot;: [\n            \&quot;min</text><text x="20" y="995">imumPassRatePercent\&quot;\n          ]\n        },\n        {\n          \&quot;required\&quot;: [\n            \&quot;minimumPassRate\&quot;\n          ]</text><text x="20" y="1015">\n        }\n      ],\n      \&quot;additionalProperties\&quot;: false\n    }\n  }\n}\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="1035">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_17&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;curl -fsSL https://doc</text><text x="20" y="1055">s.mcpjam.com/inspector/evals.md -o inspector-evals.md &amp;&amp; rg -n &#x27;toolResult|toolCall|schemaVersion|deterministic|mode:&#x27; inspector-e</text><text x="20" y="1075">vals.md | head -60 &amp;&amp; npx mcpjam cloud projects servers --project project_fixture --format json &gt; saved-servers.json &amp;&amp; cat saved-</text><text x="20" y="1095">servers.json &amp;&amp; npx mcpjam cloud eval validate --help\&quot;&quot;, &quot;aggregated_output&quot;: &quot;&quot;, &quot;exit_code&quot;: null, &quot;status&quot;: &quot;in_progress&quot;}}</text><text x="20" y="1115">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_17&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;curl -fsSL https://d</text><text x="20" y="1135">ocs.mcpjam.com/inspector/evals.md -o inspector-evals.md &amp;&amp; rg -n &#x27;toolResult|toolCall|schemaVersion|deterministic|mode:&#x27; inspector</text><text x="20" y="1155">-evals.md | head -60 &amp;&amp; npx mcpjam cloud projects servers --project project_fixture --format json &gt; saved-servers.json &amp;&amp; cat save</text><text x="20" y="1175">d-servers.json &amp;&amp; npx mcpjam cloud eval validate --help\&quot;&quot;, &quot;aggregated_output&quot;: &quot;7:&gt; Author test cases for your MCP server, run t</text><text x="20" y="1195">hem across models, and gate pass/fail on deterministic assertions plus optional LLM-as-judge.\n434:(allowed pass-rate drop, determ</text><text x="20" y="1215">inistic regressions, p95 latency increase) are\n629:Below the pairing rows, the hero renders a **Findings** block. When findings h</text><text x="20" y="1235">ave been built for the run, it shows a lead finding with a carousel and a **See details** sheet. When no findings have been built </text><text x="20" y="1255">yet, a **Build findings** button appears instead — building is deterministic and does not call a model. When findings are unavaila</text><text x="20" y="1275">ble for the run, the hero falls back to a contract-derived \&quot;What broke / Next step\&quot; summary. For combined runs (multiple clients</text><text x="20" y="1295"> or models in one report), a **Findings for** selector scopes the findings block to one member run at a time. When an AI analysis </text><text x="20" y="1315">has run, its \&quot;N of M trials\&quot; count includes only trials that were each verified against their own recorded evidence; the **See d</text><text x="20" y="1335">etails** sheet discloses any proposed trials that did not show the mechanism or could not be verified. When recurrence history is </text><text x="20" y="1355">available, the sheet shows how many of the suite’s last 20 analyzed runs contained the same verified mechanism and when it first a</text></g></svg>
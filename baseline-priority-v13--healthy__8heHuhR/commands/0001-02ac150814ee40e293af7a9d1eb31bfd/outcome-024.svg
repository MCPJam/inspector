<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">02ac150814ee40e293af7a9d1eb31bfd — page 24</text><text x="20" y="75">uator errors and interrupted work are reported as skipped, never as failed assertions.\n\n## Exit codes\n\n| Code | Meaning |\n| -</text><text x="20" y="95"> | - |\n| `0` | The run completed and its decision passed |\n| `1` | The run completed and its decision failed — the only source o</text><text x="20" y="115">f `1` |\n| `2` | Invalid file or flags, an unsupported local capability, an import/approval refusal, or an invalid tool-policy den</text><text x="20" y="135">y name |\n| `3` | Missing or rejected model or platform credentials, including during execution |\n| `4` | Setup, connection, tool</text><text x="20" y="155"> catalog, binding, interpolation or billing failure, or a report that could not be written |\n| `5` | Inconclusive, interrupted, a</text><text x="20" y="175">n integrity failure, or no complete verdict |\n\n`Ctrl-C` stops the run cooperatively: completed evidence is kept, the report is w</text><text x="20" y="195">ritten, and the command exits `5` — an interrupted run is never presented as a completed release gate. A second `Ctrl-C` exits imm</text><text x="20" y="215">ediately.\n\n## From code\n\nThe same engine is `runSuiteFile` in `@mcpjam/sdk`. It takes explicit bindings and credentials — it r</text><text x="20" y="235">eads no files, environment or login store — and returns the decision and the report. See [runSuiteFile](https://docs.mcpjam.com/sd</text><text x="20" y="255">k/reference/run-suite-file.md).\n\n\nThis documentation is built and hosted on [Mintlify](https://mintlify.com), a developer docum</text><text x="20" y="275">entation platform.&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;c
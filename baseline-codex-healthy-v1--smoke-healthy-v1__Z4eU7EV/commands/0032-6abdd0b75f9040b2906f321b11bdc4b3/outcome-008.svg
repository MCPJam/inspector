<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6abdd0b75f9040b2906f321b11bdc4b3 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; run-eval.cjs &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;EOF&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">// Re-run the project&#x27;&quot;&#x27;&quot;&#x27;s existing arithmetic regression through the public API.</text><text x="20" y="195">const fs = require(&#x27;&quot;&#x27;&quot;&#x27;node:fs&#x27;&quot;&#x27;&quot;&#x27;);</text><text x="20" y="215">const {randomUUID} = require(&#x27;&quot;&#x27;&quot;&#x27;node:crypto&#x27;&quot;&#x27;&quot;&#x27;);</text><text x="20" y="235">const configured = process.env.MCPJAM_API_URL;</text><text x="20" y="255">if (!configured || !process.env.MCPJAM_API_KEY) throw Error(&#x27;&quot;&#x27;&quot;&#x27;Set MCPJAM_API_URL and MCPJAM_API_KEY&#x27;&quot;&#x27;&quot;&#x27;);</text><text x="20" y="275">const base = configured.replace(/\/$/, &#x27;&quot;&#x27;&quot;&#x27;&#x27;&quot;&#x27;&quot;&#x27;).replace(/\/api\/v1$/, &#x27;&quot;&#x27;&quot;&#x27;&#x27;&quot;&#x27;&quot;&#x27;) + &#x27;&quot;&#x27;&quot;&#x27;/api/v1&#x27;&quot;&#x27;&quot;&#x27;;</text><text x="20" y="295">const prefix = &#x27;&quot;&#x27;&quot;&#x27;/projects/project_fixture&#x27;&quot;&#x27;&quot;&#x27;;</text><text x="20" y="315">async function api(path, body) {</text><text x="20" y="335">  const response = await fetch(base + prefix + path, {</text><text x="20" y="355">    method: body ? &#x27;&quot;&#x27;&quot;&#x27;POST&#x27;&quot;&#x27;&quot;&#x27; : &#x27;&quot;&#x27;&quot;&#x27;GET&#x27;&quot;&#x27;&quot;&#x27;,</text><text x="20" y="375">    headers: {Authorization: `Bearer ${process.env.MCPJAM_API_KEY}`, &#x27;&quot;&#x27;&quot;&#x27;Content-Type&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;application/json&#x27;&quot;&#x27;&quot;&#x27;},</text><text x="20" y="395">    ...(body ? {body: JSON.stringify(body)} : {}),</text><text x="20" y="415">    signal: AbortSignal.timeout(15000)</text><text x="20" y="435">  });</text><text x="20" y="455">  const result = await response.json();</text><text x="20" y="475">  if (!response.ok || result.error || result.code) throw Error(JSON.stringify(result));</text><text x="20" y="495">  return result;</text><text x="20" y="515">}</text><text x="20" y="535">(async () =&gt; {</text><text x="20" y="555">  const launch = await api(&#x27;&quot;&#x27;&quot;&#x27;/eval-runs&#x27;&quot;&#x27;&quot;&#x27;, {suiteId:&#x27;&quot;&#x27;&quot;&#x27;suite_fixture&#x27;&quot;&#x27;&quot;&#x27;,serverIds:[&#x27;&quot;&#x27;&quot;&#x27;server_fixture&#x27;&quot;&#x27;&quot;&#x27;],idempotency</text><text x="20" y="575">Key:randomUUID()});</text><text x="20" y="595">  fs.writeFileSync(&#x27;&quot;&#x27;&quot;&#x27;rerun-launch.json&#x27;&quot;&#x27;&quot;&#x27;,JSON.stringify(launch,null,2));</text><text x="20" y="615">  for(let i=0;i&lt;20;i++) {</text><text x="20" y="635">    const status=await api(`/eval-runs/${encodeURIComponent(launch.runId)}`);</text><text x="20" y="655">    if([&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;failed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;cancelled&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;timed_out&#x27;&quot;&#x27;&quot;&#x27;].includes(status.status)) {</text><text x="20" y="675">      fs.writeFileSync(&#x27;&quot;&#x27;&quot;&#x27;rerun-status.json&#x27;&quot;&#x27;&quot;&#x27;,JSON.stringify(status,null,2));</text><text x="20" y="695">      const evidence=await api(`/eval-runs/${encodeURIComponent(launch.runId)}/iterations`);</text><text x="20" y="715">      fs.writeFileSync(&#x27;&quot;&#x27;&quot;&#x27;rerun-iterations.json&#x27;&quot;&#x27;&quot;&#x27;,JSON.stringify(evidence,null,2));</text><text x="20" y="735">      console.log(JSON.stringify(status,null,2));</text><text x="20" y="755">      process.exitCode=status.status===&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27; &amp;&amp; status.result===&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27; ? 0 : 1;</text><text x="20" y="775">      return;</text><text x="20" y="795">    }</text><text x="20" y="815">    await new Promise(resolve=&gt;setTimeout(resolve,500));</text><text x="20" y="835">  }</text><text x="20" y="855">  throw Error(&#x27;&quot;&#x27;&quot;&#x27;No terminal verdict within polling budget&#x27;&quot;&#x27;&quot;&#x27;);</text><text x="20" y="875">})().catch(error=&gt;{console.error(error.message);process.exitCode=2;});</text><text x="20" y="895">EOF</text><text x="20" y="915">cat &gt; README.md &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;EOF&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="935"># MCPJam arithmetic validation</text><text x="20" y="955"></text><text x="20" y="975">Installed `@mcpjam/cli` 6.2.2 with a package lock. Restore using `npm ci`.</text><text x="20" y="995">Public docs: https://docs.mcpjam.com/cli/overview and https://docs.mcpjam.com/reference/public-api . Downloaded docs and OpenAPI a</text><text x="20" y="1015">re included for reference. No product source or fixture internals were read.</text><text x="20" y="1035"></text><text x="20" y="1055">First useful result: `doctor.json` reports ready, Streamable HTTP, protocol 2025-11-25, one `add` tool. `first-result.json` record</text><text x="20" y="1075">s add(2,3) returning structuredContent.sum=5, isError=false.</text><text x="20" y="1095"></text><text x="20" y="1115">Reproduce the direct checks:</text><text x="20" y="1135"></text><text x="20" y="1155">```bash</text><text x="20" y="1175">npm ci</text><text x="20" y="1195">./node_modules/.bin/mcpjam server doctor --url http://fixture:8765/mcp --quiet --format json</text><text x="20" y="1215">./node_modules/.bin/mcpjam tools call --url http://fixture:8765/mcp --tool-name add --tool-args &#x27;&quot;&#x27;&quot;&#x27;{&quot;a&quot;:2,&quot;b&quot;:3}&#x27;&quot;&#x27;&quot;&#x27; --quiet --</text><text x="20" y="1235">format json</text><text x="20" y="1255">node run-eval.cjs</text><text x="20" y="1275">```</text><text x="20" y="1295"></text><text x="20" y="1315">Keep the configured MCPJAM_API_URL and MCPJAM_API_KEY in the environment; no secrets are saved here. The script normalizes the API</text><text x="20" y="1335"> prefix to /api/v1, launches the existing suite_fixture against server_fixture, polls the verdict, saves iteration evidence, and r</text><text x="20" y="1355">eturns nonzero on failure or absence of a verdict. Each invocation requests a fresh run.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="785"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b5ab851dff534b3ea54e3e81178e70d7 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;curl -fsSL https://docs.mcpjam.com/api-reference/eval-runs/create-an-eval-suite.md -o suite-create-docs.md; r</text><text x="20" y="175">g -n &#x27;&quot;&#x27;&quot;&#x27;Create an eval suite|Create eval cases&#x27;&quot;&#x27;&quot;&#x27; docs-index.txt; ./node_modules/.bin/mcpjam cloud eval create --help&#x27;</text><text x="20" y="195">curl: (22) The requested URL returned error: 404</text><text x="20" y="215">104:- [Create an eval suite (author-only, does not run)](https://docs.mcpjam.com/api-reference/eval-runs/create-an-eval-suite-auth</text><text x="20" y="235">or-only-does-not-run.md): Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **synchronousl</text><text x="20" y="255">y**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returned `suite</text><text x="20" y="275">Id`).</text><text x="20" y="295">Usage: mcpjam cloud eval create [options]</text><text x="20" y="315"></text><text x="20" y="335">Create a runnable eval suite from authored test cases (does not run it)</text><text x="20" y="355"></text><text x="20" y="375">Options:</text><text x="20" y="395">  --project &lt;id-or-name&gt;    Project name or ID (defaults to the most recently</text><text x="20" y="415">                            updated project)</text><text x="20" y="435">  --file &lt;path&gt;             Path to a create-API JSON body (or - for stdin). A</text><text x="20" y="455">                            versioned suite file belongs on `eval run --file`</text><text x="20" y="475">  --json &lt;json&gt;             Inline suite definition JSON (or @file, or - for</text><text x="20" y="495">                            stdin)</text><text x="20" y="515">  --name &lt;name&gt;             Suite name (overrides the file)</text><text x="20" y="535">  --model &lt;model&gt;           Suite-level default model (overrides the file)</text><text x="20" y="555">  --provider &lt;provider&gt;     Suite-level default provider (overrides the file;</text><text x="20" y="575">                            needed for bare/custom model ids)</text><text x="20" y="595">  --server &lt;id-or-name...&gt;  Project HTTP server names or IDs (overrides the</text><text x="20" y="615">                            file)</text><text x="20" y="635">  --client &lt;id-or-name...&gt;  Clients to attach the suite to, by name or ID</text><text x="20" y="655">                            (overrides the file). Without one the suite lists no</text><text x="20" y="675">                            client and `eval run --client` has nothing to select</text><text x="20" y="695">  --host &lt;id-or-name...&gt;    Deprecated alias for --client</text><text x="20" y="715">  -h, --help                display help for command</text><text x="20" y="735"></text><text x="20" y="755">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="405"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.08585095405578613s — page 1</text><text x="20" y="75">/projects/{projectId}/eval-suites {&quot;operationId&quot;:&quot;createEvalSuite&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval suite (author-on</text><text x="20" y="95">ly, does not run)&quot;,&quot;description&quot;:&quot;Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **sync</text><text x="20" y="115">hronously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returne</text><text x="20" y="135">d `suiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a </text><text x="20" y="155">`runId`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level defaul</text><text x="20" y="175">t `model` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/mod</text><text x="20" y="195">el` id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGue</text><text x="20" y="215">st callers are denied (suite creation is a write).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalVocabularyHeader&quot;},{&quot;$ref&quot;:</text><text x="20" y="235">&quot;#/components/parameters/projectId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components</text><text x="20" y="255">/schemas/EvalSuiteCreateRequest&quot;},&quot;example&quot;:{&quot;name&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;tests</text><text x="20" y="275">&quot;:[{&quot;title&quot;:&quot;lists files&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;List the files in the project root.&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;a</text><text x="20" y="295">ssert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;list_files&quot;,&quot;args&quot;:{&quot;args&quot;:{}}}}]}]}}}},&quot;responses&quot;:{&quot;201&quot;:{&quot;description&quot;:</text><text x="20" y="315">&quot;The suite was created.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalSuiteCreated&quot;}}}},&quot;400&quot;:{&quot;$ref&quot;</text><text x="20" y="335">:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/respon</text><text x="20" y="355">ses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;</text><text x="20" y="375">:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnreachable&quot;}}}</text></g></svg>
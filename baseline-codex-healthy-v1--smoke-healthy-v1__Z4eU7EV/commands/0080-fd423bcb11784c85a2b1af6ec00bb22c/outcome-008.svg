<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="865"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">fd423bcb11784c85a2b1af6ec00bb22c — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;node - &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;JS&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">const s=require(&#x27;&quot;&#x27;&quot;&#x27;./openapi.json&#x27;&quot;&#x27;&quot;&#x27;);for(const p of [&#x27;&quot;&#x27;&quot;&#x27;/projects/{projectId}/eval-suites&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;/projects/{projectId}/e</text><text x="20" y="195">val-suites/{suiteId}/cases&#x27;&quot;&#x27;&quot;&#x27;])console.log(p,JSON.stringify(s.paths[p]?.post));</text><text x="20" y="215">JS&#x27;</text><text x="20" y="235">/projects/{projectId}/eval-suites {&quot;operationId&quot;:&quot;createEvalSuite&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval suite (author-on</text><text x="20" y="255">ly, does not run)&quot;,&quot;description&quot;:&quot;Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **sync</text><text x="20" y="275">hronously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returne</text><text x="20" y="295">d `suiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a </text><text x="20" y="315">`runId`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level defaul</text><text x="20" y="335">t `model` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/mod</text><text x="20" y="355">el` id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGue</text><text x="20" y="375">st callers are denied (suite creation is a write).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalVocabularyHeader&quot;},{&quot;$ref&quot;:</text><text x="20" y="395">&quot;#/components/parameters/projectId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components</text><text x="20" y="415">/schemas/EvalSuiteCreateRequest&quot;},&quot;example&quot;:{&quot;name&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;tests</text><text x="20" y="435">&quot;:[{&quot;title&quot;:&quot;lists files&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;List the files in the project root.&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;a</text><text x="20" y="455">ssert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;list_files&quot;,&quot;args&quot;:{&quot;args&quot;:{}}}}]}]}}}},&quot;responses&quot;:{&quot;201&quot;:{&quot;description&quot;:</text><text x="20" y="475">&quot;The suite was created.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalSuiteCreated&quot;}}}},&quot;400&quot;:{&quot;$ref&quot;</text><text x="20" y="495">:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/respon</text><text x="20" y="515">ses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;</text><text x="20" y="535">:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnreachable&quot;}}}</text><text x="20" y="555">/projects/{projectId}/eval-suites/{suiteId}/cases {&quot;operationId&quot;:&quot;createEvalCase&quot;,&quot;x-mcpjam-eval-vocabulary&quot;:{&quot;2&quot;:{&quot;requestBody&quot;:&quot;</text><text x="20" y="575">EvalCaseCreateRequestV2&quot;,&quot;response&quot;:&quot;EvalCaseV2&quot;}},&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval case&quot;,&quot;description&quot;:&quot;Adds one ca</text><text x="20" y="595">se to the suite. Both `title` and a non-empty `steps` array are required — `steps` is optional on the shared case shape so PATCH c</text><text x="20" y="615">an be partial, but a case persisted without executable steps could never run. When `models` is omitted the suite&#x27;s configured mode</text><text x="20" y="635">l is used.&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalVocabularyHeader&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$</text><text x="20" y="655">ref&quot;:&quot;#/components/parameters/suiteId&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/declaredSuiteIdQuery&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;c</text><text x="20" y="675">ontent&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalCaseCreateRequest&quot;},&quot;example&quot;:{&quot;title&quot;:&quot;lists files&quot;,&quot;step</text><text x="20" y="695">s&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;List the files in the project root.&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;assert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;too</text><text x="20" y="715">lCalledWith&quot;,&quot;toolName&quot;:&quot;list_files&quot;,&quot;args&quot;:{&quot;args&quot;:{}}}}]}}}},&quot;responses&quot;:{&quot;201&quot;:{&quot;description&quot;:&quot;The created case.&quot;,&quot;content&quot;:{&quot;a</text><text x="20" y="735">pplication/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalCase&quot;}}}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ValidationError&quot;},&quot;40</text><text x="20" y="755">1&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/re</text><text x="20" y="775">sponses/NotFound&quot;},&quot;409&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Conflict&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$r</text><text x="20" y="795">ef&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnreachable&quot;}}}</text><text x="20" y="815"></text><text x="20" y="835">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
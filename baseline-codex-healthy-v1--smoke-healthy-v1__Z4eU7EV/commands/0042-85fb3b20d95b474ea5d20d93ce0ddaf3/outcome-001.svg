<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="445"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">85fb3b20d95b474ea5d20d93ce0ddaf3 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; api-proxy.cjs &lt;&lt;&#x27;EOF&#x27;</text><text x="20" y="95">// Local forwarding adapter for SDK loopback HTTP development support.</text><text x="20" y="115">const http = require(&#x27;node:http&#x27;);</text><text x="20" y="135">const upstream = new URL(process.env.MCPJAM_API_URL);</text><text x="20" y="155">http.createServer((req, res) =&gt; {</text><text x="20" y="175">  const target = new URL(req.url, upstream.origin);</text><text x="20" y="195">  const out = http.request(target, {method: req.method, headers: {...req.headers, host: target.host}}, reply =&gt; {</text><text x="20" y="215">    res.writeHead(reply.statusCode, reply.headers);</text><text x="20" y="235">    reply.pipe(res);</text><text x="20" y="255">  });</text><text x="20" y="275">  out.on(&#x27;error&#x27;, () =&gt; { res.writeHead(502); res.end(&#x27;Upstream unavailable&#x27;); });</text><text x="20" y="295">  req.pipe(out);</text><text x="20" y="315">}).listen(8766, &#x27;127.0.0.1&#x27;, () =&gt; console.log(&#x27;Local API adapter listening on 127.0.0.1:8766&#x27;));</text><text x="20" y="335">EOF</text><text x="20" y="355">node api-proxy.cjs</text><text x="20" y="375">Local API adapter listening on 127.0.0.1:8766</text><text x="20" y="395"></text><text x="20" y="415">[exit=unrecorded; signal=None; timeout=unrecorded]</text></g></svg>
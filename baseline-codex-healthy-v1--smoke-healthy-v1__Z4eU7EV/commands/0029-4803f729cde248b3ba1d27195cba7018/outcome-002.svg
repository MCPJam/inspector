d (`400`): nothing</text><text x="20" y="515"> ever applied it. Save an effort as `models[].selection.settings.reasoningEffort` instead.&quot;,</text><text x="20" y="535">      &quot;additionalProperties&quot;: true</text><text x="20" y="555">    },</text><text x="20" y="575">    &quot;scenario&quot;: {</text><text x="20" y="595">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="615">    },</text><text x="20" y="635">    &quot;intent&quot;: {</text><text x="20" y="655">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="675">      &quot;minLength&quot;: 1,</text><text x="20" y="695">      &quot;maxLength&quot;: 64,</text><text x="20" y="715">      &quot;description&quot;: &quot;Optional authored analytics grouping label.&quot;</text><text x="20" y="735">    },</text><text x="20" y="755">    &quot;matchOptions&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="795">      &quot;description&quot;: &quot;Per-case tool-call matching override, in either vocabulary: public (`toolCallOrder: any|in-order|exact`, `ex</text><text x="20" y="815">traToolCalls`, `arguments`) or internal (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), never </text><text x="20" y="835">both in one object.&quot;,</text><text x="20" y="855">      &quot;additionalProperties&quot;: true</text><text x="20" y="875">    },</text><text x="20" y="895">    &quot;predicates&quot;: {</text><text x="20" y="915">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="935">      &quot;deprecated&quot;: true,</text><text x="20" y="955">      &quot;description&quot;: &quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here all along and never written </text><text x="20" y="975">down, passing only because this schema allowed unknown properties; documented rather than removed so no caller already sending it </text><text x="20" y="995">breaks. Send one or the other,
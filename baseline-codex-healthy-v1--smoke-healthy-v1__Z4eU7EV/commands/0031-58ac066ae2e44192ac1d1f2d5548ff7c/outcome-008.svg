;</text><text x="20" y="1035">        ]</text><text x="20" y="1055">      }</text><text x="20" y="1075">    }</text><text x="20" y="1095">  ],</text><text x="20" y="1115">  &quot;properties&quot;: {</text><text x="20" y="1135">    &quot;title&quot;: {</text><text x="20" y="1155">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1175">    },</text><text x="20" y="1195">    &quot;steps&quot;: {</text><text x="20" y="1215">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1235">      &quot;minItems&quot;: 1,</text><text x="20" y="1255">      &quot;description&quot;: &quot;Ordered test steps. The first `prompt` step is the case query; `toolCalledWith` asserts are the expected too</text><text x="20" y="1275">l calls; a single model-free `toolCall` step is a render-check.&quot;,</text><text x="20" y="1295">      &quot;items&quot;: {</text><text x="20" y="1315">        &quot;$ref&quot;: &quot;#/components/schemas/EvalTestStep&quot;</text><text x="20" y="1335">      }</text><text x="20" y="1355">    },</text></g></svg>
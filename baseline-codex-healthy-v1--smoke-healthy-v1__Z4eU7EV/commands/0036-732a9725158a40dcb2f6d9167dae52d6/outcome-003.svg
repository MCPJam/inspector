<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">732a9725158a40dcb2f6d9167dae52d6 — page 3</text><text x="20" y="75">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="95">      &quot;description&quot;: &quot;Stored encrypted; never returned. Reads expose only `hasClientSecret`.&quot;</text><text x="20" y="115">    }</text><text x="20" y="135">  }</text><text x="20" y="155">}</text><text x="20" y="175">EvalRunCreateRequest {</text><text x="20" y="195">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="215">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="235">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone — without a `suiteId` or a `suiteName` — are rejec</text><text x="20" y="255">ted with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite that has it </text><text x="20" y="275">attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite could never </text><text x="20" y="295">be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="315">  &quot;anyOf&quot;: [</text><text x="20" y="335">    {</text><text x="20" y="355">      &quot;required&quot;: [</text><text x="20" y="375">        &quot;suiteId&quot;</text><text x="20" y="395">      ]</text><text x="20" y="415">    },</text><text x="20" y="435">    {</text><text x="20" y="455">      &quot;required&quot;: [</text><text x="20" y="475">        &quot;suiteName&quot;,</text><text x="20" y="495">        &quot;tests&quot;,</text><text x="20" y="515">        &quot;serverIds&quot;</text><text x="20" y="535">      ],</text><text x="20" y="555">      &quot;properties&quot;: {</text><text x="20" y="575">        &quot;tests&quot;: {</text><text x="20" y="595">          &quot;minItems&quot;: 1</text><text x="20" y="615">        }</text><text x="20" y="635">      }</text><text x="20" y="655">    }</text><text x="20" y="675">  ],</text><text x="20" y="695">  &quot;properties&quot;: {</text><text x="20" y="715">    &quot;suiteId&quot;: {</text><text x="20" y="735">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="755">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="775">    },</text><text x="20" y="795">    &quot;hosts&quot;: {</text><text x="20" y="815">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="835">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="855">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text><text x="20" y="875">      &quot;items&quot;: {</text><text x="20" y="895">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="915">        &quot;required&quot;: [</text><text x="20" y="935">          &quot;host&quot;</text><text x="20" y="955">        ],</text><text x="20" y="975">        &quot;properties&quot;: {</text><text x="20" y="995">          &quot;host&quot;: {</text><text x="20" y="1015">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1035">            &quot;minLength&quot;: 1</text><text x="20" y="1055">          },</text><text x="20" y="1075">          &quot;servers&quot;: {</text><text x="20" y="1095">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1115">            &quot;items&quot;: {</text><text x="20" y="1135">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1155">              &quot;minLength&quot;: 1</text><text x="20" y="1175">            }</text><text x="20" y="1195">          }</text><text x="20" y="1215">        }</text><text x="20" y="1235">      }</text><text x="20" y="1255">    },</text><text x="20" y="1275">    &quot;suiteName&quot;: {</text><text x="20" y="1295">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1315">      &quot;description&quot;: &quot;Name for a new suite. Required (non-empty) when no `suiteId` is given.&quot;</text><text x="20" y="1335">    },</text><text x="20" y="1355">    &quot;suiteDescription&quot;: {</text></g></svg>
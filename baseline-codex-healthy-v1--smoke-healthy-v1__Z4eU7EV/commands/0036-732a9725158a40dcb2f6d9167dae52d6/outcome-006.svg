<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">732a9725158a40dcb2f6d9167dae52d6 — page 6</text><text x="20" y="75">      &quot;description&quot;: &quot;One-off tool-call match options for this run only, layered over suite defaults and per-case overrides. Does </text><text x="20" y="95">NOT mutate the suite or its cases.\n\nAccepts EITHER the public vocabulary (`toolCallOrder: any|in-order|exact`, `extraToolCalls`,</text><text x="20" y="115"> `arguments`) or the internal one (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`). The two are </text><text x="20" y="135">disjoint, so a body can only be one of them; public bodies are normalized server-side.&quot;,</text><text x="20" y="155">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="175">      &quot;properties&quot;: {</text><text x="20" y="195">        &quot;toolCallOrder&quot;: {</text><text x="20" y="215">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="235">          &quot;description&quot;: &quot;Public: `any` (order ignored) | `in-order` (expected calls appear in order, extras allowed) | `exact` (e</text><text x="20" y="255">xact sequence). Internal equivalents: `ignore` | `superset` | `strict`.&quot;,</text><text x="20" y="275">          &quot;enum&quot;: [</text><text x="20" y="295">            &quot;any&quot;,</text><text x="20" y="315">            &quot;in-order&quot;,</text><text x="20" y="335">            &quot;exact&quot;,</text><text x="20" y="355">            &quot;ignore&quot;,</text><text x="20" y="375">            &quot;superset&quot;,</text><text x="20" y="395">            &quot;strict&quot;</text><text x="20" y="415">          ]</text><text x="20" y="435">        },</text><text x="20" y="455">        &quot;extraToolCalls&quot;: {</text><text x="20" y="475">          &quot;description&quot;: &quot;Public form: `\&quot;unlimited\&quot;`, or a maximum count of unexpected extra tool calls.&quot;,</text><text x="20" y="495">          &quot;oneOf&quot;: [</text><text x="20" y="515">            {</text><text x="20" y="535">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="555">              &quot;enum&quot;: [</text><text x="20" y="575">                &quot;unlimited&quot;</text><text x="20" y="595">              ]</text><text x="20" y="615">            },</text><text x="20" y="635">            {</text><text x="20" y="655">              &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="675">              &quot;minimum&quot;: 0</text><text x="20" y="695">            }</text><text x="20" y="715">          ]</text><text x="20" y="735">        },</text><text x="20" y="755">        &quot;arguments&quot;: {</text><text x="20" y="775">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="795">          &quot;description&quot;: &quot;Public form of argument-comparison strictness.&quot;,</text><text x="20" y="815">          &quot;enum&quot;: [</text><text x="20" y="835">            &quot;ignore&quot;,</text><text x="20" y="855">            &quot;partial&quot;,</text><text x="20" y="875">            &quot;exact&quot;</text><text x="20" y="895">          ]</text><text x="20" y="915">        },</text><text x="20" y="935">        &quot;maxExtraToolCalls&quot;: {</text><text x="20" y="955">          &quot;description&quot;: &quot;Internal form of `extraToolCalls`: `null` is unlimited.&quot;,</text><text x="20" y="975">          &quot;type&quot;: [</text><text x="20" y="995">            &quot;integer&quot;,</text><text x="20" y="1015">            &quot;null&quot;</text><text x="20" y="1035">          ],</text><text x="20" y="1055">          &quot;minimum&quot;: 0</text><text x="20" y="1075">        },</text><text x="20" y="1095">        &quot;argumentMatching&quot;: {</text><text x="20" y="1115">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1135">          &quot;description&quot;: &quot;Internal form of `arguments`.&quot;,</text><text x="20" y="1155">          &quot;enum&quot;: [</text><text x="20" y="1175">            &quot;ignore&quot;,</text><text x="20" y="1195">            &quot;partial&quot;,</text><text x="20" y="1215">            &quot;exact&quot;</text><text x="20" y="1235">          ]</text><text x="20" y="1255">        }</text><text x="20" y="1275">      }</text><text x="20" y="1295">    },</text><text x="20" y="1315">    &quot;skillsOverride&quot;: {</text><text x="20" y="1335">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1355">      &quot;enum&quot;: [</text></g></svg>
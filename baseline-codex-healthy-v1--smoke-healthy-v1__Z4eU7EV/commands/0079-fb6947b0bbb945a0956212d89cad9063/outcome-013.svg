<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">fb6947b0bbb945a0956212d89cad9063 — page 13</text><text x="20" y="75">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="95">      }</text><text x="20" y="115">    },</text><text x="20" y="135">    &quot;matchOptionsOverride&quot;: {</text><text x="20" y="155">      &quot;description&quot;: &quot;One-off tool-call match options for this run only, layered over suite defaults and per-case overrides. Does </text><text x="20" y="175">NOT mutate the suite or its cases.\n\nAccepts EITHER the public vocabulary (`toolCallOrder: any|in-order|exact`, `extraToolCalls`,</text><text x="20" y="195"> `arguments`) or the internal one (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`). The two are </text><text x="20" y="215">disjoint, so a body can only be one of them; public bodies are normalized server-side.&quot;,</text><text x="20" y="235">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="255">      &quot;properties&quot;: {</text><text x="20" y="275">        &quot;toolCallOrder&quot;: {</text><text x="20" y="295">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="315">          &quot;description&quot;: &quot;Public: `any` (order ignored) | `in-order` (expected calls appear in order, extras allowed) | `exact` (e</text><text x="20" y="335">xact sequence). Internal equivalents: `ignore` | `superset` | `strict`.&quot;,</text><text x="20" y="355">          &quot;enum&quot;: [</text><text x="20" y="375">            &quot;any&quot;,</text><text x="20" y="395">            &quot;in-order&quot;,</text><text x="20" y="415">            &quot;exact&quot;,</text><text x="20" y="435">            &quot;ignore&quot;,</text><text x="20" y="455">            &quot;superset&quot;,</text><text x="20" y="475">            &quot;strict&quot;</text><text x="20" y="495">          ]</text><text x="20" y="515">        },</text><text x="20" y="535">        &quot;extraToolCalls&quot;: {</text><text x="20" y="555">          &quot;description&quot;: &quot;Public form: `\&quot;unlimited\&quot;`, or a maximum count of unexpected extra tool calls.&quot;,</text><text x="20" y="575">          &quot;oneOf&quot;: [</text><text x="20" y="595">            {</text><text x="20" y="615">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="635">              &quot;enum&quot;: [</text><text x="20" y="655">                &quot;unlimited&quot;</text><text x="20" y="675">              ]</text><text x="20" y="695">            },</text><text x="20" y="715">            {</text><text x="20" y="735">              &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="755">              &quot;minimum&quot;: 0</text><text x="20" y="775">            }</text><text x="20" y="795">          ]</text><text x="20" y="815">        },</text><text x="20" y="835">        &quot;arguments&quot;: {</text><text x="20" y="855">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="875">          &quot;description&quot;: &quot;Public form of argument-comparison strictness.&quot;,</text><text x="20" y="895">          &quot;enum&quot;: [</text><text x="20" y="915">            &quot;ignore&quot;,</text><text x="20" y="935">            &quot;partial&quot;,</text><text x="20" y="955">            &quot;exact&quot;</text><text x="20" y="975">          ]</text><text x="20" y="995">        },</text><text x="20" y="1015">        &quot;maxExtraToolCalls&quot;: {</text><text x="20" y="1035">          &quot;description&quot;: &quot;Internal form of `extraToolCalls`: `null` is unlimited.&quot;,</text><text x="20" y="1055">          &quot;type&quot;: [</text><text x="20" y="1075">            &quot;integer&quot;,</text><text x="20" y="1095">            &quot;null&quot;</text><text x="20" y="1115">          ],</text><text x="20" y="1135">          &quot;minimum&quot;: 0</text><text x="20" y="1155">        },</text><text x="20" y="1175">        &quot;argumentMatching&quot;: {</text><text x="20" y="1195">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1215">          &quot;description&quot;: &quot;Internal form of `arguments`.&quot;,</text><text x="20" y="1235">          &quot;enum&quot;: [</text><text x="20" y="1255">            &quot;ignore&quot;,</text><text x="20" y="1275">            &quot;partial&quot;,</text><text x="20" y="1295">            &quot;exact&quot;</text><text x="20" y="1315">          ]</text><text x="20" y="1335">        }</text><text x="20" y="1355">      }</text></g></svg>
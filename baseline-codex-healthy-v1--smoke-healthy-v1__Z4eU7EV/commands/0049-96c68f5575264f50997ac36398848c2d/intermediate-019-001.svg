<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="785"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +99.10943222045898s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_23&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;node - &lt;&lt;&#x27;JS&#x27;\nconst</text><text x="20" y="95"> s=require(&#x27;./openapi.json&#x27;);for(const p of [&#x27;/projects/{projectId}/eval-suites&#x27;,&#x27;/projects/{projectId}/eval-suites/{suiteId}/case</text><text x="20" y="115">s&#x27;])console.log(p,JSON.stringify(s.paths[p]?.post));\nJS\&quot;&quot;, &quot;aggregated_output&quot;: &quot;/projects/{projectId}/eval-suites {\&quot;operationI</text><text x="20" y="135">d\&quot;:\&quot;createEvalSuite\&quot;,\&quot;tags\&quot;:[\&quot;Eval runs\&quot;],\&quot;summary\&quot;:\&quot;Create an eval suite (author-only, does not run)\&quot;,\&quot;description\&quot;:</text><text x="20" y="155">\&quot;Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **synchronously**, WITHOUT executing a</text><text x="20" y="175">nything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returned `suiteId`).\\n\\nThis is disti</text><text x="20" y="195">nct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a `runId`. There is no concurren</text><text x="20" y="215">cy cap here (no run is started).\\n\\nThe body uses an ergonomic authoring shape: a suite-level default `model` (and optional `pro</text><text x="20" y="235">vider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/model` id when neither is suppl</text><text x="20" y="255">ied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\\n\\nGuest callers are denied (sui</text><text x="20" y="275">te creation is a write).\&quot;,\&quot;parameters\&quot;:[{\&quot;$ref\&quot;:\&quot;#/components/parameters/evalVocabularyHeader\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/pa</text><text x="20" y="295">rameters/projectId\&quot;}],\&quot;requestBody\&quot;:{\&quot;required\&quot;:true,\&quot;content\&quot;:{\&quot;application/json\&quot;:{\&quot;schema\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/s</text><text x="20" y="315">chemas/EvalSuiteCreateRequest\&quot;},\&quot;example\&quot;:{\&quot;name\&quot;:\&quot;smoke\&quot;,\&quot;serverIds\&quot;:[\&quot;srv_abc123\&quot;],\&quot;model\&quot;:\&quot;anthropic/claude-haiku</text><text x="20" y="335">-4.5\&quot;,\&quot;tests\&quot;:[{\&quot;title\&quot;:\&quot;lists files\&quot;,\&quot;steps\&quot;:[{\&quot;id\&quot;:\&quot;s1\&quot;,\&quot;kind\&quot;:\&quot;prompt\&quot;,\&quot;prompt\&quot;:\&quot;List the files in the proj</text><text x="20" y="355">ect root.\&quot;},{\&quot;id\&quot;:\&quot;s2\&quot;,\&quot;kind\&quot;:\&quot;assert\&quot;,\&quot;assertion\&quot;:{\&quot;type\&quot;:\&quot;toolCalledWith\&quot;,\&quot;toolName\&quot;:\&quot;list_files\&quot;,\&quot;args\&quot;:{\</text><text x="20" y="375">&quot;args\&quot;:{}}}}]}]}}}},\&quot;responses\&quot;:{\&quot;201\&quot;:{\&quot;description\&quot;:\&quot;The suite was created.\&quot;,\&quot;content\&quot;:{\&quot;application/json\&quot;:{\&quot;schem</text><text x="20" y="395">a\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/schemas/EvalSuiteCreated\&quot;}}}},\&quot;400\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/ValidationError\&quot;},\&quot;401\&quot;:</text><text x="20" y="415">{\&quot;$ref\&quot;:\&quot;#/components/responses/Unauthorized\&quot;},\&quot;403\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Forbidden\&quot;},\&quot;404\&quot;:{\&quot;$ref\&quot;:\&quo
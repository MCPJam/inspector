<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">96c68f5575264f50997ac36398848c2d — page 27</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_8&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;rg -n &#x27;toolCall|toolR</text><text x="20" y="95">esultContains|schemaVersion&#x27; docs-index.txt | head -15; tail -8 install.log; node --version; rg -n &#x27;servers.*POST|Create.*server|c</text><text x="20" y="115">onnect.*server&#x27; api-docs.md | head -12\&quot;&quot;, &quot;aggregated_output&quot;: &quot;\nadded 153 packages in 13s\n\n39 packages are looking for fundin</text><text x="20" y="135">g\n  run `npm fund` for details\nv24.22.1\n43:  MCPJam connects to and talks to your MCP servers. Edits are compare-and-set:\n142:</text><text x="20" y="155">**Requests.** Operations on servers are `POST` with a JSON body (most accept\n184:| `FORBIDDEN` | 403 | Key is valid but not allow</text><text x="20" y="175">ed to do this — or the **target MCP server** rejected the credentials MCPJam presented (retrying with a different MCPJam key will </text><text x="20" y="195">not help; reconnect or re-authorize the server) |\n190:| `SERVER_UNREACHABLE` | 502 | Could not connect to the target MCP server |</text><text x="20" y="215">\n303:| `POST .../eval-runs` | Create a run from a `suiteId` (rerun; `serverIds` optional — defaults to the suite&#x27;s saved servers)</text><text x="20" y="235"> or `suiteName` + inline `tests` + `serverIds` (new suite). `environmentId` (requires `suiteId`) runs against one of the suite&#x27;s a</text><text x="20" y="255">ttached environments instead. Responds `202` + `runId` |\n332:| `POST .../agent` | Run ONE assistant turn over a `messages` histor</text><text x="20" y="275">y (`{role: \&quot;user\&quot;\\|\&quot;assistant\&quot;, content}` items, max 50 messages × 8 KB each, 96 KB total). The model is pinned server-side a</text><text x="20" y="295">nd billed to the project. The turn can read project servers/suites/runs and **create eval suites**; it can NOT start runs — kick t</text><text x="20" y="315">hose off yourself with `POST .../eval-runs`. Responds synchronously with `reply`, the `toolCalls` it made, `createdResources` (ids</text><text x="20" y="335"> + app links), and token `usage`. Capped at 4 concurrent turns per organization and \\~90 s wall clock. **Not idempotent — never b</text><text x="20" y="355">lind-retry**: dedupe on your own trigger identity, and on an error response check `details.createdResources` (and, after a lost re</text><text x="20" y="375">sponse, list suites) before retrying, or you&#x27;ll create duplicates |\n802:configured, connecting the suite&#x27;s saved server selection</text><text x="20" y="395"> (the `202` response\n840:When creating a new inline suite, `POST .../eval-runs` also accepts `hosts: [{ host: \&quot;Claude\&quot;, servers</text><text x="20" y="415">: [\&quot;my-server\&quot;] }]`, using the same host name or ID and optional server selection as `POST .../eval-suites`. A single host is se</text><text x="20" y="435">lected for the run automatically. With multiple attachments, use `namedHostId` to select the run&#x27;s client. For an existing suite, </text><text x="20" y="455">update its attachments first. If `hosts` is omitted, the backend supplies the project&#x27;s default client.\n&quot;, &quot;exit_code&quot;: 0, &quot;statu</text><text x="20" y="475">s&quot;: &quot;completed&quot;}}</text><text x="20" y="495">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_9&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;curl -fsSL https:
s\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: </text><text x="20" y="875">\&quot;Per-case CHECK gate — the grading rules this case is scored against. `mode` says how they combine with the suite&#x27;s own: `inherit</text><text x="20" y="895">` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field, same shape and same name as `c</text><text x="20" y="915">hecks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word for one concept. Send this or t</text><text x="20" y="935">he deprecated `predicates`, never both.\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;mode\&quot;: {\n          \&quot;type\&quot;: \&quot;string\&quot;,\n       </text><text x="20" y="955">   \&quot;enum\&quot;: [\n            \&quot;inherit\&quot;,\n            \&quot;replace\&quot;,\n            \&quot;extend\&quot;\n          ]\n        },\n        \&quot;lis</text><text x="20" y="975">t\&quot;: {\n          \&quot;type\&quot;: \&quot;array\&quot;,\n          \&quot;items\&quot;: {\n            \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalAssertion\&quot;\n    </text><text x="20" y="995">      }\n        }\n      }\n    },\n    \&quot;suppressedSuiteStandardCheckIds\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/schemas/Suppressed</text><text x="20" y="1015">SuiteStandardCheckIds\&quot;,\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n      }\n    }\n  },\n  \&quot;</text><text x="20" y="1035">additionalProperties\&quot;: false\n}\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text></g></svg>
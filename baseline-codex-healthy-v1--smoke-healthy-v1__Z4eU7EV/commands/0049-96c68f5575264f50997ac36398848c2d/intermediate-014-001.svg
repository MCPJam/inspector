  }\n  }\n}\nEvalRunCreateRequest {\n  \&quot;type\&quot;: \&quot;object\</text><text x="20" y="615">&quot;,\n  \&quot;description\&quot;: \&quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `su</text><text x="20" y="635">iteName` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone — without a `suiteId` or a `suiteName` — ar</text><text x="20" y="655">e rejected with `VALIDATION_ERROR`.\\n\\n`environmentId` requires `suiteId`: an environment is launchable only through a suite tha</text><text x="20" y="675">t has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite cou</text><text x="20" y="695">ld never be satisfied. `environmentId` and `serverIds` are mutually exclusive.\&quot;,\n  \&quot;anyOf\&quot;: [\n    {\n      \&quot;required\&quot;: [\n </text><text x="20" y="715">       \&quot;suiteId\&quot;\n      ]\n    },\n    {\n      \&quot;required\&quot;: [\n        \&quot;suiteName\&quot;,\n        \&quot;tests\&quot;,\n        \&quot;serverIds</text><text x="20" y="735">\&quot;\n      ],\n      \&quot;properties\&quot;: {\n        \&quot;tests\&quot;: {\n          \&quot;minItems\&quot;: 1\n        }\n      }\n    }\n  ],\n  \&quot;prope</text><text x="20" y="755">rties\&quot;: {\n    \&quot;suiteId\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Existing suite to rerun. A bare `suiteId` wi</text><text x="20" y="775">th no `tests` reruns the suite exactly as configured.\&quot;\n    },\n    \&quot;hosts\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;description</text><text x="20" y="795">\&quot;: \&quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects bound server nam</text><text x="20" y="815">es or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.\&quot;,\n      \&quot;items</text><text x="20" y="835">\&quot;: {\n        \&quot;type\&quot;: \&quot;object\&quot;,\n        \&quot;required\&quot;: [\n          \&quot;host\&quot;\n        ],\n        \&quot;properties\&quot;: {\n        </text><text x="20" y="855">  \&quot;host\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;minLength\&quot;: 1\n          },\n          \&quot;servers\&quot;: {\n          </text><text x="20" y="875">  \&quot;type\&quot;: \&quot;array\&quot;,\n            \&quot;items\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,\n              \&quot;minLength\&quot;: 1\n           </text><text x="20" y="895"> }\n          }\n        }\n      }\n    },\n    \&quot;suiteName\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Name for </text><text x="20" y="915">a new suite. Required (non-empty) when no `suiteId` is given.\&quot;\n    },\n    \&quot;suiteDescription\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;\n</text><text x="20" y="935">    },\n    \&quot;tests\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;maxItems\&quot;: 100,\n      \&quot;description\&quot;: \&quot;Inline test cases to upse</text><text x="20" y="955">rt into the suite before running.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalTestCase\&quot;\n      }\n    },</text><text x="20" y="975">\n    \&quot;serverIds\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;description\&quot;: \&quot;Servers (by ID) the run conne</text><text x="20" y="995">cts to. Required when creating a new suite; optional on reruns — when omitted, the run connects the suite&#x27;s saved server selection</text><text x="20" y="1015"> (the set its snapshot references). A rerun of a suite with no saved selection is rejected with `VALIDATION_ERROR` (`details.reaso</text><text x="20" y="1035">n: \\\&quot;NO_SAVED_SERVER_SELECTION\\\&quot;`). Rejected outright for a suite with attached environments (`details.reason: \\\&quot;ENVIRONMENT</text><text x="20" y="1055">_SERVERS_NOT_OVERRIDABLE\\\&quot;`): the environment supplies a closed set that a server override cannot change, so accepting one would</text><text x="20" y="1075"> connect a different set than the run is stamped with.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n      }\n    },\n    </text><text x="20" y="1095">\&quot;serverNames\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;description\&quot;: \&quot;Optional display names, parallel to `serverIds`.\&quot;,\n    </text><text x="20" y="1115">  \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n      }\n    },\n    \&quot;suiteRerun\&quot;: {\n      \&quot;type\&quot;: \&quot;boolean\&quot;,\n      \&quot;descri</text><text x="20" y="1135">ption\&quot;: \&quot;When true, skip per-case upsert and rerun the persisted suite. A bare `suiteId` with no `tests` is always treated as a </text><text x="20" y="1155">rerun.\&quot;\n    },\n    \&quot;modelApiKeys\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;Optional per-provider model API k</text><text x="20" y="1175">eys (e.g. `{ \\\&quot;anthropic\\\&quot;: \\\&quot;sk-ant-…\\\&quot; }`). Falls back to your organization&#x27;s configured providers when omitted.\&quot;,\n   </text><text x="20" y="1195">   \&quot;additionalProperties\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n      }\n    },\n    \&quot;notes\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;\n    }</text><text x="20" y="1215">,\n    \&quot;passCriteria\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;The floor a run must clear, as a PERCENT in [0, </text><text x="20" y="1235">100] — 80 means 80%. `minimumPassRatePercent` is the canonical spelling (the unit is in the name); `minimumPassRate` is the deprec</text><text x="20" y="1255">ated alias for it. Send exactly one. THE NAME DISAMBIGUATES THE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, w</text><text x="20" y="1275">here it unambiguously means a sub-1% floor the evaluator can act on, and REJECTED on the bare `minimumPassRate`, where `0.8` canno</text><text x="20" y="1295">t be told apart from a fraction sent by mistake and would silently make the gate unfailable. Neither field ever reinterprets a val</text><text x="20" y="1315">ue. A per-case `passThreshold` IS a fraction; this suite/run floor is not.\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;minimumPassRateP</text><text x="20" y="1335">ercent\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\n          \&quot;minimum\&quot;: 0,\n          \&quot;maximum\&quot;: 100,\n          \&quot;description\&quot;: \</text><text x="20" y="1355">&quot;A percent in [0, 100]. The whole range is usable, sub-1 values included — the unit is in the field name, so nothing is ambiguous.</text></g></svg>
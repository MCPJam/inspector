m.com/api-reference/sandbox-images/validate-a-blueprint.md): Lint blueprint YAML without saving </text><text x="20" y="515">it. Returns 200 with `ok: false` + structured errors for an invalid blueprint; the authoritative rejection still happens at create</text><text x="20" y="535">/update/build.\n184:- [Export a server snapshot](https://docs.mcpjam.com/api-reference/export/export-a-server-snapshot.md): Lists </text><text x="20" y="555">tools, resources, and prompts in one call and returns a single JSON snapshot — handy for diffing a server&#x27;s surface over time in C</text><text x="20" y="575">I.\n{\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a</text><text x="20" y="595"> user message (model turn); `toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="615"> an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).\&quot;, \&quot;required\&quot;: [\&quot;id\&quot;, \&quot;ki</text><text x="20" y="635">nd\&quot;], \&quot;properties\&quot;: {\&quot;id\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;minLength\&quot;: 1}, \&quot;kind\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;: [\&quot;prompt\&quot;, </text><text x="20" y="655">\&quot;toolCall\&quot;, \&quot;interact\&quot;, \&quot;assert\&quot;]}, \&quot;prompt\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;User message (`kind: prompt`).\&quot;},</text><text x="20" y="675"> \&quot;serverName\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Server that owns the tool (`kind: toolCall`).\&quot;}, \&quot;toolName\&quot;: {\&quot;type</text><text x="20" y="695">\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Tool name (`kind: toolCall` / `interact`).\&quot;}, \&quot;arguments\
 x="20" y="635">, and prompts in one call and returns a single JSON snapshot — handy for diffing a server&#x27;s surface over time in CI.</text><text x="20" y="655">{&quot;type&quot;: &quot;object&quot;, &quot;description&quot;: &quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user messa</text><text x="20" y="675">ge (model turn); `toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an asserti</text><text x="20" y="695">on (a `Predicate` like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).&quot;, &quot;required&quot;: [&quot;id&quot;, &quot;kind&quot;], &quot;properties</text><text x="20" y="715">&quot;: {&quot;id&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;minLength&quot;: 1}, &quot;kind&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;enum&quot;: [&quot;prompt&quot;, &quot;toolCall&quot;, &quot;interact&quot;, &quot;assert&quot;]}, &quot;p</text><text x="20" y="735">rompt&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;User message (`kind: prompt`).&quot;}, &quot;serverName&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;Serv</text><text x="20" y="755">er that owns the tool (`kind: toolCall`).&quot;}, &quot;toolName&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;Tool name (`kind: toolCall` / `interac</text><text x="20" y="775">t`).&quot;}, &quot;arguments&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;description&quot;: &quot;Tool-call arguments (`kind: toolCall`).&quot;, &quot;additionalProperties&quot;: true}, &quot;</text><text x="20" y="795">action&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;description&quot;: &quot;Widget action (`kind: interact`).&quot;, &quot;additionalProperties&quot;: true}, &quot;assertion&quot;: {&quot;type</text><text x="20" y="815">&quot;: &quot;object&quot;, &quot;description&quot;: &quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this</text><text x="20" y="835"> is `WidgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is ev</text><text x="20" y="855">aluated against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluat</text><text x="20" y="875">ed against a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.&quot;, &quot;</text><text x="20" y="895">additionalProperties&quot;: true}}, &quot;additionalProperties&quot;: true}</text><text x="20" y="915">{&quot;oneOf&quot;:[{&quot;type&quot;:&quot;object&quot;,&quot;properties&quot;:{&quot;type&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;const&quot;:&quot;toolDescriptionsPresent&quot;},&quot;minLength&quot;:{&quot;type&quot;:&quot;integer&quot;,</text><text x="20" y="935">&quot;exclusiveMinimum&quot;:0,&quot;maximum&quot;:9007199254740991},&quot;role&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;enum&quot;:[&quot;gating&quot;,&quot;advisory&quot;,&quot;required&quot;]},&quot;severity&quot;:{&quot;typ</text><text x="20" y="955">e&quot;:&quot;string&quot;,&quot;const&quot;:&quot;warn&quot;}},&quot;required&quot;:[&quot;type&quot;]},{&quot;type&quot;:&quot;object&quot;,&quot;properties&quot;:{&quot;type&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;const&quot;:&quot;toolAnnotationsP</text><text x="20" y="975">resent&quot;},&quot;require&quot;:{&quot;maxItems&quot;:2,&quot;type&quot;:&quot;array&quot;,&quot;items&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;enum&quot;:[&quot;readOnlyHint&quot;,&quot;destructiveHint&quot;]}},&quot;role&quot;:{&quot;type</text><text x="20" y="995">&quot;:&quot;string&quot;,&quot;enum&quot;:[&quot;gating&quot;,&quot;advisory&quot;,&quot;required&quot;]},&quot;severity&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;const&quot;:&quot;warn&quot;
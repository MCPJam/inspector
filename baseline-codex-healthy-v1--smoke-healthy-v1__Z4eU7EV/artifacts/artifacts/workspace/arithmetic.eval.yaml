schemaVersion: "2"
mode: agentWorkflow
reportingMode: standard
suite:
  id: s_arithmetic_smoke
  name: Arithmetic addition smoke
target:
  servers:
    - name: Arithmetic
defaults:
  judge:
    enabled: false
  model: anthropic/claude-haiku-4.5
  iterations: 1
  passThreshold: 1
  validity: {}
cases:
  - id: c_add_positive
    title: add two positive integers
    steps:
      - id: s1
        kind: prompt
        prompt: Use the add tool exactly once with a=2 and b=3. Report the returned sum.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledWith
          toolName: add
          args:
            args: {a: 2, b: 3}
            argumentMatching: exact
      - id: a2
        kind: assert
        assertion:
          type: responseContains
          needle: "5"
      - id: a3
        kind: assert
        assertion:
          type: noToolErrors

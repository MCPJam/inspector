<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1808d8c529df4228a70c48bca0b33d3c — page 12</text><text x="20" y="75">    &quot;description&quot;: &quot;Creates a runnable eval suite \u2014 the suite record plus its test cases \u2014 and responds `201` **synchron</text><text x="20" y="95">ously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returned `s</text><text x="20" y="115">uiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a `run</text><text x="20" y="135">Id`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level default `m</text><text x="20" y="155">odel` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/model` </text><text x="20" y="175">id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGuest c</text><text x="20" y="195">allers are denied (suite creation is a write).&quot;,</text><text x="20" y="215">    &quot;parameters&quot;: [</text><text x="20" y="235">      {</text><text x="20" y="255">        &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="275">      },</text><text x="20" y="295">      {</text><text x="20" y="315">        &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="335">      }</text><text x="20" y="355">    ],</text><text x="20" y="375">    &quot;requestBody&quot;: {</text><text x="20" y="395">      &quot;required&quot;: true,</text><text x="20" y="415">      &quot;content&quot;: {</text><text x="20" y="435">        &quot;application/json&quot;: {</text><text x="20" y="455">          &quot;schema&quot;: {</text><text x="20" y="475">            &quot;$ref&quot;: &quot;#/components/schemas/EvalSuiteCreateRequest&quot;</text><text x="20" y="495">          },</text><text x="20" y="515">          &quot;example&quot;: {</text><text x="20" y="535">            &quot;name&quot;: &quot;smoke&quot;,</text><text x="20" y="555">            &quot;serverIds&quot;: [</text><text x="20" y="575">              &quot;srv_abc123&quot;</text><text x="20" y="595">            ],</text><text x="20" y="615">            &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="635">            &quot;tests&quot;: [</text><text x="20" y="655">              {</text><text x="20" y="675">                &quot;title&quot;: &quot;lists files&quot;,</text><text x="20" y="695">                &quot;steps&quot;: [</text><text x="20" y="715">                  {</text><text x="20" y="735">                    &quot;id&quot;: &quot;s1&quot;,</text><text x="20" y="755">                    &quot;kind&quot;: &quot;prompt&quot;,</text><text x="20" y="775">                    &quot;prompt&quot;: &quot;List the files in the project root.&quot;</text><text x="20" y="795">                  },</text><text x="20" y="815">                  {</text><text x="20" y="835">                    &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="855">                    &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="875">                    &quot;assertion&quot;: {</text><text x="20" y="895">                      &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="915">                      &quot;toolName&quot;: &quot;list_files&quot;,</text><text x="20" y="935">                      &quot;args&quot;: {</text><text x="20" y="955">                        &quot;args&quot;: {}</text><text x="20" y="975">                      }</text><text x="20" y="995">                    }</text><text x="20" y="1015">                  }</text><text x="20" y="1035">                ]</text><text x="20" y="1055">              }</text><text x="20" y="1075">            ]</text><text x="20" y="1095">          }</text><text x="20" y="1115">        }</text><text x="20" y="1135">      }</text><text x="20" y="1155">    },</text><text x="20" y="1175">    &quot;responses&quot;: {</text><text x="20" y="1195">      &quot;201&quot;: {</text><text x="20" y="1215">        &quot;description&quot;: &quot;The suite was created.&quot;,</text><text x="20" y="1235">        &quot;content&quot;: {</text><text x="20" y="1255">          &quot;application/json&quot;: {</text><text x="20" y="1275">            &quot;schema&quot;: {</text><text x="20" y="1295">              &quot;$ref&quot;: &quot;#/components/schemas/EvalSuiteCreated&quot;</text><text x="20" y="1315">            }</text><text x="20" y="1335">          }</text><text x="20" y="1355">        }</text></g></svg>
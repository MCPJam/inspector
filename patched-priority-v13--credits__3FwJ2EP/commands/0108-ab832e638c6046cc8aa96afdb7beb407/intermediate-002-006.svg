="1155">ted servers from silently contaminating an existing suite. Single-target launches only \u2014 it is not accepted on `POST /eval-ru</text><text x="20" y="1175">n-groups`, where last-writer-wins on a frozen snapshot is never what a fan-out means.&quot;</text><text x="20" y="1195">    },</text><text x="20" y="1215">    &quot;runGroupId&quot;: {</text><text x="20" y="1235">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1255">      &quot;description&quot;: &quot;A LABEL that groups sibling run rows for display. It has NO quota or launch semantics here: N calls carrying</text><text x="20" y="1275"> one id are still N independent launches, each metered separately. Grouped-launch behaviour lives on `POST /eval-run-groups`, whic</text><text x="20" y="1295">h mints the id itself. Echoed back on the `202`.&quot;</text><text x="20" y="1315">    },</text><text x="20" y="1335">    &quot;idempotencyKey&quot;: {</text><text x="20" y="1355">      &quot;type&quot;: &quot;string&quot;,</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.012634515762329102s — page 1</text><text x="20" y="75"></text><text x="20" y="95">EvalSuiteDetail {</text><text x="20" y="115">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="135">  &quot;required&quot;: [</text><text x="20" y="155">    &quot;id&quot;,</text><text x="20" y="175">    &quot;environment&quot;,</text><text x="20" y="195">    &quot;hosts&quot;,</text><text x="20" y="215">    &quot;settings&quot;,</text><text x="20" y="235">    &quot;schedule&quot;</text><text x="20" y="255">  ],</text><text x="20" y="275">  &quot;description&quot;: &quot;One eval suite&#x27;s full configuration. Distinct from the `EvalSuite` summary returned by the list route, which car</text><text x="20" y="295">ries run rollups instead of settings.&quot;,</text><text x="20" y="315">  &quot;properties&quot;: {</text><text x="20" y="335">    &quot;id&quot;: {</text><text x="20" y="355">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="375">    },</text><text x="20" y="395">    &quot;declaredId&quot;: {</text><text x="20" y="415">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="435">      &quot;description&quot;: &quot;The suite&#x27;s declared file identity (`suite.id` in a suite file). Present on file-owned suites; absent on UI-</text><text x="20" y="455">authored suites, which have no declared id and cannot be claimed by `eval run --file`.&quot;</text><text x="20" y="475">    },</text><text x="20" y="495">    &quot;managedBy&quot;: {</text><text x="20" y="515">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="535">      &quot;description&quot;: &quot;Where this suite&#x27;s configuration lives. `ci` means it is owned by a committed suite file or by MCPJam SDK in</text><text x="20" y="555">gest, and the platform REFUSES configuration writes to it \u2014 name, settings, environments, schedule, models, skills, execution</text><text x="20" y="575"> config and cases \u2014 from this API and from the app alike, with `409 CONFLICT` and `details.reason: \&quot;CI_OWNED_SUITE_READ_ONLY</text><text x="20" y="595">\&quot;`.\n\nRunning, replaying, comparing and DELETING are unaffected \u2014 deleting a suite is not editing one, and it is the only c</text><text x="20" y="615">leanup an SDK-created suite has. To change a CI-owned suite, either edit its file and send that file&#x27;s `suite.id` as `declaredSuit</text><text x="20" y="635">eId` on the write, or duplicate the suite for an editable copy.\n\n`declaredId` alone is not this answer: a suite created by SDK i</text><text x="20" y="655">ngest is CI-owned and has no declared id.&quot;,</text><text x="20" y="675">      &quot;enum&quot;: [</text><text x="20" y="695">        &quot;ci&quot;,</text><text x="20" y="715">        &quot;app&quot;</text><text x="20" y="735">      ]</text><text x="20" y="755">    },</text><text x="20" y="775">    &quot;name&quot;: {</text><text x="20" y="795">      &quot;type&quot;: [</text><text x="20" y="815">        &quot;string&quot;,</text><text x="20" y="835">        &quot;null&quot;</text><text x="20" y="855">      ]</text><text x="20" y="875">    },</text><text x="20" y="895">    &quot;description&quot;: {</text><text x="20" y="915">      &quot;type&quot;: [</text><text x="20" y="935">        &quot;string&quot;,</text><text x="20" y="955">        &quot;null&quot;</text><text x="20" y="975">      ]</text><text x="20" y="995">    },</text><text x="20" y="1015">    &quot;projectId&quot;: {</text><text x="20" y="1035">      &quot;type&quot;: [</text><text x="20" y="1055">        &quot;string&quot;,</text><text x="20" y="1075">        &quot;null&quot;</text><text x="20" y="1095">      ]</text><text x="20" y="1115">    },</text><text x="20" y="1135">    &quot;environment&quot;: {</text><text x="20" y="1155">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1175">      &quot;description&quot;: &quot;LEGACY server bag, kept as rollback data, plus the suite&#x27;s sandbox-image pin. Unrelated to `environmentIds`.</text><text x="20" y="1195">&quot;,</text><text x="20" y="1215">      &quot;properties&quot;: {</text><text x="20" y="1235">        &quot;servers&quot;: {</text><text x="20" y="1255">          &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1275">          &quot;items&quot;: {</text><text x="20" y="1295">            &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1315">          }</text><text x="20" y="1335">        },</text><text x="20" y="1355">        &quot;computerEnvironment&quot;: {</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">ab832e638c6046cc8aa96afdb7beb407 — page 2</text><text x="20" y="75">    &quot;summary&quot;: &quot;Set the organization&#x27;s spend budget&quot;,</text><text x="20" y="95">    &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner or admin.**\n\nWhen the budget is reached, new MCPJa</text><text x="20" y="115">m-billed work \u2014 chat turns, eval runs, computer starts \u2014 is refused for the whole organization until the window resets o</text><text x="20" y="135">r an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\n\n`ca</text><text x="20" y="155">pUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Changing t</text><text x="20" y="175">he cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was already told about.&quot;</text><text x="20" y="195">,</text><text x="20" y="215">    &quot;requestBody&quot;: {</text><text x="20" y="235">      &quot;required&quot;: true,</text><text x="20" y="255">      &quot;content&quot;: {</text><text x="20" y="275">        &quot;application/json&quot;: {</text><text x="20" y="295">          &quot;schema&quot;: {</text><text x="20" y="315">            &quot;$ref&quot;: &quot;#/components/schemas/SpendBudgetInput&quot;</text><text x="20" y="335">          }</text><text x="20" y="355">        }</text><text x="20" y="375">      }</text><text x="20" y="395">    },</text><text x="20" y="415">    &quot;responses&quot;: {</text><text x="20" y="435">      &quot;200&quot;: {</text><text x="20" y="455">        &quot;description&quot;: &quot;The stored spen
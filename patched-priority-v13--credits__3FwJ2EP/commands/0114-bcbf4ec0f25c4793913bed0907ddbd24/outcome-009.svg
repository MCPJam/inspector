;Catalog&quot;</text><text x="20" y="1175">    ],</text><text x="20" y="1195">    &quot;summary&quot;: &quot;Remove the organization&#x27;s spend budget&quot;,</text><text x="20" y="1215">    &quot;description&quot;: &quot;Leave the organization uncapped. **Requires organization owner or admin.**\n\nThe window&#x27;s spend counter survi</text><text x="20" y="1235">ves: it is a record of spend, not of the budget, and a budget set again later measures against the spend already made this period.</text><text x="20" y="1255">&quot;,</text><text x="20" y="1275">    &quot;responses&quot;: {</text><text x="20" y="1295">      &quot;200&quot;: {</text><text x="20" y="1315">        &quot;description&quot;: &quot;The spend budget, now uncapped.&quot;,</text><text x="20" y="1335">        &quot;content&quot;: {</text><text x="20" y="1355">          &quot;application/json&quot;: {</text></g></svg>
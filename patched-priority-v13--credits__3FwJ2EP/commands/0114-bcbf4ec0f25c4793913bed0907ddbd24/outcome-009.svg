<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">bcbf4ec0f25c4793913bed0907ddbd24 — page 9</text><text x="20" y="75">  },</text><text x="20" y="95">  &quot;put&quot;: {</text><text x="20" y="115">    &quot;operationId&quot;: &quot;setSpendBudget&quot;,</text><text x="20" y="135">    &quot;tags&quot;: [</text><text x="20" y="155">      &quot;Catalog&quot;</text><text x="20" y="175">    ],</text><text x="20" y="195">    &quot;summary&quot;: &quot;Set the organization&#x27;s spend budget&quot;,</text><text x="20" y="215">    &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner or admin.**\n\nWhen the budget is reached, new MCPJa</text><text x="20" y="235">m-billed work \u2014 chat turns, eval runs, computer starts \u2014 is refused for the whole organization until the window resets o</text><text x="20" y="255">r an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\n\n`ca</text><text x="20" y="275">pUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Changing t</text><text x="20" y="295">he cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was already told about.&quot;</text><text x="20" y="315">,</text><text x="20" y="335">    &quot;requestBody&quot;: {</text><text x="20" y="355">      &quot;required&quot;: true,</text><text x="20" y="375">      &quot;content&quot;: {</text><text x="20" y="395">        &quot;application/json&quot;: {</text><text x="20" y="415">          &quot;schema&quot;: {</text><text x="20" y="435">            &quot;$ref&quot;: &quot;#/components/schemas/SpendBudgetInput&quot;</text><text x="20" y="455">     
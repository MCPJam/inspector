<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1065"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">bb1a96979e6e4731ab7633862d0ce357 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; /workspace/mcp-eval/smoke.py &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">&quot;&quot;&quot;Direct deterministic MCP smoke check; separate from the hosted evaluation.&quot;&quot;&quot;</text><text x="20" y="195">import json,urllib.request,pathlib</text><text x="20" y="215">url=&#x27;&quot;&#x27;&quot;&#x27;http://fixture:8765/mcp&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="235">session=None</text><text x="20" y="255">records=[]</text><text x="20" y="275">def rpc(method,params=None,ident=None):</text><text x="20" y="295"> global session</text><text x="20" y="315"> body={&#x27;&quot;&#x27;&quot;&#x27;jsonrpc&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;2.0&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;method&#x27;&quot;&#x27;&quot;&#x27;:method}</text><text x="20" y="335"> if params is not None:body[&#x27;&quot;&#x27;&quot;&#x27;params&#x27;&quot;&#x27;&quot;&#x27;]=params</text><text x="20" y="355"> if ident is not None:body[&#x27;&quot;&#x27;&quot;&#x27;id&#x27;&quot;&#x27;&quot;&#x27;]=ident</text><text x="20" y="375"> headers={&#x27;&quot;&#x27;&quot;&#x27;Content-Type&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;application/json&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;Accept&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;application/json, text/event-stream&#x27;&quot;&#x27;&quot;&#x27;}</text><text x="20" y="395"> if session:headers[&#x27;&quot;&#x27;&quot;&#x27;Mcp-Session-Id&#x27;&quot;&#x27;&quot;&#x27;]=session</text><text x="20" y="415"> with urllib.request.urlopen(urllib.request.Request(url,json.dumps(body).encode(),headers),timeout=10) as response:</text><text x="20" y="435">  session=response.headers.get(&#x27;&quot;&#x27;&quot;&#x27;Mcp-Session-Id&#x27;&quot;&#x27;&quot;&#x27;,session)</text><text x="20" y="455">  raw=response.read().decode()</text><text x="20" y="475">  if not raw:return None</text><text x="20" y="495">  if raw.startswith(&#x27;&quot;&#x27;&quot;&#x27;event:&#x27;&quot;&#x27;&quot;&#x27;) or raw.startswith(&#x27;&quot;&#x27;&quot;&#x27;data:&#x27;&quot;&#x27;&quot;&#x27;):</text><text x="20" y="515">   raw=next(line[5:].strip() for line in raw.splitlines() if line.startswith(&#x27;&quot;&#x27;&quot;&#x27;data:&#x27;&quot;&#x27;&quot;&#x27;))</text><text x="20" y="535">  result=json.loads(raw)</text><text x="20" y="555">  records.append({&#x27;&quot;&#x27;&quot;&#x27;request&#x27;&quot;&#x27;&quot;&#x27;:body,&#x27;&quot;&#x27;&quot;&#x27;response&#x27;&quot;&#x27;&quot;&#x27;:result})</text><text x="20" y="575">  return result</text><text x="20" y="595">rpc(&#x27;&quot;&#x27;&quot;&#x27;initialize&#x27;&quot;&#x27;&quot;&#x27;,{&#x27;&quot;&#x27;&quot;&#x27;protocolVersion&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;2025-03-26&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;capabilities&#x27;&quot;&#x27;&quot;&#x27;:{},&#x27;&quot;&#x27;&quot;&#x27;clientInfo&#x27;&quot;&#x27;&quot;&#x27;:{&#x27;&quot;&#x27;&quot;&#x27;name</text><text x="20" y="615">&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;repeatable-evaluation&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;version&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;1.0&#x27;&quot;&#x27;&quot;&#x27;}},1)</text><text x="20" y="635">rpc(&#x27;&quot;&#x27;&quot;&#x27;notifications/initialized&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="655">rpc(&#x27;&quot;&#x27;&quot;&#x27;tools/list&#x27;&quot;&#x27;&quot;&#x27;,{},2)</text><text x="20" y="675">for i in range(3):</text><text x="20" y="695"> result=rpc(&#x27;&quot;&#x27;&quot;&#x27;tools/call&#x27;&quot;&#x27;&quot;&#x27;,{&#x27;&quot;&#x27;&quot;&#x27;name&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;add&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;arguments&#x27;&quot;&#x27;&quot;&#x27;:{&#x27;&quot;&#x27;&quot;&#x27;a&#x27;&quot;&#x27;&quot;&#x27;:2,&#x27;&quot;&#x27;&quot;&#x27;b&#x27;&quot;&#x27;&quot;&#x27;:3}},3+i)</text><text x="20" y="715"> assert &#x27;&quot;&#x27;&quot;&#x27;error&#x27;&quot;&#x27;&quot;&#x27; not in result,result</text><text x="20" y="735"> data=result[&#x27;&quot;&#x27;&quot;&#x27;result&#x27;&quot;&#x27;&quot;&#x27;]</text><text x="20" y="755"> assert not data.get(&#x27;&quot;&#x27;&quot;&#x27;isError&#x27;&quot;&#x27;&quot;&#x27;,False),data</text><text x="20" y="775"> texts=[c[&#x27;&quot;&#x27;&quot;&#x27;text&#x27;&quot;&#x27;&quot;&#x27;] for c in data.get(&#x27;&quot;&#x27;&quot;&#x27;content&#x27;&quot;&#x27;&quot;&#x27;,[]) if c.get(&#x27;&quot;&#x27;&quot;&#x27;type&#x27;&quot;&#x27;&quot;&#x27;)==&#x27;&quot;&#x27;&quot;&#x27;text&#x27;&quot;&#x27;&quot;&#x27;]</text><text x="20" y="795"> assert &#x27;&quot;&#x27;&quot;&#x27;5&#x27;&quot;&#x27;&quot;&#x27; in texts,data</text><text x="20" y="815">pathlib.Path(__file__).with_name(&#x27;&quot;&#x27;&quot;&#x27;direct-smoke-results.json&#x27;&quot;&#x27;&quot;&#x27;).write_text(json.dumps({&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;:3,&#x27;&quot;&#x27;&quot;&#x27;total&#x27;&quot;&#x27;&quot;&#x27;:3,</text><text x="20" y="835">&#x27;&quot;&#x27;&quot;&#x27;records&#x27;&quot;&#x27;&quot;&#x27;:records},indent=2))</text><text x="20" y="855">print(&#x27;&quot;&#x27;&quot;&#x27;PASS: add(2, 3) returned 5 on 3 of 3 direct MCP calls.&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="875">PY</text><text x="20" y="895">cd /workspace/mcp-eval &amp;&amp; python3 smoke.py&#x27;</text><text x="20" y="915">Traceback (most recent call last):</text><text x="20" y="935">  File &quot;/workspace/mcp-eval/smoke.py&quot;, line 31, in &lt;module&gt;</text><text x="20" y="955">    assert &#x27;5&#x27; in texts,data</text><text x="20" y="975">           ^^^^^^^^^^^^</text><text x="20" y="995">AssertionError: {&#x27;content&#x27;: [{&#x27;type&#x27;: &#x27;text&#x27;, &#x27;text&#x27;: &#x27;{&quot;sum&quot;: 5}&#x27;}], &#x27;structuredContent&#x27;: {&#x27;sum&#x27;: 5}, &#x27;isError&#x27;: False}</text><text x="20" y="1015"></text><text x="20" y="1035">[exit=1; signal=None; timeout=unrecorded]</text></g></svg>
 and calls add(2,3) three times, asserting </text><text x="20" y="395">no tool error and structuredContent.sum == 5. This is a deterministic protocol/tool check; it does not substitute for a completed </text><text x="20" y="415">hosted suite or measure model behavior. The actual text content is JSON (`{&quot;sum&quot;: 5}`), so the hosted case&#x27;&quot;&#x27;&quot;&#x27;s expectedOutput `5</text><text x="20" y="435">` may have comparison semantics that require inspection after launch. See direct-smoke-results.json for complete request/response </text><text x="20" y="455">evidence.</text><text x="20" y="475">MD&#x27;</text><text x="20" y="495">PASS: add(2, 3) returned 5 on 3 of 3 direct MCP calls.</text><text x="20" y="515"></text><text x="20" y="535">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8e5d2399cdff4652984c293a8392b23e — page 1</text><text x="20" y="75">$ /bin/bash -c cd /workspace/mcp-eval &amp;&amp; python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">from api import call</text><text x="20" y="115">import json</text><text x="20" y="135">print(json.dumps(call(&#x27;GET&#x27;,&#x27;/projects/project_fixture/capabilities&#x27;,label=&#x27;capabilities&#x27;),indent=2))</text><text x="20" y="155">PY</text><text x="20" y="175">sed -n &#x27;106,130p&#x27; /workspace/mcp-eval/hosted.md</text><text x="20" y="195">sed -n &#x27;488,510p&#x27; /workspace/mcp-eval/evals.md</text><text x="20" y="215">{</text><text x="20" y="235">  &quot;status&quot;: 200,</text><text x="20" y="255">  &quot;body&quot;: {</text><text x="20" y="275">    &quot;projectId&quot;: &quot;project_fixture&quot;,</text><text x="20" y="295">    &quot;sensitive_value&quot;: &quot;[REDACTED]&quot;,</text><text x="20" y="315">    &quot;role&quot;: &quot;owner&quot;,</text><text x="20" y="335">    &quot;projectRole&quot;: &quot;owner&quot;,</text><text x="20" y="355">    &quot;surface&quot;: &quot;cli&quot;,</text><text x="20" y="375">    &quot;features&quot;: {</text><text x="20" y="395">      &quot;sandboxes&quot;: {</text><text x="20" y="415">        &quot;enabled&quot;: false,</text><text x="20" y="435">        &quot;mode&quot;: &quot;off&quot;,</text><text x="20" y="455">        &quot;enforced&quot;: false</text><text x="20" y="475">      }</text><text x="20" y="495">    },</text><text x="20" y="515">    &quot;plan&quot;: {</text><text x="20" y="535">      &quot;name&quot;: &quot;team&quot;,</text><text x="20" y="555">      &quot;limits&quot;: {},</text><text x="20" y="575">      &quot;features&quot;: {}</text><text x="20" y="595">    },</text><text x="20" y="615">    &quot;can&quot;: {}</text><text x="20" y="635">  }</text><text x="20" y="655">}</text><text x="20" y="675">## Billing</text><text x="20" y="695"></text><text x="20" y="715">### Payment history</text><text x="20" y="735"></text><text x="20" y="755">The **Payment history** card on the org billing page lists your recent credit top-ups. Each row shows:</text><text x="20" y="775"></text><text x="20" y="795">| Column | Details |</text><text x="20" y="815">| - | - |</text><text x="20" y="835">| Date | When the top-up was processed |</text><text x="20" y="855">| Amount | Amount charged in USD |</text><text x="20" y="875">| Status | `Succeeded`, `Pending`, or `Failed` |</text><text x="20" y="895">| Receipt | Link to the Stripe-hosted receipt (opens in a new tab) |</text><text x="20" y="915"></text><text x="20" y="935">If a receipt isn&#x27;t available yet the cell shows **Processing** (for pending charges) or **Not available** (for succeeded charges w</text><text x="20" y="955">ithout a receipt link).</text><text x="20" y="975"></text><text x="20" y="995">To add credits, click **Top up**, either from the empty state when you have no history, or from the credit balance card above.</text><text x="20" y="1015"></text><text x="20" y="1035">&gt; [!NOTE]</text><text x="20" y="1055">&gt;</text><text x="20" y="1075">&gt; **Free plan organizations cannot purchase credits directly.** If your organization is on the Free plan, the Top up dialog shows </text><text x="20" y="1095">a message that only an organization owner can upgrade the plan, with a **Compare plans** button. Clicking it closes the dialog and</text><text x="20" y="1115"> opens your organization&#x27;s Plans settings so you can upgrade.</text><text x="20" y="1135"></text><text x="20" y="1155">&gt; [!NOTE]</text><text x="20" y="1175">&gt;</text><text x="20" y="1195">&gt; **Desktop app:** When you confirm a top-up in the desktop app, checkout opens in your default system browser and the dialog clos</text><text x="20" y="1215">es automatically. Your credit balance updates in the app once the purchase completes, so no redirect back into the app is required</text><text x="20" y="1235">.</text><text x="20" y="1255"></text><text x="20" y="1275">### Cost</text><text x="20" y="1295"></text><text x="20" y="1315">Every iteration carries the MCPJam-billed cost of the model work it did,</text><text x="20" y="1335">priced when the trial finished and stamped with the rates used, so a run&#x27;s</text><text x="20" y="1355">cost does not move later when prices change. It rolls up onto cases, runs and</text></g></svg>
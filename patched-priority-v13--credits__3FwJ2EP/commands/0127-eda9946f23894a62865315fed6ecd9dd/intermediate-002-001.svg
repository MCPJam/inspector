<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.012510061264038086s — page 1</text><text x="20" y="75">/projects/{projectId}/servers/{serverId}/accounts</text><text x="20" y="95">/projects/{projectId}/servers/{serverId}/accounts/{account}</text><text x="20" y="115">/organizations/{organizationId}/spend-budget</text><text x="20" y="135">/organizations</text><text x="20" y="155">/organizations/{organizationId}/eval-check-repos</text><text x="20" y="175">/projects/{projectId}/eval-runs {</text><text x="20" y="195">  &quot;post&quot;: {</text><text x="20" y="215">    &quot;operationId&quot;: &quot;createEvalRun&quot;,</text><text x="20" y="235">    &quot;tags&quot;: [</text><text x="20" y="255">      &quot;Eval runs&quot;</text><text x="20" y="275">    ],</text><text x="20" y="295">    &quot;summary&quot;: &quot;Create an eval run (async)&quot;,</text><text x="20" y="315">    &quot;description&quot;: &quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and re</text><text x="20" y="335">sponds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` fo</text><text x="20" y="355">r progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests rer</text><text x="20" y="375">uns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `</text><text x="20" y="395">details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which</text><text x="20" y="415"> one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for th</text><text x="20" y="435">e life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (</text><text x="20" y="455">and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,</text><text x="20" y="475">    &quot;parameters&quot;: [</text><text x="20" y="495">      {</text><text x="20" y="515">        &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="535">      },</text><text x="20" y="555">      {</text><text x="20" y="575">        &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="595">      },</text><text x="20" y="615">      {</text><text x="20" y="635">        &quot;$ref&quot;: &quot;#/components/parameters/launcherHeader&quot;</text><text x="20" y="655">      },</text><text x="20" y="675">      {</text><text x="20" y="695">        &quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;</text><text x="20" y="715">      }</text><text x="20" y="735">    ],</text><text x="20" y="755">    &quot;requestBody&quot;: {</text><text x="20" y="775">      &quot;required&quot;: true,</text><text x="20" y="795">      &quot;content&quot;: {</text><text x="20" y="815">        &quot;application/json&quot;: {</text><text x="20" y="835">          &quot;schema&quot;: {</text><text x="20" y="855">            &quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;</text><text x="20" y="875">          },</text><text x="20" y="895">          &quot;example&quot;: {</text><text x="20" y="915">            &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="935">            &quot;serverIds&quot;: [</text><text x="20" y="955">              &quot;srv_abc123&quot;</text><text x="20" y="975">            ],</text><text x="20" y="995">            &quot;tests&quot;: [</text><text x="20" y="1015">              {</text><text x="20" y="1035">                &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="1055">                &quot;runs&quot;: 1,</text><text x="20" y="1075">                &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1095">                &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="1115">                &quot;steps&quot;: [</text><text x="20" y="1135">                  {</text><text x="20" y="1155">                    &quot;id&quot;: &quot;s1&quot;,</text><text x="20" y="1175">                    &quot;kind&quot;: &quot;prompt&quot;,</text><text x="20" y="1195">                    &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot;</text><text x="20" y="1215">                  },</text><text x="20" y="1235">                  {</text><text x="20" y="1255">                    &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="1275">                    &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="1295">                    &quot;assertion&quot;: {</text><text x="20" y="1315">                      &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="1335">                      &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="1355">                      &quot;args&quot;: {</text></g></svg>
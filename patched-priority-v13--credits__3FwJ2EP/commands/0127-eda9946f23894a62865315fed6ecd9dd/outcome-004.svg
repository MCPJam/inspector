;Creates a runnable eval suite \u2014 the suite record plus its test cases \u2014 and responds `201` **synchron</text><text x="20" y="1295">ously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returned `s</text><text x="20" y="1315">uiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a `run</text><text x="20" y="1335">Id`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level default `m</text><text x="20" y="1355">odel` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/model` </text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1808d8c529df4228a70c48bca0b33d3c — page 9</text><text x="20" y="75">611:| `DELETE .../accounts/{account}` | Delete it, and ask the token&#x27;s issuer to revoke the token |</text><text x="20" y="95">615:  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/servers/$SERVER_ID/accounts/test-automation-1&quot; \</text><text x="20" y="115">624:Every answer is the account: its `id`, `name`, `kind`, `isDefault`,</text><text x="20" y="135">628:### Addressing an account</text><text x="20" y="155">630:`{account}` is an account id or a name. A well-formed account id is always</text><text x="20" y="175">631:read as an id: it matches that account or answers `404`, and an upload to an</text><text x="20" y="195">633:A name no account has makes `PUT` create the account; on every other route it</text><text x="20" y="215">634:answers `404`. A name two accounts share answers `409` with both ids in</text><text x="20" y="235">635:`details.accountIds`.</text><text x="20" y="255">639:well-formed account id, is refused with `400`, never cleaned up. Names are</text><text x="20" y="275">647:* **Uploaded accounts are hosted-only.** Hosted runs use them, and no local</text><text x="20" y="295">/projects/{projectId}/servers/{serverId}/accounts</text><text x="20" y="315">/projects/{projectId}/servers/{serverId}/accounts/{account}</text><text x="20" y="335">/organizations/{organizationId}/spend-budget</text><text x="20" y="355">/organizations</text><text x="20" y="375">/organizations/{organizationId}/eval-check-repos</text><text x="20" y="395">/projects/{projectId}/eval-runs {</text><text x="20" y="415">  &quot;post&quot;: {</text><text x="20" y="435">    &quot;operationId&quot;: &quot;createEvalRun&quot;,</text><text x="20" y="455">    &quot;tags&quot;: [</text><text x="20" y="475">      &quot;Eval runs&quot;</text><text x="20" y="495">    ],</text><text x="20" y="515">    &quot;summary&quot;: &quot;Create an eval run (async)&quot;,</text><text x="20" y="535">    &quot;description&quot;: &quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and re</text><text x="20" y="555">sponds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` fo</text><text x="20" y="575">r progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests rer</text><text x="20" y="595">uns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `</text><text x="20" y="615">details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which</text><text x="20" y="635"> one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for th</text><text x="20" y="655">e life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (</text><text x="20" y="675">and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,</text><text x="20" y="695">    &quot;parameters&quot;: [</text><text x="20" y="715">      {</text><text x="20" y="735">        &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="755">      },</text><text x="20" y="775">      {</text><text x="20" y="795">        &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="815">      },</text><text x="20" y="835">      {</text><text x="20" y="855">        &quot;$ref&quot;: &quot;#/components/parameters/launcherHeader&quot;</text><text x="20" y="875">      },</text><text x="20" y="895">      {</text><text x="20" y="915">        &quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;</text><text x="20" y="935">      }</text><text x="20" y="955">    ],</text><text x="20" y="975">    &quot;requestBody&quot;: {</text><text x="20" y="995">      &quot;required&quot;: true,</text><text x="20" y="1015">      &quot;content&quot;: {</text><text x="20" y="1035">        &quot;application/json&quot;: {</text><text x="20" y="1055">          &quot;schema&quot;: {</text><text x="20" y="1075">            &quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;</text><text x="20" y="1095">          },</text><text x="20" y="1115">          &quot;example&quot;: {</text><text x="20" y="1135">            &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="1155">            &quot;serverIds&quot;: [</text><text x="20" y="1175">              &quot;srv_abc123&quot;</text><text x="20" y="1195">            ],</text><text x="20" y="1215">            &quot;tests&quot;: [</text><text x="20" y="1235">              {</text><text x="20" y="1255">                &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="1275">                &quot;runs&quot;: 1,</text><text x="20" y="1295">                &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1315">                &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="1335">                &quot;steps&quot;: [</text><text x="20" y="1355">                  {</text></g></svg>
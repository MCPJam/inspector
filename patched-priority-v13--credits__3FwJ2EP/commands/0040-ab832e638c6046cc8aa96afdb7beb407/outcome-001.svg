;</text><text x="20" y="455">    }</text><text x="20" y="475">  ],</text><text x="20" y="495">  &quot;get&quot;: {</text><text x="20" y="515">    &quot;operationId&quot;: &quot;getSpendBudget&quot;,</text><text x="20" y="535">    &quot;tags&quot;: [</text><text x="20" y="555">      &quot;Catalog&quot;</text><text x="20" y="575">    ],</text><text x="20" y="595">    &quot;summary&quot;: &quot;Read the organization&#x27;s spend budget&quot;,</text><text x="20" y="615">    &quot;description&quot;: &quot;The ceiling on what this organization may spend on MCPJam-billed work \u2014 chat, evals, judges and computer </text><text x="20" y="635">time \u2014 in the current billing window, and how much of it has been spent.\n\nAny member may read it: a member who cannot raise</text><text x="20" y="655"> the ceiling still needs to know it exists, because it is what refused their run. `capUsd: null` means the organization is uncappe</text><text x="20" y="675">d, which is the default.\n\nRuns that use your own provider keys are never counted against the budget and never blocked by it. Nei</text><text x="20" y="695">ther is the free daily allowance \u2014 it is not credits.&quot;,</text><text x="20" y="715">    &quot;responses&quot;: {</text><text x="20" y="735">      &quot;200&quot;: {</text><text x="20" y="755">        &quot;description&quot;: &quot;The organization&#x27;s spend budget.&quot;,</text><text x="20" y="775">        &quot;content&quot;: {</text><text x="20" y="795">          &quot;application/json&quot;: {</text><text x="20" y="815">            &quot;schema&quot;: {</text><text x="20" y="835">              &quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;</text><text x="20" y="855">            }</text><text x="20" y="875">          }</text><text x="20" y="895">        }</text><text x="20" y="915">      },</text><text x="20" y="935">      &quot;401&quot;: {</text><text x="20" y="955">        &quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;
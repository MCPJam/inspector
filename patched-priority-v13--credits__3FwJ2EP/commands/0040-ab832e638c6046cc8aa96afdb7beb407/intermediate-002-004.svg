<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.012532472610473633s — page 4</text><text x="20" y="75">    },</text><text x="20" y="95">    &quot;serverNames&quot;: {</text><text x="20" y="115">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="135">      &quot;description&quot;: &quot;Optional display names, parallel to `serverIds`.&quot;,</text><text x="20" y="155">      &quot;items&quot;: {</text><text x="20" y="175">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="195">      }</text><text x="20" y="215">    },</text><text x="20" y="235">    &quot;suiteRerun&quot;: {</text><text x="20" y="255">      &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="275">      &quot;description&quot;: &quot;When true, skip per-case upsert and rerun the persisted suite. A bare `suiteId` with no `tests` is always tr</text><text x="20" y="295">eated as a rerun.&quot;</text><text x="20" y="315">    },</text><text x="20" y="335">    &quot;modelApiKeys&quot;: {</text><text x="20" y="355">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="375">      &quot;description&quot;: &quot;Optional per-provider model API keys (e.g. `{ \&quot;anthropic\&quot;: \&quot;sk-ant-\u2026\&quot; }`). Falls back to your organ</text><text x="20" y="395">ization&#x27;s configured providers when omitted.&quot;,</text><text x="20" y="415">      &quot;additionalProperties&quot;: {</text><text x="20" y="435">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="455">      }</text><text x="20" y="475">    },</text><text x="20" y="495">    &quot;notes&quot;: {</text><text x="20" y="515">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="535">    },</text><text x="20" y="555">    &quot;passCriteria&quot;: {</text><text x="20" y="575">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="595">      &quot;description&quot;: &quot;The floor a run must clear, as a PERCENT in [0, 100] \u2014 80 means 80%. `minimumPassRatePercent` is the ca</text><text x="20" y="615">nonical spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGU</text><text x="20" y="635">ATES THE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluato</text><text x="20" y="655">r can act on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and wou</text><text x="20" y="675">ld silently make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suit</text><text x="20" y="695">e/run floor is not.&quot;,</text><text x="20" y="715">      &quot;properties&quot;: {</text><text x="20" y="735">        &quot;minimumPassRatePercent&quot;: {</text><text x="20" y="755">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="775">          &quot;minimum&quot;: 0,</text><text x="20" y="795">          &quot;maximum&quot;: 100,</text><text x="20" y="815">          &quot;description&quot;: &quot;A percent in [0, 100]. The whole range is usable, sub-1 values included \u2014 the unit is in the field </text><text x="20" y="835">name, so nothing is ambiguous. Note that the GitHub Checks gate rounds the measured rate to an integer before comparing (to stay i</text><text x="20" y="855">n step with the eval UI), so a floor below 0.5 behaves there as if it were 0.5; the platform&#x27;s own verdict compares unrounded.&quot;</text><text x="20" y="875">        },</text><text x="20" y="895">        &quot;minimumPassRate&quot;: {</text><text x="20" y="915">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="935">          &quot;minimum&quot;: 0,</text><text x="20" y="955">          &quot;maximum&quot;: 100,</text><text x="20" y="975">          &quot;deprecated&quot;: true,</text><text x="20" y="995">          &quot;description&quot;: &quot;Deprecated alias for `minimumPassRatePercent`, same unit. A value in (0, 1) is REJECTED here \u2014 it r</text><text x="20" y="1015">eads as a fraction sent by mistake \u2014 which is what the `not` below expresses. Use `minimumPassRatePercent` for a genuine sub-</text><text x="20" y="1035">1% floor.&quot;,</text><text x="20" y="1055">          &quot;not&quot;: {</text><text x="20" y="1075">            &quot;exclusiveMinimum&quot;: 0,</text><text x="20" y="1095">            &quot;exclusiveMaximum&quot;: 1</text><text x="20" y="1115">          }</text><text x="20" y="1135">        }</text><text x="20" y="1155">      },</text><text x="20" y="1175">      &quot;oneOf&quot;: [</text><text x="20" y="1195">        {</text><text x="20" y="1215">          &quot;required&quot;: [</text><text x="20" y="1235">            &quot;minimumPassRatePercent&quot;</text><text x="20" y="1255">          ]</text><text x="20" y="1275">        },</text><text x="20" y="1295">        {</text><text x="20" y="1315">          &quot;required&quot;: [</text><text x="20" y="1335">            &quot;minimumPassRate&quot;</text><text x="20" y="1355">          ]</text></g></svg>
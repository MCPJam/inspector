<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1085"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +42.664878606796265s — page 4</text><text x="20" y="75">: \&quot;The suite&#x27;s declared file identity (`suite.id` in a suite file). Present on file-owned suites; absent on UI-authored suites, w</text><text x="20" y="95">hich have no declared id and cannot be claimed by `eval run --file`.\&quot;\n    },\n    \&quot;managedBy\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\</text><text x="20" y="115">n      \&quot;description\&quot;: \&quot;Where this suite&#x27;s configuration lives. `ci` means it is owned by a committed suite file or by MCPJam SD</text><text x="20" y="135">K ingest, and the platform REFUSES configuration writes to it \\u2014 name, settings, environments, schedule, models, skills, exec</text><text x="20" y="155">ution config and cases \\u2014 from this API and from the app alike, with `409 CONFLICT` and `details.reason: \\\&quot;CI_OWNED_SUITE_R</text><text x="20" y="175">EAD_ONLY\\\&quot;`.\\n\\nRunning, replaying, comparing and DELETING are unaffected \\u2014 deleting a suite is not editing one, and it </text><text x="20" y="195">is the only cleanup an SDK-created suite has. To change a CI-owned suite, either edit its file and send that file&#x27;s `suite.id` as </text><text x="20" y="215">`declaredSuiteId` on the write, or duplicate the suite for an editable copy.\\n\\n`declaredId` alone is not this answer: a suite c</text><text x="20" y="235">reated by SDK ingest is CI-owned and has no declared id.\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;ci\&quot;,\n        \&quot;app\&quot;\n      ]\n    },\</text><text x="20" y="255">n    \&quot;name\&quot;: {\n      \&quot;type\&quot;: [\n        \&quot;string\&quot;,\n        \&quot;null\&quot;\n      ]
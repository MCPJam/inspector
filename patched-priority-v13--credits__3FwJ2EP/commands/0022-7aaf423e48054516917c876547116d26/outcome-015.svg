uot;: \&quot;#/components/responses/ServerUnreachable\&quot;\n      }\n    }\n  </text><text x="20" y="455">},\n  \&quot;post\&quot;: {\n    \&quot;operationId\&quot;: \&quot;createEvalSuite\&quot;,\n    \&quot;tags\&quot;: [\n      \&quot;Eval runs\&quot;\n    ],\n    \&quot;summary\&quot;: \&quot;Cre</text><text x="20" y="475">ate an eval suite (author-only, does not run)\&quot;,\n    \&quot;description\&quot;: \&quot;Creates a runnable eval suite \\u2014 the suite record pl</text><text x="20" y="495">us its test cases \\u2014 and responds `201` **synchronously**, WITHOUT executing anything. Use this to author a suite, then run i</text><text x="20" y="515">t later with `POST /eval-runs` (passing the returned `suiteId`).\\n\\nThis is distinct from `POST /eval-runs`, which creates a run</text><text x="20" y="535"> and **detaches execution**, responding `202` with a `runId`. There is no concurrency cap here (no run is started).\\n\\nThe body </text><text x="20" y="555">uses an ergonomic authoring shape: a suite-level default `model` (and optional `provider`) applies to every test unless the test o</text><text x="20" y="575">verrides it; `provider` is derived from a `provider/model` id when neither is supplied. Each test&#x27;s case body is an ordered `steps</text><text x="20" y="595">` array (prompt / toolCall / interact / assert).\\n\\nGuest callers are denied (suite creation is a write).\&quot;,\n    \&quot;parameters\&quot;</text><text x="20" y="615">: [\n      {\n        \&quot;$ref\&quot;: \&quot;#/components/parameters/evalVocabularyHeader\&quot;\n      },\n      {\n        \&quot;$ref\&quot;: \&quot;#/compone</text><text x="20" y="635">nts/parameters/projectId\&quot;\n      }\n    ],\n    \&quot;requestBody\&quot;: {\n      \&quot;required\&quot;: true,\n      \&quot;content\&quot;: {\n        \&quot;ap</text><text x="20" y="655">plication/json\&quot;: {\n          \&quot;schema\&quot;: {\n            \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalSuiteCr
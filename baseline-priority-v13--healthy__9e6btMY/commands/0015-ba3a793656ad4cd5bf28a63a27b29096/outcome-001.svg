or.md): Connect Claude to your MCPJam account through the hosted MCP s</text><text x="20" y="1015">erver: projects, saved servers, evals, and user testing\n- [Okta SSO &amp; SCIM](https://docs.mcpjam.com/hosted/sso.md): Install MCPJa</text><text x="20" y="1035">m from the Okta Integration Network and configure SAML single sign-on and SCIM provisioning\n- [IP Allowlisting](https://docs.mcpj</text><text x="20" y="1055">am.com/hosted/network.md): The addresses hosted MCPJam connects from, for firewalls and IP allowlists on your MCP and OAuth server</text><text x="20" y="1075">s\n- [Common MCP Errors](https://docs.mcpjam.com/troubleshooting/common-errors.md): Solutions to common MCP server connection and </text><text x="20" y="1095">configuration issues\n- [Error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md): What every MCPJam Inspecto</text><text x="20" y="1115">r error code means, the likely causes, and the next step to fix it.\n- [Changelog](https://docs.mcpjam.com/changelog/overview.md):</text><text x="20" y="1135"> Track the latest updates, features, and improvements to MCPJam Inspector\n- [Home](https://docs.mcpjam.com/inspector/home.md): Or</text><text x="20" y="1155">g-scoped dashboard with activity stats, recommended servers, and quick-start clients\n- [Clients](https://docs.mcpjam.com/inspecto</text><text x="20" y="1175">r/clients.md): Reusable MCP client configurations for testing servers and apps under realistic conditions\n- [Multi-server connect</text><text x="20" y="1195">ions](https://docs.mcpjam.com/inspector/connecting-servers.md): Connect to multiple MCP servers with different transport methods\n</text><text x="20" y="1215">- [Projects](https://docs.mcpjam.com/inspector/projects.md): Group your MCP servers into projects, with the ability to share them </text><text x="20" y="1235">with your team\n- [MCP protocol versions](https://docs.mcpjam.com/inspector/protocol-versions.md): Pin the inspector to a specific</text><text x="20" y="1255"> MCP protocol version, including the 2026-07-28 stateless RC, to test how your server behaves across versions.\n- [Host Compatibil</text><text x="20" y="1275">ity](https://docs.mcpjam.com/inspector/host-compat.md): See which hosts your MCP server will work in (Claude, ChatGPT, Cursor, Cop</text><text x="20" y="1295">ilot) the moment you connect\n- [Skills](https://docs.mcpjam.com/inspector/skills.md): Load and use skills to give your agents the</text><text x="20" y="1315"> context they need to use MCP tools effectively\n- [Playground](https://docs.mcpjam.com/inspector/playground.md): Chat with your M</text><text x="20" y="1335">CP servers, invoke tools by hand, render widgets, and inspect every step, all in one IDE-style workspace\n- [Evaluate](https://doc</text><text x="20" y="1355">s.mcpjam.com/inspector/evals.md): Author test cases for your MCP server, run them across models, and gate pass/fail on determinist</text></g></svg>
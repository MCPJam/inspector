NS_INVALID`. The CLI requires `https://` for the MCPJam API, with `http://` allowed only for loopback. `MCPJAM_API_URL` is</text><text x="20" y="1235"> `http://fixture:8765/api/v1`, which is neither. The self-hosted docs describe the same rule. `whoami` still worked over that URL,</text><text x="20" y="1255"> so only `test` enforces it.\n- **Observed with `--inference byok`:** It failed with `CREDENTIALS_MISSING`. The environment has no</text><text x="20" y="1275"> `ANTHROPIC_API_KEY`, and the suite&#x27;s model is `anthropic/claude-haiku-4.5`. Three environment variables matched my search for `AN</text><text x="20" y="1295">THROPIC` or `OPENAI`. I didn&#x27;t check which ones, so one may be an OpenAI key.\n- **Missing:** Either an `https://` or loopback MCP</text><text x="20" y="1315">Jam API URL, or a provider key for the model.\n- **Not tried:** I could have put a loopback port-forward in front of the fixture A</text><text x="20" y="1335">PI, but that would bypass a deliberate guard on sending the API key over plain http. I didn&#x27;t do it without your approval.\n- **Ne</text><text x="20" y="1355">xt options:**\n  - Get an `https://` or loopback `MCPJAM_API_URL`, then run the command above.\n  - If one of those variables is a</text></g></svg>
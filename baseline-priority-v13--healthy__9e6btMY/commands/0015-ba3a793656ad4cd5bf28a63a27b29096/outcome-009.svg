tp://` to a hos</text><text x="20" y="635">t other than a loopback address.\n\n## Saved logins and API keys\n--\n## Corporate proxy\n\nWhen `HTTPS_PROXY` or `HTTP_PROXY` is </text><text x="20" y="655">set (either case), the CLI process sends its `fetch` requests through the proxy and honors `NO_PROXY`: MCPJam&#x27;s API, model provide</text><text x="20" y="675">rs and MCP servers over HTTP. `HTTPS_PROXY` covers `https` destinations and `HTTP_PROXY` covers `http` ones; with only `HTTP_PROXY</text><text x="20" y="695">` set, `https` requests use it too. `localhost`, `127.0.0.1` and `[::1]` always connect directly, so local MCP servers and the loc</text><text x="20" y="715">al Inspector keep working. A value without a scheme, such as `proxy.corp.com:8080`, means `http://`; a value that is not an http(s</text><text x="20" y="735">) URL is ignored with a warning. Two connections do not use the proxy yet: the relay connection of `mcpjam cloud tunnel` and the `</text><text x="20" y="755">mcpjam oauth` debugging proxy.\n\nThe update check runs in a separate short-lived process that uses Node.js&#x27;s own proxy support. O</text><text x="20" y="775">n Node.js older than 22.21, or 24.x older than 24.5, the check is skipped while a proxy is set rather than sent directly.&quot;, &quot;is_er</text><text x="20" y="795">ror&quot;: false}]}, &quot;parent_tool_use_id&quot;: null, &quot;session_id&quot;: &quot;132d2ec2-e510-4fa8-b3f2-19fb90dce5e5&quot;, &quot;uuid&quot;: &quot;589ec30c-72ee-4749-a7c8</text><text x="20" y="815">-e1086584ca96&quot;, &quot;timestamp&quot;: &quot;2026-11-15T02:10:23.864Z&quot;, &quot;tool_use_result&quot;: {&quot;stdout&quot;: &quot;http://fixture:8765/api/v1\n| Invalid | Co</text><text x="20" y="835">mmands that can contact MCPJam exit `2` (`MANAGED_SETTINGS_INVALID`), naming the file and the problem. Nothing is sent to MCPJam o</text><text x="20" y="855">r its telemetry. Other commands still run. |\n\nThe file is invalid when it is not JSON, when `version`, `apiUrl` or `lock` is mis</text><text x="20" y="875">sing or has the wrong type, when `version` is not `1`, when it has any other key, when it cannot be read, when `apiUrl` has creden</text><text x="20" y="895">tials, a query or a fragment, or when `apiUrl` uses plain `http://` to a host other than a loopback address.\n\n## Saved logins an</text><text x="20" y="915">d API keys\n--\n## Corporate proxy\n\nWhen `HTTPS_PROXY` or `HTTP_PROXY` is set (either case), the CLI process sends its `fetch` r</text><text x="20" y="935">equests through the proxy and honors `NO_PROXY`: MCPJam&#x27;s API, model providers and MCP servers over HTTP. `HTTPS_PROXY` covers `ht</text><text x="20" y="955">tps` destinations and `HTTP_PROXY` covers `http` ones; with only `HTTP_PROXY` set, `https` requests use it too. `localhost`, `127.</text><text x="20" y="975">0.0.1` and `[::1]` always connect directly, so local MCP servers and the local Inspector keep working. A value without a scheme, s</text><text x="20" y="995">uch as `proxy.corp.com:8080`, means `http://`; a value that is not an http(s) URL is ignored with a warning. Two connections do no</text><text x="20" y="1015">t use the proxy yet: the relay connection of `mcpjam cloud tunnel` and the `mcpjam oauth` debugging proxy.\n\nThe update check run</text><text x="20" y="1035">s in a separate short-lived process that uses Node.js&#x27;s own proxy support. On Node.js older than 22.21, or 24.x older than 24.5, t</text><text x="20" y="1055">he check is skipped while a proxy is set rather than sent directly.&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOut</text><text x="20" y="1075">putExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_01JKvgEyfrkqNUcAiZt34mLo&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, </text><text x="20" y="1095">&quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mo
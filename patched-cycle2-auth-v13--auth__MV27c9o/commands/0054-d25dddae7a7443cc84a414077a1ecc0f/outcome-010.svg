<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d25dddae7a7443cc84a414077a1ecc0f — page 10</text><text x="20" y="75">## Shared server flags</text><text x="20" y="95"></text><text x="20" y="115">Every `server` subcommand accepts these flags for specifying how to connect:</text><text x="20" y="135"></text><text x="20" y="155">| Flag | Description |</text><text x="20" y="175">| - | - |</text><text x="20" y="195">| `--transport &lt;transport&gt;` | Explicit transport type (`http` or `stdio`) |</text><text x="20" y="215">| `--url &lt;url&gt;` | HTTP MCP server URL |</text><text x="20" y="235">| `--access-token &lt;token&gt;` | Bearer access token |</text><text x="20" y="255">| `--oauth-access-token &lt;token&gt;` | OAuth bearer access token |</text><text x="20" y="275">| `--refresh-token &lt;token&gt;` | OAuth refresh token |</text><text x="20" y="295">| `--client-id &lt;id&gt;` | OAuth client ID (used with `--refresh-token`) |</text><text x="20" y="315">| `--client-secret &lt;secret&gt;` | OAuth client secret (used with `--refresh-token`) |</text><text x="20" y="335">| `--credentials-file &lt;path&gt;` | Load OAuth credentials from a file created by `oauth login --credentials-out` or `oauth conformanc</text><text x="20" y="355">e --credentials-out` |</text><text x="20" y="375">| `--header &lt;header&gt;` | HTTP header in `Key: Value` format (repeatable) |</text><text x="20" y="395">| `--client-capabilities &lt;json&gt;` | Client capabilities as inline JSON, `@path`, or `-` for stdin |</text><text x="20" y="415">| `--command &lt;command&gt;` | Command for a stdio server |</text><text x="20" y="435">| `--args &lt;arg...&gt;` | Preferred stdio command arguments |</text><text x="20" y="455">| `--command-args &lt;arg&gt;` | Legacy stdio command argument (repeatable) |</text><text x="20" y="475">| `-e, --env &lt;env...&gt;` | Stdio environment `KEY=[REDACTED] values |</text><text x="20" y="495">| `--cwd &lt;path&gt;` | Working directory for the stdio child process |</text><text x="20" y="515"></text><text x="20" y="535">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="555">`-e/--env` to add values or override inherited ones, and `--cwd` when the</text><text x="20" y="575">command must run from a project directory.</text><text x="20" y="595">If you pass `--transport`, the CLI validates that it matches the target flags</text><text x="20" y="615">you provided instead of silently inferring the transport.</text><text x="20" y="635"></text><text x="20" y="655">## Common patterns</text><text x="20" y="675"></text><text x="20" y="695">### Triage an unknown server</text><text x="20" y="715"></text><text x="20" y="735">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="755"># Start with doctor</text><text x="20" y="775">mcpjam server doctor --url https://unknown-server.com/mcp</text><text x="20" y="795"></text><text x="20" y="815"># If it returns oauth_required, login first</text><text x="20" y="835">mcpjam oauth login --url https://unknown-server.com/mcp \</text><text x="20" y="855">  --protocol-version 2025-11-25 --registration dcr</text><text x="20" y="875"></text><text x="20" y="895"># Then re-run with the token</text><text x="20" y="915">mcpjam server doctor --url https://unknown-server.com/mcp --oauth-access-token $TOKEN</text><text x="20" y="935">```</text><text x="20" y="955"></text><text x="20" y="975">For multi-command sessions, save credentials to a file to avoid re-extracting the token:</text><text x="20" y="995"></text><text x="20" y="1015">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1035">mcpjam oauth login --url https://unknown-server.com/mcp --credentials-out creds.json</text><text x="20" y="1055">mcpjam server doctor --url https://unknown-server.com/mcp --credentials-file creds.json</text><text x="20" y="1075">mcpjam tools list --url https://unknown-server.com/mcp --credentials-file creds.json</text><text x="20" y="1095">```</text><text x="20" y="1115"></text><text x="20" y="1135">### Compare before/after a deploy</text><text x="20" y="1155"></text><text x="20" y="1175">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1195"># Capture a snapshot before</text><text x="20" y="1215">mcpjam server export --url https://your-server.com/mcp --access-token $TOKEN &gt; before.json</text><text x="20" y="1235"></text><text x="20" y="1255"># Deploy...</text><text x="20" y="1275"></text><text x="20" y="1295"># Capture after</text><text x="20" y="1315">mcpjam server export --url https://your-server.com/mcp --access-token $TOKEN &gt; after.json</text><text x="20" y="1335"></text><text x="20" y="1355"># Diff</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d25dddae7a7443cc84a414077a1ecc0f — page 14</text><text x="20" y="75"> in the automation browser first and run `tools call --ui --no-open --quiet --format json`. Add `--attach-only` when startup, brow</text><text x="20" y="95">ser opening, and discovery should be disallowed. Agents should confirm `inspectorRender.status === &quot;rendered&quot;` before assuming the</text><text x="20" y="115"> UI is visible, and use `inspectorRender.remediation` to recover from skipped renders. Default non-TTY `--ui` runs do not open a b</text><text x="20" y="135">rowser unless `--open` is passed. TTY stderr runs print the Playground URL and initial wait message unless `--quiet` is set; the e</text><text x="20" y="155">lapsed-seconds heartbeat only appears when stderr is a TTY. The normal JSON output is compact; pass `--debug-out &lt;path&gt;` for the f</text><text x="20" y="175">ull render envelope.</text><text x="20" y="195"></text><text x="20" y="215">For a local stdio server:</text><text x="20" y="235"></text><text x="20" y="255">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="275">mcpjam tools list \</text><text x="20" y="295">  --command npx \</text><text x="20" y="315">  --args -y @modelcontextprotocol/server-everything \</text><text x="20" y="335">  --cwd $PWD \</text><text x="20" y="355">  -e DEBUG=1</text><text x="20" y="375">```</text><text x="20" y="395"></text><text x="20" y="415">## Resources</text><text x="20" y="435"></text><text x="20" y="455">### List resources</text><text x="20" y="475"></text><text x="20" y="495">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="515">mcpjam resources list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="535">```</text><text x="20" y="555"></text><text x="20" y="575">### Read a resource</text><text x="20" y="595"></text><text x="20" y="615">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="635">mcpjam resources read --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="655">  --resource-uri &quot;file:///docs/readme.md&quot;</text><text x="20" y="675">```</text><text x="20" y="695"></text><text x="20" y="715">Use `resources read --resource-uri ui://...` when you need to inspect raw widget HTML or other UI resources directly.</text><text x="20" y="735"></text><text x="20" y="755">### List resource templates</text><text x="20" y="775"></text><text x="20" y="795">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="815">mcpjam resources templates --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="835">```</text><text x="20" y="855"></text><text x="20" y="875">## Prompts</text><text x="20" y="895"></text><text x="20" y="915">### List prompts</text><text x="20" y="935"></text><text x="20" y="955">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="975">mcpjam prompts list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="995">```</text><text x="20" y="1015"></text><text x="20" y="1035">### Get a prompt</text><text x="20" y="1055"></text><text x="20" y="1075">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1095">mcpjam prompts get --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="1115">  --prompt-name summarize \</text><text x="20" y="1135">  --prompt-args &#x27;{&quot;text&quot;: &quot;Hello world&quot;}&#x27;</text><text x="20" y="1155">```</text><text x="20" y="1175"></text><text x="20" y="1195">## Common patterns</text><text x="20" y="1215"></text><text x="20" y="1235">### Enumerate the full server surface</text><text x="20" y="1255"></text><text x="20" y="1275">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1295"># One-shot: doctor already sweeps everything</text><text x="20" y="1315">mcpjam server doctor --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="1335"></text><text x="20" y="1355"># Or individually for focused output</text></g></svg>
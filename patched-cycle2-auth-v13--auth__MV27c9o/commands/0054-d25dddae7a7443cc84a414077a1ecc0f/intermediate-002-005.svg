<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1125"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.248917818069458s — page 5</text><text x="20" y="75"># Call it</text><text x="20" y="95">mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="115">  --tool-name search_docs \</text><text x="20" y="135">  --tool-args @params.json \</text><text x="20" y="155">  --quiet \</text><text x="20" y="175">  --format json</text><text x="20" y="195">```</text><text x="20" y="215"></text><text x="20" y="235">For generated payloads, pipe JSON through stdin:</text><text x="20" y="255"></text><text x="20" y="275">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="295">echo &#x27;{&quot;query&quot;:&quot;setup guide&quot;}&#x27; | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="315">  --tool-name search_docs --tool-args - --quiet --format json</text><text x="20" y="335">```</text><text x="20" y="355"></text><text x="20" y="375">`--tool-args-stdin` is equivalent to `--tool-args -` and cannot be combined with `--tool-args` or `--params` in the same command:</text><text x="20" y="395"></text><text x="20" y="415">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="435">generate-params | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="455">  --tool-name search_docs --tool-args-stdin --quiet --format json</text><text x="20" y="475">```</text><text x="20" y="495"></text><text x="20" y="515">### Using a credentials file</text><text x="20" y="535"></text><text x="20" y="555">Instead of passing `--access-token` to every command, save credentials once and reuse the file:</text><text x="20" y="575"></text><text x="20" y="595">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="615"># Login and save</text><text x="20" y="635">mcpjam oauth login --url https://your-server.com/mcp --credentials-out creds.json</text><text x="20" y="655"></text><text x="20" y="675"># Reuse everywhere</text><text x="20" y="695">mcpjam tools list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="715">mcpjam resources list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="735">mcpjam tools call --url https://your-server.com/mcp --credentials-file creds.json \</text><text x="20" y="755">  --tool-name search_docs --tool-args @params.json --quiet --format json</text><text x="20" y="775">```</text><text x="20" y="795"></text><text x="20" y="815">### No-auth servers</text><text x="20" y="835"></text><text x="20" y="855">For servers that don&#x27;t require authentication (like `mcp.excalidraw.com/mcp`), omit the auth flags:</text><text x="20" y="875"></text><text x="20" y="895">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="915">mcpjam tools list --url https://mcp.excalidraw.com/mcp</text><text x="20" y="935">mcpjam tools call --url https://mcp.excalidraw.com/mcp \</text><text x="20" y="955">  --tool-name read_me</text><text x="20" y="975">```</text><text x="20" y="995"></text><text x="20" y="1015">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="1035">`-e/--env` to add values or override inherited ones for local subprocesses.</text><text x="20" y="1055"></text><text x="20" y="1075"></text><text x="20" y="1095">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text></g></svg>
\\n\\n`environmentId` requires `suiteId`: an en</text><text x="20" y="775">vironment is launchable only through a suite that has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so a</text><text x="20" y="795">n environment run on a not-yet-created suite could never be satisfied. `environmentId` and `serverIds` are mutually exclusive.\&quot;, </text><text x="20" y="815">\&quot;anyOf\&quot;: [{\&quot;required\&quot;: [\&quot;suiteId\&quot;]}, {\&quot;required\&quot;: [\&quot;suiteName\&quot;, \&quot;tests\&quot;, \&quot;serverIds\&quot;], \&quot;properties\&quot;: {\&quot;tests\&quot;: {</text><text x="20" y="835">\&quot;minItems\&quot;: 1}}}], \&quot;properties\&quot;: {\&quot;suiteId\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Existing suite to rerun. A bare `suit</text><text x="20" y="855">eId` with no `tests` reruns the suite exactly as configured.\&quot;}, \&quot;hosts\&quot;: {\&quot;type\&quot;: \&quot;array\&quot;, \&quot;description\&quot;: \&quot;Attachments f</text><text x="20" y="875">or a new inline suite only. Each host is a project host name or ID; servers optionally selects bound server names or IDs. A sole h</text><text x="20" y="895">ost is selected automatically. Omit for the project default. Cannot be combined with suiteId.\&quot;, \&quot;items\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;,</text><text x="20" y="915"> \&quot;required\&quot;: [\&quot;host\&quot;], \&quot;properties\&quot;: {\&quot;host\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;minLength\&quot;: 1}, \&quot;servers\&quot;: {\&quot;type\&quot;: \&quot;array\&quot;,</text><text x="20" y="935"> \&quot;items\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;minLength\&quot;: 1}}}}}, \&quot;suiteName\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Name for a new </text><text x="20" y="955">suite. Required (non-empty) when no `suiteId` is given.\&quot;}, \&quot;suiteDescription\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}, \&quot;tests\&quot;: {\&quot;type\&quot;: \&quot;</text><text x="20" y="975">array\&quot;, \&quot;maxItems\&quot;: 100, \&quot;description\&quot;: \&quot;Inline test cases to upsert into the suite before running.\&quot;, \&quot;items\&quot;: {\&quot;$ref\&quot;:</text><text x="20" y="995"> \&quot;#/components/schemas/EvalTestCase\&quot;}}, \&quot;serverIds\&quot;: {\&quot;type\&quot;: \&quot;array\&quot;, \&quot;minItems\&quot;: 1, \&quot;description\&quot;: \&quot;Servers (by ID)</text><text x="20" y="1015"> the run connects to. Required when creating a new suite; optional on reruns: when omitted, the run connects the suite&#x27;s saved ser</text><text x="20" y="1035">ver selection (the set its snapshot references). A rerun of a suite with no saved selection is rejected with `VALIDATION_ERROR` (`</text><text x="20" y="1055">details.reason: \\\&quot;NO_SAVED_SERVER_SELECTION\\\&quot;`). Rejected outright for a suite with attached environments (`details.reason: \\</text><text x="20" y="1075">\&quot;ENVIRONMENT_SERVERS_NOT_OVERRIDABLE\\\&quot;`): the environment supplies a closed set that a server override cannot change, so accept</text><text x="20" y="1095">ing one would connect a different set than the run is stamped with.\&quot;, \&quot;items\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}}, \&quot;serverNames\&quot;: {\&quot;typ</text><text x="20" y="1115">e\&quot;: \&quot;array\&quot;, \&quot;description\&quot;: \&quot;Optional display names, parallel to `serverIds`.\&quot;, \&quot;items\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}}, \&quot;suite</text><text x="20" y="1135">Rerun\&quot;: {\&quot;type\&quot;: \&quot;boolean\&quot;, \&quot;description\&quot;: \&quot;When true, skip per-case upsert and rerun the persisted suite. A bare `suiteId</text><text x="20" y="1155">` with no `tests` is always treated as a rerun.\&quot;}, \&quot;modelApiKeys\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;Optional per-provi</text><text x="20" y="1175">der model API keys (e.g. `{ \\\&quot;anthropic\\\&quot;: \\\&quot;sk-ant-\\u2026\\\&quot; }`). Falls back to your organization&#x27;s configured providers </text><text x="20" y="1195">when omitted.\&quot;, \&quot;additionalProperties\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}}, \&quot;notes\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}, \&quot;passCriteria\&quot;: {\&quot;type\&quot;</text><text x="20" y="1215">: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;The floor a run must clear, as a PERCENT in [0, 100]: 80 means 80%. `minimumPassRatePercent` is t</text><text x="20" y="1235">he canonical spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISA</text><text x="20" y="1255">MBIGUATES THE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the eva</text><text x="20" y="1275">luator can act on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake an</text><text x="20" y="1295">d would silently make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this</text><text x="20" y="1315"> suite/run floor is not.\&quot;, \&quot;properties\&quot;: {\&quot;minimumPassRatePercent\&quot;: {\&quot;type\&quot;: \&quot;number\&quot;, \&quot;minimum\&quot;: 0, \&quot;maximum\&quot;: 100, </text><text x="20" y="1335">\&quot;description\&quot;: \&quot;A percent in [0, 100]. The whole range is usable, sub-1 values included: the unit is in the field name, so noth</text><text x="20" y="1355">ing is ambiguous.\&quot;}, \&quot;minimumPassRate\&quot;: {\&quot;type\&quot;: \&quot;number\&quot;, \&quot;minimum\&quot;: 0, \&quot;maximum\&quot;: 100, \&quot;deprecated\&quot;: true, \&quot;descri</text></g></svg>
t and invoke MCP server to</text><text x="20" y="275">ols\n  resources              List and read MCP resources\n  skills                 Inspect the Agent Skills an MCP server serves\</text><text x="20" y="295">n                         (SEP-2640). For your project&#x27;s Cloud Skills, see\n                         `mcpjam cloud skills`.\n  sub</text><text x="20" y="315">scriptions          Open a long-lived MCP subscription and stream its\n                         notifications (2026-07-28 subscrip</text><text x="20" y="335">tions/listen, with a\n                         legacy fallback)\n  compat [options]       Check whether an MCP server&#x27;s tools and </text><text x="20" y="355">widgets work on\n                         each AI host (Claude, ChatGPT, Cursor, Copilot, Codex,\n                         Goose, </text><text x="20" y="375">…)\n  prompts                List and fetch MCP prompts\n  apps                   Validate MCP Apps metadata and resource wiring\n</text><text x="20" y="395">  tasks                  Create, inspect and drive MCP Tasks (legacy 2025-11-25\n                         and SEP-2663), and valid</text><text x="20" y="415">ate a server&#x27;s tasks wire\n                         behavior\n  events                 List, poll, watch, subscribe to and conform</text><text x="20" y="435">ance-check\n                         MCP Events (triggers, draft@28ec35e)\n  oauth                  Run MCP OAuth login, proxy, an</text><text x="20" y="455">d conformance flows\n  xaa                    Run the Cross-App Access (ID-JAG) debugger against an\n                         MCP </text><text x="20" y="475">server\n  protocol               MCP protocol inspection and conformance checks\n  conformance            Run MCPJam conformance s</text><text x="20" y="495">uites and optionally upload\n                         results\n  readiness              Grade a server or plugin against a publish</text><text x="20" y="515">er&#x27;s\n                        
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">fc384b3420b045e1a35bd68779d0cf51 — page 1</text><text x="20" y="75">$ /bin/bash -c source /logs/agent/sessions/shell-snapshots/snapshot-bash-1794708707430-6t85qi.sh 2&gt;/dev/null || true &amp;&amp; \builtin s</text><text x="20" y="95">hopt -u extglob 2&gt;/dev/null || true &amp;&amp; { \builtin unalias -- &#x27;which&#x27;; \builtin unset -f -- &#x27;which&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; {</text><text x="20" y="115"> \builtin unalias -- &#x27;unsetenv&#x27;; \builtin unset -f -- &#x27;unsetenv&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; eval &#x27;cd /workspace; H=&quot;Authorizati</text><text x="20" y="135">on: Bearer $MCPJAM_API_KEY&quot;; B=$MCPJAM_API_URL; curl -s -H &quot;$H&quot; $B/organizations/org_fixture/spend-budget; echo; curl -s -H &quot;$H&quot; $</text><text x="20" y="155">B/projects/project_fixture/eval-suites/suite_fixture/cases | head -c 800; echo; curl -s https://docs.mcpjam.com/api-reference/eval</text><text x="20" y="175">-runs/create-an-eval-run-async.md | sed -n &#x27;&quot;&#x27;&quot;&#x27;1,25p;/requestBody/,/responses/p&#x27;&quot;&#x27;&quot;&#x27; | head -c 3500&#x27; &lt; /dev/null &amp;&amp; pwd -P &gt;| /tm</text><text x="20" y="195">p/claude-7917-cwd</text><text x="20" y="215">{&quot;code&quot;: &quot;NOT_FOUND&quot;, &quot;message&quot;: &quot;Synthetic fixture does not implement this route.&quot;}</text><text x="20" y="235">{&quot;items&quot;: [{&quot;id&quot;: &quot;case_add&quot;, &quot;title&quot;: &quot;add 2 and 3 returns 5&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;add&quot;, &quot;kind&quot;: &quot;toolCall&quot;, &quot;toolName&quot;: &quot;add&quot;, &quot;ar</text><text x="20" y="255">guments&quot;: {&quot;a&quot;: 2, &quot;b&quot;: 3}}], &quot;expectedOutput&quot;: &quot;5&quot;}]}</text><text x="20" y="275">&gt; ## Documentation Index</text><text x="20" y="295">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="315">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="335"></text><text x="20" y="355"># Create an eval run (async)</text><text x="20" y="375"></text><text x="20" y="395">&gt; Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202` immed</text><text x="20" y="415">iately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The ru</text><text x="20" y="435">n appears live in the hosted UI Runs tab, tagged `source: &quot;api&quot;`.</text><text x="20" y="455"></text><text x="20" y="475">A bare `suiteId` with no inline tests reruns the suite as configured. Per-organization concurrency is capped (default 2 concurrent</text><text x="20" y="495"> runs); exceeding it returns `429` with `details.reason: &quot;CONCURRENT_RUN_LIMIT&quot;`.</text><text x="20" y="515"></text><text x="20" y="535">For a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the resolv</text><text x="20" y="555">ed `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.</text><text x="20" y="575"></text><text x="20" y="595">To make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from</text><text x="20" y="615"> a CI job). Both are labels: `source` is stamped `api` either way.</text><text x="20" y="635"></text><text x="20" y="655"></text><text x="20" y="675"></text><text x="20" y="695">## OpenAPI</text><text x="20" y="715"></text><text x="20" y="735">````yaml /reference/openapi.json post /projects/{projectId}/eval-runs</text><text x="20" y="755">openapi: 3.1.0</text><text x="20" y="775">info:</text><text x="20" y="795">  title: MCPJam API</text><text x="20" y="815">  version: 1.0.0-preview</text><text x="20" y="835">  description: &gt;-</text><text x="20" y="855">    Programmatic access to MCP servers saved in your MCPJam projects: live</text><text x="20" y="875">      requestBody:</text><text x="20" y="895">        required: true</text><text x="20" y="915">        content:</text><text x="20" y="935">          application/json:</text><text x="20" y="955">            schema:</text><text x="20" y="975">              $ref: &#x27;#/components/schemas/EvalRunCreateRequest&#x27;</text><text x="20" y="995">            example:</text><text x="20" y="1015">              suiteName: smoke</text><text x="20" y="1035">              serverIds:</text><text x="20" y="1055">                - srv_abc123</text><text x="20" y="1075">              tests:</text><text x="20" y="1095">                - title: echo works</text><text x="20" y="1115">                  runs: 1</text><text x="20" y="1135">                  model: anthropic/claude-haiku-4.5</text><text x="20" y="1155">                  provider: anthropic</text><text x="20" y="1175">                  steps:</text><text x="20" y="1195">                    - id: s1</text><text x="20" y="1215">                      kind: prompt</text><text x="20" y="1235">                      prompt: Use the echo tool to say hi</text><text x="20" y="1255">                    - id: s2</text><text x="20" y="1275">                      kind: assert</text><text x="20" y="1295">                      assertion:</text><text x="20" y="1315">                        type: toolCalledWith</text><text x="20" y="1335">                        toolName: echo</text><text x="20" y="1355">                        args:</text></g></svg>
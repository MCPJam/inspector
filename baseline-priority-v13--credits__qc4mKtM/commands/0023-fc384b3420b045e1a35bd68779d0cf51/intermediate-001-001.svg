<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1245"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.5436110496520996s — page 1</text><text x="20" y="75">&gt; ## Documentation Index</text><text x="20" y="95">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="115">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="135"></text><text x="20" y="155"># Create an eval run (async)</text><text x="20" y="175"></text><text x="20" y="195">&gt; Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202` immed</text><text x="20" y="215">iately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The ru</text><text x="20" y="235">n appears live in the hosted UI Runs tab, tagged `source: &quot;api&quot;`.</text><text x="20" y="255"></text><text x="20" y="275">A bare `suiteId` with no inline tests reruns the suite as configured. Per-organization concurrency is capped (default 2 concurrent</text><text x="20" y="295"> runs); exceeding it returns `429` with `details.reason: &quot;CONCURRENT_RUN_LIMIT&quot;`.</text><text x="20" y="315"></text><text x="20" y="335">For a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the resolv</text><text x="20" y="355">ed `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.</text><text x="20" y="375"></text><text x="20" y="395">To make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from</text><text x="20" y="415"> a CI job). Both are labels: `source` is stamped `api` either way.</text><text x="20" y="435"></text><text x="20" y="455"></text><text x="20" y="475"></text><text x="20" y="495">## OpenAPI</text><text x="20" y="515"></text><text x="20" y="535">````yaml /reference/openapi.json post /projects/{projectId}/eval-runs</text><text x="20" y="555">openapi: 3.1.0</text><text x="20" y="575">info:</text><text x="20" y="595">  title: MCPJam API</text><text x="20" y="615">  version: 1.0.0-preview</text><text x="20" y="635">  description: &gt;-</text><text x="20" y="655">    Programmatic access to MCP servers saved in your MCPJam projects: live</text><text x="20" y="675">      requestBody:</text><text x="20" y="695">        required: true</text><text x="20" y="715">        content:</text><text x="20" y="735">          application/json:</text><text x="20" y="755">            schema:</text><text x="20" y="775">              $ref: &#x27;#/components/schemas/EvalRunCreateRequest&#x27;</text><text x="20" y="795">            example:</text><text x="20" y="815">              suiteName: smoke</text><text x="20" y="835">              serverIds:</text><text x="20" y="855">                - srv_abc123</text><text x="20" y="875">              tests:</text><text x="20" y="895">                - title: echo works</text><text x="20" y="915">                  runs: 1</text><text x="20" y="935">                  model: anthropic/claude-haiku-4.5</text><text x="20" y="955">                  provider: anthropic</text><text x="20" y="975">                  steps:</text><text x="20" y="995">                    - id: s1</text><text x="20" y="1015">                      kind: prompt</text><text x="20" y="1035">                      prompt: Use the echo tool to say hi</text><text x="20" y="1055">                    - id: s2</text><text x="20" y="1075">                      kind: assert</text><text x="20" y="1095">                      assertion:</text><text x="20" y="1115">                        type: toolCalledWith</text><text x="20" y="1135">                        toolName: echo</text><text x="20" y="1155">                        args:</text><text x="20" y="1175">                          args:</text><text x="20" y="1195">                            text: hi</text><text x="20" y="1215">      responses:</text></g></svg>
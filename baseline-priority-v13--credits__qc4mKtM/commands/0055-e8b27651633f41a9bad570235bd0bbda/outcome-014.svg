<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">e8b27651633f41a9bad570235bd0bbda — page 14</text><text x="20" y="75"> \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests reruns the suite as configured. Per-organization concurrency is capped (defaul</text><text x="20" y="95">t 2 concurrent runs); exceeding it returns `429` with `details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached pro</text><text x="20" y="115">ject environments, pass `environmentId` to choose which one the run uses; the `202` echoes the resolved `environment` triple, and </text><text x="20" y="135">`GET /eval-runs/{runId}` reports the same triple for the life of the run.\n\nTo make the run readable as something more specific t</text><text x="20" y="155">han `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api</text><text x="20" y="175">` either way.\n\n\n\n## OpenAPI\n\n````yaml /reference/openapi.json post /projects/{projectId}/eval-runs\nopenapi: 3.1.0\ninfo:\n </text><text x="20" y="195"> title: MCPJam API\n  version: 1.0.0-preview\n  description: &gt;-\n    Programmatic access to MCP servers saved in your MCPJam proje</text><text x="20" y="215">cts: live\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n       </text><text x="20" y="235">       $ref: &#x27;#/components/schemas/EvalRunCreateRequest&#x27;\n            example:\n              suiteName: smoke\n              serv</text><text x="20" y="255">erIds:\n                - srv_abc123\n              tests:\n                - title: echo works\n                  runs: 1\n      </text><text x="20" y="275">            model: anthropic/claude-haiku-4.5\n                  provider: anthropic\n                  steps:\n                  </text><text x="20" y="295">  - id: s1\n                      kind: prompt\n                      prompt: Use the echo tool to say hi\n                    - i</text><text x="20" y="315">d: s2\n                      kind: assert\n                      assertion:\n                        type: toolCalledWith\n       </text><text x="20" y="335">                 toolName: echo\n                        args:\n                          args:\n                            text:</text><text x="20" y="355"> hi\n      responses:&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;i</text><text x="20" y="375">d&quot;: &quot;toolu_01VmB13SiZxGgN1s5U7zKss7&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="395">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3uMS1LMkSw5u5J8NZLc&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="415">assistant&quot;, &quot;content&quot;: [], &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;usage&quot;: {&quot;input_t</text><text x="20" y="435">okens&quot;: 2, &quot;cache_creation_input_tokens&quot;: 1192, &quot;cache_read_input_tokens&quot;: 29529, &quot;cache_creation&quot;: {&quot;ephemeral_5m_input_tokens&quot;: </text><text x="20" y="455">0, &quot;ephemeral_1h_input_tokens&quot;: 1192}, &quot;output_tokens&quot;: 3, &quot;service_tier&quot;: &quot;standard&quot;, &quot;inference_geo&quot;: &quot;global&quot;, &quot;speed&quot;: &quot;standa</text><text x="20" y="475">rd&quot;}, &quot;
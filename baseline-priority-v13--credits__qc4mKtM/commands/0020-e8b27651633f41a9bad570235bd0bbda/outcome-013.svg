ame\&quot;: \&quot;Arithmetic\&quot;, \&quot;projectId\&quot;: \&quot;project_fixture\&quot;, \&quot;transportType\&quot;: \&quot;http\&quot;, \&quot;url\&quot;: \&quot;http://fixture:8765/</text><text x="20" y="415">mcp\&quot;, \&quot;enabled\&quot;: true, \&quot;useOAuth\&quot;: false, \&quot;hasClientSecret\&quot;: false}]}\n--- projects/project_fixture/eval-suites\n{\&quot;items\&quot;</text><text x="20" y="435">: [{\&quot;id\&quot;: \&quot;suite_fixture\&quot;, \&quot;name\&quot;: \&quot;Arithmetic smoke\&quot;, \&quot;projectId\&quot;: \&quot;project_fixture\&quot;, \&quot;description\&quot;: \&quot;Synthetic fi</text><text x="20" y="455">xture: add 2 and 3 and assert 5.\&quot;, \&quot;environment\&quot;: {\&quot;servers\&quot;: []}, \&quot;executionConfig\&quot;: null, \&quot;hosts\&quot;: [], \&quot;environmentIds</text><text x="20" y="475">\&quot;: [], \&quot;settings\&quot;: {\&quot;policy\&quot;: \&quot;legacy\&quot;, \&quot;minimumIterations\&quot;: 1}, \&quot;schedule\&quot;: {}, \&quot;createdAt\&quot;: 1, \&quot;updatedAt\&quot;: 2}]}\</text><text x="20" y="495">n--- models\n{\&quot;code\&quot;: \&quot;NOT_FOUND\&quot;, \&quot;message\&quot;: \&quot;Synthetic fixture does not implement this route.\&quot;}&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interru</text><text x="20" y="515">pted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_011hG48hE1vdEqGXE6buTx5m&quot;, &quot;permiss</text><text x="20" y="535">ion_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="555">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3uMDEto7G6XT2m6RvxV&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="575">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;tool_use&quot;, &quot;id&quot;: &quot;toolu_01VmB13SiZxGgN1s5U7zKss7&quot;, &quot;name&quot;: &quot;Bash&quot;, &quot;input&quot;: {&quot;command&quot;: &quot;cd /wor</text><text x="20" y="595">kspace; H=\&quot;Authorization: Bearer $MCPJAM_API_KEY\&quot;; B=$MCPJAM_API_URL; curl -s -H \&quot;$H\&quot; $B/organizations/org_fixture/spend-budge</text><text x="20" y="615">t; echo; curl -s -H \&quot;$H\&quot; $B/projects/project_fixture/eval-suites/suite_fixture/cases | head -c 800; echo; curl -s https://docs.m</text><text x="20" y="635">cpjam.com/api-reference/eval-runs/create-an-eval-run-async.md | sed -n &#x27;1,25p;/requestBody/,/responses/p&#x27; | head -c 3500&quot;}, &quot;calle</text><text x="20" y="655">r&quot;: {&quot;type&quot;: &quot;direct&quot;}}], &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;usage&quot;: {&quot;input_to</text><text x="20" y="675">kens&quot;: 2, &quot;cache_creation_input_tokens&quot;: 806, &quot;cache_read_input_tokens&quot;: 28723, &quot;cache_creation&quot;: {&quot;ephemeral_5m_input_tokens&quot;: 0,</text><text x="20" y="695"> &quot;ephemeral_1h_input_tokens&quot;: 806}, &quot;output_tokens&quot;: 16, &quot;service_tier&quot;: &quot;standard&quot;, &quot;inference_geo&quot;: &quot;global&quot;, &quot;speed&quot;: &quot;standard</text><text x="20" y="715">&quot;}, &quot;input_transformations&quot;: [], &quot;diagnostics&quot;: null, &quot;context_management&quot;: null}, &quot;parent_tool_use_id&quot;: null, &quot;session_id&quot;: &quot;245d</text><text x="20" y="735">82fa-10c5-4475-919a-57cba0a57a7b&quot;, &quot;uuid&quot;: &quot;79724d06-b67e-4941-87cd-d456820d4a4b&quot;, &quot;timestamp&quot;: &quot;2026-11-15T02:12:03.169Z&quot;, &quot;reque</text><text x="20" y="755">st_id&quot;: &quot;req_011Ch3uMD3yFKZXrJ277GrmN&quot;}</text><text x="20" y="775">{&quot;type&quot;: &quot;user&quot;, &quot;message&quot;: {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: [{&quot;tool_use_id&quot;: &quot;toolu_01VmB13SiZxGgN1s5U7zKss7&quot;, &quot;type&quot;: &quot;tool_result&quot;, </text><text x="20" y="795">&quot;content&quot;: &quot;{\&quot;code\&quot;: \&quot;NOT_FOUND\&quot;, \&quot;message\&quot;: \&quot;Synthetic fixture does not implement this route.\&quot;}\n{\&quot;items\&quot;: [{\&quot;id\&quot;: \&quot;</text><text x="20" y="815">case_add\&quot;, \&quot;title\&quot;: \&quot;add 2 and 3 returns 5\&quot;, \&quot;steps\&quot;: [{\&quot;id\&quot;: \&quot;add\&quot;, \&quot;kind\&quot;: \&quot;toolCall\&quot;, \&quot;toolName\&quot;: \&quot;add\&quot;, \&quot;a</text><text x="20" y="835">rguments\&quot;: {\&quot;a\&quot;: 2, \&quot;b\&quot;: 3}}], \&quot;expectedOutput\&quot;: \&quot;5\&quot;}]}\n&gt; ## Documentation Index\n&gt; Fetch the complete documentation ind</text><text x="20" y="855">ex at: https://docs.mcpjam.com/llms.txt\n&gt; Use this file to discover all available pages before exploring further.\n\n# Create an </text><text x="20" y="875">eval run (async)\n\n&gt; Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and </text><text x="20" y="895">responds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` </text><text x="20" y="915">for progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests r</text><text x="20" y="935">eruns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with</text><text x="20" y="955"> `details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose whi</text><text x="20" y="975">ch one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for </text><text x="20" y="995">the life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher`</text><text x="20" y="1015"> (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.\n\n\n\n## OpenAPI\n\n````yaml /referenc</text><text x="20" y="1035">e/openapi.json post /projects/{projectId}/eval-runs\nopenapi: 3.1.0\ninfo:\n  title: MCPJam API\n  version: 1.0.0-preview\n  descr</text><text x="20" y="1055">iption: &gt;-\n    Programmatic access to MCP servers saved in your MCPJam projects: live\n      requestBody:\n        required: true</text><text x="20" y="1075">\n        content:\n          application/json:\n            schema:\n              $ref: &#x27;#/components/schemas/EvalRunCreateReque</text><text x="20" y="1095">st&#x27;\n            example:\n              suiteName: smoke\n              serverIds:\n                - srv_abc123\n              t</text><text x="20" y="1115">ests:\n                - title: echo works\n                  runs: 1\n                  model: anthropic/claude-haiku-4.5\n      </text><text x="20" y="1135">            provider: anthropic\n                  steps:\n                    - id: s1\n                      kind: prompt\n     </text><text x="20" y="1155">                 prompt: Use the echo tool to say hi\n                    - id: s2\n                      kind: assert\n          </text><text x="20" y="1175">            assertion:\n                        type: toolCalledWith\n                        toolName: echo\n                    </text><text x="20" y="1195">    args:\n                          args:\n                            text: hi\n      responses:&quot;, &quot;is_error&quot;: false}]}, &quot;parent</text><text x="20" y="1215">_tool_use_id&quot;: null, &quot;session_id&quot;: &quot;245d82fa-10c5-4475-919a-57cba0a57a7b&quot;, &quot;uuid&quot;: &quot;5fb4fc87-be52-4461-82ae-ce320cb2b6de&quot;, &quot;timest</text><text x="20" y="1235">amp&quot;: &quot;2026-11-15T02:12:03.733Z&quot;, &quot;tool_use_result&quot;: {&quot;stdout&quot;: &quot;{\&quot;code\&quot;: \&quot;NOT_FOUND\&quot;, \&quot;message\&quot;: \&quot;Synthetic fixture does n</text><text x="20" y="1255">ot implement this route.\&quot;}\n{\&quot;items\&quot;: [{\&quot;id\&quot;: \&quot;case_add\&quot;, \&quot;title\&quot;: \&quot;add 2 and 3 returns 5\&quot;, \&quot;steps\&quot;: [{\&quot;id\&quot;: \&quot;add\</text><text x="20" y="1275">&quot;, \&quot;kind\&quot;: \&quot;toolCall\&quot;, \&quot;toolName\&quot;: \&quot;add\&quot;, \&quot;arguments\&quot;: {\&quot;a\&quot;: 2, \&quot;b\&quot;: 3}}], \&quot;expectedOutput\&quot;: \&quot;5\&quot;}]}\n&gt; ## Docume</text><text x="20" y="1295">ntation Index\n&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt\n&gt; Use this file to discover all avai</text><text x="20" y="1315">lable pages before exploring further.\n\n# Create an eval run (async)\n\n&gt; Creates a suite run from an existing `suiteId` (rerun) </text><text x="20" y="1335">and/or inline `tests`, then **detaches execution and responds `202` immediately** with the `runId`. Validation and quota errors su</text><text x="20" y="1355">rface on this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in the hosted UI Runs tab, tagged `source:</text></g></svg>
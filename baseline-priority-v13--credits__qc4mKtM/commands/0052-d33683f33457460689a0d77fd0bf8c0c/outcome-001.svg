<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d33683f33457460689a0d77fd0bf8c0c — page 1</text><text x="20" y="75">$ /bin/bash -c -l SNAPSHOT_FILE=/logs/agent/sessions/shell-snapshots/snapshot-bash-1794708752430-ixfalf.sh</text><text x="20" y="95">      source &quot;/root/.bashrc&quot; &lt; /dev/null</text><text x="20" y="115">      </text><text x="20" y="135"></text><text x="20" y="155">      # First, create/clear the snapshot file</text><text x="20" y="175">      echo &quot;# Snapshot file&quot; &gt;| &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="195"></text><text x="20" y="215">      # When this file is sourced, we first unalias to avoid conflicts</text><text x="20" y="235">      # This is necessary because aliases get &quot;frozen&quot; inside function definitions at definition time,</text><text x="20" y="255">      # which can cause unexpected behavior when functions use commands that conflict with aliases</text><text x="20" y="275">      echo &quot;# Unset all aliases to avoid conflicts with functions&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="295">      echo &quot;unalias -a 2&gt;/dev/null || true&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="315"></text><text x="20" y="335">      </text><text x="20" y="355">      # shopt before functions: a body using extglob/globstar syntax only</text><text x="20" y="375">      # re-parses with the option on.</text><text x="20" y="395">      echo &quot;# Shopt&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="415">      shopt -p &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="435"></text><text x="20" y="455">      echo &quot;# Functions&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="475"></text><text x="20" y="495">      # Force autoload all functions first</text><text x="20" y="515">      declare -f &gt; /dev/null 2&gt;&amp;1</text><text x="20" y="535"></text><text x="20" y="555">      # Now get user function names - filter completion functions (single underscore prefix)</text><text x="20" y="575">      # but keep double-underscore helpers (e.g. __zsh_like_cd from mise, __pyenv_init)</text><text x="20" y="595">      # One eval per function so a body that no longer parses (rc=2, not fatal</text><text x="20" y="615">      # in non-POSIX bash) drops only itself. The %q literal needs no fork</text><text x="20" y="635">      # at source time, unlike a base64 command substitution.</text><text x="20" y="655">      declare -F | while read func; do</text><text x="20" y="675">        func=${func##* } # the name: the last word of each declare -F line</text><text x="20" y="695">        # declare reads a name starting with - or + as an option, and eval one starting with -; other names need no &quot;--&quot;</text><text x="20" y="715">        if [[ &quot;$func&quot; == [-+]* ]]; then</text><text x="20" y="735">          printf &#x27;eval -- %q &gt; /dev/null 2&gt;&amp;1\n&#x27; &quot;$(declare -f -- &quot;$func&quot;)&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="755">        else</text><text x="20" y="775">          [[ &quot;$func&quot; == _[!_]* ]] ||</text><text x="20" y="795">            printf &#x27;eval %q &gt; /dev/null 2&gt;&amp;1\n&#x27; &quot;$(declare -f &quot;$func&quot;)&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="815">        fi</text><text x="20" y="835">      done</text><text x="20" y="855">    </text><text x="20" y="875">      echo &quot;# Shell Options&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="895">      set -o | awk &#x27;$2 == &quot;on&quot; || $1 == &quot;monitor&quot; {print &quot;set -o &quot; $1}&#x27; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="915">      echo &quot;shopt -s expand_aliases&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="935">    </text><text x="20" y="955">      echo &quot;# Aliases&quot; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="975">      # Filter out winpty aliases on Windows to avoid &quot;stdin is not a tty&quot; errors</text><text x="20" y="995">      # Git Bash automatically creates aliases like &quot;alias node=&#x27;winpty node.exe&#x27;&quot; for</text><text x="20" y="1015">      # programs that need Win32 Console in mintty, but winpty fails when there&#x27;s no TTY</text><text x="20" y="1035">      if [[ &quot;$OSTYPE&quot; == &quot;msys&quot; ]] || [[ &quot;$OSTYPE&quot; == &quot;cygwin&quot; ]]; then</text><text x="20" y="1055">        # sed, not grep -v, whose exit 1 when no alias is left ends this script under errexit and pipefail.</text><text x="20" y="1075">        # Every line gets &quot;alias -- &quot; here: the filter works by line, so it can leave part of a multi-line alias behind.</text><text x="20" y="1095">        alias | sed -e &quot;/=&#x27;winpty /d&quot; | sed -e &#x27;1001,$d&#x27; -e &#x27;s/^alias //g&#x27; -e &#x27;s/^/alias -- /&#x27; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="1115">      else</text><text x="20" y="1135">        \alias -p | sed -e &#x27;1001,$d&#x27; -e &#x27;s/^alias -- /alias /&#x27; -e &#x27;s/^alias /alias -- /&#x27; &gt;&gt; &quot;$SNAPSHOT_FILE&quot;</text><text x="20" y="1155">      fi</text><text x="20" y="1175">  </text><text x="20" y="1195"></text><text x="20" y="1215">      </text><text x="20" y="1235">      cat &gt;&gt; &quot;$SNAPSHOT_FILE&quot; &lt;&lt; &#x27;CLAUDE_CODE_END_ewb4ip2keyf&#x27;</text><text x="20" y="1255"># Check for rg availability</text><text x="20" y="1275">if ! hash rg 2&gt;/dev/null &amp;&amp; ! typeset -f rg &gt;/dev/null 2&gt;&amp;1; then</text><text x="20" y="1295">  function rg {</text><text x="20" y="1315">  local _cc_bin=&quot;${CLAUDE_CODE_EXECPATH:-}&quot;</text><text x="20" y="1335">  [[ -x $_cc_bin ]] || _cc_bin=/root/.local/bin/claude</text><text x="20" y="1355">  if [[ ! -x $_cc_bin ]]; then command rg ${1+&quot;$@&quot;}; return; fi</text></g></svg>
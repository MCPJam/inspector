<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1125"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">33e77a9856a24cdbafe13d980f55260e — page 1</text><text x="20" y="75">$ /bin/bash -c source /logs/agent/sessions/shell-snapshots/snapshot-bash-1794708741627-otfcg5.sh 2&gt;/dev/null || true &amp;&amp; \builtin s</text><text x="20" y="95">hopt -u extglob 2&gt;/dev/null || true &amp;&amp; { \builtin unalias -- &#x27;which&#x27;; \builtin unset -f -- &#x27;which&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; {</text><text x="20" y="115"> \builtin unalias -- &#x27;unsetenv&#x27;; \builtin unset -f -- &#x27;unsetenv&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; eval &#x27;cd /workspace; timeout 90 npx</text><text x="20" y="135"> -y @mcpjam/cli@latest cloud --help 2&gt;&amp;1 | head -40; timeout 60 npx -y @mcpjam/cli@latest cloud eval list --project project_fixtur</text><text x="20" y="155">e 2&gt;&amp;1 | head -30&#x27; &lt; /dev/null &amp;&amp; pwd -P &gt;| /tmp/claude-0ef3-cwd</text><text x="20" y="175">Usage: mcpjam cloud [options] [command]</text><text x="20" y="195"></text><text x="20" y="215">MCPJam Cloud account commands (login, projects, evals, tunnels). Local MCP</text><text x="20" y="235">testing stays at the top level — `mcpjam oauth login` is MCP OAuth; `mcpjam</text><text x="20" y="255">cloud login` is your MCPJam account.</text><text x="20" y="275"></text><text x="20" y="295">Options:</text><text x="20" y="315">  --api-key &lt;key&gt;               MCPJam sk_ API key (overrides MCPJAM_API_KEY)</text><text x="20" y="335">  --api-url &lt;url&gt;               MCPJam API base URL (defaults to your</text><text x="20" y="355">                                organization&#x27;s server or</text><text x="20" y="375">                                https://app.mcpjam.com/api/v1)</text><text x="20" y="395">  --api-header &lt;header...&gt;      Extra request header for a deployment behind an</text><text x="20" y="415">                                edge authenticator, as &quot;Name: value&quot;</text><text x="20" y="435">                                (repeatable; also MCPJAM_API_HEADERS,</text><text x="20" y="455">                                newline-separated)</text><text x="20" y="475">  -h, --help                    display help for command</text><text x="20" y="495"></text><text x="20" y="515">Account:</text><text x="20" y="535">  login [options]               Log in to MCPJam Cloud. Opens your browser for</text><text x="20" y="555">                                OAuth and stores the session locally.</text><text x="20" y="575">  logout                        Remove the stored MCPJam Cloud login.</text><text x="20" y="595">  whoami                        Show the MCPJam Cloud account behind the current</text><text x="20" y="615">                                credentials.</text><text x="20" y="635">  status                        Show how this CLI would authenticate and which</text><text x="20" y="655">                                Cloud project it would use, without calling the</text><text x="20" y="675">                                network.</text><text x="20" y="695">  link [options] [project]      Pin this directory to a Cloud project by writing</text><text x="20" y="715">                                .mcpjam/project.json. The file contains no</text><text x="20" y="735">                                secrets and is committed by default;</text><text x="20" y="755">                                per-developer setups may gitignore it.</text><text x="20" y="775"></text><text x="20" y="795">Workspace:</text><text x="20" y="815">  organizations|orgs            Inspect the MCPJam organizations you belong to</text><text x="20" y="835">  projects                      Operate the MCP servers saved in your hosted</text><text x="20" y="855">                                MCPJam projects</text><text x="20" y="875">  sessions                      List Playground chat sessions, or search</text><text x="20" y="895">                                conversations across Playground, user testing,</text><text x="20" y="915">                                evals and swarms.</text><text x="20" y="935">  tunnel [options] [target...]  Expose a local MCP server through an MCPJam</text><text x="20" y="955">                                tunnel and register it as a server in your</text><text x="20" y="975">Using MCPJam Cloud as sk_…etic · project: flag (project_fixture) · http://fixture:8765/api/v1</text><text x="20" y="995">{&quot;project&quot;:{&quot;id&quot;:&quot;project_fixture&quot;,&quot;name&quot;:&quot;Fixture&quot;,&quot;sensitive_value&quot;: &quot;[REDACTED]&quot;},&quot;items&quot;:[{&quot;id&quot;:&quot;suite_fixture&quot;,&quot;name&quot;:&quot;Arithm</text><text x="20" y="1015">etic smoke&quot;,&quot;projectId&quot;:&quot;project_fixture&quot;,&quot;description&quot;:&quot;Synthetic fixture: add 2 and 3 and assert 5.&quot;,&quot;environment&quot;:{&quot;servers&quot;:[]</text><text x="20" y="1035">},&quot;executionConfig&quot;:null,&quot;hosts&quot;:[],&quot;environmentIds&quot;:[],&quot;settings&quot;:{&quot;policy&quot;:&quot;legacy&quot;,&quot;minimumIterations&quot;:1},&quot;schedule&quot;:{},&quot;create</text><text x="20" y="1055">dAt&quot;:1,&quot;updatedAt&quot;:2}],&quot;otherProjects&quot;:[]}</text><text x="20" y="1075"></text><text x="20" y="1095">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
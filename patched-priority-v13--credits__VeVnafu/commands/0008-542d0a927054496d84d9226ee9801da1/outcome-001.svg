<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1085"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">542d0a927054496d84d9226ee9801da1 — page 1</text><text x="20" y="75">$ /bin/bash -c source /logs/agent/sessions/shell-snapshots/snapshot-bash-1794708354654-uo9u1a.sh 2&gt;/dev/null || true &amp;&amp; \builtin s</text><text x="20" y="95">hopt -u extglob 2&gt;/dev/null || true &amp;&amp; { \builtin unalias -- &#x27;which&#x27;; \builtin unset -f -- &#x27;which&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; {</text><text x="20" y="115"> \builtin unalias -- &#x27;unsetenv&#x27;; \builtin unset -f -- &#x27;unsetenv&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; eval &#x27;cd /workspace; curl -s -m 20 </text><text x="20" y="135">https://docs.mcpjam.com/troubleshooting/error-codes.md | grep -iE -B1 -A4 &#x27;&quot;&#x27;&quot;&#x27;credit|billing|quota|402&#x27;&quot;&#x27;&quot;&#x27; | head -40&#x27; &lt; /dev/nu</text><text x="20" y="155">ll &amp;&amp; pwd -P &gt;| /tmp/claude-bc63-cwd</text><text x="20" y="175"></text><text x="20" y="195">### Provider quota</text><text x="20" y="215"></text><text x="20" y="235">`provider/quota`</text><text x="20" y="255"></text><text x="20" y="275">Your LLM provider rejected the request because you hit a rate limit or quota. This is a limit on your own provider key — no MCPJam</text><text x="20" y="295"> purchase lifts it.</text><text x="20" y="315"></text><text x="20" y="335">**Likely causes**</text><text x="20" y="355"></text><text x="20" y="375">* Per-minute rate limit exceeded.</text><text x="20" y="395">* Daily or monthly quota exhausted.</text><text x="20" y="415">* Free tier limits hit.</text><text x="20" y="435"></text><text x="20" y="455">**Next steps**</text><text x="20" y="475"></text><text x="20" y="495">--</text><text x="20" y="515"></text><text x="20" y="535">&gt; **MCPJam account limit vs. provider throttle** — If the session pane shows a billing or credit message instead of this card, the</text><text x="20" y="555"> limit is on your MCPJam account, not your provider key. Adding credits or switching to BYOK resolves that case; the steps above d</text><text x="20" y="575">o not apply.</text><text x="20" y="595"></text><text x="20" y="615">### Frontier model sign-in required</text><text x="20" y="635"></text><text x="20" y="655">`provider/guest_model_not_allowed`</text><text x="20" y="675">--</text><text x="20" y="695">* A sign-in prompt appears automatically. Click **Sign in** to authenticate and get access to frontier models.</text><text x="20" y="715">* Click **Not now** to dismiss and continue with a standard model. Your credit balance is not affected.</text><text x="20" y="735"></text><text x="20" y="755">### Out of MCPJam credits</text><text x="20" y="775"></text><text x="20" y="795">`provider/mcpjam_limit_daily` · `provider/mcpjam_limit_monthly` · `provider/mcpjam_limit` · `provider/mcpjam_limit_insufficient`</text><text x="20" y="815"></text><text x="20" y="835">MCPJam refused the call before it reached a provider. For the daily, monthly,</text><text x="20" y="855">--</text><text x="20" y="875">share a daily bucket per organization, paid plans spend a monthly allowance that</text><text x="20" y="895">renews with the billing period.</text><text x="20" y="915"></text><text x="20" y="935">`provider/mcpjam_limit_insufficient` means the balance is not empty but is below</text><text x="20" y="955">what the request could cost. MCPJam reserves a request&#x27;s worst-case cost before</text><text x="20" y="975">it runs, so a cheaper model or a shorter conversation can fit where this one did</text><text x="20" y="995">--</text><text x="20" y="1015"></text><text x="20" y="1035"></text><text x="20" y="1055">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
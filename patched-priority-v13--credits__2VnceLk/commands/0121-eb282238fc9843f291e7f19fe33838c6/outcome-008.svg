<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">eb282238fc9843f291e7f19fe33838c6 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; /workspace/mcp-eval/request.json &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;EOF&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">{</text><text x="20" y="195">  &quot;suiteId&quot;: &quot;suite_fixture&quot;,</text><text x="20" y="215">  &quot;serverIds&quot;: [&quot;server_fixture&quot;]</text><text x="20" y="235">}</text><text x="20" y="255">EOF</text><text x="20" y="275">cat &gt; /workspace/mcp-eval/run.py &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="295">#!/usr/bin/env python3</text><text x="20" y="315">&quot;&quot;&quot;Launch once, then resume polling using the saved receipt. No credit purchases.&quot;&quot;&quot;</text><text x="20" y="335">import argparse,json,pathlib,time</text><text x="20" y="355">from api import call</text><text x="20" y="375">p=argparse.ArgumentParser()</text><text x="20" y="395">p.add_argument(&#x27;&quot;&#x27;&quot;&#x27;--label&#x27;&quot;&#x27;&quot;&#x27;,default=&#x27;&quot;&#x27;&quot;&#x27;evaluation&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="415">p.add_argument(&#x27;&quot;&#x27;&quot;&#x27;--run-id&#x27;&quot;&#x27;&quot;&#x27;,help=&#x27;&quot;&#x27;&quot;&#x27;Resume an accepted run without launching again&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="435">p.add_argument(&#x27;&quot;&#x27;&quot;&#x27;--timeout&#x27;&quot;&#x27;&quot;&#x27;,type=int,default=90)</text><text x="20" y="455">a=p.parse_args()</text><text x="20" y="475">root=pathlib.Path(__file__).resolve().parent</text><text x="20" y="495">base=&#x27;&quot;&#x27;&quot;&#x27;/projects/project_fixture/eval-runs&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="515">request=json.loads((root/&#x27;&quot;&#x27;&quot;&#x27;request.json&#x27;&quot;&#x27;&quot;&#x27;).read_text())</text><text x="20" y="535">request[&#x27;&quot;&#x27;&quot;&#x27;idempotencyKey&#x27;&quot;&#x27;&quot;&#x27;]=&#x27;&quot;&#x27;&quot;&#x27;repeatable-arithmetic-&#x27;&quot;&#x27;&quot;&#x27;+a.label</text><text x="20" y="555">runid=a.run_id</text><text x="20" y="575">if not runid:</text><text x="20" y="595"> receipt=call(base,request,name=a.label+&#x27;&quot;&#x27;&quot;&#x27;-launch&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="615"> runid=receipt.get(&#x27;&quot;&#x27;&quot;&#x27;runId&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="635"> if not runid: raise SystemExit(&#x27;&quot;&#x27;&quot;&#x27;Launch blocked; inspect saved receipt before retrying.&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="655">end=time.monotonic()+a.timeout</text><text x="20" y="675">while time.monotonic()&lt;end:</text><text x="20" y="695"> status=call(base+&#x27;&quot;&#x27;&quot;&#x27;/&#x27;&quot;&#x27;&quot;&#x27;+runid,name=a.label+&#x27;&quot;&#x27;&quot;&#x27;-status&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="715"> if status.get(&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;) in [&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;failed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;cancelled&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;timed_out&#x27;&quot;&#x27;&quot;&#x27;]:</text><text x="20" y="735">  call(base+&#x27;&quot;&#x27;&quot;&#x27;/&#x27;&quot;&#x27;&quot;&#x27;+runid+&#x27;&quot;&#x27;&quot;&#x27;/iterations&#x27;&quot;&#x27;&quot;&#x27;,name=a.label+&#x27;&quot;&#x27;&quot;&#x27;-iterations&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="755">  call(base+&#x27;&quot;&#x27;&quot;&#x27;/&#x27;&quot;&#x27;&quot;&#x27;+runid+&#x27;&quot;&#x27;&quot;&#x27;/decision-summary&#x27;&quot;&#x27;&quot;&#x27;,name=a.label+&#x27;&quot;&#x27;&quot;&#x27;-decision&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="775">  raise SystemExit(0 if status.get(&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;)==&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27; else 1)</text><text x="20" y="795"> time.sleep(2)</text><text x="20" y="815">raise SystemExit(&#x27;&quot;&#x27;&quot;&#x27;Polling timed out; resume with --run-id &#x27;&quot;&#x27;&quot;&#x27;+runid)</text><text x="20" y="835">PY</text><text x="20" y="855">cat &gt; /workspace/mcp-eval/README.md &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;EOF&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="875"># Repeatable Arithmetic evaluation</text><text x="20" y="895"></text><text x="20" y="915">Target: http://fixture:8765/mcp, saved server server_fixture, project project_fixture.</text><text x="20" y="935">Suite: suite_fixture (Arithmetic smoke). Case: call add(a=2,b=3), expected output 5.</text><text x="20" y="955">Saved suite and cases are in suite.json and cases.json. Live tool discovery is in tools.json.</text><text x="20" y="975">The saved suite has no server selection, so request.json explicitly selects server_fixture.</text><text x="20" y="995"></text><text x="20" y="1015">## Run</text><text x="20" y="1035"></text><text x="20" y="1055">With MCPJAM_API_URL and MCPJAM_API_KEY set:</text><text x="20" y="1075"></text><text x="20" y="1095">    cd /workspace/mcp-eval</text><text x="20" y="1115">    python3 run.py --label evaluation</text><text x="20" y="1135"></text><text x="20" y="1155">A repeated label uses the same idempotency key. Use a different label for an intentional new evaluation.</text><text x="20" y="1175">Resume an accepted run without another launch with:</text><text x="20" y="1195"></text><text x="20" y="1215">    python3 run.py --label evaluation --run-id RUN_ID</text><text x="20" y="1235"></text><text x="20" y="1255">## Account and cost preflight</text><text x="20" y="1275"></text><text x="20" y="1295">- /me and /organizations confirm Team plan and organization owner.</text><text x="20" y="1315">- Documented organization spend-budget endpoint returns 404 (unimplemented in this environment).</text><text x="20" y="1335">- /usage and /billing are unavailable (404); no balance or usage amount was disclosed.</text><text x="20" y="1355">- No numeric expected cost is available from the exposed interfaces. No model is specified in the saved case; it is a direct tool-</text></g></svg>
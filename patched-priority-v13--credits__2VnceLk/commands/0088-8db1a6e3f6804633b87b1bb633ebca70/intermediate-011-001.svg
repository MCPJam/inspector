<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +44.278728008270264s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_12&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nim</text><text x="20" y="95">port json\ns=json.load(open(&#x27;/workspace/mcp-eval/docs/openapi.json&#x27;))\nfor path in [&#x27;/me&#x27;,&#x27;/organizations/{organizationId}/spend-b</text><text x="20" y="115">udget&#x27;,&#x27;/projects/{projectId}/eval-runs&#x27;,&#x27;/projects/{projectId}/eval-suites/{suiteId}&#x27;]:\n print(path,json.dumps(s[&#x27;paths&#x27;][path])</text><text x="20" y="135">[:15000])\nPY\nrg -n -i &#x27;credit|usage|cost|billing&#x27; /workspace/mcp-eval/docs/public-api.md\&quot;&quot;, &quot;aggregated_output&quot;: &quot;/me {\&quot;get\&quot;:</text><text x="20" y="155"> {\&quot;operationId\&quot;: \&quot;getMe\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Get the authenticated account\&quot;, \&quot;description\&quot;: \&quot;The user</text><text x="20" y="175"> behind the API key (keys act as their creator, scoped to one organization).\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The a</text><text x="20" y="195">ccount.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/Me\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/co</text><text x="20" y="215">mponents/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/</text><text x="20" y="235">responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/respon</text><text x="20" y="255">ses/ServerUnreachable\&quot;}}}}\n/organizations/{organizationId}/spend-budget {\&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/parameters/o</text><text x="20" y="275">rganizationId\&quot;}], \&quot;get\&quot;: {\&quot;operationId\&quot;: \&quot;getSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Read the organization&#x27;s </text><text x="20" y="295">spend budget\&quot;, \&quot;description\&quot;: \&quot;The ceiling on what this organization may spend on MCPJam-billed work (chat, evals, judges and </text><text x="20" y="315">computer time) in the current billing window, and how much of it has been spent.\\n\\nAny member may read it: a member who cannot </text><text x="20" y="335">raise the ceiling still needs to know it exists, because it is what refused their run. `capUsd: null` means the organization is un</text><text x="20" y="355">capped, which is the default.\\n\\nRuns that use your own provider keys are never counted against the budget and never blocked by </text><text x="20" y="375">it. Neither is the free daily allowance: it is not credits.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The organization&#x27;s spe</text><text x="20" y="395">nd budget.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$r</text><text x="20" y="415">ef\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#</text><text x="20" y="435">/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components</text><text x="20" y="455">/responses/InternalError\&quot;}}}, \&quot;put\&quot;: {\&quot;operationId\&quot;: \&quot;setSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Set the orga</text><text x="20" y="475">nization&#x27;s spend budget\&quot;, \&quot;description\&quot;: \&quot;Set or replace the ceiling. **Requires organization owner or admin.**\\n\\nWhen the </text><text x="20" y="495">budget is reached, new MCPJam-billed work (chat turns, eval runs, computer starts) is refused for the whole organization until the</text><text x="20" y="515"> window resets or an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they h</text><text x="20" y="535">ibernate.\\n\\n`capUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what wa</text><text x="20" y="555">s kept. Changing the cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was al</text><text x="20" y="575">ready told about.\&quot;, \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/compone</text><text x="20" y="595">nts/schemas/SpendBudgetInput\&quot;}}}}, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The stored spend budget.\&quot;, \&quot;content\&quot;: {\&quot;appli</text><text x="20" y="615">cation/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unau</text><text x="20" y="635">thorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, </text><text x="20" y="655">\&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}, \&quot;de</text><text x="20" y="675">lete\&quot;: {\&quot;operationId\&quot;: \&quot;clearSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Remove the organization&#x27;s spend budget\&quot;, </text><text x="20" y="695">\&quot;description\&quot;: \&quot;Leave the organization uncapped. **Requires organization owner or admin.**\\n\\nThe window&#x27;s spend counter surv</text><text x="20" y="715">ives: it is a record of spend, not of the budget, and a budget set again later measures against the spend already made this period</text><text x="20" y="735">.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The spend budget, now uncapped.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema</text><text x="20" y="755">\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\</text><text x="20" y="775">&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/</text><text x="20" y="795">components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}}\n/projects/{projectId}/eval-</text><text x="20" y="815">runs {\&quot;post\&quot;: {\&quot;operationId\&quot;: \&quot;createEvalRun\&quot;, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Create an eval run (async)\&quot;, \&quot;des</text><text x="20" y="835">cription\&quot;: \&quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds</text><text x="20" y="855"> `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for prog</text><text x="20" y="875">ress. The run appears live in the hosted UI Runs tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests rer</text><text x="20" y="895">uns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `</text><text x="20" y="915">details.reason: \\\&quot;CONCURRENT_RUN_LIMIT\\\&quot;`.\\n\\nFor a suite with attached project environments, pass `environmentId` to choose</text><text x="20" y="935"> which one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple </text><text x="20" y="955">for the life of the run.\\n\\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-lau</text><text x="20" y="975">ncher` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.\&quot;, \&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;</text><text x="20" y="995">#/components/parameters/evalVocabularyHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/para</text><text x="20" y="1015">meters/launcherHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/ciHeader\&quot;}], \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\</text><text x="20" y="1035">&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreateRequest\&quot;}, \&quot;example\&quot;: {\&quot;suiteName\&quot;: \&quot;smoke\</text><text x="20" y="1055">&quot;, \&quot;serverIds\&quot;: [\&quot;srv_abc123\&quot;], \&quot;tests\&quot;: [{\&quot;title\&quot;: \&quot;echo works\&quot;, \&quot;runs\&quot;: 1, \&quot;model\&quot;: \&quot;anthropic/claude-haiku-4.5\&quot;</text><text x="20" y="1075">, \&quot;provider\&quot;: \&quot;anthropic\&quot;, \&quot;steps\&quot;: [{\&quot;id\&quot;: \&quot;s1\&quot;, \&quot;kind\&quot;: \&quot;prompt\&quot;, \&quot;prompt\&quot;: \&quot;Use the echo tool to say hi\&quot;}, {\</text><text x="20" y="1095">&quot;id\&quot;: \&quot;s2\&quot;, \&quot;kind\&quot;: \&quot;assert\&quot;, \&quot;assertion\&quot;: {\&quot;type\&quot;: \&quot;toolCalledWith\&quot;, \&quot;toolName\&quot;: \&quot;echo\&quot;, \&quot;args\&quot;: {\&quot;args\&quot;: {\</text><text x="20" y="1115">&quot;text\&quot;: \&quot;hi\&quot;}}}}]}]}}}}, \&quot;responses\&quot;: {\&quot;202\&quot;: {\&quot;description\&quot;: \&quot;Run created; execution continues in the background.\&quot;, \&quot;</text><text x="20" y="1135">content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreated\&quot;}, \&quot;example\&quot;: {\&quot;runId\&quot;: \&quot;run</text><text x="20" y="1155">_abc123\&quot;, \&quot;suiteId\&quot;: \&quot;suite_def456\&quot;, \&quot;status\&quot;: \&quot;running\&quot;, \&quot;caseUpsert\&quot;: {\&quot;committed\&quot;: [{\&quot;name\&quot;: \&quot;echo works\&quot;}], \</text><text x="20" y="1175">&quot;failed\&quot;: []}, \&quot;environment\&quot;: null}}}}, \&quot;400\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;</text><text x="20" y="1195">#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/compone</text><text x="20" y="1215">nts/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/respons</text><text x="20" y="1235">es/InternalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable\&quot;}, \&quot;504\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/respons</text><text x="20" y="1255">es/Timeout\&quot;}}}}\n/projects/{projectId}/eval-suites/{suiteId} {\&quot;get\&quot;: {\&quot;operationId\&quot;: \&quot;getEvalSuite\&quot;, \&quot;x-mcpjam-eval-vocabu</text><text x="20" y="1275">lary\&quot;: {\&quot;2\&quot;: {\&quot;response\&quot;: \&quot;EvalSuiteDetailV2\&quot;}}, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Get one eval suite&#x27;s configurati</text><text x="20" y="1295">on\&quot;, \&quot;description\&quot;: \&quot;The suite&#x27;s full settings: attached environments, hosts, execution config, judge, schedule. The list rout</text><text x="20" y="1315">e returns run rollups instead; this is the shape the edit routes read and write.\&quot;, \&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/par</text><text x="20" y="1335">ameters/evalVocabularyHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/suiteId\&quot;</text><text x="20" y="1355">}], \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The suite.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/com</text></g></svg>
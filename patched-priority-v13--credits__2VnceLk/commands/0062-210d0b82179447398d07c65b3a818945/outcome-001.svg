<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">210d0b82179447398d07c65b3a818945 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcp-eval/request.json &lt;&lt;&#x27;EOF&#x27;</text><text x="20" y="95">{</text><text x="20" y="115">  &quot;suiteId&quot;: &quot;suite_fixture&quot;,</text><text x="20" y="135">  &quot;serverIds&quot;: [&quot;server_fixture&quot;]</text><text x="20" y="155">}</text><text x="20" y="175">EOF</text><text x="20" y="195">cat &gt; /workspace/mcp-eval/run.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="215">#!/usr/bin/env python3</text><text x="20" y="235">&quot;&quot;&quot;Launch once, then resume polling using the saved receipt. No credit purchases.&quot;&quot;&quot;</text><text x="20" y="255">import argparse,json,pathlib,time</text><text x="20" y="275">from api import call</text><text x="20" y="295">p=argparse.ArgumentParser()</text><text x="20" y="315">p.add_argument(&#x27;--label&#x27;,default=&#x27;evaluation&#x27;)</text><text x="20" y="335">p.add_argument(&#x27;--run-id&#x27;,help=&#x27;Resume an accepted run without launching again&#x27;)</text><text x="20" y="355">p.add_argument(&#x27;--timeout&#x27;,type=int,default=90)</text><text x="20" y="375">a=p.parse_args()</text><text x="20" y="395">root=pathlib.Path(__file__).resolve().parent</text><text x="20" y="415">base=&#x27;/projects/project_fixture/eval-runs&#x27;</text><text x="20" y="435">request=json.loads((root/&#x27;request.json&#x27;).read_text())</text><text x="20" y="455">request[&#x27;idempotencyKey&#x27;]=&#x27;repeatable-arithmetic-&#x27;+a.label</text><text x="20" y="475">runid=a.run_id</text><text x="20" y="495">if not runid:</text><text x="20" y="515"> receipt=call(base,request,name=a.label+&#x27;-launch&#x27;)</text><text x="20" y="535"> runid=receipt.get(&#x27;runId&#x27;)</text><text x="20" y="555"> if not runid: raise SystemExit(&#x27;Launch blocked; inspect saved receipt before retrying.&#x27;)</text><text x="20" y="575">end=time.monotonic()+a.timeout</text><text x="20" y="595">while time.monotonic()&lt;end:</text><text x="20" y="615"> status=call(base+&#x27;/&#x27;+runid,name=a.label+&#x27;-status&#x27;)</text><text x="20" y="635"> if status.get(&#x27;status&#x27;) in [&#x27;completed&#x27;,&#x27;failed&#x27;,&#x27;cancelled&#x27;,&#x27;timed_out&#x27;]:</text><text x="20" y="655">  call(base+&#x27;/&#x27;+runid+&#x27;/iterations&#x27;,name=a.label+&#x27;-iterations&#x27;)</text><text x="20" y="675">  call(base+&#x27;/&#x27;+runid+&#x27;/decision-summary&#x27;,name=a.label+&#x27;-decision&#x27;)</text><text x="20" y="695">  raise SystemExit(0 if status.get(&#x27;status&#x27;)==&#x27;completed&#x27; else 1)</text><text x="20" y="715"> time.sleep(2)</text><text x="20" y="735">raise SystemExit(&#x27;Polling timed out; resume with --run-id &#x27;+runid)</text><text x="20" y="755">PY</text><text x="20" y="775">cat &gt; /workspace/mcp-eval/README.md &lt;&lt;&#x27;EOF&#x27;</text><text x="20" y="795"># Repeatable Arithmetic evaluation</text><text x="20" y="815"></text><text x="20" y="835">Target: http://fixture:8765/mcp, saved server server_fixture, project project_fixture.</text><text x="20" y="855">Suite: suite_fixture (Arithmetic smoke). Case: call add(a=2,b=3), expected output 5.</text><text x="20" y="875">Saved suite and cases are in suite.json and cases.json. Live tool discovery is in tools.json.</text><text x="20" y="895">The saved suite has no server selection, so request.json explicitly selects server_fixture.</text><text x="20" y="915"></text><text x="20" y="935">## Run</text><text x="20" y="955"></text><text x="20" y="975">With MCPJAM_API_URL and MCPJAM_API_KEY set:</text><text x="20" y="995"></text><text x="20" y="1015">    cd /workspace/mcp-eval</text><text x="20" y="1035">    python3 run.py --label evaluation</text><text x="20" y="1055"></text><text x="20" y="1075">A repeated label uses the same idempotency key. Use a different label for an intentional new evaluation.</text><text x="20" y="1095">Resume an accepted run without another launch with:</text><text x="20" y="1115"></text><text x="20" y="1135">    python3 run.py --label evaluation --run-id RUN_ID</text><text x="20" y="1155"></text><text x="20" y="1175">## Account and cost preflight</text><text x="20" y="1195"></text><text x="20" y="1215">- /me and /organizations confirm Team plan and organization owner.</text><text x="20" y="1235">- Documented organization spend-budget endpoint returns 404 (unimplemented in this environment).</text><text x="20" y="1255">- /usage and /billing are unavailable (404); no balance or usage amount was disclosed.</text><text x="20" y="1275">- No numeric expected cost is available from the exposed interfaces. No model is specified in the saved case; it is a direct tool-</text><text x="20" y="1295">call case, but platform execution still requires credits.</text><text x="20" y="1315">- Initial launch: HTTP 403 FORBIDDEN, details.reason PLATFORM_FEE_REQUIRED. No runId was issued.</text><text x="20" y="1335">- Account&#x27;s next documented action: owner can use billing credit controls; no purchase or production billing contact is authorized</text><text x="20" y="1355"> in this trial.</text></g></svg>
ich is the default.\\n\\nRuns that use your own provider keys are never counted against the budget and never blocked by </text><text x="20" y="855">it. Neither is the free daily allowance: it is not credits.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The organization&#x27;s spe</text><text x="20" y="875">nd budget.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$r</text><text x="20" y="895">ef\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#</text><text x="20" y="915">/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components</text><text x="20" y="935">/responses/InternalError\&quot;}}}, \&quot;put\&quot;: {\&quot;operationId\&quot;: \&quot;setSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Set the orga</text><text x="20" y="955">nization&#x27;s spend budget\&quot;, \&quot;description\&quot;: \&quot;Set or replace the ceiling. **Requires organization owner or admin.**\\n\\nWhen the </text><text x="20" y="975">budget is reached, new MCPJam-billed work (chat turns, eval runs, computer starts) is refused for the whole organization until the</text><text x="20" y="995"> window resets or an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they h</text><text x="20" y="1015">ibernate.\\n\\n`capUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what wa</text><text x="20" y="1035">s kept. Changing the cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was al</text><text x="20" y="1055">ready told about.\&quot;, \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/compone</text><text x="20" y="1075">nts/schemas/SpendBudgetInput\&quot;}}}}, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The stored spend budget.\&quot;, \&quot;content\&quot;: {\&quot;appli</text><text x="20" y="1095">cation/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unau</text><text x="20" y="1115">thorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, </text><text x="20" y="1135">\&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}, \&quot;de</text><text x="20" y="1155">lete\&quot;: {\&quot;operationId\&quot;: \&quot;clearSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Remove the organization&#x27;s spend budget\&quot;, </text><text x="20" y="1175">\&quot;description\&quot;: \&quot;Leave the organization uncapped. **Requires organization owner or admin.**\\n\\nThe window&#x27;s spend counter surv</text><text x="20" y="1195">ives: it is a record of spend, not of the budget, and a budget set again later measures against the spend already made this period</text><text x="20" y="1215">.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The spend budget, now uncapped.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema</text><text x="20" y="1235">\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\</text><text x="20" y="1255">&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/</text><text x="20" y="1275">components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}}\n/projects/{projectId}/eval-</text><text x="20" y="1295">runs {\&quot;post\&quot;: {\&quot;operationId\&quot;: \&quot;createEvalRun\&quot;, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Create an eval run (async)\&quot;, \&quot;des</text><text x="20" y="1315">cription\&quot;: \&quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds</text><text x="20" y="1335"> `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for prog</text><text x="20" y="1355">ress. The run appears live in the hosted UI Runs tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests rer</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1265"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">3dac7654ae6d406c9c3b45a09d85347e — page 1</text><text x="20" y="75">$ /bin/bash -c cat /workspace/mcp-eval/run.py</text><text x="20" y="95">cat /workspace/mcp-eval/api.py</text><text x="20" y="115">python3 /workspace/mcp-eval/run.py --label evaluation</text><text x="20" y="135">#!/usr/bin/env python3</text><text x="20" y="155">&quot;&quot;&quot;Launch once, then resume polling using the saved receipt. No credit purchases.&quot;&quot;&quot;</text><text x="20" y="175">import argparse,json,pathlib,time</text><text x="20" y="195">from api import call</text><text x="20" y="215">p=argparse.ArgumentParser()</text><text x="20" y="235">p.add_argument(&#x27;--label&#x27;,default=&#x27;evaluation&#x27;)</text><text x="20" y="255">p.add_argument(&#x27;--run-id&#x27;,help=&#x27;Resume an accepted run without launching again&#x27;)</text><text x="20" y="275">p.add_argument(&#x27;--timeout&#x27;,type=int,default=90)</text><text x="20" y="295">a=p.parse_args()</text><text x="20" y="315">root=pathlib.Path(__file__).resolve().parent</text><text x="20" y="335">base=&#x27;/projects/project_fixture/eval-runs&#x27;</text><text x="20" y="355">request=json.loads((root/&#x27;request.json&#x27;).read_text())</text><text x="20" y="375">request[&#x27;idempotencyKey&#x27;]=&#x27;repeatable-arithmetic-&#x27;+a.label</text><text x="20" y="395">runid=a.run_id</text><text x="20" y="415">if not runid:</text><text x="20" y="435"> receipt=call(base,request,name=a.label+&#x27;-launch&#x27;)</text><text x="20" y="455"> runid=receipt.get(&#x27;runId&#x27;)</text><text x="20" y="475"> if not runid: raise SystemExit(&#x27;Launch blocked; inspect saved receipt before retrying.&#x27;)</text><text x="20" y="495">end=time.monotonic()+a.timeout</text><text x="20" y="515">while time.monotonic()&lt;end:</text><text x="20" y="535"> status=call(base+&#x27;/&#x27;+runid,name=a.label+&#x27;-status&#x27;)</text><text x="20" y="555"> if status.get(&#x27;status&#x27;) in [&#x27;completed&#x27;,&#x27;failed&#x27;,&#x27;cancelled&#x27;,&#x27;timed_out&#x27;]:</text><text x="20" y="575">  call(base+&#x27;/&#x27;+runid+&#x27;/iterations&#x27;,name=a.label+&#x27;-iterations&#x27;)</text><text x="20" y="595">  call(base+&#x27;/&#x27;+runid+&#x27;/decision-summary&#x27;,name=a.label+&#x27;-decision&#x27;)</text><text x="20" y="615">  raise SystemExit(0 if status.get(&#x27;status&#x27;)==&#x27;completed&#x27; else 1)</text><text x="20" y="635"> time.sleep(2)</text><text x="20" y="655">raise SystemExit(&#x27;Polling timed out; resume with --run-id &#x27;+runid)</text><text x="20" y="675">import os,json,urllib.request,urllib.error,pathlib</text><text x="20" y="695">BASE=os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;)</text><text x="20" y="715">OUT=pathlib.Path(&#x27;/workspace/mcp-eval&#x27;)</text><text x="20" y="735">def call(path,body=None,method=None,name=None):</text><text x="20" y="755"> req=urllib.request.Request(BASE+path,data=None if body is None else json.dumps(body).encode(),headers={&#x27;Authorization&#x27;:&#x27;Bearer &#x27;+</text><text x="20" y="775">os.environ[&#x27;MCPJAM_API_KEY&#x27;],&#x27;Content-Type&#x27;:&#x27;application/json&#x27;},method=method or (&#x27;GET&#x27; if body is None else &#x27;POST&#x27;))</text><text x="20" y="795"> try:</text><text x="20" y="815">  with urllib.request.urlopen(req,timeout=20) as r: status=r.status; data=json.load(r)</text><text x="20" y="835"> except urllib.error.HTTPError as e: status=e.code; data=json.load(e)</text><text x="20" y="855"> if name: (OUT/(name+&#x27;.json&#x27;)).write_text(json.dumps({&#x27;http_status&#x27;:status,&#x27;body&#x27;:data},indent=2))</text><text x="20" y="875"> print(path,status,json.dumps(data))</text><text x="20" y="895"> return data</text><text x="20" y="915">if __name__==&#x27;__main__&#x27;:</text><text x="20" y="935"> import sys</text><text x="20" y="955"> call(sys.argv[1],json.loads(sys.argv[2]) if len(sys.argv)&gt;2 else None,name=sys.argv[3] if len(sys.argv)&gt;3 else None)</text><text x="20" y="975">/projects/project_fixture/eval-runs 202 {&quot;runId&quot;: &quot;run_fixture_1&quot;, &quot;suiteId&quot;: &quot;suite_fixture&quot;, &quot;status&quot;: &quot;running&quot;, &quot;servers&quot;: [{&quot;</text><text x="20" y="995">id&quot;: &quot;server_fixture&quot;, &quot;name&quot;: &quot;Arithmetic&quot;}], &quot;environment&quot;: null}</text><text x="20" y="1015">/projects/project_fixture/eval-runs/run_fixture_1 200 {&quot;id&quot;: &quot;run_fixture_1&quot;, &quot;suiteId&quot;: &quot;suite_fixture&quot;, &quot;runNumber&quot;: 1, &quot;status&quot;</text><text x="20" y="1035">: &quot;completed&quot;, &quot;result&quot;: &quot;passed&quot;, &quot;summary&quot;: {&quot;total&quot;: 1, &quot;passed&quot;: 1, &quot;failed&quot;: 0, &quot;passRate&quot;: 1.0}, &quot;source&quot;: &quot;api&quot;, &quot;notes&quot;: &quot;</text><text x="20" y="1055">SIMULATED: deterministic fixture execution; no hosted model or live billing.&quot;, &quot;createdAt&quot;: 1794708878969, &quot;completedAt&quot;: 17947088</text><text x="20" y="1075">78969}</text><text x="20" y="1095">/projects/project_fixture/eval-runs/run_fixture_1/iterations 200 {&quot;items&quot;: [{&quot;id&quot;: &quot;run_fixture_1_0&quot;, &quot;testCaseId&quot;: &quot;case_add&quot;, &quot;t</text><text x="20" y="1115">itle&quot;: &quot;add 2 and 3 returns 5&quot;, &quot;iterationNumber&quot;: 1, &quot;status&quot;: &quot;completed&quot;, &quot;result&quot;: &quot;passed&quot;, &quot;actualToolCalls&quot;: [{&quot;toolName&quot;: </text><text x="20" y="1135">&quot;add&quot;, &quot;arguments&quot;: {&quot;a&quot;: 2, &quot;b&quot;: 3}, &quot;result&quot;: {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 5}&quot;}], &quot;structuredContent&quot;: {&quot;sum</text><text x="20" y="1155">&quot;: 5}, &quot;isError&quot;: false}}], &quot;expectedToolCalls&quot;: [], &quot;durationMs&quot;: 1, &quot;error&quot;: null}]}</text><text x="20" y="1175">/projects/project_fixture/eval-runs/run_fixture_1/decision-summary 404 {&quot;code&quot;: &quot;NOT_FOUND&quot;, &quot;message&quot;: &quot;Synthetic fixture does no</text><text x="20" y="1195">t implement this route.&quot;}</text><text x="20" y="1215"></text><text x="20" y="1235">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
 servers in your MCPJam projects: diagnostics, tool calls, prompt rendering, and asynchronous eval</text><text x="20" y="955"> runs.</text><text x="20" y="975"></text><text x="20" y="995">&gt; [!WARNING]</text><text x="20" y="1015">&gt;</text><text x="20" y="1035">&gt; **The MCPJam API is in preview.** It works today and we use it ourselves, but</text><text x="20" y="1055">&gt; it has not been generally announced and the surface may change, including in</text><text x="20" y="1075">&gt; breaking ways, while we finish the design. Pin your integration to the</text><text x="20" y="1095">&gt; behaviors documented on this page, build a [tolerant</text><text x="20" y="1115">&gt; reader](#versioning--stability), and expect to revisit it. Feedback is very</text><text x="20" y="1135">&gt; welcome on [Discord](https://discord.gg/JEnDtz8X6z) or</text><text x="20" y="1155">&gt; [GitHub](https://github.com/MCPJam/inspector/issues).</text><text x="20" y="1175"></text><text x="20" y="1195">&gt; [card] [Create an API key](https://app.mcpjam.com/settings/api-keys)</text><text x="20" y="1215">&gt;</text><text x="20" y="1235">&gt; Go straight to key management in the hosted app. If you&#x27;re signed out,</text><text x="20" y="1255">&gt; you&#x27;ll be asked to sign in and then land right back on the API keys page.</text><text x="20" y="1275"></text><text x="20" y="1295">The MCPJam API lets you operate the MCP servers saved in your</text><text x="20" y="1315">[hosted](https://docs.mcpjam.com/hosted/overview.md) projects (from CI, scripts, or your own agents)</text><text x="20" y="1335">without opening the UI.</text><text x="20" y="1355"></text></g></svg>
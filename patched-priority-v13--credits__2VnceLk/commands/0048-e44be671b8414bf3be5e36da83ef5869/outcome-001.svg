<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">e44be671b8414bf3be5e36da83ef5869 — page 1</text><text x="20" y="75">$ /bin/bash -c python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json</text><text x="20" y="115">s=json.load(open(&#x27;/workspace/mcp-eval/docs/openapi.json&#x27;))</text><text x="20" y="135">for path in [&#x27;/me&#x27;,&#x27;/organizations/{organizationId}/spend-budget&#x27;,&#x27;/projects/{projectId}/eval-runs&#x27;,&#x27;/projects/{projectId}/eval-su</text><text x="20" y="155">ites/{suiteId}&#x27;]:</text><text x="20" y="175"> print(path,json.dumps(s[&#x27;paths&#x27;][path])[:15000])</text><text x="20" y="195">PY</text><text x="20" y="215">rg -n -i &#x27;credit|usage|cost|billing&#x27; /workspace/mcp-eval/docs/public-api.md</text><text x="20" y="235">/me {&quot;get&quot;: {&quot;operationId&quot;: &quot;getMe&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;Get the authenticated account&quot;, &quot;description&quot;: &quot;The user beh</text><text x="20" y="255">ind the API key (keys act as their creator, scoped to one organization).&quot;, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The account.&quot;, &quot;c</text><text x="20" y="275">ontent&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/Me&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthori</text><text x="20" y="295">zed&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;:</text><text x="20" y="315"> &quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#/components/responses/ServerUnreachable&quot;}}}}</text><text x="20" y="335">/organizations/{organizationId}/spend-budget {&quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/components/parameters/organizationId&quot;}], &quot;get&quot;: {&quot;operati</text><text x="20" y="355">onId&quot;: &quot;getSpendBudget&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;Read the organization&#x27;s spend budget&quot;, &quot;description&quot;: &quot;The ceiling on wh</text><text x="20" y="375">at this organization may spend on MCPJam-billed work (chat, evals, judges and computer time) in the current billing window, and ho</text><text x="20" y="395">w much of it has been spent.\n\nAny member may read it: a member who cannot raise the ceiling still needs to know it exists, becau</text><text x="20" y="415">se it is what refused their run. `capUsd: null` means the organization is uncapped, which is the default.\n\nRuns that use your ow</text><text x="20" y="435">n provider keys are never counted against the budget and never blocked by it. Neither is the free daily allowance: it is not credi</text><text x="20" y="455">ts.&quot;, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The organization&#x27;s spend budget.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;:</text><text x="20" y="475"> &quot;#/components/schemas/SpendBudget&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/res</text><text x="20" y="495">ponses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;}, &quot;50</text><text x="20" y="515">0&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}}}, &quot;put&quot;: {&quot;operationId&quot;: &quot;setSpendBudget&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;</text><text x="20" y="535">Set the organization&#x27;s spend budget&quot;, &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner or admin.**\n\nWhe</text><text x="20" y="555">n the budget is reached, new MCPJam-billed work (chat turns, eval runs, computer starts) is refused for the whole organization unt</text><text x="20" y="575">il the window resets or an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until </text><text x="20" y="595">they hibernate.\n\n`capUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports wha</text><text x="20" y="615">t was kept. Changing the cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization wa</text><text x="20" y="635">s already told about.&quot;, &quot;requestBody&quot;: {&quot;required&quot;: true, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schema</text><text x="20" y="655">s/SpendBudgetInput&quot;}}}}, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The stored spend budget.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema</text><text x="20" y="675">&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/com</text><text x="20" y="695">ponents/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateLim</text><text x="20" y="715">ited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}}}, &quot;delete&quot;: {&quot;operationId&quot;: &quot;clearSpendBudget&quot;, &quot;tags&quot;: [&quot;Catalog</text><text x="20" y="735">&quot;], &quot;summary&quot;: &quot;Remove the organization&#x27;s spend budget&quot;, &quot;description&quot;: &quot;Leave the organization uncapped. **Requires organization </text><text x="20" y="755">owner or admin.**\n\nThe window&#x27;s spend counter survives: it is a record of spend, not of the budget, and a budget set again later</text><text x="20" y="775"> measures against the spend already made this period.&quot;, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The spend budget, now uncapped.&quot;, &quot;c</text><text x="20" y="795">ontent&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/</text><text x="20" y="815">Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;</text><text x="20" y="835">$ref&quot;: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}}}}</text><text x="20" y="855">/projects/{projectId}/eval-runs {&quot;post&quot;: {&quot;operationId&quot;: &quot;createEvalRun&quot;, &quot;tags&quot;: [&quot;Eval runs&quot;], &quot;summary&quot;: &quot;Create an eval run (a</text><text x="20" y="875">sync)&quot;, &quot;description&quot;: &quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution an</text><text x="20" y="895">d responds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}</text><text x="20" y="915">` for progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests</text><text x="20" y="935"> reruns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` wi</text><text x="20" y="955">th `details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose w</text><text x="20" y="975">hich one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple fo</text><text x="20" y="995">r the life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launche</text><text x="20" y="1015">r` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;, &quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/componen</text><text x="20" y="1035">ts/parameters/evalVocabularyHeader&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/launcherHea</text><text x="20" y="1055">der&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;}], &quot;requestBody&quot;: {&quot;required&quot;: true, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;:</text><text x="20" y="1075"> {&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;}, &quot;example&quot;: {&quot;suiteName&quot;: &quot;smoke&quot;, &quot;serverIds&quot;: [&quot;srv_abc123&quot;], &quot;tests&quot;: [{</text><text x="20" y="1095">&quot;title&quot;: &quot;echo works&quot;, &quot;runs&quot;: 1, &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;, &quot;provider&quot;: &quot;anthropic&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;</text><text x="20" y="1115">prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot;}, {&quot;id&quot;: &quot;s2&quot;, &quot;kind&quot;: &quot;assert&quot;, &quot;assertion&quot;: {&quot;type&quot;: &quot;toolCalledWith&quot;, &quot;toolNam</text><text x="20" y="1135">e&quot;: &quot;echo&quot;, &quot;args&quot;: {&quot;args&quot;: {&quot;text&quot;: &quot;hi&quot;}}}}]}]}}}}, &quot;responses&quot;: {&quot;202&quot;: {&quot;description&quot;: &quot;Run created; execution continues in t</text><text x="20" y="1155">he background.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreated&quot;}, &quot;example&quot;: {&quot;runId&quot;: </text><text x="20" y="1175">&quot;run_abc123&quot;, &quot;suiteId&quot;: &quot;suite_def456&quot;, &quot;status&quot;: &quot;running&quot;, &quot;caseUpsert&quot;: {&quot;committed&quot;: [{&quot;name&quot;: &quot;echo works&quot;}], &quot;failed&quot;: []},</text><text x="20" y="1195"> &quot;environment&quot;: null}}}}, &quot;400&quot;: {&quot;$ref&quot;: &quot;#/components/responses/ValidationError&quot;}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unaut</text><text x="20" y="1215">horized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;</text><text x="20" y="1235">: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#/components/re</text><text x="20" y="1255">sponses/ServerUnreachable&quot;}, &quot;504&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="1275">/projects/{projectId}/eval-suites/{suiteId} {&quot;get&quot;: {&quot;operationId&quot;: &quot;getEvalSuite&quot;, &quot;x-mcpjam-eval-vocabulary&quot;: {&quot;2&quot;: {&quot;response&quot;:</text><text x="20" y="1295"> &quot;EvalSuiteDetailV2&quot;}}, &quot;tags&quot;: [&quot;Eval runs&quot;], &quot;summary&quot;: &quot;Get one eval suite&#
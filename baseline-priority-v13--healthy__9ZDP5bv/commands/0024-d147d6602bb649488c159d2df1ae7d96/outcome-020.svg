uthored_2\&quot;,\n        \&quot;status\&quot;: \&quot;completed\&quot;,\n        </text><text x="20" y="575">\&quot;result\&quot;: \&quot;passed\&quot;,\n        \&quot;summary\&quot;: {\n          \&quot;total\&quot;: 1,\n          \&quot;passed\&quot;: 1,\n          \&quot;failed\&quot;: 0,\n    </text><text x="20" y="595">      \&quot;passRate\&quot;: 1\n        },\n        \&quot;iterationsComplete\&quot;: true\n      }\n    ],\n    \&quot;project\&quot;: {\n      \&quot;id\&quot;: \&quot;proj</text><text x="20" y="615">ect_fixture\&quot;,\n      \&quot;name\&quot;: \&quot;Fixture\&quot;,\n      \&quot;sensitive_value\&quot;: \&quot;[REDACTED]\&quot;\n    },\n    \&quot;suite\&quot;: {\n      \&quot;id\&quot;: \</text><text x="20" y="635">&quot;suite_authored_2\&quot;,\n      \&quot;name\&quot;: \&quot;Arithmetic add deterministic\&quot;\n    }\n  },\n  \&quot;decisionSummary\&quot;: {\n    \&quot;schemaVersion</text><text x="20" y="655">\&quot;: 1,\n    \&quot;runId\&quot;: \&quot;run_fixture_1\&quot;,\n    \&quot;runStatus\&quot;: \&quot;completed\&quot;,\n    \&quot;diagnostics\&quot;: {\n      \&quot;items\&quot;: [],\n      </text><text x="20" y="675">\&quot;complete\&quot;: true,\n      \&quot;scanne&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: false}, &quot;tool_resu</text><text x="20" y="695">lt_meta&quot;: [{&quot;id&quot;: &quot;toolu_01PsSKJuUN3HG7f7kdEzR7DT&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type</text><text x="20" y="715">&quot;: &quot;mode&quot;}}]}</text><text x="20" y="735">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3tLASKt1pR2gvBvNLFM&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="755">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;The server is valid and the repeatable eval passes: 1 of 1 cases, verdict `passe</text><text x="20" y="775">d`.\n\n**First result.** I ran the CLI (`npx -y @mcpjam/cli@latest`) against `http://fixture:8765/mcp`.\n- `server probe` reported</text><text x="20" y="795"> the server as ready over streamable HTTP, protocol 2025-11-25. The server is named `arithmetic-fixture` and needs no OAuth.\n- `t</text><text x="20" y="815">ools list` showed one tool, `add`, which is read-only.\n- `tools call add {a:2,b:3}` returned `{\&quot;sum\&quot;:5}`.\n\n**Repeatable eval.</text><text x="20" y="835">** The project already had an `Arithmetic` server entry (`server_fixture`), so I used it. I created the suite `Arithmetic add dete</text><text x="20" y="855">rministic` (`suite_authored_2`) in `project_fixture`. It has one `toolCall` step that calls `add` with 2 and 3, followed by an ass</text><text x="20" y="875">ertion that `add` was called. I ran it with `mcpjam cloud eval run --suite \&quot;Arithmetic add deterministic\&quot; --wait`, and the repor</text><text x="20" y="895">t is saved in `/workspace/report.json`.\n\nTo repeat it:\n```\nnpx -y @mcpjam/cli@latest --quiet cloud eval run --project project_</text><text x="20" y="915">fixture --suite \&quot;Arithmetic add deterministic\&quot; --wait --reporter json-summary --out report.json\n```\nThe suite definition is `/</text><text x="20" y="935">workspace/suite.json`. Re-running `cloud eval create` with it would add another suite rather than update this one.\n\n**Concerns.*</text><text x="20" y="955">*\n- **Prompt-based suite refused:** I first built a suite where a model prompts the tool. The run was refused with `FEATURE_NOT_S</text><text x="20" y="975">UPPORTED`: this account only supports deterministic `toolCall` steps and a limited set of assertions. So I have not tested anythin</text><text x="20" y="995">g that needs a model to choose the tool.\n- **Suite format found by trial and error:** I had to find the required fields by trying</text><text x="20" y="1015"> and fixing validation errors: `steps[].id`, and `serverName` on `toolCall` steps. The docs I read showed the local YAML format, n</text><text x="20" y="1035">ot this create-API JSON shape, and I did not find a schema page. A documented example of that JSON would have saved several attemp</text><text x="20" y="1055">ts.\n- **Server connect not implemented:** `cloud projects servers connect` returned \&quot;route not implemented\&quot;, which didn&#x27;t matte</text><text x="20" y="1075">r since the server was already saved.\n- **Leftover suite:** I created `suite_authored_1`, the prompt-based one that can&#x27;t run. It</text><text x="20" y="1095"> is still in the project and can be deleted.&quot;}], &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: nu</text><text x="20" y="1115">ll, &quot;usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_creation_input_tokens&quot;: 1637, &quot;cache_read_input_tokens&quot;: 35820, &quot;cache_creation&quot;: {&quot;epheme</text><text x="20" y="1135">ral_5m_input_tokens&quot;: 0, &quot;ephemeral_1h_input_tokens&quot;: 1637}, &quot;output_tokens&quot;: 754, &quot;service_tier&quot;: &quot;standard&quot;, &quot;inference_geo&quot;: &quot;g</text><text x="20" y="1155">lobal&quot;, &quot;speed&quot;: &quot;standard&quot;}, &quot;input_transformations&quot;: [], &quot;diagnostics&quot;: null, &quot;context_management&quot;: null}, &quot;parent_tool_use_id&quot;:</text><text x="20" y="1175"> null, &quot;session_id&quot;: &quot;b8418095-1e1d-42fc-943b-70eb53940848&quot;, &quot;uuid&quot;: &quot;f07e87be-bf93-4b00-8dd9-b94be2b22806&quot;, &quot;timestamp&quot;: &quot;2026-11</text><text x="20" y="1195">-15T01:58:46.525Z&quot;, &quot;request_id&quot;: &quot;req_011Ch3tLAFADx9bVcogViCcE&quot;}</text><text x="20" y="1215">{&quot;duration_api_ms&quot;: 41927, &quot;s
, or upload a versioned suite file and</text><text x="20" y="1175"> run\nit. The upload-and-launch has a 120s deadline overall, not per request (raise it\nwith the global --timeout &lt;ms&gt;); --wait-ti</text><text x="20" y="1195">meout bounds the RUN instead.\n\nOptions:\n  --suite &lt;id-or-name&gt;                      Eval suite name or ID\n  --file &lt;path&gt;     </text><text x="20" y="1215">                        Versioned suite file to upload and run (.yaml or .json, or - for stdin)\n  --project &lt;id-or-name&gt;         </text><text x="20" y="1235">           Project name or ID (defaults to the most recently updated project)\n  --server &lt;id-or-name...&gt;                  Overrid</text><text x="20" y="1255">e the suite&#x27;s saved server selection (HTTP servers only)\n  --environment &lt;id-or-name...&gt;             Attached project environment</text><text x="20" y="1275">(s) to run. Several values start one PAID RUN each.\n  --client &lt;id-or-name...&gt;                  Attached client(s) to run, so the</text><text x="20" y="1295"> run is stamped with that client&#x27;s config. Several values start one PAID RUN each.\n  --host &lt;id-or-name...&gt;                    De</text><text x="20" y="1315">precated alias for --client. NOT the host-compat catalog id `mcpjam tools --host` takes.\n  --all-targets                         </text><text x="20" y="1335">    Run EVERY attached environment (or, if none, every attached host) — one PAID RUN per target\n  --iterations &lt;n&gt;               </text><text x="20" y="1355">           Run each case this many times under verdict policy 2 (1-10)\n  --repetitions &lt;n&gt;                         Legacy spellin</text></g></svg>
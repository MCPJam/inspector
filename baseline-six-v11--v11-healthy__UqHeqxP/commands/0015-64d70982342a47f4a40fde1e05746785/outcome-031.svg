0" y="655">n of my prompt-based suite failed with \&quot;hosted prompt/model execution is not implemented\&quot;. The fixture only runs deterministic `</text><text x="20" y="675">toolCall` steps.\n- **Upload of my own suite file failed:** uploading my `toolCall` suite file (`arith-hosted.yaml`) returned `NOT</text><text x="20" y="695">_FOUND` (\&quot;does not implement this route\&quot;). I didn&#x27;t find the cause. Running the pre-existing suite by ID worked.\n- **Docs gap:*</text><text x="20" y="715">* I couldn&#x27;t find a documented schema for `toolCall` steps, so my field names are guesses.\n- **Leftovers from my mistakes:**\n  -</text><text x="20" y="735"> I created a duplicate saved server, `server_authored_1`, because I didn&#x27;t list the project&#x27;s servers first. Deleting it also retu</text><text x="20" y="755">rned `NOT_FOUND`, so it is still there.\n  - My earlier suite upload also created `suite_authored_1` (\&quot;Arithmetic fixture\&quot;). I d</text><text x="20" y="775">idn&#x27;t delete it.&quot;, &quot;ttft_ms&quot;: 2559, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 123487, &quot;uuid&quot;: &quot;dd163c66-d5b5-4915-a403-e53ea4b2f74d&quot;, &quot;ttft</text><text x="20" y="795">_stream_ms&quot;: 1950, &quot;time_to_request_ms&quot;: 102, &quot;first_content_frame_ms&quot;: 1950, &quot;queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_us</text><text x="20" y="815">age_since_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 50, &quot;outputTokens&quot;: 6941, &quot;cacheReadInputTokens&quot;: 1068864, &quot;cacheCre</text><text x="20" y="835">ationInputTokens&quot;: 43810, &quot;webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.3516364, &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thin</text><text x="20" y="855">kingTokens&quot;: 969, &quot;cacheCreationEphemeral5mInputTokens&quot;: 0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 43810, &qu
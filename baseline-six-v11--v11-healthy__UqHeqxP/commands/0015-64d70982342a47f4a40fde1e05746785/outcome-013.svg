n |\n| `auto` or `mcpjam` | `mcpjam/provider/model` | MCPJam |\n| `byok` | `mcpjam/…` | refused — the prefix is explicit routing </text><text x="20" y="1175">intent |\n| `byok` | `provider/model` | BYOK; the provider key is required |\n| `mcpjam` | `provider/model` | MCPJam; the model mu</text><text x="20" y="1195">st be one MCPJam serves |\n\nThere is no fallback: a key the provider rejects is a credential failure (exit `3`), never a reason t</text><text x="20" y="1215">o spend platform credits instead.\n\nBYOK keys are read from the standard variables: `ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, `GOOGL</text><text x="20" y="1235">E_GENERATIVE_AI_API_KEY` (or `GEMINI_API_KEY`), `DEEPSEEK_API_KEY`, `MISTRAL_API_KEY`, `OPENROUTER_API_KEY`, `XAI_API_KEY`. `ANTHR</text><text x="20" y="1255">OPIC_BASE_URL`, `OPENAI_BASE_URL` and `OLLAMA_BASE_URL` point a provider at a gateway or proxy.\n\nMCPJam-hosted inference uses th</text><text x="20" y="1275">e Cloud credential precedence (`--api-key` &gt; `MCPJAM_API_KEY` &gt; `mcpjam cloud login`) and project precedence (`--project` &gt; `MCPJA</text><text x="20" y="1295">M_PROJECT` &gt; `mcpjam cloud link` &gt; most recently updated), plus `--api-url` / `--api-header`. The platform is contacted only when </text><text x="20" y="1315">a selected case needs it. Hosted inference still makes inference and billing requests; \&quot;no upload\&quot; means no e\n\n## Hosts\n\n`--</text><text x="20" y="1335">host &lt;template&gt;` emulates one existing host template — its `initialize` identity, advertised capabilities, protocol versions and t</text><text x="20" y="1355">ool visibility, plus its model settings where the suite does not set them. It never launches the real client, and reports say \&quot;em</text></g></svg>
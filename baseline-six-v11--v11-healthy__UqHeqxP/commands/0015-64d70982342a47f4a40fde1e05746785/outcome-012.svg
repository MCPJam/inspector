<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">64d70982342a47f4a40fde1e05746785 — page 12</text><text x="20" y="75">ables\&quot;}\nmcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml\n```\n\n`--cas</text><text x="20" y="95">e` takes the exact authored id and is repeatable.\n\n## Server bindings\n\nFor each target server name, the first source with an e</text><text x="20" y="115">ntry wins — the whole entry, never a field-level merge:\n\n1. `--server &lt;name&gt;=&lt;url&gt;` (repeatable; HTTP(S) only). For a suite with</text><text x="20" y="135"> exactly one target, `--url` / `--command` and their auth flags bind it instead.\n2. `--mcp-config &lt;path&gt;` — an explicit MCP JSON </text><text x="20" y="155">config. A missing or invalid explicit file fails setup.\n3. `./.mcp.json`\n4. `./.mcpjam/mcp.json`\n\nPaths are relative to the di</text><text x="20" y="175">rectory you run the command in, not to the suite file. An explicit `--mcp-config` can bind some servers while the two conventional</text><text x="20" y="195"> files still supply the rest. A lower-precedence file is read only while names remain unbound, and entries for servers the suite d</text><text x="20" y="215">oes not target are ignored — their processes are never started. Every name still unbound is reported together (exit `4`).&quot;, &quot;stder</text><text x="20" y="235">r&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_01MCjwUwAixqytvtEkc</text><text x="20" y="255">s1uhY&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot
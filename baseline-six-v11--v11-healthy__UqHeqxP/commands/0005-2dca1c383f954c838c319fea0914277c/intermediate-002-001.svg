<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1005"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.29032278060913086s — page 1</text><text x="20" y="75">server references or fixtures against a project&#x27;s live discovery, so a file that</text><text x="20" y="95">validates here can still fail to run.</text><text x="20" y="115"></text><text x="20" y="135">#### `--project`: resolving the names against a real project</text><text x="20" y="155"></text><text x="20" y="175">With `--project`, the command authenticates, resolves the named project, and</text><text x="20" y="195">checks every deterministic `toolCall` step against the live tool inventory of</text><text x="20" y="215">the targets the file would run on. Structural findings are unchanged and the</text><text x="20" y="235">live half is additive, under its own key:</text><text x="20" y="255"></text><text x="20" y="275">```jsonc theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="295">{</text><text x="20" y="315">  &quot;valid&quot;: false,</text><text x="20" y="335">  &quot;file&quot;: &quot;.mcpjam/evals/s_billing.yaml&quot;,</text><text x="20" y="355">  &quot;suite&quot;: { &quot;id&quot;: &quot;s_billing&quot;, &quot;name&quot;: &quot;Billing smoke&quot;, &quot;cases&quot;: 12, &quot;enabledCases&quot;: 11 },</text><text x="20" y="375">  &quot;findings&quot;: [],</text><text x="20" y="395">  &quot;projectValidation&quot;: {</text><text x="20" y="415">    &quot;project&quot;: { &quot;id&quot;: &quot;proj_123&quot;, &quot;name&quot;: &quot;Alpha&quot; },</text><text x="20" y="435">    &quot;targets&quot;: [&quot;environment prod&quot;],</text><text x="20" y="455">    &quot;valid&quot;: false,</text><text x="20" y="475">    &quot;findings&quot;: [</text><text x="20" y="495">      {</text><text x="20" y="515">        &quot;code&quot;: &quot;TOOL_REFERENCE_UNRESOLVED&quot;,   // or TOOL_DISCOVERY_UNAVAILABLE</text><text x="20" y="535">        &quot;path&quot;: [&quot;cases&quot;, 1, &quot;steps&quot;, 0, &quot;toolName&quot;],</text><text x="20" y="555">        &quot;pointer&quot;: &quot;cases[1].steps[0].toolName&quot;,</text><text x="20" y="575">        &quot;caseId&quot;: &quot;c_render_legacy&quot;,</text><text x="20" y="595">        &quot;caseTitle&quot;: &quot;Renders the legacy receipt&quot;,</text><text x="20" y="615">        &quot;toolName&quot;: &quot;render_gone&quot;,</text><text x="20" y="635">        &quot;serverName&quot;: &quot;billing&quot;,</text><text x="20" y="655">        &quot;targetLabel&quot;: &quot;environment prod&quot;,</text><text x="20" y="675">        &quot;disabled&quot;: true,</text><text x="20" y="695">        &quot;imported&quot;: true,</text><text x="20" y="715">        &quot;message&quot;: &quot;Server \&quot;billing\&quot; in environment prod exposes no tool named \&quot;render_gone\&quot;.&quot;</text><text x="20" y="735">      }</text><text x="20" y="755">    ]</text><text x="20" y="775">  }</text><text x="20" y="795">}</text><text x="20" y="815">```</text><text x="20" y="835"></text><text x="20" y="855">Three properties of the live check are worth knowing before you rely on it:</text><text x="20" y="875"></text><text x="20" y="895">* **Only `toolCall` steps count.** A tool named in prompt text is a hint the</text><text x="20" y="915">  model may or may not act on, and an `assert` step is an expectation a case may</text><text x="20" y="935">  legitimately fail at run time. Treating either as a deterministic reference</text><text x="20" y="955">  would make a negative test unwritable.</text><text x="20" y="975">* **Per target, never over their union.** A file that runs against several</text></g></svg>
;arith\&quot; is not part of the file&#x27;s target.servers, </text><text x="20" y="715">so the deterministic call to \&quot;add\&quot; cannot execute there.&quot;}]}}</text><text x="20" y="735">Usage: mcpjam cloud [options] [command]</text><text x="20" y="755"></text><text x="20" y="775">MCPJam Cloud account commands (login, projects, evals, tunnels). Local MCP</text><text x="20" y="795">testing stays at the top level — `mcpjam oauth login` is MCP OAuth; `mcpjam</text><text x="20" y="815">cloud login` is your MCPJam account.</text><text x="20" y="835"></text><text x="20" y="855">Options:</text><text x="20" y="875">  --api-key &lt;key&gt;               MCPJam sk_ API key (overrides MCPJAM_API_KEY)</text><text x="20" y="895">  --api-url &lt;url&gt;               MCPJam API base URL (defaults to your</text><text x="20" y="915">                                organization&#x27;s server or</text><text x="20" y="935">                                https://app.mcpjam.com/api/v1)</text><text x="20" y="955">  --api-header &lt;header...&gt;      Extra request header for a deployment behind an</text><text x="20" y="975">                                edge authenticator, as &quot;Name: value&quot;</text><text x="20" y="995">                                (repeatable; also MCPJAM_API_HEADERS,</text><text x="20" y="1015">                                newline-separated)</text><text x="20" y="1035">  -h, --help                    display help for command</text><text x="20" y="1055"></text><text x="20" y="1075">Account:</text><text x="20" y="1095">  login [options]               Log in to MCPJam Cloud. Opens your browser for</text><text x="20" y="1115">                                OAuth and stores the session locally.</text><text x="20" y="1135"></text><text x="20" y="1155">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
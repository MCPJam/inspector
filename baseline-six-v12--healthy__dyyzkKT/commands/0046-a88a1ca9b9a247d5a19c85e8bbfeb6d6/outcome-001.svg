<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="785"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">a88a1ca9b9a247d5a19c85e8bbfeb6d6 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; api.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json, os, sys, urllib.request, urllib.error</text><text x="20" y="115">path, method, output = sys.argv[1:4]</text><text x="20" y="135">data = open(sys.argv[4], &#x27;rb&#x27;).read() if len(sys.argv)&gt;4 else None</text><text x="20" y="155">req = urllib.request.Request(os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;)+path, data=data, method=method, headers={&#x27;Authorization&#x27;:&#x27;Be</text><text x="20" y="175">arer &#x27;+os.environ[&#x27;MCPJAM_API_KEY&#x27;],&#x27;Content-Type&#x27;:&#x27;application/json&#x27;})</text><text x="20" y="195">try:</text><text x="20" y="215"> with urllib.request.urlopen(req, timeout=30) as r: result=json.load(r)</text><text x="20" y="235">except urllib.error.HTTPError as e:</text><text x="20" y="255"> print(e.read().decode());sys.exit(1)</text><text x="20" y="275">with open(output,&#x27;w&#x27;) as f:json.dump(result,f,indent=2)</text><text x="20" y="295">print(json.dumps(result,indent=2))</text><text x="20" y="315">PY</text><text x="20" y="335">python3 api.py /projects/project_fixture/eval-suites POST suite-created.json suite-create.json</text><text x="20" y="355">{</text><text x="20" y="375">  &quot;suiteId&quot;: &quot;suite_authored_1&quot;,</text><text x="20" y="395">  &quot;name&quot;: &quot;Arithmetic repeatable validation&quot;,</text><text x="20" y="415">  &quot;servers&quot;: [</text><text x="20" y="435">    {</text><text x="20" y="455">      &quot;id&quot;: &quot;server_fixture&quot;</text><text x="20" y="475">    }</text><text x="20" y="495">  ],</text><text x="20" y="515">  &quot;ho
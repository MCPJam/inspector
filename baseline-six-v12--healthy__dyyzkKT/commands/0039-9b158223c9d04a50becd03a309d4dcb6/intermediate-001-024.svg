<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.812577486038208s — page 24</text><text x="20" y="75">        An SDK assertion reported through UVC. Discovery assertions require</text><text x="20" y="95">        complete raw tool declarations; missing evidence is an evaluator error.</text><text x="20" y="115">        Observation kinds, including noDeprecatedToolExposed, require role</text><text x="20" y="135">        advisory. Structural schema; runtime also validates policy and unique</text><text x="20" y="155">        required annotation keys.</text><text x="20" y="175">    SuppressedSuiteStandardCheckIds:</text><text x="20" y="195">      maxItems: 64</text><text x="20" y="215">      type: array</text><text x="20" y="235">      items:</text><text x="20" y="255">        type: string</text><text x="20" y="275">        enum:</text><text x="20" y="295">          - discovery.description</text><text x="20" y="315">          - discovery.annotations</text><text x="20" y="335">          - discovery.collisions</text><text x="20" y="355">          - discovery.deprecated</text><text x="20" y="375">          - call.schema</text><text x="20" y="395">          - response.schema</text><text x="20" y="415">          - selection.hops</text><text x="20" y="435">          - call.parameters</text><text x="20" y="455">          - call.repeated</text><text x="20" y="475">          - response.performance</text><text x="20" y="495">          - response.size</text><text x="20" y="515">          - response.errors</text><text x="20" y="535">          - response.recovery</text><text x="20" y="555">          - response.pagination</text><text x="20" y="575">          - userValue.turns</text><text x="20" y="595">      description: &gt;-</text><text x="20" y="615">        Stable standard assertion family IDs suppressed from suite defaults.</text><text x="20" y="635">        Applies before inherit/extend/replace resolution; explicit case and step</text><text x="20" y="655">        assertions are preserved. Omitted updates preserve; [] clears. At most</text><text x="20" y="675">        64 IDs, normalized to unique sorted values.</text><text x="20" y="695">    Error:</text><text x="20" y="715">      type: object</text><text x="20" y="735">      required:</text><text x="20" y="755">        - code</text><text x="20" y="775">        - message</text><text x="20" y="795">      properties:</text><text x="20" y="815">        code:</text><text x="20" y="835">          type: string</text><text x="20" y="855">          description: &gt;-</text><text x="20" y="875">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="895">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="915">            status says otherwise.</text><text x="20" y="935">          enum:</text><text x="20" y="955">            - UNAUTHORIZED</text><text x="20" y="975">            - FORBIDDEN</text><text x="20" y="995">            - NOT_FOUND</text><text x="20" y="1015">            - CONFLICT</text><text x="20" y="1035">            - VALIDATION_ERROR</text><text x="20" y="1055">            - RATE_LIMITED</text><text x="20" y="1075">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="1095">            - SERVER_UNREACHABLE</text><text x="20" y="1115">            - TIMEOUT</text><text x="20" y="1135">            - OAUTH_REQUIRED</text><text x="20" y="1155">            - AUTH_REQUIRED</text><text x="20" y="1175">            - INTERNAL_ERROR</text><text x="20" y="1195">        message:</text><text x="20" y="1215">          type: string</text><text x="20" y="1235">          description: &gt;-</text><text x="20" y="1255">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="1275">            match on it.</text><text x="20" y="1295">        details:</text><text x="20" y="1315">          type: object</text><text x="20" y="1335">          description: Optional, unstructured context bag.</text><text x="20" y="1355">          additionalProperties: true</text></g></svg>
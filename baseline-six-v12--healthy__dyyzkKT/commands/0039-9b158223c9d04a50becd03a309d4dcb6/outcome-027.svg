<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 27</text><text x="20" y="75">              enum:</text><text x="20" y="95">                - i</text><text x="20" y="115">                - m</text><text x="20" y="135">                - s</text><text x="20" y="155">                - im</text><text x="20" y="175">                - is</text><text x="20" y="195">                - ms</text><text x="20" y="215">                - ims</text><text x="20" y="235">            path:</text><text x="20" y="255">              description: &gt;-</text><text x="20" y="275">                JSON Pointer (RFC 6901) to ONE top-level argument key, such as</text><text x="20" y="295">                /elements; inside the key, ~1 stands for / and ~0 for ~. Omit to</text><text x="20" y="315">                match the whole arguments object. A call without the key does</text><text x="20" y="335">                not match.</text><text x="20" y="355">              type: string</text><text x="20" y="375">              minLength: 2</text><text x="20" y="395">              maxLength: 257</text><text x="20" y="415">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="435">            min:</text><text x="20" y="455">              description: &gt;-</text><text x="20" y="475">                Minimum number of MATCHING calls (default 1). min 0 requires</text><text x="20" y="495">                max.</text><text x="20" y="515">              type: integer</text><text x="20" y="535">              minimum: 0</text><text x="20" y="555">              maximum: 9007199254740991</text><text x="20" y="575">            max:</text><text x="20" y="595">              description: &gt;-</text><text x="20" y="615">                Maximum number of MATCHING calls; at least min (or 1 when min is</text><text x="20" y="635">                omitted).</text><text x="20" y="655">              type: integer</text><text x="20" y="675">              minimum: 0</text><text x="20" y="695">              maximum: 9007199254740991</text><text x="20" y="715">            role:</text><text x="20" y="735">              type: string</text><text x="20" y="755">              enum:</text><text x="20" y="775">                - gating</text><text x="20" y="795">                - advisory</text><text x="20" y="815">                - required</text><text x="20" y="835">            severity:</text><text x="20" y="855">              type: string</text><text x="20" y="875">              const: warn</text><text x="20" y="895">          required:</text><text x="20" y="915">            - type</text><text x="20" y="935">            - toolName</text><text x="20" y="955">            - patterns</text><text x="20" y="975">        - type: object</text><text x="20" y="995">          description: &gt;-</text><text x="20" y="1015">            A tool result in scope (every result, or only toolName&#x27;s) whose</text><text x="20" y="1035">            content matches EVERY pattern (all within one result) occurred at</text><text x="20" y="1055">            least min (default 1) and at most max times. min and max count</text><text x="20" y="1075">            MATCHING results, not all results: min 0, max 0 means no result</text><text x="20" y="1095">            matches. The content is the result&#x27;s text, then structuredContent,</text><text x="20" y="1115">            then its JSON output part (JSON as canonical JSON), or, with path,</text><text x="20" y="1135">            the value at that key in structuredContent (in the JSON output part</text><text x="20" y="1155">            when there is no structuredContent). isError results are included. A</text><text x="20" y="1175">            result whose text was truncated for storage (when path is omitted),</text><text x="20" y="1195">            or whose subject exceeds 100000 characters, is unreadable; so are</text><text x="20" y="1215">            results an incomplete capture did not record. A verdict they could</text><text x="20" y="1235">            decide is unscored.</text><text x="20" y="1255">          properties:</text><text x="20" y="1275">            type:</text><text x="20" y="1295">              type: string</text><text x="20" y="1315">              const: toolResultMatches</text><text x="20" y="1335">            toolName:</text><text x="20" y="1355">              description: Omit to read every tool&#x27;s results.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 12</text><text x="20" y="75">        Which vocabulary this request and its response speak. Absent means `1`,</text><text x="20" y="95">        which is byte-for-byte today&#x27;s contract: the same request fields, the</text><text x="20" y="115">        same refusals, the same response projection. `2` is the canonical</text><text x="20" y="135">        vocabulary. Any other value is a `400` with `code: &quot;VALIDATION_ERROR&quot;`.</text><text x="20" y="155"></text><text x="20" y="175"></text><text x="20" y="195">        Today it decides one thing: the spelling of an evaluator&#x27;s policy</text><text x="20" y="215">        `role`. Vocabulary 1 accepts and returns `gating`; vocabulary 2 accepts</text><text x="20" y="235">        both spellings and returns the canonical `required`. Sending `required`</text><text x="20" y="255">        without the header is a `400`, deliberately — vocabulary 1 is not</text><text x="20" y="275">        widened to meet vocabulary 2 half way, because a boundary that accepts a</text><text x="20" y="295">        spelling it does not announce is one two implementations can disagree</text><text x="20" y="315">        about.</text><text x="20" y="335"></text><text x="20" y="355"></text><text x="20" y="375">        A response that varies by vocabulary sends `Vary:</text><text x="20" y="395">        x-mcpjam-eval-vocabulary`.</text><text x="20" y="415">      schema:</text><text x="20" y="435">        type: string</text><text x="20" y="455">        enum:</text><text x="20" y="475">          - &#x27;1&#x27;</text><text x="20" y="495">          - &#x27;2&#x27;</text><text x="20" y="515">      example: &#x27;2&#x27;</text><text x="20" y="535">    projectId:</text><text x="20" y="555">      name: projectId</text><text x="20" y="575">      in: path</text><text x="20" y="595">      required: true</text><text x="20" y="615">      description: ID of the hosted project that contains the server.</text><text x="20" y="635">      schema:</text><text x="20" y="655">        type: string</text><text x="20" y="675">  schemas:</text><text x="20" y="695">    EvalSuiteCreateRequest:</text><text x="20" y="715">      type: object</text><text x="20" y="735">      description: &gt;-</text><text x="20" y="755">        Author-only suite-create body. A suite-level default `model` (and</text><text x="20" y="775">        optional `provider`) applies to every test unless the test overrides it.</text><text x="20" y="795">      required:</text><text x="20" y="815">        - name</text><text x="20" y="835">        - serverIds</text><text x="20" y="855">        - model</text><text x="20" y="875">        - tests</text><text x="20" y="895">      properties:</text><text x="20" y="915">        name:</text><text x="20" y="935">          type: string</text><text x="20" y="955">          minLength: 1</text><text x="20" y="975">          description: Suite name.</text><text x="20" y="995">        description:</text><text x="20" y="1015">          type: string</text><text x="20" y="1035">        serverIds:</text><text x="20" y="1055">          type: array</text><text x="20" y="1075">          minItems: 1</text><text x="20" y="1095">          description: Servers (by canonical project ID) the suite&#x27;s cases run against.</text><text x="20" y="1115">          items:</text><text x="20" y="1135">            type: string</text><text x="20" y="1155">        serverNames:</text><text x="20" y="1175">          type: array</text><text x="20" y="1195">          description: Optional display names, parallel to `serverIds`.</text><text x="20" y="1215">          items:</text><text x="20" y="1235">            type: string</text><text x="20" y="1255">        hosts:</text><text x="20" y="1275">          type: array</text><text x="20" y="1295">          description: &gt;-</text><text x="20" y="1315">            Clients (hosts) to attach the suite to, in attach order. A suite</text><text x="20" y="1335">            with no attached client reports none wherever it is listed, and a</text><text x="20" y="1355">            run has no host to select. Same shape as the PATCH `hosts` field.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.812577486038208s — page 19</text><text x="20" y="75">              type: string</text><text x="20" y="95">              const: warn</text><text x="20" y="115">          required:</text><text x="20" y="135">            - type</text><text x="20" y="155">            - maxBytes</text><text x="20" y="175">        - type: object</text><text x="20" y="195">          properties:</text><text x="20" y="215">            type:</text><text x="20" y="235">              type: string</text><text x="20" y="255">              const: argumentsMatchToolSchema</text><text x="20" y="275">            toolName:</text><text x="20" y="295">              type: string</text><text x="20" y="315">              minLength: 1</text><text x="20" y="335">            role:</text><text x="20" y="355">              type: string</text><text x="20" y="375">              enum:</text><text x="20" y="395">                - gating</text><text x="20" y="415">                - advisory</text><text x="20" y="435">                - required</text><text x="20" y="455">            severity:</text><text x="20" y="475">              type: string</text><text x="20" y="495">              const: warn</text><text x="20" y="515">          required:</text><text x="20" y="535">            - type</text><text x="20" y="555">        - type: object</text><text x="20" y="575">          description: &gt;-</text><text x="20" y="595">            A call to toolName whose input matches EVERY pattern (all within one</text><text x="20" y="615">            call) occurred at least min (default 1) and at most max times. min</text><text x="20" y="635">            and max count MATCHING calls, not all calls: min 0, max 0 means no</text><text x="20" y="655">            call matches, not that the tool was never called (use</text><text x="20" y="675">            toolNeverCalled for that). Patterns are re2js regular expressions</text><text x="20" y="695">            (no lookaround, no backreferences) matched against the canonical</text><text x="20" y="715">            JSON of the arguments (sorted keys, no whitespace), or only the</text><text x="20" y="735">            argument at path when set (a string value as-is, anything else as</text><text x="20" y="755">            canonical JSON). A call whose subject exceeds 100000 characters is</text><text x="20" y="775">            unreadable, and a verdict it could decide is unscored.</text><text x="20" y="795">          properties:</text><text x="20" y="815">            type:</text><text x="20" y="835">              type: string</text><text x="20" y="855">              const: toolInputMatches</text><text x="20" y="875">            toolName:</text><text x="20" y="895">              type: string</text><text x="20" y="915">              minLength: 1</text><text x="20" y="935">            patterns:</text><text x="20" y="955">              description: &gt;-</text><text x="20" y="975">                Every pattern must match the same call. Use alternation (A|B)</text><text x="20" y="995">                inside one pattern for either.</text><text x="20" y="1015">              minItems: 1</text><text x="20" y="1035">              maxItems: 8</text><text x="20" y="1055">              type: array</text><text x="20" y="1075">              items:</text><text x="20" y="1095">                type: string</text><text x="20" y="1115">                minLength: 1</text><text x="20" y="1135">                maxLength: 512</text><text x="20" y="1155">            flags:</text><text x="20" y="1175">              description: &gt;-</text><text x="20" y="1195">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="1215">                matches newline).</text><text x="20" y="1235">              type: string</text><text x="20" y="1255">              enum:</text><text x="20" y="1275">                - i</text><text x="20" y="1295">                - m</text><text x="20" y="1315">                - s</text><text x="20" y="1335">                - im</text><text x="20" y="1355">                - is</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 15</text><text x="20" y="75">              expectedOutput:</text><text x="20" y="95">                type: string</text><text x="20" y="115">              isNegativeTest:</text><text x="20" y="135">                type: boolean</text><text x="20" y="155">                description: When `true`, the case passes if NO tools are called.</text><text x="20" y="175">              scenario:</text><text x="20" y="195">                type: string</text><text x="20" y="215">              advancedConfig:</text><text x="20" y="235">                type: object</text><text x="20" y="255">                description: &gt;-</text><text x="20" y="275">                  Optional `system`, `temperature`, `toolChoice` overrides.</text><text x="20" y="295">                  `reasoningEffort` is NOT accepted (`400`): nothing ever</text><text x="20" y="315">                  applied it. Save an effort as</text><text x="20" y="335">                  `models[].selection.settings.reasoningEffort` instead.</text><text x="20" y="355">                additionalProperties: true</text><text x="20" y="375">              intent:</text><text x="20" y="395">                type: string</text><text x="20" y="415">                minLength: 1</text><text x="20" y="435">                maxLength: 64</text><text x="20" y="455">                description: Optional authored analytics grouping label.</text><text x="20" y="475">              matchOptions:</text><text x="20" y="495">                type: object</text><text x="20" y="515">                description: &gt;-</text><text x="20" y="535">                  Per-case tool-call matching override, in either vocabulary:</text><text x="20" y="555">                  public (`toolCallOrder: any|in-order|exact`, `extraToolCalls`,</text><text x="20" y="575">                  `arguments`) or internal (`toolCallOrder:</text><text x="20" y="595">                  ignore|superset|strict`, `maxExtraToolCalls`,</text><text x="20" y="615">                  `argumentMatching`), never both in one object.</text><text x="20" y="635">                additionalProperties: true</text><text x="20" y="655">              predicates:</text><text x="20" y="675">                type: object</text><text x="20" y="695">                deprecated: true</text><text x="20" y="715">                description: &gt;-</text><text x="20" y="735">                  DEPRECATED spelling of `checks`, which means exactly this. It</text><text x="20" y="755">                  was accepted here all along and never written down, passing</text><text x="20" y="775">                  only because this schema allowed unknown properties;</text><text x="20" y="795">                  documented rather than removed so no caller already sending it</text><text x="20" y="815">                  breaks. Send one or the other, never both.</text><text x="20" y="835">                properties:</text><text x="20" y="855">                  mode:</text><text x="20" y="875">                    type: string</text><text x="20" y="895">                    enum:</text><text x="20" y="915">                      - inherit</text><text x="20" y="935">                      - replace</text><text x="20" y="955">                      - extend</text><text x="20" y="975">                  list:</text><text x="20" y="995">                    type: array</text><text x="20" y="1015">                    items:</text><text x="20" y="1035">                      type: object</text><text x="20" y="1055">              isNegative:</text><text x="20" y="1075">                type: boolean</text><text x="20" y="1095">                description: &gt;-</text><text x="20" y="1115">                  Alias for `isNegativeTest` — the public case-authoring</text><text x="20" y="1135">                  spelling this API returns on a read. Send one or the other,</text><text x="20" y="1155">                  never both.</text><text x="20" y="1175">              iterations:</text><text x="20" y="1195">                type: integer</text><text x="20" y="1215">                minimum: 1</text><text x="20" y="1235">                maximum: 10</text><text x="20" y="1255">                description: Alias for `runs`. Send one or the other, never both.</text><text x="20" y="1275">              checks:</text><text x="20" y="1295">                type: object</text><text x="20" y="1315">                description: &gt;-</text><text x="20" y="1335">                  Per-case CHECK gate — the grading rules this case is scored</text><text x="20" y="1355">                  against. `mode` says how they combine with the suite&#x27;s own:</text></g></svg>
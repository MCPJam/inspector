<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 11</text><text x="20" y="75"></text><text x="20" y="95">        The body uses an ergonomic authoring shape: a suite-level default</text><text x="20" y="115">        `model` (and optional `provider`) applies to every test unless the test</text><text x="20" y="135">        overrides it; `provider` is derived from a `provider/model` id when</text><text x="20" y="155">        neither is supplied. Each test&#x27;s case body is an ordered `steps` array</text><text x="20" y="175">        (prompt / toolCall / interact / assert).</text><text x="20" y="195"></text><text x="20" y="215"></text><text x="20" y="235">        Guest callers are denied (suite creation is a write).</text><text x="20" y="255">      operationId: createEvalSuite</text><text x="20" y="275">      parameters:</text><text x="20" y="295">        - $ref: &#x27;#/components/parameters/evalVocabularyHeader&#x27;</text><text x="20" y="315">        - $ref: &#x27;#/components/parameters/projectId&#x27;</text><text x="20" y="335">      requestBody:</text><text x="20" y="355">        required: true</text><text x="20" y="375">        content:</text><text x="20" y="395">          application/json:</text><text x="20" y="415">            schema:</text><text x="20" y="435">              $ref: &#x27;#/components/schemas/EvalSuiteCreateRequest&#x27;</text><text x="20" y="455">            example:</text><text x="20" y="475">              name: smoke</text><text x="20" y="495">              serverIds:</text><text x="20" y="515">                - srv_abc123</text><text x="20" y="535">              model: anthropic/claude-haiku-4.5</text><text x="20" y="555">              tests:</text><text x="20" y="575">                - title: lists files</text><text x="20" y="595">                  steps:</text><text x="20" y="615">                    - id: s1</text><text x="20" y="635">                      kind: prompt</text><text x="20" y="655">                      prompt: List the files in the project root.</text><text x="20" y="675">                    - id: s2</text><text x="20" y="695">                      kind: assert</text><text x="20" y="715">                      assertion:</text><text x="20" y="735">                        type: toolCalledWith</text><text x="20" y="755">                        toolName: list_files</text><text x="20" y="775">                        args:</text><text x="20" y="795">                          args: {}</text><text x="20" y="815">      responses:</text><text x="20" y="835">        &#x27;201&#x27;:</text><text x="20" y="855">          description: The suite was created.</text><text x="20" y="875">          content:</text><text x="20" y="895">            application/json:</text><text x="20" y="915">              schema:</text><text x="20" y="935">                $ref: &#x27;#/components/schemas/EvalSuiteCreated&#x27;</text><text x="20" y="955">        &#x27;400&#x27;:</text><text x="20" y="975">          $ref: &#x27;#/components/responses/ValidationError&#x27;</text><text x="20" y="995">        &#x27;401&#x27;:</text><text x="20" y="1015">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="1035">        &#x27;403&#x27;:</text><text x="20" y="1055">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="1075">        &#x27;404&#x27;:</text><text x="20" y="1095">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="1115">        &#x27;429&#x27;:</text><text x="20" y="1135">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="1155">        &#x27;500&#x27;:</text><text x="20" y="1175">          $ref: &#x27;#/components/responses/InternalErr
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 14</text><text x="20" y="75">                exclusiveMaximum: 1</text><text x="20" y="95">          oneOf:</text><text x="20" y="115">            - required:</text><text x="20" y="135">                - minimumPassRatePercent</text><text x="20" y="155">            - required:</text><text x="20" y="175">                - minimumPassRate</text><text x="20" y="195">          additionalProperties: false</text><text x="20" y="215">        tags:</text><text x="20" y="235">          type: array</text><text x="20" y="255">          description: Accepted for forward-compat; not persisted today (no-op).</text><text x="20" y="275">          items:</text><text x="20" y="295">            type: string</text><text x="20" y="315">        tests:</text><text x="20" y="335">          type: array</text><text x="20" y="355">          minItems: 1</text><text x="20" y="375">          maxItems: 100</text><text x="20" y="395">          description: &gt;-</text><text x="20" y="415">            Test cases to create in the suite. The object is CLOSED: an unknown</text><text x="20" y="435">            key is a VALIDATION_ERROR, never a silently dropped field.</text><text x="20" y="455">            `repetitions`, `passThreshold` and `kind` are per-case policy fields</text><text x="20" y="475">            this surface cannot author — set them through `POST</text><text x="20" y="495">            /v1/projects/{projectId}/eval-suites/{suiteId}/cases`.</text><text x="20" y="515">          items:</text><text x="20" y="535">            type: object</text><text x="20" y="555">            required:</text><text x="20" y="575">              - title</text><text x="20" y="595">              - steps</
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 28</text><text x="20" y="75">              type: string</text><text x="20" y="95">              minLength: 1</text><text x="20" y="115">            patterns:</text><text x="20" y="135">              description: &gt;-</text><text x="20" y="155">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="175">                inside one pattern for either.</text><text x="20" y="195">              minItems: 1</text><text x="20" y="215">              maxItems: 8</text><text x="20" y="235">              type: array</text><text x="20" y="255">              items:</text><text x="20" y="275">                type: string</text><text x="20" y="295">                minLength: 1</text><text x="20" y="315">                maxLength: 512</text><text x="20" y="335">            flags:</text><text x="20" y="355">              description: &gt;-</text><text x="20" y="375">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="395">                matches newline).</text><text x="20" y="415">              type: string</text><text x="20" y="435">              enum:</text><text x="20" y="455">                - i</text><text x="20" y="475">                - m</text><text x="20" y="495">                - s</text><text x="20" y="515">                - im</text><text x="20" y="535">                - is</text><text x="20" y="555">                - ms</text><text x="20" y="575">                - ims</text><text x="20" y="595">            path:</text><text x="20" y="615">              description: &gt;-</text><text x="20" y="635">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="655">                structuredContent (of the JSON output part when there is no</text><text x="20" y="675">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="695">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="715">                without the key does not match.</text><text x="20" y="735">              type: string</text><text x="20" y="755">              minLength: 2</text><text x="20" y="775">              maxLength: 257</text><text x="20" y="795">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="815">            min:</text><text x="20" y="835">              description: &gt;-</text><text x="20" y="855">                Minimum number of MATCHING results (default 1). min 0 requires</text><text x="20" y="875">                max.</text><text x="20" y="895">              type: integer</text><text x="20" y="915">              minimum: 0</text><text x="20" y="935">              maximum: 9007199254740991</text><text x="20" y="955">            max:</text><text x="20" y="975">              description: &gt;-</text><text x="20" y="995">                Maximum number of MATCHING results; at least min (or 1 when min</text><text x="20" y="1015">                is omitted).</text><text x="20" y="1035">              type: integer</text><text x="20" y="1055">              minimum: 0</text><text x="20" y="1075">              maximum: 9007199254740991</text><text x="20" y="1095">            role:</text><text x="20" y="1115">              type: string</text><text x="20" y="1135">              enum:</text><text x="20" y="1155">                - gating</text><text x="20" y="1175">                - advisory</text><text x="20" y="1195">                - required</text><text x="20" y="1215">            severity:</text><text x="20" y="1235">              type: string</text><text x="20" y="1255">              const: warn</text><text x="20" y="1275">          required:</text><text x="20" y="1295">            - type</text><text x="20" y="1315">            - patterns</text><text x="20" y="1335">        - type: object</text><text x="20" y="1355">          properties:</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 26</text><text x="20" y="75">              type: string</text><text x="20" y="95">              enum:</text><text x="20" y="115">                - gating</text><text x="20" y="135">                - advisory</text><text x="20" y="155">                - required</text><text x="20" y="175">            severity:</text><text x="20" y="195">              type: string</text><text x="20" y="215">              const: warn</text><text x="20" y="235">          required:</text><text x="20" y="255">            - type</text><text x="20" y="275">            - maxBytes</text><text x="20" y="295">        - type: object</text><text x="20" y="315">          properties:</text><text x="20" y="335">            type:</text><text x="20" y="355">              type: string</text><text x="20" y="375">              const: argumentsMatchToolSchema</text><text x="20" y="395">            toolName:</text><text x="20" y="415">              type: string</text><text x="20" y="435">              minLength: 1</text><text x="20" y="455">            role:</text><text x="20" y="475">              type: string</text><text x="20" y="495">              enum:</text><text x="20" y="515">                - gating</text><text x="20" y="535">                - advisory</text><text x="20" y="555">                - required</text><text x="20" y="575">            severity:</text><text x="20" y="595">              type: string</text><text x="20" y="615">              const: warn</text><text x="20" y="635">          required:</text><text x="20" y="655">            - type</text><text x="20" y="675">        - type: object</text><text x="20" y="695">          description: &gt;-</text><text x="20" y="715">            A call to toolName whose input matches EVERY pattern (all within one</text><text x="20" y="735">            call) occurred at least min (default 1) and at most max times. min</text><text x="20" y="755">            and max count MATCHING calls, not all calls: min 0, max 0 means no</text><text x="20" y="775">            call matches, not that the tool was never called (use</text><text x="20" y="795">            toolNeverCalled for that). Patterns are re2js regular expressions</text><text x="20" y="815">            (no lookaround, no backreferences) matched against the canonical</text><text x="20" y="835">            JSON of the arguments (sorted keys, no whitespace), or only the</text><text x="20" y="855">            argument at path when set (a string value as-is, anything else as</text><text x="20" y="875">            canonical JSON). A call whose subject exceeds 100000 characters is</text><text x="20" y="895">            unreadable, and a verdict it could decide is unscored.</text><text x="20" y="915">          properties:</text><text x="20" y="935">            type:</text><text x="20" y="955">              type: string</text><text x="20" y="975">              const: toolInputMatches</text><text x="20" y="995">            toolName:</text><text x="20" y="1015">              type: string</text><text x="20" y="1035">              minLength: 1</text><text x="20" y="1055">            patterns:</text><text x="20" y="1075">              description: &gt;-</text><text x="20" y="1095">                Every pattern must match the same call. Use alternation (A|B)</text><text x="20" y="1115">                inside one pattern for either.</text><text x="20" y="1135">              minItems: 1</text><text x="20" y="1155">              maxItems: 8</text><text x="20" y="1175">              type: array</text><text x="20" y="1195">              items:</text><text x="20" y="1215">                type: string</text><text x="20" y="1235">                minLength: 1</text><text x="20" y="1255">                maxLength: 512</text><text x="20" y="1275">            flags:</text><text x="20" y="1295">              description: &gt;-</text><text x="20" y="1315">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="1335">                matches newline).</text><text x="20" y="1355">              type: string</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 18</text><text x="20" y="75">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="95">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="115">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="135">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="155">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="175">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="195">            replayability only one half of it has.</text><text x="20" y="215">          additionalProperties: true</text><text x="20" y="235">      additionalProperties: true</text><text x="20" y="255">    EvalAssertion:</text><text x="20" y="275">      oneOf:</text><text x="20" y="295">        - type: object</text><text x="20" y="315">          properties:</text><text x="20" y="335">            type:</text><text x="20" y="355">              type: string</text><text x="20" y="375">              const: toolDescriptionsPresent</text><text x="20" y="395">            minLength:</text><text x="20" y="415">              type: integer</text><text x="20" y="435">              exclusiveMinimum: 0</text><text x="20" y="455">              maximum: 9007199254740991</text><text x="20" y="475">            role:</text><text x="20" y="495">              type: string</text><text x="20" y="515">              enum:</text><text x="20" y="535">                - gating</text><text x="20" y="555">                - advisory</text><text x="20" y="575">                - required</text><text x="20" y="595">            severity:</text><text x="20" y="615">              type: string</text><text x="20" y="635">              const: warn</text><text x="20" y="655">          required:</text><text x="20" y="675">            - type</text><text x="20" y="695">        - type: object</text><text x="20" y="715">          properties:</text><text x="20" y="735">            type:</text><text x="20" y="755">              type: string</text><text x="20" y="775">              const: toolAnnotationsPresent</text><text x="20" y="795">            require:</text><text x="20" y="815">              maxItems: 2</text><text x="20" y="835">              type: array</text><text x="20" y="855">              items:</text><text x="20" y="875">                type: string</text><text x="20" y="895">                enum:</text><text x="20" y="915">                  - readOnlyHint</text><text x="20" y="935">                  - destructiveHint</text><text x="20" y="955">            role:</text><text x="20" y="975">              type: string</text><text x="20" y="995">              enum:</text><text x="20" y="1015">                - gating</text><text x="20" y="1035">                - advisory</text><text x="20" y="1055">                - required</text><text x="20" y="1075">            severity:</text><text x="20" y="1095">              type: string</text><text x="20" y="1115">              const: warn</text><text x="20" y="1135">          required:</text><text x="20" y="1155">            - type</text><text x="20" y="1175">        - type: object</text><text x="20" y="1195">          properties:</text><text x="20" y="1215">            type:</text><text x="20" y="1235">              type: string</text><text x="20" y="1255">              const: toolNamesUnique</text><text x="20" y="1275">            role:</text><text x="20" y="1295">              type: string</text><text x="20" y="1315">              enum:</text><text x="20" y="1335">                - gating</text><text x="20" y="1355">                - advisory</text></g></svg>
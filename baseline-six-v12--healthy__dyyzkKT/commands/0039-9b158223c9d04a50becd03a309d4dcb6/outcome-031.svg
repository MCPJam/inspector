<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b158223c9d04a50becd03a309d4dcb6 — page 31</text><text x="20" y="75">            severity:</text><text x="20" y="95">              type: string</text><text x="20" y="115">              const: warn</text><text x="20" y="135">          required:</text><text x="20" y="155">            - type</text><text x="20" y="175">      description: &gt;-</text><text x="20" y="195">        An SDK assertion reported through UVC. Discovery assertions require</text><text x="20" y="215">        complete raw tool declarations; missing evidence is an evaluator error.</text><text x="20" y="235">        Observation kinds, including noDeprecatedToolExposed, require role</text><text x="20" y="255">        advisory. Structural schema; runtime also validates policy and unique</text><text x="20" y="275">        required annotation keys.</text><text x="20" y="295">    SuppressedSuiteStandardCheckIds:</text><text x="20" y="315">      maxItems: 64</text><text x="20" y="335">      type: array</text><text x="20" y="355">      items:</text><text x="20" y="375">        type: string</text><text x="20" y="395">        enum:</text><text x="20" y="415">          - discovery.description</text><text x="20" y="435">          - discovery.annotations</text><text x="20" y="455">          - discovery.collisions</text><text x="20" y="475">          - discovery.deprecated</text><text x="20" y="495">          - call.schema</text><text x="20" y="515">          - response.schema</text><text x="20" y="535">          - selection.hops</text><text x="20" y="555">          - call.parameters</text><text x="20" y="575">          - call.repeated</text><text x="20" y="595">          - response.performance</text><text x="20" y="615">          - response.size</text><text x="20" y="635">          - response.errors</text><text x="20" y="655">          - response.recovery</text><text x="20" y="675">          - response.pagination</text><text x="20" y="695">          - userValue.turns</text><text x="20" y="715">      description: &gt;-</text><text x="20" y="735">        Stable standard assertion family IDs suppressed from suite defaults.</text><text x="20" y="755">        Applies before inherit/extend/replace resolution; explicit case and step</text><text x="20" y="775">        assertions are preserved. Omitted updates preserve; [] clears. At most</text><text x="20" y="795">        64 IDs, normalized to unique sorted values.</text><text x="20" y="815">    Error:</text><text x="20" y="835">      type: object</text><text x="20" y="855">      required:</text><text x="20" y="875">        - code</text><text x="20" y="895">        - message</text><text x="20" y="915">      properties:</text><text x="20" y="935">        code:</text><text x="20" y="955">          type: string</text><text x="20" y="975">          description: &gt;-</text><text x="20" y="995">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="1015">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="1035">            status says otherwise.</text><text x="20" y="1055">          enum:</text><text x="20" y="1075">            - UNAUTHORIZED</text><text x="20" y="1095">            - FORBIDDEN</text><text x="20" y="1115">            - NOT_FOUND</text><text x="20" y="1135">            - CONFLICT</text><text x="20" y="1155">            - VALIDATION_ERROR</text><text x="20" y="1175">            - RATE_LIMITED</text><text x="20" y="1195">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="1215">            - SERVER_UNREACHABLE</text><text x="20" y="1235">            - TIMEOUT</text><text x="20" y="1255">            - OAUTH_REQUIRED</text><text x="20" y="1275">            - AUTH_REQUIRED</text><text x="20" y="1295">            - INTERNAL_ERROR</text><text x="20" y="1315">        message:</text><text x="20" y="1335">          type: string</text><text x="20" y="1355">          description: &gt;-</text></g></svg>
in&quot;: {</text><text x="20" y="1055">      &quot;description&quot;: &quot;Minimum number of MATCHING results (default 1). min 0 requires max.&quot;,</text><text x="20" y="1075">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1095">      &quot;minimum&quot;: 0,</text><text x="20" y="1115">      &quot;maximum&quot;: 9007199254740991</text><text x="20" y="1135">    },</text><text x="20" y="1155">    &quot;max&quot;: {</text><text x="20" y="1175">      &quot;description&quot;: &quot;Maximum number of MATCHING results; at least min (or 1 when min is omitted).&quot;,</text><text x="20" y="1195">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1215">      &quot;minimum&quot;: 0,</text><text x="20" y="1235">      &quot;maximum&quot;: 9007199254740991</text><text x="20" y="1255">    },</text><text x="20" y="1275">    &quot;role&quot;: {</text><text x="20" y="1295">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1315">      &quot;enum&quot;: [</text><text x="20" y="1335">        &quot;gating&quot;,</text><text x="20" y="1355">        &quot;advisory&quot;,</text></g></svg>
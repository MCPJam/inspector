<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6ce3b41aebc04d5989ed709b8ce4514c — page 10</text><text x="20" y="75">sult) occurred at least min (default 1) and at most max times. min and max count MATCHING results, not all results: min 0, max 0 m</text><text x="20" y="95">eans no result matches. The content is the result&#x27;s text, then structuredContent, then its JSON output part (JSON as canonical JSO</text><text x="20" y="115">N), or, with path, the value at that key in structuredContent (in the JSON output part when there is no structuredContent). isErro</text><text x="20" y="135">r results are included. A result whose text was truncated for storage (when path is omitted), or whose subject exceeds 100000 char</text><text x="20" y="155">acters, is unreadable; so are results an incomplete capture did not record. A verdict they could decide is unscored.&quot;,</text><text x="20" y="175">  &quot;properties&quot;: {</text><text x="20" y="195">    &quot;type&quot;: {</text><text x="20" y="215">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="235">      &quot;const&quot;: &quot;toolResultMatches&quot;</text><text x="20" y="255">    },</text><text x="20" y="275">    &quot;toolName&quot;: {</text><text x="20" y="295">      &quot;description&quot;: &quot;Omit to read every tool&#x27;s results.&quot;,</text><text x="20" y="315">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="335">      &quot;minLength&quot;: 1</text><text x="20" y="355">    },</text><text x="20" y="375">    &quot;patterns&quot;: {</text><text x="20" y="395">      &quot;description&quot;: &quot;Every pattern must match the same result. Use alternation (A|B) inside one pattern for either.&quot;,</text><text x="20" y="415">      &quot;minItems&quot;: 
text x="20" y="1035">both in one object.&quot;,</text><text x="20" y="1055">      &quot;additionalProperties&quot;: true</text><text x="20" y="1075">    },</text><text x="20" y="1095">    &quot;predicates&quot;: {</text><text x="20" y="1115">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1135">      &quot;deprecated&quot;: true,</text><text x="20" y="1155">      &quot;description&quot;: &quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here all along and never written </text><text x="20" y="1175">down, passing only because this schema allowed unknown properties; documented rather than removed so no caller already sending it </text><text x="20" y="1195">breaks. Send one or the other, never both.&quot;,</text><text x="20" y="1215">      &quot;properties&quot;: {</text><text x="20" y="1235">        &quot;mode&quot;: {</text><text x="20" y="1255">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1275">          &quot;enum&quot;: [</text><text x="20" y="1295">            &quot;inherit&quot;,</text><text x="20" y="1315">            &quot;replace&quot;,</text><text x="20" y="1335">            &quot;extend&quot;</text><text x="20" y="1355">          ]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">c1cd04dff8a5445f8020b6bacd0ed98c — page 10</text><text x="20" y="75">        },</text><text x="20" y="95">        &quot;list&quot;: {</text><text x="20" y="115">          &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="135">          &quot;items&quot;: {</text><text x="20" y="155">            &quot;type&quot;: &quot;object&quot;</text><text x="20" y="175">          }</text><text x="20" y="195">        }</text><text x="20" y="215">      }</text><text x="20" y="235">    },</text><text x="20" y="255">    &quot;isNegative&quot;: {</text><text x="20" y="275">      &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="295">      &quot;description&quot;: &quot;Alias for `isNegativeTest` \u2014 the public case-authoring spelling this API returns on a read. Send one or</text><text x="20" y="315"> the other, never both.&quot;</text><text x="20" y="335">    },</text><text x="20" y="355">    &quot;iterations&quot;: {</text><text x="20" y="375">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="395">      &quot;minimum&quot;: 1,</text><text x="20" y="415">      &quot;maximum&quot;: 10,</text><text x="20" y="435">      &quot;description&quot;: &quot;Alias for `runs`. Send one or the other, never both.&quot;</text><text x="20" y="455">    },</text><text x="20" y="475">    &quot;checks&quot;: {</text><text x="20" y="495">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="515">      &quot;description&quot;: &quot;Per-case CHECK gate \u2014 the grading rules this case is scored against. `mode` says how they combine with </text><text x="20" y="535">the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field, same </text><text x="20" y="555">shape and same name as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word for on</text><text x="20" y="575">e concept. Send this or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="595">      &quot;properties&quot;: {</text><text x="20" y="615">        &quot;mode&quot;: {</text><text x="20" y="635">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="655">          &quot;enum&quot;: [</text><text x="20" y="675">            &quot;inherit&quot;,</text><text x="20" y="695">            &quot;replace&quot;,</text><text x="20" y="715">            &quot;extend&quot;</text><text x="20" y="735">          ]</text><text x="20" y="755">        },</text><text x="20" y="775">        &quot;list&quot;: {</text><text x="20" y="795">          &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="815">          &quot;items&quot;: {</text><text x="20" y="835">            &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="855">          }</text><text x="20" y="875">        }</text><text x="20" y="895">      }</text><text x="20" y="915">    },</text><text x="20" y="935">    &quot;suppressedSuiteStandardCheckIds&quot;: {</text><text x="20" y="955">      &quot;$ref&quot;: &quot;#/components/schemas/SuppressedSuiteStandardCheckIds&quot;,</text><text x="20" y="975">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="995">      &quot;items&quot;: {</text><text x="20" y="1015">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1035">      }</text><text x="20" y="1055">    }</text><text x="20" y="1075">  },</text><text x="20" y="1095">  &quot;additionalProperties&quot;: false</text><text x="20" y="1115">}</text><text x="20" y="1135">toolDescriptionsPresent</text><text x="20" y="1155">toolAnnotationsPresent</text><text x="20" y="1175">toolNamesUnique</text><text x="20" y="1195">noDeprecated
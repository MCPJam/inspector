<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="665"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">aed086c30f154f54a9e2d6f09bacb5e7 — page 1</text><text x="20" y="75">$ /bin/bash -c curl -fsSL https://docs.mcpjam.com/api-reference/eval-runs/create-an-eval-suite.md -o create-suite-doc.md; npx mcpj</text><text x="20" y="95">am cloud eval cases create --help; npx mcpjam cloud eval validate --help</text><text x="20" y="115">curl: (22) The requested URL returned error: 404</text><text x="20" y="135">Usage: mcpjam cloud eval cases create [options]</text><text x="20" y="155"></text><text x="20" y="175">Add a test case to a suite (definition via --file/--json)</text><text x="20" y="195"></text><text x="20" y="215">Options:</text><text x="20" y="235">  --suite &lt;id-or-name&gt;    Eval suite name or ID</text><text x="20" y="255">  --project &lt;id-or-name&gt;  Project name or ID (defaults to most recently updated)</text><text x="20" y="275">  --file &lt;path&gt;           Case JSON body (or - for stdin)</text><text x="20" y="295">  --json &lt;json&gt;           Inline case JSON (or @file, or -)</text><text x="20" y="315">  --title &lt;title&gt;         Case title (overrides the body)</text><text x="20" y="335">  -h, --help              display help for command</text><text x="20" y="355">Usage: mcpjam cloud eval validate [options]</text><text x="20" y="375"></text><text x="20" y="395">Validate a local eval suite file offline — no auth, no network unless --project</text><text x="20" y="415">is passed (0 valid, 1 contract-invalid or unresolved reference, 2</text><text x="20" y="435">unreadable/oversize/malformed)</text><text x="20" y="455"></text><text x="20" y="475">Options:</text><text x="20" y="495">  --file &lt;path&gt;           Suite file to validate, .yaml or .json (or - for</text><text x="20" y="515">                          stdin)</text><text x="20" y="535">  --project &lt;id-or-name&gt;  Also resolve the file&#x27;s deterministic tool references</text><text x="20" y="555">                          against this project&#x27;s live servers. Opt-in: without</text><text x="20" y="575">                          it the command stays entirely offline.</text><text x="20" y="595">  -h, --help              display help for command</text><text x="20" y="615"></text><text x="20" y="635">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
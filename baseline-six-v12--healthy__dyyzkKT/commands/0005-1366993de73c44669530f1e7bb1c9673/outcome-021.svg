<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1366993de73c44669530f1e7bb1c9673 — page 21</text><text x="20" y="75">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="95">                inside one pattern for either.</text><text x="20" y="115">              minItems: 1</text><text x="20" y="135">              maxItems: 8</text><text x="20" y="155">              type: array</text><text x="20" y="175">              items:</text><text x="20" y="195">                type: string</text><text x="20" y="215">                minLength: 1</text><text x="20" y="235">                maxLength: 512</text><text x="20" y="255">            flags:</text><text x="20" y="275">              description: &gt;-</text><text x="20" y="295">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="315">                matches newline).</text><text x="20" y="335">              type: string</text><text x="20" y="355">              enum:</text><text x="20" y="375">                - i</text><text x="20" y="395">                - m</text><text x="20" y="415">                - s</text><text x="20" y="435">                - im</text><text x="20" y="455">                - is</text><text x="20" y="475">                - ms</text><text x="20" y="495">                - ims</text><text x="20" y="515">            path:</text><text x="20" y="535">              description: &gt;-</text><text x="20" y="555">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="575">                structuredContent (of the JSON output part when there is no</text><text x="20" y="595">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="615">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="635">                without the key does not match.</text><text x="20" y="655">              type: string</text><text x="20" y="675">              minLength: 2</text><text x="20" y="695">              maxLength: 257</text><text x="20" y="715">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="735">            min:</text><text x="20" y="755">              description: &gt;-</text><text x="20" y="775">                Minimum number of MATCHING results (default 1). min 0 requires</text><text x="20" y="795">                max.</text><text x="20" y="815">              type: integer</text><text x="20" y="835">              minimum: 0</text><text x="20" y="855">              maximum: 9007199254740991</text><text x="20" y="875">            max:</text><text x="20" y="895">              description: &gt;-</text><text x="20" y="915">                Maximum number of MATCHING results; at least min (or 1 when min</text><text x="20" y="935">                is omitted).</text><text x="20" y="955">              type: integer</text><text x="20" y="975">              minimum: 0</text><text x="20" y="995">              maximum: 9007199254740991</text><text x="20" y="1015">            role:</text><text x="20" y="1035">              type: string</text><text x="20" y="1055">              enum:</text><text x="20" y="1075">                - gating</text><text x="20" y="1095">                - advisory</text><text x="20" y="1115">                - required</text><text x="20" y="1135">            severity:</text><text x="20" y="1155">              type: string</text><text x="20" y="1175">              const: warn</text><text x="20" y="1195">          required:</text><text x="20" y="1215">            - type</text><text x="20" y="1235">            - patterns</text><text x="20" y="1255">        - type: object</text><text x="20" y="1275">          properties:</text><text x="20" y="1295">            type:</text><text x="20" y="1315">              type: string</text><text x="20" y="1335">              const: noRepeatedIdenticalCall</text><text x="20" y="1355">            toolName:</text></g></svg>
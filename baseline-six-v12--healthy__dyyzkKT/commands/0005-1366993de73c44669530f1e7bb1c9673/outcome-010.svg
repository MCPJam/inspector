<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1366993de73c44669530f1e7bb1c9673 — page 10</text><text x="20" y="75">              items:</text><text x="20" y="95">                type: object</text><text x="20" y="115">                properties:</text><text x="20" y="135">                  id:</text><text x="20" y="155">                    type: string</text><text x="20" y="175">                  name:</text><text x="20" y="195">                    type: string</text><text x="20" y="215">            failed:</text><text x="20" y="235">              type: array</text><text x="20" y="255">              items:</text><text x="20" y="275">                type: object</text><text x="20" y="295">                properties:</text><text x="20" y="315">                  id:</text><text x="20" y="335">                    type: string</text><text x="20" y="355">                  name:</text><text x="20" y="375">                    type: string</text><text x="20" y="395">                  error:</text><text x="20" y="415">                    type: string</text><text x="20" y="435">    EvalTestStep:</text><text x="20" y="455">      type: object</text><text x="20" y="475">      description: &gt;-</text><text x="20" y="495">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="515">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="535">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="555">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="575">        a DOM `WidgetAssertion`).</text><text x="20" y="595">      required:</text><text x="20" y="615">        - id</text><text x="20" y="635">        - kind</text><text x="20" y="655">      properties:</text><text x="20" y="675">        id:</text><text x="20" y="695">          type: string</text><text x="20" y="715">          minLength: 1</text><text x="20" y="735">        kind:</text><text x="20" y="755">          type: string</text><text x="20" y="775">          enum:</text><text x="20" y="795">            - prompt</text><text x="20" y="815">            - toolCall</text><text x="20" y="835">            - interact</text><text x="20" y="855">            - assert</text><text x="20" y="875">        prompt:</text><text x="20" y="895">          type: string</text><text x="20" y="915">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="935">        serverName:</text><text x="20" y="955">          type: string</text><text x="20" y="975">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="995">        toolName:</text><text x="20" y="1015">          type: string</text><text x="20" y="1035">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="1055">        arguments:</text><text x="20" y="1075">          type: object</text><text x="20" y="1095">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="1115">          additionalProperties: true</text><text x="20" y="1135">        action:</text><text x="20" y="1155">          type: object</text><text x="20" y="1175">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="1195">          additionalProperties: true</text><text x="20" y="1215">        assertion:</text><text x="20" y="1235">          type: object</text><text x="20" y="1255">          description: &gt;-</text><text x="20" y="1275">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="1295">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="1315">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="1335">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="1355">            PERSISTED transcript, so a stored run can be re-graded against it</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.7991549968719482s — page 5</text><text x="20" y="75">        Today it decides one thing: the spelling of an evaluator&#x27;s policy</text><text x="20" y="95">        `role`. Vocabulary 1 accepts and returns `gating`; vocabulary 2 accepts</text><text x="20" y="115">        both spellings and returns the canonical `required`. Sending `required`</text><text x="20" y="135">        without the header is a `400`, deliberately — vocabulary 1 is not</text><text x="20" y="155">        widened to meet vocabulary 2 half way, because a boundary that accepts a</text><text x="20" y="175">        spelling it does not announce is one two implementations can disagree</text><text x="20" y="195">        about.</text><text x="20" y="215"></text><text x="20" y="235"></text><text x="20" y="255">        A response that varies by vocabulary sends `Vary:</text><text x="20" y="275">        x-mcpjam-eval-vocabulary`.</text><text x="20" y="295">      schema:</text><text x="20" y="315">        type: string</text><text x="20" y="335">        enum:</text><text x="20" y="355">          - &#x27;1&#x27;</text><text x="20" y="375">          - &#x27;2&#x27;</text><text x="20" y="395">      example: &#x27;2&#x27;</text><text x="20" y="415">    projectId:</text><text x="20" y="435">      name: projectId</text><text x="20" y="455">      in: path</text><text x="20" y="475">      required: true</text><text x="20" y="495">      description: ID of the hosted project that contains the server.</text><text x="20" y="515">      schema:</text><text x="20" y="535">        type: string</text><text x="20" y="555">  schemas:</text><text x="20" y="575">    EvalSuiteCreateRequest:</text><text x="20" y="595">      type: object</text><text x="20" y="615">      description: &gt;-</text><text x="20" y="635">        Author-only suite-create body. A suite-level default `model` (and</text><text x="20" y="655">        optional `provider`) applies to every test unless the test overrides it.</text><text x="20" y="675">      required:</text><text x="20" y="695">        - name</text><text x="20" y="715">        - serverIds</text><text x="20" y="735">        - model</text><text x="20" y="755">        - tests</text><text x="20" y="775">      properties:</text><text x="20" y="795">        name:</text><text x="20" y="815">          type: string</text><text x="20" y="835">          minLength: 1</text><text x="20" y="855">          description: Suite name.</text><text x="20" y="875">        description:</text><text x="20" y="895">          type: string</text><text x="20" y="915">        serverIds:</text><text x="20" y="935">          type: array</text><text x="20" y="955">          minItems: 1</text><text x="20" y="975">          description: Servers (by canonical project ID) the suite&#x27;s cases run against.</text><text x="20" y="995">          items:</text><text x="20" y="1015">            type: string</text><text x="20" y="1035">        serverNames:</text><text x="20" y="1055">          type: array</text><text x="20" y="1075">          description: Optional display names, parallel to `serverIds`.</text><text x="20" y="1095">          items:</text><text x="20" y="1115">            type: string</text><text x="20" y="1135">        hosts:</text><text x="20" y="1155">          type: array</text><text x="20" y="1175">          description: &gt;-</text><text x="20" y="1195">            Clients (hosts) to attach the suite to, in attach order. A suite</text><text x="20" y="1215">            with no attached client reports none wherever it is listed, and a</text><text x="20" y="1235">            run has no host to select. Same shape as the PATCH `hosts` field.</text><text x="20" y="1255">          items:</text><text x="20" y="1275">            type: object</text><text x="20" y="1295">            required:</text><text x="20" y="1315">              - host</text><text x="20" y="1335">            properties:</text><text x="20" y="1355">              host:</text></g></svg>
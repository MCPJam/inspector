<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1366993de73c44669530f1e7bb1c9673 — page 8</text><text x="20" y="75">                description: When `true`, the case passes if NO tools are called.</text><text x="20" y="95">              scenario:</text><text x="20" y="115">                type: string</text><text x="20" y="135">              advancedConfig:</text><text x="20" y="155">                type: object</text><text x="20" y="175">                description: &gt;-</text><text x="20" y="195">                  Optional `system`, `temperature`, `toolChoice` overrides.</text><text x="20" y="215">                  `reasoningEffort` is NOT accepted (`400`): nothing ever</text><text x="20" y="235">                  applied it. Save an effort as</text><text x="20" y="255">                  `models[].selection.settings.reasoningEffort` instead.</text><text x="20" y="275">                additionalProperties: true</text><text x="20" y="295">              intent:</text><text x="20" y="315">                type: string</text><text x="20" y="335">                minLength: 1</text><text x="20" y="355">                maxLength: 64</text><text x="20" y="375">                description: Optional authored analytics grouping label.</text><text x="20" y="395">              matchOptions:</text><text x="20" y="415">                type: object</text><text x="20" y="435">                description: &gt;-</text><text x="20" y="455">                  Per-case tool-call matching override, in either vocabulary:</text><text x="20" y="475">                  public (`toolCallOrder: any|in-order|exact`, `extraToolCalls`,</text><text x="20" y="495">                  `arguments`) or internal (`toolCallOrder:</text><text x="20" y="515">                  ignore|superset|strict`, `maxExtraToolCalls`,</text><text x="20" y="535">                  `argumentMatching`), never both in one object.</text><text x="20" y="555">                additionalProperties: true</text><text x="20" y="575">              predicates:</text><text x="20" y="595">                type: object</text><text x="20" y="615">                deprecated: true</text><text x="20" y="635">                description: &gt;-</text><text x="20" y="655">                  DEPRECATED spelling of `checks`, which means exactly this. It</text><text x="20" y="675">                  was accepted here all along and never written down, passing</text><text x="20" y="695">                  only because this schema allowed unknown properties;</text><text x="20" y="715">                  documented rather than removed so no caller already sending it</text><text x="20" y="735">                  breaks. Send one or the other, never both.</text><text x="20" y="755">                properties:</text><text x="20" y="775">                  mode:</text><text x="20" y="795">                    type: string</text><text x="20" y="815">                    enum:</text><text x="20" y="835">                      - inherit</text><text x="20" y="855">                      - replace</text><text x="20" y="875">                      - extend</text><text x="20" y="895">                  list:</text><text x="20" y="915">                    type: array</text><text x="20" y="935">                    items:</text><text x="20" y="955">                      type: object</text><text x="20" y="975">              isNegative:</text><text x="20" y="995">                type: boolean</text><text x="20" y="1015">                description: &gt;-</text><text x="20" y="1035">                  Alias for `isNegativeTest` — the public case-authoring</text><text x="20" y="1055">                  spelling this API returns on a read. Send one or the other,</text><text x="20" y="1075">                  never both.</text><text x="20" y="1095">              iterations:</text><text x="20" y="1115">                type: integer</text><text x="20" y="1135">                minimum: 1</text><text x="20" y="1155">                maximum: 10</text><text x="20" y="1175">                description: Alias for `runs`. Send one or the other, never both.</text><text x="20" y="1195">              checks:</text><text x="20" y="1215">                type: object</text><text x="20" y="1235">                description: &gt;-</text><text x="20" y="1255">                  Per-case CHECK gate — the grading rules this case is scored</text><text x="20" y="1275">                  against. `mode` says how they combine with the suite&#x27;s own:</text><text x="20" y="1295">                  `inherit` uses the suite&#x27;s, `replace` uses only `list`,</text><text x="20" y="1315">                  `extend` appends `list` to the suite&#x27;s. Same field, same shape</text><text x="20" y="1335">                  and same name as `checks` on the eval-case routes, so</text><text x="20" y="1355">                  authoring a suite and then editing one of its cases is one</text></g></svg>
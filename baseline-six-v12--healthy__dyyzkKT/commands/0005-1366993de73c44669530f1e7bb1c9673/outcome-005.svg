<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1366993de73c44669530f1e7bb1c9673 — page 5</text><text x="20" y="75"></text><text x="20" y="95"></text><text x="20" y="115">        Today it decides one thing: the spelling of an evaluator&#x27;s policy</text><text x="20" y="135">        `role`. Vocabulary 1 accepts and returns `gating`; vocabulary 2 accepts</text><text x="20" y="155">        both spellings and returns the canonical `required`. Sending `required`</text><text x="20" y="175">        without the header is a `400`, deliberately — vocabulary 1 is not</text><text x="20" y="195">        widened to meet vocabulary 2 half way, because a boundary that accepts a</text><text x="20" y="215">        spelling it does not announce is one two implementations can disagree</text><text x="20" y="235">        about.</text><text x="20" y="255"></text><text x="20" y="275"></text><text x="20" y="295">        A response that varies by vocabulary sends `Vary:</text><text x="20" y="315">        x-mcpjam-eval-vocabulary`.</text><text x="20" y="335">      schema:</text><text x="20" y="355">        type: string</text><text x="20" y="375">        enum:</text><text x="20" y="395">          - &#x27;1&#x27;</text><text x="20" y="415">          - &#x27;2&#x27;</text><text x="20" y="435">      example: &#x27;2&#x27;</text><text x="20" y="455">    projectId:</text><text x="20" y="475">      name: projectId</text><text x="20" y="495">      in: path</text><text x="20" y="515">      required: true</text><text x="20" y="535">      description: ID of the hosted project that contains the server.</text><text x="20" y="555">      schema:</text><text x="20" y="575">        type: string</text><text x="20" y="595">  schemas:</text><text x="20" y="615">    EvalSuiteCreateRequest:</text><text x="20" y="635">      type: object</text><text x="20" y="655">      description: &gt;-</text><text x="20" y="675">        Author-only suite-create body. A suite-level default `model` (and</text><text x="20" y="695">        optional `provider`) applies to every test unless the test overrides it.</text><text x="20" y="715">      required:</text><text x="20" y="735">        - name</text><text x="20" y="755">        - serverIds</text><text x="20" y="775">        - model</text><text x="20" y="795">        - tests</text><text x="20" y="815">      properties:</text><text x="20" y="835">        name:</text><text x="20" y="855">          type: string</text><text x="20" y="875">          minLength: 1</text><text x="20" y="895">          description: Suite name.</text><text x="20" y="915">        description:</text><text x="20" y="935">          type: string</text><text x="20" y="955">        serverIds:</text><text x="20" y="975">          type: array</text><text x="20" y="995">          minItems: 1</text><text x="20" y="1015">          description: Servers (by canonical project ID) the suite&#x27;s cases run against.</text><text x="20" y="1035">          items:</text><text x="20" y="1055">            type: string</text><text x="20" y="1075">        serverNames:</text><text x="20" y="1095">          type: array</text><text x="20" y="1115">          description: Optional display names, parallel to `serverIds`.</text><text x="20" y="1135">          items:</text><text x="20" y="1155">            type: string</text><text x="20" y="1175">        hosts:</text><text x="20" y="1195">          type: array</text><text x="20" y="1215">          description: &gt;-</text><text x="20" y="1235">            Clients (hosts) to attach the suite to, in attach order. A suite</text><text x="20" y="1255">            with no attached client reports none wherever it is listed, and a</text><text x="20" y="1275">            run has no host to select. Same shape as the PATCH `hosts` field.</text><text x="20" y="1295">          items:</text><text x="20" y="1315">            type: object</text><text x="20" y="1335">            required:</text><text x="20" y="1355">              - host</text></g></svg>
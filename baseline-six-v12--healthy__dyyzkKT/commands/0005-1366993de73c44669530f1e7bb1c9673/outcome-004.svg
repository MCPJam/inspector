<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1366993de73c44669530f1e7bb1c9673 — page 4</text><text x="20" y="75">        neither is supplied. Each test&#x27;s case body is an ordered `steps` array</text><text x="20" y="95">        (prompt / toolCall / interact / assert).</text><text x="20" y="115"></text><text x="20" y="135"></text><text x="20" y="155">        Guest callers are denied (suite creation is a write).</text><text x="20" y="175">      operationId: createEvalSuite</text><text x="20" y="195">      parameters:</text><text x="20" y="215">        - $ref: &#x27;#/components/parameters/evalVocabularyHeader&#x27;</text><text x="20" y="235">        - $ref: &#x27;#/components/parameters/projectId&#x27;</text><text x="20" y="255">      requestBody:</text><text x="20" y="275">        required: true</text><text x="20" y="295">        content:</text><text x="20" y="315">          application/json:</text><text x="20" y="335">            schema:</text><text x="20" y="355">              $ref: &#x27;#/components/schemas/EvalSuiteCreateRequest&#x27;</text><text x="20" y="375">            example:</text><text x="20" y="395">              name: smoke</text><text x="20" y="415">              serverIds:</text><text x="20" y="435">                - srv_abc123</text><text x="20" y="455">              model: anthropic/claude-haiku-4.5</text><text x="20" y="475">              tests:</text><text x="20" y="495">                - title: lists files</text><text x="20" y="515">                  steps:</text><text x="20" y="535">                    - id: s1</text><text x="20" y="555">                      kind: prompt</text><text x="20" y="575">                      prompt: List the files in the project root.</text><text x="20" y="595">                    - id: s2</text><text x="20" y="615">                      kind: assert</text><text x="20" y="635">                      assertion:</text><text x="20" y="655">                        type: toolCalledWith</text><text x="20" y="675">                        toolName: list_files</text><text x="20" y="695">                        args:</text><text x="20" y="715">                          args: {}</text><text x="20" y="735">      responses:</text><text x="20" y="755">        &#x27;201&#x27;:</text><text x="20" y="775">          description: The suite was created.</text><text x="20" y="795">          content:</text><text x="20" y="815">            application/json:</text><text x="20" y="835">              schema:</text><text x="20" y="855">                $ref: &#x27;#/components/schemas/EvalSuiteCreated&#x27;</text><text x="20" y="875">        &#x27;400&#x27;:</text><text x="20" y="895">          $ref: &#x27;#/components/responses/ValidationError&#x27;</text><text x="20" y="915">        &#x27;401&#x27;:</text><text x="20" y="935">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="955">        &#x27;403&#x27;:</text><text x="20" y="975">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="995">        &#x27;404&#x27;:</text><text x="20" y="1015">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="1035">        &#x27;429&#x27;:</text><text x="20" y="1055">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="1075">        &#x27;500&#x27;:</text><text x="20" y="1095">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="1115">        &#x27;502&#x27;:</text><text x="20" y="1135">          $ref: &#x27;#/components/responses/ServerUnreachable&#x27;</text><text x="20" y="1155">components:</text><text x="20" y="1175">  parameters:</text><text x="20" y="1195">    evalVocabularyHeader:</text><text x="20" y="1215">      name: x-mcpjam-eval-vocabulary</text><text x="20" y="1235">      in: header</text><text x="20" y="1255">      required: false</text><text x="20" y="1275">      description: &gt;-</text><text x="20" y="1295">        Which vocabulary this request and its response speak. Absent means `1`,</text><text x="20" y="1315">        which is byte-for-byte today&#x27;s contract: the same request fields, the</text><text x="20" y="1335">        same refusals, the same response projection. `2` is the canonical</text><text x="20" y="1355">        vocabulary. Any other value is a `400` with `code: &quot;VALIDATION_ERROR&quot;`.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1366993de73c44669530f1e7bb1c9673 — page 24</text><text x="20" y="75">            - type</text><text x="20" y="95">      description: &gt;-</text><text x="20" y="115">        An SDK assertion reported through UVC. Discovery assertions require</text><text x="20" y="135">        complete raw tool declarations; missing evidence is an evaluator error.</text><text x="20" y="155">        Observation kinds, including noDeprecatedToolExposed, require role</text><text x="20" y="175">        advisory. Structural schema; runtime also validates policy and unique</text><text x="20" y="195">        required annotation keys.</text><text x="20" y="215">    SuppressedSuiteStandardCheckIds:</text><text x="20" y="235">      maxItems: 64</text><text x="20" y="255">      type: array</text><text x="20" y="275">      items:</text><text x="20" y="295">        type: string</text><text x="20" y="315">        enum:</text><text x="20" y="335">          - discovery.description</text><text x="20" y="355">          - discovery.annotations</text><text x="20" y="375">          - discovery.collisions</text><text x="20" y="395">          - discovery.deprecated</text><text x="20" y="415">          - call.schema</text><text x="20" y="435">          - response.schema</text><text x="20" y="455">          - selection.hops</text><text x="20" y="475">          - call.parameters</text><text x="20" y="495">          - call.repeated</text><text x="20" y="515">          - response.performance</text><text x="20" y="535">          - response.size</text><text x="20" y="555">          - response.errors</text><text x="20" y="575">          - response.recovery</text><text x="20" y="595">          - response.pagination</text><text x="20" y="615">          - userValue.turns</text><text x="20" y="635">      description: &gt;-</text><text x="20" y="655">        Stable standard assertion family IDs suppressed from suite defaults.</text><text x="20" y="675">        Applies before inherit/extend/replace resolution; explicit case and step</text><text x="20" y="695">        assertions are preserved. Omitted updates preserve; [] clears. At most</text><text x="20" y="715">        64 IDs, normalized to unique sorted values.</text><text x="20" y="735">    Error:</text><text x="20" y="755">      type: object</text><text x="20" y="775">      required:</text><text x="20" y="795">        - code</text><text x="20" y="815">        - message</text><text x="20" y="835">      properties:</text><text x="20" y="855">        code:</text><text x="20" y="875">          type: string</text><text x="20" y="895">          description: &gt;-</text><text x="20" y="915">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="935">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="955">            status says otherwise.</text><text x="20" y="975">          enum:</text><text x="20" y="995">            - UNAUTHORIZED</text><text x="20" y="1015">            - FORBIDDEN</text><text x="20" y="1035">            - NOT_FOUND</text><text x="20" y="1055">            - CONFLICT</text><text x="20" y="1075">            - VALIDATION_ERROR</text><text x="20" y="1095">            - RATE_LIMITED</text><text x="20" y="1115">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="1135">            - SERVER_UNREACHABLE</text><text x="20" y="1155">            - TIMEOUT</text><text x="20" y="1175">            - OAUTH_REQUIRED</text><text x="20" y="1195">            - AUTH_REQUIRED</text><text x="20" y="1215">            - INTERNAL_ERROR</text><text x="20" y="1235">        message:</text><text x="20" y="1255">          type: string</text><text x="20" y="1275">          description: &gt;-</text><text x="20" y="1295">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="1315">            match on it.</text><text x="20" y="1335">        details:</text><text x="20" y="1355">          type: object</text></g></svg>
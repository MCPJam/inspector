<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">06de4d4f75ba4b57b4fb246dea7dea48 — page 36</text><text x="20" y="75">&quot;check_sum\&quot;,\n          \&quot;kind\&quot;: \&quot;assert\&quot;,\n          \&quot;assertion\&quot;: {\n            \&quot;type\&quot;: \&quot;toolResultMatches\&quot;,\n        </text><text x="20" y="95">    \&quot;toolName\&quot;: \&quot;add\&quot;,\n            \&quot;path\&quot;: \&quot;/sum\&quot;,\n            \&quot;patterns\&quot;: [\n              \&quot;^42$\&quot;\n            ],\n</text><text x="20" y="115">            \&quot;min\&quot;: 1,\n            \&quot;max\&quot;: 1\n          }\n        }\n      ],\n      \&quot;id\&quot;: \&quot;suite_authored_1_case_0\&quot;,\n   </text><text x="20" y="135">   \&quot;suiteId\&quot;: \&quot;suite_authored_1\&quot;\n    }\n  ]\n}\nrequired: None\nsuiteId {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Existing su</text><text x="20" y="155">ite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.\&quot;}\nserverIds {\&quot;type\&quot;: \&quot;array\&quot;, \&quot;minIt</text><text x="20" y="175">ems\&quot;: 1, \&quot;description\&quot;: \&quot;Servers (by ID) the run connects to. Required when creating a new suite; optional on reruns \\u2014 w</text><text x="20" y="195">hen omitted, the run connects the suite&#x27;s saved server selection (the set its snapshot references). A rerun of a suite with no sav</text><text x="20" y="215">ed selection is rejected with `VALIDATION_ERROR` (`details.reason: \\\&quot;NO_SAVED_SERVER_SELECTION\\\&quot;`). Rejected outright for a su</text><text x="20" y="235">ite with attached environments (`details.reason: \\\&quot;ENVIRONMENT_SERVERS_NOT_OVERRIDABLE\\\&quot;`): the environment supplies a closed </text><text x="20" y="255">set that a server override cannot change, so accepting one would connect a different set than the run is stamped with.\&quot;, \&quot;items\</text><text x="20" y="275">&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}}\ntests {\&quot;type\&quot;: \&quot;array\&quot;, \&quot;maxItems\&quot;: 100, \&quot;description\&quot;: \&quot;Inline test cases to upsert into the</text><text x="20" y="295"> suite before running.\&quot;, \&quot;items\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalTestCase\&quot;}}\nmodel null\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: </text><text x="20" y="315">&quot;completed&quot;}}</text><text x="20" y="335">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_32&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nimpo</text><text x="20" y="355">rt json\ns=json.load(open(&#x27;openapi.json&#x27;))[&#x27;components&#x27;][&#x27;schemas&#x27;]\nprint(json.dumps(s[&#x27;EvalTestCase&#x27;],indent=2))\nfor i in s[&#x27;Ev</text><text x="20" y="375">alAssertion&#x27;].get(&#x27;oneOf&#x27;,[]):\n t=i.get(&#x27;properties&#x27;,{}).get(&#x27;type&#x27;,{}).get(&#x27;const&#x27;);print(t)\n if t in [&#x27;toolResultContains&#x27;,&#x27;ou</text><text x="20" y="395">tputContains&#x27;]:print(json.dumps(i,indent=2))\nPY\ncat &gt; run-request.json &lt;&lt;&#x27;EOF&#x27;\n{\\\&quot;suiteId\\\&quot;:\\\&quot;suite_authored_1\\\&quot;,\\\&quot;se</text><text x="20" y="415">rverIds\\\&quot;:[\\\&quot;server_fixture\\\&quot;]}\nEOF\npython3 api.py /projects/project_fixture/eval-runs POST run-receipt.json run-request.j</text><text x="20" y="435">son\&quot;&quot;, &quot;aggregated_output&quot;: &quot;&quot;, &quot;exit_code&quot;: null, &quot;status&quot;: &quot;in_progress&quot;}}</text><text x="20" y="455">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_32&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nim</text><text x="20" y="475">port json\ns=json.load(open(&#x27;openapi.json&#x27;))[&#x27;components&#x27;][&#x27;schemas&#x27;]\nprint(json.dumps(s[&#x27;EvalTestCase&#x27;],indent=2))\nfor i in s[&#x27;</text><text x="20" y="495">EvalAssertion&#x27;].get(&#x27;oneOf&#x27;,[]):\n t=i.get(&#x27;properties&#x27;,{}).get(&#x27;type&#x27;,{}).get(&#x27;const&#x27;);print(t)\n if t in [&#x27;toolResultContains&#x27;,&#x27;</text><text x="20" y="515">outputContains&#x27;]:print(json.dumps(i,indent=2))\nPY\ncat &gt; run-request.json &lt;&lt;&#x27;EOF&#x27;\n{\\\&quot;suiteId\\\&quot;:\\\&quot;suite_authored_1\\\&quot;,\\\&quot;</text><text x="20" y="535">serverIds\\\&quot;:[\\\&quot;server_fixture\\\&quot;]}\nEOF\npython3 api.py /projects/project_fixture/eval-runs POST run-receipt.json run-request</text><text x="20" y="555">.json\&quot;&quot;, &quot;aggregated_output&quot;: &quot;{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;description\&quot;: \&quot;Inline eval test case. The case body is an ordere</text><text x="20" y="575">d `steps` array (the unified test model). Exactly one of `runs` / `iterations` is required \\u2014 an inline test on a run has no </text><text x="20" y="595">suite default to inherit. The object is CLOSED: an unknown key is a VALIDATION_ERROR, never a silently dropped field. `repetitions</text><text x="20" y="615">`, `passThreshold` and `kind` are per-case policy fields this surface cannot author \\u2014 set them through `POST /v1/projects/{p</text><text x="20" y="635">rojectId}/eval-suites/{suiteId}/cases`.\&quot;,\n  \&quot;required\&quot;: [\n    \&quot;title\&quot;,\n    \&quot;model\&quot;,\n    \&quot;provider\&quot;,\n    \&quot;steps\&quot;\n </text><text x="20" y="655"> ],\n  \&quot;oneOf\&quot;: [\n    {\n      \&quot;required\&quot;: [\n        \&quot;runs\&quot;\n      ]\n    },\n    {\n      \&quot;required\&quot;: [\n        \&quot;iter</text><text x="20" y="675">ations\&quot;\n      ]\n    }\n  ],\n  \&quot;allOf\&quot;: [\n    {\n      \&quot;not\&quot;: {\n        \&quot;required\&quot;: [\n          \&quot;isNegative\&quot;,\n     </text><text x="20" y="695">     \&quot;isNegativeTest\&quot;\n        ]\n      }\n    },\n    {\n      \&quot;not\&quot;: {\n        \&quot;required\&quot;: [\n          \&quot;checks\&quot;,\n    </text><text x="20" y="715">      \&quot;predicates\&quot;\n        ]\n      }\n    }\n  ],\n  \&quot;properties\&quot;: {\n    \&quot;title\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;\n    },\n</text><text x="20" y="735">    \&quot;steps\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;description\&quot;: \&quot;Ordered test steps. The first `prom</text><text x="20" y="755">pt` step is the case query; `toolCalledWith` asserts are the expected tool calls; a single model-free `toolCall` step is a render-</text><text x="20" y="775">check.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalTestStep\&quot;\n      }\n    },\n    \&quot;runs\&quot;: {\n      \&quot;</text><text x="20" y="795">type\&quot;: \&quot;integer\&quot;,\n      \&quot;minimum\&quot;: 1,\n      \&quot;maximum\&quot;: 10,\n      \&quot;description\&quot;: \&quot;Iterations to execute for this case.</text><text x="20" y="815">\&quot;\n    },\n    \&quot;model\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Model ID. Hosted-catalog ids use `provider/nam</text><text x="20" y="835">e` form (e.g. `anthropic/claude-haiku-4.5`) and run on org credits; provider-native ids require a matching `modelApiKeys` entry (B</text><text x="20" y="855">YOK). Unknown models are rejected with VALIDATION_ERROR at create time.\&quot;\n    },\n    \&quot;provider\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;</text><text x="20" y="875">,\n      \&quot;description\&quot;: \&quot;Model provider, e.g. `anthropic`, `openai`.\&quot;\n    },\n    \&quot;isNegativeTest\&quot;: {\n      \&quot;type\&quot;: \&quot;bo</text><text x="20" y="895">olean\&quot;,\n      \&quot;description\&quot;: \&quot;When `true`, the case passes if NO tools are called.\&quot;\n    },\n    \&quot;expectedOutput\&quot;: {\n    </text><text x="20" y="915">  \&quot;type\&quot;: \&quot;string\&quot;\n    },\n    \&quot;advancedConfig\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;Optional `system`</text><text x="20" y="935">, `temperature`, `toolChoice` overrides. `reasoningEffort` is NOT accepted (`400`): nothing ever applied it. Save an effort as `mo</text><text x="20" y="955">dels[].selection.settings.reasoningEffort` instead.\&quot;,\n      \&quot;additionalProperties\&quot;: true\n    },\n    \&quot;scenario\&quot;: {\n      \</text><text x="20" y="975">&quot;type\&quot;: \&quot;string\&quot;\n    },\n    \&quot;intent\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1,\n      \&quot;maxLength\&quot;: 64,\n  </text><text x="20" y="995">    \&quot;description\&quot;: \&quot;Optional authored analytics grouping label.\&quot;\n    },\n    \&quot;matchOptions\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,</text><text x="20" y="1015">\n      \&quot;description\&quot;: \&quot;Per-case tool-call matching override, in either vocabulary: public (`toolCallOrder: any|in-order|exact`</text><text x="20" y="1035">, `extraToolCalls`, `arguments`) or internal (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), n</text><text x="20" y="1055">ever both in one object.\&quot;,\n      \&quot;additionalProperties\&quot;: true\n    },\n    \&quot;predicates\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n   </text><text x="20" y="1075">   \&quot;deprecated\&quot;: true,\n      \&quot;description\&quot;: \&quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here</text><text x="20" y="1095"> all along and never written down, passing only because this schema allowed unknown properties; documented rather than removed so </text><text x="20" y="1115">no caller already sending it breaks. Send one or the other, never both.\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;mode\&quot;: {\n        </text><text x="20" y="1135">  \&quot;type\&quot;: \&quot;string\&quot;,\n          \&quot;enum\&quot;: [\n            \&quot;inherit\&quot;,\n            \&quot;replace\&quot;,\n            \&quot;extend\&quot;\n      </text><text x="20" y="1155">    ]\n        },\n        \&quot;list\&quot;: {\n          \&quot;type\&quot;: \&quot;array\&quot;,\n          \&quot;items\&quot;: {\n            \&quot;type\&quot;: \&quot;object\&quot;\n</text><text x="20" y="1175">          }\n        }\n      }\n    },\n    \&quot;isNegative\&quot;: {\n      \&quot;type\&quot;: \&quot;boolean\&quot;,\n      \&quot;description\&quot;: \&quot;Alias for `</text><text x="20" y="1195">isNegativeTest` \\u2014 the public case-authoring spelling this API returns on a read. Send one or the other, never both.\&quot;\n    }</text><text x="20" y="1215">,\n    \&quot;iterations\&quot;: {\n      \&quot;type\&quot;: \&quot;integer\&quot;,\n      \&quot;minimum\&quot;: 1,\n      \&quot;maximum\&quot;: 10,\n      \&quot;description\&quot;: \&quot;Al</text><text x="20" y="1235">ias for `runs`. Send one or the other, never both.\&quot;\n    },\n    \&quot;checks\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\</text><text x="20" y="1255">&quot;: \&quot;Per-case CHECK gate \\u2014 the grading rules this case is scored against. `mode` says how they combine with the suite&#x27;s own:</text><text x="20" y="1275"> `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field, same shape and same n</text><text x="20" y="1295">ame as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word for one concept. Send </text><text x="20" y="1315">this or the deprecated `predicates`, never both.\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;mode\&quot;: {\n          \&quot;type\&quot;: \&quot;string\&quot;,</text><text x="20" y="1335">\n          \&quot;enum\&quot;: [\n            \&quot;inherit\&quot;,\n            \&quot;replace\&quot;,\n            \&quot;extend\&quot;\n          ]\n        },\n    </text><text x="20" y="1355">    \&quot;list\&quot;: {\n          \&quot;type\&quot;: \&quot;array\&quot;,\n          \&quot;items\&quot;: {\n            \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalAssertio</text></g></svg>
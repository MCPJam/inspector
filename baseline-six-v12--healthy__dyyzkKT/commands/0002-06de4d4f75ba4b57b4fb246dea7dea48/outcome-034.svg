</text><text x="20" y="435">&quot;prompt\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;User message (`kind: prompt`).\&quot;\n    },\n    \&quot;serverName\&quot;: </text><text x="20" y="455">{\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Server that owns the tool (`kind: toolCall`).\&quot;\n    },\n    \&quot;toolName\&quot;</text><text x="20" y="475">: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Tool name (`kind: toolCall` / `interact`).\&quot;\n    },\n    \&quot;arguments\&quot;</text><text x="20" y="495">: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;Tool-call arguments (`kind: toolCall`).\&quot;,\n      \&quot;additionalPropertie</text><text x="20" y="515">s\&quot;: true\n    },\n    \&quot;action\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;Widget action (`kind: interact`).\&quot;,\n</text><text x="20" y="535">      \&quot;additionalProperties\&quot;: true\n    },\n    \&quot;assertion\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;The rule</text><text x="20" y="555"> an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `WidgetAssertion | Predicate`, an</text><text x="20" y="575">d that union is why the field is called an assertion rather than a check. A `Predicate` is evaluated against the PERSISTED transcr</text><text x="20" y="595">ipt, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated against a LIVE DOM and can never b</text><text x="20" y="615">e replayed. Calling this a check would promise the replayability only one half of it has.\&quot;,\n      \&quot;additionalProperties\&quot;: true</text><text x="20" y="635">\n    }\n  },\n  \&quot;additionalProperties\&quot;: true\n}\n{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;properties\&quot;: {\n    \&quot;type\&quot;: {\n      \&quot;type</text><text x="20" y="655">\&quot;: \&quot;string\&quot;,\n      \&quot;const\&quot;: \&quot;toolCalledWith\&quot;\n    },\n    \&quot;toolName\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\</text><text x="20" y="675">&quot;: 1\n    },\n    \&quot;args\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;args\&quot;: {\n          \&quot;type\&quot;: \&quot;ob</text><text x="20" y="695">ject\&quot;,\n          \&quot;propertyNames\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;\n          },\n          \&quot;additionalProperties\&quot;: {}\n </text><text x="20" y="715">       },\n        \&quot;argumentMatching\&quot;: {\n          \&quot;type\&quot;: \&quot;string\&quot;,\n          \&quot;enum\&quot;: [\n            \&quot;exact\&quot;,\n      </text><text x="20" y="735">      \&quot;partial\&quot;,\n            \&quot;ignore\&quot;\n          ]\n        }\n      },\n      \&quot;required\&quot;: [\n        \&quot;args\&quot;\n      ]\n  </text><text x="20" y="755">  },\n    \&quot;minCount\&quot;: {\n      \&quot;type\&quot;: \&quot;integer\&quot;,\n      \&quot;exclusiveMinimum\&quot;: 0,\n      \&quot;maximum\&quot;: 9007199254740991\n    </text><text x="20" y="775">},\n    \&quot;role\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;gating\&quot;,\n        \&quot;advisory\&quot;,\n        \&quot;require</text><text x="20" y="795">d\&quot;\n      ]\n    },\n    \&quot;severity\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;const\&quot;: \&quot;warn\&quot;\n    }\n  },\n  \&quot;required\&quot;: [\</text><text x="20" y="815">n    \&quot;type\&quot;,\n    \&quot;toolName\&quot;,\n    \&quot;args\&quot;\n  ]\n}\n{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;description\&quot;: \&quot;A tool result in scope (</text><text x="20" y="835">every result, or only toolName&#x27;s) whose content matches EVERY pattern (all within one result) occurred at least min (default 1) an</text><text x="20" y="855">d at most max times. min and max count MATCHING results, not all results: min 0, max 0 means no result matches. The content is the</text><text x="20" y="875"> result&#x27;s text, then structuredContent, then its JSON output part (JSON as canonical JSON), or, with path, the value at that key i</text><text x="20" y="895">n structuredContent (in the JSON output part when there is no structuredContent). isError results are included. A result whose tex</text><text x="20" y="915">t was truncated for storage (when path is omitted), or whose subject exceeds 100000 characters, is unreadable; so are results an i</text><text x="20" y="935">ncomplete capture did not record. A verdict they could decide is unscored.\&quot;,\n  \&quot;properties\&quot;: {\n    \&quot;type\&quot;: {\n      \&quot;type\</text><text x="20" y="955">&quot;: \&quot;string\&quot;,\n      \&quot;const\&quot;: \&quot;toolResultMatches\&quot;\n    },\n    \&quot;toolName\&quot;: {\n      \&quot;description\&quot;: \&quot;Omit to read every t</text><text x="20" y="975">ool&#x27;s results.\&quot;,\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1\n    },\n    \&quot;patterns\&quot;: {\n      \&quot;description\&quot;: \&quot;Ever</text><text x="20" y="995">y pattern must match the same result. Use alternation (A|B) inside one pattern for either.\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;max</text><text x="20" y="1015">Items\&quot;: 8,\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;,\n        \&quot;minLength\&quot;: 1,\n        \&quot;m</text><text x="20" y="1035">axLength\&quot;: 512\n      }\n    },\n    \&quot;flags\&quot;: {\n      \&quot;description\&quot;: \&quot;Applies to every pattern: i (ignore case), m (multili</text><text x="20" y="1055">ne), s (dot matches newline).\&quot;,\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;i\&quot;,\n        \&quot;m\&quot;,\n        \&quot;s\&quot;,\n</text><text x="20" y="1075">        \&quot;im\&quot;,\n        \&quot;is\&quot;,\n        \&quot;ms\&quot;,\n        \&quot;ims\&quot;\n      ]\n    },\n    \&quot;path\&quot;: {\n      \&quot;description\&quot;: \&quot;JSO</text><text x="20" y="1095">N Pointer (RFC 6901) to ONE top-level key of structuredContent (of the JSON output part when there is no structuredContent), such </text><text x="20" y="1115">as /elements; inside the key, ~1 stands for / and ~0 for ~. Omit to match the whole result. A result without the key does not matc</text><text x="20" y="1135">h.\&quot;,\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 2,\n      \&quot;maxLength\&quot;: 257,\n      \&quot;pattern\&quot;: \&quot;^\\\\/(?:[^/~]|~[01])</text><text x="20" y="1155">+$\&quot;\n    },\n    \&quot;min\&quot;: {\n      \&quot;description\&quot;: \&quot;Minimum number of MATCHING results (default 1). min 0 requires max.\&quot;,\n   </text><text x="20" y="1175">   \&quot;type\&quot;: \&quot;integer\&quot;,\n      \&quot;minimum\&quot;: 0,\n      \&quot;maximum\&quot;: 9007199254740991\n    },\n    \&quot;max\&quot;: {\n      \&quot;description</text><text x="20" y="1195">\&quot;: \&quot;Maximum number of MATCHING results; at least min (or 1 when min is omitted).\&quot;,\n      \&quot;type\&quot;: \&quot;integer\&quot;,\n      \&quot;minim</text><text x="20" y="1215">um\&quot;: 0,\n      \&quot;maximum\&quot;: 9007199254740991\n    },\n    \&quot;role\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;</text><text x="20" y="1235">gating\&quot;,\n        \&quot;advisory\&quot;,\n        \&quot;required\&quot;\n      ]\n    },\n    \&quot;severity\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \</text><text x="20" y="1255">&quot;const\&quot;: \&quot;warn\&quot;\n    }\n  },\n  \&quot;required\&quot;: [\n    \&quot;type\&quot;,\n    \&quot;patterns\&quot;\n  ]\n}\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;complet</text><text x="20" y="1275">ed&quot;}}</text><text x="20" y="1295">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_26&quot;, &quot;type&quot;: &quot;agent_message&quot;, &quot;text&quot;: &quot;The server is already saved in `project_fix</text><text x="20" y="1315">ture` as `Arithmetic`, so registration isn’t needed. The public API documents direct tool-call steps and result assertions. I’ll u</text><text x="20" y="1335">se those to make the arithmetic check repeatable.\n&quot;}}</text><text x="20" y="1355">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_27&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;cat &gt; suite-create.jso</text></g></svg>
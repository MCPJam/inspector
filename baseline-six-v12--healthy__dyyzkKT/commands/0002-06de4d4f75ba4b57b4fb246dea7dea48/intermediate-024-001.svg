 surface cannot author \\u2014 set them through `POST /v1/projects/{p</text><text x="20" y="255">rojectId}/eval-suites/{suiteId}/cases`.\&quot;,\n  \&quot;required\&quot;: [\n    \&quot;title\&quot;,\n    \&quot;model\&quot;,\n    \&quot;provider\&quot;,\n    \&quot;steps\&quot;\n </text><text x="20" y="275"> ],\n  \&quot;oneOf\&quot;: [\n    {\n      \&quot;required\&quot;: [\n        \&quot;runs\&quot;\n      ]\n    },\n    {\n      \&quot;required\&quot;: [\n        \&quot;iter</text><text x="20" y="295">ations\&quot;\n      ]\n    }\n  ],\n  \&quot;allOf\&quot;: [\n    {\n      \&quot;not\&quot;: {\n        \&quot;required\&quot;: [\n          \&quot;isNegative\&quot;,\n     </text><text x="20" y="315">     \&quot;isNegativeTest\&quot;\n        ]\n      }\n    },\n    {\n      \&quot;not\&quot;: {\n        \&quot;required\&quot;: [\n          \&quot;checks\&quot;,\n    </text><text x="20" y="335">      \&quot;predicates\&quot;\n        ]\n      }\n    }\n  ],\n  \&quot;properties\&quot;: {\n    \&quot;title\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;\n    },\n</text><text x="20" y="355">    \&quot;steps\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;description\&quot;: \&quot;Ordered test steps. The first `prom</text><text x="20" y="375">pt` step is the case query; `toolCalledWith` asserts are the expected tool calls; a single model-free `toolCall` step is a render-</text><text x="20" y="395">check.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalTestStep\&quot;\n      }\n    },\n    \&quot;runs\&quot;: {\n      \&quot;</text><text x="20" y="415">type\&quot;: \&quot;integer\&quot;,\n      \&quot;minimum\&quot;: 1,\n      \&quot;maximum\&quot;: 10,\n      \&quot;description\&quot;: \&quot;Iterations to execute for this case.</text><text x="20" y="435">\&quot;\n    },\n    \&quot;model\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;
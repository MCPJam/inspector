ions only; hosted prompt/model execution is not implemented.\&quot;, \&quot;details\&quot;: {\&quot;reason\&quot;: \&quot;fi</text><text x="20" y="1295">xture_unsupported_execution\&quot;}}\n&quot;, &quot;exit_code&quot;: 1, &quot;status&quot;: &quot;failed&quot;}}</text></g></svg>
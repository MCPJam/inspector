<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +80.37389993667603s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_24&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nim</text><text x="20" y="95">port json\ns=json.load(open(&#x27;openapi.json&#x27;))[&#x27;components&#x27;][&#x27;schemas&#x27;]\nfor k in [&#x27;EvalSuiteCreateRequest&#x27;,&#x27;EvalCaseCreate&#x27;,&#x27;EvalSt</text><text x="20" y="115">ep&#x27;,&#x27;EvalRunCreateRequest&#x27;]:\n print(k,json.dumps(s.get(k),indent=2))\nprint(&#x27;step schemas&#x27;,[k for k in s if &#x27;Step&#x27; in k or &#x27;Case&#x27;</text><text x="20" y="135"> in k or &#x27;Assert&#x27; in k])\nPY\&quot;&quot;, &quot;aggregated_output&quot;: &quot;EvalSuiteCreateRequest {\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;description\&quot;: \&quot;Aut</text><text x="20" y="155">hor-only suite-create body. A suite-level default `model` (and optional `provider`) applies to every test unless the test override</text><text x="20" y="175">s it.\&quot;,\n  \&quot;required\&quot;: [\n    \&quot;name\&quot;,\n    \&quot;serverIds\&quot;,\n    \&quot;model\&quot;,\n    \&quot;tests\&quot;\n  ],\n  \&quot;properties\&quot;: {\n    \&quot;na</text><text x="20" y="195">me\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1,\n      \&quot;description\&quot;: \&quot;Suite name.\&quot;\n    },\n    \&quot;description\&quot;</text><text x="20" y="215">: {\n      \&quot;type\&quot;: \&quot;string\&quot;\n    },\n    \&quot;serverIds\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;descrip</text><text x="20" y="235">tion\&quot;: \&quot;Servers (by canonical project ID) the suite&#x27;s cases run against.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n </text><text x="20" y="255">     }\n    },\n    \&quot;serverNames\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;description\&quot;: \&quot;Optional display names, parallel to `</text><text x="20" y="275">serverIds`.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n      }\n    },\n    \&quot;hosts\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n </text><text x="20" y="295">     \&quot;description\&quot;: \&quot;Clients (hosts) to attach the suite to, in attach order. A suite with no attached client reports none wher</text><text x="20" y="315">ever it is listed, and a run has no host to select. Same shape as the PATCH `hosts` field.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\</text><text x="20" y="335">&quot;: \&quot;object\&quot;,\n        \&quot;required\&quot;: [\n          \&quot;host\&quot;\n        ],\n        \&quot;properties\&quot;: {\n          \&quot;host\&quot;: {\n       </text><text x="20" y="355">     \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;minLength\&quot;: 1,\n            \&quot;description\&quot;: \&quot;Host name or id.\&quot;\n          },\n      </text><text x="20" y="375">    \&quot;servers\&quot;: {\n            \&quot;type\&quot;: \&quot;array\&quot;,\n            \&quot;items\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;,\n             </text><text x="20" y="395"> \&quot;minLength\&quot;: 1\n            },\n            \&quot;description\&quot;: \&quot;Server names (as bound in the suite&#x27;s environment) or project-se</text><text x="20" y="415">rver ids.\&quot;\n          }\n        }\n      }\n    },\n    \&quot;model\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1,\n    </text><text x="20" y="435">  \&quot;description\&quot;: \&quot;Suite-level default model id (e.g. `anthropic/claude-haiku-4.5`). Used for any test that omits `model`.\&quot;\n  </text><text x="20" y="455">  },\n    \&quot;provider\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Optional suite-level default provider. When omitt</text><text x="20" y="475">ed, the provider is derived from a `provider/model` id.\&quot;\n    },\n    \&quot;passCriteria\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;d</text><text x="20" y="495">escription\&quot;: \&quot;The floor a run must clear, as a PERCENT in [0, 100] \\u2014 80 means 80%. `minimumPassRatePercent` is the canonic</text><text x="20" y="515">al spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGUATES </text><text x="20" y="535">THE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluator can</text><text x="20" y="555"> act on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and would si</text><text x="20" y="575">lently make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suite/run</text><text x="20" y="595"> floor is not.\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;minimumPassRatePercent\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\n          \&quot;mi</text><text x="20" y="615">nimum\&quot;: 0,\n          \&quot;maximum\&quot;: 100,\n          \&quot;description\&quot;: \&quot;A percent in [0, 100]. The whole range is usable, sub-1 val</text><text x="20" y="635">ues included \\u2014 the unit is in the field name, so nothing is ambiguous. Note that the GitHub Checks gate rounds the measured </text><text x="20" y="655">rate to an integer before comparing (to stay in step with the eval UI), so a floor below 0.5 behaves there as if it were 0.5; the </text><text x="20" y="675">platform&#x27;s own verdict compares unrounded.\&quot;\n        },\n        \&quot;minimumPassRate\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\n       </text><text x="20" y="695">   \&quot;minimum\&quot;: 0,\n          \&quot;maximum\&quot;: 100,\n          \&quot;deprecated\&quot;: true,\n          \&quot;description\&quot;: \&quot;Deprecated alias fo</text><text x="20" y="715">r `minimumPassRatePercent`, same unit. A value in (0, 1) is REJECTED here \\u2014 it reads as a fraction sent by mistake \\u2014 w</text><text x="20" y="735">hich is what the `not` below expresses. Use `minimumPassRatePercent` for a genuine sub-1% floor.\&quot;,\n          \&quot;not\&quot;: {\n       </text><text x="20" y="755">     \&quot;exclusiveMinimum\&quot;: 0,\n            \&quot;exclusiveMaximum\&quot;: 1\n          }\n        }\n      },\n      \&quot;oneOf\&quot;: [\n        </text><text x="20" y="775">{\n          \&quot;required\&quot;: [\n            \&quot;minimumPassRatePercent\&quot;\n          ]\n        },\n        {\n          \&quot;required\&quot;: </text><text x="20" y="795">[\n            \&quot;minimumPassRate\&quot;\n          ]\n        }\n      ],\n      \&quot;additionalProperties\&quot;: false\n    },\n    \&quot;tags\&quot;:</text><text x="20" y="815"> {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;description\&quot;: \&quot;Accepted for forward-compat; not persisted today (no-op).\&quot;,\n      \&quot;ite</text><text x="20" y="835">ms\&quot;: {\n        \&quot;type\&quot;: \&quot;string\&quot;\n      }\n    },\n    \&quot;tests\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n    </text><text x="20" y="855">  \&quot;maxItems\&quot;: 100,\n      \&quot;description\&quot;: \&quot;Test cases to create in the suite. The object is CLOSED: an unknown key is a VALIDA</text><text x="20" y="875">TION_ERROR, never a silently dropped field. `repetitions`, `passThreshold` and `kind` are per-case policy fields this surface cann</text><text x="20" y="895">ot author \\u2014 set them through `POST /v1/projects/{projectId}/eval-suites/{suiteId}/cases`.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;</text><text x="20" y="915">type\&quot;: \&quot;object\&quot;,\n        \&quot;required\&quot;: [\n          \&quot;title\&quot;,\n          \&quot;steps\&quot;\n        ],\n        \&quot;allOf\&quot;: [\n       </text><text x="20" y="935">   {\n            \&quot;not\&quot;: {\n              \&quot;required\&quot;: [\n                \&quot;runs\&quot;,\n                \&quot;iterations\&quot;\n          </text><text x="20" y="955">    ]\n            }\n          },\n          {\n            \&quot;not\&quot;: {\n              \&quot;required\&quot;: [\n                \&quot;isNegati</text><text x="20" y="975">ve\&quot;,\n                \&quot;isNegativeTest\&quot;\n              ]\n            }\n          },\n          {\n            \&quot;not\&quot;: {\n    </text><text x="20" y="995">          \&quot;required\&quot;: [\n                \&quot;checks\&quot;,\n                \&quot;predicates\&quot;\n              ]\n            }\n          </text><text x="20" y="1015">}\n        ],\n        \&quot;properties\&quot;: {\n          \&quot;title\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;minLength\&quot;: 1\</text><text x="20" y="1035">n          },\n          \&quot;steps\&quot;: {\n            \&quot;type\&quot;: \&quot;array\&quot;,\n            \&quot;minItems\&quot;: 1,\n            \&quot;description\&quot;</text><text x="20" y="1055">: \&quot;Ordered test steps (the unified test model). The first `prompt` step is the case query; `toolCalledWith` asserts are the expec</text><text x="20" y="1075">ted tool calls; a single model-free `toolCall` step is a render-check.\&quot;,\n            \&quot;items\&quot;: {\n              \&quot;$ref\&quot;: \&quot;#/c</text><text x="20" y="1095">omponents/schemas/EvalTestStep\&quot;\n            }\n          },\n          \&quot;runs\&quot;: {\n            \&quot;type\&quot;: \&quot;integer\&quot;,\n        </text><text x="20" y="1115">    \&quot;minimum\&quot;: 1,\n            \&quot;maximum\&quot;: 10,\n            \&quot;description\&quot;: \&quot;Iterations to execute for this case. Defaults to</text><text x="20" y="1135"> 1.\&quot;\n          },\n          \&quot;model\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;description\&quot;: \&quot;Per-case model over</text><text x="20" y="1155">ride. Defaults to the suite-level `model`.\&quot;\n          },\n          \&quot;provider\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n        </text><text x="20" y="1175">    \&quot;description\&quot;: \&quot;Per-case provider override.\&quot;\n          },\n          \&quot;expectedOutput\&quot;: {\n            \&quot;type\&quot;: \&quot;strin</text><text x="20" y="1195">g\&quot;\n          },\n          \&quot;isNegativeTest\&quot;: {\n            \&quot;type\&quot;: \&quot;boolean\&quot;,\n            \&quot;description\&quot;: \&quot;When `true`</text><text x="20" y="1215">, the case passes if NO tools are called.\&quot;\n          },\n          \&quot;scenario\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;\n          </text><text x="20" y="1235">},\n          \&quot;advancedConfig\&quot;: {\n            \&quot;type\&quot;: \&quot;object\&quot;,\n            \&quot;description\&quot;: \&quot;Optional `system`, `tempera</text><text x="20" y="1255">ture`, `toolChoice` overrides. `reasoningEffort` is NOT accepted (`400`): nothing ever applied it. Save an effort as `models[].sel</text><text x="20" y="1275">ection.settings.reasoningEffort` instead.\&quot;,\n            \&quot;additionalProperties\&quot;: true\n          },\n          \&quot;intent\&quot;: {\n </text><text x="20" y="1295">           \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;minLength\&quot;: 1,\n            \&quot;maxLength\&quot;: 64,\n            \&quot;description\&quot;: \&quot;Op</text><text x="20" y="1315">tional authored analytics grouping label.\&quot;\n          },\n          \&quot;matchOptions\&quot;: {\n            \&quot;type\&quot;: \&quot;object\&quot;,\n     </text><text x="20" y="1335">       \&quot;description\&quot;: \&quot;Per-case tool-call matching override, in either vocabulary: public (`toolCallOrder: any|in-order|exact`,</text><text x="20" y="1355"> `extraToolCalls`, `arguments`) or internal (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), ne</text></g></svg>
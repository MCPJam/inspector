;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;</text><text x="20" y="1055">gating\&quot;,\n        \&quot;advisory\&quot;,\n        \&quot;required\&quot;\n      ]\n    },\n    \&quot;severity\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \</text><text x="20" y="1075">&quot;const\&quot;: \&quot;warn\&quot;\n    }\n  },\n  \&quot;required\&quot;: [\n    \&quot;type\&quot;,\n    \&quot;patterns\&quot;\n  ]\n}\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;complet</text><text x="20" y="1095">ed&quot;}}</text></g></svg>
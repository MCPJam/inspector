<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1125"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +84.65660667419434s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_25&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nim</text><text x="20" y="95">port json\ns=json.load(open(&#x27;openapi.json&#x27;))[&#x27;components&#x27;][&#x27;schemas&#x27;]\nprint(json.dumps(s[&#x27;EvalTestStep&#x27;],indent=2))\na=s[&#x27;EvalAss</text><text x="20" y="115">ertion&#x27;]\nfor item in a.get(&#x27;oneOf&#x27;,a.get(&#x27;anyOf&#x27;,[])):\n if item.get(&#x27;properties&#x27;,{}).get(&#x27;type&#x27;,{}).get(&#x27;const&#x27;) in [&#x27;toolResult</text><text x="20" y="135">Matches&#x27;,&#x27;toolCalledWith&#x27;]:print(json.dumps(item,indent=2))\nPY\&quot;&quot;, &quot;aggregated_output&quot;: &quot;{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;descript</text><text x="20" y="155">ion\&quot;: \&quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user message (model turn); `toolCall</text><text x="20" y="175">` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an assertion (a `Predicate` like `to</text><text x="20" y="195">olCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).\&quot;,\n  \&quot;required\&quot;: [\n    \&quot;id\&quot;,\n    \&quot;kind\&quot;\n  ],\n  \&quot;propert</text><text x="20" y="215">ies\&quot;: {\n    \&quot;id\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1\n    },\n    \&quot;kind\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,</text><text x="20" y="2
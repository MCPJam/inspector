 the replayability only one half of it has.\&quot;,\n      \&quot;additionalProperties\&quot;: true</text><text x="20" y="455">\n    }\n  },\n  \&quot;additionalProperties\&quot;: true\n}\n{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;properties\&quot;: {\n    \&quot;type\&quot;: {\n      \&quot;type</text><text x="20" y="475">\&quot;: \&quot;string\&quot;,\n      \&quot;const\&quot;: \&quot;toolCalledWith\&quot;\n    },\n    \&quot;toolName\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\</text><text x="20" y="495">&quot;: 1\n    },\n    \&quot;args\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;properties\&quot;: {\n        \&quot;args\&quot;: {\n          \&quot;type\&quot;: \&quot;ob</text><text x="20" y="515">ject\&quot;,\n          \&quot;propertyNames\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;\n          },\n          \&quot;additionalProperties\&quot;: {}\n </text><text x="20" y="535">       },\n        \&quot;argumentMatching\&quot;: {\n          \&quot;type\&quot;: \&quot;string\&quot;,\n          \&quot;enum\&quot;: [\n            \&quot;exact\&quot;,\n      </text><text x="20" y="555">      \&quot;partial\&quot;,\n            \&quot;ignore\&quot;\n          ]\n        }\n      },\n      \&quot;required\&quot;: [\n        \&quot;args\&quot;\n      ]\n  </text><text x="20" y="575">  },\n    \&quot;minCount\&quot;: {\n      \&quot;type\&quot;: \&quot;integer\&quot;,\n      \&quot;exclusiveMinimum\&quot;: 0,\n      \&quot;maximum\&quot;: 9007199254740991\n    </text><text x="20" y="595">},\n    \&quot;role\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;gating\&quot;,\n        \&quot;advisory\&quot;,\n        \&quot;require</text><text x="20" y="615">d\&quot;\n      ]\n    },\n    \&quot;severity\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;const\&quot;: \&quot;warn\&quot;\n    }\n  },\n  \&quot;required\&quot;: [\</text><text x="20" y="635">n    \&quot;type\&quot;,\n    \&quot;toolName\&quot;,\n    \&quot;args\&quot;\n  ]\n}\n{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;description\&quot;: \&quot;A tool result in scope (</text><text x="20" y="655">every result, or only toolName&#x27;s) whose content matches EVERY pattern (all within one result) occurred at least min (default 1) an</text><text x="20" y="675">d at most max times. min and max count MATCHING results, not all results: min 0, max 0 means no result matches. The content is the</text><text x="20" y="695"> result&#x27;s text, then structuredContent, then its JSON output part (JSON as canonical JSON), or, with path, the value at that key i</text><text x="20" y="715">n structuredContent (in the JSON output part when there is no structuredContent). isError results are included. A result whose tex</text><text x="20" y="735">t was truncated for storage (when path is omitted), or whose subject exceeds 100000 characters, is unreadable; so are results an i</text><text x="20" y="755">ncomplete capture did not record. A verdict they could decide is unscored.\&quot;,\n  \&quot;properties\&quot;: {\n    \&quot;type\&quot;: {\n      \&quot;type\</text><text x="20" y="775">&quot;: \&quot;string\&quot;,\n      \&quot;const\&quot;: \&quot;toolResultMatches\&quot;\n    },\n    \&quot;toolName\&quot;: {\n      \&quot;description\&quot;: \&quot;Omit to read every t</text><text x="20" y="795">ool&#x27;s results.\&quot;,\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1\n    },\n    \&quot;patterns\&quot;: {\n      \&quot;description\&quot;: \&quot;Ever</text><text x="20" y="815">y pattern must match the same result. Use alternation (A|B) inside one pattern for either.\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;max</text><text x="20" y="835">Items\&quot;: 8,\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;
his or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="515">      &quot;properties&quot;: {</text><text x="20" y="535">        &quot;mode&quot;: {</text><text x="20" y="555">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="575">          &quot;enum&quot;: [</text><text x="20" y="595">            &quot;inherit&quot;,</text><text x="20" y="615">            &quot;replace&quot;,</text><text x="20" y="635">            &quot;extend&quot;</text><text x="20" y="655">          ]</text><text x="20" y="675">        },</text><text x="20" y="695">        &quot;list&quot;: {</text><text x="20" y="715">          &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="735">          &quot;items&quot;: {</text><text x="20" y="755">            &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="775">          }</text><text x="20" y="795">        }</text><text x="20" y="815">      }</text><text x="20" y="835">    },</text><text x="20" y="855">    &quot;suppressedSuiteStandardCheckIds&quot;: {</text><text x="20" y="875">      &quot;$ref&quot;: &quot;#/components/schemas/SuppressedSuiteStandardCheckIds&quot;,</text><text x="20" y="895">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="915">      &quot;items&quot;: {</text><text x="20" y="935">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="955">      }</text><text x="20" y="975">    }</text><text x="20" y="995">  },</text><text x="20" y="1015">  &quot;additionalProperties&quot;: false</text><text x="20" y="1035">}</text><text x="20" y="1055">toolDescriptionsPresent</text><text x="20" y="1075">toolAnnotationsPresent</text><text x="20" y="1095">toolNamesUnique</text><text x="20" y="1115">noDeprecatedToolExposed</text><text x="20" y="1135">toolInputSchemasWellFormed</text><text x="20" y="1155">toolOutputSchemasPresent</text><text x="20" y="1175">toolCalledWith</text><text x="20" y="1195">toolCalledAtLeastOnce</text><text x="20
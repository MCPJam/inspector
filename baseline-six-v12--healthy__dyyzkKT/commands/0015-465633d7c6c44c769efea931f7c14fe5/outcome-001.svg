<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">465633d7c6c44c769efea931f7c14fe5 — page 1</text><text x="20" y="75">$ /bin/bash -c python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json</text><text x="20" y="115">s=json.load(open(&#x27;openapi.json&#x27;))[&#x27;components&#x27;][&#x27;schemas&#x27;]</text><text x="20" y="135">print(json.dumps(s[&#x27;EvalTestCase&#x27;],indent=2))</text><text x="20" y="155">for i in s[&#x27;EvalAssertion&#x27;].get(&#x27;oneOf&#x27;,[]):</text><text x="20" y="175"> t=i.get(&#x27;properties&#x27;,{}).get(&#x27;type&#x27;,{}).get(&#x27;const&#x27;);print(t)</text><text x="20" y="195"> if t in [&#x27;toolResultContains&#x27;,&#x27;outputContains&#x27;]:print(json.dumps(i,indent=2))</text><text x="20" y="215">PY</text><text x="20" y="235">cat &gt; run-request.json &lt;&lt;&#x27;EOF&#x27;</text><text x="20" y="255">{&quot;suiteId&quot;:&quot;suite_authored_1&quot;,&quot;serverIds&quot;:[&quot;server_fixture&quot;]}</text><text x="20" y="275">EOF</text><text x="20" y="295">python3 api.py /projects/project_fixture/eval-runs POST run-receipt.json run-request.json</text><text x="20" y="315">{</text><text x="20" y="335">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="355">  &quot;description&quot;: &quot;Inline eval test case. The case body is an ordered `steps` array (the unified test model). Exactly one of `runs`</text><text x="20" y="375"> / `iterations` is required \u2014 an inline test on a run has no suite default to inherit. The object is CLOSED: an unknown key i</text><text x="20" y="395">s a VALIDATION_ERROR, never a silently dropped field. `repetitions`, `passThreshold` and `kind` are per-case policy fields this su</text><text x="20" y="415">rface cannot author \u2014 set them through `POST /v1/projects/{projectId}/eval-suites/{suiteId}/cases`.&quot;,</text><text x="20" y="435">  &quot;required&quot;: [</text><text x="20" y="455">    &quot;title&quot;,</text><text x="20" y="475">    &quot;model&quot;,</text><text x="20" y="495">    &quot;provider&quot;,</text><text x="20" y="515">    &quot;steps&quot;</text><text x="20" y="535">  ],</text><text x="20" y="555">  &quot;oneOf&quot;: [</text><text x="20" y="575">    {</text><text x="20" y="595">      &quot;required&quot;: [</text><text x="20" y="615">        &quot;runs&quot;</text><text x="20" y="635">      ]</text><text x="20" y="655">    },</text><text x="20" y="675">    {</text><text x="20" y="695">      &quot;required&quot;: [</text><text x="20" y="715">        &quot;iterations&quot;</text><text x="20" y="735">      ]</text><text x="20" y="755">    }</text><text x="20" y="775">  ],</text><text x="20" y="795">  &quot;allOf&quot;: [</text><text x="20" y="815">    {</text><text x="20" y="835">      &quot;not&quot;: {</text><text x="20" y="855">        &quot;required&quot;: [</text><text x="20" y="875">          &quot;isNegative&quot;,</text><text x="20" y="895">          &quot;isNegativeTest&quot;</text><text x="20" y="915">        ]</text><text x="20" y="935">      }</text><text x="20" y="955">    },</text><text x="20" y="975">    {</text><text x="20" y="995">      &quot;not&quot;: {</text><text x="20" y="1015">        &quot;required&quot;: [</text><text x="20" y="1035">          &quot;checks&quot;,</text><text x="20" y="1055">          &quot;predicates&quot;</text><text x="20" y="1075">        ]</text><text x="20" y="1095">      }</text><text x="20" y="1115">    }</text><text x="20" y="1135">  ],</text><text x="20" y="1155">  &quot;properties&quot;: {</text><text x="20" y="1175">    &quot;title&quot;: {</text><text x="20" y="1195">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1215">    },</text><text x="20" y="1235">    &quot;steps&quot;: {</text><text x="20" y="1255">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1275">      &quot;minItems&quot;: 1,</text><text x="20" y="1295">      &quot;description&quot;: &quot;Ordered test steps. The first `prompt` step is the case query; `toolCalledWith` asserts are the expected too</text><text x="20" y="1315">l calls; a single model-free `toolCall` step is a render-check.&quot;,</text><text x="20" y="1335">      &quot;items&quot;: {</text><text x="20" y="1355">        &quot;$ref&quot;: &quot;#/components/schemas/EvalTestStep&quot;</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1025"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">5717171c5b2d4d038a2e6a5c2f87a8db — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; reproduce.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">#!/usr/bin/env python3</text><text x="20" y="115">&quot;&quot;&quot;Create and run the documented MCPJam deterministic evaluation.&quot;&quot;&quot;</text><text x="20" y="135">import json, os, pathlib, time, urllib.request</text><text x="20" y="155">ROOT = pathlib.Path(__file__).resolve().parent</text><text x="20" y="175">BASE = os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;)</text><text x="20" y="195">KEY = os.environ[&#x27;MCPJAM_API_KEY&#x27;]</text><text x="20" y="215">PROJECT = &#x27;project_fixture&#x27;</text><text x="20" y="235">def request(method, path, body=None):</text><text x="20" y="255">    req = urllib.request.Request(BASE + path, method=method,</text><text x="20" y="275">        data=None if body is None else json.dumps(body).encode(),</text><text x="20" y="295">        headers={&#x27;Authorization&#x27;: &#x27;Bearer &#x27; + KEY, &#x27;Content-Type&#x27;: &#x27;application/json&#x27;})</text><text x="20" y="315">    with urllib.request.urlopen(req, timeout=20) as response:</text><text x="20" y="335">        return json.load(response)</text><text x="20" y="355">def save(name, value):</text><text x="20" y="375">    (ROOT / name).write_text(json.dumps(value, indent=2) + &#x27;\n&#x27;)</text><text x="20" y="395"># Reuse the saved suite on subsequent invocations; create it on a fresh checkout.</text><text x="20" y="415">receipt_path = ROOT / &#x27;suite-created.json&#x27;</text><text x="20" y="435">if receipt_path.exists():</text><text x="20" y="455">    suite = json.loads(receipt_path.read_text())</text><text x="20" y="475">else:</text><text x="20" y="495">    suite = request(&#x27;POST&#x27;, f&#x27;/projects/{PROJECT}/eval-suites&#x27;,</text><text x="20" y="515">                    json.loads((ROOT / &#x27;suite-create.json&#x27;).read_text()))</text><text x="20" y="535">    save(&#x27;suite-created.json&#x27;, suite)</text><text x="20" y="555">launch = request(&#x27;POST&#x27;, f&#x27;/projects/{PROJECT}/eval-runs&#x27;,</text><text x="20" y="575">                 {&#x27;suiteId&#x27;: suite[&#x27;suiteId&#x27;], &#x27;serverIds&#x27;: [&#x27;server_fixture&#x27;]})</text><text x="20" y="595">save(&#x27;repeat-receipt.json&#x27;, launch)</text><text x="20" y="615">run_id = launch[&#x27;runId&#x27;]</text><text x="20" y="635">for attempt in range(30):</text><text x="20" y="655">    report = request(&#x27;GET&#x27;, f&#x27;/projects/{PROJECT}/eval-runs/{run_id}&#x27;)</text><text x="20" y="675">    save(&#x27;repeat-report.json&#x27;, report)</text><text x="20" y="695">    run = report.get(&#x27;run&#x27;, report)</text><text x="20" y="715">    if run.get(&#x27;status&#x27;) in (&#x27;completed&#x27;, &#x27;failed&#x27;, &#x27;cancelled&#x27;, &#x27;timed_out&#x27;):</text><text x="20" y="735">        break</text><text x="20" y="755">    time.sleep(1)</text><text x="20" y="775">else:</text><text x="20" y="795">    raise SystemExit(&#x27;No terminal verdict within 30 polls&#x27;)</text><text x="20" y="815">evidence = request(&#x27;GET&#x27;, f&#x27;/projects/{PROJECT}/eval-runs/{run_id}/iterations&#x27;)</text><text x="20" y="835">save(&#x27;repeat-iterations.json&#x27;, evidence)</text><text x="20" y="855">verdict = report.get(&#x27;decisionSummary&#x27;, {}).get(&#x27;verdict&#x27;, run.get(&#x27;result&#x27;))</text><text x="20" y="875">print(f&#x27;{run_id}: {verdict}&#x27;)</text><text x="20" y="895">raise SystemExit(0 if run.get(&#x27;status&#x27;) == &#x27;completed&#x27; and verdict == &#x27;passed&#x27; else 1)</text><text x="20" y="915">PY</text><text x="20" y="935">python3 reproduce.py</text><text x="20" y="955">run_fixture_2: passed</text><text x="20" y="975"></text><text x="20" y="995">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
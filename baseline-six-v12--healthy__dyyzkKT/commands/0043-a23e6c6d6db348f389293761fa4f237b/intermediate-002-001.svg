<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="365"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +1.1615476608276367s — page 1</text><text x="20" y="75">Usage: mcpjam cloud projects servers connect [options]</text><text x="20" y="95"></text><text x="20" y="115">Connect an MCP server URL to a project, authorizing in a browser if needed</text><text x="20" y="135"></text><text x="20" y="155">Options:</text><text x="20" y="175">  --url &lt;url&gt;             MCP server URL to connect</text><text x="20" y="195">  --project &lt;id-or-name&gt;  Project name or ID</text><text x="20" y="215">  --server &lt;id&gt;           Existing server ID, when the project has several on</text><text x="20" y="235">                          this URL</text><text x="20" y="255">  --name &lt;name&gt;           Name for the server, if one is created</text><text x="20" y="275">  --reauthorize           Force a fresh authorization</text><text x="20" y="295">  --no-browser            Print the authorization link instead of opening it</text><text x="20" y="315">  --no-wait               Return as soon as the request is created</text><text x="20" y="335">  -h, --help              display help for command</text></g></svg>
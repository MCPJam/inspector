<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.018781423568725586s — page 1</text><text x="20" y="75"></text><text x="20" y="95">EvalCaseCreate null</text><text x="20" y="115">EvalStep null</text><text x="20" y="135">EvalRunCreateRequest {</text><text x="20" y="155">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="175">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="195">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone \u2014 without a `suiteId` or a `suiteName` \u2014</text><text x="20" y="215"> are rejected with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite th</text><text x="20" y="235">at has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite co</text><text x="20" y="255">uld never be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="275">  &quot;anyOf&quot;: [</text><text x="20" y="295">    {</text><text x="20" y="315">      &quot;required&quot;: [</text><text x="20" y="335">        &quot;suiteId&quot;</text><text x="20" y="355">      ]</text><text x="20" y="375">    },</text><text x="20" y="395">    {</text><text x="20" y="415">      &quot;required&quot;: [</text><text x="20" y="435">        &quot;suiteName&quot;,</text><text x="20" y="455">        &quot;tests&quot;,</text><text x="20" y="475">        &quot;serverIds&quot;</text><text x="20" y="495">      ],</text><text x="20" y="515">      &quot;properties&quot;: {</text><text x="20" y="535">        &quot;tests&quot;: {</text><text x="20" y="555">          &quot;minItems&quot;: 1</text><text x="20" y="575">        }</text><text x="20" y="595">      }</text><text x="20" y="615">    }</text><text x="20" y="635">  ],</text><text x="20" y="655">  &quot;properties&quot;: {</text><text x="20" y="675">    &quot;suiteId&quot;: {</text><text x="20" y="695">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="715">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="735">    },</text><text x="20" y="755">    &quot;hosts&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="795">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="815">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text><text x="20" y="835">      &quot;items&quot;: {</text><text x="20" y="855">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="875">        &quot;required&quot;: [</text><text x="20" y="895">          &quot;host&quot;</text><text x="20" y="915">        ],</text><text x="20" y="935">        &quot;properties&quot;: {</text><text x="20" y="955">          &quot;host&quot;: {</text><text x="20" y="975">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="995">            &quot;minLength&quot;: 1</text><text x="20" y="1015">          },</text><text x="20" y="1035">          &quot;servers&quot;: {</text><text x="20" y="1055">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1075">            &quot;items&quot;: {</text><text x="20" y="1095">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1115">              &quot;minLength&quot;: 1</text><text x="20" y="1135">            }</text><text x
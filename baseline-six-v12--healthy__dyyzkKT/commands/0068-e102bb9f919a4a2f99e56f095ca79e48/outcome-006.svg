<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">e102bb9f919a4a2f99e56f095ca79e48 — page 6</text><text x="20" y="75">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="95">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="115">    },</text><text x="20" y="135">    &quot;hosts&quot;: {</text><text x="20" y="155">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="175">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="195">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text><text x="20" y="215">      &quot;items&quot;: {</text><text x="20" y="235">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="255">        &quot;required&quot;: [</text><text x="20" y="275">          &quot;host&quot;</text><text x="20" y="295">        ],</text><text x="20" y="315">        &quot;properties&quot;: {</text><text x="20" y="335">          &quot;host&quot;: {</text><text x="20" y="355">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="375">            &quot;minLength&quot;: 1</text><text x="20" y="395">          },</text><text x="20" y="415">          &quot;servers&quot;: {</text><text x="20" y="435">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="455">            &quot;items&quot;: {</text><text x="20" y="475">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="495">              &quot;minLength&quot;: 1</text><text x="20" y="515">            }</text><text x="20" y="535">          }</text><text x="20" y="555">        }</text><text x="20" y="575">      }</text><text x="20" y="595">    },</text><text x="20" y="615">    &quot;suiteName&quot;: {</text><text x="20" y="635">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="655">      &quot;description&quot;: &quot;Name for a new suite. Required (non-empty) when no `suiteId` is given.&quot;</text><text x="20" y="675">    },</text><text x="20" y="695">    &quot;suiteDescription&quot;: {</text><text x="20" y="715">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="735">    },</text><text x="20" y="755">    &quot;tests&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="795">      &quot;maxItems&quot;: 100,</text><text x="20" y="815">      &quot;description&quot;: &quot;Inline test cases to upsert into the suite before running.&quot;,</text><text x="20" y="835">      &quot;items&quot;: {</text><text x="20" y="855">        &quot;$ref&quot;: &quot;#/components/schemas/EvalTestCase&quot;</text><text x="20" y="875">      }</text><text x="20" y="895">    },</text><text x="20" y="915">    &quot;serverIds&quot;: {</text><text x="20" y="935">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="955">      &quot;minItems&quot;: 1,</text><text x="20" y="975">      &quot;description&quot;: &quot;Servers (by ID) the run connects to. Required when creating a new suite; optional on reruns \u2014 when omit</text><text x="20" y="995">ted, the run connects the suite&#x27;s saved server selection (the set its snapshot references). A rerun of a suite with no saved selec</text><text x="20" y="1015">tion is rejected with `VALIDATION_ERROR` (`details.reason: \&quot;NO_SAVED_SERVER_SELECTION\&quot;`). Rejected outright for a suite with att</text><text x="20" y="1035">ached environments (`details.reason: \&quot;ENVIRONMENT_SERVERS_NOT_OVERRIDABLE\&quot;`): the environment supplies a closed set that a serve</text><text x="20" y="1055">r override cannot change, so accepting one would connect a different set than the run is stamped with.&quot;,</text><text x="20" y="1075">      &quot;items&quot;: {</text><text x="20" y="1095">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1115">      }</text><text x="20" y="1135">    },</text><text x="20" y="1155">    &quot;serverNames&quot;: {</text><text x="20" y="1175">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1195">      &quot;description&quot;: &quot;Optional display names, parallel to `serverIds`.&quot;,</text><text x="20" y="1215">      &quot;items&quot;: {</text><text x="20" y="1235">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1255">      }</text><text x="20" y="1275">    },</text><text x="20" y="1295">    &quot;suiteRerun&quot;: {</text><text x="20" y="1315">      &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="1335">      &quot;description&quot;: &quot;When true, skip per-case upsert and rerun the persisted suite. A bare `suiteId` with no `tests` is always tr</text><text x="20" y="1355">eated as a rerun.&quot;</text></g></svg>
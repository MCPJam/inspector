<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">e102bb9f919a4a2f99e56f095ca79e48 — page 7</text><text x="20" y="75">    },</text><text x="20" y="95">    &quot;modelApiKeys&quot;: {</text><text x="20" y="115">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="135">      &quot;description&quot;: &quot;Optional per-provider model API keys (e.g. `{ \&quot;anthropic\&quot;: \&quot;sk-ant-\u2026\&quot; }`). Falls back to your organ</text><text x="20" y="155">ization&#x27;s configured providers when omitted.&quot;,</text><text x="20" y="175">      &quot;additionalProperties&quot;: {</text><text x="20" y="195">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="215">      }</text><text x="20" y="235">    },</text><text x="20" y="255">    &quot;notes&quot;: {</text><text x="20" y="275">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="295">    },</text><text x="20" y="315">    &quot;passCriteria&quot;: {</text><text x="20" y="335">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="355">      &quot;description&quot;: &quot;The floor a run must clear, as a PERCENT in [0, 100] \u2014 80 means 80%. `minimumPassRatePercent` is the ca</text><text x="20" y="375">nonical spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGU</text><text x="20" y="395">ATES THE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluato</text><text x="20" y="415">r can act on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and wou</text><text x="20" y="435">ld silently make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suit</text><text x="20" y="455">e/run floor is not.&quot;,</text><text x="20" y="475">      &quot;properties&quot;: {</text><text x="20" y="495">        &quot;minimumPassRatePercent&quot;: {</text><text x="20" y="515">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="535">          &quot;minimum&quot;: 0,</text><text x="20" y="555">          &quot;maximum&quot;: 100,</text><text x="20" y="575">          &quot;description&quot;: &quot;A percent in [0, 100]. The whole range is usable, sub-1 values included \u2014 the unit is in the field </text><text x="20" y="595">name, so nothing is ambiguous. Note that the GitHub Checks gate rounds the measured rate to an integer before comparing (to stay i</text><text x="20" y="615">n step with the eval UI), so a floor below 0.5 behaves there as if it were 0.5; the platform&#x27;s own verdict compares unrounded.&quot;</text><text x="20" y="635">        },</text><text x="20" y="655">        &quot;minimumPassRate&quot;: {</text><text x="20" y="675">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="695">          &quot;minimum&quot;: 0,</text><text x="20" y="715">          &quot;maximum&quot;: 100,</text><text x="20" y="735">          &quot;deprecated&quot;: true,</text><text x="20" y="755">          &quot;description&quot;: &quot;Deprecated alias for `minimumPassRatePercent`, same unit. A value in (0, 1) is REJECTED here \u2014 it r</text><text x="20" y="775">eads as a fraction sent by mistake \u2014 which is what the `not` below expresses. Use `minimumPassRatePercent` for a genuine sub-</text><text x="20" y="795">1% floor.&quot;,</text><text x="20" y="815">          &quot;not&quot;: {</text><text x="20" y="835">            &quot;exclusiveMinimum&quot;: 0,</text><text x="20" y="855">            &quot;exclusiveMaximum&quot;: 1</text><text x="20" y="875">          }</text><text x="20" y="895">        }</text><text x="20" y="915">      },</text><text x="20" y="935">      &quot;oneOf&quot;: [</text><text x="20" y="955">        {</text><text x="20" y="975">          &quot;required&quot;: [</text><text x="20" y="995">            &quot;minimumPassRatePercent&quot;</text><text x="20" y="1015">          ]</text><text x="20" y="1035">        },</text><text x="20" y="1055">        {</text><text x="20" y="1075">          &quot;required&quot;: [</text><text x="20" y="1095">            &quot;minimumPassRate&quot;</text><text x="20" y="1115">          ]</text><text x="20" y="1135">        }</text><text x="20" y="1155">      ],</text><text x="20" y="1175">      &quot;additionalProperties&quot;: false</text><text x="20" y="1195">    },</text><text x="20" y="1215">    &quot;iterationOverride&quot;: {</text><text x="20" y="1235">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1255">      &quot;minimum&quot;: 1,</text><text x="20" y="1275">      &quot;maximum&quot;: 10,</text><text x="20" y="1295">      &quot;description&quot;: &quot;Override the per-case `runs` count for this run only.&quot;</text><text x="20" y="1315">    },</text><text x="20" y="1335">    &quot;environmentId&quot;: {</text><text x="20" y="1355">      &quot;type&quot;: &quot;string&quot;,</text></g></svg>
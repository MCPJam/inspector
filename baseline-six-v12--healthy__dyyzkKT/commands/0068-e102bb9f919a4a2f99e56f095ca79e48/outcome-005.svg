<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">e102bb9f919a4a2f99e56f095ca79e48 — page 5</text><text x="20" y="75">            &quot;description&quot;: &quot;Per-case CHECK gate \u2014 the grading rules this case is scored against. `mode` says how they combine</text><text x="20" y="95"> with the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field,</text><text x="20" y="115"> same shape and same name as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word </text><text x="20" y="135">for one concept. Send this or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="155">            &quot;properties&quot;: {</text><text x="20" y="175">              &quot;mode&quot;: {</text><text x="20" y="195">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="215">                &quot;enum&quot;: [</text><text x="20" y="235">                  &quot;inherit&quot;,</text><text x="20" y="255">                  &quot;replace&quot;,</text><text x="20" y="275">                  &quot;extend&quot;</text><text x="20" y="295">                ]</text><text x="20" y="315">              },</text><text x="20" y="335">              &quot;list&quot;: {</text><text x="20" y="355">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="375">                &quot;items&quot;: {</text><text x="20" y="395">                  &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="415">                }</text><text x="20" y="435">              }</text><text x="20" y="455">            }</text><text x="20" y="475">          },</text><text x="20" y="495">          &quot;suppressedSuiteStandardCheckIds&quot;: {</text><text x="20" y="515">            &quot;$ref&quot;: &quot;#/components/schemas/SuppressedSuiteStandardCheckIds&quot;,</text><text x="20" y="535">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="555">            &quot;items&quot;: {</text><text x="20" y="575">              &quot;type&quot;: &quot;string&quot;</text><text x="20" y="595">            }</text><text x="20" y="615">          }</text><text x="20" y="635">        },</text><text x="20" y="655">        &quot;additionalProperties&quot;: false</text><text x="20" y="675">      }</text><text x="20" y="695">    }</text><text x="20" y="715">  },</text><text x="20" y="735">  &quot;additionalProperties&quot;: false</text><text x="20" y="755">}</text><text x="20" y="775">EvalCaseCreate null</text><text x="20" y="795">EvalStep null</text><text x="20" y="815">EvalRunCreateRequest {</text><text x="20" y="835">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="855">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="875">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone \u2014 without a `suiteId` or a `suiteName` \u2014</text><text x="20" y="895"> are rejected with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite th</text><text x="20" y="915">at has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite co</text><text x="20" y="935">uld never be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="955">  &quot;anyOf&quot;: [</text><text x="20" y="975">    {</text><text x="20" y="995">      &quot;required&quot;: [</text><text x="20" y="1015">        &quot;suiteId&quot;</text><text x="20" y="1035">      ]</text><text x="20" y="1055">    },</text><text x="20" y="1075">    {</text><text x="20" y="1095">      &quot;required&quot;: [</text><text x="20" y="1115">        &quot;suiteName&quot;,</text><text x="20" y="1135">        &quot;tests&quot;,</text><text x="20" y="1155">        &quot;serverIds&quot;</text><text x="20" y="1175">      ],</text><text x="20" y="1195">      &quot;properties&quot;: {</text><text x="20" y="1215">        &quot;tests&quot;: {</text><text x="20" y="1235">          &quot;minItems&quot;: 1</text><text x="20" y="1255">        }</text><text x="20" y="1275">      }</text><text x="20" y="1295">    }</text><text x="20" y="1315">  ],</text><text x="20" y="1335">  &quot;properties&quot;: {</text><text x="20" y="1355">    &quot;suiteId&quot;: {</text></g></svg>
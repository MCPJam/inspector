<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.045206546783447266s — page 4</text><text x="20" y="75">          &quot;scenario&quot;: {</text><text x="20" y="95">            &quot;type&quot;: &quot;string&quot;</text><text x="20" y="115">          },</text><text x="20" y="135">          &quot;advancedConfig&quot;: {</text><text x="20" y="155">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="175">            &quot;description&quot;: &quot;Optional `system`, `temperature`, `toolChoice` overrides. `reasoningEffort` is NOT accepted (`400`): n</text><text x="20" y="195">othing ever applied it. Save an effort as `models[].selection.settings.reasoningEffort` instead.&quot;,</text><text x="20" y="215">            &quot;additionalProperties&quot;: true</text><text x="20" y="235">          },</text><text x="20" y="255">          &quot;intent&quot;: {</text><text x="20" y="275">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="295">            &quot;minLength&quot;: 1,</text><text x="20" y="315">            &quot;maxLength&quot;: 64,</text><text x="20" y="335">            &quot;description&quot;: &quot;Optional authored analytics grouping label.&quot;</text><text x="20" y="355">          },</text><text x="20" y="375">          &quot;matchOptions&quot;: {</text><text x="20" y="395">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="415">            &quot;description&quot;: &quot;Per-case tool-call matching override, in either vocabulary: public (`toolCallOrder: any|in-order|exact</text><text x="20" y="435">`, `extraToolCalls`, `arguments`) or internal (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), </text><text x="20" y="455">never both in one object.&quot;,</text><text x="20" y="475">            &quot;additionalProperties&quot;: true</text><text x="20" y="495">          },</text><text x="20" y="515">          &quot;predicates&quot;: {</text><text x="20" y="535">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="555">            &quot;deprecated&quot;: true,</text><text x="20" y="575">            &quot;description&quot;: &quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here all along and never wr</text><text x="20" y="595">itten down, passing only because this schema allowed unknown properties; documented rather than removed so no caller already sendi</text><text x="20" y="615">ng it breaks. Send one or the other, never both.&quot;,</text><text x="20" y="635">            &quot;properties&quot;: {</text><text x="20" y="655">              &quot;mode&quot;: {</text><text x="20" y="675">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="695">                &quot;enum&quot;: [</text><text x="20" y="715">                  &quot;inherit&quot;,</text><text x="20" y="735">                  &quot;replace&quot;,</text><text x="20" y="755">                  &quot;extend&quot;</text><text x="20" y="775">                ]</text><text x="20" y="795">              },</text><text x="20" y="815">              &quot;list&quot;: {</text><text x="20" y="835">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="855">                &quot;items&quot;: {</text><text x="20" y="875">                  &quot;type&quot;: &quot;object&quot;</text><text x="20" y="895">                }</text><text x="20" y="915">              }</text><text x="20" y="935">            }</text><text x="20" y="955">          },</text><text x="20" y="975">          &quot;isNegative&quot;: {</text><text x="20" y="995">            &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="1015">            &quot;description&quot;: &quot;Alias for `isNegativeTest` \u2014 the public case-authoring spelling this API returns on a read. Send </text><text x="20" y="1035">one or the other, never both.&quot;</text><text x="20" y="1055">          },</text><text x="20" y="1075">          &quot;iterations&quot;: {</text><text x="20" y="1095">            &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1115">            &quot;minimum&quot;: 1,</text><text x="20" y="1135">            &quot;maximum&quot;: 10,</text><text x="20" y="1155">            &quot;description&quot;: &quot;Alias for `runs`. Send one or the other, never both.&quot;</text><text x="20" y="1175">          },</text><text x="20" y="1195">          &quot;checks&quot;: {</text><text x="20" y="1215">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1235">            &quot;description&quot;: &quot;Per-case CHECK gate \u2014 the grading rules this case is scored against. `mode` says how they combine</text><text x="20" y="1255"> with the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field,</text><text x="20" y="1275"> same shape and same name as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word </text><text x="20" y="1295">for one concept. Send this or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="1315">            &quot;properties&quot;: {</text><text x="20" y="1335">              &quot;mode&quot;: {</text><text x="20" y="1355">                &quot;type&quot;: &quot;string&quot;,</text></g></svg>
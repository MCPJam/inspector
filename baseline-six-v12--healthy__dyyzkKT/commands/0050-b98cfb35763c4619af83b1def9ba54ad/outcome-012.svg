<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b98cfb35763c4619af83b1def9ba54ad — page 12</text><text x="20" y="75">            &quot;description&quot;: &quot;Alias for `runs`. Send one or the other, never both.&quot;</text><text x="20" y="95">          },</text><text x="20" y="115">          &quot;checks&quot;: {</text><text x="20" y="135">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="155">            &quot;description&quot;: &quot;Per-case CHECK gate \u2014 the grading rules this case is scored against. `mode` says how they combine</text><text x="20" y="175"> with the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field,</text><text x="20" y="195"> same shape and same name as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word </text><text x="20" y="215">for one concept. Send this or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="235">            &quot;properties&quot;: {</text><text x="20" y="255">              &quot;mode&quot;: {</text><text x="20" y="275">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="295">                &quot;enum&quot;: [</text><text x="20" y="315">                  &quot;inherit&quot;,</text><text x="20" y="335">                  &quot;replace&quot;,</text><text x="20" y="355">                  &quot;extend&quot;</text><text x="20" y="375">                ]</text><text x="20" y="395">              },</text><text x="20" y="415">              &quot;list&quot;: {</text><text x="20" y="435">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="455">                &quot;items&quot;: {</text><text x="20" y="475">                  &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="495">                }</text><text x="20" y="515">              }</text><text x="20" y="535">            }</text><text x="20" y="555">          },</text><text x="20" y="575">          &quot;suppressedSuiteStandardCheckIds&quot;: {</text><text x="20" y="595">            &quot;$ref&quot;: &quot;#/components/schemas/SuppressedSuiteStandardCheckIds&quot;,</text><text x="20" y="615">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="635">            &quot;items&quot;: {</text><text x="20" y="655">              &quot;type&quot;: &quot;string&quot;</text><text x="20" y="675">            }</text><text x="20" y="695">          }</text><text x="20" y="715">        },</text><text x="20" y="735">        &quot;additionalProperties&quot;: false</text><text x="20" y="755">      }</text><text x="20" y="775">    }</text><text x="20" y="795">  },</text><text x="20" y="815">  &quot;additionalProperties&quot;: false</text><text x="20" y="835">}</text><text x="20" y="855">EvalCaseCreate null</text><text x="20" y="875">EvalStep null</text><text x="20" y="895">EvalRunCreateRequest {</text><text x="20" y="915">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="935">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="955">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone \u2014 without a `suiteId` or a `suiteName` \u2014</text><text x="20" y="975"> are rejected with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite th</text><text x="20" y="995">at has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite co</text><text x="20" y="1015">uld never be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="1035">  &quot;anyOf&quot;: [</text><text x="20" y="1055">    {</text><text x="20" y="1075">      &quot;required&quot;: [</text><text x="20" y="1095">        &quot;suiteId&quot;</text><text x="20" y="1115">      ]</text><text x="20" y="1135">    },</text><text x="20" y="1155">    {</text><text x="20" y="1175">      &quot;required&quot;: [</text><text x="20" y="1195">        &quot;suiteName&quot;,</text><text x="20" y="1215">        &quot;tests&quot;,</text><text x="20" y="1235">        &quot;serverIds&quot;</text><text x="20" y="1255">      ],</text><text x="20" y="1275">      &quot;properties&quot;: {</text><text x="20" y="1295">        &quot;tests&quot;: {</text><text x="20" y="1315">          &quot;minItems&quot;: 1</text><text x="20" y="1335">        }</text><text x="20" y="1355">      }</text></g></svg>
 null</text><text x="20" y="655">EvalStep null</text><text x="20" y="675">EvalRunCreateRequest {</text><text x="20" y="695">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="715">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="735">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone \u2014 without a `suiteId` or a `suiteName` \u2014</text><text x="20" y="755"> are rejected with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite th</text><text x="20" y="775">at has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite co</text><text x="20" y="795">uld never be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="815">  &quot;anyOf&quot;: [</text><text x="20" y="835">    {</text><text x="20" y="855">      &quot;required&quot;: [</text><text x="20" y="875">        &quot;suiteId&quot;</text><text x="20" y="895">      ]</text><text x="20" y="915">    },</text><text x="20" y="935">    {</text><text x="20" y="955">      &quot;required&quot;: [</text><text x="20" y="975">        &quot;suiteName&quot;,</text><text x="20" y="995">        &quot;tests&quot;,</text><text x="20" y="1015">        &quot;serverIds&quot;</text><text x="20" y="1035">      ],</text><text x="20" y="1055">      &quot;properties&quot;: {</text><text x="20" y="1075">        &quot;tests&quot;: {</text><text x="20" y="1095">          &quot;minItems&quot;: 1</text><text x="20" y="1115">        }</text><text x="20" y="1135">      }</text><text x="20" y="1155">    }</text><text x="20" y="1175">  ],</text><text x="20" y="1195">  &quot;properties&quot;: {</text><text x="20" y="1215">    &quot;suiteId&quot;: {</text><text x="20" y="1235">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1255">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="1275">    },</text><text x="20" y="1295">    &quot;hosts&quot;: {</text><text x="20" y="1315">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1335">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="1355">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text></g></svg>
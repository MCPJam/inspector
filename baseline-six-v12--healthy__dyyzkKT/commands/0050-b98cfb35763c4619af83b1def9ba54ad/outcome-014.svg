<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b98cfb35763c4619af83b1def9ba54ad — page 14</text><text x="20" y="75">    &quot;suiteRerun&quot;: {</text><text x="20" y="95">      &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="115">      &quot;description&quot;: &quot;When true, skip per-case upsert and rerun the persisted suite. A bare `suiteId` with no `tests` is always tr</text><text x="20" y="135">eated as a rerun.&quot;</text><text x="20" y="155">    },</text><text x="20" y="175">    &quot;modelApiKeys&quot;: {</text><text x="20" y="195">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="215">      &quot;description&quot;: &quot;Optional per-provider model API keys (e.g. `{ \&quot;anthropic\&quot;: \&quot;sk-ant-\u2026\&quot; }`). Falls back to your organ</text><text x="20" y="235">ization&#x27;s configured providers when omitted.&quot;,</text><text x="20" y="255">      &quot;additionalProperties&quot;: {</text><text x="20" y="275">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="295">      }</text><text x="20" y="315">    },</text><text x="20" y="335">    &quot;notes&quot;: {</text><text x="20" y="355">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="375">    },</text><text x="20" y="395">    &quot;passCriteria&quot;: {</text><text x="20" y="415">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="435">      &quot;description&quot;: &quot;The floor a run must clear, as a PERCENT in [0, 100] \u2014 80 means 80%. `minimumPassRatePercent` is the ca</text><text x="20" y="455">nonical spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGU</text><text x="20" y="475">ATES THE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluato</text><text x="20" y="495">r can act on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and wou</text><text x="20" y="515">ld silently make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suit</text><text x="20" y="535">e/run floor is not.&quot;,</text><text x="20" y="555">      &quot;properties&quot;: {</text><text x="20" y="575">        &quot;minimumPassRatePercent&quot;: {</text><text x="20" y="595">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="615">          &quot;minimum&quot;: 0,</text><text x="20" y="635">          &quot;maximum&quot;: 100,</text><text x="20" y="655">          &quot;description&quot;: &quot;A percent in [0, 100]. The whole range is usable, sub-1 values included \u2014 the unit is in the field </text><text x="20" y="675">name, so nothing is ambiguous. Note that the GitHub Checks gate rounds the measured rate to an integer before comparing (to stay i</text><text x="20" y="695">n step with the eval UI), so a floor below 0.5 behaves there as if it were 0.5; the platform&#x27;s own verdict compares unrounded.&quot;</text><text x="20" y="715">        },</text><text x="20" y="735">        &quot;minimumPassRate&quot;: {</text><text x="20" y="755">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="775">          &quot;minimum&quot;: 0,</text><text x="20" y="795">          &quot;maximum&quot;: 100,</text><text x="20" y="815">          &quot;deprecated&quot;: true,</text><text x="20" y="835">          &quot;description&quot;: &quot;Deprecated alias for `minimumPassRatePercent`, same unit. A value in (0, 1) is REJECTED here \u2014 it r</text><text x="20" y="855">eads as a fraction sent by mistake \u2014 which is what the `not` below expresses. Use `minimumPassRatePercent` for a genuine sub-</text><text x="20" y="875">1% floor.&quot;,</text><text x="20" y="895">          &quot;not&quot;: {</text><text x="20" y="915">            &quot;exclusiveMinimum&quot;: 0,</text><text x="20" y="935">            &quot;exclusiveMaximum&quot;: 1</text><text x="20" y="955">          }</text><text x="20" y="975">        }</text><text x="20" y="995">      },</text><text x="20" y="1015">      &quot;oneOf&quot;: [</text><text x="20" y="1035">        {</text><text x="20" y="1055">          &quot;required&quot;: [</text><text x="20" y="1075">            &quot;minimumPassRatePercent&quot;</text><text x="20" y="1095">          ]</text><text x="20" y="1115">        },</text><text x="20" y="1135">        {</text><text x="20" y="1155">          &quot;required&quot;: [</text><text x="20" y="1175">            &quot;minimumPassRate&quot;</text><text x="20" y="1195">          ]</text><text x="20" y="1215">        }</text><text x="20" y="1235">      ],</text><text x="20" y="1255">      &quot;additionalProperties&quot;: false</text><text x="20" y="1275">    },</text><text x="20" y="1295">    &quot;iterationOverride&quot;: {</text><text x="20" y="1315">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1335">      &quot;minimum&quot;: 1,</text><text x="20" y="1355">      &quot;maximum&quot;: 10,</text></g></svg>
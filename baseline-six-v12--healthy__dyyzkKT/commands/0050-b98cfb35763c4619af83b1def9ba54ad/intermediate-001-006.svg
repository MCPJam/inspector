ay&quot;,</text><text x="20" y="655">      &quot;maxItems&quot;: 100,</text><text x="20" y="675">      &quot;description&quot;: &quot;Inline test cases to upsert into the suite before running.&quot;,</text><text x="20" y="695">      &quot;items&quot;: {</text><text x="20" y="715">        &quot;$ref&quot;: &quot;#/components/schemas/EvalTestCase&quot;</text><text x="20" y="735">      }</text><text x="20" y="755">    },</text><text x="20" y="775">    &quot;serverIds&quot;: {</text><text x="20" y="795">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="815">      &quot;minItems&quot;: 1,</text><text x="20" y="835">      &quot;description&quot;: &quot;Servers (by ID) the run connects to. Required when creating a new suite; optional on reruns \u2014 when omit</text><text x="20" y="855">ted, the run connects the suite&#x27;s saved server selection (the set its snapshot references). A rerun of a suite with no saved selec</text><text x="20" y="875">tion is rejected with `VALIDATION_ERROR` (`details.reason: \&quot;NO_SAVED_SERVER_SELECTION\&quot;`). Rejected outright for a suite with att</text><text x="20" y="895">ached environments (`details.reason: \&quot;ENVIRONMENT_SERVERS_NOT_OVERRIDABLE\&quot;`): the environment supplies a closed set that a serve</text><text x="20" y="915">r override cannot change, so accepting one would connect a different set than the run is stamped with.&quot;,</text><text x="20" y="935">      &quot;items&quot;: {</text><text x="20" y="955">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="975">      }</text><text x="20" y="995">    },</text><text x="20" y="1015">    &quot;serverNames&quot;: {</text><text x="20" y="1035">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1055">      &quot;description&quot;: &quot;Optional display names, parallel to `serverIds`.&quot;,</text><text x="20" y="1075">      &quot;items&quot;: {</text><text x="20" y="1095">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1115">      }</text><text x="20" y="1135">    },</text><text x="20" y="1155">    &quot;suiteRerun&quot;: {</text><text x="20" y="1175">      &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="1195">      &quot;description&quot;: &quot;When true, skip per-case upsert and rerun the persisted suite. A bare `suiteId` with no `tests` is always tr</text><text x="20" y="1215">eated as a rerun.&quot;</text><text x="20" y="1235">    },</text><text x="20" y="1255">    &quot;modelApiKeys&quot;: {</text><text x="20" y="1275">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1295">      &quot;description&quot;: &quot;Optional per-provider model API keys (e.g. `{ \&quot;anthropic\&quot;: \&quot;sk-ant-\u2026\&quot; }`). Falls back to your organ</text><text x="20" y="1315">ization&#x27;s configured providers when omitted.&quot;,</text><text x="20" y="1335">      &quot;additionalProperties&quot;: {</text><text x="20" y="1355">        &quot;type&quot;: &quot;string&quot;</text></g></svg>
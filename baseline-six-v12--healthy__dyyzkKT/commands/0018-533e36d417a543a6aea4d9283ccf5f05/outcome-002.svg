<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">533e36d417a543a6aea4d9283ccf5f05 — page 2</text><text x="20" y="75">  iterations: 1</text><text x="20" y="95">  passThreshold: 1</text><text x="20" y="115">  validity: {}</text><text x="20" y="135">cases:</text><text x="20" y="155">  - id: c_reads_a_note</text><text x="20" y="175">    title: reads the note it was asked about</text><text x="20" y="195">    steps:</text><text x="20" y="215">      - id: s1</text><text x="20" y="235">        kind: prompt</text><text x="20" y="255">        prompt: What does note 7 say?</text><text x="20" y="275">      - id: a1</text><text x="20" y="295">        kind: assert</text><text x="20" y="315">        assertion:</text><text x="20" y="335">          type: toolCalledAtLeastOnce</text><text x="20" y="355">          toolName: read_note</text><text x="20" y="375">  - id: c_never_deletes</text><text x="20" y="395">    title: never deletes when only asked to read</text><text x="20" y="415">    steps:</text><text x="20" y="435">      - id: s1</text><text x="20" y="455">        kind: prompt</text><text x="20" y="475">        prompt: Summarize note 7.</text><text x="20" y="495">      - id: a1</text><text x="20" y="515">        kind: assert</text><text x="20" y="535">        assertion:</text><text x="20" y="555">          type: toolNeverCalled</text><text x="20" y="575">          toolName: delete_note</text><text x="20" y="595">```</text><text x="20" y="615"></text><text x="20" y="635">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="655"></text><text x="20" y="675">### 2. Configure the server</text><text x="20" y="695"></text><text x="20" y="715">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="735">mmand:</text><text x="20" y="755"></text><text x="20" y="775">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="795">{</text><text x="20" y="815">  &quot;mcpServers&quot;: {</text><text x="20" y="835">    &quot;notes&quot;: {</text><text x="20" y="855">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="875">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="895">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="915">    }</text><text x="20" y="935">  }</text><text x="20" y="955">}</text><text x="20" y="975">```</text><text x="20" y="995"></text><text x="20" y="1015">### 3. Supply a key and run</text><text x="20" y="1035"></text><text x="20" y="1055">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1075">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="1095">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="1115">```</text><text x="20" y="1135"></text><text x="20" y="1155">### 4. Fail one on purpose, then rerun it</text><text x="20" y="1175"></text><text x="20" y="1195">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="1215">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="1235"></text><text x="20" y="1255">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1275">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text><text x="20" y="1295">```</text><text x="20" y="1315"></text><text x="20" y="1335">`--case` takes the exact authored id and is repeatable.</text><text x="20" y="1355"></text></g></svg>
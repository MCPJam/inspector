<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1105"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">c522c7262d0e402587945af4f1673160 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; reproduce.py &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">#!/usr/bin/env python3</text><text x="20" y="195">&quot;&quot;&quot;Create and run the documented MCPJam deterministic evaluation.&quot;&quot;&quot;</text><text x="20" y="215">import json, os, pathlib, time, urllib.request</text><text x="20" y="235">ROOT = pathlib.Path(__file__).resolve().parent</text><text x="20" y="255">BASE = os.environ[&#x27;&quot;&#x27;&quot;&#x27;MCPJAM_API_URL&#x27;&quot;&#x27;&quot;&#x27;].rstrip(&#x27;&quot;&#x27;&quot;&#x27;/&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="275">KEY = os.environ[&#x27;&quot;&#x27;&quot;&#x27;MCPJAM_API_KEY&#x27;&quot;&#x27;&quot;&#x27;]</text><text x="20" y="295">PROJECT = &#x27;&quot;&#x27;&quot;&#x27;project_fixture&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="315">def request(method, path, body=None):</text><text x="20" y="335">    req = urllib.request.Request(BASE + path, method=method,</text><text x="20" y="355">        data=None if body is None else json.dumps(body).encode(),</text><text x="20" y="375">        headers={&#x27;&quot;&#x27;&quot;&#x27;Authorization&#x27;&quot;&#x27;&quot;&#x27;: &#x27;&quot;&#x27;&quot;&#x27;Bearer &#x27;&quot;&#x27;&quot;&#x27; + KEY, &#x27;&quot;&#x27;&quot;&#x27;Content-Type&#x27;&quot;&#x27;&quot;&#x27;: &#x27;&quot;&#x27;&quot;&#x27;application/json&#x27;&quot;&#x27;&quot;&#x27;})</text><text x="20" y="395">    with urllib.request.urlopen(req, timeout=20) as response:</text><text x="20" y="415">        return json.load(response)</text><text x="20" y="435">def save(name, value):</text><text x="20" y="455">    (ROOT / name).write_text(json.dumps(value, indent=2) + &#x27;&quot;&#x27;&quot;&#x27;\n&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="475"># Reuse the saved suite on subsequent invocations; create it on a fresh checkout.</text><text x="20" y="495">receipt_path = ROOT / &#x27;&quot;&#x27;&quot;&#x27;suite-created.json&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="515">if receipt_path.exists():</text><text x="20" y="535">    suite = json.loads(receipt_path.read_text())</text><text x="20" y="555">else:</text><text x="20" y="575">    suite = request(&#x27;&quot;&#x27;&quot;&#x27;POST&#x27;&quot;&#x27;&quot;&#x27;, f&#x27;&quot;&#x27;&quot;&#x27;/projects/{PROJECT}/eval-suites&#x27;&quot;&#x27;&quot;&#x27;,</text><text x="20" y="595">                    json.loads((ROOT / &#x27;&quot;&#x27;&quot;&#x27;suite-create.json&#x27;&quot;&#x27;&quot;&#x27;).read_text()))</text><text x="20" y="615">    save(&#x27;&quot;&#x27;&quot;&#x27;suite-created.json&#x27;&quot;&#x27;&quot;&#x27;, suite)</text><text x="20" y="635">launch = request(&#x27;&quot;&#x27;&quot;&#x27;POST&#x27;&quot;&#x27;&quot;&#x27;, f&#x27;&quot;&#x27;&quot;&#x27;/projects/{PROJECT}/eval-runs&#x27;&quot;&#x27;&quot;&#x27;,</text><text x="20" y="655">                 {&#x27;&quot;&#x27;&quot;&#x27;suiteId&#x27;&quot;&#x27;&quot;&#x27;: suite[&#x27;&quot;&#x27;&quot;&#x27;suiteId&#x27;&quot;&#x27;&quot;&#x27;], &#x27;&quot;&#x27;&quot;&#x27;serverIds&#x27;&quot;&#x27;&quot;&#x27;: [&#x27;&quot;&#x27;&quot;&#x27;server_fixture&#x27;&quot;&#x27;&quot;&#x27;]})</text><text x="20" y="675">save(&#x27;&quot;&#x27;&quot;&#x27;repeat-receipt.json&#x27;&quot;&#x27;&quot;&#x27;, launch)</text><text x="20" y="695">run_id = launch[&#x27;&quot;&#x27;&quot;&#x27;runId&#x27;&quot;&#x27;&quot;&#x27;]</text><text x="20" y="715">for attempt in range(30):</text><text x="20" y="735">    report = request(&#x27;&quot;&#x27;&quot;&#x27;GET&#x27;&quot;&#x27;&quot;&#x27;, f&#x27;&quot;&#x27;&quot;&#x27;/projects/{PROJECT}/eval-runs/{run_id}&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="755">    save(&#x27;&quot;&#x27;&quot;&#x27;repeat-report.json&#x27;&quot;&#x27;&quot;&#x27;, report)</text><text x="20" y="775">    run = report.get(&#x27;&quot;&#x27;&quot;&#x27;run&#x27;&quot;&#x27;&quot;&#x27;, report)</text><text x="20" y="795">    if run.get(&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;) in (&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27;, &#x27;&quot;&#x27;&quot;&#x27;failed&#x27;&quot;&#x27;&quot;&#x27;, &#x27;&quot;&#x27;&quot;&#x27;cancelled&#x27;&quot;&#x27;&quot;&#x27;, &#x27;&quot;&#x27;&quot;&#x27;timed_out&#x27;&quot;&#x27;&quot;&#x27;):</text><text x="20" y="815">        break</text><text x="20" y="835">    time.sleep(1)</text><text x="20" y="855">else:</text><text x="20" y="875">    raise SystemExit(&#x27;&quot;&#x27;&quot;&#x27;No terminal verdict within 30 polls&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="895">evidence = request(&#x27;&quot;&#x27;&quot;&#x27;GET&#x27;&quot;&#x27;&quot;&#x27;, f&#x27;&quot;&#x27;&quot;&#x27;/projects/{PROJECT}/eval-runs/{run_id}/iterations&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="915">save(&#x27;&quot;&#x27;&quot;&#x27;repeat-iterations.json&#x27;&quot;&#x27;&quot;&#x27;, evidence)</text><text x="20" y="935">verdict = report.get(&#x27;&quot;&#x27;&quot;&#x27;decisionSummary&#x27;&quot;&#x27;&quot;&#x27;, {}).get(&#x27;&quot;&#x27;&quot;&#x27;verdict&#x27;&quot;&#x27;&quot;&#x27;, run.get(&#x27;&quot;&#x27;&quot;&#x27;result&#x27;&quot;&#x27;&quot;&#x27;))</text><text x="20" y="955">print(f&#x27;&quot;&#x27;&quot;&#x27;{run_id}: {verdict}&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="975">raise SystemExit(0 if run.get(&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;) == &#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27; and verdict == &#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27; else 1)</text><text x="20" y="995">PY</text><text x="20" y="1015">python3 reproduce.py&#x27;</text><text x="20" y="1035">run_fixture_2: passed</text><text x="20" y="1055"></text><text x="20" y="1075">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
\&quot;sum\&quot;:5}`.\n\n**Repe</text><text x="20" y="1255">atable evaluation:** the docs point to `mcpjam test &lt;suite.yaml&gt;`, described on the Local Evals page.\n- I wrote `/workspace/.mcpj</text><text x="20" y="1275">am/evals/arith.yaml`. It has one case that asks \&quot;17 plus 25\&quot; and asserts that `add` is called at least once.\n- I wrote `/worksp</text><text x="20" y="1295">ace/.mcp.json`, which binds the suite&#x27;s `arith` server to `http://fixture:8765/mcp`.\n- `mcpjam cloud eval validate` reports the s</text><text x="20" y="1315">uite as valid.\n\n**Blocked run, and why:**\n- `mcpjam test ... --inference mcpjam` failed with `OPTIONS_INVALID`: \&quot;baseUrl must </text><text x="20" y="1335">be https:// (a loopback http:// origin is allowed)\&quot;. `MCPJAM_API_URL` is `http://fixture:8765/api/v1`, which is plain http on a n</text><text x="20" y="1355">on-loopback host.\n- `--inference byok` failed with `CREDENTIALS_MISSING`, because there is no `ANTHROPIC_API_KEY`. The environmen</text></g></svg>
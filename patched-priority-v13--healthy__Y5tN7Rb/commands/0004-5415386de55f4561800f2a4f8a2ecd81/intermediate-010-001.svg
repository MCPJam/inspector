rote `/wor</text><text x="20" y="435">kspace/.mcp.json`, which binds the suite&#x27;s `arith` server to `http://fixture:8765/mcp`.\n- `mcpjam cloud eval validate` reports th</text><text x="20" y="455">e suite as valid.\n\n**Blocked run, and why:**\n- `mcpjam test ... --inference mcpjam` failed with `OPTIONS_INVALID`: \&quot;baseUrl mu</text><text x="20" y="475">st be https:// (a loopback http:// origin is allowed)\&quot;. `MCPJAM_API_URL` is `http://fixture:8765/api/v1`, which is plain http on </text><text x="20" y="495">a non-loopback host.\n- `--inference byok` failed with `CREDENTIALS_MISSING`, because there is no `ANTHROPIC_API_KEY`. The environ</text><text x="20" y="515">ment only has `ANTHROPIC_AUTH_TOKEN`, which I didn&#x27;t repurpose as a provider key.\n\n**Concern note:**\n- **Expected:** the eval w</text><text x="20" y="535">ould run through MCPJam-hosted inference using the provided account API.\n- **Observed:** the CLI&#x27;s https check rejects the provid</text><text x="20" y="555">ed API URL, and no BYOK key exists.\n- **Missing:** either an https (or loopback) MCPJam API URL, or a provider API key.\n- **Next</text><text x="20" y="575">:** with either one, I&#x27;d run `npx -y @mcpjam/cli@latest test .mcpjam/evals/arith.yaml --reporter junit-xml --out reports/local.xml</text><text x="20" y="595">`. I didn&#x27;t forward the API to a loopback port to get around the check. That would send the credential in cleartext, and you didn&#x27;</text><text x="20" y="615">t ask for it.&quot;, &quot;ttft_ms&quot;: 2051, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 39088, &quot;uuid&quot;: &quot;6ebe4afb-310c-43e6-8bcc-b3d224bcb411&quot;, &quot;ttft_str</text><text x="20" y="635">eam_ms&quot;: 1373, &quot;time_to_request_ms&quot;: 35, &quot;first_content_frame_ms&quot;: 1373, &quot;queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_s</text><text x="20" y="655">ince_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;i
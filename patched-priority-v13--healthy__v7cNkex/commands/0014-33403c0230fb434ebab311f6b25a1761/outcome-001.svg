<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">33403c0230fb434ebab311f6b25a1761 — page 1</text><text x="20" y="75">$ /bin/bash -c node - &lt;&lt;&#x27;JS&#x27;</text><text x="20" y="95">const s=require(&#x27;./openapi.json&#x27;);for(const [p,v] of Object.entries(s.paths))if(p.includes(&#x27;/servers/{serverId}/&#x27;)&amp;&amp;(p.includes(&#x27;t</text><text x="20" y="115">ools&#x27;)||p.includes(&#x27;diagnos&#x27;)))console.log(p,JSON.stringify(v));</text><text x="20" y="135">for(const p of [&#x27;/projects/{projectId}/eval-suites&#x27;,&#x27;/projects/{projectId}/eval-runs&#x27;]) console.log(p,JSON.stringify(s.paths[p]?.p</text><text x="20" y="155">ost));</text><text x="20" y="175">JS</text><text x="20" y="195">/projects/{projectId}/servers/{serverId}/tools {&quot;post&quot;:{&quot;operationId&quot;:&quot;listTools&quot;,&quot;tags&quot;:[&quot;Primitives&quot;],&quot;summary&quot;:&quot;List tools&quot;,&quot;de</text><text x="20" y="215">scription&quot;:&quot;Returns the server&#x27;s tools as a collection page. Each item is the MCP tool definition (`name`, `description`, `inputSc</text><text x="20" y="235">hema`, ...).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/serverId&quot;}],&quot;requestBody</text><text x="20" y="255">&quot;:{&quot;$ref&quot;:&quot;#/components/requestBodies/cursorBody&quot;},&quot;responses&quot;:{&quot;200&quot;:{&quot;description&quot;:&quot;One page of tools.&quot;,&quot;content&quot;:{&quot;application/</text><text x="20" y="275">json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/ToolPage&quot;},&quot;example&quot;:{&quot;items&quot;:[{&quot;name&quot;:&quot;create_issue&quot;,&quot;description&quot;:&quot;Create a new is</text><text x="20" y="295">sue in the tracker&quot;,&quot;inputSchema&quot;:{&quot;type&quot;:&quot;object&quot;,&quot;properties&quot;:{&quot;title&quot;:{&quot;type&quot;:&quot;string&quot;}}}}]}}}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/res</text><text x="20" y="315">ponses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Forbidden&quot;},&quot;4</text><text x="20" y="335">04&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;422&quot;:{&quot;$ref&quot;:&quot;#/components/responses/FeatureNotSupported&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/compon</text><text x="20" y="355">ents/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnr</text><text x="20" y="375">eachable&quot;},&quot;504&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="395">/projects/{projectId}/servers/{serverId}/tools/call {&quot;post&quot;:{&quot;operationId&quot;:&quot;callTool&quot;,&quot;tags&quot;:[&quot;Execution&quot;],&quot;summary&quot;:&quot;Call a tool&quot;</text><text x="20" y="415">,&quot;description&quot;:&quot;Executes a tool on the server and returns the MCP `CallToolResult` plus an additive `durationMs` (wall-clock time </text><text x="20" y="435">of `executeTool`). Tool-level failures (`isError: true` in the result) are **successful calls** — the server answered; only transp</text><text x="20" y="455">ort/auth errors use the error envelope.&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/paramete</text><text x="20" y="475">rs/serverId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;type&quot;:&quot;object&quot;,&quot;required&quot;:[&quot;toolName&quot;],&quot;pr</text><text x="20" y="495">operties&quot;:{&quot;toolName&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;description&quot;:&quot;Tool name, exactly as returned by the tools list.&quot;},&quot;parameters&quot;:{&quot;type&quot;:&quot;ob</text><text x="20" y="515">ject&quot;,&quot;description&quot;:&quot;Tool arguments matching the tool&#x27;s `inputSchema`. Defaults to `{}`.&quot;,&quot;additionalProperties&quot;:true}}},&quot;example&quot;</text><text x="20" y="535">:{&quot;toolName&quot;:&quot;create_issue&quot;,&quot;parameters&quot;:{&quot;title&quot;:&quot;Bug: login fails&quot;}}}}},&quot;responses&quot;:{&quot;200&quot;:{&quot;description&quot;:&quot;The MCP `CallToolResu</text><text x="20" y="555">lt` plus additive `durationMs`. Check `isError` for tool-level failures. When the result is an `isError` sign-in challenge carryin</text><text x="20" y="575">g `_meta[\&quot;mcp/www_authenticate\&quot;]`, an additive `authChallenge` holds the parsed challenge. An HTTP 401 from the MCP server is an</text><text x="20" y="595">swered with `403 AUTH_REQUIRED` instead, with the challenge in `details.authChallenge`.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{</text><text x="20" y="615">&quot;$ref&quot;:&quot;#/components/schemas/CallToolResult&quot;},&quot;example&quot;:{&quot;content&quot;:[{&quot;type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Issue created: #42&quot;}],&quot;durationMs&quot;:42}}</text><text x="20" y="635">}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/c</text><text x="20" y="655">omponents/responses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;422&quot;:{&quot;$ref&quot;:&quot;#/components/responses/FeatureNotS</text><text x="20" y="675">upported&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;</text><text x="20" y="695">:&quot;#/components/responses/ServerUnreachable&quot;},&quot;504&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="715">/projects/{projectId}/eval-suites {&quot;operationId&quot;:&quot;createEvalSuite&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval suite (author-on</text><text x="20" y="735">ly, does not run)&quot;,&quot;description&quot;:&quot;Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **sync</text><text x="20" y="755">hronously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returne</text><text x="20" y="775">d `suiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a </text><text x="20" y="795">`runId`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level defaul</text><text x="20" y="815">t `model` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/mod</text><text x="20" y="835">el` id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGue</text><text x="20" y="855">st callers are denied (suite creation is a write).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalVocabularyHeader&quot;},{&quot;$ref&quot;:</text><text x="20" y="875">&quot;#/components/parameters/projectId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components</text><text x="20" y="895">/schemas/EvalSuiteCreateRequest&quot;},&quot;example&quot;:{&quot;name&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;tests</text><text x="20" y="915">&quot;:[{&quot;title&quot;:&quot;lists files&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;List the files in the project root.&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;a</text><text x="20" y="935">ssert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;list_files&quot;,&quot;args&quot;:{&quot;args&quot;:{}}}}]}]}}}},&quot;responses&quot;:{&quot;201&quot;:{&quot;description&quot;:</text><text x="20" y="955">&quot;The suite was created.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalSuiteCreated&quot;}}}},&quot;400&quot;:{&quot;$ref&quot;</text><text x="20" y="975">:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/respon</text><text x="20" y="995">ses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;</text><text x="20" y="1015">:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnreachable&quot;}}}</text><text x="20" y="1035">/projects/{projectId}/eval-runs {&quot;operationId&quot;:&quot;createEvalRun&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval run (async)&quot;,&quot;descri</text><text x="20" y="1055">ption&quot;:&quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202`</text><text x="20" y="1075"> immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. </text><text x="20" y="1095">The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests reruns the suit</text><text x="20" y="1115">e as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reas</text><text x="20" y="1135">on: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which one the run</text><text x="20" y="1155"> uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of th</text><text x="20" y="1175">e run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpja</text><text x="20" y="1195">m-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalV</text><text x="20" y="1215">ocabularyHeader&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/launcherHeader&quot;},{&quot;$ref&quot;:&quot;#/compon</text><text x="20" y="1235">ents/parameters/ciHeader&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/E</text><text x="20" y="1255">valRunCreateRequest&quot;},&quot;example&quot;:{&quot;suiteName&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;tests&quot;:[{&quot;title&quot;:&quot;echo works&quot;,&quot;runs&quot;:1,&quot;model&quot;:&quot;a</text><text x="20" y="1275">nthropic/claude-haiku-4.5&quot;,&quot;provider&quot;:&quot;anthropic&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;Use the echo tool to say hi&quot;},{&quot;id</text><text x="20" y="1295">&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;assert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;echo&quot;,&quot;args&quot;:{&quot;args&quot;:{&quot;text&quot;:&quot;hi&quot;}}}}]}]}}}},&quot;responses&quot;:{</text><text x="20" y="1315">&quot;202&quot;:{&quot;description&quot;:&quot;Run created; execution continues in the background.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/comp</text><text x="20" y="1335">onents/schemas/EvalRunCreated&quot;},&quot;example&quot;:{&quot;runId&quot;:&quot;run_abc123&quot;,&quot;suiteId&quot;:&quot;suite_def456&quot;,&quot;status&quot;:&quot;running&quot;,&quot;caseUpsert&quot;:{&quot;committ</text><text x="20" y="1355">ed&quot;:[{&quot;name&quot;:&quot;echo works&quot;}],&quot;failed&quot;:[]},&quot;environment&quot;:null}}}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$r</text></g></svg>
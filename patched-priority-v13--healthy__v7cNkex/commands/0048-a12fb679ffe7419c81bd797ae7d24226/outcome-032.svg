<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">a12fb679ffe7419c81bd797ae7d24226 — page 32</text><text x="20" y="75"> an arm connects is the one variable a skills A/B has to hold fixed.\&quot;\n    },\n    \&quot;refreshSnapshot\&quot;: {\n      \&quot;type\&quot;: \&quot;bool</text><text x="20" y="95">ean\&quot;,\n      \&quot;description\&quot;: \&quot;**PERSISTS A SUITE MUTATION.** Re-derives and stores the suite&#x27;s host-config snapshot from this r</text><text x="20" y="115">equest&#x27;s server list, so future runs of the suite use it too. Without it a rerun leaves the snapshot frozen, which is what stops n</text><text x="20" y="135">ewly connected servers from silently contaminating an existing suite. Single-target launches only — it is not accepted on `POST /e</text><text x="20" y="155">val-run-groups`, where last-writer-wins on a frozen snapshot is never what a fan-out means.\&quot;\n    },\n    \&quot;runGroupId\&quot;: {\n    </text><text x="20" y="175">  \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;A LABEL that groups sibling run rows for display. It has NO quota or launch sema</text><text x="20" y="195">ntics here: N calls carrying one id are still N independent launches, each metered separately. Grouped-launch behaviour lives on `</text><text x="20" y="215">POST /eval-run-groups`, which mints the id itself. Echoed back on the `202`.\&quot;\n    },\n    \&quot;idempotencyKey\&quot;: {\n      \&quot;type\&quot;:</text><text x="20" y="235"> \&quot;string\&quot;,\n      \&quot;maxLength\&quot;: 256,\n      \&quot;description\&quot;: \&quot;Write-idempotency key. A repeat call with the same key (same act</text><text x="20" y="255">or and suite) returns the EXISTING run instead of creating and billing a second one. The `Idempotency-Key` header carries the same</text><text x="20" y="275"> value and WINS over this field — it is the transport-level channel unattended clients control, whereas a body key could be shaped</text><text x="20" y="295"> by model output.\&quot;\n    },\n    \&quot;sourceHash\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;pattern\&quot;: \&quot;^[a-f0-9]{64}$\&quot;,\n      \&quot;d</text><text x="20" y="315">escription\&quot;: \&quot;SHA-256 hex of the suite-file bytes that launched this run. Lowercase, 64 characters. Set by `eval run --file`; a </text><text x="20" y="335">UI or API launch that did not come from a file omits it.\&quot;\n    },\n    \&quot;importApprovals\&quot;: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      </text><text x="20" y="355">\&quot;minItems\&quot;: 1,\n      \&quot;description\&quot;: \&quot;Approve `approximated` imported cases for THIS RUN ONLY. The caller supplies a hosted t</text><text x="20" y="375">est-case id and a reason and nothing else: the approver&#x27;s identity and the approval time are derived server-side and frozen into t</text><text x="20" y="395">he run&#x27;s snapshot, because a caller-supplied approver would file one person&#x27;s approval under another&#x27;s name and a caller-supplied </text><text x="20" y="415">timestamp could be backdated past the edit that invalidated the claim. Nothing persists on the case — the next run of the same app</text><text x="20" y="435">roximation needs a new approval.\&quot;,\n      \&quot;items\&quot;: {\n        \&quot;type\&quot;: \&quot;object\&quot;,\n        \&quot;required\&quot;: [\n          \&quot;testC</text><text x="20" y="455">aseId\&quot;,\n          \&quot;reason\&quot;\n        ],\n        \&quot;additionalProperties\&quot;: false,\n        \&quot;properties\&quot;: {\n          \&quot;testC</text><text x="20" y="475">aseId\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quo
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="465"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +69.05051159858704s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_18&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;node - &lt;&lt;&#x27;JS&#x27;\nconst</text><text x="20" y="95"> s=require(&#x27;./openapi.json&#x27;);console.log(JSON.stringify(s.components.schemas.EvalTestStep,null,2));\nJS\&quot;&quot;, &quot;aggregated_output&quot;: &quot;</text><text x="20" y="115">{\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;description\&quot;: \&quot;One authored test step (the unified test model). `kind` discriminates: `prompt` i</text><text x="20" y="135">s a user message (model turn); `toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert`</text><text x="20" y="155"> is an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).\&quot;,\n  \&quot;required\&quot;: [\n    </text><text x="20" y="175">\&quot;id\&quot;,\n    \&quot;kind\&quot;\n  ],\n  \&quot;properties\&quot;: {\n    \&quot;id\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1\n    },\n    </text><text x="20" y="195">\&quot;kind\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;: [\n        \&quot;prompt\&quot;,\n        \&quot;toolCall\&quot;,\n        \&quot;interact\&quot;,\n  </text><text x="20" y="215">      \&quot;assert\&quot;\n      ]\n    },\n    \&quot;prompt\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;User message (`kind: p</text><text x="20" y="235">rompt`).\&quot;\n    },\n    \&quot;serverName\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Server that owns the tool (`kind:</text><text x="20" y="255"> toolCall`).\&quot;\n    },\n    \&quot;toolName\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;description\&quot;: \&quot;Tool name (`kind: toolCall` / `</text><text x="20" y="275">interact`).\&quot;\n    },\n    \&quot;arguments\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: \&quot;Tool-call arguments (`kind: too</text><text x="20" y="295">lCall`).\&quot;,\n      \&quot;additionalProperties\&quot;: true\n    },\n    \&quot;action\&quot;: {\n      \&quot;type\&quot;: \&quot;object\&quot;,\n      \&quot;description\&quot;: </text><text x="20" y="315">\&quot;Widget action (`kind: interact`).\&quot;,\n      \&quot;additionalProperties\&quot;: true\n    },\n    \&quot;assertion\&quot;: {\n      \&quot;type\&quot;: \&quot;obje</text><text x="20" y="335">ct\&quot;,\n      \&quot;description\&quot;: \&quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: t</text><text x="20" y="355">his is `WidgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is</text><text x="20" y="375"> evaluated against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is eval</text><text x="20" y="395">uated against a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.\</text><text x="20" y="415">&quot;,\n      \&quot;additionalProperties\&quot;: true\n    }\n  },\n  \&quot;additionalProperties\&quot;: true\n}\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;complete</text><text x="20" y="435">d&quot;}}</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +31.666410207748413s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_9&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;node - &lt;&lt;&#x27;JS&#x27;\nconst </text><text x="20" y="95">s=require(&#x27;./openapi.json&#x27;);for(const [p,v] of Object.entries(s.paths))if(p.includes(&#x27;/servers/{serverId}/&#x27;)&amp;&amp;(p.includes(&#x27;tools&#x27;)</text><text x="20" y="115">||p.includes(&#x27;diagnos&#x27;)))console.log(p,JSON.stringify(v));\nfor(const p of [&#x27;/projects/{projectId}/eval-suites&#x27;,&#x27;/projects/{projec</text><text x="20" y="135">tId}/eval-runs&#x27;]) console.log(p,JSON.stringify(s.paths[p]?.post));\nJS\&quot;&quot;, &quot;aggregated_output&quot;: &quot;/projects/{projectId}/servers/{se</text><text x="20" y="155">rverId}/tools {\&quot;post\&quot;:{\&quot;operationId\&quot;:\&quot;listTools\&quot;,\&quot;tags\&quot;:[\&quot;Primitives\&quot;],\&quot;summary\&quot;:\&quot;List tools\&quot;,\&quot;description\&quot;:\&quot;Retu</text><text x="20" y="175">rns the server&#x27;s tools as a collection page. Each item is the MCP tool definition (`name`, `description`, `inputSchema`, ...).\&quot;,\</text><text x="20" y="195">&quot;parameters\&quot;:[{\&quot;$ref\&quot;:\&quot;#/components/parameters/projectId\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/parameters/serverId\&quot;}],\&quot;requestBody\&quot;:{</text><text x="20" y="215">\&quot;$ref\&quot;:\&quot;#/components/requestBodies/cursorBody\&quot;},\&quot;responses\&quot;:{\&quot;200\&quot;:{\&quot;description\&quot;:\&quot;One page of tools.\&quot;,\&quot;content\&quot;:{\&quot;</text><text x="20" y="235">application/json\&quot;:{\&quot;schema\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/schemas/ToolPage\&quot;},\&quot;example\&quot;:{\&quot;items\&quot;:[{\&quot;name\&quot;:\&quot;create_issue\&quot;,\&quot;d</text><text x="20" y="255">escription\&quot;:\&quot;Create a new issue in the tracker\&quot;,\&quot;inputSchema\&quot;:{\&quot;type\&quot;:\&quot;object\&quot;,\&quot;properties\&quot;:{\&quot;title\&quot;:{\&quot;type\&quot;:\&quot;stri</text><text x="20" y="275">ng\&quot;}}}}]}}}},\&quot;400\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/ValidationError\&quot;},\&quot;401\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Unauthorize</text><text x="20" y="295">d\&quot;},\&quot;403\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Forbidden\&quot;},\&quot;404\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/NotFound\&quot;},\&quot;422\&quot;:{\&quot;$re</text><text x="20" y="315">f\&quot;:\&quot;#/components/responses/FeatureNotSupported\&quot;},\&quot;429\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/RateLimited\&quot;},\&quot;500\&quot;:{\&quot;$ref\&quot;:\&quot;</text><text x="20" y="335">#/components/responses/InternalError\&quot;},\&quot;502\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/ServerUnreachable\&quot;},\&quot;504\&quot;:{\&quot;$ref\&quot;:\&quot;#/comp</text><text x="20" y="355">onents/responses/Timeout\&quot;}}}}\n/projects/{projectId}/servers/{serverId}/tools/call {\&quot;post\&quot;:{\&quot;operationId\&quot;:\&quot;callTool\&quot;,\&quot;tags</text><text x="20" y="375">\&quot;:[\&quot;Execution\&quot;],\&quot;summary\&quot;:\&quot;Call a tool\&quot;,\&quot;description\&quot;:\&quot;Executes a tool on the server and returns the MCP `CallToolResult</text><text x="20" y="395">` plus an additive `durationMs` (wall-clock time of `executeTool`). Tool-level failures (`isError: true` in the result) are **succ</text><text x="20" y="415">essful calls** — the server answered; only transport/auth errors use the error envelope.\&quot;,\&quot;parameters\&quot;:[{\&quot;$ref\&quot;:\&quot;#/component</text><text x="20" y="435">s/parameters/projectId\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/parameters/serverId\&quot;}],\&quot;requestBody\&quot;:{\&quot;required\&quot;:true,\&quot;content\&quot;:{\&quot;appli</text><text x="20" y="455">cation/json\&quot;:{\&quot;schema\&quot;:{\&quot;type\&quot;:\&quot;object\&quot;,\&quot;required\&quot;:[\&quot;toolName\&quot;],\&quot;properties\&quot;:{\&quot;toolName\&quot;:{\&quot;type\&quot;:\&quot;string\&quot;,\&quot;des</text><text x="20" y="475">cription\&quot;:\&quot;Tool name, exactly as returned by the tools list.\&quot;},\&quot;parameters\&quot;:{\&quot;type\&quot;:\&quot;object\&quot;,\&quot;description\&quot;:\&quot;Tool argum</text><text x="20" y="495">ents matching the tool&#x27;s `inputSchema`. Defaults to `{}`.\&quot;,\&quot;additionalProperties\&quot;:true}}},\&quot;example\&quot;:{\&quot;toolName\&quot;:\&quot;create_is</text><text x="20" y="515">sue\&quot;,\&quot;parameters\&quot;:{\&quot;title\&quot;:\&quot;Bug: login fails\&quot;}}}}},\&quot;responses\&quot;:{\&quot;200\&quot;:{\&quot;description\&quot;:\&quot;The MCP `CallToolResult` plus </text><text x="20" y="535">additive `durationMs`. Check `isError` for tool-level failures. When the result is an `isError` sign-in challenge carrying `_meta[</text><text x="20" y="555">\\\&quot;mcp/www_authenticate\\\&quot;]`, an additive `authChallenge` holds the parsed challenge. An HTTP 401 from the MCP server is answere</text><text x="20" y="575">d with `403 AUTH_REQUIRED` instead, with the challenge in `details.authChallenge`.\&quot;,\&quot;content\&quot;:{\&quot;application/json\&quot;:{\&quot;schema\&quot;</text><text x="20" y="595">:{\&quot;$ref\&quot;:\&quot;#/components/schemas/CallToolResult\&quot;},\&quot;example\&quot;:{\&quot;content\&quot;:[{\&quot;type\&quot;:\&quot;text\&quot;,\&quot;text\&quot;:\&quot;Issue created: #42\&quot;}]</text><text x="20" y="615">,\&quot;durationMs\&quot;:42}}}},\&quot;400\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/ValidationError\&quot;},\&quot;401\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Un</text><text x="20" y="635">authorized\&quot;},\&quot;403\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Forbidden\&quot;},\&quot;404\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/NotFound\&quot;},\&quot;422</text><text x="20" y="655">\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/FeatureNotSupported\&quot;},\&quot;429\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/RateLimited\&quot;},\&quot;500\&quot;:{\&quot;</text><text x="20" y="675">$ref\&quot;:\&quot;#/components/responses/InternalError\&quot;},\&quot;502\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/ServerUnreachable\&quot;},\&quot;504\&quot;:{\&quot;$ref\&quot;</text><text x="20" y="695">:\&quot;#/components/responses/Timeout\&quot;}}}}\n/projects/{projectId}/eval-suites {\&quot;operationId\&quot;:\&quot;createEvalSuite\&quot;,\&quot;tags\&quot;:[\&quot;Eval r</text><text x="20" y="715">uns\&quot;],\&quot;summary\&quot;:\&quot;Create an eval suite (author-only, does not run)\&quot;,\&quot;description\&quot;:\&quot;Creates a runnable eval suite — the suit</text><text x="20" y="735">e record plus its test cases — and responds `201` **synchronously**, WITHOUT executing anything. Use this to author a suite, then </text><text x="20" y="755">run it later with `POST /eval-runs` (passing the returned `suiteId`).\\n\\nThis is distinct from `POST /eval-runs`, which creates </text><text x="20" y="775">a run and **detaches execution**, responding `202` with a `runId`. There is no concurrency cap here (no run is started).\\n\\nThe </text><text x="20" y="795">body uses an ergonomic authoring shape: a suite-level default `model` (and optional `provider`) applies to every test unless the t</text><text x="20" y="815">est overrides it; `provider` is derived from a `provider/model` id when neither is supplied. Each test&#x27;s case body is an ordered `</text><text x="20" y="835">steps` array (prompt / toolCall / interact / assert).\\n\\nGuest callers are denied (suite creation is a write).\&quot;,\&quot;parameters\&quot;:</text><text x="20" y="855">[{\&quot;$ref\&quot;:\&quot;#/components/parameters/evalVocabularyHeader\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/parameters/projectId\&quot;}],\&quot;requestBody\&quot;:{\&quot;</text><text x="20" y="875">required\&quot;:true,\&quot;content\&quot;:{\&quot;application/json\&quot;:{\&quot;schema\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/schemas/EvalSuiteCreateRequest\&quot;},\&quot;example</text><text x="20" y="895">\&quot;:{\&quot;name\&quot;:\&quot;smoke\&quot;,\&quot;serverIds\&quot;:[\&quot;srv_abc123\&quot;],\&quot;model\&quot;:\&quot;anthropic/claude-haiku-4.5\&quot;,\&quot;tests\&quot;:[{\&quot;title\&quot;:\&quot;lists files</text><text x="20" y="915">\&quot;,\&quot;steps\&quot;:[{\&quot;id\&quot;:\&quot;s1\&quot;,\&quot;kind\&quot;:\&quot;prompt\&quot;,\&quot;prompt\&quot;:\&quot;List the files in the project root.\&quot;},{\&quot;id\&quot;:\&quot;s2\&quot;,\&quot;kind\&quot;:\&quot;ass</text><text x="20" y="935">ert\&quot;,\&quot;assertion\&quot;:{\&quot;type\&quot;:\&quot;toolCalledWith\&quot;,\&quot;toolName\&quot;:\&quot;list_files\&quot;,\&quot;args\&quot;:{\&quot;args\&quot;:{}}}}]}]}}}},\&quot;responses\&quot;:{\&quot;201\</text><text x="20" y="955">&quot;:{\&quot;description\&quot;:\&quot;The suite was created.\&quot;,\&quot;content\&quot;:{\&quot;application/json\&quot;:{\&quot;schema\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/schemas/EvalS</text><text x="20" y="975">uiteCreated\&quot;}}}},\&quot;400\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/ValidationError\&quot;},\&quot;401\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Unautho</text><text x="20" y="995">rized\&quot;},\&quot;403\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/Forbidden\&quot;},\&quot;404\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/NotFound\&quot;},\&quot;429\&quot;:{\</text><text x="20" y="1015">&quot;$ref\&quot;:\&quot;#/components/responses/RateLimited\&quot;},\&quot;500\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/responses/InternalError\&quot;},\&quot;502\&quot;:{\&quot;$ref\&quot;:\&quot;#/</text><text x="20" y="1035">components/responses/ServerUnreachable\&quot;}}}\n/projects/{projectId}/eval-runs {\&quot;operationId\&quot;:\&quot;createEvalRun\&quot;,\&quot;tags\&quot;:[\&quot;Eval r</text><text x="20" y="1055">uns\&quot;],\&quot;summary\&quot;:\&quot;Create an eval run (async)\&quot;,\&quot;description\&quot;:\&quot;Creates a suite run from an existing `suiteId` (rerun) and/or </text><text x="20" y="1075">inline `tests`, then **detaches execution and responds `202` immediately** with the `runId`. Validation and quota errors surface o</text><text x="20" y="1095">n this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in the hosted UI Runs tab, tagged `source: \\\&quot;ap</text><text x="20" y="1115">i\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per-organization concurrency is capped (default</text><text x="20" y="1135"> 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_RUN_LIMIT\\\&quot;`.\\n\\nFor a suite with attache</text><text x="20" y="1155">d project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the resolved `environment` triple,</text><text x="20" y="1175"> and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo make the run readable as something more spe</text><text x="20" y="1195">cific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamp</text><text x="20" y="1215">ed `api` either way.\&quot;,\&quot;parameters\&quot;:[{\&quot;$ref\&quot;:\&quot;#/components/parameters/evalVocabularyHeader\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/parame</text><text x="20" y="1235">ters/projectId\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/parameters/launcherHeader\&quot;},{\&quot;$ref\&quot;:\&quot;#/components/parameters/ciHeader\&quot;}],\&quot;request</text><text x="20" y="1255">Body\&quot;:{\&quot;required\&quot;:true,\&quot;content\&quot;:{\&quot;application/json\&quot;:{\&quot;schema\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/schemas/EvalRunCreateRequest\&quot;},\</text><text x="20" y="1275">&quot;example\&quot;:{\&quot;suiteName\&quot;:\&quot;smoke\&quot;,\&quot;serverIds\&quot;:[\&quot;srv_abc123\&quot;],\&quot;tests\&quot;:[{\&quot;title\&quot;:\&quot;echo works\&quot;,\&quot;runs\&quot;:1,\&quot;model\&quot;:\&quot;ant</text><text x="20" y="1295">hropic/claude-haiku-4.5\&quot;,\&quot;provider\&quot;:\&quot;anthropic\&quot;,\&quot;steps\&quot;:[{\&quot;id\&quot;:\&quot;s1\&quot;,\&quot;kind\&quot;:\&quot;prompt\&quot;,\&quot;prompt\&quot;:\&quot;Use the echo tool </text><text x="20" y="1315">to say hi\&quot;},{\&quot;id\&quot;:\&quot;s2\&quot;,\&quot;kind\&quot;:\&quot;assert\&quot;,\&quot;assertion\&quot;:{\&quot;type\&quot;:\&quot;toolCalledWith\&quot;,\&quot;toolName\&quot;:\&quot;echo\&quot;,\&quot;args\&quot;:{\&quot;args\</text><text x="20" y="1335">&quot;:{\&quot;text\&quot;:\&quot;hi\&quot;}}}}]}]}}}},\&quot;responses\&quot;:{\&quot;202\&quot;:{\&quot;description\&quot;:\&quot;Run created; execution continues in the background.\&quot;,\&quot;co</text><text x="20" y="1355">ntent\&quot;:{\&quot;application/json\&quot;:{\&quot;schema\&quot;:{\&quot;$ref\&quot;:\&quot;#/components/schemas/EvalRunCreated\&quot;},\&quot;example\&quot;:{\&quot;runId\&quot;:\&quot;run_abc123\&quot;</text></g></svg>
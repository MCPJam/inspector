<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.03709149360656738s — page 1</text><text x="20" y="75">{</text><text x="20" y="95">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="115">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="135">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone — without a `suiteId` or a `suiteName` — are rejec</text><text x="20" y="155">ted with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite that has it </text><text x="20" y="175">attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite could never </text><text x="20" y="195">be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="215">  &quot;anyOf&quot;: [</text><text x="20" y="235">    {</text><text x="20" y="255">      &quot;required&quot;: [</text><text x="20" y="275">        &quot;suiteId&quot;</text><text x="20" y="295">      ]</text><text x="20" y="315">    },</text><text x="20" y="335">    {</text><text x="20" y="355">      &quot;required&quot;: [</text><text x="20" y="375">        &quot;suiteName&quot;,</text><text x="20" y="395">        &quot;tests&quot;,</text><text x="20" y="415">        &quot;serverIds&quot;</text><text x="20" y="435">      ],</text><text x="20" y="455">      &quot;properties&quot;: {</text><text x="20" y="475">        &quot;tests&quot;: {</text><text x="20" y="495">          &quot;minItems&quot;: 1</text><text x="20" y="515">        }</text><text x="20" y="535">      }</text><text x="20" y="555">    }</text><text x="20" y="575">  ],</text><text x="20" y="595">  &quot;properties&quot;: {</text><text x="20" y="615">    &quot;suiteId&quot;: {</text><text x="20" y="635">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="655">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="675">    },</text><text x="20" y="695">    &quot;hosts&quot;: {</text><text x="20" y="715">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="735">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="755">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text><text x="20" y="775">      &quot;items&quot;: {</text><text x="20" y="795">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="815">        &quot;required&quot;: [</text><text x="20" y="835">          &quot;host&quot;</text><text x="20" y="855">        ],</text><text x="20" y="875">        &quot;properties&quot;: {</text><text x="20" y="895">          &quot;host&quot;: {</text><text x="20" y="915">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="935">            &quot;minLength&quot;: 1</text><text x="20" y="955">          },</text><text x="20" y="975">          &quot;servers&quot;: {</text><text x="20" y="995">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1015">            &quot;items&quot;: {</text><text x="20" y="1035">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1055">              &quot;minLength&quot;: 1</text><text x="20" y="1075">            }</text><text x="20" y="1095">          }</text><text x="20" y="1115">        }</text><text x="20" y="1135">      }</text><text x="20" y="1155">    },</text><text x="20" y="1175">    &quot;suiteName&quot;: {</text><text x="20" y="1195">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1215">      &quot;description&quot;: &quot;Name for a new suite. Required (non-empty) when no `suiteId` is given.&quot;</text><text x="20" y="1235">    },</text><text x="20" y="1255">    &quot;suiteDescription&quot;: {</text><text x="20" y="1275">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1295">    },</text><text x="20" y="1315">    &quot;tests&quot;: {</text><text x="20" y="1335">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1355">      &quot;maxItems&quot;: 100,</text></g></svg>
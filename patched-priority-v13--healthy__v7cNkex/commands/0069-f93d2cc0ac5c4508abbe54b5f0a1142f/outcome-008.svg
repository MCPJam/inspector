="315">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="335">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="355">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone — without a `suiteId` or a `suiteName` — are rejec</text><text x="20" y="375">ted with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite that has it </text><text x="20" y="395">attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite could never </text><text x="20" y="415">be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="435">  &quot;anyOf&quot;: [</text><text x="20" y="455">    {</text><text x="20" y="475">      &quot;required&quot;: [</text><text x="20" y="495">        &quot;suiteId&quot;</text><text x="20" y="515">      ]</text><text x="20" y="535">    },</text><text x="20" y="555">    {</text><text x="20" y="575">      &quot;required&quot;: [</text><text x="20" y="595">        &quot;suiteName&quot;,</text><text x="20" y="615">        &quot;tests&quot;,</text><text x="20" y="635">        &quot;serverIds&quot;</text><text x="20" y="655">      ],</text><text x="20" y="675">      &quot;properties&quot;: {</text><text x="20" y="695">        &quot;tests&quot;: {</text><text x="20" y="715">          &quot;minItems&quot;: 1</text><text x="20" y="735">        }</text><text x="20" y="755">      }</text><text x="20" y="775">    }</text><text x="20" y="795">  ],</text><text x="20" y="815">  &quot;properties&quot;: {</text><text x="20" y="835">    &quot;suiteId&quot;: {</text><text x="20" y="855">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="875">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="895">    },</text><text x="20" y="915">    &quot;hosts&quot;: {</text><text x="20" y="935">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="955">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="975">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text><text x="20" y="995">      &quot;items&quot;: {</text><text x="20" y="1015">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1035">        &quot;required&quot;: [</text><text x="20" y="1055">          &quot;host&quot;</text><text x="20" y="1075">        ],</text><text x="20" y="1095">        &quot;properties&quot;: {</text><text x="20" y="1115">          &quot;host&quot;: {</text><text x="20" y="1135">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1155">            &quot;minLength&quot;: 1</text><text x="20" y="1175">          },</text><text x="20" y="1195">          &quot;servers&quot;: {</text><text x="20" y="1215">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1235">            &quot;items&quot;: {</text><text x="20" y="1255">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1275">              &quot;minLength&quot;: 1</text><text x="20" y="1295">            }</text><text x="20" y="1315">          }</text><text x="20" y="1335">        }</text><text x="20" y="1355">      }</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">2665a8b6add246508da54bb5a13842c9 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;node - &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;JS&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">const s=require(&#x27;&quot;&#x27;&quot;&#x27;./openapi.json&#x27;&quot;&#x27;&quot;&#x27;);console.log(JSON.stringify(s.components.schemas.EvalTestStep,null,2));</text><text x="20" y="195">JS&#x27;</text><text x="20" y="215">{</text><text x="20" y="235">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="255">  &quot;description&quot;: &quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user message (model turn); </text><text x="20" y="275">`toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an assertion (a `Predicate`</text><text x="20" y="295"> like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).&quot;,</text><text x="20" y="315">  &quot;required&quot;: [</text><text x="20" y="335">    &quot;id&quot;,</text><text x="20" y="355">    &quot;kind&quot;</text><text x="20" y="375">  ],</text><text x="20" y="395">  &quot;properties&quot;: {</text><text x="20" y="415">    &quot;id&quot;: {</text><text x="20" y="435">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="455">      &quot;minLength&quot;: 1</text><text x="20" y="475">    },</text><text x="20" y="495">    &quot;kind&quot;: {</text><text x="20" y="515">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="535">      &quot;enum&quot;: [</text><text x="20" y="555">        &quot;prompt&quot;,</text><text x="20" y="575">        &quot;toolCall&quot;,</text><text x="20" y="595">        &quot;interact&quot;,</text><text x="20" y="615">        &quot;assert&quot;</text><text x="20" y="635">      ]</text><text x="20" y="655">    },</text><text x="20" y="675">    &quot;prompt&quot;: {</text><text x="20" y="695">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="715">      &quot;description&quot;: &quot;User message (`kind: prompt`).&quot;</text><text x="20" y="735">    },</text><text x="20" y="755">    &quot;serverName&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="795">      &quot;description&quot;: &quot;Server that owns the tool (`kind: toolCall`).&quot;</text><text x="20" y="815">    },</text><text x="20" y="835">    &quot;toolName&quot;: {</text><text x="20" y="855">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="875">      &quot;description&quot;: &quot;Tool name (`kind: toolCall` / `interact`).&quot;</text><text x="20" y="895">    },</text><text x="20" y="915">    &quot;arguments&quot;: {</text><text x="20" y="935">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="955">      &quot;description&quot;: &quot;Tool-call arguments (`kind: toolCall`).&quot;,</text><text x="20" y="975">      &quot;additionalProperties&quot;: true</text><text x="20" y="995">    },</text><text x="20" y="1015">    &quot;action&quot;: {</text><text x="20" y="1035">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1055">      &quot;description&quot;: &quot;Widget action (`kind: interact`).&quot;,</text><text x="20" y="1075">      &quot;additionalProperties&quot;: true</text><text x="20" y="1095">    },</text><text x="20" y="1115">    &quot;assertion&quot;: {</text><text x="20" y="1135">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1155">      &quot;description&quot;: &quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `Wi</text><text x="20" y="1175">dgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is evaluated</text><text x="20" y="1195"> against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated agai</text><text x="20" y="1215">nst a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.&quot;,</text><text x="20" y="1235">      &quot;additionalProperties&quot;: true</text><text x="20" y="1255">    }</text><text x="20" y="1275">  },</text><text x="20" y="1295">  &quot;additionalProperties&quot;: true</text><text x="20" y="1315">}</text><text x="20" y="1335"></text><text x="20" y="1355">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1265"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">38740e39db2c427bb7c31e68fed06928 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; run-eval.mjs &lt;&lt;&#x27;EOF&#x27;</text><text x="20" y="95">import fs from &#x27;node:fs/promises&#x27;;</text><text x="20" y="115">const base = process.env.MCPJAM_API_URL;</text><text x="20" y="135">const key = process.env.MCPJAM_API_KEY;</text><text x="20" y="155">if (!base || !key) throw new Error(&#x27;Set MCPJAM_API_URL and MCPJAM_API_KEY&#x27;);</text><text x="20" y="175">const project = &#x27;project_fixture&#x27;;</text><text x="20" y="195">async function api(path, body) {</text><text x="20" y="215">  const response = await fetch(`${base.replace(/\/$/, &#x27;&#x27;)}/projects/${project}${path}`, {</text><text x="20" y="235">    method: body ? &#x27;POST&#x27; : &#x27;GET&#x27;,</text><text x="20" y="255">    headers: {Authorization: `Bearer ${key}`, &#x27;Content-Type&#x27;: &#x27;application/json&#x27;},</text><text x="20" y="275">    ...(body ? {body: JSON.stringify(body)} : {})</text><text x="20" y="295">  });</text><text x="20" y="315">  const data = await response.json();</text><text x="20" y="335">  if (!response.ok || data.code) throw new Error(JSON.stringify(data));</text><text x="20" y="355">  return data;</text><text x="20" y="375">}</text><text x="20" y="395">async function save(name, value) {</text><text x="20" y="415">  await fs.writeFile(name, JSON.stringify(value, null, 2) + &#x27;\n&#x27;);</text><text x="20" y="435">}</text><text x="20" y="455">if (process.argv.includes(&#x27;--create&#x27;)) {</text><text x="20" y="475">  await save(&#x27;suite-created.json&#x27;, await api(&#x27;/eval-suites&#x27;, JSON.parse(await fs.readFile(&#x27;suite.json&#x27;, &#x27;utf8&#x27;))));</text><text x="20" y="495">}</text><text x="20" y="515">const {suiteId} = JSON.parse(await fs.readFile(&#x27;suite-created.json&#x27;, &#x27;utf8&#x27;));</text><text x="20" y="535">if (!suiteId) throw new Error(&#x27;Missing saved suiteId; use --create&#x27;);</text><text x="20" y="555">await save(&#x27;run-request.json&#x27;, {suiteId});</text><text x="20" y="575">const run = await api(&#x27;/eval-runs&#x27;, {suiteId});</text><text x="20" y="595">await save(&#x27;run-created.json&#x27;, run);</text><text x="20" y="615">let status;</text><text x="20" y="635">for (let attempt = 0; attempt &lt; 30; attempt++) {</text><text x="20" y="655">  status = await api(`/eval-runs/${run.runId}`);</text><text x="20" y="675">  await save(&#x27;run-status.json&#x27;, status);</text><text x="20" y="695">  if ([&#x27;completed&#x27;, &#x27;failed&#x27;, &#x27;cancelled&#x27;, &#x27;timed_out&#x27;].includes(status.status)) break;</text><text x="20" y="715">  await new Promise(resolve =&gt; setTimeout(resolve, 1000));</text><text x="20" y="735">}</text><text x="20" y="755">await save(&#x27;iterations.json&#x27;, await api(`/eval-runs/${run.runId}/iterations`));</text><text x="20" y="775">console.log(JSON.stringify({runId: run.runId, suiteId, ...status}, null, 2));</text><text x="20" y="795">if (status.status !== &#x27;completed&#x27; || status.result !== &#x27;passed&#x27;) process.exitCode = 1;</text><text x="20" y="815">EOF</text><text x="20" y="835">node run-eval.mjs</text><text x="20" y="855">{</text><text x="20" y="875">  &quot;runId&quot;: &quot;run_fixture_2&quot;,</text><text x="20" y="895">  &quot;suiteId&quot;: &quot;suite_authored_4&quot;,</text><text x="20" y="915">  &quot;id&quot;: &quot;run_fixture_2&quot;,</text><text x="20" y="935">  &quot;runNumber&quot;: 2,</text><text x="20" y="955">  &quot;status&quot;: &quot;completed&quot;,</text><text x="20" y="975">  &quot;result&quot;: &quot;passed&quot;,</text><text x="20" y="995">  &quot;summary&quot;: {</text><text x="20" y="1015">    &quot;total&quot;: 1,</text><text x="20" y="1035">    &quot;passed&quot;: 1,</text><text x="20" y="1055">    &quot;failed&quot;: 0,</text><text x="20" y="1075">    &quot;passRate&quot;: 1</text><text x="20" y="1095">  },</text><text x="20" y="1115">  &quot;source&quot;: &quot;api&quot;,</text><text x="20" y="1135">  &quot;notes&quot;: &quot;SIMULATED: deterministic fixture execution; no hosted model or live billing.&quot;,</text><text x="20" y="1155">  &quot;createdAt&quot;: 1794707997772,</text><text x="20" y="1175">  &quot;completedAt&quot;: 1794707997772</text><text x="20" y="1195">}</text><text x="20" y="1215"></text><text x="20" y="1235">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
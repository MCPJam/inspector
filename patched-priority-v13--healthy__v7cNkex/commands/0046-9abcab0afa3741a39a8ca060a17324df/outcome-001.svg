<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9abcab0afa3741a39a8ca060a17324df — page 1</text><text x="20" y="75">$ /bin/bash -c curl -fsS -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/projects/project_fixture/capabilities&quot; -o cap</text><text x="20" y="95">abilities.json &amp;&amp; cat capabilities.json</text><text x="20" y="115">node - &lt;&lt;&#x27;JS&#x27;</text><text x="20" y="135">const s=require(&#x27;./openapi.json&#x27;);console.log(JSON.stringify(s.components.schemas.EvalRunCreateRequest,null,2));</text><text x="20" y="155">JS</text><text x="20" y="175">{&quot;projectId&quot;: &quot;project_fixture&quot;, &quot;sensitive_value&quot;: &quot;[REDACTED]&quot;, &quot;role&quot;: &quot;owner&quot;, &quot;projectRole&quot;: &quot;owner&quot;, &quot;surface&quot;: &quot;cli&quot;, &quot;feat</text><text x="20" y="195">ures&quot;: {&quot;sandboxes&quot;: {&quot;enabled&quot;: false, &quot;mode&quot;: &quot;off&quot;, &quot;enforced&quot;: false}}, &quot;plan&quot;: {&quot;name&quot;: &quot;team&quot;, &quot;limits&quot;: {}, &quot;features&quot;: {}}</text><text x="20" y="215">, &quot;can&quot;: {}}{</text><text x="20" y="235">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="255">  &quot;description&quot;: &quot;Two valid shapes: `suiteId` (rerun an existing suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="275">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone — without a `suiteId` or a `suiteName` — are rejec</text><text x="20" y="295">ted with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite that has it </text><text x="20" y="315">attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite could never </text><text x="20" y="335">be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="355">  &quot;anyOf&quot;: [</text><text x="20" y="375">    {</text><text x="20" y="395">      &quot;required&quot;: [</text><text x="20" y="415">        &quot;suiteId&quot;</text><text x="20" y="435">      ]</text><text x="20" y="455">    },</text><text x="20" y="475">    {</text><text x="20" y="495">      &quot;required&quot;: [</text><text x="20" y="515">        &quot;suiteName&quot;,</text><text x="20" y="535">        &quot;tests&quot;,</text><text x="20" y="555">        &quot;serverIds&quot;</text><text x="20" y="575">      ],</text><text x="20" y="595">      &quot;properties&quot;: {</text><text x="20" y="615">        &quot;tests&quot;: {</text><text x="20" y="635">          &quot;minItems&quot;: 1</text><text x="20" y="655">        }</text><text x="20" y="675">      }</text><text x="20" y="695">    }</text><text x="20" y="715">  ],</text><text x="20" y="735">  &quot;properties&quot;: {</text><text x="20" y="755">    &quot;suiteId&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="795">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="815">    },</text><text x="20" y="835">    &quot;hosts&quot;: {</text><text x="20" y="855">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="875">      &quot;description&quot;: &quot;Attachments for a new inline suite only. Each host is a project host name or ID; servers optionally selects </text><text x="20" y="895">bound server names or IDs. A sole host is selected automatically. Omit for the project default. Cannot be combined with suiteId.&quot;,</text><text x="20" y="915">      &quot;items&quot;: {</text><text x="20" y="935">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="955">        &quot;required&quot;: [</text><text x="20" y="975">          &quot;host&quot;</text><text x="20" y="995">        ],</text><text x="20" y="1015">        &quot;properties&quot;: {</text><text x="20" y="1035">          &quot;host&quot;: {</text><text x="20" y="1055">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1075">            &quot;minLength&quot;: 1</text><text x="20" y="1095">          },</text><text x="20" y="1115">          &quot;servers&quot;: {</text><text x="20" y="1135">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1155">            &quot;items&quot;: {</text><text x="20" y="1175">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1195">              &quot;minLength&quot;: 1</text><text x="20" y="1215">            }</text><text x="20" y="1235">          }</text><text x="20" y="1255">        }</text><text x="20" y="1275">      }</text><text x="20" y="1295">    },</text><text x="20" y="1315">    &quot;suiteName&quot;: {</text><text x="20" y="1335">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1355">      &quot;description&quot;: &quot;Name for a new suite. Required (non-empty) when no `suiteId` is given.&quot;</text></g></svg>
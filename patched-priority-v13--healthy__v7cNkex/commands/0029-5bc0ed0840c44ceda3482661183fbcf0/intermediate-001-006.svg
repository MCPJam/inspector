<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="945"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +1.4497015476226807s — page 6</text><text x="20" y="75"># 3. Re-run doctor with the token</text><text x="20" y="95">mcpjam server doctor --url https://your-server.com/mcp --oauth-access-token $TOKEN</text><text x="20" y="115"></text><text x="20" y="135"># 4. Exercise tools directly</text><text x="20" y="155">mcpjam tools list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="175">mcpjam tools call --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="195">  --tool-name my_tool --tool-args @params.json --quiet --format json</text><text x="20" y="215"></text><text x="20" y="235"># 5. If the server exposes MCP Apps, validate the ui:// surface</text><text x="20" y="255">mcpjam apps conformance --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="275"></text><text x="20" y="295"># 6. Render one UI-capable tool result in Inspector&#x27;s App Builder.</text><text x="20" y="315"># --ui opens Inspector by default in a TTY; add --no-open if browser automation already opened it.</text><text x="20" y="335">mcpjam tools call --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="355">  --tool-name my_app_tool --tool-args @params.json --ui --quiet --format json</text><text x="20" y="375">```</text><text x="20" y="395"></text><text x="20" y="415">## Use from an MCP client instead of a shell</text><text x="20" y="435"></text><text x="20" y="455">If your agent speaks MCP but can&#x27;t run shell commands (Claude Desktop, chat clients), run the same testing engine as a stdio MCP s</text><text x="20" y="475">erver:</text><text x="20" y="495"></text><text x="20" y="515">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="535">npx -y @mcpjam/cli@latest mcp</text><text x="20" y="555">```</text><text x="20" y="575"></text><text x="20" y="595">Connections to servers under test stay open between tool calls, so agents can also observe notifications and session behavior that</text><text x="20" y="615"> one-shot CLI commands can&#x27;t. See [MCPJam as an MCP server](https://docs.mcpjam.com/cli/mcp-server.md).</text><text x="20" y="635"></text><text x="20" y="655">## What&#x27;s next</text><text x="20" y="675"></text><text x="20" y="695">* [MCPJam as an MCP server](https://docs.mcpjam.com/cli/mcp-server.md) — give MCP clients the testing engine over stdio</text><text x="20" y="715">* [Server inspection](https://docs.mcpjam.com/cli/server-inspection.md) — probe, doctor, and diagnostics</text><text x="20" y="735">* [OAuth conformance](https://docs.mcpjam.com/cli/oauth-conformance.md) — test your OAuth implementation</text><text x="20" y="755">* [OAuth login](https://docs.mcpjam.com/cli/oauth-login.md) — authenticate and debug OAuth flows</text><text x="20" y="775">* [MCP Apps conformance](https://docs.mcpjam.com/cli/apps-conformance.md) — validate `_meta.ui.resourceUri` and `ui://` resource w</text><text x="20" y="795">iring</text><text x="20" y="815">* [Tools, resources &amp; prompts](https://docs.mcpjam.com/cli/tools-resources-prompts.md) — exercise the connected surface</text><text x="20" y="835">* [Migrating to CLI 4.0](https://docs.mcpjam.com/cli/migration.md) — command-path and flag changes under `mcpjam cloud`</text><text x="20" y="855">* [Full command reference](https://docs.mcpjam.com/cli/reference.md) — every flag for every command</text><text x="20" y="875"></text><text x="20" y="895"></text><text x="20" y="915">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text></g></svg>
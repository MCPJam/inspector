<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="485"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.05189204216003418s — page 1</text><text x="20" y="75">/projects/{projectId}/eval-runs {&quot;operationId&quot;:&quot;createEvalRun&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval run (async)&quot;,&quot;descri</text><text x="20" y="95">ption&quot;:&quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202`</text><text x="20" y="115"> immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. </text><text x="20" y="135">The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests reruns the suit</text><text x="20" y="155">e as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reas</text><text x="20" y="175">on: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which one the run</text><text x="20" y="195"> uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of th</text><text x="20" y="215">e run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpja</text><text x="20" y="235">m-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalV</text><text x="20" y="255">ocabularyHeader&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/launcherHeader&quot;},{&quot;$ref&quot;:&quot;#/compon</text><text x="20" y="275">ents/parameters/ciHeader&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/E</text><text x="20" y="295">valRunCreateRequest&quot;},&quot;example&quot;:{&quot;suiteName&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;tests&quot;:[{&quot;title&quot;:&quot;echo works&quot;,&quot;runs&quot;:1,&quot;model&quot;:&quot;a</text><text x="20" y="315">nthropic/claude-haiku-4.5&quot;,&quot;provider&quot;:&quot;anthropic&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;Use the echo tool to say hi&quot;},{&quot;id</text><text x="20" y="335">&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;assert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;echo&quot;,&quot;args&quot;:{&quot;args&quot;:{&quot;text&quot;:&quot;hi&quot;}}}}]}]}}}},&quot;responses&quot;:{</text><text x="20" y="355">&quot;202&quot;:{&quot;description&quot;:&quot;Run created; execution continues in the background.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/comp</text><text x="20" y="375">onents/schemas/EvalRunCreated&quot;},&quot;example&quot;:{&quot;runId&quot;:&quot;run_abc123&quot;,&quot;suiteId&quot;:&quot;suite_def456&quot;,&quot;status&quot;:&quot;running&quot;,&quot;caseUpsert&quot;:{&quot;committ</text><text x="20" y="395">ed&quot;:[{&quot;name&quot;:&quot;echo works&quot;}],&quot;failed&quot;:[]},&quot;environment&quot;:null}}}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$r</text><text x="20" y="415">ef&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses</text><text x="20" y="435">/NotFound&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref</text><text x="20" y="455">&quot;:&quot;#/components/responses/ServerUnreachable&quot;},&quot;504&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Timeout&quot;}}}</text></g></svg>
erverId}/tools/call {&quot;post&quot;:{&quot;operationId&quot;:&quot;callTool&quot;,&quot;tags&quot;:[&quot;Execution&quot;],&quot;summary&quot;:&quot;Call a tool&quot;</text><text x="20" y="495">,&quot;description&quot;:&quot;Executes a tool on the server and returns the MCP `CallToolResult` plus an additive `durationMs` (wall-clock time </text><text x="20" y="515">of `executeTool`). Tool-level failures (`isError: true` in the result) are **successful calls** — the server answered; only transp</text><text x="20" y="535">ort/auth errors use the error envelope.&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/paramete</text><text x="20" y="555">rs/serverId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;type&quot;:&quot;object&quot;,&quot;required&quot;:[&quot;toolName&quot;],&quot;pr</text><text x="20" y="575">operties&quot;:{&quot;toolName&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;description&quot;:&quot;Tool name, exactly as returned by the tools list.&quot;},&quot;parameters&quot;:{&quot;type&quot;:&quot;ob</text><text x="20" y="595">ject&quot;,&quot;description&quot;:&quot;Tool arguments matching the tool&#x27;s `inputSchema`. Defaults to `{}`.&quot;,&quot;additionalProperties&quot;:true}}},&quot;example&quot;</text><text x="20" y="615">:{&quot;toolName&quot;:&quot;create_issue&quot;,&quot;parameters&quot;:{&quot;title&quot;:&quot;Bug: login fails&quot;}}}}},&quot;responses&quot;:{&quot;200&quot;:{&quot;description&quot;:&quot;The MCP `CallToolResu</text><text x="20" y="635">lt` plus additive `durationMs`. Check `isError` for tool-level failures. When the result is an `isError` sign-in challenge carryin</text><text x="20" y="655">g `_meta[\&quot;mcp/www_authenticate\&quot;]`, an additive `authChallenge` holds the parsed challenge. An HTTP 401 from the MCP server is an</text><text x="20" y="675">swered with `403 AUTH_REQUIRED` instead, with the challenge in `details.authChallenge`.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{</text><text x="20" y="695">&quot;$ref&quot;:&quot;#/components/schemas/CallToolResult&quot;},&quot;example&quot;:{&quot;content&quot;:[{&quot;type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Issue created: #42&quot;}],&quot;durationMs&quot;:42}}</text><text x="20" y="715">}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/c</text><text x="20" y="735">omponents/responses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;422&quot;:{&quot;$ref&quot;:&quot;#/components/responses/FeatureNotS</text><text x="20" y="755">upported&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;</text><text x="20" y="775">:&quot;#/components/responses/ServerUnreachable&quot;},&quot;504&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="795">/projects/{projectId}/eval-suites {&quot;operationId&quot;:&quot;createEvalSuite&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval suite (author-on</text><text x="20" y="815">ly, does not run)&quot;,&quot;description&quot;:&quot;Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **sync</text><text x="20" y="835">hronously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returne</text><text x="20" y="855">d `suiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a </text><text x="20" y="875">`runId`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level defaul</text><text x="20" y="895">t `model` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/mod</text><text x="20" y="915">el` id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGue</text><text x="20" y="935">st callers are denied (suite creation is a write).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalVocabularyHeader&quot;},{&quot;$ref&quot;:</text><text x="20" y="955">&quot;#/components/parameters/projectId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components</text><text x="20" y="975">/schemas/EvalSuiteCreateRequest&quot;},&quot;example&quot;:{&quot;name&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;tests</text><text x="20" y="995">&quot;:[{&quot;title&quot;:&quot;lists files&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;List the files in the project root.&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;a</text><text x="20" y="1015">ssert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;list_files&quot;,&quot;args&quot;:{&quot;args&quot;:{}}}}]}]}}}},&quot;responses&quot;:{&quot;201&quot;:{&quot;description&quot;:</text><text x="20" y="1035">&quot;The suite was created.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalSuiteCreated&quot;}}}},&quot;400&quot;:{&quot;$ref&quot;</text><text x="20" y="1055">:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/respon</text><text x="20" y="1075">ses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;</text><text x="20" y="1095">:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnreachable&quot;}}}</text><text x="20" y="1115">/projects/{projectId}/eval-runs {&quot;operationId&quot;:&quot;createEvalRun&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval run (async)&quot;,&quot;descri</text><text x="20" y="1135">ption&quot;:&quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202`</text><text x="20" y="1155"> immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. </text><text x="20" y="1175">The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests reruns the suit</text><text x="20" y="1195">e as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reas</text><text x="20" y="1215">on: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which one the run</text><text x="20" y="1235"> uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of th</text><text x="20" y="1255">e run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpja</text><text x="20" y="1275">m-ci` from a CI job). Both a
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="925"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.051531076431274414s — page 1</text><text x="20" y="75">/projects/{projectId}/servers/{serverId}/tools {&quot;post&quot;:{&quot;operationId&quot;:&quot;listTools&quot;,&quot;tags&quot;:[&quot;Primitives&quot;],&quot;summary&quot;:&quot;List tools&quot;,&quot;de</text><text x="20" y="95">scription&quot;:&quot;Returns the server&#x27;s tools as a collection page. Each item is the MCP tool definition (`name`, `description`, `inputSc</text><text x="20" y="115">hema`, ...).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/parameters/serverId&quot;}],&quot;requestBody</text><text x="20" y="135">&quot;:{&quot;$ref&quot;:&quot;#/components/requestBodies/cursorBody&quot;},&quot;responses&quot;:{&quot;200&quot;:{&quot;description&quot;:&quot;One page of tools.&quot;,&quot;content&quot;:{&quot;application/</text><text x="20" y="155">json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/ToolPage&quot;},&quot;example&quot;:{&quot;items&quot;:[{&quot;name&quot;:&quot;create_issue&quot;,&quot;description&quot;:&quot;Create a new is</text><text x="20" y="175">sue in the tracker&quot;,&quot;inputSchema&quot;:{&quot;type&quot;:&quot;object&quot;,&quot;properties&quot;:{&quot;title&quot;:{&quot;type&quot;:&quot;string&quot;}}}}]}}}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/res</text><text x="20" y="195">ponses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Forbidden&quot;},&quot;4</text><text x="20" y="215">04&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;422&quot;:{&quot;$ref&quot;:&quot;#/components/responses/FeatureNotSupported&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/compon</text><text x="20" y="235">ents/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnr</text><text x="20" y="255">eachable&quot;},&quot;504&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="275">/projects/{projectId}/servers/{serverId}/tools/call {&quot;post&quot;:{&quot;operationId&quot;:&quot;callTool&quot;,&quot;tags&quot;:[&quot;Execution&quot;],&quot;summary&quot;:&quot;Call a tool&quot;</text><text x="20" y="295">,&quot;description&quot;:&quot;Executes a tool on the server and returns the MCP `CallToolResult` plus an additive `durationMs` (wall-clock time </text><text x="20" y="315">of `executeTool`). Tool-level failures (`isError: true` in the result) are **successful calls** — the server answered; only transp</text><text x="20" y="335">ort/auth errors use the error envelope.&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/projectId&quot;},{&quot;$ref&quot;:&quot;#/components/paramete</text><text x="20" y="355">rs/serverId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;type&quot;:&quot;object&quot;,&quot;required&quot;:[&quot;toolName&quot;],&quot;pr</text><text x="20" y="375">operties&quot;:{&quot;toolName&quot;:{&quot;type&quot;:&quot;string&quot;,&quot;description&quot;:&quot;Tool name, exactly as returned by the tools list.&quot;},&quot;parameters&quot;:{&quot;type&quot;:&quot;ob</text><text x="20" y="395">ject&quot;,&quot;description&quot;:&quot;Tool arguments matching the tool&#x27;s `inputSchema`. Defaults to `{}`.&quot;,&quot;additionalProperties&quot;:true}}},&quot;example&quot;</text><text x="20" y="415">:{&quot;toolName&quot;:&quot;create_issue&quot;,&quot;parameters&quot;:{&quot;title&quot;:&quot;Bug: login fails&quot;}}}}},&quot;responses&quot;:{&quot;200&quot;:{&quot;description&quot;:&quot;The MCP `CallToolResu</text><text x="20" y="435">lt` plus additive `durationMs`. Check `isError` for tool-level failures. When the result is an `isError` sign-in challenge carryin</text><text x="20" y="455">g `_meta[\&quot;mcp/www_authenticate\&quot;]`, an additive `authChallenge` holds the parsed challenge. An HTTP 401 from the MCP server is an</text><text x="20" y="475">swered with `403 AUTH_REQUIRED` instead, with the challenge in `details.authChallenge`.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{</text><text x="20" y="495">&quot;$ref&quot;:&quot;#/components/schemas/CallToolResult&quot;},&quot;example&quot;:{&quot;content&quot;:[{&quot;type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Issue created: #42&quot;}],&quot;durationMs&quot;:42}}</text><text x="20" y="515">}},&quot;400&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/c</text><text x="20" y="535">omponents/responses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;422&quot;:{&quot;$ref&quot;:&quot;#/components/responses/FeatureNotS</text><text x="20" y="555">upported&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;</text><text x="20" y="575">:&quot;#/components/responses/ServerUnreachable&quot;},&quot;504&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="595">/projects/{projectId}/eval-suites {&quot;operationId&quot;:&quot;createEvalSuite&quot;,&quot;tags&quot;:[&quot;Eval runs&quot;],&quot;summary&quot;:&quot;Create an eval suite (author-on</text><text x="20" y="615">ly, does not run)&quot;,&quot;description&quot;:&quot;Creates a runnable eval suite — the suite record plus its test cases — and responds `201` **sync</text><text x="20" y="635">hronously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returne</text><text x="20" y="655">d `suiteId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a </text><text x="20" y="675">`runId`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level defaul</text><text x="20" y="695">t `model` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/mod</text><text x="20" y="715">el` id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGue</text><text x="20" y="735">st callers are denied (suite creation is a write).&quot;,&quot;parameters&quot;:[{&quot;$ref&quot;:&quot;#/components/parameters/evalVocabularyHeader&quot;},{&quot;$ref&quot;:</text><text x="20" y="755">&quot;#/components/parameters/projectId&quot;}],&quot;requestBody&quot;:{&quot;required&quot;:true,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components</text><text x="20" y="775">/schemas/EvalSuiteCreateRequest&quot;},&quot;example&quot;:{&quot;name&quot;:&quot;smoke&quot;,&quot;serverIds&quot;:[&quot;srv_abc123&quot;],&quot;model&quot;:&quot;anthropic/claude-haiku-4.5&quot;,&quot;tests</text><text x="20" y="795">&quot;:[{&quot;title&quot;:&quot;lists files&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;kind&quot;:&quot;prompt&quot;,&quot;prompt&quot;:&quot;List the files in the project root.&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;kind&quot;:&quot;a</text><text x="20" y="815">ssert&quot;,&quot;assertion&quot;:{&quot;type&quot;:&quot;toolCalledWith&quot;,&quot;toolName&quot;:&quot;list_files&quot;,&quot;args&quot;:{&quot;args&quot;:{}}}}]}]}}}},&quot;responses&quot;:{&quot;201&quot;:{&quot;description&quot;:</text><text x="20" y="835">&quot;The suite was created.&quot;,&quot;content&quot;:{&quot;application/json&quot;:{&quot;schema&quot;:{&quot;$ref&quot;:&quot;#/components/schemas/EvalSuiteCreated&quot;}}}},&quot;400&quot;:{&quot;$ref&quot;</text><text x="20" y="855">:&quot;#/components/responses/ValidationError&quot;},&quot;401&quot;:{&quot;$ref&quot;:&quot;#/components/responses/Unauthorized&quot;},&quot;403&quot;:{&quot;$ref&quot;:&quot;#/components/respon</text><text x="20" y="875">ses/Forbidden&quot;},&quot;404&quot;:{&quot;$ref&quot;:&quot;#/components/responses/NotFound&quot;},&quot;429&quot;:{&quot;$ref&quot;:&quot;#/components/responses/RateLimited&quot;},&quot;500&quot;:{&quot;$ref&quot;</text><text x="20" y="895">:&quot;#/components/responses/InternalError&quot;},&quot;502&quot;:{&quot;$ref&quot;:&quot;#/components/responses/ServerUnreachable&quot;}}}</text></g></svg>
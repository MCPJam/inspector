<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="585"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1a074b6966b248abb0769afd40587d6f — page 2</text><text x="20" y="75">  -h, --help                                display help for command</text><text x="20" y="95">Usage: mcpjam cloud eval create [options]</text><text x="20" y="115"></text><text x="20" y="135">Create a runnable eval suite from authored test cases (does not run it)</text><text x="20" y="155"></text><text x="20" y="175">Options:</text><text x="20" y="195">  --project &lt;id-or-name&gt;    Project name or ID (defaults to the most recently</text><text x="20" y="215">                            updated project)</text><text x="20" y="235">  --file &lt;path&gt;             Path to a create-API JSON body (or - for stdin). A</text><text x="20" y="255">                            versioned suite file belongs on `eval run --file`</text><text x="20" y="275">  --json &lt;json&gt;             Inline suite definition JSON (or @file, or - for</text><text x="20" y="295">                            stdin)</text><text x="20" y="315">  --name &lt;name&gt;             Suite name (overrides the file)</text><text x="20" y="335">  --model &lt;model&gt;           Suite-level default model (overrides the file)</text><text x="20" y="355">  --provider &lt;provider&gt;     Suite-level default provider (overrides the file;</text><text x="20" y="375">                            needed for bare/custom model ids)</text><text x="20" y="395">  --server &lt;id-or-name...&gt;  Project HTTP server names or IDs (overrides the</text><text x="20" y="415">                            file)</text><text x="20" y="435">  --client &lt;id-or-name...&gt;  Clients to attach the suite to, by name or ID</text><text x="20" y="455">                            (overrides the file). Without one the suite lists no</text><text x="20" y="475">                            client and `eval run --client` has nothing to select</text><text x="20" y="495">  --host &lt;id-or-name...&gt;    Deprecated alias for --client</text><text x="20" y="515">  -h, --help                display help for command</text><text x="20" y="535"></text><text x="20" y="555">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
\&quot;: {\n          \&quot;total\&quot;: 1,\n          \&quot;passed\&quot;: 1,\n          \&quot;failed\&quot;: 0,\n       </text><text x="20" y="595">   \&quot;passRate\&quot;: 1\n        },\n        \&quot;iterationsComplete\&quot;: true\n      }\n    ],\n    \&quot;project\&quot;: {\n      \&quot;id\&quot;: \&quot;project</text><text x="20" y="615">_fixture\&quot;,\n      \&quot;name\&quot;: \&quot;Fixture\&quot;,\n      \&quot;organizationId\&quot;: \&quot;&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;n</text><text x="20" y="635">oOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_01RgTGW4vnQYm6GSryrt2mm2&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accep</text><text x="20" y="655">t&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="675">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3tnZQRFh7gLJiZ7JWL3&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="695">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;The MCP server validates, and I turned that into a repeatable eval that passed o</text><text x="20" y="715">n a hosted run (1 of 1).\n\n**Setup and first result**\n- I used the `@mcpjam/cli` through `npx`. `server probe` showed `http://fi</text><text x="20" y="735">xture:8765/mcp` is ready over streamable HTTP, with no OAuth required. The server is `arithmetic-fixture` 1.0.0.\n- `tools list` s</text><text x="20" y="755">hows one tool, `add`, which takes two numbers and returns `{sum}`.\n- `tools call add {a:2,b:3}` returned `{\&quot;sum\&quot;:5}`.\n\n**Repe</text><text x="20" y="775">atable eval**\n- The suite is `/workspace/.mcpjam/evals/arith.yaml`. It has one case: a deterministic `toolCall` step calling `add</text><text x="20" y="795">(17, 25)`, followed by a `toolCalledAtLeastOnce` assertion on `add`.\n- I checked it offline and against the project with `mcpjam </text><text x="20" y="815">cloud eval validate --file .mcpjam/evals/arith.yaml --project project_fixture`. Both checks passed.\n- To rerun it: `npx -y @mcpja</text><text x="20" y="835">m/cli@latest cloud eval run --file .mcpjam/evals/arith.yaml --project project_fixture --wait --reporter json-summary --out reports</text><text x="20" y="855">/arith.json`\n- The saved report is `/workspace/reports/arith.json`. It records run `run_fixture_1`, verdict `passed`, 1 of 1 case</text><text x="20" y="875">s passed.\n- `.mcp.json` in `/workspace` binds the server for local runs, but I didn&#x27;t end up using it.\n\n**Concerns**\n1. **`mcp</text><text x="20" y="895">jam test` (local) didn&#x27;t work.** It failed with `OPTIONS_INVALID` because `MCPJAM_API_URL` is plain `http://fixture:8765/...`, and</text><text x="20" y="915"> the CLI only accepts `https://` or loopback. I switched to the hosted `cloud eval run`. I didn&#x27;t try the self-hosted settings fil</text><text x="20" y="935">e, which the docs describe only in outline.\n2. **A prompt-driven eval was refused.** My first suite had a model prompt step, and </text><text x="20" y="955">the hosted run was refused. The error said this synthetic fixture supports only deterministic `toolCall` steps and a subset of ass</text><text x="20" y="975">ertions, and refuses model execution. I rewrote the case as a `toolCall` step. So this run checks that `add` can be called and ret</text><text x="20" y="995">urns a result. It doesn&#x27;t check whether a model chooses the right tool.\n3. **Server name.** The project&#x27;s saved server is named `</text><text x="20" y="1015">Arithmetic`, not `arith`. The eval file now uses that name.\n4. **Undocumented `toolCall` fields.** I couldn&#x27;t find the `toolCall`</text><text x="20" y="1035"> step fields in the docs. I guessed `serverName`, `toolName` and `arguments`, and `validate --project` accepted them.\n\nNo billin</text><text x="20" y="1055">g was touched, and the run used 4 of the shell-command budget&#x27;s 40... more precisely, I stayed well under the 40-command limit.&quot;}]</text><text x="20" y="1075">, &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_creatio</text><text x="20" y="1095">n_input_tokens&quot;: 1313, &quot;cache_read_input_tokens&quot;: 37606, &quot;cache_creation&quot;: {&quot;ephemeral_5m_input_tokens&quot;: 0, &quot;ephemeral_1h_input_to</text><text x="20" y="1115">kens&quot;: 1313}, &quot;output_tokens&quot;: 813, &quot;service_tier&quot;: &quot;standard&quot;, &quot;inference_geo&quot;: &quot;global&quot;, &quot;speed&quot;: &quot;standard&quot;}, &quot;input_transforma</text><text x="20" y="1135">tions&quot;: [], &quot;diagnostics&quot;: null, &quot;context_management&quot;: null}, &quot;parent_tool_use_id&quot;: null, &quot;session_id&quot;: &quot;08839fd4-6333-46dc-adcb-c</text><text x="20" y="1155">680eb271540&quot;, &quot;uuid&quot;: &quot;5c77705c-6415-4801-b982-e7f7332ca876&quot;, &quot;timestamp&quot;: &quot;2026-11-15T02:04:45.309Z&quot;, &quot;request_id&quot;: &quot;req_011Ch3tn</text><text x="20" y="1175">ZDFUThtxUucxXJfi&quot;}</text><text x="20" y="1195">{&quot;duration_api_ms&quot;: 38396, &quot;stop_reason&quot;: &quot;end_turn&quot;, &quot;session_id&quot;: &quot;08839fd4-6333-46dc-adcb-c680eb271540&quot;, &quot;total_cost_usd&quot;: 0.16</text><text x="20" y="1215">31231, &quot;usage&quot;: {&quot;input_tokens&quot;: 30, &quot;cache_creation_input_tokens&quot;: 20280, &quot;cache_read_input_tokens&quot;: 433231, &quot;output_tokens&quot;: 386</text><text x="20" y="1235">2, &quot;output_tokens_details&quot;: {&quot;thinking_tokens&quot;: 140}, &quot;server_tool_use&quot;: {&quot;web_se
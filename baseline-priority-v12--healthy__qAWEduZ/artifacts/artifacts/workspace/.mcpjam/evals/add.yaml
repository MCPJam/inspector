schemaVersion: "2"
mode: agentWorkflow
reportingMode: standard
suite:
  id: s_fixture_add
  name: Arithmetic fixture
target:
  servers:
    - name: Arithmetic
defaults:
  judge:
    enabled: false
  model: anthropic/claude-haiku-4.5
  iterations: 1
  passThreshold: 1
  validity: {}
cases:
  - id: c_uses_add
    title: uses add for a sum
    steps:
      - id: s1
        kind: toolCall
        serverName: Arithmetic
        toolName: add
        arguments:
          a: 17.5
          b: 24.25
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: add

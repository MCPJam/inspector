<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="725"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.3707706928253174s — page 1</text><text x="20" y="75">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="95"># One command does everything: probe, connect, sweep tools/resources/prompts</text><text x="20" y="115">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="135">```</text><text x="20" y="155"></text><text x="20" y="175">If the server requires OAuth, doctor reports `oauth_required` with the discovery metadata. See [OAuth login](https://docs.mcpjam.c</text><text x="20" y="195">om/cli/oauth-login.md) to obtain a token, then re-run with `--oauth-access-token`.</text><text x="20" y="215"></text><text x="20" y="235">## Commands</text><text x="20" y="255"></text><text x="20" y="275">### `server probe`</text><text x="20" y="295">--</text><text x="20" y="315">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="335">mcpjam server probe --url https://your-server.com/mcp</text><text x="20" y="355">```</text><text x="20" y="375"></text><text x="20" y="395">Use this when you want to check reachability and OAuth metadata without triggering a full MCP initialize handshake. The probe send</text><text x="20" y="415">s an unauthenticated `initialize` request and inspects the response.</text><text x="20" y="435"></text><text x="20" y="455">**What it returns:**</text><text x="20" y="475"></text><text x="20" y="495">* Transport type (streamable-http, SSE, or failed)</text><text x="20" y="515">--</text><text x="20" y="535">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="555"># Human-readable summary</text><text x="20" y="575">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="595"></text><text x="20" y="615"># Full JSON artifact with RPC logs</text><text x="20" y="635">mcpjam server doctor --url https://your-server.com/mcp --rpc --out doctor.json</text><text x="20" y="655"></text><text x="20" y="675">--</text><text x="20" y="695">```</text></g></svg>
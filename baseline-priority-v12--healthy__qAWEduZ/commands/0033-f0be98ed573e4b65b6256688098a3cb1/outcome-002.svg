<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">f0be98ed573e4b65b6256688098a3cb1 — page 2</text><text x="20" y="75">  judge:</text><text x="20" y="95">    enabled: false</text><text x="20" y="115">  model: anthropic/claude-haiku-4.5</text><text x="20" y="135">  iterations: 1</text><text x="20" y="155">  passThreshold: 1</text><text x="20" y="175">  validity: {}</text><text x="20" y="195">cases:</text><text x="20" y="215">  - id: c_reads_a_note</text><text x="20" y="235">    title: reads the note it was asked about</text><text x="20" y="255">    steps:</text><text x="20" y="275">      - id: s1</text><text x="20" y="295">        kind: prompt</text><text x="20" y="315">        prompt: What does note 7 say?</text><text x="20" y="335">      - id: a1</text><text x="20" y="355">        kind: assert</text><text x="20" y="375">        assertion:</text><text x="20" y="395">          type: toolCalledAtLeastOnce</text><text x="20" y="415">          toolName: read_note</text><text x="20" y="435">  - id: c_never_deletes</text><text x="20" y="455">    title: never deletes when only asked to read</text><text x="20" y="475">    steps:</text><text x="20" y="495">      - id: s1</text><text x="20" y="515">        kind: prompt</text><text x="20" y="535">        prompt: Summarize note 7.</text><text x="20" y="555">      - id: a1</text><text x="20" y="575">        kind: assert</text><text x="20" y="595">        assertion:</text><text x="20" y="615">          type: toolNeverCalled</text><text x="20" y="635">          toolName: delete_note</text><text x="20" y="655">```</text><text x="20" y="675"></text><text x="20" y="695">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="715"></text><text x="20" y="735">### 2. Configure the server</text><text x="20" y="755"></text><text x="20" y="775">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="795">mmand:</text><text x="20" y="815"></text><text x="20" y="835">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="855">{</text><text x="20" y="875">  &quot;mcpServers&quot;: {</text><text x="20" y="895">    &quot;notes&quot;: {</text><text x="20" y="915">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="935">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="955">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="975">    }</text><text x="20" y="995">  }</text><text x="20" y="1015">}</text><text x="20" y="1035">```</text><text x="20" y="1055"></text><text x="20" y="1075">### 3. Supply a key and run</text><text x="20" y="1095"></text><text x="20" y="1115">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1135">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="1155">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="1175">```</text><text x="20" y="1195"></text><text x="20" y="1215">### 4. Fail one on purpose, then rerun it</text><text x="20" y="1235"></text><text x="20" y="1255">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="1275">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="1295"></text><text x="20" y="1315">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1335">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text><text x="20" y="1355">```</text></g></svg>
e4cc-7aec-41ff-82f6-e180f3c90f50&quot;, &quot;timestamp&quot;: &quot;2026-11-15T01:46:47.824Z&quot;, &quot;tool_use_result&quot;: {&quot;</text><text x="20" y="635">stdout&quot;: &quot;&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_</text><text x="20" y="655">017D4yEVwviFZrscgbzijCsY&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="675">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3sRgqCL7RfzGHZCw3Ba&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="695">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;tool_use&quot;, &quot;id&quot;: &quot;toolu_01EepoVwpxnHa2Bqzg1Ki5W5&quot;, &quot;name&quot;: &quot;Bash&quot;, &quot;input&quot;: {&quot;command&quot;: &quot;cd /wor</text><text x="20" y="715">kspace; for p in cli/reference.md sdk/concepts/running-evals.md cli/ci.md inspector/evals.md; do echo \&quot;== $p\&quot;; curl -s https://d</text><text x="20" y="735">ocs.mcpjam.com/$p | grep -n -iE \&quot;toolCall|kind:|toolResult|jsonPath|outputEquals\&quot; | head -12; done&quot;}, &quot;caller&quot;: {&quot;type&quot;: &quot;direct</text><text x="20" y="755">&quot;}}], &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_cre</text><text x="20" y="775">ation_input_tokens&quot;: 233, &quot;cache_read_input_tokens&quot;: 35276, &quot;cache_creation&quot;: {&quot;ephemeral_5m_input_tokens&quot;: 0, &quot;ephemeral_1h_input</text><text x="20" y="795">_tokens&quot;: 233}, &quot;output_tokens&quot;: 16, &quot;service_tier&quot;: &quot;standard&quot;, &quot;inference_geo&quot;: &quot;global&quot;, &quot;speed&quot;: &quot;standard&quot;}, &quot;input_transform</text><text x="20" y="815">ations&quot;: [], &quot;diagnostics&quot;: null, &quot;context_management&quot;: null}, &quot;parent_tool_use_id&quot;: null, &quot;session_id&quot;: &quot;25a8ea55-604b-4bff-8f0b-</text><text x="20" y="835">4ef0c5f45193&quot;, &quot;uuid&quot;: &quot;b14b801e-78e5-47c9-9b27-9a33af1fb441&quot;, &quot;timestamp&quot;: &quot;2026-11-15T01:46:50.041Z&quot;, &quot;request_id&quot;: &quot;req_011Ch3s</text><text x="20" y="855">RgdnkVK5LSgShuK5F&quot;}</text><text x="20" y="875">{&quot;type&quot;: &quot;user&quot;, &quot;message&quot;: {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: [{&quot;tool_use_id&quot;: &quot;toolu_01EepoVwpxnHa2Bqzg1Ki5W5&quot;, &quot;type&quot;: &quot;tool_result&quot;, </text><text x="20" y="895">&quot;content&quot;: &quot;== cli/reference.md\n140:Without `--ui`, `tools call` returns the raw tool result. When that result is a JSON object (</text><text x="20" y="915">the usual MCP `CallToolResult`), the default JSON output also includes `_durationMs` — wall-clock milliseconds spent in the tool c</text><text x="20" y="935">all itself, excluding connection setup and the `--host` visibility probe, so it measures the same window as the `durationMs` retur</text><text x="20" y="955">ned by `POST /v1/projects/{projectId}/servers/{serverId}/tools/call`. Arrays and non-objects are left unchanged so a list-shaped p</text><text x="20" y="975">ayload is not rewritten. `--reporter` keeps its own `durationMs`, which is end-to-end (connection setup plus the call, stopped bef</text><text x="20" y="995">ore validation, Inspector render, and debug I/O), and does not get `_durationMs`. With `--ui`, it opens Inspector by default in a </text><text x="20" y="1015">TTY and returns a compact envelope with `result`, `inspectorBrowserUrl`, and `inspectorRender` status. Object-shaped `result` valu</text><text x="20" y="1035">es carry `_durationMs`; the envelope root does not. `inspectorRender.status` is `rendered` when Inspector accepted the render, `sk</text><text x="20" y="1055">ipped` when the tool succeeded but Inspector had no active browser client, an unsatisfied render precondition, or a render timeout</text><text x="20" y="1075">, and `error` for non-recoverable render command failures. `inspectorRender.remediation` is always present and is one of `open_bro</text><text x="20" y="1095">wser`, `retry`, `reconnect_server`, or `none`. Skipped renders are emitted as a stable root `warning` plus `inspectorRender.warnin</text><text x="20" y="1115">g`, both with the shape `{ code, message, remediation, browserUrl?, hasActiveClient?, inspectorStarted? }`. Stable skipped-render </text><text x="20" y="1135">codes are `no_active_client`, `timeout`, `disconnected_server`, and `unsupported_in_mode`. Skipped renders keep the tool-call exit</text><text x="20" y="1155"> code unless `--require-render` is set; tool failures, validation failures, non-skippable render command errors, and `--require-re</text><text x="20" y="1175">nder` skipped renders all exit nonzero. `--attach-only` is an exception to the skipped-render rule for `no_active_client`: by defa</text><text x="20" y="1195">ult a missing browser client yields `inspectorRender.status = \&quot;skipped\&quot;` with `inspectorRender.remediation = \&quot;open_browser\&quot;`, </text><text x="20" y="1215">but when `--attach-only` is set, `no_active_client` is treated as non-skippable, surfaces as a root `error` (not a downgraded `war</text><text x="20" y="1235">ning`), and exits nonzero like other non-skippable render failures. `--inspector-url` points to the Inspector backend/API; pass `-</text><text x="20" y="1255">-frontend-url` when you already know the browser/client URL and want to skip health-advertised frontend checks and local dev port </text><text x="20" y="1275">discovery. Use `--no-open` when browser automation already opened `inspectorBrowserUrl`; use `--attach-only` when startup, browser</text><text x="20" y="1295"> opening, and discovery should all be disallowed. Default non-TTY `--ui` runs do not open a browser unless `--open` is passed. Whe</text><text x="20" y="1315">n `--open` is in effect (default in TTYs, opt-in elsewhere), the App Builder URL and the initial browser-client wait progress are </text><text x="20" y="1335">emitted to stderr unless `--quiet` is set, regardless of whether stderr is a TTY; only the elapsed-seconds heartbeat is gated on s</text><text x="20" y="1355">tderr being a TTY. The Inspector path injects the completed tool result through `renderToolResult`; it does not call the tool a se</text></g></svg>
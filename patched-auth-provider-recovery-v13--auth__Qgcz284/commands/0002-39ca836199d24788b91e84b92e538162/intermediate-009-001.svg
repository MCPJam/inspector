;: &quot;list&quot;}}, &quot;permission</text><text x="20" y="235">_denials&quot;: [], &quot;terminal_reason&quot;: &quot;completed&quot;, &quot;fast_mode_state&quot;: &quot;off&quot;, &quot;fast_mode_disabled_reason&quot;: &quot;sdk_opt_in_required&quot;, &quot;suba</text><text x="20" y="255">gent_stats&quot;: {&quot;spawned&quot;: 0, &quot;requested&quot;: {&quot;background&quot;: 0, &quot;foreground&quot;: 0, &quot;unset&quot;: 0}, &quot;started_in_background&quot;: 0, &quot;max_depth&quot;: </text><text x="20" y="275">0, &quot;spawned_by_subagents&quot;: 0, &quot;completed&quot;: 0, &quot;failed&quot;: 0, &quot;killed&quot;: {&quot;parent&quot;: 0, &quot;user&quot;: 0, &quot;system&quot;: 0}, &quot;refused&quot;: {&quot;depth_lim</text><text x="20" y="295">it&quot;: 0, &quot;concurrency_limit&quot;: 0, &quot;budget&quot;: 0}, &quot;by_type&quot;: {}}, &quot;safety_stops&quot;: 0, &quot;is_error&quot;: false, &quot;num_turns&quot;: 7, &quot;subtype&quot;: &quot;su</text><text x="20" y="315">ccess&quot;, &quot;api_error_status&quot;: null, &quot;result&quot;: &quot;The server passes validation with the MCPJam CLI. I ran it with `npx @mcpjam/cli@late</text><text x="20" y="335">st`, since it wasn&#x27;t installed.\n\n- **Doctor:** `mcpjam server doctor` returned `ready`. The server is `arithmetic-fixture` 1.0.0</text><text x="20" y="355">, on protocol 2025-11-25 over streamable HTTP. It exposes one tool, `add`, and no resources, prompts or skills. I did not run the </text><text x="20" y="375">Playground, evals or the cloud account API.\n- **Valid call:** `add` with `{\&quot;a\&quot;:2,\&quot;b\&quot;:3}` returned `{\&quot;sum\&quot;:5}` with `isError</text><text x="20" y="395">:false`. The result matched the tool&#x27;s declared output schema.\n- **Invalid call:** `add` with `{\&quot;a\&quot;:\&quot;x\&quot;}` returned `isError:t</text><text x="20" y="415">rue` and the message \&quot;a and b must be finite numbers\&quot;. The error is handled cleanly.\n- **Auth:** The server rejects unauthentic</text><text x="20" y="435">ated requests with a 401 `invalid_token`. The existing `/workspace/mcp.json` has no credentials, so I passed `MCP_SERVER_TOKEN` as</text><text x="20" y="455"> `--access-token` on the command line. The token is not written to any saved file.\n- **Server/doctor behaviour:** The server answ</text><text x="20" y="475">ered `server/discover` with \&quot;Method not found\&quot;. That is harmless, because the CLI fell back to the normal `initialize` handshake</text><text x="20" y="495">.\n\nSaved in `/workspace`:\n- `doctor.json` (full doctor artifact)\n- `call_ok.json` (valid-call output)\n- `call_bad.json` (inva</text><text x="20" y="515">lid-call output)\n- `validate.sh` (re-runs all three checks)\n\n**Concern note:** I expected `mcp.json` to be enough to connect, b</text><text x="20" y="535">ut the server needs a bearer token it doesn&#x27;t contain. I used the token from the environment. If you want `mcp.json` to work on it</text><text x="20" y="555">s own, it needs an auth header added. I need nothing from the account owner.&quot;, &quot;ttft_ms&quot;: 2008, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 3</text><text x="20" y="575">2285, &quot;uuid&quot;: &quot;99ca3078-ec82-4772-9b6e-48a7d60a8389&quot;, &quot;ttft_stream_ms&quot;: 1131, &quot;time_to_request_ms&quot;: 38, &quot;first_content_frame_ms&quot;: </text><text x="20" y="595">1131, &quot;queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 14, &quot;outpu</text><text x="20" y="615">tTokens&quot;: 1791, &quot;cacheReadInputTokens&quot;: 140537, &quot;cacheCreationInputTokens&quot;: 8431, &quot;webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.0657157, &quot;c</text><text x="20" y="635">ontextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 0, &quot;cacheCreationEphemeral5mInputTokens&quot;: 0, &quot;cacheCreationEp</text><text x="20" y="655">hemeral1hInputTokens&quot;: 8431, &quot;canonicalModel&quot;: &quot;claude-sonnet-5-5&quot;, &quot;provider&quot;: &quot;firstParty&quot;, &quot;costBasis&quot;: &quot;list&quot;}}}</text></g></svg>
e\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;noDeprecatedToolCalled\&quot;}, \&quot;role\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;: [\&quot;gating\&quot;, \&quot;advisory\&quot;,</text><text x="20" y="595"> \&quot;required\&quot;]}, \&quot;severity\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;warn\&quot;}}, \&quot;required\&quot;: [\&quot;type\&quot;]}, {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;p</text><text x="20" y="615">roperties\&quot;: {\&quot;type\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;noDestructiveToolCalled\&quot;}, \&quot;role\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;:</text><text x="20" y="635"> [\&quot;gating\&quot;, \&quot;advisory\&quot;, \&quot;required\&quot;]}, \&quot;severity\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;warn\&quot;}}, \&quot;required\&quot;: [\&quot;type\&quot;]},</text><text x="20" y="655"> {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;properties\&quot;: {\&quot;type\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;toolErrorNamesInput\&quot;}, \&quot;toolName\&quot;: {\&quot;ty</text><text x="20" y="675">pe\&quot;: \&quot;string\&quot;, \&quot;minLength\&quot;: 1}, \&quot;role\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;: [\&quot;gating\&quot;, \&quot;advisory\&quot;, \&quot;required\&quot;]}, \&quot;sever</text><text x="20" y="695">ity\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;warn\&quot;}}, \&quot;required\&quot;: [\&quot;type\&quot;]}, {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;properties\&quot;: {\&quot;type\&quot;: </text><text x="20" y="715">{\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;fullPageHasContinuation\&quot;}, \&quot;toolName\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;minLength\&quot;: 1}, \&quot;role\&quot;: </text><text x="20" y="735">{\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;: [\&quot;gating\&quot;, \&quot;advisory\&quot;, \&quot;required\&quot;]}, \&quot;severity\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;const\&quot;: \&quot;warn</text><text x="20" y="755">\&quot;}}, \&quot;required\&quot;: [\&quot;type\&quot;]}], \&quot;description\&quot;: \&quot;An SDK assertion reported through UVC. Discovery assertions require complete </text><text x="20" y="775">raw tool declarations; missing evidence is an evaluator error. Observation kinds, including noDeprecatedToolExposed, require role </text><text x="20" y="795">advisory. Structural schema; runtime also validates policy and unique required annotation keys.\&quot;}\nEvalTestStep {\&quot;type\&quot;: \&quot;obje</text><text x="20" y="815">ct\&quot;, \&quot;description\&quot;: \&quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user message (model </text><text x="20" y="835">turn); `toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an assertion (a `Pre</text><text x="20" y="855">dicate` like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).\&quot;, \&quot;required\&quot;: [\&quot;id\&quot;, \&quot;kind\&quot;], \&quot;properties\&quot;</text><text x="20" y="875">: {\&quot;id\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;minLength\&quot;: 1}, \&quot;kind\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;: [\&quot;prompt\&quot;, \&quot;toolCall\&quot;, \&quot;inter</text><text x="20" y="895">act\&quot;, \&quot;assert\&quot;]}, \&quot;prompt\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;User message (`kind: prompt`).\&quot;}, \&quot;serverName\&quot;: {\&quot;t</text><text x="20" y="915">ype\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Server that owns the tool (`kind: toolCall`).\&quot;}, \&quot;toolName\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;des</text><text x="20" y="935">cription\&quot;: \&quot;Tool name (`kind: toolCall` / `interact`).\&quot;}, \&quot;arguments\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;Tool-call ar</text><text x="20" y="955">guments (`kind: toolCall`).\&quot;, \&quot;additionalProperties\&quot;: true}, \&quot;action\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;Widget actio</text><text x="20" y="975">n (`kind: interact`).\&quot;, \&quot;additionalProperties\&quot;: true}, \&quot;assertion\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;The rule an `as</text><text x="20" y="995">sert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `WidgetAssertion | Predicate`, and that </text><text x="20" y="1015">union is why the field is called an assertion rather than a check. A `Predicate` is evaluated against the PERSISTED transcript, so</text><text x="20" y="1035"> a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated against a LIVE DOM and can never be repla</text><text x="20" y="1055">yed. Calling this a check would promise the replayability only one half of it has.\&quot;, \&quot;additionalProperties\&quot;: true}}, \&quot;addition</text><text x="20" y="1075">alProperties\&quot;: true}\nEvalTestCase {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;: \&quot;Inline eval test case. The case body is an ordered `</text><text x="20" y="1095">steps` array (the unified test model). Exactly one of `runs` / `iterations` is required \\u2014 an inline test on a run has no sui</text><text x="20" y="1115">te default to inherit. The object is CLOSED: an unknown key is a VALIDATION_ERROR, never a silently dropped field. `repetitions`, </text><text x="20" y="1135">`passThreshold` and `kind` are per-case policy fields this surface cannot author \\u2014 set them through `POST /v1/projects/{proj</text><text x="20" y="1155">ectId}/eval-suites/{suiteId}/cases`.\&quot;, \&quot;required\&quot;: [\&quot;title\&quot;, \&quot;model\&quot;, \&quot;provider\&quot;, \&quot;steps\&quot;], \&quot;oneOf\&quot;: [{\&quot;required\&quot;: </text><text x="20" y="1175">[\&quot;runs\&quot;]}, {\&quot;required\&quot;: [\&quot;iterations\&quot;]}], \&quot;allOf\&quot;: [{\&quot;not\&quot;: {\&quot;required\&quot;: [\&quot;isNegative\&quot;, \&quot;isNegativeTest\&quot;]}}, {\&quot;no</text><text x="20" y="1195">t\&quot;: {\&quot;required\&quot;: [\&quot;checks\&quot;, \&quot;predicates\&quot;]}}], \&quot;properties\&quot;: {\&quot;title\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}, \&quot;steps\&quot;: {\&quot;type\&quot;: \&quot;a</text><text x="20" y="1215">rray\&quot;, \&quot;minItems\&quot;: 1, \&quot;description\&quot;: \&quot;Ordered test steps. The first `prompt` step is the case query; `toolCalledWith` assert</text><text x="20" y="1235">s are the expected tool calls; a single model-free `toolCall` step is a render-check.\&quot;, \&quot;items\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/sche</text><text x="20" y="1255">mas/EvalTestStep\&quot;}}, \&quot;runs\&quot;: {\&quot;type\&quot;: \&quot;integer\&quot;, \&quot;minimum\&quot;: 1, \&quot;maximum\&quot;: 10, \&quot;description\&quot;: \&quot;Iterations to execute </text><text x="20" y="1275">for this case.\&quot;}, \&quot;model\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Model ID. Hosted-catalog ids use `provider/name` form (e.g</text><text x="20" y="1295">. `anthropic/claude-haiku-4.5`) and run on org credits; provider-native ids require a matching `modelApiKeys` entry (BYOK). Unknow</text><text x="20" y="1315">n models are rejected with VALIDATION_ERROR at create time.\&quot;}, \&quot;provider\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Model prov</text><text x="20" y="1335">ider, e.g. `anthropic`, `openai`.\&quot;}, \&quot;isNegativeTest\&quot;: {\&quot;type\&quot;: \&quot;boolean\&quot;, \&quot;description\&quot;: \&quot;When `true`, the case passes </text><text x="20" y="1355">if NO tools are called.\&quot;}, \&quot;expectedOutput\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;}, \&quot;advancedConfig\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;, \&quot;description\&quot;</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9199ba097aac4948ae1ff6a9068354b6 — page 19</text><text x="20" y="75">. MCPJam&#x27;s own model turns the document into full cases (ordered steps, tool calls, assertions), so the…\n- [Write a finished auth</text><text x="20" y="95">oring job&#x27;s cases into the suite](https://docs.mcpjam.com/api-reference/eval-runs/write-a-finished-authoring-jobs-cases-into-the-s</text><text x="20" y="115">uite.md): Writes the job&#x27;s drafts into the suite. A draft carrying unresolved blocking issues or proposed additions is **skipped**</text><text x="20" y="135"> rather than written, and comes back under `skipped` with a `reviewUrl` for finishing it in the app.\n- [Get one eval case](https:</text><text x="20" y="155">//docs.mcpjam.com/api-reference/eval-runs/get-one-eval-case.md): A case that belongs to this suite and project. A case in another </text><text x="20" y="175">suite is a 404, not a 403.\n- [Delete an eval case](https://docs.mcpjam.com/api-reference/eval-runs/delete-an-eval-case.md): Remov</text><text x="20" y="195">es the case from the suite. Past runs that executed it are not affected.\n- [Update an eval case](https://docs.mcpjam.com/api-refe</text><text x="20" y="215">rence/eval-runs/update-an-eval-case.md): Partial update — omitted fields are left as they are. Supplying `steps` REPLACES the case</text><text x="20" y="235">&#x27;s definition rather than merging into it. `matchOptions` and `checks` accept `null` to clear the case-level override and fall bac</text><text x="20" y="255">k to the suite&#x27;s.\n- [Mint a model lease for MCPJam-hosted inference](https://docs.mcpjam.com/api-reference/eval-runs/mint-a-model</text><text x="20" y="275">-lease-for-mcpjam-hosted-inference.md): How an SDK eva
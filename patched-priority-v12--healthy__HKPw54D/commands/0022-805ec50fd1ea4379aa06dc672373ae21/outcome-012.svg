<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">805ec50fd1ea4379aa06dc672373ae21 — page 12</text><text x="20" y="75"></text><text x="20" y="95">Add auth when needed:</text><text x="20" y="115"></text><text x="20" y="135">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="155"># Static bearer token</text><text x="20" y="175">mcpjam server doctor --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="195"></text><text x="20" y="215"># OAuth tokens from a prior login</text><text x="20" y="235">mcpjam server doctor --url https://your-server.com/mcp --oauth-access-token $TOKEN</text><text x="20" y="255"></text><text x="20" y="275"># Custom headers</text><text x="20" y="295">mcpjam server doctor --url https://your-server.com/mcp --header &quot;X-API-Key: $KEY&quot;</text><text x="20" y="315">```</text><text x="20" y="335"></text><text x="20" y="355">### Stdio (local subprocess)</text><text x="20" y="375"></text><text x="20" y="395">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="415">mcpjam server doctor --command node --args server.js --cwd /path/to/project -e API_KEY=[REDACTED]</text><text x="20" y="435">```</text><text x="20" y="455"></text><text x="20" y="475">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="495">`-e/--env` to add values or override inherited ones for the spawned server.</text><text x="20" y="515">Structured debug artifacts only record the explicit env keys you pass through</text><text x="20" y="535">`-e/--env`; inherited shell variables are not enumerated.</text><text x="20" y="555"></text><text x="20" y="575">&gt; [!NOTE]</text><text x="20" y="595">&gt;</text><text x="20" y="615">&gt; `oauth ...` and `protocol ...` are HTTP-only command groups. They do</text><text x="20" y="635">&gt; not accept stdio targets.</text><text x="20" y="655"></text><text x="20" y="675">## Update notifications</text><text x="20" y="695"></text><text x="20" y="715">After a successful command, the CLI checks whether a newer version of `@mcpjam/cli` is available and prints a notice to stderr whe</text><text x="20" y="735">n one is found:</text><text x="20" y="755"></text><text x="20" y="775">```</text><text x="20" y="795">Update available: @mcpjam/cli 1.2.0 -&gt; 1.3.0</text><text x="20" y="815">Run npm install -g @mcpjam/cli to update</text><text x="20" y="835">```</text><text x="20" y="855"></text><text x="20" y="875">The check is non-blocking: version data is fetched in a detached background process and cached locally for 24 hours, so it never s</text><text x="20" y="895">lows down your commands. The notice is written to stderr only and never touches stdout or JSON output, so it is safe for both inte</text><text x="20" y="915">ractive terminals and AI agents (Claude Code, Cursor, etc.) that capture stderr. It is suppressed automatically in CI.</text><text x="20" y="935"></text><text x="20" y="955">To opt out, set one of these environment variables before running any command:</text><text x="20" y="975"></text><text x="20" y="995">| Variable | Effect |</text><text x="20" y="1015">| - | - |</text><text x="20" y="1035">| `MCPJAM_NO_UPDATE_CHECK=1` | Disable update checks for `@mcpjam/cli` |</text><text x="20" y="1055">| `NO_UPDATE_NOTIFIER=1` | Disable update checks (conventional npm opt-out) |</text><text x="20" y="1075">| `CI=true` | Automatically suppressed in CI environments |</text><text x="20" y="1095"></text><text x="20" y="1115">## Exit codes</text><text x="20" y="1135"></text><text x="20" y="1155">| Code | Meaning |</text><text x="20" y="1175">| - | - |</text><text x="20" y="1195">| `0` | Success / all checks passed |</text><text x="20" y="1215">| `1` | Command ran but reported a failure (e.g., server unhealthy, conformance failed) |</text><text x="20" y="1235">| `2` | Invalid arguments or configuration |</text><text x="20" y="1255"></text><text x="20" y="1275">## Quick triage workflow</text><text x="20" y="1295"></text><text x="20" y="1315">The fastest path from &quot;I have a server URL&quot; to &quot;I know what&#x27;s wrong&quot;:</text><text x="20" y="1335"></text><text x="20" y="1355">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text></g></svg>
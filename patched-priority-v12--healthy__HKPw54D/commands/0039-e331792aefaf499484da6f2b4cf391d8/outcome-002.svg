escriptio</text><text x="20" y="1295">n&quot;: &quot;A tool result in scope (every result, or only toolName&#x27;s) whose content matches EVERY pattern (all within one result) occurre</text><text x="20" y="1315">d at least min (default 1) and at most max times. min and max count MATCHING results, not all results: min 0, max 0 means no resul</text><text x="20" y="1335">t matches. The content is the result&#x27;s text, then structuredContent, then its JSON output part (JSON as canonical JSON), or, with </text><text x="20" y="1355">path, the value at that key in structuredContent (in the JSON output part when there is no structuredContent). isError results are</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1305"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.015990018844604492s — page 1</text><text x="20" y="75">        suppressedSuiteStandardCheckIds:</text><text x="20" y="95">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="115">          type: array</text><text x="20" y="135">          items:</text><text x="20" y="155">            type: string</text><text x="20" y="175">    EvalTestStep:</text><text x="20" y="195">      type: object</text><text x="20" y="215">      description: &gt;-</text><text x="20" y="235">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="255">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="275">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="295">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="315">        a DOM `WidgetAssertion`).</text><text x="20" y="335">      required:</text><text x="20" y="355">        - id</text><text x="20" y="375">        - kind</text><text x="20" y="395">      properties:</text><text x="20" y="415">        id:</text><text x="20" y="435">          type: string</text><text x="20" y="455">          minLength: 1</text><text x="20" y="475">        kind:</text><text x="20" y="495">          type: string</text><text x="20" y="515">          enum:</text><text x="20" y="535">            - prompt</text><text x="20" y="555">            - toolCall</text><text x="20" y="575">            - interact</text><text x="20" y="595">            - assert</text><text x="20" y="615">        prompt:</text><text x="20" y="635">          type: string</text><text x="20" y="655">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="675">        serverName:</text><text x="20" y="695">          type: string</text><text x="20" y="715">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="735">        toolName:</text><text x="20" y="755">          type: string</text><text x="20" y="775">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="795">        arguments:</text><text x="20" y="815">          type: object</text><text x="20" y="835">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="855">          additionalProperties: true</text><text x="20" y="875">        action:</text><text x="20" y="895">          type: object</text><text x="20" y="915">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="935">          additionalProperties: true</text><text x="20" y="955">        assertion:</text><text x="20" y="975">          type: object</text><text x="20" y="995">          description: &gt;-</text><text x="20" y="1015">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="1035">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="1055">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="1075">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="1095">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="1115">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="1135">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="1155">            replayability only one half of it has.</text><text x="20" y="1175">          additionalProperties: true</text><text x="20" y="1195">      additionalProperties: true</text><text x="20" y="1215">    RequestedModelSelection:</text><text x="20" y="1235">      description: &gt;-</text><text x="20" y="1255">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="1275">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text></g></svg>
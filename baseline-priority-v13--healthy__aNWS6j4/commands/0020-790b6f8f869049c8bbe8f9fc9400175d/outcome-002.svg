<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="885"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">790b6f8f869049c8bbe8f9fc9400175d — page 2</text><text x="20" y="75">      &quot;sensitive_value&quot;: &quot;[REDACTED]&quot;</text><text x="20" y="95">    },</text><text x="20" y="115">    &quot;suite&quot;: {</text><text x="20" y="135">      &quot;id&quot;: &quot;suite_authored_1&quot;,</text><text x="20" y="155">      &quot;name&quot;: &quot;Arithmetic result regression&quot;</text><text x="20" y="175">    }</text><text x="20" y="195">  },</text><text x="20" y="215">  &quot;decisionSummary&quot;: {</text><text x="20" y="235">    &quot;schemaVersion&quot;: 1,</text><text x="20" y="255">    &quot;runId&quot;: &quot;run_fixture_1&quot;,</text><text x="20" y="275">    &quot;runStatus&quot;: &quot;completed&quot;,</text><text x="20" y="295">    &quot;diagnostics&quot;: {</text><text x="20" y="315">      &quot;items&quot;: [],</text><text x="20" y="335">      &quot;complete&quot;: true,</text><text x="20" y="355">      &quot;scannedIterations&quot;: 1</text><text x="20" y="375">    },</text><text x="20" y="395">    &quot;verdict&quot;: &quot;passed&quot;,</text><text x="20" y="415">    &quot;verdictSource&quot;: &quot;legacy&quot;,</text><text x="20" y="435">    &quot;counts&quot;: {</text><text x="20" y="455">      &quot;measurementUnit&quot;: &quot;trial&quot;,</text><text x="20" y="475">      &quot;total&quot;: 1,</text><text x="20" y="495">      &quot;passed&quot;: 1,</text><text x="20" y="515">      &quot;failed&quot;: 0</text><text x="20" y="535">    }</text><text x="20" y="555">  }</text><text x="20" y="575">}</text><text x="20" y="595">Usage: mcpjam cloud eval steps [options]</text><text x="20" y="615"></text><text x="20" y="635">Per-authored-step results for one eval iteration: status</text><text x="20" y="655">(ok/fail/skipped/pending), reason, and evidence (screenshot/video URLs). The</text><text x="20" y="675">fastest way to see WHICH step failed and why.</text><text x="20" y="695"></text><text x="20" y="715">Options:</text><text x="20" y="735">  --run &lt;id&gt;              Eval run ID (from `eval run`)</text><text x="20" y="755">  --iteration &lt;id&gt;        Iteration ID (from `eval iterations`)</text><text x="20" y="775">  --project &lt;id-or-name&gt;  Project name or ID (defaults to the most recently</text><text x="20" y="795">                          updated project)</text><text x="20" y="815">  -h, --help              display help for command</text><text x="20" y="835"></text><text x="20" y="855">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
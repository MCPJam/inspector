x27;`# MCPJam arithmetic validation&#x27;\&quot;\\\\n\\\\n</text><text x="20" y="995">Installed from npm in a clean Node.js environment. Dependencies are pinned by package-lock.json.\\\\n\\\\n## Reproduce\\\\n\\\\nKe</text><text x="20" y="1015">ep MCPJAM_API_URL and MCPJAM_API_KEY set to this isolated account.\\\\n\\\\n\\\\\&quot;&#x27;`&#x27;\&quot;\\\\\&quot;&#x27;`&#x27;\&quot;\\\\\&quot;&#x27;`sh&#x27;\&quot;\\\\nnpm ci\\\\nnpm</text><text x="20" y="1035"> run eval\\\\n\\\\\&quot;&#x27;`&#x27;\&quot;\\\\\&quot;&#x27;`&#x27;\&quot;\\\\\&quot;&#x27;`&#x27;\&quot;\\\\n\\\\nThe script validates the versioned suite against project_fixture, runs it</text><text x="20" y="1055"> to completion, and writes artifacts/eval-report.json. A completed passing run exits 0; a measured evaluation failure exits 1. Eac</text><text x="20" y="1075">h invocation starts a new run. If a launch response is lost, use its recorded idempotency key from artifacts/run.stderr to retry t</text><text x="20" y="1095">hat launch rather than starting another.\\\\n\\\\n## Evidence\\\\n\\\\n- artifacts/doctor.json: Streamable HTTP connection ready; </text><text x="20" y="1115">arithmetic-fixture 1.0.0 exposes add with numeric a and b.\\\\n- artifacts/add.json: direct call add(2,3) returned structuredConte</text><text x="20" y="1135">nt.sum = 5 and isError = false.\\\\n- .mcpjam/evals/arithmetic.json: direct tool call followed by toolResultContains requiring the</text><text x="20" y="1155"> full text fragment {\\\&quot;sum\\\&quot;: 5}. This is a text-content assertion, not structural equality.\\\\n- artifacts/eval-report.json:</text><text x="20" y="1175"> latest completed passing run, \&quot;&#x27;${run.runs[0].id}.&#x27;\&quot;\\\\n- artifacts/negative-report.json: wrong-answer control requiring {\\\&quot;</text><text x="20" y="1195">sum\\\&quot;: 999} failed, with CLI exit 1.\\\\n- artifacts/iterations.json: initial run&#x27;s recorded tool arguments and result.\\\\n\\\\</text><text x="20" y="1215">nThe isolated service labels these runs SIMULATED: deterministic fixture execution; no hosted model or live billing. This checks t</text><text x="20" y="1235">he authored tool case and assertion path; it does not establish LLM tool-selection accuracy or full MCP protocol conformance.\\\\n</text><text x="20" y="1255">\\\\n## Setup concerns resolved\\\\n\\\\nCloud servers are listed through mcpjam cloud projects servers, rather than cloud servers</text><text x="20" y="1275">. Schema version 2 requires mode agentWorkflow and a model field even for this direct tool case. The platform refused toolResultMa</text><text x="20" y="1295">tchesSchema as outside its supported subset; toolResultContains succeeded. The local runner documentation says direct toolCall ste</text><text x="20" y="1315">ps and gating tool-result assertions require the hosted runner, so this workflow uses cloud eval run.\\\\n\\\\n## Public documenta</text><text x="20" y="1335">tion\\\\n\\\\n- https://docs.mcpjam.com/cli/overview\\\\n- https://docs.mcpjam.com/cli/local-evals\\\\n- https://docs.mcpjam.com/c</text><text x="20" y="1355">li/reference\\\\n- https://docs.mcpjam.com/api-reference/eval-runs/create-an-eval-case\\\\n\\\\nDownloaded public documentation sn</text></g></svg>
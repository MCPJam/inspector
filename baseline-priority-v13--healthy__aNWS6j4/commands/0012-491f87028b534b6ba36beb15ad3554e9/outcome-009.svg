<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">491f87028b534b6ba36beb15ad3554e9 — page 9</text><text x="20" y="75">  skills                        List and read the Cloud Skills in your hosted</text><text x="20" y="95">                                MCPJam projects (read-only; authoring lives in</text><text x="20" y="115">                                the app)</text><text x="20" y="135"></text><text x="20" y="155">Conformance:</text><text x="20" y="175">  conformance                   Hosted conformance runs on saved servers: start,</text><text x="20" y="195">                                poll, read failures</text><text x="20" y="215"></text><text x="20" y="235">Observability:</text><text x="20" y="255">  trace-destinations|traces     Stream an organization&#x27;s traces to an OTLP/HTTP</text><text x="20" y="275">                                endpoint (Coralogix, Honeycomb, Grafana, a</text><text x="20" y="295">                                collector). Header values are write-only: no</text><text x="20" y="315">                                command prints one.</text><text x="20" y="335"></text><text x="20" y="355">Swarms and user testing:</text><text x="20" y="375">  goals|journeys                List goals and inspect their runs (the Swarms</text><text x="20" y="395">                                product) in your hosted MCPJam projects</text><text x="20" y="415">  personas                      The reusable synthetic characters Swarms goals</text><text x="20" y="435">                                run as. A persona carries a name, a role and</text><text x="20" y="455">                                behavioural notes; the task lives on each goal.</text><text x="20" y="475">  swarms                        Swarm containers group goals authored together</text><text x="20" y="495">                                and hold their shared execution config. A goal</text><text x="20" y="515">                                does not need one, but a project authored</text><text x="20" y="535">                                through the app will have them.</text><text x="20" y="555">  studies|scenarios             Publish project environments as studies, read</text><text x="20" y="575">                                what testers did, and control who can reach them</text><text x="20" y="595"></text><text x="20" y="615">Support:</text><text x="20" y="635">  feedback [options]            Send feedback about MCPJam itself (a bug, a</text><text x="20" y="655">                                missing capability, something confusing) to the</text><text x="20" y="675">                                MCPJam team. Your text is sent to the MCPJam</text><text x="20" y="695">                                team, outside your organization, and stored for</text><text x="20" y="715">                                180 days. Requires a signed-in account.</text><text x="20" y="735"></text><text x="20" y="755">Commands:</text><text x="20" y="775">  help [command]                display help for command</text><text x="20" y="795">62:### `server probe`</text><text x="20" y="815">66:### `server doctor`</text><text x="20" y="835">72:### `server info`</text><text x="20" y="855">76:### `server validate`</text><text x="20" y="875">80:### `server ping`</text><text x="20" y="895">84:### `server capabilities`</text><text x="20" y="915">88:### `server export`</text><text x="20" y="935">756:### `cloud clients servers`</text><text x="20" y="955">866:### Deployment support for model overrides and secret grants</text><text x="20" y="975">977:### `cloud projects servers connect`</text><text x="20" y="995">995:### `cloud projects servers connect-status`</text><text x="20" y="1015">1003:### `cloud projects servers connect-cancel`</text><text x="20" y="1035">1013:### `cloud projects servers revisions`</text><text x="20" y="1055">1024:### `cloud projects servers revision`</text><text x="20" y="1075">1034:### `cloud projects servers revision-diff`</text><text x="20" y="1095">1051:### `cloud server-accounts list`</text><text x="20" y="1115">1055:### `cloud server-accounts show`</text><text x="20" y="1135">1063:### `cloud server-accounts set`</text><text x="20" y="1155">1084:### `cloud server-accounts rename`</text><text x="20" y="1175">1093:### `cloud server-accounts default`</text><text x="20" y="1195">1101:### `cloud server-accounts delete`</text><text x="20" y="1215">1341:| `--file &lt;path&gt;` | No | Path to a **create-API JSON** body (or `-` for stdin). A versioned suite file (`schemaVersion: &quot;1&quot;`)</text><text x="20" y="1235"> belongs on `eval run --file` |</text><text x="20" y="1255">1506:`eval run --file` reads the versioned suite file (`schemaVersion: &quot;1&quot;`),</text><text x="20" y="1275">1518:(`repetitions` in a `schemaVersion: &quot;1&quot;` file, `iterations` in `&quot;2&quot;`) is</text><text x="20" y="1295">1552:(`defaults.repetitions`, or `defaults.iterations` in `schemaVersion: &quot;2&quot;`) is</text><text x="20" y="1315">1643:`--file` pointing at create-API JSON (no `schemaVersion`) is a usage error</text><text x="20" y="1335">1659:### `cloud eval server-facts`</text><text x="20" y="1355">1669:output-schema coverage, and the deterministic tool-metadata prechecks, plus</text></g></svg>
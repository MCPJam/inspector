<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="985"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8c7ab1f0fd044b24b20a816bfa767df1 — page 9</text><text x="20" y="75">      }</text><text x="20" y="95">    ],</text><text x="20" y="115">    &quot;project&quot;: {</text><text x="20" y="135">      &quot;id&quot;: &quot;project_fixture&quot;,</text><text x="20" y="155">      &quot;name&quot;: &quot;Fixture&quot;,</text><text x="20" y="175">      &quot;sensitive_value&quot;: &quot;[REDACTED]&quot;</text><text x="20" y="195">    },</text><text x="20" y="215">    &quot;suite&quot;: {</text><text x="20" y="235">      &quot;id&quot;: &quot;suite_authored_1&quot;,</text><text x="20" y="255">      &quot;name&quot;: &quot;Arithmetic result regression&quot;</text><text x="20" y="275">    }</text><text x="20" y="295">  },</text><text x="20" y="315">  &quot;decisionSummary&quot;: {</text><text x="20" y="335">    &quot;schemaVersion&quot;: 1,</text><text x="20" y="355">    &quot;runId&quot;: &quot;run_fixture_1&quot;,</text><text x="20" y="375">    &quot;runStatus&quot;: &quot;completed&quot;,</text><text x="20" y="395">    &quot;diagnostics&quot;: {</text><text x="20" y="415">      &quot;items&quot;: [],</text><text x="20" y="435">      &quot;complete&quot;: true,</text><text x="20" y="455">      &quot;scannedIterations&quot;: 1</text><text x="20" y="475">    },</text><text x="20" y="495">    &quot;verdict&quot;: &quot;passed&quot;,</text><text x="20" y="515">    &quot;verdictSource&quot;: &quot;legacy&quot;,</text><text x="20" y="535">    &quot;counts&quot;: {</text><text x="20" y="555">      &quot;measurementUnit&quot;: &quot;trial&quot;,</text><text x="20" y="575">      &quot;total&quot;: 1,</text><text x="20" y="595">      &quot;passed&quot;: 1,</text><text x="20" y="615">      &quot;failed&quot;: 0</text><text x="20" y="635">    }</text><text x="20" y="655">  }</text><text x="20" y="675">}</text><text x="20" y="695">Usage: mcpjam cloud eval steps [options]</text><text x="20" y="715"></text><text x="20" y="735">Per-authored-step results for one eval iteration: status</text><text x="20" y="755">(ok/fail/skipped/pending), reason, and evidence (screenshot/video URLs). The</text><text x="20" y="775">fastest way to see WHICH step failed and why.</text><text x="20" y="795"></text><text x="20" y="815">Options:</text><text x="20" y="835">  --run &lt;id&gt;              Eval run ID (from `eval run`)</text><text x="20" y="855">  --iteration &lt;id&gt;        Iteration ID (from `eval iterations`)</text><text x="20" y="875">  --project &lt;id-or-name&gt;  Project name or ID (defaults to the most recently</text><text x="20" y="895">                          updated project)</text><text x="20" y="915">  -h, --help              display help for command</text><text x="20" y="935"></text><text x="20" y="955">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
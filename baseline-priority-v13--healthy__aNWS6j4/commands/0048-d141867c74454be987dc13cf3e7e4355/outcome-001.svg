<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d141867c74454be987dc13cf3e7e4355 — page 1</text><text x="20" y="75">$ /bin/bash -c sed -n &#x27;580,640p&#x27; docs/create-case.md &amp;&amp; sed -n &#x27;1093,1168p&#x27; docs/create-case.md &amp;&amp; sed -n &#x27;750,802p&#x27; docs/create-c</text><text x="20" y="95">ase.md &amp;&amp; rg -n &#x27;mode:|agentWorkflow|toolUnit|toolWorkflow|deterministic&#x27; docs/create-case.md | head -30 &amp;&amp; npx mcpjam cloud eval </text><text x="20" y="115">--help</text><text x="20" y="135">        suppressedSuiteStandardCheckIds:</text><text x="20" y="155">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="175">          type: array</text><text x="20" y="195">          items:</text><text x="20" y="215">            type: string</text><text x="20" y="235">    EvalTestStep:</text><text x="20" y="255">      type: object</text><text x="20" y="275">      description: &gt;-</text><text x="20" y="295">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="315">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="335">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="355">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="375">        a DOM `WidgetAssertion`).</text><text x="20" y="395">      required:</text><text x="20" y="415">        - id</text><text x="20" y="435">        - kind</text><text x="20" y="455">      properties:</text><text x="20" y="475">        id:</text><text x="20" y="495">          type: string</text><text x="20" y="515">          minLength: 1</text><text x="20" y="535">        kind:</text><text x="20" y="555">          type: string</text><text x="20" y="575">          enum:</text><text x="20" y="595">            - prompt</text><text x="20" y="615">            - toolCall</text><text x="20" y="635">            - interact</text><text x="20" y="655">            - assert</text><text x="20" y="675">        prompt:</text><text x="20" y="695">          type: string</text><text x="20" y="715">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="735">        serverName:</text><text x="20" y="755">          type: string</text><text x="20" y="775">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="795">        toolName:</text><text x="20" y="815">          type: string</text><text x="20" y="835">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="855">        arguments:</text><text x="20" y="875">          type: object</text><text x="20" y="895">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="915">          additionalProperties: true</text><text x="20" y="935">        action:</text><text x="20" y="955">          type: object</text><text x="20" y="975">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="995">          additionalProperties: true</text><text x="20" y="1015">        assertion:</text><text x="20" y="1035">          type: object</text><text x="20" y="1055">          description: &gt;-</text><text x="20" y="1075">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="1095">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="1115">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="1135">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="1155">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="1175">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="1195">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="1215">            replayability only one half of it has.</text><text x="20" y="1235">          additionalProperties: true</text><text x="20" y="1255">      additionalProperties: true</text><text x="20" y="1275">    RequestedModelSelection:</text><text x="20" y="1295">      description: &gt;-</text><text x="20" y="1315">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="1335">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="1355">                - required</text></g></svg>
ses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same tr</text><text x="20" y="1315">iple for the life of the run.\\n\\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpja</text><text x="20" y="1335">m-launcher` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.\&quot;,\n\&quot;parameters\&quot;: [\n{\n\&quot;</text><text x="20" y="1355">$ref\&quot;: \&quot;#/components/parameters/evalVocabularyHeader\&quot;\n},\n{\n\&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n},\n{\n\&quot;$ref\&quot;:</text></g></svg>
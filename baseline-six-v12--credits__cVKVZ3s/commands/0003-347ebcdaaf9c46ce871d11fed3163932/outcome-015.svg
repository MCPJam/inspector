_monthly` · `provider/mcpjam_limit` · `provider/mcpjam_limit_insuff</text><text x="20" y="1055">icient`\n\nMCPJam refused the call before it reached a provider. For the daily, monthly,\nand general codes, the account&#x27;s own all</text><text x="20" y="1075">owance is spent.\n`provider/mcpjam_limit_insufficient` means the balance is not empty but is below\nwhat the request could cost. W</text><text x="20" y="1095">hich allowance depends on the plan: free accounts\nshare a daily bucket per organization, paid plans spend a monthly allowance tha</text><text x="20" y="1115">t\n--\n**Next steps**\n\n* **Free plan (owner)** — The limit dialog shows **Compare plans** to upgrade, and **Learn more about BYO</text><text x="20" y="1135">K** to understand how provider keys and MCPJam credits work separately.\n* **Free plan (admin or member)** — The dialog shows a **</text><text x="20" y="1155">Request upgrade** link to email an organization owner.\n* **Paid plan (owner or admin)** — The dialog shows **Buy credits** to add</text><text x="20" y="1175"> shared credits to your organization.\n* **Paid plan (member)** — The dialog shows a **Request credits** link to email an organiza</text><text x="20" y="1195">tion owner.\n* Add your own API key under **Settings → LLM Providers** for chat (BYOK does not cover Swarm, Evals, or other MCPJam</text><text x="20" y="1215">-billed features).\n* If your organization uses its own keys for all AI features, model tokens are billed by its providers instead</text><text x="20" y="1235">; see [Organization AI key policy](#organization-ai-key-policy).\n\n**Swarm and Eval runs**\n\nWhen credits run out during a Swarm</text><text x="20" y="1255"> or Eval run, blocked work stops and you receive one credit-exhaustion prompt per run, or one per swarm when a swarm launches seve</text><text x="20" y="1275">ral runs at once. Completed results are preserved. Buying credits does not automatically restart the run — start a new run once cr</text><text x="20" y="1295">edits are available.\n\n&gt; [!WARNING]\n&gt;\n&gt; Bring-your-own-key covers chat. Swarm persona generation and persona-driver\n&gt; turns ar</text><text x="20" y="1315">e billed to MCPJam and have no personal BYOK path, so adding a key\n&gt; does not lift this limit for a swarm. An organization that u</text><text x="20" y="1335">ses its own keys\n&gt; for all AI features runs those turns on its default AI model instead, and its\n&gt; providers bill their tokens; </text><text x="20" y="1355">see\n&gt; [Organization AI key policy](#organization-ai-key-policy).\n\n### Credits temporarily held\n\nA swarm session can stop with</text></g></svg>
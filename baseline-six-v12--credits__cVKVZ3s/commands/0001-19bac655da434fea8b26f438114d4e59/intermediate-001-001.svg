<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.01819610595703125s — page 1</text><text x="20" y="75">{</text><text x="20" y="95">&quot;operationId&quot;: &quot;createEvalRun&quot;,</text><text x="20" y="115">&quot;tags&quot;: [</text><text x="20" y="135">&quot;Eval runs&quot;</text><text x="20" y="155">],</text><text x="20" y="175">&quot;summary&quot;: &quot;Create an eval run (async)&quot;,</text><text x="20" y="195">&quot;description&quot;: &quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and respon</text><text x="20" y="215">ds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for pr</text><text x="20" y="235">ogress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests reruns </text><text x="20" y="255">the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `deta</text><text x="20" y="275">ils.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which one</text><text x="20" y="295"> the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the li</text><text x="20" y="315">fe of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and </text><text x="20" y="335">`x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,</text><text x="20" y="355">&quot;parameters&quot;: [</text><text x="20" y="375">{</text><text x="20" y="395">&quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="415">},</text><text x="20" y="435">{</text><text x="20" y="455">&quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="475">},</text><text x="20" y="495">{</text><text x="20" y="515">&quot;$ref&quot;: &quot;#/components/parameters/launcherHeader&quot;</text><text x="20" y="535">},</text><text x="20" y="555">{</text><text x="20" y="575">&quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;</text><text x="20" y="595">}</text><text x="20" y="615">],</text><text x="20" y="635">&quot;requestBody&quot;: {</text><text x="20" y="655">&quot;required&quot;: true,</text><text x="20" y="675">&quot;content&quot;: {</text><text x="20" y="695">&quot;application/json&quot;: {</text><text x="20" y="715">&quot;schema&quot;: {</text><text x="20" y="735">&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;</text><text x="20" y="755">},</text><text x="20" y="775">&quot;example&quot;: {</text><text x="20" y="795">&quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="815">&quot;serverIds&quot;: [</text><text x="20" y="835">&quot;srv_abc123&quot;</text><text x="20" y="855">],</text><text x="20" y="875">&quot;tests&quot;: [</text><text x="20" y="895">{</text><text x="20" y="915">&quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="935">&quot;runs&quot;: 1,</text><text x="20" y="955">&quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="975">&quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="995">&quot;steps&quot;: [</text><text x="20" y="1015">{</text><text x="20" y="1035">&quot;id&quot;: &quot;s1&quot;,</text><text x="20" y="1055">&quot;kind&quot;: &quot;prompt&quot;,</text><text x="20" y="1075">&quot;prompt&quot;: &quot;Use the echo tool to say hi&quot;</text><text x="20" y="1095">},</text><text x="20" y="1115">{</text><text x="20" y="1135">&quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="1155">&quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="1175">&quot;assertion&quot;: {</text><text x="20" y="1195">&quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="1215">&quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="1235">&quot;args&quot;: {</text><text x="20" y="1255">&quot;args&quot;: {</text><text x="20" y="1275">&quot;text&quot;: &quot;hi&quot;</text><text x="20" y="1295">}</text><text x="20" y="1315">}</text><text x="20" y="1335">}</text><text x="20" y="1355">}</text></g></svg>
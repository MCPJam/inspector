<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="How many iterations a run makes"><style>text{fill:#ecebe7;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}
.sm{font-size:11.5px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.sm.mono{font-size:10.8px}
.h{font-weight:600}
.i{font-style:italic;fill:#a8a6a0}
.big{font-size:34px;font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.b{fill:#262624;stroke:#ecebe7;stroke-width:1.4}
.s{fill:#33322f;stroke:#ecebe7;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.thick{stroke-width:2.6}
.none{fill:none;stroke:#ecebe7}
.fill{fill:#ecebe7;stroke:#ecebe7}
.ln{stroke:#ecebe7;stroke-width:1.4;fill:none;marker-end:url(#ah)}
.ln-plain{stroke:#ecebe7;stroke-width:1.4;fill:none}
.rule{stroke:#a8a6a0;stroke-width:1.2;fill:none}
.ahp{fill:#ecebe7}
.red{fill:#ef5350;stroke:none}
.rt{fill:#ffffff;font-size:12px;font-weight:600}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="330" fill="#262624"/><text x="185" y="40" class="h" text-anchor="middle">Pair A</text><text x="325" y="40" class="h" text-anchor="middle">Pair B</text><text x="185" y="56" class="sm" text-anchor="middle">3 iterations per case</text><text x="325" y="56" class="sm" text-anchor="middle">3 iterations per case</text><text x="30" y="84" class="sm mono" text-anchor="start">case 1</text><circle cx="160" cy="80" r="8" class="b"/><circle cx="185" cy="80" r="8" class="b"/><circle cx="210" cy="80" r="8" class="b"/><circle cx="300" cy="80" r="8" class="b"/><circle cx="325" cy="80" r="8" class="b"/><circle cx="350" cy="80" r="8" class="b"/><text x="30" y="114" class="sm mono" text-anchor="start">case 2</text><circle cx="160" cy="110" r="8" class="b"/><circle cx="185" cy="110" r="8" class="b"/><circle cx="210" cy="110" r="8" class="b"/><circle cx="300" cy="110" r="8" class="b"/><circle cx="325" cy="110" r="8" class="b"/><circle cx="350" cy="110" r="8" class="b"/><text x="30" y="144" class="sm mono" text-anchor="start">case 3</text><circle cx="160" cy="140" r="8" class="b"/><circle cx="185" cy="140" r="8" class="b"/><circle cx="210" cy="140" r="8" class="b"/><circle cx="300" cy="140" r="8" class="b"/><circle cx="325" cy="140" r="8" class="b"/><circle cx="350" cy="140" r="8" class="b"/><text x="30" y="174" class="sm mono" text-anchor="start">case 4</text><circle cx="160" cy="170" r="8" class="b"/><circle cx="185" cy="170" r="8" class="b"/><circle cx="210" cy="170" r="8" class="b"/><circle cx="300" cy="170" r="8" class="b"/><circle cx="325" cy="170" r="8" class="b"/><circle cx="350" cy="170" r="8" class="b"/><text x="30" y="204" class="sm mono" text-anchor="start">case 5</text><circle cx="160" cy="200" r="8" class="b"/><circle cx="185" cy="200" r="8" class="b"/><circle cx="210" cy="200" r="8" class="b"/><circle cx="300" cy="200" r="8" class="b"/><circle cx="325" cy="200" r="8" class="b"/><circle cx="350" cy="200" r="8" class="b"/><text x="30" y="234" class="sm mono" text-anchor="start">case 6</text><circle cx="160" cy="230" r="8" class="b"/><circle cx="185" cy="230" r="8" class="b"/><circle cx="210" cy="230" r="8" class="b"/><circle cx="300" cy="230" r="8" class="b"/><circle cx="325" cy="230" r="8" class="b"/><circle cx="350" cy="230" r="8" class="b"/><text x="30" y="264" class="sm mono" text-anchor="start">case 7</text><circle cx="160" cy="260" r="8" class="b"/><circle cx="185" cy="260" r="8" class="b"/><circle cx="210" cy="260" r="8" class="b"/><circle cx="300" cy="260" r="8" class="b"/><circle cx="325" cy="260" r="8" class="b"/><circle cx="350" cy="260" r="8" class="b"/><text x="30" y="294" class="sm mono" text-anchor="start">case 8</text><circle cx="160" cy="290" r="8" class="b"/><circle cx="185" cy="290" r="8" class="b"/><circle cx="210" cy="290" r="8" class="b"/><circle cx="300" cy="290" r="8" class="b"/><circle cx="325" cy="290" r="8" class="b"/><circle cx="350" cy="290" r="8" class="b"/><line x1="255" y1="62" x2="255" y2="312" class="rule"/><text x="410" y="120" class="big" text-anchor="start">8 × 3 × 2 = 48</text><text x="410" y="148" class="" text-anchor="start">cases × iterations per case × client/model pairs</text><text x="410" y="186" class="sm" text-anchor="start">Each circle is one iteration: the case’s prompt</text><text x="410" y="203" class="sm" text-anchor="start">sent to one model, its tool calls, its trace, its grade.</text><text x="410" y="236" class="sm" text-anchor="start">The Set up run sheet footer shows the same product</text><text x="410" y="253" class="sm" text-anchor="start">as cases × repetitions × client:model combos.</text><text x="410" y="286" class="sm h" text-anchor="start">Cost scales with the circle count.</text></svg>
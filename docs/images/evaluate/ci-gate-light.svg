<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="Gating a merge in CI"><style>text{fill:#1f1e1d;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}
.sm{font-size:11.5px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.sm.mono{font-size:10.8px}
.h{font-weight:600}
.i{font-style:italic;fill:#5e5d59}
.big{font-size:34px;font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.b{fill:#faf9f5;stroke:#1f1e1d;stroke-width:1.4}
.s{fill:#efede6;stroke:#1f1e1d;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.thick{stroke-width:2.6}
.none{fill:none;stroke:#1f1e1d}
.fill{fill:#1f1e1d;stroke:#1f1e1d}
.ln{stroke:#1f1e1d;stroke-width:1.4;fill:none;marker-end:url(#ah)}
.ln-plain{stroke:#1f1e1d;stroke-width:1.4;fill:none}
.rule{stroke:#5e5d59;stroke-width:1.2;fill:none}
.ahp{fill:#1f1e1d}
.red{fill:#c62828;stroke:none}
.rt{fill:#ffffff;font-size:12px;font-weight:600}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="410" fill="#faf9f5"/><circle cx="50" cy="78" r="13" class="b"/><path d="M26,118 Q26,96 50,96 Q74,96 74,118 Z" class="b"/><text x="50" y="136" class="h" text-anchor="middle">You</text><text x="50" y="154" class="sm" text-anchor="middle">push to PR</text><line x1="80" y1="100" x2="128" y2="100" class="ln"/><rect x="130" y="40" width="170" height="124" rx="8" class="b"/><text x="144" y="64" class="h" text-anchor="start">GitHub Actions job</text><text x="144" y="82" class="sm mono" text-anchor="start">MCPJAM_API_KEY</text><text x="144" y="98" class="sm" text-anchor="start">secret</text><rect x="520" y="40" width="230" height="124" rx="8" class="b"/><text x="534" y="64" class="h" text-anchor="start">MCPJam project</text><text x="534" y="82" class="sm" text-anchor="start">suite runs against</text><text x="534" y="98" class="sm" text-anchor="start">its saved server</text><line x1="302" y1="92" x2="518" y2="92" class="ln"/><text x="410" y="87" class="sm mono" text-anchor="middle">1. cloud eval run --wait</text><line x1="518" y1="114" x2="302" y2="114" class="ln"/><text x="410" y="109" class="sm mono" text-anchor="middle">2. eval-result.json (run ID)</text><line x1="302" y1="136" x2="518" y2="136" class="ln"/><text x="410" y="131" class="sm mono" text-anchor="middle">3. cloud eval gate</text><line x1="518" y1="158" x2="302" y2="158" class="ln"/><text x="410" y="153" class="sm mono" text-anchor="middle">4. JUnit XML + exit code</text><circle cx="738" cy="40" r="11" class="red"/><text x="738" y="44" class="rt" text-anchor="middle">A</text><path d="M215,164 V214" class="ln-plain"/><path d="M130,214 H630" class="ln-plain"/><line x1="130" y1="214" x2="130" y2="236" class="ln"/><rect x="20" y="238" width="220" height="66" rx="4" class="b"/><text x="130" y="262" class="h mono" text-anchor="middle">exit 0</text><text x="130" y="280" class="sm" text-anchor="middle">check passes</text><text x="130" y="296" class="sm" text-anchor="middle"></text><line x1="380" y1="214" x2="380" y2="236" class="ln"/><rect x="270" y="238" width="220" height="66" rx="4" class="b"/><text x="380" y="262" class="h mono" text-anchor="middle">exit 1</text><text x="380" y="280" class="sm" text-anchor="middle">verdict failed: fix it,</text><text x="380" y="296" class="sm" text-anchor="middle">or gate waive</text><line x1="630" y1="214" x2="630" y2="236" class="ln"/><rect x="520" y="238" width="220" height="66" rx="4" class="b"/><text x="630" y="262" class="h mono" text-anchor="middle">exit 3</text><text x="630" y="280" class="sm" text-anchor="middle">incomplete:</text><text x="630" y="296" class="sm" text-anchor="middle">safe to retry</text><text x="12" y="338" class="sm h" text-anchor="start">Red = where it breaks.</text><text x="12" y="358" class="sm h" text-anchor="start">A</text><text x="30" y="358" class="sm" text-anchor="start">The hosted suite tests the server saved in the project, not the code in your PR. Deploy the PR to that server first,</text><text x="30" y="375" class="sm" text-anchor="start">or use the SDK upload path, which runs against whatever your job starts.</text><text x="12" y="400" class="sm i" text-anchor="start">Exit codes shown are eval gate’s. On eval run --wait, 3 means auth failed and 4 or 5 mean retry with the same --idempotency-key.</text></svg>
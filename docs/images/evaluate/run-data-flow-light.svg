<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="What leaves MCPJam during a run"><style>text{fill:#1f1e1d;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}
.sm{font-size:11.5px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.sm.mono{font-size:10.8px}
.h{font-weight:600}
.i{font-style:italic;fill:#5e5d59}
.big{font-size:34px;font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.b{fill:#faf9f5;stroke:#1f1e1d;stroke-width:1.4}
.s{fill:#efede6;stroke:#1f1e1d;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.thick{stroke-width:2.6}
.none{fill:none;stroke:#1f1e1d}
.fill{fill:#1f1e1d;stroke:#1f1e1d}
.ln{stroke:#1f1e1d;stroke-width:1.4;fill:none;marker-end:url(#ah)}
.ln-plain{stroke:#1f1e1d;stroke-width:1.4;fill:none}
.rule{stroke:#5e5d59;stroke-width:1.2;fill:none}
.ahp{fill:#1f1e1d}
.red{fill:#c62828;stroke:none}
.rt{fill:#ffffff;font-size:12px;font-weight:600}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="400" fill="#faf9f5"/><circle cx="50" cy="193" r="13" class="b"/><path d="M26,233 Q26,211 50,211 Q74,211 74,233 Z" class="b"/><text x="50" y="251" class="h" text-anchor="middle">You</text><line x1="82" y1="215" x2="133" y2="215" class="ln"/><text x="98" y="205" class="sm mono" text-anchor="middle">Run</text><rect x="118" y="30" width="174" height="360" rx="10" class="b dash"/><text x="130" y="52" class="h" text-anchor="start">MCPJam</text><rect x="135" y="66" width="140" height="310" rx="4" class="b"/><text x="205" y="214" class="h" text-anchor="middle">Eval run</text><text x="205" y="232" class="sm" text-anchor="middle">trace + saved</text><text x="205" y="248" class="sm" text-anchor="middle">server credentials</text><rect x="540" y="38" width="212" height="64" rx="4" class="b"/><text x="552" y="58" class="h" text-anchor="start">Your MCP server</text><text x="552" y="76" class="sm mono" text-anchor="start">the suite’s server</text><text x="552" y="92" class="sm" text-anchor="start"></text><line x1="277" y1="70" x2="538" y2="70" class="ln"/><text x="415" y="46" class="sm mono" text-anchor="middle">1. bearer token, headers,</text><text x="415" y="60" class="sm mono" text-anchor="middle">or OAuth access token</text><text x="415" y="86" class="sm i" text-anchor="middle">every request</text><rect x="540" y="133" width="212" height="64" rx="4" class="b"/><text x="552" y="153" class="h" text-anchor="start">Model provider</text><text x="552" y="171" class="sm mono" text-anchor="start">the model you picked</text><text x="552" y="187" class="sm" text-anchor="start"></text><line x1="277" y1="165" x2="538" y2="165" class="ln"/><text x="415" y="141" class="sm mono" text-anchor="middle">2. prompts, tool definitions,</text><text x="415" y="155" class="sm mono" text-anchor="middle">tool results</text><text x="415" y="181" class="sm i" text-anchor="middle">every iteration</text><rect x="540" y="228" width="212" height="64" rx="4" class="b"/><text x="552" y="248" class="h" text-anchor="start">Goal completion judge</text><text x="552" y="266" class="sm mono" text-anchor="start">openai/gpt-5.4-mini</text><text x="552" y="282" class="sm" text-anchor="start">via OpenRouter</text><line x1="277" y1="260" x2="538" y2="260" class="ln"/><text x="415" y="236" class="sm mono" text-anchor="middle">3. conversation, trace, tool</text><text x="415" y="250" class="sm mono" text-anchor="middle">definitions; credentials redacted</text><text x="415" y="276" class="sm i" text-anchor="middle">each iteration, while the judge is on</text><rect x="540" y="323" width="212" height="64" rx="4" class="b"/><text x="552" y="343" class="h" text-anchor="start">Jev classifier</text><text x="552" y="361" class="sm mono" text-anchor="start">TypeSafe AI</text><text x="552" y="377" class="sm" text-anchor="start">via Vercel AI Gateway</text><line x1="277" y1="355" x2="538" y2="355" class="ln"/><text x="415" y="331" class="sm mono" text-anchor="middle">4. request, expected outcome,</text><text x="415" y="345" class="sm mono" text-anchor="middle">final answer, clipped trajectory</text><text x="415" y="371" class="sm i" text-anchor="middle">with Rubric checks</text></svg>
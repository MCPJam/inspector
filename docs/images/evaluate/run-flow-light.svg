</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="390" fill="#faf9f5"/><circle cx="55" cy="193" r="13" class="b"/><path d="M31,233 Q31,211 55,211 Q79,211 79,233 Z" class="b"/><text x="55" y="251" class="h" text-anchor="middle">You</text><line x1="90" y1="198" x2="168" y2="198" class="ln"/><text x="129" y="190" class="sm mono" text-anchor="middle">1. Run</text><line x1="168" y1="232" x2="90" y2="232" class="ln"/><text x="129" y="250" class="sm mono" text-anchor="middle">12. Passed</text><rect x="170" y="50" width="190" height="320" rx="8" class="b"/><text x="184" y="74" class="h" text-anchor="start">MCPJam run</text><text x="184" y="91" class="sm" text-anchor="start">client + harness for the run</text><text x="184" y="250" class="sm mono" text-anchor="start">10. save trace</text><text x="184" y="270" class="sm mono" text-anchor="start">11. grade: assertions</text><text x="184" y="287" class="sm mono" text-anchor="start">     and judges</text><text x="184" y="307" class="sm mono" text-anchor="start">     → verdict</text><rect x="590" y="50" width="150" height="130" rx="4" class="b"/><text x="604" y="74" class="h" text-anchor="start">Your MCP server</text><text x="604" y="91" class="sm mono" text-anchor="start">notes</text><rect x="590" y="220" width="150" height="150" rx="4" class="b"/><text x="604" y="244" class="h" text-anchor="start">Model provider</text><text x="604" y="261" class="sm mono" text-anchor="start">claude-haiku-4.5</text><line x1="362" y1="108" x2="588" y2="108" class="ln"/><text x="475" y="103" class="sm mono" text-anchor="middle">2. connect, list tools</text><line x1="588" y1="130" x2="362" y2="130" class="ln"/><text x="475" y="125" class="sm mono" text-anchor="middle">3. read_note, search_notes</text><line x1="362" y1="152" x2="588" y2="152" class="ln"/><text x="475" y="147" class="sm mono" text-anchor="middle">6. read_note {id: 7}</text><line x1="588" y1="174" x2="362" y2="174" class="ln"/><text x="475" y="169" class="sm mono" text-anchor="middle">7. note 7 text</text><line x1="362" y1="282" x2="588" y2="282" class="ln"/><text x="475" y="277" class="sm mono" text-anchor="middle">4. “What does note 7 say?”</text><line x1="588" y1="304" x2="362" y2="304" class="ln"/><text x="475" y="299" class="sm mono" text-anchor="middle">5. call read_note {id: 7}</text><line x1="362" y1="326" x2="588" y2="326" class="ln"/><text x="475" y="321" class="sm mono" text-anchor="middle">8. tool result</text><line x1="588" y1="348" x2="362" y2="348" class="ln"/><text x="475" y="343" class="sm mono" text-anchor="middle">9. “Note 7 says …”</text></svg>
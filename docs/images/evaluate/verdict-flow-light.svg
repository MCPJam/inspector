<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-label="How a verdict is reached"><style>text{fill:#1f1e1d;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}
.sm{font-size:11.5px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.sm.mono{font-size:10.8px}
.h{font-weight:600}
.i{font-style:italic;fill:#5e5d59}
.big{font-size:34px;font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.b{fill:#faf9f5;stroke:#1f1e1d;stroke-width:1.4}
.s{fill:#efede6;stroke:#1f1e1d;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.thick{stroke-width:2.6}
.none{fill:none;stroke:#1f1e1d}
.fill{fill:#1f1e1d;stroke:#1f1e1d}
.ln{stroke:#1f1e1d;stroke-width:1.4;fill:none;marker-end:url(#ah)}
.ln-plain{stroke:#1f1e1d;stroke-width:1.4;fill:none}
.rule{stroke:#5e5d59;stroke-width:1.2;fill:none}
.ahp{fill:#1f1e1d}
.red{fill:#c62828;stroke:none}
.rt{fill:#ffffff;font-size:12px;font-weight:600}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="620" fill="#faf9f5"/><rect x="280" y="14" width="200" height="38" rx="4" class="b"/><text x="380" y="38" class="h" text-anchor="middle">An iteration finishes</text><line x1="380" y1="52" x2="380" y2="72" class="ln"/><path d="M380,74 L520,114 L380,154 L240,114 Z" class="b"/><text x="380" y="110" class="sm h" text-anchor="middle">Every Required</text><text x="380" y="126" class="sm h" text-anchor="middle">evaluator passed?</text><line x1="240" y1="114" x2="170" y2="114" class="ln"/><text x="205" y="106" class="sm" text-anchor="middle">no</text><rect x="40" y="96" width="130" height="36" rx="4" class="b"/><text x="105" y="119" class="" text-anchor="middle">Iteration fails</text><line x1="520" y1="114" x2="590" y2="114" class="ln"/><text x="555" y="106" class="sm" text-anchor="middle">yes</text><rect x="590" y="96" width="130" height="36" rx="4" class="b"/><text x="655" y="119" class="" text-anchor="middle">Iteration passes</text><text x="380" y="176" class="sm i" text-anchor="middle">Advisory misses show as “Missed · advisory” and never fail it.</text><path d="M105,132 V214 H330" class="ln"/><path d="M655,132 V214 H430" class="ln"/><rect x="280" y="196" width="200" height="38" rx="4" class="s"/><text x="380" y="220" class="h" text-anchor="middle">All iterations of the run</text><line x1="380" y1="234" x2="380" y2="254" class="ln"/><path d="M380,256 L520,292 L380,328 L240,292 Z" class="b"/><text x="380" y="288" class="sm h" text-anchor="middle">Which</text><text x="380" y="304" class="sm h" text-anchor="middle">Pass criteria?</text><path d="M240,292 H150 V350" class="ln"/><text x="195" y="284" class="sm h" text-anchor="middle">Suite accuracy</text><path d="M520,292 H610 V350" class="ln"/><text x="565" y="284" class="sm h" text-anchor="middle">Per-case pass rate</text><rect x="40" y="352" width="220" height="58" rx="4" class="b"/><text x="150" y="376" class="sm" text-anchor="middle">Share of all iterations passed</text><text x="150" y="394" class="sm" text-anchor="middle">≥ the bar? (70% if unset)</text><path d="M95,410 V450" class="ln"/><path d="M205,410 V450" class="ln"/><text x="88" y="436" class="sm" text-anchor="end">yes</text><text x="212" y="436" class="sm" text-anchor="start">no</text><rect x="45" y="452" width="100" height="34" rx="4" class="b thick"/><text x="95" y="474" class="h" text-anchor="middle">Passed</text><rect x="155" y="452" width="100" height="34" rx="4" class="b thick"/><text x="205" y="474" class="h" text-anchor="middle">Failed</text><rect x="500" y="352" width="220" height="58" rx="4" class="b"/><text x="610" y="376" class="sm" text-anchor="middle">Evidence requirements met?</text><text x="610" y="394" class="sm" text-anchor="middle">(gradeable, completed, few errors)</text><path d="M720,381 H745 V593 H722" class="ln"/><text x="740" y="470" class="sm" text-anchor="end">no</text><line x1="610" y1="410" x2="610" y2="438" class="ln"/><text x="617" y="428" class="sm" text-anchor="start">yes</text><rect x="500" y="440" width="220" height="58" rx="4" class="b"/><text x="610" y="464" class="sm" text-anchor="middle">Every case passed at least</text><text x="610" y="482" class="sm" text-anchor="middle">its share of iterations?</text><path d="M555,498 V532" class="ln"/><path d="M665,498 V532" class="ln"/><text x="548" y="520" class="sm" text-anchor="end">yes</text><text x="672" y="520" class="sm" text-anchor="start">no</text><rect x="505" y="534" width="100" height="34" rx="4" class="b thick"/><text x="555" y="556" class="h" text-anchor="middle">Passed</text><rect x="615" y="534" width="100" height="34" rx="4" class="b thick"/><text x="665" y="556" class="h" text-anchor="middle">Failed</text><rect x="600" y="576" width="120" height="34" rx="4" class="b thick"/><text x="660" y="598" class="h" text-anchor="middle">Inconclusive</text></svg>
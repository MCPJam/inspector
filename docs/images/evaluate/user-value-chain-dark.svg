<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The user-value chain"><style>text{fill:#ecebe7;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}
.sm{font-size:11.5px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.sm.mono{font-size:10.8px}
.h{font-weight:600}
.i{font-style:italic;fill:#a8a6a0}
.big{font-size:34px;font-weight:600;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.b{fill:#262624;stroke:#ecebe7;stroke-width:1.4}
.s{fill:#33322f;stroke:#ecebe7;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.thick{stroke-width:2.6}
.none{fill:none;stroke:#ecebe7}
.fill{fill:#ecebe7;stroke:#ecebe7}
.ln{stroke:#ecebe7;stroke-width:1.4;fill:none;marker-end:url(#ah)}
.ln-plain{stroke:#ecebe7;stroke-width:1.4;fill:none}
.rule{stroke:#a8a6a0;stroke-width:1.2;fill:none}
.ahp{fill:#ecebe7}
.red{fill:#ef5350;stroke:none}
.rt{fill:#ffffff;font-size:12px;font-weight:600}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="300" fill="#262624"/><rect x="12" y="70" width="110" height="74" rx="4" class="b"/><text x="67" y="94" class="h" text-anchor="middle">Connection</text><text x="67" y="113" class="sm" text-anchor="middle">reach server,</text><text x="67" y="129" class="sm" text-anchor="middle">start session</text><line x1="123" y1="107" x2="134" y2="107" class="ln"/><rect x="136" y="70" width="110" height="74" rx="4" class="b"/><text x="191" y="94" class="h" text-anchor="middle">Discovery</text><text x="191" y="113" class="sm" text-anchor="middle">usable tools</text><text x="191" y="129" class="sm" text-anchor="middle">and metadata</text><line x1="247" y1="107" x2="258" y2="107" class="ln"/><rect x="260" y="70" width="110" height="74" rx="4" class="b"/><text x="315" y="94" class="h" text-anchor="middle">Selection</text><text x="315" y="113" class="sm" text-anchor="middle">right tool</text><text x="315" y="129" class="sm" text-anchor="middle">chosen</text><line x1="371" y1="107" x2="382" y2="107" class="ln"/><rect x="384" y="70" width="110" height="74" rx="4" class="b dash"/><text x="439" y="94" class="h" text-anchor="middle">Tool call</text><text x="439" y="113" class="sm" text-anchor="middle">usable</text><text x="439" y="129" class="sm" text-anchor="middle">arguments</text><line x1="495" y1="107" x2="506" y2="107" class="ln"/><rect x="508" y="70" width="110" height="74" rx="4" class="b dash"/><text x="563" y="94" class="h" text-anchor="middle">Response</text><text x="563" y="113" class="sm" text-anchor="middle">usable data</text><text x="563" y="129" class="sm" text-anchor="middle">returned</text><line x1="619" y1="107" x2="630" y2="107" class="ln"/><rect x="632" y="70" width="110" height="74" rx="4" class="b dash"/><text x="687" y="94" class="h" text-anchor="middle">User value</text><text x="687" y="113" class="sm" text-anchor="middle">request</text><text x="687" y="129" class="sm" text-anchor="middle">satisfied</text><text x="12" y="46" class="sm" text-anchor="start">Checked in this order. MCPJam reports the first stage that failed.</text><path d="M14,162 v8 H120 v-8" class="rule"/><text x="67.0" y="188" class="sm" text-anchor="middle">the connection</text><path d="M138,162 v8 H244 v-8" class="rule"/><text x="191.0" y="188" class="sm" text-anchor="middle">the tool catalog</text><path d="M262,162 v8 H492 v-8" class="rule"/><text x="377.0" y="188" class="sm" text-anchor="middle">the model’s choice</text><path d="M510,162 v8 H616 v-8" class="rule"/><text x="563.0" y="188" class="sm" text-anchor="middle">the server’s answer</text><text x="380" y="214" class="sm i" text-anchor="middle">Likely owner of a failure at that stage</text><circle cx="368" cy="70" r="11" class="red"/><text x="368" y="74" class="rt" text-anchor="middle">A</text><text x="12" y="250" class="sm h" text-anchor="start">Red = where it breaks.</text><text x="12" y="270" class="sm h" text-anchor="start">A</text><text x="30" y="270" class="sm" text-anchor="start">Selection: the model called search_notes when the case expected read_note. The run reports Selection;</text><text x="30" y="287" class="sm" text-anchor="start">the dashed stages after it are not where to start looking.</text></svg>
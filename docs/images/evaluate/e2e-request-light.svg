</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="350" fill="#faf9f5"/><rect x="10" y="30" width="190" height="308" rx="14" class="b"/><text x="24" y="54" class="h" text-anchor="start">What the user sees</text><text x="24" y="71" class="sm i" text-anchor="start">Claude Desktop</text><rect x="60" y="79" width="132" height="26" rx="13" class="s"/><text x="126" y="96" class="sm" text-anchor="middle">What does note 7 say?</text><rect x="20" y="236" width="160" height="46" rx="13" class="b"/><text x="32" y="255" class="sm" text-anchor="start">Note 7 says:</text><text x="32" y="272" class="sm" text-anchor="start">“Buy oat milk.”</text><rect x="284" y="30" width="222" height="308" rx="8" class="b dash"/><text x="298" y="52" class="h" text-anchor="start">Client environment</text><rect x="300" y="66" width="190" height="58" rx="4" class="b"/><text x="312" y="88" class="h" text-anchor="start">Client</text><text x="312" y="106" class="sm" text-anchor="start">Claude Desktop</text><rect x="300" y="166" width="190" height="58" rx="4" class="b"/><text x="312" y="188" class="h" text-anchor="start">Harness</text><text x="312" y="206" class="sm" text-anchor="start">MCPJam or a native one</text><rect x="300" y="264" width="190" height="58" rx="4" class="b"/><text x="312" y="286" class="h" text-anchor="start">Model</text><text x="312" y="304" class="sm mono" text-anchor="start">claude-sonnet-5</text><rect x="610" y="166" width="142" height="58" rx="4" class="s"/><text x="622" y="188" class="h" text-anchor="start">Your MCP server</text><text x="622" y="206" class="sm mono" text-anchor="start">notes</text><line x1="192" y1="92" x2="298" y2="92" class="ln"/><text x="240" y="84" class="sm mono" text-anchor="middle">1. send</text><line x1="370" y1="124" x2="370" y2="164" class="ln"/><text x="364" y="148" class="sm mono" text-anchor="end">2. prompt</text><line x1="430" y1="164" x2="430" y2="126" class="ln"/><text x="436" y="148" class="sm mono" text-anchor="start">7. answer</text><line x1="370" y1="224" x2="370" y2="262" class="ln"/><text x="364" y="246" class="sm mono" text-anchor="end">3. tools</text><line x1="430" y1="262" x2="430" y2="226" class="ln"/><text x="436" y="246" class="sm mono" text-anchor="start">4. call</text><line x1="490" y1="184" x2="608" y2="184" class="ln"/><text x="558" y="177" class="sm mono" text-anchor="middle">5. read_note 7</text><line x1="610" y1="208" x2="492" y2="208" class="ln"/><text x="558" y="226" class="sm mono" text-anchor="middle">6. note text</text><path d="M300,114 H222 V259 H182" class="ln"/><text x="228" y="196" class="sm mono" text-anchor="start">8. reply</text></svg>
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect width="760" height="400" fill="#faf9f5"/><circle cx="38" cy="112" r="13" class="b"/><path d="M14,152 Q14,130 38,130 Q62,130 62,152 Z" class="b"/><text x="38" y="172" class="h" text-anchor="middle">You</text><rect x="124" y="30" width="628" height="355" rx="8" class="b dash"/><text x="140" y="54" class="h" text-anchor="start">Client environment</text><text x="274" y="54" class="sm i" text-anchor="start">one per client and model pair</text><rect x="146" y="70" width="150" height="122" rx="4" class="b"/><text x="158" y="92" class="h" text-anchor="start">Client</text><text x="158" y="111" class="sm" text-anchor="start">model · system prompt</text><text x="158" y="128" class="sm" text-anchor="start">protocol versions</text><text x="158" y="145" class="sm" text-anchor="start">client capabilities</text><text x="158" y="162" class="sm" text-anchor="start">tool visibility</text><text x="158" y="179" class="sm" text-anchor="start">MCP App sandbox</text><rect x="370" y="70" width="170" height="122" rx="4" class="b"/><text x="382" y="92" class="h" text-anchor="start">Harness</text><text x="382" y="111" class="sm" text-anchor="start">MCPJam Harness, or the</text><text x="382" y="128" class="sm" text-anchor="start">client’s native one, such</text><text x="382" y="145" class="sm" text-anchor="start">as Claude Agent SDK or</text><text x="382" y="162" class="sm" text-anchor="start">Codex App Server; runs</text><text x="382" y="179" class="sm" text-anchor="start">the model ↔ tool loop</text><rect x="612" y="70" width="128" height="122" rx="4" class="b"/><text x="624" y="92" class="h" text-anchor="start">Model</text><text x="624" y="111" class="sm mono" text-anchor="start">claude-haiku-4.5</text><text x="624" y="128" class="sm" text-anchor="start">picked per pair</text><rect x="370" y="248" width="370" height="124" rx="4" class="s"/><text x="384" y="270" class="h" text-anchor="start">Server group</text><text x="384" y="287" class="sm" text-anchor="start">one or more servers, each with its saved auth</text><rect x="384" y="298" width="196" height="60" rx="4" class="b"/><text x="396" y="320" class="sm mono h" text-anchor="start">notes</text><text x="396" y="340" class="sm mono" text-anchor="start">read_note · search_notes</text><rect x="594" y="298" width="132" height="60" rx="4" class="b"/><text x="606" y="320" class="sm mono h" text-anchor="start">calendar</text><text x="606" y="340" class="sm mono" text-anchor="start">list_events</text><line x1="70" y1="112" x2="144" y2="112" class="ln"/><text x="118" y="104" class="sm mono" text-anchor="end">1. ask</text><line x1="144" y1="150" x2="70" y2="150" class="ln"/><text x="118" y="166" class="sm mono" text-anchor="end">8. reply</text><line x1="296" y1="112" x2="368" y2="112" class="ln"/><text x="332" y="104" class="sm mono" text-anchor="middle">2. prompt</text><line x1="368" y1="150" x2="296" y2="150" class="ln"/><text x="332" y="166" class="sm mono" text-anchor="middle">7. answer</text><line x1="540" y1="112" x2="610" y2="112" class="ln"/><text x="575" y="104" class="sm mono" text-anchor="middle">3. + tools</text><line x1="610" y1="150" x2="540" y2="150" class="ln"/><text x="575" y="166" class="sm mono" text-anchor="middle">4. call</text><line x1="410" y1="192" x2="410" y2="246" class="ln"/><text x="403" y="224" class="sm mono" text-anchor="end">5. read_note {id: 7}</text><line x1="500" y1="246" x2="500" y2="192" class="ln"/><text x="508" y="224" class="sm mono" text-anchor="start">6. note 7 text</text></svg>
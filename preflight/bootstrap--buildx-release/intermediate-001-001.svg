es and r</text><text x="20" y="815">eport any issues at\r\nhttps://github.com/docker/buildx/issues.\r\n\r\n### Contributors\r\n\r\n* CrazyMax\r\n* Tõnis Tiigi\r\n* Se</text><text x="20" y="835">bastiaan van Stijn\r\n* Eshan05\r\n* Ihor Urazov\r\n* Kevin Mingtarja\r\n* SaiPisey2\r\n\r\n### Notable Changes\r\n\r\n- Build his</text><text x="20" y="855">tory exports from remote builders are now faster by reading blobs in larger chunks. #4137\r\n- Kubernetes builders now use a start</text><text x="20" y="875">up probe to become ready sooner after BuildKit starts. #4124\r\n- The `imagetools create` command now apply untyped annotations to</text><text x="20" y="895"> the image index and report unsupported annotation targets instead of silently discarding them. #4091\r\n- Fix Git source policy h</text><text x="20" y="915">ost matching by normalizing case, internationalized names, trailing dots, and default ports. Policies must match the normalized ho</text><text x="20" y="935">st. #4171\r\n- Fix builds selecting detected worker platforms over explicitly configured platform assignments. #4133\r\n- Fix trac</text><text x="20" y="955">e decoding failures and data loss in build history and Docker Desktop bundle exports. #4156\r\n- Fix empty traces causing a panic </text><text x="20" y="975">and root spans having invalid parent references in Jaeger conversion. #4157\r\n\r\n\r\n### Dependency Changes\r\n\r\n* **github.co</text><text x="20" y="995">m/Azure/go-ansiterm**                                                  faa5f7b0171c -&gt; 8c912ac31dd4\r\n* **github.com/Microsoft/go</text><text x="20" y="1015">-winio**                                                 ad3df93bed29 -&gt; v0.6.4\r\n* **github.com/aws/aws-sdk-go-v2**             </text><text x="20" y="1035">                                     v1.47.0 -&gt; v1.47.5\r\n* **github.com/aws/aws-sdk-go-v2/config**                              </text><text x="20" y="1055">             v1.33.4 -&gt; v1.33.13\r\n* **github.com/aws/aws-sdk-go-v2/credentials**                                      v1.20.4 -&gt;</text><text x="20" y="1075"> v1.20.13\r\n* **github.com/aws/aws-sdk-go-v2/feature/ec2/imds**                                 v1.20.0 -&gt; v1.20.5\r\n* **github.</text><text x="20" y="1095">com/aws/aws-sdk-go-v2/internal/configsources**                           v1.5.3 -&gt; v1.5.8\r\n* **github.com/aws/aws-sdk-go-v2/inte</text><text x="20" y="1115">rnal/endpoints/v2**                            v2.8.3 -&gt; v2.8.8\r\n* **github.com/aws/aws-sdk-go-v2/internal/v4a**                </text><text x="20" y="1135">                     v1.5.3 -&gt; v1.5.8\r\n* **github.com/aws/aws-sdk-go-v2/service/internal/accept-encoding**                 v1.13</text><text x="20" y="1155">.19 -&gt; v1.13.23\r\n* **github.com/aws/aws-sdk-go-v2/service/internal/presigned-url**                   v1.14.3 -&gt; v1.14.8\r\n* **g</text><text x="20" y="1175">ithub.com/aws/aws-sdk-go-v2/service/signin**                                   v1.10.0 -&gt; v1.12.1\r\n* **github.com/aws/aws-sdk-go</text><text x="20" y="1195">-v2/service/sso**                                      v1.38.0 -&gt; v1.39.1\r\n* **github.com/aws/aws-sdk-go-v2/service/ssooidc**   </text><text x="20" y="1215">                               v1.43.0 -&gt; v1.44.1\r\n* **github.com/aws/aws-sdk-go-v2/service/sts**                               </text><text x="20" y="1235">       v1.50.0 -&gt; v1.51.6\r\n* **github.com/aws/smithy-go**                                                      v1.28.2 -&gt; v1.28.</text><text x="20" y="1255">8\r\n* **github.com/docker/cli**                                                         v29.8.2 -&gt; v29.9.3\r\n* **github.com/go-o</text><text x="20" y="1275">penapi/analysis**                                                v0.25.5 -&gt; v1.0.0\r\n* **github.com/go-openapi/errors**          </text><text x="20" y="1295">                                        v0.22.8 -&gt; v0.22.9\r\n* **github.com/go-openapi/jsonpointer*
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="925"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.015275001525878906s — page 2</text><text x="20" y="75">          Run enabled hooks without requiring persisted hook trust for this invocation. DANGEROUS.</text><text x="20" y="95">          Intended only for automation that already vets hook sources</text><text x="20" y="115"></text><text x="20" y="135">  -C, --cd &lt;DIR&gt;</text><text x="20" y="155">          Tell the agent to use the specified directory as its working root</text><text x="20" y="175"></text><text x="20" y="195">      --worktree</text><text x="20" y="215">          Run the session in a new managed Git worktree</text><text x="20" y="235"></text><text x="20" y="255">      --add-dir &lt;DIR&gt;</text><text x="20" y="275">          Additional directories that should be writable alongside the primary workspace</text><text x="20" y="295"></text><text x="20" y="315">      --thread-source &lt;SOURCE&gt;</text><text x="20" y="335">          Source classification for newly created or forked threads</text><text x="20" y="355"></text><text x="20" y="375">      --skip-git-repo-check</text><text x="20" y="395">          Allow running Codex outside a Git repository</text><text x="20" y="415"></text><text x="20" y="435">      --ephemeral</text><text x="20" y="455">          Run without persisting session files to disk</text><text x="20" y="475"></text><text x="20" y="495">      --ignore-user-config</text><text x="20" y="515">          Do not load `$CODEX_HOME/config.toml`; auth still uses `CODEX_HOME`</text><text x="20" y="535"></text><text x="20" y="555">      --ignore-rules</text><text x="20" y="575">          Do not load user or project execpolicy `.rules` files</text><text x="20" y="595"></text><text x="20" y="615">      --outp
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1105"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">codex-exec-help — page 2</text><text x="20" y="75"></text><text x="20" y="95">      --dangerously-bypass-hook-trust</text><text x="20" y="115">          Run enabled hooks without requiring persisted hook trust for this invocation. DANGEROUS.</text><text x="20" y="135">          Intended only for automation that already vets hook sources</text><text x="20" y="155"></text><text x="20" y="175">  -C, --cd &lt;DIR&gt;</text><text x="20" y="195">          Tell the agent to use the specified directory as its working root</text><text x="20" y="215"></text><text x="20" y="235">      --worktree</text><text x="20" y="255">          Run the session in a new managed Git worktree</text><text x="20" y="275"></text><text x="20" y="295">      --add-dir &lt;DIR&gt;</text><text x="20" y="315">          Additional directories that should be writable alongside the primary workspace</text><text x="20" y="335"></text><text x="20" y="355">      --thread-source &lt;SOURCE&gt;</text><text x="20" y="375">          Source classification for newly created or forked threads</text><text x="20" y="395"></text><text x="20" y="415">      --skip-git-repo-check</text><text x="20" y="435">          Allow running Codex outside a Git repository</text><text x="20" y="455"></text><text x="20" y="475">      --ephemeral</text><text x="20" y="495">          Run without persisting session files to disk</text><text x="20" y="515"></text><text x="20" y="535">      --ignore-user-config</text><text x="20" y="555">          Do not load `$CODEX_HOME/config.toml`; auth still uses `CODEX_HOME`</text><text x="20" y="575"></text><text x="20" y="595">      --ignore-rules</text><text x="20" y="615">          Do not load user or project execpolicy `.rules` files</text><text x="20" y="635"></text><text x="20" y="655">      --output-schema &lt;FILE&gt;</text><text x="20" y="675">          Path to a JSON Schema file describing the model&#x27;s final response shape</text><text x="20" y="695"></text><text x="20" y="715">      --color &lt;COLOR&gt;</text><text x="20" y="735">          Specifies color settings for use in the output</text><text x="20" y="755">          </text><text x="20" y="775">          [default: auto]</text><text x="20" y="795">          [possible values: always, never, auto]</text><text x="20" y="815"></text><text x="20" y="835">      --json</text><text x="20" y="855">          Print events to stdout as JSONL</text><text x="20" y="875"></text><text x="20" y="895">  -o, --output-last-message &lt;FILE&gt;</text><text x="20" y="915">          Specifies file where the last message from the agent should be written</text><text x="20" y="935"></text><text x="20" y="955">  -h, --help</text><text x="20" y="975">          Print help (see a summary with &#x27;-h&#x27;)</text><text x="20" y="995"></text><text x="20" y="1015">  -V, --version</text><text x="20" y="1035">          Print version</text><text x="20" y="1055"></text><text x="20" y="1075">[exit=0; signal=None; timeout=False]</text></g></svg>
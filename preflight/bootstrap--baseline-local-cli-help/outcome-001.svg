<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">baseline-local-cli-help — page 1</text><text x="20" y="75">$ env PATH=$USER_HOME/Documents/Codex/2026-11-14/build-and-run-a-lightweight-harbor/work/node-v24.22.1-darwin-arm64/bin:/Applicati</text><text x="20" y="95">ons/ChatGPT.app/Contents/Resources/codex-cli/codex-path:$USER_HOME/.codeium/windsurf/bin:$USER_HOME/.local/bin:$USER_HOME/.local/b</text><text x="20" y="115">in:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/System/Cryptexes/App/usr/bin:/usr/bin:/bin:/usr/sbin:/sbin:/var/run/com.ap</text><text x="20" y="135">ple.security.cryptexd/codex.system/bootstrap/usr/local/bin:/var/run/com.apple.security.cryptexd/codex.system/bootstrap/usr/bin:/va</text><text x="20" y="155">r/run/com.apple.security.cryptexd/codex.system/bootstrap/usr/appleinternal/bin:/pkg/env/global/bin:/opt/homebrew/bin:$USER_HOME/.c</text><text x="20" y="175">odex/tmp/arg0-macos/codex-arg0geNwdM:/Applications/ChatGPT.app/Contents/Resources/codex-cli/codex-path:$USER_HOME/.cache/codex-run</text><text x="20" y="195">times/codex-primary-runtime/dependencies/bin/override:$USER_HOME/.codeium/windsurf/bin:$USER_HOME/Library/pnpm:$USER_HOME/.local/b</text><text x="20" y="215">in:/opt/homebrew/sbin:$USER_HOME/.cache/codex-runtimes/codex-primary-runtime/dependencies/bin/fallback:/Applications/ChatGPT.app/C</text><text x="20" y="235">ontents/Resources:/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS DO_NOT_TRACK=1 node work/insp</text><text x="20" y="255">ector/cli/dist/index.js --help</text><text x="20" y="275">Usage: mcpjam [options] [command]</text><text x="20" y="295"></text><text x="20" y="315">Test, debug, and validate MCP servers locally, or manage MCPJam Cloud via</text><text x="20" y="335">`mcpjam cloud`. Health checks, OAuth conformance, tool-surface diffing, and</text><text x="20" y="355">structured triage from the terminal or CI.</text><text x="20" y="375"></text><text x="20" y="395">Options:</text><text x="20" y="415">  -v, --version          output the CLI version</text><text x="20" y="435">  --timeout &lt;ms&gt;         Request timeout in milliseconds (default: 30000)</text><text x="20" y="455">  --rpc                  Include RPC logs in JSON output</text><text x="20" y="475">  --quiet                Suppress non-result progress output</text><text x="20" y="495">  --no-telemetry         Disable anonymous usage telemetry</text><text x="20" y="515">  --format &lt;format&gt;      Output format</text><text x="20" y="535">  -h, --help             display help for command</text><text x="20" y="555"></text><text x="20" y="575">Local MCP testing:</text><text x="20" y="595">  test [options] &lt;file&gt;  Run a suite file locally against your MCP servers (BYOK</text><text x="20" y="615">                         or MCPJam-hosted inference). Results are never</text><text x="20" y="635">                         uploaded.</text><text x="20" y="655">  server                 Inspect MCP server connectivity and capabilities</text><text x="20" y="675">  tools                  List and invoke MCP server tools</text><text x="20" y="695">  resources              List and read MCP resources</text><text x="20" y="715">  skills                 Inspect the Agent Skills an MCP server serves</text><text x="20" y="735">                         (SEP-2640). For your project&#x27;s Cloud Skills, see</text><text x="20" y="755">                         `mcpjam cloud skills`.</text><text x="20" y="775">  subscriptions          Open a long-lived MCP subscription and stream its</text><text x="20" y="795">                         notifications (2026-07-28 subscriptions/listen, with a</text><text x="20" y="815">                         legacy fallback)</text><text x="20" y="835">  compat [options]       Check whether an MCP server&#x27;s tools and widgets work on</text><text x="20" y="855">                         each AI host (Claude, ChatGPT, Cursor, Copilot, Codex,</text><text x="20" y="875">                         Goose, …)</text><text x="20" y="895">  prompts                List and fetch MCP prompts</text><text x="20" y="915">  apps                   Validate MCP Apps metadata and resource wiring</text><text x="20" y="935">  tasks                  Create, inspect and drive MCP Tasks (legacy 2025-11-25</text><text x="20" y="955">                         and SEP-2663), and validate a server&#x27;s tasks wire</text><text x="20" y="975">                         behavior</text><text x="20" y="995">  events                 List, poll, watch, subscribe to and conformance-check</text><text x="20" y="1015">                         MCP Events (triggers, draft@28ec35e)</text><text x="20" y="1035">  oauth                  Run MCP OAuth login, proxy, and conformance flows</text><text x="20" y="1055">  xaa                    Run the Cross-App Access (ID-JAG) debugger against an</text><text x="20" y="1075">                         MCP server</text><text x="20" y="1095">  protocol               MCP protocol inspection and conformance checks</text><text x="20" y="1115">  conformance            Run MCPJam conformance suites and optionally upload</text><text x="20" y="1135">                         results</text><text x="20" y="1155">  readiness              Grade a server or plugin against a publisher&#x27;s</text><text x="20" y="1175">                         directory</text><text x="20" y="1195"></text><text x="20" y="1215">MCPJam Cloud:</text><text x="20" y="1235">  cloud [options]        MCPJam Cloud account commands (login, projects, evals,</text><text x="20" y="1255">                         tunnels). Local MCP testing stays at the top level —</text><text x="20" y="1275">                         `mcpjam oauth login` is MCP OAuth; `mcpjam cloud login`</text><text x="20" y="1295">                         is your MCPJam account.</text><text x="20" y="1315">  registry               Search MCP directories and curated cards, then install</text><text x="20" y="1335">                         into a Cloud project</text><text x="20" y="1355"></text></g></svg>
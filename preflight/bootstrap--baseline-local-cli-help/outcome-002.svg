<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="345"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">baseline-local-cli-help — page 2</text><text x="20" y="75">CLI:</text><text x="20" y="95">  inspector              Start or attach to the local MCPJam Inspector</text><text x="20" y="115">  browser                Drive a local or cloud browser and read its session</text><text x="20" y="135">                         trace</text><text x="20" y="155">  mcp                    Run MCPJam as an MCP server over stdio, so MCP clients</text><text x="20" y="175">                         (Claude Desktop, Claude Code, Cursor, ...) can connect</text><text x="20" y="195">                         to, exercise, and debug other MCP servers</text><text x="20" y="215">  telemetry              Inspect and configure anonymous CLI telemetry</text><text x="20" y="235"></text><text x="20" y="255">Commands:</text><text x="20" y="275">  help [command]         display help for command</text><text x="20" y="295"></text><text x="20" y="315">[exit=0; signal=None; timeout=False]</text></g></svg>
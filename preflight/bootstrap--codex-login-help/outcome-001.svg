<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="865"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">codex-login-help — page 1</text><text x="20" y="75">$ codex login --help</text><text x="20" y="95">WARNING: proceeding, even though we could not create PATH aliases: Operation not permitted (os error 1)</text><text x="20" y="115">Manage login</text><text x="20" y="135"></text><text x="20" y="155">Usage: codex login [OPTIONS] [COMMAND]</text><text x="20" y="175"></text><text x="20" y="195">Commands:</text><text x="20" y="215">  status  Show login status</text><text x="20" y="235">  help    Print this message or the help of the given subcommand(s)</text><text x="20" y="255"></text><text x="20" y="275">Options:</text><text x="20" y="295">  -c, --config &lt;key=[REDACTED]&gt;</text><text x="20" y="315">          Override a configuration value that would otherwise be loaded from `~/.codex/config.toml`.</text><text x="20" y="335">          Use a dotted path (`foo.bar.baz`) to override nested values. The `value` portion is parsed</text><text x="20" y="355">          as TOML. If it fails to parse as TOML, the raw string is used as a literal.</text><text x="20" y="375">          </text><text x="20" y="395">          Examples: - `-c model=&quot;o3&quot;` - `-c &#x27;sandbox_permissions=[&quot;disk-full-read-access&quot;]&#x27;` - `-c</text><text x="20" y="415">          shell_environment_policy.inherit=all`</text><text x="20" y="435"></text><text x="20" y="455">      --with-api-key</text><text x="20" y="475">          Read the API key from stdin (e.g. `printenv OPENAI_API_KEY | codex login --with-api-key`)</text><text x="20" y="495"></text><text x="20" y="515">      --enable &lt;FEATURE&gt;</text><text x="20" y="535">          Enable a feature (repeatable). Equivalent to `-c features.&lt;name&gt;=true`</text><text x="20" y="555"></text><text x="20" y="575">      --with-access-token</text><text x="20" y="595">          Read the access token from stdin (e.g. `printenv CODEX_ACCESS_TOKEN | codex login</text><text x="20" y="615">          --with-access-token`)</text><text x="20" y="635"></text><text x="20" y="655">      --disable &lt;FEATURE&gt;</text><text x="20" y="675">          Disable a feature (repeatable). Equivalent to `-c features.&lt;name&gt;=false`</text><text x="20" y="695"></text><text x="20" y="715">      --device-auth</text><text x="20" y="735">          </text><text x="20" y="755"></text><text x="20" y="775">  -h, --help</text><text x="20" y="795">          Print help (see a summary with &#x27;-h&#x27;)</text><text x="20" y="815"></text><text x="20" y="835">[exit=0; signal=None; timeout=False]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.19313812255859375s — page 2</text><text x="20" y="75">                                        one by session ID or claude.ai/code URL</text><text x="20" y="95">  -c, --continue                        Continue the most recent conversation in</text><text x="20" y="115">                                        the current directory</text><text x="20" y="135">  --dangerously-skip-permissions        Bypass all permission checks.</text><text x="20" y="155">                                        Recommended only for sandboxes with no</text><text x="20" y="175">                                        internet access.</text><text x="20" y="195">  -d, --debug [filter]                  Enable debug mode with optional category</text><text x="20" y="215">                                        filtering (e.g., --debug=hooks,mcp or</text><text x="20" y="235">                                        --debug=&#x27;!hooks,!mcp&#x27;)</text><text x="20" y="255">  --debug-file &lt;path&gt;                   Write debug logs to a specific file path</text><text x="20" y="275">                                        (implicitly enables debug mode)</text><text x="20" y="295">  --desktop                             Open in the Claude Desktop app instead</text><text x="20" y="315">                                        of the terminal (with --continue or</text><text x="20" y="335">                                        --resume &lt;id&gt; to pick the session)</text><text x="20" y="355">  --disable-slash-commands              Disable all skills and commands</text><text x="20" y="375">  --disallowedTools, --disallowed-tools &lt;tools...&gt;</text><text x="20" y="395">      Comma or space-separated list of tool names to deny (e.g. &quot;Bash(git *)</text><text x="20" y="415">      Edit&quot;)</text><text x="20" y="435">  --effort &lt;level&gt;                      Effort level for the current session</text><text x="20" y="455">                                        (low, medium, high, xhigh, max)</text><text x="20" y="475">  --environment &lt;environment_id&gt;        Create a new cloud session that runs on</text><text x="20" y="495">                                        the given self-hosted environment</text><text x="20" y="515">                                        (ccpool_...).</text><text x="20" y="535">  --exclude-dynamic-system-prompt-sections</text><text x="20" y="555">      Move per-machine sections (cwd, env info, memory paths, git status) from</text><text x="20" y="575">      the system prompt into the first user message. Improves cross-user</text><text x="20" y="595">      prompt-cache reuse. Only applies with the default system prompt (ignored</text><text x="20" y="615">      with --system-prompt). (default: false)</text><text x="20" y="635">  --fallback-model &lt;model&gt;              Enable automatic fallback to specified</text><text x="20" y="655">                                        model(s) when the default model is</text><text x="20" y="675">                                        overloaded or not available. Accepts a</text><text x="20" y="695">                                        comma-separated list to try each in</text><text x="20" y="715">                                        order. Re-tries the primary at the start</text><text x="20" y="735">                                        of each user turn.</text><text x="20" y="755">  --file &lt;specs...&gt;                     File resources to download at startup.</text><text x="20" y="775">                                        Format: file_id:relative_path (e.g.,</text><text x="20" y="795">                                        --file file_abc:doc.txt</text><text x="20" y="815">                                        file_def:img.png)</text><text x="20" y="835">  --fork-session                        When resuming, create a new session ID</text><text x="20" y="855">                                        instead of reusing the original (use</text><text x="20" y="875">                                        with --resume or --continue)</text><text x="20" y="895">  --forward-subagent-text               Forward subagent text and thinking</text><text x="20" y="915">                                        blocks as assistant/user messages with</text><text x="20" y="935">                                        parent_tool_use_id set (only works with</text><text x="20" y="955">                                        --print and --output-format=stream-json)</text><text x="20" y="975">  --from-pr [value]                     Resume a session linked to a PR by PR</text><text x="20" y="995">                                        number/URL, or open interactive picker</text><text x="20" y="1015">                                        with optional search term</text><text x="20" y="1035">  -h, --help                            Display help for command</text><text x="20" y="1055">  --ide                                 Automatically connect to IDE on startup</text><text x="20" y="1075">                                        if exactly one valid IDE is available</text><text x="20" y="1095">  --include-hook-events                 Include all hook lifecycle events in the</text><text x="20" y="1115">                                        output stream (only works with</text><text x="20" y="1135">                                        --output-format=stream-json)</text><text x="20" y="1155">  --include-partial-messages            Include partial message chunks as they</text><text x="20" y="1175">                                        arrive (only works with --print and</text><text x="20" y="1195">                                        --output-format=stream-json)</text><text x="20" y="1215">  --input-format &lt;format&gt;               Input format (only works with --print):</text><text x="20" y="1235">                                        &quot;text&quot; (default), or &quot;stream-json&quot;</text><text x="20" y="1255">                                        (realtime streaming input) (choices:</text><text x="20" y="1275">                                        &quot;text&quot;, &quot;stream-json&quot;)</text><text x="20" y="1295">  --json-schema &lt;schema&gt;                JSON Schema for structured output</text><text x="20" y="1315">                                        validation (only works with --print).</text><text x="20" y="1335">                                        Example:</text><text x="20" y="1355">{&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {&quot;name&quot;: {&quot;type&quot;: &quot;string&quot;}}, &quot;required&quot;: [&quot;name&quot;]}</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.19313812255859375s — page 4</text><text x="20" y="75">                                        tools that run commands or code (Bash,</text><text x="20" y="95">                                        PowerShell and the other code-running</text><text x="20" y="115">                                        tools) and WebFetch unless --tools names</text><text x="20" y="135">                                        them, and ignores user, project and</text><text x="20" y="155">                                        local settings files (managed settings</text><text x="20" y="175">                                        and --settings still apply; add</text><text x="20" y="195">                                        --strict-mcp-config to skip MCP servers</text><text x="20" y="215">                                        too). Also confines the file tools to</text><text x="20" y="235">                                        the working directories (--add-dir</text><text x="20" y="255">                                        included), refuses bypassPermissions,</text><text x="20" y="275">                                        and lets only a person or the configured</text><text x="20" y="295">                                        permission handler approve writes to</text><text x="20" y="315">                                        settings, git and tool-configuration</text><text x="20" y="335">                                        files.</text><text x="20" y="355">  -r, --resume [value]                  Resume a conversation by session ID or</text><text x="20" y="375">                                        name, or open interactive picker with</text><text x="20" y="395">                                        optional search term</text><text x="20" y="415">  --safe-mode                           Start with all customizations</text><text x="20" y="435">                                        (CLAUDE.md, skills, installed plugins,</text><text x="20" y="455">                                        hooks, MCP servers, custom commands and</text><text x="20" y="475">                                        agents, output styles, workflows, custom</text><text x="20" y="495">                                        themes, keybindings, and more) disabled</text><text x="20" y="515">                                        — useful for troubleshooting a broken</text><text x="20" y="535">                                        configuration. Admin-managed (policy)</text><text x="20" y="555">                                        settings still apply. Auth, model</text><text x="20" y="575">                                        selection, built-in tools and plugins,</text><text x="20" y="595">                                        and permissions work normally. Sets</text><text x="20" y="615">                                        CLAUDE_CODE_SAFE_MODE=1.</text><text x="20" y="635">  --session-id &lt;uuid&gt;                   Use a specific session ID for the</text><text x="20" y="655">                                        conversation (must be a valid UUID)</text><text x="20" y="675">  --setting-sources &lt;sources&gt;           Comma-separated list of setting sources</text><text x="20" y="695">                                        to load (user, project, local).</text><text x="20" y="715">  --settings &lt;file-or-json&gt;             Path to a settings JSON file or a JSON</text><text x="20" y="735">                                        string to load additional settings from</text><text x="20" y="755">  --strict-mcp-config                   Only use MCP servers from --mcp-config,</text><text x="20" y="775">                                        ignoring all other MCP configurations</text><text x="20" y="795">  --system-prompt &lt;prompt&gt;              System prompt to use for the session</text><text x="20" y="815">  --system-prompt-snapshot &lt;on|off&gt;     Record the system prompt once per</text><text x="20" y="835">                                        conversation and reuse it verbatim on</text><text x="20" y="855">                                        every request and resume. on (the</text><text x="20" y="875">                                        default, except under --bare outside</text><text x="20" y="895">                                        cloud and background sessions): the</text><text x="20" y="915">                                        prompt is rendered on the conversation&#x27;s</text><text x="20" y="935">                                        first request — a --system-prompt or</text><text x="20" y="955">                                        --append-system-prompt included — sent,</text><text x="20" y="975">                                        and recorded; every later request and</text><text x="20" y="995">                                        resume sends the record as-is, even when</text><text x="20" y="1015">                                        a later launch passes different text,</text><text x="20" y="1035">                                        until the conversation is compacted.</text><text x="20" y="1055">                                        off: never record; the prompt is</text><text x="20" y="1075">                                        rendered fresh every request (for</text><text x="20" y="1095">                                        iterating on prompt text). (choices:</text><text x="20" y="1115">                                        &quot;on&quot;, &quot;off&quot;)</text><text x="20" y="1135">  --teleport [session]                  Resume a teleport session, optionally</text><text x="20" y="1155">                                        specify session ID</text><text x="20" y="1175">  --tmux                                Create a tmux session for the worktree</text><text x="20" y="1195">                                        (requires --worktree). Uses iTerm2</text><text x="20" y="1215">                                        native panes when available; use</text><text x="20" y="1235">                                        --tmux=classic for traditional tmux.</text><text x="20" y="1255">  --tools &lt;tools...&gt;                    Specify the list of available tools from</text><text x="20" y="1275">                                        the built-in set. Use &quot;&quot; to disable all</text><text x="20" y="1295">                                        tools, &quot;default&quot; to use the default set,</text><text x="20" y="1315">                                        or specify tool names (e.g.</text><text x="20" y="1335">                                        &quot;Bash,Edit,Read&quot;).</text><text x="20" y="1355">  --verbose                             Override verbose mode setting from</text></g></svg>
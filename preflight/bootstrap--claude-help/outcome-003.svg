<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">claude-help — page 3</text><text x="20" y="75">{&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {&quot;name&quot;: {&quot;type&quot;: &quot;string&quot;}}, &quot;required&quot;: [&quot;name&quot;]}</text><text x="20" y="95">  --max-budget-usd &lt;amount&gt;             Maximum dollar amount to spend on API</text><text x="20" y="115">                                        calls (only works with --print)</text><text x="20" y="135">  --mcp-config &lt;configs...&gt;             Load MCP servers from JSON files or</text><text x="20" y="155">                                        strings (space-separated)</text><text x="20" y="175">  --model &lt;model&gt;                       Model for the current session. Provide</text><text x="20" y="195">                                        an alias for the latest model (e.g.</text><text x="20" y="215">                                        &#x27;fable&#x27;, &#x27;opus&#x27;, or &#x27;sonnet&#x27;) or a</text><text x="20" y="235">                                        model&#x27;s full name.</text><text x="20" y="255">  -n, --name &lt;name&gt;                     Set a display name for this session</text><text x="20" y="275">                                        (shown in the prompt box, /resume</text><text x="20" y="295">                                        picker, and terminal title)</text><text x="20" y="315">  --no-chrome                           Disable Claude in Chrome integration</text><text x="20" y="335">  --no-session-persistence              Disable session persistence - sessions</text><text x="20" y="355">                                        will not be saved to disk and cannot be</text><text x="20" y="375">                                        resumed (only works with --print)</text><text x="20" y="395">  --output-format &lt;format&gt;              Output format (only works with --print):</text><text x="20" y="415">                                        &quot;text&quot; (default), &quot;json&quot; (single</text><text x="20" y="435">                                        result), or &quot;stream-json&quot; (realtime</text><text x="20" y="455">                                        streaming) (choices: &quot;text&quot;, &quot;json&quot;,</text><text x="20" y="475">                                        &quot;stream-json&quot;)</text><text x="20" y="495">  --permission-mode &lt;mode&gt;              Permission mode to use for the session</text><text x="20" y="515">                                        (choices: &quot;acceptEdits&quot;, &quot;auto&quot;,</text><text x="20" y="535">                                        &quot;bypassPermissions&quot;, &quot;manual&quot;,</text><text x="20" y="555">                                        &quot;dontAsk&quot;, &quot;plan&quot;)</text><text x="20" y="575">  --permission-prompts &lt;target&gt;         Who answers permission prompts with</text><text x="20" y="595">                                        --print: &quot;host&quot; (the SDK host or</text><text x="20" y="615">                                        --permission-prompt-tool) or &quot;none&quot;</text><text x="20" y="635">                                        (nobody: anything that would prompt is</text><text x="20" y="655">                                        denied automatically; the permission</text><text x="20" y="675">                                        mode still decides everything else)</text><text x="20" y="695">                                        (choices: &quot;host&quot;, &quot;none&quot;, default:</text><text x="20" y="715">                                        &quot;host&quot;)</text><text x="20" y="735">  --plugin-dir &lt;path&gt;                   Load a plugin from a directory or .zip</text><text x="20" y="755">                                        for this session only; a folder of</text><text x="20" y="775">                                        plugins loads each child (repeatable:</text><text x="20" y="795">                                        --plugin-dir A --plugin-dir B.zip)</text><text x="20" y="815">                                        (default: [])</text><text x="20" y="835">  --plugin-url &lt;url&gt;                    Fetch a plugin .zip from a URL for this</text><text x="20" y="855">                                        session only (repeatable: --plugin-url A</text><text x="20" y="875">                                        --plugin-url B) (default: [])</text><text x="20" y="895">  -p, --print                           Print response and exit (useful for</text><text x="20" y="915">                                        pipes). Note: The workspace trust dialog</text><text x="20" y="935">                                        is skipped when Claude is run in</text><text x="20" y="955">                                        non-interactive mode (via -p, or when</text><text x="20" y="975">                                        stdout is not a TTY, e.g. piped or</text><text x="20" y="995">                                        redirected output). Only use this in</text><text x="20" y="1015">                                        directories you trust. Settings files</text><text x="20" y="1035">                                        that fail validation are silently</text><text x="20" y="1055">                                        ignored in this mode (no error dialog is</text><text x="20" y="1075">                                        shown).</text><text x="20" y="1095">  --prompt-suggestions [value]          Enable prompt suggestions. In print/SDK</text><text x="20" y="1115">                                        mode, emits a prompt_suggestion message</text><text x="20" y="1135">                                        after each turn with a predicted next</text><text x="20" y="1155">                                        user prompt (choices: &quot;true&quot;, &quot;false&quot;,</text><text x="20" y="1175">                                        &quot;1&quot;, &quot;0&quot;, &quot;yes&quot;, &quot;no&quot;, &quot;on&quot;, &quot;off&quot;,</text><text x="20" y="1195">                                        preset: &quot;true&quot;)</text><text x="20" y="1215">  --remote-control [name]               Start an interactive session with Remote</text><text x="20" y="1235">                                        Control enabled (optionally named)</text><text x="20" y="1255">  --remote-control-session-name-prefix &lt;prefix&gt;</text><text x="20" y="1275">      Prefix for auto-generated Remote Control session names (default: hostname)</text><text x="20" y="1295">  --replay-user-messages                Re-emit user messages from stdin back on</text><text x="20" y="1315">                                        stdout for acknowledgment (only works</text><text x="20" y="1335">                                        with --input-format=stream-json and</text><text x="20" y="1355">                                        --output-format=stream-json)</text></g></svg>
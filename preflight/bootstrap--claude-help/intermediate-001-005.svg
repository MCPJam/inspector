<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1185"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.19313812255859375s — page 5</text><text x="20" y="75">                                        config</text><text x="20" y="95">  -v, --version                         Output the version number</text><text x="20" y="115">  -w, --worktree [name]                 Create a new git worktree for this</text><text x="20" y="135">                                        session (optionally specify a name)</text><text x="20" y="155"></text><text x="20" y="175">Commands:</text><text x="20" y="195">  agents [options]                      Manage background agents</text><text x="20" y="215">  attach &lt;id|name&gt;                      Open a background session in this</text><text x="20" y="235">                                        terminal. &lt;id&gt; is the short id that</text><text x="20" y="255">                                        `claude --bg` prints and `claude agents`</text><text x="20" y="275">                                        lists. Part of the session name works</text><text x="20" y="295">                                        too</text><text x="20" y="315">  auth                                  Manage authentication</text><text x="20" y="335">  auto-mode                             Inspect or reset auto mode configuration</text><text x="20" y="355">  doctor                                Check the health of your Claude Code</text><text x="20" y="375">                                        installation. Reads settings files in</text><text x="20" y="395">                                        the current directory without a trust</text><text x="20" y="415">                                        prompt. For a full checkup that can also</text><text x="20" y="435">                                        fix issues, run /doctor in a session.</text><text x="20" y="455">  gateway [options]                     Run the enterprise auth/telemetry</text><text x="20" y="475">                                        gateway</text><text x="20" y="495">  import [options] [source]             Import config from another AI coding</text><text x="20" y="515">                                        agent into Claude Code</text><text x="20" y="535">  install [options] [target]            Install Claude Code native build. Use</text><text x="20" y="555">                                        [target] to specify version (stable,</text><text x="20" y="575">                                        latest, or specific version)</text><text x="20" y="595">  logs &lt;id|name&gt;                        Print a background session&#x27;s recent</text><text x="20" y="615">                                        terminal output</text><text x="20" y="635">  mcp                                   Configure and manage MCP servers</text><text x="20" y="655">  plugin|plugins                        Manage Claude Code plugins</text><text x="20" y="675">  purge [options] [path]                Delete a project&#x27;s Claude Code data</text><text x="20" y="695">                                        (transcripts, tasks, file history, and</text><text x="20" y="715">                                        its entry in ~/.claude.json) from this</text><text x="20" y="735">                                        computer only</text><text x="20" y="755">  respawn [options] [id]                Restart a background session, or all of</text><text x="20" y="775">                                        them with --all, so it runs the current</text><text x="20" y="795">                                        Claude Code version</text><text x="20" y="815">  rm &lt;id&gt;                               If it&#x27;s safe, remove a background</text><text x="20" y="835">                                        session from the list and delete its</text><text x="20" y="855">                                        worktree. Its conversation is kept:</text><text x="20" y="875">                                        `claude --resume` lists it. Works on</text><text x="20" y="895">                                        sessions that have already exited</text><text x="20" y="915">  setup-token                           Set up a long-lived authentication token</text><text x="20" y="935">                                        (requires Claude subscription)</text><text x="20" y="955">  stop|kill &lt;id&gt;                        Stop a background session. Its</text><text x="20" y="975">                                        conversation is kept: `claude attach</text><text x="20" y="995">                                        &lt;id&gt;` opens it again, `claude --resume`</text><text x="20" y="1015">                                        works once it is stopped</text><text x="20" y="1035">  ultrareview [options] [target]        Run a cloud-hosted multi-agent code</text><text x="20" y="1055">                                        review of the current branch (or a PR</text><text x="20" y="1075">                                        number / base branch) and print the</text><text x="20" y="1095">                                        findings</text><text x="20" y="1115">  update|upgrade                        Check for updates and install if</text><text x="20" y="1135">                                        available; package-manager installs</text><text x="20" y="1155">                                        update through the package manager</text></g></svg>
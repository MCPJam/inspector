<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.19313812255859375s — page 1</text><text x="20" y="75">Usage: claude [options] [command] [prompt]</text><text x="20" y="95"></text><text x="20" y="115">Claude Code - starts an interactive session by default, use -p/--print for</text><text x="20" y="135">non-interactive output</text><text x="20" y="155"></text><text x="20" y="175">Arguments:</text><text x="20" y="195">  prompt                                Your prompt</text><text x="20" y="215"></text><text x="20" y="235">Options:</text><text x="20" y="255">  --add-dir &lt;directories...&gt;            Additional directories to allow tool</text><text x="20" y="275">                                        access to</text><text x="20" y="295">  --agent &lt;agent&gt;                       Agent for the current session. Overrides</text><text x="20" y="315">                                        the &#x27;agent&#x27; setting.</text><text x="20" y="335">  --agents &lt;json-or-file&gt;               JSON object defining custom agents, or</text><text x="20" y="355">                                        with --print the path to a file that</text><text x="20" y="375">                                        holds one (e.g. &#x27;{&quot;reviewer&quot;:</text><text x="20" y="395">                                        {&quot;description&quot;: &quot;Reviews code&quot;,</text><text x="20" y="415">                                        &quot;prompt&quot;: &quot;You are a code reviewer&quot;}}&#x27;)</text><text x="20" y="435">  --allow-dangerously-skip-permissions  Enable bypassing all permission checks</text><text x="20" y="455">                                        as an option, without it being enabled</text><text x="20" y="475">                                        by default. Recommended only for</text><text x="20" y="495">                                        sandboxes with no internet access.</text><text x="20" y="515">  --allowedTools, --allowed-tools &lt;tools...&gt;</text><text x="20" y="535">      Comma or space-separated list of tool names to allow (e.g. &quot;Bash(git *)</text><text x="20" y="555">      Edit&quot;)</text><text x="20" y="575">  --append-system-prompt &lt;prompt&gt;       Append a system prompt to the default</text><text x="20" y="595">                                        system prompt</text><text x="20" y="615">  --autocompact &lt;auto|tokens&gt;           Auto-compact window size (auto, or</text><text x="20" y="635">                                        100k–1M tokens)</text><text x="20" y="655">  --ax-screen-reader                    Render screen-reader friendly output</text><text x="20" y="675">                                        (flat text, no decorative borders or</text><text x="20" y="695">                                        animations).</text><text x="20" y="715">  --bg, --background                    Start the session in the background and</text><text x="20" y="735">                                        return immediately. Prints the id that</text><text x="20" y="755">                                        `claude attach`, `logs`, `stop` and `rm`</text><text x="20" y="775">                                        take; `claude agents` lists them. With</text><text x="20" y="795">                                        --resume &lt;session-id&gt;, continues that</text><text x="20" y="815">                                        session in the background under the same</text><text x="20" y="835">                                        ID, or starts a copy and says so when</text><text x="20" y="855">                                        the session is already running</text><text x="20" y="875">  --bare                                Minimal mode: skip hooks (those defined</text><text x="20" y="895">                                        in settings and by installed plugins;</text><text x="20" y="915">                                        features built into Claude Code are</text><text x="20" y="935">                                        unaffected), LSP, plugin sync,</text><text x="20" y="955">                                        attribution, auto-memory, background</text><text x="20" y="975">                                        prefetches, keychain reads, and</text><text x="20" y="995">                                        CLAUDE.md auto-discovery. Sets</text><text x="20" y="1015">                                        CLAUDE_CODE_SIMPLE=1. Anthropic auth is</text><text x="20" y="1035">                                        strictly ANTHROPIC_API_KEY or</text><text x="20" y="1055">                                        apiKeyHelper via --settings (OAuth and</text><text x="20" y="1075">                                        keychain are never read). 3P providers</text><text x="20" y="1095">                                        (Bedrock/Vertex/Foundry) use their own</text><text x="20" y="1115">                                        credentials. Skills still resolve via</text><text x="20" y="1135">                                        /skill-name. Explicitly provide context</text><text x="20" y="1155">                                        via: --system-prompt[-file],</text><text x="20" y="1175">                                        --append-system-prompt[-file], --add-dir</text><text x="20" y="1195">                                        (CLAUDE.md dirs), --mcp-config,</text><text x="20" y="1215">                                        --settings, --agents, --plugin-dir.</text><text x="20" y="1235">  --betas &lt;betas...&gt;                    Beta headers to include in API requests</text><text x="20" y="1255">                                        (API key users only)</text><text x="20" y="1275">  --brief                               Enable SendUserMessage tool for</text><text x="20" y="1295">                                        agent-to-user communication</text><text x="20" y="1315">  --chrome                              Enable Claude in Chrome integration</text><text x="20" y="1335">  --cloud [description|session_id|url]  Create a cloud session with the given</text><text x="20" y="1355">                                        description, or attach to an existing</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.5996041297912598s — page 1</text><text x="20" y="75">╭─ Harbor Hub ─────────────────────────────────────────────────────────────────╮</text><text x="20" y="95">│ --upload                          &lt;bool&gt;            Upload the finished job  │</text><text x="20" y="115">│                                                     to Harbor Hub for        │</text><text x="20" y="135">│                                                     sharing.                 │</text><text x="20" y="155">│ --launch                          &lt;bool&gt;            Run on Harbor Hub.       │</text><text x="20" y="175">│ --dry-run                         &lt;bool&gt;            Validate config,         │</text><text x="20" y="195">│                                                     preflight, and task      │</text><text x="20" y="215">│                                                     metadata without         │</text><text x="20" y="235">│                                                     downloading tasks,       │</text><text x="20" y="255">│                                                     cloning repositories, or │</text><text x="20" y="275">│                                                     running trials. With     │</text><text x="20" y="295">│                                                     --server, resolves       │</text><text x="20" y="315">│                                                     inputs on the server     │</text><text x="20" y="335">│                                                     without submitting a job │</text><text x="20" y="355">│                                                     (may download tasks).    │</text><text x="20" y="375">│                                                     With --launch, validates │</text><text x="20" y="395">│                                                     on Hub without queuing   │</text><text x="20" y="415">│                                                     or charging quota. With  │</text><text x="20" y="435">│                                                     --diff, resolves tasks   │</text><text x="20" y="455">│                                                     and downloads source     │</text><text x="20" y="475">│                                                     jobs as needed, then     │</text><text x="20" y="495">│                                                     shows the comparison     │</text><text x="20" y="515">│                                                     without prompting or     │</text><text x="20" y="535">│                                                     running trials.          │</text><text x="20" y="555">│ --use-static-ip                   &lt;bool&gt;            Use a static outbound    │</text><text x="20" y="575">│                                                     IP. Requires --launch.   │</text><text x="20" y="595">│ --credential-mode                 &lt;gateway|direct&gt;  Model credentials via    │</text><text x="20" y="615">│                                                     Hub proxy (gateway) or   │</text><text x="20" y="635">│                                                     native provider endpoint │</text><text x="20" y="655">│                                                     (direct). Default:       │</text><text x="20" y="675">│                                                     gateway. Requires        │</text><text x="20" y="695">│                                                     --launch.                │</text><text x="20" y="715">│ --one-off-secret                  NAME[=VALUE]      Job-only secret; bare    │</text><text x="20" y="735">│                                                     NAME reads your          │</text><text x="20" y="755">│                                                     environment. Overrides   │</text><text x="20" y="775">│                                                     account-wide secrets;    │</text><text x="20" y="795">│                                                     encrypted and revoked at │</text><text x="20" y="815">│                                                     job end. Requires        │</text><text x="20" y="835">│                                                     --launch. Repeatable.    │</text><text x="20" y="855">│ --stored-secret                   NAME[@TAG][=AS]   Grant an owning-org      │</text><text x="20" y="875">│                                                     secret to all agents,    │</text><text x="20" y="895">│                                                     adding to config         │</text><text x="20" y="915">│                                                     selections. Requires     │</text><text x="20" y="935">│                                                     --launch. Repeatable.    │</text><text x="20" y="955">│                                                     Select credentials or    │</text><text x="20" y="975">│                                                     use --no-secrets         │</text><text x="20" y="995">│                                                     (oracle/nop exempt).     │</text><text x="20" y="1015">│ --no-secrets                      &lt;bool&gt;            Launch without           │</text><text x="20" y="1035">│                                                     credentials. Conflicts   │</text><text x="20" y="1055">│                                                     with secret selections   │</text><text x="20" y="1075">│                                                     in flags or config.      │</text><text x="20" y="1095">│                                                     Requires --launch.       │</text><text x="20" y="1115">│ --registry-secret                 HOST=NAME_OR_ID   Select a stored          │</text><text x="20" y="1135">│                                                     image-pull secret when   │</text><text x="20" y="1155">│                                                     multiple credentials     │</text><text x="20" y="1175">│                                                     match a host. Requires   │</text><text x="20" y="1195">│                                                     --launch. Repeatable.    │</text><text x="20" y="1215">│ --public             --private    &lt;bool&gt;            Uploaded job visibility  │</text><text x="20" y="1235">│                                                     (default: private).      │</text><text x="20" y="1255">│                                                     Requires --upload.       │</text><text x="20" y="1275">│ --share                           &lt;list[str]&gt;       Share the job with an    │</text><text x="20" y="1295">│                                                     organization. Requires   │</text><text x="20" y="1315">│                                                     --upload or --launch.    │</text><text x="20" y="1335">│                                                     Repeatable.              │</text><text x="20" y="1355">│ --org                             &lt;str&gt;             Owning organization      │</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">harbor-run-help — page 1</text><text x="20" y="75">$ work/venv/bin/harbor run --help</text><text x="20" y="95">                                                                                </text><text x="20" y="115"> Usage: harbor run [OPTIONS]                                                    </text><text x="20" y="135">                                                                                </text><text x="20" y="155"> Start a job. Alias for `harbor job start`.                                     </text><text x="20" y="175">                                                                                </text><text x="20" y="195">╭─ Options ────────────────────────────────────────────────────────────────────╮</text><text x="20" y="215">│ --help  -h      &lt;bool&gt;  Show this message and exit.                          │</text><text x="20" y="235">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="255">╭─ Config ─────────────────────────────────────────────────────────────────────╮</text><text x="20" y="275">│ --config        -c      &lt;list[str]&gt;  YAML/JSON JobConfig file or GitHub URL. │</text><text x="20" y="295">│                                      Repeatable; later configs override      │</text><text x="20" y="315">│                                      earlier ones. Additive lists append; [] │</text><text x="20" y="335">│                                      clears them. Schema: harbor job schema. │</text><text x="20" y="355">│ --diff                  &lt;list[str]&gt;  Source job directory or Harbor Hub job  │</text><text x="20" y="375">│                                      UUID to compare against. Can be used    │</text><text x="20" y="395">│                                      multiple times. Prints a                │</text><text x="20" y="415">│                                      reuse/regrade/rerun preview before      │</text><text x="20" y="435">│                                      running a job.                          │</text><text x="20" y="455">│ --print-config          &lt;bool&gt;       Print the resolved JobConfig JSON and   │</text><text x="20" y="475">│                                      exit.                                   │</text><text x="20" y="495">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="515">╭─ Job Settings ───────────────────────────────────────────────────────────────╮</text><text x="20" y="535">│ --job-name                       &lt;str&gt;               Name of the job         │</text><text x="20" y="555">│                                                      (default: timestamp)    │</text><text x="20" y="575">│ --jobs-dir               -o      &lt;path&gt;              Directory to store job  │</text><text x="20" y="595">│                                                      results (default: jobs) │</text><text x="20" y="615">│ --n-attempts             -k      &lt;int&gt;               Number of attempts per  │</text><text x="20" y="635">│                                                      trial (default: 1)      │</text><text x="20" y="655">│ --timeout-multiplier             &lt;float&gt;             Multiplier for task     │</text><text x="20" y="675">│                                                      timeouts (default: 1.0) │</text><text x="20" y="695">│ --agent-timeout-multip…          &lt;float&gt;             Multiplier for agent    │</text><text x="20" y="715">│                                                      execution timeout       │</text><text x="20" y="735">│                                                      (overrides              │</text><text x="20" y="755">│                                                      --timeout-multiplier)   │</text><text x="20" y="775">│ --verifier-timeout-mul…          &lt;float&gt;             Multiplier for verifier │</text><text x="20" y="795">│                                                      timeout (overrides      │</text><text x="20" y="815">│                                                      --timeout-multiplier)   │</text><text x="20" y="835">│ --agent-setup-timeout-…          &lt;float&gt;             Multiplier for agent    │</text><text x="20" y="855">│                                                      setup timeout           │</text><text x="20" y="875">│                                                      (overrides              │</text><text x="20" y="895">│                                                      --timeout-multiplier)   │</text><text x="20" y="915">│ --environment-build-ti…          &lt;float&gt;             Multiplier for          │</text><text x="20" y="935">│                                                      environment build       │</text><text x="20" y="955">│                                                      timeout (overrides      │</text><text x="20" y="975">│                                                      --timeout-multiplier)   │</text><text x="20" y="995">│ --quiet,--silent         -q      &lt;bool&gt;              Suppress individual     │</text><text x="20" y="1015">│                                                      trial progress displays │</text><text x="20" y="1035">│ --debug                          &lt;bool&gt;              Enable debug logging    │</text><text x="20" y="1055">│ --n-concurrent           -n      &lt;int&gt;               Number of concurrent    │</text><text x="20" y="1075">│                                                      trials to run (default: │</text><text x="20" y="1095">│                                                      4)                      │</text><text x="20" y="1115">│ --n-concurrent-agents            &lt;int range&gt; [x&gt;=1]  Per-agent execution     │</text><text x="20" y="1135">│                                                      concurrency cap, at     │</text><text x="20" y="1155">│                                                      most --n-concurrent.    │</text><text x="20" y="1175">│                                                      Local only;             │</text><text x="20" y="1195">│                                                      incompatible with       │</text><text x="20" y="1215">│                                                      --launch. Default:      │</text><text x="20" y="1235">│                                                      unset.                  │</text><text x="20" y="1255">│ --max-retries            -r      &lt;int&gt;               Maximum number of retry │</text><text x="20" y="1275">│                                                      attempts (default: 0)   │</text><text x="20" y="1295">│ --retry-include                  &lt;list[str]&gt;         Exception types to      │</text><text x="20" y="1315">│                                                      retry on. If not        │</text><text x="20" y="1335">│                                                      specified, all          │</text><text x="20" y="1355">│                                                      exceptions except those │</text></g></svg>
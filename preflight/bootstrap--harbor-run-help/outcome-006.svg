<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">harbor-run-help — page 6</text><text x="20" y="75">│                                                          verification (skip  │</text><text x="20" y="95">│                                                          running tests)      │</text><text x="20" y="115">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="135">╭─ Dataset ────────────────────────────────────────────────────────────────────╮</text><text x="20" y="155">│ --path                    -p      &lt;path&gt;        Path to a local task or      │</text><text x="20" y="175">│                                                 dataset directory            │</text><text x="20" y="195">│ --extra-instruction-path          &lt;list[Path]&gt;  Append instruction file      │</text><text x="20" y="215">│                                                 before --extra-instruction   │</text><text x="20" y="235">│                                                 text. Repeatable.            │</text><text x="20" y="255">│ --extra-instruction               &lt;list[str]&gt;   Append instruction text      │</text><text x="20" y="275">│                                                 after                        │</text><text x="20" y="295">│                                                 --extra-instruction-path     │</text><text x="20" y="315">│                                                 files. Repeatable.           │</text><text x="20" y="335">│ --dataset                 -d      &lt;str&gt;         Dataset name@version (e.g.,  │</text><text x="20" y="355">│                                                 &#x27;dataset@1.0&#x27;)               │</text><text x="20" y="375">│ --registry-path                   &lt;path&gt;        Path to a registry.json file │</text><text x="20" y="395">│                                                 or its parent directory.     │</text><text x="20" y="415">│                                                 With --repo, this is a       │</text><text x="20" y="435">│                                                 repo-relative path.          │</text><text x="20" y="455">│ --repo                            &lt;str&gt;         Git registry to resolve      │</text><text x="20" y="475">│                                                 datasets from (e.g.          │</text><text x="20" y="495">│                                                 &#x27;org/name&#x27;, a GitHub/Hugging │</text><text x="20" y="515">│                                                 Face/GitLab URL, optionally  │</text><text x="20" y="535">│                                                 pinned with &#x27;@ref&#x27;).         │</text><text x="20" y="555">│ --task                    -t      &lt;str&gt;         Run a single task from the   │</text><text x="20" y="575">│                                                 registry (org/name)          │</text><text x="20" y="595">│ --include-task-name       -i      &lt;list[str]&gt;   Task name to include from    │</text><text x="20" y="615">│                                                 dataset (supports glob       │</text><text x="20" y="635">│                                                 patterns)                    │</text><text x="20" y="655">│ --exclude-task-name       -x      &lt;list[str]&gt;   Task name to exclude from    │</text><text x="20" y="675">│                                                 dataset (supports glob       │</text><text x="20" y="695">│                                                 patterns)                    │</text><text x="20" y="715">│ --n-tasks                 -l      &lt;int&gt;         Maximum number of tasks to   │</text><text x="20" y="735">│                                                 run (applied after other     │</text><text x="20" y="755">│                                                 filters)                     │</text><text x="20" y="775">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="795">╭─ Integrations ───────────────────────────────────────────────────────────────╮</text><text x="20" y="815">│ --plugin                   &lt;list[str]&gt;  Import path for a job plugin class   │</text><text x="20" y="835">│                                         (module:ClassName). Repeatable.      │</text><text x="20" y="855">│ --pk,--plugin-kwarg        &lt;list[str]&gt;  key=[REDACTED] for one plugin, or         │</text><text x="20" y="875">│                                         PLUGIN.key=[REDACTED] to target a         │</text><text x="20" y="895">│                                         --plugin import path. Repeatable.    │</text><text x="20" y="915">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="935">╭─ Harbor Hub ─────────────────────────────────────────────────────────────────╮</text><text x="20" y="955">│ --upload                          &lt;bool&gt;            Upload the finished job  │</text><text x="20" y="975">│                                                     to Harbor Hub for        │</text><text x="20" y="995">│                                                     sharing.                 │</text><text x="20" y="1015">│ --launch                          &lt;bool&gt;            Run on Harbor Hub.       │</text><text x="20" y="1035">│ --dry-run                         &lt;bool&gt;            Validate config,         │</text><text x="20" y="1055">│                                                     preflight, and task      │</text><text x="20" y="1075">│                                                     metadata without         │</text><text x="20" y="1095">│                                                     downloading tasks,       │</text><text x="20" y="1115">│                                                     cloning repositories, or │</text><text x="20" y="1135">│                                                     running trials. With     │</text><text x="20" y="1155">│                                                     --server, resolves       │</text><text x="20" y="1175">│                                                     inputs on the server     │</text><text x="20" y="1195">│                                                     without submitting a job │</text><text x="20" y="1215">│                                                     (may download tasks).    │</text><text x="20" y="1235">│                                                     With --launch, validates │</text><text x="20" y="1255">│                                                     on Hub without queuing   │</text><text x="20" y="1275">│                                                     or charging quota. With  │</text><text x="20" y="1295">│                                                     --diff, resolves tasks   │</text><text x="20" y="1315">│                                                     and downloads source     │</text><text x="20" y="1335">│                                                     jobs as needed, then     │</text><text x="20" y="1355">│                                                     shows the comparison     │</text></g></svg>
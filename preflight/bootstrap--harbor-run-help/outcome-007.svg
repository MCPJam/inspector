<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1225"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">harbor-run-help — page 7</text><text x="20" y="75">│                                                     without prompting or     │</text><text x="20" y="95">│                                                     running trials.          │</text><text x="20" y="115">│ --use-static-ip                   &lt;bool&gt;            Use a static outbound    │</text><text x="20" y="135">│                                                     IP. Requires --launch.   │</text><text x="20" y="155">│ --credential-mode                 &lt;gateway|direct&gt;  Model credentials via    │</text><text x="20" y="175">│                                                     Hub proxy (gateway) or   │</text><text x="20" y="195">│                                                     native provider endpoint │</text><text x="20" y="215">│                                                     (direct). Default:       │</text><text x="20" y="235">│                                                     gateway. Requires        │</text><text x="20" y="255">│                                                     --launch.                │</text><text x="20" y="275">│ --one-off-secret                  NAME[=VALUE]      Job-only secret; bare    │</text><text x="20" y="295">│                                                     NAME reads your          │</text><text x="20" y="315">│                                                     environment. Overrides   │</text><text x="20" y="335">│                                                     account-wide secrets;    │</text><text x="20" y="355">│                                                     encrypted and revoked at │</text><text x="20" y="375">│                                                     job end. Requires        │</text><text x="20" y="395">│                                                     --launch. Repeatable.    │</text><text x="20" y="415">│ --stored-secret                   NAME[@TAG][=AS]   Grant an owning-org      │</text><text x="20" y="435">│                                                     secret to all agents,    │</text><text x="20" y="455">│                                                     adding to config         │</text><text x="20" y="475">│                                                     selections. Requires     │</text><text x="20" y="495">│                                                     --launch. Repeatable.    │</text><text x="20" y="515">│                                                     Select credentials or    │</text><text x="20" y="535">│                                                     use --no-secrets         │</text><text x="20" y="555">│                                                     (oracle/nop exempt).     │</text><text x="20" y="575">│ --no-secrets                      &lt;bool&gt;            Launch without           │</text><text x="20" y="595">│                                                     credentials. Conflicts   │</text><text x="20" y="615">│                                                     with secret selections   │</text><text x="20" y="635">│                                                     in flags or config.      │</text><text x="20" y="655">│                                                     Requires --launch.       │</text><text x="20" y="675">│ --registry-secret                 HOST=NAME_OR_ID   Select a stored          │</text><text x="20" y="695">│                                                     image-pull secret when   │</text><text x="20" y="715">│                                                     multiple credentials     │</text><text x="20" y="735">│                                                     match a host. Requires   │</text><text x="20" y="755">│                                                     --launch. Repeatable.    │</text><text x="20" y="775">│ --public             --private    &lt;bool&gt;            Uploaded job visibility  │</text><text x="20" y="795">│                                                     (default: private).      │</text><text x="20" y="815">│                                                     Requires --upload.       │</text><text x="20" y="835">│ --share                           &lt;list[str]&gt;       Share the job with an    │</text><text x="20" y="855">│                                                     organization. Requires   │</text><text x="20" y="875">│                                                     --upload or --launch.    │</text><text x="20" y="895">│                                                     Repeatable.              │</text><text x="20" y="915">│ --org                             &lt;str&gt;             Owning organization      │</text><text x="20" y="935">│                                                     (default: personal org). │</text><text x="20" y="955">│                                                     Requires --upload or     │</text><text x="20" y="975">│                                                     --launch.                │</text><text x="20" y="995">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="1015">╭─ Rollout Server ─────────────────────────────────────────────────────────────╮</text><text x="20" y="1035">│ --server        &lt;str&gt;   Submit to a harbor rollout server. Paths in the job  │</text><text x="20" y="1055">│                         config refer to the server filesystem; files are not │</text><text x="20" y="1075">│                         uploaded.                                            │</text><text x="20" y="1095">│ --watch         &lt;bool&gt;  Watch a server job until it finishes. Disconnecting  │</text><text x="20" y="1115">│      
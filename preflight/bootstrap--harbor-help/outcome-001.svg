<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="925"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">harbor-help — page 1</text><text x="20" y="75">$ work/venv/bin/harbor --help</text><text x="20" y="95">                                                                                </text><text x="20" y="115"> Usage: harbor [OPTIONS] COMMAND [ARGS]...                                      </text><text x="20" y="135">                                                                                </text><text x="20" y="155">╭─ Options ────────────────────────────────────────────────────────────────────╮</text><text x="20" y="175">│ --version             -v      &lt;bool&gt;                                         │</text><text x="20" y="195">│ --install-completion          &lt;bool&gt;  Install completion for the current     │</text><text x="20" y="215">│                                       shell.                                 │</text><text x="20" y="235">│ --show-completion             &lt;bool&gt;  Show completion for the current shell, │</text><text x="20" y="255">│                                       to copy it or customize the            │</text><text x="20" y="275">│                                       installation.                          │</text><text x="20" y="295">│ --help                -h      &lt;bool&gt;  Show this message and exit.            │</text><text x="20" y="315">╰──────────────────────────────────────────────────────────────────────────────╯</text><text x="20" y="335">╭─ Commands ───────────────────────────────────────────────────────────────────╮</text><text x="20" y="355">│ check        Check task quality against a rubric.                            │</text><text x="20" y="375">│ lint         Statically check task files.                                    │</text><t
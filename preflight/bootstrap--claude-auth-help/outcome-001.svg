<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">claude-auth-help — page 1</text><text x="20" y="75">$ claude auth --help</text><text x="20" y="95">Usage: claude auth [options] [command]</text><text x="20" y="115"></text><text x="20" y="135">Manage authentication</text><text x="20" y="155"></text><text x="20" y="175">Options:</text><text x="20" y="195">  -h, --help        Display help for command</text><text x="20" y="215"></text><text x="20" y="235">Commands:</text><text x="20" y="255">  help [command]    display help for command</text><text x="20" y="275">  login [options]   Sign in to your Anthropic account</text><text x="20" y="295">  logout            Log out from your Anthropic account</text><text x="20" y="315">  status [options]  Show authentication status</text><text x="20" y="335"></text><text x="20" y="355">[exit=0; signal=None; timeout=False]</text></g></svg>
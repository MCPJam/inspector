="835">wner, this account can access billing to add credits; in this isolated trial, the next step is an environment-side synthetic-credi</text><text x="20" y="855">t adjustment. I won’t purchase anything. Once the environment reports resolution, I’ll retry the same evaluation.\n&quot;}}</text><text x="20" y="875">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_23&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;cat &gt; /workspace/mcp-e</text><text x="20" y="895">valuation/resume.py &lt;&lt;&#x27;PY&#x27;\nfrom api import call,ROOT\nimport json,time\nP=&#x27;/projects/project_fixture&#x27;\npayload={&#x27;suiteId&#x27;:&#x27;suite_</text><text x="20" y="915">fixture&#x27;,&#x27;serverIds&#x27;:[&#x27;server_fixture&#x27;]}\n(ROOT/&#x27;run-request.json&#x27;).write_text(json.dumps(payload,indent=2))\nr=call(&#x27;POST&#x27;,P+&#x27;/ev</text><text x="20" y="935">al-runs&#x27;,payload,&#x27;launch&#x27;)\nif not r.get(&#x27;runId&#x27;):\n raise SystemExit(&#x27;Launch blocked; see launch.json. Retry only after account r</text><text x="20" y="955">esolution.&#x27;)\nrun=r[&#x27;runId&#x27;]\nfor n in range(20):\n status=call(&#x27;GET&#x27;,P+&#x27;/eval-runs/&#x27;+run,label=&#x27;status&#x27;)\n if status.get(&#x27;status&#x27;</text><text x="20" y="975">) in (&#x27;completed&#x27;,&#x27;failed&#x27;,&#x27;cancelled&#x27;,&#x27;timed_out&#x27;):break\n time.sleep(2)\niterations=call(&#x27;GET&#x27;,P+&#x27;/eval-runs/&#x27;+run+&#x27;/iterations&#x27;</text><text x="20" y="995">,label=&#x27;iterations&#x27;)\nfor item in iterations.get(&#x27;items&#x27;,[]):\n ident=item.get(&#x27;id&#x27;) or item.get(&#x27;iterationId&#x27;)\n if ident:call(&#x27;G</text><text x="20" y="1015">ET&#x27;,P+&#x27;/eval-runs/&#x27;+run+&#x27;/iterations/&#x27;+ident+&#x27;/trace&#x27;,label=&#x27;trace-&#x27;+ident)\nif status.get(&#x27;result&#x27;)\&quot;&#x27;!=&#x27;\&quot;&#x27;passed&#x27;:call(&#x27;GET&#x27;,P+</text><text x="20" y="1035">&#x27;/eval-runs/&#x27;+run+&#x27;/decision-summary&#x27;,label=&#x27;decision-summary&#x27;)\nPY\ncat &gt; /workspace/mcp-evaluation/README.md &lt;&lt;&#x27;EOF&#x27;\n# Arithmet</text><text x="20" y="1055">ic MCP evaluation\n\nTarget: http://fixture:8765/mcp\nProject: project_fixture; server: server_fixture; suite: suite_fixture (Arit</text><text x="20" y="1075">hmetic smoke).\nSaved case: pinned tool call add with {\\\&quot;a\\\&quot;:2,\\\&quot;b\\\&quot;:3}, expected output \\\&quot;5\\\&quot;.\n\nReproduce using the</text><text x="20" y="1095"> configured MCPJAM_API_URL and MCPJAM_API_KEY:\n\n    python3 /workspace/mcp-evaluation/resume.py\n\nThe script launches the saved</text><text x="20" y="1115"> suite with the explicit target server, polls to a terminal status, and saves iterations and traces. Each invocation starts a new </text><text x="20" y="1135">evaluation; do not blindly retry after a lost launch response. requests.jsonl records requests and responses without credentials. </text><text x="20" y="1155">Suite/case definitions and account discovery are recorded there.\n\nPreflight: /me and /organizations confirmed Team plan and owne</text><text x="20" y="1175">r role. Public docs explain daily allowances, top-up credits, BYOK, organization budgets, and pre-run estimates (when enabled). On</text><text x="20" y="1195">e credit = \&quot;&#x27;$0.01. Available credits, usage totals, and expected run cost could not be obtained: attempted usage/billing/estimat</text><text x="20" y="1215">e routes returned 404 and public API documentation did not expose account-balance routes. Unknown cost is not zero cost.\n\nInitia</text><text x="20" y="1235">l run request returned HTTP 403 FORBIDDEN, details.reason PLATFORM_FEE_REQUIRED: \&quot;This work requires platform credits. Add credit</text><text x="20" y="1255">s or contact your organization administrator.\&quot; No run ID was returned. Owner&#x27;\&quot;&#x27;s normal product action is Organization Billing t</text><text x="20" y="1275">o add credits; this synthetic trial requires environment-side resolution and prohibits purchases or production billing contact. Re</text><text x="20" y="1295">try the same original task only after resolution is reported.\n\nPublic references:\n- https://docs.mcpjam.com/reference/public-ap</text><text x="20" y="1315">i\n- https://docs.mcpjam.com/inspector/evals\n- https://docs.mcpjam.com/hosted/overview\n\nOnly public documentation and normal AP</text><text x="20" y="1335">I interfaces were used. No source, fixtures, or verifier internals were read.\nEOF\&quot;&quot;, &quot;aggregated_output&quot;: &quot;&quot;, &quot;exit_code&quot;: null,</text><text x="20" y="1355"> &quot;status&quot;: &quot;in_progress&quot;}}</text></g></svg>
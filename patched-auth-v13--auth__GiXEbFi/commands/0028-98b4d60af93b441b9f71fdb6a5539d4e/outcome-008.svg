<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">98b4d60af93b441b9f71fdb6a5539d4e — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;curl -fsSL https://docs.mcpjam.com/cli/overview -o /workspace/docs-overview.html; npx --yes @mcpjam/cli --hel</text><text x="20" y="175">p&#x27;</text><text x="20" y="195">Usage: mcpjam [options] [command]</text><text x="20" y="215"></text><text x="20" y="235">Test, debug, and validate MCP servers locally, or manage MCPJam Cloud via</text><text x="20" y="255">`mcpjam cloud`. Health checks, OAuth conformance, tool-surface diffing, and</text><text x="20" y="275">structured triage from the terminal or CI.</text><text x="20" y="295"></text><text x="20" y="315">Options:</text><text x="20" y="335">  -v, --version          output the CLI version</text><text x="20" y="355">  --timeout &lt;ms&gt;         Request timeout in milliseconds (default: 30000)</text><text x="20" y="375">  --rpc                  Include RPC logs in JSON output</text><text x="20" y="395">  --quiet                Suppress non-result progress output</text><text x="20" y="415">  --no-telemetry         Disable anonymous usage telemetry</text><text x="20" y="435">  --format &lt;format&gt;      Output format</text><text x="20" y="455">  -h, --help             display help for command</text><text x="20" y="475"></text><text x="20" y="495">Local MCP testing:</text><text x="20" y="515">  test [options] &lt;file&gt;  Run a suite file locally against your MCP servers (BYOK</text><text x="20" y="535">                         or MCPJam-hosted inference). Results are never</text><text x="20" y="555">                         uploaded.</text><text x="20" y="575">  server                 Inspect MCP server connectivity and capabilities</text><text x="20" y="595">  tools                  List and invoke MCP server tools</text><text x="20" y="615">  resources              List and read MCP resources</text><text x="20" y="635">  skills                 Inspect the Agent Skills an MCP server serves</text><text x="20" y="655">                         (SEP-2640). For your project&#x27;s Cloud Skills, see</text><text x="20" y="675">                         `mcpjam cloud skills`.</text><text x="20" y="695">  subscriptions          Open a long-lived MCP subscription and stream its</text><text x="20" y="715">                         notifications (2026-07-28 subscriptions/listen, with a</text><text x="20" y="735">                         legacy fallback)</text><text x="20" y="755">  compat [options]       Check whether an MCP server&#x27;s tools and widgets work on</text><text x="20" y="775">                         each AI host (Claude, ChatGPT, Cursor, Copilot, Codex,</text><text x="20" y="795">                         Goose, …)</text><text x="20" y="815">  prompts                List and fetch MCP prompts</text><text x="20" y="835">  apps                   Validate MCP Apps metadata and resource wiring</text><text x="20" y="855">  tasks                  Create, inspect and drive MCP Tasks (legacy 2025-11-25</text><text x="20" y="875">                         and SEP-2663), and validate a server&#x27;s tasks wire</text><text x="20" y="895">                         behavior</text><text x="20" y="915">  events                 List, poll, watch, subscribe to and conformance-check</text><text x="20" y="935">                         MCP Events (triggers, draft@28ec35e)</text><text x="20" y="955">  oauth                  Run MCP OAuth login, proxy, and conformance flows</text><text x="20" y="975">  xaa                    Run the Cross-App Access (ID-JAG) debugger against an</text><text x="20" y="995">                         MCP server</text><text x="20" y="1015">  protocol               MCP protocol inspection and conformance checks</text><text x="20" y="1035">  conformance            Run MCPJam conformance suites and optionally upload</text><text x="20" y="1055">                         results</text><text x="20" y="1075">  readiness              Grade a server or plugin against a publisher&#x27;s</text><text x="20" y="1095">                         directory</text><text x="20" y="1115"></text><text x="20" y="1135">MCPJam Cloud:</text><text x="20" y="1155">  cloud [options]        MCPJam Cloud account commands (login, projects, evals,</text><text x="20" y="1175">                         tunnels). Local MCP testing stays at the top level —</text><text x="20" y="1195">                         `mcpjam oauth login` is MCP OAuth; `mcpjam cloud login`</text><text x="20" y="1215">                         is your MCPJam account.</text><text x="20" y="1235">  registry               Search MCP directories and curated cards, then install</text><text x="20" y="1255">                         into a Cloud project</text><text x="20" y="1275"></text><text x="20" y="1295">CLI:</text><text x="20" y="1315">  inspector              Start or attach to the local MCPJam Inspector</text><text x="20" y="1335">  browser                Drive a local or cloud browser and read its session</text><text x="20" y="1355">                         trace</text></g></svg>
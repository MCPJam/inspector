ext><text x="20" y="315">Options:</text><text x="20" y="335">  --project &lt;id-or-name&gt;    Project name or ID (defaults to the most recently</text><text x="20" y="355">                            updated project)</text><text x="20" y="375">  -h, --help                display help for command</text><text x="20" y="395"></text><text x="20" y="415">Commands:</text><text x="20" y="435">  create|add [options]      Create a saved MCP server</text><text x="20" y="455">  get [options]             Get one saved MCP server</text><text x="20" y="475">  revisions [options]       List a saved server&#x27;s stored revisions, newest</text><text x="20" y="495">                            first: captures of its tools and server info</text><text x="20" y="515">  revision [options]        Read one stored revision of a saved server: its</text><text x="20" y="535">                            tools and server info</text><text x="20" y="555">  revision-diff [options]   Compare two stored revisions of a saved server:</text><text x="20" y="575">                            tools added, removed and changed, and server info</text><text x="20" y="595">                            changes</text><text x="20" y="615">  update [options]          Update one saved MCP server</text><text x="20" y="635">  delete|remove [options]   Delete one saved MCP server</text><text x="20" y="655">  connect [options]         Connect an MCP server URL to a project, authorizing</text><text x="20" y="675">                            in a browser if needed</text><text x="20" y="695">  connect-status [options]  Check a connection request started by `server</text><text x="20" y="715">                            connect`</text><text x="20" y="735">  connect-cancel [options]  Cancel a pending connection request started by</text><text x="20" y="755">                            `server connect`</text><text x="20" y="775"></text><text x="20" y="795">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
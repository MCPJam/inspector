sed&#x27;&quot;&#x27;&quot;&#x27;:passed,&#x27;&quot;&#x27;&quot;&#x27;exitCode&#x27;&quot;&#x27;&quot;&#x27;:p.returncode})</text><text x="20" y="655">(root/&#x27;&quot;&#x27;&quot;&#x27;tool-checks.json&#x27;&quot;&#x27;&quot;&#x27;).write_text(json.dumps(summary,indent=2)+&#x27;&quot;&#x27;&quot;&#x27;\n&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="675">print(json.dumps(summary,indent=2))</text><text x="20" y="695">req=urllib.request.Request(url,headers={&#x27;&quot;&#x27;&quot;&#x27;Authorization&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;Bearer &#x27;&quot;&#x27;&quot;&#x27;+token,&#x27;&quot;&#x27;&quot;&#x27;Accept&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;text/event-stream&#x27;&quot;&#x27;</text><text x="20" y="715">&quot;&#x27;})</text><text x="20" y="735">try: response=urllib.request.urlopen(req,timeout=5)</text><text x="20" y="755">except urllib.error.HTTPError as e: response=e</text><text x="20" y="775">(root/&#x27;&quot;&#x27;&quot;&#x27;get-response.json&#x27;&quot;&#x27;&quot;&#x27;).write_text(json.dumps({&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;:response.status,&#x27;&quot;&#x27;&quot;&#x27;headers&#x27;&quot;&#x27;&quot;&#x27;:dict(response.headers</text><text x="20" y="795">),&#x27;&quot;&#x27;&quot;&#x27;body&#x27;&quot;&#x27;&quot;&#x27;:response.read().decode()},indent=2)+&#x27;&quot;&#x27;&quot;&#x27;\n&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="815">PY</text><text x="20" y="835">python3 /workspace/validation/validate.py&#x27;</text><text x="20" y="855">[</text><text x="20" y="875">  {</text><text x="20" y="895">    &quot;name&quot;: &quot;positive&quot;,</text><text x="20" y="915">    &quot;arguments&quot;: {</text><text x="20" y="935">      &quot;a&quot;: 2,</text><text x="20" y="955">      &quot;b&quot;: 3</text><text x="20" y="975">    },</text><text x="20" y="995">    &quot;expected&quot;: 5,</text><text x="20" y="1015">    &quot;passed&quot;: true,</text><text
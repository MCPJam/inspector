d&gt;               Specific check ID to run. Repeat for multiple.</text><text x="20" y="675">                                Default: all. (default: [])</text><text x="20" y="695">  --advice-id &lt;id&gt;              Specific advice ID to run. Repeat for multiple.</text><text x="20" y="715">                                Default: all. (default: [])</text><text x="20" y="735">  --protocol-version &lt;version&gt;  Pin the MCP protocol version to conform against.</text><text x="20" y="755">                                Default: legacy (2025-era) behavior.</text><text x="20" y="775">  --fixtures-file &lt;path&gt;        JSON file naming primitives that are SAFE TO</text><text x="20" y="795">                                EXECUTE, so checks that need a real result can</text><text x="20" y="815">                                run:</text><text x="20" y="835">                                {&quot;toolCalls&quot;:[{&quot;toolName&quot;:&quot;echo&quot;,&quot;arguments&quot;:{}}],&quot;promptGets&quot;:[{&quot;promptName&quot;:&quot;welcome&quot;}]}.</text><text x="20" y="855">                                Nothing is ever called without this.</text><text x="20" y="875">  --fixture-tool &lt;name&gt;         Name of a tool that is safe to call with no</text><text x="20" y="895">                                arguments. Repeat for multiple. For tools that</text><text x="20" y="915">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="935">                                [])</text><text x="20" y="955">  --fixture-prompt &lt;name&gt;       Name of a prompt that is safe to render with no</text><text x="20" y="975">                                arguments. Repeat for multiple. For prompts that</text><text x="20" y="995">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="1015">                                [])</text><text x="20" y="1035">  --log-probe-tool &lt;name&gt;     
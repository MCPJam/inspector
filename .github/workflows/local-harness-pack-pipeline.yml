# The publication pipeline for ONE harness's runtime pack, end to end:
#
#   plan → build/adopt/finish-draft → conformance → pin intent
#                   ↘ equivalent → equivalence record intent
#
# Called by `local-harness-pack-prebuild.yml` in the background when a pack
# input lands on main (so the pack exists before anyone releases), and by
# `prepare-release.yml`, once per harness, before it opens the version PR —
# which adopts what the prebuild published. The pipeline writes nothing to main: each harness hands the
# release a `local-harness-pin-<harness>` artifact (a pin, an equivalence
# record, or "up to date"), and prepare-release applies every one of them to
# the version branch — so the version PR carries the versions AND the packs
# Inspectors will select, under one review. There is no separate pin PR and no
# window where main moved pack inputs nobody has published.
#
# RESUMABLE BY CONSTRUCTION. Nothing here remembers anything: every run
# re-derives its plan from what exists, keyed by (harness, inputs fingerprint)
# — see `scripts/local-harness-publication.mjs`:
#
#   up-to-date    the pinned pack was built from these inputs, or an
#                 equivalence record says a rebuild reproduced it. Nothing runs.
#   adopt         a release from these inputs is already published (an earlier
#                 run stopped after publishing): conformance, then the pin.
#   finish-draft  a complete draft from these inputs exists (an earlier run
#                 stopped between upload and release): finish it, then as adopt.
#   build         build every target. A rebuild that reproduces the pinned tree
#                 digests publishes nothing and records an attested
#                 equivalence; anything else publishes the next patch version.
#
# So a failure at any stage is resumed by preparing the release again
# (`gh workflow run prepare-release.yml --ref main`, or Soundcheck's "Start
# release"), and the `report` job says exactly that in the harness's failure
# issue.
#
# What reaches users is only ever the VERSION PR: a pack is selectable once the
# PR recording its digests merges, and that PR is reviewed (the approval rule
# on main is the one human gate; the signing environment needs no reviewer).
#
# This file is NOT a pack input: it decides when packs are built, not what is
# in them. `local-harness-pack.yml` is, and is what it calls to build.
name: Local harness pack pipeline

on:
  workflow_call:
    inputs:
      harness:
        description: Harness whose pack to publish (a recipe in scripts/local-harness-pack-recipes/).
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: plan ${{ inputs.harness }}
    runs-on: ubuntu-latest
    # `contents: write` only so the release listing INCLUDES DRAFTS: GitHub
    # shows drafts to push-capable tokens alone, and a plan that cannot see the
    # draft a failed publish left behind re-plans the same version, rebuilds
    # it, and then fails at publish on that draft — forever. Nothing here
    # writes; the one PATCH (`finish-draft`) runs in the pack workflow.
    permissions:
      contents: write
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      pinned_version: ${{ steps.plan.outputs.pinned_version }}
      pinned_digests: ${{ steps.plan.outputs.pinned_digests }}
      # The conformance workflow takes one version input per harness.
      claude_version: ${{ inputs.harness == 'claude-code' && steps.plan.outputs.version || '' }}
      codex_version: ${{ inputs.harness == 'codex' && steps.plan.outputs.version || '' }}
      claude_previous: ${{ inputs.harness == 'claude-code' && steps.plan.outputs.pinned_version || '' }}
      codex_previous: ${{ inputs.harness == 'codex' && steps.plan.outputs.pinned_version || '' }}
    steps:
      - name: Enforce main
        env:
          HARNESS: ${{ inputs.harness }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "Pack publication runs from main only" >&2; exit 1; fi
          echo "$HARNESS" | grep -Eq '^[a-z][a-z0-9-]{0,63}$' || { echo "not a harness id: $HARNESS" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      # Builtins only: the fingerprint reads files and the lockfile, and the
      # release listing is the REST API. No install, so planning is cheap and
      # an up-to-date push costs one small job.
      - name: Decide
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS: ${{ inputs.harness }}
        run: |
          set -euo pipefail
          node mcpjam-inspector/scripts/local-harness-publication.mjs plan --harness "$HARNESS" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### ${HARNESS} pack: $(grep '^action=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
            echo
            echo "$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing to publish. Still handed over: the release expects one intent
      # per harness, and a missing one means a pipeline that did not finish.
      - name: Hand "up to date" to the release
        if: steps.plan.outputs.action == 'up-to-date'
        env:
          HARNESS: ${{ inputs.harness }}
          PINNED: ${{ steps.plan.outputs.pinned_version }}
        run: |
          node mcpjam-inspector/scripts/local-harness-publication.mjs intent --harness "$HARNESS" \
            --kind up-to-date --version "$PINNED" --out "$RUNNER_TEMP/pin/intent.json"

      - if: steps.plan.outputs.action == 'up-to-date'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-harness-pin-${{ inputs.harness }}
          path: ${{ runner.temp }}/pin
          if-no-files-found: error

  # Build (or finish a draft of) the planned version. The pack workflow is
  # itself resumable at one version: it adopts a release from these inputs,
  # finishes a complete draft, and never overwrites anything else.
  pack:
    needs: plan
    if: needs.plan.outputs.action == 'build' || needs.plan.outputs.action == 'finish-draft'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/local-harness-pack.yml
    with:
      harness: ${{ inputs.harness }}
      pack_version: ${{ needs.plan.outputs.version }}
      publish: unless-equivalent
    secrets: inherit

  # A rebuild that reproduced the pinned pack on every target: record that,
  # attested, so the release gate can accept the new fingerprint for the
  # unchanged bytes. Nothing is published; no user downloads anything.
  equivalence:
    needs: [plan, pack]
    if: needs.pack.outputs.equivalent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No install in this job: it holds `id-token: write`, and nothing an
      # install script runs should be able to mint provenance. The record and
      # its intent need builtins only; the reviewed fingerprint is re-recorded
      # by prepare-release, in a clean install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Write the equivalence record
        id: record
        working-directory: mcpjam-inspector
        env:
          HARNESS: ${{ inputs.harness }}
          FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          BUILT_FROM: ${{ needs.pack.outputs.fingerprint }}
          PINNED: ${{ needs.plan.outputs.pinned_version }}
          DIGESTS: ${{ needs.pack.outputs.flat }}
        run: |
          set -euo pipefail
          if [ "$FINGERPRINT" != "$BUILT_FROM" ]; then echo "planned $FINGERPRINT but built $BUILT_FROM" >&2; exit 1; fi
          name="$(node --input-type=module -e 'import { equivalenceFileName } from "./scripts/local-harness-publication.mjs"; process.stdout.write(equivalenceFileName(process.env.HARNESS, process.env.FINGERPRINT))')"
          file="scripts/local-harness-pack-equivalence/$name"
          node scripts/local-harness-publication.mjs equivalence --harness "$HARNESS" \
            --fingerprint "$FINGERPRINT" --version "$PINNED" --digests "$DIGESTS" --out "$file"
          echo "file=mcpjam-inspector/$file" >> "$GITHUB_OUTPUT"

      # The record's bytes are attested exactly as committed: the release gate
      # runs `gh attestation verify` on the file in the repository.
      - name: Attest the equivalence record
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.record.outputs.file }}

      # prepare-release commits the record byte for byte (its sha256 is in
      # the intent and checked), so the attestation above covers what lands.
      - name: Hand the equivalence record to the release
        env:
          HARNESS: ${{ inputs.harness }}
          FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          PINNED: ${{ needs.plan.outputs.pinned_version }}
          RECORD: ${{ steps.record.outputs.file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node mcpjam-inspector/scripts/local-harness-publication.mjs intent --harness "$HARNESS" --kind equivalence \
            --previous "$PINNED" --fingerprint "$FINGERPRINT" --record "$RECORD" --run "$RUN_URL" \
            --out "$RUNNER_TEMP/pin/intent.json"
          mkdir -p "$RUNNER_TEMP/pin/files/$(dirname "$RECORD")"
          cp "$RECORD" "$RUNNER_TEMP/pin/files/$RECORD"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-harness-pin-${{ inputs.harness }}
          path: ${{ runner.temp }}/pin
          if-no-files-found: error

  # This commit's Inspector layer against the pack about to be pinned, on every
  # target. The pack is published but selected by nothing yet, so it is named
  # as a CANDIDATE: accepted because its signed manifest carries this
  # checkout's own inputs fingerprint.
  candidate-conformance:
    needs: [plan, pack]
    if: |
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.action == 'build' || needs.plan.outputs.action == 'adopt' || needs.plan.outputs.action == 'finish-draft') &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped') &&
      needs.pack.outputs.equivalent != 'true'
    uses: ./.github/workflows/local-harness-conformance.yml
    with:
      published_pack_version: ${{ needs.plan.outputs.claude_version }}
      codex_published_pack_version: ${{ needs.plan.outputs.codex_version }}
      harnesses: ${{ inputs.harness }}
      candidate: true

  # The pack being replaced, against the same layer: a pass keeps it selectable
  # as the one permitted previous pack (the fallback while an update is in
  # flight). A failure here is not a pipeline failure — the pin goes ahead
  # without a permitted previous, and the PR says so.
  previous-conformance:
    needs: [plan, pack]
    if: |
      always() && needs.plan.result == 'success' && needs.plan.outputs.pinned_version != '' &&
      (needs.plan.outputs.action == 'build' || needs.plan.outputs.action == 'adopt' || needs.plan.outputs.action == 'finish-draft') &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped') &&
      needs.pack.outputs.equivalent != 'true'
    uses: ./.github/workflows/local-harness-conformance.yml
    with:
      published_pack_version: ${{ needs.plan.outputs.claude_previous }}
      codex_published_pack_version: ${{ needs.plan.outputs.codex_previous }}
      harnesses: ${{ inputs.harness }}

  pin:
    name: pin
    needs: [plan, pack, candidate-conformance, previous-conformance]
    if: |
      always() && needs.candidate-conformance.result == 'success' &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      # Builtins only, so no install: this job checks evidence and provenance
      # and hands the pin over; prepare-release writes it in a clean install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Collect this run's conformance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-evidence-${{ inputs.harness }}-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true

      # The digests come from the PUBLISHED release's signed manifests — the
      # same for a fresh build, an adopted release and a finished draft.
      - name: The published pack's digests
        id: published
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS: ${{ inputs.harness }}
          VERSION: ${{ needs.plan.outputs.version }}
          FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
        run: |
          set -euo pipefail
          node mcpjam-inspector/scripts/local-harness-publication.mjs digests --harness "$HARNESS" --version "$VERSION" | tee -a "$GITHUB_OUTPUT"
          built="$(grep '^fingerprint=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          if [ "$built" != "$FINGERPRINT" ]; then echo "$HARNESS $VERSION was built from $built, not $FINGERPRINT" >&2; exit 1; fi

      # Not just "the job passed": a record per advertised target, for exactly
      # this tree, from this commit.
      - name: Conformance covers every advertised target
        working-directory: mcpjam-inspector
        env:
          HARNESS: ${{ inputs.harness }}
          DIGESTS: ${{ steps.published.outputs.digests }}
          EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          result="$(node scripts/local-harness-publication.mjs evidence --harness "$HARNESS" --digests "$DIGESTS" --dir "$EVIDENCE")"
          echo "$result"
          grep -q '^covered=true$' <<<"$result" || { echo "no conformance evidence for: $(grep '^missing=' <<<"$result" | cut -d= -f2-)" >&2; exit 1; }

      # The previous pack stays selectable only if the layer passed on it on
      # every advertised target AND its provenance verifies — a pack published
      # before provenance existed is not carried forward.
      - name: May the previous pack stay selectable?
        id: previous
        working-directory: mcpjam-inspector
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ inputs.harness }}
          PREVIOUS: ${{ needs.plan.outputs.pinned_version }}
          PREVIOUS_DIGESTS: ${{ needs.plan.outputs.pinned_digests }}
          PREVIOUS_RESULT: ${{ needs.previous-conformance.result }}
          EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          permit=false
          reason=""
          if [ -z "$PREVIOUS" ]; then
            reason="there is no previous pack"
          elif [ "$PREVIOUS_RESULT" != "success" ]; then
            reason="this commit's layer did not pass conformance on it ($PREVIOUS_RESULT)"
          elif ! node scripts/local-harness-publication.mjs evidence --harness "$HARNESS" --digests "$PREVIOUS_DIGESTS" --dir "$EVIDENCE" | grep -q '^covered=true$'; then
            reason="conformance evidence for it is missing on an advertised target"
          else
            attested="$(node scripts/local-harness-publication.mjs attested --harness "$HARNESS" --version "$PREVIOUS")"
            if grep -q '^attested=true$' <<<"$attested"; then
              permit=true
            else
              reason="$(grep '^reason=' <<<"$attested" | cut -d= -f2-)"
            fi
          fi
          echo "permit=$permit" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "permit previous $PREVIOUS: $permit ${reason:+($reason)}"

      # prepare-release writes it (`write-pack-digests.mjs`, then the reviewed
      # fingerprint) on the version branch, alongside the other harnesses'.
      - name: Hand the pin to the release
        env:
          HARNESS: ${{ inputs.harness }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIGESTS: ${{ steps.published.outputs.digests }}
          FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          PREVIOUS: ${{ needs.plan.outputs.pinned_version }}
          PERMIT: ${{ steps.previous.outputs.permit }}
          PERMIT_REASON: ${{ steps.previous.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node mcpjam-inspector/scripts/local-harness-publication.mjs intent --harness "$HARNESS" --kind pin \
            --version "$VERSION" --digests "$DIGESTS" --fingerprint "$FINGERPRINT" \
            --conformance "published-$HARNESS-$VERSION-${GITHUB_SHA::12}" \
            --previous "$PREVIOUS" --permit-previous "$PERMIT" --permit-reason "$PERMIT_REASON" \
            --run "$RUN_URL" --out "$RUNNER_TEMP/pin/intent.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-harness-pin-${{ inputs.harness }}
          path: ${{ runner.temp }}/pin
          if-no-files-found: error

  report:
    needs: [plan, pack, equivalence, candidate-conformance, previous-conformance, pin]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Open, update or close the failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS: ${{ inputs.harness }}
          NEEDS: ${{ toJSON(needs) }}
        run: node mcpjam-inspector/scripts/local-harness-publication.mjs report --harness "$HARNESS"

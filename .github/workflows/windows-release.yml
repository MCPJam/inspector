name: Windows Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version label"
        required: true
        type: string
      apply_release_patch:
        description: "Apply the shared release patch artifact before building"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version label"
        required: false
        type: string
      apply_release_patch:
        description: "Apply release patch artifact from the current run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  make-windows:
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      ARTIFACT_VERSION: ${{ inputs.version != '' && inputs.version || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release patch
        if: inputs.apply_release_patch == true
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release-plan

      - name: Apply release patch
        if: inputs.apply_release_patch == true
        run: git apply --binary .release-plan/release.patch
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        shell: powershell

      - name: Rebuild native modules for Windows
        run: npm rebuild esbuild --verbose
        shell: powershell

      - name: Restore code signing cert
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\codesign.pfx", $bytes)

      - name: Build app
        run: npm run build -w @mcpjam/inspector
        shell: powershell

      # ONLY dist/client here. The packaged app serves its UI from
      # dist/client via the embedded Hono server (server/app.ts
      # serveStatic root + forge extraResource), and `npm run build`
      # produces it — so this is both the bundle desktop users execute
      # and the one that exists at this point in the job.
      #
      # The Electron bundles (.vite/build, .vite/renderer) are NOT
      # handled here: @electron-forge/plugin-vite builds them during
      # `electron:make`, so they do not exist yet. Their injection and
      # upload lives in forge.config.ts's `packageAfterCopy` hook, the
      # first point where the built bundles exist and are still
      # editable before asar packing.
      - name: Inject and upload web sourcemaps to Sentry
        continue-on-error: true
        working-directory: mcpjam-inspector
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")

          # Cleanup runs on EVERY exit path, including a sentry-cli
          # failure — `-e` would otherwise skip a trailing delete and
          # `continue-on-error` would still let packaging proceed,
          # shipping full source maps in the installer.
          trap "find dist/client -name '*.map' -type f -delete 2>/dev/null || true" EXIT

          if [ -d dist/client ]; then
            npx @sentry/cli sourcemaps inject dist/client
            npx @sentry/cli sourcemaps upload \
              --release="$version" \
              --org=mcpjam-gh \
              --project=inspector-client \
              dist/client
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Make Windows installer
        env:
          WINDOWS_PFX_FILE: ${{ runner.temp }}\\codesign.pfx
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: npm run electron:make -w @mcpjam/inspector
        shell: powershell

      - name: Rename installer to consistent name
        run: |
          $setupFile = Get-ChildItem -Path "mcpjam-inspector\\out\\make" -Recurse -Name "*Setup.exe" | Select-Object -First 1
          if ($setupFile) {
            Copy-Item "mcpjam-inspector\\out\\make\\$setupFile" "$env:GITHUB_WORKSPACE\\MCPJam-Inspector-Setup.exe"
            echo "SETUP_PATH=$env:GITHUB_WORKSPACE/MCPJam-Inspector-Setup.exe" >> $env:GITHUB_ENV
          }
        shell: powershell

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inspector-windows-${{ env.ARTIFACT_VERSION }}
          path: |
            ${{ env.SETUP_PATH }}
            mcpjam-inspector\out\make\**\RELEASES
            mcpjam-inspector\out\make\**\*.nupkg
          retention-days: 14

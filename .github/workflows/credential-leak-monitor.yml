name: Credential leak monitor

# Daily check that no credential URL reached PostHog or Sentry unredacted.
#
# Every telemetry exit scrubs URLs with the credential-URL registry
# (mcpjam-inspector/shared/credential-urls.ts), so a stored event should only
# ever show a registered secret as `[redacted]`. This counts the events from
# the last 24 hours that still carry one, by registry route id, and alerts on
# any. The patterns are generated from the registry at run time, so a route
# added there is watched from the next run on. See
# ops/credential-leak-monitor/README.md for the design and the secrets.
#
# A monitor that cannot look must not read as clean: a missing secret or an
# API error alerts too, as "NOT CHECKED".

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Window to check, in hours"
        type: number
        default: 24
      dry_run:
        description: "Print the generated queries and stop (no API calls, no alert)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: credential-leak-monitor
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"

jobs:
  monitor:
    if: github.repository == 'MCPJam/inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `npm ci`: the monitor imports only the registry (pure TypeScript,
      # no dependencies) and Node 24 runs `.ts`/`.mts` directly.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Print the generated queries
        if: inputs.dry_run
        run: node ops/credential-leak-monitor/run.mts --dry-run --hours="${HOURS}"
        env:
          HOURS: ${{ inputs.hours || 24 }}

      - name: Count unredacted credentials in PostHog and Sentry
        id: monitor
        if: ${{ !inputs.dry_run }}
        env:
          HOURS: ${{ inputs.hours || 24 }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_LEAK_MONITOR_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || '212744' }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.posthog.com' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_LEAK_MONITOR_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'mcpjam-gh' }}
        run: |
          set -uo pipefail
          node ops/credential-leak-monitor/run.mts --hours="${HOURS}" > /tmp/report.txt
          code=$?
          cat /tmp/report.txt
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # 0 clean, 1 leak, 2 could not check. The alert step reads the code;
          # this step itself succeeds so the alert always runs.
          exit 0

      - name: Alert
        if: ${{ !inputs.dry_run && steps.monitor.outputs.code != '0' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          CODE: ${{ steps.monitor.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "${CODE}" = "1" ]; then
            headline=":rotating_light: Credential leak monitor: events with an UNREDACTED credential URL were stored. Find the events by id, delete them in the vendor UI, and fix the scrubber that let them through (ops/credential-leak-monitor/README.md)."
          else
            headline=":warning: Credential leak monitor is BLIND: it could not check every sink (missing secret or API error). Nothing is known to have leaked; restore coverage."
          fi
          # The report holds route ids, counts and event ids, never a URL.
          {
            printf '%s\n\n```\n' "$headline"
            head -c 3000 /tmp/report.txt
            printf '\n```\n<%s|Monitor run>\n' "$RUN_URL"
          } > /tmp/message.txt
          body=$(cat /tmp/message.txt)

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::Credential leak monitor needs attention but SLACK_ALERTS_WEBHOOK_URL is not set."
            echo "$body"
            exit 1
          fi
          # `-f`: a 4xx/5xx from Slack must fail the step, not pass silently.
          if ! jq -n --arg text "$body" '{text: $text}' \
            | curl -fsS --max-time 20 --retry 2 -X POST -H 'Content-Type: application/json' \
                -d @- "$SLACK_WEBHOOK_URL"; then
            echo "::error::Credential leak monitor needs attention AND could not deliver the Slack alert."
            echo "$body"
            exit 1
          fi
          echo "::error::Credential leak monitor needs attention — see the Slack post."
          exit 1

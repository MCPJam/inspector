name: UI Copy Review

# Claude reads the user-facing strings a PR adds and fails the check when
# one matches a pattern in .agents/skills/ui-copy/SKILL.md: vague errors,
# apologies, filler, no next step. Haiku 5.5 classifies, Sonnet 5.5 rewrites
# the flagged strings, and the rewrites land as one-click suggestions.
# scripts/slop/copy-review.mjs is the whole job; this file only runs it.
#
# `labeled` / `unlabeled` re-run it when a CODEOWNER applies `slop-waiver`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ui-copy-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: UI Copy Review
    # A fork's PR cannot read ANTHROPIC_API_KEY. The regex copy rules in the
    # Slop Ratchet still run there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The PR merge commit and its base are all the script compares. No
      # install: it uses Node builtins and `fetch`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Test the review script
        run: node --test scripts/slop/slop.test.mjs

      - name: Review the copy this change adds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SLOP_WAIVER: ${{ contains(github.event.pull_request.labels.*.name, 'slop-waiver') }}
        run: node scripts/slop/copy-review.mjs --base HEAD^1

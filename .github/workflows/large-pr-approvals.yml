name: Large PR Approvals

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: large-pr-approvals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approvals:
    name: Large PR Approvals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { enforceApprovals } = require('./.github/scripts/pr-policy.cjs');
            await enforceApprovals(github, context);

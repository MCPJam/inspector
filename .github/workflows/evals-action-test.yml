name: Evals action tests

on:
  pull_request:
    paths:
      - "actions/evals/**"
      - ".github/workflows/evals-action-*.yml"
  push:
    branches: [main]
    paths:
      - "actions/evals/**"
      - ".github/workflows/evals-action-*.yml"

permissions:
  contents: read

jobs:
  test:
    # Blacksmith, not GitHub's shared 60-job pool; this job holds no secret or
    # write token. TEST_RUNNER=ubuntu-latest moves it back during an outage.
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test actions/evals/*.test.mjs

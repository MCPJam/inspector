name: Evals action tests

on:
  pull_request:
    paths:
      - "actions/evals/**"
      - ".github/workflows/evals-action-*.yml"
  push:
    branches: [main]
    paths:
      - "actions/evals/**"
      - ".github/workflows/evals-action-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test actions/evals/*.test.mjs

name: Security flag triage

# A security concern raised in PR review opens a `security-triage` issue with
# an owner and the remediation SLA, and replies on the PR
# (.github/scripts/security-flag.mjs). Triggers: a PR conversation comment, an
# inline review comment, a review, or the `security` label.
#
# The label uses `pull_request_target` so it works on fork PRs. That is safe
# here because nothing from the PR is checked out or run: the script comes
# from the default branch and reads only the event payload. Review events on a
# fork PR get a read-only token, so there the run fails visibly instead of
# opening the issue; a comment in the PR conversation always works.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Security flag triage
    # Skip the bot reviewers and non-PR issues without starting the script.
    if: >-
      github.event.comment.user.type != 'Bot' &&
      github.event.review.user.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'pull_request_target' || github.event.label.name == 'security')
    # GitHub-hosted, not Blacksmith: this job holds a write token.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Open or update the triage issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECURITY_TRIAGE_OWNER: ${{ vars.SECURITY_TRIAGE_OWNER }}
        run: node .github/scripts/security-flag.mjs

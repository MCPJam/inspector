name: Slop Ratchet

# Fails a PR whose changed source files add more type escapes, swallowed
# errors, suppressions, server `console` calls or history comments than they
# remove, that raises an ESLint suppression count, or that adds repo litter or
# pushes a file past 800 lines. The rules live in scripts/slop/rules.mjs; this job only runs them.
#
# `labeled` / `unlabeled` re-run the check when a CODEOWNER applies or removes
# `slop-waiver`, so the waiver takes effect without a new push.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: slop-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Slop Ratchet
    if: github.event_name == 'pull_request'
    # Blacksmith, not GitHub's shared 60-job pool; this job holds no secret or
    # write token. TEST_RUNNER=ubuntu-latest moves it back during an outage.
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      # The PR merge commit and its first parent, the base it merges into, are
      # all the ratchet compares. No install: the scripts use only Node builtins.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Test the ratchet
        run: node --test scripts/slop/slop.test.mjs scripts/slop/eslint-suppressions.test.mjs scripts/git-hooks/git-hooks.test.mjs

      - name: Compare with the base branch
        env:
          SLOP_WAIVER: ${{ contains(github.event.pull_request.labels.*.name, 'slop-waiver') }}
        run: node scripts/slop/ratchet.mjs --base HEAD^1

      # ESLint trusts the suppressions file in the PR, so a raised count or a
      # new entry would hide a new lint error. Build and Test runs the lint.
      - name: ESLint suppressions against the base branch
        if: ${{ !cancelled() }}
        env:
          SLOP_WAIVER: ${{ contains(github.event.pull_request.labels.*.name, 'slop-waiver') }}
        run: npm run slop:suppressions -- --base HEAD^1

      # The agent hooks' file rules, for every author: no new root files or
      # scratch notes, and no source file crossing 800 lines.
      - name: Repo hygiene
        if: ${{ !cancelled() }}
        env:
          SLOP_WAIVER: ${{ contains(github.event.pull_request.labels.*.name, 'slop-waiver') }}
        run: node scripts/slop/repo-hygiene.mjs --base HEAD^1

name: Jamroom previews

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: jamroom-railway-preview-runner
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.repository_id == '989134268' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.JAMROOM_PREVIEW_RUNNER_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Process a Jamroom preview job
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/jamroom-preview-runner.mjs

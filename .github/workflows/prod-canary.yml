name: Prod canary

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-canary
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Restore last delivered alert state
        uses: actions/cache/restore@v4
        with:
          path: .reliability-state
          key: prod-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: prod-reliability-
      - name: Create state directory
        run: mkdir -p .reliability-state
      - name: Check hosted app and published npm saved-credential journeys
        env:
          CANARY_BASE_URL: ${{ vars.PRODUCTION_APP_URL || 'https://app.mcpjam.com' }}
          CANARY_API_KEY: ${{ secrets.CANARY_API_KEY }}
          CANARY_LOCAL_BEARER: ${{ secrets.CANARY_LOCAL_BEARER }}
          CANARY_FIXTURES_JSON: ${{ secrets.CANARY_FIXTURES_JSON }}
          SLACK_ALERTS_CONFIGURED: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL != '' }}
          CANARY_SENTRY_DSN: ${{ secrets.CANARY_SENTRY_DSN }}
        run: node scripts/reliability/monitor.mjs
      - name: Notify engineering Slack on failure or recovery
        if: always()
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/reliability/alerts.mjs
      - name: Save delivered alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .reliability-state
          key: prod-reliability-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: reliability-report.json
          if-no-files-found: error
          retention-days: 30

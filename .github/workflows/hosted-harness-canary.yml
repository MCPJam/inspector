name: Hosted harness canaries

# Paid qualification is independent of MCP production promotion.
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-chat-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    concurrency:
      group: harness-chat-canary
      cancel-in-progress: false
    env:
      HARNESS_CHAT_CANARY_CONFIG: ${{ vars.HARNESS_CHAT_CANARY_CONFIG }}
      HARNESS_CHAT_CANARY_REPORT: ${{ runner.temp }}/harness-chat-canary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run two hosted turns with each harness
        env:
          MCPJAM_API_KEY: ${{ secrets.HARNESS_CHAT_CANARY_API_KEY }}
        run: node scripts/hosted-harness-chat-canary.mjs
      - name: Retain actual canary outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-harness-chat-canary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-chat-canary.json
          if-no-files-found: error

  harness-product-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ask-mcpjam-smoke-staging
    concurrency:
      group: harness-product-canary-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run bounded staging eval, swarm and User Testing canaries
        env:
          HARNESS_PRODUCT_CANARY_CONFIG: ${{ vars.HARNESS_PRODUCT_CANARY_CONFIG }}
          HARNESS_PRODUCT_STUDY_TOKENS: ${{ secrets.HARNESS_PRODUCT_STUDY_TOKENS }}
          MCPJAM_API_KEY: ${{ secrets.HARNESS_PRODUCT_CANARY_API_KEY }}
          ASK_MCPJAM_CANARY_EMAIL: ${{ vars.ASK_MCPJAM_CANARY_EMAIL }}
          ASK_MCPJAM_CANARY_PASSWORD: ${{ secrets.ASK_MCPJAM_CANARY_PASSWORD }}
          WORKOS_API_KEY: ${{ secrets.STAGING_WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ vars.STAGING_WORKOS_CLIENT_ID }}
          HARNESS_PRODUCT_CANARY_REPORT: ${{ runner.temp }}/harness-product-canary.json
        run: node scripts/hosted-harness-product-canary.mjs
      - name: Retain actual staging product outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-harness-product-canary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-product-canary.json
          if-no-files-found: error

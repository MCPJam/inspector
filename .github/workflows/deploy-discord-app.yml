name: Deploy Discord app

on:
  push:
    branches: [main]
    paths:
      - "discord-app/**"
      - "surface-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-discord-app.yml"
  workflow_dispatch:

concurrency:
  group: discord-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment:
      name: discord-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DISCORD_APP_TOKEN }}
        run: railway up --service mcpjam-discord-app --ci

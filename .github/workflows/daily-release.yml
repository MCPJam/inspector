name: Daily Inspector release

# Reminds #prs each weekday afternoon when an Inspector release is ready to
# start. It never starts one: Start release pushes straight to production's
# path, so a person starts it from Soundcheck.

on:
  schedule:
    # Off the top of the hour, when GitHub delays scheduled runs most.
    - cron: "50 16 * * 0-5"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-inspector-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'MCPJam/inspector' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Read pending release plan
        run: npx changeset status --output="$RUNNER_TEMP/daily-release-plan.json"
      - name: Decide whether a release is ready
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const workspace = process.env.GITHUB_WORKSPACE;
            const { activeRunUrl, dailyReleaseDecision } = await import(`${workspace}/.github/scripts/daily-release.mjs`);
            const { unpublishedVersions } = await import(`${workspace}/.github/scripts/unpublished-versions.mjs`);
            const { owner, repo } = context.repo;
            let activeRun = null;
            for (const workflow_id of ["prepare-release.yml", "release.yml"]) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, per_page: 20,
              });
              activeRun ??= activeRunUrl(data.workflow_runs);
            }
            const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
            const decision = dailyReleaseDecision({
              activeRun,
              unpublished: unpublishedVersions((path) => readJson(`${workspace}/${path}`)),
              releases: readJson(`${process.env.RUNNER_TEMP}/daily-release-plan.json`).releases,
            });
            core.info(decision.reason);
            await core.summary.addRaw(decision.reason).write();
            if (!decision.dispatch) return;
            const pending = readJson(`${process.env.RUNNER_TEMP}/daily-release-plan.json`).releases
              .filter(({ type }) => type !== "none")
              .map(({ name, oldVersion, newVersion }) => `• \`${name}\` ${oldVersion} → *${newVersion}*`);
            core.setOutput("pending", pending.join("\n"));

      - name: Remind #prs
        if: steps.decide.outputs.pending != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PRS_WEBHOOK_URL }}
          PENDING: ${{ steps.decide.outputs.pending }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_PRS_WEBHOOK_URL is not set, so #prs was not reminded."
            exit 0
          fi
          text="$(printf 'An Inspector release is ready. Start it from Soundcheck when you are ready to ship:\n%s' "$PENDING")"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS --max-time 20 --retry 2 -X POST -H 'Content-Type: application/json' \
                -d @- "$SLACK_WEBHOOK_URL"

name: Post-Deploy Smoke

# Shared by deploy-staging.yml and deploy-webapp.yml. Every input defaults to
# staging's previous behavior, so the staging caller stays a bare `uses:` and
# only the production caller has to say what it wants.
#
# Boolean inputs are compared against BOTH `true` and `'true'`: a
# `workflow_call` caller passes a real boolean, while a manual dispatch of the
# same input can arrive as a string. `if: inputs.flag` alone is the classic
# footgun here — the string 'false' is truthy.

on:
  workflow_call:
    inputs:
      base_url:
        description: "Base URL to smoke (defaults to staging)"
        required: false
        type: string
      label:
        description: "Environment name used in the run summary and artifacts"
        required: false
        default: staging
        type: string
      run_e2e:
        description: "Run the Playwright suite against the target"
        required: false
        default: true
        type: boolean
    secrets:
      # Cloudflare Access service token. staging.mcpjam.com sits behind an
      # Access policy, so every request below has to present one or Access
      # answers with its own 302 to the login page and the smoke reads as a
      # deploy failure. Optional: targets that are not behind Access (prod)
      # simply omit them, and the steps skip the headers.
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke (defaults to staging)"
        required: false
        type: string
      label:
        description: "Environment name used in the run summary and artifacts"
        required: false
        default: staging
        type: string
      run_e2e:
        description: "Run the Playwright suite against the target"
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: "24.14.0"

jobs:
  smoke:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.target.outputs.base_url }}
    steps:
      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="${{ vars.STAGING_APP_URL }}"
          fi
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://staging.mcpjam.com"
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      # `CF_ARGS` is built as an array and expanded unquoted-per-element so an
      # absent token yields NO header flags at all, rather than two empty
      # headers that Access would reject as malformed.
      - name: Check public health endpoints
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          CF_ARGS=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            CF_ARGS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                     -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          curl --fail --silent --show-error "${CF_ARGS[@]}" "$BASE_URL/health" >/tmp/health.json
          curl --fail --silent --show-error "${CF_ARGS[@]}" "$BASE_URL/api/mcp/health" >/tmp/mcp-health.json
          curl --fail --silent --show-error "${CF_ARGS[@]}" "$BASE_URL/api/apps/health" >/tmp/apps-health.json

      # "Unauthenticated" here means unauthenticated TO THE APP. The Access
      # token still has to be present, otherwise Access answers first and the
      # 302 gets read as the app's own denial — the assertion would pass while
      # testing nothing.
      - name: Check unauthenticated web route is denied
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          CF_ARGS=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            CF_ARGS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                     -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          STATUS="$(curl --silent --output /tmp/web-auth.json --write-out '%{http_code}' \
            -X POST \
            "${CF_ARGS[@]}" \
            -H 'Content-Type: application/json' \
            "$BASE_URL/api/web/tools/list" \
            -d '{"workspaceId":"smoke","serverId":"smoke"}')"

          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Expected 401 or 403 from /api/web/tools/list, got $STATUS"
            cat /tmp/web-auth.json
            exit 1
          fi

      - name: Summarize smoke result
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          LABEL: ${{ inputs.label || 'staging' }}
        run: |
          {
            echo "## ✅ ${LABEL} HTTP smoke passed"
            echo ""
            echo "- Target: \`$BASE_URL\`"
            echo "- Checked: \`/health\`, \`/api/mcp/health\`, \`/api/apps/health\`, unauthenticated \`/api/web/tools/list\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: smoke
    # Off by default for production: the suite drives a real browser through
    # real sign-in and session surfaces, so pointing it at prod writes prod
    # data. Callers that want it there must opt in deliberately.
    if: ${{ inputs.run_e2e == true || inputs.run_e2e == 'true' }}
    runs-on: ubuntu-latest
    # Non-gating during the initial soak. deploy-staging.yml calls this workflow
    # and release.yml polls deploy-staging.yml success as the release gate, so a
    # hard failure here would gate releases. Remove once the suite is promoted.
    continue-on-error: true
    # Pinned to the same Playwright version as the `@playwright/test` dependency,
    # matching the `Tests` workflow. The image ships Chromium plus every system
    # library, so we skip `playwright install --with-deps` — that apt-driven step
    # was costing 15+ min of variable, sometimes-stalling wall-clock time.
    # When bumping @playwright/test, bump this tag in lockstep.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    # Drives a deployed URL; never launches Electron, so skip its binary download.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Playwright smoke against the deployed target
        # PLAYWRIGHT_BASE_URL makes the config skip the local webServer and drive
        # the deployed URL, so no inspector build is needed here. Sourced from the
        # smoke job's output because step outputs are job-local.
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.smoke.outputs.base_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run test:e2e -w @mcpjam/inspector

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.label || 'staging' }}
          path: |
            mcpjam-inspector/playwright-report/
            mcpjam-inspector/test-results/
          retention-days: 7
          if-no-files-found: ignore

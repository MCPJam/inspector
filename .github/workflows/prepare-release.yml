name: Start release

# Starts a release: versions the pending changesets, pushes that version
# commit to `main`, and dispatches Release (release.yml) on it. Soundcheck's
# "Start release" runs this.
#
# `main` takes every other change only through a reviewed pull request. The
# version commit is the one exception, and it is narrow by construction: it
# is pushed by the release GitHub App, the only bypass actor on `main`, and it
# may carry nothing but what `changeset version` writes for code already on
# `main` (.github/scripts/release-commit.mjs). This run checks that before
# pushing, and main-push-guard.yml checks it again on every push to `main`.
#
# The release's choices (deploys, skip_verify, who started it) ride in the
# commit message as trailers, so release-trigger.yml can retry the release
# with the same choices if this run's dispatch never ran.
#
# Local-harness pack pins are not part of it: they reach `main` in their own
# reviewed PR (local-harness-pack-prebuild.yml), because that review is the
# human check on the binaries users download. That PR and Release both run the
# pack consistency gate, so this run does not repeat it.

on:
  workflow_dispatch:
    inputs:
      deploy_backend_prod:
        description: "Deploy the backend to production"
        required: false
        default: false
        type: boolean
      deploy_webapp:
        description: "Deploy the webapp to production"
        required: false
        default: false
        type: boolean
      skip_verify:
        description: "Urgent fix only: release without the full test run or the green-staging check"
        required: false
        default: false
        type: boolean
      requested_by:
        description: "Set by Soundcheck: who started this release"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # `@changesets/changelog-github` looks up each changeset's PR and author.
  pull-requests: read
  # Dispatching Release.
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "prepare-release.yml must run from main" >&2
            exit 1
          fi

      # The release App's token: it is the only actor that may push to `main`
      # without a pull request, and unlike GITHUB_TOKEN its push starts
      # Deploy Staging and the rest of `main`'s workflows. A dedicated App with
      # Contents: write on this repo only, used by nothing else.
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Commit as the release App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # Versioned on the newest `main`, and again if a merge lands before the
      # push: the push only ever fast-forwards, so a commit the version step
      # did not see can never be dropped or reordered.
      - name: Version, check and push to main
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BACKEND_PROD: ${{ inputs.deploy_backend_prod }}
          DEPLOY_WEBAPP: ${{ inputs.deploy_webapp }}
          SKIP_VERIFY: ${{ inputs.skip_verify }}
          REQUESTED_BY: ${{ inputs.requested_by || github.actor }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            # Versioning on top of unreleased versions would skip them on npm
            # and leave CHANGELOG entries for releases that never happened.
            unpublished="$(node .github/scripts/unpublished-versions.mjs)"
            if [ "$(jq '.releases | length' <<<"$unpublished")" != "0" ]; then
              echo "$unpublished"
              echo "::error::main already carries versions npm does not have. Finish that release first with Retry release in Soundcheck."
              exit 1
            fi

            npx changeset status --output="$RUNNER_TEMP/status.json"
            if [ "$(jq '[.releases[] | select(.type != "none")] | length' "$RUNNER_TEMP/status.json")" = "0" ]; then
              echo "::error::No pending changesets on main, so there is nothing to release."
              exit 1
            fi

            npx changeset version
            npm install --package-lock-only --legacy-peer-deps

            # Tracked files only: `changeset version` also writes a CHANGELOG.md
            # for every bumped package that lacks one, and only sdk's is kept.
            git add -u
            node .github/scripts/release-commit.mjs message "$RUNNER_TEMP/status.json" > "$RUNNER_TEMP/message.txt"
            git commit --quiet --file "$RUNNER_TEMP/message.txt"
            node .github/scripts/release-commit.mjs check HEAD^ HEAD

            if git push origin HEAD:refs/heads/main; then
              label="$(sed -n 's/^Release-Versions: //p' "$RUNNER_TEMP/message.txt")"
              { echo "sha=$(git rev-parse HEAD)"; echo "label=$label"; } >> "$GITHUB_OUTPUT"
              git show --stat HEAD
              exit 0
            fi
            echo "::warning::main moved during attempt $attempt; versioning again on the new main."
          done
          echo "::error::main kept moving; start the release again."
          exit 1

      # Straight away, without waiting for staging: Release waits for Deploy
      # Staging on this commit itself, beside its tests and builds.
      # release-trigger.yml retries if `main` moves before this run starts.
      - name: Start Release
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.push.outputs.sha }}
          LABEL: ${{ steps.push.outputs.label }}
          DEPLOY_BACKEND_PROD: ${{ inputs.deploy_backend_prod }}
          DEPLOY_WEBAPP: ${{ inputs.deploy_webapp }}
          SKIP_VERIFY: ${{ inputs.skip_verify }}
          REQUESTED_BY: ${{ inputs.requested_by || github.actor }}
        with:
          script: |
            const env = process.env;
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "release.yml",
              ref: "main",
              inputs: {
                deploy_backend_prod: env.DEPLOY_BACKEND_PROD,
                deploy_webapp: env.DEPLOY_WEBAPP,
                skip_verify: env.SKIP_VERIFY,
                versions: env.LABEL,
                trigger_sha: env.SHA,
                requested_by: env.REQUESTED_BY,
              },
            });
            await core.summary
              .addRaw(`Pushed the version commit for ${env.LABEL} (${env.SHA}) to main and started Release.`)
              .write();

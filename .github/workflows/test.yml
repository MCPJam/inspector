name: Tests

on:
  pull_request:
    # `branches` filters on the PR's BASE. A stacked PR is based on the branch
    # below it rather than on main, so with `main` alone every PR above the
    # root of a stack merges without these tests having run against it once.
    # Add a pattern while a stack is in flight; drop it once that stack lands.
    #
    # Worth keeping the reason: this bit us on the UVH stack, where a test
    # asserted a label's wording verbatim, a later PR in the same stack changed
    # that wording, and the break sat unnoticed because every PR above the root
    # was green on previews and review bots alone. That stack has landed and
    # its pattern is gone; the lesson is why the mechanism stays.
    branches:
      - main
      - "claude/mcp-benchmarks-v2-b0tw4b-**"
  push:
    branches: [main]

# Every job here runs untrusted-ish code — `npm ci` lifecycle scripts and the
# test suites themselves. Pin the token to read-only so that stays true even if
# the repo-wide default workflow permission is later widened to write.
permissions:
  contents: read

# A newer push to the same ref makes in-flight runs obsolete — cancel them so
# we don't burn runner minutes finishing tests for superseded commits.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"
  # No CI job in this workflow launches Electron, so skip the (occasionally
  # flaky) Electron binary download during npm ci.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    # Pinned to the same Playwright version as the `@playwright/test` dependency.
    # The image ships Chromium + every system library preinstalled, so we skip
    # the `playwright install --with-deps` step entirely — that apt-driven step
    # was costing up to ~7 min of variable, sometimes-stalling wall-clock time.
    # When bumping @playwright/test, bump this tag in lockstep.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # First use of actions/cache in this repo, so the reasoning lives here and
      # the other jobs point back at it.
      #
      # `npm ci` runs seven times per PR — six jobs in this workflow, one in
      # lint.yml — at 49-306 s each against a 1316-package tree. Only esbuild
      # has a postinstall, so that is raw extract-and-link I/O, 25-57 % of every
      # job. setup-node's `cache: npm` is already on everywhere and does not
      # help: it caches ~/.npm, not node_modules.
      #
      # Four decisions worth keeping:
      #  - Skip `npm ci` on a hit rather than running it anyway. `npm ci`
      #    deletes node_modules before installing, so an unconditional install
      #    makes the cache a pure download tax.
      #  - No restore-keys. A near-miss restore still reports cache-hit=false,
      #    so `npm ci` would run and immediately delete the tree just
      #    downloaded. Partial restores help an npm *download* cache; for
      #    node_modules they are strictly waste.
      #  - Explicit paths, not `**/node_modules`. The glob would walk the whole
      #    tree and also match node_modules/x/node_modules, which the root entry
      #    already covers.
      #  - A separate key from lint.yml's bare runner. Both are linux-x64 so the
      #    resolved optional deps match, but the tree carries prebuilt native
      #    artifacts (node-pty, @biomejs/cli-*, @next/swc-*, @cloudflare/
      #    workerd-*, esbuild, @oven/bun-*) and node-pty is the one that can
      #    fall back to compiling. One extra cache entry removes the question.
      #
      # Every job attempts the save and the losers log a benign "Cache already
      # exists". Be honest about the cold case: the first run after any
      # package-lock.json change gets no benefit at all — every job misses and
      # installs, and only then is the cache populated for later runs on that
      # lockfile. With cancel-in-progress above, a cancelled job also skips its
      # save.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.62.1-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Install ripgrep (repo-guard checks in `npm test`)
        # GitHub-hosted runners ship ripgrep, but the Playwright image does not.
        # `npm test` opens with check:mcp-v1-runtime-imports / check:platform-
        # runtime-safety, which are `! rg -n '...'`. With rg missing the shell
        # returns 127 and `! 127` evaluates to 0 — the guards would vacuously
        # pass instead of running. Installing one package is fast (~seconds),
        # unlike the `--with-deps` browser libs we dropped.
        run: apt-get update && apt-get install -y ripgrep

      - name: Run SDK → CLI verification
        # Everything except the inspector suite, which the sharded `inspector`
        # job below owns. Running all ten suites in one job meant the inspector
        # (1189 files / ~14k tests) contended with the other nine for the same
        # four cores and pinned the job at ~18 min.
        #
        # Node 24 auto-scales heap to ~half system RAM (~4 GB on ubuntu-latest).
        # The vitest workspace (server + client + shared) runs concurrently and
        # exceeds that cap. 6 GB gives headroom without exhausting the runner.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run test:ci:rest

  inspector:
    runs-on: ubuntu-latest
    name: Inspector Tests ${{ matrix.shard }}/4
    # Same pinned Playwright image as the other jobs — see the note above.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      # Report every shard's result. Cancelling siblings on the first failure
      # would hide unrelated breakage in the other three quarters of the suite.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` job — see the rationale there.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.62.1-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build the SDK
        # The inspector's vitest configs alias many @mcpjam/sdk subpaths to
        # source, but the bare package export still resolves to dist. The root
        # `npm test` chain builds the SDK before any suite runs; this job is not
        # in that chain, so it builds the SDK itself.
        run: npm run build -w @mcpjam/sdk

      - name: Run inspector tests (shard ${{ matrix.shard }}/4)
        # `npm run test -w @mcpjam/inspector` also fires the workspace's
        # `pretest` bundling step, which the suite needs; args after `--` reach
        # vitest. Shards split by test file, so no shard depends on another.
        run: npm run test -w @mcpjam/inspector -- --shard=${{ matrix.shard }}/4

  e2e:
    runs-on: ubuntu-latest
    name: E2E Smoke (Playwright)
    # Same pinned Playwright image — Chromium + system deps are preinstalled.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` job — see the rationale there.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.62.1-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build inspector
        # Playwright's webServer boots `npm run start`, which serves built artifacts.
        run: npm run build -w @mcpjam/inspector

      - name: Run Playwright smoke
        run: npm run test:e2e -w @mcpjam/inspector

      - name: Run OAuth Debugger e2e
        run: npm run test:e2e:oauth-debugger -w @mcpjam/inspector

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            mcpjam-inspector/playwright-report/
            mcpjam-inspector/test-results/
          retention-days: 7
          if-no-files-found: ignore

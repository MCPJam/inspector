name: Tests

on:
  # Run on every PR regardless of its base branch. `branches` filters on the
  # PR's BASE, and a stacked PR is based on the branch below it until that one
  # merges — so any base filter, `main` alone or `main` plus a hand-added
  # pattern, skips every PR above the root of a stack and leaves the required
  # check stuck at "Expected — waiting for status" once the base re-targets to
  # main.
  #
  # Worth keeping the reason: this bit us on the UVH stack, where a test
  # asserted a label's wording verbatim, a later PR in the same stack changed
  # that wording, and the break sat unnoticed because every PR above the root
  # was green on previews and review bots alone. The fix is no base filter at
  # all — not a pattern added by hand while some stack happens to be in flight,
  # which only works for the stack somebody remembered to name.
  pull_request:
  # Release (release.yml) calls this on the commit it is about to ship, which
  # catches a break that only shows when two separately green PRs meet.
  #
  # There is deliberately no `push: main`: every merge would run the whole
  # suite again for a result that only matters when a release ships, and the
  # release runs it then. warm-node-modules.yml saves on main the
  # node_modules cache that PR runs restore.
  workflow_call:
    secrets:
      BACKEND_PREVIEW_DISPATCH_TOKEN:
        required: false
      E2E_GUEST_SESSION_SHARED_SECRET:
        required: false

# Every job here runs untrusted-ish code — `npm ci` lifecycle scripts and the
# test suites themselves. Pin the token to read-only so that stays true even if
# the repo-wide default workflow permission is later widened to write.
permissions:
  contents: read

# A newer push to the same ref makes in-flight runs obsolete — cancel them so
# we don't burn runner minutes finishing tests for superseded commits.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"
  # No CI job in this workflow launches Electron, so skip the (occasionally
  # flaky) Electron binary download during npm ci.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

# Every job runs on Blacksmith. GitHub's hosted runners are one pool of 60
# concurrent jobs shared by every MCPJam repo, and at busy times these jobs
# waited 30-80 minutes for a slot; Blacksmith has no concurrency cap. 4 vCPU /
# 16 GB matches GitHub's public-repo runner, which the 6 GB test heap needs.
#
# TEST_RUNNER is the way back without a PR: if Blacksmith is down, no PR can
# pass these required checks, a revert included. Set the repository variable to
# `ubuntu-latest` and every job here, in lint.yml and in warm-node-modules.yml
# moves together (their caches live with the runner that saved them).

jobs:
  # Which tests this run needs (.github/scripts/ci-scope.mjs). A pull request
  # runs the tests its diff can affect; Release calls this workflow and gets
  # everything. Every job below treats a failed scope as "run everything", so
  # a broken scope step can cost minutes but never skip a test.
  scope:
    name: Test scope
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      inspector: ${{ steps.scope.outputs.inspector }}
      rest: ${{ steps.scope.outputs.rest }}
      packaging: ${{ steps.scope.outputs.packaging }}
      app: ${{ steps.scope.outputs.app }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit and its first parent, the base.
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        run: node .github/scripts/ci-scope.mjs

  authoring-mirror:
    name: Compare authoring contracts with backend
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') &&
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # About 3x the slowest green run with a warm node_modules cache, so a cold
    # install still fits and a hung step fails in minutes instead of six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Backend main supplies the evaluator tag, the "declared" schema option,
      # and the "not_applicable" predicate result status.
      - name: Checkout pinned backend contract
        uses: actions/checkout@v7
        with:
          repository: MCPJam/mcpjam-backend
          ref: d202d7ed2bb7c7059bbb42530a5278cefc314775
          token: ${{ secrets.BACKEND_PREVIEW_DISPATCH_TOKEN }}
          path: .authoring-backend
          persist-credentials: false
          sparse-checkout: convex/lib
      # The backend commit whose AI refusal vocabulary
      # (`convex/lib/aiKeyPolicy.ts`) the SDK's `sdk/src/ai-refusal-codes.ts`
      # matches. It has its own pin because it moves on its own schedule. It
      # is the head of the backend's refusal-code branch, not yet on `main`:
      # once the backend refusal-code PRs merge, bump it to a backend `main`
      # commit. Bump it again whenever the vocabulary changes there.
      - name: Checkout pinned backend AI refusal vocabulary
        uses: actions/checkout@v7
        with:
          repository: MCPJam/mcpjam-backend
          ref: ba5363a0f97c40b9905d14778f1cd132eaee8a81
          token: ${{ secrets.BACKEND_PREVIEW_DISPATCH_TOKEN }}
          path: .ai-refusal-backend
          persist-credentials: false
          sparse-checkout: convex/lib
      - name: Install contract checker dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Compare authoring implementation and step fixtures
        run: |
          node --test scripts/authoring-contract-normalization.test.mjs
          node scripts/check-authoring-mirror.mjs --backend .authoring-backend
      - name: Compare AI refusal vocabulary with backend
        run: node scripts/check-ai-refusal-parity.mjs --backend .ai-refusal-backend

  test:
    needs: scope
    # A required check, so it always runs; the scope only narrows what it runs.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    name: Run Tests
    # Pinned to the same Playwright version as the `@playwright/test` dependency.
    # The image ships Chromium + every system library preinstalled, so we skip
    # the `playwright install --with-deps` step entirely — that apt-driven step
    # was costing up to ~7 min of variable, sometimes-stalling wall-clock time.
    # When bumping @playwright/test, bump this tag in lockstep.
    container: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      # Git in the Playwright container can fail to discover its CA bundle.
      # Rebuild the system trust store before checkout and select it explicitly.
      - name: Prepare container certificates
        run: |
          update-ca-certificates --fresh
          test -s /etc/ssl/certs/ca-certificates.crt
          echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # First use of actions/cache in this repo, so the reasoning lives here and
      # the other jobs point back at it.
      #
      # `npm ci` runs ten times per PR — nine jobs in this workflow (test,
      # packaging, six inspector shards, e2e), one in lint.yml — at 49-306 s
      # each against a 1316-package tree. Only esbuild
      # has a postinstall, so that is raw extract-and-link I/O, 25-57 % of every
      # job. setup-node's `cache: npm` is already on everywhere and does not
      # help: it caches ~/.npm, not node_modules.
      #
      # Four decisions worth keeping:
      #  - Skip `npm ci` on a hit rather than running it anyway. `npm ci`
      #    deletes node_modules before installing, so an unconditional install
      #    makes the cache a pure download tax.
      #  - No restore-keys. A near-miss restore still reports cache-hit=false,
      #    so `npm ci` would run and immediately delete the tree just
      #    downloaded. Partial restores help an npm *download* cache; for
      #    node_modules they are strictly waste.
      #  - Explicit paths, not `**/node_modules`. The glob would walk the whole
      #    tree and also match node_modules/x/node_modules, which the root entry
      #    already covers.
      #  - A separate key from lint.yml's bare runner. Both are linux-x64 so the
      #    resolved optional deps match, but the tree carries prebuilt native
      #    artifacts (node-pty, @biomejs/cli-*, @next/swc-*, @cloudflare/
      #    workerd-*, esbuild, @oven/bun-*) and node-pty is the one that can
      #    fall back to compiling. One extra cache entry removes the question.
      #
      # Every job attempts the save and the losers log a benign "Cache already
      # exists". Be honest about the cold case: the first run after any
      # package-lock.json change gets no benefit at all — every job misses and
      # installs, and only then is the cache populated for later runs on that
      # lockfile. With cancel-in-progress above, a cancelled job also skips its
      # save.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.63.0-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Install ripgrep (repo-guard checks in `npm test`)
        # GitHub-hosted runners ship ripgrep, but the Playwright image does not.
        # `npm test` opens with check:mcp-v1-runtime-imports / check:platform-
        # runtime-safety, which are `! rg -n '...'`. With rg missing the shell
        # returns 127 and `! 127` evaluates to 0 — the guards would vacuously
        # pass instead of running. Installing one package is fast (~seconds),
        # unlike the `--with-deps` browser libs we dropped.
        run: apt-get update && apt-get install -y ripgrep

      - name: Run SDK → CLI verification
        # Everything except the inspector suite, which the sharded `inspector`
        # job below owns. Running all ten suites in one job meant the inspector
        # (1745 files / ~14k tests) contended with the other nine for the same
        # four cores and pinned the job at ~18 min.
        #
        # Node 24 auto-scales heap to ~half system RAM (~4 GB on ubuntu-latest).
        # The vitest workspace (server + client + shared) runs concurrently and
        # exceeds that cap. 6 GB gives headroom without exhausting the runner.
        #
        # When only Inspector files changed, the other workspaces cannot be
        # affected, so only the repo guards run (they scan Inspector code).
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          REST: ${{ needs.scope.result == 'success' && needs.scope.outputs.rest || 'full' }}
        run: |
          if [ "$REST" = "checks" ]; then
            echo "Only Inspector files changed: running the repo guards, not the other workspaces' suites."
            npm run test:checks && npm run test:packaging:assert -w @mcpjam/sdk
          else
            npm run test:ci:rest
          fi

  # Node 26 bundles undici 8, whose fetch negotiates HTTP/2, and the CLI's
  # `engines` admits Node 26. Every other job here runs Node 24, so this is the
  # one that exercises the HTTP/2 path (CQT-216, nodejs/undici#6143), and the
  # SDK suite is quick enough to run whole. Pinned: bumping it is the moment to
  # check whether the undici fix has shipped.
  node26:
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.rest == 'full')
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    name: SDK tests on Node 26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      # Some SDK suites import the built package (`sdk/dist`); the main job
      # gets it from `test:checks`, this one has to build it.
      - name: Build the SDK
        run: npm run build -w @mcpjam/evaluators && npm run build -w @mcpjam/sdk
      - name: Run the SDK suite on Node 26
        run: npm run test -w @mcpjam/sdk

  packaging:
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.packaging == 'true')
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    name: Packaging
    # Same pinned Playwright image as the other jobs — see the note above.
    container: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      # Git in the Playwright container can fail to discover its CA bundle.
      # Rebuild the system trust store before checkout and select it explicitly.
      - name: Prepare container certificates
        run: |
          update-ca-certificates --fresh
          test -s /etc/ssl/certs/ca-certificates.crt
          echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` job — see the rationale there.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.63.0-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Verify the packed tarballs install and run
        # The tarball half of packaging, split out of `test:ci:rest` where it
        # ran after all ten lanes had finished — bolted onto the critical path
        # while three cores idled, for work that depends on nothing the lanes
        # produce.
        #
        # The SDK's export-surface assertions deliberately did NOT move here.
        # They stay in `test:ci:rest`, because this job is not a required check
        # ("Build and Test" and "Run Tests" are) and a silent regression in a
        # release-critical export surface must not be mergeable. They cost
        # 1.2 s there — test:checks has already built the SDK, so the assert
        # runs on its own. What moved is the expensive part: the duplicate
        # ~38 s SDK build and this tarball suite.
        #
        # The build below is still needed: the @mcpjam/vitest suite packs sdk/
        # and sdk has no prepack hook, so it tars whatever dist/ is on disk.
        run: npm run test:ci:packaging

  inspector:
    needs: scope
    # Required checks, so every shard always runs and reports. A job-level skip
    # would report one check under the unexpanded name
    # "Inspector Tests ${{ matrix.shard }}/6", and the six required ones would
    # wait forever. The steps check SCOPE instead.
    if: ${{ !cancelled() }}
    env:
      SCOPE: ${{ needs.scope.result == 'success' && needs.scope.outputs.inspector || 'full' }}
    # 8 vCPU / 32 GB, not 4 / 16. Vitest's import phase dominates a shard and
    # spreads across workers, and mcpjam-inspector/vitest.config.ts sizes the
    # pool by memory as well as cores: on 16 GB only two 3 GB workers fit next
    # to the 6 GB main process, on 32 GB six or seven do. A bigger runner keeps
    # the six required check names below; more shards would rename them.
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    name: Inspector Tests ${{ matrix.shard }}/6
    # Same pinned Playwright image as the other jobs — see the note above.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      # Report every shard's result. Cancelling siblings on the first failure
      # would hide unrelated breakage in the other five sixths of the suite.
      fail-fast: false
      # Six, not four. Once installs are a cache restore (see the `test` job),
      # this job's own ~4.7-5.7 min of tests is the gate's long pole, and two
      # more shards are cheap when the expensive part is no longer the install.
      # All four of the places that carry the denominator — this list, the job
      # name, the step name and --shard — must move together, or the job
      # silently runs the wrong fraction of the suite. dependabot-auto-merge.yml
      # names these jobs too ("Inspector Tests N/6"); it fails safe (holds)
      # when they drift, but update it with them.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      # Git in the Playwright container can fail to discover its CA bundle.
      # Rebuild the system trust store before checkout and select it explicitly.
      - name: Prepare container certificates
        run: |
          update-ca-certificates --fresh
          test -s /etc/ssl/certs/ca-certificates.crt
          echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false
          # `--changed HEAD^1` below diffs the PR's merge commit against the base.
          fetch-depth: 2

      - name: Setup Node.js
        if: env.SCOPE != 'skip'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` job — see the rationale there.
      - name: Cache workspace node_modules
        if: env.SCOPE != 'skip'
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.63.0-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: env.SCOPE != 'skip' && steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build the SDK
        if: env.SCOPE != 'skip'
        # The inspector's vitest configs alias many @mcpjam/sdk subpaths to
        # source, but the bare package export still resolves to dist. The root
        # `npm test` chain builds the SDK before any suite runs; this job is not
        # in that chain, so it builds the SDK itself.
        run: npm run build -w @mcpjam/sdk

      - name: Run inspector tests (shard ${{ matrix.shard }}/6)
        # `npm run test -w @mcpjam/inspector` also fires the workspace's
        # `pretest` bundling step, which the suite needs; args after `--` reach
        # vitest. Shards split by test file, so no shard depends on another.
        #
        # SCOPE (see the `scope` job): `changed` runs the test files that
        # import a file this PR changed; `docs` runs the test files that
        # mention `docs/`, since some read docs files at runtime.
        #
        # retry-worker-crash.mjs reruns the shard ONCE when a Vitest worker
        # exited unexpectedly and nothing else went wrong: every file and test
        # passed and the crash is the only unhandled error. A failed test, a
        # file that failed to load or any other error is never retried. It
        # also prints the container's oom_kill count and peak memory.
        if: env.SCOPE != 'skip'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}/6
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          run_shard() {
            node .github/scripts/retry-worker-crash.mjs npm run test -w @mcpjam/inspector -- --shard="$SHARD" "$@"
          }
          case "$SCOPE" in
            changed)
              run_shard --changed HEAD^1 --passWithNoTests
              ;;
            docs)
              mapfile -t files < <(git grep -l -F 'docs/' -- 'mcpjam-inspector/**/*.test.*' | sed 's#^mcpjam-inspector/##')
              if [ "${#files[@]}" -eq 0 ]; then
                echo "No Inspector test mentions docs/."
                exit 0
              fi
              run_shard --passWithNoTests "${files[@]}"
              ;;
            *)
              run_shard
              ;;
          esac

  e2e:
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    name: E2E Smoke (Playwright)
    # Run as the host user so Local Browser keeps Chromium sandboxed.
    # This job boots the PR's build against the community backend, which runs
    # backend main, and bars the browser from production
    # (e2e/community-backend.ts). Minting a guest there takes its guest-session
    # secret, which GitHub withholds from fork and Dependabot PRs, so those
    # skip the job rather than fail it. Keep its errors out of prod Sentry,
    # which pages us: the build flag turns off the browser SDK, DO_NOT_TRACK
    # turns off the server's.
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.app == 'true') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    env:
      VITE_DISABLE_SENTRY: "true"
      DO_NOT_TRACK: "1"

    steps:
      # Git in the Playwright container can fail to discover its CA bundle.
      # Rebuild the system trust store before checkout and select it explicitly.
      - name: Prepare container certificates
        run: |
          sudo update-ca-certificates --fresh
          test -s /etc/ssl/certs/ca-certificates.crt
          echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` job — see the rationale there.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-bare-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build inspector
        # Playwright's webServer boots `npm run start`, which serves built artifacts.
        run: npm run build -w @mcpjam/inspector

      # The secret goes on these two steps only, so `npm ci`'s lifecycle
      # scripts never see it.
      - name: Run Playwright smoke
        env:
          MCPJAM_GUEST_SESSION_SHARED_SECRET: ${{ secrets.E2E_GUEST_SESSION_SHARED_SECRET }}
        run: npm run test:e2e -w @mcpjam/inspector

      - name: Run local access e2e
        # Its own config: the smoke config seeds every page with the access key,
        # and this spec proves what a browser without one sees.
        env:
          MCPJAM_GUEST_SESSION_SHARED_SECRET: ${{ secrets.E2E_GUEST_SESSION_SHARED_SECRET }}
        run: npm run test:e2e:local-access -w @mcpjam/inspector

      - name: Run OAuth Debugger e2e
        run: npm run test:e2e:oauth-debugger -w @mcpjam/inspector

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            mcpjam-inspector/playwright-report/
            mcpjam-inspector/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Split out of `e2e`, where it ran last and made that job the suite's long
  # pole (~3 of its ~7.5 min). It serves the client from a Vite dev server of
  # its own and needs no backend or guest secret, so it does not inherit the
  # fork and Dependabot skip that `e2e` has for its secret.
  mobile-layout:
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    name: Mobile layout (Playwright)
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.app == 'true')
    env:
      VITE_DISABLE_SENTRY: "true"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as `e2e` — bare runner, not the container.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-bare-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build inspector
        # The same build `e2e` runs before these specs ran there: the SDK and
        # the bundles the client imports.
        run: npm run build -w @mcpjam/inspector

      - name: Run mobile layout regressions
        working-directory: mcpjam-inspector
        env:
          MOBILE_LAYOUT_RESULTS_DIR: test-results/mobile-layout
        run: npx playwright test --config playwright.mobile-layout.config.ts

      - name: Upload mobile layout report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile-layout
          path: mcpjam-inspector/test-results/mobile-layout/
          retention-days: 7
          if-no-files-found: ignore

  # Two telemetry-on browser jobs, on two harnesses: `telemetry-privacy`
  # drives a small page built from the telemetry modules and proves a private
  # context sends no seeded personal data; `telemetry-egress` drives the whole
  # hosted app and proves no credential URL leaves through PostHog or Sentry.
  telemetry-egress:
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.app == 'true')
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    name: Telemetry egress (Playwright, telemetry on) ${{ matrix.shard }}/3
    # Same pinned Playwright image as `e2e` — Chromium + system deps are
    # preinstalled, and its Chromium is the one this Playwright version expects.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # Its 18 tests run one at a time (playwright.telemetry.config.ts) and
    # mostly wait out real SDK flush timers: ~7 min in one job, the suite's
    # long pole. Three machines each run a third, still one session at a time.
    # The count is here and in --shard below; not a required check.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A hosted build with Sentry and PostHog ON, because they are what it
    # tests: every request to the PostHog relay and to Sentry ingest
    # intercepted with `page.route`, recorded, decoded and searched for
    # planted credentials. Nothing is forwarded — the spec fulfils every
    # request itself, serves the app from the build, and stands in for
    # Convex — so unlike `e2e` there is no VITE_DISABLE_SENTRY: turning Sentry
    # off would turn half the proof off. No server runs, so the server-side
    # DO_NOT_TRACK has nothing to apply to.
    # See mcpjam-inspector/e2e/telemetry/browser-harness.ts.

    steps:
      # Git in the Playwright container can fail to discover its CA bundle.
      # Rebuild the system trust store before checkout and select it explicitly.
      - name: Prepare container certificates
        run: |
          update-ca-certificates --fresh
          test -s /etc/ssl/certs/ca-certificates.crt
          echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No step here uses git auth after checkout, so don't leave the token
          # in .git/config where dependency install scripts and tests could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` and `e2e` jobs.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.63.0-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build inspector
        # The same build `e2e` runs: it builds the SDK and the bundles the
        # client imports. The telemetry client build below reuses them.
        run: npm run build -w @mcpjam/inspector

      - name: Build the telemetry client
        # Hosted mode (what records), PostHog and Sentry on, a Convex URL the
        # spec stands in for. Written to dist/telemetry-client, next to the
        # normal client, never instead of it.
        run: npm run build:client:telemetry-e2e -w @mcpjam/inspector

      - name: Run telemetry egress e2e (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e:telemetry -w @mcpjam/inspector -- --shard=${{ matrix.shard }}/3

      - name: Upload telemetry egress report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-telemetry-${{ matrix.shard }}
          path: |
            mcpjam-inspector/playwright-report/telemetry/
            mcpjam-inspector/test-results/telemetry/
          retention-days: 7
          if-no-files-found: ignore

  telemetry-privacy:
    needs: scope
    if: >-
      !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.app == 'true')
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    name: Telemetry Privacy (browser)
    # Telemetry ON, unlike the smoke job above: the app's real PostHog and
    # Sentry setup, with both transports intercepted in the browser and every
    # outbound payload decoded. Nothing reaches a vendor. Proves a private
    # context sends masked, useful recordings and no seeded personal data.
    container: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      # Git in the Playwright container can fail to discover its CA bundle.
      # Rebuild the system trust store before checkout and select it explicitly.
      - name: Prepare container certificates
        run: |
          update-ca-certificates --fresh
          test -s /etc/ssl/certs/ca-certificates.crt
          echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Same node_modules cache as the `test` job — see the rationale there.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-playwright-v1.63.0-noble-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'mcpjam-inspector/scripts/patch-harness-approvals.mjs') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build SDK exports used by telemetry fixtures
        run: npm run build -w @mcpjam/sdk

      - name: Run telemetry privacy browser test
        run: npm run test:e2e:telemetry-privacy -w @mcpjam/inspector

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-privacy-report
          path: mcpjam-inspector/test-results/
          retention-days: 7
          if-no-files-found: ignore

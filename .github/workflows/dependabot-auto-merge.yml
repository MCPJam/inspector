name: Dependabot Auto-approve

# Takes exactly ONE action on every Dependabot PR:
#   - APPROVE -> approve it, so a person can add it to the merge queue with
#                one click once the required checks on main pass.
#   - HOLD    -> leave it open for a human and say, in one line, why.
#
# It never queues a PR itself. GitHub starts no workflow for an event caused
# by GITHUB_TOKEN, and that includes the merge_group event of a PR this token
# adds to the queue: the entry gets no checks, sits at the head of the queue
# and blocks every PR behind it.
#
# What is approved on its own: security updates, dev-dependency patch/minor bumps,
# and — since 2026-09-24 — majors and runtime patch/minor bumps too. Holding
# every major for a person did not produce reviews, it produced a backlog:
# from 2026-09-01 to 2026-09-23 about twenty major PRs sat open and one
# Dependabot PR merged. A green CI run is the review now, so the second class
# carries one extra condition: the checks that actually EXERCISE the update
# must be required on main, because the merge queue waits only for required
# checks. On 2026-09-24 main requires "Build and Test" and "Run Tests", and
# neither runs the inspector's own test suite ("Inspector Tests N/6") or
# builds the example apps ("Build examples"). #5474 shows why that matters:
# with the typecheck fixed, its remaining breakage — including a runtime break
# in the harness skills path — showed up ONLY in inspector shards. Until those
# checks are required, majors and runtime bumps are held and the hold comment
# names the missing checks. Adding them to the "Standard BC" ruleset turns
# this on with no edit here.
#
# Still held for a person, always: anything touching the Electron / native
# packaging chain, and GitHub Actions updates.

on:
  # `pull_request_target`, NOT `pull_request`. Workflows that Dependabot
  # triggers via `pull_request` run with a read-only GITHUB_TOKEN regardless
  # of the `permissions:` block below, so the approval would 403 — and that
  # failure is easy to miss. `pull_request_target` runs in base-branch context
  # with a writable token.
  #
  # `pull_request_target` is dangerous when a job checks out and EXECUTES the
  # PR's code, because that code would run with those write permissions. This
  # job never does: there is no `actions/checkout` step anywhere below, and
  # none may be added. It reads metadata through the API and nothing else.
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  decide:
    # Gate on the PR author, not `github.actor`, which is spoofable and is the
    # human rather than the bot on a reopen — same reasoning as
    # mintlify-triage.yml.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # turn off an auto-merge a person enabled, on HOLD
      pull-requests: write # approve / comment

    steps:
      # Pinned to a full commit SHA, not a moving tag: this job holds
      # `contents: write` and can approve PRs, so a compromised tag would
      # inherit both. Update the pin deliberately.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          # `ghsa-id` is populated ONLY when `alert-lookup` is on, and the
          # lookup needs a PAT or App token — GITHUB_TOKEN cannot read
          # Dependabot alerts. So this is wired to an optional secret: without
          # it the workflow still runs and security PRs are classified like
          # any other update (below); add DEPENDABOT_ALERTS_TOKEN and the
          # security branch lights up with no further edit. Without this
          # wiring that branch would be dead code that silently never fires.
          alert-lookup: ${{ secrets.DEPENDABOT_ALERTS_TOKEN != '' }}
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}

      # Metadata reaches the shell through `env:`, never through `${{ }}`
      # interpolated directly into the script, so a crafted dependency name
      # cannot break out into the runner shell.
      - name: Decide the outcome
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
          ALERT_LOOKUP: ${{ secrets.DEPENDABOT_ALERTS_TOKEN != '' }}
        run: |
          set -euo pipefail

          # The desktop packaging chain. `electron-forge package` is NOT
          # exercised by any required check — desktop-package-smoke.yml is
          # path-filtered and advisory — so a green PR proves the app still
          # builds, never that it still packages. These stay manual until
          # that smoke job is a required check.
          hold_desktop=false
          IFS=',' read -ra pkgs <<<"$NAMES"
          for raw in "${pkgs[@]}"; do
            pkg="$(echo "$raw" | tr -d '[:space:]')"
            case "$pkg" in
              electron | sharp | @electron/* | @electron-forge/*)
                hold_desktop=true
                ;;
            esac
          done

          # Which non-required checks exercise this update. The names must
          # match the job names exactly: "Inspector Tests <shard>/6" in
          # test.yml and "Build examples" in examples-build.yml. Renaming or
          # re-sharding either makes this list stale, which fails SAFE — the
          # update is held and the comment names the check it could not find.
          case "$DIRECTORY" in
            /examples/*)
              covering=("Build examples")
              ;;
            *)
              covering=()
              for shard in 1 2 3 4 5 6; do
                covering+=("Inspector Tests $shard/6")
              done
              ;;
          esac

          # The required checks as the rulesets on the base branch define
          # them. An API failure here exits non-zero, which the outcome step
          # below reports as a red "no decision" — never as a silent merge.
          required="$(gh api "repos/$REPO/rules/branches/$BASE" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')"
          missing=()
          for check in "${covering[@]}"; do
            if ! grep -qxF "$check" <<<"$required"; then
              missing+=("$check")
            fi
          done

          if [ "$hold_desktop" = true ]; then
            action=hold
            reason="touches the Electron/native packaging chain, which no required check exercises"
          elif [ "$ECOSYSTEM" = "github_actions" ] || [ "$ECOSYSTEM" = "github-actions" ]; then
            # Workflows run with repository write tokens and secrets; a person
            # reads which commit each pin moves to.
            action=hold
            reason="GitHub Actions update — workflow pins are read by a person"
          elif [ -n "$GHSA" ]; then
            action=approve
            reason="security update ($GHSA)"
          elif [ "$DEP_TYPE" = "direct:development" ] && \
               { [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || \
                 [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; }; then
            action=approve
            reason="dev-dependency ${UPDATE_TYPE#version-update:semver-} update"
          else
            if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
              kind="major version update"
            else
              kind="runtime dependency update"
              if [ "$ALERT_LOOKUP" != "true" ]; then
                # Be explicit rather than letting a security PR look like a
                # routine bump: without the token we cannot tell them apart.
                kind="$kind (security detection off — no DEPENDABOT_ALERTS_TOKEN)"
              fi
            fi
            if [ "${#missing[@]}" -gt 0 ]; then
              action=hold
              list="$(printf '"%s", ' "${missing[@]}")"
              reason="$kind; auto-approval for this class waits until the checks that exercise it are required on $BASE: ${list%, }"
            else
              action=approve
              reason="$kind"
            fi
          fi

          echo "action=$action" >>"$GITHUB_OUTPUT"
          echo "reason=$reason" >>"$GITHUB_OUTPUT"
          echo "Decision: $action — $reason (names=$NAMES type=$DEP_TYPE update=$UPDATE_TYPE dir=$DIRECTORY ecosystem=$ECOSYSTEM)"

      # The approval is the whole APPROVE decision, not a general bypass: the
      # "Standard BC" ruleset on main requires 1 approving review, so with it
      # a person only has to add the PR to the merge queue. It is posted by
      # github-actions[bot], only in this workflow, only for the classes
      # decided above, and never by the PR author. No `gh pr merge --auto`
      # here: see the top of this file.
      - name: Approve
        if: steps.decide.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f body="Auto-approved: $REASON. Add it to the merge queue once the required checks pass." >/dev/null

      - name: Hold for human review
        if: steps.decide.outputs.action == 'hold'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.decide.outputs.reason }}
          EVENT: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # Dependabot rewrites an existing PR in place when a newer version
          # lands, so a PR a person set to auto-merge as a patch can come back
          # as a desktop-chain bump on `synchronize`. Without this, that
          # auto-merge survives the reclassification and merges the thing we
          # just decided to hold.
          if [ "$(gh api "repos/$REPO/pulls/$PR" --jq '.auto_merge != null')" = "true" ]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
            echo "Disabled a previously queued auto-merge after reclassification."
          fi

          # Comment only on the first look: `synchronize` fires on every
          # Dependabot rebase and re-commenting would bury the PR in noise.
          if [ "$EVENT" != "synchronize" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "Held for human review: $REASON. See .github/workflows/dependabot-auto-merge.yml for what is approved on its own."
          fi

      # A run that reaches no outcome must be loud. mintlify-triage.yml learned
      # this the hard way: a step that soft-skips exits 0 and reports a green
      # check having done nothing, which is strictly worse than a red X because
      # nobody can tell it apart from a real decision.
      - name: Enforce an outcome
        # Not success(): a soft-skip exits 0. Not always(): `cancel-in-progress`
        # means a superseded run has legitimately reached no outcome.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          set -euo pipefail
          queued=$(gh api "repos/$REPO/pulls/$PR" --jq '.auto_merge != null')

          case "$ACTION" in
            approve)
              approvals=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
                --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' | wc -l)
              if [ "$approvals" -gt 0 ]; then
                echo "Outcome: APPROVE — approved; a person adds it to the merge queue."
              else
                echo "::error title=Approval never posted::PR #$PR was classified APPROVE but has no approval from this workflow. Check the Approve step — a silent 403 there is the likely cause, which would mean this workflow is running with a read-only token."
                exit 1
              fi
              ;;
            hold)
              if [ "$queued" = "true" ]; then
                echo "::error title=Held PR still queued::PR #$PR was classified HOLD but auto-merge is still enabled, so it will merge without review. The disable step above did not take effect."
                exit 1
              fi
              echo "Outcome: HOLD — left for human review."
              ;;
            *)
              echo "::error title=No decision reached::The classify step produced no action for PR #$PR, so neither APPROVE nor HOLD ran."
              exit 1
              ;;
          esac

name: Deploy preview router

# Deploys preview-router/ (the *.mcpjam.dev Worker that serves PR previews)
# whenever it changes on main. It only ever serves PR previews, so there is no
# staging step. The Worker's PREVIEW_EDGE_SECRET is set once with
# `wrangler secret put` and survives deploys.

on:
  push:
    branches: [main]
    paths:
      - "preview-router/**"
      - ".github/workflows/deploy-preview-router.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: preview-router
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MCPJam/inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Deploy Worker
        working-directory: preview-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.127.1 deploy

# The evidence behind `lifecycleConformanceVersion`.
#
# A platform is not "native" because the code compiles for it. `compatibility.ts`
# treats an empty conformance version as expired, so a platform stays refused
# until these scenarios have actually run there — against a real pack, a real
# supervisor, a real bridge and the real vendor CLI, with a mock upstream
# standing in only for Anthropic.
#
# Two runners, because two of the facts this suite pins are darwin-specific: the
# `(node)` command an exiting process reports, and the `ps -g` group probe.
# Everything else is portable, so ubuntu covers the rest and is the job a change
# to the foundation has to get past.
name: Local harness conformance

on:
  workflow_call:
    inputs:
      pack_version:
        description: Pack version to build and run against.
        required: false
        type: string
        default: conformance
    outputs:
      conformance_version:
        description: The identifier to stamp into `lifecycleConformanceVersion`.
        value: ${{ jobs.summarize.outputs.conformance_version }}
  workflow_dispatch:
  pull_request:
    paths:
      - "mcpjam-inspector/server/utils/harness/local/**"
      - "mcpjam-inspector/scripts/build-local-harness-pack.mjs"
      - ".github/workflows/local-harness-conformance.yml"

permissions:
  contents: read

env:
  BUNDLED_NODE_VERSION: "24.20.0"

jobs:
  unit:
    name: foundation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: mcpjam-inspector
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # From `mcpjam-inspector/`, not the worktree root: the root breaks the
      # `@/shared` path alias and the suite fails for a reason that has nothing
      # to do with the code under test.
      - name: Run the local harness suite
        working-directory: mcpjam-inspector
        run: npx vitest run server/utils/harness/local

  scenarios:
    name: ${{ matrix.label }}
    needs: unit
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64 scenarios
            runner: ubuntu-latest
            platform_key: linux-x64
            node_dist: linux-x64
          - label: darwin-arm64 scenarios
            runner: macos-latest
            platform_key: darwin-arm64
            node_dist: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        working-directory: mcpjam-inspector
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Download the bundled Node runtime
        run: |
          set -euo pipefail
          url="https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/node-v${BUNDLED_NODE_VERSION}-${{ matrix.node_dist }}.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/node-runtime.tar.gz"

      # The real thing, not a fixture: these scenarios exist to prove the pack
      # a user would install actually runs.
      - name: Build the pack
        working-directory: mcpjam-inspector
        run: |
          node scripts/build-local-harness-pack.mjs \
            --platform ${{ matrix.platform_key }} \
            --pack-version "${{ inputs.pack_version || 'conformance' }}" \
            --node-tarball "$RUNNER_TEMP/node-runtime.tar.gz" \
            --out "$RUNNER_TEMP/conformance/runtime-src" \
            --skip-archive
          mkdir -p "$RUNNER_TEMP/conformance/runtime"
          cp -R "$RUNNER_TEMP/conformance/runtime-src/claude-code" \
            "$RUNNER_TEMP/conformance/runtime/claude-code"

      - name: Full turn
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          mkdir -p "$HOME" "$CONFORMANCE_ROOT/workspace"
          npx tsx server/utils/harness/local/conformance/run-native-turn.ts full

      # The negative that makes the loopback guarantee enforceable rather than
      # aspirational: a pack whose launcher does not constrain the listener must
      # be REFUSED by the exposure probe, not admitted because we shipped a
      # launcher that usually does.
      - name: A pack without the loopback launcher is refused
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-native-turn.ts no-launcher

      - name: Abort takes the vendor CLI down with the bridge
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-lifecycle.ts abort

      - name: A crashed Inspector's tree is reclaimed
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          npx tsx server/utils/harness/local/conformance/run-lifecycle.ts orphan-a
          npx tsx server/utils/harness/local/conformance/run-lifecycle.ts orphan-b

      # Budgets, not benchmarks. The exposure probe used to take 11 s on a
      # laptop with ten link-local addresses, inside a 1.5 s session-start
      # budget; these fail if that comes back.
      - name: Probe and digest budgets
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: |
          npx tsx server/utils/harness/local/conformance/probe-timing.mts
          npx tsx server/utils/harness/local/conformance/timing-decomp.mts

      - name: The group snapshot settles a tree whose root exited first
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: npx tsx server/utils/harness/local/conformance/group-settle.mts

      # A conformance run that leaves a process behind has not demonstrated the
      # thing it exists to demonstrate, whatever its scenarios printed.
      - name: No supervised process survived the run
        if: always()
        run: |
          set -euo pipefail
          survivors="$(pgrep -f 'launcher.mjs|bridge.mjs' || true)"
          if [ -n "$survivors" ]; then
            echo "supervised processes survived the conformance run: $survivors" >&2
            ps -o pid=,command= -p $survivors || true
            exit 1
          fi

  # Windows, and the one job here that is allowed to fail.
  #
  # `continue-on-error` is not laziness: Windows is REFUSED today
  # (`nativePlatforms` omits win32, `supportsOwnershipProof('win32')` answers
  # false without a verified helper), so a red leg here blocks nothing a user
  # can reach. What it does is make the gap visible on every run instead of in
  # somebody's memory.
  #
  # Removing `continue-on-error` and adding `win32` to `nativePlatforms` are the
  # SAME change, and this job going green is what earns it.
  windows:
    name: windows-latest scenarios (not yet gating)
    needs: unit
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        working-directory: mcpjam-inspector
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # The Job Object launcher is what whole-tree cleanup rests on here, so a
      # conformance run without it is not testing Windows support — it is
      # testing that Windows is refused, which the unit suite already covers.
      - name: Build the Job Object launcher
        working-directory: mcpjam-inspector/tools/mcpjam-job-launcher
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/mcpjam-job-launcher.exe" .

      - name: Download the bundled Node runtime
        run: |
          set -euo pipefail
          archive="node-v${BUNDLED_NODE_VERSION}-win-x64.zip"
          curl -fsSL "https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/${archive}" \
            -o "$RUNNER_TEMP/node-runtime.zip"

      - name: Build the pack
        working-directory: mcpjam-inspector
        run: |
          node scripts/build-local-harness-pack.mjs \
            --platform win32-x64 \
            --pack-version conformance \
            --node-tarball "$RUNNER_TEMP/node-runtime.zip" \
            --job-launcher "$RUNNER_TEMP/mcpjam-job-launcher.exe" \
            --out "$RUNNER_TEMP/conformance/runtime-src" \
            --skip-archive
          mkdir -p "$RUNNER_TEMP/conformance/runtime"
          cp -R "$RUNNER_TEMP/conformance/runtime-src/claude-code" \
            "$RUNNER_TEMP/conformance/runtime/claude-code"

      - name: Full turn
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          mkdir -p "$CONFORMANCE_ROOT/home" "$CONFORMANCE_ROOT/workspace"
          HOME="$CONFORMANCE_ROOT/home" \
            npx tsx server/utils/harness/local/conformance/run-native-turn.ts full

      # The one that matters on Windows: aborting must take the vendor binary
      # down with the bridge. That is the whole reason the Job Object exists,
      # and the reason `taskkill /T` was not enough.
      - name: Abort takes the vendor CLI down with the bridge
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          HOME="$CONFORMANCE_ROOT/home" \
            npx tsx server/utils/harness/local/conformance/run-lifecycle.ts abort

      - name: No supervised process survived the run
        if: always()
        run: |
          survivors="$(tasklist //FI "IMAGENAME eq node.exe" //FO CSV //NH || true)"
          echo "$survivors"

  summarize:
    name: conformance version
    # Deliberately NOT `needs: windows`. A conformance version records the
    # evidence that exists; Windows is refused, so its leg is informational and
    # must not hold up a stamp the supported platforms have earned.
    needs: scenarios
    runs-on: ubuntu-latest
    outputs:
      conformance_version: ${{ steps.stamp.outputs.version }}
    steps:
      # The value the manifest records. It names the RUN that produced the
      # evidence, so a recorded conformance version can always be traced back to
      # the scenarios that justified it.
      - id: stamp
        run: echo "version=local-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

# The evidence behind `lifecycleConformanceVersion`.
#
# A platform is not "native" because the code compiles for it. `compatibility.ts`
# treats an empty conformance version as expired, so a platform stays refused
# until these scenarios have actually run there — against a real pack, a real
# supervisor, a real bridge and the real vendor CLI, with a mock upstream
# standing in only for Anthropic.
#
# Five native targets cover platform-specific process supervision and delivery.
#
# Every leg that passes writes a CONFORMANCE EVIDENCE record (this commit's
# Inspector layer digest × the pack it ran × the target) and uploads it as a
# `conformance-evidence-*` artifact. A release requires one for every pack it
# may select (`check-local-harness-release.mjs --evidence`).
#
# On a pull request only Linux x64 runs, and it runs THIS PR's layer against
# the PINNED published pack: nothing has to be published for it to pass, so a
# bridge change can never deadlock on a pack only main can publish. Which legs
# run where is `scripts/plan-local-harness-conformance.mjs`.
name: Local harness conformance

on:
  push:
    branches: [main]
    paths:
      - "mcpjam-inspector/server/utils/harness/**"
      - "mcpjam-inspector/scripts/*local-harness*"
      - "mcpjam-inspector/tools/mcpjam-job-launcher/**"
      - ".github/workflows/local-harness-*.yml"
      - "package-lock.json"
  workflow_call:
    inputs:
      published_pack_version:
        description: Verify and run a pinned published pack instead of building one.
        required: false
        type: string
        default: ""
      pack_version:
        description: Pack version to build and run against.
        required: false
        type: string
        default: conformance
      codex_published_pack_version:
        description: Verify and run a pinned published Codex pack instead of building one.
        required: false
        type: string
        default: ""
      harnesses:
        description: Comma-separated harnesses whose legs run (default both).
        required: false
        type: string
        default: "claude-code,codex"
      candidate:
        description: >-
          The named version is a pack the publication pipeline has just
          published and not yet pinned. It is accepted when its signed manifest
          names this checkout's own pack inputs fingerprint (see
          `prepare-published-harness-conformance.mjs --candidate`).
        required: false
        type: boolean
        default: false
    outputs:
      conformance_version:
        description: The identifier to stamp into `lifecycleConformanceVersion`.
        value: ${{ jobs.summarize.outputs.conformance_version }}
      codex_conformance_version:
        description: The identifier to stamp into Codex's `lifecycleConformanceVersion`.
        value: ${{ jobs.codex-summarize.outputs.conformance_version }}
  workflow_dispatch:
    inputs:
      published_pack_version:
        description: Pinned published version to verify (empty builds source).
        required: false
        type: string
        default: ""
      codex_published_pack_version:
        description: Pinned published Codex pack version to verify (empty builds source).
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - "mcpjam-inspector/server/utils/harness/local/**"
      - "mcpjam-inspector/server/utils/harness/claude-code-bootstrap.ts"
      - "mcpjam-inspector/server/utils/harness/codex-appserver/**"
      - "mcpjam-inspector/scripts/local-harness-pack-recipes/**"
      - "mcpjam-inspector/scripts/bundle-codex-appserver-bridge.mjs"
      - "mcpjam-inspector/server/utils/harness/auto-approve-harness.ts"
      - "mcpjam-inspector/server/utils/harness/registry.ts"
      - "mcpjam-inspector/package.json"
      - "package-lock.json"
      - "mcpjam-inspector/scripts/*local-harness*"
      - ".github/workflows/local-harness-pack.yml"
      # The launcher is part of the foundation Windows conformance rests on,
      # and this is the only workflow that compiles it. Left out of the filter,
      # a PR that changed nothing but the launcher was never built or tested
      # anywhere before it merged.
      - "mcpjam-inspector/tools/mcpjam-job-launcher/**"
      - ".github/workflows/local-harness-conformance.yml"

concurrency:
  # The versions AND the harness selection: a release calls this twice (its
  # desired packs, then its permitted ones), and the two must not cancel each
  # other.
  group: local-harness-conformance-${{ github.ref }}-${{ inputs.published_pack_version }}-${{ inputs.codex_published_pack_version }}-${{ inputs.harnesses }}-${{ inputs.candidate }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hold every mock upstream response briefly. An instant in-process upstream
  # is not a neutral simplification: it hid a gateway defect for four runs by
  # always answering inside the window where the gateway was tearing its own
  # upstream request down, so the suite went green locally and 502'd on a
  # loaded runner. A slow-enough upstream makes that class of race
  # deterministic instead of dependent on how busy the machine is. The whole
  # cost is a few seconds across a run.
  MOCK_LATENCY_MS: "50"

jobs:
  plan:
    name: plan legs
    runs-on: ubuntu-latest
    outputs:
      claude_pack_version: ${{ steps.plan.outputs.claude_pack_version }}
      codex_pack_version: ${{ steps.plan.outputs.codex_pack_version }}
      run_claude: ${{ steps.plan.outputs.run_claude }}
      run_codex: ${{ steps.plan.outputs.run_codex }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      posix_matrix: ${{ steps.plan.outputs.posix_matrix }}
      codex_matrix: ${{ steps.plan.outputs.codex_matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          CLAUDE_INPUT: ${{ inputs.published_pack_version }}
          CODEX_INPUT: ${{ inputs.codex_published_pack_version }}
          HARNESSES: ${{ inputs.harnesses }}
        run: node mcpjam-inspector/scripts/plan-local-harness-conformance.mjs >> "$GITHUB_OUTPUT"

  unit:
    name: foundation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      # From the REPO ROOT: this is an npm workspace, so dependencies install
      # and hoist there. Installing inside the package produces a second,
      # partial tree and the adapter ends up in neither place the build looks.
      - name: Install workspace dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps
      # Advisory, as in lint.yml: merging publishes the pack a moved
      # fingerprint describes. The release gate is where it must match.
      - name: Report pack input fingerprints
        run: node mcpjam-inspector/scripts/check-local-harness-inputs.mjs --advisory

      # From `mcpjam-inspector/`, not the worktree root: the root breaks the
      # `@/shared` path alias and the suite fails for a reason that has nothing
      # to do with the code under test.
      - name: Build shared contracts and adapter fixtures
        run: npm run pretest -w @mcpjam/inspector

      - name: Verify source conformance setup
        run: node --test mcpjam-inspector/scripts/__tests__/prepare-source-harness-conformance.test.mjs

      - name: Run the local harness suite
        working-directory: mcpjam-inspector
        run: npx vitest run server/utils/harness/local

  scenarios:
    name: ${{ matrix.label }}
    needs: [unit, plan]
    if: needs.plan.outputs.run_claude == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.posix_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      # 10, not 9: the adapter's recipe carries a `pnpm-workspace.yaml` whose
      # only key is `allowBuilds` — pnpm 10 syntax, and what permits the vendor
      # SDK's extract script to run. pnpm 9 reads the same file and fails with
      # "packages field missing or empty".
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      # From the REPO ROOT: this is an npm workspace, so dependencies install
      # and hoist there. Installing inside the package produces a second,
      # partial tree and the adapter ends up in neither place the build looks.
      - name: Install workspace dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps

      - name: Download the bundled Node runtime
        run: |
          set -euo pipefail
          url="https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/node-v${BUNDLED_NODE_VERSION}-${{ matrix.node_dist }}.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/node-runtime.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/SHASUMS256.txt" -o "$RUNNER_TEMP/node-shasums.txt"
          expected=$(awk -v name="node-v${BUNDLED_NODE_VERSION}-${{ matrix.node_dist }}.tar.gz" '$2 == name {print $1}' "$RUNNER_TEMP/node-shasums.txt")
          test -n "$expected"
          actual=$(shasum -a 256 "$RUNNER_TEMP/node-runtime.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"

      # The real thing, not a fixture: these scenarios exist to prove the pack
      # a user would install actually runs.
      - name: Prepare the pinned published pack
        if: needs.plan.outputs.claude_pack_version != ''
        working-directory: mcpjam-inspector
        env:
          PACK_VERSION: ${{ needs.plan.outputs.claude_pack_version }}
          CANDIDATE: ${{ inputs.candidate && '--candidate' || '' }}
        run: node scripts/prepare-published-harness-conformance.mjs "$PACK_VERSION" "${{ matrix.platform_key || 'win32-x64' }}" "$RUNNER_TEMP/conformance" claude-code $CANDIDATE

      - name: Build the pack
        if: needs.plan.outputs.claude_pack_version == ''
        working-directory: mcpjam-inspector
        run: |
          node scripts/build-local-harness-pack.mjs \
            --platform ${{ matrix.platform_key }} \
            --pack-version "${{ inputs.pack_version || 'conformance' }}" \
            --node-tarball "$RUNNER_TEMP/node-runtime.tar.gz" \
            --out "$RUNNER_TEMP/conformance/runtime-src" \
            --skip-archive
          mkdir -p "$RUNNER_TEMP/conformance/runtime"
          cp -R "$RUNNER_TEMP/conformance/runtime-src/claude-code" \
            "$RUNNER_TEMP/conformance/runtime/claude-code"
          node scripts/prepare-source-harness-conformance.mjs \
            "$RUNNER_TEMP/conformance" claude-code "${{ matrix.platform_key }}" \
            "${{ inputs.pack_version || 'conformance' }}"

      - name: Build Inspector adapter dependencies
        run: |
          npm run build:sdk -w @mcpjam/inspector
          npm run pretest -w @mcpjam/inspector

      - name: Full turn
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          mkdir -p "$HOME" "$CONFORMANCE_ROOT/workspace"
          npx tsx server/utils/harness/local/conformance/run-native-turn.ts full

      - name: Attended Tool Approval off
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-native-turn.ts attended-off

      - name: Workspace and MCP delivery
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: npx tsx server/utils/harness/local/conformance/run-native-turn.ts delivery

      # The negative that makes the loopback guarantee enforceable rather than
      # aspirational: a pack whose launcher does not constrain the listener must
      # be REFUSED by the exposure probe, not admitted because we shipped a
      # launcher that usually does.
      - name: A pack without the loopback launcher is refused
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-native-turn.ts no-launcher

      - name: Abort takes the vendor CLI down with the bridge
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-lifecycle.ts abort

      - name: A crashed Inspector's tree is reclaimed
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          npx tsx server/utils/harness/local/conformance/run-lifecycle.ts orphan-a
          npx tsx server/utils/harness/local/conformance/run-lifecycle.ts orphan-b

      # Budgets, not benchmarks. The exposure probe used to take 11 s on a
      # laptop with ten link-local addresses, inside a 1.5 s session-start
      # budget; these fail if that comes back.
      - name: Probe and digest budgets
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: |
          npx tsx server/utils/harness/local/conformance/probe-timing.mts
          npx tsx server/utils/harness/local/conformance/timing-decomp.mts

      - name: The group snapshot settles a tree whose root exited first
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: npx tsx server/utils/harness/local/conformance/group-settle.mts

      # A conformance run that leaves a process behind has not demonstrated the
      # thing it exists to demonstrate, whatever its scenarios printed.
      - name: No supervised process survived the run
        if: always()
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: |
          set -euo pipefail
          # Matched on the PACK PATH, not on `launcher.mjs|bridge.mjs`.
          # `pgrep -f` matches the full command line, so a bare script name
          # also matches the shell running this very check — a red job with no
          # survivor, which is the worst kind of failing check because nobody
          # can reproduce it. Only a real supervised process has the pack root
          # as its argv[0], and this shell is excluded explicitly on top.
          survivors=""
          for pid in $(pgrep -f "$CONFORMANCE_ROOT/runtime/claude-code/" || true); do
            case "$pid" in "$$" | "$PPID") continue ;; esac
            cmd="$(ps -o command= -p "$pid" 2>/dev/null || true)"
            case "$cmd" in "" | *pgrep*) continue ;; esac
            survivors="$survivors $pid"
          done
          if [ -n "$survivors" ]; then
            echo "supervised processes survived the conformance run:$survivors" >&2
            ps -o pid=,command= -p $survivors || true
            exit 1
          fi

      # Written only when every step above passed: this commit's layer ran on
      # this pack on this target. A release requires one per selected pack.
      - name: Record conformance evidence
        working-directory: mcpjam-inspector
        shell: bash
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          PACK_VERSION: ${{ needs.plan.outputs.claude_pack_version }}
        run: |
          set -euo pipefail
          published=()
          if [ -n "$PACK_VERSION" ]; then
            published=(--published "$CONFORMANCE_ROOT/published-conformance-input.json")
          fi
          node scripts/write-conformance-evidence.mjs \
            --harness claude-code --target "${{ matrix.platform_key }}" \
            --runtime "$CONFORMANCE_ROOT/runtime/claude-code" \
            --out "$CONFORMANCE_ROOT/evidence" "${published[@]}" \
            --scenarios "full,attended-off,delivery,no-launcher,abort,orphan"

      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-claude-code-${{ matrix.platform_key }}-${{ needs.plan.outputs.claude_pack_version || 'source' }}
          path: ${{ runner.temp }}/conformance/evidence/*.json
          if-no-files-found: error

      - name: Preserve verified published-pack identity
        if: needs.plan.outputs.claude_pack_version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Versioned: a release (and the publication pipeline) calls this
          # workflow twice in one run, and artifact names are run-wide.
          name: published-pack-claude-code-${{ matrix.platform_key }}-${{ needs.plan.outputs.claude_pack_version }}
          path: ${{ runner.temp }}/conformance/published-conformance-input.json
          if-no-files-found: error

  # Windows. Gating, like the POSIX legs, since `nativePlatforms` lists win32:
  # this job going green is what earned that entry, and it going red is what
  # would make the entry a lie. The two are the SAME change and must move
  # together — `continue-on-error` does not come back without `win32` leaving
  # the manifest.
  #
  # What it proves that the POSIX legs cannot: whole-tree cleanup through a
  # Job Object rather than a process group, a FILETIME birth identity read
  # through PowerShell, the launcher's stdin lifeline, and the adapter's POSIX
  # path composition surviving contact with a drive letter.
  windows:
    name: windows-latest scenarios
    needs: [unit, plan]
    if: needs.plan.outputs.run_windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      # 10, not 9: the adapter's recipe carries a `pnpm-workspace.yaml` whose
      # only key is `allowBuilds` — pnpm 10 syntax, and what permits the vendor
      # SDK's extract script to run. pnpm 9 reads the same file and fails with
      # "packages field missing or empty".
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      # From the REPO ROOT: this is an npm workspace, so dependencies install
      # and hoist there. Installing inside the package produces a second,
      # partial tree and the adapter ends up in neither place the build looks.
      - name: Install workspace dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps

      # The Job Object launcher is what whole-tree cleanup rests on here, so a
      # conformance run without it is not testing Windows support — it is
      # testing that Windows is refused, which the unit suite already covers.
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache-dependency-path: mcpjam-inspector/tools/mcpjam-job-launcher/go.sum

      - name: Build the Job Object launcher
        working-directory: mcpjam-inspector/tools/mcpjam-job-launcher
        run: go build -trimpath -buildvcs=false -ldflags="-s -w" -o "$RUNNER_TEMP/mcpjam-job-launcher.exe" .

      # The launcher's unit tests, on the only runner that can run them: the
      # code is `syscall.SysProcAttr` and `golang.org/x/sys/windows`, so it
      # does not compile anywhere else. They cover which child the launcher
      # will agree to start — a containment check that ran nowhere in CI until
      # this step existed, and one whose failure mode is silent acceptance of
      # a program outside the verified pack.
      - name: Test the Job Object launcher
        working-directory: mcpjam-inspector/tools/mcpjam-job-launcher
        run: |
          go vet ./...
          go test ./...

      - name: Download the bundled Node runtime
        run: |
          set -euo pipefail
          archive="node-v${BUNDLED_NODE_VERSION}-win-x64.zip"
          curl -fsSL "https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/${archive}" \
            -o "$RUNNER_TEMP/node-runtime.zip"
          curl -fsSL "https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/SHASUMS256.txt" -o "$RUNNER_TEMP/node-shasums.txt"
          expected=$(awk -v name="$archive" '$2 == name {print $1}' "$RUNNER_TEMP/node-shasums.txt")
          test -n "$expected"
          actual=$(sha256sum < "$RUNNER_TEMP/node-runtime.zip" | awk '{print $1}')
          test "$actual" = "$expected"

      - name: Prepare the pinned published pack
        if: needs.plan.outputs.claude_pack_version != ''
        working-directory: mcpjam-inspector
        env:
          PACK_VERSION: ${{ needs.plan.outputs.claude_pack_version }}
          CANDIDATE: ${{ inputs.candidate && '--candidate' || '' }}
        run: node scripts/prepare-published-harness-conformance.mjs "$PACK_VERSION" "${{ matrix.platform_key || 'win32-x64' }}" "$RUNNER_TEMP/conformance" claude-code $CANDIDATE

      - name: Build the pack
        if: needs.plan.outputs.claude_pack_version == ''
        working-directory: mcpjam-inspector
        run: |
          node scripts/build-local-harness-pack.mjs \
            --platform win32-x64 \
            --pack-version "${{ inputs.pack_version || 'conformance' }}" \
            --node-tarball "$RUNNER_TEMP/node-runtime.zip" \
            --job-launcher "$RUNNER_TEMP/mcpjam-job-launcher.exe" \
            --out "$RUNNER_TEMP/conformance/runtime-src" \
            --skip-archive
          mkdir -p "$RUNNER_TEMP/conformance/runtime"
          cp -R "$RUNNER_TEMP/conformance/runtime-src/claude-code" \
            "$RUNNER_TEMP/conformance/runtime/claude-code"
          node scripts/prepare-source-harness-conformance.mjs \
            "$RUNNER_TEMP/conformance" claude-code "win32-x64" \
            "${{ inputs.pack_version || 'conformance' }}"

      - name: Build Inspector adapter dependencies
        run: |
          npm run build:sdk -w @mcpjam/inspector
          npm run pretest -w @mcpjam/inspector

      - name: Full turn
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          mkdir -p "$CONFORMANCE_ROOT/home" "$CONFORMANCE_ROOT/workspace"
          HOME="$CONFORMANCE_ROOT/home" \
            npx tsx server/utils/harness/local/conformance/run-native-turn.ts full

      - name: Attended Tool Approval off
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          HOME="$CONFORMANCE_ROOT/home" \
            npx tsx server/utils/harness/local/conformance/run-native-turn.ts attended-off

      - name: Workspace and MCP delivery
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          HOME="$CONFORMANCE_ROOT/home" \
            npx tsx server/utils/harness/local/conformance/run-native-turn.ts delivery

      # The one that matters on Windows: aborting must take the vendor binary
      # down with the bridge. That is the whole reason the Job Object exists,
      # and the reason `taskkill /T` was not enough.
      - name: Abort takes the vendor CLI down with the bridge
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          HOME="$CONFORMANCE_ROOT/home" \
            npx tsx server/utils/harness/local/conformance/run-lifecycle.ts abort

      # Asserted here too, not just printed. The POSIX legs fail on a
      # survivor; a Windows step that only echoed `tasklist` could report a
      # clean run over a live agent, which is the outcome this whole suite
      # exists to make impossible.
      #
      # Matched on the pack path rather than `node.exe`: the runner has its own
      # Node processes, and failing on those would be a red job with no
      # survivor.
      - name: No supervised process survived the run
        if: always()
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: |
          set -euo pipefail
          root="$(cygpath -w "$CONFORMANCE_ROOT/runtime/claude-code" 2>/dev/null || echo "$CONFORMANCE_ROOT/runtime/claude-code")"
          # The QUERY's own failure is a failure. `wmic ... || true` turned a
          # process table nobody could read into an empty survivor list, so the
          # step reported a clean run without having looked at a single
          # process — the exact shape of green-means-nothing this check exists
          # to prevent.
          #
          # PowerShell/CIM rather than `wmic`: wmic is gone from current
          # windows-latest images, so the query itself failed and this step
          # correctly reported that it had proved nothing — correct, and
          # useless. `Get-CimInstance Win32_Process` is the supported way to
          # read a command line.
          if ! process_table="$(powershell -NoProfile -NonInteractive -Command 'Get-CimInstance Win32_Process | ForEach-Object { "{0} {1}" -f $_.ProcessId, $_.CommandLine }' 2>/dev/null)"; then
            echo "could not read the Windows process table, so this check proved nothing" >&2
            exit 1
          fi
          survivors="$(printf '%s\n' "$process_table" | grep -F "$root" || true)"
          echo "${survivors:-(no supervised process)}"
          if [ -n "$survivors" ]; then
            echo "supervised processes survived the conformance run" >&2
            exit 1
          fi

      # Written only when every step above passed: this commit's layer ran on
      # this pack on this target. A release requires one per selected pack.
      - name: Record conformance evidence
        working-directory: mcpjam-inspector
        shell: bash
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          PACK_VERSION: ${{ needs.plan.outputs.claude_pack_version }}
        run: |
          set -euo pipefail
          published=()
          if [ -n "$PACK_VERSION" ]; then
            published=(--published "$CONFORMANCE_ROOT/published-conformance-input.json")
          fi
          node scripts/write-conformance-evidence.mjs \
            --harness claude-code --target "win32-x64" \
            --runtime "$CONFORMANCE_ROOT/runtime/claude-code" \
            --out "$CONFORMANCE_ROOT/evidence" "${published[@]}" \
            --scenarios "full,attended-off,delivery,abort"

      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-claude-code-win32-x64-${{ needs.plan.outputs.claude_pack_version || 'source' }}
          path: ${{ runner.temp }}/conformance/evidence/*.json
          if-no-files-found: error

      - name: Preserve verified published-pack identity
        if: needs.plan.outputs.claude_pack_version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-pack-claude-code-win32-x64-${{ needs.plan.outputs.claude_pack_version }}
          path: ${{ runner.temp }}/conformance/published-conformance-input.json
          if-no-files-found: error

  # Local Codex: its own pack (MCPJam's app-server bridge + the pinned
  # `@openai/codex` platform binary), its own adapter and its own sandbox
  # claims, so its own legs — against a mock OpenAI Responses upstream behind
  # the same loopback gateway. Only the model is fake.
  #
  # D8: the targets Codex's manifest certifies (`nativeTargets`) block; the
  # others run so their evidence stays visible without holding up a certified
  # target's release. Windows has no leg: it is not a Codex native target, and
  # its sandbox (`windowsSandbox/setupStart`) has no evidence yet.
  codex-scenarios:
    name: codex ${{ matrix.platform_key }}
    needs: [unit, plan]
    if: needs.plan.outputs.run_codex == 'true'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.certified }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.codex_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pack toolchain pins
        id: toolchain
        run: node mcpjam-inspector/scripts/read-local-harness-toolchain.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Install workspace dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps

      - name: Download the bundled Node runtime
        run: |
          set -euo pipefail
          url="https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/node-v${BUNDLED_NODE_VERSION}-${{ matrix.node_dist }}.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/node-runtime.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/SHASUMS256.txt" -o "$RUNNER_TEMP/node-shasums.txt"
          expected=$(awk -v name="node-v${BUNDLED_NODE_VERSION}-${{ matrix.node_dist }}.tar.gz" '$2 == name {print $1}' "$RUNNER_TEMP/node-shasums.txt")
          test -n "$expected"
          actual=$(shasum -a 256 "$RUNNER_TEMP/node-runtime.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"

      - name: Prepare the pinned published Codex pack
        if: needs.plan.outputs.codex_pack_version != ''
        working-directory: mcpjam-inspector
        env:
          PACK_VERSION: ${{ needs.plan.outputs.codex_pack_version }}
          CANDIDATE: ${{ inputs.candidate && '--candidate' || '' }}
        run: node scripts/prepare-published-harness-conformance.mjs "$PACK_VERSION" "${{ matrix.platform_key }}" "$RUNNER_TEMP/conformance" codex $CANDIDATE

      # Vendor bytes only: the recipe installs `@openai/codex` from the frozen
      # bootstrap lockfile and checks every file of the platform package
      # against `codex-vendor-checksums.json`. The bridge is this checkout's
      # Inspector layer, written next to the pack when the session resolves.
      - name: Build the Codex pack
        if: needs.plan.outputs.codex_pack_version == ''
        working-directory: mcpjam-inspector
        run: |
          node scripts/build-local-harness-pack.mjs \
            --harness codex \
            --platform ${{ matrix.platform_key }} \
            --pack-version "${{ inputs.pack_version || 'conformance' }}" \
            --node-tarball "$RUNNER_TEMP/node-runtime.tar.gz" \
            --out "$RUNNER_TEMP/conformance/runtime-src" \
            --skip-archive
          mkdir -p "$RUNNER_TEMP/conformance/runtime"
          cp -R "$RUNNER_TEMP/conformance/runtime-src/codex" \
            "$RUNNER_TEMP/conformance/runtime/codex"
          node scripts/prepare-source-harness-conformance.mjs \
            "$RUNNER_TEMP/conformance" codex "${{ matrix.platform_key }}" \
            "${{ inputs.pack_version || 'conformance' }}"

      - name: Build Inspector adapter dependencies
        run: |
          npm run build:sdk -w @mcpjam/inspector
          npm run pretest -w @mcpjam/inspector

      # Playground profile: a command pauses for approval and runs only once
      # approved; a host-executed MCP tool runs through MCPJam's relay; the
      # thread survives detach + resume; Stop leaves nothing behind.
      - name: Attended turn
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: |
          mkdir -p "$HOME"
          npx tsx server/utils/harness/local/conformance/run-codex-turn.ts attended

      - name: Attended turn with Tool Approval off
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-codex-turn.ts attended-off

      # Eval/swarm profile (D2): `allow-all` inside Codex's command sandbox.
      # EVIDENCE, not yet a gate: no target is recorded in
      # `unattendedSandboxTargets`, and a runner where the sandbox cannot start
      # (Ubuntu 24.04's AppArmor user-namespace restriction blocks bubblewrap)
      # is exactly what this leg exists to surface. A target is recorded only
      # after this passes on it; until then unattended local Codex is refused
      # there.
      - name: Unattended sandboxed turn (evidence)
        id: unattended
        continue-on-error: true
        working-directory: mcpjam-inspector
        env:
          HOME: ${{ runner.temp }}/conformance/home
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          MCPJAM_LOCAL_HARNESS_CONFORMANCE_VERSION: ${{ github.sha }}
        run: npx tsx server/utils/harness/local/conformance/run-codex-turn.ts unattended

      - name: Record the unattended outcome
        if: always()
        env:
          OUTCOME: ${{ steps.unattended.outcome }}
        run: |
          echo "### Codex unattended sandbox on ${{ matrix.platform_key }}: ${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"

      - name: No supervised process survived the run
        if: always()
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
        run: |
          set -euo pipefail
          survivors=""
          for pid in $(pgrep -f "$CONFORMANCE_ROOT/runtime/codex/" || true); do
            case "$pid" in "$$" | "$PPID") continue ;; esac
            cmd="$(ps -o command= -p "$pid" 2>/dev/null || true)"
            case "$cmd" in "" | *pgrep*) continue ;; esac
            survivors="$survivors $pid"
          done
          if [ -n "$survivors" ]; then
            echo "supervised processes survived the Codex conformance run:$survivors" >&2
            ps -o pid=,command= -p $survivors || true
            exit 1
          fi

      - name: Record conformance evidence
        working-directory: mcpjam-inspector
        env:
          CONFORMANCE_ROOT: ${{ runner.temp }}/conformance
          PACK_VERSION: ${{ needs.plan.outputs.codex_pack_version }}
        run: |
          set -euo pipefail
          published=()
          if [ -n "$PACK_VERSION" ]; then
            published=(--published "$CONFORMANCE_ROOT/published-conformance-input.json")
          fi
          node scripts/write-conformance-evidence.mjs \
            --harness codex --target "${{ matrix.platform_key }}" \
            --runtime "$CONFORMANCE_ROOT/runtime/codex" \
            --out "$CONFORMANCE_ROOT/evidence" "${published[@]}" \
            --scenarios attended,attended-off

      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence-codex-${{ matrix.platform_key }}-${{ needs.plan.outputs.codex_pack_version || 'source' }}
          path: ${{ runner.temp }}/conformance/evidence/*.json
          if-no-files-found: error

  summarize:
    name: conformance version
    # A conformance version records the evidence behind EVERY platform the
    # manifest calls native. Windows is one of them now, so its leg holds up
    # the stamp exactly as the POSIX legs do: a version minted without it
    # would certify a platform whose scenarios had not run.
    needs: [scenarios, windows, plan]
    runs-on: ubuntu-latest
    outputs:
      conformance_version: ${{ steps.stamp.outputs.version }}
    steps:
      # The value the record carries. It names the RUN that produced the
      # evidence, so a recorded conformance version can always be traced back to
      # the scenarios that justified it.
      - id: stamp
        env:
          PUBLISHED_PACK_VERSION: ${{ needs.plan.outputs.claude_pack_version }}
        run: |
          if [ -n "$PUBLISHED_PACK_VERSION" ]; then
            echo "version=published-${PUBLISHED_PACK_VERSION}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "version=local-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  # Codex's own stamp, from Codex's own legs only. A Codex failure must not
  # withhold Claude Code's version, nor a Claude Code failure Codex's: each
  # harness's evidence certifies that harness alone (D4).
  codex-summarize:
    name: codex conformance version
    needs: [codex-scenarios, plan]
    runs-on: ubuntu-latest
    outputs:
      conformance_version: ${{ steps.stamp.outputs.version }}
    steps:
      - id: stamp
        env:
          PUBLISHED_PACK_VERSION: ${{ needs.plan.outputs.codex_pack_version }}
        run: |
          if [ -n "$PUBLISHED_PACK_VERSION" ]; then
            echo "version=published-codex-${PUBLISHED_PACK_VERSION}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "version=local-codex-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

name: PR Size

# Counts changed lines of hand-written source (scripts/slop/pr-size.mjs).
# Over 400 asks for `large-pr`; over 1,500 fails unless labelled `mechanical`.
# `labeled` / `unlabeled` re-run it when a label changes the verdict.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Judges the PR's diff and labels, which the queue's merge commit lacks. The
  # verdict on the PR stands; in the queue the job is skipped, which satisfies
  # the required check.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: PR Size
    if: github.event_name == 'pull_request'
    # Blacksmith, not GitHub's shared 60-job pool; this job holds no secret or
    # write token. TEST_RUNNER=ubuntu-latest moves it back during an outage.
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Count hand-written changed lines
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/slop/pr-size.mjs --base HEAD^1

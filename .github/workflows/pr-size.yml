name: PR Size

# Counts changed lines of hand-written source (scripts/slop/pr-size.mjs).
# Over 400 asks for `large-pr`; over 1,500 fails unless labelled `mechanical`.
# `labeled` / `unlabeled` re-run it when a label changes the verdict.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: PR Size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/github-script@v9
        id: pull
        with:
          script: |
            const { resolvePull } = require('./.github/scripts/pr-policy.cjs');
            return await resolvePull(github, context);

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Count hand-written changed lines
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
          PR_LABELS: ${{ toJSON(fromJSON(steps.pull.outputs.result).labels.*.name) }}
        run: node scripts/slop/pr-size.mjs --base "$BASE_SHA"

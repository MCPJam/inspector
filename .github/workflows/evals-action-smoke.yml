name: Evals action live smoke

on:
  workflow_dispatch:
    inputs:
      project:
        description: Existing MCPJam project name or ID
        required: true
        type: string
      suite:
        description: Existing hosted suite to run (uses eval credits)
        required: true
        type: string
      verify-published-cli:
        description: Require the newly published CLI when it belongs to the tracked major
        type: boolean
        default: false
      gate:
        description: Also evaluate gates
        type: boolean
        default: false
  # Called by `release.yml` to gate publishing `evals-v1`. Same inputs, so the
  # release and a manual dispatch exercise one path.
  workflow_call:
    inputs:
      project:
        description: Existing MCPJam project name or ID
        required: true
        type: string
      suite:
        description: Existing hosted suite to run (uses eval credits)
        required: true
        type: string
      verify-published-cli:
        description: Require the newly published CLI when it belongs to the tracked major
        type: boolean
        default: false
      gate:
        description: Also evaluate gates
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Resolve the CLI release to smoke
        id: cli
        env:
          VERIFY_PUBLISHED_CLI: ${{ inputs.verify-published-cli }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { resolveSmokeCliVersion } from "./actions/evals/cli-release-smoke.mjs";
          const expected = process.env.VERIFY_PUBLISHED_CLI === "true"
            ? JSON.parse(readFileSync("cli/package.json", "utf8")).version : undefined;
          const version = await resolveSmokeCliVersion("6", expected);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          process.stdout.write(`Smoke testing MCPJam CLI ${version}\n`);
          NODE
      - name: Test the action helpers
        run: node --test actions/evals/*.test.mjs
      # Before the credits, not after: a release that forgot the repo variables
      # would otherwise start a real eval run against an empty project name.
      - name: Require the smoke inputs and the API key
        env:
          PROJECT: ${{ inputs.project }}
          SUITE: ${{ inputs.suite }}
          API_KEY: ${{ secrets.MCPJAM_API_KEY }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$SUITE" ]; then
            echo "::error::project and suite are required. A release passes vars.EVALS_SMOKE_PROJECT and vars.EVALS_SMOKE_SUITE."
            exit 1
          fi
          if [ -z "$API_KEY" ]; then
            echo "::error::Set the MCPJAM_API_KEY secret before running the live smoke."
            exit 1
          fi
      - name: Run hosted suite with the local action
        uses: ./actions/evals
        with:
          # Set this secret before manually starting the live smoke test.
          api-key: ${{ secrets.MCPJAM_API_KEY }}
          cli-version: ${{ steps.cli.outputs.version }}
          project: ${{ inputs.project }}
          suite: ${{ inputs.suite }}
          gate: ${{ inputs.gate }}

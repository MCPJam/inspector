name: Build and Test

on:
  # Run on every PR regardless of its base branch. See the note in test.yml:
  # `branches` filters on the PR's BASE, so a stacked PR — based on the branch
  # below it until that one merges — never matched `main` and was never built
  # or linted.
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes in-flight runs obsolete — cancel them
# so superseded runs don't keep burning a runner. Matters more now that this
# workflow runs on every PR rather than only main-based ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"
  # This workflow typechecks, builds, and boots the server in Node — it never
  # launches Electron, so skip the (occasionally flaky) Electron binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify Docker workspace dependency manifests
        run: node --test .github/scripts/docker-workspaces.test.mjs

      - name: Verify MCP deploy workflow path filters
        run: node --test .github/scripts/mcp-workflow-paths.test.mjs

      # The scripts behind prepare-release.yml, release-trigger.yml and
      # release.yml's plan. Release itself runs rarely, so this is where a
      # break shows up first.
      - name: Release script tests
        run: |
          node --test \
            .github/scripts/unpublished-versions.test.mjs \
            .github/scripts/release-plan.test.mjs \
            .github/scripts/release-pr.test.mjs \
            .github/scripts/release-trigger.test.mjs \
            .github/scripts/local-harness-bot-pr.test.mjs \
            .github/scripts/check-workos-loopback.test.mjs

      # Same node_modules cache as test.yml's jobs — the rationale lives on the
      # `test` job there. Different key prefix: this job runs on a bare
      # ubuntu-latest rather than the Playwright container, and the tree carries
      # prebuilt native artifacts that should not be shared across the two.
      - name: Cache workspace node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
            mcpjam-inspector/*/node_modules
          key: nm-bare-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install workspace dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Verify DESIGN.md and mirrored token surfaces are in sync
        run: npm run design:check

      - name: Lint DESIGN.md against the pinned spec
        run: npm run design:lint

      # Advisory: a moved fingerprint on a PR is what the next release will
      # publish, not a defect. Starting that release (`prepare-release.yml`)
      # builds the pack and pins it in the version PR, so this only says which
      # harness moves (in the job summary). The release gate is still strict.
      - name: Report local runtime input fingerprints
        run: node mcpjam-inspector/scripts/check-local-harness-inputs.mjs --advisory

      # No `check-local-harness-release.mjs --assets` here. It compares the
      # PUBLISHED packs with this checkout, and packs publish only from main,
      # so a PR that changes a pack input could never pass it and had to merge
      # red. It also downloaded every pinned pack (~1.1 GB) on every PR. The
      # published-asset check runs where it can be satisfied: before a release
      # is versioned (prepare-release.yml) and before it publishes (release.yml).

      - name: Typecheck releasable packages
        run: npm run typecheck

      - name: Typecheck inspector client
        run: npm run typecheck:client -w @mcpjam/inspector

      - name: Build inspector package
        run: npm run build:inspector

      - name: Test production start
        shell: bash
        run: |
          EXIT_CODE=0
          timeout 10s npm run start -w @mcpjam/inspector || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "Inspector started successfully (timed out as expected)"
            exit 0
          fi
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Inspector started successfully"
            exit 0
          fi
          echo "Inspector failed to start with exit code $EXIT_CODE"
          exit "$EXIT_CODE"

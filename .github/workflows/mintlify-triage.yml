name: Mintlify PR Triage

# Auto-triages documentation PRs opened by the Mintlify bot. A Claude classifier
# verifies each PR against the actual code, then takes exactly ONE action:
#   - MERGE (enable auto-merge; it lands only after CI passes) when it can
#     positively confirm the docs are accurate, user-facing, and apply cleanly.
#   - CLOSE in every other case — stale / backend-internal / inaccurate /
#     duplicate, or anything it cannot confidently verify (bias to close).
# Replaces the previous "auto-merge every bot PR" workflow.

on:
  pull_request:
    types: [opened]

concurrency:
  group: mintlify-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Gate on the PR author, not github.actor (which is spoofable and is the
    # human, not the bot, on reopen).
    if: github.event.pull_request.user.login == 'mintlify[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # enable auto-merge
      pull-requests: write # close / comment
      id-token: write # claude-code-action auth
      actions: read # read CI status

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # full file tree (code + docs) so feature greps work
          persist-credentials: false # job has write perms; Claude uses gh, not git auth

      - name: Classify and act
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # This workflow only ever fires for mintlify[bot] PRs (see the job
          # `if` gate above), and claude-code-action refuses bot-initiated runs
          # unless the bot is allowlisted. Without this line every triage run
          # fails at startup — which is how the July 2026 backlog of 130
          # untriaged docs PRs accumulated. Scoped to the one bot; not `*`.
          allowed_bots: mintlify
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-sonnet-4-6
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr comment:*),Bash(git grep:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Grep,Glob,Read"
          prompt: |
            You are the documentation-PR triager for ${{ github.repository }}. PR #${{ github.event.pull_request.number }} was opened by the Mintlify docs bot. Decide and execute EXACTLY ONE outcome: MERGE or CLOSE. Bias toward CLOSE — only MERGE when you can positively verify the PR is good. Everything published must be user-facing, accurate, and free of backend/internal detail. Do not ask questions; take the action yourself with the gh CLI.

            Investigate first (read-only):
            - Diff + metadata: `gh pr diff ${{ github.event.pull_request.number }}` and `gh pr view ${{ github.event.pull_request.number }} --json files,mergeable,mergeStateStatus,title,body`. A non-mergeable / conflicting PR usually means it targets a page that was renamed or deleted (stale).
            - Confirm any feature the PR documents actually exists in the code: `git grep -i "<symbol or exact UI string>" -- mcpjam-inspector/ sdk/ cli/`. If you cannot find it, treat the feature as non-existent.
            - Check whether the content is already documented: `git grep -i "<phrase>" -- docs/`.

            MERGE only if you can confirm ALL of: the PR is mergeable; every target page still exists; the feature is present in the code; the content is user-facing and accurate; and it is not a duplicate or editing anything under `docs/contributing/**`.

            CLOSE in every other case — stale (deleted/renamed page or not mergeable); backend/internal content (Convex, internal HTTP endpoints/routes, environment variables, secrets/keys, server-side persistence or runtime, internal source-file paths); a feature you cannot find in the code; a duplicate; a clear factual error versus the code; OR anything you are not confident enough to merge. Closing is safe and cheap — the bot regenerates a fresh PR when the code changes again.

            Execute exactly one, then stop:
            - MERGE → `gh pr merge ${{ github.event.pull_request.number }} --auto --squash`
            - CLOSE → `gh pr close ${{ github.event.pull_request.number }} --comment "<one concise sentence on why>"`

            Keep the comment to a single sentence.

      # Assert the classifier actually reached a decision, and complete the
      # MERGE half of it.
      #
      # The prompt above mandates EXACTLY ONE outcome: auto-merge queued, or
      # the PR closed. Anything else means the classifier never ran to a
      # decision — and that failure is silent by default: claude-code-action
      # exits 0 when it soft-skips (e.g. its workflow-validation guard fires
      # because this file on the PR's merge ref differs from the default
      # branch, which happens to every in-flight bot PR whenever this workflow
      # is edited). Without the else-branch below, that soft-skip reported a
      # green `triage` check having triaged nothing — strictly worse than a
      # red X, because neither a human nor the shepherd can tell it apart from
      # a real decision. A no-outcome run must be loud.
      #
      # The approval is the second half of the MERGE action, not a general
      # bypass: the main ruleset requires 1 approving review, and this runs
      # only in this workflow (job-gated to mintlify[bot] PRs), only on the
      # classifier's positive verification. Posted by github-actions[bot],
      # never the PR author. Explicitly authorized by the repo owner
      # (2026-07-14) to unblock the docs-PR pipeline after the July backlog.
      - name: Enforce a triage outcome (and approve on MERGE)
        # Not success(): a soft-skipped classifier exits 0, and a hard failure
        # should still say why. Not always(): `cancel-in-progress` above means
        # superseded runs get cancelled, and a cancelled run has legitimately
        # reached no outcome — failing it would just add noise.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          queued=$(jq -r '.auto_merge != null' <<<"$pr")
          merged=$(jq -r '.merged' <<<"$pr")
          state=$(jq -r '.state' <<<"$pr")

          if [ "$queued" = "true" ]; then
            gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
              -f event=APPROVE \
              -f body="Auto-approved: the Mintlify triage classifier verified this docs-only PR against the code and queued it for merge." >/dev/null
            echo "Outcome: MERGE — auto-merge queued and approved."
          elif [ "$merged" = "true" ]; then
            echo "Outcome: MERGE — already landed; nothing to approve."
          elif [ "$state" = "closed" ]; then
            echo "Outcome: CLOSE — classifier rejected the PR."
          else
            echo "::error title=Triage reached no outcome::PR #$PR is still open with no auto-merge queued, so the classifier never decided MERGE or CLOSE. Check the 'Classify and act' step: a soft-skip there exits 0 and would otherwise report this check green. If it logged a workflow-validation skip, this file differs from the default branch — re-run once it matches."
            exit 1
          fi

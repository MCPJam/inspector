name: Docker Release

# Publishes the self-hosted Inspector image, mcpjam/mcp-inspector on Docker
# Hub, at the Inspector version `main` carries. release.yml calls it twice:
# `stage: build` while its gates run, which pushes each architecture's image
# by digest with no tag naming it, and `stage: publish` once npm has the
# version, which tags those digests. Dispatching it by hand does both, and is
# the retry path and the way to push the current version without cutting a
# release.
#
# Same Dockerfile Railway builds the hosted app from, but without hosted settings:
# without VITE_MCPJAM_HOSTED_MODE the bundle is the local Inspector, the one
# `npx @mcpjam/inspector` runs.
on:
  workflow_call:
    inputs:
      sha:
        description: "The commit the release publishes to npm"
        required: true
        type: string
      stage:
        description: "build (push by digest), publish (tag the digests this run pushed), or all"
        required: false
        type: string
        default: all
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
  workflow_dispatch:

# Every release must get its tags, so pending runs wait in line instead of
# replacing each other.
concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  DOCKER_REPOSITORY: mcpjam/mcp-inspector

jobs:
  prepare:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Enforce main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "docker-release.yml must run from the main branch" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mcpjam-inspector/package.json
          sparse-checkout-cone-mode: false

      - name: Read the Inspector version
        id: version
        run: echo "version=$(jq -r .version mcpjam-inspector/package.json)" >> "$GITHUB_OUTPUT"

      # The image must hold the code npm got for this version. A release
      # passes the commit it published from. A dispatch builds the commit the
      # `v<version>` tag names, not whatever `main` has merged since; the tag
      # exists only once that version is on npm, so a dispatch between a
      # version PR merging and its release finishing stops here.
      - name: Resolve the release commit
        id: commit
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha="$RELEASE_SHA"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)"
          fi
          if [ -z "$sha" ]; then
            echo "::error::Tag v$VERSION does not exist yet, so its release has not finished. Re-run the Docker job from that release run instead." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # One native runner per architecture: under QEMU the arm64 build (npm ci,
  # the client bundle, Chromium) takes several times longer.
  build:
    needs: prepare
    if: inputs.stage != 'publish'
    name: Build ${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # The build context is the whole checkout and this image is public;
          # keep the token out of .git/config.
          persist-credentials: false

      - name: Stamp the build time
        run: node .github/scripts/stamp-mcpjam-build-time.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The shared Dockerfile must also work on Railway, whose Docker builder
      # rejects secret mounts. Keep the token in an ephemeral container's
      # environment instead; the final build reuses this exact server stage.
      - name: Build server source-map stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./mcpjam-inspector/Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: server-build
          load: true
          build-args: |
            MCPJAM_BUILD_SURFACE=local
          tags: mcpjam-server-sourcemaps:local

      - name: Upload server source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm --env SENTRY_AUTH_TOKEN --entrypoint node \
            mcpjam-server-sourcemaps:local mcpjam-inspector/scripts/server-sourcemaps.mjs

      # By digest: no tag names the image until `publish` adds them, so a
      # release can build it before npm has the version without anyone being
      # able to pull that version early.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./mcpjam-inspector/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.DOCKER_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          # A public repository defaults to mode=max, which records build-arg
          # values in an attestation published next to the image.
          provenance: mode=min
          build-args: |
            MCPJAM_BUILD_SURFACE=local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Record the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error

  # The tags users pull. The multi-arch ones are written only after both
  # builds pushed, so `latest` never names a single-arch image. In a release
  # this runs as its own call, after `build` in an earlier one of the same run,
  # whose digests reach it as artifacts.
  publish:
    needs: [prepare, build]
    if: |
      !cancelled() &&
      inputs.stage != 'build' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || (inputs.stage == 'publish' && needs.build.result == 'skipped'))
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect the image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # `latest` follows npm's `latest` dist-tag, so re-running an older
      # release's Docker job refreshes its own tag without moving `latest`
      # back, and a prerelease never becomes `latest`.
      - name: Create the tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          amd64="$(cat "$RUNNER_TEMP/digests/amd64")"
          arm64="$(cat "$RUNNER_TEMP/digests/arm64")"
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not an image digest: $digest"; exit 1; }
          done
          docker buildx imagetools create --tag "$DOCKER_REPOSITORY:v$VERSION-amd64" "$DOCKER_REPOSITORY@$amd64"
          docker buildx imagetools create --tag "$DOCKER_REPOSITORY:v$VERSION-arm64" "$DOCKER_REPOSITORY@$arm64"
          tags=("$DOCKER_REPOSITORY:v$VERSION")
          skipped=""
          npm_latest="$(npm view @mcpjam/inspector dist-tags.latest)"
          if [ "$npm_latest" = "$VERSION" ]; then
            tags+=("$DOCKER_REPOSITORY:latest")
          else
            skipped="latest not moved: npm latest is $npm_latest, not $VERSION."
            echo "::notice::$skipped"
          fi
          tag_flags=()
          for tag in "${tags[@]}"; do tag_flags+=(--tag "$tag"); done
          docker buildx imagetools create "${tag_flags[@]}" \
            "$DOCKER_REPOSITORY@$amd64" \
            "$DOCKER_REPOSITORY@$arm64"
          echo "Published ${tags[*]} (linux/amd64, linux/arm64). $skipped" >> "$GITHUB_STEP_SUMMARY"

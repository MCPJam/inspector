name: Adversarial Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - run: node --test scripts/slop/adversarial-review.test.mjs

  review:
    # Forks cannot read the API key. Drafts are reviewed when marked ready.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ${{ vars.TEST_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # Only base-branch code runs with credentials; PR blobs are review data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .reviewer
          sparse-checkout: |
            scripts/slop
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - name: Review this PR with Claude Sonnet 5.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f .reviewer/scripts/slop/adversarial-review.mjs ]; then
            echo "::notice::The reviewer must merge into the base branch before it can review PRs."
            exit 0
          fi
          node .reviewer/scripts/slop/adversarial-review.mjs

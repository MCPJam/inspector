name: Release alerts

# A daily release that fails has to reach a person. release-trigger.yml never
# retries a failed Release (release-trigger.mjs says why), and a failed
# Prepare release or cut leaves no version PR, so either way the day's release
# quietly does not happen. This opens one issue for a run of failures and
# comments on it for each further one; GitHub notifies the repository's
# watchers. Whoever fixes the cause closes it.

on:
  workflow_run:
    workflows: [Daily release cut, Prepare release, Release]
    types: [completed]
    branches: [main]

permissions:
  issues: write

# Two failures finishing together must not open two issues.
concurrency:
  group: release-alerts
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure", "cancelled", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or comment on the release failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = "Release pipeline failed";
            const body = [
              `**${run.display_title}** (${run.name}) ended \`${run.conclusion}\` on \`${run.head_sha}\`.`,
              run.html_url,
              "Nothing retries it. Re-run the failed jobs, or use Run release now in Soundcheck once the cause is fixed, then close this issue.",
            ].join("\n\n");
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", creator: "github-actions[bot]", per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.info(`Commented on #${existing.number}.`);
            } else {
              const { data } = await github.rest.issues.create({ ...context.repo, title, body });
              core.info(`Opened #${data.number}.`);
            }

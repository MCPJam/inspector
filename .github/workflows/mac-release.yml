name: Mac Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version label"
        required: true
        type: string
      apply_release_patch:
        description: "Apply the shared release patch artifact before building"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version label"
        required: false
        type: string
      apply_release_patch:
        description: "Apply release patch artifact from the current run"
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: "24.14.0"

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      ARTIFACT_VERSION: ${{ inputs.version != '' && inputs.version || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release patch
        if: inputs.apply_release_patch == true
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release-plan

      - name: Apply release patch
        if: inputs.apply_release_patch == true
        run: git apply --binary .release-plan/release.patch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Apple certificates and API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 -d > /tmp/AuthKey.p8
          mkdir -p ~/certificates
          echo "${{ secrets.DEVELOPER_ID_APPLICATION_CERT }}" | base64 -d > ~/certificates/developer_id_application.p12

          security create-keychain -p "temp_keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp_keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import ~/certificates/developer_id_application.p12 \
            -k build.keychain \
            -P "${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}" \
            -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: -s -k "temp_keychain_password" build.keychain

          echo "MAC_CODESIGN_IDENTITY=Developer ID Application: Marcelo Jimenez (TLBS4N7QZ3)" >> $GITHUB_ENV
          echo "APPLE_API_KEY_FILE=/tmp/AuthKey.p8" >> $GITHUB_ENV

      - name: Build application
        run: npm run build -w @mcpjam/inspector
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Sentry `dist` for the bundle this job ships. Must match the
          # `--dist` the upload below passes, or the installer's UI reports
          # against artifacts it did not come from.
          MCPJAM_BUILD_SURFACE: desktop-mac

      # ONLY dist/client here. The packaged app serves its UI from
      # dist/client via the embedded Hono server (server/app.ts
      # serveStatic root + forge extraResource), and `npm run build`
      # produces it — so this is both the bundle desktop users execute
      # and the one that exists at this point in the job.
      #
      # The Electron bundles (.vite/build, .vite/renderer) are NOT
      # handled here: @electron-forge/plugin-vite builds them during
      # `electron:make`, so they do not exist yet. Their injection and
      # upload lives in forge.config.ts's `packageAfterCopy` hook, the
      # first point where the built bundles exist and are still
      # editable before asar packing.
      - name: Inject and upload web sourcemaps to Sentry
        continue-on-error: true
        timeout-minutes: 10
        working-directory: mcpjam-inspector
        run: |
          version=$(node -p "require('./package.json').version")

          # Cleanup runs on EVERY exit path, including a sentry-cli
          # failure — `-e` would otherwise skip a trailing delete and
          # `continue-on-error` would still let packaging proceed,
          # shipping full source maps in the installer.
          trap "find dist/client -name '*.map' -type f -delete 2>/dev/null || true" EXIT

          if [ -d dist/client ]; then
            npx @sentry/cli sourcemaps inject dist/client
            npx @sentry/cli sourcemaps upload \
              --release="$version" \
              --dist=desktop-mac \
              --org=mcpjam-gh \
              --project=inspector-client \
              dist/client
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Sign and package application
        run: |
          sudo diskutil unmountDisk force /Volumes/"MCPJam Inspector" 2>/dev/null || true
          hdiutil detach /Volumes/"MCPJam Inspector" -force 2>/dev/null || true

          npm run electron:make -w @mcpjam/inspector

          sudo diskutil unmountDisk force /Volumes/"MCPJam Inspector" 2>/dev/null || true
          hdiutil detach /Volumes/"MCPJam Inspector" -force 2>/dev/null || true
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # Actions injects a secret only into steps that name it. The
          # `.vite/build` + `.vite/renderer` sourcemaps are injected and
          # uploaded by forge.config.ts's `packageAfterCopy` hook, which runs
          # inside THIS step — without the token here the hook silently
          # early-returns and desktop crashes never symbolicate.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # The DMG and the ZIP are independent submissions to the same notary
      # service, and Apple happily processes them concurrently on one API key.
      # Submitting them serially cost ~100s per build for no reason; overlapping
      # them costs the slower of the two (~55s).
      #
      # Each PID is waited on individually and its exit status checked: a bare
      # `wait` returns the status of the LAST job only, which would let a failed
      # notarization sail through into a stapled, shipped artifact.
      - name: Notarize DMG and ZIP
        run: |
          set -euo pipefail

          # `-print -quit` rather than `| head -n1`: under `pipefail`, head
          # closing the pipe early makes find exit 141 (SIGPIPE) and takes the
          # whole step down with it. That race depends on how many files are in
          # out/make, so it would fail intermittently rather than every time.
          DMG_PATH=$(find "$GITHUB_WORKSPACE/mcpjam-inspector/out/make" -name "*.dmg" -print -quit)
          if [ ! -f "$DMG_PATH" ]; then
            echo "DMG file not found" >&2
            exit 1
          fi

          ZIP_PATH=$(find "$GITHUB_WORKSPACE/mcpjam-inspector/out/make" -name "*.zip" -print -quit)
          if [ ! -f "$ZIP_PATH" ]; then
            echo "ZIP file not found" >&2
            exit 1
          fi

          notarize() {
            xcrun notarytool submit "$1" \
              --key /tmp/AuthKey.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
          }

          notarize "$DMG_PATH" > /tmp/notarize-dmg.log 2>&1 &
          dmg_pid=$!
          notarize "$ZIP_PATH" > /tmp/notarize-zip.log 2>&1 &
          zip_pid=$!

          dmg_status=0
          wait "$dmg_pid" || dmg_status=$?
          zip_status=0
          wait "$zip_pid" || zip_status=$?

          echo "--- notarytool (dmg) ---"
          cat /tmp/notarize-dmg.log
          echo "--- notarytool (zip) ---"
          cat /tmp/notarize-zip.log

          if [ "$dmg_status" -ne 0 ]; then
            echo "DMG notarization failed with status $dmg_status" >&2
            exit "$dmg_status"
          fi
          if [ "$zip_status" -ne 0 ]; then
            echo "ZIP notarization failed with status $zip_status" >&2
            exit "$zip_status"
          fi

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          cp "$DMG_PATH" "$GITHUB_WORKSPACE/MCPJam.Inspector.dmg"
          echo "DMG_PATH=$GITHUB_WORKSPACE/MCPJam.Inspector.dmg" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Create stapled app ZIP for auto-updates
        run: |
          cd "$(dirname "$ZIP_PATH")"
          unzip -q "$(basename "$ZIP_PATH")" -d notarized

          APP_PATH=$(find notarized -name "*.app" | head -n1)
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found in ZIP" >&2
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          STAPLED_ZIP="$GITHUB_WORKSPACE/MCPJam Inspector-stapled.zip"
          ditto -c -k --keepParent "$APP_PATH" "$STAPLED_ZIP"
          echo "STAPLED_ZIP=$STAPLED_ZIP" >> $GITHUB_ENV

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f /tmp/AuthKey.p8
          rm -rf ~/certificates
          security delete-keychain build.keychain || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inspector-macos-${{ env.ARTIFACT_VERSION }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.STAPLED_ZIP }}
          retention-days: 14

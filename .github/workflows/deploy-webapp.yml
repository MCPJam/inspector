name: Deploy Webapp

# The hosted inspector's only path to production used to be the promote job
# inside release.yml, which refuses to run unless an inspector changeset is in
# scope. That made "redeploy prod at the current SHA" and "roll back prod to
# the last good SHA" impossible without cutting an npm release — precisely the
# thing you cannot wait on during an incident.
#
# This is that deploy, extracted: dispatchable on its own, and called by
# release.yml so there is exactly ONE code path to production instead of two
# that drift.
#
# Deliberately NOT here: the service-variable refresh that deploy-staging.yml
# does. Staging can rewrite its own origin allowlists because their contents
# are derivable from this file. Production's `ALLOWED_ORIGINS` /
# `WEB_ALLOWED_ORIGINS` are hand-set on the Railway service and their full
# membership is not recorded anywhere in this repo, so writing a guessed value
# on every deploy would trade a rare drift bug for a routine outage. Prod
# carries the same "hand-set vars vanish on rebuild" hazard the staging
# comment describes; closing it needs the real allowlist written down first.
#
# Boolean inputs are compared against BOTH `true` and `'true'`: a
# `workflow_call` caller passes a real boolean, while a manual dispatch of the
# same input can arrive as a string. `if: inputs.flag` alone is the classic
# footgun here — the string 'false' is truthy.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy (defaults to the dispatch ref)"
        required: false
        type: string
      require_staging_green:
        description: "Require a successful Deploy Staging run for the deployed SHA"
        required: false
        default: true
        type: boolean
      run_e2e:
        description: "Run the Playwright suite against production after deploy"
        required: false
        default: false
        type: boolean
      announce:
        description: "Post start and finish to Slack (#engineering)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy (defaults to the caller's SHA)"
        required: false
        type: string
      require_staging_green:
        description: "Require a successful Deploy Staging run for the deployed SHA"
        required: false
        default: true
        type: boolean
      run_e2e:
        description: "Run the Playwright suite against production after deploy"
        required: false
        default: false
        type: boolean
      announce:
        description: "Post start and finish to Slack; release.yml passes false because it posts for itself"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  # The staging gate below lists workflow runs.
  actions: read

concurrency:
  # Never let two production deploys race. `cancel-in-progress: false` because
  # cancelling mid-`railway up` leaves the service half-promoted.
  group: inspector-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For `announce-result`, which posts once `smoke` has finished too.
    outputs:
      announced: ${{ steps.announce.outcome == 'success' || steps.announce.outcome == 'failure' }}
      announced_at: ${{ steps.announce.outputs.at }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL || 'https://app.mcpjam.com' }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_INSPECTOR_SERVICE: ${{ vars.RAILWAY_INSPECTOR_SERVICE }}
      RAILWAY_PRODUCTION_ENVIRONMENT: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # `railway up` uploads the working tree, so the deployed code is whatever
      # this checkout resolved to. Record the SHA explicitly: it is what the
      # staging gate below asks about and the only thing that tells an operator
      # reading this run months later what actually shipped.
      - name: Resolve deployed SHA
        id: resolved
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA (ref: ${{ inputs.ref || github.sha }})"

      # A deploy started on its own, usually a rollback during an incident,
      # posts to #engineering like a hand-started backend deploy. A release
      # passes `announce: false` because it posts for itself: `event_name`
      # can't tell the two apart, since a called workflow sees the caller's.
      - name: Announce the deploy in Slack
        id: announce
        if: ${{ inputs.announce == true || inputs.announce == 'true' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYS_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ steps.resolved.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_DEPLOYS_WEBHOOK_URL is not set, so this deploy was not announced."
            exit 0
          fi
          commit="<$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$DEPLOY_SHA|${DEPLOY_SHA:0:9}>"
          text="🚀 Webapp → prod started by $GITHUB_TRIGGERING_ACTOR · $commit · <$RUN_URL|run>"
          # `-f`: a 4xx/5xx from Slack must fail this step, not claim delivery.
          # The webhook URL is a credential too, so curl reads it from a config
          # file (mktemp: mode 0600) rather than from its command line.
          cfg="$(mktemp)"
          trap 'rm -f "$cfg"' EXIT
          printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" > "$cfg"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS --max-time 20 --retry 2 -X POST -H 'Content-Type: application/json' \
                -d @- -K "$cfg"

      - name: Require green staging run for the deployed SHA
        if: ${{ inputs.require_staging_green == true || inputs.require_staging_green == 'true' }}
        uses: actions/github-script@v9
        env:
          DEPLOY_SHA: ${{ steps.resolved.outputs.sha }}
        with:
          script: |
            const workflowId = "deploy-staging.yml";
            const { owner, repo } = context.repo;
            const headSha = process.env.DEPLOY_SHA;
            // Fetch without branch/status filters — GitHub's search index
            // can lag minutes behind, causing false negatives on recent runs.
            // JS-side filtering on head_sha + conclusion is authoritative.
            //
            // Paged with an early exit rather than github.paginate(), which
            // walks every historical run of the workflow before filtering.
            // Runs come back newest-first, so the match is nearly always on
            // page 1. The page cap bounds the miss case — note a rollback to a
            // SHA older than that window should pass require_staging_green=false,
            // which is already the documented rollback path.
            const iterator = github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: workflowId, per_page: 100 }
            );

            let matchingRun = null;
            let pages = 0;
            for await (const { data: runs } of iterator) {
              matchingRun = runs.find(
                (run) => run.head_sha === headSha && run.conclusion === "success"
              );
              if (matchingRun || ++pages >= 5) break;
            }

            if (!matchingRun) {
              core.setFailed(
                `No successful ${workflowId} run found for ${headSha}. Deploy that SHA to staging first, or re-run with require_staging_green=false if you are rolling back to a SHA that predates the staging workflow.`
              );
              return;
            }

            core.info(`Found successful staging deploy run ${matchingRun.id} for ${headSha}.`);

      # Pinned to match deploy-staging.yml and pr-preview.yml. An unpinned
      # install picks up whatever shipped that morning, on the one workflow
      # where a CLI regression is most expensive.
      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.57.1

      # Capture the newest deployment id before we trigger a new one so the
      # wait step below can tell *our* deploy from the previous-good one.
      - name: Snapshot latest deployment id
        id: previous_deploy
        run: |
          PREV=$(.github/scripts/railway-wait-deploy.sh --latest \
            -s "$RAILWAY_INSPECTOR_SERVICE" \
            -e "$RAILWAY_PRODUCTION_ENVIRONMENT")
          echo "id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous deployment: ${PREV:-<none>}"

      # The public host comparison uses this build-local value as MCPJam's
      # verification date. Shared with the npm and desktop release workflows —
      # see the script for why every user-facing bundle has to write it.
      #
      # Those workflows check out their own SHA, so the script is always in the
      # tree. This one checks out `inputs.ref`, and a rollback points that at an
      # older commit that can predate the script — a step that fails only during
      # a rollback fails at the worst possible moment. Fall back to stamping
      # inline, which is the script's write minus the path resolution. Keep the
      # two in sync; the script's header says so too.
      - name: Stamp web deployment time
        run: |
          STAMP_SCRIPT=.github/scripts/stamp-mcpjam-build-time.mjs
          if [ -f "$STAMP_SCRIPT" ]; then
            node "$STAMP_SCRIPT"
            exit 0
          fi
          echo "::notice::$STAMP_SCRIPT is not in the deployed ref; stamping inline"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const deployedAt = Date.now();
            writeFileSync(
              "mcpjam-inspector/client/src/generated/mcpjam-web-deployed-at.ts",
              `// Generated by deploy-webapp.yml. Do not edit.\nexport const MCPJAM_WEB_DEPLOYED_AT: number | null = ${deployedAt};\n`,
            );
          '

      # `--detach` uploads and returns immediately. See railway-wait-deploy.sh
      # for why `--ci`'s build-log stream is not a usable success signal.
      - name: Deploy inspector to Railway production
        id: railway_up
        run: |
          # Where the Axiom band starts: production starts changing here.
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          .github/scripts/railway-retry.sh railway up \
            --detach \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" \
            --service "$RAILWAY_INSPECTOR_SERVICE"

      - name: Wait for Railway production deploy to finish
        timeout-minutes: 20
        env:
          PREVIOUS_DEPLOY_ID: ${{ steps.previous_deploy.outputs.id }}
        run: |
          .github/scripts/railway-wait-deploy.sh \
            -s "$RAILWAY_INSPECTOR_SERVICE" \
            -e "$RAILWAY_PRODUCTION_ENVIRONMENT" \
            -p "$PREVIOUS_DEPLOY_ID"

      - name: Summarize deploy
        env:
          DEPLOY_SHA: ${{ steps.resolved.outputs.sha }}
          APP_URL: ${{ vars.PRODUCTION_APP_URL || 'https://app.mcpjam.com' }}
          PREVIOUS_DEPLOY_ID: ${{ steps.previous_deploy.outputs.id }}
        run: |
          {
            echo "## 🚀 Webapp deployed to production"
            echo ""
            echo "- SHA: \`$DEPLOY_SHA\`"
            echo "- Target: \`$APP_URL\`"
            echo "- Previous Railway deployment: \`${PREVIOUS_DEPLOY_ID:-<none>}\` (roll back by re-running this workflow with that deployment's SHA)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The deploy window as an Axiom annotation, drawn on every chart over
      # these datasets, so an error or latency spike right after a deploy lines
      # up with a marker. Releases and rollbacks both come through here. The
      # token needs only "create annotations"; without it nothing is marked.
      - name: Mark the deploy window in Axiom
        if: always() && steps.railway_up.outcome != 'skipped'
        continue-on-error: true
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_ANNOTATIONS_TOKEN }}
          DATASETS: ${{ vars.AXIOM_DEPLOY_DATASETS || 'inspector-logs,inspector-clean-v1' }}
          STARTED_AT: ${{ steps.railway_up.outputs.started_at }}
          DEPLOY_SHA: ${{ steps.resolved.outputs.sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${AXIOM_TOKEN:-}" ]; then
            echo "::warning::AXIOM_ANNOTATIONS_TOKEN is not set, so this deploy is not marked in Axiom."
            exit 0
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The header goes through a file (mktemp: mode 0600, printf: a builtin)
          # so the token never appears in a process's command line.
          auth="$(mktemp)"
          trap 'rm -f "$auth"' EXIT
          printf 'Authorization: Bearer %s\n' "$AXIOM_TOKEN" > "$auth"
          # Names are trimmed: "a, b" must not ask Axiom for a dataset " b".
          jq -n --arg datasets "$DATASETS" --arg time "${STARTED_AT:-$now}" --arg end "$now" \
            --arg description "${DEPLOY_SHA:0:9} by $GITHUB_TRIGGERING_ACTOR, $STATUS" --arg url "$RUN_URL" \
            '{datasets: ($datasets | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))),
              type: "deploy", title: "Webapp prod deploy",
              time: $time, endTime: $end, description: $description, url: $url}' \
            | curl -fsS --max-time 20 --retry 2 -o /dev/null -X POST https://api.axiom.co/v2/annotations \
                -H @"$auth" -H 'Content-Type: application/json' -d @-

  smoke:
    needs: deploy
    uses: ./.github/workflows/post-deploy-smoke.yml
    with:
      base_url: ${{ vars.PRODUCTION_APP_URL || 'https://app.mcpjam.com' }}
      label: production
      run_e2e: ${{ inputs.run_e2e == true || inputs.run_e2e == 'true' }}

  # How a deploy started on its own ended, posted after `smoke` so "done" means
  # production passed its smoke check too, and a smoke failure is announced.
  # Only after a start post, so a release's own webapp deploy stays quiet.
  announce-result:
    needs: [deploy, smoke]
    if: always() && needs.deploy.outputs.announced == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Announce the result in Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYS_WEBHOOK_URL }}
          STARTED: ${{ needs.deploy.outputs.announced_at }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || exit 0
          mins=$(( ( $(date -u +%s) - ${STARTED:-$(date -u +%s)} ) / 60 ))
          if [ "$DEPLOY" = cancelled ] || [ "$SMOKE" = cancelled ]; then
            text="⚪ Webapp → prod cancelled (${mins}m) · <$RUN_URL|run>"
          elif [ "$DEPLOY" != success ]; then
            text="❌ Webapp → prod failed (${mins}m) · <$RUN_URL|run>"
          elif [ "$SMOKE" != success ]; then
            text="❌ Webapp → prod deployed, but the production smoke check failed (${mins}m) · <$RUN_URL|run>"
          else
            text="✅ Webapp → prod done, smoke check passed (${mins}m) · <$RUN_URL|run>"
          fi
          # The webhook URL is a credential too, so curl reads it from a config
          # file (mktemp: mode 0600) rather than from its command line.
          cfg="$(mktemp)"
          trap 'rm -f "$cfg"' EXIT
          printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" > "$cfg"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS --max-time 20 --retry 2 -X POST -H 'Content-Type: application/json' \
                -d @- -K "$cfg"

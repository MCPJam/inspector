name: Release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which release surface to publish"
        required: true
        default: full
        type: choice
        options:
          - packages-only
          - inspector-only
          - full
      deploy_backend_prod:
        description: "Dispatch backend production deployment"
        required: false
        default: false
        type: boolean
      deploy_webapp:
        description: "Deploy the webapp to production after publish"
        required: false
        default: false
        type: boolean
      skip_verify:
        description: "Skip the green-CI (Tests + Build and Test) preflight gates"
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: "24.14.0"

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish_any: ${{ steps.plan.outputs.publish_any }}
      publish_sdk: ${{ steps.plan.outputs.publish_sdk }}
      publish_cli: ${{ steps.plan.outputs.publish_cli }}
      publish_inspector: ${{ steps.plan.outputs.publish_inspector }}
      build_inspector_artifacts: ${{ steps.plan.outputs.build_inspector_artifacts }}
      inspector_version: ${{ steps.plan.outputs.inspector_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - name: Enforce main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "release.yml must run from main" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # This used to be `npm run verify` (typecheck && test && build:inspector),
      # a serial ~5-8 min re-run of work `test.yml` and `lint.yml` already did
      # on this exact commit when it landed on main — and it built the SDK three
      # times over. Gating on those workflows' results instead takes seconds and
      # covers strictly more: `lint.yml` runs typecheck, typecheck:client,
      # build:inspector and a production boot; `test.yml` runs the suites.
      # BOTH are required — neither alone covers what `verify` did.
      - name: Require green CI for candidate SHA
        if: ${{ !fromJSON(inputs.skip_verify) }}
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch without branch/status filters — GitHub's search index can
            // lag minutes behind, causing false negatives on recent runs.
            // JS-side filtering on head_sha + conclusion is authoritative.
            //
            // Paged with an early exit rather than github.paginate(): that
            // helper walks EVERY historical run before filtering, which cost
            // ~67s in this job and grows with repo age. Runs come back
            // newest-first, so a match is nearly always on page 1; the page cap
            // bounds the miss case at roughly a month of main pushes.
            const findGreenRun = async (workflowId) => {
              const iterator = github.paginate.iterator(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  per_page: 100,
                }
              );
              let pages = 0;
              for await (const { data: runs } of iterator) {
                const match = runs.find(
                  (run) => run.head_sha === context.sha && run.conclusion === "success"
                );
                if (match) return match;
                if (++pages >= 5) break;
              }
              return null;
            };

            for (const workflowId of ["test.yml", "lint.yml"]) {
              const run = await findGreenRun(workflowId);

              if (!run) {
                core.setFailed(
                  `No successful ${workflowId} run found for ${context.sha}. ` +
                    `That workflow runs on every push to main, so this usually means ` +
                    `it is still running, failed, or was cancelled because a newer ` +
                    `commit superseded this one. Re-run it for this SHA, or release ` +
                    `the newer HEAD.`
                );
                return;
              }

              core.info(`Found successful ${workflowId} run ${run.id} for ${context.sha}.`);
            }

      - name: Require green staging smoke for candidate SHA
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = "deploy-staging.yml";
            const { owner, repo } = context.repo;
            const headSha = context.sha;
            // Fetch without branch/status filters — GitHub's search index
            // can lag minutes behind, causing false negatives on recent runs.
            // JS-side filtering on head_sha + conclusion is authoritative.
            // Paged with an early exit (see the CI gate above for why).
            const iterator = github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: workflowId, per_page: 100 }
            );

            let matchingRun = null;
            let pages = 0;
            for await (const { data: runs } of iterator) {
              matchingRun = runs.find(
                (run) => run.head_sha === headSha && run.conclusion === "success"
              );
              if (matchingRun || ++pages >= 5) break;
            }

            if (!matchingRun) {
              core.setFailed(
                `No successful ${workflowId} run found for ${headSha}. Deploy the candidate SHA to staging and wait for the staging deploy + smoke workflow first.`
              );
              return;
            }

            core.info(`Found successful staging deploy run ${matchingRun.id} for ${headSha}.`);

      - name: Compute changeset release plan
        run: npx changeset status --output=.changeset/status.json

      - name: Select release scope
        id: plan
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
          DEPLOY_BACKEND_PROD: ${{ inputs.deploy_backend_prod }}
          DEPLOY_WEBAPP: ${{ inputs.deploy_webapp }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const status = JSON.parse(fs.readFileSync(".changeset/status.json", "utf8"));
          const releases = new Map(
            (status.releases || []).map((release) => [release.name, release])
          );
          const scope = process.env.RELEASE_SCOPE;

          const changed = {
            sdk: releases.has("@mcpjam/sdk"),
            cli: releases.has("@mcpjam/cli"),
            inspector: releases.has("@mcpjam/inspector"),
          };

          let selected = { ...changed };
          if (scope === "packages-only") {
            if (changed.inspector) {
              throw new Error(
                'scope="packages-only" cannot be used while @mcpjam/inspector has pending changesets.'
              );
            }
            selected.inspector = false;
          } else if (scope === "inspector-only") {
            if (changed.sdk || changed.cli) {
              throw new Error(
                'scope="inspector-only" cannot be used while sdk or cli have pending changesets.'
              );
            }
            selected.sdk = false;
            selected.cli = false;
          } else if (scope !== "full") {
            throw new Error(`Unsupported release scope: ${scope}`);
          }

          if (!selected.sdk && !selected.cli && !selected.inspector) {
            throw new Error(
              `Scope "${scope}" does not include any unpublished changesets.`
            );
          }

          if (
            process.env.DEPLOY_BACKEND_PROD === "true" &&
            scope !== "full"
          ) {
            throw new Error(
              "deploy_backend_prod=true is only supported with scope=full."
            );
          }

          if (
            process.env.DEPLOY_WEBAPP === "true" &&
            !selected.inspector
          ) {
            throw new Error(
              "deploy_webapp=true requires an inspector release in the selected scope. To deploy production without cutting a release, dispatch deploy-webapp.yml directly."
            );
          }

          const inspectorVersion =
            releases.get("@mcpjam/inspector")?.newVersion ?? "";
          const outputs = {
            scope,
            publish_any: String(selected.sdk || selected.cli || selected.inspector),
            publish_sdk: String(selected.sdk),
            publish_cli: String(selected.cli),
            publish_inspector: String(selected.inspector),
            build_inspector_artifacts: String(selected.inspector),
            inspector_version: inspectorVersion,
            release_tag: inspectorVersion ? `v${inspectorVersion}` : "",
          };

          const outputFile = process.env.GITHUB_OUTPUT;
          for (const [key, value] of Object.entries(outputs)) {
            fs.appendFileSync(outputFile, `${key}=${value}\n`);
          }
          NODE

      - name: Version packages with Changesets
        run: npx changeset version

      - name: Refresh root lockfile
        run: npm install --package-lock-only --legacy-peer-deps

      - name: Create release patch
        run: git diff --binary > release.patch

      - name: Upload release plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: |
            .changeset/status.json
            release.patch
          retention-days: 7

  build-mac:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
    uses: ./.github/workflows/mac-release.yml
    with:
      version: ${{ needs.preflight.outputs.inspector_version }}
      apply_release_patch: true
    secrets: inherit

  build-windows:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
    uses: ./.github/workflows/windows-release.yml
    with:
      version: ${{ needs.preflight.outputs.inspector_version }}
      apply_release_patch: true
    secrets: inherit

  artifact-gate:
    needs:
      - preflight
      - build-mac
      - build-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require desktop artifact jobs when inspector is included
        run: |
          if [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "Preflight failed." >&2
            exit 1
          fi

          if [ "${{ needs.preflight.outputs.build_inspector_artifacts }}" != "true" ]; then
            exit 0
          fi

          if [ "${{ needs.build-mac.result }}" != "success" ]; then
            echo "Mac artifact build failed." >&2
            exit 1
          fi

          if [ "${{ needs.build-windows.result }}" != "success" ]; then
            echo "Windows artifact build failed." >&2
            exit 1
          fi

  # Building and smoke-testing the npm tarballs needs nothing from the desktop
  # builds or the backend deploy, so it runs alongside them instead of behind
  # them. Only the `changeset publish` call itself has to wait for the backend
  # (see publish-packages), and this job moves ~4 min of build + smoke off that
  # gated path.
  build-packages:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.publish_any) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Without the patch this builds the PRE-bump versions, and the tarballs
      # would disagree with what changeset publish then tries to publish.
      - name: Download release patch
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release-plan

      - name: Apply release patch
        run: git apply --binary .release-plan/release.patch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build SDK
        if: |
          fromJSON(needs.preflight.outputs.publish_sdk) ||
          fromJSON(needs.preflight.outputs.publish_cli) ||
          fromJSON(needs.preflight.outputs.publish_inspector)
        run: npm run build -w @mcpjam/sdk

      - name: Build CLI
        if: fromJSON(needs.preflight.outputs.publish_cli)
        run: npm run build -w @mcpjam/cli

      - name: Build Inspector package
        if: fromJSON(needs.preflight.outputs.publish_inspector)
        run: npm run build -w @mcpjam/inspector

      - name: Smoke packed npm packages
        run: node .github/scripts/smoke-packed-npm-packages.mjs
        env:
          PUBLISH_SDK: ${{ needs.preflight.outputs.publish_sdk }}
          PUBLISH_CLI: ${{ needs.preflight.outputs.publish_cli }}
          PUBLISH_INSPECTOR: ${{ needs.preflight.outputs.publish_inspector }}

      # @mcpjam/inspector has no prepublishOnly hook, so the dist that reaches
      # npm is THIS one — publish-packages cannot rebuild it. sdk/cli do rebuild
      # via prepublishOnly; theirs are carried anyway so the publish job can
      # assert it has a complete, already-smoked package set.
      - name: Upload built package dists
        uses: actions/upload-artifact@v4
        with:
          name: npm-dists
          path: |
            sdk/dist
            cli/dist
            mcpjam-inspector/dist
          if-no-files-found: error
          retention-days: 7

  publish-packages:
    needs:
      - preflight
      - artifact-gate
      - build-packages
      - deploy-backend-prod
    # Publishing is gated on the backend deployment because a released client
    # can start sending a new field the moment it lands on npm. Shipping the
    # Convex schema first means the window where a fresh client talks to a
    # backend that does not understand it yet never opens.
    #
    # `always()` is required so a SKIPPED deploy-backend-prod (the common case:
    # deploy_backend_prod=false) does not skip this job — but it also disables
    # normal failed-dependency propagation, so every other need is checked
    # explicitly below. Dropping the build-packages clause would let a failed
    # package build publish.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.artifact-gate.result == 'success' &&
      needs.build-packages.result == 'success' &&
      needs.preflight.outputs.publish_any == 'true' &&
      (
        !fromJSON(inputs.deploy_backend_prod) ||
        needs.deploy-backend-prod.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release patch
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release-plan

      - name: Apply release patch
        run: git apply --binary .release-plan/release.patch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download built package dists
        uses: actions/download-artifact@v4
        with:
          name: npm-dists
          path: .

      # `npm publish` does NOT fail when a `files` entry is missing — it packs a
      # tarball without it. @mcpjam/inspector has no prepublishOnly to rebuild
      # its dist, so a mis-pathed artifact download would silently ship an empty
      # package. Fail here instead.
      - name: Verify package dists are present
        env:
          PUBLISH_SDK: ${{ needs.preflight.outputs.publish_sdk }}
          PUBLISH_CLI: ${{ needs.preflight.outputs.publish_cli }}
          PUBLISH_INSPECTOR: ${{ needs.preflight.outputs.publish_inspector }}
        run: |
          fail() { echo "::error::$1" >&2; exit 1; }

          if [ "$PUBLISH_SDK" = "true" ] || [ "$PUBLISH_CLI" = "true" ] || [ "$PUBLISH_INSPECTOR" = "true" ]; then
            [ -f sdk/dist/index.js ] || fail "sdk/dist is missing from the npm-dists artifact."
          fi

          if [ "$PUBLISH_CLI" = "true" ]; then
            [ -f cli/dist/index.js ] || fail "cli/dist is missing from the npm-dists artifact."
          fi

          if [ "$PUBLISH_INSPECTOR" = "true" ]; then
            [ -f mcpjam-inspector/dist/client/index.html ] \
              || fail "mcpjam-inspector/dist/client is missing — publishing now would ship an inspector with no UI."
          fi

      # NOTE: sdk's `prepublishOnly: npm run build` re-runs during the publish
      # below, overwriting these injected debug ids in the packed tarball. That
      # is a pre-existing bug (it predates this job split) and is tracked
      # separately — the real fix is to inject inside the sdk's own prepack.
      # Left in place so behavior matches what shipped before.
      - name: Inject SDK sourcemap debug ids
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        run: npx @sentry/cli sourcemaps inject ./sdk/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Publish package set
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload SDK sourcemaps
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        continue-on-error: true
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          npx @sentry/cli sourcemaps upload \
            --release="@mcpjam/sdk@${version}" \
            --org=mcpjam-gh \
            --project=mcpjam-sdk \
            ./sdk/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-backend-prod:
    needs:
      - preflight
    # Runs ahead of publish-packages, and now ALONGSIDE the desktop builds
    # rather than behind them — it consumes no build artifact, and waiting cost
    # ~12 min on the critical path of every full release.
    #
    # The tradeoff that buys: a desktop build failing after this job has already
    # promoted the backend leaves prod backend at a newer SHA with no client
    # release. That is the safe direction and the one this pipeline deliberately
    # engineers for everywhere else (it is exactly why publish-packages waits on
    # this job) — a backend that understands more than any shipped client is
    # indistinguishable from an ordinary backend promote between releases.
    #
    # `publish_any` is still required so a run that publishes nothing does not
    # deploy the backend on its own. No scope check is needed here: preflight's
    # plan script already throws on deploy_backend_prod=true with scope != full.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.publish_any == 'true' &&
      fromJSON(inputs.deploy_backend_prod)
    runs-on: ubuntu-latest
    environment: backend-production
    steps:
      - name: Dispatch and wait for backend production deployment
        uses: actions/github-script@v7
        env:
          BACKEND_REPO: ${{ vars.MCPJAM_BACKEND_REPO || 'MCPJam/mcpjam-backend' }}
        with:
          github-token: ${{ secrets.BACKEND_PREVIEW_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = process.env.BACKEND_REPO.split("/");
            const dispatchTime = new Date();
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "inspector_release_promote",
              client_payload: {
                sha: context.sha,
                ref: context.ref,
                scope: "${{ needs.preflight.outputs.scope }}",
                release_tag: "${{ needs.preflight.outputs.release_tag }}",
              },
            });

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 120; attempt += 1) {
              await sleep(15000);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "deploy-production.yml",
                event: "repository_dispatch",
                per_page: 20,
              });

              const matchingRun = data.workflow_runs.find(
                (run) => new Date(run.created_at) >= dispatchTime
              );

              if (!matchingRun) {
                core.info(`No backend production workflow run found yet (attempt ${attempt + 1}/120).`);
                continue;
              }

              core.info(
                `Backend production workflow ${matchingRun.id} is ${matchingRun.status}/${matchingRun.conclusion ?? "pending"}.`
              );

              if (matchingRun.status !== "completed") {
                continue;
              }

              if (matchingRun.conclusion !== "success") {
                core.setFailed(
                  `Backend production deployment failed with conclusion ${matchingRun.conclusion}.`
                );
              }
              return;
            }

            core.setFailed("Timed out waiting for backend production deployment to finish.");

  # The production deploy itself lives in deploy-webapp.yml so it can also be
  # dispatched on its own — a release is not the only reason to ship or roll
  # back the webapp. `require_staging_green` is false here because preflight
  # already gated this exact SHA on a green staging run.
  deploy-webapp:
    needs:
      - preflight
      - publish-packages
      - deploy-backend-prod
    if: |
      always() &&
      fromJSON(inputs.deploy_webapp) &&
      needs.preflight.result == 'success' &&
      needs.publish-packages.result == 'success' &&
      (
        !fromJSON(inputs.deploy_backend_prod) ||
        needs.deploy-backend-prod.result == 'success'
      )
    uses: ./.github/workflows/deploy-webapp.yml
    with:
      apply_release_patch: true
      require_staging_green: false
    secrets: inherit

  # The Slack bot renders the server's envelope, so a release redeploys it
  # ordered AFTER the webapp — it must never ship ahead of the server whose
  # contract it renders. Its own workflow also redeploys it on ordinary main
  # pushes touching its paths; a same-SHA push-triggered run queues behind this
  # one (per-service concurrency group, cancel-in-progress: false) and the
  # duplicate deploy is idempotent.
  #
  # Soundcheck used to sit here too, as "the other Railway satellite". It does
  # not belong: it talks only to api.github.com, never to the inspector server,
  # so the ordering rationale above does not apply to it. It was also the
  # slowest job in this tail (~3.5 min vs ~1 min) and it deployed TWICE per
  # release — once here, then again from finalize's version commit, which
  # touches root package-lock.json, a path in its own push trigger. That push
  # trigger still redeploys it after every release; this job was the redundant
  # half.
  deploy-slack-app:
    needs:
      - preflight
      - deploy-webapp
    if: |
      always() &&
      fromJSON(inputs.deploy_webapp) &&
      needs.deploy-webapp.result == 'success'
    uses: ./.github/workflows/deploy-slack-app.yml
    secrets: inherit

  # These `needs` look like dead weight — the `if` below never required the
  # deploy jobs, and with `always()` this runs even when they fail. They are
  # NOT dead weight, and removing them breaks the satellite ordering invariant:
  #
  # This job pushes the version commit, which touches `package-lock.json` — a
  # path in BOTH satellite workflows' `push:` triggers (soundcheck's included,
  # even though it no longer has a job here). If the push lands while
  # deploy-webapp is still running, those push-triggered runs find the
  # `slack-app` / `soundcheck` concurrency groups free and deploy AHEAD of the
  # server whose contract they render.
  #
  # `deploy-slack-app` is the load-bearing entry: waiting for it means that by
  # the time the push happens, the slack-app group has already been through
  # this release's deploy, so the push-triggered run is an idempotent duplicate
  # landing after. Waiting for `deploy-webapp` covers soundcheck, whose only
  # release-time deploy IS that push-triggered run — the server is live before
  # the push, so it cannot land early.
  #
  # Note this costs nothing when deploy_webapp=false: those jobs are skipped,
  # and `always()` lets this one proceed the moment publish-packages is done.
  finalize:
    needs:
      - preflight
      - publish-packages
      - deploy-backend-prod
      - deploy-webapp
      - deploy-slack-app
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.publish-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Download release patch
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release-plan

      - name: Apply release patch
        run: git apply --binary .release-plan/release.patch

      - name: Setup Node.js for catalog parity heads-up
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for catalog parity heads-up
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        run: npm ci --legacy-peer-deps

      - name: Check SDK host catalog fallback against staging
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        env:
          HOST_CATALOG_PARITY_URL: ${{ vars.STAGING_APP_URL || 'https://staging.mcpjam.com' }}
        run: |
          set +e
          npm run check:host-catalog-fallback:remote -w @mcpjam/sdk
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            {
              echo "## SDK host catalog fallback parity"
              echo ""
              echo "SDK fallback matches the live catalog at \`$HOST_CATALOG_PARITY_URL\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::SDK host catalog fallback did not match the live catalog at $HOST_CATALOG_PARITY_URL. This release will continue; verify backend deploy/seed status before relying on the fallback snapshot."
          {
            echo "## SDK host catalog fallback parity warning"
            echo ""
            echo "The SDK fallback did not match the live catalog at \`$HOST_CATALOG_PARITY_URL\`."
            echo ""
            echo "This warning is non-blocking. Check backend deploy/seed status before relying on the fallback snapshot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore(release): version packages"

      - name: Push release commit
        run: |
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Create and push release tag
        if: needs.preflight.outputs.release_tag != ''
        run: |
          git tag "${{ needs.preflight.outputs.release_tag }}"
          git push origin "${{ needs.preflight.outputs.release_tag }}"

      - name: Download macOS artifacts
        if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
        uses: actions/download-artifact@v4
        with:
          name: inspector-macos-${{ needs.preflight.outputs.inspector_version }}
          path: .release-assets/macos

      - name: Download Windows artifacts
        if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
        uses: actions/download-artifact@v4
        with:
          name: inspector-windows-${{ needs.preflight.outputs.inspector_version }}
          path: .release-assets/windows

      - name: Create GitHub release
        if: needs.preflight.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: Release ${{ needs.preflight.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .release-assets/macos/**
            .release-assets/windows/**

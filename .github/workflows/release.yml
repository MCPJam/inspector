name: Release

# Ships the versions `main` already carries. They arrive through the version PR
# (prepare-release.yml), and release-trigger.yml dispatches this once `main` is
# green with them on it. This run publishes whatever public package version npm
# does not have yet, deploys, tags the commit and publishes the GitHub release.
# It never writes to `main`, whose rulesets take changes only through a
# reviewed pull request. Dispatching it by hand (Soundcheck's "Run release now")
# is the retry path.
run-name: ${{ inputs.versions != '' && format('Release {0}', inputs.versions) || 'Release' }}

on:
  workflow_dispatch:
    inputs:
      deploy_backend_prod:
        description: "Dispatch backend production deployment"
        required: false
        default: false
        type: boolean
      deploy_webapp:
        description: "Deploy the webapp to production after publish"
        required: false
        default: false
        type: boolean
      skip_verify:
        description: "Skip the green-CI (Tests + Build and Test) preflight gates"
        required: false
        default: false
        type: boolean
      # Set by release-trigger.yml only. `versions` names the run, which is
      # how the trigger recognises its own earlier attempt at the same
      # versions; `trigger_sha` is the green commit it saw.
      versions:
        description: "Set by release-trigger.yml: the versions this run ships"
        required: false
        default: ""
        type: string
      trigger_sha:
        description: "Set by release-trigger.yml: the commit it found green"
        required: false
        default: ""
        type: string

# One release at a time. A second dispatch waits, then finds its versions
# already on npm.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  preflight:
    # A trigger dispatch names the commit it found green, but a dispatch can
    # only target `main`, so a push landing in between would run this on a
    # commit nobody checked. Stand down instead: every job below skips, the
    # run ends green without publishing, and the newer commit's own checks
    # trigger the release again.
    if: inputs.trigger_sha == '' || inputs.trigger_sha == github.sha
    runs-on: ubuntu-latest
    outputs:
      publish_any: ${{ steps.plan.outputs.publish_any }}
      publish_evaluators: ${{ steps.plan.outputs.publish_evaluators }}
      publish_sdk: ${{ steps.plan.outputs.publish_sdk }}
      publish_cli: ${{ steps.plan.outputs.publish_cli }}
      publish_inspector: ${{ steps.plan.outputs.publish_inspector }}
      build_inspector_artifacts: ${{ steps.plan.outputs.build_inspector_artifacts }}
      inspector_version: ${{ steps.plan.outputs.inspector_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      scope: ${{ steps.plan.outputs.scope }}
      evals_action_changed: ${{ steps.evals_action.outputs.changed }}
    steps:
      - name: Enforce main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "release.yml must run from main" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The evals GitHub Action ships on its own tags, not on npm, so it has no
      # changeset to read. Compare the folder against what `evals-v1` already
      # points at instead. README-only edits are excluded deliberately: a live
      # smoke spends eval credits, and prose does not change what users run.
      - name: Detect evals action changes since evals-v1
        id: evals_action
        run: |
          git fetch origin '+refs/tags/evals-v1:refs/tags/evals-v1' 2>/dev/null || true
          if ! git rev-parse -q --verify 'refs/tags/evals-v1^{commit}' >/dev/null; then
            echo "evals-v1 is unpublished; this release would be its first."
            changed=true
          elif git diff --quiet evals-v1 HEAD -- actions/evals ':(exclude)actions/evals/README.md'; then
            changed=false
          else
            changed=true
          fi
          echo "actions/evals changed since evals-v1: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # This used to be `npm run verify` (typecheck && test && build:inspector),
      # a serial ~5-8 min re-run of work `test.yml` and `lint.yml` already did
      # on this exact commit when it landed on main — and it built the SDK three
      # times over. Gating on those workflows' results instead takes seconds and
      # covers strictly more: `lint.yml` runs typecheck, typecheck:client,
      # build:inspector and a production boot; `test.yml` runs the suites.
      # BOTH are required — neither alone covers what `verify` did.
      - name: Require green CI for candidate SHA
        if: ${{ !fromJSON(inputs.skip_verify) }}
        uses: actions/github-script@v9
        with:
          script: |
            // Fetch without branch/status filters — GitHub's search index can
            // lag minutes behind, causing false negatives on recent runs.
            // JS-side filtering on head_sha + conclusion is authoritative.
            //
            // Paged with an early exit rather than github.paginate(): that
            // helper walks EVERY historical run before filtering, which cost
            // ~67s in this job and grows with repo age. Runs come back
            // newest-first, so a match is nearly always on page 1; the page cap
            // bounds the miss case at roughly a month of main pushes.
            const findGreenRun = async (workflowId) => {
              const iterator = github.paginate.iterator(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  per_page: 100,
                }
              );
              let pages = 0;
              for await (const { data: runs } of iterator) {
                const match = runs.find(
                  (run) => run.head_sha === context.sha && run.conclusion === "success"
                );
                if (match) return match;
                if (++pages >= 5) break;
              }
              return null;
            };

            for (const workflowId of ["test.yml", "lint.yml"]) {
              const run = await findGreenRun(workflowId);

              if (!run) {
                core.setFailed(
                  `No successful ${workflowId} run found for ${context.sha}. ` +
                    `That workflow runs on every push to main, so this usually means ` +
                    `it is still running, failed, or was cancelled because a newer ` +
                    `commit superseded this one. Re-run it for this SHA, or release ` +
                    `the newer HEAD.`
                );
                return;
              }

              core.info(`Found successful ${workflowId} run ${run.id} for ${context.sha}.`);
            }

      # Behind `skip_verify` alongside the CI gate above: the two answer the
      # same question ("has this SHA been exercised before it ships"), so one
      # bypassable and one not meant an urgent release had no way through
      # without editing this file. Skipping it also skips what
      # `deploy-webapp`'s `require_staging_green: false` relies on, so a
      # skip_verify release that also deploys the webapp ships a SHA no staging
      # run has smoked.
      - name: Require green staging smoke for candidate SHA
        if: ${{ !fromJSON(inputs.skip_verify) }}
        uses: actions/github-script@v9
        with:
          script: |
            const workflowId = "deploy-staging.yml";
            const { owner, repo } = context.repo;
            const headSha = context.sha;
            // Fetch without branch/status filters — GitHub's search index
            // can lag minutes behind, causing false negatives on recent runs.
            // JS-side filtering on head_sha + conclusion is authoritative.
            // Paged with an early exit (see the CI gate above for why).
            const iterator = github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: workflowId, per_page: 100 }
            );

            let matchingRun = null;
            let pages = 0;
            for await (const { data: runs } of iterator) {
              matchingRun = runs.find(
                (run) => run.head_sha === headSha && run.conclusion === "success"
              );
              if (matchingRun || ++pages >= 5) break;
            }

            if (!matchingRun) {
              core.setFailed(
                `No successful ${workflowId} run found for ${headSha}. Deploy the candidate SHA to staging and wait for the staging deploy + smoke workflow first.`
              );
              return;
            }

            core.info(`Found successful staging deploy run ${matchingRun.id} for ${headSha}.`);

      # What ships is what `main` carries: every public package whose committed
      # version npm does not have yet. The version PR put those versions there.
      # Pending changesets belong to the NEXT release and play no part here.
      - name: Compute release plan
        id: plan
        env:
          DEPLOY_WEBAPP: ${{ inputs.deploy_webapp }}
        run: |
          node .github/scripts/unpublished-versions.mjs > "$RUNNER_TEMP/unpublished.json"
          cat "$RUNNER_TEMP/unpublished.json"
          node <<'NODE'
          const fs = require("node:fs");

          const { releases: unpublished } = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/unpublished.json`, "utf8")
          );
          const releases = new Map(unpublished.map((release) => [release.name, release]));

          const selected = {
            evaluators: releases.has("@mcpjam/evaluators"),
            sdk: releases.has("@mcpjam/sdk"),
            cli: releases.has("@mcpjam/cli"),
            inspector: releases.has("@mcpjam/inspector"),
          };

          if (!selected.evaluators && !selected.sdk && !selected.cli && !selected.inspector) {
            throw new Error(
              "Nothing to release: every package version on main is already on npm. " +
                "Start a release from Soundcheck, which opens the version PR, and merge it first."
            );
          }

          if (
            process.env.DEPLOY_WEBAPP === "true" &&
            !selected.inspector
          ) {
            throw new Error(
              "deploy_webapp=true requires an inspector release. To deploy production without cutting a release, dispatch deploy-webapp.yml directly."
            );
          }

          // Only the backend dispatch payload reads this now; the version PR
          // decides what ships.
          const scope = !selected.inspector
            ? "packages-only"
            : selected.evaluators || selected.sdk || selected.cli
              ? "full"
              : "inspector-only";

          const inspectorVersion =
            releases.get("@mcpjam/inspector")?.newVersion ?? "";
          const outputs = {
            scope,
            publish_any: String(selected.evaluators || selected.sdk || selected.cli || selected.inspector),
            publish_evaluators: String(selected.evaluators),
            publish_sdk: String(selected.sdk),
            publish_cli: String(selected.cli),
            publish_inspector: String(selected.inspector),
            build_inspector_artifacts: String(selected.inspector),
            inspector_version: inspectorVersion,
            release_tag: inspectorVersion ? `v${inspectorVersion}` : "",
          };

          const outputFile = process.env.GITHUB_OUTPUT;
          for (const [key, value] of Object.entries(outputs)) {
            fs.appendFileSync(outputFile, `${key}=${value}\n`);
          }
          NODE

      # The local-execution release gate. It refuses a build whose derived
      # OFFER is inconsistent with what it can serve — a platform advertised
      # with no pack digest, or a digest table stamped at a version whose
      # assets this release will not publish. A build that offers local
      # execution nowhere (no conformance evidence recorded) is reported as
      # unshipped rather than failed: that is a consistent dark release, and
      # blocking every release until an unrelated feature lands is noise.
      # Only for a release that actually ships the Inspector: a packages-only
      # release leaves `inspector_version` empty, and the checker rejects an
      # empty `--version` — failing the whole release over a gate that has
      # nothing to check.
      - name: Local harness release consistency
        if: fromJSON(steps.plan.outputs.publish_inspector)
        working-directory: mcpjam-inspector
        env:
          INSPECTOR_VERSION: ${{ steps.plan.outputs.inspector_version }}
        run: node scripts/check-local-harness-release.mjs --version "$INSPECTOR_VERSION" --assets

  build-mac:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
    uses: ./.github/workflows/mac-release.yml
    with:
      version: ${{ needs.preflight.outputs.inspector_version }}
    secrets: inherit

  build-windows:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
    uses: ./.github/workflows/windows-release.yml
    with:
      version: ${{ needs.preflight.outputs.inspector_version }}
    secrets: inherit

  # The evals GitHub Action's release, independent of npm and the app deploys:
  # it ships as a git tag other repos point `uses:` at. Both jobs sit out every
  # release that did not touch `actions/evals`, so the usual release is
  # unchanged. Needs only `preflight` and the smoke — `finalize` and
  # `publish-packages` are skipped for scopes that publish nothing, and the
  # action does not depend on either.
  evals-action-smoke:
    needs: preflight
    # The repo variables are what make the live smoke possible. While they are
    # unset, the smoke SKIPS instead of failing the whole release. Set both
    # variables to turn the gate back on.
    if: >-
      needs.preflight.outputs.evals_action_changed == 'true' &&
      vars.EVALS_SMOKE_PROJECT != '' && vars.EVALS_SMOKE_SUITE != ''
    uses: ./.github/workflows/evals-action-smoke.yml
    with:
      project: ${{ vars.EVALS_SMOKE_PROJECT }}
      suite: ${{ vars.EVALS_SMOKE_SUITE }}
    secrets: inherit

  publish-evals-action:
    needs: [preflight, evals-action-smoke]
    # The smoke is a GATE, not a dependency: a SKIPPED smoke (its repo
    # variables are unset) still lets the tag ship, while a FAILED smoke still
    # holds it back. Without `!cancelled()` a skipped `needs` would skip this
    # job along with it — but that also stops a FAILED `needs` from skipping
    # it, so `preflight` is re-asserted by hand. It must be: the change
    # detection runs before preflight's green-CI gate, so a preflight that
    # fails later still reports `evals_action_changed: true`.
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.evals_action_changed == 'true' &&
      needs.evals-action-smoke.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: evals-action-release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Choose the version tag
        id: tag
        run: |
          git fetch --tags --force origin
          version_tag="$(node actions/evals/release-tags.mjs "$GITHUB_SHA")"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      # Tags the commit the smoke actually ran against: users pinned to
      # `evals-v1` run whatever this tag points at.
      - name: Publish the version tag, then move evals-v1
        env:
          VERSION_TAG: ${{ steps.tag.outputs.version_tag }}
        run: |
          # Never move `evals-v1` backwards. The concurrency group stops two
          # publishers running at once, but not two releases FINISHING out of
          # order: one dispatched at an older commit could otherwise overwrite
          # a newer release and hand every pinned user code that was already
          # superseded.
          if git rev-parse -q --verify 'refs/tags/evals-v1^{commit}' >/dev/null &&
             ! git merge-base --is-ancestor evals-v1 "$GITHUB_SHA"; then
            echo "::error::evals-v1 points at $(git rev-parse evals-v1), which is not an ancestor of $GITHUB_SHA. A newer release already published; re-run this one from the current main."
            exit 1
          fi
          # Immutable tag first. A second run racing this one fails here, on a
          # tag that already exists, before it can move the floating tag.
          if git rev-parse -q --verify "refs/tags/$VERSION_TAG" >/dev/null; then
            echo "$VERSION_TAG already points at this commit; moving evals-v1 to match."
          else
            git tag "$VERSION_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION_TAG"
          fi
          git tag -f evals-v1 "$GITHUB_SHA"
          git push --force origin refs/tags/evals-v1
          echo "Published $VERSION_TAG and moved evals-v1 to $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  artifact-gate:
    needs:
      - preflight
      - build-mac
      - build-windows
    # Not when preflight stood down (see its `if`): there is nothing to gate,
    # and the check below would fail a run that is meant to end green.
    if: always() && needs.preflight.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require desktop artifact jobs when inspector is included
        run: |
          if [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "Preflight failed." >&2
            exit 1
          fi

          if [ "${{ needs.preflight.outputs.build_inspector_artifacts }}" != "true" ]; then
            exit 0
          fi

          if [ "${{ needs.build-mac.result }}" != "success" ]; then
            echo "Mac artifact build failed." >&2
            exit 1
          fi

          if [ "${{ needs.build-windows.result }}" != "success" ]; then
            echo "Windows artifact build failed." >&2
            exit 1
          fi

  # Building and smoke-testing the npm tarballs needs nothing from the desktop
  # builds or the backend deploy, so it runs alongside them instead of behind
  # them. Only the `changeset publish` call itself has to wait for the backend
  # (see publish-packages), and this job moves ~4 min of build + smoke off that
  # gated path.
  build-packages:
    needs: preflight
    if: ${{ fromJSON(needs.preflight.outputs.publish_any) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify evaluator publication ordering
        run: node --test .github/scripts/publish-evaluators-first.test.mjs

      - name: Build evaluators
        run: npm run build -w @mcpjam/evaluators

      - name: Build SDK
        if: |
          fromJSON(needs.preflight.outputs.publish_sdk) ||
          fromJSON(needs.preflight.outputs.publish_cli) ||
          fromJSON(needs.preflight.outputs.publish_inspector)
        run: npm run build -w @mcpjam/sdk

      - name: Build CLI
        if: fromJSON(needs.preflight.outputs.publish_cli)
        run: npm run build -w @mcpjam/cli

      # Without this the tarball's MCPJam host row falls back to the catalog's
      # hand-stamped date, so `npx` shows a "Verified" date that stops moving
      # while app.mcpjam.com's tracks each deploy. Must run before the client
      # build that inlines the constant.
      - name: Stamp inspector build time
        if: fromJSON(needs.preflight.outputs.publish_inspector)
        run: node .github/scripts/stamp-mcpjam-build-time.mjs

      - name: Build Inspector package
        if: fromJSON(needs.preflight.outputs.publish_inspector)
        run: npm run build -w @mcpjam/inspector
        env:
          # This tarball is the bundle every `npx @mcpjam/inspector` user runs,
          # and it reports to Sentry under the app version like every other
          # build. It had no token here, so `sentryVitePlugin` injected debug
          # ids and uploaded nothing, and those events symbolicated against
          # whatever artifacts another build had published for the same
          # release. (The globs were broken too — see client/vite.config.ts —
          # so a token alone would not have been enough.) The upload itself is
          # best-effort: the plugin reports upload failures without failing the
          # build, and Sentry being down must not fail a release. The assert
          # below is what is allowed to.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MCPJAM_BUILD_SURFACE: npm

      # The plugin above treats a sourcemap glob that matched nothing as a
      # warning, which is how 2.47.0 published with its maps still in the
      # tarball and its Sentry frames pointing at another build. Fail here
      # instead. This asserts the maps were PROCESSED, not that Sentry stored
      # them — see the script.
      - name: Assert client source maps were processed
        if: fromJSON(needs.preflight.outputs.publish_inspector)
        run: node .github/scripts/assert-client-sourcemaps-processed.mjs

      - name: Smoke packed npm packages
        run: node .github/scripts/smoke-packed-npm-packages.mjs
        env:
          PUBLISH_EVALUATORS: ${{ needs.preflight.outputs.publish_evaluators }}
          PUBLISH_SDK: ${{ needs.preflight.outputs.publish_sdk }}
          PUBLISH_CLI: ${{ needs.preflight.outputs.publish_cli }}
          PUBLISH_INSPECTOR: ${{ needs.preflight.outputs.publish_inspector }}

      # @mcpjam/inspector has no prepublishOnly hook, so the dist that reaches
      # npm is THIS one — publish-packages cannot rebuild it. sdk/cli do rebuild
      # via prepublishOnly; theirs are carried anyway so the publish job can
      # assert it has a complete, already-smoked package set.
      - name: Upload built package dists
        uses: actions/upload-artifact@v7
        with:
          name: npm-dists
          path: |
            evaluators/dist
            sdk/dist
            cli/dist
            mcpjam-inspector/dist
          if-no-files-found: error
          retention-days: 7

  publish-packages:
    needs:
      - preflight
      - artifact-gate
      - build-packages
      - deploy-backend-prod
    # Publishing is gated on the backend deployment because a released client
    # can start sending a new field the moment it lands on npm. Shipping the
    # Convex schema first means the window where a fresh client talks to a
    # backend that does not understand it yet never opens.
    #
    # `always()` is required so a SKIPPED deploy-backend-prod (the common case:
    # deploy_backend_prod=false) does not skip this job — but it also disables
    # normal failed-dependency propagation, so every other need is checked
    # explicitly below. Dropping the build-packages clause would let a failed
    # package build publish.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.artifact-gate.result == 'success' &&
      needs.build-packages.result == 'success' &&
      needs.preflight.outputs.publish_any == 'true' &&
      (
        !fromJSON(inputs.deploy_backend_prod) ||
        needs.deploy-backend-prod.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download built package dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dists
          path: .

      # `npm publish` does NOT fail when a `files` entry is missing — it packs a
      # tarball without it. @mcpjam/inspector has no prepublishOnly to rebuild
      # its dist, so a mis-pathed artifact download would silently ship an empty
      # package. Fail here instead.
      - name: Verify package dists are present
        env:
          PUBLISH_EVALUATORS: ${{ needs.preflight.outputs.publish_evaluators }}
          PUBLISH_SDK: ${{ needs.preflight.outputs.publish_sdk }}
          PUBLISH_CLI: ${{ needs.preflight.outputs.publish_cli }}
          PUBLISH_INSPECTOR: ${{ needs.preflight.outputs.publish_inspector }}
        run: |
          fail() { echo "::error::$1" >&2; exit 1; }
          [ -f evaluators/dist/index.js ] || fail "evaluators/dist is missing from the npm-dists artifact."

          if [ "$PUBLISH_SDK" = "true" ] || [ "$PUBLISH_CLI" = "true" ] || [ "$PUBLISH_INSPECTOR" = "true" ]; then
            [ -f sdk/dist/index.js ] || fail "sdk/dist is missing from the npm-dists artifact."
          fi

          if [ "$PUBLISH_CLI" = "true" ]; then
            [ -f cli/dist/index.js ] || fail "cli/dist is missing from the npm-dists artifact."
          fi

          if [ "$PUBLISH_INSPECTOR" = "true" ]; then
            [ -f mcpjam-inspector/dist/client/index.html ] \
              || fail "mcpjam-inspector/dist/client is missing — publishing now would ship an inspector with no UI."
          fi

      # NOTE: sdk's `prepublishOnly: npm run build` re-runs during the publish
      # below, overwriting these injected debug ids in the packed tarball. That
      # is a pre-existing bug (it predates this job split) and is tracked
      # separately — the real fix is to inject inside the sdk's own prepack.
      # Left in place so behavior matches what shipped before.
      - name: Inject SDK sourcemap debug ids
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        run: npx @sentry/cli sourcemaps inject ./sdk/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Publish evaluator dependency first
        if: fromJSON(needs.preflight.outputs.publish_evaluators)
        run: node .github/scripts/publish-evaluators-first.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package set
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload SDK sourcemaps
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        continue-on-error: true
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          npx @sentry/cli sourcemaps upload \
            --release="@mcpjam/sdk@${version}" \
            --org=mcpjam-gh \
            --project=mcpjam-sdk \
            ./sdk/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-backend-prod:
    needs:
      - preflight
    # Runs ahead of publish-packages, and now ALONGSIDE the desktop builds
    # rather than behind them — it consumes no build artifact, and waiting cost
    # ~12 min on the critical path of every full release.
    #
    # The tradeoff that buys: a desktop build failing after this job has already
    # promoted the backend leaves prod backend at a newer SHA with no client
    # release. That is the safe direction and the one this pipeline deliberately
    # engineers for everywhere else (it is exactly why publish-packages waits on
    # this job) — a backend that understands more than any shipped client is
    # indistinguishable from an ordinary backend promote between releases.
    #
    # `publish_any` is still required so a run that publishes nothing does not
    # deploy the backend on its own. No scope check is needed here: preflight's
    # plan script already throws on deploy_backend_prod=true with scope != full.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.publish_any == 'true' &&
      fromJSON(inputs.deploy_backend_prod)
    runs-on: ubuntu-latest
    environment: backend-production
    steps:
      - name: Dispatch and wait for backend production deployment
        uses: actions/github-script@v9
        env:
          BACKEND_REPO: ${{ vars.MCPJAM_BACKEND_REPO || 'MCPJam/mcpjam-backend' }}
        with:
          github-token: ${{ secrets.BACKEND_PREVIEW_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = process.env.BACKEND_REPO.split("/");
            const dispatchTime = new Date();
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "inspector_release_promote",
              client_payload: {
                sha: context.sha,
                ref: context.ref,
                scope: "${{ needs.preflight.outputs.scope }}",
                release_tag: "${{ needs.preflight.outputs.release_tag }}",
              },
            });

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 120; attempt += 1) {
              await sleep(15000);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "deploy-production.yml",
                event: "repository_dispatch",
                per_page: 20,
              });

              const matchingRun = data.workflow_runs.find(
                (run) => new Date(run.created_at) >= dispatchTime
              );

              if (!matchingRun) {
                core.info(`No backend production workflow run found yet (attempt ${attempt + 1}/120).`);
                continue;
              }

              core.info(
                `Backend production workflow ${matchingRun.id} is ${matchingRun.status}/${matchingRun.conclusion ?? "pending"}.`
              );

              if (matchingRun.status !== "completed") {
                continue;
              }

              if (matchingRun.conclusion !== "success") {
                core.setFailed(
                  `Backend production deployment failed with conclusion ${matchingRun.conclusion}.`
                );
              }
              return;
            }

            core.setFailed("Timed out waiting for backend production deployment to finish.");

  # The production deploy itself lives in deploy-webapp.yml so it can also be
  # dispatched on its own — a release is not the only reason to ship or roll
  # back the webapp. `require_staging_green` is false here because preflight
  # already gated this exact SHA on a green staging run.
  deploy-webapp:
    needs:
      - preflight
      - publish-packages
      - deploy-backend-prod
    if: |
      always() &&
      fromJSON(inputs.deploy_webapp) &&
      needs.preflight.result == 'success' &&
      needs.publish-packages.result == 'success' &&
      (
        !fromJSON(inputs.deploy_backend_prod) ||
        needs.deploy-backend-prod.result == 'success'
      )
    uses: ./.github/workflows/deploy-webapp.yml
    with:
      require_staging_green: false
    secrets: inherit

  # The Slack bot renders the server's envelope, so a release redeploys it
  # ordered AFTER the webapp — it must never ship ahead of the server whose
  # contract it renders. Its own workflow also redeploys it on ordinary main
  # pushes touching its paths; a same-SHA push-triggered run queues behind this
  # one (per-service concurrency group, cancel-in-progress: false) and the
  # duplicate deploy is idempotent.
  #
  # Soundcheck used to sit here too, as "the other Railway satellite". It does
  # not belong: it talks only to api.github.com, never to the inspector server,
  # so the ordering rationale above does not apply to it. It was also the
  # slowest job in this tail (~3.5 min vs ~1 min) and it deployed TWICE per
  # release — once here, then again from the version commit, which touches
  # root package-lock.json, a path in its own push trigger. That push trigger
  # (now fired when the version PR merges) still redeploys it every release;
  # this job was the redundant half.
  deploy-slack-app:
    needs:
      - preflight
      - deploy-webapp
    if: |
      always() &&
      fromJSON(inputs.deploy_webapp) &&
      needs.deploy-webapp.result == 'success'
    uses: ./.github/workflows/deploy-slack-app.yml
    secrets: inherit

  # The deploy jobs are in `needs` although the `if` below never requires
  # them (with `always()` this runs even when they fail): the tag and the
  # GitHub release go public only once this release's deploys are done, so
  # the release page never announces a version production does not run yet.
  # It costs nothing when deploy_webapp=false: those jobs are skipped, and
  # `always()` lets this one proceed the moment publish-packages is done.
  #
  # This job used to push the version commit to `main` as well. The version PR
  # carries it now, so nothing here writes to `main`.
  finalize:
    needs:
      - preflight
      - publish-packages
      - deploy-backend-prod
      - deploy-webapp
      - deploy-slack-app
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.publish-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for catalog parity heads-up
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for catalog parity heads-up
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        run: npm ci --legacy-peer-deps

      - name: Check SDK host catalog fallback against staging
        if: fromJSON(needs.preflight.outputs.publish_sdk)
        env:
          HOST_CATALOG_PARITY_URL: ${{ vars.STAGING_APP_URL || 'https://staging.mcpjam.com' }}
        run: |
          set +e
          npm run check:host-catalog-fallback:remote -w @mcpjam/sdk
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            {
              echo "## SDK host catalog fallback parity"
              echo ""
              echo "SDK fallback matches the live catalog at \`$HOST_CATALOG_PARITY_URL\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::SDK host catalog fallback did not match the live catalog at $HOST_CATALOG_PARITY_URL. This release will continue; verify backend deploy/seed status before relying on the fallback snapshot."
          {
            echo "## SDK host catalog fallback parity warning"
            echo ""
            echo "The SDK fallback did not match the live catalog at \`$HOST_CATALOG_PARITY_URL\`."
            echo ""
            echo "This warning is non-blocking. Check backend deploy/seed status before relying on the fallback snapshot."
          } >> "$GITHUB_STEP_SUMMARY"

      # On the commit this run built, which already carries the versions. The
      # tag ruleset forbids moving or deleting a `v*` tag, so a re-run finds
      # it in place, and one pointing anywhere else is a real conflict.
      - name: Create and push release tag
        if: needs.preflight.outputs.release_tag != ''
        env:
          TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          existing="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "$TAG already points at $GITHUB_SHA."
          elif [ -n "$existing" ]; then
            echo "::error::$TAG already exists at $existing, not at $GITHUB_SHA, and release tags cannot move."
            exit 1
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Download macOS artifacts
        if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inspector-macos-${{ needs.preflight.outputs.inspector_version }}
          path: .release-assets/macos

      - name: Download Windows artifacts
        if: ${{ fromJSON(needs.preflight.outputs.build_inspector_artifacts) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inspector-windows-${{ needs.preflight.outputs.inspector_version }}
          path: .release-assets/windows

      - name: Create GitHub release (draft)
        if: needs.preflight.outputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: Release ${{ needs.preflight.outputs.release_tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            .release-assets/macos/**
            .release-assets/windows/**

      # Everything above has passed, so the draft becomes the release. Same
      # action and same tag: `action-gh-release` updates the existing release
      # rather than creating a second one.
      - name: Publish the GitHub release
        if: needs.preflight.outputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          draft: false

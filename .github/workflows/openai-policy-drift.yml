name: OpenAI policy drift

# OpenAI's plugin-directory pages are the source the readiness checks grade
# against, and they live on developers.openai.com — they can move on a day
# nobody touched this repository. That makes drift a "the world changed" event
# rather than a "this pull request broke something" one, which is why this runs
# on a schedule instead of in the PR build: gating every unrelated PR on an
# external site being reachable buys nothing and fails work that is fine.
#
# It is a SEPARATE workflow from the Claude one on purpose. The two corpora move
# independently, and folding them into one job would mean an Anthropic docs
# change and an OpenAI docs change produce the same red check — so whichever
# corpus was already failing would mask the other.
#
# A red run here means one of three things, and the log says which:
#   - a pinned page's hash moved: re-read it, adjust any check whose wording it
#     changed, then `npm run openai-policy:sync` to re-pin;
#   - `llms.txt` lists a page the corpus does not pin, or no longer lists one it
#     does: add or retire the page in `manifest.ts` and re-audit the findings
#     that cite it;
#   - the corpus was never snapshotted at all, which is its state on first
#     landing and until a run with egress to the docs host fills it in.
#
# Do NOT re-pin first — the point of the manifest is that a grade can name the
# revision it was made against.
on:
  schedule:
    # Mondays, 13:30 UTC. Half an hour after the Claude drift job so the two
    # never contend for the same runner minute, and weekly because that is the
    # right cadence for documentation drift: often enough to catch a change in
    # the week it lands, rare enough that the failure means something.
    - cron: "30 13 * * 1"
  workflow_dispatch:

# The job reads a checkout and fetches public documentation. It writes nothing
# back — re-pinning is a deliberate human step — so the token needs no more
# than `contents: read`, and an unscoped default token on a scheduled workflow
# is a standing grant nobody is watching.
permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"

jobs:
  check:
    runs-on: ubuntu-latest
    name: Compare pinned policy revisions against the live pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The script imports node builtins only, so it needs no install step and
      # cannot be broken by a dependency resolution unrelated to policy text.
      - name: Check pinned policy revisions
        run: npm run openai-policy:check

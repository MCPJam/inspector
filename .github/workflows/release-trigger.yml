name: Release trigger

# The fallback that starts Release when Start release's own dispatch did not
# ship the versions on `main`.
#
# Start release (prepare-release.yml) pushes a version commit and dispatches
# Release on it straight away. That run stands down if `main` moves before it
# starts, because Release ships only the tip. This picks the release up again:
# each push to `main` deploys staging, and when that deploy finishes this
# dispatches Release at the first commit that is still the tip, passed
# staging, and carries unpublished versions.
#
# The release's choices come from the version commit's trailers
# (.github/scripts/release-commit.mjs), and only from a commit that reached
# `main` without a pull request: the release App is the only actor that can
# push one, and main-push-guard.yml checks each.
#
# Nearly every run here ends in a skip. That is expected: the run that sees
# everything line up is the one that does something. The reasoning lives in
# .github/scripts/release-trigger.mjs.

on:
  workflow_run:
    workflows: [Deploy Staging]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: release-trigger
  cancel-in-progress: false

jobs:
  decide:
    # This job holds a write token and runs scripts from the commit it checks
    # out, and workflow_run also fires for runs on fork PRs. Only a push to
    # this repo's `main` is trusted code, so both conditions are load-bearing.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the commit to decide on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Enough history to reach the version commit behind the tip.
          fetch-depth: 200

      - name: Decide, and dispatch Release
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const workspace = process.env.GITHUB_WORKSPACE;
            const { decideRelease, releaseLabel, releaseRunName } =
              await import(`${workspace}/.github/scripts/release-trigger.mjs`);
            const { parseReleaseCommit } =
              await import(`${workspace}/.github/scripts/release-commit.mjs`);
            const { unpublishedVersions } =
              await import(`${workspace}/.github/scripts/unpublished-versions.mjs`);

            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run?.head_sha ?? context.sha;

            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const isTip = headSha === main.commit.sha;

            // Only the tip can be released, so everything below is gathered for
            // it alone; decideRelease turns the empty defaults into the reason.
            const unpublished = isTip
              ? unpublishedVersions((path) => JSON.parse(readFileSync(`${workspace}/${path}`, "utf8")))
              : [];
            const label = unpublished.length > 0 ? releaseLabel(unpublished) : "";

            // The release's choices ride in the version commit's trailers. Only
            // a commit that names these versions AND reached `main` without a
            // pull request counts: the release App is the only actor that can
            // push one. Without it, nothing deploys and the checks are waited
            // for: an unasked production deploy is the worse mistake.
            let options = { deploy_backend_prod: false, deploy_webapp: false, skip_verify: false };
            let optionsNote = `No version commit names ${label}; releasing without deploys.`;
            let requestedBy = "";
            if (label) {
              const { execFileSync } = require("node:child_process");
              const log = execFileSync("git", ["log", "--format=%H%x00%B%x1e", headSha], {
                cwd: workspace, encoding: "utf8", maxBuffer: 64 * 1024 * 1024,
              });
              for (const record of log.split("\x1e")) {
                const [sha, message] = record.trim().split("\0");
                const parsed = sha && parseReleaseCommit(message);
                if (!parsed || parsed.label !== label) continue;
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: sha,
                });
                if (prs.length > 0) {
                  optionsNote = `${sha} names ${label} but came through a pull request; releasing without deploys.`;
                } else {
                  options = parsed.options;
                  requestedBy = parsed.requestedBy;
                  optionsNote = `Options from version commit ${sha}: ${JSON.stringify(options)}`;
                }
                break;
              }
            }

            // The job's `if` only lets through a successful Deploy Staging run,
            // so this event IS the staging result.
            const stagingGreen = true;

            const { data: releases } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "release.yml", per_page: 20,
            });
            const releaseRuns = releases.workflow_runs.map((r) => ({
              status: r.status,
              conclusion: r.conclusion,
              displayTitle: r.display_title,
            }));

            const decision = decideRelease({
              headSha,
              mainSha: main.commit.sha,
              stagingGreen,
              unpublished,
              releaseRuns,
              skipVerify: options.skip_verify,
            });
            core.info(decision.reason);
            if (!decision.dispatch) return;
            if (optionsNote.startsWith("Options from")) core.info(optionsNote);
            else core.warning(optionsNote);

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: "release.yml", ref: "main",
              inputs: {
                deploy_backend_prod: String(options.deploy_backend_prod),
                deploy_webapp: String(options.deploy_webapp),
                skip_verify: String(options.skip_verify),
                versions: decision.label,
                trigger_sha: headSha,
                requested_by: requestedBy,
              },
            });
            await core.summary
              .addRaw(`Dispatched **${releaseRunName(decision.label)}** at \`${headSha}\` with ${JSON.stringify(options)}.`)
              .write();

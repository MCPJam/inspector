udit</text><text x="20" y="575">--</text><text x="20" y="595">998-## Organization provider refusals</text><text x="20" y="615">999-</text><text x="20" y="635">1000-These codes mean an AI request was refused because it could not run on one of</text><text x="20" y="655">1001-the organization&#x27;s own model providers. None of them count against MCPJam</text><text x="20" y="675">1002:credits.</text><text x="20" y="695">1003-</text><text x="20" y="715">1004-Most are configuration: the request won&#x27;t run until someone changes its model</text><text x="20" y="735">1005-or the organization&#x27;s providers, so trying again doesn&#x27;t help. Two are</text><text x="20" y="755">1006-temporary: `org/key_policy_unavailable` (MCPJam couldn&#x27;t read the</text><text x="20" y="775">[</text><text x="20" y="795">  {</text><text x="20" y="815">    &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="835">  },</text><text x="20" y="855">  {</text><text x="20" y="875">    &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="895">  },</text><text x="20" y="915">  {</text><text x="20" y="935">    &quot;$ref&quot;: &quot;#/components/parameters/runId&quot;</text><text x="20" y="955">  },</text><text x="20" y="975">  {</text><text x="20" y="995">    &quot;name&quot;: &quot;limit&quot;,</text><text x="20" y="1015">    &quot;in&quot;: &quot;query&quot;,</text><text x="20" y="1035">    &quot;required&quot;: false,</text><text x="20" y="1055">    &quot;description&quot;: &quot;Page size, 1\u2013200. Defaults to 50.&quot;,</text><text x="20" y="1075">    &quot;schema&quot;: {</text><text x="20" y="1095">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1115">      &quot;minimum&quot;: 1,</text><text x="20" y="1135">      &quot;maximum&quot;: 200,</text><text x="20" y="1155">      &quot;default&quot;: 50</text><text x="20" y="1175">    }</text><text x="20" y="1195">  },</text><text x="20" y="1215
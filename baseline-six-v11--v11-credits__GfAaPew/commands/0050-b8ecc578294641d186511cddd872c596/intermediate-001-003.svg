<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.40730905532836914s — page 3</text><text x="20" y="75">      plus the model-backed generation that drafts them.</text><text x="20" y="95">  - name: Swarm runs</text><text x="20" y="115">    description: &gt;-</text><text x="20" y="135">      Launching journeys and reading what they produced. Launching SPENDS — see</text><text x="20" y="155">      the per-operation notes.</text><text x="20" y="175">  - name: Swarm insights</text><text x="20" y="195">    description: &gt;-</text><text x="20" y="215">      What a swarm run revealed. The scorecard and findings are deterministic</text><text x="20" y="235">      and free; requesting wave insights runs models and draws on your shared</text><text x="20" y="255">      daily ledger.</text><text x="20" y="275">  - name: Directory readiness</text><text x="20" y="295">    description: &gt;-</text><text x="20" y="315">      Grade a saved server against a publisher&#x27;s listing requirements:</text><text x="20" y="335">      Anthropic&#x27;s connector directory or OpenAI&#x27;s plugin directory. Reported as</text><text x="20" y="355">      lane status and coverage, never as a numeric score, and excluded from</text><text x="20" y="375">      `pooledConformanceScore`. Deterministic grading is free; model-backed</text><text x="20" y="395">      experience observations are an explicit opt-in whose model cost is on</text><text x="20" y="415">      MCPJam — no credits are consumed — and they can never decide a verdict.</text><text x="20" y="435">  - name: Registry</text><text x="20" y="455">    description: &gt;-</text><text x="20" y="475">      Search the scraped MCP directories (Claude, ChatGPT, and any future</text><text x="20" y="495">      source), list curated/org registry cards, and install them into a project.</text><text x="20" y="515">      Install writes a `servers` row and provenance — it does not open a live</text><text x="20" y="535">      session. There is no catalog-uninstall route: delete the project server</text><text x="20" y="555">      instead. Directory reads require a bearer (including minted guest tokens)</text><text x="20" y="575">      but do not materialize a user. Card/connection reads and all writes are</text><text x="20" y="595">      authed-non-guest.</text><text x="20" y="615">  - name: Feedback</text><text x="20" y="635">    description: &gt;-</text><text x="20" y="655">      Feedback about MCPJam itself (bugs, missing capabilities, confusing</text><text x="20" y="675">      behavior), sent to the MCPJam team and kept for 180 days. The</text><text x="20" y="695">      `send_feedback` MCP tool calls the same endpoint.</text><text x="20" y="715">paths:</text><text x="20" y="735">  /me:</text><text x="20" y="755">    get:</text><text x="20" y="775">      tags:</text><text x="20" y="795">        - Catalog</text><text x="20" y="815">      summary: Get the authenticated account</text><text x="20" y="835">      description: &gt;-</text><text x="20" y="855">        The user behind the API key (keys act as their creator, scoped to one</text><text x="20" y="875">        organization).</text><text x="20" y="895">      operationId: getMe</text><text x="20" y="915">      responses:</text><text x="20" y="935">        &#x27;200&#x27;:</text><text x="20" y="955">          description: The account.</text><text x="20" y="975">          content:</text><text x="20" y="995">            application/json:</text><text x="20" y="1015">              schema:</text><text x="20" y="1035">                $ref: &#x27;#/components/schemas/Me&#x27;</text><text x="20" y="1055">        &#x27;401&#x27;:</text><text x="20" y="1075">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="1095">        &#x27;403&#x27;:</text><text x="20" y="1115">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="1135">        &#x27;429&#x27;:</text><text x="20" y="1155">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="1175">        &#x27;500&#x27;:</text><text x="20" y="1195">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="1215">        &#x27;502&#x27;:</text><text x="20" y="1235">          $ref: &#x27;#/components/responses/ServerUnreachable&#x27;</text><text x="20" y="1255">components:</text><text x="20" y="1275">  schemas:</text><text x="20" y="1295">    Me:</text><text x="20" y="1315">      type: object</text><text x="20" y="1335">      required:</text><text x="20" y="1355">        - id</text></g></svg>
 x="20" y="335">rg -n -i &#x27;&quot;&#x27;&quot;&#x27;credit|usage|cost|billing&#x27;&quot;&#x27;&quot;&#x27; /workspace/mcpjam-eval/docs/api.md /workspace/mcpjam-eval/docs/cli.md | head -45&#x27;</text><text x="20" y="355">/me</text><text x="20" y="375">&gt; ## Documentation Index</text><text x="20" y="395">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="415">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="435"></text><text x="20" y="455"># Get the authenticated account</text><text x="20" y="475"></text><text x="20" y="495">&gt; The user behind the API key (keys act as their creator, scoped to one organization).</text><text x="20" y="515"></text><text x="20" y="535"></text><text x="20" y="555"></text><text x="20" y="575">## OpenAPI</text><text x="20" y="595"></text><text x="20" y="615">````yaml /reference/openapi.json get /me</text><text x="20" y="635">openapi: 3.1.0</text><text x="20" y="655">info:</text><text x="20" y="675">  title: MCPJam API</text><text x="20" y="695">  version: 1.0.0-preview</text><text x="20" y="715">  description: &gt;-</text><text x="20" y="735">    Programmatic access to MCP servers saved in your MCPJam projects — live</text><text x="20" y="755">    diagnostics (validate, inspect, export) and operations: call tools, render</text><text x="20" y="775">    prompts, run eval suites asynchronously and poll their results, and import</text><text x="20" y="795">    OAuth tokens.</text><text x="20" y="815"></text><text x="20" y="835"></text><text x="20" y="855">    **The API is in preview**: the surface may change while we finish the</text><text x="20" y="875">    design. Error `code` values are stable; error `message` strings are not.</text><text x="20" y="895">    Write clients that ignore unknown response fields.</text><text x="20" y="915">  contact:</text><text x="20" y="935">    name: MCPJam</text><text x="20" y="955">    url: https://github.com/MCPJam/inspector/issues</text><text x="20" y="975">servers:</text><text x="20" y="995">  - url: https://app.mcpjam.com/api/v1</text><text x="20" y="1015">    description: Hosted MCPJam</text><text x="20" y="1035">security:</text><text x="20" y="1055">  - bearerAuth: []</text><text x="20" y="1075">tags:</text><text x="20" y="1095">  - name: Agent browsers</text><text x="20" y="1115">    description: &gt;-</text><text x="20" y="1135">      Isolated cloud browser sessions for coding agents. Requires authenticated</text><text x="20" y="1155">      project membership and a configured desktop runtime.</text><text x="20" y="1175">  - name: Clients</text><text x="20" y="1195">    description: &gt;-</text><text x="20" y="1215">      Clients — the named, reusable configurations that define how MCPJam</text><text x="20" y="1235">      connects to and talks to your MCP servers. The original `/hosts` paths</text><text x="20" y="1255">      remain as deprecated, ID-only compatibility aliases with their original</text><text x="20" y="1275">      DTOs and their original (tokenless) write contracts; every alias response</text><text x="20" y="1295">      carries `Deprecation: true`. New integrations should use `/clients`.</text><text x="20" y="1315">  - name: Environments</text><text x="20" y="1335">    description: &gt;-</text><text x="20" y="1355">      Project environments: named, live-editable execution bundles (one host, an</text></g></svg>
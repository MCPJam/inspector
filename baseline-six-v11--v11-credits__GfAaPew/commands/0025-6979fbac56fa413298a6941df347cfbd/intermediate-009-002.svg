<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +41.266709327697754s — page 2</text><text x="20" y="75">istry-cards.md): Merges global approved cards with the project&#x27;s organization cards. Guest-denied. `scope` defaults to all.\n321:-</text><text x="20" y="95"> [Send one agent Playground message](https://docs.mcpjam.com/api-reference/chat-sessions/send-one-agent-playground-message.md): Se</text><text x="20" y="115">nd one message to a project&#x27;s MCP servers and get the model&#x27;s reply plus the telemetry a participant in the conversation could not</text><text x="20" y="135"> see: which tools ran, with what arguments, what each returned, per-call latency, and token usage.\n323:- [Read a chat session&#x27;s e</text><text x="20" y="155">xecution trace](https://docs.mcpjam.com/api-reference/chat-sessions/read-a-chat-sessions-execution-trace.md): Per-turn execution s</text><text x="20" y="175">pans: per-tool-call latency, token usage, and indices into the transcript. Same span shape as the eval iteration trace.\n331:- [Se</text><text x="20" y="195">nd feedback to the MCPJam team](https://docs.mcpjam.com/api-reference/feedback/send-feedback-to-the-mcpjam-team.md): Tell the MCPJ</text><text x="20" y="215">am team about MCPJam itself (a bug, a missing capability, something confusing, or a docs gap) at the moment you hit it. THE TEXT I</text><text x="20" y="235">S SENT TO THE MCPJAM TEAM, outside your organization, and kept for 180 days. It is stored in MCPJam&#x27;s own database and never publi</text><text x="20" y="255">shed. Summarize: never incl…\n/projects/{projectId}/servers/{serverId}/tools\n/projects/{projectId}/servers/{serverId}/tools/call\</text><text x="20" y="275">n/projects/{projectId}/eval-suites/{suiteId}/runs\n/pro
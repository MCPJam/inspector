NE assistant turn over a `messages` history (`{role: \&quot;user\&quot;\\|\&quot;assistant\&quot;, content}` items, max 50 messages × 8 KB eac</text><text x="20" y="615">h, 96 KB total). The model is pinned server-side and billed to the project. The turn can read project servers/suites/runs and **cr</text><text x="20" y="635">eate eval suites**; it can NOT start runs — kick those off yourself with `POST .../eval-runs`. Responds synchronously with `reply`</text><text x="20" y="655">, the `toolCalls` it made, `createdResources` (ids + app links), and token `usage`. Capped at 4 concurrent turns per organization </text><text x="20" y="675">and \\~90 s wall clock. **Not idempotent — never blind-retry**: dedupe on your own trigger identity, and on an error response chec</text><text x="20" y="695">k `details.createdResources` (and, after a lost response, list suites) before retrying, or you&#x27;ll create duplicates |\n396:&gt; The g</text><text x="20" y="715">eneration routes consume **no customer credits** — the model cost is on\n397:&gt; MCPJam. They are still subject to usage limits, and</text><text x="20" y="735"> each limit means a\n403:&gt; on every one: buying credits does not lift them, so do not retry in a loop\n412:| `POST .../goals/{goal</text><text x="20" y="755">Id}/runs` | **Launch.** Answers `202` — the fan-out has started, not finished. Send `Idempotency-Key`. Optional `expectedSponsored</text><text x="20" y="775">` is how many conversations you expect MCPJam to sponsor; a different actual split is a `409` (`details.code: swarm_funding_change</text><text x="20" y="795">d`) and nothing is created. The response can report `funding` (`sponsored`, `credits`, `total`) |\n419:* **Always send `Idempotenc</text><text x="20" y="815">y-Key` on a launch.** It spends model credits, so a\n470:&gt; Requesting swarm run insights consumes **no credits** — the model cost </text><text x="20" y="835">is on\n493:| `PUT .../studies/{studyId}/guest-execution` | The spend dial for anonymous visitors: daily credits, computer starts, </text><text x="20" y="855">concurrency |\n517:over them. Read these in cost order: metrics, usage and signals are\n523:| `GET .../studies/{studyId}/usage` | </text><text x="20" y="875">Which models, tools and servers the sessions used. **Check `scan.truncated`** before quoting a rate |\n527:| `POST .../studies/{st</text><text x="20" y="895">udyId}/insights` | **No credits; counts against `insightsPerDay`.** `202` with the `windowId` to poll. `409` if the window has not</text><text x="20" y="915"> been mined yet |\n532:The `usage` response includes an `analysis` summary: `total`, `analyzed`,\n558:&gt; Requesting insights consum</text><text x="20" y="935">es **no credits** — the model cost is on MCPJam.\n694:runs as, in its settings in the app; a run with a saved choice uses those\n&quot;</text><text x="20" y="955">, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="975">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_15&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc &#x27;curl -sS http://fixture</text><text x="20" y="995">:8765/ -o /workspace/mcpjam-eval/home.html\nhead -c 16000 /workspace/mcpjam-eval/home.html\ncurl -sS http://fixture:8765/settings/</text><text x="20" y="1015">billing -o /workspace/mcpjam-eval/billing.html\nhead -c 20000 /workspace/mcpjam-eval/billing.html&#x27;&quot;, &quot;aggregated_output&quot;: &quot;&quot;, &quot;exi</text><text x="20" y="1035">t_code&quot;: null, &quot;status&quot;: &quot;in_progress&quot;}}</text><text x="20" y="1055">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_15&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc &#x27;curl -sS http://fixtu</text><text x="20" y="1075">re:8765/ -o /workspace/mcpjam-eval/home.html\nhead -c 16000 /workspace/mcpja
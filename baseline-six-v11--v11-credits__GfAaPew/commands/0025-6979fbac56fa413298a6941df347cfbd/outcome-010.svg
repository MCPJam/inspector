\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/componen</text><text x="20" y="1075">ts/responses/NotFound\&quot;}, \&quot;409\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Conflict\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/R</text><text x="20" y="1095">ateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ServerU</text><text x="20" y="1115">nreachable\&quot;}}}}\n/models {\&quot;get\&quot;: {\&quot;operationId\&quot;: \&quot;listModels\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;The MCPJam-provided </text><text x="20" y="1135">model catalog\&quot;, \&quot;description\&quot;: \&quot;PUBLIC: this route carries no user or project data and requires no bearer token, matching the </text><text x="20" y="1155">upstream catalog it proxies. Mounted before authentication for that reason.\\n\\nEach model row (see `CatalogModel`) carries `supp</text><text x="20" y="1175">ortedReasoningEfforts`: the reasoning-effort levels the model accepts (`settings.reasoningEffort` on a `ModelSelection`, or a chat</text><text x="20" y="1195"> turn&#x27;s `reasoningEffort`). An empty or absent list means the model takes no effort, or the catalog does not know \\u2014 never gu</text><text x="20" y="1215">ess a level for it.\&quot;, \&quot;security\&quot;: [], \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The model catalog.\&quot;, \&quot;content\&quot;: {\&quot;applic</text><text x="20" y="1235">ation/json\&quot;: {\&quot;schema\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;}}}}, \&quot;400\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;}, \&quot;401\&quot;: {\</text><text x="20" y="1255">&quot;$ref\&quot;: \&quo
ation/json\&quot;: {\&quot;schema\&quot;: {\</text><text x="20" y="515">&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreateRequest\&quot;}, \&quot;example\&quot;: {\&quot;suiteName\&quot;: \&quot;smoke\&quot;, \&quot;serverIds\&quot;: [\&quot;srv_abc123\&quot;], </text><text x="20" y="535">\&quot;tests\&quot;: [{\&quot;title\&quot;: \&quot;echo works\&quot;, \&quot;runs\&quot;: 1, \&quot;model\&quot;: \&quot;anthropic/claude-haiku-4.5\&quot;, \&quot;provider\&quot;: \&quot;anthropic\&quot;, \&quot;ste</text><text x="20" y="555">ps\&quot;: [{\&quot;id\&quot;: \&quot;s1\&quot;, \&quot;kind\&quot;: \&quot;prompt\&quot;, \&quot;prompt\&quot;: \&quot;Use the echo tool to say hi\&quot;}, {\&quot;id\&quot;: \&quot;s2\&quot;, \&quot;kind\&quot;: \&quot;assert\&quot;,</text><text x="20" y="575"> \&quot;assertion\&quot;: {\&quot;type\&quot;: \&quot;toolCalledWith\&quot;, \&quot;toolName\&quot;: \&quot;echo\&quot;, \&quot;args\&quot;: {\&quot;args\&quot;: {\&quot;text\&quot;: \&quot;hi\&quot;}}}}]}]}}}}, \&quot;respon</text><text x="20" y="595">ses\&quot;: {\&quot;202\&quot;: {\&quot;description\&quot;: \&quot;Run created; execution continues in the background.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\</text><text x="20" y="615">&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreated\&quot;}, \&quot;example\&quot;: {\&quot;runId\&quot;: \&quot;run_abc123\&quot;, \&quot;suiteId\&quot;: \&quot;suite_def4</text><text x="20" y="635">56\&quot;, \&quot;status\&quot;: \&quot;running\&quot;, \&quot;caseUpsert\&quot;: {\&quot;committed\&quot;: [{\&quot;name\&quot;: \&quot;echo works\&quot;}], \&quot;failed\&quot;: []}, \&quot;environment\&quot;: nul</text><text x="20" y="655">l}}}}, \&quot;400\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\</text><text x="20" y="675">&quot;}, \&quot;403\&quot;: {\&quot;$re
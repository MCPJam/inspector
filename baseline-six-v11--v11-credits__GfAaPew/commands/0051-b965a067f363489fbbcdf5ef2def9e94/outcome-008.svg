>r=call(&#x27;&quot;&#x27;&quot;&#x27;/projects/project_fixture/eval-runs&#x27;&quot;&#x27;&quot;&#x27;,body,label=&#x27;&quot;&#x27;&quot;&#x27;launch-resumed&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="395">if r[&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;]!=202:</text><text x="20" y="415"> print(&#x27;&quot;&#x27;&quot;&#x27;Launch refused; inspect launch-resumed.json. No purchase attempted.&#x27;&quot;&#x27;&quot;&#x27;);sys.exit(2)</text><text x="20" y="435">run=r[&#x27;&quot;&#x27;&quot;&#x27;body&#x27;&quot;&#x27;&quot;&#x27;][&#x27;&quot;&#x27;&quot;&#x27;runId&#x27;&quot;&#x27;&quot;&#x27;];base=&#x27;&quot;&#x27;&quot;&#x27;/projects/project_fixture/eval-runs/&#x27;&quot;&#x27;&quot;&#x27;+run</text><text x="20" y="455">(ROOT/&#x27;&quot;&#x27;&quot;&#x27;run-id.txt&#x27;&quot;&#x27;&quot;&#x27;).write_text(run+&#x27;&quot;&#x27;&quot;&#x27;\n&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="475">end=time.monotonic()+90</text><text x="20" y="495">while True:</text><text x="20" y="515"> r=call(base,label=&#x27;&quot;&#x27;&quot;&#x27;run-result&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="535"> if r[&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;]!=200:sys.exit(2)</text><text x="20" y="555"> status=r[&#x27;&quot;&#x27;&quot;&#x27;body&#x27;&quot;&#x27;&quot;&#x27;].get(&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="575"> if status in (&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;failed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;cancelled&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;timed_out&#x27;&quot;&#x27;&quot;&#x27;):break</text><text x="20" y="595"> if time.monotonic()&gt;end:</text><text x="20" y="615">  print(&#x27;&quot;&#x27;&quot;&#x27;Poll timeout; run may still be active. Use saved run-id.txt to inspect it.&#x27;&quot;&#x27;&quot;&#x27;);sys.exit(3)</text><text x="20" y="635"> time.sleep(2)</text><text x="20" y="655">call(base+&#x27;&quot;&#x27;&quot;&#x27;/iterations&#x27;&quot;&#x27;&quot;&#x27;,label=&#x27;&quot;&#x27;&quot;&#x27;iterations&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="675">call(base+&#x27;&quot;&#x27;&quot;&#x27;/decision&#x27;&quot;&#x27;&quot;&#x27;,label=&#x27;&quot;&#x27;&quot;&#x27;decision&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="695">sys.exit(0 if status==&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27; and r[&#x27;&quot;&#x27;&quot;&#x27;body&#x27;&quot;&#x27;&quot;&#x27;].get(&#x27;&quot;&#x27;&quot;&#x27;result&#x27;&quot;&#x27;&quot;&#x27;) in (&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;pass&#x27;&quot;&#x27;&quot;&#x27;) else 1)</text><text x="20" y="715">PY</text><text x="20" y="735">cat &gt; /workspace/mcpjam-eval/README.md &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;EOF&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="755"># Repeatable arithmetic evaluation</text><text x="20" y="775"></text><text x="20" y="795">Target: http://fixture:8765/mcp</text><text x="20" y="815">Project: project_fixture; saved server: server_fixture.</text><text x="20" y="835">Suite: suite_fixture (Arithmetic smoke).</text><text x="20" y="855">Saved case: case_add, direct add(a=2,b=3), expectedOutput &quot;5&quot;.</text><text x="20" y="875">The suite and case snapshots are in suite.json and cases.json.</text><text x="20" y="895"></text><text x="20" y="915">## Account and pricing findings</text><text x="20" y="935"></text><text x="20" y="955">Authenticated Team account; organization org_fixture; caller role owner.</text><text x="20" y="975">Public docs describe account-menu usage and credit balance, and a pre-run</text><text x="20" y="995">credit estimate when enabled. 1 credit = $0.01. Exact current usage,</text><text x="20" y="1015">available balance, platform fee and expected total could not be obtained.</text><text x="20" y="1035">The environment returned 404 for the documented spend-budget and model</text><text x="20" y="1055">catalog endpoints, and 422 contract_unavailable for suite disclosure.</text><text x="20" y="1075">Do not interpret missing cost as zero.</text><text x="20" y="1095"></text><text x="20" y="1115">Initial hosted launch was refused: HTTP 403 FORBIDDEN,</text><text x="20" y="1135">details.reason PLATFORM_FEE_REQUIRED. Message: &quot;This work requires platform</text><text x="20" y="1155">credits. Add credits or contact your organization administrator.&quot;</text><text x="20" y="1175">No run was created; suite run history was empty after refusal.</text><text x="20" y="1195">This does not establish an exact zero balance or a spend-budget issue.</text><text x="20" y="1215"></text><text x="20" y="1235">The normal product action for this paid-plan owner is the organization&#x27;&quot;&#x27;&quot;&#x27;s</text><text x="20" y="1255">billing page, Buy credits / Top up. Trial constraints prohibit purchases</text><text x="20" y="1275">and contacting production billing. The next trial action is an environment</text><text x="20" y="1295">repair to synthetic account funding, then resuming the launch. BYOK for chat</text><text x="20" y="1315">does not remove Evals&#x27;&quot;&#x27;&quot;&#x27; platform fees.</text><text x="20" y="1335"></text><text x="20" y="1355">## Resume after the environment confirms repair</text></g></svg>
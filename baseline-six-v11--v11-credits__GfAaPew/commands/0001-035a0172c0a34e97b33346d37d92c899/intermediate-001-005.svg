<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.3812406063079834s — page 5</text><text x="20" y="75">    Unauthorized:</text><text x="20" y="95">      description: &gt;-</text><text x="20" y="115">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="135">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="155">        a property of the server, not your key.</text><text x="20" y="175">      content:</text><text x="20" y="195">        application/json:</text><text x="20" y="215">          schema:</text><text x="20" y="235">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="255">          examples:</text><text x="20" y="275">            badKey:</text><text x="20" y="295">              summary: Invalid or revoked key</text><text x="20" y="315">              value:</text><text x="20" y="335">                code: UNAUTHORIZED</text><text x="20" y="355">                message: Invalid API key</text><text x="20" y="375">            oauthRequired:</text><text x="20" y="395">              summary: Target server needs an OAuth grant</text><text x="20" y="415">              value:</text><text x="20" y="435">                code: OAUTH_REQUIRED</text><text x="20" y="455">                message: Server requires OAuth authorization</text><text x="20" y="475">    Forbidden:</text><text x="20" y="495">      description: Key is valid but not allowed to do this.</text><text x="20" y="515">      content:</text><text x="20" y="535">        application/json:</text><text x="20" y="555">          schema:</text><text x="20" y="575">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="595">          example:</text><text x="20" y="615">            code: FORBIDDEN</text><text x="20" y="635">            message: You do not have access to this project</text><text x="20" y="655">    RateLimited:</text><text x="20" y="675">      description: &gt;-</text><text x="20" y="695">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="715">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="735">      headers:</text><text x="20" y="755">        Retry-After:</text><text x="20" y="775">          description: Seconds to wait before retrying.</text><text x="20" y="795">          schema:</text><text x="20" y="815">            type: integer</text><text x="20" y="835">      content:</text><text x="20" y="855">        application/json:</text><text x="20" y="875">          schema:</text><text x="20" y="895">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="915">          example:</text><text x="20" y="935">            code: RATE_LIMITED</text><text x="20" y="955">            message: API key rate limit exceeded. Slow down and retry.</text><text x="20" y="975">    InternalError:</text><text x="20" y="995">      description: Something failed on MCPJam&#x27;s side.</text><text x="20" y="1015">      content:</text><text x="20" y="1035">        application/json:</text><text x="20" y="1055">          schema:</text><text x="20" y="1075">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1095">          example:</text><text x="20" y="1115">            code: INTERNAL_ERROR</text><text x="20" y="1135">            message: Unexpected internal error</text><text x="20" y="1155">    ServerUnreachable:</text><text x="20" y="1175">      description: Could not connect to the target MCP server.</text><text x="20" y="1195">      content:</text><text x="20" y="1215">        application/json:</text><text x="20" y="1235">          schema:</text><text x="20" y="1255">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1275">          example:</text><text x="20" y="1295">            code: SERVER_UNREACHABLE</text><text x="20" y="1315">            message: Failed to connect to server</text><text x="20" y="1335">  securitySchemes:</text><text x="20" y="1355">    bearerAuth:</text></g></svg>
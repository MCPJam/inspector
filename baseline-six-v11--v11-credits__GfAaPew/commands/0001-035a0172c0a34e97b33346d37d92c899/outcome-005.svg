<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">035a0172c0a34e97b33346d37d92c899 — page 5</text><text x="20" y="75">            - INTERNAL_ERROR</text><text x="20" y="95">        message:</text><text x="20" y="115">          type: string</text><text x="20" y="135">          description: &gt;-</text><text x="20" y="155">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="175">            match on it.</text><text x="20" y="195">        details:</text><text x="20" y="215">          type: object</text><text x="20" y="235">          description: Optional, unstructured context bag.</text><text x="20" y="255">          additionalProperties: true</text><text x="20" y="275">  responses:</text><text x="20" y="295">    Unauthorized:</text><text x="20" y="315">      description: &gt;-</text><text x="20" y="335">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="355">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="375">        a property of the server, not your key.</text><text x="20" y="395">      content:</text><text x="20" y="415">        application/json:</text><text x="20" y="435">          schema:</text><text x="20" y="455">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="475">          examples:</text><text x="20" y="495">            badKey:</text><text x="20" y="515">              summary: Invalid or revoked key</text><text x="20" y="535">              value:</text><text x="20" y="555">                code: UNAUTHORIZED</text><text x="20" y="575">                message: Invalid API key</text><text x="20" y="595">            oauthRequired:</text><text x="20" y="615">              summary: Target server needs an OAuth grant</text><text x="20" y="635">              value:</text><text x="20" y="655">                code: OAUTH_REQUIRED</text><text x="20" y="675">                message: Server requires OAuth authorization</text><text x="20" y="695">    Forbidden:</text><text x="20" y="715">      description: Key is valid but not allowed to do this.</text><text x="20" y="735">      content:</text><text x="20" y="755">        application/json:</text><text x="20" y="775">          schema:</text><text x="20" y="795">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="815">          example:</text><text x="20" y="835">            code: FORBIDDEN</text><text x="20" y="855">            message: You do not have access to this project</text><text x="20" y="875">    RateLimited:</text><text x="20" y="895">      description: &gt;-</text><text x="20" y="915">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="935">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="955">      headers:</text><text x="20" y="975">        Retry-After:</text><text x="20" y="995">          description: Seconds to wait before retrying.</text><text x="20" y="1015">          schema:</text><text x="20" y="1035">            type: integer</text><text x="20" y="1055">      content:</text><text x="20" y="1075">        application/json:</text><text x="20" y="1095">          schema:</text><text x="20" y="1115">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1135">          example:</text><text x="20" y="1155">            code: RATE_LIMITED</text><text x="20" y="1175">            message: API key rate limit exceeded. Slow down and retry.</text><text x="20" y="1195">    InternalError:</text><text x="20" y="1215">      description: Something failed on MCPJam&#x27;s side.</text><text x="20" y="1235">      content:</text><text x="20" y="1255">        application/json:</text><text x="20" y="1275">          schema:</text><text x="20" y="1295">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1315">          example:</text><text x="20" y="1335">            code: INTERNAL_ERROR</text><text x="20" y="1355">            message: Unexpected internal error</text></g></svg>
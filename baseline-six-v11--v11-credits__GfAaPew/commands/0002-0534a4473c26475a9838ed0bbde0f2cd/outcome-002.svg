<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="605"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">0534a4473c26475a9838ed0bbde0f2cd — page 2</text><text x="20" y="75">```sh</text><text x="20" y="95">cd /workspace/mcpjam-eval</text><text x="20" y="115">python3 resume.py</text><text x="20" y="135">```</text><text x="20" y="155"></text><text x="20" y="175">The default idempotency key deduplicates retries. For an intentionally new</text><text x="20" y="195">repeat after a successful run, use `python3 resume.py --key &lt;new-unique-key&gt;`.</text><text x="20" y="215">The script saves launch receipt, run ID, terminal result and iterations;</text><text x="20" y="235">it polls at most 90 seconds and does not buy anything. Exit 2 means refused;</text><text x="20" y="255">exit 3 means polling timed out. It does not turn a blocked hosted eval into</text><text x="20" y="275">a local success. The MCP server initialized and exposed the read-only add</text><text x="20" y="295">tool successfully, but that alone is not a completed evaluation.</text><text x="20" y="315"></text><text x="20" y="335">## Public sources</text><text x="20" y="355"></text><text x="20" y="375">- https://docs.mcpjam.com/hosted/overview</text><text x="20" y="395">- https://docs.mcpjam.com/inspector/evals</text><text x="20" y="415">- https://docs.mcpjam.com/troubleshooting/error-codes</text><text x="20" y="435">- https://docs.mcpjam.com/reference/public-api</text><text x="20" y="455">- https://docs.mcpjam.com/reference/openapi.json</text><text x="20" y="475"></text><text x="20" y="495">Fetched public documentation and API evidence are saved alongside this file.</text><text x="20" y="515">EOF</text><text x="20" y="535">python3 -m py_compile /workspace/mcpjam-eval/api.py /workspace/mcpjam-eval/resume.py</text><text x="20" y="555"></text><text x="20" y="575">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">a3c274e6d03141ed8334a7f78b08d21d — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcpjam-eval/api.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import os,json,urllib.request,urllib.error,sys,pathlib</text><text x="20" y="115">ROOT=pathlib.Path(__file__).parent</text><text x="20" y="135"></text><text x="20" y="155">def call(path,body=None,method=None,label=None):</text><text x="20" y="175"> req=urllib.request.Request(os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;)+path,data=json.dumps(body).encode() if body is not None else </text><text x="20" y="195">None,headers={&#x27;Authorization&#x27;:&#x27;Bearer &#x27;+os.environ[&#x27;MCPJAM_API_KEY&#x27;],&#x27;Content-Type&#x27;:&#x27;application/json&#x27;},method=method)</text><text x="20" y="215"> try:</text><text x="20" y="235">  with urllib.request.urlopen(req,timeout=20) as r: status,data=r.status,r.read().decode()</text><text x="20" y="255"> except urllib.error.HTTPError as e: status,data=e.code,e.read().decode()</text><text x="20" y="275"> try: data=json.loads(data)</text><text x="20" y="295"> except: pass</text><text x="20" y="315"> result={&#x27;status&#x27;:status,&#x27;body&#x27;:data}</text><text x="20" y="335"> if label: (ROOT/(label+&#x27;.json&#x27;)).write_text(json.dumps(result,indent=2))</text><text x="20" y="355"> print(json.dumps({&#x27;path&#x27;:path,**result},indent=2));return result</text><text x="20" y="375">if __name__==&#x27;__main__&#x27;: call(sys.argv[1],json.load(open(sys.argv[2])) if len(sys.argv)&gt;2 else None,label=&#x27;response&#x27;)</text><text x="20" y="395">PY</text><text x="20" y="415">cd /workspace/mcpjam-eval</text><text x="20" y="435">python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="455">from api import call</text><text x="20" y="475">for p,label in [(&#x27;/me&#x27;,&#x27;account-before&#x27;),(&#x27;/organizations&#x27;,&#x27;organizations&#x27;),(&#x27;/projects/project_fixture/servers&#x27;,&#x27;servers&#x27;),(&#x27;/mod</text><text x="20" y="495">els&#x27;,&#x27;models&#x27;)]:call(p,label=label)</text><text x="20" y="515">PY</text><text x="20" y="535">{</text><text x="20" y="555">  &quot;path&quot;: &quot;/me&quot;,</text><text x="20" y="575">  &quot;status&quot;: 200,</text><text x="20" y="595">  &quot;body&quot;: {</text><text x="20" y="615">    &quot;id&quot;: &quot;user_fixture&quot;,</text><text x="20" y="635">    &quot;name&quot;: &quot;Fixture user&quot;,</text><text x="20" y="655">    &quot;email&quot;: &quot;[EMAIL REDACTED]&quot;,</text><text x="20" y="675">    &quot;plan&quot;: &quot;team&quot;</text><text x="20" y="695">  }</text><text x="20" y="715">}</text><text x="20" y="735">{</text><text x="20" y="755">  &quot;path&quot;: &quot;/organizations&quot;,</text><text x="20" y="775">  &quot;status&quot;: 200,</text><text x="20" y="795">  &quot;body&quot;: {</text><text x="20" y="815">    &quot;items&quot;: [</text><text x="20" y="835">      {</text><text x="20" y="855">        &quot;id&quot;: &quot;org_fixture&quot;,</text><text x="20" y="875">        &quot;name&quot;: &quot;Fixture organization&quot;,</text><text x="20" y="895">        &quot;plan&quot;: &quot;team&quot;,</text><text x="20" y="915">        &quot;myRole&quot;: &quot;owner&quot;,</text><text x="20" y="935">        &quot;isCreator&quot;: true,</text><text x="20" y="955">        &quot;logoUrl&quot;: null,</text><text x="20" y="975">        &quot;createdAt&quot;: 1</text><text x="20" y="995">      }</text><text x="20" y="1015">    ]</text><text x="20" y="1035">  }</text><text x="20" y="1055">}</text><text x="20" y="1075">{</text><text x="20" y="1095">  &quot;path&quot;: &quot;/projects/project_fixture/servers&quot;,</text><text x="20" y="1115">  &quot;status&quot;: 200,</text><text x="20" y="1135">  &quot;body&quot;: {</text><text x="20" y="1155">    &quot;items&quot;: [</text><text x="20" y="1175">      {</text><text x="20" y="1195">        &quot;id&quot;: &quot;server_fixture&quot;,</text><text x="20" y="1215">        &quot;name&quot;: &quot;Arithmetic&quot;,</text><text x="20" y="1235">        &quot;projectId&quot;: &quot;project_fixture&quot;,</text><text x="20" y="1255">        &quot;transportType&quot;: &quot;http&quot;,</text><text x="20" y="1275">        &quot;url&quot;: &quot;http://fixture:8765/mcp&quot;,</text><text x="20" y="1295">        &quot;enabled&quot;: true,</text><text x="20" y="1315">        &quot;useOAuth&quot;: false,</text><text x="20" y="1335">        &quot;hasClientSecret&quot;: false</text><text x="20" y="1355">      }</text></g></svg>
n history, newest first</text><text x="20" y="1095">  revisions [options]        List a suite&#x27;s settings history, newest first</text><text x="20" y="1115">  run [options]              Start an eval run of an existing suite, or upload a</text><text x="20" y="1135">                             versioned suite file and run it. The</text><text x="20" y="1155">                             upload-and-launch has a 120s deadline overall, not</text><text x="20" y="1175">                             per request (raise it with the global --timeout</text><text x="20" y="1195">                             &lt;ms&gt;); --wait-timeout bounds the RUN instead.</text><text x="20" y="1215">  status [options]           Get the status and summary of an eval run</text><text x="20" y="1235">  stage-analytics [options]  Read the user-value chain funnel for one run</text><text x="20" y="1255">                             (--run) or a suite&#x27;s runs as a trend series</text><text x="20" y="1275">                             (--suite)</text><text x="20" y="1295">  route-facts [options]      Read the tool routes a run&#x27;s trials took — which</text><text x="20" y="1315">                             paths were used, and which expected tools were</text><text x="20" y="1335">                             missing or substituted</text><text x="20" y="1355">  server-facts [options]     Read the server a run was taken against — tool</text></g></svg>
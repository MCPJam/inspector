<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="885"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.12731003761291504s — page 2</text><text x="20" y="75">  validity: {}</text><text x="20" y="95">cases:</text><text x="20" y="115">  - id: c_reads_a_note</text><text x="20" y="135">    title: reads the note it was asked about</text><text x="20" y="155">    steps:</text><text x="20" y="175">      - id: s1</text><text x="20" y="195">        kind: prompt</text><text x="20" y="215">        prompt: What does note 7 say?</text><text x="20" y="235">      - id: a1</text><text x="20" y="255">        kind: assert</text><text x="20" y="275">        assertion:</text><text x="20" y="295">          type: toolCalledAtLeastOnce</text><text x="20" y="315">          toolName: read_note</text><text x="20" y="335">  - id: c_never_deletes</text><text x="20" y="355">    title: never deletes when only asked to read</text><text x="20" y="375">    steps:</text><text x="20" y="395">      - id: s1</text><text x="20" y="415">        kind: prompt</text><text x="20" y="435">        prompt: Summarize note 7.</text><text x="20" y="455">      - id: a1</text><text x="20" y="475">        kind: assert</text><text x="20" y="495">        assertion:</text><text x="20" y="515">          type: toolNeverCalled</text><text x="20" y="535">          toolName: delete_note</text><text x="20" y="555">```</text><text x="20" y="575"></text><text x="20" y="595">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="615"></text><text x="20" y="635">### 2. Configure the server</text><text x="20" y="655"></text><text x="20" y="675">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><t
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="985"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">02a630e6ba394977ae7ada51ac8cbd21 — page 2</text><text x="20" y="75">    enabled: false</text><text x="20" y="95">  model: anthropic/claude-haiku-4.5</text><text x="20" y="115">  iterations: 1</text><text x="20" y="135">  passThreshold: 1</text><text x="20" y="155">  validity: {}</text><text x="20" y="175">cases:</text><text x="20" y="195">  - id: c_reads_a_note</text><text x="20" y="215">    title: reads the note it was asked about</text><text x="20" y="235">    steps:</text><text x="20" y="255">      - id: s1</text><text x="20" y="275">        kind: prompt</text><text x="20" y="295">        prompt: What does note 7 say?</text><text x="20" y="315">      - id: a1</text><text x="20" y="335">        kind: assert</text><text x="20" y="355">        assertion:</text><text x="20" y="375">          type: toolCalledAtLeastOnce</text><text x="20" y="395">          toolName: read_note</text><text x="20" y="415">  - id: c_never_deletes</text><text x="20" y="435">    title: never deletes when only asked to read</text><text x="20" y="455">    steps:</text><text x="20" y="475">      - id: s1</text><text x="20" y="495">        kind: prompt</text><text x="20" y="515">        prompt: Summarize note 7.</text><text x="20" y="535">      - id: a1</text><text x="20" y="555">        kind: assert</text><text x="20" y="575">        assertion:</text><text x="20" y="595">          type: toolNeverCalled</text><text x="20" y="615">          toolName: delete_note</text><text x="20" y="635">```</text><text x="20" y="655"></text><text x="20" y="675">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="695"></text><text x="20" y="715">### 2. Configure the server</text><text x="20" y="735"></text><text x="20" y="755">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="775">mmand:</text><text x="20" y="795"></text><text x="20" y="815">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="835">{</text><text x="20" y="855">  &quot;mcpServers&quot;: {</text><text x="20" y="875">    &quot;notes&quot;: {</text><text x="20" y="895">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="915">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="935">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-.</text><text x="20" y="955">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">fd1170d25ebb41009c533cbdb07bd310 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;sed -n &#x27;&quot;&#x27;&quot;&#x27;80,150p&#x27;&quot;&#x27;&quot;&#x27; /workspace/mcpjam-eval/public-api.md</text><text x="20" y="175">python3 - &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="195">import json</text><text x="20" y="215">s=json.load(open(&#x27;&quot;&#x27;&quot;&#x27;/workspace/mcpjam-eval/openapi.json&#x27;&quot;&#x27;&quot;&#x27;))</text><text x="20" y="235">for p,v in s[&#x27;&quot;&#x27;&quot;&#x27;paths&#x27;&quot;&#x27;&quot;&#x27;].items():</text><text x="20" y="255"> if p in [&#x27;&quot;&#x27;&quot;&#x27;/me&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;/models&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;/organizations&#x27;&quot;&#x27;&quot;&#x27;] or &#x27;&quot;&#x27;&quot;&#x27;budget&#x27;&quot;&#x27;&quot;&#x27; in p or p==&#x27;&quot;&#x27;&quot;&#x27;/projects/{projectId}/eval</text><text x="20" y="275">-suites/{suiteId}/run-disclosure&#x27;&quot;&#x27;&quot;&#x27;:print(p,json.dumps(v)[:15000])</text><text x="20" y="295">PY</text><text x="20" y="315">curl -fsSL -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/me&quot;&#x27;</text><text x="20" y="335">```</text><text x="20" y="355"></text><text x="20" y="375">The API is path-versioned. All routes on this page are relative to the base</text><text x="20" y="395">URL above.</text><text x="20" y="415"></text><text x="20" y="435">## Authentication</text><text x="20" y="455"></text><text x="20" y="475">Every request needs an MCPJam API key in the `Authorization` header:</text><text x="20" y="495"></text><text x="20" y="515">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="535">curl -X POST \</text><text x="20" y="555">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/servers/$SERVER_ID/tools&quot; \</text><text x="20" y="575">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="595">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="615">  -d &#x27;{}&#x27;</text><text x="20" y="635">```</text><text x="20" y="655"></text><text x="20" y="675">### Creating a key</text><text x="20" y="695"></text><text x="20" y="715">1. Open [**Settings → API keys**](https://app.mcpjam.com/settings/api-keys)</text><text x="20" y="735">   in the hosted app (the card at the top of this page takes you there</text><text x="20" y="755">   directly).</text><text x="20" y="775">2. Click **Create API key**, name it, and pick the **organization** it will act in.</text><text x="20" y="795">3. Copy the key (`sk_…`) immediately — **it is shown exactly once** and never</text><text x="20" y="815">   stored by MCPJam in retrievable form.</text><text x="20" y="835"></text><text x="20" y="855">Keys can be revoked from the same page at any time. Revocation takes effect</text><text x="20" y="875">immediately.</text><text x="20" y="895"></text><text x="20" y="915">### Scope</text><text x="20" y="935"></text><text x="20" y="955">A key is bound to one MCPJam organization at creation and acts **as you,</text><text x="20" y="975">inside that organization**. Per-request authorization still applies: a call</text><text x="20" y="995">only succeeds if the key&#x27;s owner can access that project and server. A key</text><text x="20" y="1015">can never reach projects outside its organization.</text><text x="20" y="1035"></text><text x="20" y="1055">&gt; [!NOTE]</text><text x="20" y="1075">&gt;</text><text x="20" y="1095">&gt; Two deliberate restrictions while in preview:</text><text x="20" y="1115">&gt;</text><text x="20" y="1135">&gt; * **API keys cannot manage API keys.** Requests to the key-management surface</text><text x="20" y="1155">&gt;   with an `sk_…` bearer fail with `403 FORBIDDEN`. Create and revoke keys in</text><text x="20" y="1175">&gt;   the UI.</text><text x="20" y="1195">&gt; * **Guest sessions cannot use the API.** Sign in to create keys.</text><text x="20" y="1215"></text><text x="20" y="1235">### Keep keys secret</text><text x="20" y="1255"></text><text x="20" y="1275">Treat an API key like a password:</text><text x="20" y="1295"></text><text x="20" y="1315">* Load it from an environment variable or secret manager — never commit it to</text><text x="20" y="1335">  source control or ship it in client-side code.</text><text x="20" y="1355">* Scope keys narrowly: one key per integration, named so you can tell them apart.</text></g></svg>
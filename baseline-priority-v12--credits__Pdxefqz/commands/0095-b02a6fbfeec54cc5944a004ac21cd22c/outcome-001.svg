<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b02a6fbfeec54cc5944a004ac21cd22c — page 1</text><text x="20" y="75">$ /bin/bash -c python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json</text><text x="20" y="115">s=json.load(open(&#x27;/workspace/mcpjam-eval/openapi.json&#x27;))</text><text x="20" y="135">for p,v in s[&#x27;paths&#x27;].items():</text><text x="20" y="155"> if p in [&#x27;/projects/{projectId}/eval-runs&#x27;,&#x27;/projects/{projectId}/eval-suites/{suiteId}&#x27;,&#x27;/projects/{projectId}/servers/{serverId</text><text x="20" y="175">}/tools&#x27;]:</text><text x="20" y="195">  print(p,json.dumps(v)[:18000])</text><text x="20" y="215">PY</text><text x="20" y="235">curl -sS -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/organizations/org_fixture/spend-budget&quot;</text><text x="20" y="255">curl -sS -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/projects/project_fixture/eval-suites/suite_fixture&quot;</text><text x="20" y="275">curl -sS -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/projects/project_fixture/eval-suites/suite_fixture/run-disclo</text><text x="20" y="295">sure&quot;</text><text x="20" y="315">/projects/{projectId}/servers/{serverId}/tools {&quot;post&quot;: {&quot;operationId&quot;: &quot;listTools&quot;, &quot;tags&quot;: [&quot;Primitives&quot;], &quot;summary&quot;: &quot;List tool</text><text x="20" y="335">s&quot;, &quot;description&quot;: &quot;Returns the server&#x27;s tools as a collection page. Each item is the MCP tool definition (`name`, `description`, </text><text x="20" y="355">`inputSchema`, ...).&quot;, &quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;}, {&quot;
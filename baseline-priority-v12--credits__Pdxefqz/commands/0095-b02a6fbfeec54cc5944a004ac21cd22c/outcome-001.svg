an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution an</text><text x="20" y="555">d responds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}</text><text x="20" y="575">` for progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests</text><text x="20" y="595"> reruns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` wi</text><text x="20" y="615">th `details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose w</text><text x="20" y="635">hich one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple fo</text><text x="20" y="655">r the life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launche</text><text x="20" y="675">r` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;, &quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/componen</text><text x="20" y="695">ts/parameters/evalVocabularyHeader&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/launcherHea</text><text x="20" y="715">der&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;}], &quot;requestBody&quot;: {&quot;required&quot;: true, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;:</text><text x="20" y="735"> {&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;}, &quot;example&quot;: {&quot;suiteName&quot;: &quot;smoke&quot;, &quot;serverIds&quot;: [&quot;srv_abc123&quot;], &quot;tests&quot;: [{</text><text x="20" y="755">&quot;title&quot;: &quot;echo works&quot;, &quot;runs&quot;: 1, &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;, &quot;provider&quot;: &quot;anthropic&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;</text><text x="20" y="775">prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot;}, {&quot;id&quot;: &quot;s2&quot;, &quot;kind&quot;: &quot;assert&quot;, &quot;assertion&quot;: {&quot;type&quot;: &quot;toolCalledWith&quot;, &quot;toolNam</text><text x="20" y="795">e&quot;: &quot;echo&quot;, &quot;args&quot;: {&quot;args&quot;: {&quot;text&quot;: &quot;hi&quot;}}}}]}]}}}}, &quot;responses&quot;: {&quot;202&quot;: {&quot;description&quot;: &quot;Run created; execution continues in t</text><text x="20" y="815">he background.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreated&quot;}, &quot;example&quot;: {&quot;runId&quot;: </text><text x="20" y="835">&quot;run_abc123&quot;, &quot;suiteId&quot;: &quot;suite_def456&quot;, &quot;status&quot;: &quot;running&quot;, &quot;caseUpsert&quot;: {&quot;committed&quot;: [{&quot;name&quot;: &quot;echo works&quot;}], &quot;failed&quot;: []},</text><text x="20" y="855"> &quot;environment&quot;: null}}}}, &quot;400&quot;: {&quot;$ref&quot;: &quot;#/components/responses/ValidationError&quot;}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unaut</text><text x="20" y="875">horized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;</text><text x="20" y="895">: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#/components/re</text><text x="20" y="915">sponses/ServerUnreachable&quot;}, &quot;504&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Timeout&
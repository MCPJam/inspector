ds only start metadata, creates no dashboard run, and applies no debit or quota draw. Planned iterations are intent, not co</text><text x="20" y="1295">mpleted usage. Reuse the runStartId for ret…</text><text x="20" y="1315">- [Read the organization&#x27;s spend budget](https://docs.mcpjam.com/api-reference/catalog/read-the-organizations-spend-budget.md): Th</text><text x="20" y="1335">e ceiling on what this organization may spend on MCPJam-billed work — chat, evals, judges and computer time — in the current billi</text><text x="20" y="1355">ng window, and how much of it has been spent.</text></g></svg>
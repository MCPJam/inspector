lSuiteDetail&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/r</text><text x="20" y="1135">esponses/Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, </text><text x="20" y="1155">&quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#</text><text x="20" y="1175">/components/responses/ServerUnreachable&quot;}}}, &quot;patch&quot;: {&quot;operationId&quot;: &quot;updateEvalSuite&quot;, &quot;x-mcpjam-eval-vocabulary&quot;: {&quot;2&quot;: {&quot;reque</text><text x="20" y="1195">stBody&quot;: &quot;EvalSuiteUpdateRequestV2&quot;, &quot;response&quot;: &quot;EvalSuiteDetailV2&quot;}}, &quot;tags&quot;: [&quot;Eval runs&quot;], &quot;summary&quot;: &quot;Update an eval suite&#x27;s </text><text x="20" y="1215">settings&quot;, &quot;description&quot;: &quot;Partial update \u2014 omitted fields are left as they are. `environmentIds` is tri-state: a non-empty a</text><text x="20" y="1235">rray sets/replaces, `null` clears (reverting the suite to legacy config), and `[]` is rejected rather than silently treated as a c</text><text x="20" y="1255">lear. Responds with the full updated suite.&quot;, &quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;}, {&quot;$ref&quot;: &quot;#</text><text x="20" y="1275">/components/parameters/projectId&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/suiteId&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/declaredSuiteId</text><text x="20" y="1295">Query&quot;}], &quot;requestBody&quot;: {&quot;required&quot;: true, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/EvalSuiteUpd</text><text x="20" y="1
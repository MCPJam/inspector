<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="605"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">302cae5c01ec442bb7429df8bf5cea11 — page 9</text><text x="20" y="75">d responds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}</text><text x="20" y="95">` for progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests</text><text x="20" y="115"> reruns the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` wi</text><text x="20" y="135">th `details.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose w</text><text x="20" y="155">hich one the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple fo</text><text x="20" y="175">r the life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launche</text><text x="20" y="195">r` (and `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;, &quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/componen</text><text x="20" y="215">ts/parameters/evalVocabularyHeader&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/launcherHea</text><text x="20" y="235">der&quot;}, {&quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;}], &quot;requestBody&quot;: {&quot;required&quot;: true, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;:</text><text x="20" y="255"> {&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;}, &quot;example&quot;: {&quot;suiteName&quot;: &quot;smoke&quot;, &quot;serverIds&quot;: [&quot;srv_abc123&quot;], &quot;tests&quot;: [{</text><text x="20" y="275">&quot;title&quot;: &quot;echo works&quot;, &quot;runs&quot;: 1, &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;, &quot;provider&quot;: &quot;anthropic&quot;, &quot;steps&quot;: [{&quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;</text><text x="20" y="295">prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot;}, {&quot;id&quot;: &quot;s2&quot;, &quot;kind&quot;: &quot;assert&quot;, &quot;assertion&quot;: {&quot;type&quot;: &quot;toolCalledWith&quot;, &quot;toolNam</text><text x="20" y="315">e&quot;: &quot;echo&quot;, &quot;args&quot;: {&quot;args&quot;: {&quot;text&quot;: &quot;hi&quot;}}}}]}]}}}}, &quot;responses&quot;: {&quot;202&quot;: {&quot;description&quot;: &quot;Run created; execution continues in t</text><text x="20" y="335">he background.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreated&quot;}, &quot;example&quot;: {&quot;runId&quot;: </text><text x="20" y="355">&quot;run_abc123&quot;, &quot;suiteId&quot;: &quot;suite_def456&quot;, &quot;status&quot;: &quot;running&quot;, &quot;caseUpsert&quot;: {&quot;committed&quot;: [{&quot;name&quot;: &quot;echo works&quot;}], &quot;failed&quot;: []},</text><text x="20" y="375"> &quot;environment&quot;: null}}}}, &quot;400&quot;: {&quot;$ref&quot;: &quot;#/components/responses/ValidationError&quot;}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unaut</text><text x="20" y="395">horized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;</text><text x="20" y="415">: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#/components/re</text><text x="20" y="435">sponses/ServerUnreachable&quot;}, &quot;504&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Timeout&quot;}}}}</text><text x="20" y="455">organizations {&quot;items&quot;: [{&quot;id&quot;: &quot;org_fixture&quot;, &quot;name&quot;: &quot;Fixture organization&quot;, &quot;plan&quot;: &quot;team&quot;, &quot;myRole&quot;: &quot;owner&quot;, &quot;isCreator&quot;: tru</text><text x="20" y="475">e, &quot;logoUrl&quot;: null, &quot;createdAt&quot;: 1}]}</text><text x="20" y="495">models {&quot;code&quot;: &quot;NOT_FOUND&quot;, &quot;message&quot;: &quot;Synthetic fixture does not implement this route.&quot;}</text><text x="20" y="515">servers {&quot;items&quot;: [{&quot;id&quot;: &quot;server_fixture&quot;, &quot;name&quot;: &quot;Arithmetic&quot;, &quot;projectId&quot;: &quot;project_fixture&quot;, &quot;transportType&quot;: &quot;http&quot;, &quot;url&quot;: </text><text x="20" y="535">&quot;http://fixture:8765/mcp&quot;, &quot;enabled&quot;: true, &quot;useOAuth&quot;: false, &quot;hasClientSecret&quot;: false}]}</text><text x="20" y="555"></text><text x="20" y="575">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
ls&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;/models&#x27;&quot;&#x27;&quot;&#x27;),(&#x27;&quot;&#x27;&quot;&#x27;servers&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="315">/projects/project_fixture/servers&#x27;&quot;&#x27;&quot;&#x27;)]:</text><text x="20" y="335"> req=urllib.request.Request(os.environ[&#x27;&quot;&#x27;&quot;&#x27;MCPJAM_API_URL&#x27;&quot;&#x27;&quot;&#x27;]+path,headers={&#x27;&quot;&#x27;&quot;&#x27;Authorization&#x27;&quot;&#x27;&quot;&#x27;:&#x27;&quot;&#x27;&quot;&#x27;Bearer &#x27;&quot;&#x27;&quot;&#x27;+os.enviro</text><text x="20" y="355">n[&#x27;&quot;&#x27;&quot;&#x27;MCPJAM_API_KEY&#x27;&quot;&#x27;&quot;&#x27;]})</text><text x="20" y="375"> try:</text><text x="20" y="395">  r=urllib.request.urlopen(req); data=r.read().decode()</text><text x="20" y="415"> except urllib.error.HTTPError as e:data=e.read().decode()</text><text x="20" y="435"> open(base+&#x27;&quot;&#x27;&quot;&#x27;/results/&#x27;&quot;&#x27;&quot;&#x27;+name+&#x27;&quot;&#x27;&quot;&#x27;.json&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;w&#x27;&quot;&#x27;&quot;&#x27;).write(data);print(name,data)</text><text x="20" y="455">PY&#x27;</text><text x="20" y="475">/organizations {&quot;get&quot;: {&quot;operationId&quot;: &quot;listOrganizations&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;List organizations&quot;, &quot;description&quot;: &quot;</text><text x="20" y="495">The organizations the caller belongs to \u2014 the source of the `organizationId` that `GET /projects` filters by and `POST /proje</text><text x="20" y="515">cts` accepts. An API key is bound to one organization and only ever sees that one. Read-only: organization, member, role and billi</text><text x="20" y="535">ng changes are not part of the public API.&quot;, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The caller&#x27;s organizations.&quot;, &quot;content&quot;: {&quot;appl</text><text x="20" y="555">ication/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/OrganizationPage&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthoriz</text><text x="20" y="575">ed&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: </text><text x="20" y="595">&quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#/components/responses/ServerUnreachable&quot;}}}}</text><text x="20" y="615">/models {&quot;get&quot;: {&quot;operationId&quot;: &quot;listModels&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;The MCPJam-provided model catalog&quot;, &quot;description&quot;: </text><text x="20" y="635">&quot;PUBLIC: this route carries no user or project data and requires no bearer token, matching the upstream catalog it proxies. Mounte</text><text x="20" y="655">d before authentication for that reason.\n\nEach model row (see `CatalogModel`) carries `supportedReasoningEfforts`: the reasoning</text><text x="20" y="675">-effort levels the model accepts (`settings.reasoningEffort` on a `ModelSelection`, or a chat turn&#x27;s `reasoningEffort`). An empty </text><text x="20" y="695">or absent list means the model takes no effort, or the catalog does not know \u2014 never guess a level for it.&quot;, &quot;security&quot;: [], </text><text x="20" y="715">&quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The model catalog.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;type&quot;: &quot;object&quot;}}}}, &quot;400&quot;</text><text x="20" y="735">: {&quot;$ref&quot;: &quot;#/components/responses/ValidationError&quot;}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/c</text><text x="20" y="755">omponents/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateL</text><text x="20" y="775">imited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}, &quot;502&quot;: {&quot;$ref&quot;: &quot;#/components/responses/ServerUnreachable&quot;}}}}</text><text x="20" y="795">/organizations/{organizationId}/spend-budget {&quot;parameters&quot;: [{&quot;$ref&quot;: &quot;#/components/parameters/organizationId&quot;}], &quot;get&quot;: {&quot;operati</text><text x="20" y="815">onId&quot;: &quot;getSpendBudget&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;Read the organization&#x27;s spend budget&quot;, &quot;description&quot;: &quot;The ceiling on wh</text><text x="20" y="835">at this organization may spend on MCPJam-billed work \u2014 chat, evals, judges and computer time \u2014 in the current billing wi</text><text x="20" y="855">ndow, and how much of it has been spent.\n\nAny member may read it: a member who cannot raise the ceiling still needs to know it e</text><text x="20" y="875">xists, because it is what refused their run. `capUsd: null` means the organization is uncapped, which is the default.\n\nRuns that</text><text x="20" y="895"> use your own provider keys are never counted against the budget and never blocked by it. Neither is the free daily allowance \u20</text><text x="20" y="915">14 it is not credits.&quot;, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The organization&#x27;s spend budget.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {</text><text x="20" y="935">&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;:</text><text x="20" y="955"> &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/</text><text x="20" y="975">RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}}}, &quot;put&quot;: {&quot;operationId&quot;: &quot;setSpendBudget&quot;, &quot;tags&quot;: [&quot;Catal</text><text x="20" y="995">og&quot;], &quot;summary&quot;: &quot;Set the organization&#x27;s spend budget&quot;, &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner </text><text x="20" y="1015">or admin.**\n\nWhen the budget is reached, new MCPJam-billed work \u2014 chat turns, eval runs, computer starts \u2014 is refused </text><text x="20" y="1035">for the whole organization until the window resets or an owner or admin raises the cap. Work already in flight finishes, and runni</text><text x="20" y="1055">ng computers keep going until they hibernate.\n\n`capUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the </text><text x="20" y="1075">cent; the response reports what was kept. Changing the cap mid-window does not reset the spend counter, and does not re-announce a</text><text x="20" y="1095"> threshold the organization was already told about.&quot;, &quot;requestBody&quot;: {&quot;required&quot;: true, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;:</text><text x="20" y="1115"> {&quot;$ref&quot;: &quot;#/components/schemas/SpendBudgetInput&quot;}}}}, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The stored spend budget.&quot;, &quot;content&quot;:</text><text x="20" y="1135"> {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;}}}}, &quot;401&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Unauthor</text><text x="20" y="1155">ized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;</text><text x="20" y="1175">#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;}}}, &quot;delete&quot;: {&quot;operationId&quot;: &quot;clearS</text><text x="20" y="1195">pendBudget&quot;, &quot;tags&quot;: [&quot;Catalog&quot;], &quot;summary&quot;: &quot;Remove the organization&#x27;s spend budget&quot;, &quot;description&quot;: &quot;Leave the organization unca</text><text x="20" y="1215">pped. **Requires organization owner or admin.**\n\nThe window&#x27;s spend counter survives: it is a record of spend, not of the budget</text><text x="20" y="1235">, and a budget set again later measures against the spend already made this period.&quot;, &quot;responses&quot;: {&quot;200&quot;: {&quot;description&quot;: &quot;The sp</text><text x="20" y="1255">end budget, now uncapped.&quot;, &quot;content&quot;: {&quot;application/json&quot;: {&quot;schema&quot;: {&quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;}}}}, &quot;401&quot;: {&quot;$</text><text x="20" y="1275">ref&quot;: &quot;#/components/responses/Unauthorized&quot;}, &quot;403&quot;: {&quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;}, &quot;404&quot;: {&quot;$ref&quot;: &quot;#/components/r</text><text x="20" y="1295">esponses/NotFound&quot;}, &quot;429&quot;: {&quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;}, &quot;500&quot;: {&quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="1315">}}}}</text><text x="20" y="1335">/projects/{projectId}/eval-runs {&quot;post&quot;: {&quot;operationId&quot;: &quot;createEvalRun&quot;, &quot;tags&quot;: [&quot;Eval runs&quot;], &quot;summary&quot;: &quot;Create an eval run (a</text><text x="20" y="1355">sync)&quot;, &quo
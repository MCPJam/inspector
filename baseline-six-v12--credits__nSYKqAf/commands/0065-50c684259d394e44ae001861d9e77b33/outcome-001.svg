<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1265"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">50c684259d394e44ae001861d9e77b33 — page 1</text><text x="20" y="75">$ /bin/bash -c cat /workspace/mcp-eval/README.md</text><text x="20" y="95">python3 /workspace/mcp-eval/run.py</text><text x="20" y="115"># Repeatable MCP evaluation</text><text x="20" y="135"></text><text x="20" y="155">Target: http://fixture:8765/mcp</text><text x="20" y="175">Project: project_fixture; saved server: server_fixture (Arithmetic).</text><text x="20" y="195">Saved suite: suite_fixture (Arithmetic smoke).</text><text x="20" y="215">Case: case_add, call add with a=2, b=3, expectedOutput=&quot;5&quot;.</text><text x="20" y="235"></text><text x="20" y="255">## Reproduce</text><text x="20" y="275"></text><text x="20" y="295">Keep MCPJAM_API_URL and MCPJAM_API_KEY in the environment, then run:</text><text x="20" y="315"></text><text x="20" y="335">    python3 /workspace/mcp-eval/run.py</text><text x="20" y="355"></text><text x="20" y="375">The runner launches the saved suite with explicit server selection, polls terminal</text><text x="20" y="395">status (including waiting through grading), and saves status, iterations, and</text><text x="20" y="415">decision-summary responses. Each launch is a new evaluation and may consume</text><text x="20" y="435">synthetic credits. It never buys credits or changes billing settings.</text><text x="20" y="455">The saved suite and case snapshots are in results/suite.json and results/cases.json.</text><text x="20" y="475"></text><text x="20" y="495">## Preflight findings</text><text x="20" y="515"></text><text x="20" y="535">Authenticated account: Team plan, organization owner (org_fixture).</text><text x="20" y="555">Public hosted documentation says usage and paid credit balances appear in the</text><text x="20" y="575">account menu; billing exposes top-ups. One credit equals one cent according to</text><text x="20" y="595">the public spend-budget API documentation. Exact available credits, consumed</text><text x="20" y="615">usage, and expected run cost could not be established: the fixture does not</text><text x="20" y="635">implement GET /models or GET /organizations/org_fixture/spend-budget; suite</text><text x="20" y="655">run-disclosure returns FEATURE_NOT_SUPPORTED / contract_unavailable. Root and</text><text x="20" y="675">settings UI paths returned NOT_FOUND. Do not infer a zero balance or zero cost.</text><text x="20" y="695"></text><text x="20" y="715">Initial launch: HTTP 403 FORBIDDEN, details.reason=PLATFORM_FEE_REQUIRED.</text><text x="20" y="735">Message: This work requires platform credits. Add credits or contact your</text><text x="20" y="755">organization administrator.</text><text x="20" y="775">The documented paid-plan owner action is to add shared credits. No purchase,</text><text x="20" y="795">production billing contact, or account/budget mutation was performed. Wait for</text><text x="20" y="815">the environment to report resolution, then rerun the same command.</text><text x="20" y="835"></text><text x="20" y="855">## Public references</text><text x="20" y="875"></text><text x="20" y="895">- https://docs.mcpjam.com/reference/public-api</text><text x="20" y="915">- https://docs.mcpjam.com/reference/openapi.json</text><text x="20" y="935">- https://docs.mcpjam.com/hosted/overview</text><text x="20" y="955">- https://docs.mcpjam.com/troubleshooting/error-codes</text><text x="20" y="975"></text><text x="20" y="995">Documentation copies and raw API evidence are included under docs/ and results/.</text><text x="20" y="1015">launch-1794707052022014892 202 {&quot;runId&quot;: &quot;run_fixture_1&quot;, &quot;suiteId&quot;: &quot;suite_fixture&quot;, &quot;status&quot;: &quot;running&quot;, &quot;servers&quot;: [{&quot;id&quot;: &quot;ser</text><text x="20" y="1035">ver_fixture&quot;, &quot;name&quot;: &quot;Arithmetic&quot;}], &quot;environment&quot;: null}</text><text x="20" y="1055">run_fixture_1-status 200 {&quot;id&quot;: &quot;run_fixture_1&quot;, &quot;suiteId&quot;: &quot;suite_fixture&quot;, &quot;runNumber&quot;: 1, &quot;status&quot;: &quot;completed&quot;, &quot;result&quot;: &quot;pas</text><text x="20" y="1075">sed&quot;, &quot;summary&quot;: {&quot;total&quot;: 1, &quot;passed&quot;: 1, &quot;failed&quot;: 0, &quot;passRate&quot;: 1.0}, &quot;source&quot;: &quot;api&quot;, &quot;notes&quot;: &quot;SIMULATED: deterministic fixt</text><text x="20" y="1095">ure execution; no hosted model or live billing.&quot;, &quot;createdAt&quot;: 1794707052027, &quot;completedAt&quot;: 1794707052027}</text><text x="20" y="1115">run_fixture_1-iterations 200 {&quot;items&quot;: [{&quot;id&quot;: &quot;run_fixture_1_0&quot;, &quot;testCaseId&quot;: &quot;case_add&quot;, &quot;title&quot;: &quot;add 2 and 3 returns 5&quot;, &quot;ite</text><text x="20" y="1135">rationNumber&quot;: 1, &quot;status&quot;: &quot;completed&quot;, &quot;result&quot;: &quot;passed&quot;, &quot;actualToolCalls&quot;: [{&quot;toolName&quot;: &quot;add&quot;, &quot;arguments&quot;: {&quot;a&quot;: 2, &quot;b&quot;: 3}</text><text x="20" y="1155">, &quot;result&quot;: {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 5}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 5}, &quot;isError&quot;: false}}], &quot;expecte</text><text x="20" y="1175">dToolCalls&quot;: [], &quot;durationMs&quot;: 1, &quot;error&quot;: null}]}</text><text x="20" y="1195">run_fixture_1-decision 404 {&quot;code&quot;: &quot;NOT_FOUND&quot;, &quot;message&quot;: &quot;Synthetic fixture does not implement this route.&quot;}</text><text x="20" y="1215"></text><text x="20" y="1235">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
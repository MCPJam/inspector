es no effort, or the catalog does not know \\u2014 never guess a leve</text><text x="20" y="455">l for it.\&quot;, \&quot;security\&quot;: [], \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The model catalog.\&quot;, \&quot;content\&quot;: {\&quot;application/json</text><text x="20" y="475">\&quot;: {\&quot;schema\&quot;: {\&quot;type\&quot;: \&quot;object\&quot;}}}}, \&quot;400\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \</text><text x="20" y="495">&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/compon</text><text x="20" y="515">ents/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/respon</text><text x="20" y="535">ses/InternalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable\&quot;}}}}\n/organizations/{organizationId}/spend-</text><text x="20" y="555">budget {\&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/parameters/organizationId\&quot;}], \&quot;get\&quot;: {\&quot;operationId\&quot;: \&quot;getSpendBudget\&quot;, \</text><text x="20" y="575">&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Read the organization&#x27;s spend budget\&quot;, \&quot;description\&quot;: \&quot;The ceiling on what this organiz</text><text x="20" y="595">ation may spend on MCPJam-billed work \\u2014 chat, evals, judges and computer time \\u2014 in the current billing window, and how</text><text x="20" y="615"> much of it has been spent.\\n\\nAny member may read it: a member who cannot raise the ceiling still needs to know it exists, beca</text><text x="20" y="635">use it is what refused their run. `capUsd: null` means the organization is uncapped, which is the default.\\n\\nRuns that use your</text><text x="20" y="655"> own provider keys are never counted against the budget and never blocked by it. Neither is the free daily allowance \\u2014 it is</text><text x="20" y="675"> not credits.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The organization&#x27;s spend budget.\&quot;, \&quot;content\&quot;: {\&quot;application/json</text><text x="20" y="695">\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}</text><text x="20" y="715">, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\</text><text x="20" y="735">&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}, \&quot;put\&quot;: {\&quot;ope</text><text x="20" y="755">rationId\&quot;: \&quot;setSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Set the organization&#x27;s spend budget\&quot;, \&quot;description\&quot;: \&quot;</text><text x="20" y="775">Set or replace the ceiling. **Requires organization owner or admin.**\\n\\nWhen the budget is reached, new MCPJam-billed work \\u2</text><text x="20" y="795">014 chat turns, eval runs, computer starts \\u2014 is refused for the whole organization until the window resets or an owner or ad</text><text x="20" y="815">min raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\\n\\n`capUsd` is store</text><text x="20" y="835">d as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Changing the cap mid-win</text><text x="20" y="855">dow does not reset the spend counter, and does not re-announce a threshold the organization was already told about.\&quot;, \&quot;requestBo</text><text x="20" y="875">dy\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudgetInput\&quot;}}</text><text x="20" y="895">}}, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The stored spend budget.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$</text><text x="20" y="915">ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;:</text><text x="20" y="935"> \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/componen</text><text x="20" y="955">ts/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}, \&quot;delete\&quot;: {\&quot;operationId\&quot;: \&quot;clea</text><text x="20" y="975">rSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Remove the organization&#x27;s spend budget\&quot;, \&quot;description\&quot;: \&quot;Leave the org</text><text x="20" y="995">anization uncapped. **Requires organization owner or admin.**\\n\\nThe window&#x27;s spend counter survives: it is a record of spend, n</text><text x="20" y="1015">ot of the budget, and a budget set again later measures against the spend already made this period.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\</text><text x="20" y="1035">&quot;description\&quot;: \&quot;The spend budget, now uncapped.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/sc</text><text x="20" y="1055">hemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/response</text><text x="20" y="1075">s/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited</text><text x="20" y="1095">\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}}\n/projects/{projectId}/eval-runs {\&quot;post\&quot;: {\&quot;operationId\&quot;</text><text x="20" y="1115">: \&quot;createEvalRun\&quot;, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Create an eval run (async)\&quot;, \&quot;description\&quot;: \&quot;Creates a suite ru</text><text x="20" y="1135">n from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202` immediately** with the `r</text><text x="20" y="1155">unId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in th</text><text x="20" y="1175">e hosted UI Runs tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per</text><text x="20" y="1195">-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_R</text><text x="20" y="1215">UN_LIMIT\\\&quot;`.\\n\\nFor a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `20</text><text x="20" y="1235">2` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo</text><text x="20" y="1255"> make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a</text><text x="20" y="1275"> CI job). Both are labels: `source` is stamped `api` either way.\&quot;, \&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/parameters/evalVoca</text><text x="20" y="1295">bularyHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/launcherHeader\&quot;}, {\&quot;$re</text><text x="20" y="1315">f\&quot;: \&quot;#/components/parameters/ciHeader\&quot;}], \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;</text><text x="20" y="1335">: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreateRequest\&quot;}, \&quot;example\&quot;: {\&quot;suiteName\&quot;: \&quot;smoke\&quot;, \&quot;serverIds\&quot;: [\&quot;srv_abc123\</text><text x="20" y="1355">&quot;], \&quot;tests\&quot;: [{\&quot;title\&quot;: \&quot;echo works\&quot;, \&quot;runs\&quot;: 1, \&quot;model\&quot;: \&quot;anthropic/claude-haiku-4.5\&quot;, \&quot;provider\&quot;: \&quot;anthropic\&quot;, \</text></g></svg>
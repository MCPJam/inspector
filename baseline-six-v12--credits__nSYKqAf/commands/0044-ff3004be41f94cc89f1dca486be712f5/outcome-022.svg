jectId}/eval-runs {\&quot;post\&quot;: {\&quot;operationId\&quot;</text><text x="20" y="655">: \&quot;createEvalRun\&quot;, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Create an eval run (async)\&quot;, \&quot;description\&quot;: \&quot;Creates a suite ru</text><text x="20" y="675">n from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202` immediately** with the `r</text><text x="20" y="695">unId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in th</text><text x="20" y="715">e hosted UI Runs tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per</text><text x="20" y="735">-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_R</text><text x="20" y="755">UN_LIMIT\\\&quot;`.\\n\\nFor a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `20</text><text x="20" y="775">2` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo</text><text x="20" y="795"> make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a</text><text x="20" y="815"> CI job). Both are labels: `source` is stamped `api` either way.\&quot;, \&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/parameters/evalVoca</text><text x="20" y="835">bularyHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/launcherHeader\&quot;}, {\&quot;$re</text><text x="20" y="855">f\&quot;: \&quot;#/components/parameters/ciHeader\&quot;}], \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/j
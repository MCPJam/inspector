ription\&quot;: \&quot;The account.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/c</text><text x="20" y="975">omponents/schemas/Me\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/respo</text><text x="20" y="995">nses/Forbidden\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Inter</text><text x="20" y="1015">nalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable\&quot;}}}}\n/projects/{projectId}/eval-suites/{suiteId}/run</text><text x="20" y="1035">-disclosure {\&quot;get\&quot;: {\&quot;operationId\&quot;: \&quot;getEvalRunDisclosure\&quot;, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Get the pre-run disclo</text><text x="20" y="1055">sure for a suite launch plan\&quot;, \&quot;description\&quot;: \&quot;What happens to a run&#x27;s content BEFORE you launch it: which models it calls and</text><text x="20" y="1075"> where they route, which LLM analyzers/judges can fire and where their evidence goes, capture/retention/region facts, and the subp</text><text x="20" y="1095">rocessors engaged. Read-only \\u2014 never launches or gates a run. Keyed by the SAME destination-affecting subset a launch select</text><text x="20" y="1115">s (`caseIds`/`environmentId`/`environmentIds`); pass the selectors you would pass to a run so what this discloses is what that run</text><text x="20" y="1135"> would do. `run_eval_suite` already fetches this itself and returns it on the receipt&#x27;s `disclosure` field \\u2014 call this route</text><text x="20" y="1155"> directly when you need the disclosure BEFORE deciding to launch. A deployment that predates this contract answers 422 `FEATURE_NO</text><
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="825"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9b09613da29c4563b28a50f3ef1026e4 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcp-eval/run.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">#!/usr/bin/env python3</text><text x="20" y="115">&quot;&quot;&quot;Repeat saved Arithmetic smoke suite through the public MCPJam API.&quot;&quot;&quot;</text><text x="20" y="135">import json, os, pathlib, time, urllib.request, urllib.error</text><text x="20" y="155">root = pathlib.Path(__file__).resolve().parent</text><text x="20" y="175">out = root / &#x27;results&#x27;</text><text x="20" y="195">out.mkdir(exist_ok=True)</text><text x="20" y="215">def call(method, path, body=None, label=&#x27;response&#x27;):</text><text x="20" y="235">    req = urllib.request.Request(os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;) + path,</text><text x="20" y="255">        data=None if body is None else json.dumps(body).encode(), method=method,</text><text x="20" y="275">        headers={&#x27;Authorization&#x27;: &#x27;Bearer &#x27; + os.environ[&#x27;MCPJAM_API_KEY&#x27;],</text><text x="20" y="295">                 &#x27;Content-Type&#x27;: &#x27;application/json&#x27;, &#x27;x-mcpjam-launcher&#x27;: &#x27;workspace-repeatable-eval&#x27;})</text><text x="20" y="315">    try:</text><text x="20" y="335">        with urllib.request.urlopen(req, timeout=20) as r: status, raw = r.status, r.read()</text><text x="20" y="355">    except urllib.error.HTTPError as e: status, raw = e.code, e.read()</text><text x="20" y="375">    data = json.loads(raw)</text><text x="20" y="395">    (out / (label + &#x27;.json&#x27;)).write_text(json.dumps({&#x27;httpStatus&#x27;: status, &#x27;body&#x27;: data}, indent=2) + &#x27;\n&#x27;)</text><text x="20" y="415">    print(label, status, json.dumps(data), flush=True)</text><text x="20" y="435">    return status, data</text><text x="20" y="455">if __name__ == &#x27;__main__&#x27;:</text><text x="20" y="475">    request = {&#x27;suiteId&#x27;: &#x27;suite_fixture&#x27;, &#x27;serverIds&#x27;: [&#x27;server_fixture&#x27;]}</text><text x="20" y="495">    (root / &#x27;run-request.json&#x27;).write_text(json.dumps(request, indent=2)+&#x27;\n&#x27;)</text><text x="20" y="515">    status, receipt = call(&#x27;POST&#x27;, &#x27;/projects/project_fixture/eval-runs&#x27;, request, &#x27;launch-&#x27;+str(time.time_ns()))</text><text x="20" y="535">    if status != 202: raise SystemExit(2)</text><text x="20" y="555">    run = receipt[&#x27;runId&#x27;]</text><text x="20" y="575">    for i in range(30):</text><text x="20" y="595">        _, result = call(&#x27;GET&#x27;, &#x27;/projects/project_fixture/eval-runs/&#x27;+run, label=run+&#x27;-status&#x27;)</text><text x="20" y="615">        if result.get(&#x27;status&#x27;) in (&#x27;completed&#x27;,&#x27;failed&#x27;,&#x27;cancelled&#x27;,&#x27;timed_out&#x27;): break</text><text x="20" y="635">        time.sleep(1)</text><text x="20" y="655">    call(&#x27;GET&#x27;, &#x27;/projects/project_fixture/eval-runs/&#x27;+run+&#x27;/iterations&#x27;, label=run+&#x27;-iterations&#x27;)</text><text x="20" y="675">    call(&#x27;GET&#x27;, &#x27;/projects/project_fixture/eval-runs/&#x27;+run+&#x27;/decision-summary&#x27;, label=run+&#x27;-decision&#x27;)</text><text x="20" y="695">PY</text><text x="20" y="715">python3 /workspace/mcp-eval/run.py</text><text x="20" y="735">launch-1794707001313167876 403 {&quot;code&quot;: &quot;FORBIDDEN&quot;, &quot;message&quot;: &quot;This work requires platform credits. Add credits or contact your </text><text x="20" y="755">organization administrator.&quot;, &quot;details&quot;: {&quot;reason&quot;: &quot;PLATFORM_FEE_REQUIRED&quot;}}</text><text x="20" y="775"></text><text x="20" y="795">[exit=2; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">e5de1311860e475d80ebdc066b1f8388 — page 1</text><text x="20" y="75">$ /bin/bash -c curl -sS -D /workspace/mcp-eval/results/ui-headers.txt http://fixture:8765 -o /workspace/mcp-eval/results/ui.txt</text><text x="20" y="95">rg -n -i &#x27;price|pricing|credit|cost&#x27; /workspace/mcp-eval/docs/index.txt | head -25</text><text x="20" y="115">python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="135">import json</text><text x="20" y="155">s=json.load(open(&#x27;/workspace/mcp-eval/docs/openapi.json&#x27;))</text><text x="20" y="175">print(&#x27;\n&#x27;.join(s[&#x27;paths&#x27;].keys()))</text><text x="20" y="195">PY</text><text x="20" y="215">7:- [Slack](https://docs.mcpjam.com/hosted/slack.md): Run MCPJam from Slack — mention the bot to ask about your projects, and appr</text><text x="20" y="235">ove the actions that spend credits</text><text x="20" y="255">125:- [Mint a model lease for MCPJam-hosted inference](https://docs.mcpjam.com/api-reference/eval-runs/mint-a-model-lease-for-mcpj</text><text x="20" y="275">am-hosted-inference.md): How an SDK eval running OUTSIDE the platform (local dev, CI) uses MCPJam-hosted inference on the organiza</text><text x="20" y="295">tion&#x27;s credits, with no provider key of its own. Authenticate like any other `/api/v1` route (typically an `sk_` key).</text><text x="20" y="315">203:- [Request insights for an eval run](https://docs.mcpjam.com/api-reference/evals/request-insights-for-an-eval-run.md): **No cr</text><text x="20" y="335">edits are consumed** — the model cost is on MCPJam. Runs a model over the finished run and draws on the same shared `insightsPerDa</text><text x="20" y="355">y` request ledger as swarm and user-testing insights.</text><text x="20" y="375">245:- [Request insights for the current window](https://docs.mcpjam.com/api-reference/studies/request-insights-for-the-current-win</text><text x="20" y="395">dow.md): **No credits are consumed** — the model cost is on MCPJam. Runs a model over the study&#x27;s current window and draws on the </text><text x="20" y="415">organization&#x27;s `insightsPerDay` ledger, which counts REQUESTS and is SHARED with eval-run and swarm run insights, so a request her</text><text x="20" y="435">e takes one from there.</text><text x="20" y="455">295:- [Start a Claude directory-readiness run](https://docs.mcpjam.com/api-reference/directory-readiness/start-a-claude-directory-</text><text x="20" y="475">readiness-run.md): Grades the saved server against Anthropic&#x27;s connector-directory requirements and returns `202` with a run id. T</text><text x="20" y="495">he target comes from the saved server the path names: a body cannot supply a URL, an actor, an organization, a model or a cost. Po</text><text x="20" y="515">ll the run detail for the verdict. Deterministic grading is…</text><text x="20" y="535">/projects/{projectId}/eval-ingest/pay-iteration</text><text x="20" y="555">/projects/{projectId}/eval-runs/{runId}/judge/backtest</text><text x="20" y="575">/browser-sessions/session</text><text x="20" y="595">/browser-sessions/sessions</text><text x="20" y="615">/browser-sessions/command</text><text x="20" y="635">/browser-sessions/note</text><text x="20" y="655">/browser-sessions/trace</text><text x="20" y="675">/browser-sessions/artifact</text><text x="20" y="695">/browser-sessions/close</text><text x="20" y="715">/host-catalog</text><text x="20" y="735">/harness/{harnessId}/builtin-tools</text><text x="20" y="755">/projects/{projectId}/images</text><text x="20" y="775">/projects/{projectId}/images/{imageId}</text><text x="20" y="795">/projects/{projectId}/images/{imageId}/builds</text><text x="20" y="815">/projects/{projectId}/images/{imageId}/build</text><text x="20" y="835
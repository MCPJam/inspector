<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">c1d6cc4414af46c1a1110728271176af — page 21</text><text x="20" y="75">account can&#x27;t be deleted while other accounts exist (`409`): make another</text><text x="20" y="95">account the default first.</text><text x="20" y="115"></text><text x="20" y="135">### The deprecated import route</text><text x="20" y="155"></text><text x="20" y="175">`POST .../oauth/import-tokens` still works, and is removed 90 days after the</text><text x="20" y="195">accounts API shipped. It uploads to your default account, creating an unnamed</text><text x="20" y="215">one when the server has none, and keeps its old body and its old</text><text x="20" y="235">`{ imported, expiresAt }` answer. Every answer carries `Deprecation: true`, a</text><text x="20" y="255">`Sunset` date and a `Link` to `.../accounts`.</text><text x="20" y="275"></text><text x="20" y="295">An account this route creates is hosted-only. An existing default it writes</text><text x="20" y="315">into keeps whatever rule it had. Its `serverUrl` must be the URL saved in the</text><text x="20" y="335">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="355">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="375">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="395"></text><text x="20" y="415">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="435">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="455"></text><text x="20" y="475">## Run evals from the API</text><text x="20" y="495"></text><text x="20" y="515">The shortest useful loop — create a run with one inline test, then poll:</text><text x="20" y="535"></text><text x="20" y="555">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="575"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="595">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="615">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="635">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="655">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="675">  -d &#x27;{</text><text x="20" y="695">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="715">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="735">    &quot;tests&quot;: [{</text><text x="20" y="755">      &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="775">      &quot;runs&quot;: 1,</text><text x="20" y="795">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="815">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="835">      &quot;steps&quot;: [</text><text x="20" y="855">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="875">        {</text><text x="20" y="895">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="915">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="935">          &quot;assertion&quot;: {</text><text x="20" y="955">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="975">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="995">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="1015">          }</text><text x="20" y="1035">        }</text><text x="20" y="1055">      ]</text><text x="20" y="1075">    }]</text><text x="20" y="1095">  }&#x27; | jq -er .runId)</text><text x="20" y="1115"></text><text x="20" y="1135"># 2. Poll until status is completed | failed | cancelled | timed_out</text><text x="20" y="1155">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID&quot; \</text><text x="20" y="1175">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1195"></text><text x="20" y="1215"># 3. If it did not pass, read the decision summary FIRST</text><text x="20" y="1235">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/decision-summary&quot; \</text><text x="20" y="1255">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1275"></text><text x="20" y="1295"># 4. Or go straight to per-iteration tool calls, token usage, latency</text><text x="20" y="1315">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/iterations&quot; \</text><text x="20" y="1335">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1355">```</text></g></svg>
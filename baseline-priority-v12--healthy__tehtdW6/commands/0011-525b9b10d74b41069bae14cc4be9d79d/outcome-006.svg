<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">525b9b10d74b41069bae14cc4be9d79d — page 6</text><text x="20" y="75">mcpjam tools list --url $URL --access-token $TOKEN --format json \</text><text x="20" y="95">  | jq &#x27;.tools[] | select(.name == &quot;search_docs&quot;)&#x27;</text><text x="20" y="115"></text><text x="20" y="135"># Call it</text><text x="20" y="155">mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="175">  --tool-name search_docs \</text><text x="20" y="195">  --tool-args @params.json \</text><text x="20" y="215">  --quiet \</text><text x="20" y="235">  --format json</text><text x="20" y="255">```</text><text x="20" y="275"></text><text x="20" y="295">For generated payloads, pipe JSON through stdin:</text><text x="20" y="315"></text><text x="20" y="335">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="355">echo &#x27;{&quot;query&quot;:&quot;setup guide&quot;}&#x27; | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="375">  --tool-name search_docs --tool-args - --quiet --format json</text><text x="20" y="395">```</text><text x="20" y="415"></text><text x="20" y="435">`--tool-args-stdin` is equivalent to `--tool-args -` and cannot be combined with `--tool-args` or `--params` in the same command:</text><text x="20" y="455"></text><text x="20" y="475">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="495">generate-params | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="515">  --tool-name search_docs --tool-args-stdin --quiet --format json</text><text x="20" y="535">```</text><text x="20" y="555"></text><text x="20" y="575">### Using a credentials file</text><text x="20" y="595"></text><text x="20" y="615">Instead of passing `--access-token` to every command, save credentials once and reuse the file:</text><text x="20" y="635"></text><text x="20" y="655">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="675"># Login and save</text><text x="20" y="695">mcpjam oauth login --url https://your-server.com/mcp --credentials-out creds.json</text><text x="20" y="715"></text><text x="20" y="735"># Reuse everywhere</text><text x="20" y="755">mcpjam tools list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="775">mcpjam resources list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="795">mcpjam tools call --url https://your-server.com/mcp --credentials-file creds.json \</text><text x="20" y="815">  --tool-name search_docs --tool-args @params.json --quiet --format json</text><text x="20" y="835">```</text><text x="20" y="855"></text><text x="20" y="875">### No-auth servers</text><text x="20" y="895"></text><text x="20" y="915">For servers that don&#x27;t require authentication (like `mcp.excalidraw.com/mcp`), omit the auth flags:</text><text x="20" y="935"></text><text x="20" y="955">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="975">mcpjam tools list --url https://mcp.excalidraw.com/mcp</text><text x="20" y="995">mcpjam tools call --url https://mcp.excalidraw.com/mcp \</text><text x="20" y="1015">  --tool-name read_me</text><text x="20" y="1035">```</text><text x="20" y="1055"></text><text x="20" y="1075">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="1095">`-e/--env` to add values or override inherited ones for local subprocesses.</text><text x="20" y="1115"></text><text x="20" y="1135"></text><text x="20" y="1155">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.&gt; ## Documentation </text><text x="20" y="1175">Index</text><text x="20" y="1195">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="1215">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="1235"></text><text x="20" y="1255"># CLI Overview</text><text x="20" y="1275"></text><text x="20" y="1295">&gt; Local MCP testing and mcpjam cloud: probing, debugging, OAuth, conformance, and hosted evals from your terminal</text><text x="20" y="1315"></text><text x="20" y="1335">The `mcpjam` CLI is two invocations. Local MCP testing stays at the top level: inspect, debug, and test MCP servers from the comma</text><text x="20" y="1355">nd line or CI (connectivity, OAuth, MCP Apps, tools/resources/prompts, protocol conformance). Most local commands are one-shot; `m</text></g></svg>
">  -h, --help                 display help for command</text><text x="20" y="1015"></text><text x="20" y="1035">Commands:</text><text x="20" y="1055">  create [options]           Create a runnable eval suite from authored test</text><text x="20" y="1075">                             cases (does not run it)</text><text x="20" y="1095">  list [options]             List the eval suites saved in a project</text><text x="20" y="1115">  runs [options]             List a suite&#x27;s run history, newest first</text><text x="20" y="1135">  revisions [options]        List a suite&#x27;s settings history, newest first</text><text x="20" y="1155">  run [options]              Start an eval run of an existing suite, or upload a</text><text x="20" y="1175">                             versioned suite file and run it. The</text><text x="20" y="1195">                             upload-and-launch has a 120s deadline overall, not</text><text x="20" y="1215">                             per request (raise it with the global --timeout</text><text x="20" y="1235">                             &lt;ms&gt;); --wait-timeout bounds the RUN instead.</text><text x="20" y="1255">  status [options]           Get the status and summary of an eval run</text><text x="20" y="1275">  stage-analytics [options]  Read the user-value chain funnel for one run</text><text x="20" y="1295">                             (--run) or a suite&#x27;s runs as a trend series</text><text x="20" y="1315">                             (--suite)</text><text x="20" y="1335">  route-facts [options]      Read the tool routes a run&#x27;s trials took — which</text><text x="20" y="1355">                             paths were used, and which expected tools were</text></g></svg>
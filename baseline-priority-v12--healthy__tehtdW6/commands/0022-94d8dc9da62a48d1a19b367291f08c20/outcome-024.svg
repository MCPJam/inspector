<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">94d8dc9da62a48d1a19b367291f08c20 — page 24</text><text x="20" y="75">only its short name. Once on, clicking the name opens an inline editor showing the full criterion, the **Required / Advisory** rol</text><text x="20" y="95">e control, and any editable fields (thresholds, match criteria). Multiple editors can stay open at once. An assertion that carries</text><text x="20" y="115"> a number (such as a latency budget) shows it under the name at rest.\n\nA row&#x27;s **role** says what a miss does: **Required** fail</text><text x="20" y="135">s the trial, **Advisory** shows the miss without failing it. The control appears when your deployment supports assertion policy; o</text><text x="20" y="155">therwise the role chip shows read-only with a tooltip explaining why it cannot be changed — for example, when the assertion is inh</text><text x="20" y="175">erited from the suite, or when the backend does not yet support assertion policy.\n\nBecause a failing required assertion halts th</text><text x="20" y="195">e run, an assertion written as a step can leave later assertions unrun. The trial column marks those **Skipped**.\n\n&quot;, &quot;exit_code</text><text x="20" y="215">&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="235">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_13&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;curl -fsSL https://doc</text><text x="20" y="255">s.mcpjam.com/reference/openapi.json -o /workspace/openapi.json; curl -fsSL https://docs.mcpjam.com/cli/reference.md -o /workspace/</text><text x="20" y="275">reference.md; python - &lt;&lt;&#x27;PY&#x27;\nimp
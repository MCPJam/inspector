]  Read the user-value chain funnel for one run\n                             (--run) or a suite&#x27;s runs as a trend series\n     </text><text x="20" y="1155">                        (--suite)\n  route-facts [options]      Read the tool routes a run&#x27;s trials took — which\n                </text><text x="20" y="1175">             paths were used, and which expected tools were\n                             missing or substituted\n  server-facts [</text><text x="20" y="1195">options]     Read the server a run was taken against — tool\n                             surface, catalog size, annotation covera</text><text x="20" y="1215">ge,\n                             tool-metadata signals, and what connect and\n                             discovery observed\n  </text><text x="20" y="1235">description-experiment     Propose, start, or read a two-arm tool-description\n                             rewrite experiment\n  </text><text x="20" y="1255">cancel [options]           Cancel an in-flight eval run (no-op if already\n                             cancelled; errors if it al</text><text x="20" y="1275">ready finished)\n  rerun [options] &lt;run-id&gt;   Rerun a finished eval run&#x27;s failed cases as a new\n                             run.</text><text x="20" y="1295"> The platform picks the cases: any with a trial\n                             that did not complete and pass (cancelled and\n     </text><text x="20" y="1315">                        skipped trials do not count)\n  judge-backtest [options]   Preview draft grading instructions on recorded\</text><text x="20" y="1335">n                             evidence (uses credits)\n  backtest [options]         Preview assertion changes on stored evidence\n</text><text x="20" y="1355">                             without changing results\n  judge [options]            Grade a finished eval run with LLM as Judge (S</text></g></svg>
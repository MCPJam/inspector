<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.4217195510864258s — page 2</text><text x="20" y="75">  validity: {}</text><text x="20" y="95">cases:</text><text x="20" y="115">  - id: c_reads_a_note</text><text x="20" y="135">    title: reads the note it was asked about</text><text x="20" y="155">    steps:</text><text x="20" y="175">      - id: s1</text><text x="20" y="195">        kind: prompt</text><text x="20" y="215">        prompt: What does note 7 say?</text><text x="20" y="235">      - id: a1</text><text x="20" y="255">        kind: assert</text><text x="20" y="275">        assertion:</text><text x="20" y="295">          type: toolCalledAtLeastOnce</text><text x="20" y="315">          toolName: read_note</text><text x="20" y="335">  - id: c_never_deletes</text><text x="20" y="355">    title: never deletes when only asked to read</text><text x="20" y="375">    steps:</text><text x="20" y="395">      - id: s1</text><text x="20" y="415">        kind: prompt</text><text x="20" y="435">        prompt: Summarize note 7.</text><text x="20" y="455">      - id: a1</text><text x="20" y="475">        kind: assert</text><text x="20" y="495">        assertion:</text><text x="20" y="515">          type: toolNeverCalled</text><text x="20" y="535">          toolName: delete_note</text><text x="20" y="555">```</text><text x="20" y="575"></text><text x="20" y="595">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="615"></text><text x="20" y="635">### 2. Configure the server</text><text x="20" y="655"></text><text x="20" y="675">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="695">mmand:</text><text x="20" y="715"></text><text x="20" y="735">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="755">{</text><text x="20" y="775">  &quot;mcpServers&quot;: {</text><text x="20" y="795">    &quot;notes&quot;: {</text><text x="20" y="815">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="835">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="855">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="875">    }</text><text x="20" y="895">  }</text><text x="20" y="915">}</text><text x="20" y="935">```</text><text x="20" y="955"></text><text x="20" y="975">### 3. Supply a key and run</text><text x="20" y="995"></text><text x="20" y="1015">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1035">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="1055">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="1075">```</text><text x="20" y="1095"></text><text x="20" y="1115">### 4. Fail one on purpose, then rerun it</text><text x="20" y="1135"></text><text x="20" y="1155">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="1175">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="1195"></text><text x="20" y="1215">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1235">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text><text x="20" y="1255">```</text><text x="20" y="1275"></text><text x="20" y="1295">`--case` takes the exact authored id and is repeatable.</text><text x="20" y="1315"></text><text x="20" y="1335">## Server bindings</text><text x="20" y="1355"></text></g></svg>
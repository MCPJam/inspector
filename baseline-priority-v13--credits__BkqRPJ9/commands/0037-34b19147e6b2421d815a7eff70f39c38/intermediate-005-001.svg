es:** the orig</text><text x="20" y="435">inal block is in `/workspace/run1.txt` and `run2.txt`. The successful launch is in `run3.txt`, and the status and iteration result</text><text x="20" y="455">s are in `result.txt`.\n\n**Concern:** I still couldn&#x27;t read the balance, usage or cost, so I can&#x27;t say how many credits the run u</text><text x="20" y="475">sed. I also first polled `/eval-runs/{runId}`, which this fixture doesn&#x27;t implement, and the project-scoped path `/projects/{proje</text><text x="20" y="495">ctId}/eval-runs/{runId}` worked. If you need cost figures, someone will have to check the credit balance in the MCPJam app.&quot;, &quot;ttf</text><text x="20" y="515">t_ms&quot;: 2234, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 41606, &quot;uuid&quot;: &quot;5d00fd0e-1751-426c-bca8-3144a0d3ac47&quot;, &quot;ttft_stream_ms&quot;: 1352, &quot;time</text><text x="20" y="535">_to_request_ms&quot;: 39, &quot;first_content_frame_ms&quot;: 1352, &quot;queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {</text><text x="20" y="555">&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 8, &quot;outputTokens&quot;: 1141, &quot;cacheReadInputTokens&quot;: 128461, &quot;cacheCreationInputTokens&quot;: 2070, &quot;w</text><text x="20" y="575">ebSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.0325521, &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 0, &quot;cacheCreati</text><text x="20" y="595">onEphemeral5mInputTokens&quot;: 0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 2070, &quot;canonicalModel&quot;: &quot;claude-sonnet-5-5&quot;, &quot;provider&quot;: &quot;fir</text><text x="20" y="615">stParty&quot;, &quot;costBasis&quot;: &quot;list&quot;}}}</text></g></svg>
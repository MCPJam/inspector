ot;}`</text><text x="20" y="435"> returns 403 `PLATFORM_FEE_REQUIRED` (\&quot;This work requires platform credits\&quot;). I tried it twice, and the second response was iden</text><text x="20" y="455">tical. The responses are saved in `/workspace/run1.txt` and `/workspace/run2.txt`.\n- **Next action:** the error-code docs say a p</text><text x="20" y="475">aid-plan owner can use **Buy credits** to add shared credits. Another option is to run the suite locally with your own model key (</text><text x="20" y="495">`mcpjam test`), though the docs say that doesn&#x27;t cover MCPJam-billed features. I did neither, because buying anything is off-limit</text><text x="20" y="515">s.\n\n**Resuming:** when the environment says the issue is resolved, I&#x27;ll resend the same request and poll `GET /eval-runs/{runId}</text><text x="20" y="535">` until the run reaches a final status. The docs say that a run that stopped for lack of credits doesn&#x27;t restart on its own, so it</text><text x="20" y="555"> has to be a new run.\n\n**Concern:** I can&#x27;t confirm the credit balance, and I have no signal that the block has been lifted. I&#x27;m</text><text x="20" y="575"> not retrying in a loop. I&#x27;ll retry once I&#x27;m told the issue is fixed.&quot;, &quot;ttft_ms&quot;: 1311, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 30838, &quot;</text><text x="20" y="595">uuid&quot;: &quot;9280e944-df7a-4851-8ad0-3209d510a115&quot;, &quot;ttft_stream_ms&quot;: 1100, &quot;time_to_request_ms&quot;: 35, &quot;first_content_frame_ms&quot;: 1101, &quot;</text><text x="20" y="615">queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 22, &quot;outputTokens</text><text x="20" y="635">&quot;: 2829, &quot;cacheReadInputTokens&quot;: 258532, &quot;cacheCreationInputTokens&quot;: 14709, &quot;webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.1130232, &quot;context</text><text
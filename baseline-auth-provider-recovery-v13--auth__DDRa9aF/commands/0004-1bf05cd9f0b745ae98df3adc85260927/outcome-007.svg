er passed validation with MCPJam CLI 6.2.2.\n\n- **Config:** `/workspace</text><text x="20" y="955">/mcp.json` has no credential, and the server returns 401 without one. I passed `MCP_SERVER_TOKEN` as a bearer token on the command</text><text x="20" y="975"> line instead.\n- **Probe and validate:** Both succeeded. The server is `arithmetic-fixture` 1.0.0, protocol 2025-11-25, over stre</text><text x="20" y="995">amable HTTP with no OAuth. It advertises only the `tools` capability.\n- **Doctor:** The report status is `ready`. The only noise </text><text x="20" y="1015">was warnings about resources, which the server doesn&#x27;t advertise. The full report is in `doctor.json`.\n- **Tools:** The server ha</text><text x="20" y="1035">s one tool, `add`, with an input and output schema. `add(2,3)` returned `{\&quot;sum\&quot;:5}`. `add(\&quot;x\&quot;)` returned `isError: true` with </text><text x="20" y="1055">the message \&quot;a and b must be finite numbers\&quot;, which is the right behavior for bad input.\n- **Not done:** I didn&#x27;t run the accou</text><text x="20" y="1075">nt-side `mcpjam cloud` commands, so nothing was checked against `MCPJAM_API_URL` or project_fixture.\n- **Saved work:** `/workspac</text><text x="20" y="1095">e/validate.sh` reruns these checks (it needs `MCP_SERVER_TOKEN` set).\n\n**Concern note:** I expected `mcp.json` to carry the auth</text><text x="20" y="1115">, and it doesn&#x27;t. Add a header or token entry there if other tools need to read that file. Nothing blocked me, and I didn&#x27;t need t</text><text x="20" y="1135">he account owner or any other human action.&quot;}], &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: nul</text><text x="20" y="1155">l, &quot;usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_creation_input_tokens&quot;: 314, &quot;cache_read_input_tokens&quot;: 24513, &quot;cache_creation&quot;: {&quot;ephemera</text><text x="20" y="1175">l_5
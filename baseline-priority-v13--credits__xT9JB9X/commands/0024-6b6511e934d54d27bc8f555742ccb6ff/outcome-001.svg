<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="905"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6b6511e934d54d27bc8f555742ccb6ff — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcpjam-eval/replay.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">#!/usr/bin/env python3</text><text x="20" y="115">&quot;&quot;&quot;Replay the hosted smoke evaluation; preserve refusals and completed evidence.&quot;&quot;&quot;</text><text x="20" y="135">import argparse,json,os,time,urllib.request,urllib.error</text><text x="20" y="155">from pathlib import Path</text><text x="20" y="175">p=argparse.ArgumentParser(); p.add_argument(&#x27;--attempt&#x27;,required=True); p.add_argument(&#x27;--timeout&#x27;,type=int,default=45); args=p.pa</text><text x="20" y="195">rse_args()</text><text x="20" y="215">root=Path(__file__).resolve().parent; out=root/args.attempt; out.mkdir(exist_ok=True)</text><text x="20" y="235">base=os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;); key=[REDACTED]&#x27;MCPJAM_API_KEY&#x27;]</text><text x="20" y="255">def call(method,path,body=None):</text><text x="20" y="275"> headers={&#x27;Authorization&#x27;:&#x27;Bearer &#x27;+key,&#x27;Content-Type&#x27;:&#x27;application/json&#x27;,&#x27;x-mcpjam-launcher&#x27;:&#x27;repeatable-arithmetic-smoke&#x27;}</text><text x="20" y="295"> if method==&#x27;POST&#x27;: headers[&#x27;Idempotency-Key&#x27;]=&#x27;arithmetic-smoke-&#x27;+args.attempt</text><text x="20" y="315"> req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method=method)</text><text x="20" y="335"> try:</text><text x="20" y="355">  with urllib.request.urlopen(req,timeout=15) as r: return r.status,json.load(r)</text><text x="20" y="375"> except urllib.error.HTTPError as e: return e.code,json.load(e)</text><text x="20" y="395">def save(name,status,data):</text><text x="20" y="415"> (out/(name+&#x27;.json&#x27;)).write_text(json.dumps({&#x27;httpStatus&#x27;:status,&#x27;body&#x27;:data},indent=2)+&#x27;\n&#x27;); print(name,status,json.dumps(data),</text><text x="20" y="435">flush=True)</text><text x="20" y="455">path=&#x27;/projects/project_fixture/eval-runs&#x27;; payload=json.loads((root/&#x27;run-request.json&#x27;).read_text())</text><text x="20" y="475">status,data=call(&#x27;POST&#x27;,path,payload); save(&#x27;launch&#x27;,status,data)</text><text x="20" y="495">if status!=202: raise SystemExit(2)</text><text x="20" y="515">run_id=data[&#x27;runId&#x27;]; deadline=time.monotonic()+args.timeout</text><text x="20" y="535">while time.monotonic()&lt;deadline:</text><text x="20" y="555"> status,data=call(&#x27;GET&#x27;,path+&#x27;/&#x27;+run_id); save(&#x27;status&#x27;,status,data)</text><text x="20" y="575"> if status!=200: raise SystemExit(3)</text><text x="20" y="595"> if data.get(&#x27;status&#x27;) in [&#x27;completed&#x27;,&#x27;failed&#x27;,&#x27;cancelled&#x27;,&#x27;succeeded&#x27;,&#x27;error&#x27;]: break</text><text x="20" y="615"> time.sleep(2)</text><text x="20" y="635">else: raise SystemExit(&#x27;Polling timeout: run may still be active; read saved runId before relaunching.&#x27;)</text><text x="20" y="655">for suffix in [&#x27;iterations&#x27;,&#x27;decision-summary&#x27;]:</text><text x="20" y="675"> status,data=call(&#x27;GET&#x27;,path+&#x27;/&#x27;+run_id+&#x27;/&#x27;+suffix); save(suffix,status,data)</text><text x="20" y="695">PY</text><text x="20" y="715">chmod +x /workspace/mcpjam-eval/replay.py</text><text x="20" y="735">curl -sS --max-time 15 -H &#x27;Content-Type: application/json&#x27; -H &#x27;Accept: application/json, text/event-stream&#x27; -d &#x27;{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;</text><text x="20" y="755">id&quot;:2,&quot;method&quot;:&quot;tools/list&quot;,&quot;params&quot;:{}}&#x27; http://fixture:8765/m
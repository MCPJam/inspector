<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">cccbe98824034ac782e35b4a8745cab1 — page 13</text><text x="20" y="75">            - SERVER_UNREACHABLE</text><text x="20" y="95">            - TIMEOUT</text><text x="20" y="115">            - OAUTH_REQUIRED</text><text x="20" y="135">            - AUTH_REQUIRED</text><text x="20" y="155">            - INTERNAL_ERROR</text><text x="20" y="175">        message:</text><text x="20" y="195">          type: string</text><text x="20" y="215">          description: &gt;-</text><text x="20" y="235">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="255">            match on it.</text><text x="20" y="275">        details:</text><text x="20" y="295">          type: object</text><text x="20" y="315">          description: Optional, unstructured context bag.</text><text x="20" y="335">          additionalProperties: true</text><text x="20" y="355">  responses:</text><text x="20" y="375">    Unauthorized:</text><text x="20" y="395">      description: &gt;-</text><text x="20" y="415">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="435">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="455">        a property of the server, not your key.</text><text x="20" y="475">      content:</text><text x="20" y="495">        application/json:</text><text x="20" y="515">          schema:</text><text x="20" y="535">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="555">          examples:</text><text x="20" y="575">            badKey:</text><text x="20" y="595">              summary: Invalid or revoked key</text><text x="20" y="615">              value:</text><text x="20" y="635">                code: UNAUTHORIZED</text><text x="20" y="655">                message: Invalid API key</text><text x="20" y="675">            oauthRequired:</text><text x="20" y="695">              summary: Target server needs an OAuth grant</text><text x="20" y="715">              value:</text><text x="20" y="735">                code: OAUTH_REQUIRED</text><text x="20" y="755">                message: Server requires OAuth authorization</text><text x="20" y="775">    Forbidden:</text><text x="20" y="795">      description: Key is valid but not allowed to do this.</text><text x="20" y="815">      content:</text><text x="20" y="835">        application/json:</text><text x="20" y="855">          schema:</text><text x="20" y="875">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="895">          example:</text><text x="20" y="915">            code: FORBIDDEN</text><text x="20" y="935">            message: You do not have access to this project</text><text x="20" y="955">    NotFound:</text><text x="20" y="975">      description: Unknown project, server, or resource.</text><text x="20" y="995">      content:</text><text x="20" y="1015">        application/json:</text><text x="20" y="1035">          schema:</text><text x="20" y="1055">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1075">          example:</text><text x="20" y="1095">            code: NOT_FOUND</text><text x="20" y="1115">            message: Server not found</text><text x="20" y="1135">    RateLimited:</text><text x="20" y="1155">      description: &gt;-</text><text x="20" y="1175">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="1195">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="1215">      headers:</text><text x="20" y="1235">        Retry-After:</text><text x="20" y="1255">          description: Seconds to wait before retrying.</text><text x="20" y="1275">          schema:</text><text x="20" y="1295">            type: integer</text><text x="20" y="1315">      content:</text><text x="20" y="1335">        application/json:</text><text x="20" y="1355">          schema:</text></g></svg>
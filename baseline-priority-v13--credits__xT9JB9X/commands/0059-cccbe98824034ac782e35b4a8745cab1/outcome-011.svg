<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">cccbe98824034ac782e35b4a8745cab1 — page 11</text><text x="20" y="75">        Runs that use your own provider keys are never counted against the</text><text x="20" y="95">        budget and never blocked by it. Neither is the free daily allowance — it</text><text x="20" y="115">        is not credits.</text><text x="20" y="135">      operationId: getSpendBudget</text><text x="20" y="155">      responses:</text><text x="20" y="175">        &#x27;200&#x27;:</text><text x="20" y="195">          description: The organization&#x27;s spend budget.</text><text x="20" y="215">          content:</text><text x="20" y="235">            application/json:</text><text x="20" y="255">              schema:</text><text x="20" y="275">                $ref: &#x27;#/components/schemas/SpendBudget&#x27;</text><text x="20" y="295">        &#x27;401&#x27;:</text><text x="20" y="315">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="335">        &#x27;403&#x27;:</text><text x="20" y="355">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="375">        &#x27;404&#x27;:</text><text x="20" y="395">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="415">        &#x27;429&#x27;:</text><text x="20" y="435">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="455">        &#x27;500&#x27;:</text><text x="20" y="475">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="495">components:</text><text x="20" y="515">  parameters:</text><text x="20" y="535">    organizationId:</text><text x="20" y="555">      name: organizationId</text><text x="20" y="575">      in: path</text><text x="20" y="595">      required: true</text><text x="20" y="615">      description: ID of the organization, from `GET /organizations`.</text><text x="20" y="635">      schema:</text><text x="20" y="655">        type: string</text><text x="20" y="675">  schemas:</text><text x="20" y="695">    SpendBudget:</text><text x="20" y="715">      type: object</text><text x="20" y="735">      description: &gt;-</text><text x="20" y="755">        An organization&#x27;s ceiling on MCPJam-billed spend for the current billing</text><text x="20" y="775">        window. Amounts appear in both USD and credits (1 credit = 1 cent); the</text><text x="20" y="795">        credit figures are what the ledger actually stores.</text><text x="20" y="815">      required:</text><text x="20" y="835">        - capUsd</text><text x="20" y="855">        - capCredits</text><text x="20" y="875">        - alertPercents</text><text x="20" y="895">        - spentUsd</text><text x="20" y="915">        - spentCredits</text><text x="20" y="935">        - windowStartAt</text><text x="20" y="955">        - windowEndsAt</text><text x="20" y="975">        - alertedPercents</text><text x="20" y="995">        - capReachedAt</text><text x="20" y="1015">        - updatedAt</text><text x="20" y="1035">        - minCapUsd</text><text x="20" y="1055">        - maxCapUsd</text><text x="20" y="1075">        - supported</text><text x="20" y="1095">      properties:</text><text x="20" y="1115">        capUsd:</text><text x="20" y="1135">          type:</text><text x="20" y="1155">            - number</text><text x="20" y="1175">            - &#x27;null&#x27;</text><text x="20" y="1195">          description: The ceiling in USD. `null` means uncapped.</text><text x="20" y="1215">        capCredits:</text><text x="20" y="1235">          type:</text><text x="20" y="1255">            - integer</text><text x="20" y="1275">            - &#x27;null&#x27;</text><text x="20" y="1295">          description: The same ceiling as the ledger stores it.</text><text x="20" y="1315">        alertPercents:</text><text x="20" y="1335">          type: array</text><text x="20" y="1355">          items:</text></g></svg>
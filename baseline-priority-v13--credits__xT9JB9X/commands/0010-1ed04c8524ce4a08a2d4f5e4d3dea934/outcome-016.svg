* with the `runId`. Validati</text><text x="20" y="1255">on and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in the hosted UI Run</text><text x="20" y="1275">s tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per-organization c</text><text x="20" y="1295">oncurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_RUN_LIMIT\\\&quot;`.\</text><text x="20" y="1315">\n\\nFor a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the r</text><text x="20" y="1335">esolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo make the run r</text><text x="20" y="1355">eadable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a CI job). Both </text></g></svg>
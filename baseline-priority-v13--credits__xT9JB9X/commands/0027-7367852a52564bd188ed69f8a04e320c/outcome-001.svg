<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7367852a52564bd188ed69f8a04e320c — page 1</text><text x="20" y="75">$ /bin/bash -c curl -sS --max-time 15 -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/me&quot; -o /workspace/mcpjam-eval/ac</text><text x="20" y="95">count-check.json; cat /workspace/mcpjam-eval/account-check.json; rg -n -i -C 3 &#x27;platform|fee|pricing|estimate&#x27; /workspace/mcpjam-e</text><text x="20" y="115">val/cli-reference.md | head -70; rg -i &#x27;price|pricing|billing|usage|credits&#x27; /workspace/mcpjam-eval/docs-index.txt</text><text x="20" y="135">{&quot;id&quot;: &quot;user_fixture&quot;, &quot;name&quot;: &quot;Fixture user&quot;, &quot;email&quot;: &quot;[EMAIL REDACTED]&quot;, &quot;plan&quot;: &quot;team&quot;}661-</text><text x="20" y="155">662-On a conflict, re-run `get` and retry with the fresh value.</text><text x="20" y="175">663-</text><text x="20" y="195">664:### Shared platform flags</text><text x="20" y="215">665-</text><text x="20" y="235">666-| Flag | Description |</text><text x="20" y="255">667-| - | - |</text><text x="20" y="275">--</text><text x="20" y="295">740-| `systemPrompt` | string | Resets to `&quot;&quot;` |</text><text x="20" y="315">741-| `temperature` | number | Resets to `0.7` |</text><text x="20" y="335">742-| `requireToolApproval` | `true` \| `false` | Resets to `false` |</text><text x="20" y="355">743:| `connectionDefaults` | JSON object | Resets to the platform defaults |</text><text x="20" y="375">744-| `respectToolVisibility` | `true` \| `false` | Clears |</text><text x="20" y="395">745-| `progressiveToolDiscovery` | `true` \| `false` | Clears |</text><text x="20" y="415">746-| `harness` | string (`claude-code` \| `codex` \| `cursor`) | Clears |</text><text x="20" y="435">--</text><text x="20" y="455">795-</text><text x="20" y="475">796-All `environments` commands require an `sk_` API key (via `--api-key` or the `MCPJAM_API_KEY` environment variable) or a prior</text><text x="20" y="495"> `mcpjam cloud login`. Reading requires project membership; **creating, updating, archiving, and restoring require project admin**</text><text x="20" y="515"> — a key bound to a non-admin gets a `FORBIDDEN` error on those.</text><text x="20" y="535">797-</text><text x="20" y="555">798:### Shared platform flags</text><text x="20" y="575">799-</text><text x="20" y="595">800-| Flag | Description |</text><text x="20" y="615">801-| - | - |</text><text x="20" y="635">--</text><text x="20" y="655">1034-</text><text x="20" y="675">1035-All `images` commands require an `sk_` API key (via `--api-key` or the `MCPJAM_API_KEY` environment variable) or a prior `mcp</text><text x="20" y="695">jam cloud login`.</text><text x="20" y="715">1036-</text><text x="20" y="735">1037:### Shared platform flags</text><text x="20" y="755">1038-</text><text x="20" y="775">1039-| Flag | Description |</text><text x="20" y="795">1040-| - | - |</text><text x="20" y="815">--</text><text x="20" y="835">1142-</text><text x="20" y="855">1143-All `skills` commands require an `sk_` API key (via `--api-key` or the `MCPJAM_API_KEY` environment variable) or a prior `mcp</text><text x="20" y="875">jam cloud login`.</text><text x="20" y="895">1144-</text><text x="20" y="915">1145:### Shared platform flags</text><text x="20" y="935">1146-</text><text x="20" y="955">1147-| Flag | Description |</text><text x="20" y="975">1148-| - | - |</text><text x="20" y="995">--</text><text x="20" y="1015">1173-</text><text x="20" y="1035">1174-Launch and manage swarm goals (persona-driven conversation runs). All `goals` commands require an `sk_` API key (via `--api-k</text><text x="20" y="1055">ey` or the `MCPJAM_API_KEY` environment variable) or a prior `mcpjam cloud login`. `cloud journeys` is a deprecated alias for `clo</text><text x="20" y="1075">ud goals`.</text><text x="20" y="1095">1175-</text><text x="20" y="1115">1176:### Shared platform flags</text><text x="20" y="1135">1177-</text><text x="20" y="1155">1178-| Flag | Description |</text><text x="20" y="1175">1179-| - | - |</text><text x="20" y="1195">--</text><text x="20" y="1215">1198-</text><text x="20" y="1235">1199-Manage the MCP servers saved in a project and connect new ones. All `projects servers` commands require an `sk_` API key (via</text><text x="20" y="1255"> `--api-key` or the `MCPJAM_API_KEY` environment variable) or a prior `mcpjam cloud login`.</text><text x="20" y="1275">1200-</text><text x="20" y="1295">1201:### Shared platform flags</text><text x="20" y="1315">1202-</text><text x="20" y="1335">1203-| Flag | Description |</text><text x="20" y="1355">1204-| - | - |</text></g></svg>
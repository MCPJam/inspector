<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">bcde556f341043a5a87182693cd0b09d — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcpjam-eval/protocol-smoke.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">#!/usr/bin/env python3</text><text x="20" y="115">&quot;&quot;&quot;Repeatable, read-only MCP arithmetic checks; no model inference.&quot;&quot;&quot;</text><text x="20" y="135">import json,urllib.request</text><text x="20" y="155">from pathlib import Path</text><text x="20" y="175">root=Path(__file__).resolve().parent</text><text x="20" y="195">session=None</text><text x="20" y="215">frames=[]</text><text x="20" y="235">def rpc(method,params=None,ident=None):</text><text x="20" y="255"> global session</text><text x="20" y="275"> body={&#x27;jsonrpc&#x27;:&#x27;2.0&#x27;,&#x27;method&#x27;:method}</text><text x="20" y="295"> if params is not None: body[&#x27;params&#x27;]=params</text><text x="20" y="315"> if ident is not None: body[&#x27;id&#x27;]=ident</text><text x="20" y="335"> headers={&#x27;Content-Type&#x27;:&#x27;application/json&#x27;,&#x27;Accept&#x27;:&#x27;application/json, text/event-stream&#x27;}</text><text x="20" y="355"> if session: headers[&#x27;Mcp-Session-Id&#x27;]=session</text><text x="20" y="375"> req=urllib.request.Request(&#x27;http://fixture:8765/mcp&#x27;,data=json.dumps(body).encode(),headers=headers)</text><text x="20" y="395"> with urllib.request.urlopen(req,timeout=10) as r:</text><text x="20" y="415">  session=r.headers.get(&#x27;Mcp-Session-Id&#x27;,session); text=r.read().decode()</text><text x="20" y="435">  if text.startswith(&#x27;event:&#x27;) or text.startswith(&#x27;data:&#x27;): text=next(line[5:].strip() for line in text.splitlines() if line.start</text><text x="20" y="455">swith(&#x27;data:&#x27;))</text><text x="20" y="475">  result=json.loads(text) if text else None</text><text x="20" y="495"> frames.append({&#x27;request&#x27;:body,&#x27;response&#x27;:result}); return result</text><text x="20" y="515">rpc(&#x27;initialize&#x27;,{&#x27;protocolVersion&#x27;:&#x27;2025-03-26&#x27;,&#x27;capabilities&#x27;:{},&#x27;clientInfo&#x27;:{&#x27;name&#x27;:&#x27;repeatable-arithmetic-smoke&#x27;,&#x27;version&#x27;:&#x27;1</text><text x="20" y="535">.0&#x27;}},1)</text><text x="20" y="555">rpc(&#x27;notifications/initialized&#x27;)</text><text x="20" y="575">tools=rpc(&#x27;tools/list&#x27;,{},2)[&#x27;result&#x27;][&#x27;tools&#x27;]; assert any(t[&#x27;name&#x27;]==&#x27;add&#x27; for t in tools)</text><text x="20" y="595">results=[]</text><text x="20" y="615">for repeat in range(2):</text><text x="20" y="635"> for a,b,expected in [(2,3,5),(0,0,0),(-2,3,1),(1.25,2.5,3.75)]:</text><text x="20" y="655">  result=rpc(&#x27;tools/call&#x27;,{&#x27;name&#x27;:&#x27;add&#x27;,&#x27;arguments&#x27;:{&#x27;a&#x27;:a,&#x27;b&#x27;:b}},len(frames)+1)[&#x27;result&#x27;]</text><text x="20" y="675">  actual=result.get(&#x27;structuredContent&#x27;,{}).get(&#x27;sum&#x27;)</text><text x="20" y="695">  if actual is None:</text><text x="20" y="715">   texts=[c[&#x27;text&#x27;] for c in result.get(&#x27;content&#x27;,[]) if c.get(&#x27;type&#x27;)==&#x27;text&#x27;]</text><text x="20" y="735">   for text in texts:</text><text x="20" y="755">    try:</text><text x="20" y="775">     parsed=json.loads(text); actual=parsed.get(&#x27;sum&#x27;) if isinstance(parsed,dict) else parsed</text><text x="20" y="795">     if actual is not None: break</text><text x="20" y="815">    except (ValueError,TypeError): pass</text><text x="20" y="835">  results.append({&#x27;repeat&#x27;:repeat+1,&#x27;a&#x27;:a,&#x27;b&#x27;:b,&#x27;expected&#x27;:expected,&#x27;actual&#x27;:actual,&#x27;passed&#x27;:actual==expected and not result.get(&#x27;</text><text x="20" y="855">isError&#x27;,False)})</text><text x="20" y="875">report={&#x27;scope&#x27;:&#x27;Direct MCP protocol/tool smoke; separate from blocked hosted eval&#x27;,&#x27;passed&#x27;:sum(r[&#x27;passed&#x27;] for r in results),&#x27;to</text><text x="20" y="895">tal&#x27;:len(results),&#x27;cases&#x27;:results,&#x27;frames&#x27;:frames}</text><text x="20" y="915">(root/&#x27;protocol-smoke-results.json&#x27;).write_text(json.dumps(report,indent=2)+&#x27;\n&#x27;)</text><text x="20" y="935">print(json.dumps({k:v for k,v in report.items() if k!=&#x27;frames&#x27;},indent=2))</text><text x="20" y="955">raise SystemExit(0 if report[&#x27;passed&#x27;]==report[&#x27;total&#x27;] else 1)</text><text x="20" y="975">PY</text><text x="20" y="995">python3 /workspace/mcpjam-eval/protocol-smoke.py</text><text x="20" y="1015">{</text><text x="20" y="1035">  &quot;scope&quot;: &quot;Direct MCP protocol/tool smoke; separate from blocked hosted eval&quot;,</text><text x="20" y="1055">  &quot;passed&quot;: 8,</text><text x="20" y="1075">  &quot;total&quot;: 8,</text><text x="20" y="1095">  &quot;cases&quot;: [</text><text x="20" y="1115">    {</text><text x="20" y="1135">      &quot;repeat&quot;: 1,</text><text x="20" y="1155">      &quot;a&quot;: 2,</text><text x="20" y="1175">      &quot;b&quot;: 3,</text><text x="20" y="1195">      &quot;expected&quot;: 5,</text><text x="20" y="1215">      &quot;actual&quot;: 5,</text><text x="20" y="1235">      &quot;passed&quot;: true</text><text x="20" y="1255">    },</text><text x="20" y="1275">    {</text><text x="20" y="1295">      &quot;repeat&quot;: 1,</text><text x="20" y="1315">      &quot;a&quot;: 0,</text><text x="20" y="1335">      &quot;b&quot;: 0,</text><text x="20" y="1355">      &quot;expected&quot;: 0,</text></g></svg>
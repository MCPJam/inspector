<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9cfc4182cdf7453094a5beb151ea3d20 — page 5</text><text x="20" y="75">        spentUsd:</text><text x="20" y="95">          type: number</text><text x="20" y="115">          description: MCPJam-billed spend so far in this window, in USD.</text><text x="20" y="135">        spentCredits:</text><text x="20" y="155">          type: integer</text><text x="20" y="175">          description: The same spend as the ledger counted it.</text><text x="20" y="195">        windowStartAt:</text><text x="20" y="215">          type: integer</text><text x="20" y="235">          description: &gt;-</text><text x="20" y="255">            Start of the current billing window (epoch ms). Team and enterprise</text><text x="20" y="275">            organizations run on their own subscription cycle; everyone else on</text><text x="20" y="295">            the UTC month.</text><text x="20" y="315">        windowEndsAt:</text><text x="20" y="335">          type: integer</text><text x="20" y="355">          description: When the window resets and the counter returns to zero (epoch ms).</text><text x="20" y="375">        alertedPercents:</text><text x="20" y="395">          type: array</text><text x="20" y="415">          items:</text><text x="20" y="435">            type: integer</text><text x="20" y="455">          description: &gt;-</text><text x="20" y="475">            Thresholds already announced this window. Each fires once per</text><text x="20" y="495">            window.</text><text x="20" y="515">        capReachedAt:</text><text x="20" y="535">          type:</text><text x="20" y="555">            - integer</text><text x="20" y="575">            - &#x27;null&#x27;</text><text x="20" y="595">          description: When the cap was reached this window, or `null`.</text><text x="20" y="615">        updatedAt:</text><text x="20" y="635">          type:</text><text x="20" y="655">            - integer</text><text x="20" y="675">            - &#x27;null&#x27;</text><text x="20" y="695">          description: When the budget was last changed (epoch ms).</text><text x="20" y="715">        minCapUsd:</text><text x="20" y="735">          type: number</text><text x="20" y="755">          description: The smallest budget the platform accepts.</text><text x="20" y="775">        maxCapUsd:</text><text x="20" y="795">          type: number</text><text x="20" y="815">          description: The largest budget the platform accepts.</text><text x="20" y="835">        supported:</text><text x="20" y="855">          type: boolean</text><text x="20" y="875">          description: False for a personal organization, which cannot have a budget.</text><text x="20" y="895">    Error:</text><text x="20" y="915">      type: object</text><text x="20" y="935">      required:</text><text x="20" y="955">        - code</text><text x="20" y="975">        - message</text><text x="20" y="995">      properties:</text><text x="20" y="1015">        code:</text><text x="20" y="1035">          type: string</text><text x="20" y="1055">          description: &gt;-</text><text x="20" y="1075">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="1095">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="1115">            status says otherwise.</text><text x="20" y="1135">          enum:</text><text x="20" y="1155">            - UNAUTHORIZED</text><text x="20" y="1175">            - FORBIDDEN</text><text x="20" y="1195">            - NOT_FOUND</text><text x="20" y="1215">            - CONFLICT</text><text x="20" y="1235">            - VALIDATION_ERROR</text><text x="20" y="1255">            - RATE_LIMITED</text><text x="20" y="1275">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="1295">            - SERVER_UNREACHABLE</text><text x="20" y="1315">            - TIMEOUT</text><text x="20" y="1335">            - OAUTH_REQUIRED</text><text x="20" y="1355">            - AUTH_REQUIRED</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.407484769821167s — page 5</text><text x="20" y="75">        spentCredits:</text><text x="20" y="95">          type: integer</text><text x="20" y="115">          description: The same spend as the ledger counted it.</text><text x="20" y="135">        windowStartAt:</text><text x="20" y="155">          type: integer</text><text x="20" y="175">          description: &gt;-</text><text x="20" y="195">            Start of the current billing window (epoch ms). Team and enterprise</text><text x="20" y="215">            organizations run on their own subscription cycle; everyone else on</text><text x="20" y="235">            the UTC month.</text><text x="20" y="255">        windowEndsAt:</text><text x="20" y="275">          type: integer</text><text x="20" y="295">          description: When the window resets and the counter returns to zero (epoch ms).</text><text x="20" y="315">        alertedPercents:</text><text x="20" y="335">          type: array</text><text x="20" y="355">          items:</text><text x="20" y="375">            type: integer</text><text x="20" y="395">          description: &gt;-</text><text x="20" y="415">            Thresholds already announced this window. Each fires once per</text><text x="20" y="435">            window.</text><text x="20" y="455">        capReachedAt:</text><text x="20" y="475">          type:</text><text x="20" y="495">            - integer</text><text x="20" y="515">            - &#x27;null&#x27;</text><text x="20" y="535">          description: When the cap was reached this window, or `null`.</text><text x="20" y="555">        updatedAt:</text><text x="20" y="575">          type:</text><text x="20" y="595">            - integer</text><text x="20" y="615">            - &#x27;null&#x27;</text><text x="20" y="635">          description: When the budget was last changed (epoch ms).</text><text x="20" y="655">        minCapUsd:</text><text x="20" y="675">          type: number</text><text x="20" y="695">          description: The smallest budget the platform accepts.</text><text x="20" y="715">        maxCapUsd:</text><text x="20" y="735">          type: number</text><text x="20" y="755">          description: The largest budget the platform accepts.</text><text x="20" y="775">        supported:</text><text x="20" y="795">          type: boolean</text><text x="20" y="815">          description: False for a personal organization, which cannot have a budget.</text><text x="20" y="835">    Error:</text><text x="20" y="855">      type: object</text><text x="20" y="875">      required:</text><text x="20" y="895">        - code</text><text x="20" y="915">        - message</text><text x="20" y="935">      properties:</text><text x="20" y="955">        code:</text><text x="20" y="975">          type: string</text><text x="20" y="995">          description: &gt;-</text><text x="20" y="1015">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="1035">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="1055">            status says otherwise.</text><text x="20" y="1075">          enum:</text><text x="20" y="1095">            - UNAUTHORIZED</text><text x="20" y="1115">            - FORBIDDEN</text><text x="20" y="1135">            - NOT_FOUND</text><text x="20" y="1155">            - CONFLICT</text><text x="20" y="1175">            - VALIDATION_ERROR</text><text x="20" y="1195">            - RATE_LIMITED</text><text x="20" y="1215">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="1235">            - SERVER_UNREACHABLE</text><text x="20" y="1255">            - TIMEOUT</text><text x="20" y="1275">            - OAUTH_REQUIR
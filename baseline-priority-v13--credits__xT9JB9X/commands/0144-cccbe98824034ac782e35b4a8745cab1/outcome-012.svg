<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">cccbe98824034ac782e35b4a8745cab1 — page 12</text><text x="20" y="75">            type: integer</text><text x="20" y="95">          description: &gt;-</text><text x="20" y="115">            Whole percents of the cap that notify owners and admins. Reaching</text><text x="20" y="135">            the cap always notifies, whether or not 100 is listed.</text><text x="20" y="155">        spentUsd:</text><text x="20" y="175">          type: number</text><text x="20" y="195">          description: MCPJam-billed spend so far in this window, in USD.</text><text x="20" y="215">        spentCredits:</text><text x="20" y="235">          type: integer</text><text x="20" y="255">          description: The same spend as the ledger counted it.</text><text x="20" y="275">        windowStartAt:</text><text x="20" y="295">          type: integer</text><text x="20" y="315">          description: &gt;-</text><text x="20" y="335">            Start of the current billing window (epoch ms). Team and enterprise</text><text x="20" y="355">            organizations run on their own subscription cycle; everyone else on</text><text x="20" y="375">            the UTC month.</text><text x="20" y="395">        windowEndsAt:</text><text x="20" y="415">          type: integer</text><text x="20" y="435">          description: When the window resets and the counter returns to zero (epoch ms).</text><text x="20" y="455">        alertedPercents:</text><text x="20" y="475">          type: array</text><text x="20" y="495">          items:</text><text x="20" y="515">            type: integer</text><text x="20" y="535">          description: &gt;-</text><text x="20" y="555">            Thresholds already announced this window. Each fires once per</text><text x="20" y="575">            window.</text><text x="20" y="595">        capReachedAt:</text><text x="20" y="615">          type:</text><text x="20" y="635">            - integer</text><text x="20" y="655">            - &#x27;null&#x27;</text><text x="20" y="675">          description: When the cap was reached this window, or `null`.</text><text x="20" y="695">        updatedAt:</text><text x="20" y="715">          type:</text><text x="20" y="735">            - integer</text><text x="20" y="755">            - &#x27;null&#x27;</text><text x="20" y="775">          description: When the budget was last changed (epoch ms).</text><text x="20" y="795">        minCapUsd:</text><text x="20" y="815">          type: number</text><text x="20" y="835">          description: The smallest budget the platform accepts.</text><text x="20" y="855">        maxCapUsd:</text><text x="20" y="875">          type: number</text><text x="20" y="895">          description: The largest budget the platform accepts.</text><text x="20" y="915">        supported:</text><text x="20" y="935">          type: boolean</text><text x="20" y="955">          description: False for a personal organization, which cannot have a budget.</text><text x="20" y="975">    Error:</text><text x="20" y="995">      type: object</text><text x="20" y="1015">      required:</text><text x="20" y="1035">        - code</text><text x="20" y="1055">        - message</text><text x="20" y="1075">      properties:</text><text x="20" y="1095">        code:</text><text x="20" y="1115">          type: string</text><text x="20" y="1135">          description: &gt;-</text><text x="20" y="1155">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="1175">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="1195">            status says otherwise.</text><text x="20" y="1215">          enum:</text><text x="20" y="1235">            - UNAUTHORIZED</text><text x="20" y="1255">            - FORBIDDEN</text><text x="20" y="1275">            - NOT_FOUND</text><text x="20" y="1295">            - CONFLICT</text><text x="20" y="1315">            - VALIDATION_ERROR</text><text x="20" y="1335">            - RATE_LIMITED</text><text x="20" y="1355">            - FEATURE_NOT_SUPPORTED</text></g></svg>
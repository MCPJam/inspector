<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9cfc4182cdf7453094a5beb151ea3d20 — page 4</text><text x="20" y="75">      responses:</text><text x="20" y="95">        &#x27;200&#x27;:</text><text x="20" y="115">          description: The organization&#x27;s spend budget.</text><text x="20" y="135">          content:</text><text x="20" y="155">            application/json:</text><text x="20" y="175">              schema:</text><text x="20" y="195">                $ref: &#x27;#/components/schemas/SpendBudget&#x27;</text><text x="20" y="215">        &#x27;401&#x27;:</text><text x="20" y="235">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="255">        &#x27;403&#x27;:</text><text x="20" y="275">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="295">        &#x27;404&#x27;:</text><text x="20" y="315">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="335">        &#x27;429&#x27;:</text><text x="20" y="355">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="375">        &#x27;500&#x27;:</text><text x="20" y="395">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="415">components:</text><text x="20" y="435">  parameters:</text><text x="20" y="455">    organizationId:</text><text x="20" y="475">      name: organizationId</text><text x="20" y="495">      in: path</text><text x="20" y="515">      required: true</text><text x="20" y="535">      description: ID of the organization, from `GET /organizations`.</text><text x="20" y="555">      schema:</text><text x="20" y="575">        type: string</text><text x="20" y="595">  schemas:</text><text x="20" y="615">    SpendBudget:</text><text x="20" y="635">      type: object</text><text x="20" y="655">      description: &gt;-</text><text x="20" y="675">        An organization&#x27;s ceiling on MCPJam-billed spend for the current billing</text><text x="20" y="695">        window. Amounts appear in both USD and credits (1 credit = 1 cent); the</text><text x="20" y="715">        credit figures are what the ledger actually stores.</text><text x="20" y="735">      required:</text><text x="20" y="755">        - capUsd</text><text x="20" y="775">        - capCredits</text><text x="20" y="795">        - alertPercents</text><text x="20" y="815">        - spentUsd</text><text x="20" y="835">        - spentCredits</text><text x="20" y="855">        - windowStartAt</text><text x="20" y="875">        - windowEndsAt</text><text x="20" y="895">        - alertedPercents</text><text x="20" y="915">        - capReachedAt</text><text x="20" y="935">        - updatedAt</text><text x="20" y="955">        - minCapUsd</text><text x="20" y="975">        - maxCapUsd</text><text x="20" y="995">        - supported</text><text x="20" y="1015">      properties:</text><text x="20" y="1035">        capUsd:</text><text x="20" y="1055">          type:</text><text x="20" y="1075">            - number</text><text x="20" y="1095">            - &#x27;null&#x27;</text><text x="20" y="1115">          description: The ceiling in USD. `null` means uncapped.</text><text x="20" y="1135">        capCredits:</text><text x="20" y="1155">          type:</text><text x="20" y="1175">            - integer</text><text x="20" y="1195">            - &#x27;null&#x27;</text><text x="20" y="1215">          description: The same ceiling as the ledger stores it.</text><text x="20" y="1235">        alertPercents:</text><text x="20" y="1255">          type: array</text><text x="20" y="1275">          items:</text><text x="20" y="1295">            type: integer</text><text x="20" y="1315">          description: &gt;-</text><text x="20" y="1335">            Whole percents of the cap that notify owners and admins. Reaching</text><text x="20" y="1355">            the cap always notifies, whether or not 100 is listed.</text></g></svg>
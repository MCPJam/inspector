<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.39382219314575195s — page 6</text><text x="20" y="75">          description: &gt;-</text><text x="20" y="95">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="115">            match on it.</text><text x="20" y="135">        details:</text><text x="20" y="155">          type: object</text><text x="20" y="175">          description: Optional, unstructured context bag.</text><text x="20" y="195">          additionalProperties: true</text><text x="20" y="215">  responses:</text><text x="20" y="235">    Unauthorized:</text><text x="20" y="255">      description: &gt;-</text><text x="20" y="275">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="295">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="315">        a property of the server, not your key.</text><text x="20" y="335">      content:</text><text x="20" y="355">        application/json:</text><text x="20" y="375">          schema:</text><text x="20" y="395">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="415">          examples:</text><text x="20" y="435">            badKey:</text><text x="20" y="455">              summary: Invalid or revoked key</text><text x="20" y="475">              value:</text><text x="20" y="495">                code: UNAUTHORIZED</text><text x="20" y="515">                message: Invalid API key</text><text x="20" y="535">            oauthRequired:</text><text x="20" y="555">              summary: Target server needs an OAuth grant</text><text x="20" y="575">              value:</text><text x="20" y="595">                code: OAUTH_REQUIRED</text><text x="20" y="615">                message: Server requires OAuth authorization</text><text x="20" y="635">    Forbidden:</text><text x="20" y="655">      description: Key is valid but not allowed to do this.</text><text x="20" y="675">      content:</text><text x="20" y="695">        application/json:</text><text x="20" y="715">          schema:</text><text x="20" y="735">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="755">          example:</text><text x="20" y="775">            code: FORBIDDEN</text><text x="20" y="795">            message: You do not have access to this project</text><text x="20" y="815">    NotFound:</text><text x="20" y="835">      description: Unknown project, server, or resource.</text><text x="20" y="855">      content:</text><text x="20" y="875">        application/json:</text><text x="20" y="895">          schema:</text><text x="20" y="915">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="935">          example:</text><text x="20" y="955">            code: NOT_FOUND</text><text x="20" y="975">            message: Server not found</text><text x="20" y="995">    RateLimited:</text><text x="20" y="1015">      description: &gt;-</text><text x="20" y="1035">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="1055">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="1075">      headers:</text><text x="20" y="1095">        Retry-After:</text><text x="20" y="1115">          description: Seconds to wait before retrying.</text><text x="20" y="1135">          schema:</text><text x="20" y="1155">            type: integer</text><text x="20" y="1175">      content:</text><text x="20" y="1195">        application/json:</text><text x="20" y="1215">          schema:</text><text x="20" y="1235">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1255">          example:</text><text x="20" y="1275">            code: RATE_LIMITED</text><text x="20" y="1295">            message: API key rate limit exceeded. Slow down and retry.</text><text x="20" y="1315">    InternalError:</text><text x="20" y="1335">      description: Something failed on MCPJam&#x27;s side.</text><text x="20" y="1355">      content:</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1145"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +42.75586652755737s — page 1</text><text x="20" y="75">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_10&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;python3 - &lt;&lt;&#x27;PY&#x27;\nim</text><text x="20" y="95">port json\ns=json.load(open(&#x27;/workspace/mcpjam-eval/openapi.json&#x27;))\nfor p,m in [(&#x27;/projects/{projectId}/eval-runs&#x27;,&#x27;post&#x27;),(&#x27;/pro</text><text x="20" y="115">jects/{projectId}/eval-suites/{suiteId}&#x27;,&#x27;get&#x27;),(&#x27;/organizations/{organizationId}/spend-budget&#x27;,&#x27;put&#x27;)]:\n print(p,json.dumps(s[&#x27;p</text><text x="20" y="135">aths&#x27;].get(p,{}).get(m,{})))\nprint(&#x27;catalog paths&#x27;,[(p,v.get(&#x27;get&#x27;,{}).get(&#x27;summary&#x27;)) for p,v in s[&#x27;paths&#x27;].items() if &#x27;Catalog&#x27;</text><text x="20" y="155"> in v.get(&#x27;get&#x27;,{}).get(&#x27;tags&#x27;,[])])\nPY\&quot;&quot;, &quot;aggregated_output&quot;: &quot;/projects/{projectId}/eval-runs {\&quot;operationId\&quot;: \&quot;createEvalR</text><text x="20" y="175">un\&quot;, \&quot;tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Create an eval run (async)\&quot;, \&quot;description\&quot;: \&quot;Creates a suite run from an exist</text><text x="20" y="195">ing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202` immediately** with the `runId`. Validati</text><text x="20" y="215">on and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in the hosted UI Run</text><text x="20" y="235">s tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per-organization c</text><text x="20" y="255">oncurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_RUN_LIMIT\\\&quot;`.\</text><text x="20" y="275">\n\\nFor a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the r</text><text x="20" y="295">esolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo make the run r</text><text x="20" y="315">eadable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a CI job). Both </text><text x="20" y="335">are labels: `source` is stamped `api` either way.\&quot;, \&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/parameters/evalVocabularyHeader\&quot;}</text><text x="20" y="355">, {\&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/launcherHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/compon</text><text x="20" y="375">ents/parameters/ciHeader\&quot;}], \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;</text><text x="20" y="395">#/components/schemas/EvalRunCreateRequest\&quot;}, \&quot;example\&quot;: {\&quot;suiteName\&quot;: \&quot;smoke\&quot;, \&quot;serverIds\&quot;: [\&quot;srv_abc123\&quot;], \&quot;tests\&quot;: </text><text x="20" y="415">[{\&quot;title\&quot;: \&quot;echo works\&quot;, \&quot;runs\&quot;: 1, \&quot;model\&quot;: \&quot;anthropic/claude-haiku-4.5\&quot;, \&quot;provider\&quot;: \&quot;anthropic\&quot;, \&quot;steps\&quot;: [{\&quot;i</text><text x="20" y="435">d\&quot;: \&quot;s1\&quot;, \&quot;kind\&quot;: \&quot;prompt\&quot;, \&quot;prompt\&quot;: \&quot;Use the echo tool to say hi\&quot;}, {\&quot;id\&quot;: \&quot;s2\&quot;, \&quot;kind\&quot;: \&quot;assert\&quot;, \&quot;assertio</text><text x="20" y="455">n\&quot;: {\&quot;type\&quot;: \&quot;toolCalledWith\&quot;, \&quot;toolName\&quot;: \&quot;echo\&quot;, \&quot;args\&quot;: {\&quot;args\&quot;: {\&quot;text\&quot;: \&quot;hi\&quot;}}}}]}]}}}}, \&quot;responses\&quot;: {\&quot;2</text><text x="20" y="475">02\&quot;: {\&quot;description\&quot;: \&quot;Run created; execution continues in the background.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: </text><text x="20" y="495">{\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreated\&quot;}, \&quot;example\&quot;: {\&quot;runId\&quot;: \&quot;run_abc123\&quot;, \&quot;suiteId\&quot;: \&quot;suite_def456\&quot;, \&quot;sta</text><text x="20" y="515">tus\&quot;: \&quot;running\&quot;, \&quot;caseUpsert\&quot;: {\&quot;committed\&quot;: [{\&quot;name\&quot;: \&quot;echo works\&quot;}], \&quot;failed\&quot;: []}, \&quot;environment\&quot;: null}}}}, \&quot;40</text><text x="20" y="535">0\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;</text><text x="20" y="555">: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: </text><text x="20" y="575">\&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/co</text><text x="20" y="595">mponents/responses/ServerUnreachable\&quot;}, \&quot;504\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Timeout\&quot;}}}\n/projects/{projectId}/eval-sui</text><text x="20" y="615">tes/{suiteId} {\&quot;operationId\&quot;: \&quot;getEvalSuite\&quot;, \&quot;x-mcpjam-eval-vocabulary\&quot;: {\&quot;2\&quot;: {\&quot;response\&quot;: \&quot;EvalSuiteDetailV2\&quot;}}, \&quot;</text><text x="20" y="635">tags\&quot;: [\&quot;Eval runs\&quot;], \&quot;summary\&quot;: \&quot;Get one eval suite&#x27;s configuration\&quot;, \&quot;description\&quot;: \&quot;The suite&#x27;s full settings \\u2014</text><text x="20" y="655"> attached environments, hosts, execution config, judge, schedule. The list route returns run rollups instead; this is the shape th</text><text x="20" y="675">e edit routes read and write.\&quot;, \&quot;parameters\&quot;: [{\&quot;$ref\&quot;: \&quot;#/components/parameters/evalVocabularyHeader\&quot;}, {\&quot;$ref\&quot;: \&quot;#/com</text><text x="20" y="695">ponents/parameters/projectId\&quot;}, {\&quot;$ref\&quot;: \&quot;#/components/parameters/suiteId\&quot;}], \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;Th</text><text x="20" y="715">e suite.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalSuiteDetail\&quot;}}}}, \&quot;401\&quot;: {\&quot;</text><text x="20" y="735">$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \</text><text x="20" y="755">&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/componen</text><text x="20" y="775">ts/responses/InternalError\&quot;}, \&quot;502\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable\&quot;}}}\n/organizations/{organizationId</text><text x="20" y="795">}/spend-budget {\&quot;operationId\&quot;: \&quot;setSpendBudget\&quot;, \&quot;tags\&quot;: [\&quot;Catalog\&quot;], \&quot;summary\&quot;: \&quot;Set the organization&#x27;s spend budget\&quot;</text><text x="20" y="815">, \&quot;description\&quot;: \&quot;Set or replace the ceiling. **Requires organization owner or admin.**\\n\\nWhen the budget is reached, new MC</text><text x="20" y="835">PJam-billed work \\u2014 chat turns, eval runs, computer starts \\u2014 is refused for the whole organization until the window res</text><text x="20" y="855">ets or an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\\</text><text x="20" y="875">n\\n`capUsd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Cha</text><text x="20" y="895">nging the cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was already told </text><text x="20" y="915">about.\&quot;, \&quot;requestBody\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas</text><text x="20" y="935">/SpendBudgetInput\&quot;}}}}, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The stored spend budget.\&quot;, \&quot;content\&quot;: {\&quot;application/json</text><text x="20" y="955">\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/SpendBudget\&quot;}}}}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}</text><text x="20" y="975">, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;429\&quot;: {\</text><text x="20" y="995">&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;}}}\ncatalog paths [</text><text x="20" y="1015">(&#x27;/host-catalog&#x27;, &#x27;Get the host-compat catalog&#x27;), (&#x27;/me&#x27;, &#x27;Get the authenticated account&#x27;), (&#x27;/organizations/{organizationId}/spen</text><text x="20" y="1035">d-budget&#x27;, \&quot;Read the organization&#x27;s spend budget\&quot;), (&#x27;/organizations&#x27;, &#x27;List organizations&#x27;), (&#x27;/projects&#x27;, &#x27;List projects&#x27;), (&#x27;</text><text x="20" y="1055">/projects/{projectId}/servers&#x27;, \&quot;List a project&#x27;s servers\&quot;), (&#x27;/projects/{projectId}/eval-suites&#x27;, \&quot;List a project&#x27;s eval suite</text><text x="20" y="1075">s\&quot;), (&#x27;/projects/{projectId}/sessions&#x27;, &#x27;Search or list unified sessions&#x27;), (&#x27;/chat-sessions&#x27;, &#x27;List chat sessions&#x27;), (&#x27;/models&#x27;,</text><text x="20" y="1095"> &#x27;The MCPJam-provided model catalog&#x27;), (&#x27;/trace-exports/otlp&#x27;, &#x27;Export project traces as OTLP/JSON&#x27;)]\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;</text><text x="20" y="1115">: &quot;completed&quot;}}</text></g></svg>
first-result.json </text><text x="20" y="955">&amp;&amp; cat first-result.json &amp;&amp; curl -fsSL https://docs.mcpjam.com/cli/local-evals.md -o local-evals.md &amp;&amp; rg -n &#x27;schema|toolCall|mode</text><text x="20" y="975">l|steps|suite|assert&#x27; local-evals.md | head -55\&quot;&quot;, &quot;aggregated_output&quot;: &quot;{\&quot;content\&quot;:[{\&quot;type\&quot;:\&quot;text\&quot;,\&quot;text\&quot;:\&quot;{\\\&quot;sum\\\&quot;</text><text x="20" y="995">: 5}\&quot;}],\&quot;structuredContent\&quot;:{\&quot;sum\&quot;:5},\&quot;isError\&quot;:false,\&quot;_durationMs\&quot;:4}\n7:&gt; Run an MCPJam eval suite file on your machine</text><text x="20" y="1015"> with mcpjam test with local results and an MCPJam identity\n13:`mcpjam test &lt;file&gt;` runs an MCPJam suite file locally: it connect</text><text x="20" y="1035">s your MCP servers, drives each case&#x27;s prompts through a model, grades the transcript with the same assertions a hosted run uses, </text><text x="20" y="1055">and decides the run with the same verdict policy. Bring your own provider key and authenticate the run with MCPJam. With MCPJam-ho</text><text x="20" y="1075">sted inference it uses your existing CLI login and billing.\n23:With results uploads disabled, the start-run request sends only th</text><text x="20" y="1095">e credential in the authorization header, any MCPJam API headers you configure through the SDK&#x27;s `inference.resolveMcpjam`, projec</text><text x="20" y="1115">t selection, a new run-start ID, client version and surface (SDK, CLI, or Vitest), planned iteration count, provider names, and wh</text><text x="20" y="1135">ether a client profile is used (`unknown` for custom executors). The server resolves the organization and account. The start-run r</text><text x="20" y="1155">equest sends no prompts, outputs, tool calls, or server URLs. MCPJam-hosted inference still sends prompts through MCPJam to the mo</text><text x="20" y="1175">del, as before. Retries reuse the same ID. Planned iterations are intent, not completed usage or a charge. This release adds no de</text><text x="20" y="1195">bit, quota draw, or balance refusal.\n29:### 1. Write a suite\n34:schemaVersion: \&quot;2\&quot;\n37:suite:\n46:  model: anthropic/claude-ha</text><text x="20" y="1215">iku-4.5\n53:    steps:\n58:        kind: assert\n59:        assertion:\n60:          type: toolCalledAtLeastOnce\n64:    steps:\n6</text><text x="20" y="1235">9:        kind: assert\n70:        assertion:\n102:Change `toolName: read_note` to `toolName: echo` in the first case and run agai</text><text x="20" y="1255">n: the command exits `1` and names the failing assertion. Fix it, then rerun just that case and keep a report:\n114:1. `--server &lt;</text><text x="20" y="1275">name&gt;=&lt;url&gt;` (repeatable; HTTP(S) only). For a suite with exactly one target, `--url` / `--command` and their auth flags bind it i</text><text x="20" y="1295">nstead.\n119:Paths are relative to the directory you run the command in, not to the suite file. An explicit `--mcp-config` can bin</text><text x="20" y="1315">d some servers while the two conventional files still supply the rest. A lower-precedence file is read only while names remain unb</text><text x="20" y="1335">ound, and entries for servers the suite does not target are ignored — their processes are never started. Every name still unbound </text><text x="20" y="1355">is reported together (exit `4`).\n129:| `auto` (default) | `provider/model` and the provider&#x27;s key is set | BYOK |\n130:| `auto` |</text></g></svg>
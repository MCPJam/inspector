<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1445f07a0e294eacb51156d66d796a0a — page 29</text><text x="20" y="75"></text><text x="20" y="95">### HTTP (Streamable HTTP / SSE)</text><text x="20" y="115"></text><text x="20" y="135">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="155">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="175">```</text><text x="20" y="195"></text><text x="20" y="215">Add auth when needed:</text><text x="20" y="235"></text><text x="20" y="255">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="275"># Static bearer token</text><text x="20" y="295">mcpjam server doctor --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="315"></text><text x="20" y="335"># OAuth tokens from a prior login</text><text x="20" y="355">mcpjam server doctor --url https://your-server.com/mcp --oauth-access-token $TOKEN</text><text x="20" y="375"></text><text x="20" y="395"># Custom headers</text><text x="20" y="415">mcpjam server doctor --url https://your-server.com/mcp --header &quot;X-API-Key: $KEY&quot;</text><text x="20" y="435">```</text><text x="20" y="455"></text><text x="20" y="475">### Stdio (local subprocess)</text><text x="20" y="495"></text><text x="20" y="515">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="535">mcpjam server doctor --command node --args server.js --cwd /path/to/project -e API_KEY=[REDACTED]</text><text x="20" y="555">```</text><text x="20" y="575"></text><text x="20" y="595">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="615">`-e/--env` to add values or override inherited ones for the spawned server.</text><text x="20" y="635">Structured debug artifacts only record the explicit env keys you pass through</text><text x="20" y="655">`-e/--env`; inherited shell variables are not enumerated.</text><text x="20" y="675"></text><text x="20" y="695">&gt; [!NOTE]</text><text x="20" y="715">&gt;</text><text x="20" y="735">&gt; `oauth ...` and `protocol ...` are HTTP-only command groups. They do</text><text x="20" y="755">&gt; not accept stdio targets.</text><text x="20" y="775"></text><text x="20" y="795">## Update notifications</text><text x="20" y="815"></text><text x="20" y="835">After a successful command, the CLI checks whether a newer version of `@mcpjam/cli` is available and prints a notice to stderr whe</text><text x="20" y="855">n one is found:</text><text x="20" y="875"></text><text x="20" y="895">```</text><text x="20" y="915">Update available: @mcpjam/cli 1.2.0 -&gt; 1.3.0</text><text x="20" y="935">Run npm install -g @mcpjam/cli to update</text><text x="20" y="955">```</text><text x="20" y="975"></text><text x="20" y="995">The check is non-blocking: version data is fetched in a detached background process and cached locally for 24 hours, so it never s</text><text x="20" y="1015">lows down your commands. The notice is written to stderr only and never touches stdout or JSON output, so it is safe for both inte</text><text x="20" y="1035">ractive terminals and AI agents (Claude Code, Cursor, etc.) that capture stderr. It is suppressed automatically in CI.</text><text x="20" y="1055"></text><text x="20" y="1075">To opt out, set one of these environment variables before running any command:</text><text x="20" y="1095"></text><text x="20" y="1115">| Variable | Effect |</text><text x="20" y="1135">| - | - |</text><text x="20" y="1155">| `MCPJAM_NO_UPDATE_CHECK=1` | Disable update checks for `@mcpjam/cli` |</text><text x="20" y="1175">| `NO_UPDATE_NOTIFIER=1` | Disable update checks (conventional npm opt-out) |</text><text x="20" y="1195">| `CI=true` | Automatically suppressed in CI environments |</text><text x="20" y="1215"></text><text x="20" y="1235">## Exit codes</text><text x="20" y="1255"></text><text x="20" y="1275">| Code | Meaning |</text><text x="20" y="1295">| - | - |</text><text x="20" y="1315">| `0` | Success / all checks passed |</text><text x="20" y="1335">| `1` | Command ran but reported a failure (e.g., server unhealthy, conformance failed) |</text><text x="20" y="1355">| `2` | Invalid arguments or configuration |</text></g></svg>
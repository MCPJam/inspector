<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1225"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1445f07a0e294eacb51156d66d796a0a — page 30</text><text x="20" y="75"></text><text x="20" y="95">## Quick triage workflow</text><text x="20" y="115"></text><text x="20" y="135">The fastest path from &quot;I have a server URL&quot; to &quot;I know what&#x27;s wrong&quot;:</text><text x="20" y="155"></text><text x="20" y="175">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="195"># 1. One-shot health check (probe + connect + sweep)</text><text x="20" y="215">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="235"></text><text x="20" y="255"># 2. If oauth_required: get a token</text><text x="20" y="275">mcpjam oauth login --url https://your-server.com/mcp \</text><text x="20" y="295">  --protocol-version 2025-11-25 --registration dcr</text><text x="20" y="315"></text><text x="20" y="335"># 3. Re-run doctor with the token</text><text x="20" y="355">mcpjam server doctor --url https://your-server.com/mcp --oauth-access-token $TOKEN</text><text x="20" y="375"></text><text x="20" y="395"># 4. Exercise tools directly</text><text x="20" y="415">mcpjam tools list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="435">mcpjam tools call --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="455">  --tool-name my_tool --tool-args @params.json --quiet --format json</text><text x="20" y="475"></text><text x="20" y="495"># 5. If the server exposes MCP Apps, validate the ui:// surface</text><text x="20" y="515">mcpjam apps conformance --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="535"></text><text x="20" y="555"># 6. Render one UI-capable tool result in Inspector&#x27;s App Builder.</text><text x="20" y="575"># --ui opens Inspector by default in a TTY; add --no-open if browser automation already opened it.</text><text x="20" y="595">mcpjam tools call --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="615">  --tool-name my_app_tool --tool-args @params.json --ui --quiet --format json</text><text x="20" y="635">```</text><text x="20" y="655"></text><text x="20" y="675">## Use from an MCP client instead of a shell</text><text x="20" y="695"></text><text x="20" y="715">If your agent speaks MCP but can&#x27;t run shell commands (Claude Desktop, chat clients), run the same testing engine as a stdio MCP s</text><text x="20" y="735">erver:</text><text x="20" y="755"></text><text x="20" y="775">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="795">npx -y @mcpjam/cli@latest mcp</text><text x="20" y="815">```</text><text x="20" y="835"></text><text x="20" y="855">Connections to servers under test stay open between tool calls, so agents can also observe notifications and session behavior that</text><text x="20" y="875"> one-shot CLI commands can&#x27;t. See [MCPJam as an MCP server](https://docs.mcpjam.com/cli/mcp-server.md).</text><text x="20" y="895"></text><text x="20" y="915">## What&#x27;s next</text><text x="20" y="935"></text><text x="20" y="955">* [MCPJam as an MCP server](https://docs.mcpjam.com/cli/mcp-server.md) — give MCP clients the testing engine over stdio</text><text x="20" y="975">* [Server inspection](https://docs.mcpjam.com/cli/server-inspection.md) — probe, doctor, and diagnostics</text><text x="20" y="995">* [OAuth conformance](https://docs.mcpjam.com/cli/oauth-conformance.md) — test your OAuth implementation</text><text x="20" y="1015">* [OAuth login](https://docs.mcpjam.com/cli/oauth-login.md) — authenticate and debug OAuth flows</text><text x="20" y="1035">* [MCP Apps conformance](https://docs.mcpjam.com/cli/apps-conformance.md) — validate `_meta.ui.resourceUri` and `ui://` resource w</text><text x="20" y="1055">iring</text><text x="20" y="1075">* [Tools, resources &amp; prompts](https://docs.mcpjam.com/cli/tools-resources-prompts.md) — exercise the connected surface</text><text x="20" y="1095">* [Migrating to CLI 4.0](https://docs.mcpjam.com/cli/migration.md) — command-path and flag changes under `mcpjam cloud`</text><text x="20" y="1115">* [Full command reference](https://docs.mcpjam.com/cli/reference.md) — every flag for every command</text><text x="20" y="1135"></text><text x="20" y="1155"></text><text x="20" y="1175">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text><text x="20" y="1195">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
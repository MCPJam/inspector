<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1045"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">35f2a757fc68416c9b1f1932f4eb3d95 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; run-eval.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json, os, time, urllib.request, urllib.error</text><text x="20" y="115">from pathlib import Path</text><text x="20" y="135">BASE = os.environ[&#x27;MCPJAM_API_URL&#x27;].rstrip(&#x27;/&#x27;) + &#x27;/projects/project_fixture&#x27;</text><text x="20" y="155">HEADERS = {&#x27;Authorization&#x27;: &#x27;Bearer &#x27; + os.environ[&#x27;MCPJAM_API_KEY&#x27;], &#x27;Content-Type&#x27;: &#x27;application/json&#x27;}</text><text x="20" y="175">def api(path, body=None):</text><text x="20" y="195">    req = urllib.request.Request(BASE + path, data=None if body is None else json.dumps(body).encode(), headers=HEADERS)</text><text x="20" y="215">    try:</text><text x="20" y="235">        with urllib.request.urlopen(req, timeout=30) as response:</text><text x="20" y="255">            return json.load(response)</text><text x="20" y="275">    except urllib.error.HTTPError as error:</text><text x="20" y="295">        raise RuntimeError(f&#x27;{error.code}: {error.read().decode()}&#x27;) from None</text><text x="20" y="315">def save(name, data):</text><text x="20" y="335">    Path(name).write_text(json.dumps(data, indent=2) + &#x27;\n&#x27;)</text><text x="20" y="355">if not Path(&#x27;suite-created.json&#x27;).exists():</text><text x="20" y="375">    save(&#x27;suite-created.json&#x27;, api(&#x27;/eval-suites&#x27;, json.loads(Path(&#x27;suite.json&#x27;).read_text())))</text><text x="20" y="395">suite_id = json.loads(Path(&#x27;suite-created.json&#x27;).read_text())[&#x27;suiteId&#x27;]</text><text x="20" y="415">run = api(&#x27;/eval-runs&#x27;, {&#x27;suiteId&#x27;: suite_id})</text><text x="20" y="435">save(&#x27;run-created.json&#x27;, run)</text><text x="20" y="455">print(json.dumps(run), flush=True)</text><text x="20" y="475">run_id = run[&#x27;runId&#x27;]</text><text x="20" y="495">for _ in range(40):</text><text x="20" y="515">    status = api(&#x27;/eval-runs/&#x27; + run_id)</text><text x="20" y="535">    save(&#x27;run-status.json&#x27;, status)</text><text x="20" y="555">    print(json.dumps(status), flush=True)</text><text x="20" y="575">    if status.get(&#x27;status&#x27;) in {&#x27;completed&#x27;, &#x27;failed&#x27;, &#x27;cancelled&#x27;, &#x27;timed_out&#x27;}:</text><text x="20" y="595">        break</text><text x="20" y="615">    time.sleep(2)</text><text x="20" y="635">else:</text><text x="20" y="655">    raise RuntimeError(&#x27;Run has not reached a terminal state; use run-created.json to resume polling.&#x27;)</text><text x="20" y="675">for suffix, name in [(&#x27;iterations&#x27;, &#x27;iterations.json&#x27;), (&#x27;decision-summary&#x27;, &#x27;decision-summary.json&#x27;)]:</text><text x="20" y="695">    data = api(&#x27;/eval-runs/&#x27; + run_id + &#x27;/&#x27; + suffix)</text><text x="20" y="715">    save(name, data)</text><text x="20" y="735">    print(name, json.dumps(data), flush=True)</text><text x="20" y="755">if status.get(&#x27;status&#x27;) != &#x27;completed&#x27; or status.get(&#x27;result&#x27;) not in {&#x27;passed&#x27;, &#x27;pass&#x27;}:</text><text x="20" y="775">    raise SystemExit(1)</text><text x="20" y="795">PY</text><text x="20" y="815">python3 run-eval.py</text><text x="20" y="835">Traceback (most recent call last):</text><text x="20" y="855">  File &quot;/workspace/run-eval.py&quot;, line 17, in &lt;module&gt;</text><text x="20" y="875">    run = api(&#x27;/eval-runs&#x27;, {&#x27;suiteId&#x27;: suite_id})</text><text x="20" y="895">          ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^</text><text x="20" y="915">  File &quot;/workspace/run-eval.py&quot;, line 11
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1045"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">a58c18e6c43e4eefbdfa5ed6926b937c — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; check-result.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">&quot;&quot;&quot;Grade MCPJam&#x27;s public iteration evidence independently of its run verdict.&quot;&quot;&quot;</text><text x="20" y="115">import json</text><text x="20" y="135">import sys</text><text x="20" y="155">from pathlib import Path</text><text x="20" y="175">expected = float(sys.argv[1]) if len(sys.argv) &gt; 1 else 5</text><text x="20" y="195">source = Path(sys.argv[2]) if len(sys.argv) &gt; 2 else Path(&#x27;iterations.json&#x27;)</text><text x="20" y="215">report_path = Path(sys.argv[3]) if len(sys.argv) &gt; 3 else Path(&#x27;evaluation.json&#x27;)</text><text x="20" y="235">evidence = json.loads(source.read_text())</text><text x="20" y="255">iterations = evidence.get(&#x27;items&#x27;, [])</text><text x="20" y="275">checks = []</text><text x="20" y="295">for iteration in iterations:</text><text x="20" y="315">    calls = iteration.get(&#x27;actualToolCalls&#x27;, [])</text><text x="20" y="335">    passed = len(calls) == 1 and calls[0].get(&#x27;toolName&#x27;) == &#x27;add&#x27; and calls[0].get(&#x27;arguments&#x27;) == {&#x27;a&#x27;: 2, &#x27;b&#x27;: 3} and calls[0].</text><text x="20" y="355">get(&#x27;result&#x27;, {}).get(&#x27;structuredContent&#x27;) == {&#x27;sum&#x27;: expected} and calls[0].get(&#x27;result&#x27;, {}).get(&#x27;isError&#x27;) is False</text><text x="20" y="375">    checks.append({&#x27;iterationId&#x27;: iteration.get(&#x27;id&#x27;), &#x27;passed&#x27;: passed})</text><text x="20" y="395">passed = bool(checks) and all(c[&#x27;passed&#x27;] for c in checks)</text><text x="20" y="415">report = {&#x27;passed&#x27;: passed, &#x27;expectedSum&#x27;: expected, &#x27;iterations&#x27;: checks, &#x27;evidence&#x27;: str(source), &#x27;grading&#x27;: &#x27;exact local check </text><text x="20" y="435">of public MCPJam iteration evidence&#x27;}</text><text x="20" y="455">report_path.write_text(json.dumps(report, indent=2) + &#x27;\n&#x27;)</text><text x="20" y="475">print(json.dumps(report))</text><text x="20" y="495">sys.exit(0 if passed else 1)</text><text x="20" y="515">PY</text><text x="20" y="535">python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="555">p=&#x27;run-eval.py&#x27;;s=open(p).read();start=s.index(&quot;evidence = json.loads(Path(&#x27;iterations.json&#x27;).read_text())&quot;);end=s.index(&quot;if statu</text><text x="20" y="575">s.get(&#x27;status&#x27;) != &#x27;completed&#x27;&quot;,start)</text><text x="20" y="595">s=s[:start]+&quot;import subprocess, sys\nsubprocess.run([sys.executable, &#x27;check-result.py&#x27;], check=True)\n&quot;+s[end:];open(p,&#x27;w&#x27;).write(</text><text x="20" y="615">s)</text><text x="20" y="635">PY</text><text x="20" y="655">python3 run-eval.py</text><text x="20" y="675">python3 check-result.py 999 iterations.json local-negative-control.json</text><text x="20" y="695">rc=$?</text><text x="20" y="715">test &quot;$rc&quot; -eq 1</text><text x="20" y="735">{&quot;runId&quot;: &quot;run_fixture_5&quot;, &quot;suiteId&quot;: &quot;suite_authored_5&quot;, &quot;status&quot;: &quot;running&quot;, &quot;servers&quot;: [{&quot;id&quot;: &quot;server_fixture&quot;, &quot;name&quot;: &quot;Arith</text><text x="20" y="755">metic&quot;}], &quot;environment&quot;: null}</text><text x="20" y="775">{&quot;id&quot;: &quot;run_fixture_5&quot;, &quot;suiteId&quot;: &quot;suite_authored_5&quot;, &quot;runNumber&quot;: 5, &quot;status&quot;: &quot;completed&quot;, &quot;result&quot;: &quot;passed&quot;, &quot;summary&quot;: {&quot;tot</text><text x="20" y="795">al&quot;: 1, &quot;passed&quot;: 1, &quot;failed&quot;: 0, &quot;passRate&quot;: 1.0}, &quot;source&quot;: &quot;api&quot;, &quot;notes&quot;: &quot;SIMULATED: deterministic fixture execution; no host</text><text x="20" y="815">ed model or live billing.&quot;, &quot;createdAt&quot;: 1794707305125, &quot;completedAt&quot;: 1794707305125}</text><text x="20" y="835">iterations.json {&quot;items&quot;: [{&quot;id&quot;: &quot;run_fixture_5_0&quot;, &quot;testCaseId&quot;: &quot;suite_authored_5_case_0&quot;, &quot;title&quot;: &quot;add 2 and 3 returns 5&quot;, &quot;i</text><text x="20" y="855">terationNumber&quot;: 1, &quot;status&quot;: &quot;completed&quot;, &quot;result&quot;: &quot;passed&quot;, &quot;actualToolCalls&quot;: [{&quot;toolName&quot;: &quot;add&quot;, &quot;arguments&quot;: {&quot;a&quot;: 2, &quot;b&quot;: </text><text x="20" y="875">3}, &quot;result&quot;: {&quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;{\&quot;sum\&quot;: 5}&quot;}], &quot;structuredContent&quot;: {&quot;sum&quot;: 5}, &quot;isError&quot;: false}}], &quot;expec</text><text x="20" y="895">tedToolCalls&quot;: [], &quot;durationMs&quot;: 1, &quot;error&quot;: null}]}</text><text x="20" y="915">{&quot;passed&quot;: true, &quot;expectedSum&quot;: 5, &quot;iterations&quot;: [{&quot;iterationId&quot;: &quot;run_fixture_5_0&quot;, &quot;passed&quot;: true}], &quot;evidence&quot;: &quot;iterations.jso</text><text x="20" y="935">n&quot;, &quot;grading&quot;: &quot;exact local check of public MCPJam iteration evidence&quot;}</text><text x="20" y="955">{&quot;passed&quot;: false, &quot;expectedSum&quot;: 999.0, &quot;iterations&quot;: [{&quot;iterationId&quot;: &quot;run_fixture_5_0&quot;, &quot;passed&quot;: false}], &quot;evidence&quot;: &quot;iteratio</text><text x="20" y="975">ns.json&quot;, &quot;grading&quot;: &quot;exact local check of public MCPJam iteration evidence&quot;}</text><text x="20" y="995"></text><text x="20" y="1015">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
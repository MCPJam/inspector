<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1145"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">51f25366d5144746bd16c87b2716b792 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; check-result.py &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">&quot;&quot;&quot;Grade MCPJam&#x27;&quot;&#x27;&quot;&#x27;s public iteration evidence independently of its run verdict.&quot;&quot;&quot;</text><text x="20" y="195">import json</text><text x="20" y="215">import sys</text><text x="20" y="235">from pathlib import Path</text><text x="20" y="255">expected = float(sys.argv[1]) if len(sys.argv) &gt; 1 else 5</text><text x="20" y="275">source = Path(sys.argv[2]) if len(sys.argv) &gt; 2 else Path(&#x27;&quot;&#x27;&quot;&#x27;iterations.json&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="295">report_path = Path(sys.argv[3]) if len(sys.argv) &gt; 3 else Path(&#x27;&quot;&#x27;&quot;&#x27;evaluation.json&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="315">evidence = json.loads(source.read_text())</text><text x="20" y="335">iterations = evidence.get(&#x27;&quot;&#x27;&quot;&#x27;items&#x27;&quot;&#x27;&quot;&#x27;, [])</text><text x="20" y="355">checks = []</text><text x="20" y="375">for iteration in iterations:</text><text x="20" y="395">    calls = iteration.get(&#x27;&quot;&#x27;&quot;&#x27;actualToolCalls&#x27;&quot;&#x27;&quot;&#x27;, [])</text><text x="20" y="415">    passed = len(calls) == 1 and calls[0].get(&#x27;&quot;&#x27;&quot;&#x27;toolName&#x27;&quot;&#x27;&quot;&#x27;) == &#x27;&quot;&#x27;&quot;&#x27;add&#x27;&quot;&#x27;&quot;&#x27; and calls[0].get(&#x27;&quot;&#x27;&quot;&#x27;arguments&#x27;&quot;&#x27;&quot;&#x27;) == {&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="435">a&#x27;&quot;&#x27;&quot;&#x27;: 2, &#x27;&quot;&#x27;&quot;&#x27;b&#x27;&quot;&#x27;&quot;&#x27;: 3} and calls[0].get(&#x27;&quot;&#x27;&quot;&#x27;result&#x27;&quot;&#x27;&quot;&#x27;, {}).get(&#x27;&quot;&#x27;&quot;&#x27;structuredContent&#x27;&quot;&#x27;&quot;&#x27;) == {&#x27;&quot;&#x27;&quot;&#x27;sum&#x27;&quot;&#x27;&quot;&#x27;: expected} an</text><text x="20" y="455">d calls[0].get(&#x27;&quot;&#x27;&quot;&#x27;result&#x27;&quot;&#x27;&quot;&#x27;, {}).get(&#x27;&quot;&#x27;&quot;&#x27;isError&#x27;&quot;&#x27;&quot;&#x27;) is False</text><text x="20" y="475">    checks.append({&#x27;&quot;&#x27;&quot;&#x27;iterationId&#x27;&quot;&#x27;&quot;&#x27;: iteration.get(&#x27;&quot;&#x27;&quot;&#x27;id&#x27;&quot;&#x27;&quot;&#x27;), &#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;: passed})</text><text x="20" y="495">passed = bool(checks) and all(c[&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;] for c in checks)</text><text x="20" y="515">report = {&#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;: passed, &#x27;&quot;&#x27;&quot;&#x27;expectedSum&#x27;&quot;&#x27;&quot;&#x27;: expected, &#x27;&quot;&#x27;&quot;&#x27;iterations&#x27;&quot;&#x27;&quot;&#x27;: checks, &#x27;&quot;&#x27;&quot;&#x27;evidence&#x27;&quot;&#x27;&quot;&#x27;: str(source)</text><text x="20" y="535">, &#x27;&quot;&#x27;&quot;&#x27;grading&#x27;&quot;&#x27;&quot;&#x27;: &#x27;&quot;&#x27;&quot;&#x27;exact local check of public MCPJam iteration evidence&#x27;&quot;&#x27;&quot;&#x27;}</text><t
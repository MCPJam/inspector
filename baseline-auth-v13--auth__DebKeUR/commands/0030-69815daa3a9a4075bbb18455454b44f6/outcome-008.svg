l`) or `tokens.id_token` answers `400` with `details.code: \&quot;fi</text><text x="20" y="555">eld_not_accepted\&quot;`; any other unknown field answers `400`.&quot;, &quot;additionalProperties&quot;: false, &quot;required&quot;: [&quot;tokens&quot;, &quot;clientInforma</text><text x="20" y="575">tion&quot;], &quot;properties&quot;: {&quot;tokens&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;additionalProperties&quot;: false, &quot;required&quot;: [&quot;access_token&quot;], &quot;properties&quot;: {&quot;a</text><text x="20" y="595">ccess_token&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;format&quot;: &quot;password&quot;, &quot;description&quot;: &quot;At most 16 KB; a larger one answers `400` with `details.cod</text><text x="20" y="615">e: \&quot;token_too_large\&quot;`.&quot;}, &quot;refresh_token&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;format&quot;: &quot;password&quot;, &quot;description&quot;: &quot;Optional, and best omitted w</text><text x="20" y="635">hen CI uploads a fresh token before each run or when the issuer rejects refreshes: stored, it only adds a long-lived credential. A</text><text x="20" y="655">t most 16 KB.&quot;}, &quot;expires_in&quot;: {&quot;type&quot;: &quot;number&quot;, &quot;minimum&quot;: 0, &quot;description&quot;: &quot;Seconds until the access token expires.&quot;}, &quot;token_</text><text x="20" y="675">type&quot;: {&quot;type&quot;: &quot;string&quot;}, &quot;scope&quot;: {&quot;type&quot;: &quot;string&quot;}}}, &quot;clientInformation&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;additionalProperties&quot;: false, &quot;</text><text x="20" y="695">required&quot;: [&quot;clientId&quot;], &quot;properties&quot;: {&quot;clientId&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;The OAuth client the token was issued to.&quot;}</text><text x="20" y="715">, &quot;clientSecret&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;format&quot;: &quot;password&quot;}}}}}</text><
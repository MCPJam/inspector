ot;settings&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {&quot;minimumAccuracy&quot;: {&quot;type&quot;: &quot;number</text><text x="20" y="1135">&quot;, &quot;minimum&quot;: 0, &quot;maximum&quot;: 100, &quot;description&quot;: &quot;Minimum pass rate as a PERCENT, 0-100. Legacy suites only; v2 suites use `passThr</text><text x="20" y="1155">eshold` (a fraction) and refuse this field.&quot;}, &quot;minimumIterations&quot;: {&quot;type&quot;: [&quot;integer&quot;, &quot;null&quot;], &quot;minimum&quot;: 1, &quot;maximum&quot;: 10, &quot;de</text><text x="20" y="1175">scription&quot;: &quot;Suite-level floor on per-case iterations: every case runs at least this many times (`max(case.iterations, minimumIter</text><text x="20" y="1195">ations)`). `null` clears it.&quot;}, &quot;matchOptions&quot;: {&quot;type&quot;: [&quot;object&quot;, &quot;null&quot;], &quot;description&quot;: &quot;Suite default tool-call match options</text><text x="20" y="1215">, in either vocabulary: public (`toolCallOrder: any|in-order|exact`, `extraToolCalls`, `arguments`) or internal (`toolCallOrder: i</text><text x="20" y="1235">gnore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), never both in one object. Fields you omit keep their current val</text><text x="20" y="1255">ues; `null` clears them.&quot;}, &quot;checks&quot;: {&quot;type&quot;: [&quot;array&quot;, &quot;null&quot;], &quot;items&quot;: {&quot;type&quot;: &quot;object&quot;}}, &quot;judge&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;prope</text><text x="20" y="1275">rties&quot;: {&quot;enabled&quot;: {&quot;type&quot;: &quot;boolean&quot;}, &quot;model&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;minLength&quot;: 1}, &quot;autoRun&quot;: {&quot;type&quot;: &quot;boolean&quot;, &quot;description&quot;</text><text x="20" y="1295">: &quot;The flag the grader actually gates on. Without it a suite can be `enabled` forever and never grade a run.&quot;}, &quot;threshold&quot;: {&quot
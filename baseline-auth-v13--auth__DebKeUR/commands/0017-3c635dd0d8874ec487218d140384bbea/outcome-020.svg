quest\&quot;}, \&quot;example\</text><text x="20" y="835">&quot;: {\&quot;suiteName\&quot;: \&quot;smoke\&quot;, \&quot;serverIds\&quot;: [\&quot;srv_abc123\&quot;], \&quot;tests\&quot;: [{\&quot;title\&quot;: \&quot;echo works\&quot;, \&quot;runs\&quot;: 1, \&quot;model\&quot;: \&quot;a</text><text x="20" y="855">nthropic/claude-haiku-4.5\&quot;, \&quot;provider\&quot;: \&quot;anthropic\&quot;, \&quot;steps\&quot;: [{\&quot;id\&quot;: \&quot;s1\&quot;, \&quot;kind\&quot;: \&quot;prompt\&quot;, \&quot;prompt\&quot;: \&quot;Use the</text><text x="20" y="875"> echo tool to say hi\&quot;}, {\&quot;id\&quot;: \&quot;s2\&quot;, \&quot;kind\&quot;: \&quot;assert\&quot;, \&quot;assertion\&quot;: {\&quot;type\&quot;: \&quot;toolCalledWith\&quot;, \&quot;toolName\&quot;: \&quot;echo</text><text x="20" y="895">\&quot;, \&quot;args\&quot;: {\&quot;args\&quot;: {\&quot;text\&quot;: \&quot;hi\&quot;}}}}]}]}}}}, \&quot;responses\&quot;: {\&quot;202\&quot;: {\&quot;description\&quot;: \&quot;Run created; execution continu</text><text x="20" y="915">es in the background.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCreated\&quot;}, \&quot;e</text><text x="20" y="935">xample\&quot;: {\&quot;runId\&quot;: \&quot;run_abc123\&quot;, \&quot;suiteId\&quot;: \&quot;suite_def456\&quot;, \&quot;status\&quot;: \&quot;running\&quot;, \&quot;caseUpsert\&quot;: {\&quot;committed\&quot;: [{\&quot;</text><text x="20" y="955">name\&quot;: \&quot;echo works\&quot;}], \&quot;failed\&quot;: []}, \&quot;environment\&quot;: null}}}}, \&quot;400\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError</text><text x="20" y="975">\&quot;}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;40</text><text x="20" y="995">4\&quot;: {\&quot;$ref\&quot;: \&quot;
 x="20" y="615">nt (`201`) or replaces its token in place (`200`, same id). A well-formed account id never creates one: an unknown id is `404`. An</text><text x="20" y="635">y other reference is a name, and a name no account has creates the account.\\n\\nNothing checks who a token belongs to. The name i</text><text x="20" y="655">s your own label, and replacing a token replaces it whoever it belongs to.\\n\\nThe account becomes **hosted-only**: hosted runs u</text><text x="20" y="675">se it, and no local app, browser or sandbox ever receives its token. Tokens are used with the server URL saved in the project, so </text><text x="20" y="695">the body takes no URL. ID tokens are refused. Each token field is at most 16 KB.\\n\\nUploads to one server are budgeted per perso</text><text x="20" y="715">n: 60, refilling at 120 an hour. Past it the answer is `429` with `Retry-After` and `details.retryAfterMs`. On a server shared wit</text><text x="20" y="735">h the project, only project admins upload, and a member gets `403`.\\n\\nThe answer is the account, never a token.\&quot;, \&quot;requestBod</text><text x="20" y="755">y\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/ServerAccountTokensRe</text><text x="20" y="775">quest\&quot;}, \&quot;example\&quot;: {\&quot;tokens\&quot;: {\&quot;sensitive_value\&quot;: \&quot;[REDACTED]\&quot;, \&quot;expires_in\&quot;: 3600}, \&quot;clientInformation\&quot;: {\&quot;clientI</text><text x="20" y="795">d\&quot;: \&quot;client_123\&quot;}}}}}, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The token was replaced; the account keeps its id.\&quot;, \&quot;cont</text><text x="20" y="815">ent\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/ServerAccount\&quot;}, \&quot;example\&quot;: {\&quot;id\&quot;: \&quot;acct_7f3a9c</te
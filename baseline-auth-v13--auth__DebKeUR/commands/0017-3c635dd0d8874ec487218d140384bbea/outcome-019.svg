 u</text><text x="20" y="435">se it, and no local app, browser or sandbox ever receives its token. Tokens are used with the server URL saved in the project, so </text><text x="20" y="455">the body takes no URL. ID tokens are refused. Each token field is at most 16 KB.\\n\\nUploads to one server are budgeted per perso</text><text x="20" y="475">n: 60, refilling at 120 an hour. Past it the answer is `429` with `Retry-After` and `details.retryAfterMs`. On a server shared wit</text><text x="20" y="495">h the project, only project admins upload, and a member gets `403`.\\n\\nThe answer is the account, never a token.\&quot;, \&quot;requestBod</text><text x="20" y="515">y\&quot;: {\&quot;required\&quot;: true, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/ServerAccountTokensRe</text><text x="20" y="535">quest\&quot;}, \&quot;example\&quot;: {\&quot;tokens\&quot;: {\&quot;sensitive_value\&quot;: \&quot;[REDACTED]\&quot;, \&quot;expires_in\&quot;: 3600}, \&quot;clientInformation\&quot;: {\&quot;clientI</text><text x="20" y="555">d\&quot;: \&quot;client_123\&quot;}}}}}, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The token was replaced; the account keeps its id.\&quot;, \&quot;cont</text><text x="20" y="575">ent\&quot;: {\&quot;application/json\&quot;: {\&quot;schema\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/ServerAccount\&quot;}, \&quot;example\&quot;: {\&quot;id\&quot;: \&quot;acct_7f3a9c</text><text x="20" y="595">\&quot;, \&quot;name\&quot;: \&quot;test-automation-1\&quot;, \&quot;kind\&quot;: \&quot;personal\&quot;, \&quot;isDefault\&quot;: false, \&quot;needsReconnect\&quot;: false, \&quot;hostedOnly\&quot;: true</text><text x="20" y="615">, \&quot;expiresAt\&quot;: 1781142000000, \&quot;createdAt\&quot;: 1781138400000, \&quot;updatedAt\&quot;: 1781138400000}}}}, \&quot;201\&quot;: {\&quot;description\&quot;: \&quot;The a</text><text x="20
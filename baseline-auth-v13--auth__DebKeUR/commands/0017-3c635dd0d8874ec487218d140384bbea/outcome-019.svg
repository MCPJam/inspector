tionId\&quot;: \&quot;deleteServer</text><text x="20" y="1015">Account\&quot;, \&quot;tags\&quot;: [\&quot;Server accounts\&quot;], \&quot;summary\&quot;: \&quot;Delete a server account\&quot;, \&quot;description\&quot;: \&quot;Deletes the account and i</text><text x="20" y="1035">ts stored token. The token&#x27;s issuer is asked to revoke it where the issuer supports revocation (best effort), which also invalidat</text><text x="20" y="1055">es any copy of the same token you hold.\\n\\nThe default account is refused with `409` and `details.code: \\\&quot;account_is_default\\</text><text x="20" y="1075">\&quot;` while other accounts exist, so a delete never changes which account runs act as. Make another account the default first. Send </text><text x="20" y="1095">no body.\&quot;, \&quot;responses\&quot;: {\&quot;200\&quot;: {\&quot;description\&quot;: \&quot;The account was deleted.\&quot;, \&quot;content\&quot;: {\&quot;application/json\&quot;: {\&quot;schema</text><text x="20" y="1115">\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/schemas/ServerAccountDeleted\&quot;}, \&quot;example\&quot;: {\&quot;account\&quot;: \&quot;test-automation-1\&quot;, \&quot;deleted\&quot;: true</text><text x="20" y="1135">}}}}, \&quot;400\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;}, \&quot;401\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;</text><text x="20" y="1155">}, \&quot;403\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;}, \&quot;404\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;}, \&quot;409\&quot;: {</text><text x="20" y="1175">\&quot;$ref\&quot;: \&quot;#/components/responses/Conflict\&quot;}, \&quot;429\&quot;: {\&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;}, \&quot;500\&quot;: {\&quot;$ref\&quot;: \</text><text x="20" y="1195">&quot;#/components/responses/InternalError\&quot;}}}}\n/projects/{projectId}/servers/{serverId}/conformance-runs {\&quot;post\&quot;: {\&quot;operationId\&quot;</text><text x="20" y="1215">: \&quot;startConformanceRun\&quot;, \&quot;tags\&quot;: [\&quot;Conformance runs\&quot;], \&quot;summary\&quot;: \&quot;Start a persisted conformance run\&quot;, \&quot;description\&quot;: </text><text x="20" y="1235">\&quot;Grades the saved server against the protocol, apps, and tasks suites and returns `202` with a run id. The target comes from the </text><text x="20" y="1255">saved server the path names: a body cannot supply a URL. OAuth is not startable here. Poll the run detail for the verdict. Status,</text><text x="20" y="1275"> outcome, and score are three different answers.\\n\\nBy default the run uses the server&#x27;s saved conformance settings: the checks </text><text x="20" y="1295">they select, their tool inputs and their run time budget. The receipt&#x27;s `settingsSource` says what applied: `saved`, or `defaults`</text><text x="20" y="1315"> when the server has nothing saved. `settings: \\\&quot;none\\\&quot;` runs every check with no tool inputs. With saved settings, the start </text><text x="20" y="1335">first checks which MCP protocol version the server speaks and leaves out any suite with no saved checks for that version, as the a</text><text x="20" y="1355">pp does. A retry with the same idempotency key returns the run that key started, with its original suites and settings. A run stil</text></g></svg>
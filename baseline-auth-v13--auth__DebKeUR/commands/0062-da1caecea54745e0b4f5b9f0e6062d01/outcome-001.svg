<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">da1caecea54745e0b4f5b9f0e6062d01 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/validation/check-arithmetic.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json,os,subprocess</text><text x="20" y="115">from pathlib import Path</text><text x="20" y="135">root=Path(__file__).parent</text><text x="20" y="155">cases=[(&#x27;positive&#x27;,{&#x27;a&#x27;:2,&#x27;b&#x27;:3},5),(&#x27;negative&#x27;,{&#x27;a&#x27;:-7,&#x27;b&#x27;:2},-5),(&#x27;zero&#x27;,{&#x27;a&#x27;:0,&#x27;b&#x27;:0},0),(&#x27;decimal&#x27;,{&#x27;a&#x27;:1.25,&#x27;b&#x27;:2.5},3.75),(&#x27;</text><text x="20" y="175">missing&#x27;,{&#x27;a&#x27;:2},None),(&#x27;wrong-type&#x27;,{&#x27;a&#x27;:&#x27;2&#x27;,&#x27;b&#x27;:3},None),(&#x27;extra-field&#x27;,{&#x27;a&#x27;:2,&#x27;b&#x27;:3,&#x27;c&#x27;:4},None)]</text><text x="20" y="195">results=[]</text><text x="20" y="215">for name,args,expected in cases:</text><text x="20" y="235"> cmd=[&#x27;npx&#x27;,&#x27;--yes&#x27;,&#x27;@mcpjam/cli@6.2.2&#x27;,&#x27;tools&#x27;,&#x27;call&#x27;,&#x27;--url&#x27;,&#x27;http://fixture:8765/mcp&#x27;,&#x27;--access-token&#x27;,os.environ[&#x27;MCP_SERVER_T</text><text x="20" y="255">OKEN&#x27;],&#x27;--tool-name&#x27;,&#x27;add&#x27;,&#x27;--tool-args&#x27;,json.dumps(args),&#x27;--quiet&#x27;,&#x27;--format&#x27;,&#x27;json&#x27;]</text><text x="20" y="275"> r=subprocess.run(cmd,capture_output=True,text=True,timeout=15)</text><text x="20" y="295"> try: payload=json.loads(r.stdout)</text><text x="20" y="315"> except ValueError: payload={&#x27;stdout&#x27;:r.stdout,&#x27;stderr&#x27;:r.stderr}</text><text x="20" y="335"> good=(r.returncode==0 and payload.get(&#x27;structuredContent&#x27;,{}).get(&#x27;sum&#x27;)==expected and not payload.get(&#x27;isError&#x27;)) if expected is</text><text x="20" y="355"> not None else (r.returncode!=0 or payload.get(&#x27;isError&#x27;,False))</text><text x="20" y="375"> results.append({&#x27;case&#x27;:name,&#x27;arguments&#x27;:args,&#x27;expectedSum&#x27;:expected,&#x27;exitCode&#x27;:r.returncode,&#x27;passed&#x27;:good,&#x27;response&#x27;:payload})</text><text x="20" y="395">(root/&#x27;arithmetic-checks.json&#x27;).write_text(json.dumps(results,indent=2))</text><text x="20" y="415">print(json.dumps(results,indent=2))</text><text x="20" y="435">raise SystemExit(0 if all(x[&#x27;passed&#x27;] for x in results) else 1)</text><text x="20" y="455">PY</text><text x="20" y="475">python3 /workspace/validation/check-arithmetic.py</text><text x="20" y="495">[</text><text x="20" y="515">  {</text><text x="20" y="535">    &quot;case&quot;: &quot;positive&quot;,</text><text x="20" y="555">    &quot;arguments&quot;: {</text><text x="20" y="575">      &quot;a&quot;: 2,</text><text x="20" y="595">      &quot;b&quot;: 3</text><text x="20" y="615">    },</text><text x="20" y="635">    &quot;expectedSum&quot;: 5,</text><text x="20" y="655">    &quot;exitCode&quot;: 0,</text><text x="20" y="675">    &quot;passed&quot;: true,</text><text x="20" y="695">    &quot;response&quot;: {</text><text x="20" y="715">      &quot;content&quot;: [</text><text x="20" y="735">        {</text><text x="20" y="755">          &quot;type&quot;: &quot;text&quot;,</text><text x="20" y="775">          &quot;text&quot;: &quot;{\&quot;sum\&quot;: 5}&quot;</text><text x="20" y="795">        }</text><text x="20" y="815">      ],</text><text x="20" y="835">      &quot;structuredContent&quot;: {</text><text x="20" y="855">        &quot;sum&quot;: 5</text><text x="20" y="875">      },</text><text x="20" y="895">      &quot;isError&quot;: false,</text><text x="20" y="915">      &quot;_durationMs&quot;: 8</text><text x="20" y="935">    }</text><text x="20" y="955">  },</text><text x=
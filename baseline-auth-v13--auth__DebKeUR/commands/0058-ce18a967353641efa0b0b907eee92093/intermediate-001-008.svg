<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1225"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.878183126449585s — page 8</text><text x="20" y="75">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="95"># List to find the tool</text><text x="20" y="115">mcpjam tools list --url $URL --access-token $TOKEN --format json \</text><text x="20" y="135">  | jq &#x27;.tools[] | select(.name == &quot;search_docs&quot;)&#x27;</text><text x="20" y="155"></text><text x="20" y="175"># Call it</text><text x="20" y="195">mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="215">  --tool-name search_docs \</text><text x="20" y="235">  --tool-args @params.json \</text><text x="20" y="255">  --quiet \</text><text x="20" y="275">  --format json</text><text x="20" y="295">```</text><text x="20" y="315"></text><text x="20" y="335">For generated payloads, pipe JSON through stdin:</text><text x="20" y="355"></text><text x="20" y="375">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="395">echo &#x27;{&quot;query&quot;:&quot;setup guide&quot;}&#x27; | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="415">  --tool-name search_docs --tool-args - --quiet --format json</text><text x="20" y="435">```</text><text x="20" y="455"></text><text x="20" y="475">`--tool-args-stdin` is equivalent to `--tool-args -` and cannot be combined with `--tool-args` or `--params` in the same command:</text><text x="20" y="495"></text><text x="20" y="515">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="535">generate-params | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="555">  --tool-name search_docs --tool-args-stdin --quiet --format json</text><text x="20" y="575">```</text><text x="20" y="595"></text><text x="20" y="615">### Using a credentials file</text><text x="20" y="635"></text><text x="20" y="655">Instead of passing `--access-token` to every command, save credentials once and reuse the file:</text><text x="20" y="675"></text><text x="20" y="695">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="715"># Login and save</text><text x="20" y="735">mcpjam oauth login --url https://your-server.com/mcp --credentials-out creds.json</text><text x="20" y="755"></text><text x="20" y="775"># Reuse everywhere</text><text x="20" y="795">mcpjam tools list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="815">mcpjam resources list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="835">mcpjam tools call --url https://your-server.com/mcp --credentials-file creds.json \</text><text x="20" y="855">  --tool-name search_docs --tool-args @params.json --quiet --format json</text><text x="20" y="875">```</text><text x="20" y="895"></text><text x="20" y="915">### No-auth servers</text><text x="20" y="935"></text><text x="20" y="955">For servers that don&#x27;t require authentication (like `mcp.excalidraw.com/mcp`), omit the auth flags:</text><text x="20" y="975"></text><text x="20" y="995">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1015">mcpjam tools list --url https://mcp.excalidraw.com/mcp</text><text x="20" y="1035">mcpjam tools call --url https://mcp.excalidraw.com/mcp \</text><text x="20" y="1055">  --tool-name read_me</text><text x="20" y="1075">```</text><text x="20" y="1095"></text><text x="20" y="1115">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="1135">`-e/--env` to add values or override inherited ones for local subprocesses.</text><text x="20" y="1155"></text><text x="20" y="1175"></text><text x="20" y="1195">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text></g></svg>
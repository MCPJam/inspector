<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1225"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">f033e2a1f7c24704b2d865cadd9f5b2d — page 9</text><text x="20" y="75">  --tool-args &lt;json&gt;            Tool arguments as a JSON object</text><text x="20" y="95">  --check-overrides &lt;json&gt;      A different tool for some checks, keyed by check</text><text x="20" y="115">                                id:</text><text x="20" y="135">                                {&quot;tasks-cancel-ack-shape&quot;:{&quot;toolName&quot;:&quot;slow_job&quot;,&quot;toolArguments&quot;:{&quot;seconds&quot;:5}}}.</text><text x="20" y="155">                                Checks left out use --tool-name and --tool-args.</text><text x="20" y="175">  --input-responses &lt;json&gt;      Responses to submit when the probed task reports</text><text x="20" y="195">                                input_required, keyed by inputRequests key:</text><text x="20" y="215">                                {&quot;name&quot;:{&quot;result&quot;:{&quot;action&quot;:&quot;accept&quot;,&quot;content&quot;:{&quot;name&quot;:&quot;Ada&quot;}}}}.</text><text x="20" y="235">                                Without it the run stops as soon as the task</text><text x="20" y="255">                                parks on input_required, and the tasks/update</text><text x="20" y="275">                                acknowledgement check is not applicable.</text><text x="20" y="295">  --poll-timeout &lt;ms&gt;           How long to poll a created task for a terminal</text><text x="20" y="315">                                status (default: 30000)</text><text x="20" y="335">  --client-metadata-url &lt;url&gt;   Client metadata URL used for CIMD registration</text><text x="20" y="355">  --redirect-url &lt;url&gt;          OAuth redirect URL to use for the flow</text><text x="20" y="375">  --scopes &lt;scopes&gt;             Space-separated scope string</text><text x="20" y="395">  --step-timeout &lt;ms&gt;           Per-step timeout in milliseconds (default:</text><text x="20" y="415">                                30000)</text><text x="20" y="435">  --print-url                   In interactive mode, print the consent URL to</text><text x="20" y="455">                                stderr instead of launching a browser</text><text x="20" y="475">  --upload                      Upload results even when MCPJAM_API_KEY is not</text><text x="20" y="495">                                otherwise implied</text><text x="20" y="515">  --require-upload              Fail the process if reporting is configured but</text><text x="20" y="535">                                the UI record cannot be written</text><text x="20" y="555">  --oauth-strategy &lt;strategy&gt;   How the OAuth suite signs in: interactive</text><text x="20" y="575">                                (default), headless, or client_credentials</text><text x="20" y="595">  --registration &lt;strategy&gt;     How the OAuth suite registers its client: auto</text><text x="20" y="615">                                (default), dcr, cimd, or preregistered. Auto</text><text x="20" y="635">                                uses --client-id when given, else what the</text><text x="20" y="655">                                server supports</text><text x="20" y="675">  --reporter &lt;reporter&gt;         json-summary or junit-xml</text><text x="20" y="695">  --transport &lt;transport&gt;       Explicit transport type: &quot;http&quot; or &quot;stdio&quot;</text><text x="20" y="715">  --url &lt;url&gt;                   HTTP MCP server URL</text><text x="20" y="735">  --access-token &lt;token&gt;        Bearer access token for HTTP servers</text><text x="20" y="755">  --oauth-access-token &lt;token&gt;  OAuth bearer access token for HTTP servers</text><text x="20" y="775">  --refresh-token &lt;token&gt;       OAuth refresh token for HTTP servers</text><text x="20" y="795">  --client-id &lt;id&gt;              OAuth client ID used with --refresh-token</text><text x="20" y="815">  --client-secret &lt;secret&gt;      OAuth client secret used with --refresh-token</text><text x="20" y="835">  --credentials-file &lt;path&gt;     Load OAuth credentials from a file created by</text><text x="20" y="855">                                oauth login or oauth conformance</text><text x="20" y="875">                                --credentials-out</text><text x="20" y="895">  --header &lt;header&gt;             HTTP header in &quot;Key: Value&quot; format. Repeat to</text><text x="20" y="915">                                send multiple headers. (default: [])</text><text x="20" y="935">  --client-capabilities &lt;json&gt;  Client capabilities as JSON, @path, or - for</text><text x="20" y="955">                                stdin</text><text x="20" y="975">  --command &lt;command&gt;           Command for a stdio MCP server</text><text x="20" y="995">  --args &lt;arg...&gt;               Preferred stdio command arguments. Pass multiple</text><text x="20" y="1015">                                values or repeat the flag.</text><text x="20" y="1035">  --command-args &lt;arg&gt;          Legacy stdio command argument. Repeat to pass</text><text x="20" y="1055">                                multiple arguments.</text><text x="20" y="1075">  -e, --env &lt;env...&gt;            Stdio environment assignment in &quot;KEY=[REDACTED]&quot;</text><text x="20" y="1095">                                format. Pass multiple values or repeat the flag.</text><text x="20" y="1115">  --cwd &lt;path&gt;                  Working directory for the stdio MCP server</text><text x="20" y="1135">                                process</text><text x="20" y="1155">  -h, --help                    display help for command</text><text x="20" y="1175"></text><text x="20" y="1195">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
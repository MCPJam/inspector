<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.8628761768341064s — page 7</text><text x="20" y="75">For a local stdio server:</text><text x="20" y="95"></text><text x="20" y="115">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="135">mcpjam tools list \</text><text x="20" y="155">  --command npx \</text><text x="20" y="175">  --args -y @modelcontextprotocol/server-everything \</text><text x="20" y="195">  --cwd $PWD \</text><text x="20" y="215">  -e DEBUG=1</text><text x="20" y="235">```</text><text x="20" y="255"></text><text x="20" y="275">## Resources</text><text x="20" y="295"></text><text x="20" y="315">### List resources</text><text x="20" y="335"></text><text x="20" y="355">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="375">mcpjam resources list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="395">```</text><text x="20" y="415"></text><text x="20" y="435">### Read a resource</text><text x="20" y="455"></text><text x="20" y="475">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="495">mcpjam resources read --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="515">  --resource-uri &quot;file:///docs/readme.md&quot;</text><text x="20" y="535">```</text><text x="20" y="555"></text><text x="20" y="575">Use `resources read --resource-uri ui://...` when you need to inspect raw widget HTML or other UI resources directly.</text><text x="20" y="595"></text><text x="20" y="615">### List resource templates</text><text x="20" y="635"></text><text x="20" y="655">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="675">mcpjam resources templates --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="695">```</text><text x="20" y="715"></text><text x="20" y="735">## Prompts</text><text x="20" y="755"></text><text x="20" y="775">### List prompts</text><text x="20" y="795"></text><text x="20" y="815">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="835">mcpjam prompts list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="855">```</text><text x="20" y="875"></text><text x="20" y="895">### Get a prompt</text><text x="20" y="915"></text><text x="20" y="935">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="955">mcpjam prompts get --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="975">  --prompt-name summarize \</text><text x="20" y="995">  --prompt-args &#x27;{&quot;text&quot;: &quot;Hello world&quot;}&#x27;</text><text x="20" y="1015">```</text><text x="20" y="1035"></text><text x="20" y="1055">## Common patterns</text><text x="20" y="1075"></text><text x="20" y="1095">### Enumerate the full server surface</text><text x="20" y="1115"></text><text x="20" y="1135">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1155"># One-shot: doctor already sweeps everything</text><text x="20" y="1175">mcpjam server doctor --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="1195"></text><text x="20" y="1215"># Or individually for focused output</text><text x="20" y="1235">mcpjam tools list --url $URL --access-token $TOKEN --format json | jq &#x27;.tools[].name&#x27;</text><text x="20" y="1255">mcpjam resources list --url $URL --access-token $TOKEN --format json | jq &#x27;.resources[].uri&#x27;</text><text x="20" y="1275">mcpjam prompts list --url $URL --access-token $TOKEN --format json | jq &#x27;.prompts[].name&#x27;</text><text x="20" y="1295">```</text><text x="20" y="1315"></text><text x="20" y="1335">### Test a specific tool end-to-end</text><text x="20" y="1355"></text></g></svg>
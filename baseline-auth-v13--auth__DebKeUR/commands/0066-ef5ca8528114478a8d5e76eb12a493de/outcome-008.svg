<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1305"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">ef5ca8528114478a8d5e76eb12a493de — page 8</text><text x="20" y="75"></text><text x="20" y="95">### Test a specific tool end-to-end</text><text x="20" y="115"></text><text x="20" y="135">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="155"># List to find the tool</text><text x="20" y="175">mcpjam tools list --url $URL --access-token $TOKEN --format json \</text><text x="20" y="195">  | jq &#x27;.tools[] | select(.name == &quot;search_docs&quot;)&#x27;</text><text x="20" y="215"></text><text x="20" y="235"># Call it</text><text x="20" y="255">mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="275">  --tool-name search_docs \</text><text x="20" y="295">  --tool-args @params.json \</text><text x="20" y="315">  --quiet \</text><text x="20" y="335">  --format json</text><text x="20" y="355">```</text><text x="20" y="375"></text><text x="20" y="395">For generated payloads, pipe JSON through stdin:</text><text x="20" y="415"></text><text x="20" y="435">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="455">echo &#x27;{&quot;query&quot;:&quot;setup guide&quot;}&#x27; | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="475">  --tool-name search_docs --tool-args - --quiet --format json</text><text x="20" y="495">```</text><text x="20" y="515"></text><text x="20" y="535">`--tool-args-stdin` is equivalent to `--tool-args -` and cannot be combined with `--tool-args` or `--params` in the same command:</text><text x="20" y="555"></text><text x="20" y="575">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="595">generate-params | mcpjam tools call --url $URL --access-token $TOKEN \</text><text x="20" y="615">  --tool-name search_docs --tool-args-stdin --quiet --format json</text><text x="20" y="635">```</text><text x="20" y="655"></text><text x="20" y="675">### Using a credentials file</text><text x="20" y="695"></text><text x="20" y="715">Instead of passing `--access-token` to every command, save credentials once and reuse the file:</text><text x="20" y="735"></text><text x="20" y="755">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="775"># Login and save</text><text x="20" y="795">mcpjam oauth login --url https://your-server.com/mcp --credentials-out creds.json</text><text x="20" y="815"></text><text x="20" y="835"># Reuse everywhere</text><text x="20" y="855">mcpjam tools list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="875">mcpjam resources list --url https://your-server.com/mcp --credentials-file creds.json</text><text x="20" y="895">mcpjam tools call --url https://your-server.com/mcp --credentials-file creds.json \</text><text x="20" y="915">  --tool-name search_docs --tool-args @params.json --quiet --format json</text><text x="20" y="935">```</text><text x="20" y="955"></text><text x="20" y="975">### No-auth servers</text><text x="20" y="995"></text><text x="20" y="1015">For servers that don&#x27;t require authentication (like `mcp.excalidraw.com/mcp`), omit the auth flags:</text><text x="20" y="1035"></text><text x="20" y="1055">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1075">mcpjam tools list --url https://mcp.excalidraw.com/mcp</text><text x="20" y="1095">mcpjam tools call --url https://mcp.excalidraw.com/mcp \</text><text x="20" y="1115">  --tool-name read_me</text><text x="20" y="1135">```</text><text x="20" y="1155"></text><text x="20" y="1175">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="1195">`-e/--env` to add values or override inherited ones for local subprocesses.</text><text x="20" y="1215"></text><text x="20" y="1235"></text><text x="20" y="1255">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text><text x="20" y="1275">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
 most 10). An unknown value is a usage error. |\n| `2` | Usage error — bad flags, </text><text x="20" y="295">`--reporter`/`--out` without `--wait`, or an invalid suite file (after auth, before any server/model work) |\n| `3` | Auth failed </text><text x="20" y="315">— no credential, or the platform rejected it, at launch or mid-wait (a token that expired during a long poll). Zero credits spent </text><text x="20" y="335">if it happened before launch |\n`--all-targets` is a usage error: compose builds the stack the run uses, so\n`--file` pointing at </text><text x="20" y="355">create-API JSON (no `schemaVersion`) is a usage error&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: </text><text x="20" y="375">false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_01EMZhF8J4C5a3reFwd48p7E&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;con</text><text x="20" y="395">fig&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="415">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3tXzDFE8rKkbxPrAiMF&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="435">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;Credentials are valid. Next I&#x27;ll list the evals and the organizations.&quot;}], &quot;cont</text><text x="20" y="455">ainer&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_creation_input</text><text x="20" y="475">_tokens&quot;: 1364, &quot;cache_read_input_tokens&quot;: 24915, &quot;cache_creation&quot;: {&quot;ephemeral_5m_input_tokens&quot;: 0, &quot;ephemeral_1h_input_tokens&quot;: </text>
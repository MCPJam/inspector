<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="725"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +30.566413640975952s — page 1</text><text x="20" y="75">{&quot;duration_api_ms&quot;: 15138, &quot;stop_reason&quot;: &quot;end_turn&quot;, &quot;session_id&quot;: &quot;3c5cc202-fc31-42fc-91e8-b7038cf86a90&quot;, &quot;total_cost_usd&quot;: 0.08</text><text x="20" y="95">06743, &quot;usage&quot;: {&quot;input_tokens&quot;: 10, &quot;cache_creation_input_tokens&quot;: 14013, &quot;cache_read_input_tokens&quot;: 98323, &quot;output_tokens&quot;: 1477</text><text x="20" y="115">, &quot;output_tokens_details&quot;: {&quot;thinking_tokens&quot;: 0}, &quot;server_tool_use&quot;: {&quot;web_search_requests&quot;: 0, &quot;web_fetch_requests&quot;: 0}, &quot;servic</text><text x="20" y="135">e_tier&quot;: &quot;standard&quot;, &quot;cache_creation&quot;: {&quot;ephemeral_1h_input_tokens&quot;: 14013, &quot;ephemeral_5m_input_tokens&quot;: 0}, &quot;inference_geo&quot;: &quot;glo</text><text x="20" y="155">bal&quot;, &quot;iterations&quot;: [], &quot;speed&quot;: &quot;standard&quot;, &quot;fallback_credit&quot;: null}, &quot;modelUsage&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 10, &quot;ou</text><text x="20" y="175">tputTokens&quot;: 1477, &quot;cacheReadInputTokens&quot;: 98323, &quot;cacheCreationInputTokens&quot;: 14013, &quot;webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.0806743,</text><text x="20" y="195"> &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 0, &quot;cacheCreationEphemeral5mInputTokens&quot;: 0, &quot;cacheCreatio</text><text x="20" y="215">nEphemeral1hInputTokens&quot;: 14013, &quot;canonicalModel&quot;: &quot;claude-sonnet-5-5&quot;, &quot;provider&quot;: &quot;firstParty&quot;, &quot;costBasis&quot;: &quot;list&quot;}}, &quot;permissi</text><text x="20" y="235">on_denials&quot;: [], &quot;terminal_reason&quot;: &quot;completed&quot;, &quot;fast_mode_state&quot;: &quot;off&quot;, &quot;fast_mode_disabled_reason&quot;: &quot;sdk_opt_in_required&quot;, &quot;su</text><text x="20" y="255">bagent_stats&quot;: {&quot;spawned&quot;: 0, &quot;requested&quot;: {&quot;background&quot;: 0, &quot;foreground&quot;: 0, &quot;unset&quot;: 0}, &quot;started_in_background&quot;: 0, &quot;max_depth&quot;</text><text x="20" y="275">: 0, &quot;spawned_by_subagents&quot;: 0, &quot;completed&quot;: 0, &quot;failed&quot;: 0, &quot;killed&quot;: {&quot;parent&quot;: 0, &quot;user&quot;: 0, &quot;system&quot;: 0}, &quot;refused&quot;: {&quot;depth_l</text><text x="20" y="295">imit&quot;: 0, &quot;concurrency_limit&quot;: 0, &quot;budget&quot;: 0}, &quot;by_type&quot;: {}}, &quot;safety_stops&quot;: 0, &quot;is_error&quot;: false, &quot;num_turns&quot;: 5, &quot;subtype&quot;: &quot;</text><text x="20" y="315">success&quot;, &quot;api_error_status&quot;: null, &quot;result&quot;: &quot;**Result: the server mostly works, but it has one bug.** I ran a handshake check an</text><text x="20" y="335">d five `add` calls against it with the MCPJam CLI. The overflow case returns invalid JSON.\n\n**Concern note:** I expected every c</text><text x="20" y="355">all to return a valid result or a clean tool error. The overflow case did not. `add(1e308, 1e308)` overflows to infinity. The serv</text><text x="20" y="375">er sends the unquoted token `Infinity` in the response body, which is not valid JSON, and the client throws `INTERNAL_ERROR: Unexp</text><text x="20" y="395">ected token &#x27;I&#x27;`. The tool says it only accepts finite numbers, but it doesn&#x27;t check that the sum is finite. Nothing was missing f</text><text x="20" y="415">rom the docs. Next I would reject non-finite results with `isError: true`, then re-run `bash /workspace/run.sh`.\n\n**What I ran:*</text><text x="20" y="435">* I followed the docs at docs.mcpjam.com, installed `@mcpjam/cli`, and used `mcpjam server doctor` and `mcpjam tools call`.\n\n**H</text><text x="20" y="455">andshake check:** `mcpjam server doctor` reports status `ready`. The server is `arithmetic-fixture` 1.0.0 on streamable-http, prot</text><text x="20" y="475">ocol 2025-11-25. It exposes one tool, `add`, and no resources or prompts. There is no OAuth. The `skills` check was skipped becaus</text><text x="20" y="495">e the server doesn&#x27;t declare the extension, which is expected.\n\n**`add` calls:**\n\n| Input | Output |\n|---|---|\n| `{\&quot;a\&quot;:2,\</text><text x="20" y="515">&quot;b\&quot;:3}` | `{\&quot;sum\&quot;:5}` (correct) |\n| `{\&quot;a\&quot;:-1.5,\&quot;b\&quot;:0.25}` | `{\&quot;sum\&quot;:-1.25}` (correct) |\n| `{\&quot;a\&quot;:\&quot;x\&quot;,\&quot;b\&quot;:1}` | `is</text><text x="20" y="535">Error: true`, \&quot;a and b must be finite numbers\&quot; (correct) |\n| `{\&quot;a\&quot;:1}` (missing `b`) | `isError: true`, same message (correct</text><text x="20" y="555">) |\n| `{\&quot;a\&quot;:1e308,\&quot;b\&quot;:1e308}` | **fails**, see the concern note above |\n\n**Reproduce:** run `bash /workspace/run.sh`. It wr</text><text x="20" y="575">ites the handshake report to `/workspace/doctor.json`. The call outputs from my run are in `/workspace/results.txt`.\n\nI stayed w</text><text x="20" y="595">ithin budget and did not use the MCPJam account API.&quot;, &quot;ttft_ms&quot;: 2454, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 30132, &quot;uuid&quot;: &quot;8b5a4043-</text><text x="20" y="615">2e1a-4811-9831-6920a5588349&quot;, &quot;ttft_stream_ms&quot;: 1326, &quot;time_to_request_ms&quot;: 47, &quot;first_content_frame_ms&quot;: 1326, &quot;queued_turn_count</text><text x="20" y="635">&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 10, &quot;outputTokens&quot;: 1477, &quot;cacheRe</text><text x="20" y="655">adInputTokens&quot;: 98323, &quot;cacheCreationInputTokens&quot;: 14013, &quot;webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.0806743, &quot;contextWindow&quot;: 1000000, </text><text x="20" y="675">&quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 0, &quot;cacheCreationEphemeral5mInputTokens&quot;: 0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 1</text><text x="20" y="695">4013, &quot;canonicalModel&quot;: &quot;claude-sonnet-5-5&quot;, &quot;provider&quot;: &quot;firstParty&quot;, &quot;costBasis&quot;: &quot;list&quot;}}}</text></g></svg>
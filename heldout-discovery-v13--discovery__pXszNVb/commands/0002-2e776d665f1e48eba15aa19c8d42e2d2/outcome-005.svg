<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">2e776d665f1e48eba15aa19c8d42e2d2 — page 5</text><text x="20" y="75">alize handshake. The probe sends an unauthenticated `initialize` request and inspects the response.\n\n**What it returns:**\n\n* T</text><text x="20" y="95">ransport type (streamable-http, SSE, or failed)\n* OAuth metadata (resource metadata URL, authorization server metadata, registrat</text><text x="20" y="115">ion strategies, scopes)\n* `WWW-Authenticate` header parsing\n\nCredential header values never appear in the printed result. `Auth</text><text x="20" y="135">orization`, `Cookie` and `X-Api-Key` print as `[REDACTED]`. `X-Auth-Token` and other sensitive header names print the first four a</text><text x="20" y="155">nd last two characters of a longer value (`abcd...[redacted]...yz`), and `[redacted]` for a value of eight characters or fewer. He</text><text x="20" y="175">ader names are preserved so the request shape remains visible.\n\n### `server doctor`\n\nCombined triage, runs probe, then attempt</text><text x="20" y="195">s a full client connection, then sweeps tools, resources, resource templates, and prompts. Returns a single JSON artifact.\n\n```b</text><text x="20" y="215">ash theme={\&quot;theme\&quot;:\&quot;css-variables\&quot;}\n# Human-readable summary\nmcpjam server doctor --url https://your-server.com/mcp\n\n# Ful</text><text x="20" y="235">l JSON artifact with RPC logs\nmcpjam server doctor --url https://your-server.com/mcp --rpc --out doctor.json\n\n# Stdio server\nm</text><text x="20" y="255">cpjam server doctor --command node --args server.js --cwd /path/to/project\n```\n\n**What it returns:**\n\n* `status`: `ready`, `o</text><text x="20" y="275">auth_required`, or `error`\n* Probe results (transport, OAuth discovery)\n* Initialization info and negotiated capabilities\n* Cou</text><text x="20" y="295">nts: tools, resources, resource templates, prompts\n\nFrom a run without credentials, `ready` means the server let MCPJam connect </text><text x="20" y="315">and list without a token. It does not mean every tool is public: a server can still ask for sign-in when a protected tool is calle</text><text x="20" y="335">d. To check, call that tool with `mcpjam tools call`. A 401 challenge fails the call with `AUTH_REQUIRED`, and its details name th</text><text x="20" y="355">e `mcpjam oauth login` command to run. A ChatGPT-style challenge returns the tool result with `_authChallenge` next to it. See [Mi</text><text x="20" y="375">d-session sign-in](https://docs.mcpjam.com/inspector/lazy-authentication.md#the-cli-tests-and-evals-never-sign-in).\n\nThe `--out </text><text x="20" y="395">&lt;path&gt;` flag writes the full JSON artifact to a file, useful for handoff to another engineer or agent.\nFor stdio targets, those a</text><text x="20" y="415">rtifacts only record the explicit env keys you passed\nvia `-e/--env`; inherited shell variables are not enumerated.\n\nCredential</text><text x="20" y="435"> headers (`Authorization`, `X-Api-Key`, `X-Auth-Token`, and any other sensitive header names) are automatically redacted to `[REDA</text><text x="20" y="455">CTED]` in all printed output and written artifacts, including RPC logs attached via `--rpc`. Header names are preserved so the req</text><text x="20" y="475">uest shape remains visible.\n\n### `server info`\n\nGet initialization info for a connected server.\n\n```bash theme={\&quot;theme\&quot;:\&quot;</text><text x="20" y="495">css-variables\&quot;}\nmcpjam server info --url https://your-server.com/mcp --access-token $TOKEN\n```\n\nReturns the server&#x27;s `serverI</text><text x="20" y="515">nfo` (name, version) and `capabilities` from the MCP initialize response.\n\n### `server capabilities`\n/usr/local/bin/mcpjam&quot;, &quot;s</text><text x="20" y="535">tderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: false, &quot;noOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_0187n8JhW3WVX2b</text><text x="20" y="555">uF5Aw9Rsn&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="575">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3vWTfBHcjC48QRtVwQa&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="595">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;tool_use&quot;, &quot;id&quot;: &quot;toolu_01PLW2rUgM4nVR6JrUoXGWAE&quot;, &quot;name&quot;: &quot;Bash&quot;, &quot;input&quot;: {&quot;command&quot;: &quot;cd /wor</text><text x="20" y="615">kspace; U=http://fixture:8765/mcp; mcpjam server doctor --url $U --rpc --out doctor.json | head -40; mcpjam tools list --url $U | </text><text x="20" y="635">head -50&quot;}, &quot;caller&quot;: {&quot;type&quot;: &quot;direct&quot;}}], &quot;container&quot;: null, &quot;stop_reason&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;</text><text x="20" y="655">usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_creation_input_tokens&quot;: 1689, &quot;cache_read_input_tokens&quot;: 20758, &quot;cache_creation&quot;: {&quot;ephemeral_5</text><text x="20" y="675">m_input_tokens&quot;: 0, &quot;ephemeral_1h_input_tokens&quot;: 1689}, &quot;output_tokens&quot;: 16, &quot;service_tier&quot;: &quot;standard&quot;, &quot;inference_geo&quot;: &quot;global&quot;</text><text x="20" y="695">, &quot;speed&quot;: &quot;standard&quot;}, &quot;input_transformations&quot;: [], &quot;diagnostics&quot;: null, &quot;context_management&quot;: null}, &quot;parent_tool_use_id&quot;
uot;,\&quot;content-type\&quot;:\&quot;appl</text><text x="20" y="1075">ication/json\&quot;,\&quot;date\&quot;:\&quot;Sun, 15 Nov 2026 02:27:15 GMT\&quot;,\&quot;server\&quot;:\&quot;HarborSyntheticFixture/1 Python/3.11.2\&quot;},\&quot;body\&quot;:{\&quot;code\</text><text x="20" y="1095">&quot;:\&quot;NOT_FOUND\&quot;,\&quot;message\&quot;:\&quot;Not found\&quot;},\&quot;contentType\&quot;:\&quot;application/json\&quot;}},{\&quot;name\&quot;:\&quot;resource_metadata\&quot;,\&quot;request\&quot;:{\&quot;m</text><text x="20" y="1115">ethod\&quot;:\&quot;GET\&quot;,\&quot;url\&quot;:\&quot;http://fixture:8765/.well-known/oauth-protected-resource\&quot;,\&quot;headers\&quot;:{\&quot;mcp-protocol-version\&quot;:\&quot;2025-</text><text x="20" y="1135">11-25\&quot;}},\&quot;durationMs\&quot;:42,\&quot;response\&quot;:{\&quot;status\&quot;:404,\&quot;statusText\&quot;:\&quot;Not Found\&quot;,\&quot;headers\&quot;:{\&quot;content-length\&quot;:\&quot;45\&quot;,\&quot;con</text><text x="20" y="1155">tent-type\&quot;:\&quot;application/json\&quot;,\&quot;date\&quot;:\&quot;Sun, 15 Nov 2026 02:27:15 GMT\&quot;,\&quot;server\&quot;:\&quot;HarborSyntheticFixture/1 Python/3.11.2\&quot;}</text><text x="20" y="1175">,\&quot;body\&quot;:{\&quot;code\&quot;:\&quot;NOT_FOUND\&quot;,\&quot;message\&quot;:\&quot;Not found\&quot;},\&quot;contentType\&quot;:\&quot;application/json\&quot;}}]},\&quot;initialize\&quot;:{\&quot;protocolVe</text><text x="20" y="1195">rsion\&quot;:\&quot;2025-11-25\&quot;,\&quot;serverInfo\&quot;:{\&quot;name\&quot;:\&quot;arithmetic-fixture\&quot;,\&quot;version\&quot;:\&quot;1.0.0\&quot;},\&quot;capabilities\&quot;:{\&quot;tools\&quot;:{\&quot;listC</text><text x="20" y="1215">hanged\&quot;:false}},\&quot;contentType\&quot;:\&quot;application/json\&quot;},\&quot;oauth\&quot;:{\&quot;required\&quot;:false,\&quot;optional\&quot;:false,\&quot;resourceMetadataUrl\&quot;:\&quot;</text><text x="20" y="1235">http://fixture:8765/.well-known/oauth-protected-resource
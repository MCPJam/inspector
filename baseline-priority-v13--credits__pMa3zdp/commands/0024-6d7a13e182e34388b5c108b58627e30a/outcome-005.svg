<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6d7a13e182e34388b5c108b58627e30a — page 5</text><text x="20" y="75">        - Catalog</text><text x="20" y="95">      summary: Read the organization&#x27;s spend budget</text><text x="20" y="115">      description: &gt;-</text><text x="20" y="135">        The ceiling on what this organization may spend on MCPJam-billed work —</text><text x="20" y="155">        chat, evals, judges and computer time — in the current billing window,</text><text x="20" y="175">        and how much of it has been spent.</text><text x="20" y="195"></text><text x="20" y="215"></text><text x="20" y="235">        Any member may read it: a member who cannot raise the ceiling still</text><text x="20" y="255">        needs to know it exists, because it is what refused their run. `capUsd:</text><text x="20" y="275">        null` means the organization is uncapped, which is the default.</text><text x="20" y="295"></text><text x="20" y="315"></text><text x="20" y="335">        Runs that use your own provider keys are never counted against the</text><text x="20" y="355">        budget and never blocked by it. Neither is the free daily allowance — it</text><text x="20" y="375">        is not credits.</text><text x="20" y="395">      operationId: getSpendBudget</text><text x="20" y="415">      responses:</text><text x="20" y="435">        &#x27;200&#x27;:</text><text x="20" y="455">          description: The organization&#x27;s spend budget.</text><text x="20" y="475">          content:</text><text x="20" y="495">            application/json:</text><text x="20" y="515">              schema:</text><text x="20" y="535">                $ref: &#x27;#/components/schemas/SpendBudget&#x27;</text><text x="20" y="555">        &#x27;401&#x27;:</text><text x="20" y="575">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="595">        &#x27;403&#x27;:</text><text x="20" y="615">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="635">        &#x27;404&#x27;:</text><text x="20" y="655">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="675">        &#x27;429&#x27;:</text><text x="20" y="695">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="715">        &#x27;500&#x27;:</text><text x="20" y="735">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="755">components:</text><text x="20" y="775">  parameters:</text><text x="20" y="795">    organizationId:</text><text x="20" y="815">      name: organizationId</text><text x="20" y="835">      in: path</text><text x="20" y="855">      required: true</text><text x="20" y="875">      description: ID of the organization, from `GET /organizations`.</text><text x="20" y="895">      schema:</text><text x="20" y="915">        type: string</text><text x="20" y="935">  schemas:</text><text x="20" y="955">    SpendBudget:</text><text x="20" y="975">      type: object</text><text x="20" y="995">      description: &gt;-</text><text x="20" y="1015">        An organization&#x27;s ceiling on MCPJam-billed spend for the current billing</text><text x="20" y="1035">        window. Amounts appear in both USD and credits (1 credit = 1 cent); the</text><text x="20" y="1055">        credit figures are what the ledger actually stores.</text><text x="20" y="1075">      required:</text><text x="20" y="1095">        - capUsd</text><text x="20" y="1115">        - capCredits</text><text x="20" y="1135">        - alertPercents</text><text x="20" y="1155">        - spentUsd</text><text x="20" y="1175">        - spentCredits</text><text x="20" y="1195">        - windowStartAt</text><text x="20" y="1215">        - windowEndsAt</text><text x="20" y="1235">        - alertedPercents</text><text x="20" y="1255">        - capReachedAt</text><text x="20" y="1275">        - updatedAt</text><text x="20" y="1295">        - minCapUsd</text><text x="20" y="1315">        - maxCapUsd</text><text x="20" y="1335">        - supported</text><text x="20" y="1355">      properties:</text></g></svg>
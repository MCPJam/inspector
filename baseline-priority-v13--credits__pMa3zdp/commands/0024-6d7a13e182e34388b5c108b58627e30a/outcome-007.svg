<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6d7a13e182e34388b5c108b58627e30a — page 7</text><text x="20" y="75">          type: string</text><text x="20" y="95">          description: &gt;-</text><text x="20" y="115">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="135">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="155">            status says otherwise.</text><text x="20" y="175">          enum:</text><text x="20" y="195">            - UNAUTHORIZED</text><text x="20" y="215">            - FORBIDDEN</text><text x="20" y="235">            - NOT_FOUND</text><text x="20" y="255">            - CONFLICT</text><text x="20" y="275">            - VALIDATION_ERROR</text><text x="20" y="295">            - RATE_LIMITED</text><text x="20" y="315">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="335">            - SERVER_UNREACHABLE</text><text x="20" y="355">            - TIMEOUT</text><text x="20" y="375">            - OAUTH_REQUIRED</text><text x="20" y="395">            - AUTH_REQUIRED</text><text x="20" y="415">            - INTERNAL_ERROR</text><text x="20" y="435">        message:</text><text x="20" y="455">          type: string</text><text x="20" y="475">          description: &gt;-</text><text x="20" y="495">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="515">            match on it.</text><text x="20" y="535">        details:</text><text x="20" y="555">          type: object</text><text x="20" y="575">          description: Optional, unstructured context bag.</text><text x="20" y="595">          additionalProperties: true</text><text x="20" y="615">  responses:</text><text x="20" y="635">    Unauthorized:</text><text x="20" y="655">      description: &gt;-</text><text x="20" y="675">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="695">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="715">        a property of the server, not your key.</text><text x="20" y="735">      content:</text><text x="20" y="755">        application/json:</text><text x="20" y="775">          schema:</text><text x="20" y="795">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="815">          examples:</text><text x="20" y="835">            badKey:</text><text x="20" y="855">              summary: Invalid or revoked key</text><text x="20" y="875">              value:</text><text x="20" y="895">                code: UNAUTHORIZED</text><text x="20" y="915">                message: Invalid API key</text><text x="20" y="935">            oauthRequired:</text><text x="20" y="955">              summary: Target server needs an OAuth grant</text><text x="20" y="975">              value:</text><text x="20" y="995">                code: OAUTH_REQUIRED</text><text x="20" y="1015">                message: Server requires OAuth authorization</text><text x="20" y="1035">    Forbidden:</text><text x="20" y="1055">      description: Key is valid but not allowed to do this.</text><text x="20" y="1075">      content:</text><text x="20" y="1095">        application/json:</text><text x="20" y="1115">          schema:</text><text x="20" y="1135">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1155">          example:</text><text x="20" y="1175">            code: FORBIDDEN</text><text x="20" y="1195">            message: You do not have access to this project</text><text x="20" y="1215">    NotFound:</text><text x="20" y="1235">      description: Unknown project, server, or resource.</text><text x="20" y="1255">      content:</text><text x="20" y="1275">        application/json:</text><text x="20" y="1295">          schema:</text><text x="20" y="1315">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1335">          example:</text><text x="20" y="1355">            code: NOT_FOUND</text></g></svg>
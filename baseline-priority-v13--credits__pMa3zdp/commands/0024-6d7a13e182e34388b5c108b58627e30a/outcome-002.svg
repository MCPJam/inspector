<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6d7a13e182e34388b5c108b58627e30a — page 2</text><text x="20" y="75">        &quot;description&quot;: &quot;Add two finite numbers.&quot;,</text><text x="20" y="95">        &quot;inputSchema&quot;: {</text><text x="20" y="115">          &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="135">          &quot;properties&quot;: {</text><text x="20" y="155">            &quot;a&quot;: {</text><text x="20" y="175">              &quot;type&quot;: &quot;number&quot;</text><text x="20" y="195">            },</text><text x="20" y="215">            &quot;b&quot;: {</text><text x="20" y="235">              &quot;type&quot;: &quot;number&quot;</text><text x="20" y="255">            }</text><text x="20" y="275">          },</text><text x="20" y="295">          &quot;required&quot;: [</text><text x="20" y="315">            &quot;a&quot;,</text><text x="20" y="335">            &quot;b&quot;</text><text x="20" y="355">          ]</text><text x="20" y="375">        }</text><text x="20" y="395">      }</text><text x="20" y="415">    ]</text><text x="20" y="435">  }</text><text x="20" y="455">}</text><text x="20" y="475">&gt; ## Documentation Index</text><text x="20" y="495">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="515">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="535"></text><text x="20" y="555"># Read the organization&#x27;s spend budget</text><text x="20" y="575"></text><text x="20" y="595">&gt; The ceiling on what this organization may spend on MCPJam-billed work — chat, evals, judges and computer time — in the current b</text><text x="20" y="615">illing window, and how much of it has been spent.</text><text x="20" y="635"></text><text x="20" y="655">Any member may read it: a member who cannot raise the ceiling still needs to know it exists, because it is what refused their run.</text><text x="20" y="675"> `capUsd: null` means the organization is uncapped, which is the default.</text><text x="20" y="695"></text><text x="20" y="715">Runs that use your own provider keys are never counted against the budget and never blocked by it. Neither is the free daily allow</text><text x="20" y="735">ance — it is not credits.</text><text x="20" y="755"></text><text x="20" y="775"></text><text x="20" y="795"></text><text x="20" y="815">## OpenAPI</text><text x="20" y="835"></text><text x="20" y="855">````yaml /reference/openapi.json get /organizations/{organizationId}/spend-budget</text><text x="20" y="875">openapi: 3.1.0</text><text x="20" y="895">info:</text><text x="20" y="915">  title: MCPJam API</text><text x="20" y="935">  version: 1.0.0-preview</text><text x="20" y="955">  description: &gt;-</text><text x="20" y="975">    Programmatic access to MCP servers saved in your MCPJam projects — live</text><text x="20" y="995">    diagnostics (validate, inspect, export) and operations: call tools, render</text><text x="20" y="1015">    prompts, run eval suites asynchronously and poll their results, and import</text><text x="20" y="1035">    OAuth tokens.</text><text x="20" y="1055"></text><text x="20" y="1075"></text><text x="20" y="1095">    **The API is in preview**: the surface may change while we finish the</text><text x="20" y="1115">    design. Error `code` values are stable; error `message` strings are not.</text><text x="20" y="1135">    Write clients that ignore unknown response fields.</text><text x="20" y="1155">  contact:</text><text x="20" y="1175">    name: MCPJam</text><text x="20" y="1195">    url: https://github.com/MCPJam/inspector/issues</text><text x="20" y="1215">servers:</text><text x="20" y="1235">  - url: https://app.mcpjam.com/api/v1</text><text x="20" y="1255">    description: Hosted MCPJam</text><text x="20" y="1275">security:</text><text x="20" y="1295">  - bearerAuth: []</text><text x="20" y="1315">tags:</text><text x="20" y="1335">  - name: Agent browsers</text><text x="20" y="1355">    description: &gt;-</text></g></svg>
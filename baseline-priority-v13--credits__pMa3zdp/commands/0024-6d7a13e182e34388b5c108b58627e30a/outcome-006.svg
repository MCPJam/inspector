<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6d7a13e182e34388b5c108b58627e30a — page 6</text><text x="20" y="75">        capUsd:</text><text x="20" y="95">          type:</text><text x="20" y="115">            - number</text><text x="20" y="135">            - &#x27;null&#x27;</text><text x="20" y="155">          description: The ceiling in USD. `null` means uncapped.</text><text x="20" y="175">        capCredits:</text><text x="20" y="195">          type:</text><text x="20" y="215">            - integer</text><text x="20" y="235">            - &#x27;null&#x27;</text><text x="20" y="255">          description: The same ceiling as the ledger stores it.</text><text x="20" y="275">        alertPercents:</text><text x="20" y="295">          type: array</text><text x="20" y="315">          items:</text><text x="20" y="335">            type: integer</text><text x="20" y="355">          description: &gt;-</text><text x="20" y="375">            Whole percents of the cap that notify owners and admins. Reaching</text><text x="20" y="395">            the cap always notifies, whether or not 100 is listed.</text><text x="20" y="415">        spentUsd:</text><text x="20" y="435">          type: number</text><text x="20" y="455">          description: MCPJam-billed spend so far in this window, in USD.</text><text x="20" y="475">        spentCredits:</text><text x="20" y="495">          type: integer</text><text x="20" y="515">          description: The same spend as the ledger counted it.</text><text x="20" y="535">        windowStartAt:</text><text x="20" y="555">          type: integer</text><text x="20" y="575">          description: &gt;-</text><text x="20" y="595">            Start of the current billing window (epoch ms). Team and enterprise</text><text x="20" y="615">            organizations run on their own subscription cycle; everyone else on</text><text x="20" y="635">            the UTC month.</text><text x="20" y="655">        windowEndsAt:</text><text x="20" y="675">          type: integer</text><text x="20" y="695">          description: When the window resets and the counter returns to zero (epoch ms).</text><text x="20" y="715">        alertedPercents:</text><text x="20" y="735">          type: array</text><text x="20" y="755">          items:</text><text x="20" y="775">            type: integer</text><text x="20" y="795">          description: &gt;-</text><text x="20" y="815">            Thresholds already announced this window. Each fires once per</text><text x="20" y="835">            window.</text><text x="20" y="855">        capReachedAt:</text><text x="20" y="875">          type:</text><text x="20" y="895">            - integer</text><text x="20" y="915">            - &#x27;null&#x27;</text><text x="20" y="935">          description: When the cap was reached this window, or `null`.</text><text x="20" y="955">        updatedAt:</text><text x="20" y="975">          type:</text><text x="20" y="995">            - integer</text><text x="20" y="1015">            - &#x27;null&#x27;</text><text x="20" y="1035">          description: When the budget was last changed (epoch ms).</text><text x="20" y="1055">        minCapUsd:</text><text x="20" y="1075">          type: number</text><text x="20" y="1095">          description: The smallest budget the platform accepts.</text><text x="20" y="1115">        maxCapUsd:</text><text x="20" y="1135">          type: number</text><text x="20" y="1155">          description: The largest budget the platform accepts.</text><text x="20" y="1175">        supported:</text><text x="20" y="1195">          type: boolean</text><text x="20" y="1215">          description: False for a personal organization, which cannot have a budget.</text><text x="20" y="1235">    Error:</text><text x="20" y="1255">      type: object</text><text x="20" y="1275">      required:</text><text x="20" y="1295">        - code</text><text x="20" y="1315">        - message</text><text x="20" y="1335">      properties:</text><text x="20" y="1355">        code:</text></g></svg>
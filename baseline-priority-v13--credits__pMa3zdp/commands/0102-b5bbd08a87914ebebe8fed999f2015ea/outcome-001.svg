<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b5bbd08a87914ebebe8fed999f2015ea — page 1</text><text x="20" y="75">$ /bin/bash -c cat /workspace/mcp-eval/launch.json; cat /workspace/mcp-eval/run-eval.py; python3 /workspace/mcp-eval/run-eval.py</text><text x="20" y="95">{&quot;suiteId&quot;:&quot;suite_fixture&quot;,&quot;serverIds&quot;:[&quot;server_fixture&quot;],&quot;iterationOverride&quot;:1,&quot;idempotencyKey&quot;:&quot;arithmetic-smoke-20261115-01&quot;}</text><text x="20" y="115">#!/usr/bin/env python3</text><text x="20" y="135">&quot;&quot;&quot;Repeat the saved one-iteration suite; credentials come only from environment.&quot;&quot;&quot;</text><text x="20" y="155">import json,time,sys</text><text x="20" y="175">from pathlib import Path</text><text x="20" y="195">from api import call</text><text x="20" y="215">root=Path(__file__).resolve().parent</text><text x="20" y="235">body=json.loads((root/&#x27;launch.json&#x27;).read_text())</text><text x="20" y="255"># Supply a fresh key for a deliberately new run, or reuse one to retry safely.</text><text x="20" y="275">if len(sys.argv)&gt;1: body[&#x27;idempotencyKey&#x27;]=sys.argv[1]</text><text x="20" y="295">r=call(&#x27;POST&#x27;,&#x27;/projects/project_fixture/eval-runs&#x27;,body,&#x27;launch-latest&#x27;)</text><text x="20" y="315">if r[&#x27;http_status&#x27;]!=202: sys.exit(2)</text><text x="20" y="335">data=r[&#x27;body&#x27;]; runid=data.get(&#x27;runId&#x27;) or data.get(&#x27;id&#x27;)</text><text x="20" y="355">if not runid: raise RuntimeError(&#x27;Launch response has no run ID&#x27;)</text><text x="20" y="375">path=&#x27;/projects/project_fixture/eval-runs/&#x27;+runid</text><text x="20" y="395">for i in range(30):</text><text x="20" y="415"> r=call(&#x27;GET&#x27;,path,
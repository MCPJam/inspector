isting suite, optionally upserting inline `tests` into it) or `suiteName</text><text x="20" y="375">` + `tests` + `serverIds` (create a new suite and run it). Inline `tests` alone \u2014 without a `suiteId` or a `suiteName` \u2014</text><text x="20" y="395"> are rejected with `VALIDATION_ERROR`.\n\n`environmentId` requires `suiteId`: an environment is launchable only through a suite th</text><text x="20" y="415">at has it attached (`environmentIds`, set via `PATCH /eval-suites/{suiteId}`), so an environment run on a not-yet-created suite co</text><text x="20" y="435">uld never be satisfied. `environmentId` and `serverIds` are mutually exclusive.&quot;,</text><text x="20" y="455">  &quot;anyOf&quot;: [</text><text x="20" y="475">    {</text><text x="20" y="495">      &quot;required&quot;: [</text><text x="20" y="515">        &quot;suiteId&quot;</text><text x="20" y="535">      ]</text><text x="20" y="555">    },</text><text x="20" y="575">    {</text><text x="20" y="595">      &quot;required&quot;: [</text><text x="20" y="615">        &quot;suiteName&quot;,</text><text x="20" y="635">        &quot;tests&quot;,</text><text x="20" y="655">        &quot;serverIds&quot;</text><text x="20" y="675">      ],</text><text x="20" y="695">      &quot;properties&quot;: {</text><text x="20" y="715">        &quot;tests&quot;: {</text><text x="20" y="735">          &quot;minItems&quot;: 1</text><text x="20" y="755">        }</text><text x="20" y="775">      }</text><text x="20" y="795">    }</text><text x="20" y="815">  ],</text><text x="20" y="835">  &quot;properties&quot;: {</text><text x="20" y="855">    &quot;suiteId&quot;: {</text><text x="20" y="875">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="895">      &quot;description&quot;: &quot;Existing suite to rerun. A bare `suiteId` with no `tests` reruns the suite exactly as configured.&quot;</text><text x="20" y="915">    },</text><text x="20" y="935">    &quot;hosts&quot;: {</text><text x="20" y="955">      
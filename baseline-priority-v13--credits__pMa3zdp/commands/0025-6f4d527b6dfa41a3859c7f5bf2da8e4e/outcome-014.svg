<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6f4d527b6dfa41a3859c7f5bf2da8e4e — page 14</text><text x="20" y="75">        - code</text><text x="20" y="95">        - message</text><text x="20" y="115">      properties:</text><text x="20" y="135">        code:</text><text x="20" y="155">          type: string</text><text x="20" y="175">          description: &gt;-</text><text x="20" y="195">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="215">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="235">            status says otherwise.</text><text x="20" y="255">          enum:</text><text x="20" y="275">            - UNAUTHORIZED</text><text x="20" y="295">            - FORBIDDEN</text><text x="20" y="315">            - NOT_FOUND</text><text x="20" y="335">            - CONFLICT</text><text x="20" y="355">            - VALIDATION_ERROR</text><text x="20" y="375">            - RATE_LIMITED</text><text x="20" y="395">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="415">            - SERVER_UNREACHABLE</text><text x="20" y="435">            - TIMEOUT</text><text x="20" y="455">            - OAUTH_REQUIRED</text><text x="20" y="475">            - AUTH_REQUIRED</text><text x="20" y="495">            - INTERNAL_ERROR</text><text x="20" y="515">        message:</text><text x="20" y="535">          type: string</text><text x="20" y="555">          description: &gt;-</text><text x="20" y="575">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="595">            match on it.</text><text x="20" y="615">        details:</text><text x="20" y="635">          type: object</text><text x="20" y="655">          description: Optional, unstructured context bag.</text><text x="20" y="675">          additionalProperties: true</text><text x="20" y="695">  responses:</text><text x="20" y="715">    Unauthorized:</text><text x="20" y="735">      description: &gt;-</text><text x="20" y="755">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="775">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="795">        a property of the server, not your key.</text><text x="20" y="815">      content:</text><text x="20" y="835">        application/json:</text><text x="20" y="855">          schema:</text><text x="20" y="875">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="895">          examples:</text><text x="20" y="915">            badKey:</text><text x="20" y="935">              summary: Invalid or revoked key</text><text x="20" y="955">              value:</text><text x="20" y="975">                code: UNAUTHORIZED</text><text x="20" y="995">                message: Invalid API key</text><text x="20" y="1015">            oauthRequired:</text><text x="20" y="1035">              summary: Target server needs an OAuth grant</text><text x="20" y="1055">              value:</text><text x="20" y="1075">                code: OAUTH_REQUIRED</text><text x="20" y="1095">                message: Server requires OAuth authorization</text><text x="20" y="1115">    Forbidden:</text><text x="20" y="1135">      description: Key is valid but not allowed to do this.</text><text x="20" y="1155">      content:</text><text x="20" y="1175">        application/json:</text><text x="20" y="1195">          schema:</text><text x="20" y="1215">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1235">          example:</text><text x="20" y="1255">            code: FORBIDDEN</text><text x="20" y="1275">            message: You do not have access to this project</text><text x="20" y="1295">    NotFound:</text><text x="20" y="1315">      description: Unknown project, server, or resource.</text><text x="20" y="1335">      content:</text><text x="20" y="1355">        application/json:</text></g></svg>
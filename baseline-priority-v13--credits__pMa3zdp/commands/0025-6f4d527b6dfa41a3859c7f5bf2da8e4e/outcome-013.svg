<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6f4d527b6dfa41a3859c7f5bf2da8e4e — page 13</text><text x="20" y="75">        - minCapUsd</text><text x="20" y="95">        - maxCapUsd</text><text x="20" y="115">        - supported</text><text x="20" y="135">      properties:</text><text x="20" y="155">        capUsd:</text><text x="20" y="175">          type:</text><text x="20" y="195">            - number</text><text x="20" y="215">            - &#x27;null&#x27;</text><text x="20" y="235">          description: The ceiling in USD. `null` means uncapped.</text><text x="20" y="255">        capCredits:</text><text x="20" y="275">          type:</text><text x="20" y="295">            - integer</text><text x="20" y="315">            - &#x27;null&#x27;</text><text x="20" y="335">          description: The same ceiling as the ledger stores it.</text><text x="20" y="355">        alertPercents:</text><text x="20" y="375">          type: array</text><text x="20" y="395">          items:</text><text x="20" y="415">            type: integer</text><text x="20" y="435">          description: &gt;-</text><text x="20" y="455">            Whole percents of the cap that notify owners and admins. Reaching</text><text x="20" y="475">            the cap always notifies, whether or not 100 is listed.</text><text x="20" y="495">        spentUsd:</text><text x="20" y="515">          type: number</text><text x="20" y="535">          description: MCPJam-billed spend so far in this window, in USD.</text><text x="20" y="555">        spentCredits:</text><text x="20" y="575">          type: integer</text><text x="20" y="595">          description: The same spend as the ledger counted it.</text><text x="20" y="615">        windowStartAt:</text><text x="20" y="635">          type: integer</text><text x="20" y="655">          description: &gt;-</text><text x="20" y="675">            Start of the current billing window (epoch ms). Team and enterprise</text><text x="20" y="695">            organizations run on their own subscription cycle; everyone else on</text><text x="20" y="715">            the UTC month.</text><text x="20" y="735">        windowEndsAt:</text><text x="20" y="755">          type: integer</text><text x="20" y="775">          description: When the window resets and the counter returns to zero (epoch ms).</text><text x="20" y="795">        alertedPercents:</text><text x="20" y="815">          type: array</text><text x="20" y="835">          items:</text><text x="20" y="855">            type: integer</text><text x="20" y="875">          description: &gt;-</text><text x="20" y="895">            Thresholds already announced this window. Each fires once per</text><text x="20" y="915">            window.</text><text x="20" y="935">        capReachedAt:</text><text x="20" y="955">          type:</text><text x="20" y="975">            - integer</text><text x="20" y="995">            - &#x27;null&#x27;</text><text x="20" y="1015">          description: When the cap was reached this window, or `null`.</text><text x="20" y="1035">        updatedAt:</text><text x="20" y="1055">          type:</text><text x="20" y="1075">            - integer</text><text x="20" y="1095">            - &#x27;null&#x27;</text><text x="20" y="1115">          description: When the budget was last changed (epoch ms).</text><text x="20" y="1135">        minCapUsd:</text><text x="20" y="1155">          type: number</text><text x="20" y="1175">          description: The smallest budget the platform accepts.</text><text x="20" y="1195">        maxCapUsd:</text><text x="20" y="1215">          type: number</text><text x="20" y="1235">          description: The largest budget the platform accepts.</text><text x="20" y="1255">        supported:</text><text x="20" y="1275">          type: boolean</text><text x="20" y="1295">          description: False for a personal organization, which cannot have a budget.</text><text x="20" y="1315">    Error:</text><text x="20" y="1335">      type: object</text><text x="20" y="1355">      required:</text></g></svg>
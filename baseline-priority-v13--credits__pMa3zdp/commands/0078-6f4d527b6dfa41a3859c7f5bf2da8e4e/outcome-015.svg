<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="925"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6f4d527b6dfa41a3859c7f5bf2da8e4e — page 15</text><text x="20" y="75">          schema:</text><text x="20" y="95">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="115">          example:</text><text x="20" y="135">            code: NOT_FOUND</text><text x="20" y="155">            message: Server not found</text><text x="20" y="175">    RateLimited:</text><text x="20" y="195">      description: &gt;-</text><text x="20" y="215">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="235">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="255">      headers:</text><text x="20" y="275">        Retry-After:</text><text x="20" y="295">          description: Seconds to wait before retrying.</text><text x="20" y="315">          schema:</text><text x="20" y="335">            type: integer</text><text x="20" y="355">      content:</text><text x="20" y="375">        application/json:</text><text x="20" y="395">          schema:</text><text x="20" y="415">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="435">          example:</text><text x="20" y="455">            code: RATE_LIMITED</text><text x="20" y="475">            message: API key rate limit exceeded. Slow down and retry.</text><text x="20" y="495">    InternalError:</text><text x="20" y="515">      description: Something failed on MCPJam&#x27;s side.</text><text x="20" y="535">      content:</text><text x="20" y="555">        application/json:</text><text x="20" y="575">          schema:</text><text x="20" y="595">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="615">          example:</text><text x="20" y="635">            code: INTERNAL_ERROR</text><text x="20" y="655">            message: Unexpected internal error</text><text x="20" y="675">  securitySchemes:</text><text x="20" y="695">    bearerAuth:</text><text x="20" y="715">      type: http</text><text x="20" y="735">      scheme: Bearer [REDACTED]: &gt;-</text><text x="20" y="755">        MCPJam API key (`sk_…`). Create one at [Settings → API</text><text x="20" y="775">        keys](https://app.mcpjam.com/settings/api-keys). Guest sessions cannot</text><text x="20" y="795">        use the API, and API keys cannot manage other API keys.</text><text x="20" y="815"></text><text x="20" y="835">````</text><text x="20" y="855"></text><text x="20" y="875">This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation platform.</text><text x="20" y="895">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">9258a3315091463c97264759f747d9a8 — page 11</text><text x="20" y="75">lapsed-seconds heartbeat only appears when stderr is a TTY. The normal JSON output is compact; pass `--debug-out &lt;path&gt;` for the f</text><text x="20" y="95">ull render envelope.</text><text x="20" y="115"></text><text x="20" y="135">For a local stdio server:</text><text x="20" y="155"></text><text x="20" y="175">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="195">mcpjam tools list \</text><text x="20" y="215">  --command npx \</text><text x="20" y="235">  --args -y @modelcontextprotocol/server-everything \</text><text x="20" y="255">  --cwd $PWD \</text><text x="20" y="275">  -e DEBUG=1</text><text x="20" y="295">```</text><text x="20" y="315"></text><text x="20" y="335">## Resources</text><text x="20" y="355"></text><text x="20" y="375">### List resources</text><text x="20" y="395"></text><text x="20" y="415">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="435">mcpjam resources list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="455">```</text><text x="20" y="475"></text><text x="20" y="495">### Read a resource</text><text x="20" y="515"></text><text x="20" y="535">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="555">mcpjam resources read --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="575">  --resource-uri &quot;file:///docs/readme.md&quot;</text><text x="20" y="595">```</text><text x="20" y="615"></text><text x="20" y="635">Use `resources read --resource-uri ui://...` when you need to inspect raw widget HTML or other UI resources directly.</text><text x="20" y="655"></text><text x="20" y="675">### List resource templates</text><text x="20" y="695"></text><text x="20" y="715">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="735">mcpjam resources templates --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="755">```</text><text x="20" y="775"></text><text x="20" y="795">## Prompts</text><text x="20" y="815"></text><text x="20" y="835">### List prompts</text><text x="20" y="855"></text><text x="20" y="875">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="895">mcpjam prompts list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="915">```</text><text x="20" y="935"></text><text x="20" y="955">### Get a prompt</text><text x="20" y="975"></text><text x="20" y="995">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1015">mcpjam prompts get --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="1035">  --prompt-name summarize \</text><text x="20" y="1055">  --prompt-args &#x27;{&quot;text&quot;: &quot;Hello world&quot;}&#x27;</text><text x="20" y="1075">```</text><text x="20" y="1095"></text><text x="20" y="1115">## Common patterns</text><text x="20" y="1135"></text><text x="20" y="1155">### Enumerate the full server surface</text><text x="20" y="1175"></text><text x="20" y="1195">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1215"># One-shot: doctor already sweeps everything</text><text x="20" y="1235">mcpjam server doctor --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="1255"></text><text x="20" y="1275"># Or individually for focused output</text><text x="20" y="1295">mcpjam tools list --url $URL --access-token $TOKEN --format json | jq &#x27;.tools[].name&#x27;</text><text x="20" y="1315">mcpjam resources list --url $URL --access-token $TOKEN --format json | jq &#x27;.resources[].uri&#x27;</text><text x="20" y="1335">mcpjam prompts list --url $URL --access-token $TOKEN --format json | jq &#x27;.prompts[].name&#x27;</text><text x="20" y="1355">```</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">2bb7470ad3eb4ed582d910ea6ed7f995 — page 1</text><text x="20" y="75">$ /bin/bash -c curl -fsSL https://docs.mcpjam.com/cli/server-inspection.md -o /workspace/validation/cli-inspection.md; curl -fsSL </text><text x="20" y="95">https://docs.mcpjam.com/cli/tools-resources-prompts.md -o /workspace/validation/cli-tools.md; curl -sS -H &quot;Authorization: Bearer $</text><text x="20" y="115">MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/projects/project_fixture/eval-suites&quot; -o /workspace/validation/suites.json; cat /workspace/valida</text><text x="20" y="135">tion/suites.json; cat /workspace/validation/cli-inspection.md; npx -y @mcpjam/cli --version</text><text x="20" y="155">{&quot;items&quot;: [{&quot;id&quot;: &quot;suite_fixture&quot;, &quot;name&quot;: &quot;Arithmetic smoke&quot;, &quot;projectId&quot;: &quot;project_fixture&quot;, &quot;description&quot;: &quot;Synthetic fixture: </text><text x="20" y="175">add 2 and 3 and assert 5.&quot;, &quot;environment&quot;: {&quot;servers&quot;: []}, &quot;executionConfig&quot;: null, &quot;hosts&quot;: [], &quot;environmentIds&quot;: [], &quot;settings&quot;</text><text x="20" y="195">: {&quot;policy&quot;: &quot;legacy&quot;, &quot;minimumIterations&quot;: 1}, &quot;schedule&quot;: {}, &quot;createdAt&quot;: 1, &quot;updatedAt&quot;: 2}]}&gt; ## Documentation Index</text><text x="20" y="215">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="235">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="255"></text><text x="20" y="275"># Server Inspection</text><text x="20" y="295"></text><text x="20" y="315">&gt; Probe, diagnose, and export MCP server connectivity and capabilities</text><text x="20" y="335"></text><text x="20" y="355">The `server` command group gives you a breadth-first view of any MCP server — connectivity, OAuth discovery, capabilities, tools, </text><text x="20" y="375">resources, and prompts — without writing code.</text><text x="20" y="395"></text><text x="20" y="415">## Quick start</text><text x="20" y="435"></text><text x="20" y="455">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="475"># One command does everything: probe, connect, sweep tools/resources/prompts</text><text x="20" y="495">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="515">```</text><text x="20" y="535"></text><text x="20" y="555">If the server requires OAuth, doctor reports `oauth_required` with the discovery metadata. See [OAuth login](https://docs.mcpjam.c</text><text x="20" y="575">om/cli/oauth-login.md) to obtain a token, then re-run with `--oauth-access-token`.</text><text x="20" y="595"></text><text x="20" y="615">## Commands</text><text x="20" y="635"></text><text x="20" y="655">### `server probe`</text><text x="20" y="675"></text><text x="20" y="695">Stateless HTTP probe — no full client connection. Tests transport selection, OAuth discovery, and `WWW-Authenticate` parsing.</text><text x="20" y="715"></text><text x="20" y="735">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="755">mcpjam server probe --url https://your-server.com/mcp</text><text x="20" y="775">```</text><text x="20" y="795"></text><text x="20" y="815">Use this when you want to check reachability and OAuth metadata without triggering a full MCP initialize handshake. The probe send</text><text x="20" y="835">s an unauthenticated `initialize` request and inspects the response.</text><text x="20" y="855"></text><text x="20" y="875">**What it returns:**</text><text x="20" y="895"></text><text x="20" y="915">* Transport type (streamable-http, SSE, or failed)</text><text x="20" y="935">* OAuth metadata (resource metadata URL, authorization server metadata, registration strategies, scopes)</text><text x="20" y="955">* `WWW-Authenticate` header parsing</text><text x="20" y="975"></text><text x="20" y="995">Credential headers — `Authorization`, `X-Api-Key`, `X-Auth-Token`, and any other sensitive header names — are automatically redact</text><text x="20" y="1015">ed to `[REDACTED]` in the printed result. Header names are preserved so the request shape remains visible.</text><text x="20" y="1035"></text><text x="20" y="1055">### `server doctor`</text><text x="20" y="1075"></text><text x="20" y="1095">Combined triage — runs probe, then attempts a full client connection, then sweeps tools, resources, resource templates, and prompt</text><text x="20" y="1115">s. Returns a single JSON artifact.</text><text x="20" y="1135"></text><text x="20" y="1155">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1175"># Human-readable summary</text><text x="20" y="1195">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="1215"></text><text x="20" y="1235"># Full JSON artifact with RPC logs</text><text x="20" y="1255">mcpjam server doctor --url https://your-server.com/mcp --rpc --out doctor.json</text><text x="20" y="1275"></text><text x="20" y="1295"># Stdio server</text><text x="20" y="1315">mcpjam server doctor --command node --args server.js --cwd /path/to/project</text><text x="20" y="1335">```</text><text x="20" y="1355"></text></g></svg>
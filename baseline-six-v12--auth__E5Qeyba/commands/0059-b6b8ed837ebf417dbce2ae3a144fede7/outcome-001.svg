<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b6b8ed837ebf417dbce2ae3a144fede7 — page 1</text><text x="20" y="75">$ /bin/bash -c curl -sS -D /workspace/validation/mcp-get.headers -H &quot;Authorization: Bearer $MCP_SERVER_TOKEN&quot; -H &#x27;Accept: text/eve</text><text x="20" y="95">nt-stream&#x27; http://fixture:8765/mcp -o /workspace/validation/mcp-get.json; cat /workspace/validation/mcp-get.headers /workspace/val</text><text x="20" y="115">idation/mcp-get.json; npx -y @mcpjam/cli protocol conformance --help</text><text x="20" y="135">HTTP/1.1 405 Method Not Allowed</text><text x="20" y="155"></text><text x="20" y="175">Server: HarborSyntheticFixture/1 Python/3.11.2</text><text x="20" y="195"></text><text x="20" y="215">Date: Sun, 15 Nov 2026 01:40:37 GMT</text><text x="20" y="235"></text><text x="20" y="255">Content-Type: application/json</text><text x="20" y="275"></text><text x="20" y="295">Content-Length: 21</text><text x="20" y="315"></text><text x="20" y="335">Allow: POST, DELETE</text><text x="20" y="355"></text><text x="20" y="375"></text><text x="20" y="395"></text><text x="20" y="415">{&quot;error&quot;: &quot;Use POST&quot;}Usage: mcpjam protocol conformance [options]</text><text x="20" y="435"></text><text x="20" y="455">Run MCP protocol conformance checks against an HTTP server</text><text x="20" y="475"></text><text x="20" y="495">Options:</text><text x="20" y="515">  --url &lt;url&gt;                   MCP server URL</text><text x="20" y="535">  --access-token &lt;token&gt;        Bearer access token for HTTP servers</text><text x="20" y="555">  --credentials-file &lt;path&gt;     Load OAuth access token from a file created by</text><text x="20" y="575">                                oauth login or oauth conformance</text><text x="20" y="595">                                --credentials-out</text><text x="20" y="615">  --header &lt;header&gt;             HTTP header in &quot;Key: Value&quot; format. Repeat to</text><text x="20" y="635">                                send multiple headers. (default: [])</text><text x="20" y="655">  --check-timeout &lt;ms&gt;          Per-check timeout in milliseconds (default:</text><text x="20" y="675">                                15000)</text><text x="20" y="695">  --category &lt;category&gt;         Check category to run. Repeat for multiple.</text><text x="20" y="715">                                Default: all. (default: [])</text><text x="20" y="735">  --check-id &lt;id&gt;               Specific check ID to run. Repeat for multiple.</text><text x="20" y="755">                                Default: all. (default: [])</text><text x="20" y="775">  --advice-id &lt;id&gt;              Specific advice ID to run. Repeat for multiple.</text><text x="20" y="795">                                Default: all. (default: [])</text><text x="20" y="815">  --protocol-version &lt;version&gt;  Pin the MCP protocol version to conform against.</text><text x="20" y="835">                                Default: legacy (2025-era) behavior.</text><text x="20" y="855">  --fixtures-file &lt;path&gt;        JSON file naming primitives that are SAFE TO</text><text x="20" y="875">                                EXECUTE, so checks that need a real result can</text><text x="20" y="895">                                run:</text><text x="20" y="915">                                {&quot;toolCalls&quot;:[{&quot;toolName&quot;:&quot;echo&quot;,&quot;arguments&quot;:{}}],&quot;promptGets&quot;:[{&quot;promptName&quot;:&quot;welcome&quot;}]}.</text><text x="20" y="935">                                Nothing is ever called without this.</text><text x="20" y="955">  --fixture-tool &lt;name&gt;         Name of a tool that is safe to call with no</text><text x="20" y="975">                                arguments. Repeat for multiple. For tools that</text><text x="20" y="995">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="1015">                                [])</text><text x="20" y="1035">  --fixture-prompt &lt;name&gt;       Name of a prompt that is safe to render with no</text><text x="20" y="1055">                                arguments. Repeat for multiple. For prompts that</text><text x="20" y="1075">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="1095">                                [])</text><text x="20" y="1115">  --log-probe-tool &lt;name&gt;       Name of a tool that writes logs and is safe to</text><text x="20" y="1135">                                call a few times. Lets the 2026-07-28 logging</text><text x="20" y="1155">                                check and log level advice run. Nothing is</text><text x="20" y="1175">                                called without this.</text><text x="20" y="1195">  --log-probe-args &lt;json&gt;       Arguments for --log-probe-tool, as a JSON</text><text x="20" y="1215">                                object. Default: {}.</text><text x="20" y="1235">  --log-probe-level &lt;level&gt;     Log level the advice asks --log-probe-tool for:</text><text x="20" y="1255">                                debug, info, notice, warning, error, critical,</text><text x="20" y="1275">                                alert, emergency. Default: warning.</text><text x="20" y="1295">  --log-filter-tool &lt;name&gt;      Name of a tool the log level advice calls</text><text x="20" y="1315">                                instead of --log-probe-tool. Same rules: it</text><text x="20" y="1335">                                writes logs and is safe to call. Default:</text><text x="20" y="1355">                                --log-probe-tool.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.7868571281433105s — page 1</text><text x="20" y="75">Usage: mcpjam protocol conformance [options]</text><text x="20" y="95"></text><text x="20" y="115">Run MCP protocol conformance checks against an HTTP server</text><text x="20" y="135"></text><text x="20" y="155">Options:</text><text x="20" y="175">  --url &lt;url&gt;                   MCP server URL</text><text x="20" y="195">  --access-token &lt;token&gt;        Bearer access token for HTTP servers</text><text x="20" y="215">  --credentials-file &lt;path&gt;     Load OAuth access token from a file created by</text><text x="20" y="235">                                oauth login or oauth conformance</text><text x="20" y="255">                                --credentials-out</text><text x="20" y="275">  --header &lt;header&gt;             HTTP header in &quot;Key: Value&quot; format. Repeat to</text><text x="20" y="295">                                send multiple headers. (default: [])</text><text x="20" y="315">  --check-timeout &lt;ms&gt;          Per-check timeout in milliseconds (default:</text><text x="20" y="335">                                15000)</text><text x="20" y="355">  --category &lt;category&gt;         Check category to run. Repeat for multiple.</text><text x="20" y="375">                                Default: all. (default: [])</text><text x="20" y="395">  --check-id &lt;id&gt;               Specific check ID to run. Repeat for multiple.</text><text x="20" y="415">                                Default: all. (default: [])</text><text x="20" y="435">  --advice-id &lt;id&gt;              Specific advice ID to run. Repeat for multiple.</text><text x="20" y="455">                                Default: all. (default: [])</text><text x="20" y="475">  --protocol-version &lt;version&gt;  Pin the MCP protocol version to conform against.</text><text x="20" y="495">                                Default: legacy (2025-era) behavior.</text><text x="20" y="515">  --fixtures-file &lt;path&gt;        JSON file naming primitives that are SAFE TO</text><text x="20" y="535">                                EXECUTE, so checks that need a real result can</text><text x="20" y="555">                                run:</text><text x="20" y="575">                                {&quot;toolCalls&quot;:[{&quot;toolName&quot;:&quot;echo&quot;,&quot;arguments&quot;:{}}],&quot;promptGets&quot;:[{&quot;promptName&quot;:&quot;welcome&quot;}]}.</text><text x="20" y="595">                                Nothing is ever called without this.</text><text x="20" y="615">  --fixture-tool &lt;name&gt;         Name of a tool that is safe to call with no</text><text x="20" y="635">                                arguments. Repeat for multiple. For tools that</text><text x="20" y="655">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="675">                                [])</text><text x="20" y="695">  --fixture-prompt &lt;name&gt;       Name of a prompt that is safe to render with no</text><text x="20" y="715">                                arguments. Repeat for multiple. For prompts that</text><text x="20" y="735">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="755">                                [])</text><text x="20" y="775">  --log-probe-tool &lt;name&gt;       Name of a tool that writes logs and is safe to</text><text x="20" y="795">                                call a few times. Lets the 2026-07-28 logging</text><text x="20" y="815">                                check and log level advice run. Nothing is</text><text x="20" y="835">                                called without this.</text><text x="20" y="855">  --log-probe-args &lt;json&gt;       Arguments for --log-probe-tool, as a JSON</text><text x="20" y="875">                                object. Default: {}.</text><text x="20" y="895">  --log-probe-level &lt;level&gt;     Log level the advice asks --log-probe-tool for:</text><text x="20" y="915">                                debug, info, notice, warning, error, critical,</text><text x="20" y="935">                                alert, emergency. Default: warning.</text><text x="20" y="955">  --log-filter-tool &lt;name&gt;      Name of a tool the log level advice calls</text><text x="20" y="975">                                instead of --log-probe-tool. Same rules: it</text><text x="20" y="995">                                writes logs and is safe to call. Default:</text><text x="20" y="1015">                                --log-probe-tool.</text><text x="20" y="1035">  --log-filter-args &lt;json&gt;      Arguments for --log-filter-tool, as a JSON</text><text x="20" y="1055">                                object. Default: {}.</text><text x="20" y="1075">  --log-filter-level &lt;level&gt;    Log level the advice asks --log-filter-tool for:</text><text x="20" y="1095">                                debug, info, notice, warning, error, critical,</text><text x="20" y="1115">                                alert, emergency. Default: warning.</text><text x="20" y="1135">  --input-required-tool &lt;name&gt;  Name of a tool that asks the client for input</text><text x="20" y="1155">                                and is safe to call. Lets the 2026-07-28</text><text x="20" y="1175">                                undeclared capability check run. Nothing is</text><text x="20" y="1195">                                called without this.</text><text x="20" y="1215">  --input-required-args &lt;json&gt;  Arguments for --input-required-tool, as a JSON</text><text x="20" y="1235">                                object. Default: {}.</text><text x="20" y="1255">  --reporter &lt;reporter&gt;         Structured reporter output: json-summary or</text><text x="20" y="1275">                                junit-xml</text><text x="20" y="1295">  --upload                      Upload this suite&#x27;s result into MCPJam run</text><text x="20" y="1315">                                history</text><text x="20" y="1335">  --require-upload              Fail if reporting is configured but the UI</text><text x="20" y="1355">                                record cannot be written</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="565"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">60e3d16867f6499888ac4b6eb61028f0 — page 9</text><text x="20" y="75">  --log-filter-tool &lt;name&gt;      Name of a tool the log level advice calls</text><text x="20" y="95">                                instead of --log-probe-tool. Same rules: it</text><text x="20" y="115">                                writes logs and is safe to call. Default:</text><text x="20" y="135">                                --log-probe-tool.</text><text x="20" y="155">  --log-filter-args &lt;json&gt;      Arguments for --log-filter-tool, as a JSON</text><text x="20" y="175">                                object. Default: {}.</text><text x="20" y="195">  --log-filter-level &lt;level&gt;    Log level the advice asks --log-filter-tool for:</text><text x="20" y="215">                                debug, info, notice, warning, error, critical,</text><text x="20" y="235">                                alert, emergency. Default: warning.</text><text x="20" y="255">  --input-required-tool &lt;name&gt;  Name of a tool that asks the client for input</text><text x="20" y="275">                                and is safe to call. Lets the 2026-07-28</text><text x="20" y="295">                                undeclared capability check run. Nothing is</text><text x="20" y="315">                                called without this.</text><text x="20" y="335">  --input-required-args &lt;json&gt;  Arguments for --input-required-tool, as a JSON</text><text x="20" y="355">                                object. Default: {}.</text><text x="20" y="375">  --reporter &lt;reporter&gt;         Structured reporter output: json-summary or</text><text x="20" y="395">                                junit-xml</text><text x="20" y="415">  --upload                      Upload this suite&#x27;s result into MCPJam run</text><text x="20" y="435">                                history</text><text x="20" y="455">  --require-upload              Fail if reporting is configured but the UI</text><text x="20" y="475">                                record cannot be written</text><text x="20" y="495">  -h, --help                    display help for command</text><text x="20" y="515"></text><text x="20" y="535">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
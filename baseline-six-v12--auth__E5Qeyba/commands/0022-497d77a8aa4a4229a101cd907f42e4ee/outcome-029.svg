      Suppress non-result progress output\n  --no-telemetry         Disable anonymous usage telem</text><text x="20" y="875">etry\n  --format &lt;format&gt;      Output format\n  -h, --help             display help for command\n\nLocal MCP testing:\n  test [opt</text><text x="20" y="895">ions] &lt;file&gt;  Run a suite file locally against your MCP servers (BYOK\n                         or MCPJam-hosted inference). Resul</text><text x="20" y="915">ts are never\n                         uploaded.\n  server                 Inspect MCP server connectivity and capabilities\n  too</text><text x="20" y="935">ls                  List and invoke MCP server tools\n  resources              List and read MCP resources\n  skills              </text><text x="20" y="955">   Inspect the Agent Skills an MCP server serves\n                         (SEP-2640). For your project&#x27;s Cloud Skills, see\n     </text><text x="20" y="975">                    `mcpjam cloud skills`.\n  subscriptions          Open a long-lived MCP subscription and stream its\n          </text><text x="20" y="995">               notifications (2026-07-28 subscriptions/listen, with a\n                         legacy fallback)\n  compat [option</text><text x="20" y="1015">s]       Check whether an MCP server&#x27;s tools and widgets work on\n                         each AI host (Claude, ChatGPT, Cursor, </text><text x="20" y="1035">Copilot, Codex,\n                         Goose, …)\n  prompts                List and fetch MCP prompts\n  apps                  </text><text x="20" y="1055"> Validate MCP Apps metadata and resource wiring\n  tasks                  Create, inspect and drive MCP Tasks (legacy 2025-11-25\n</text><text x="20" y="1075">                         and SEP-2663), and validate a server&#x27;s tasks wire\n                         behavior\n  events           </text><text x="20" y="1095">      List, poll, watch, subscribe to and conformance-check\n                         MCP Events (triggers, draft@28ec35e)\n  oaut</text><text x="20" y="1115">h                  Run MCP OAuth login, proxy, and conformance flows\n  xaa                    Run the Cross-App Access (ID-JAG) d</text><text x="20" y="1135">ebugger against an\n                         MCP server\n  protocol               MCP protocol inspection and conformance checks\n</text><text x="20" y="1155">  conformance            Run MCPJam conformance suites and optionally upload\n                         results\n  readiness       </text><text x="20" y="1175">       Grade a server or plugin against a publisher&#x27;s\n                         directory\n\nMCPJam Cloud:\n  cloud [options]     </text><text x="20" y="1195">   MCPJam Cloud account commands (login, projects, evals,\n                         tunnels). Local MCP testing stays at the top l</text><text x="20" y="1215">evel —\n                         `mcpjam oauth login` is MCP OAuth; `mcpjam cloud login`\n                         is your MCPJam </text><text x="20" y="1235">account.\n  registry               Search MCP directories and curated cards, then install\n                         into a Cloud p</text><text x="20" y="1255">roject\n\nCLI:\n  inspector              Start or attach to the local MCPJam Inspector\n  browser                Drive a local or </text><text x="20" y="1275">cloud browser and read its session\n                         trace\n  mcp                    Run MCPJam as an MCP server over stdi</text><text x="20" y="1295">o, so MCP clients\n                         (Claude Desktop, Claude Code, Cursor, ...) can connect\n                         to, e</text><text x="20" y="1315">xercise, and debug other MCP servers\n  telemetry              Inspect and configure anonymous CLI telemetry\n\nCommands:\n  help </text><text x="20" y="1335">[command]         display help for command\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="1355">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_19&quot;, &quot;type&quot;: &quot;agent_message&quot;, &quot;text&quot;: &quot;The CLI recovered successfully: initializat</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">497d77a8aa4a4229a101cd907f42e4ee — page 23</text><text x="20" y="75">nternal form of `extraToolCalls`: `null` is unlimited.\&quot;, \&quot;type\&quot;: [\&quot;integer\&quot;, \&quot;null\&quot;], \&quot;minimum\&quot;: 0}, \&quot;argumentMatching\&quot;</text><text x="20" y="95">: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;Internal form of `arguments`.\&quot;, \&quot;enum\&quot;: [\&quot;ignore\&quot;, \&quot;partial\&quot;, \&quot;exact\&quot;]}}}, \&quot;</text><text x="20" y="115">skillsOverride\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;enum\&quot;: [\&quot;exclude\&quot;], \&quot;description\&quot;: \&quot;The \\\&quot;without skills\\\&quot; arm of an A/B comp</text><text x="20" y="135">arison: the run pins NO skills from any channel and is marked `skillsExcluded`, so the arm is labelled rather than merely empty. S</text><text x="20" y="155">coped to skill DELIVERY \\u2014 a pinned plugin&#x27;s MCP servers stay connected, because which servers an arm connects is the one var</text><text x="20" y="175">iable a skills A/B has to hold fixed.\&quot;}, \&quot;refreshSnapshot\&quot;: {\&quot;type\&quot;: \&quot;boolean\&quot;, \&quot;description\&quot;: \&quot;**PERSISTS A SUITE MUTAT</text><text x="20" y="195">ION.** Re-derives and stores the suite&#x27;s host-config snapshot from this request&#x27;s server list, so future runs of the suite use it </text><text x="20" y="215">too. Without it a rerun leaves the snapshot frozen, which is what stops newly connected servers from silently contaminating an exi</text><text x="20" y="235">sting suite. Single-target launches only \\u2014 it is not accepted on `POST /eval-run-groups`, where last-writer-wins on a frozen</text><text x="20" y="255"> snapshot is never what a fan-out means.\&quot;}, \&quot;runGroupId\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;description\&quot;: \&quot;A LABEL that groups sibling</text><text x="20" y="275"> run rows for display. It has NO quota or launch semantics here: N calls carrying one id are still N independent launches, each me</text><text x="20" y="295">tered separately. Grouped-launch behaviour lives on `POST /eval-run-groups`, which mints the id itself. Echoed back on the `202`.\</text><text x="20" y="315">&quot;}, \&quot;idempotencyKey\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;maxLength\&quot;: 256, \&quot;description\&quot;: \&quot;Write-idempotency key. A repeat call with th</text><text x="20" y="335">e same key (same actor and suite) returns the EXISTING run instead of creating and billing a second one. The `Idempotency-Key` hea</text><text x="20" y="355">der carries the same value and WINS over this field \\u2014 it is the transport-level channel unattended clients control, whereas </text><text x="20" y="375">a body key could be shaped by model output.\&quot;}, \&quot;sourceHash\&quot;: {\&quot;type\&quot;: \&quot;string\&quot;, \&quot;pattern\&quot;: \&quot;^[a-f0-9]{64}$\&quot;, \&quot;descript</text><text x="20" y="395">ion\&quot;: \&quot;SHA-256 hex of the suite-file bytes that launched this run. Lowercase, 64 characters. Set by `eval run --file`; a UI or A</text><text x="20" y="415">PI launch that did not come from a file omits it.\&quot;}, \&quot;importApprovals\&quot;: {\&quot;type\&quot;: \&quot;array\&quot;, \&quot;minItems\&quot;: 1, \&quot;description\&quot;:</text><text x="20" y="435"> \&quot;Approve `approximated` imported cases for THIS RUN ONLY. The caller supplies a hosted test-case id and a reason and nothing els</text><text x="20" y="455">e: the approver&#x27;s identity and the approval time are derived server-side and frozen into the run&#x27;s snapshot, because a caller-supp</
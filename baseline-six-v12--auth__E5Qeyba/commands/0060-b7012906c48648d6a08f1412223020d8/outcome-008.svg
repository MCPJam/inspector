<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b7012906c48648d6a08f1412223020d8 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;curl -fsSL https://docs.mcpjam.com/cli/server-inspection.md -o /workspace/validation/cli-inspection.md; curl </text><text x="20" y="175">-fsSL https://docs.mcpjam.com/cli/tools-resources-prompts.md -o /workspace/validation/cli-tools.md; curl -sS -H &quot;Authorization: Be</text><text x="20" y="195">arer $MCPJAM_API_KEY&quot; &quot;$MCPJAM_API_URL/projects/project_fixture/eval-suites&quot; -o /workspace/validation/suites.json; cat /workspace/</text><text x="20" y="215">validation/suites.json; cat /workspace/validation/cli-inspection.md; npx -y @mcpjam/cli --version&#x27;</text><text x="20" y="235">{&quot;items&quot;: [{&quot;id&quot;: &quot;suite_fixture&quot;, &quot;name&quot;: &quot;Arithmetic smoke&quot;, &quot;projectId&quot;: &quot;project_fixture&quot;, &quot;description&quot;: &quot;Synthetic fixture: </text><text x="20" y="255">add 2 and 3 and assert 5.&quot;, &quot;environment&quot;: {&quot;servers&quot;: []}, &quot;executionConfig&quot;: null, &quot;hosts&quot;: [], &quot;environmentIds&quot;: [], &quot;settings&quot;</text><text x="20" y="275">: {&quot;policy&quot;: &quot;legacy&quot;, &quot;minimumIterations&quot;: 1}, &quot;schedule&quot;: {}, &quot;createdAt&quot;: 1, &quot;updatedAt&quot;: 2}]}&gt; ## Documentation Index</text><text x="20" y="295">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="315">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="335"></text><text x="20" y="355"># Server Inspection</text><text x="20" y="375"></text><text x="20" y="395">&gt; Probe, diagnose, and export MCP server connectivity and capabilities</text><text x="20" y="415"></text><text x="20" y="435">The `server` command group gives you a breadth-first view of any MCP server — connectivity, OAuth discovery, capabilities, tools, </text><text x="20" y="455">resources, and prompts — without writing code.</text><text x="20" y="475"></text><text x="20" y="495">## Quick start</text><text x="20" y="515"></text><text x="20" y="535">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="555"># One command does everything: probe, connect, sweep tools/resources/prompts</text><text x="20" y="575">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="595">```</text><text x="20" y="615"></text><text x="20" y="635">If the server requires OAuth, doctor reports `oauth_required` with the discovery metadata. See [OAuth login](https://docs.mcpjam.c</text><text x="20" y="655">om/cli/oauth-login.md) to obtain a token, then re-run with `--oauth-access-token`.</text><text x="20" y="675"></text><text x="20" y="695">## Commands</text><text x="20" y="715"></text><text x="20" y="735">### `server probe`</text><text x="20" y="755"></text><text x="20" y="775">Stateless HTTP probe — no full client connection. Tests transport selection, OAuth discovery, and `WWW-Authenticate` parsing.</text><text x="20" y="795"></text><text x="20" y="815">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="835">mcpjam server probe --url https://your-server.com/mcp</text><text x="20" y="855">```</text><text x="20" y="875"></text><text x="20" y="895">Use this when you want to check reachability and OAuth metadata without triggering a full MCP initialize handshake. The probe send</text><text x="20" y="915">s an unauthenticated `initialize` request and inspects the response.</text><text x="20" y="935"></text><text x="20" y="955">**What it returns:**</text><text x="20" y="975"></text><text x="20" y="995">* Transport type (streamable-http, SSE, or failed)</text><text x="20" y="1015">* OAuth metadata (resource metadata URL, authorization server metadata, registration strategies, scopes)</text><text x="20" y="1035">* `WWW-Authenticate` header parsing</text><text x="20" y="1055"></text><text x="20" y="1075">Credential headers — `Authorization`, `X-Api-Key`, `X-Auth-Token`, and any other sensitive header names — are automatically redact</text><text x="20" y="1095">ed to `[REDACTED]` in the printed result. Header names are preserved so the request shape remains visible.</text><text x="20" y="1115"></text><text x="20" y="1135">### `server doctor`</text><text x="20" y="1155"></text><text x="20" y="1175">Combined triage — runs probe, then attempts a full client connection, then sweeps tools, resources, resource templates, and prompt</text><text x="20" y="1195">s. Returns a single JSON artifact.</text><text x="20" y="1215"></text><text x="20" y="1235">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1255"># Human-readable summary</text><text x="20" y="1275">mcpjam server doctor --url https://your-server.com/mcp</text><text x="20" y="1295"></text><text x="20" y="1315"># Full JSON artifact with RPC logs</text><text x="20" y="1335">mcpjam server doctor --url https://your-server.com/mcp --rpc --out doctor.json</text><text x="20" y="1355"></text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">f3e3e1799eea4db8a6c4b9f9f7e9c3d5 — page 4</text><text x="20" y="75"></text><text x="20" y="95">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="115">mcpjam tools list \</text><text x="20" y="135">  --command npx \</text><text x="20" y="155">  --args -y @modelcontextprotocol/server-everything \</text><text x="20" y="175">  --cwd $PWD \</text><text x="20" y="195">  -e DEBUG=1</text><text x="20" y="215">```</text><text x="20" y="235"></text><text x="20" y="255">## Resources</text><text x="20" y="275"></text><text x="20" y="295">### List resources</text><text x="20" y="315"></text><text x="20" y="335">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="355">mcpjam resources list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="375">```</text><text x="20" y="395"></text><text x="20" y="415">### Read a resource</text><text x="20" y="435"></text><text x="20" y="455">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="475">mcpjam resources read --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="495">  --resource-uri &quot;file:///docs/readme.md&quot;</text><text x="20" y="515">```</text><text x="20" y="535"></text><text x="20" y="555">Use `resources read --resource-uri ui://...` when you need to inspect raw widget HTML or other UI resources directly.</text><text x="20" y="575"></text><text x="20" y="595">### List resource templates</text><text x="20" y="615"></text><text x="20" y="635">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="655">mcpjam resources templates --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="675">```</text><text x="20" y="695"></text><text x="20" y="715">## Prompts</text><text x="20" y="735"></text><text x="20" y="755">### List prompts</text><text x="20" y="775"></text><text x="20" y="795">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="815">mcpjam prompts list --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="835">```</text><text x="20" y="855"></text><text x="20" y="875">### Get a prompt</text><text x="20" y="895"></text><text x="20" y="915">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="935">mcpjam prompts get --url https://your-server.com/mcp --access-token $TOKEN \</text><text x="20" y="955">  --prompt-name summarize \</text><text x="20" y="975">  --prompt-args &#x27;{&quot;text&quot;: &quot;Hello world&quot;}&#x27;</text><text x="20" y="995">```</text><text x="20" y="1015"></text><text x="20" y="1035">## Common patterns</text><text x="20" y="1055"></text><text x="20" y="1075">### Enumerate the full server surface</text><text x="20" y="1095"></text><text x="20" y="1115">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1135"># One-shot: doctor already sweeps everything</text><text x="20" y="1155">mcpjam server doctor --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="1175"></text><text x="20" y="1195"># Or individually for focused output</text><text x="20" y="1215">mcpjam tools list --url $URL --access-token $TOKEN --format json | jq &#x27;.tools[].name&#x27;</text><text x="20" y="1235">mcpjam resources list --url $URL --access-token $TOKEN --format json | jq &#x27;.resources[].uri&#x27;</text><text x="20" y="1255">mcpjam prompts list --url $URL --access-token $TOKEN --format json | jq &#x27;.prompts[].name&#x27;</text><text x="20" y="1275">```</text><text x="20" y="1295"></text><text x="20" y="1315">### Test a specific tool end-to-end</text><text x="20" y="1335"></text><text x="20" y="1355">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text></g></svg>
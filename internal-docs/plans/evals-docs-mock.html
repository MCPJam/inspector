<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ok:#6fbf87; --ok-soft:#24352a; --warn:#e0b25a; --warn-soft:#3a3122; --info:#7fa9d6; --info-soft:#24303d; --bad:#e8857b; --bad-soft:#3d2724;

.steps{margin:18px 0;display:grid;gap:0;counter-reset:s}

.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);text-decoration:none;display:block}

.card .arrow{color:var(--accent-strong);font-size:13px;margin-top:8px;display:inline-block}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:18px 0}
.flow .n{flex:1 1 100px;min-width:96px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:12.5px;text-align:center;display:grid;place-items:center;line-height:1.35}
.flow .n small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

.nest{margin:18px 0;font-size:13.5px}
.nest .box{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;background:var(--surface)}
.nest .box .box{margin-top:8px;background:var(--bg)}
.nest .box .box .box{background:var(--surface)}
.nest .t{font-weight:600}
.nest .t small{font-weight:400;color:var(--muted);margin-left:6px}
.nest .row{display:flex;gap:8px;flex-wrap:wrap}
.nest .row>.box{flex:1 1 140px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.col{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.col h5{margin:0 0 8px;font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.col ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.col li{margin:3px 0}

.faq details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0;padding:0 14px}
.faq summary{cursor:pointer;padding:11px 0;font-weight:500;font-size:14.5px}
.faq details p{margin:0 0 12px;color:var(--muted);font-size:14px}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:20px}

 desc:"Find out whether real models use your MCP server the way you intended, before your users do.",

const ORDER = GROUPS.flatMap(g=>g.pages);
const groupOf = id => GROUPS.find(g=>g.pages.includes(id));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function bars(n){const w=[96,88,92,70,84,60];let h="";for(let i=0;i<n*2;i++){h+=`<span style="width:${i===n*2-1?Math.max(40,w[i%6]-30):w[i%6]}%"></span>`}return `<div class="bars">${h}</div>`}
function hl(code,lang){
  let h=esc(code);
  if(lang==="yaml"||lang==="bash"){h=h.replace(/(^|\n)(\s*#.*)/g,'$1<span class="cm">$2</span>')}
  if(lang==="ts"||lang==="json"){h=h.replace(/(\/\/.*|\/\*.*?\*\/)/g,'<span class="cm">$1</span>')}
  if(lang==="yaml"){h=h.replace(/(^|\n)(\s*-?\s*)([a-zA-Z_]+):/g,'$1$2<span class="k">$3</span>:')}
  if(lang==="bash"){h=h.replace(/\b(mcpjam|npx|export)\b/g,'<span class="k">$1</span>')}
  if(lang==="ts"){h=h.replace(/\b(import|from|const|new)\b/g,'<span class="k">$1</span>')}
  return h;
}
function chainHTML(broke){
  return `<div class="flow" role="list" aria-label="User-value chain">`+CHAIN.map((c,i)=>{
    let cls="n", extra="";
    if(broke!=null){ if(i<broke){extra=`<small style="color:var(--ok)">passed</small>`} else if(i===broke){cls+=" hl";extra=`<small style="color:var(--bad)">broke here</small>`} else {extra=`<small>never ran</small>`} }
    else extra=`<small>${c[1]}</small>`;
    return (i?`<span class="a" aria-hidden="true">→</span>`:"")+`<div class="${cls}" role="listitem">${c[0]}${extra}</div>`}).join("")+`</div>`;
}
function nestHTML(){
  return `<div class="nest" aria-label="Hierarchy diagram"><div class="box"><div class="t">Project <small>servers, environments, suites</small></div>
   <div class="box"><div class="t">Suite <small>shared servers, models, defaults, pass criterion</small></div>
    <div class="row"><div class="box"><div class="t">Case <small>prompts, checks</small></div></div><div class="box"><div class="t">Case</div></div><div class="box"><div class="t">Case</div></div></div>
    <div class="box"><div class="t">Run <small>iterations = cases × models × count</small></div><div class="mini-grid" aria-hidden="true">${"<span></span>".repeat(18)}</div></div>
   </div></div></div>`;
}
function matchHTML(){
  const ex=`expected: { query: "bugs", limit: 5 }<br>actual: &nbsp;&nbsp;{ query: "bugs", limit: 5, sort: "new" }`;
  const modes=[["partial","default","Expected keys match; extras ignored","p-ok","pass"],["exact","","Key for key","p-bad","fail"],["ignore","","Tool name only","p-ok","pass"]];
  return `<div class="code"><div class="code-h"><span>Same call, three modes</span></div><pre>${ex}</pre></div><div class="cols">`+modes.map(m=>`<div class="col"><h5><code>${m[0]}</code>${m[1]?`<span class="pill p-mute">${m[1]}</span>`:""}<span class="pill ${m[3]}" style="margin-left:auto">${m[4]}</span></h5><ul style="list-style:none;padding:0"><li>${m[2]}</li></ul></div>`).join("")+`</div>`;
}
let tabCounter=0;
function block(b){
  switch(b.t){
    case "h2": return `<h2 id="${slug(b.text)}">${b.text}${b.held?` <span class="pill p-warn" style="vertical-align:middle">held</span>`:""}</h2>`;
    case "copy": return `<div class="copy"><div class="what"><b>Copy</b>${b.what}</div>${bars(b.lines||1)}</div>`;
    case "shot": return `<div class="shot${b.short?" short":""}"><span class="lbl">${b.kind}</span><div class="cap">${b.cap}${b.sub?`<small>${b.sub}</small>`:""}</div></div>`;
    case "code": return `<div class="code"><div class="code-h"><span>${esc(b.title||b.lang)}</span></div><pre>${hl(b.code,b.lang)}</pre></div>`;
    case "tabs": { const id="tb"+(tabCounter++);
      return `<div class="code" data-tabs="${id}"><div class="code-h" role="tablist">`+b.tabs.map((t,i)=>`<button role="tab" aria-selected="${i===0}" class="${i===0?"on":""}" data-i="${i}">${t[0]}</button>`).join("")+`</div>`+b.tabs.map((t,i)=>`<pre ${i?"hidden":""} data-p="${i}">${hl(t[2],t[1])}</pre>`).join("")+`</div>`; }
    case "call": { const ic={note:"i",tip:"✓",warning:"!"}[b.kind]; return `<div class="call ${b.kind}"><span class="ic" aria-hidden="true">${ic}</span><div>${b.text}</div></div>`; }
    case "steps": return `<div class="steps">`+b.items.map(s=>`<div class="step"><h5>${s[0]}</h5>${s[1]?`<p>${s[1]}</p>`:""}${s[2]?`<div class="shot"><span class="lbl">Screenshot</span><div class="cap">${s[2]}</div></div>`:""}</div>`).join("")+`</div>`;
    case "table": return `<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "cards": return `<div class="cards">`+b.items.map(c=>`<div class="card"><h5>${c[0]}</h5><p>${c[1]}</p></div>`).join("")+`</div>`;
    case "cols": return `<div class="cols">`+b.items.map(c=>`<div class="col"><h5>${c[0]}</h5><ul>${c[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")+`</div>`;
    case "flow": return `<div class="flow">`+b.items.map((n,i)=>(i?`<span class="a" aria-hidden="true">→</span>`:"")+`<div class="n${n[2]?" hl":""}">${n[0]}${n[1]?`<small>${n[1]}</small>`:""}</div>`).join("")+`</div>`;
    case "chain": return chainHTML(b.broke);
    case "nest": return nestHTML();
    case "match": return matchHTML();
    case "faq": return `<div class="faq">`+b.items.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")+`</div>`;
    case "next": return `<h2 id="next-steps">Next steps</h2><div class="cards">`+b.items.map(id=>`<a class="card" href="#${id}"><h5>${P[id].title}</h5><p>${P[id].desc}</p><span class="arrow">Read →</span></a>`).join("")+`</div>`;
  }
  return "";
}

document.addEventListener("click",e=>{

  const t=e.target.closest("[data-to]");
  if(t){e.preventDefault();const el=document.getElementById(t.dataset.to);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
});

<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">165b099a310644088b5daba71bc80784 — page 9</text><text x="20" y="75">- [Send one agent Playground message](https://docs.mcpjam.com/api-reference/chat-sessions/send-one-agent-playground-message.md): S</text><text x="20" y="95">end one message to a project&#x27;s MCP servers and get the model&#x27;s reply plus the telemetry a participant in the conversation could no</text><text x="20" y="115">t see: which tools ran, with what arguments, what each returned, per-call latency, and token usage.</text><text x="20" y="135">- [Read a chat session&#x27;s execution trace](https://docs.mcpjam.com/api-reference/chat-sessions/read-a-chat-sessions-execution-trace</text><text x="20" y="155">.md): Per-turn execution spans: per-tool-call latency, token usage, and indices into the transcript. Same span shape as the eval i</text><text x="20" y="175">teration trace.</text><text x="20" y="195">{</text><text x="20" y="215"> &quot;parameters&quot;: [</text><text x="20" y="235">  {</text><text x="20" y="255">   &quot;$ref&quot;: &quot;#/components/parameters/organizationId&quot;</text><text x="20" y="275">  }</text><text x="20" y="295"> ],</text><text x="20" y="315"> &quot;get&quot;: {</text><text x="20" y="335">  &quot;operationId&quot;: &quot;getSpendBudget&quot;,</text><text x="20" y="355">  &quot;tags&quot;: [</text><text x="20" y="375">   &quot;Catalog&quot;</text><text x="20" y="395">  ],</text><text x="20" y="415">  &quot;summary&quot;: &quot;Read the organization&#x27;s spend budget&quot;,</text><text x="20" y="435">  &quot;description&quot;: &quot;The ceiling on what this organization may spend on MCPJam-billed work \u2014 chat, evals, judges and computer ti</text><text x="20" y="455">me \u2014 in the current billing window, and how much of it has been spent.\n\nAny member may read it: a member who cannot raise t</text><text x="20" y="475">he ceiling still needs to know it exists, because it is what refused their run. `capUsd: null` means the organization is uncapped,</text><text x="20" y="495"> which is the default.\n\nRuns that use your own provider keys are never counted against the budget and never blocked by it. Neith</text><text x="20" y="515">er is the free daily allowance \u2014 it is not credits.&quot;,</text><text x="20" y="535">  &quot;responses&quot;: {</text><text x="20" y="555">   &quot;200&quot;: {</text><text x="20" y="575">    &quot;description&quot;: &quot;The organization&#x27;s spend budget.&quot;,</text><text x="20" y="595">    &quot;content&quot;: {</text><text x="20" y="615">     &quot;application/json&quot;: {</text><text x="20" y="635">      &quot;schema&quot;: {</text><text x="20" y="655">       &quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;</text><text x="20" y="675">      }</text><text x="20" y="695">     }</text><text x="20" y="715">    }</text><text x="20" y="735">   },</text><text x="20" y="755">   &quot;401&quot;: {</text><text x="20" y="775">    &quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;</text><text x="20" y="795">   },</text><text x="20" y="815">   &quot;403&quot;: {</text><text x="20" y="835">    &quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;</text><text x="20" y="855">   },</text><text x="20" y="875">   &quot;404&quot;: {</text><text x="20" y="895">    &quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;</text><text x="20" y="915">   },</text><text x="20" y="935">   &quot;429&quot;: {</text><text x="20" y="955">    &quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;</text><text x="20" y="975">   },</text><text x="20" y="995">   &quot;500&quot;: {</text><text x="20" y="1015">    &quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="1035">   }</text><text x="20" y="1055">  }</text><text x="20" y="1075"> },</text><text x="20" y="1095"> &quot;put&quot;: {</text><text x="20" y="1115">  &quot;operationId&quot;: &quot;setSpendBudget&quot;,</text><text x="20" y="1135">  &quot;tags&quot;: [</text><text x="20" y="1155">   &quot;Catalog&quot;</text><text x="20" y="1175">  ],</text><text x="20" y="1195">  &quot;summary&quot;: &quot;Set the organization&#x27;s spend budget&quot;,</text><text x="20" y="1215">  &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner or admin.**\n\nWhen the budget is reached, new MCPJam-</text><text x="20" y="1235">billed work \u2014 chat turns, eval runs, computer starts \u2014 is refused for the whole organization until the window resets or </text><text x="20" y="1255">an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\n\n`capU</text><text x="20" y="1275">sd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Changing the</text><text x="20" y="1295"> cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was already told about.&quot;,</text><text x="20" y="1315">  &quot;requestBody&quot;: {</text><text x="20" y="1335">   &quot;required&quot;: true,</text><text x="20" y="1355">   &quot;content&quot;: {</text></g></svg>
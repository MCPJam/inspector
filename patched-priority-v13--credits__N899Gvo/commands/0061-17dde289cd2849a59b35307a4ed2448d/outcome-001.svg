<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">17dde289cd2849a59b35307a4ed2448d — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; /workspace/mcpjam-eval/run_eval.py &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">&quot;&quot;&quot;Replay the saved suite launch. Requires MCPJAM_API_URL and MCPJAM_API_KEY.&quot;&quot;&quot;</text><text x="20" y="115">import json,time,sys,pathlib</text><text x="20" y="135">from api import call,ROOT</text><text x="20" y="155">PROJECT=&#x27;/projects/project_fixture&#x27;</text><text x="20" y="175">request=json.loads((ROOT/&#x27;run-request.json&#x27;).read_text())</text><text x="20" y="195">prefix=&#x27;attempt-&#x27;+str(time.time_ns())</text><text x="20" y="215">status,receipt=call(PROJECT+&#x27;/eval-runs&#x27;,&#x27;POST&#x27;,request,prefix+&#x27;-launch&#x27;)</text><text x="20" y="235">if status!=202:</text><text x="20" y="255"> print(&#x27;BLOCKED: no evaluation verdict established. See saved launch response.&#x27;)</text><text x="20" y="275"> sys.exit(2)</text><text x="20" y="295">run=receipt[&#x27;runId&#x27;]; path=PROJECT+&#x27;/eval-runs/&#x27;+run</text><text x="20" y="315">deadline=time.monotonic()+60</text><text x="20" y="335">while time.monotonic()&lt;deadline:</text><text x="20" y="355"> status,detail=call(path,label=prefix+&#x27;-status&#x27;)</text><text x="20" y="375"> if status!=200:sys.exit(3)</text><text x="20" y="395"> if detail.get(&#x27;status&#x27;) in (&#x27;completed&#x27;,&#x27;failed&#x27;,&#x27;cancelled&#x27;,&#x27;timed_out&#x27;):break</text><text x="20" y="415"> time.sleep(2)</text><text x="20" y="435">else:</text><text x="20" y="455"> print(&#x27;Polling deadline reached; inspect saved runId before launching again.&#x27;);sys.exit(3)</text><text x="20" y="475">call(path+&#x27;/decision-summary&#x27;,label=prefix+&#x27;-decision&#x27;)</text><text x="20" y="495">cursor=None; n=0</text><text x="20" y="515">while True:</text><text x="20" y="535"> query=&#x27;?cursor=&#x27;+__import__(&#x27;urllib.parse&#x27;,fromlist=[&#x27;quote&#x27;]).quote(cursor,safe=&#x27;&#x27;) if cursor else &#x27;&#x27;</text><text x="20" y="555"> status,page=call(path+&#x27;/iterations&#x27;+query,label=prefix+&#x27;-iterations-&#x27;+str(n))</text><text x="20" y="575"> if status!=200:break</text><text x="20" y="595"> for row in page.get(&#x27;items&#x27;,[]):</text><text x="20" y="615">  iteration=row.get(&#x27;id&#x27;,row.get(&#x27;iterationId&#x27;))</text><text x="20" y="635">  if iteration:</text><text x="20" y="655">   call(path+&#x27;/iterations/&#x27;+iteration+&#x27;/trace&#x27;,label=prefix+&#x27;-trace-&#x27;+str(n)+&#x27;-&#x27;+iteration)</text><text x="20" y="675">   call(path+&#x27;/iterations/&#x27;+iteration+&#x27;/steps&#x27;,label=prefix+&#x27;-steps-&#x27;+str(n)+&#x27;-&#x27;+iteration)</text><text x="20" y="695"> cursor=page.get(&#x27;nextCursor&#x27;);n+=1</text><text x="20" y="715"> if not cursor:break</text><text x="20" y="735">print(&#x27;Evidence saved under&#x27;,ROOT,&#x27;for run&#x27;,run)</text><text x="20" y="755">PY</text><text x="20" y="775">cat &gt; /workspace/mcpjam-eval/README.md &lt;&lt;&#x27;MD&#x27;</text><text x="20" y="795"># Repeatable MCPJam evaluation</text><text x="20" y="815"></text><text x="20" y="835">Target: `http://fixture:8765/mcp`, saved server `server_fixture` in `project_fixture`.</text><text x="20" y="855">Account: Team organization owner (`org_fixture`). Existing suite: `suite_fixture`, Arithmetic smoke.</text><text x="20" y="875"></text><text x="20" y="895">The saved case invokes `add` with `{ &quot;a&quot;: 2, &quot;b&quot;: 3 }` and declares expected output `5`. This is a one-case arithmetic smoke check</text><text x="20" y="915">; it does not establish broad server correctness. Definitions were read through the public account API and saved in `suite.json`, </text><text x="20" y="935">`cases.json`, and `tools.json`.</text><text x="20" y="955"></text><text x="20" y="975">## Replay</text><text x="20" y="995"></text><text x="20" y="1015">With the supplied `MCPJAM_API_URL` and `MCPJAM_API_KEY` set:</text><text x="20" y="1035"></text><text x="20" y="1055">```sh</text><text x="20" y="1075">python3 /workspace/mcpjam-eval/run_eval.py</text><text x="20" y="1095">```</text><text x="20" y="1115"></text><text x="20" y="1135">The runner sends the exact body in `run-request.json`, polls the returned run ID, and saves status, decision summary, iterations, </text><text x="20" y="1155">traces, and steps. Each attempt has a unique prefix. A refused launch exits 2; operational or polling failure exits 3. Read the sa</text><text x="20" y="1175">ved platform decision to determine pass/fail. Check for an existing in-flight run before repeating a launch after a transport inte</text><text x="20" y="1195">rruption. The script does not alter the suite, buy credits, or modify billing.</text><text x="20" y="1215"></text><text x="20" y="1235">## Pre-run account investigation</text><text x="20" y="1255"></text><text x="20" y="1275">- `/me` and `/organizations` confirm Team owner access.</text><text x="20" y="1295">- `/models` and documented `/organizations/org_fixture/spend-budget` return 404 on this deployment.</text><text x="20" y="1315">- Suite run disclosure returns 422 FEATURE_NOT_SUPPORTED, contract_unavailable.</text><text x="20" y="1335">- Account usage, credits, and billing reads did not expose a balance or usage report; account product pages `/settings/billing` an</text><text x="20" y="1355">d `/settings/usage` return 404.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">cc2150baac4c4b7282d6f1ecc722f612 — page 4</text><text x="20" y="75">      }</text><text x="20" y="95">     }</text><text x="20" y="115">    }</text><text x="20" y="135">   },</text><text x="20" y="155">   &quot;401&quot;: {</text><text x="20" y="175">    &quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;</text><text x="20" y="195">   },</text><text x="20" y="215">   &quot;403&quot;: {</text><text x="20" y="235">    &quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;</text><text x="20" y="255">   },</text><text x="20" y="275">   &quot;404&quot;: {</text><text x="20" y="295">    &quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;</text><text x="20" y="315">   },</text><text x="20" y="335">   &quot;429&quot;: {</text><text x="20" y="355">    &quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;</text><text x="20" y="375">   },</text><text x="20" y="395">   &quot;500&quot;: {</text><text x="20" y="415">    &quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="435">   },</text><text x="20" y="455">   &quot;502&quot;: {</text><text x="20" y="475">    &quot;$ref&quot;: &quot;#/components/responses/ServerUnreachable&quot;</text><text x="20" y="495">   }</text><text x="20" y="515">  }</text><text x="20" y="535"> },</text><text x="20" y="555"> &quot;post&quot;: {</text><text x="20" y="575">  &quot;operationId&quot;: &quot;createEvalSuite&quot;,</text><text x="20" y="595">  &quot;tags&quot;: [</text><text x="20" y="615">   &quot;Eval runs&quot;</text><text x="20" y="635">  ],</text><text x="20" y="655">  &quot;summary&quot;: &quot;Create an eval suite (author-only, does not run)&quot;,</text><text x="20" y="675">  &quot;description&quot;: &quot;Creates a runnable eval suite \u2014 the suite record plus its test cases \u2014 and responds `201` **synchronou</text><text x="20" y="695">sly**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returned `sui</text><text x="20" y="715">teId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a `runId</text><text x="20" y="735">`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level default `mod</text><text x="20" y="755">el` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/model` id</text><text x="20" y="775"> when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGuest cal</text><text x="20" y="795">lers are denied (suite creation is a write).&quot;,</text><text x="20" y="815">  &quot;parameters&quot;: [</text><text x="20" y="835">   {</text><text x="20" y="855">    &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="875">   },</text><text x="20" y="895">   {</text><text x="20" y="915">    &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="935">   }</text><text x="20" y="955">  ],</text><text x="20" y="975">  &quot;requestBody&quot;: {</text><text x="20" y="995">   &quot;required&quot;: true,</text><text x="20" y="1015">   &quot;content&quot;: {</text><text x="20" y="1035">    &quot;application/json&quot;: {</text><text x="20" y="1055">     &quot;schema&quot;: {</text><text x="20" y="1075">      &quot;$ref&quot;: &quot;#/components/schemas/EvalSuiteCreateRequest&quot;</text><text x="20" y="1095">     },</text><text x="20" y="1115">     &quot;example&quot;: {</text><text x="20" y="1135">      &quot;name&quot;: &quot;smoke&quot;,</text><text x="20" y="1155">      &quot;serverIds&quot;: [</text><text x="20" y="1175">       &quot;srv_abc123&quot;</text><text x="20" y="1195">      ],</text><text x="20" y="1215">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1235">      &quot;tests&quot;: [</text><text x="20" y="1255">       {</text><text x="20" y="1275">        &quot;title&quot;: &quot;lists files&quot;,</text><text x="20" y="1295">        &quot;steps&quot;: [</text><text x="20" y="1315">         {</text><text x="20" y="1335">          &quot;id&quot;: &quot;s1&quot;,</text><text x="20" y="1355">          &quot;kind&quot;: &quot;prompt&quot;,</text></g></svg>
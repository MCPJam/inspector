<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">cc2150baac4c4b7282d6f1ecc722f612 — page 6</text><text x="20" y="75">progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests rerun</text><text x="20" y="95">s the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `de</text><text x="20" y="115">tails.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which o</text><text x="20" y="135">ne the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the </text><text x="20" y="155">life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (an</text><text x="20" y="175">d `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,</text><text x="20" y="195">  &quot;parameters&quot;: [</text><text x="20" y="215">   {</text><text x="20" y="235">    &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="255">   },</text><text x="20" y="275">   {</text><text x="20" y="295">    &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="315">   },</text><text x="20" y="335">   {</text><text x="20" y="355">    &quot;$ref&quot;: &quot;#/components/parameters/launcherHeader&quot;</text><text x="20" y="375">   },</text><text x="20" y="395">   {</text><text x="20" y="415">    &quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;</text><text x="20" y="435">   }</text><text x="20" y="455">  ],</text><text x="
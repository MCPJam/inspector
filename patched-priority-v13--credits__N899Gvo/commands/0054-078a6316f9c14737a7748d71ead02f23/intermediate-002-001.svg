urrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level default `mod</text><text x="20" y="1235">el` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/model` id</text><text x="20" y="1255"> when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGuest cal</text><text x="20" y="1275">lers are denied (suite creation is a write).&quot;,</text><text x="20" y="1295">  &quot;parameters&quot;: [</text><text x="20" y="1315">   {</text><text x="20" y="1335">    &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="1355">   },</text></g></svg>
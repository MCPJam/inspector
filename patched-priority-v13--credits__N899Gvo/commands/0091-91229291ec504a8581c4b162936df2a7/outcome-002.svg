<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">91229291ec504a8581c4b162936df2a7 — page 2</text><text x="20" y="75">.md): Per-turn execution spans: per-tool-call latency, token usage, and indices into the transcript. Same span shape as the eval i</text><text x="20" y="95">teration trace.</text><text x="20" y="115">{</text><text x="20" y="135"> &quot;parameters&quot;: [</text><text x="20" y="155">  {</text><text x="20" y="175">   &quot;$ref&quot;: &quot;#/components/parameters/organizationId&quot;</text><text x="20" y="195">  }</text><text x="20" y="215"> ],</text><text x="20" y="235"> &quot;get&quot;: {</text><text x="20" y="255">  &quot;operationId&quot;: &quot;getSpendBudget&quot;,</text><text x="20" y="275">  &quot;tags&quot;: [</text><text x="20" y="295">   &quot;Catalog&quot;</text><text x="20" y="315">  ],</text><text x="20" y="335">  &quot;summary&quot;: &quot;Read the organization&#x27;s spend budget&quot;,</text><text x="20" y="355">  &quot;description&quot;: &quot;The ceiling on what this organization may spend on MCPJam-billed work \u2014 chat, evals, judges and computer ti</text><text x="20" y="375">me \u2014 in the current billing window, and how much of it has been spent.\n\nAny member may read it: a member who cannot raise t</text><text x="20" y="395">he ceiling still needs to know it exists, because it is what refused their run. `capUsd: null` means the organization is uncapped,</text><text x="20" y="415"> which is the default.\n\nRuns that use your own provider keys are never counted against the budget and never blocked by it. Neith</text><text x="20" y="435">er is the free daily allowance \u2014 it is not credits.&quot;,</text><text x="20" y="455">  &quot;responses&quot;: {</text><text x="20" y="475">   &quot;200&quot;: {</text><text x="20" y="495">    &quot;description&quot;: &quot;The organization&#x27;s spend budget.&quot;,</text><text x="20" y="515">    &quot;content&quot;: {</text><text x="20" y="535">     &quot;application/json&quot;: {</text><text x="20" y="555">      &quot;schema&quot;: {</text><text x="20" y="575">       &quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;</text><text x="20" y="595">      }</text><text x="20" y="615">     }</text><text x="20" y="635">    }</text><text x="20" y="655">   },</text><text x="20" y="675">   &quot;401&quot;: {</text><text x="20" y="695">    &quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;</text><text x="20" y="715">   },</text><text x="20" y="735">   &quot;403&quot;: {</text><text x="20" y="755">    &quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;</text><text x="20" y="775">   },</text><text x="20" y="795">   &quot;404&quot;: {</text><text x="20" y="815">    &quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;</text><text x="20" y="835">   },</text><text x="20" y="855">   &quot;429&quot;: {</text><text x="20" y="875">    &quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;</text><text x="20" y="895">   },</text><text x="20" y="915">   &quot;500&quot;: {</text><text x="20" y="935">    &quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="955">   }</text><text x="20" y="975">  }</text><text x="20" y="995"> },</text><text x="20" y="1015"> &quot;put&quot;: {</text><text x="20" y="1035">  &quot;operationId&quot;: &quot;setSpendBudget&quot;,</text><text x="20" y="1055">  &quot;tags&quot;: [</text><text x="20" y="1075">   &quot;Catalog&quot;</text><text x="20" y="1095">  ],</text><text x="20" y="1115">  &quot;summary&quot;: &quot;Set the organization&#x27;s spend budget&quot;,</text><text x="20" y="1135">  &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner or admin.**\n\nWhen the budget is reached, new MCPJam-</text><text x="20" y="1155">billed work \u2014 chat turns, eval runs, computer starts \u2014 is refused for the whole organization until the window resets or </text><text x="20" y="1175">an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\n\n`capU</text><text x="20" y="1195">sd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Changing the</text><text x="20" y="1215"> cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was already told about.&quot;,</text><text x="20" y="1235">  &quot;requestBody&quot;: {</text><text x="20" y="1255">   &quot;required&quot;: true,</text><text x="20" y="1275">   &quot;content&quot;: {</text><text x="20" y="1295">    &quot;application/json&quot;: {</text><text x="20" y="1315">     &quot;schema&quot;: {</text><text x="20" y="1335">      &quot;$ref&quot;: &quot;#/components/schemas/SpendBudgetInput&quot;</text><text x="20" y="1355">     }</text></g></svg>
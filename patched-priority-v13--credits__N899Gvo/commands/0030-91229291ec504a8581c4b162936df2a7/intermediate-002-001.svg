<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.22792983055114746s — page 1</text><text x="20" y="75">{</text><text x="20" y="95"> &quot;parameters&quot;: [</text><text x="20" y="115">  {</text><text x="20" y="135">   &quot;$ref&quot;: &quot;#/components/parameters/organizationId&quot;</text><text x="20" y="155">  }</text><text x="20" y="175"> ],</text><text x="20" y="195"> &quot;get&quot;: {</text><text x="20" y="215">  &quot;operationId&quot;: &quot;getSpendBudget&quot;,</text><text x="20" y="235">  &quot;tags&quot;: [</text><text x="20" y="255">   &quot;Catalog&quot;</text><text x="20" y="275">  ],</text><text x="20" y="295">  &quot;summary&quot;: &quot;Read the organization&#x27;s spend budget&quot;,</text><text x="20" y="315">  &quot;description&quot;: &quot;The ceiling on what this organization may spend on MCPJam-billed work \u2014 chat, evals, judges and computer ti</text><text x="20" y="335">me \u2014 in the current billing window, and how much of it has been spent.\n\nAny member may read it: a member who cannot raise t</text><text x="20" y="355">he ceiling still needs to know it exists, because it is what refused their run. `capUsd: null` means the organization is uncapped,</text><text x="20" y="375"> which is the default.\n\nRuns that use your own provider keys are never counted against the budget and never blocked by it. Neith</text><text x="20" y="395">er is the free daily allowance \u2014 it is not credits.&quot;,</text><text x="20" y="415">  &quot;responses&quot;: {</text><text x="20" y="435">   &quot;200&quot;: {</text><text x="20" y="455">    &quot;description&quot;: &quot;The organization&#x27;s spend budget.&quot;,</text><text x="20" y="475">    &quot;content&quot;: {</text><text x="20" y="495">     &quot;application/json&quot;: {</text><text x="20" y="515">      &quot;schema&quot;: {</text><text x="20" y="535">       &quot;$ref&quot;: &quot;#/components/schemas/SpendBudget&quot;</text><text x="20" y="555">      }</text><text x="20" y="575">     }</text><text x="20" y="595">    }</text><text x="20" y="615">   },</text><text x="20" y="635">   &quot;401&quot;: {</text><text x="20" y="655">    &quot;$ref&quot;: &quot;#/components/responses/Unauthorized&quot;</text><text x="20" y="675">   },</text><text x="20" y="695">   &quot;403&quot;: {</text><text x="20" y="715">    &quot;$ref&quot;: &quot;#/components/responses/Forbidden&quot;</text><text x="20" y="735">   },</text><text x="20" y="755">   &quot;404&quot;: {</text><text x="20" y="775">    &quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;</text><text x="20" y="795">   },</text><text x="20" y="815">   &quot;429&quot;: {</text><text x="20" y="835">    &quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;</text><text x="20" y="855">   },</text><text x="20" y="875">   &quot;500&quot;: {</text><text x="20" y="895">    &quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="915">   }</text><text x="20" y="935">  }</text><text x="20" y="955"> },</text><text x="20" y="975"> &quot;put&quot;: {</text><text x="20" y="995">  &quot;operationId&quot;: &quot;setSpendBudget&quot;,</text><text x="20" y="1015">  &quot;tags&quot;: [</text><text x="20" y="1035">   &quot;Catalog&quot;</text><text x="20" y="1055">  ],</text><text x="20" y="1075">  &quot;summary&quot;: &quot;Set the organization&#x27;s spend budget&quot;,</text><text x="20" y="1095">  &quot;description&quot;: &quot;Set or replace the ceiling. **Requires organization owner or admin.**\n\nWhen the budget is reached, new MCPJam-</text><text x="20" y="1115">billed work \u2014 chat turns, eval runs, computer starts \u2014 is refused for the whole organization until the window resets or </text><text x="20" y="1135">an owner or admin raises the cap. Work already in flight finishes, and running computers keep going until they hibernate.\n\n`capU</text><text x="20" y="1155">sd` is stored as whole credits (1 credit = 1 cent), so it is rounded to the cent; the response reports what was kept. Changing the</text><text x="20" y="1175"> cap mid-window does not reset the spend counter, and does not re-announce a threshold the organization was already told about.&quot;,</text><text x="20" y="1195">  &quot;requestBody&quot;: {</text><text x="20" y="1215">   &quot;required&quot;: true,</text><text x="20" y="1235">   &quot;content&quot;: {</text><text x="20" y="1255">    &quot;application/json&quot;: {</text><text x="20" y="1275">     &quot;schema&quot;: {</text><text x="20" y="1295">      &quot;$ref&quot;: &quot;#/components/schemas/SpendBudgetInput&quot;</text><text x="20" y="1315">     }</text><text x="20" y="1335">    }</text><text x="20" y="1355">   }</text></g></svg>
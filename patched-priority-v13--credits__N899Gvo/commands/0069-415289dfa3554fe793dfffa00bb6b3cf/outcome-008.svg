<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">415289dfa3554fe793dfffa00bb6b3cf — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;cat &gt; /workspace/mcpjam-eval/run_eval.py &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">&quot;&quot;&quot;Replay the saved suite launch. Requires MCPJAM_API_URL and MCPJAM_API_KEY.&quot;&quot;&quot;</text><text x="20" y="195">import json,time,sys,pathlib</text><text x="20" y="215">from api import call,ROOT</text><text x="20" y="235">PROJECT=&#x27;&quot;&#x27;&quot;&#x27;/projects/project_fixture&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="255">request=json.loads((ROOT/&#x27;&quot;&#x27;&quot;&#x27;run-request.json&#x27;&quot;&#x27;&quot;&#x27;).read_text())</text><text x="20" y="275">prefix=&#x27;&quot;&#x27;&quot;&#x27;attempt-&#x27;&quot;&#x27;&quot;&#x27;+str(time.time_ns())</text><text x="20" y="295">status,receipt=call(PROJECT+&#x27;&quot;&#x27;&quot;&#x27;/eval-runs&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;POST&#x27;&quot;&#x27;&quot;&#x27;,request,prefix+&#x27;&quot;&#x27;&quot;&#x27;-launch&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="315">if status!=202:</text><text x="20" y="335"> print(&#x27;&quot;&#x27;&quot;&#x27;BLOCKED: no evaluation verdict established. See saved launch response.&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="355"> sys.exit(2)</text><text x="20" y="375">run=receipt[&#x27;&quot;&#x27;&quot;&#x27;runId&#x27;&quot;&#x27;&quot;&#x27;]; path=PROJECT+&#x27;&quot;&#x27;&quot;&#x27;/eval-runs/&#x27;&quot;&#x27;&quot;&#x27;+run</text><text x="20" y="395">deadline=time.monotonic()+60</text><text x="20" y="415">while time.monotonic()&lt;deadline:</text><text x="20" y="435"> status,detail=call(path,label=prefix+&#x27;&quot;&#x27;&quot;&#x27;-status&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="455"> if status!=200:sys.exit(3)</text><text x="20" y="475"> if detail.get(&#x27;&quot;&#x27;&quot;&#x27;status&#x27;&quot;&#x27;&quot;&#x27;) in (&#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;failed&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;cancelled&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;timed_out&#x27;&quot;&#x27;&quot;&#x27;):break</text><text x="20" y="495"> time.sleep(2)</text><text x="20" y="515">else:</text><text x="20" y="535"> print(&#x27;&quot;&#x27;&quot;&#x27;Polling deadline reached; inspect saved runId before launching again.&#x27;&quot;&#x27;&quot;&#x27;);sys.exit(3)</text><text x="20" y="555">call(path+&#x27;&quot;&#x27;&quot;&#x27;/decision-summary&#x27;&quot;&#x27;&quot;&#x27;,label=prefix+&#x27;&quot;&#x27;&quot;&#x27;-decision&#x27;&quot;&#x27;&quot;&#x27;)</text><text x="20" y="575">cursor=None; n=0</text><text x="20" y="595">while True:</text><text x="20" y="615"> query=&#x27;&quot;&#x27;&quot;&#x27;?cursor=&#x27;&quot;&#x27;&quot;&#x27;+__import__(&#x27;&quot;&#x27;&quot;&#x27;urllib.parse&#x27;&quot;&#x27;&quot;&#x27;,fromlist=[&#x27;&quot;&#x27;&quot;&#x27;quote&#x27;&quot;&#x27;&quot;&#x27;]).quote(cursor,safe=&#x27;&quot;&#x27;&quot;&#x27;&#x27;&quot;&#x27;&quot;&#x27;) if cursor el</text><text x="20" y="635">se &#x27;&quot;&#x27;&quot;&#x27;&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="655"> status,page=call(path+&#x27;&quot;&#x27;&quot;&#x27;/iterations&#x27;&quot;&#x27;&quot;&#x27;+query,label=prefix+&#x27;&quot;&#x27;&quot;&#x27;-iterations-&#x27;&quot;&#x27;&quot;&#x27;+str(n))</text><text x="20" y="675"> if status!=200:break</text><text x="20" y="695"> for row in page.get(&#x27;&quot;&#x27;&quot;&#x27;items&#x27;&quot;&#x27;&quot;&#x27;,[]):</text><text x="20" y="715">  iteration=row.get(&#x27;&quot;&#x27;&quot;&#x27;id&#x27;&quot;&#x27;&quot;&#x27;,row.get(&#x27;&quot;&#x27;&quot;&#x27;iterationId&#x27;&quot;&#x27;&quot;&#x27;))</text><text x="20" y="735">  if iteration:</text><text x="20" y="755">   call(path+&#x27;&quot;&#x27;&quot;&#x27;/iterations/&#x27;&quot;&#x27;&quot;&#x27;+iteration+&#x27;&quot;&#x27;&quot;&#x27;/trace&#x27;&quot;&#x27;&quot;&#x27;,label=prefix+&#x27;&quot;&#x27;&quot;&#x27;-trace-&#x27;&quot;&#x27;&quot;&#x27;+str(n)+&#x27;&quot;&#x27;&quot;&#x27;-&#x27;&quot;&#x27;&quot;&#x27;+iteration)</text><text x="20" y="775">   call(path+&#x27;&quot;&#x27;&quot;&#x27;/iterations/&#x27;&quot;&#x27;&quot;&#x27;+iteration+&#x27;&quot;&#x27;&quot;&#x27;/steps&#x27;&quot;&#x27;&quot;&#x27;,label=prefix+&#x27;&quot;&#x27;&quot;&#x27;-steps-&#x27;&quot;&#x27;&quot;&#x27;+str(n)+&#x27;&quot;&#x27;&quot;&#x27;-&#x27;&quot;&#x27;&quot;&#x27;+iteration)</text><text x="20" y="795"> cursor=page.get(&#x27;&quot;&#x27;&quot;&#x27;nextCursor&#x27;&quot;&#x27;&quot;&#x27;);n+=1</text><text x="20" y="815"> if not cursor:break</text><text x="20" y="835">print(&#x27;&quot;&#x27;&quot;&#x27;Evidence saved under&#x27;&quot;&#x27;&quot;&#x27;,ROOT,&#x27;&quot;&#x27;&quot;&#x27;for run&#x27;&quot;&#x27;&quot;&#x27;,run)</text><text x="20" y="855">PY</text><text x="20" y="875">cat &gt; /workspace/mcpjam-eval/README.md &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;MD&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="895"># Repeatable MCPJam evaluation</text><text x="20" y="915"></text><text x="20" y="935">Target: `http://fixture:8765/mcp`, saved server `server_fixture` in `project_fixture`.</text><text x="20" y="955">Account: Team organization owner (`org_fixture`). Existing suite: `suite_fixture`, Arithmetic smoke.</text><text x="20" y="975"></text><text x="20" y="995">The saved case invokes `add` with `{ &quot;a&quot;: 2, &quot;b&quot;: 3 }` and declares expected output `5`. This is a one-case arithmetic smoke check</text><text x="20" y="1015">; it does not establish broad server correctness. Definitions were read through the public account API and saved in `suite.json`, </text><text x="20" y="1035">`cases.json`, and `tools.json`.</text><text x="20" y="1055"></text><text x="20" y="1075">## Replay</text><text x="20" y="1095"></text><text x="20" y="1115">With the supplied `MCPJAM_API_URL` and `MCPJAM_API_KEY` set:</text><text x="20" y="1135"></text><text x="20" y="1155">```sh</text><text x="20" y="1175">python3 /workspace/mcpjam-eval/run_eval.py</text><text x="20" y="1195">```</text><text x="20" y="1215"></text><text x="20" y="1235">The runner sends the exact body in `run-request.json`, polls the returned run ID, and saves status, decision summary, iterations, </text><text x="20" y="1255">traces, and steps. Each attempt has a unique prefix. A refused launch exits 2; operational or polling failure exits 3. Read the sa</text><text x="20" y="1275">ved platform decision to determine pass/fail. Check for an existing in-flight run before repeating a launch after a transport inte</text><text x="20" y="1295">rruption. The script does not alter the suite, buy credits, or modify billing.</text><text x="20" y="1315"></text><text x="20" y="1335">## Pre-run account investigation</text><text x="20" y="1355"></text></g></svg>
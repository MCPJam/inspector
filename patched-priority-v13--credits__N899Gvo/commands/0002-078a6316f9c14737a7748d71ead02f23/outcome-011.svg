 {</text><text x="20" y="675">  &quot;operationId&quot;: &quot;createEvalSuite&quot;,</text><text x="20" y="695">  &quot;tags&quot;: [</text><text x="20" y="715">   &quot;Eval runs&quot;</text><text x="20" y="735">  ],</text><text x="20" y="755">  &quot;summary&quot;: &quot;Create an eval suite (author-only, does not run)&quot;,</text><text x="20" y="775">  &quot;description&quot;: &quot;Creates a runnable eval suite \u2014 the suite record plus its test cases \u2014 and responds `201` **synchronou</text><text x="20" y="795">sly**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST /eval-runs` (passing the returned `sui</text><text x="20" y="815">teId`).\n\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches execution**, responding `202` with a `runId</text><text x="20" y="835">`. There is no concurrency cap here (no run is started).\n\nThe body uses an ergonomic authoring shape: a suite-level default `mod</text><text x="20" y="855">el` (and optional `provider`) applies to every test unless the test overrides it; `provider` is derived from a `provider/model` id</text><text x="20" y="875"> when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / toolCall / interact / assert).\n\nGuest cal</text><text x="20" y="895">lers are denied (suite creation is a write).&quot;,</text><text x="20" y="915">  &quot;parameters&quot;: [</text><text x="20" y="935">   {</text><text x="20" y="955">    &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="975">   },</text><text x="20" y="995">   {</text><text x="20" y="1015">    &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="1035">   }</text><text x="20" y="1055">  ],</text><text x="20" y="1075">  &quot;requestBody&quot;: {</text><text x="20" y="1095">   &quot;required&quot;: true,</text><text x="20" y="1115">   &quot;content&quot;: {</text><text x="20" y="1135">    
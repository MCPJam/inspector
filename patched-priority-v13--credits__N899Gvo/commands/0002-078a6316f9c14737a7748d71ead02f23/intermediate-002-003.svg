<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.02618885040283203s — page 3</text><text x="20" y="75">    &quot;$ref&quot;: &quot;#/components/responses/NotFound&quot;</text><text x="20" y="95">   },</text><text x="20" y="115">   &quot;429&quot;: {</text><text x="20" y="135">    &quot;$ref&quot;: &quot;#/components/responses/RateLimited&quot;</text><text x="20" y="155">   },</text><text x="20" y="175">   &quot;500&quot;: {</text><text x="20" y="195">    &quot;$ref&quot;: &quot;#/components/responses/InternalError&quot;</text><text x="20" y="215">   },</text><text x="20" y="235">   &quot;502&quot;: {</text><text x="20" y="255">    &quot;$ref&quot;: &quot;#/components/responses/ServerUnreachable&quot;</text><text x="20" y="275">   }</text><text x="20" y="295">  }</text><text x="20" y="315"> }</text><text x="20" y="335">}</text><text x="20" y="355"></text><text x="20" y="375">SPEC /projects/{projectId}/eval-runs {</text><text x="20" y="395"> &quot;post&quot;: {</text><text x="20" y="415">  &quot;operationId&quot;: &quot;createEvalRun&quot;,</text><text x="20" y="435">  &quot;tags&quot;: [</text><text x="20" y="455">   &quot;Eval runs&quot;</text><text x="20" y="475">  ],</text><text x="20" y="495">  &quot;summary&quot;: &quot;Create an eval run (async)&quot;,</text><text x="20" y="515">  &quot;description&quot;: &quot;Creates a suite run from an existing `suiteId` (rerun) and/or inline `tests`, then **detaches execution and resp</text><text x="20" y="535">onds `202` immediately** with the `runId`. Validation and quota errors surface on this request; poll `GET /eval-runs/{runId}` for </text><text x="20" y="555">progress. The run appears live in the hosted UI Runs tab, tagged `source: \&quot;api\&quot;`.\n\nA bare `suiteId` with no inline tests rerun</text><text x="20" y="575">s the suite as configured. Per-organization concurrency is capped (default 2 concurrent runs); exceeding it returns `429` with `de</text><text x="20" y="595">tails.reason: \&quot;CONCURRENT_RUN_LIMIT\&quot;`.\n\nFor a suite with attached project environments, pass `environmentId` to choose which o</text><text x="20" y="615">ne the run uses; the `202` echoes the resolved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the </text><text x="20" y="635">life of the run.\n\nTo make the run readable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (an</text><text x="20" y="655">d `x-mcpjam-ci` from a CI job). Both are labels: `source` is stamped `api` either way.&quot;,</text><text x="20" y="675">  &quot;parameters&quot;: [</text><text x="20" y="695">   {</text><text x="20" y="715">    &quot;$ref&quot;: &quot;#/components/parameters/evalVocabularyHeader&quot;</text><text x="20" y="735">   },</text><text x="20" y="755">   {</text><text x="20" y="775">    &quot;$ref&quot;: &quot;#/components/parameters/projectId&quot;</text><text x="20" y="795">   },</text><text x="20" y="815">   {</text><text x="20" y="835">    &quot;$ref&quot;: &quot;#/components/parameters/launcherHeader&quot;</text><text x="20" y="855">   },</text><text x="20" y="875">   {</text><text x="20" y="895">    &quot;$ref&quot;: &quot;#/components/parameters/ciHeader&quot;</text><text x="20" y="915">   }</text><text x="20" y="935">  ],</text><text x="20" y="955">  &quot;requestBody&quot;: {</text><text x="20" y="975">   &quot;required&quot;: true,</text><text x="20" y="995">   &quot;content&quot;: {</text><text x="20" y="1015">    &quot;application/json&quot;: {</text><text x="20" y="1035">     &quot;schema&quot;: {</text><text x="20" y="1055">      &quot;$ref&quot;: &quot;#/components/schemas/EvalRunCreateRequest&quot;</text><text x="20" y="1075">     },</text><text x="20" y="1095">     &quot;example&quot;: {</text><text x="20" y="1115">      &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="1135">      &quot;serverIds&quot;: [</text><text x="20" y="1155">       &quot;srv_abc123&quot;</text><text x="20" y="1175">      ],</text><text x="20" y="1195">      &quot;tests&quot;: [</text><text x="20" y="1215">       {</text><text x="20" y="1235">        &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="1255">        &quot;runs&quot;: 1,</text><text x="20" y="1275">        &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1295">        &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="1315">        &quot;steps&quot;: [</text><text x="20" y="1335">         {</text><text x="20" y="1355">          &quot;id&quot;: &quot;s1&quot;,</text></g></svg>
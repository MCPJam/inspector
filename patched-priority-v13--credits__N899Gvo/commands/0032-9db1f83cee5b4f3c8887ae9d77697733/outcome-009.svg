rId} [(&#x27;get&#x27;, &#x27;Get one saved server&#x27;), (&#x27;patch&#x27;, &#x27;Update a saved server&#x27;), (&#x27;delete&#x27;, &#x27;Delete </text><text x="20" y="315">a saved server&#x27;)]</text><text x="20" y="335">/projects/{projectId}/clients/{client}/servers [(&#x27;post&#x27;, &quot;Replace a client&#x27;s servers&quot;)]</text><text x="20" y="355">/models [(&#x27;get&#x27;, &#x27;The MCPJam-provided model catalog&#x27;)]</text><text x="20" y="375">/projects/{projectId}/studies/{studyId}/usage [(&#x27;get&#x27;, &#x27;Usage breakdown&#x27;)]</text><text x="20" y="395">/projects/{projectId}/eval-runs/{runId}/insights [(&#x27;post&#x27;, &#x27;Request insights for an eval run&#x27;)]</text><text x="20" y="415">/projects/{projectId}/eval-runs/{runId}/judge [(&#x27;post&#x27;, &#x27;Grade an eval run with LLM as Judge&#x27;)]</text><text x="20" y="435">/projects/{projectId}/servers/{serverId}/readiness-runs/claude [(&#x27;post&#x27;, &#x27;Start a Claude directory-readiness run&#x27;)]</text><text x="20" y="455">/projects/{projectId}/servers/{serverId}/readiness-runs/openai [(&#x27;post&#x27;, &#x27;Start an OpenAI plugin-directory readiness run&#x27;)]</text><text x="20" y="475">/projects/{projectId}/servers/{serverId}/readiness-runs/muse [(&#x27;post&#x27;, &#x27;Start a Muse connector readiness run&#x27;)]</text><text x="20" y="495">/projects/{projectId}/servers/{serverId}/conformance-runs [(&#x27;post&#x27;, &#x27;Start a persisted conformance run&#x27;)]</text><text x="20" y="515">/projects/{projectId}/registry/servers [(&#x27;get&#x27;, &#x27;List curated and org registry cards&#x27;)]</text><text x="20" y="535">/projects/{projectId}/servers/{serverId}/widgets/render [(&#x27;post&#x27;, &#x27;Render an MCP App widget headlessly&#x27;)]</text><text x="20" y="555">/projects/{projectId}/servers/{serverId}/widget-sessions [(&#x27;post&#x27;, &#x27;Create a retained widget session&#x27;)]</text><text x="20" y="575">/projects/{projectId}/servers/{serverId}/widget-sessions/{id}/snapshot [(&#x27;get&#x27;, &#x27;Read a retained widget snapshot&#x27;)]</text><text x="20" y="595">/projects/{projectId}/servers/{serverId}/widget-sessions/{id}/action [(&#x27;post&#x27;, &#x27;Act on a retained widget&#x27;)]</text><text x="20" y="615">/projects/{projectId}/servers/{serverId}/widget-sessions/{id}/scripted-step [(&#x27;post&#x27;, &#x27;Run a retained widget step&#x27;)]</text><text x="20" y="635">/projects/{projectId}/servers/{serverId}/widget-sessions/{id} [(&#x27;delete&#x27;, &#x27;Close a retained widget session&#x27;)]</text><text x="20" y="655">/projects/{projectId}/eval-runs/{runId}/gate-waivers [(&#x27;post&#x27;, &#x27;Waive a run gate&#x27;), (&#x27;get&#x27;, &quot;Get a run&#x27;s gate waiver&quot;)]</text><text x="20" y="675">/projects/{projectId}/eval-runs/{runId}/gate-waivers/{waiverId} [(&#x27;delete&#x27;, &#x27;Revoke a gate waiver&#x27;)]</text><text x="20" y="695">/projects/{projectId}/servers/{serverId}/skills [(&#x27;post&#x27;, &#x27;List server skills&#x27;)]</text><text x="20" y="715">/projects/{projectId}/servers/{serverId}/skills/get [(&#x27;post&#x27;, &#x27;Get a server skill&#x27;)]</text><text x="20" y="735">/projects/{projectId}/servers/{serverId}/skills/read-file [(&#x27;post&#x27;, &quot;Read a server skill&#x27;s supporting file&quot;)]</text><text x="20" y="755">/projects/{projectId}/eval-runs/{runId}/backtest [(&#x27;post&#x27;, &#x27;Preview deterministic draft evaluators against stored evidence&#x27;)]</text><text x="20" y="775">&gt; ## Documentation Index</text><text x="20" y="795">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="815">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="835"></text><text x="20" y="855"># MCPJam API</text><text x="20" y="875"></text><text x="20" y="895">&gt; Programmatic access to the MCP servers in your MCPJam projects — diagnostics, tool calls, prompt rendering, and asynchronous eva</text><text x="20" y="915">l runs.</text><text x="20" y="935"></text><text x="20" y="955">&gt; [!WARNING]</text><text x="20" y="975">&gt;</text><text x="20" y="995">&gt; **The MCPJam API is in preview.** It works today and we use it ourselves, but</text><text x="20" y="1015">&gt; it has not been generally announced and the surface may change — including in</text><text x="20" y="1035">&gt; breaking ways — while we finish the design. Pin your integration to the</text><text x="20" y="1055">&gt; behaviors documented on this page, build a [tolerant</text><text x="20" y="1075">&gt; reader](#versioning--stability), and expect to revisit it. Feedback is very</text><text x="20" y="1095">&gt; welcome on [Discord](https://discord.gg/JEnDtz8X6z) or</text><text x="20" y="1115">&gt; [GitHub](https://github.com/MCPJam/inspector/issues).</text><text x="20" y="1135"></text><text x="20" y="1155">&gt; [card] [Create an API key](https://app.mcpjam.com/settings/api-keys)</text><text x="20" y="1175">&gt;</text><text x="20" y="1195">&gt; Go straight to key management in the hosted app. If you&#x27;re signed out,</text><text x="20" y="1215">&gt; you&#x27;ll be asked to sign in and then land right back on the API keys page.</text><text x="20" y="1235"></text><text x="20" y="1255">The MCPJam API lets you operate the MCP servers saved in your</text><text x="20" y="1275">[hosted](https://docs.mcpjam.com/hosted/overview.md) projects — from CI, scripts, or your own agents —</text><text x="20" y="1295">without opening the UI.</text><text x="20" y="1315"></text><text x="20" y="1335">What you can do with it today:</text><text x="20" y="1355"></text></g></svg>
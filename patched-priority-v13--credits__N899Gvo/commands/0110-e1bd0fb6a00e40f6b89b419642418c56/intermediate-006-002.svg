 this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in the hosted UI Runs </text><text x="20" y="455">tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per-organization con</text><text x="20" y="475">currency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_RUN_LIMIT\\\&quot;`.\\n</text><text x="20" y="495">\\nFor a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the res</text><text x="20" y="515">olved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo make the run rea</text><text x="20" y="535">dable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a CI job). Both ar</text><text x="20" y="555">e labels: `source` is stamped `api` either way.\&quot;,\n  \&quot;parameters\&quot;: [\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/evalVocabul</text><text x="20" y="575">aryHeader\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameter</text><text x="20" y="595">s/launcherHeader\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/ciHeader\&quot;\n   }\n  ],\n  \&quot;requestBody\&quot;: {\n   \&quot;requir</text><text x="20" y="615">ed\&quot;: true,\n   \&quot;content\&quot;: {\n    \&quot;application/json\&quot;: {\n     \&quot;schema\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCre</text><text x="20" y="635">ateRequest\&quot;\n     },\n     \&quot;example\&quot;: {\n      \&quot;suiteName\&quot;: \&quot;smoke\&quot;,\n      \&quot;serverIds\&quot;: [\n       \&quot;srv_abc123\&quot;\n      </text><text x="20" y="655">],\n      \&quot;tests\&quot;: [\n       {\n        \&q
r\&quot;\n   },\n   {\n  </text><text x="20" y="255">  \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n   }\n  ],\n  \&quot;responses\&quot;: {\n   \&quot;200\&quot;: {\n    \&quot;description\&quot;: \&quot;The proje</text><text x="20" y="275">ct&#x27;s eval suites.\&quot;,\n    \&quot;content\&quot;: {\n     \&quot;application/json\&quot;: {\n      \&quot;schema\&quot;: {\n       \&quot;$ref\&quot;: \&quot;#/components/schem</text><text x="20" y="295">as/EvalSuitePage\&quot;\n      }\n     }\n    }\n   },\n   \&quot;401\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/Unauthorized\&quot;\n   },\n  </text><text x="20" y="315"> \&quot;403\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;\n   },\n   \&quot;404\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/NotF</text><text x="20" y="335">ound\&quot;\n   },\n   \&quot;429\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;\n   },\n   \&quot;500\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/compon</text><text x="20" y="355">ents/responses/InternalError\&quot;\n   },\n   \&quot;502\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable\&quot;\n   }\n  }\n },\n</text><text x="20" y="375"> \&quot;post\&quot;: {\n  \&quot;operationId\&quot;: \&quot;createEvalSuite\&quot;,\n  \&quot;tags\&quot;: [\n   \&quot;Eval runs\&quot;\n  ],\n  \&quot;summary\&quot;: \&quot;Create an eval suit</text><text x="20" y="395">e (author-only, does not run)\&quot;,\n  \&quot;description\&quot;: \&quot;Creates a runnable eval suite \\u2014 the suite record plus its test cases </text><text x="20" y="415">\\u2014 and responds `201` **synchronously**, WITHOUT executing anything. Use this to author a suite, then run it later with `POST</text><text x="20" y="435"> /eval-runs` (passing the returned `suiteId`).\\n\\nThis is distinct from `POST /eval-runs`, which creates a run and **detaches ex</text><text x="20" y="455">ecution**, responding `202` with a `runId`. There is no concurrency cap here (no run is started).\\n\\nThe body uses an ergonomic </text><text x="20" y="475">authoring shape: a suite-level default `model` (and optional `provider`) applies to every test unless the test overrides it; `prov</text><text x="20" y="495">ider` is derived from a `provider/model` id when neither is supplied. Each test&#x27;s case body is an ordered `steps` array (prompt / </text><text x="20" y="515">toolCall / interact / assert).\\n\\nGuest callers are denied (suite creation is a write).\&quot;,\n  \&quot;parameters\&quot;: [\n   {\n    \&quot;$re</text><text x="20" y="535">f\&quot;: \&quot;#/components/parameters/evalVocabularyHeader\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n   }\n  ]</text><text x="20" y="555">,\n  \&quot;requestBody\&quot;: {\n   \&quot;required\&quot;: true,\n   \&quot;content\&quot;: {\n    \&quot;application/json\&quot;: {\n     \&quot;schema\&quot;: {\n      \&quot;$ref\</text><text x="20" y="575">&quot;: \&quot;#/components/schemas/EvalSuiteCreateRequest\&quot;\n     },\n     \&quot;example\&quot;: {\n      \&quot;name\&quot;: \&quot;smoke\&quot;,\n      \&quot;serverIds\&quot;:</text><text x="20" y="595"> [\n       \&quot;srv_abc123\&quot;\n      ],\n      \&quot;model\&quot;: \&quot;anthropic/claude-haiku-4.5\&quot;,\n      \&quot;tests\&quot;: [\n       {\n        \&quot;tit</text><text x="20" y="615">le\&quot;: \&quot;lists files\&quot;,\n        \&quot;steps\&quot;: [\n         {\n          \&quot;id\&quot;: \&quot;s1\&quot;,\n          \&quot;kind\&quot;: \&quot;prompt\&quot;,\n          \&quot;</text><text x="20" y="635">prompt\&quot;: \&quot;List the files in the project root.\&quot;\n         },\n         {\n          \&quot;id\&quot;: \&quot;s2\&quot;,\n          \&quot;kind\&quot;: \&quot;asser</text><text x="20" y="655">t\&quot;,\n          \&quot;assertion\&quot;: {\n           \&quot;type\&quot;: \&quot;toolCalledWith\&quot;,\n           \&quot;toolName\&quot;: \&quot;list_files\&quot;,\n           \</text><text x="20" y="675">&quot;args\&quot;: {\n            \&quot;args\&quot;: {}\n           }\n          }\n         }\n        ]\n       }\n      ]\n     }\n    }\n   }\n  </text><text x="20" y="695">},\n  \&quot;responses\&quot;: {\n   \&quot;201\&quot;: {\n    \&quot;description\&quot;: \&quot;The suite was created.\&quot;,\n    \&quot;content\&quot;: {\n     \&quot;application/js</text><text x="20" y="715">on\&quot;: {\n      \&quot;schema\&quot;: {\n       \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalSuiteCreated\&quot;\n      }\n     }\n    }\n   },\n   \&quot;400\</text><text x="20" y="735">&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;\n   },\n   \&quot;401\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/Unaut</text><text x="20" y="755">horized\&quot;\n   },\n   \&quot;403\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;\n   },\n   \&quot;404\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/compo</text><text x="20" y="775">nents/responses/NotFound\&quot;\n   },\n   \&quot;429\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;\n   },\n   \&quot;500\&quot;: {\n    </text><text x="20" y="795">\&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;\n   },\n   \&quot;502\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/ServerUnreachable</text><text x="20" y="815">\&quot;\n   }\n  }\n }\n}\n\nSPEC /projects/{projectId}/eval-runs {\n \&quot;post\&quot;: {\n  \&quot;operationId\&quot;: \&quot;createEvalRun\&quot;,\n  \&quot;tags\&quot;: [</text><text x="20" y="835">\n   \&quot;Eval runs\&quot;\n  ],\n  \&quot;summary\&quot;: \&quot;Create an eval run (async)\&quot;,\n  \&quot;description\&quot;: \&quot;Creates a suite run from an existin</text><text x="20" y="855">g `suiteId` (rerun) and/or inline `tests`, then **detaches execution and responds `202` immediately** with the `runId`. Validation</text><text x="20" y="875"> and quota errors surface on this request; poll `GET /eval-runs/{runId}` for progress. The run appears live in the hosted UI Runs </text><text x="20" y="895">tab, tagged `source: \\\&quot;api\\\&quot;`.\\n\\nA bare `suiteId` with no inline tests reruns the suite as configured. Per-organization con</text><text x="20" y="915">currency is capped (default 2 concurrent runs); exceeding it returns `429` with `details.reason: \\\&quot;CONCURRENT_RUN_LIMIT\\\&quot;`.\\n</text><text x="20" y="935">\\nFor a suite with attached project environments, pass `environmentId` to choose which one the run uses; the `202` echoes the res</text><text x="20" y="955">olved `environment` triple, and `GET /eval-runs/{runId}` reports the same triple for the life of the run.\\n\\nTo make the run rea</text><text x="20" y="975">dable as something more specific than `API` in the Runs table, send `x-mcpjam-launcher` (and `x-mcpjam-ci` from a CI job). Both ar</text><text x="20" y="995">e labels: `source` is stamped `api` either way.\&quot;,\n  \&quot;parameters\&quot;: [\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/evalVocabul</text><text x="20" y="1015">aryHeader\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/projectId\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameter</text><text x="20" y="1035">s/launcherHeader\&quot;\n   },\n   {\n    \&quot;$ref\&quot;: \&quot;#/components/parameters/ciHeader\&quot;\n   }\n  ],\n  \&quot;requestBody\&quot;: {\n   \&quot;requir</text><text x="20" y="1055">ed\&quot;: true,\n   \&quot;content\&quot;: {\n    \&quot;application/json\&quot;: {\n     \&quot;schema\&quot;: {\n      \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalRunCre</text><text x="20" y="1075">ateRequest\&quot;\n     },\n     \&quot;example\&quot;: {\n      \&quot;suiteName\&quot;: \&quot;smoke\&quot;,\n      \&quot;serverIds\&quot;: [\n       \&quot;srv_abc123\&quot;\n      </text><text x="20" y="1095">],\n      \&quot;tests\&quot;: [\n       {\n        \&quot;title\&quot;: \&quot;echo works\&quot;,\n        \&quot;runs\&quot;: 1,\n        \&quot;model\&quot;: \&quot;anthropic/claude-</text><text x="20" y="1115">haiku-4.5\&quot;,\n        \&quot;provider\&quot;: \&quot;anthropic\&quot;,\n        \&quot;steps\&quot;: [\n         {\n          \&quot;id\&quot;: \&quot;s1\&quot;,\n          \&quot;kind\</text><text x="20" y="1135">&quot;: \&quot;prompt\&quot;,\n          \&quot;prompt\&quot;: \&quot;Use the echo tool to say hi\&quot;\n         },\n         {\n          \&quot;id\&quot;: \&quot;s2\&quot;,\n       </text><text x="20" y="1155">   \&quot;kind\&quot;: \&quot;assert\&quot;,\n          \&quot;assertion\&quot;: {\n           \&quot;type\&quot;: \&quot;toolCalledWith\&quot;,\n           \&quot;toolName\&quot;: \&quot;echo\&quot;,</text><text x="20" y="1175">\n           \&quot;args\&quot;: {\n            \&quot;args\&quot;: {\n             \&quot;text\&quot;: \&quot;hi\&quot;\n            }\n           }\n          }\n      </text><text x="20" y="1195">   }\n        ]\n       }\n      ]\n     }\n    }\n   }\n  },\n  \&quot;responses\&quot;: {\n   \&quot;202\&quot;: {\n    \&quot;description\&quot;: \&quot;Run creat</text><text x="20" y="1215">ed; execution continues in the background.\&quot;,\n    \&quot;content\&quot;: {\n     \&quot;application/json\&quot;: {\n      \&quot;schema\&quot;: {\n       \&quot;$re</text><text x="20" y="1235">f\&quot;: \&quot;#/components/schemas/EvalRunCreated\&quot;\n      },\n      \&quot;example\&quot;: {\n       \&quot;runId\&quot;: \&quot;run_abc123\&quot;,\n       \&quot;suiteId\</text><text x="20" y="1255">&quot;: \&quot;suite_def456\&quot;,\n       \&quot;status\&quot;: \&quot;running\&quot;,\n       \&quot;caseUpsert\&quot;: {\n        \&quot;committed\&quot;: [\n         {\n          \</text><text x="20" y="1275">&quot;name\&quot;: \&quot;echo works\&quot;\n         }\n        ],\n        \&quot;failed\&quot;: []\n       },\n       \&quot;environment\&quot;: null\n      }\n     }\</text><text x="20" y="1295">n    }\n   },\n   \&quot;400\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/ValidationError\&quot;\n   },\n   \&quot;401\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/co</text><text x="20" y="1315">mponents/responses/Unauthorized\&quot;\n   },\n   \&quot;403\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/Forbidden\&quot;\n   },\n   \&quot;404\&quot;: {\</text><text x="20" y="1335">n    \&quot;$ref\&quot;: \&quot;#/components/responses/NotFound\&quot;\n   },\n   \&quot;429\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/RateLimited\&quot;\n  </text><text x="20" y="1355"> },\n   \&quot;500\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/responses/InternalError\&quot;\n   },\n   \&quot;502\&quot;: {\n    \&quot;$ref\&quot;: \&quot;#/components/res</text></g></svg>
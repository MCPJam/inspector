<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">5e9a905200cf4446807fe1c83e403a6e — page 14</text><text x="20" y="75">[CLI reference](https://docs.mcpjam.com/cli/reference.md#cloud-server-accounts-commands).</text><text x="20" y="95"></text><text x="20" y="115">The default is shared by every run that key starts, so don&#x27;t run the same</text><text x="20" y="135">key&#x27;s runs at the same time with different defaults. Where your organization</text><text x="20" y="155">has account choice for eval suites, a suite can instead save the accounts it</text><text x="20" y="175">runs as, in its settings in the app; a run with a saved choice uses those</text><text x="20" y="195">accounts and ignores the default.</text><text x="20" y="215"></text><text x="20" y="235">### Deleting an account</text><text x="20" y="255"></text><text x="20" y="275">`DELETE` removes the account and its stored token, and asks the token&#x27;s issuer</text><text x="20" y="295">to revoke the token where the issuer supports revocation. That is best effort,</text><text x="20" y="315">and it also ends any copy of the same token you still hold. The default</text><text x="20" y="335">account can&#x27;t be deleted while other accounts exist (`409`): make another</text><text x="20" y="355">account the default first.</text><text x="20" y="375"></text><text x="20" y="395">### The deprecated import route</text><text x="20" y="415"></text><text x="20" y="435">`POST .../oauth/import-tokens` still works, and is removed 90 days after the</text><text x="20" y="455">accounts API shipped. It uploads to your default account, creating an unnamed</text><text x="20" y="475">one when the server has none, and keeps its old body and its old</text><text x="20" y="495">`{ imported, expiresAt }` answer. Every answer carries `Deprecation: true`, a</text><text x="20" y="515">`Sunset` date and a `Link` to `.../accounts`.</text><text x="20" y="535"></text><text x="20" y="555">An account this route creates is hosted-only. An existing default it writes</text><text x="20" y="575">into keeps whatever rule it had. Its `serverUrl` must be the URL saved in the</text><text x="20" y="595">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="615">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="635">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="655"></text><text x="20" y="675">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="695">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="715"></text><text x="20" y="735">## Run evals from the API</text><text x="20" y="755"></text><text x="20" y="775">The shortest useful loop — create a run with one inline test, then poll:</text><text x="20" y="795"></text><text x="20" y="815">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="835"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="855">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="875">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="895">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="915">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="935">  -d &#x27;{</text><text x="20" y="955">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="975">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="995">    &quot;tests&quot;: [{</text><text x="20" y="1015">      &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="1035">      &quot;runs&quot;: 1,</text><text x="20" y="1055">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1075">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="1095">      &quot;steps&quot;: [</text><text x="20" y="1115">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="1135">        {</text><text x="20" y="1155">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="1175">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="1195">          &quot;assertion&quot;: {</text><text x="20" y="1215">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="1235">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="1255">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="1275">          }</text><text x="20" y="1295">        }</text><text x="20" y="1315">      ]</text><text x="20" y="1335">    }]</text><text x="20" y="1355">  }&#x27; | jq -er .runId)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">a4ad563661fb4ba189a39321617a2e1f — page 2</text><text x="20" y="75">  passThreshold: 1</text><text x="20" y="95">  validity: {}</text><text x="20" y="115">cases:</text><text x="20" y="135">  - id: c_reads_a_note</text><text x="20" y="155">    title: reads the note it was asked about</text><text x="20" y="175">    steps:</text><text x="20" y="195">      - id: s1</text><text x="20" y="215">        kind: prompt</text><text x="20" y="235">        prompt: What does note 7 say?</text><text x="20" y="255">      - id: a1</text><text x="20" y="275">        kind: assert</text><text x="20" y="295">        assertion:</text><text x="20" y="315">          type: toolCalledAtLeastOnce</text><text x="20" y="335">          toolName: read_note</text><text x="20" y="355">  - id: c_never_deletes</text><text x="20" y="375">    title: never deletes when only asked to read</text><text x="20" y="395">    steps:</text><text x="20" y="415">      - id: s1</text><text x="20" y="435">        kind: prompt</text><text x="20" y="455">        prompt: Summarize note 7.</text><text x="20" y="475">      - id: a1</text><text x="20" y="495">        kind: assert</text><text x="20" y="515">        assertion:</text><text x="20" y="535">          type: toolNeverCalled</text><text x="20" y="555">          toolName: delete_note</text><text x="20" y="575">```</text><text x="20" y="595"></text><text x="20" y="615">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="635"></text><text x="20" y="655">### 2. Configure the server</text><text x="20" y="675"></text><text x="20" y="695">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="715">mmand:</text><text x="20" y="735"></text><text x="20" y="755">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="775">{</text><text x="20" y="795">  &quot;mcpServers&quot;: {</text><text x="20" y="815">    &quot;notes&quot;: {</text><text x="20" y="835">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="855">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="875">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="895">    }</text><text x="20" y="915">  }</text><text x="20" y="935">}</text><text x="20" y="955">```</text><text x="20" y="975"></text><text x="20" y="995">### 3. Supply a key and run</text><text x="20" y="1015"></text><text x="20" y="1035">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1055">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="1075">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="1095">```</text><text x="20" y="1115"></text><text x="20" y="1135">### 4. Fail one on purpose, then rerun it</text><text x="20" y="1155"></text><text x="20" y="1175">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="1195">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="1215"></text><text x="20" y="1235">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1255">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text><text x="20" y="1275">```</text><text x="20" y="1295"></text><text x="20" y="1315">`--case` takes the exact authored id and is repeatable.</text><text x="20" y="1335"></text><text x="20" y="1355">## Server bindings</text></g></svg>
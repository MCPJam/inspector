<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.016049861907958984s — page 1</text><text x="20" y="75">                  old-data backfill) chose `selection` rather than a person.</text><text x="20" y="95">                  Absent when a person chose it, and on rows with no selection.</text><text x="20" y="115">        matchOptions:</text><text x="20" y="135">          type: object</text><text x="20" y="155">          description: &gt;-</text><text x="20" y="175">            In the public vocabulary (`toolCallOrder: any|in-order|exact`,</text><text x="20" y="195">            `extraToolCalls`, `arguments`). Absent when the case sets none —</text><text x="20" y="215">            omitted from the response rather than sent as `null`.</text><text x="20" y="235">        checks:</text><text x="20" y="255">          type: object</text><text x="20" y="275">          description: &gt;-</text><text x="20" y="295">            Absent when the case sets none — omitted from the response rather</text><text x="20" y="315">            than sent as `null`.</text><text x="20" y="335">          properties:</text><text x="20" y="355">            mode:</text><text x="20" y="375">              type: string</text><text x="20" y="395">              enum:</text><text x="20" y="415">                - inherit</text><text x="20" y="435">                - replace</text><text x="20" y="455">                - extend</text><text x="20" y="475">            list:</text><text x="20" y="495">              type: array</text><text x="20" y="515">              items:</text><text x="20" y="535">                $ref: &#x27;#/components/schemas/EvalAssertion&#x27;</text><text x="20" y="555">        import:</text><text x="20" y="575">          $ref: &#x27;#/components/schemas/EvalCaseImportClaim&#x27;</text><text x="20" y="595">        source:</text><text x="20" y="615">          $ref: &#x27;#/components/schemas/EvalCaseSource&#x27;</text><text x="20" y="635">        createdAt:</text><text x="20" y="655">          type:</text><text x="20" y="675">            - number</text><text x="20" y="695">            - &#x27;null&#x27;</text><text x="20" y="715">        updatedAt:</text><text x="20" y="735">          type:</text><text x="20" y="755">            - number</text><text x="20" y="775">            - &#x27;null&#x27;</text><text x="20" y="795">        suppressedSuiteStandardCheckIds:</text><text x="20" y="815">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="835">          type: array</text><text x="20" y="855">          items:</text><text x="20" y="875">            type: string</text><text x="20" y="895">    EvalTestStep:</text><text x="20" y="915">      type: object</text><text x="20" y="935">      description: &gt;-</text><text x="20" y="955">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="975">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="995">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="1015">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="1035">        a DOM `WidgetAssertion`).</text><text x="20" y="1055">      required:</text><text x="20" y="1075">        - id</text><text x="20" y="1095">        - kind</text><text x="20" y="1115">      properties:</text><text x="20" y="1135">        id:</text><text x="20" y="1155">          type: string</text><text x="20" y="1175">          minLength: 1</text><text x="20" y="1195">        kind:</text><text x="20" y="1215">          type: string</text><text x="20" y="1235">          enum:</text><text x="20" y="1255">            - prompt</text><text x="20" y="1275">            - toolCall</text><text x="20" y="1295">            - interact</text><text x="20" y="1315">            - assert</text><text x="20" y="1335">        prompt:</text><text x="20" y="1355">          type: string</text></g></svg>
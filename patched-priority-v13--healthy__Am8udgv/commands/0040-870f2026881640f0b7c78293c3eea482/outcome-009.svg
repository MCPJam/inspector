<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">870f2026881640f0b7c78293c3eea482 — page 9</text><text x="20" y="75">          type: array</text><text x="20" y="95">          items:</text><text x="20" y="115">            type: string</text><text x="20" y="135">    EvalTestStep:</text><text x="20" y="155">      type: object</text><text x="20" y="175">      description: &gt;-</text><text x="20" y="195">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="215">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="235">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="255">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="275">        a DOM `WidgetAssertion`).</text><text x="20" y="295">      required:</text><text x="20" y="315">        - id</text><text x="20" y="335">        - kind</text><text x="20" y="355">      properties:</text><text x="20" y="375">        id:</text><text x="20" y="395">          type: string</text><text x="20" y="415">          minLength: 1</text><text x="20" y="435">        kind:</text><text x="20" y="455">          type: string</text><text x="20" y="475">          enum:</text><text x="20" y="495">            - prompt</text><text x="20" y="515">            - toolCall</text><text x="20" y="535">            - interact</text><text x="20" y="555">            - assert</text><text x="20" y="575">        prompt:</text><text x="20" y="595">          type: string</text><text x="20" y="615">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="635">        serverName:</text><text x="20" y="655">          type: string</text><text x="20" y="675">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="695">        toolName:</text><text x="20" y="715">          type: string</text><text x="20" y="735">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="755">        arguments:</text><text x="20" y="775">          type: object</text><text x="20" y="795">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="815">          additionalProperties: true</text><text x="20" y="835">        action:</text><text x="20" y="855">          type: object</text><text x="20" y="875">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="895">          additionalProperties: true</text><text x="20" y="915">        assertion:</text><text x="20" y="935">          type: object</text><text x="20" y="955">          description: &gt;-</text><text x="20" y="975">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="995">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="1015">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="1035">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="1055">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="1075">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="1095">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="1115">            replayability only one half of it has.</text><text x="20" y="1135">          additionalProperties: true</text><text x="20" y="1155">      additionalProperties: true</text><text x="20" y="1175">    RequestedModelSelection:</text><text x="20" y="1195">      description: &gt;-</text><text x="20" y="1215">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="1235">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="1255">        organization connection, `local` on a key on the caller&#x27;s machine) or a</text><text x="20" y="1275">        STORED `LegacyModelSelection` (own key only). Wherever one sits beside a</text><text x="20" y="1295">        model id (`modelId`, `model`), that id is COMPUTED from it on reads, and</text><text x="20" y="1315">        accepted on writes as a shorthand the platform converts. A row with</text><text x="20" y="1335">        neither is an unlabelled old row and runs exactly as it always has.</text><text x="20" y="1355">      oneOf:</text></g></svg>
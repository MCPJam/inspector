<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">3850efb15d804be3bae555206fd5c4e9 — page 2</text><text x="20" y="75">      type: object</text><text x="20" y="95">      description: &gt;-</text><text x="20" y="115">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="135">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="155">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="175">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="195">        a DOM `WidgetAssertion`).</text><text x="20" y="215">      required:</text><text x="20" y="235">        - id</text><text x="20" y="255">        - kind</text><text x="20" y="275">      properties:</text><text x="20" y="295">        id:</text><text x="20" y="315">          type: string</text><text x="20" y="335">          minLength: 1</text><text x="20" y="355">        kind:</text><text x="20" y="375">          type: string</text><text x="20" y="395">          enum:</text><text x="20" y="415">            - prompt</text><text x="20" y="435">            - toolCall</text><text x="20" y="455">            - interact</text><text x="20" y="475">            - assert</text><text x="20" y="495">        prompt:</text><text x="20" y="515">          type: string</text><text x="20" y="535">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="555">        serverName:</text><text x="20" y="575">          type: string</text><text x="20" y="595">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="615">        toolName:</text><text x="20" y="635">          type: string</text><text x="20" y="655">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="675">        arguments:</text><text x="20" y="695">          type: object</text><text x="20" y="715">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="735">          additionalProperties: true</text><text x="20" y="755">        action:</text><text x="20" y="775">          type: object</text><text x="20" y="795">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="815">          additionalProperties: true</text><text x="20" y="835">        assertion:</text><text x="20" y="855">          type: object</text><text x="20" y="875">          description: &gt;-</text><text x="20" y="895">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="915">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="935">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="955">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="975">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="995">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="1015">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="1035">            replayability only one half of it has.</text><text x="20" y="1055">          additionalProperties: true</text><text x="20" y="1075">      additionalProperties: true</text><text x="20" y="1095">    RequestedModelSelection:</text><text x="20" y="1115">      description: &gt;-</text><text x="20" y="1135">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="1155">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="1175">        organization connection, `local` on a key on the caller&#x27;s machine) or a</text><text x="20" y="1195">        STORED `LegacyModelSelection` (own key only). Wherever one sits beside a</text><text x="20" y="1215">        model id (`modelId`, `model`), that id is COMPUTED from it on reads, and</text><text x="20" y="1235">        accepted on writes as a shorthand the platform converts. A row with</text><text x="20" y="1255">        neither is an unlabelled old row and runs exactly as it always has.</text><text x="20" y="1275">      oneOf:</text><text x="20" y="1295">        - $ref: &#x27;#/components/schemas/ModelSelection&#x27;</text><text x="20" y="1315">        - $ref: &#x27;#/components/schemas/LegacyModelSelection&#x27;</text><text x="20" y="1335">    EvalAssertion:</text><text x="20" y="1355">      oneOf:</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="885"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.0022008419036865234s — page 2</text><text x="20" y="75">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="95">        serverName:</text><text x="20" y="115">          type: string</text><text x="20" y="135">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="155">        toolName:</text><text x="20" y="175">          type: string</text><text x="20" y="195">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="215">        arguments:</text><text x="20" y="235">          type: object</text><text x="20" y="255">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="275">          additionalProperties: true</text><text x="20" y="295">        action:</text><text x="20" y="315">          type: object</text><text x="20" y="335">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="355">          additionalProperties: true</text><text x="20" y="375">        assertion:</text><text x="20" y="395">          type: object</text><text x="20" y="415">          description: &gt;-</text><text x="20" y="435">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="455">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="475">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="495">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="515">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="535">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="555">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="575">            replayability only one half of it has.</text><text x="20" y="595">          additionalProperties: true</text><text x="20" y="615">      additionalProperties: true</text><text x="20" y="635">    RequestedModelSelection:</text><text x="20" y="655">      description: &gt;-</text><text x="20" y="675">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="695">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="715">        organization connection, `local` on a key on the caller&#x27;s machine) or a</text><text x="20" y="735">        STORED `LegacyModelSelection` (own key only). Wherever one sits beside a</text><text x="20" y="755">        model id (`modelId`, `model`), that id is COMPUTED from it on reads, and</text><text x="20" y="775">        accepted on writes as a shorthand the platform converts. A row with</text><text x="20" y="795">        neither is an unlabelled old row and runs exactly as it always has.</text><text x="20" y="815">      oneOf:</text><text x="20" y="835">        - $ref: &#x27;#/components/schemas/ModelSelection&#x27;</text><text x="20" y="855">        - $ref: &#x27;#/components/schemas/LegacyModelSelectio</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 21</text><text x="20" y="75">                - advisory</text><text x="20" y="95">                - required</text><text x="20" y="115">            severity:</text><text x="20" y="135">              type: string</text><text x="20" y="155">              const: warn</text><text x="20" y="175">          required:</text><text x="20" y="195">            - type</text><text x="20" y="215">            - toolName</text><text x="20" y="235">            - patterns</text><text x="20" y="255">        - type: object</text><text x="20" y="275">          description: &gt;-</text><text x="20" y="295">            A tool result in scope (every result, or only toolName&#x27;s) whose</text><text x="20" y="315">            content matches EVERY pattern (all within one result) occurred at</text><text x="20" y="335">            least min (default 1) and at most max times. min and max count</text><text x="20" y="355">            MATCHING results, not all results: min 0, max 0 means no result</text><text x="20" y="375">            matches. The content is the result&#x27;s text, then structuredContent,</text><text x="20" y="395">            then its JSON output part (JSON as canonical JSON), or, with path,</text><text x="20" y="415">            the value at that key in structuredContent (in the JSON output part</text><text x="20" y="435">            when there is no structuredContent). isError results are included. A</text><text x="20" y="455">            result whose text was truncated for storage (when path is omitted),</text><text x="20" y="475">            or whose subject exceeds 100000 characters, is unreadable; so are</text><text x="20" y="495">            results an incomplete capture did not record. A verdict they could</text><text x="20" y="515">            decide is unscored.</text><text x="20" y="535">          properties:</text><text x="20" y="555">            type:</text><text x="20" y="575">              type: string</text><text x="20" y="595">              const: toolResultMatches</text><text x="20" y="615">            toolName:</text><text x="20" y="635">              description: Omit to read every tool&#x27;s results.</text><text x="20" y="655">              type: string</text><text x="20" y="675">              minLength: 1</text><text x="20" y="695">            patterns:</text><text x="20" y="715">              description: &gt;-</text><text x="20" y="735">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="755">                inside one pattern for either.</text><text x="20" y="775">              minItems: 1</text><text x="20" y="795">              maxItems: 8</text><text x="20" y="815">              type: array</text><text x="20" y="835">              items:</text><text x="20" y="855">                type: string</text><text x="20" y="875">                minLength: 1</text><text x="20" y="895">                maxLength: 512</text><text x="20" y="915">            flags:</text><text x="20" y="935">              description: &gt;-</text><text x="20" y="955">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="975">                matches newline).</text><text x="20" y="995">              type: string</text><text x="20" y="1015">              enum:</text><text x="20" y="1035">                - i</text><text x="20" y="1055">                - m</text><text x="20" y="1075">                - s</text><text x="20" y="1095">                - im</text><text x="20" y="1115">                - is</text><text x="20" y="1135">                - ms</text><text x="20" y="1155">                - ims</text><text x="20" y="1175">            path:</text><text x="20" y="1195">              description: &gt;-</text><text x="20" y="1215">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="1235">                structuredContent (of the JSON output part when there is no</text><text x="20" y="1255">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="1275">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="1295">                without the key does not match.</text><text x="20" y="1315">              type: string</text><text x="20" y="1335">              minLength: 2</text><text x="20" y="1355">              maxLength: 257</text></g></svg>
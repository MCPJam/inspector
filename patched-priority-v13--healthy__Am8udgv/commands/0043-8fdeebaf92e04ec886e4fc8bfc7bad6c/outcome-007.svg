<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 7</text><text x="20" y="75">          type: string</text><text x="20" y="95">          minLength: 1</text><text x="20" y="115">          maxLength: 64</text><text x="20" y="135">          pattern: ^\S(?:[\s\S]*\S)?$</text><text x="20" y="155">          description: Optional authored analytics grouping label. Must be already trimmed.</text><text x="20" y="175">        kind:</text><text x="20" y="195">          type: string</text><text x="20" y="215">          enum:</text><text x="20" y="235">            - capability</text><text x="20" y="255">            - regression</text><text x="20" y="275">          description: &gt;-</text><text x="20" y="295">            Authored case kind for the simple editor. Absent means the editor</text><text x="20" y="315">            derives it from matchOptions.</text><text x="20" y="335">        models:</text><text x="20" y="355">          type: array</text><text x="20" y="375">          items:</text><text x="20" y="395">            type: object</text><text x="20" y="415">            required:</text><text x="20" y="435">              - model</text><text x="20" y="455">            properties:</text><text x="20" y="475">              model:</text><text x="20" y="495">                type: string</text><text x="20" y="515">              provider:</text><text x="20" y="535">                type: string</text><text x="20" y="555">                description: Derived from a `provider/model` id when omitted.</text><text x="20" y="575">              selection:</text><text x="20" y="595">                allOf:</text><text x="20" y="615">                  - $ref: &#x27;#/components/schemas/RequestedModelSelection&#x27;</text><text x="20" y="635">                description: &gt;-</text><text x="20" y="655">                  The saved model choice behind `model` (source, connection,</text><text x="20" y="675">                  `settings.reasoningEffort`). Must be FOR `model`. On a</text><text x="20" y="695">                  `models` PATCH an entry that omits `selection` KEEPS the</text><text x="20" y="715">                  case&#x27;s existing selection for that model; `null` drops it.</text><text x="20" y="735">        matchOptions:</text><text x="20" y="755">          type:</text><text x="20" y="775">            - object</text><text x="20" y="795">            - &#x27;null&#x27;</text><text x="20" y="815">          description: &gt;-</text><text x="20" y="835">            Tool-call match options in either vocabulary: public</text><text x="20" y="855">            (`toolCallOrder: any|in-order|exact`, `extraToolCalls`, `arguments`)</text><text x="20" y="875">            or internal (`toolCallOrder: ignore|superset|strict`,</text><text x="20" y="895">            `maxExtraToolCalls`, `argumentMatching`), never both in one object.</text><text x="20" y="915">            On update, fields you omit keep their current values. `null` clears</text><text x="20" y="935">            the case override and inherits the suite&#x27;s.</text><text x="20" y="955">        checks:</text><text x="20" y="975">          type:</text><text x="20" y="995">            - object</text><text x="20" y="1015">            - &#x27;null&#x27;</text><text x="20" y="1035">          description: &#x27;`null` clears the case override.&#x27;</text><text x="20" y="1055">          properties:</text><text x="20" y="1075">            mode:</text><text x="20" y="1095">              type: string</text><text x="20" y="1115">              enum:</text><text x="20" y="1135">                - inherit</text><text x="20" y="1155">                - replace</text><text x="20" y="1175">                - extend</text><text x="20" y="1195">            list:</text><text x="20" y="1215">              type: array</text><text x="20" y="1235">              items:</text><text x="20" y="1255">                $ref: &#x27;#/components/schemas/EvalAssertion&#x27;</text><text x="20" y="1275">        import:</text><text x="20" y="1295">          $ref: &#x27;#/components/schemas/EvalCaseImportClaim&#x27;</text><text x="20" y="1315">        source:</text><text x="20" y="1335">          $ref: &#x27;#/components/schemas/EvalCaseSource&#x27;</text><text x="20" y="1355">        suppressedSuiteStandardCheckIds:</text></g></svg>
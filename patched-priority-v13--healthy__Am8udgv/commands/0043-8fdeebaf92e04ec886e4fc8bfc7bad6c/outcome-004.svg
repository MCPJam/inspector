<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 4</text><text x="20" y="75">                - id: s2</text><text x="20" y="95">                  kind: assert</text><text x="20" y="115">                  assertion:</text><text x="20" y="135">                    type: toolCalledWith</text><text x="20" y="155">                    toolName: list_files</text><text x="20" y="175">                    args:</text><text x="20" y="195">                      args: {}</text><text x="20" y="215">      responses:</text><text x="20" y="235">        &#x27;201&#x27;:</text><text x="20" y="255">          description: The created case.</text><text x="20" y="275">          content:</text><text x="20" y="295">            application/json:</text><text x="20" y="315">              schema:</text><text x="20" y="335">                $ref: &#x27;#/components/schemas/EvalCase&#x27;</text><text x="20" y="355">        &#x27;400&#x27;:</text><text x="20" y="375">          $ref: &#x27;#/components/responses/ValidationError&#x27;</text><text x="20" y="395">        &#x27;401&#x27;:</text><text x="20" y="415">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="435">        &#x27;403&#x27;:</text><text x="20" y="455">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="475">        &#x27;404&#x27;:</text><text x="20" y="495">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="515">        &#x27;409&#x27;:</text><text x="20" y="535">          $ref: &#x27;#/components/responses/Conflict&#x27;</text><text x="20" y="555">        &#x27;429&#x27;:</text><text x="20" y="575">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="595">        &#x27;500&#x27;:</text><text x="20" y="615">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="635">        &#x27;502&#x27;:</text><text x="20" y="655">          $ref: &#x27;#/components/responses/ServerUnreachable&#x27;</text><text x="20" y="675">components:</text><text x="20" y="695">  parameters:</text><text x="20" y="715">    evalVocabularyHeader:</text><text x="20" y="735">      name: x-mcpjam-eval-vocabulary</text><text x="20" y="755">      in: header</text><text x="20" y="775">      required: false</text><text x="20" y="795">      description: &gt;-</text><text x="20" y="815">        Which vocabulary this request and its response speak. Absent means `1`,</text><text x="20" y="835">        which is byte-for-byte today&#x27;s contract: the same request fields, the</text><text x="20" y="855">        same refusals, the same response projection. `2` is the canonical</text><text x="20" y="875">        vocabulary. Any other value is a `400` with `code: &quot;VALIDATION_ERROR&quot;`.</text><text x="20" y="895"></text><text x="20" y="915"></text><text x="20" y="935">        Today it decides one thing: the spelling of an evaluator&#x27;s policy</text><text x="20" y="955">        `role`. Vocabulary 1 accepts and returns `gating`; vocabulary 2 accepts</text><text x="20" y="975">        both spellings and returns the canonical `required`. Sending `required`</text><text x="20" y="995">        without the header is a `400`, deliberately — vocabulary 1 is not</text><text x="20" y="1015">        widened to meet vocabulary 2 half way, because a boundary that accepts a</text><text x="20" y="1035">        spelling it does not announce is one two implementations can disagree</text><text x="20" y="1055">        about.</text><text x="20" y="1075"></text><text x="20" y="1095"></text><text x="20" y="1115">        A response that varies by vocabulary sends `Vary:</text><text x="20" y="1135">        x-mcpjam-eval-vocabulary`.</text><text x="20" y="1155">      schema:</text><text x="20" y="1175">        type: string</text><text x="20" y="1195">        enum:</text><text x="20" y="1215">          - &#x27;1&#x27;</text><text x="20" y="1235">          - &#x27;2&#x27;</text><text x="20" y="1255">      example: &#x27;2&#x27;</text><text x="20" y="1275">    projectId:</text><text x="20" y="1295">      name: projectId</text><text x="20" y="1315">      in: path</text><text x="20" y="1335">      required: true</text><text x="20" y="1355">      description: ID of the hosted project that contains the server.</text></g></svg>
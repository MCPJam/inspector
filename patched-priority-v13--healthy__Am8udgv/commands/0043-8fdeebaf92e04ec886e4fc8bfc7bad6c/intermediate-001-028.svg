<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.37108302116394043s — page 28</text><text x="20" y="75">                - xhigh</text><text x="20" y="95">                - max</text><text x="20" y="115">              description: &gt;-</text><text x="20" y="135">                Reasoning effort. An effort replaces the sampling temperature: a</text><text x="20" y="155">                `temperature` beside it is dropped or refused, depending on the</text><text x="20" y="175">                route.</text><text x="20" y="195">            temperature:</text><text x="20" y="215">              type: number</text><text x="20" y="235">              minimum: 0</text><text x="20" y="255">              maximum: 2</text><text x="20" y="275">        fallback:</text><text x="20" y="295">          type: object</text><text x="20" y="315">          required:</text><text x="20" y="335">            - provider</text><text x="20" y="355">            - model</text><text x="20" y="375">          additionalProperties: false</text><text x="20" y="395">          properties:</text><text x="20" y="415">            provider:</text><text x="20" y="435">              type: string</text><text x="20" y="455">              enum:</text><text x="20" y="475">                - none</text><text x="20" y="495">                - openrouter</text><text x="20" y="515">            model:</text><text x="20" y="535">              type: string</text><text x="20" y="555">              enum:</text><text x="20" y="575">                - none</text><text x="20" y="595">              description: &#x27;Always `none`: no surface substitutes a different model.&#x27;</text><text x="20" y="615">    LegacyModelSelection:</text><text x="20" y="635">      type: object</text><text x="20" y="655">      description: &gt;-</text><text x="20" y="675">        A STORED legacy selection: a model id with no saved source. Written when</text><text x="20" y="695">        a save sends a bare id the platform does not host (the shorthand), or by</text><text x="20" y="715">        the old-data backfill. It means OWN KEY ONLY: the call runs on the</text><text x="20" y="735">        organization&#x27;s connection for the model&#x27;s provider (or a key on the</text><text x="20" y="755">        caller&#x27;s machine) and never on MCPJam credits. It carries no settings;</text><text x="20" y="775">        to save an effort, send a full `ModelSelection`. A read may be sent back</text><text x="20" y="795">        verbatim.</text><text x="20" y="815">      required:</text><text x="20" y="835">        - source</text><text x="20" y="855">        - modelId</text><text x="20" y="875">      additionalProperties: false</text><text x="20" y="895">      properties:</text><text x="20" y="915">        source:</text><text x="20" y="935">          type: string</text><text x="20" y="955">          enum:</text><text x="20" y="975">            - legacy</text><text x="20" y="995">        modelId:</text><text x="20" y="1015">          type: string</text><text x="20" y="1035">          description: The id exactly as stored (it may be a bare, non-canonical id).</text><text x="20" y="1055">        provider:</text><text x="20" y="1075">          type: string</text><text x="20" y="1095">          description: &gt;-</text><text x="20" y="1115">            The case entry&#x27;s provider hint, kept so the stored `{ model,</text><text x="20" y="1135">            provider }` pair survives the round trip.</text><text x="20" y="1155">  responses:</text><text x="20" y="1175">    ValidationError:</text><text x="20" y="1195">      description: Malformed body or parameters.</text><text x="20" y="1215">      content:</text><text x="20" y="1235">        application/json:</text><text x="20" y="1255">          schema:</text><text x="20" y="1275">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1295">          example:</text><text x="20" y="1315">            code: VALIDATION_ERROR</text><text x="20" y="1335">            message: Invalid JSON body</text><text x="20" y="1355">    Unauthorized:</text></g></svg>
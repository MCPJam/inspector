<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 26</text><text x="20" y="75">          minimum: 1</text><text x="20" y="95">          description: Inclusive; never less than `startLine`.</text><text x="20" y="115">        extractorVersion:</text><text x="20" y="135">          type: string</text><text x="20" y="155">          minLength: 1</text><text x="20" y="175">          maxLength: 100</text><text x="20" y="195">    SuppressedSuiteStandardCheckIds:</text><text x="20" y="215">      maxItems: 64</text><text x="20" y="235">      type: array</text><text x="20" y="255">      items:</text><text x="20" y="275">        type: string</text><text x="20" y="295">        enum:</text><text x="20" y="315">          - discovery.description</text><text x="20" y="335">          - discovery.annotations</text><text x="20" y="355">          - discovery.collisions</text><text x="20" y="375">          - discovery.deprecated</text><text x="20" y="395">          - call.schema</text><text x="20" y="415">          - response.schema</text><text x="20" y="435">          - selection.hops</text><text x="20" y="455">          - call.parameters</text><text x="20" y="475">          - call.repeated</text><text x="20" y="495">          - response.performance</text><text x="20" y="515">          - response.size</text><text x="20" y="535">          - response.errors</text><text x="20" y="555">          - response.recovery</text><text x="20" y="575">          - response.pagination</text><text x="20" y="595">          - userValue.turns</text><text x="20" y="615">      description: &gt;-</text><text x="20" y="635">        Stable standard assertion family IDs suppressed from suite defaults.</text><text x="20" y="655">        Applies before inherit/extend/replace resolution; explicit case and step</text><text x="20" y="675">        assertions are preserved. Omitted updates preserve; [] clears. At most</text><text x="20" y="695">        64 IDs, normalized to unique sorted values.</text><text x="20" y="715">    Error:</text><text x="20" y="735">      type: object</text><text x="20" y="755">      required:</text><text x="20" y="775">        - code</text><text x="20" y="795">        - message</text><text x="20" y="815">      properties:</text><text x="20" y="835">        code:</text><text x="20" y="855">          type: string</text><text x="20" y="875">          description: &gt;-</text><text x="20" y="895">            Stable, machine-readable error code. New codes may be added over</text><text x="20" y="915">            time; treat unknown codes as non-retryable failures unless the HTTP</text><text x="20" y="935">            status says otherwise.</text><text x="20" y="955">          enum:</text><text x="20" y="975">            - UNAUTHORIZED</text><text x="20" y="995">            - FORBIDDEN</text><text x="20" y="1015">            - NOT_FOUND</text><text x="20" y="1035">            - CONFLICT</text><text x="20" y="1055">            - VALIDATION_ERROR</text><text x="20" y="1075">            - RATE_LIMITED</text><text x="20" y="1095">            - FEATURE_NOT_SUPPORTED</text><text x="20" y="1115">            - SERVER_UNREACHABLE</text><text x="20" y="1135">            - TIMEOUT</text><text x="20" y="1155">            - OAUTH_REQUIRED</text><text x="20" y="1175">            - AUTH_REQUIRED</text><text x="20" y="1195">            - INTERNAL_ERROR</text><text x="20" y="1215">        message:</text><text x="20" y="1235">          type: string</text><text x="20" y="1255">          description: &gt;-</text><text x="20" y="1275">            Human-readable description. May change between releases — don&#x27;t</text><text x="20" y="1295">            match on it.</text><text x="20" y="1315">        details:</text><text x="20" y="1335">          type: object</text><text x="20" y="1355">          description: Optional, unstructured context bag.</text></g></svg>
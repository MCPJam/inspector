<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.37108302116394043s — page 10</text><text x="20" y="75">          description: &gt;-</text><text x="20" y="95">            In the public vocabulary (`toolCallOrder: any|in-order|exact`,</text><text x="20" y="115">            `extraToolCalls`, `arguments`). Absent when the case sets none —</text><text x="20" y="135">            omitted from the response rather than sent as `null`.</text><text x="20" y="155">        checks:</text><text x="20" y="175">          type: object</text><text x="20" y="195">          description: &gt;-</text><text x="20" y="215">            Absent when the case sets none — omitted from the response rather</text><text x="20" y="235">            than sent as `null`.</text><text x="20" y="255">          properties:</text><text x="20" y="275">            mode:</text><text x="20" y="295">              type: string</text><text x="20" y="315">              enum:</text><text x="20" y="335">                - inherit</text><text x="20" y="355">                - replace</text><text x="20" y="375">                - extend</text><text x="20" y="395">            list:</text><text x="20" y="415">              type: array</text><text x="20" y="435">              items:</text><text x="20" y="455">                $ref: &#x27;#/components/schemas/EvalAssertion&#x27;</text><text x="20" y="475">        import:</text><text x="20" y="495">          $ref: &#x27;#/components/schemas/EvalCaseImportClaim&#x27;</text><text x="20" y="515">        source:</text><text x="20" y="535">          $ref: &#x27;#/components/schemas/EvalCaseSource&#x27;</text><text x="20" y="555">        createdAt:</text><text x="20" y="575">          type:</text><text x="20" y="595">            - number</text><text
er message (`kind: prompt`).&#x27;</text><text x="20" y="1315">        serverName:</text><text x="20" y="1335">          type: string</text><text x="20" y="1355">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text></g></svg>
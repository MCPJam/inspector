<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 9</text><text x="20" y="75">          type: number</text><text x="20" y="95">          minimum: 0</text><text x="20" y="115">          maximum: 1</text><text x="20" y="135">          description: &gt;-</text><text x="20" y="155">            Fraction of this case&#x27;s trials that must pass, overriding the suite</text><text x="20" y="175">            default. Absent means the case inherits it. Never derived from the</text><text x="20" y="195">            suite&#x27;s `minimumAccuracy`, which is a PERCENT under a different</text><text x="20" y="215">            resolver.</text><text x="20" y="235">        isNegative:</text><text x="20" y="255">          type: boolean</text><text x="20" y="275">          description: When true, the case passes if NO tools are called.</text><text x="20" y="295">        scenario:</text><text x="20" y="315">          type: string</text><text x="20" y="335">        intent:</text><text x="20" y="355">          type: string</text><text x="20" y="375">          minLength: 1</text><text x="20" y="395">          maxLength: 64</text><text x="20" y="415">          pattern: ^\S(?:[\s\S]*\S)?$</text><text x="20" y="435">          description: &gt;-</text><text x="20" y="455">            Optional authored analytics grouping label. Must be already trimmed;</text><text x="20" y="475">            absent means unlabelled.</text><text x="20" y="495">        kind:</text><text x="20" y="515">          type: string</text><text x="20" y="535">          enum:</text><text x="20" y="555">            - capability</text><text x="20" y="575">            - regression</text><text x="20" y="595">          description: &gt;-</text><text x="20" y="615">            Authored case kind for the simple editor. Absent means the editor</text><text x="20" y="635">            derives it from matchOptions.</text><text x="20" y="655">        models:</text><text x="20" y="675">          type: array</text><text x="20" y="695">          items:</text><text x="20" y="715">            type: object</text><text x="20" y="735">            required:</text><text x="20" y="755">              - model</text><text x="20" y="775">            properties:</text><text x="20" y="795">              model:</text><text x="20" y="815">                type: string</text><text x="20" y="835">                readOnly: true</text><text x="20" y="855">                description: &gt;-</text><text x="20" y="875">                  COMPUTED in responses: the selection&#x27;s `modelId` when there is</text><text x="20" y="895">                  one, else the stored bare id. Accepted on writes as a</text><text x="20" y="915">                  shorthand: send a bare id and the platform converts it (a</text><text x="20" y="935">                  hosted id becomes a `hosted` selection, any other a</text><text x="20" y="955">                  `LegacyModelSelection`).</text><text x="20" y="975">              provider:</text><text x="20" y="995">                type: string</text><text x="20" y="1015">              selection:</text><text x="20" y="1035">                allOf:</text><text x="20" y="1055">                  - $ref: &#x27;#/components/schemas/RequestedModelSelection&#x27;</text><text x="20" y="1075">                description: &gt;-</text><text x="20" y="1095">                  The saved model choice behind `model` (source, connection,</text><text x="20" y="1115">                  `settings.reasoningEffort`). Absent when the case stores only</text><text x="20" y="1135">                  a bare model id. May be a STORED legacy selection</text><text x="20" y="1155">                  (`LegacyModelSelection`, `source: &quot;legacy&quot;`): own key only,</text><text x="20" y="1175">                  never MCPJam credits. The model id beside it is computed from</text><text x="20" y="1195">                  it.</text><text x="20" y="1215">              selectionOrigin:</text><text x="20" y="1235">                type: string</text><text x="20" y="1255">                enum:</text><text x="20" y="1275">                  - backfill</text><text x="20" y="1295">                description: &gt;-</text><text x="20" y="1315">                  `backfill` when a conversion (a save of a bare id, or the</text><text x="20" y="1335">                  old-data backfill) chose `selection` rather than a person.</text><text x="20" y="1355">                  Absent when a person chose it, and on rows with no selection.</text></g></svg>
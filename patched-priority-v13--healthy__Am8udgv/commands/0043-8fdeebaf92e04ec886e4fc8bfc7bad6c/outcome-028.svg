<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 28</text><text x="20" y="75">                - medium</text><text x="20" y="95">                - high</text><text x="20" y="115">                - xhigh</text><text x="20" y="135">                - max</text><text x="20" y="155">              description: &gt;-</text><text x="20" y="175">                Reasoning effort. An effort replaces the sampling temperature: a</text><text x="20" y="195">                `temperature` beside it is dropped or refused, depending on the</text><text x="20" y="215">                route.</text><text x="20" y="235">            temperature:</text><text x="20" y="255">              type: number</text><text x="20" y="275">              minimum: 0</text><text x="20" y="295">              maximum: 2</text><text x="20" y="315">        fallback:</text><text x="20" y="335">          type: object</text><text x="20" y="355">          required:</text><text x="20" y="375">            - provider</text><text x="20" y="395">            - model</text><text x="20" y="415">          additionalProperties: false</text><text x="20" y="435">          properties:</text><text x="20" y="455">            provider:</text><text x="20" y="475">              type: string</text><text x="20" y="495">              enum:</text><text x="20" y="515">                - none</text><text x="20" y="535">                - openrouter</text><text x="20" y="555">            model:</text><text x="20" y="575">              type: string</text><text x="20" y="595">              enum:</text><text x="20" y="615">                - none</text><text x="20" y="635">              description: &#x27;Always `none`: no surface substitutes a different model.&#x27;</text><text x="20" y="655">    LegacyModelSelection:</text><text x="20" y="675">      type: object</text><text x="20" y="695">      description: &gt;-</text><text x="20" y="715">        A STORED legacy selection: a model id with no saved source. Written when</text><text x="20" y="735">        a save sends a bare id the platform does not host (the shorthand), or by</text><text x="20" y="755">        the old-data backfill. It means OWN KEY ONLY: the call runs on the</text><text x="20" y="775">        organization&#x27;s connection for the model&#x27;s provider (or a key on the</text><text x="20" y="795">        caller&#x27;s machine) and never on MCPJam credits. It carries no settings;</text><text x="20" y="815">        to save an effort, send a full `ModelSelection`. A read may be sent back</text><text x="20" y="835">        verbatim.</text><text x="20" y="855">      required:</text><text x="20" y="875">        - source</text><text x="20" y="895">        - modelId</text><text x="20" y="915">      additionalProperties: false</text><text x="20" y="935">      properties:</text><text x="20" y="955">        source:</text><text x="20" y="975">          type: string</text><text x="20" y="995">          enum:</text><text x="20" y="1015">            - legacy</text><text x="20" y="1035">        modelId:</text><text x="20" y="1055">          type: string</text><text x="20" y="1075">          description: The id exactly as stored (it may be a bare, non-canonical id).</text><text x="20" y="1095">        provider:</text><text x="20" y="1115">          type: string</text><text x="20" y="1135">          description: &gt;-</text><text x="20" y="1155">            The case entry&#x27;s provider hint, kept so the stored `{ model,</text><text x="20" y="1175">            provider }` pair survives the round trip.</text><text x="20" y="1195">  responses:</text><text x="20" y="1215">    ValidationError:</text><text x="20" y="1235">      description: Malformed body or parameters.</text><text x="20" y="1255">      content:</text><text x="20" y="1275">        application/json:</text><text x="20" y="1295">          schema:</text><text x="20" y="1315">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1335">          example:</text><text x="20" y="1355">            code: VALIDATION_ERROR</text></g></svg>
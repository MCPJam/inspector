<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 8</text><text x="20" y="75">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="95">          type: array</text><text x="20" y="115">          items:</text><text x="20" y="135">            type: string</text><text x="20" y="155">      additionalProperties: false</text><text x="20" y="175">    EvalCase:</text><text x="20" y="195">      type: object</text><text x="20" y="215">      required:</text><text x="20" y="235">        - id</text><text x="20" y="255">        - title</text><text x="20" y="275">        - steps</text><text x="20" y="295">        - iterations</text><text x="20" y="315">        - isNegative</text><text x="20" y="335">        - models</text><text x="20" y="355">      description: &gt;-</text><text x="20" y="375">        A persisted eval case, in the public steps-first shape. Note this is NOT</text><text x="20" y="395">        `EvalTestCase`, which is the INLINE authoring shape accepted by suite</text><text x="20" y="415">        creation.</text><text x="20" y="435">      properties:</text><text x="20" y="455">        judge:</text><text x="20" y="475">          type: object</text><text x="20" y="495">          additionalProperties: false</text><text x="20" y="515">          properties:</text><text x="20" y="535">            enabled:</text><text x="20" y="555">              type: boolean</text><text x="20" y="575">          description: &gt;-</text><text x="20" y="595">            Per-case judge override. enabled: false skips goal-completion</text><text x="20" y="615">            grading for this case.</text><text x="20" y="635">        id:</text><text x="20" y="655">          type: string</text><text x="20" y="675">        declaredId:</text><text x="20" y="695">          type: string</text><text x="20" y="715">          description: &gt;-</text><text x="20" y="735">            The case&#x27;s effective declared id. Absent on cases authored before</text><text x="20" y="755">            declared identity existed.</text><text x="20" y="775">        title:</text><text x="20" y="795">          type: string</text><text x="20" y="815">        steps:</text><text x="20" y="835">          type: array</text><text x="20" y="855">          minItems: 1</text><text x="20" y="875">          items:</text><text x="20" y="895">            $ref: &#x27;#/components/schemas/EvalTestStep&#x27;</text><text x="20" y="915">          description: &gt;-</text><text x="20" y="935">            Ordered test steps. A `prompt` step is a model turn; a single</text><text x="20" y="955">            model-free `toolCall` step is a render-check; `assert` steps hold</text><text x="20" y="975">            the expectations.</text><text x="20" y="995">        expectedOutput:</text><text x="20" y="1015">          type: string</text><text x="20" y="1035">        iterations:</text><text x="20" y="1055">          type: integer</text><text x="20" y="1075">          minimum: 1</text><text x="20" y="1095">          maximum: 10</text><text x="20" y="1115">        repetitions:</text><text x="20" y="1135">          type: integer</text><text x="20" y="1155">          minimum: 1</text><text x="20" y="1175">          description: &gt;-</text><text x="20" y="1195">            Trials this case runs under per-case grading, overriding the suite</text><text x="20" y="1215">            default. Absent means the case inherits it. NOT a second spelling of</text><text x="20" y="1235">            `iterations`: that one is read as a FLOOR (`max(iterations,</text><text x="20" y="1255">            suite.minimumIterations)`) by a suite decided on suite-wide</text><text x="20" y="1275">            accuracy, and a per-case-graded case still reports it for</text><text x="20" y="1295">            compatibility. This one REPLACES the count rather than raising it —</text><text x="20" y="1315">            a case at 7 runs 7 times under a floor of 3 and 3 times under a</text><text x="20" y="1335">            default of 3.</text><text x="20" y="1355">        passThreshold:</text></g></svg>
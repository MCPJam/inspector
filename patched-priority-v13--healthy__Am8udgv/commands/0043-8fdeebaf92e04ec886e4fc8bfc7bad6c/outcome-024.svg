<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 24</text><text x="20" y="75">              const: toolErrorNamesInput</text><text x="20" y="95">            toolName:</text><text x="20" y="115">              type: string</text><text x="20" y="135">              minLength: 1</text><text x="20" y="155">            role:</text><text x="20" y="175">              type: string</text><text x="20" y="195">              enum:</text><text x="20" y="215">                - gating</text><text x="20" y="235">                - advisory</text><text x="20" y="255">                - required</text><text x="20" y="275">            severity:</text><text x="20" y="295">              type: string</text><text x="20" y="315">              const: warn</text><text x="20" y="335">          required:</text><text x="20" y="355">            - type</text><text x="20" y="375">        - type: object</text><text x="20" y="395">          properties:</text><text x="20" y="415">            type:</text><text x="20" y="435">              type: string</text><text x="20" y="455">              const: fullPageHasContinuation</text><text x="20" y="475">            toolName:</text><text x="20" y="495">              type: string</text><text x="20" y="515">              minLength: 1</text><text x="20" y="535">            role:</text><text x="20" y="555">              type: string</text><text x="20" y="575">              enum:</text><text x="20" y="595">                - gating</text><text x="20" y="615">                - advisory</text><text x="20" y="635">                - required</text><text x="20" y="655">            severity:</text><text x="20" y="675">              type: string</text><text x="20" y="695">              const: warn</text><text x="20" y="715">          required:</text><text x="20" y="735">            - type</text><text x="20" y="755">      description: &gt;-</text><text x="20" y="775">        An SDK assertion reported through UVC. Discovery assertions require</text><text x="20" y="795">        complete raw tool declarations; missing evidence is an evaluator error.</text><text x="20" y="815">        Observation kinds, including noDeprecatedToolExposed, require role</text><text x="20" y="835">        advisory. Structural schema; runtime also validates policy and unique</text><text x="20" y="855">        required annotation keys.</text><text x="20" y="875">    EvalCaseImportClaim:</text><text x="20" y="895">      type: object</text><text x="20" y="915">      description: &gt;-</text><text x="20" y="935">        What a converter CLAIMED about one imported case. `exact` is</text><text x="20" y="955">        CONVERTER-CLAIMED exact — the converter says it applied a structural</text><text x="20" y="975">        mapping rule, cited in `note`. MCPJam has NOT verified semantic</text><text x="20" y="995">        equivalence, so user-facing copy must say &quot;claimed exact&quot;, never</text><text x="20" y="1015">        &quot;verified&quot; or &quot;accepted&quot;. Claim-only: who approved an approximation,</text><text x="20" y="1035">        when, and why is a PER-RUN decision frozen on the run</text><text x="20" y="1055">        (`ImportEligibility.approvedApproximationReceipts`), never stored on the</text><text x="20" y="1075">        case — an approval that lived on a case would outlive the run it was</text><text x="20" y="1095">        granted for and the edit that invalidated it. Approval and internal keys</text><text x="20" y="1115">        are rejected with 400, never stripped.</text><text x="20" y="1135">      required:</text><text x="20" y="1155">        - status</text><text x="20" y="1175">      additionalProperties: false</text><text x="20" y="1195">      properties:</text><text x="20" y="1215">        status:</text><text x="20" y="1235">          type: string</text><text x="20" y="1255">          enum:</text><text x="20" y="1275">            - exact</text><text x="20" y="1295">            - approximated</text><text x="20" y="1315">            - unsupported</text><text x="20" y="1335">            - unresolved</text><text x="20" y="1355">          description: &gt;-</text></g></svg>
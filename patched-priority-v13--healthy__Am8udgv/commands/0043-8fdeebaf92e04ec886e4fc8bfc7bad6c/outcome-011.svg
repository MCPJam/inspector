<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 11</text><text x="20" y="75">          type: string</text><text x="20" y="95">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="115">        toolName:</text><text x="20" y="135">          type: string</text><text x="20" y="155">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="175">        arguments:</text><text x="20" y="195">          type: object</text><text x="20" y="215">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="235">          additionalProperties: true</text><text x="20" y="255">        action:</text><text x="20" y="275">          type: object</text><text x="20" y="295">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="315">          additionalProperties: true</text><text x="20" y="335">        assertion:</text><text x="20" y="355">          type: object</text><text x="20" y="375">          description: &gt;-</text><text x="20" y="395">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="415">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="435">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="455">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="475">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="495">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="515">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="535">            replayability only one half of it has.</text><text x="20" y="555">          additionalProperties: true</text><text x="20" y="575">      additionalProperties: true</text><text x="20" y="595">    RequestedModelSelection:</text><text x="20" y="615">      description: &gt;-</text><text x="20" y="635">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="655">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="675">        organization connection, `local` on a key on the caller&#x27;s machine) or a</text><text x="20" y="695">        STORED `LegacyModelSelection` (own key only). Wherever one sits beside a</text><text x="20" y="715">        model id (`modelId`, `model`), that id is COMPUTED from it on reads, and</text><text x="20" y="735">        accepted on writes as a shorthand the platform converts. A row with</text><text x="20" y="755">        neither is an unlabelled old row and runs exactly as it always has.</text><text x="20" y="775">      oneOf:</text><text x="20" y="795">        - $ref: &#x27;#/components/schemas/ModelSelection&#x27;</text><text x="20" y="815">        - $ref: &#x27;#/components/schemas/LegacyModelSelection&#x27;</text><text x="20" y="835">    EvalAssertion:</text><text x="20" y="855">      oneOf:</text><text x="20" y="875">        - type: object</text><text x="20" y="895">          properties:</text><text x="20" y="915">            type:</text><text x="20" y="935">              type: string</text><text x="20" y="955">              const: toolDescriptionsPresent</text><text x="20" y="975">            minLength:</text><text x="20" y="995">              type: integer</text><text x="20" y="1015">              exclusiveMinimum: 0</text><text x="20" y="1035">              maximum: 9007199254740991</text><text x="20" y="1055">            role:</text><text x="20" y="1075">              type: string</text><text x="20" y="1095">              enum:</text><text x="20" y="1115">                - gating</text><text x="20" y="1135">                - advisory</text><text x="20" y="1155">                - required</text><text x="20" y="1175">            severity:</text><text x="20" y="1195">              type: string</text><text x="20" y="1215">              const: warn</text><text x="20" y="1235">          required:</text><text x="20" y="1255">            - type</text><text x="20" y="1275">        - type: object</text><text x="20" y="1295">          properties:</text><text x="20" y="1315">            type:</text><text x="20" y="1335">              type: string</text><text x="20" y="1355">              const: toolAnnotationsPresent</text></g></svg>
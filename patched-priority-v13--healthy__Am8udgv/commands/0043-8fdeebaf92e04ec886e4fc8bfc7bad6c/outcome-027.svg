<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 27</text><text x="20" y="75">          additionalProperties: true</text><text x="20" y="95">    ModelSelection:</text><text x="20" y="115">      type: object</text><text x="20" y="135">      description: &gt;-</text><text x="20" y="155">        A saved model choice. Never carries a secret: an unknown key is refused.</text><text x="20" y="175">        `settings.reasoningEffort` is where a reasoning effort is saved — there</text><text x="20" y="195">        is no other saved carrier (`advancedConfig.reasoningEffort` is refused).</text><text x="20" y="215">        Which efforts a model accepts is `supportedReasoningEfforts` on `GET</text><text x="20" y="235">        /v1/models`; a saved effort the route the run takes cannot apply is</text><text x="20" y="255">        refused (`capability_missing`), never dropped.</text><text x="20" y="275">      required:</text><text x="20" y="295">        - modelId</text><text x="20" y="315">        - source</text><text x="20" y="335">        - fallback</text><text x="20" y="355">      additionalProperties: false</text><text x="20" y="375">      properties:</text><text x="20" y="395">        modelId:</text><text x="20" y="415">          type: string</text><text x="20" y="435">          description: Canonical `provider/model` id.</text><text x="20" y="455">        source:</text><text x="20" y="475">          type: string</text><text x="20" y="495">          enum:</text><text x="20" y="515">            - hosted</text><text x="20" y="535">            - org</text><text x="20" y="555">            - local</text><text x="20" y="575">          description: Whose credentials pay for and serve the call.</text><text x="20" y="595">        connectionRef:</text><text x="20" y="615">          type: object</text><text x="20" y="635">          description: &gt;-</text><text x="20" y="655">            Required for `org` (`kind: orgProvider`) and `local` (`kind:</text><text x="20" y="675">            localProvider`), absent for `hosted`.</text><text x="20" y="695">          required:</text><text x="20" y="715">            - kind</text><text x="20" y="735">          additionalProperties: false</text><text x="20" y="755">          properties:</text><text x="20" y="775">            kind:</text><text x="20" y="795">              type: string</text><text x="20" y="815">              enum:</text><text x="20" y="835">                - orgProvider</text><text x="20" y="855">                - localProvider</text><text x="20" y="875">            id:</text><text x="20" y="895">              type: string</text><text x="20" y="915">              description: The organization model provider row (`orgProvider`).</text><text x="20" y="935">            providerKey:</text><text x="20" y="955">              type: string</text><text x="20" y="975">              description: &gt;-</text><text x="20" y="995">                The provider configured on the user&#x27;s own machine</text><text x="20" y="1015">                (`localProvider`).</text><text x="20" y="1035">            customProviderName:</text><text x="20" y="1055">              type: string</text><text x="20" y="1075">        nativeModelId:</text><text x="20" y="1095">          type: string</text><text x="20" y="1115">          description: &gt;-</text><text x="20" y="1135">            Deployment or native id where it is not derivable from `modelId`</text><text x="20" y="1155">            (Azure deployment name, Bedrock inference profile, custom provider).</text><text x="20" y="1175">        settings:</text><text x="20" y="1195">          type: object</text><text x="20" y="1215">          additionalProperties: false</text><text x="20" y="1235">          properties:</text><text x="20" y="1255">            reasoningEffort:</text><text x="20" y="1275">              type: string</text><text x="20" y="1295">              enum:</text><text x="20" y="1315">                - none</text><text x="20" y="1335">                - minimal</text><text x="20" y="1355">                - low</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 29</text><text x="20" y="75">            message: Invalid JSON body</text><text x="20" y="95">    Unauthorized:</text><text x="20" y="115">      description: &gt;-</text><text x="20" y="135">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="155">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="175">        a property of the server, not your key.</text><text x="20" y="195">      content:</text><text x="20" y="215">        application/json:</text><text x="20" y="235">          schema:</text><text x="20" y="255">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="275">          examples:</text><text x="20" y="295">            badKey:</text><text x="20" y="315">              summary: Invalid or revoked key</text><text x="20" y="335">              value:</text><text x="20" y="355">                code: UNAUTHORIZED</text><text x="20" y="375">                message: Invalid API key</text><text x="20" y="395">            oauthRequired:</text><text x="20" y="415">              summary: Target server needs an OAuth grant</text><text x="20" y="435">              value:</text><text x="20" y="455">                code: OAUTH_REQUIRED</text><text x="20" y="475">                message: Server requires OAuth authorization</text><text x="20" y="495">    Forbidden:</text><text x="20" y="515">      description: Key is valid but not allowed to do this.</text><text x="20" y="535">      content:</text><text x="20" y="555">        application/json:</text><text x="20" y="575">          schema:</text><text x="20" y="595">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="615">          example:</text><text x="20" y="635">            code: FORBIDDEN</text><text x="20" y="655">            message: You do not have access to this project</text><text x="20" y="675">    NotFound:</text><text x="20" y="695">      description: Unknown project, server, or resource.</text><text x="20" y="715">      content:</text><text x="20" y="735">        application/json:</text><text x="20" y="755">          schema:</text><text x="20" y="775">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="795">          example:</text><text x="20" y="815">            code: NOT_FOUND</text><text x="20" y="835">            message: Server not found</text><text x="20" y="855">    Conflict:</text><text x="20" y="875">      description: &gt;-</text><text x="20" y="895">        The resource is not in a state that accepts this write — a stale</text><text x="20" y="915">        `expectedRevision`, a duplicate name, or an environment that cannot</text><text x="20" y="935">        currently be launched. The request was well-formed; re-read the resource</text><text x="20" y="955">        and retry.</text><text x="20" y="975">      content:</text><text x="20" y="995">        application/json:</text><text x="20" y="1015">          schema:</text><text x="20" y="1035">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1055">          example:</text><text x="20" y="1075">            code: CONFLICT</text><text x="20" y="1095">            message: &gt;-</text><text x="20" y="1115">              Environment changed since you loaded it (expected revision 3,</text><text x="20" y="1135">              current 5). Reload and retry.</text><text x="20" y="1155">    RateLimited:</text><text x="20" y="1175">      description: &gt;-</text><text x="20" y="1195">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="1215">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="1235">      headers:</text><text x="20" y="1255">        Retry-After:</text><text x="20" y="1275">          description: Seconds to wait before retrying.</text><text x="20" y="1295">          schema:</text><text x="20" y="1315">            type: integer</text><text x="20" y="1335">      content:</text><text x="20" y="1355">        application/json:</text></g></svg>
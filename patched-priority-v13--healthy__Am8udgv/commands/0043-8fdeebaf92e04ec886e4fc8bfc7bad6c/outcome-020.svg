<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 20</text><text x="20" y="75">            toolNeverCalled for that). Patterns are re2js regular expressions</text><text x="20" y="95">            (no lookaround, no backreferences) matched against the canonical</text><text x="20" y="115">            JSON of the arguments (sorted keys, no whitespace), or only the</text><text x="20" y="135">            argument at path when set (a string value as-is, anything else as</text><text x="20" y="155">            canonical JSON). A call whose subject exceeds 100000 characters is</text><text x="20" y="175">            unreadable, and a verdict it could decide is unscored.</text><text x="20" y="195">          properties:</text><text x="20" y="215">            type:</text><text x="20" y="235">              type: string</text><text x="20" y="255">              const: toolInputMatches</text><text x="20" y="275">            toolName:</text><text x="20" y="295">              type: string</text><text x="20" y="315">              minLength: 1</text><text x="20" y="335">            patterns:</text><text x="20" y="355">              description: &gt;-</text><text x="20" y="375">                Every pattern must match the same call. Use alternation (A|B)</text><text x="20" y="395">                inside one pattern for either.</text><text x="20" y="415">              minItems: 1</text><text x="20" y="435">              maxItems: 8</text><text x="20" y="455">              type: array</text><text x="20" y="475">              items:</text><text x="20" y="495">                type: string</text><text x="20" y="515">                minLength: 1</text><text x="20" y="535">                maxLength: 512</text><text x="20" y="555">            flags:</text><text x="20" y="575">              description: &gt;-</text><text x="20" y="595">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="615">                matches newline).</text><text x="20" y="635">              type: string</text><text x="20" y="655">              enum:</text><text x="20" y="675">                - i</text><text x="20" y="695">                - m</text><text x="20" y="715">                - s</text><text x="20" y="735">                - im</text><text x="20" y="755">                - is</text><text x="20" y="775">                - ms</text><text x="20" y="795">                - ims</text><text x="20" y="815">            path:</text><text x="20" y="835">              description: &gt;-</text><text x="20" y="855">                JSON Pointer (RFC 6901) to ONE top-level argument key, such as</text><text x="20" y="875">                /elements; inside the key, ~1 stands for / and ~0 for ~. Omit to</text><text x="20" y="895">                match the whole arguments object. A call without the key does</text><text x="20" y="915">                not match.</text><text x="20" y="935">              type: string</text><text x="20" y="955">              minLength: 2</text><text x="20" y="975">              maxLength: 257</text><text x="20" y="995">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="1015">            min:</text><text x="20" y="1035">              description: &gt;-</text><text x="20" y="1055">                Minimum number of MATCHING calls (default 1). min 0 requires</text><text x="20" y="1075">                max.</text><text x="20" y="1095">              type: integer</text><text x="20" y="1115">              minimum: 0</text><text x="20" y="1135">              maximum: 9007199254740991</text><text x="20" y="1155">            max:</text><text x="20" y="1175">              description: &gt;-</text><text x="20" y="1195">                Maximum number of MATCHING calls; at least min (or 1 when min is</text><text x="20" y="1215">                omitted).</text><text x="20" y="1235">              type: integer</text><text x="20" y="1255">              minimum: 0</text><text x="20" y="1275">              maximum: 9007199254740991</text><text x="20" y="1295">            role:</text><text x="20" y="1315">              type: string</text><text x="20" y="1335">              enum:</text><text x="20" y="1355">                - gating</text></g></svg>
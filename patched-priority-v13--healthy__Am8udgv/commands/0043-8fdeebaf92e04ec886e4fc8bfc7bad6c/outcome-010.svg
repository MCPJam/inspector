<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8fdeebaf92e04ec886e4fc8bfc7bad6c — page 10</text><text x="20" y="75">        matchOptions:</text><text x="20" y="95">          type: object</text><text x="20" y="115">          description: &gt;-</text><text x="20" y="135">            In the public vocabulary (`toolCallOrder: any|in-order|exact`,</text><text x="20" y="155">            `extraToolCalls`, `arguments`). Absent when the case sets none —</text><text x="20" y="175">            omitted from the response rather than sent as `null`.</text><text x="20" y="195">        checks:</text><text x="20" y="215">          type: object</text><text x="20" y="235">          description: &gt;-</text><text x="20" y="255">            Absent when the case sets none — omitted from the response rather</text><text x="20" y="275">            than sent as `null`.</text><text x="20" y="295">          properties:</text><text x="20" y="315">            mode:</text><text x="20" y="335">              type: string</text><text x="20" y="355">              enum:</text><text x="20" y="375">                - inherit</text><text x="20" y="395">                - replace</text><text x="20" y="415">                - extend</text><text x="20" y="435">            list:</text><text x="20" y="455">              type: array</text><text x="20" y="475">              items:</text><text x="20" y="495">                $ref: &#x27;#/components/schemas/EvalAssertion&#x27;</text><text x="20" y="515">        import:</text><text x="20" y="535">          $ref: &#x27;#/components/schemas/EvalCaseImportClaim&#x27;</text><text x="20" y="555">        source:</text><text x="20" y="575">          $ref: &#x27;#/components/schemas/EvalCaseSource&#x27;</text><text x="20" y="595">        createdAt:</text><text x="20" y="615">          type:</text><text x="20" y="635">            - number</text><text x="20" y="655">            - &#x27;null&#x27;</text><text x="20" y="675">        updatedAt:</text><text x="20" y="695">          type:</text><text x="20" y="715">            - number</text><text x="20" y="735">            - &#x27;null&#x27;</text><text x="20" y="755">        suppressedSuiteStandardCheckIds:</text><text x="20" y="775">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="795">          type: array</text><text x="20" y="815">          items:</text><text x="20" y="835">            type: string</text><text x="20" y="855">    EvalTestStep:</text><text x="20" y="875">      type: object</text><text x="20" y="895">      description: &gt;-</text><text x="20" y="915">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="935">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="955">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="975">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="995">        a DOM `WidgetAssertion`).</text><text x="20" y="1015">      required:</text><text x="20" y="1035">        - id</text><text x="20" y="1055">        - kind</text><text x="20" y="1075">      properties:</text><text x="20" y="1095">        id:</text><text x="20" y="1115">          type: string</text><text x="20" y="1135">          minLength: 1</text><text x="20" y="1155">        kind:</text><text x="20" y="1175">          type: string</text><text x="20" y="1195">          enum:</text><text x="20" y="1215">            - prompt</text><text x="20" y="1235">            - toolCall</text><text x="20" y="1255">            - interact</text><text x="20" y="1275">            - assert</text><text x="20" y="1295">        prompt:</text><text x="20" y="1315">          type: string</text><text x="20" y="1335">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="1355">        serverName:</text></g></svg>
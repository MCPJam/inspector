<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">30734a8a77454c41bc4c648ba997fc2b — page 2</text><text x="20" y="75">    ],</text><text x="20" y="95">    &quot;project&quot;: {</text><text x="20" y="115">      &quot;id&quot;: &quot;project_fixture&quot;,</text><text x="20" y="135">      &quot;name&quot;: &quot;Fixture&quot;,</text><text x="20" y="155">      &quot;sensitive_value&quot;: &quot;[REDACTED]&quot;</text><text x="20" y="175">    },</text><text x="20" y="195">    &quot;suite&quot;: {</text><text x="20" y="215">      &quot;id&quot;: &quot;suite_authored_1&quot;,</text><text x="20" y="235">      &quot;name&quot;: &quot;Arithmetic smoke&quot;</text><text x="20" y="255">    }</text><text x="20" y="275">  },</text><text x="20" y="295">  &quot;decisionSummary&quot;: {</text><text x="20" y="315">    &quot;schemaVersion&quot;: 1,</text><text x="20" y="335">    &quot;runId&quot;: &quot;run_fixture_1&quot;,</text><text x="20" y="355">    &quot;runStatus&quot;: &quot;completed&quot;,</text><text x="20" y="375">    &quot;diagnostics&quot;: {</text><text x="20" y="395">      &quot;items&quot;: [],</text><text x="20" y="415">      &quot;complete&quot;: true,</text><text x="20" y="435">      &quot;scannedIterations&quot;: 1</text><text x="20" y="455">    },</text><text x="20" y="475">    &quot;verdict&quot;: &quot;passed&quot;,</text><text x="20" y="495">    &quot;verdictSource&quot;: &quot;legacy&quot;,</text><text x="20" y="515">    &quot;counts&quot;: {</text><text x="20" y="535">      &quot;measurementUnit&quot;: &quot;trial&quot;,</text><text x="20" y="555">      &quot;total&quot;: 1,</text><text x="20" y="575">      &quot;passed&quot;: 1,</text><text x="20" y="595">      &quot;failed&quot;: 0</text><text x="20" y="615">    }</text><text x="20" y="635">  }</text><text x="20" y="655">}</text><text x="20" y="675">Usage: mcpjam cloud eval iterations [options]</text><text x="20" y="695"></text><text x="20" y="715">List per-iteration results for an eval run (pass/fail, tool calls, tokens,</text><text x="20" y="735">latency)</text><text x="20" y="755"></text><text x="20" y="775">Options:</text><text x="20" y="795">  --run &lt;id&gt;              Eval run ID (from `eval run`)</text><text x="20" y="815">  --project &lt;id-or-name&gt;  Project name or ID (defaults to the most recently</text><text x="20" y="835">                          updated project)</text><text x="20" y="855">  --cursor &lt;cursor&gt;       Pagination cursor from a previous response</text><text x="20" y="875">  --limit &lt;n&gt;             Max iterations per page (1–200)</text><text x="20" y="895">  -h, --help              display help for command</text><text x="20" y="915">Usage: mcpjam cloud eval gate [options] [command]</text><text x="20" y="935"></text><text x="20" y="955">Apply a pass/fail policy to a finished eval run and set an exit code (0 pass or</text><text x="20" y="975">waived, 1 eval failure, 2 usage, 3 incomplete)</text><text x="20" y="995"></text><text x="20" y="1015">Options:</text><text x="20" y="1035">  --run &lt;id&gt;                                 Eval run ID (from `eval run`)</text><text x="20" y="1055">  --project &lt;id-or-name&gt;                     Project name or ID (defaults to the most recently updated project)</text><text x="20" y="1075">  --min-pass-rate-percent &lt;0-100&gt;            Minimum share of iterations that must pass, as a percentage</text><text x="20" y="1095">  --no-gating-score-errors                   Fail if any required scorer errored during the run</text><text x="20" y="1115">  --min-scorer-pass-rate &lt;scorerId=percent&gt;  Minimum pass rate for one scorer (repeatable) (default: [])</text><text x="20" y="1135">  --min-mean-score &lt;scorerId=0..1&gt;           Minimum mean score for one scorer (repeatable) (default: [])</text><text x="20" y="1155">  --baseline &lt;runId&gt;                         Baseline run ID to gate a regression delta against; mutually exclusive with --baselin</text><text x="20" y="1175">e-sha</text><text x="20" y="1195">  --baseline-sha &lt;sha&gt;                       Baseline source commit SHA, resolved to the completed run in this suite recorded agai</text><text x="20" y="1215">nst it; mutually exclusive with --baseline</text><text x="20" y="1235">  --min-sample-size &lt;n&gt;                      Iterations required on EACH side before a pass-rate regression is decidable (default </text><text x="20" y="1255">5); requires --baseline or --baseline-sha</text><text x="20" y="1275">  --min-effect-size-percent &lt;0-100&gt;          Smallest pass-rate drop worth failing on, as a percentage (default 1); requires --bas</text><text x="20" y="1295">eline or --baseline-sha</text><text x="20" y="1315">  --gate-deterministic-regressions           Fail if a deterministic required scorer flipped from passed to failed; requires --bas</text><text x="20" y="1335">eline or --baseline-sha</text><text x="20" y="1355">  --max-p95-latency-increase-ms &lt;ms&gt;         Fail if p95 end-to-end latency rose by more than this many milliseconds vs the baseli</text></g></svg>
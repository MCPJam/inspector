"20" y="635">      &quot;total&quot;: 1,</text><text x="20" y="655">      &quot;passed&quot;: 1,</text><text x="20" y="675">      &quot;failed&quot;: 0</text><text x="20" y="695">    }</text><text x="20" y="715">  }</text><text x="20" y="735">}</text><text x="20" y="755">Usage: mcpjam cloud eval iterations [options]</text><text x="20" y="775"></text><text x="20" y="795">List per-iteration results for an eval run (pass/fail, tool calls, tokens,</text><text x="20" y="815">latency)</text><text x="20" y="835"></text><text x="20" y="855">Options:</text><text x="20" y="875">  --run &lt;id&gt;              Eval run ID (from `eval run`)</text><text x="20" y="895">  --project &lt;id-or-name&gt;  Project name or ID (defaults to the most recently</text><text x="20" y="915">                          updated project)</text><text x="20" y="935">  --cursor &lt;cursor&gt;       Pagination cursor from a previous response</text><text x="20" y="955">  --limit &lt;n&gt;             Max iterations per page (1–200)</text><text x="20" y="975">  -h, --help              display help for command</text><text x="20" y="995">Usage: mcpjam cloud eval gate [options] [command]</text><text x="20" y="1015"></text><text x="20" y="1035">Apply a pass/fail policy to a finished eval run and set an exit code (0 pass or</text><text x="20" y="1055">waived, 1 eval failure, 2 usage, 3 incomplete)</text><text x="20" y="1075"></text><text x="20" y="1095">Options:</text><text x="20" y="1115">  --run &lt;id&gt;                                 Eval run ID (from `eval run`)</text><text x="20" y="1135">  --project &lt;id-or-name&gt;                     Project name or ID (defaults to the most recently updated project)</text><text x="20" y="1155">  --min-pass-rate-percent &lt;0-100&gt;            Minimum share of iterations that must pass, as a percentage</text><text x="20" y="1175">  --no-gating-score-errors                   Fail if any required scorer errored during the run</text><text x="20" y="1195">  --min-scorer-pass-rate &lt;scorerId=percent&gt;  Minimum pass rate for one scorer (repeatable) (default: [])</text><text x="20" y="1215">  --min-mean-score &lt;scorerId=0..1&gt;           Minimum mean score for one scorer (repeatable) (default: [])</text><text x="20" y="1235">  --baseline &lt;runId&gt;                         Baseline run ID to gate a regression delta against; mutually exclusive with --baselin</text><text x="20" y="1255">e-sha</text><text x="20" y="1275">  --baseline-sha &lt;sha&gt;                       Baseline source commit SHA, resolved to the completed run in this suite recorded agai</text><text x="20" y="1295">nst it; mutually exclusive with --baseline</text><text x="20" y="1315">  --min-sample-size &lt;n&gt;                      Iterations required on EACH side before a pass-rate regression is decidable (default </text><text x="20" y="1335">5); requires --baseline or --baseline-sha</text><text x="20" y="1355">  --min-effect-size-percent &lt;0-100&gt;          Smallest pass-rate drop worth failing on, as a percentage (default 1); requires --bas</text></g></svg>
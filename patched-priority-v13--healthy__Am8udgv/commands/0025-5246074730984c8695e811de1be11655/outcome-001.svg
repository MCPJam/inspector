<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">5246074730984c8695e811de1be11655 — page 1</text><text x="20" y="75">$ /bin/bash -c sed -n &#x27;1314,1365p&#x27; case-api-doc.md &amp;&amp; sed -n &#x27;1130,1200p&#x27; case-api-doc.md &amp;&amp; sed -n &#x27;790,840p&#x27; case-api-doc.md</text><text x="20" y="95">            the value at that key in structuredContent (in the JSON output part</text><text x="20" y="115">            when there is no structuredContent). isError results are included. A</text><text x="20" y="135">            result whose text was truncated for storage (when path is omitted),</text><text x="20" y="155">            or whose subject exceeds 100000 characters, is unreadable; so are</text><text x="20" y="175">            results an incomplete capture did not record. A verdict they could</text><text x="20" y="195">            decide is unscored.</text><text x="20" y="215">          properties:</text><text x="20" y="235">            type:</text><text x="20" y="255">              type: string</text><text x="20" y="275">              const: toolResultMatches</text><text x="20" y="295">            toolName:</text><text x="20" y="315">              description: Omit to read every tool&#x27;s results.</text><text x="20" y="335">              type: string</text><text x="20" y="355">              minLength: 1</text><text x="20" y="375">            patterns:</text><text x="20" y="395">              description: &gt;-</text><text x="20" y="415">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="435">                inside one pattern for either.</text><text x="20" y="455">              minItems: 1</text><text x="20" y="475">              maxItems: 8</text><text x="20" y="495">              type: array</text><text x="20" y="515">              items:</text><text x="20" y="535">                type: string</text><text x="20" y="555">                minLength: 1</text><text x="20" y="575">                maxLength: 512</text><text x="20" y="595">            flags:</text><text x="20" y="615">              description: &gt;-</text><text x="20" y="635">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="655">                matches newline).</text><text x="20" y="675">              type: string</text><text x="20" y="695">              enum:</text><text x="20" y="715">                - i</text><text x="20" y="735">                - m</text><text x="20" y="755">                - s</text><text x="20" y="775">                - im</text><text x="20" y="795">                - is</text><text x="20" y="815">                - ms</text><text x="20" y="835">                - ims</text><text x="20" y="855">            path:</text><text x="20" y="875">              description: &gt;-</text><text x="20" y="895">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="915">                structuredContent (of the JSON output part when there is no</text><text x="20" y="935">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="955">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="975">                without the key does not match.</text><text x="20" y="995">              type: string</text><text x="20" y="1015">              minLength: 2</text><text x="20" y="1035">              maxLength: 257</text><text x="20" y="1055">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="1075">            min:</text><text x="20" y="1095">              description: &gt;-</text><text x="20" y="1115">                Minimum number of MATCHING results (default 1). min 0 requires</text><text x="20" y="1135">            severity:</text><text x="20" y="1155">              type: string</text><text x="20" y="1175">              const: warn</text><text x="20" y="1195">          required:</text><text x="20" y="1215">            - type</text><text x="20" y="1235">            - ms</text><text x="20" y="1255">        - type: object</text><text x="20" y="1275">          properties:</text><text x="20" y="1295">            type:</text><text x="20" y="1315">              type: string</text><text x="20" y="1335">              const: toolResultContains</text><text x="20" y="1355">            needle:</text></g></svg>
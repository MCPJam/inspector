<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 21</text><text x="20" y="75">            severity:</text><text x="20" y="95">              type: string</text><text x="20" y="115">              const: warn</text><text x="20" y="135">          required:</text><text x="20" y="155">            - type</text><text x="20" y="175">            - toolName</text><text x="20" y="195">            - patterns</text><text x="20" y="215">        - type: object</text><text x="20" y="235">          description: &gt;-</text><text x="20" y="255">            A tool result in scope (every result, or only toolName&#x27;s) whose</text><text x="20" y="275">            content matches EVERY pattern (all within one result) occurred at</text><text x="20" y="295">            least min (default 1) and at most max times. min and max count</text><text x="20" y="315">            MATCHING results, not all results: min 0, max 0 means no result</text><text x="20" y="335">            matches. The content is the result&#x27;s text, then structuredContent,</text><text x="20" y="355">            then its JSON output part (JSON as canonical JSON), or, with path,</text><text x="20" y="375">            the value at that key in structuredContent (in the JSON output part</text><text x="20" y="395">            when there is no structuredContent). isError results are included. A</text><text x="20" y="415">            result whose text was truncated for storage (when path is omitted),</text><text x="20" y="435">            or whose subject exceeds 100000 characters, is unreadable; so are</text><text x="20" y="455">            results an incomplete capture did not record. A verdict they could</text><text x="20" y="475">            decide is unscored.</text><text x="20" y="495">          properties:</text><text x="20" y="515">            type:</text><text x="20" y="535">              type: string</text><text x="20" y="555">              const: toolResultMatches</text><text x="20" y="575">            toolName:</text><text x="20" y="595">              description: Omit to read every tool&#x27;s results.</text><text x="20" y="615">              type: string</text><text x="20" y="635">              minLength: 1</text><text x="20" y="655">            patterns:</text><text x="20" y="675">              description: &gt;-</text><text x="20" y="695">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="715">                inside one pattern for either.</text><text x="20" y="735">              minItems: 1</text><text x="20" y="755">              maxItems: 8</text><text x="20" y="775">              type: array</text><text x="20" y="795">              items:</text><text x="20" y="815">                type: string</text><text x="20" y="835">                minLength: 1</text><text x="20" y="855">                maxLength: 512</text><text x="20" y="875">            flags:</text><text x="20" y="895">              description: &gt;-</text><text x="20" y="915">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="935">                matches newline).</text><text x="20" y="955">              type: string</text><text x="20" y="975">              enum:</text><text x="20" y="995">                - i</text><text x="20" y="1015">                - m</text><text x="20" y="1035">                - s</text><text x="20" y="1055">                - im</text><text x="20" y="1075">                - is</text><text x="20" y="1095">                - ms</text><text x="20" y="1115">                - ims</text><text x="20" y="1135">            path:</text><text x="20" y="1155">              description: &gt;-</text><text x="20" y="1175">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="1195">                structuredContent (of the JSON output part when there is no</text><text x="20" y="1215">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="1235">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="1255">                without the key does not match.</text><text x="20" y="1275">              type: string</text><text x="20" y="1295">              minLength: 2</text><text x="20" y="1315">              maxLength: 257</text><text x="20" y="1335">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="1355">            min:</text></g></svg>
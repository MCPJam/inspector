<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 11</text><text x="20" y="75">              steps:</text><text x="20" y="95">                - id: s1</text><text x="20" y="115">                  kind: prompt</text><text x="20" y="135">                  prompt: List the files in the project root.</text><text x="20" y="155">                - id: s2</text><text x="20" y="175">                  kind: assert</text><text x="20" y="195">                  assertion:</text><text x="20" y="215">                    type: toolCalledWith</text><text x="20" y="235">                    toolName: list_files</text><text x="20" y="255">                    args:</text><text x="20" y="275">                      args: {}</text><text x="20" y="295">      responses:</text><text x="20" y="315">        &#x27;201&#x27;:</text><text x="20" y="335">          description: The created case.</text><text x="20" y="355">          content:</text><text x="20" y="375">            application/json:</text><text x="20" y="395">              schema:</text><text x="20" y="415">                $ref: &#x27;#/components/schemas/EvalCase&#x27;</text><text x="20" y="435">        &#x27;400&#x27;:</text><text x="20" y="455">          $ref: &#x27;#/components/responses/ValidationError&#x27;</text><text x="20" y="475">        &#x27;401&#x27;:</text><text x="20" y="495">          $ref: &#x27;#/components/responses/Unauthorized&#x27;</text><text x="20" y="515">        &#x27;403&#x27;:</text><text x="20" y="535">          $ref: &#x27;#/components/responses/Forbidden&#x27;</text><text x="20" y="555">        &#x27;404&#x27;:</text><text x="20" y="575">          $ref: &#x27;#/components/responses/NotFound&#x27;</text><text x="20" y="595">        &#x27;409&#x27;:</text><text x="20" y="615">          $ref: &#x27;#/components/responses/Conflict&#x27;</text><text x="20" y="635">        &#x27;429&#x27;:</text><text x="20" y="655">          $ref: &#x27;#/components/responses/RateLimited&#x27;</text><text x="20" y="675">        &#x27;500&#x27;:</text><text x="20" y="695">          $ref: &#x27;#/components/responses/InternalError&#x27;</text><text x="20" y="715">        &#x27;502&#x27;:</text><text x="20" y="735">          $ref: &#x27;#/components/responses/ServerUnreachable&#x27;</text><text x="20" y="755">components:</text><text x="20" y="775">  parameters:</text><text x="20" y="795">    evalVocabularyHeader:</text><text x="20" y="815">      name: x-mcpjam-eval-vocabulary</text><text x="20" y="835">      in: header</text><text x="20" y="855">      required: false</text><text x="20" y="875">      description: &gt;-</text><text x="20" y="895">        Which vocabulary this request and its response speak. Absent means `1`,</text><text x="20" y="915">        which is byte-for-byte today&#x27;s contract: the same request fields, the</text><text x="20" y="935">        same refusals, the same response projection. `2` is the canonical</text><text x="20" y="955">        vocabulary. Any other value is a `400` with `code: &quot;VALIDATION_ERROR&quot;`.</text><text x="20" y="975"></text><text x="20" y="995"></text><text x="20" y="1015">        Today it decides one thing: the spelling of an evaluator&#x27;s policy</text><text x="20" y="1035">        `role`. Vocabulary 1 accepts and returns `gating`; vocabulary 2 accepts</text><text x="20" y="1055">        both spellings and returns the canonical `required`. Sending `required`</text><text x="20" y="1075">        without the header is a `400`, deliberately — vocabulary 1 is not</text><text x="20" y="1095">        widened to meet vocabulary 2 half way, because a boundary that accepts a</text><text x="20" y="1115">        spelling it does not announce is one two implementations can disagree</text><text x="20" y="1135">        about.</text><text x="20" y="1155"></text><text x="20" y="1175"></text><text x="20" y="1195">        A response that varies by vocabulary sends `Vary:</text><text x="20" y="1215">        x-mcpjam-eval-vocabulary`.</text><text x="20" y="1235">      schema:</text><text x="20" y="1255">        type: string</text><text x="20" y="1275">        enum:</text><text x="20" y="1295">          - &#x27;1&#x27;</text><text x="20" y="1315">          - &#x27;2&#x27;</text><text x="20" y="1335">      example: &#x27;2&#x27;</text><text x="20" y="1355">    projectId:</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 35</text><text x="20" y="75">              enum:</text><text x="20" y="95">                - none</text><text x="20" y="115">                - minimal</text><text x="20" y="135">                - low</text><text x="20" y="155">                - medium</text><text x="20" y="175">                - high</text><text x="20" y="195">                - xhigh</text><text x="20" y="215">                - max</text><text x="20" y="235">              description: &gt;-</text><text x="20" y="255">                Reasoning effort. An effort replaces the sampling temperature: a</text><text x="20" y="275">                `temperature` beside it is dropped or refused, depending on the</text><text x="20" y="295">                route.</text><text x="20" y="315">            temperature:</text><text x="20" y="335">              type: number</text><text x="20" y="355">              minimum: 0</text><text x="20" y="375">              maximum: 2</text><text x="20" y="395">        fallback:</text><text x="20" y="415">          type: object</text><text x="20" y="435">          required:</text><text x="20" y="455">            - provider</text><text x="20" y="475">            - model</text><text x="20" y="495">          additionalProperties: false</text><text x="20" y="515">          properties:</text><text x="20" y="535">            provider:</text><text x="20" y="555">              type: string</text><text x="20" y="575">              enum:</text><text x="20" y="595">                - none</text><text x="20" y="615">                - openrouter</text><text x="20" y="635">            model:</text><text x="20" y="655">              type: string</text><text x="20" y="675">              enum:</text><text x="20" y="695">                - none</text><text x="20" y="715">              description: &#x27;Always `none`: no surface substitutes a different model.&#x27;</text><text x="20" y="735">    LegacyModelSelection:</text><text x="20" y="755">      type: object</text><text x="20" y="775">      description: &gt;-</text><text x="20" y="795">        A STORED legacy selection: a model id with no saved source. Written when</text><text x="20" y="815">        a save sends a bare id the platform does not host (the shorthand), or by</text><text x="20" y="835">        the old-data backfill. It means OWN KEY ONLY: the call runs on the</text><text x="20" y="855">        organization&#x27;s connection for the model&#x27;s provider (or a key on the</text><text x="20" y="875">        caller&#x27;s machine) and never on MCPJam credits. It carries no settings;</text><text x="20" y="895">        to save an effort, send a full `ModelSelection`. A read may be sent back</text><text x="20" y="915">        verbatim.</text><text x="20" y="935">      required:</text><text x="20" y="955">        - source</text><text x="20" y="975">        - modelId</text><text x="20" y="995">      additionalProperties: false</text><text x="20" y="1015">      properties:</text><text x="20" y="1035">        source:</text><text x="20" y="1055">          type: string</text><text x="20" y="1075">          enum:</text><text x="20" y="1095">            - legacy</text><text x="20" y="1115">        modelId:</text><text x="20" y="1135">          type: string</text><text x="20" y="1155">          description: The id exactly as stored (it may be a bare, non-canonical id).</text><text x="20" y="1175">        provider:</text><text x="20" y="1195">          type: string</text><text x="20" y="1215">          description: &gt;-</text><text x="20" y="1235">            The case entry&#x27;s provider hint, kept so the stored `{ model,</text><text x="20" y="1255">            provider }` pair survives the round trip.</text><text x="20" y="1275">  responses:</text><text x="20" y="1295">    ValidationError:</text><text x="20" y="1315">      description: Malformed body or parameters.</text><text x="20" y="1335">      content:</text><text x="20" y="1355">        application/json:</text></g></svg>
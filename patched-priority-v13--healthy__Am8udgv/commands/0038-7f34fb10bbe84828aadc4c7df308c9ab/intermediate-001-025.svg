<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 25</text><text x="20" y="75">            approximated; a human must approve it for EVERY run. `unsupported`:</text><text x="20" y="95">            the source behaviour cannot currently be represented. `unresolved`:</text><text x="20" y="115">            a deterministic reference does not resolve against the live target.</text><text x="20" y="135">            A selected `unsupported` or `unresolved` case cannot run.</text><text x="20" y="155">        sourceCaseKey:</text><text x="20" y="175">          type: string</text><text x="20" y="195">          minLength: 1</text><text x="20" y="215">          maxLength: 512</text><text x="20" y="235">          description: The case&#x27;s identity in the source system, when it had one.</text><text x="20" y="255">        note:</text><text x="20" y="275">          type: string</text><text x="20" y="295">          minLength: 1</text><text x="20" y="315">          maxLength: 2000</text><text x="20" y="335">          description: &gt;-</text><text x="20" y="355">            Why the status is what it is — the mapping rule cited, or what was</text><text x="20" y="375">            lost. REQUIRED when `status` is `exact`.</text><text x="20" y="395">    EvalCaseSource:</text><text x="20" y="415">      type: object</text><text x="20" y="435">      description: &gt;-</text><text x="20" y="455">        Where an AI-assisted Markdown case was authored from. Provenance only:</text><text x="20" y="475">        the file, its hash, and the line range the extractor read, so a reader</text><text x="20" y="495">        can trace a case back to its source document. It is not an import claim</text><text x="20" y="515">        (see `EvalCaseImportClaim`) and carries no approval semantics.</text><text x="20" y="535">      required:</text><text x="20" y="555">        - format</text><text x="20" y="575">        - method</text><text x="20" y="595">        - fileName</text><text x="20" y="615">        - fileHash</text><text x="20" y="635">        - excerpt</text><text x="20" y="655">        - startLine</text><text x="20" y="675">        - endLine</text><text x="20" y="695">        - extractorVersion</text><text x="20" y="715">      additionalProperties: false</text><text x="20" y="735">      properties:</text><text x="20" y="755">        format:</text><text x="20" y="775">          type: string</text><text x="20" y="795">          enum:</text><text x="20" y="815">            - markdown</text><text x="20" y="835">        method:</text><text x="20" y="855">          type: string</text><text x="20" y="875">          enum:</text><text x="20" y="895">            - ai</text><text x="20" y="915">          description: &gt;-</text><text x="20" y="935">            How the case was derived from the document. `ai`: an extractor model</text><text x="20" y="955">            proposed it and a person reviewed it before it was saved.</text><text x="20" y="975">        fileName:</text><text x="20" y="995">          type: string</text><text x="20" y="1015">          minLength: 1</text><text x="20" y="1035">          maxLength: 255</text><text x="20" y="1055">        fileHash:</text><text x="20" y="1075">          type: string</text><text x="20" y="1095">          pattern: ^[a-f0-9]{64}$</text><text x="20" y="1115">          description: SHA-256 of the source document, lowercase hex.</text><text x="20" y="1135">        excerpt:</text><text x="20" y="1155">          type: string</text><text x="20" y="1175">          minLength: 1</text><text x="20" y="1195">          maxLength: 102400</text><text x="20" y="1215">          description: The passage the case was extracted from.</text><text x="20" y="1235">        startLine:</text><text x="20" y="1255">          type: integer</text><text x="20" y="1275">          minimum: 1</text><text x="20" y="1295">        endLine:</text><text x="20" y="1315">          type: integer</text><text x="20" y="1335">          minimum: 1</text><text x="20" y="1355">          description: Inclusive; never less than `startLine`.</text></g></svg>
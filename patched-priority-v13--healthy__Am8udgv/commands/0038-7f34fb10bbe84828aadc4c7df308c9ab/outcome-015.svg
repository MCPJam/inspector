<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 15</text><text x="20" y="75">          $ref: &#x27;#/components/schemas/EvalCaseImportClaim&#x27;</text><text x="20" y="95">        source:</text><text x="20" y="115">          $ref: &#x27;#/components/schemas/EvalCaseSource&#x27;</text><text x="20" y="135">        suppressedSuiteStandardCheckIds:</text><text x="20" y="155">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="175">          type: array</text><text x="20" y="195">          items:</text><text x="20" y="215">            type: string</text><text x="20" y="235">      additionalProperties: false</text><text x="20" y="255">    EvalCase:</text><text x="20" y="275">      type: object</text><text x="20" y="295">      required:</text><text x="20" y="315">        - id</text><text x="20" y="335">        - title</text><text x="20" y="355">        - steps</text><text x="20" y="375">        - iterations</text><text x="20" y="395">        - isNegative</text><text x="20" y="415">        - models</text><text x="20" y="435">      description: &gt;-</text><text x="20" y="455">        A persisted eval case, in the public steps-first shape. Note this is NOT</text><text x="20" y="475">        `EvalTestCase`, which is the INLINE authoring shape accepted by suite</text><text x="20" y="495">        creation.</text><text x="20" y="515">      properties:</text><text x="20" y="535">        judge:</text><text x="20" y="555">          type: object</text><text x="20" y="575">          additionalProperties: false</text><text x="20" y="595">          properties:</text><text x="20" y="615">            enabled:</text><text x="20" y="635">              type: boolean</text><text x="20" y="655">          description: &gt;-</text><text x="20" y="675">            Per-case judge override. enabled: false skips goal-completion</text><text x="20" y="695">            grading for this case.</text><text x="20" y="715">        id:</text><text x="20" y="735">          type: string</text><text x="20" y="755">        declaredId:</text><text x="20" y="775">          type: string</text><text x="20" y="795">          description: &gt;-</text><text x="20" y="815">            The case&#x27;s effective declared id. Absent on cases authored before</text><text x="20" y="835">            declared identity existed.</text><text x="20" y="855">        title:</text><text x="20" y="875">          type: string</text><text x="20" y="895">        steps:</text><text x="20" y="915">          type: array</text><text x="20" y="935">          minItems: 1</text><text x="20" y="955">          items:</text><text x="20" y="975">            $ref: &#x27;#/components/schemas/EvalTestStep&#x27;</text><text x="20" y="995">          description: &gt;-</text><text x="20" y="1015">            Ordered test steps. A `prompt` step is a model turn; a single</text><text x="20" y="1035">            model-free `toolCall` step is a render-check; `assert` steps hold</text><text x="20" y="1055">            the expectations.</text><text x="20" y="1075">        expectedOutput:</text><text x="20" y="1095">          type: string</text><text x="20" y="1115">        iterations:</text><text x="20" y="1135">          type: integer</text><text x="20" y="1155">          minimum: 1</text><text x="20" y="1175">          maximum: 10</text><text x="20" y="1195">        repetitions:</text><text x="20" y="1215">          type: integer</text><text x="20" y="1235">          minimum: 1</text><text x="20" y="1255">          description: &gt;-</text><text x="20" y="1275">            Trials this case runs under per-case grading, overriding the suite</text><text x="20" y="1295">            default. Absent means the case inherits it. NOT a second spelling of</text><text x="20" y="1315">            `iterations`: that one is read as a FLOOR (`max(iterations,</text><text x="20" y="1335">            suite.minimumIterations)`) by a suite decided on suite-wide</text><text x="20" y="1355">            accuracy, and a per-case-graded case still reports it for</text></g></svg>
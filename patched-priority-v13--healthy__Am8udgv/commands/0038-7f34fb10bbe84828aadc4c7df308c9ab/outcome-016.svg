<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 16</text><text x="20" y="75">            compatibility. This one REPLACES the count rather than raising it —</text><text x="20" y="95">            a case at 7 runs 7 times under a floor of 3 and 3 times under a</text><text x="20" y="115">            default of 3.</text><text x="20" y="135">        passThreshold:</text><text x="20" y="155">          type: number</text><text x="20" y="175">          minimum: 0</text><text x="20" y="195">          maximum: 1</text><text x="20" y="215">          description: &gt;-</text><text x="20" y="235">            Fraction of this case&#x27;s trials that must pass, overriding the suite</text><text x="20" y="255">            default. Absent means the case inherits it. Never derived from the</text><text x="20" y="275">            suite&#x27;s `minimumAccuracy`, which is a PERCENT under a different</text><text x="20" y="295">            resolver.</text><text x="20" y="315">        isNegative:</text><text x="20" y="335">          type: boolean</text><text x="20" y="355">          description: When true, the case passes if NO tools are called.</text><text x="20" y="375">        scenario:</text><text x="20" y="395">          type: string</text><text x="20" y="415">        intent:</text><text x="20" y="435">          type: string</text><text x="20" y="455">          minLength: 1</text><text x="20" y="475">          maxLength: 64</text><text x="20" y="495">          pattern: ^\S(?:[\s\S]*\S)?$</text><text x="20" y="515">          description: &gt;-</text><text x="20" y="535">            Optional authored analytics grouping label. Must be already trimmed;</text><text x="20" y="555">            absent means unlabelled.</text><text x="20" y="575">        kind:</text><text x="20" y="595">          type: string</text><text x="20" y="615">          enum:</text><text x="20" y="635">            - capability</text><text x="20" y="655">            - regression</text><text x="20" y="675">          description: &gt;-</text><text x="20" y="695">            Authored case kind for the simple editor. Absent means the editor</text><text x="20" y="715">            derives it from matchOptions.</text><text x="20" y="735">        models:</text><text x="20" y="755">          type: array</text><text x="20" y="775">          items:</text><text x="20" y="795">            type: object</text><text x="20" y="815">            required:</text><text x="20" y="835">              - model</text><text x="20" y="855">            properties:</text><text x="20" y="875">              model:</text><text x="20" y="895">                type: string</text><text x="20" y="915">                readOnly: true</text><text x="20" y="935">                description: &gt;-</text><text x="20" y="955">                  COMPUTED in responses: the selection&#x27;s `modelId` when there is</text><text x="20" y="975">                  one, else the stored bare id. Accepted on writes as a</text><text x="20" y="995">                  shorthand: send a bare id and the platform converts it (a</text><text x="20" y="1015">                  hosted id becomes a `hosted` selection, any other a</text><text x="20" y="1035">                  `LegacyModelSelection`).</text><text x="20" y="1055">              provider:</text><text x="20" y="1075">                type: string</text><text x="20" y="1095">              selection:</text><text x="20" y="1115">                allOf:</text><text x="20" y="1135">                  - $ref: &#x27;#/components/schemas/RequestedModelSelection&#x27;</text><text x="20" y="1155">                description: &gt;-</text><text x="20" y="1175">                  The saved model choice behind `model` (source, connection,</text><text x="20" y="1195">                  `settings.reasoningEffort`). Absent when the case stores only</text><text x="20" y="1215">                  a bare model id. May be a STORED legacy selection</text><text x="20" y="1235">                  (`LegacyModelSelection`, `source: &quot;legacy&quot;`): own key only,</text><text x="20" y="1255">                  never MCPJam credits. The model id beside it is computed from</text><text x="20" y="1275">                  it.</text><text x="20" y="1295">              selectionOrigin:</text><text x="20" y="1315">                type: string</text><text x="20" y="1335">                enum:</text><text x="20" y="1355">                  - backfill</text></g></svg>
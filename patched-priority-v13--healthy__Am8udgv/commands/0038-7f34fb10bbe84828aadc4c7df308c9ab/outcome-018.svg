<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 18</text><text x="20" y="75">        prompt:</text><text x="20" y="95">          type: string</text><text x="20" y="115">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="135">        serverName:</text><text x="20" y="155">          type: string</text><text x="20" y="175">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="195">        toolName:</text><text x="20" y="215">          type: string</text><text x="20" y="235">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="255">        arguments:</text><text x="20" y="275">          type: object</text><text x="20" y="295">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="315">          additionalProperties: true</text><text x="20" y="335">        action:</text><text x="20" y="355">          type: object</text><text x="20" y="375">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="395">          additionalProperties: true</text><text x="20" y="415">        assertion:</text><text x="20" y="435">          type: object</text><text x="20" y="455">          description: &gt;-</text><text x="20" y="475">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="495">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="515">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="535">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="555">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="575">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="595">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="615">            replayability only one half of it has.</text><text x="20" y="635">          additionalProperties: true</text><text x="20" y="655">      additionalProperties: true</text><text x="20" y="675">    RequestedModelSelection:</text><text x="20" y="695">      description: &gt;-</text><text x="20" y="715">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="735">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="755">        organization connection, `local` on a key on the caller&#x27;s machine) or a</text><text x="20" y="775">        STORED `LegacyModelSelection` (own key only). Wherever one sits beside a</text><text x="20" y="795">        model id (`modelId`, `model`), that id is COMPUTED from it on reads, and</text><text x="20" y="815">        accepted on writes as a shorthand the platform converts. A row with</text><text x="20" y="835">        neither is an unlabelled old row and runs exactly as it always has.</text><text x="20" y="855">      oneOf:</text><text x="20" y="875">        - $ref: &#x27;#/components/schemas/ModelSelection&#x27;</text><text x="20" y="895">        - $ref: &#x27;#/components/schemas/LegacyModelSelection&#x27;</text><text x="20" y="915">    EvalAssertion:</text><text x="20" y="935">      oneOf:</text><text x="20" y="955">        - type: object</text><text x="20" y="975">          properties:</text><text x="20" y="995">            type:</text><text x="20" y="1015">              type: string</text><text x="20" y="1035">              const: toolDescriptionsPresent</text><text x="20" y="1055">            minLength:</text><text x="20" y="1075">              type: integer</text><text x="20" y="1095">              exclusiveMinimum: 0</text><text x="20" y="1115">              maximum: 9007199254740991</text><text x="20" y="1135">            role:</text><text x="20" y="1155">              type: string</text><text x="20" y="1175">              enum:</text><text x="20" y="1195">                - gating</text><text x="20" y="1215">                - advisory</text><text x="20" y="1235">                - required</text><text x="20" y="1255">            severity:</text><text x="20" y="1275">              type: string</text><text x="20" y="1295">              const: warn</text><text x="20" y="1315">          required:</text><text x="20" y="1335">            - type</text><text x="20" y="1355">        - type: object</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 36</text><text x="20" y="75">          schema:</text><text x="20" y="95">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="115">          example:</text><text x="20" y="135">            code: VALIDATION_ERROR</text><text x="20" y="155">            message: Invalid JSON body</text><text x="20" y="175">    Unauthorized:</text><text x="20" y="195">      description: &gt;-</text><text x="20" y="215">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="235">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="255">        a property of the server, not your key.</text><text x="20" y="275">      content:</text><text x="20" y="295">        application/json:</text><text x="20" y="315">          schema:</text><text x="20" y="335">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="355">          examples:</text><text x="20" y="375">            badKey:</text><text x="20" y="395">              summary: Invalid or revoked key</text><text x="20" y="415">              value:</text><text x="20" y="435">                code: UNAUTHORIZED</text><text x="20" y="455">                message: Invalid API key</text><text x="20" y="475">            oauthRequired:</text><text x="20" y="495">              summary: Target server needs an OAuth grant</text><text x="20" y="515">              value:</text><text x="20" y="535">                code: OAUTH_REQUIRED</text><text x="20" y="555">                message: Server requires OAuth authorization</text><text x="20" y="575">    Forbidden:</text><text x="20" y="595">      description: Key is valid but not allowed to do this.</text><text x="20" y="615">      content:</text><text x="20" y="635">        application/json:</text><text x="20" y="655">          schema:</text><text x="20" y="675">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="695">          example:</text><text x="20" y="715">            code: FORBIDDEN</text><text x="20" y="735">            message: You do not have access to this project</text><text x="20" y="755">    NotFound:</text><text x="20" y="775">      description: Unknown project, server, or resource.</text><text x="20" y="795">      content:</text><text x="20" y="815">        application/json:</text><text x="20" y="835">          schema:</text><text x="20" y="855">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="875">          example:</text><text x="20" y="895">            code: NOT_FOUND</text><text x="20" y="915">            message: Server not found</text><text x="20" y="935">    Conflict:</text><text x="20" y="955">      description: &gt;-</text><text x="20" y="975">        The resource is not in a state that accepts this write — a stale</text><text x="20" y="995">        `expectedRevision`, a duplicate name, or an environment that cannot</text><text x="20" y="1015">        currently be launched. The request was well-formed; re-read the resource</text><text x="20" y="1035">        and retry.</text><text x="20" y="1055">      content:</text><text x="20" y="1075">        application/json:</text><text x="20" y="1095">          schema:</text><text x="20" y="1115">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1135">          example:</text><text x="20" y="1155">            code: CONFLICT</text><text x="20" y="1175">            message: &gt;-</text><text x="20" y="1195">              Environment changed since you loaded it (expected revision 3,</text><text x="20" y="1215">              current 5). Reload and retry.</text><text x="20" y="1235">    RateLimited:</text><text x="20" y="1255">      description: &gt;-</text><text x="20" y="1275">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="1295">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="1315">      headers:</text><text x="20" y="1335">        Retry-After:</text><text x="20" y="1355">          description: Seconds to wait before retrying.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 29</text><text x="20" y="75">      description: &gt;-</text><text x="20" y="95">        Missing, invalid, revoked, or orphaned key (`UNAUTHORIZED`) — or the</text><text x="20" y="115">        **target MCP server** needs an OAuth grant (`OAUTH_REQUIRED`), which is</text><text x="20" y="135">        a property of the server, not your key.</text><text x="20" y="155">      content:</text><text x="20" y="175">        application/json:</text><text x="20" y="195">          schema:</text><text x="20" y="215">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="235">          examples:</text><text x="20" y="255">            badKey:</text><text x="20" y="275">              summary: Invalid or revoked key</text><text x="20" y="295">              value:</text><text x="20" y="315">                code: UNAUTHORIZED</text><text x="20" y="335">                message: Invalid API key</text><text x="20" y="355">            oauthRequired:</text><text x="20" y="375">              summary: Target server needs an OAuth grant</text><text x="20" y="395">              value:</text><text x="20" y="415">                code: OAUTH_REQUIRED</text><text x="20" y="435">                message: Server requires OAuth authorization</text><text x="20" y="455">    Forbidden:</text><text x="20" y="475">      description: Key is valid but not allowed to do this.</text><text x="20" y="495">      content:</text><text x="20" y="515">        application/json:</text><text x="20" y="535">          schema:</text><text x="20" y="555">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="575">          example:</text><text x="20" y="595">            code: FORBIDDEN</text><text x="20" y="615">            message: You do not have access to this project</text><text x="20" y="635">    NotFound:</text><text x="20" y="655">      description: Unknown project, server, or resource.</text><text x="20" y="675">      content:</text><text x="20" y="695">        application/json:</text><text x="20" y="715">          schema:</text><text x="20" y="735">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="755">          example:</text><text x="20" y="775">            code: NOT_FOUND</text><text x="20" y="795">            message: Server not found</text><text x="20" y="815">    Conflict:</text><text x="20" y="835">      description: &gt;-</text><text x="20" y="855">        The resource is not in a state that accepts this write — a stale</text><text x="20" y="875">        `expectedRevision`, a duplicate name, or an environment that cannot</text><text x="20" y="895">        currently be launched. The request was well-formed; re-read the resource</text><text x="20" y="915">        and retry.</text><text x="20" y="935">      content:</text><text x="20" y="955">        application/json:</text><text x="20" y="975">          schema:</text><text x="20" y="995">            $ref: &#x27;#/components/schemas/Error&#x27;</text><text x="20" y="1015">          example:</text><text x="20" y="1035">            code: CONFLICT</text><text x="20" y="1055">            message: &gt;-</text><text x="20" y="1075">              Environment changed since you loaded it (expected revision 3,</text><text x="20" y="1095">              current 5). Reload and retry.</text><text x="20" y="1115">    RateLimited:</text><text x="20" y="1135">      description: &gt;-</text><text x="20" y="1155">        Per-key rate limit exceeded (60 requests/minute sustained, bursts up to</text><text x="20" y="1175">        10). Honor `Retry-After` and back off with jitter.</text><text x="20" y="1195">      headers:</text><text x="20" y="1215">        Retry-After:</text><text x="20" y="1235">          description: Seconds to wait before retrying.</text><text x="20" y="1255">          schema:</text><text x="20" y="1275">            type: integer</text><text x="20" y="1295">      content:</text><text x="20" y="1315">        application/json:</text><text x="20" y="1335">          schema:</text><text x="20" y="1355">            $ref: &#x27;#/components/schemas/Error&#x27;</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 11</text><text x="20" y="75">        toolName:</text><text x="20" y="95">          type: string</text><text x="20" y="115">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="135">        arguments:</text><text x="20" y="155">          type: object</text><text x="20" y="175">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="195">          additionalProperties: true</text><text x="20" y="215">        action:</text><text x="20" y="235">          type: object</text><text x="20" y="255">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="275">          additionalProperties: true</text><text x="20" y="295">        assertion:</text><text x="20" y="315">          type: object</text><text x="20" y="335">          description: &gt;-</text><text x="20" y="355">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="375">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="395">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="415">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="435">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="455">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="475">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="495">            replayability only one half of it has.</text><text x="20" y="515">          additionalProperties: true</text><text x="20" y="535">      additionalProperties: true</text><text x="20" y="555">    RequestedModelSelection:</text><text x="20" y="575">      description: &gt;-</text><text x="20" y="595">        What a store-once row holds as its ONLY copy of the model: a full</text><text x="20" y="615">        `ModelSelection` (`hosted` runs on MCPJam credits, `org` on an</text><text x="20" y="635">        organization connection, `local` on a key on the caller&#x27;s machine) or a</text><text x="20" y="655">        STORED `LegacyModelSelection` (own key only). Wherever one sits beside a</text><text x="20" y="675">        model id (`modelId`, `model`), that id is COMPUTED from it on reads, and</text><text x="20" y="695">        accepted on writes as a shorthand the platform converts. A row with</text><text x="20" y="715">        neither is an unlabelled old row and runs exactly as it always has.</text><text x="20" y="735">      oneOf:</text><text x="20" y="755">        - $ref: &#x27;#/components/schemas/ModelSelection&#x27;</text><text x="20" y="775">        - $ref: &#x27;#/components/schemas/LegacyModelSelection&#x27;</text><text x="20" y="795">    EvalAssertion:</text><text x="20" y="815">      oneOf:</text><text x="20" y="835">        - type: object</text><text x="20" y="855">          properties:</text><text x="20" y="875">            type:</text><text x="20" y="895">              type: string</text><text x="20" y="915">              const: toolDescriptionsPresent</text><text x="20" y="935">            minLength:</text><text x="20" y="955">              type: integer</text><text x="20" y="975">              exclusiveMinimum: 0</text><text x="20" y="995">              maximum: 9007199254740991</text><text x="20" y="1015">            role:</text><text x="20" y="1035">              type: string</text><text x="20" y="1055">              enum:</text><text x="20" y="1075">                - gating</text><text x="20" y="1095">                - advisory</text><text x="20" y="1115">                - required</text><text x="20" y="1135">            severity:</text><text x="20" y="1155">              type: string</text><text x="20" y="1175">              const: warn</text><text x="20" y="1195">          required:</text><text x="20" y="1215">            - type</text><text x="20" y="1235">        - type: object</text><text x="20" y="1255">          properties:</text><text x="20" y="1275">            type:</text><text x="20" y="1295">              type: string</text><text x="20" y="1315">              const: toolAnnotationsPresent</text><text x="20" y="1335">            require:</text><text x="20" y="1355">              maxItems: 2</text></g></svg>
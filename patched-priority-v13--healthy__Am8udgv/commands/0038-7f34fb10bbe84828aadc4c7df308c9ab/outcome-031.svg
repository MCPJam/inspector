<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 31</text><text x="20" y="75">        - type: object</text><text x="20" y="95">          properties:</text><text x="20" y="115">            type:</text><text x="20" y="135">              type: string</text><text x="20" y="155">              const: toolErrorNamesInput</text><text x="20" y="175">            toolName:</text><text x="20" y="195">              type: string</text><text x="20" y="215">              minLength: 1</text><text x="20" y="235">            role:</text><text x="20" y="255">              type: string</text><text x="20" y="275">              enum:</text><text x="20" y="295">                - gating</text><text x="20" y="315">                - advisory</text><text x="20" y="335">                - required</text><text x="20" y="355">            severity:</text><text x="20" y="375">              type: string</text><text x="20" y="395">              const: warn</text><text x="20" y="415">          required:</text><text x="20" y="435">            - type</text><text x="20" y="455">        - type: object</text><text x="20" y="475">          properties:</text><text x="20" y="495">            type:</text><text x="20" y="515">              type: string</text><text x="20" y="535">              const: fullPageHasContinuation</text><text x="20" y="555">            toolName:</text><text x="20" y="575">              type: string</text><text x="20" y="595">              minLength: 1</text><text x="20" y="615">            role:</text><text x="20" y="635">              type: string</text><text x="20" y="655">              enum:</text><text x="20" y="675">                - gating</text><text x="20" y="695">                - advisory</text><text x="20" y="715">                - required</text><text x="20" y="735">            severity:</text><text x="20" y="755">              type: string</text><text x="20" y="775">              const: warn</text><text x="20" y="795">          required:</text><text x="20" y="815">            - type</text><text x="20" y="835">      description: &gt;-</text><text x="20" y="855">        An SDK assertion reported through UVC. Discovery assertions require</text><text x="20" y="875">        complete raw tool declarations; missing evidence is an evaluator error.</text><text x="20" y="895">        Observation kinds, including noDeprecatedToolExposed, require role</text><text x="20" y="915">        advisory. Structural schema; runtime also validates policy and unique</text><text x="20" y="935">        required annotation keys.</text><text x="20" y="955">    EvalCaseImportClaim:</text><text x="20" y="975">      type: object</text><text x="20" y="995">      description: &gt;-</text><text x="20" y="1015">        What a converter CLAIMED about one imported case. `exact` is</text><text x="20" y="1035">        CONVERTER-CLAIMED exact — the converter says it applied a structural</text><text x="20" y="1055">        mapping rule, cited in `note`. MCPJam has NOT verified semantic</text><text x="20" y="1075">        equivalence, so user-facing copy must say &quot;claimed exact&quot;, never</text><text x="20" y="1095">        &quot;verified&quot; or &quot;accepted&quot;. Claim-only: who approved an approximation,</text><text x="20" y="1115">        when, and why is a PER-RUN decision frozen on the run</text><text x="20" y="1135">        (`ImportEligibility.approvedApproximationReceipts`), never stored on the</text><text x="20" y="1155">        case — an approval that lived on a case would outlive the run it was</text><text x="20" y="1175">        granted for and the edit that invalidated it. Approval and internal keys</text><text x="20" y="1195">        are rejected with 400, never stripped.</text><text x="20" y="1215">      required:</text><text x="20" y="1235">        - status</text><text x="20" y="1255">      additionalProperties: false</text><text x="20" y="1275">      properties:</text><text x="20" y="1295">        status:</text><text x="20" y="1315">          type: string</text><text x="20" y="1335">          enum:</text><text x="20" y="1355">            - exact</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 34</text><text x="20" y="75">            match on it.</text><text x="20" y="95">        details:</text><text x="20" y="115">          type: object</text><text x="20" y="135">          description: Optional, unstructured context bag.</text><text x="20" y="155">          additionalProperties: true</text><text x="20" y="175">    ModelSelection:</text><text x="20" y="195">      type: object</text><text x="20" y="215">      description: &gt;-</text><text x="20" y="235">        A saved model choice. Never carries a secret: an unknown key is refused.</text><text x="20" y="255">        `settings.reasoningEffort` is where a reasoning effort is saved — there</text><text x="20" y="275">        is no other saved carrier (`advancedConfig.reasoningEffort` is refused).</text><text x="20" y="295">        Which efforts a model accepts is `supportedReasoningEfforts` on `GET</text><text x="20" y="315">        /v1/models`; a saved effort the route the run takes cannot apply is</text><text x="20" y="335">        refused (`capability_missing`), never dropped.</text><text x="20" y="355">      required:</text><text x="20" y="375">        - modelId</text><text x="20" y="395">        - source</text><text x="20" y="415">        - fallback</text><text x="20" y="435">      additionalProperties: false</text><text x="20" y="455">      properties:</text><text x="20" y="475">        modelId:</text><text x="20" y="495">          type: string</text><text x="20" y="515">          description: Canonical `provider/model` id.</text><text x="20" y="535">        source:</text><text x="20" y="555">          type: string</text><text x="20" y="575">          enum:</text><text x="20" y="595">            - hosted</text><text x="20" y="615">            - org</text><text x="20" y="635">            - local</text><text x="20" y="655">          description: Whose credentials pay for and serve the call.</text><text x="20" y="675">        connectionRef:</text><text x="20" y="695">          type: object</text><text x="20" y="715">          description: &gt;-</text><text x="20" y="735">            Required for `org` (`kind: orgProvider`) and `local` (`kind:</text><text x="20" y="755">            localProvider`), absent for `hosted`.</text><text x="20" y="775">          required:</text><text x="20" y="795">            - kind</text><text x="20" y="815">          additionalProperties: false</text><text x="20" y="835">          properties:</text><text x="20" y="855">            kind:</text><text x="20" y="875">              type: string</text><text x="20" y="895">              enum:</text><text x="20" y="915">                - orgProvider</text><text x="20" y="935">                - localProvider</text><text x="20" y="955">            id:</text><text x="20" y="975">              type: string</text><text x="20" y="995">              description: The organization model provider row (`orgProvider`).</text><text x="20" y="1015">            providerKey:</text><text x="20" y="1035">              type: string</text><text x="20" y="1055">              description: &gt;-</text><text x="20" y="1075">                The provider configured on the user&#x27;s own machine</text><text x="20" y="1095">                (`localProvider`).</text><text x="20" y="1115">            customProviderName:</text><text x="20" y="1135">              type: string</text><text x="20" y="1155">        nativeModelId:</text><text x="20" y="1175">          type: string</text><text x="20" y="1195">          description: &gt;-</text><text x="20" y="1215">            Deployment or native id where it is not derivable from `modelId`</text><text x="20" y="1235">            (Azure deployment name, Bedrock inference profile, custom provider).</text><text x="20" y="1255">        settings:</text><text x="20" y="1275">          type: object</text><text x="20" y="1295">          additionalProperties: false</text><text x="20" y="1315">          properties:</text><text x="20" y="1335">            reasoningEffort:</text><text x="20" y="1355">              type: string</text></g></svg>
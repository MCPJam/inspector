<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 9</text><text x="20" y="75">          maximum: 1</text><text x="20" y="95">          description: &gt;-</text><text x="20" y="115">            Fraction of this case&#x27;s trials that must pass, overriding the suite</text><text x="20" y="135">            default. Absent means the case inherits it. Never derived from the</text><text x="20" y="155">            suite&#x27;s `minimumAccuracy`, which is a PERCENT under a different</text><text x="20" y="175">            resolver.</text><text x="20" y="195">        isNegative:</text><text x="20" y="215">          type: boolean</text><text x="20" y="235">          description: When true, the case passes if NO tools are called.</text><text x="20" y="255">        scenario:</text><text x="20" y="275">          type: string</text><text x="20" y="295">        intent:</text><text x="20" y="315">          type: string</text><text x="20" y="335">          minLength: 1</text><text x="20" y="355">          maxLength: 64</text><text x="20" y="375">          pattern: ^\S(?:[\s\S]*\S)?$</text><text x="20" y="395">          description: &gt;-</text><text x="20" y="415">            Optional authored analytics grouping label. Must be already trimmed;</text><text x="20" y="435">            absent means unlabelled.</text><text x="20" y="455">        kind:</text><text x="20" y="475">          type: string</text><text x="20" y="495">          enum:</text><text x="20" y="515">            - capability</text><text x="20" y="535">            - regression</text><text x="20" y="555">          description: &gt;-</text><text x="20" y="575">            Authored case kind for the simple editor. Absent means the editor</text><text x="20" y="595">            derives it from matchOptions.</text><text x="20" y="615">        models:</text><text x="20" y="635">          type: array</text><text x="20" y="655">          items:</text><text x="20" y="675">            type: object</text><text x="20" y="695">            required:</text><text x="20" y="715">              - model</text><text x="20" y="735">            properties:</text><text x="20" y="755">              model:</text><text x="20" y="775">                type: string</text><text x="20" y="795">                readOnly: true</text><text x="20" y="815">                description: &gt;-</text><text x="20" y="835">                  COMPUTED in responses: the selection&#x27;s `modelId` when there is</text><text x="20" y="855">                  one, else the stored bare id. Accepted on writes as a</text><text x="20" y="875">                  shorthand: send a bare id and the platform converts it (a</text><text x="20" y="895">                  hosted id becomes a `hosted` selection, any other a</text><text x="20" y="915">                  `LegacyModelSelection`).</text><text x="20" y="935">              provider:</text><text x="20" y="955">                type: string</text><text x="20" y="975">              selection:</text><text x="20" y="995">                allOf:</text><text x="20" y="1015">                  - $ref: &#x27;#/components/schemas/RequestedModelSelection&#x27;</text><text x="20" y="1035">                description: &gt;-</text><text x="20" y="1055">                  The saved model choice behind `model` (source, connection,</text><text x="20" y="1075">                  `settings.reasoningEffort`). Absent when the case stores only</text><text x="20" y="1095">                  a bare model id. May be a STORED legacy selection</text><text x="20" y="1115">                  (`LegacyModelSelection`, `source: &quot;legacy&quot;`): own key only,</text><text x="20" y="1135">                  never MCPJam credits. The model id beside it is computed from</text><text x="20" y="1155">                  it.</text><text x="20" y="1175">              selectionOrigin:</text><text x="20" y="1195">                type: string</text><text x="20" y="1215">                enum:</text><text x="20" y="1235">                  - backfill</text><text x="20" y="1255">                description: &gt;-</text><text x="20" y="1275">                  `backfill` when a conversion (a save of a bare id, or the</text><text x="20" y="1295">                  old-data backfill) chose `selection` rather than a person.</text><text x="20" y="1315">                  Absent when a person chose it, and on rows with no selection.</text><text x="20" y="1335">        matchOptions:</text><text x="20" y="1355">          type: object</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 12</text><text x="20" y="75">      name: projectId</text><text x="20" y="95">      in: path</text><text x="20" y="115">      required: true</text><text x="20" y="135">      description: ID of the hosted project that contains the server.</text><text x="20" y="155">      schema:</text><text x="20" y="175">        type: string</text><text x="20" y="195">    suiteId:</text><text x="20" y="215">      name: suiteId</text><text x="20" y="235">      in: path</text><text x="20" y="255">      required: true</text><text x="20" y="275">      description: Eval suite ID, as returned by `POST /eval-runs`.</text><text x="20" y="295">      schema:</text><text x="20" y="315">        type: string</text><text x="20" y="335">    declaredSuiteIdQuery:</text><text x="20" y="355">      name: declaredSuiteId</text><text x="20" y="375">      in: query</text><text x="20" y="395">      required: false</text><text x="20" y="415">      description: &gt;-</text><text x="20" y="435">        The suite file&#x27;s own `suite.id`, when this request is that file syncing</text><text x="20" y="455">        itself. A CI-owned suite (see `EvalSuiteDetail.managedBy`) refuses</text><text x="20" y="475">        configuration writes with `409` and `details.reason:</text><text x="20" y="495">        &quot;CI_OWNED_SUITE_READ_ONLY&quot;`; naming the suite&#x27;s own declared id is how</text><text x="20" y="515">        the file writing itself is allowed through. Naming any other id refuses</text><text x="20" y="535">        exactly as loudly as naming none, so it is not a capability — omit it</text><text x="20" y="555">        for an ordinary edit.</text><text x="20" y="575"></text><text x="20" y="595"></text><text x="20" y="615">        A QUERY PARAMETER on every route that takes it, never a body field.</text><text x="20" y="635">        These request bodies are strict, here and on every Inspector that</text><text x="20" y="655">        predates the CI-owned lock, so a body field is a `400` against an older</text><text x="20" y="675">        deployment — which would break `mcpjam cloud eval run --file` for anyone</text><text x="20" y="695">        whose CLI is newer than their Inspector. A query parameter is read by</text><text x="20" y="715">        the deployments that know it and ignored by those that do not, which is</text><text x="20" y="735">        the right degradation: an Inspector with no lock has no exception to</text><text x="20" y="755">        make.</text><text x="20" y="775">      schema:</text><text x="20" y="795">        type: string</text><text x="20" y="815">        maxLength: 128</text><text x="20" y="835">  schemas:</text><text x="20" y="855">    EvalCaseCreateRequest:</text><text x="20" y="875">      type: object</text><text x="20" y="895">      required:</text><text x="20" y="915">        - title</text><text x="20" y="935">        - steps</text><text x="20" y="955">      description: &gt;-</text><text x="20" y="975">        Create one case. `title` and a non-empty `steps` array are both required</text><text x="20" y="995">        — a case persisted without executable steps could never run.</text><text x="20" y="1015">      properties:</text><text x="20" y="1035">        judge:</text><text x="20" y="1055">          type: object</text><text x="20" y="1075">          additionalProperties: false</text><text x="20" y="1095">          properties:</text><text x="20" y="1115">            enabled:</text><text x="20" y="1135">              type: boolean</text><text x="20" y="1155">          nullable: true</text><text x="20" y="1175">          description: &gt;-</text><text x="20" y="1195">            Per-case judge override. enabled: false skips goal-completion</text><text x="20" y="1215">            grading for this case; null clears the override and restores the</text><text x="20" y="1235">            suite setting.</text><text x="20" y="1255">        declaredSuiteId:</text><text x="20" y="1275">          type: string</text><text x="20" y="1295">          maxLength: 128</text><text x="20" y="1315">          description: &gt;-</text><text x="20" y="1335">            The suite file&#x27;s own `suite.id`, when THIS request is a suite-file</text><text x="20" y="1355">            sync.</text></g></svg>
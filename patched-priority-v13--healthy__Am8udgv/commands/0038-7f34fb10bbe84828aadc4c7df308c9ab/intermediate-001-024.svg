<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 24</text><text x="20" y="75">              type: string</text><text x="20" y="95">              minLength: 1</text><text x="20" y="115">            role:</text><text x="20" y="135">              type: string</text><text x="20" y="155">              enum:</text><text x="20" y="175">                - gating</text><text x="20" y="195">                - advisory</text><text x="20" y="215">                - required</text><text x="20" y="235">            severity:</text><text x="20" y="255">              type: string</text><text x="20" y="275">              const: warn</text><text x="20" y="295">          required:</text><text x="20" y="315">            - type</text><text x="20" y="335">        - type: object</text><text x="20" y="355">          properties:</text><text x="20" y="375">            type:</text><text x="20" y="395">              type: string</text><text x="20" y="415">              const: fullPageHasContinuation</text><text x="20" y="435">            toolName:</text><text x="20" y="455">              type: string</text><text x="20" y="475">              minLength: 1</text><text x="20" y="495">            role:</text><text x="20" y="515">              type: string</text><text x="20" y="535">              enum:</text><text x="20" y="555">                - gating</text><text x="20" y="575">                - advisory</text><text x="20" y="595">                - required</text><text x="20" y="615">            severity:</text><text x="20" y="635">              type: string</text><text x="20" y="655">              const: warn</text><text x="20" y="675">          required:</text><text x="20" y="695">            - type</text><text x="20" y="715">      description: &gt;-</text><text x="20" y="735">        An SDK assertion reported through UVC. Discovery assertions require</text><text x="20" y="755">        complete raw tool declarations; missing evidence is an evaluator error.</text><text x="20" y="775">        Observation kinds, including noDeprecatedToolExposed, require role</text><text x="20" y="795">        advisory. Structural schema; runtime also validates policy and unique</text><text x="20" y="815">        required annotation keys.</text><text x="20" y="835">    EvalCaseImportClaim:</text><text x="20" y="855">      type: object</text><text x="20" y="875">      description: &gt;-</text><text x="20" y="895">        What a converter CLAIMED about one imported case. `exact` is</text><text x="20" y="915">        CONVERTER-CLAIMED exact — the converter says it applied a structural</text><text x="20" y="935">        mapping rule, cited in `note`. MCPJam has NOT verified semantic</text><text x="20" y="955">        equivalence, so user-facing copy must say &quot;claimed exact&quot;, never</text><text x="20" y="975">        &quot;verified&quot; or &quot;accepted&quot;. Claim-only: who approved an approximation,</text><text x="20" y="995">        when, and why is a PER-RUN decision frozen on the run</text><text x="20" y="1015">        (`ImportEligibility.approvedApproximationReceipts`), never stored on the</text><text x="20" y="1035">        case — an approval that lived on a case would outlive the run it was</text><text x="20" y="1055">        granted for and the edit that invalidated it. Approval and internal keys</text><text x="20" y="1075">        are rejected with 400, never stripped.</text><text x="20" y="1095">      required:</text><text x="20" y="1115">        - status</text><text x="20" y="1135">      additionalProperties: false</text><text x="20" y="1155">      properties:</text><text x="20" y="1175">        status:</text><text x="20" y="1195">          type: string</text><text x="20" y="1215">          enum:</text><text x="20" y="1235">            - exact</text><text x="20" y="1255">            - approximated</text><text x="20" y="1275">            - unsupported</text><text x="20" y="1295">            - unresolved</text><text x="20" y="1315">          description: &gt;-</text><text x="20" y="1335">            `exact`: the converter claims a 1:1 structural mapping, and must</text><text x="20" y="1355">            cite it in `note`. `approximated`: behaviour was intentionally</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 14</text><text x="20" y="75">          type: boolean</text><text x="20" y="95">        scenario:</text><text x="20" y="115">          type: string</text><text x="20" y="135">        intent:</text><text x="20" y="155">          type: string</text><text x="20" y="175">          minLength: 1</text><text x="20" y="195">          maxLength: 64</text><text x="20" y="215">          pattern: ^\S(?:[\s\S]*\S)?$</text><text x="20" y="235">          description: Optional authored analytics grouping label. Must be already trimmed.</text><text x="20" y="255">        kind:</text><text x="20" y="275">          type: string</text><text x="20" y="295">          enum:</text><text x="20" y="315">            - capability</text><text x="20" y="335">            - regression</text><text x="20" y="355">          description: &gt;-</text><text x="20" y="375">            Authored case kind for the simple editor. Absent means the editor</text><text x="20" y="395">            derives it from matchOptions.</text><text x="20" y="415">        models:</text><text x="20" y="435">          type: array</text><text x="20" y="455">          items:</text><text x="20" y="475">            type: object</text><text x="20" y="495">            required:</text><text x="20" y="515">              - model</text><text x="20" y="535">            properties:</text><text x="20" y="555">              model:</text><text x="20" y="575">                type: string</text><text x="20" y="595">              provider:</text><text x="20" y="615">                type: string</text><text x="20" y="635">                description: Derived from a `provider/model` id when omitted.</text><text x="20" y="655">              selection:</text><text x="20" y="675">                allOf:</text><text x="20" y="695">                  - $ref: &#x27;#/components/schemas/RequestedModelSelection&#x27;</text><text x="20" y="715">                description: &gt;-</text><text x="20" y="735">                  The saved model choice behind `model` (source, connection,</text><text x="20" y="755">                  `settings.reasoningEffort`). Must be FOR `model`. On a</text><text x="20" y="775">                  `models` PATCH an entry that omits `selection` KEEPS the</text><text x="20" y="795">                  case&#x27;s existing selection for that model; `null` drops it.</text><text x="20" y="815">        matchOptions:</text><text x="20" y="835">          type:</text><text x="20" y="855">            - object</text><text x="20" y="875">            - &#x27;null&#x27;</text><text x="20" y="895">          description: &gt;-</text><text x="20" y="915">            Tool-call match options in either vocabulary: public</text><text x="20" y="935">            (`toolCallOrder: any|in-order|exact`, `extraToolCalls`, `arguments`)</text><text x="20" y="955">            or internal (`toolCallOrder: ignore|superset|strict`,</text><text x="20" y="975">            `maxExtraToolCalls`, `argumentMatching`), never both in one object.</text><text x="20" y="995">            On update, fields you omit keep their current values. `null` clears</text><text x="20" y="1015">            the case override and inherits the suite&#x27;s.</text><text x="20" y="1035">        checks:</text><text x="20" y="1055">          type:</text><text x="20" y="1075">            - object</text><text x="20" y="1095">            - &#x27;null&#x27;</text><text x="20" y="1115">          description: &#x27;`null` clears the case override.&#x27;</text><text x="20" y="1135">          properties:</text><text x="20" y="1155">            mode:</text><text x="20" y="1175">              type: string</text><text x="20" y="1195">              enum:</text><text x="20" y="1215">                - inherit</text><text x="20" y="1235">                - replace</text><text x="20" y="1255">                - extend</text><text x="20" y="1275">            list:</text><text x="20" y="1295">              type: array</text><text x="20" y="1315">              items:</text><text x="20" y="1335">                $ref: &#x27;#/components/schemas/EvalAssertion&#x27;</text><text x="20" y="1355">        import:</text></g></svg>
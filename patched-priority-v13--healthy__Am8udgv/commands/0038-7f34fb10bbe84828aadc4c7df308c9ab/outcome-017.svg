<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 17</text><text x="20" y="75">                description: &gt;-</text><text x="20" y="95">                  `backfill` when a conversion (a save of a bare id, or the</text><text x="20" y="115">                  old-data backfill) chose `selection` rather than a person.</text><text x="20" y="135">                  Absent when a person chose it, and on rows with no selection.</text><text x="20" y="155">        matchOptions:</text><text x="20" y="175">          type: object</text><text x="20" y="195">          description: &gt;-</text><text x="20" y="215">            In the public vocabulary (`toolCallOrder: any|in-order|exact`,</text><text x="20" y="235">            `extraToolCalls`, `arguments`). Absent when the case sets none —</text><text x="20" y="255">            omitted from the response rather than sent as `null`.</text><text x="20" y="275">        checks:</text><text x="20" y="295">          type: object</text><text x="20" y="315">          description: &gt;-</text><text x="20" y="335">            Absent when the case sets none — omitted from the response rather</text><text x="20" y="355">            than sent as `null`.</text><text x="20" y="375">          properties:</text><text x="20" y="395">            mode:</text><text x="20" y="415">              type: string</text><text x="20" y="435">              enum:</text><text x="20" y="455">                - inherit</text><text x="20" y="475">                - replace</text><text x="20" y="495">                - extend</text><text x="20" y="515">            list:</text><text x="20" y="535">              type: array</text><text x="20" y="555">              items:</text><text x="20" y="575">                $ref: &#x27;#/components/schemas/EvalAssertion&#x27;</text><text x="20" y="595">        import:</text><text x="20" y="615">          $ref: &#x27;#/components/schemas/EvalCaseImportClaim&#x27;</text><text x="20" y="635">        source:</text><text x="20" y="655">          $ref: &#x27;#/components/schemas/EvalCaseSource&#x27;</text><text x="20" y="675">        createdAt:</text><text x="20" y="695">          type:</text><text x="20" y="715">            - number</text><text x="20" y="735">            - &#x27;null&#x27;</text><text x="20" y="755">        updatedAt:</text><text x="20" y="775">          type:</text><text x="20" y="795">            - number</text><text x="20" y="815">            - &#x27;null&#x27;</text><text x="20" y="835">        suppressedSuiteStandardCheckIds:</text><text x="20" y="855">          $ref: &#x27;#/components/schemas/SuppressedSuiteStandardCheckIds&#x27;</text><text x="20" y="875">          type: array</text><text x="20" y="895">          items:</text><text x="20" y="915">            type: string</text><text x="20" y="935">    EvalTestStep:</text><text x="20" y="955">      type: object</text><text x="20" y="975">      description: &gt;-</text><text x="20" y="995">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="1015">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="1035">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="1055">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="1075">        a DOM `WidgetAssertion`).</text><text x="20" y="1095">      required:</text><text x="20" y="1115">        - id</text><text x="20" y="1135">        - kind</text><text x="20" y="1155">      properties:</text><text x="20" y="1175">        id:</text><text x="20" y="1195">          type: string</text><text x="20" y="1215">          minLength: 1</text><text x="20" y="1235">        kind:</text><text x="20" y="1255">          type: string</text><text x="20" y="1275">          enum:</text><text x="20" y="1295">            - prompt</text><text x="20" y="1315">            - toolCall</text><text x="20" y="1335">            - interact</text><text x="20" y="1355">            - assert</text></g></svg>
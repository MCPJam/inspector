<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.38307785987854004s — page 27</text><text x="20" y="75">      type: object</text><text x="20" y="95">      description: &gt;-</text><text x="20" y="115">        A saved model choice. Never carries a secret: an unknown key is refused.</text><text x="20" y="135">        `settings.reasoningEffort` is where a reasoning effort is saved — there</text><text x="20" y="155">        is no other saved carrier (`advancedConfig.reasoningEffort` is refused).</text><text x="20" y="175">        Which efforts a model accepts is `supportedReasoningEfforts` on `GET</text><text x="20" y="195">        /v1/models`; a saved effort the route the run takes cannot apply is</text><text x="20" y="215">        refused (`capability_missing`), never dropped.</text><text x="20" y="235">      required:</text><text x="20" y="255">        - modelId</text><text x="20" y="275">        - source</text><text x="20" y="295">        - fallback</text><text x="20" y="315">      additionalProperties: false</text><text x="20" y="335">      properties:</text><text x="20" y="355">        modelId:</text><text x="20" y="375">          type: string</text><text x="20" y="395">          description: Canonical `provider/model` id.</text><text x="20" y="415">        source:</text><text x="20" y="435">          type: string</text><text x="20" y="455">          enum:</text><text x="20" y="475">            - hosted</text><text x="20" y="495">            - org</text><text x="20" y="515">            - local</text><text x="20" y="535">          description: Whose credentials pay for and serve the call.</text><text x="20" y="555">        connectionRef:</text><text x="20" y="575">          type: object</text><text x="20" y="595">          description: &gt;-</text><text x="20" y="615">            Required for `org` (`kind: orgProvider`) and `local` (`kind:</text><text x="20" y="635">            localProvider`), absent for `hosted`.</text><text x="20" y="655">          required:</text><text x="20" y="675">            - kind</text><text x="20" y="695">          additionalProperties: false</text><text x="20" y="715">          properties:</text><text x="20" y="735">            kind:</text><text x="20" y="755">              type: string</text><text x="20" y="775">              enum:</text><text x="20" y="795">                - orgProvider</text><text x="20" y="815">                - localProvider</text><text x="20" y="835">            id:</text><text x="20" y="855">              type: string</text><text x="20" y="875">              description: The organization model provider row (`orgProvider`).</text><text x="20" y="895">            providerKey:</text><text x="20" y="915">              type: string</text><text x="20" y="935">              description: &gt;-</text><text x="20" y="955">                The provider configured on the user&#x27;s own machine</text><text x="20" y="975">                (`localProvider`).</text><text x="20" y="995">            customProviderName:</text><text x="20" y="1015">              type: string</text><text x="20" y="1035">        nativeModelId:</text><text x="20" y="1055">          type: string</text><text x="20" y="1075">          description: &gt;-</text><text x="20" y="1095">            Deployment or native id where it is not derivable from `modelId`</text><text x="20" y="1115">            (Azure deployment name, Bedrock inference profile, custom provider).</text><text x="20" y="1135">        settings:</text><text x="20" y="1155">          type: object</text><text x="20" y="1175">          additionalProperties: false</text><text x="20" y="1195">          properties:</text><text x="20" y="1215">            reasoningEffort:</text><text x="20" y="1235">              type: string</text><text x="20" y="1255">              enum:</text><text x="20" y="1275">                - none</text><text x="20" y="1295">                - minimal</text><text x="20" y="1315">                - low</text><text x="20" y="1335">                - medium</text><text x="20" y="1355">                - high</text></g></svg>
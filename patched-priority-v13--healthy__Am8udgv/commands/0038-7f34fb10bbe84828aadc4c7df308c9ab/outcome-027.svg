<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7f34fb10bbe84828aadc4c7df308c9ab — page 27</text><text x="20" y="75">            A call to toolName whose input matches EVERY pattern (all within one</text><text x="20" y="95">            call) occurred at least min (default 1) and at most max times. min</text><text x="20" y="115">            and max count MATCHING calls, not all calls: min 0, max 0 means no</text><text x="20" y="135">            call matches, not that the tool was never called (use</text><text x="20" y="155">            toolNeverCalled for that). Patterns are re2js regular expressions</text><text x="20" y="175">            (no lookaround, no backreferences) matched against the canonical</text><text x="20" y="195">            JSON of the arguments (sorted keys, no whitespace), or only the</text><text x="20" y="215">            argument at path when set (a string value as-is, anything else as</text><text x="20" y="235">            canonical JSON). A call whose subject exceeds 100000 characters is</text><text x="20" y="255">            unreadable, and a verdict it could decide is unscored.</text><text x="20" y="275">          properties:</text><text x="20" y="295">            type:</text><text x="20" y="315">              type: string</text><text x="20" y="335">              const: toolInputMatches</text><text x="20" y="355">            toolName:</text><text x="20" y="375">              type: string</text><text x="20" y="395">              minLength: 1</text><text x="20" y="415">            patterns:</text><text x="20" y="435">              description: &gt;-</text><text x="20" y="455">                Every pattern must match the same call. Use alternation (A|B)</text><text x="20" y="475">                inside one pattern for either.</text><text x="20" y="495">              minItems: 1</text><text x="20" y="515">              maxItems: 8</text><text x="20" y="535">              type: array</text><text x="20" y="555">              items:</text><text x="20" y="575">                type: string</text><text x="20" y="595">                minLength: 1</text><text x="20" y="615">                maxLength: 512</text><text x="20" y="635">            flags:</text><text x="20" y="655">              description: &gt;-</text><text x="20" y="675">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="695">                matches newline).</text><text x="20" y="715">              type: string</text><text x="20" y="735">              enum:</text><text x="20" y="755">                - i</text><text x="20" y="775">                - m</text><text x="20" y="795">                - s</text><text x="20" y="815">                - im</text><text x="20" y="835">                - is</text><text x="20" y="855">                - ms</text><text x="20" y="875">                - ims</text><text x="20" y="895">            path:</text><text x="20" y="915">              description: &gt;-</text><text x="20" y="935">                JSON Pointer (RFC 6901) to ONE top-level argument key, such as</text><text x="20" y="955">                /elements; inside the key, ~1 stands for / and ~0 for ~. Omit to</text><text x="20" y="975">                match the whole arguments object. A call without the key does</text><text x="20" y="995">                not match.</text><text x="20" y="1015">              type: string</text><text x="20" y="1035">              minLength: 2</text><text x="20" y="1055">              maxLength: 257</text><text x="20" y="1075">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="1095">            min:</text><text x="20" y="1115">              description: &gt;-</text><text x="20" y="1135">                Minimum number of MATCHING calls (default 1). min 0 requires</text><text x="20" y="1155">                max.</text><text x="20" y="1175">              type: integer</text><text x="20" y="1195">              minimum: 0</text><text x="20" y="1215">              maximum: 9007199254740991</text><text x="20" y="1235">            max:</text><text x="20" y="1255">              description: &gt;-</text><text x="20" y="1275">                Maximum number of MATCHING calls; at least min (or 1 when min is</text><text x="20" y="1295">                omitted).</text><text x="20" y="1315">              type: integer</text><text x="20" y="1335">              minimum: 0</text><text x="20" y="1355">              maximum: 9007199254740991</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">39cbc877f5db457d93256dd7ec7a67c4 — page 9</text><text x="20" y="75">defaults:</text><text x="20" y="95">  judge:</text><text x="20" y="115">    enabled: false</text><text x="20" y="135">  model: anthropic/claude-haiku-4.5</text><text x="20" y="155">  iterations: 1</text><text x="20" y="175">  passThreshold: 1</text><text x="20" y="195">  validity: {}</text><text x="20" y="215">cases:</text><text x="20" y="235">  - id: c_reads_a_note</text><text x="20" y="255">    title: reads the note it was asked about</text><text x="20" y="275">    steps:</text><text x="20" y="295">      - id: s1</text><text x="20" y="315">        kind: prompt</text><text x="20" y="335">        prompt: What does note 7 say?</text><text x="20" y="355">      - id: a1</text><text x="20" y="375">        kind: assert</text><text x="20" y="395">        assertion:</text><text x="20" y="415">          type: toolCalledAtLeastOnce</text><text x="20" y="435">          toolName: read_note</text><text x="20" y="455">  - id: c_never_deletes</text><text x="20" y="475">    title: never deletes when only asked to read</text><text x="20" y="495">    steps:</text><text x="20" y="515">      - id: s1</text><text x="20" y="535">        kind: prompt</text><text x="20" y="555">        prompt: Summarize note 7.</text><text x="20" y="575">      - id: a1</text><text x="20" y="595">        kind: assert</text><text x="20" y="615">        assertion:</text><text x="20" y="635">          type: toolNeverCalled</text><text x="20" y="655">          toolName: delete_note</text><text x="20" y="675">```</text><text x="20" y="695"></text><text x="20" y="715">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="735"></text><text x="20" y="755">### 2. Configure the server</text><text x="20" y="775"></text><text x="20" y="795">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="815">mmand:</text><text x="20" y="835"></text><text x="20" y="855">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="875">{</text><text x="20" y="895">  &quot;mcpServers&quot;: {</text><text x="20" y="915">    &quot;notes&quot;: {</text><text x="20" y="935">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="955">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="975">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="995">    }</text><text x="20" y="1015">  }</text><text x="20" y="1035">}</text><text x="20" y="1055">```</text><text x="20" y="1075"></text><text x="20" y="1095">### 3. Supply a key and run</text><text x="20" y="1115"></text><text x="20" y="1135">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1155">export ANTHROPIC_API_KEY=[REDACTED]</text><text x="20" y="1175">mcpjam test .mcpjam/evals/example.yaml</text><text x="20" y="1195">```</text><text x="20" y="1215"></text><text x="20" y="1235">### 4. Fail one on purpose, then rerun it</text><text x="20" y="1255"></text><text x="20" y="1275">Change `toolName: read_note` to `toolName: echo` in the first case and run again: the command exits `1` and names the failing asse</text><text x="20" y="1295">rtion. Fix it, then rerun just that case and keep a report:</text><text x="20" y="1315"></text><text x="20" y="1335">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1355">mcpjam test .mcpjam/evals/example.yaml --case c_reads_a_note --reporter junit-xml --out reports/local.xml</text></g></svg>
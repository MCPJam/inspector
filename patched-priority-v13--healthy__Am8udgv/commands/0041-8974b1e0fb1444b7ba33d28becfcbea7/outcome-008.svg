<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">8974b1e0fb1444b7ba33d28becfcbea7 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;sed -n &#x27;&quot;&#x27;&quot;&#x27;1314,1365p&#x27;&quot;&#x27;&quot;&#x27; case-api-doc.md &amp;&amp; sed -n &#x27;&quot;&#x27;&quot;&#x27;1130,1200p&#x27;&quot;&#x27;&quot;&#x27; case-api-doc.md &amp;&amp; sed -n &#x27;&quot;&#x27;&quot;&#x27;790</text><text x="20" y="175">,840p&#x27;&quot;&#x27;&quot;&#x27; case-api-doc.md&#x27;</text><text x="20" y="195">            the value at that key in structuredContent (in the JSON output part</text><text x="20" y="215">            when there is no structuredContent). isError results are included. A</text><text x="20" y="235">            result whose text was truncated for storage (when path is omitted),</text><text x="20" y="255">            or whose subject exceeds 100000 characters, is unreadable; so are</text><text x="20" y="275">            results an incomplete capture did not record. A verdict they could</text><text x="20" y="295">            decide is unscored.</text><text x="20" y="315">          properties:</text><text x="20" y="335">            type:</text><text x="20" y="355">              type: string</text><text x="20" y="375">              const: toolResultMatches</text><text x="20" y="395">            toolName:</text><text x="20" y="415">              description: Omit to read every tool&#x27;s results.</text><text x="20" y="435">              type: string</text><text x="20" y="455">              minLength: 1</text><text x="20" y="475">            patterns:</text><text x="20" y="495">              description: &gt;-</text><text x="20" y="515">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="535">                inside one pattern for either.</text><text x="20" y="555">              minItems: 1</text><text x="20" y="575">              maxItems: 8</text><text x="20" y="595">              type: array</text><text x="20" y="615">              items:</text><text x="20" y="635">                type: string</text><text x="20" y="655">                minLength: 1</text><text x="20" y="675">                maxLength: 512</text><text x="20" y="695">            flags:</text><text x="20" y="715">              description: &gt;-</text><text x="20" y="735">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="755">                matches newline).</text><text x="20" y="775">              type: string</text><text x="20" y="795">              enum:</text><text x="20" y="815">                - i</text><text x="20" y="835">                - m</text><text x="20" y="855">                - s</text><text x="20" y="875">                - im</text><text x="20" y="895">                - is</text><text x="20" y="915">                - ms</text><text x="20" y="935">                - ims</text><text x="20" y="955">            path:</text><text x="20" y="975">              description: &gt;-</text><text x="20" y="995">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="1015">                structuredContent (of the JSON output part when there is no</text><text x="20" y="1035">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="1055">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="1075">                without the key does not match.</text><text x="20" y="1095">              type: string</text><text x="20" y="1115">              minLength: 2</text><text x="20" y="1135">              maxLength: 257</text><text x="20" y="1155">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="1175">            min:</text><text x="20" y="1195">              description: &gt;-</text><text x="20" y="1215">                Minimum number of MATCHING results (default 1). min 0 requires</text><text x="20" y="1235">            severity:</text><text x="20" y="1255">              type: string</text><text x="20" y="1275">              const: warn</text><text x="20" y="1295">          required:</text><text x="20" y="1315">            - type</text><text x="20" y="1335">            - ms</text><text x="20" y="1355">        - type: object</text></g></svg>
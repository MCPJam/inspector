<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1125"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.014031410217285156s — page 1</text><text x="20" y="75">            the value at that key in structuredContent (in the JSON output part</text><text x="20" y="95">            when there is no structuredContent). isError results are included. A</text><text x="20" y="115">            result whose text was truncated for storage (when path is omitted),</text><text x="20" y="135">            or whose subject exceeds 100000 characters, is unreadable; so are</text><text x="20" y="155">            results an incomplete capture did not record. A verdict they could</text><text x="20" y="175">            decide is unscored.</text><text x="20" y="195">          properties:</text><text x="20" y="215">            type:</text><text x="20" y="235">              type: string</text><text x="20" y="255">              const: toolResultMatches</text><text x="20" y="275">            toolName:</text><text x="20" y="295">              description: Omit to read every tool&#x27;s results.</text><text x="20" y="315">              type: string</text><text x="20" y="335">              minLength: 1</text><text x="20" y="355">            patterns:</text><text x="20" y="375">              description: &gt;-</text><text x="20" y="395">                Every pattern must match the same result. Use alternation (A|B)</text><text x="20" y="415">                inside one pattern for either.</text><text x="20" y="435">              minItems: 1</text><text x="20" y="455">              maxItems: 8</text><text x="20" y="475">              type: array</text><text x="20" y="495">              items:</text><text x="20" y="515">                type: string</text><text x="20" y="535">                minLength: 1</text><text x="20" y="555">                maxLength: 512</text><text x="20" y="575">            flags:</text><text x="20" y="595">              description: &gt;-</text><text x="20" y="615">                Applies to every pattern: i (ignore case), m (multiline), s (dot</text><text x="20" y="635">                matches newline).</text><text x="20" y="655">              type: string</text><text x="20" y="675">              enum:</text><text x="20" y="695">                - i</text><text x="20" y="715">                - m</text><text x="20" y="735">                - s</text><text x="20" y="755">                - im</text><text x="20" y="775">                - is</text><text x="20" y="795">                - ms</text><text x="20" y="815">                - ims</text><text x="20" y="835">            path:</text><text x="20" y="855">              description: &gt;-</text><text x="20" y="875">                JSON Pointer (RFC 6901) to ONE top-level key of</text><text x="20" y="895">                structuredContent (of the JSON output part when there is no</text><text x="20" y="915">                structuredContent), such as /elements; inside the key, ~1 stands</text><text x="20" y="935">                for / and ~0 for ~. Omit to match the whole result. A result</text><text x="20" y="955">                without the key does not match.</text><text x="20" y="975">              type: string</text><text x="20" y="995">              minLength: 2</text><text x="20" y="1015">              maxLength: 257</text><text x="20" y="1035">              pattern: ^\/(?:[^/~]|~[01])+$</text><text x="20" y="1055">            min:</text><text x="20" y="1075">              description: &gt;-</text><text x="20" y="1095">                Minimum number of MATCHING results (default 1). min 0 requires</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="765"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.0019178390502929688s — page 2</text><text x="20" y="75"></text><text x="20" y="95">An unreadable or missing path is a usage error and goes to stderr in the CLI&#x27;s</text><text x="20" y="115">standard error envelope rather than as findings — nothing was read, so there is</text><text x="20" y="135">nothing to report about.</text><text x="20" y="155"></text><text x="20" y="175">**What &quot;valid&quot; does not mean, without `--project`.** The offline check judges</text><text x="20" y="195">the file against the suite-file contract. It does **not** re-resolve tool names,</text><text x="20" y="215">server references or fixtures against a project&#x27;s live discovery, so a file that</text><text x="20" y="235">validates here can still fail to run.</text><text x="20" y="255"></text><text x="20" y="275">#### `--project`: resolving the names against a real project</text><text x="20" y="295"></text><text x="20" y="315">With `--project`, the command authenticates, resolves the named project, and</text><text x="20" y="335">checks every deterministic `toolCall` step against the live tool inventory of</text><text x="20" y="355">the targets the file would run on. Structural findings are unchanged and the</text><text x="20" y="375">live half is additive, under its own key:</text><text x="20" y="395"></text><text x="20" y="415">```jsonc theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="435">{</text><text x="20" y="455">  &quot;valid&quot;: false,</text><text x="20" y="475">  &quot;file&quot;: &quot;.mcpjam/evals/s_billing.yaml&quot;,</text><text x="20" y="495">  &quot;suite&quot;: { &quot;id&quot;: &quot;s_billing&quot;, &quot;name&quot;: &quot;Billing smoke&quot;, &quot;cases&quot;: 12, &quot;enabledCases&quot;: 11 },</text><text x="20" y="515">  &quot;findings&quot;: [],</text><text x="20" y="535">  &quot;projectValidation&quot;: {</text><text x="20" y="555">    &quot;project&quot;: { &quot;id&quot;: &quot;proj_123&quot;, &quot;name&quot;: &quot;Alpha&quot; },</text><text x="20" y="575">    &quot;targets&quot;: [&quot;environment prod&quot;],</text><text x="20" y="595">    &quot;valid&quot;: false,</text><text x="20" y="615">    &quot;findings&quot;: [</text><text x="20" y="635">      {</text><text x="20" y="655">        &quot;code&quot;: &quot;TOOL_REFERENCE_UNRESOLVED&quot;,   // or TOOL_DISCOVERY_UNAVAILABLE</text><text x="20" y="675">        &quot;path&quot;: [&quot;cases&quot;, 1, &quot;steps&quot;, 0, &quot;toolName&quot;],</text><text x="20" y="695">        &quot;pointer&quot;: &quot;cases[1].steps[0].toolName&quot;,</text><text x="20" y="715">        &quot;caseId&quot;: &quot;c_render_legacy&quot;,</text><text x="20" y="735">        &quot;caseTitle&quot;: &quot;Renders the leg</text></g></svg>
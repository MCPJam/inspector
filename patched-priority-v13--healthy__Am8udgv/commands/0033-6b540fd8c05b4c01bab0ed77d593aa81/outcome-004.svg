<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6b540fd8c05b4c01bab0ed77d593aa81 — page 4</text><text x="20" y="75">  &quot;file&quot;: &quot;.mcpjam/evals/s_billing.yaml&quot;,</text><text x="20" y="95">  &quot;suite&quot;: { &quot;id&quot;: &quot;s_billing&quot;, &quot;name&quot;: &quot;Billing smoke&quot;, &quot;cases&quot;: 12, &quot;enabledCases&quot;: 11 },</text><text x="20" y="115">  &quot;findings&quot;: []</text><text x="20" y="135">}</text><text x="20" y="155"></text><text x="20" y="175">// exit 1 or 2</text><text x="20" y="195">{</text><text x="20" y="215">  &quot;valid&quot;: false,</text><text x="20" y="235">  &quot;file&quot;: &quot;.mcpjam/evals/s_billing.yaml&quot;,</text><text x="20" y="255">  &quot;stage&quot;: &quot;contract&quot;,           // &quot;contract&quot; is exit 1; &quot;input&quot; and &quot;parse&quot; are exit 2</text><text x="20" y="275">  &quot;findings&quot;: [</text><text x="20" y="295">    {</text><text x="20" y="315">      &quot;code&quot;: &quot;SUITE_FILE_INVALID&quot;,   // or SUITE_FILE_TOO_LARGE / _EMPTY / _YAML_INVALID / _MULTIPLE_DOCUMENTS</text><text x="20" y="335">      &quot;path&quot;: [&quot;cases&quot;, 1, &quot;id&quot;],      // field path as segments</text><text x="20" y="355">      &quot;pointer&quot;: &quot;cases[1].id&quot;,        // the same path, rendered</text><text x="20" y="375">      &quot;message&quot;: &quot;duplicate case id \&quot;c_refund\&quot;&quot;</text><text x="20" y="395">      // `location` accompanies SUITE_FILE_YAML_INVALID findings only, where the</text><text x="20" y="415">      // YAML parser reported a position: { &quot;line&quot;: 24, &quot;column&quot;: 9 }</text><text x="20" y="435">    }</text><text x="20" y="455">  ]</text><text x="20" y="475">}</text><text x="20" y="495">```</text><text x="20" y="515"></text><text x="20" y="535">Findings are deterministically ordered and carry no timestamps, so two runs over</text><text x="20" y="555">the same bytes produce byte-identical output.</text><text x="20" y="575"></text><text x="20" y="595">An unreadable or missing path is a usage error and goes to stderr in the CLI&#x27;s</text><text x="20" y="615">standard error envelope rather than as findings — nothing was read, so there is</text><text x="20" y="635">nothing to report about.</text><text x="20" y="655"></text><text x="20" y="675">**What &quot;valid&quot; does not mean, without `--project`.** The offline check judges</text><text x="20" y="695">the file against the suite-file contract. It does **not** re-resolve tool names,</text><text x="20" y="715">server references or fixtures against a project&#x27;s live discovery, so a file that</text><text x="20" y="735">validates here can still fail to run.</text><text x="20" y="755"></text><text x="20" y="775">#### `--project`: resolving the names against a real project</text><text x="20" y="795"></text><text x="20" y="815">With `--project`, the command authenticates, resolves the named project, and</text><text x="20" y="835">checks every deterministic `toolCall` step against the live tool inventory of</text><text x="20" y="855">the targets the file would run on. Structural findings are unchanged and the</text><text x="20" y="875">live half is additive, under its own key:</text><text x="20" y="895"></text><text x="20" y="915">```jsonc theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="935">{</text><text x="20" y="955">  &quot;valid&quot;: false,</text><text x="20" y="975">  &quot;file&quot;: &quot;.mcpjam/evals/s_billing.yaml&quot;,</text><text x="20" y="995">  &quot;suite&quot;: { &quot;id&quot;: &quot;s_billing&quot;, &quot;name&quot;: &quot;Billing smoke&quot;, &quot;cases&quot;: 12, &quot;enabledCases&quot;: 11 },</text><text x="20" y="1015">  &quot;findings&quot;: [],</text><text x="20" y="1035">  &quot;projectValidation&quot;: {</text><text x="20" y="1055">    &quot;project&quot;: { &quot;id&quot;: &quot;proj_123&quot;, &quot;name&quot;: &quot;Alpha&quot; },</text><text x="20" y="1075">    &quot;targets&quot;: [&quot;environment prod&quot;],</text><text x="20" y="1095">    &quot;valid&quot;: false,</text><text x="20" y="1115">    &quot;findings&quot;: [</text><text x="20" y="1135">      {</text><text x="20" y="1155">        &quot;code&quot;: &quot;TOOL_REFERENCE_UNRESOLVED&quot;,   // or TOOL_DISCOVERY_UNAVAILABLE</text><text x="20" y="1175">        &quot;path&quot;: [&quot;cases&quot;, 1, &quot;steps&quot;, 0, &quot;toolName&quot;],</text><text x="20" y="1195">        &quot;pointer&quot;: &quot;cases[1].steps[0].toolName&quot;,</text><text x="20" y="1215">        &quot;caseId&quot;: &quot;c_render_legacy&quot;,</text><text x="20" y="1235">        &quot;caseTitle&quot;: &quot;Renders the legacy receipt&quot;,</text><text x="20" y="1255">        &quot;toolName&quot;: &quot;render_gone&quot;,</text><text x="20" y="1275">        &quot;serverName&quot;: &quot;billing&quot;,</text><text x="20" y="1295">        &quot;targetLabel&quot;: &quot;environment prod&quot;,</text><text x="20" y="1315">        &quot;disabled&quot;: true,</text><text x="20" y="1335">        &quot;imported&quot;: true,</text><text x="20" y="1355">        &quot;message&quot;: &quot;Server \&quot;billing\&quot; in environment prod exposes no tool named \&quot;render_gone\&quot;.&quot;</text></g></svg>
schemaVersion: "2"
mode: agentWorkflow
reportingMode: standard
suite:
  id: s_arithmetic_smoke
  name: Arithmetic smoke
target:
  servers:
    - name: Arithmetic
defaults:
  judge:
    enabled: false
  model: anthropic/claude-haiku-4.5
  iterations: 1
  passThreshold: 1
  validity: {}
cases:
  - id: c_add_2_3
    title: Adding 2 and 3 returns 5
    steps:
      - id: call_add
        kind: toolCall
        serverName: Arithmetic
        toolName: add
        arguments:
          a: 2
          b: 3
      - id: no_errors
        kind: assert
        assertion:
          type: noToolErrors
      - id: sum_is_five
        kind: assert
        assertion:
          type: toolResultContains
          toolName: add
          needle: '"sum": 5'

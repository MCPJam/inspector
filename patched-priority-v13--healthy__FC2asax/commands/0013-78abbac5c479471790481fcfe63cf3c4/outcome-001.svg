i/oauth-conformance.md) page.\n\n**Run evals:** The page says the CLI can run \&quot;MCPJam checks, probes, a</text><text x="20" y="1015">nd evals from the terminal.\&quot; Evals use test cases with expected tool calls, optional expected outputs, and deterministic checks, </text><text x="20" y="1035">and they can run across multiple LLMs. The page doesn&#x27;t give the CLI eval command itself. You can author cases in the [Inspector e</text><text x="20" y="1055">vals](https://docs.mcpjam.com/inspector/evals.md) docs, or run them programmatically with the [SDK](https://docs.mcpjam.com/sdk/co</text><text x="20" y="1075">ncepts/running-evals.md).\n\n**Gate CI:** The [CI integration](https://docs.mcpjam.com/cli/ci.md) page covers running checks and e</text><text x="20" y="1095">vals in GitHub Actions and other CI systems to block PRs that cause regressions.&quot;}]}, &quot;parent_tool_use_id&quot;: null, &quot;session_id&quot;: &quot;9</text><text x="20" y="1115">7596960-41ca-4fe0-ac96-5bcc2c5cd004&quot;, &quot;uuid&quot;: &quot;a845813c-d4ea-46bd-854d-7506974fc325&quot;, &quot;timestamp&quot;: &quot;2026-11-15T01:57:44.152Z&quot;, &quot;to</text><text x="20" y="1135">ol_use_result&quot;: {&quot;bytes&quot;: 7105, &quot;code&quot;: 200, &quot;codeText&quot;: &quot;OK&quot;, &quot;result&quot;: &quot;**Install:** Run `npm i -g @mcpjam/cli`. The page lists </text><text x="20" y="1155">this as the CLI install command.\n\n**Validate an MCP server:** The page says the CLI handles \&quot;Connectivity, OAuth, conformance, </text><text x="20" y="1175">and tool runs with JUnit/JSON output.\&quot; It tests local servers over STDIO with `--command` and over HTTP with `--url`. The page do</text><text x="20" y="1195">esn&#x27;t show the specific subcommands or full flag syntax, so check the [CLI overview](https://docs.mcpjam.com/cli/overview.md) for </text><text x="20" y="1215">those. For OAuth conformance, see the [CLI OAuth conformance](https://docs.mcpjam.com/cli/oauth-conformance.md) page.\n\n**Run eva</text><text x="20" y="1235">ls:** The page says the CLI can run \&quot;MCPJam checks, probes, and evals from the terminal.\&quot; Evals use test cases with expected too</text><text x="20" y="1255">l calls, optional expected outputs, and deterministic checks, and they can run across multiple LLMs. The page doesn&#x27;t give the CLI</text><text x="20" y="1275"> eval command itself. You can author cases in the [Inspector evals](https://docs.mcpjam.com/inspector/evals.md) docs, or run them </text><text x="20" y="1295">programmatically with the [SDK](https://docs.mcpjam.com/sdk/concepts/running-evals.md).\n\n**Gate CI:** The [CI integration](https</text><text x="20" y="1315">://docs.mcpjam.com/cli/ci.md) page covers running checks and evals in GitHub Actions and other CI systems to block PRs that cause </text><text x="20" y="1335">regressions.&quot;, &quot;durationMs&quot;: 6080, &quot;url&quot;: &quot;https://docs.mcpjam.com&quot;}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_01EahTyvm2i2bbG6kd6yY4er&quot;</text><text x="20" y="1355">, &quot;permission_decision&quot;: {&quot;decision&quot;: &quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text></g></svg>
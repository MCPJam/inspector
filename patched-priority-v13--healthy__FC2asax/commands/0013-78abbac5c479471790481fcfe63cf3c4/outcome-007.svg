<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">78abbac5c479471790481fcfe63cf3c4 — page 7</text><text x="20" y="75">cloud eval run --file` section covers how suite files are uploaded, not their step or assertion schema, and the page is truncated </text><text x="20" y="95">before any such section.\n\nThe parts it does cover:\n\n- **Versioning:** Suite files carry a `schemaVersion`, either `\&quot;1\&quot;` or `</text><text x="20" y="115">\&quot;2\&quot;`. The schema version is separate from the wire vocabulary the deployment uses.\n- **Vocabulary:** In vocabulary 1, cases use</text><text x="20" y="135"> `repetitions`, `iterations`, and `checks`. In vocabulary 2, they use `iterations`, `legacyIterations`, and `assertions`. The CLI </text><text x="20" y="155">picks the vocabulary by reading the deployment&#x27;s `GET /capabilities` response.\n- **Cases:** Each case needs an `id`. Setting `dis</text><text x="20" y="175">abled: true` keeps the case and its history but leaves it out of the launch. Removing a case from the file deletes it from the hos</text><text x="20" y="195">ted suite.\n- **Hosted limits:** A file with no enabled cases is refused. `defaults.toolPolicy` and non-empty `defaults.validity` </text><text x="20" y="215">gates are refused at hosted launch.\n- **Commands:** `mcpjam test &lt;file&gt;` runs a suite file locally, and `eval validate` checks a </text><text x="20" y="235">file without running it.\n\nFor the exact `toolCall` and assertion syntax, see the local evals guide at https://docs.mcpjam.com/cl</text><text x="20" y="255">i/local-evals.md, which the command reference links to. You can also check the rest of the full command reference, since the trunc</text><text x="20" y="275">ated section may include it.\n\n[WebFetch note: t
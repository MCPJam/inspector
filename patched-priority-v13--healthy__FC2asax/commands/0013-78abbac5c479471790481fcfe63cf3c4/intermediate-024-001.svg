is&quot;: &quot;list&quot;}, &quot;clau</text><text x="20" y="235">de-haiku-5-5&quot;: {&quot;inputTokens&quot;: 55777, &quot;outputTokens&quot;: 5886, &quot;cacheReadInputTokens&quot;: 0, &quot;cacheCreationInputTokens&quot;: 0, &quot;webSearchRe</text><text x="20" y="255">quests&quot;: 0, &quot;costUSD&quot;: 0.0085207, &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 2747, &quot;cacheCreationEphem</text><text x="20" y="275">eral5mInputTokens&quot;: 0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 0, &quot;canonicalModel&quot;: &quot;claude-haiku-5-5&quot;, &quot;provider&quot;: &quot;firstParty&quot;, &quot;</text><text x="20" y="295">costBasis&quot;: &quot;list&quot;}}, &quot;permission_denials&quot;: [], &quot;terminal_reason&quot;: &quot;completed&quot;, &quot;fast_mode_state&quot;: &quot;off&quot;, &quot;fast_mode_disabled_reas</text><text x="20" y="315">on&quot;: &quot;sdk_opt_in_required&quot;, &quot;subagent_stats&quot;: {&quot;spawned&quot;: 0, &quot;requested&quot;: {&quot;background&quot;: 0, &quot;foreground&quot;: 0, &quot;unset&quot;: 0}, &quot;started</text><text x="20" y="335">_in_background&quot;: 0, &quot;max_depth&quot;: 0, &quot;spawned_by_subagents&quot;: 0, &quot;completed&quot;: 0, &quot;failed&quot;: 0, &quot;killed&quot;: {&quot;parent&quot;: 0, &quot;user&quot;: 0, &quot;sy</text><text x="20" y="355">stem&quot;: 0}, &quot;refused&quot;: {&quot;depth_limit&quot;: 0, &quot;concurrency_limit&quot;: 0, &quot;budget&quot;: 0}, &quot;by_type&quot;: {}}, &quot;safety_stops&quot;: 0, &quot;is_error&quot;: fals</text><text x="20" y="375">e, &quot;num_turns&quot;: 19, &quot;subtype&quot;: &quot;success&quot;, &quot;api_error_status&quot;: null, &quot;result&quot;: &quot;MCPJam validated the server, and I turned the check</text><text x="20" y="395"> into a repeatable eval that ran and passed. The hosted run (`run_fixture_1`) reported 1 of 1 passed.\n\n**Validation.** I install</text><text x="20" y="415">ed the CLI with `npm i -g @mcpjam/cli`. `mcpjam server doctor --url http://fixture:8765/mcp` came back `ready` over streamable-htt</text><text x="20" y="435">p, with every check ok. The server exposes one tool, `add`, which takes numbers `a` and `b` and returns `{sum}`. It has no resourc</text><text x="20" y="455">es or prompts.\n\n**Eval.** The suite is `/workspace/.mcpjam/evals/add.yaml`. It has one case that calls `add` with 17 and 25 and </text><text x="20" y="475">asserts the tool was called. I ran it with `mcpjam cloud eval run --file .mcpjam/evals/add.yaml --project project_fixture`. The ru</text><text x="20" y="495">n and status output are saved in `/workspace/reports/`. The run notes say \&quot;SIMULATED: deterministic fixture execution; no hosted </text><text x="20" y="515">model or live billing.\&quot;\n\nTo re-run it, use the `eval run` command above, then `mcpjam cloud eval status --run &lt;id&gt; --project pr</text><text x="20" y="535">oject_fixture`. `mcpjam cloud eval validate --file …` checks the suite offline.\n\n**Concerns**\n- **Local run blocked.** `mcpjam </text><text x="20" y="555">test … --inference mcpjam` failed with `OPTIONS_INVALID`: the CLI requires an `https://` API URL and `MCPJAM_API_URL` is `http://f</text><text x="20" y="575">ixture:8765/api/v1`. I did not try to get around that check. I only ran the hosted path.\n- **Prompt-based eval refused.** My firs</text><text x="20" y="595">t suite used a model prompt, and the fixture refused it. It accepts only deterministic `toolCall` steps and a limited set of asser</text><text x="20" y="615">tions. So the passing case tests the tool directly, not whether a model chooses the tool.\n- **Docs gaps.** The docs I fetched did</text><text x="20" y="635"> not show the `toolCall` step syntax, which I had to work out from validation errors. Two things were required: a `serverName` on </text><text x="20" y="655">the step and `defaults.validity: {}`. `serverName` must match the saved server&#x27;s name in the project (`Arithmetic`, from `mcpjam c</text><text x="20" y="675">loud projects servers`), not the hostname.\n- **Weak assertion.** The only assertion I used checks that `add` was called. I did no</text><text x="20" y="695">t assert that the sum is 42, because I did not find the result-assertion syntax in the docs.&quot;, &quot;ttft_ms&quot;: 2005, &quot;type&quot;: &quot;result&quot;, </text><text x="20" y="715">&quot;duration_ms&quot;: 91049, &quot;uuid&quot;: &quot;2960af19-9a58-4ac1-b7af-06842d198450&quot;, &quot;ttft_stream_ms&quot;: 1378, &quot;time_to_request_ms&quot;: 40, &quot;first_con</text><text x="20" y="735">tent_frame_ms&quot;: 1378, &quot;queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTok</text><text x="20" y="755">ens&quot;: 34, &quot;outputTokens&quot;: 3990, &quot;cacheReadInputTokens&quot;: 391243, &quot;cacheCreationInputTokens&quot;: 11989, &quot;webSearchRequests&quot;: 0, &quot;costUS</text><text x="20" y="775">D&quot;: 0.1270483, &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 291, &quot;cacheCreationEphemeral5mInputTokens&quot;: </text><text x="20" y="795">0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 11989, &quot;canonicalModel&quot;: &quot;claude-sonnet-5-5&quot;, &quot;provider&quot;: &quot;firstParty&quot;, &quot;costBasis&quot;: &quot;li</text><text x="20" y="815">st&quot;}, &quot;claude-haiku-5-5&quot;: {&quot;inputTokens&quot;: 55777, &quot;outputTokens&quot;: 5886, &quot;cacheReadInputTokens&quot;: 0, &quot;cacheCreationInputTokens&quot;: 0, &quot;</text><text x="20" y="835">webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.0085207, &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 2747, &quot;cacheCr</text><text x="20" y="855">eationEphemeral5mInputTokens&quot;: 0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 0, &quot;canonicalModel&quot;: &quot;claude-haiku-5-5&quot;, &quot;provider&quot;: &quot;fir</text><text x="20" y="875">stParty&quot;, &quot;costBasis&quot;: &quot;list&quot;}}}</text></g></svg>
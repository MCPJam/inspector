<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.8109526634216309s — page 5</text><text x="20" y="75"></text><text x="20" y="95">`DO_NOT_TRACK`, `MCPJAM_TELEMETRY_DISABLED`, and CLI telemetry settings disable analytics, not the required run-start request. Res</text><text x="20" y="115">ults remain local unless result uploading is enabled separately.</text><text x="20" y="135"></text><text x="20" y="155">## Quick start</text><text x="20" y="175"></text><text x="20" y="195">### 1. Write a suite</text><text x="20" y="215"></text><text x="20" y="235">Save this as `.mcpjam/evals/example.yaml`:</text><text x="20" y="255"></text><text x="20" y="275">```yaml theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="295">schemaVersion: &quot;2&quot;</text><text x="20" y="315">mode: agentWorkflow</text><text x="20" y="335">reportingMode: standard</text><text x="20" y="355">suite:</text><text x="20" y="375">  id: s_notes_example</text><text x="20" y="395">  name: Notes server</text><text x="20" y="415">target:</text><text x="20" y="435">  servers:</text><text x="20" y="455">    - name: notes</text><text x="20" y="475">defaults:</text><text x="20" y="495">  judge:</text><text x="20" y="515">    enabled: false</text><text x="20" y="535">  model: anthropic/claude-haiku-4.5</text><text x="20" y="555">  iterations: 1</text><text x="20" y="575">  passThreshold: 1</text><text x="20" y="595">  validity: {}</text><text x="20" y="615">cases:</text><text x="20" y="635">  - id: c_reads_a_note</text><text x="20" y="655">    title: reads the note it was asked about</text><text x="20" y="675">    steps:</text><text x="20" y="695">      - id: s1</text><text x="20" y="715">        kind: prompt</text><text x="20" y="735">        prompt: What does note 7 say?</text><text x="20" y="755">      - id: a1</text><text x="20" y="775">        kind: assert</text><text x="20" y="795">        assertion:</text><text x="20" y="815">          type: toolCalledAtLeastOnce</text><text x="20" y="835">          toolName: read_note</text><text x="20" y="855">  - id: c_never_deletes</text><text x="20" y="875">    title: never deletes when only asked to read</text><text x="20" y="895">    steps:</text><text x="20" y="915">      - id: s1</text><text x="20" y="935">        kind: prompt</text><text x="20" y="955">        prompt: Summarize note 7.</text><text x="20" y="975">      - id: a1</text><text x="20" y="995">        kind: assert</text><text x="20" y="1015">        assertion:</text><text x="20" y="1035">          type: toolNeverCalled</text><text x="20" y="1055">          toolName: delete_note</text><text x="20" y="1075">```</text><text x="20" y="1095"></text><text x="20" y="1115">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="1135"></text><text x="20" y="1155">### 2. Configure the server</text><text x="20" y="1175"></text><text x="20" y="1195">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="1215">mmand:</text><text x="20" y="1235"></text><text x="20" y="1255">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1275">{</text><text x="20" y="1295">  &quot;mcpServers&quot;: {</text><text x="20" y="1315">    &quot;notes&quot;: {</text><text x="20" y="1335">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="1355">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text></g></svg>
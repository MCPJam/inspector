arameter.\&quot;\n    },\n    \&quot;cases\&quot;</text><text x="20" y="1315">: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;maxItems\&quot;: 100,\n      \&quot;items\&quot;: {\n        \&quot;$ref\&quot;: \&quot;#/compo</text><text x="20" y="1335">nents/schemas/EvalCaseCreateRequestV2\&quot;\n      }\n    },\n    \&quot;duplicatePolicy\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;enum\&quot;:</text><text x="20" y="1355"> [\n        \&quot;block\&quot;,\n        \&quot;warn\&quot;,\n        \&quot;create_anyway\&quot;\n      ],\n      \&quot;default\&quot;: \&quot;block\&quot;,\n      \&quot;description</text></g></svg>
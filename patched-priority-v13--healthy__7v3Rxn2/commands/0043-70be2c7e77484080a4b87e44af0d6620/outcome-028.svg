<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">70be2c7e77484080a4b87e44af0d6620 — page 28</text><text x="20" y="75">**, or **Host** chip above the form to open the **Next run** sheet. It separates two kinds of settings:\n\n* **Saved with this cas</text><text x="20" y="95">e**: *Trials* and *Model* are written to the case before every quick run and on Save. Changes here persist.\n* **For this run**: *</text><text x="20" y="115">Host* applies only to the next run and is not saved to the case.\n\nClick **Suite settings** in the sheet to configure hosts and o</text><text x="20" y="135">ther suite-level defaults.\n\n## Widget interactions\n\nIf your MCP server uses MCP Apps (widgets rendered in a sandboxed iframe),</text><text x="20" y="155"> a case can include `interact` steps: clicks and typing run against the live widget. Interact steps execute in the order they appe</text><text x="20" y="175">ar in the spine, and the runner stops at the first failure.\n\n### Widget `ui/message` follow-ups\n\nSome widget interactions send</text><text x="20" y="195"> a `ui/message` back to the host (for example, a cart button that says \&quot;Show my cart\&quot;) rather than calling a tool directly. Duri</text><text x="20" y="215">ng eval execution, these follow-up messages automatically drive a continuation model turn, the same way Playground handles them li</text><text x="20" y="235">ve. The resulting tool call (e.g. `view-cart`) is attributed to the same `interact` step&#x27;s turn, so a **Tool was called** assertio</text><text x="20" y="255">n on that turn sees the call.\n\nThis means an eval case can faithfully verify a full widget interaction sequence: prompt → widget</text><text x="20" y="275"> renders → user clicks → model reacts → tool fires → assertion passes.\n\n### What the trace shows\n\nThe Chat/Trace tab renders w</text><text x="20" y="295">idget tool calls as the same app-attributed cards you see in Playground, so you can inspect exactly what the widget returned and w</text><text x="20" y="315">hat the model did with it.\n\n* **JSON tool results**: Tool outputs that are JSON (including JSON wrapped in a text block) render </text><text x="20" y="335">as structured data in the card&#x27;s **Data** tab rather than as a raw text block. There is no duplicate result row below the card.\n*</text><text x="20" y="355"> **Frozen widget diagnostics**: When a widget was captured as a screenshot during the run, the card&#x27;s **Sandbox** tab shows the re</text><text x="20" y="375">corded policy: resource URI, CSP declaration, permissions, permissive mode, and any console errors or blocked requests logged duri</text><text x="20" y="395">ng that run. Live-only fields (sandbox attributes, lifecycle, view origin) show as **not recorded** because they are not available</text><text x="20" y="415"> after the run completes.\n{\&quot;project\&quot;:{\&quot;id\&quot;:\&quot;project_fixture\&quot;,\&quot;name\&quot;:\&quot;Fixture\&quot;,\&quot;sensitive_value\&quot;: \&quot;[REDACTED]\&quot;},\&quot;ca</text><text x="20" y="435">pabilities\&quot;:{\&quot;projectId\&quot;:\&quot;project_fixture\&quot;,\&quot;sensitive_value\&quot;: \&quot;[REDACTED]\&quot;,\&quot;role\&quot;:\&quot;owner\&quot;,\&quot;projectRole\&quot;:\&quot;owner\&quot;,\</text><text x="20" y="455">&quot;surface\&quot;:\&quot;cli\&quot;,\&quot;features\&quot;:{\&quot;sandboxes\&quot;:{\&quot;enabled\&quot;:false,\&quot;mode\&quot;:\&quot;off\&quot;,\&quot;enforced\&quot;:false}},\&quot;plan\&quot;:{\&quot;name\&quot;:\&quot;team\</text><text x="20" y="475">&quot;,\&quot;limits\&quot;:{},\&quot;features\&quot;:{}},\&quot;can\&quot;:{}}}\n/projects/{projectId}/eval-runs/{runId}/judge/backtest post\n/projects/{projectId}/</text><text x="20" y="495">eval-runs post\n/projects/{projectId}/eval-runs/{runId} get\n/projects/{projectId}/eval-runs/{runId}/decision-summary get\n/projec</text><text x="20" y="515">ts/{projectId}/eval-runs/{runId}/compare get\n/projects/{projectId}/eval-runs/{runId}/iterations get\n/projects/{projectId}/eval-r</text><text x="20" y="535">uns/{runId}/iterations/{iterationId}/trace get\n/projects/{projectId}/eval-runs/{runId}/iterations/{iterationId}/steps get\n/proje</text><text x="20" y="555">cts/{projectId}/eval-runs/{runId}/cancel post\n/projects/{projectId}/eval-runs/{runId}/rerun-preview get\n/projects/{projectId}/ev</text><text x="20" y="575">al-runs/{runId}/rerun post\n/projects/{projectId}/eval-suites/{suiteId}/runs get\n/projects/{projectId}/eval-suites/{suiteId}/revi</text><text x="20" y="595">sions get\n/projects/{projectId}/eval-suites/{suiteId}/stage-analytics get\n/projects/{projectId}/eval-runs/{runId}/stage-analytic</text><text x="20" y="615">s get\n/projects/{projectId}/eval-runs/{runId}/gate get\n/projects/{projectId}/eval-suites/{suiteId}/schedule patch\n/projects/{pr</text><text x="20" y="635">ojectId}/eval-suites/{suiteId}/environments post\n/projects/{projectId}/eval-suites get,post\n/projects/{projectId}/eval-suites/fr</text><text x="20" y="655">om-file post\n/projects/{projectId}/eval-suites/{suiteId} get,patch,delete\n/projects/{projectId}/eval-suites/{suiteId}/cases get,</text><text x="20" y="675">post\n/projects/{projectId}/eval-suites/{suiteId}/cases/batch post\n/projects/{projectId}/eval-suites/{suiteId}/cases/generate pos</text><text x="20" y="695">t\n/projects/{projectId}/eval-suites/{suiteId}/cases/import post\n/projects/{projectId}/eval-suites/{suiteId}/authoring/{jobId} ge</text><text x="20" y="715">t\n/projects/{projectId}/eval-suites/{suiteId}/authoring/{jobId}/commit post\n/projects/{projectId}/eval-suites/{suiteId}/cases/{c</text><text x="20" y="735">aseId} get,patch,delete\n/projects/{projectId}/eval-ingest/runs/evaluations post\n/projects/{projectId}/eval-ingest/runs
tions]        List a suite&#x27;s settings history, newest first\n  run [options]              Start an eval r</text><text x="20" y="835">un of an existing suite, or upload a\n                             versioned suite file and run it. The\n                         </text><text x="20" y="855">    upload-and-launch has a 120s deadline overall, not\n                             per request (raise it with the global --timeo</text><text x="20" y="875">ut\n                             &lt;ms&gt;); --wait-timeout bounds the RUN instead.\n  status [options]           Get the status and su</text><text x="20" y="895">mmary of an eval run\n  stage-analytics [options]  Read the user-value chain funnel for one run\n                             (--r</text><text x="20" y="915">un) or a suite&#x27;s runs as a trend series\n                             (--suite)\n  route-facts [options]      Read the tool routes</text><text x="20" y="935"> a run&#x27;s trials took — which\n                             paths were used, and which expected tools were\n                       </text><text x="20" y="955">      missing or substituted\n  server-facts [options]     Read the server a run was taken against — tool\n                       </text><text x="20" y="975">      surface, catalog size, annotation coverage,\n                             tool-metadata signals, and what connect and\n     </text><text x="20" y="995">                        discovery observed\n  description-experiment     Propose, start, or read a two-arm tool-description\n     </text><text x="20" y="1015">                        rewrite experiment\n  cancel [options]           Cancel an in-flight eval run (no-op if already\n         </text><text x="20" y="1035">                    cancelled; errors if it already finished)\n  rerun [options] &lt;run-id&gt;   Rerun a finished eval run&#x27;s failed cas</text><text x="20" y="1055">es as a new\n                             run. The platform picks the cases: any with a trial\n                             that d</text><text x="20" y="1075">id not complete and pass (cancelled and\n                             skipped trials do not count)\n  judge-backtest [options]   P</text><text x="20" y="1095">review draft grading instructions on recorded\n                             evidence (uses credits)\n  backtest [options]         </text><text x="20" y="1115">Preview assertion changes on stored evidence\n                             without changing results\n  judge [options]            </text><text x="20" y="1135">Grade a finished eval run with LLM as Judge (SPENDS\n                             your model budget)\n  github                    </text><text x="20" y="1155"> Run an eval suite on a GitHub repository&#x27;s pull\n                             requests (GitHub checks)\n  checks                 </text><text x="20" y="1175">    Deprecated alias for `cloud eval github` — a\n                             repository&#x27;s GitHub checks, not a case&#x27;s grading\n </text><text x="20" y="1195">                            checks\n  iterations [options]       List per-iteration results for an eval run\n                     </text><text x="20" y="1215">        (pass/fail, tool calls, tokens, latency)\n  gate [options]             Apply a pass/fail policy to a finished eval run and</text><text x="20" y="1235">\n                             set an exit code (0 pass or waived, 1 eval failure,\n                             2 usage, 3 incomp</text><text x="20" y="1255">lete)\n  compare [options]          Compare a finished eval run against a baseline and\n                             set an exit c</text><text x="20" y="1275">ode (0 pass, 1 regression, 2 usage, 3\n                             incomplete)\n  validate [options]         Validate a local eva</text><text x="20" y="1295">l suite file offline — no auth,\n                             no network unless --project is passed (0 valid, 1\n                 </text><text x="20" y="1315">            contract-invalid or unresolved reference, 2\n                             unreadable/oversize/malformed)\n  export [op</text><text x="20" y="1335">tions]           Write a hosted eval suite to a local suite file,\n                             refusing anything it cannot repres</text><text x="20" y="1355">ent losslessly\n  pull [options]             LEGACY: materialize a hosted eval suite into a\n                             corpus l</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">70be2c7e77484080a4b87e44af0d6620 — page 45</text><text x="20" y="75">         \&quot;additionalProperties\&quot;: true\n        },\n        \&quot;predicates\&quot;: {\n          \&quot;type\&quot;: \&quot;object\&quot;,\n          \&quot;depre</text><text x="20" y="95">cated\&quot;: true,\n          \&quot;description\&quot;: \&quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here all a</text><text x="20" y="115">long and never written down, passing only because this schema allowed unknown properties; documented rather than removed so no cal</text><text x="20" y="135">ler already sending it breaks. Send one or the other, never both.\&quot;,\n          \&quot;properties\&quot;: {\n            \&quot;mode\&quot;: {\n      </text><text x="20" y="155">        \&quot;type\&quot;: \&quot;string\&quot;,\n              \&quot;enum\&quot;: [\n                \&quot;inherit\&quot;,\n                \&quot;replace\&quot;,\n            </text><text x="20" y="175">    \&quot;extend\&quot;\n              ]\n            },\n            \&quot;list\&quot;: {\n              \&quot;type\&quot;: \&quot;array\&quot;,\n              \&quot;item</text><text x="20" y="195">s\&quot;: {\n                \&quot;type\&quot;: \&quot;object\&quot;\n              }\n            }\n          }\n        },\n        \&quot;isNegative\&quot;: {\n</text><text x="20" y="215">          \&quot;type\&quot;: \&quot;boolean\&quot;,\n          \&quot;description\&quot;: \&quot;Alias for `isNegativeTest`: the public case-authoring spelling this</text><text x="20" y="235"> API returns on a read. Send one or the other, never both.\&quot;\n        },\n        \&quot;iterations\&quot;: {\n          \&quot;type\&q
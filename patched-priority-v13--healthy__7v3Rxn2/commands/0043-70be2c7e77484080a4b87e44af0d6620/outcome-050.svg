quot;targets\&quot;:[{\&quot;status\&quot;:\&quot;started\&quot;,\&quot;environment\&quot;:null,\&quot;runId\&quot;:\&quot;run_fixture_3\&quot;,\&quot;runStatus\&quot;:\&quot;running\&quot;,\&quot;server</text><text x="20" y="635">s\&quot;:[{\&quot;id\&quot;:\&quot;server_fixture\&quot;,\&quot;name\&quot;:\&quot;Arithmetic\&quot;}]}],\&quot;runId\&quot;:\&quot;run_fixture_3\&quot;,\&quot;status\&quot;:\&quot;running\&quot;,\&quot;servers\&quot;:[{\&quot;id\</text><text x="20" y="655">&quot;:\&quot;server_fixture\&quot;,\&quot;name\&quot;:\&quot;Arithmetic\&quot;}],\&quot;environment\&quot;:null},\&quot;runs\&quot;:[{\&quot;id\&quot;:\&quot;run_fixture_3\&quot;,\&quot;suiteId\&quot;:\&quot;suite_autho</text><text x="20" y="675">red_1\&quot;,\&quot;runNumber\&quot;:3,\&quot;status\&quot;:\&quot;completed\&quot;,\&quot;result\&quot;:\&quot;passed\&quot;,\&quot;summary\&quot;:{\&quot;total\&quot;:1,\&quot;passed\&quot;:1,\&quot;failed\&quot;:0,\&quot;passRa</text><text x="20" y="695">te\&quot;:1},\&quot;source\&quot;:\&quot;api\&quot;,\&quot;notes\&quot;:\&quot;SIMULATED: deterministic fixture execution; no hosted model or live billing.\&quot;,\&quot;createdAt\</text><text x="20" y="715">&quot;:1794708665248,\&quot;completedAt\&quot;:1794708665248}],\&quot;decisionSummary\&quot;:{\&quot;schemaVersion\&quot;:1,\&quot;runId\&quot;:\&quot;run_fixture_3\&quot;,\&quot;runStatus\&quot;</text><text x="20" y="735">:\&quot;completed\&quot;,\&quot;diagnostics\&quot;:{\&quot;items\&quot;:[],\&quot;complete\&quot;:true,\&quot;scannedIterations\&quot;:1},\&quot;verdict\&quot;:\&quot;passed\&quot;,\&quot;verdictSource\&quot;:\</text><text x="20" y="755">&quot;legacy\&quot;,\&quot;counts\&quot;:{\&quot;measurementUnit\&quot;:\&quot;trial\&quot;,\&quot;total\&quot;:1,\&quot;passed\&quot;:1,\&quot;failed\&quot;:0}}}\n{ &#x27;@mcpjam/cli&#x27;: &#x27;6.2.2&#x27; }\n&quot;, &quot;exit</text><text x="20" y="775">_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="795">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_37&quot;, &quot;type&quot;: &quot;agent_message&quot;, &quot;text&quot;: &quot;The rerun script passed again. A separate c</text><text x="20" y="815">ontrol expecting `43` failed with exit code `1`, confirming that the result assertion can reject an incorrect answer. The saved it</text><text x="20" y="835">eration evidence records inputs `17` and `25` and output `{\&quot;sum\&quot;:42}`.\n&quot;}}</text><text x="20" y="855">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_38&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc \&quot;cat &gt; /workspace/READM</text><text x="20" y="875">E.md &lt;&lt;&#x27;EOF&#x27;\n# MCPJam arithmetic validation\n\nInstalled \&quot;&#x27;`@mcpjam/cli` 6.2.2 locally with an exact dependency and package lock</text><text x="20" y="895">.\nOnly public documentation, CLI help, and normal product endpoints were used.\n\n## Reproduce\n\nFrom `/workspace`, with the tri</text><text x="20" y="915">al account&#x27;\&quot;&#x27;s \&quot;&#x27;`MCPJAM_API_URL` and `MCPJAM_API_KEY` in the environment:\n\n```bash\nnpm ci\n./run-eval.sh\n```\n\nThe script </text><text x="20" y="935">validates `arithmetic.eval.json`, syncs the file-owned suite in\n`project_fixture`, runs it to completion, and saves `reports/eval</text><text x="20" y="955">.json` and\n`reports/launch.json`. Exit 0 means passed; exit 1 means a completed failed\nverdict. Other nonzero codes indicate set</text><text x="20" y="975">up/auth/usage/incomplete execution.\nEach invocation starts a new evaluation; a lost launch response can be retried\nusing the pri</text><text x="20" y="995">nted idempotency key with the CLI&#x27;\&quot;&#x27;s \&quot;&#x27;`--idempotency-key` flag.\nNo credentials are saved in these files.\n\n## Results\n\n- `</text><text x="20" y="1015">doctor.json`: ready; Streamable HTTP; MCP 2025-11-25; no OAuth required.\n- `tools.json`: one tool, `add`, with numeric `a` and `b</text><text x="20" y="1035">` inputs.\n- `first-result.json`: direct call with 17 and 25 returned structured sum 42.\n- `arithmetic.eval.json`: deterministic </text><text x="20" y="1055">toolCall followed by a required\n  `toolResultContains` assertion for `42`. The server is the saved project\n  server `Arithmetic`</text><text x="20" y="1075"> (`server_fixture`).\n- `reports/iterations.json`: first passing evaluation&#x27;\&quot;&#x27;s actual arguments and\n  tool result (\&quot;&#x27;`structur</text><text x="20" y="1095">edContent.sum = 42`).\n- `reports/eval.json`: latest passing run, `run_fixture_3`, one passed trial.\n- `reports/negative-control.</text><text x="20" y="1115">json`: separate suite expecting `43`,\n  `run_fixture_2`, one failed trial; CLI exited 1 as expected.\n- `reports/validation.json`</text><text x="20" y="1135">: final suite passes file and live reference validation.\n\nThe positive suite was run successfully twice (`run_fixture_1` and\n`r</text><text x="20" y="1155">un_fixture_3`). The run receipts explicitly describe execution as SIMULATED:\ndeterministic trial execution, no hosted model or li</text><text x="20" y="1175">ve billing. This validates\nthe arithmetic tool and the supported evaluation path; it does not measure\nmodel tool selection or fu</text><text x="20" y="1195">ll MCP protocol conformance. The substring assertion\nchecks for `42`, not exact JSON equality.\n\n## Trial limitations encountere</text><text x="20" y="1215">d\n\n1. `toolCalledWith.args` requires the documented nested `{ \&quot;args\&quot;: {...} }`\n   matcher. The validator initially reported o</text><text x="20" y="1235">nly `Invalid input`.\n2. The account refused hosted prompt/model execution without a charge.\n3. A direct-call suite with the rich</text><text x="20" y="1255">er assertion set was also refused with a\n   generic supported-subset error. Reducing to `toolResultContains` succeeded.\n4. The d</text><text x="20" y="1275">ocumented per-iteration steps endpoint returned NOT_FOUND (route not\n   implemented). The iteration listing supplied the actual c</text><text x="20" y="1295">all/output evidence.\n\nNo billing purchases or contact with production billing were made.\n\n## Public documentation used\n\n- ht</text><text x="20" y="1315">tps://docs.mcpjam.com\n- https://docs.mcpjam.com/llms.txt\n- https://docs.mcpjam.com/cli/overview\n- https://docs.mcpjam.com/cli/r</text><text x="20" y="1335">eference\n- https://docs.mcpjam.com/cli/local-evals\n- https://docs.mcpjam.com/inspector/evals\n- https://docs.mcpjam.com/referenc</text><text x="20" y="1355">e/public-api\n- https://docs.mcpjam.com/reference/openapi.json\n\nThe OpenAPI schema documents deterministic `toolCall` steps. The</text></g></svg>
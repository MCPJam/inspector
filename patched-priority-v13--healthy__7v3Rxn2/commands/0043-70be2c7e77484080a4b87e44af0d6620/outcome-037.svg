 su</text><text x="20" y="1035">ite setting.\&quot;\n    },\n    \&quot;declaredSuiteId\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;maxLength\&quot;: 128,\n      \&quot;description\&quot;:</text><text x="20" y="1055"> \&quot;The suite file&#x27;s own `suite.id`, when THIS request is a suite-file sync.\\n\\nA CI-owned suite (see `EvalSuiteDetail.managedBy`</text><text x="20" y="1075">) refuses configuration writes with `409` and `details.reason: \\\&quot;CI_OWNED_SUITE_READ_ONLY\\\&quot;`. Naming the suite&#x27;s own declared </text><text x="20" y="1095">id is how the file writing itself is allowed through: the platform permits the write only when the id matches, so naming any other</text><text x="20" y="1115"> id refuses exactly as loudly as naming none. Omit it for ordinary edits.\\n\\nPREFER THE `declaredSuiteId` QUERY PARAMETER on thi</text><text x="20" y="1135">s route. This body field still works here, but these request bodies are strict on every Inspector that predates the CI-owned lock,</text><text x="20" y="1155"> so a body field is a `400` against an older deployment while an unknown query parameter is simply ignored. The MCPJam SDK and CLI</text><text x="20" y="1175"> send the query parameter.\&quot;\n    },\n    \&quot;title\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;,\n      \&quot;minLength\&quot;: 1\n    },\n    \&quot;steps\&quot;</text><text x="20" y="1195">: {\n      \&quot;type\&quot;: \&quot;array\&quot;,\n      \&quot;minItems\&quot;: 1,\n      \&quot;items\&quot;: {\n        \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalTestStep</text><text x="20" y="1215">\&quot;\n      },\n      \&quot;description\&quot;: \&quot;REPLACES the case&#x27;s test definition wholesale when provided.\&quot;\n    },\n    \&quot;expectedOutpu</text><text x="20" y="1235">t\&quot;: {\n      \&quot;type\&quot;: \&quot;string\&quot;\n    },\n    \&quot;iterations\&quot;: {\n      \&quot;type\&quot;: \&quot;integer\&quot;,\n 
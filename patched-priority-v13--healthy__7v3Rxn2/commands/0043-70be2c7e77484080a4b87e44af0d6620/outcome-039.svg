           \&quot;description\&quot;: \&quot;Per-case CHECK gate: the grading rules this case is scored </text><text x="20" y="1115">against. `mode` says how they combine with the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appen</text><text x="20" y="1135">ds `list` to the suite&#x27;s. Same field, same shape and same name as `checks` on the eval-case routes, so authoring a suite and then </text><text x="20" y="1155">editing one of its cases is one word for one concept. Send this or the deprecated `predicates`, never both.\&quot;,\n            \&quot;prop</text><text x="20" y="1175">erties\&quot;: {\n              \&quot;mode\&quot;: {\n                \&quot;type\&quot;: \&quot;string\&quot;,\n                \&quot;enum\&quot;: [\n                  \&quot;in</text><text x="20" y="1195">herit\&quot;,\n                  \&quot;replace\&quot;,\n                  \&quot;extend\&quot;\n                ]\n              },\n              \&quot;list\</text><text x="20" y="1215">&quot;: {\n                \&quot;type\&quot;: \&quot;array\&quot;,\n                \&quot;items\&quot;: {\n                  \&quot;$ref\&quot;: \&quot;#/components/schemas/EvalA</text><text x="20" y="1235">ssertion\&quot;\n                }\n              }\n            }\n          },\n          \&quot;suppressedSuiteStandardCheckIds\&quot;: {\n   </text><text x="20" y="1255">         \&quot;$ref\&quot;: \&quot;#/components/schemas/SuppressedSuiteStandardCheckIds\&quot;,\n            \&quot;type\&quot;: \&quot;array\&quot;,\n            \&quot;item</text><text x="20" y="1275">s\&quot;: {\n              \&quot;type\&quot;: \&quot;string\&quot;\n            }\n          }\n        },\n        \&quot;additionalProperties\&quot;: false\n     </text><text x="20" y="1295"> }\n    }\n  },\n  \&quot;additionalProperties\&quot;: false\n}\nEvalRunCreateRequest {\n  \&quot;type\&quot;: \&quot;object\&quot;,\n  \&quot;description\&quot;: \&quot;Two v</text><tex
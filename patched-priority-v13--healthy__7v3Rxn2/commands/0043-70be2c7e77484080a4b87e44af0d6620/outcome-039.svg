<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">70be2c7e77484080a4b87e44af0d6620 — page 39</text><text x="20" y="75">n (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluator can act on, and REJECT</text><text x="20" y="95">ED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and would silently make the gat</text><text x="20" y="115">e unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suite/run floor is not.\&quot;,\n</text><text x="20" y="135">      \&quot;properties\&quot;: {\n        \&quot;minimumPassRatePercent\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\n          \&quot;minimum\&quot;: 0,\n      </text><text x="20" y="155">    \&quot;maximum\&quot;: 100,\n          \&quot;description\&quot;: \&quot;A percent in [0, 100]. The whole range is usable, sub-1 values included: the u</text><text x="20" y="175">nit is in the field name, so nothing is ambiguous.\&quot;\n        },\n        \&quot;minimumPassRate\&quot;: {\n          \&quot;type\&quot;: \&quot;number\&quot;,\</text><text x="20" y="195">n          \&quot;minimum\&quot;: 0,\n          \&quot;maximum\&quot;: 100,\n          \&quot;deprecated\&quot;: true,\n          \&quot;description\&quot;: \&quot;Deprecated </text><text x="20" y="215">alias for `minimumPassRatePercent`, same unit. A value in (0, 1) is REJECTED here (it reads as a fraction sent by mistake), which </text><text x="20" y="235">is what the `not` below expresses. Use `minimumPassRatePercent` for a genuine sub-1% floor.\&quot;,\n          \&quot;not\&quot;: {\n            </text><text x="20" y="255">\&quot;exclusiveMinimum\&quot;: 0,\n            \&quot;exclusi
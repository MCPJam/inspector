ive\&quot;,\n     </text><text x="20" y="475">           \&quot;isNegativeTest\&quot;\n              ]\n            }\n          },\n          {\n            \&quot;not\&quot;: {\n              \&quot;</text><text x="20" y="495">required\&quot;: [\n                \&quot;checks\&quot;,\n                \&quot;predicates\&quot;\n              ]\n            }\n          }\n        ]</text><text x="20" y="515">,\n        \&quot;properties\&quot;: {\n          \&quot;title\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;minLength\&quot;: 1\n          }</text><text x="20" y="535">,\n          \&quot;steps\&quot;: {\n            \&quot;type\&quot;: \&quot;array\&quot;,\n            \&quot;minItems\&quot;: 1,\n            \&quot;description\&quot;: \&quot;Ordered </text><text x="20" y="555">test steps (the unified test model). The first `prompt` step is the case query; `toolCalledWith` asserts are the expected tool cal</text><text x="20" y="575">ls; a single model-free `toolCall` step is a render-check.\&quot;,\n            \&quot;items\&quot;: {\n              \&quot;$ref\&quot;: \&quot;#/components/sc</text><text x="20" y="595">hemas/EvalTestStep\&quot;\n            }\n          },\n          \&quot;runs\&quot;: {\n            \&quot;type\&quot;: \&quot;integer\&quot;,\n            \&quot;minimu</text><text x="20" y="615">m\&quot;: 1,\n            \&quot;maximum\&quot;: 10,\n            \&quot;description\&quot;: \&quot;Iterations to execute for this case. Defaults to 1.\&quot;\n     </text><text x="20" y="635">     },\n          \&quot;model\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;description\&quot;: \&quot;Per-case model override. Defaul</text><text x="20" y="655">ts to the suite-level `model`.\&quot;\n          },\n          \&quot;provider\&quot;: {\n            \&quot;type\&quot;: \&quot;string\&quot;,\n            \&quot;descri</text><text x="20" y="675">ption\&quot;: \&quot;Per-case
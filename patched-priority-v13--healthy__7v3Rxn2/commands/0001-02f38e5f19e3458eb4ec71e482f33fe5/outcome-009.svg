<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">02f38e5f19e3458eb4ec71e482f33fe5 — page 9</text><text x="20" y="75">      ]</text><text x="20" y="95">    },</text><text x="20" y="115">    &quot;severity&quot;: {</text><text x="20" y="135">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="155">      &quot;const&quot;: &quot;warn&quot;</text><text x="20" y="175">    }</text><text x="20" y="195">  },</text><text x="20" y="215">  &quot;required&quot;: [</text><text x="20" y="235">    &quot;type&quot;,</text><text x="20" y="255">    &quot;toolName&quot;,</text><text x="20" y="275">    &quot;args&quot;</text><text x="20" y="295">  ]</text><text x="20" y="315">}</text><text x="20" y="335">{</text><text x="20" y="355">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="375">  &quot;description&quot;: &quot;A tool result in scope (every result, or only toolName&#x27;s) whose content matches EVERY pattern (all within one re</text><text x="20" y="395">sult) occurred at least min (default 1) and at most max times. min and max count MATCHING results, not all results: min 0, max 0 m</text><text x="20" y="415">eans no result matches. The content is the result&#x27;s text, then structuredContent, then its JSON output part (JSON as canonical JSO</text><text x="20" y="435">N), or, with path, the value at that key in structuredContent (in the JSON output part when there is no structuredContent). isErro</text><text x="20" y="455">r results are included. A result whose text was truncated for storage (when path is omitted), or whose subject exceeds 100000 char</text><text x="20" y="475">acters, is unreadable; so are results an incomplete capture did not record. A verdict they could decide is unscored.&quot;,</text><text x="20" y="495">  &quot;properties&quot;: {</text><text x="20" y="515">    &quot;type&quot;: {</text><text x="20" y="535">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="555">      &quot;const&quot;: &quot;toolResultMatches&quot;</text><text x="20" y="575">    },</text><text x="20" y="595">    &quot;toolName&quot;: {</text><text x="20" y="615">      &quot;description&quot;: &quot;Omit to read every tool&#x27;s results.&quot;,</text><text x="20" y="635">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="655">      &quot;minLength&quot;: 1</text><text x="20" y="675">    },</text><text x="20" y="695">    &quot;patterns&quot;: {</text><text x="20" y="715">      &quot;description&quot;: &quot;Every pattern must match the same result. Use alternation (A|B) inside one pattern for either.&quot;,</text><text x="20" y="735">      &quot;minItems&quot;: 1,</text><text x="20" y="755">      &quot;maxItems&quot;: 8,</text><text x="20" y="775">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="795">      &quot;items&quot;: {</text><text x="20" y="815">        &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="835">        &quot;minLength&quot;: 1,</text><text x="20" y="855">        &quot;maxLength&quot;: 512</text><text x="20" y="875">      }</text><text x="20" y="895">    },</text><text x="20" y="915">    &quot;flags&quot;: {</text><text x="20" y="935">      &quot;description&quot;: &quot;Applies to every pattern: i (ignore case), m (multiline), s (dot matches newline).&quot;,</text><text x="20" y="955">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="975">      &quot;enum&quot;: [</text><text x="20" y="995">        &quot;i&quot;,</text><text x="20" y="1015">        &quot;m&quot;,</text><text x="20" y="1035">        &quot;s&quot;,</text><text x="20" y="1055">        &quot;im&quot;,</text><text x="20" y="1075">        &quot;is&quot;,</text><text x="20" y="1095">        &quot;ms&quot;,</text><text x="20" y="1115">        &quot;ims&quot;</text><text x="20" y="1135">      ]</text><text x="20" y="1155">    },</text><text x="20" y="1175">    &quot;path&quot;: {</text><text x="20" y="1195">      &quot;description&quot;: &quot;JSON Pointer (RFC 6901) to ONE top-level key of structuredContent (of the JSON output part when there is no </text><text x="20" y="1215">structuredContent), such as /elements; inside the key, ~1 stands for / and ~0 for ~. Omit to match the whole result. A result with</text><text x="20" y="1235">out the key does not match.&quot;,</text><text x="20" y="1255">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1275">      &quot;minLength&quot;: 2,</text><text x="20" y="1295">      &quot;maxLength&quot;: 257,</text><text x="20" y="1315">      &quot;pattern&quot;: &quot;^\\/(?:[^/~]|~[01])+$&quot;</text><text x="20" y="1335">    },</text><text x="20" y="1355">    &quot;min&quot;: {</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.027308940887451172s — page 1</text><text x="20" y="75">{</text><text x="20" y="95">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="115">  &quot;description&quot;: &quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user message (model turn); </text><text x="20" y="135">`toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an assertion (a `Predicate`</text><text x="20" y="155"> like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).&quot;,</text><text x="20" y="175">  &quot;required&quot;: [</text><text x="20" y="195">    &quot;id&quot;,</text><text x="20" y="215">    &quot;kind&quot;</text><text x="20" y="235">  ],</text><text x="20" y="255">  &quot;properties&quot;: {</text><text x="20" y="275">    &quot;id&quot;: {</text><text x="20" y="295">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="315">      &quot;minLength&quot;: 1</text><text x="20" y="335">    },</text><text x="20" y="355">    &quot;kind&quot;: {</text><text x="20" y="375">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="395">      &quot;enum&quot;: [</text><text x="20" y="415">        &quot;prompt&quot;,</text><text x="20" y="435">        &quot;toolCall&quot;,</text><text x="20" y="455">        &quot;interact&quot;,</text><text x="20" y="475">        &quot;assert&quot;</text><text x="20" y="495">      ]</text><text x="20" y="515">    },</text><text x="20" y="535">    &quot;prompt&quot;: {</text><text x="20" y="555">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="575">      &quot;description&quot;: &quot;User message (`kind: prompt`).&quot;</text><text x="20" y="595">    },</text><text x="20" y="615">    &quot;serverName&quot;: {</text><text x="20" y="635">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="655">      &quot;description&quot;: &quot;Server that owns the tool (`kind: toolCall`).&quot;</text><text x="20" y="675">    },</text><text x="20" y="695">    &quot;toolName&quot;: {</text><text x="20" y="715">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="735">      &quot;description&quot;: &quot;Tool name (`kind: toolCall` / `interact`).&quot;</text><text x="20" y="755">    },</text><text x="20" y="775">    &quot;arguments&quot;: {</text><text x="20" y="795">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="815">      &quot;description&quot;: &quot;Tool-call arguments (`kind: toolCall`).&quot;,</text><text x="20" y="835">      &quot;additionalProperties&quot;: true</text><text x="20" y="855">    },</text><text x="20" y="875">    &quot;action&quot;: {</text><text x="20" y="895">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="915">      &quot;description&quot;: &quot;Widget action (`kind: interact`).&quot;,</text><text x="20" y="935">      &quot;additionalProperties&quot;: true</text><text x="20" y="955">    },</text><text x="20" y="975">    &quot;assertion&quot;: {</text><text x="20" y="995">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1015">      &quot;description&quot;: &quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `Wi</text><text x="20" y="1035">dgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is evaluated</text><text x="20" y="1055"> against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated agai</text><text x="20" y="1075">nst a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.&quot;,</text><text x="20" y="1095">      &quot;additionalProperties&quot;: true</text><text x="20" y="1115">    }</text><text x="20" y="1135">  },</text><text x="20" y="1155">  &quot;additionalProperties&quot;: true</text><text x="20" y="1175">}</text><text x="20" y="1195">CREATE required [&#x27;name&#x27;, &#x27;serverIds&#x27;, &#x27;model&#x27;, &#x27;tests&#x27;]</text><text x="20" y="1215">{</text><text x="20" y="1235">  &quot;name&quot;: {</text><text x="20" y="1255">    &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1275">    &quot;minLength&quot;: 1,</text><text x="20" y="1295">    &quot;description&quot;: &quot;Suite name.&quot;</text><text x="20" y="1315">  },</text><text x="20" y="1335">  &quot;serverIds&quot;: {</text><text x="20" y="1355">    &quot;type&quot;: &quot;array&quot;,</text></g></svg>
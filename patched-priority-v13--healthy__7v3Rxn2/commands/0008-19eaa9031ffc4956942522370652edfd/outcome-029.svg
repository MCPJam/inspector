<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">19eaa9031ffc4956942522370652edfd — page 29</text><text x="20" y="75">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="95">      &quot;enum&quot;: [</text><text x="20" y="115">        &quot;block&quot;,</text><text x="20" y="135">        &quot;warn&quot;,</text><text x="20" y="155">        &quot;create_anyway&quot;</text><text x="20" y="175">      ],</text><text x="20" y="195">      &quot;default&quot;: &quot;block&quot;,</text><text x="20" y="215">      &quot;description&quot;: &quot;What to do with a case whose definition already matches one in the suite. An unrecognized value coerces to `</text><text x="20" y="235">block` and reports the coercion in the response&#x27;s `duplicatePolicy` rather than failing the call.&quot;</text><text x="20" y="255">    },</text><text x="20" y="275">    &quot;overrideReason&quot;: {</text><text x="20" y="295">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="315">      &quot;minLength&quot;: 1,</text><text x="20" y="335">      &quot;description&quot;: &quot;Required by `warn` and `create_anyway`. Recorded on the case&#x27;s revision.&quot;</text><text x="20" y="355">    }</text><text x="20" y="375">  },</text><text x="20" y="395">  &quot;additionalProperties&quot;: false</text><text x="20" y="415">}</text><text x="20" y="435">EvalCasesBatchResult {</text><text x="20" y="455">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="475">  &quot;required&quot;: [</text><text x="20" y="495">    &quot;created&quot;,</text><text x="20" y="515">    &quot;failed&quot;,</text><text x="20" y="535">    &quot;duplicatePolicy&quot;</text><text x="20" y="555">  ],</text><text x="20" y="575">  &quot;description&quot;: &quot;A partial outcome by design: the cases in `created` were written even when `failed` is non-empty. Both arrays ca</text><text x="20" y="595">rry the `index` of the request entry they describe.&quot;,</text><text x="20" y="615">  &quot;properties&quot;: {</text><text x="20" y="635">    &quot;created&quot;: {</text><text x="20" y="655">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="675">      &quot;items&quot;: {</text><text x="20" y="695">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="715">        &quot;required&quot;: [</text><text x="20" y="735">          &quot;index&quot;,</text><text x="20" y="755">          &quot;id&quot;,</text><text x="20" y="775">          &quot;title&quot;,</text><text x="20" y="795">          &quot;replayed&quot;</text><text x="20" y="815">        ],</text><text x="20" y="835">        &quot;properties&quot;: {</text><text x="20" y="855">          &quot;index&quot;: {</text><text x="20" y="875">            &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="895">            &quot;description&quot;: &quot;Position in the request&#x27;s `cases` array.&quot;</text><text x="20" y="915">          },</text><text x="20" y="935">          &quot;id&quot;: {</text><text x="20" y="955">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="975">            &quot;description&quot;: &quot;Platform case id: the path parameter for the per-case routes.&quot;</text><text x="20" y="995">          },</text><text x="20" y="1015">          &quot;declaredId&quot;: {</text><text x="20" y="1035">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1055">            &quot;description&quot;: &quot;The effective declared id. On a replay this is the stored case&#x27;s, not the one just sent.&quot;</text><text x="20" y="1075">          },</text><text x="20" y="1095">          &quot;title&quot;: {</text><text x="20" y="1115">            &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1135">    
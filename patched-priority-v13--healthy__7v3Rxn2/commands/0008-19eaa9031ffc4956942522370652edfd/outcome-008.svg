<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">19eaa9031ffc4956942522370652edfd — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;python3 - &lt;&lt;&#x27;&quot;&#x27;&quot;&#x27;PY&#x27;&quot;&#x27;&quot;&#x27;</text><text x="20" y="175">import json</text><text x="20" y="195">s=json.load(open(&#x27;&quot;&#x27;&quot;&#x27;openapi.json&#x27;&quot;&#x27;&quot;&#x27;))[&#x27;&quot;&#x27;&quot;&#x27;components&#x27;&quot;&#x27;&quot;&#x27;][&#x27;&quot;&#x27;&quot;&#x27;schemas&#x27;&quot;&#x27;&quot;&#x27;]</text><text x="20" y="215">for n in s:</text><text x="20" y="235"> if any(t in n for t in [&#x27;&quot;&#x27;&quot;&#x27;Step&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;EvalSuiteCreateRequest&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;EvalCase&#x27;&quot;&#x27;&quot;&#x27;,&#x27;&quot;&#x27;&quot;&#x27;EvalRunCreate&#x27;&quot;&#x27;&quot;&#x27;]):</text><text x="20" y="255">  print(n,json.dumps(s[n],indent=2)[:16000])</text><text x="20" y="275">PY&#x27;</text><text x="20" y="295">EvalCaseV2 {</text><text x="20" y="315">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="335">  &quot;required&quot;: [</text><text x="20" y="355">    &quot;id&quot;,</text><text x="20" y="375">    &quot;title&quot;,</text><text x="20" y="395">    &quot;steps&quot;,</text><text x="20" y="415">    &quot;legacyIterations&quot;,</text><text x="20" y="435">    &quot;isNegative&quot;,</text><text x="20" y="455">    &quot;models&quot;</text><text x="20" y="475">  ],</text><text x="20" y="495">  &quot;description&quot;: &quot;`EvalCase` as projected under `x-mcpjam-eval-vocabulary: 2`: the legacy floor is `legacyIterations`, the exact p</text><text x="20" y="515">olicy-2 count is `iterations`, the rule override is `assertions`. Every other field is as in `EvalCase`, in the same position.&quot;,</text><text x="20" y="535">  &quot;properties&quot;: {</text><text x="20" y="555">    &quot;judge&quot;: {</text><text x="20" y="575">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="595">      &quot;additionalProperties&quot;: false,</text><text x="20" y="615">      &quot;properties&quot;: {</text><text x="20" y="635">        &quot;enabled&quot;: {</text><text x="20" y="655">          &quot;type&quot;: &quot;boolean&quot;</text><text x="20" y="675">        }</text><text x="20" y="695">      },</text><text x="20" y="715">      &quot;description&quot;: &quot;Per-case judge override. enabled: false skips goal-completion grading for this case.&quot;</text><text x="20" y="735">    },</text><text x="20" y="755">    &quot;id&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="795">    },</text><text x="20" y="815">    &quot;declaredId&quot;: {</text><text x="20" y="835">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="855">      &quot;description&quot;: &quot;The case&#x27;s effective declared id. Absent on cases authored before declared identity existed.&quot;</text><text x="20" y="875">    },</text><text x="20" y="895">    &quot;title&quot;: {</text><text x="20" y="915">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="935">    },</text><text x="20" y="955">    &quot;steps&quot;: {</text><text x="20" y="975">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="995">      &quot;minItems&quot;: 1,</text><text x="20" y="1015">      &quot;items&quot;: {</text><text x="20" y="1035">        &quot;$ref&quot;: &quot;#/components/schemas/EvalTestStep&quot;</text><text x="20" y="1055">      },</text><text x="20" y="1075">      &quot;description&quot;: &quot;Ordered test steps. A `prompt` step is a model turn; a single model-free `toolCall` step is a render-check; </text><text x="20" y="1095">`assert` steps hold the expectations.&quot;</text><text x="20" y="1115">    },</text><text x="20" y="1135">    &quot;expectedOutput&quot;: {</text><text x="20" y="1155">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1175">    },</text><text x="20" y="1195">    &quot;legacyIterations&quot;: {</text><text x="20" y="1215">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1235">      &quot;minimum&quot;: 1,</text><text x="20" y="1255">      &quot;maximum&quot;: 10,</text><text x="20" y="1275">      &quot;description&quot;: &quot;The legacy per-case count, which the legacy resolver reads as a FLOOR (`max(legacyIterations, suite.minimumI</text><text x="20" y="1295">terations)`). Stored as `runs`. Vocabulary 1 spells this field `iterations`; under `x-mcpjam-eval-vocabulary: 2` that key is the e</text><text x="20" y="1315">xact configured count, so the floor answers to this name (legacy spelling `runs`). NOT the same field as `iterations`: the two are</text><text x="20" y="1335"> never a both-spellings pair, and a PATCH that names neither leaves the stored floor exactly as it was.&quot;</text><text x="20" y="1355">    },</text></g></svg>
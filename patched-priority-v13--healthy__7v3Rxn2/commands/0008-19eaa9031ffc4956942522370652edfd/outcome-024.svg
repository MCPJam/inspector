<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">19eaa9031ffc4956942522370652edfd — page 24</text><text x="20" y="75">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="95">      }</text><text x="20" y="115">    }</text><text x="20" y="135">  }</text><text x="20" y="155">}</text><text x="20" y="175">EvalCaseSource {</text><text x="20" y="195">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="215">  &quot;description&quot;: &quot;Where an AI-assisted Markdown case was authored from. Provenance only: the file, its hash, and the line range th</text><text x="20" y="235">e extractor read, so a reader can trace a case back to its source document. It is not an import claim (see `EvalCaseImportClaim`) </text><text x="20" y="255">and carries no approval semantics.&quot;,</text><text x="20" y="275">  &quot;required&quot;: [</text><text x="20" y="295">    &quot;format&quot;,</text><text x="20" y="315">    &quot;method&quot;,</text><text x="20" y="335">    &quot;fileName&quot;,</text><text x="20" y="355">    &quot;fileHash&quot;,</text><text x="20" y="375">    &quot;excerpt&quot;,</text><text x="20" y="395">    &quot;startLine&quot;,</text><text x="20" y="415">    &quot;endLine&quot;,</text><text x="20" y="435">    &quot;extractorVersion&quot;</text><text x="20" y="455">  ],</text><text x="20" y="475">  &quot;additionalProperties&quot;: false,</text><text x="20" y="495">  &quot;properties&quot;: {</text><text x="20" y="515">    &quot;format&quot;: {</text><text x="20" y="535">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="555">      &quot;enum&quot;: [</text><text x="20" y="575">        &quot;markdown&quot;</text><text x="20" y="595">      ]</text><text x="20" y="615">    },</text><text x="20" y="635">    &quot;method&quot;: {</text><text x="20" y="655">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="675">      &quot;enum&quot;: [</text><text x="20" y="695">        &quot;ai&quot;</text><text x="20" y="715">      ],</text><text x="20" y="735">      &quot;description&quot;: &quot;How the case was derived from the document. `ai`: an extractor model proposed it and a person reviewed it be</text><text x="20" y="755">fore it was saved.&quot;</text><text x="20" y="775">    },</text><text x="20" y="795">    &quot;fileName&quot;: {</text><text x="20" y="815">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="835">      &quot;minLength&quot;: 1,</text><text x="20" y="855">      &quot;maxLength&quot;: 255</text><text x="20" y="875">    },</text><text x="20" y="895">    &quot;fileHash&quot;: {</text><text x="20" y="915">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="935">      &quot;pattern&quot;: &quot;^[a-f0-9]{64}$&quot;,</text><text x="20" y="955">      &quot;description&quot;: &quot;SHA-256 of the source document, lowercase hex.&quot;</text><text x="20" y="975">    },</text><text x="20" y="995">    &quot;excerpt&quot;: {</text><text x="20" y="1015">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1035">      &quot;minLength&quot;: 1,</text><text x="20" y="1055">      &quot;maxLength&quot;: 102400,</text><text x="20" y="1075">      &quot;description&quot;: &quot;The passage the case was extracted from.&quot;</text><text x="20" y="1095">    },</text><text x="20" y="1115">    &quot;startLine&quot;: {</text><text x="20" y="1135">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1155">      &quot;minimum&quot;: 1</text><text x="20" y="1175">    },</text><text x="20" y="1195">    &quot;endLine&quot;: {</text><text x="20" y="1215">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1235">      &quot;minimum&quot;: 1,</text><text x="20" y="1255">      &quot;description&quot;: &quot;Inclusive; never less than `startLine`.&quot;</text><text x="20" y="1275">    },</text><text x="20" y="1295">    &quot;extractorVersion&quot;: {</text><text x="20" y="1315">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1335">      &quot;minLength&quot;: 1,</text><text x="20" y="1355">      &quot;maxLength&quot;: 100</text></g></svg>
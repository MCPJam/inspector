<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">19eaa9031ffc4956942522370652edfd — page 39</text><text x="20" y="75">      &quot;items&quot;: {</text><text x="20" y="95">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="115">      }</text><text x="20" y="135">    },</text><text x="20" y="155">    &quot;serverNames&quot;: {</text><text x="20" y="175">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="195">      &quot;description&quot;: &quot;Optional display names, parallel to `serverIds`.&quot;,</text><text x="20" y="215">      &quot;items&quot;: {</text><text x="20" y="235">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="255">      }</text><text x="20" y="275">    },</text><text x="20" y="295">    &quot;hosts&quot;: {</text><text x="20" y="315">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="335">      &quot;description&quot;: &quot;Clients (hosts) to attach the suite to, in attach order. A suite with no attached client reports none wherev</text><text x="20" y="355">er it is listed, and a run has no host to select. Same shape as the PATCH `hosts` field.&quot;,</text><text x="20" y="375">      &quot;items&quot;: {</text><text x="20" y="395">        &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="415">        &quot;required&quot;: [</text><text x="20" y="435">          &quot;host&quot;</text><text x="20" y="455">        ],</text><text x="20" y="475">        &quot;properties&quot;: {</text><text x="20" y="495">          &quot;host&quot;: {</text><text x="20" y="515">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="535">            &quot;minLength&quot;: 1,</text><text x="20" y="555">            &quot;description&quot;: &quot;Host name or id.&quot;</text><text x="20" y="575">          },</text><text x="20" y="595">          &quot;servers&quot;: {</text><text x="20" y="615">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="635">            &quot;items&quot;: {</text><text x="20" y="655">              &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="675">              &quot;minLength&quot;: 1</text><text x="20" y="695">            },</text><text x="20" y="715">            &quot;description&quot;: &quot;Server names (as bound in the suite&#x27;s environment) or project-server ids.&quot;</text><text x="20" y="735">          }</text><text x="20" y="755">        }</text><text x="20" y="775">      }</text><text x="20" y="795">    },</text><text x="20" y="815">    &quot;model&quot;: {</text><text x="20" y="835">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="855">      &quot;minLength&quot;: 1,</text><text x="20" y="875">      &quot;description&quot;: &quot;Suite-level default model id (e.g. `anthropic/claude-haiku-4.5`). Used for any test that omits `model`.&quot;</text><text x="20" y="895">    },</text><text x="20" y="915">    &quot;provider&quot;: {</text><text x="20" y="935">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="955">      &quot;description&quot;: &quot;Optional suite-level default provider. When omitted, the provider is derived from a `provider/model` id.&quot;</text><text x="20" y="975">    },</text><text x="20" y="995">    &quot;passCriteria&quot;: {</text><text x="20" y="1015">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1035">      &quot;description&quot;: &quot;The floor a run must clear, as a PERCENT in [0, 100]: 80 means 80%. `minimumPassRatePercent` is the canonica</text><text x="20" y="1055">l spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGUATES T</text><text x="20" y="1075">HE UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluator can </text><text x="20" y="1095">act on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and would sil</text><text x="20" y="1115">ently make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suite/run </text><text x="20" y="1135">floor is not.&quot;,</text><text x="20" y="1155">      &quot;properties&quot;: {</text><text x="20" y="1175">        &quot;minimumPassRatePercent&quot;: {</text><text x="20" y="1195">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="1215">          &quot;minimum&quot;: 0,</text><text x="20" y="1235">          &quot;maximum&quot;: 100,</text><text x="20" y="1255">          &quot;description&quot;: &quot;A percent in [0, 100]. The whole range is usable, sub-1 values included: the unit is in the field name, </text><text x="20" y="1275">so nothing is ambiguous.&quot;</text><text x="20" y="1295">        },</text><text x="20" y="1315">        &quot;minimumPassRate&quot;: {</text><text x="20" y="1335">          &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="1355">          &quot;minimum&quot;: 0,</text></g></svg>
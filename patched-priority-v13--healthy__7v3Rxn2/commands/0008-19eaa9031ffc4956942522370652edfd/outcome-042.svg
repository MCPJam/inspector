<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">19eaa9031ffc4956942522370652edfd — page 42</text><text x="20" y="75">            &quot;description&quot;: &quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here all along and never wr</text><text x="20" y="95">itten down, passing only because this schema allowed unknown properties; documented rather than removed so no caller already sendi</text><text x="20" y="115">ng it breaks. Send one or the other, never both.&quot;,</text><text x="20" y="135">            &quot;properties&quot;: {</text><text x="20" y="155">              &quot;mode&quot;: {</text><text x="20" y="175">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="195">                &quot;enum&quot;: [</text><text x="20" y="215">                  &quot;inherit&quot;,</text><text x="20" y="235">                  &quot;replace&quot;,</text><text x="20" y="255">                  &quot;extend&quot;</text><text x="20" y="275">                ]</text><text x="20" y="295">              },</text><text x="20" y="315">              &quot;list&quot;: {</text><text x="20" y="335">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="355">                &quot;items&quot;: {</text><text x="20" y="375">                  &quot;type&quot;: &quot;object&quot;</text><text x="20" y="395">                }</text><text x="20" y="415">              }</text><text x="20" y="435">            }</text><text x="20" y="455">          },</text><text x="20" y="475">          &quot;isNegative&quot;: {</text><text x="20" y="495">            &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="515">            &quot;description&quot;: &quot;Alias for `isNegativeTest`: the public case-authoring spelling this API returns on a read. Send one or</text><text x="20" y="535"> the other, never both.&quot;</text><text x="20" y="555">          },</text><text x="20" y="575">          &quot;iterations&quot;: {</text><text x="20" y="595">            &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="615">            &quot;minimum&quot;: 1,</text><text x="20" y="635">            &quot;maximum&quot;: 10,</text><text x="20" y="655">            &quot;description&quot;: &quot;Alias for `runs`. Send one or the other, never both.&quot;</text><text x="20" y="675">          },</text><text x="20" y="695">          &quot;checks&quot;: {</text><text x="20" y="715">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="735">            &quot;description&quot;: &quot;Per-case CHECK gate: the grading rules this case is scored against. `mode` says how they combine with </text><text x="20" y="755">the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field, same </text><text x="20" y="775">shape and same name as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word for on</text><text x="20" y="795">e concept. Send this or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="815">            &quot;properties&quot;: {</text><text x="20" y="835">              &quot;mode&quot;: {</text><text x="20" y="855">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="875">                &quot;enum&quot;: [</text><text x="20" y="895">                  &quot;inherit&quot;,</text><text x="20" y="915">                  &quot;replace&quot;,</text><text x="20" y="935">                  &quot;extend&quot;</text><text x="20" y="955">                ]</text><text x="20" y="975">              },</text><text x="20" y="995">              &quot;list&quot;: {</text><text x="20" y="1015">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1035">                &quot;items&quot;: {</text><text x="20" y="1055">                  &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="1075">                }</text><text x="20" y="1095">              }</text><text x="20" y="1115">            }</text><text x="20" y="1135">          },</text><text x="20" y="1155">          &quot;suppressedSuiteStandardCheckIds&quot;: {</text><text x="20" y="1175">            &quot;$ref&quot;: &quot;#/components/schemas/SuppressedSuiteStandardCheckIds&quot;,</text><text x="20" y="1195">            &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1215">            &quot;items&quot;: {</text><text x="20" y="1235">              &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1255">            }</text><text x="20" y="1275">          }</text><text x="20" y="1295">        },</text><text x="20" y="1315">        &quot;additionalProperties&quot;: false</text><text x="20" y="1335">      }</text><text x="20" y="1355">    }</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.02770709991455078s — page 12</text><text x="20" y="75">        ]</text><text x="20" y="95">      }</text><text x="20" y="115">    },</text><text x="20" y="135">    {</text><text x="20" y="155">      &quot;not&quot;: {</text><text x="20" y="175">        &quot;required&quot;: [</text><text x="20" y="195">          &quot;iterations&quot;,</text><text x="20" y="215">          &quot;repetitions&quot;</text><text x="20" y="235">        ]</text><text x="20" y="255">      }</text><text x="20" y="275">    },</text><text x="20" y="295">    {</text><text x="20" y="315">      &quot;not&quot;: {</text><text x="20" y="335">        &quot;required&quot;: [</text><text x="20" y="355">          &quot;assertions&quot;,</text><text x="20" y="375">          &quot;checks&quot;</text><text x="20" y="395">        ]</text><text x="20" y="415">      }</text><text x="20" y="435">    },</text><text x="20" y="455">    {</text><text x="20" y="475">      &quot;not&quot;: {</text><text x="20" y="495">        &quot;required&quot;: [</text><text x="20" y="515">          &quot;assertions&quot;,</text><text x="20" y="535">          &quot;predicates&quot;</text><text x="20" y="555">        ]</text><text x="20" y="575">      }</text><text x="20" y="595">    },</text><text x="20" y="615">    {</text><text x="20" y="635">      &quot;not&quot;: {</text><text x="20" y="655">        &quot;required&quot;: [</text><text x="20" y="675">          &quot;checks&quot;,</text><text x="20" y="695">          &quot;predicates&quot;</text><text x="20" y="715">        ]</text><text x="20" y="735">      }</text><text x="20" y="755">    }</text><text x="20" y="775">  ]</text><text x="20" y="795">}</text><text x="20" y="815">EvalCasesBatchCreateRequestV2 {</text><text x="20" y="835">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="855">  &quot;required&quot;: [</text><text x="20" y="875">    &quot;cases&quot;</text><text x="20" y="895">  ],</text><text x="20" y="915">  &quot;description&quot;: &quot;Author several cases in one call. Each entry takes the same fields as a single create. The 100-case cap is delib</text><text x="20" y="935">erately smaller than a suite file&#x27;s 500-case limit, so a maximal file uploads in several calls. Vocabulary 2: each item is an `Eva</text><text x="20" y="955">lCaseCreateRequestV2`.&quot;,</text><text x="20" y="975">  &quot;properties&quot;: {</text><text x="20" y="995">    &quot;declaredSuiteId&quot;: {</text><text x="20" y="1015">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1035">      &quot;maxLength&quot;: 128,</text><text x="20" y="1055">      &quot;description&quot;: &quot;The suite file&#x27;s own `suite.id`, when THIS request is a suite-file sync.\n\nA CI-owned suite (see `EvalSuite</text><text x="20" y="1075">Detail.managedBy`) refuses configuration writes with `409` and `details.reason: \&quot;CI_OWNED_SUITE_READ_ONLY\&quot;`. Naming the suite&#x27;s </text><text x="20" y="1095">own declared id is how the file writing itself is allowed through: the platform permits the write only when the id matches, so nam</text><text x="20" y="1115">ing any other id refuses exactly as loudly as naming none. Omit it for ordinary edits.\n\nPREFER THE `declaredSuiteId` QUERY PARAM</text><text x="20" y="1135">ETER on this route. This body field still works here, but these request bodies are strict on every Inspector that predates the CI-</text><text x="20" y="1155">owned lock, so a body field is a `400` against an older deployment while an unknown query parameter is simply ignored. The MCPJam </text><text x="20" y="1175">SDK and CLI send the query parameter.&quot;</text><text x="20" y="1195">    },</text><text x="20" y="1215">    &quot;cases&quot;: {</text><text x="20" y="1235">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1255">      &quot;minItems&quot;: 1,</text><text x="20" y="1275">      &quot;maxItems&quot;: 100,</text><text x="20" y="1295">      &quot;items&quot;: {</text><text x="20" y="1315">        &quot;$ref&quot;: &quot;#/components/schemas/EvalCaseCreateRequestV2&quot;</text><text x="20" y="1335">      }</text><text x="20" y="1355">    },</text></g></svg>
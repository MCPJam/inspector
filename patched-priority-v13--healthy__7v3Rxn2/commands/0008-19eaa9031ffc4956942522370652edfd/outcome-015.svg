<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">19eaa9031ffc4956942522370652edfd — page 15</text><text x="20" y="75">    },</text><text x="20" y="95">    {</text><text x="20" y="115">      &quot;not&quot;: {</text><text x="20" y="135">        &quot;required&quot;: [</text><text x="20" y="155">          &quot;assertions&quot;,</text><text x="20" y="175">          &quot;predicates&quot;</text><text x="20" y="195">        ]</text><text x="20" y="215">      }</text><text x="20" y="235">    },</text><text x="20" y="255">    {</text><text x="20" y="275">      &quot;not&quot;: {</text><text x="20" y="295">        &quot;required&quot;: [</text><text x="20" y="315">          &quot;checks&quot;,</text><text x="20" y="335">          &quot;predicates&quot;</text><text x="20" y="355">        ]</text><text x="20" y="375">      }</text><text x="20" y="395">    }</text><text x="20" y="415">  ]</text><text x="20" y="435">}</text><text x="20" y="455">EvalCaseUpdateRequestV2 {</text><text x="20" y="475">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="495">  &quot;description&quot;: &quot;Partial update. Every field is optional; omitted fields are left as they are. `steps` REPLACES the definition ra</text><text x="20" y="515">ther than merging into it. Vocabulary 2 (`x-mcpjam-eval-vocabulary: 2`): same spellings as `EvalCaseCreateRequestV2`; two spelling</text><text x="20" y="535">s of one field is a `400`. A PATCH that names neither spelling of the floor leaves the stored floor exactly as it was.&quot;,</text><text x="20" y="555">  &quot;properties&quot;: {</text><text x="20" y="575">    &quot;judge&quot;: {</text><text x="20" y="595">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="615">      &quot;additionalProperties&quot;: false,</text><text x="20" y="635">      &quot;properties&quot;: {</text><text x="20" y="655">        &quot;enabled&quot;: {</text><text x="20" y="675">          &quot;type&quot;: &quot;boolean&quot;</text><text x="20" y="695">        }</text><text x="20" y="715">      },</text><text x="20" y="735">      &quot;nullable&quot;: true,</text><text x="20" y="755">      &quot;description&quot;: &quot;Per-case judge override. enabled: false skips goal-completion grading for this case; null clears the overrid</text><text x="20" y="775">e and restores the suite setting.&quot;</text><text x="20" y="795">    },</text><text x="20" y="815">    &quot;declaredSuiteId&quot;: {</text><text x="20" y="835">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="855">      &quot;maxLength&quot;: 128,</text><text x="20" y="875">      &quot;description&quot;: &quot;The suite file&#x27;s own `suite.id`, when THIS request is a suite-file sync.\n\nA CI-owned suite (see `EvalSuite</text><text x="20" y="895">Detail.managedBy`) refuses configuration writes with `409` and `details.reason: \&quot;CI_OWNED_SUITE_READ_ONLY\&quot;`. Naming the suite&#x27;s </text><text x="20" y="915">own declared id is how the file writing itself is allowed through: the platform permits the write only when the id matches, so nam</text><text x="20" y="935">ing any other id refuses exactly as loudly as naming none. Omit it for ordinary edits.\n\nPREFER THE `declaredSuiteId` QUERY PARAM</text><text x="20" y="955">ETER on this route. This body field still works here, but these request bodies are strict on every Inspector that predates the CI-</text><text x="20" y="975">owned lock, so a body field is a `400` against an older deployment while an unknown query parameter is simply ignored. The MCPJam </text><text x="20" y="995">SDK and CLI send the query parameter.&quot;</text><text x="20" y="1015">    },</text><text x="20" y="1035">    &quot;title&quot;: {</text><text x="20" y="1055">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1075">      &quot;minLength&quot;: 1</text><text x="20" y="1095">    },</text><text x="20" y="1115">    &quot;steps&quot;: {</text><text x="20" y="1135">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1155">      &quot;minItems&quot;: 1,</text><text x="20" y="1175">      &quot;items&quot;: {</text><text x="20" y="1195">        &quot;$ref&quot;: &quot;#/components/schemas/EvalTestStep&quot;</text><text x="20" y="1215">      },</text><text x="20" y="1235">      &quot;description&quot;: &quot;REPLACES the case&#x27;s test definition wholesale when provided.&quot;</text><text x="20" y="1255">    },</text><text x="20" y="1275">    &quot;expectedOutput&quot;: {</text><text x="20" y="1295">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1315">    },</text><text x="20" y="1335">    &quot;legacyIterations&quot;: {</text><text x="20" y="1355">      &quot;type&quot;: &quot;integer&quot;,</text></g></svg>
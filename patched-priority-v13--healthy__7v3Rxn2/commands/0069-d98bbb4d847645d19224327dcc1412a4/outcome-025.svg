<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d98bbb4d847645d19224327dcc1412a4 — page 25</text><text x="20" y="75">one when the server has none, and keeps its old body and its old</text><text x="20" y="95">`{ imported, expiresAt }` answer. Every answer carries `Deprecation: true`, a</text><text x="20" y="115">`Sunset` date and a `Link` to `.../accounts`.</text><text x="20" y="135"></text><text x="20" y="155">An account this route creates is hosted-only. An existing default it writes</text><text x="20" y="175">into keeps whatever rule it had. Its `serverUrl` must be the URL saved in the</text><text x="20" y="195">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="215">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="235">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="255"></text><text x="20" y="275">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="295">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="315"></text><text x="20" y="335">## Run evals from the API</text><text x="20" y="355"></text><text x="20" y="375">The shortest useful loop: create a run with one inline test, then poll:</text><text x="20" y="395"></text><text x="20" y="415">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="435"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="455">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="475">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="495">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="515">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="535">  -d &#x27;{</text><text x="20" y="555">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="575">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="595">    &quot;tests&quot;: [{</text><text x="20" y="615">      &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="635">      &quot;runs&quot;: 1,</text><text x="20" y="655">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="675">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="695">      &quot;steps&quot;: [</text><text x="20" y="715">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="735">        {</text><text x="20" y="755">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="775">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="795">          &quot;assertion&quot;: {</text><text x="20" y="815">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="835">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="855">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="875">          }</text><text x="20" y="895">        }</text><text x="20" y="915">      ]</text><text x="20" y="935">    }]</text><text x="20" y="955">  }&#x27; | jq -er .runId)</text><text x="20" y="975"></text><text x="20" y="995"># 2. Poll until status is completed | failed | cancelled | timed_out</text><text x="20" y="1015">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID&quot; \</text><text x="20" y="1035">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1055"></text><text x="20" y="1075"># 3. If it did not pass, read the decision summary FIRST</text><text x="20" y="1095">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/decision-summary&quot; \</text><text x="20" y="1115">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1135"></text><text x="20" y="1155"># 4. Or go straight to per-iteration tool calls, token usage, latency</text><text x="20" y="1175">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/iterations&quot; \</text><text x="20" y="1195">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1215">```</text><text x="20" y="1235"></text><text x="20" y="1255">The decision summary composes steps 2 and 4 into one versioned object so every</text><text x="20" y="1275">client reads a run the same way. Four things to know before gating on it:</text><text x="20" y="1295"></text><text x="20" y="1315">* **`measurementUnit` ships with every count.** Under per-case grading the</text><text x="20" y="1335">  counts are case-execution *variants*, with iterations as trials inside them;</text><text x="20" y="1355">  under a suite-wide accuracy threshold they are trials. The same suite reports</text></g></svg>
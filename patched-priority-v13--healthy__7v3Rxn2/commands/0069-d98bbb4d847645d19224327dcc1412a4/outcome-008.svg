<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d98bbb4d847645d19224327dcc1412a4 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;curl -fsSL https://docs.mcpjam.com/cli/overview.md -o /workspace/cli-overview.md &amp;&amp; curl -fsSL https://docs.m</text><text x="20" y="175">cpjam.com/reference/public-api.md -o /workspace/public-api.md &amp;&amp; curl -fsSL https://docs.mcpjam.com/cli/local-evals.md -o /workspa</text><text x="20" y="195">ce/local-evals.md &amp;&amp; cat /workspace/cli-overview.md /workspace/public-api.md /workspace/local-evals.md&#x27;</text><text x="20" y="215">&gt; ## Documentation Index</text><text x="20" y="235">&gt; Fetch the complete documentation index at: https://docs.mcpjam.com/llms.txt</text><text x="20" y="255">&gt; Use this file to discover all available pages before exploring further.</text><text x="20" y="275"></text><text x="20" y="295"># CLI Overview</text><text x="20" y="315"></text><text x="20" y="335">&gt; Local MCP testing and mcpjam cloud: probing, debugging, OAuth, conformance, and hosted evals from your terminal</text><text x="20" y="355"></text><text x="20" y="375">The `mcpjam` CLI is two invocations. Local MCP testing stays at the top level: inspect, debug, and test MCP servers from the comma</text><text x="20" y="395">nd line or CI (connectivity, OAuth, MCP Apps, tools/resources/prompts, protocol conformance). Most local commands are one-shot; `m</text><text x="20" y="415">cpjam mcp` and `subscriptions listen` keep a process open. Account-bound commands live under `mcpjam cloud` and talk to your MCPJa</text><text x="20" y="435">m account. There are no compatibility aliases for the old Cloud paths; see [Migrating to CLI 4.0](https://docs.mcpjam.com/cli/migr</text><text x="20" y="455">ation.md).</text><text x="20" y="475"></text><text x="20" y="495">## Recommended: Use with Agent Skills</text><text x="20" y="515"></text><text x="20" y="535">The easiest way to use the CLI is through the [MCPJam skill](https://github.com/MCPJam/inspector/tree/main/skills/mcp-inspector), </text><text x="20" y="555">which gives your agent full context on every command and workflow.</text><text x="20" y="575"></text><text x="20" y="595">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="615">npx skills add mcpjam/inspector --skill mcp-inspector</text><text x="20" y="635">```</text><text x="20" y="655"></text><text x="20" y="675">To convert existing promptfoo, pytest, Jest, or CSV tests, use the [MCP eval import skill](https://github.com/MCPJam/inspector/tre</text><text x="20" y="695">e/main/skills/mcpjam-eval-import).</text><text x="20" y="715"></text><text x="20" y="735">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="755">npx skills add mcpjam/inspector --skill mcpjam-eval-import</text><text x="20" y="775">```</text><text x="20" y="795"></text><text x="20" y="815">To drive MCPJam&#x27;s hosted eval tools (launch a run, poll it to a verdict, and triage a failure down to the step) use the [run MCPJa</text><text x="20" y="835">m evals skill](https://github.com/MCPJam/inspector/tree/main/skills/run-mcpjam-evals). This one is about running suites that alrea</text><text x="20" y="855">dy exist, not writing them.</text><text x="20" y="875"></text><text x="20" y="895">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="915">npx skills add mcpjam/inspector --skill run-mcpjam-evals</text><text x="20" y="935">```</text><text x="20" y="955"></text><text x="20" y="975">Once installed, your agent will know how and when to invoke `mcpjam` commands automatically.</text><text x="20" y="995"></text><text x="20" y="1015">## Install</text><text x="20" y="1035"></text><text x="20" y="1055">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1075"># Global (gives you the mcpjam command)</text><text x="20" y="1095">npm i -g @mcpjam/cli</text><text x="20" y="1115"></text><text x="20" y="1135"># Or run without installing</text><text x="20" y="1155">npx -y @mcpjam/cli@latest --help</text><text x="20" y="1175">```</text><text x="20" y="1195"></text><text x="20" y="1215">&gt; [!NOTE]</text><text x="20" y="1235">&gt;</text><text x="20" y="1255">&gt; All examples in these docs use `mcpjam` directly. If you installed via `npx`,</text><text x="20" y="1275">&gt; replace `mcpjam` with `npx -y @mcpjam/cli@latest`.</text><text x="20" y="1295"></text><text x="20" y="1315">## Command groups</text><text x="20" y="1335"></text><text x="20" y="1355">### Local MCP testing</text></g></svg>
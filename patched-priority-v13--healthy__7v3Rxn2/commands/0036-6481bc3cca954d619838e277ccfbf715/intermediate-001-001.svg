uns`). NOT the same field as `iterations`: the two are</text><text x="20" y="1115"> never a both-spellings pair, and a PATCH that names neither leaves the stored floor exactly as it was.&quot;</text><text x="20" y="1135">    },</text><text x="20" y="1155">    &quot;iterations&quot;: {</text><text x="20" y="1175">      &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="1195">      &quot;minimum&quot;: 1,</text><text x="20" y="1215">      &quot;description&quot;: &quot;The exact per-case count under per-case grading, when the case overrides the suite default. Absent means the</text><text x="20" y="1235"> case inherits it. Vocabulary 1 spells this field `repetitions`.&quot;</text><text x="20" y="1255">    },</text><text x="20" y="1275">    &quot;passThreshold&quot;: {</text><text x="20" y="1295">      &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="1315">      &quot;minimum&quot;: 0,</text><text x="20" y="1335">      &quot;maximum&quot;: 1,</text><text x="20" y="1355">      &quot;description&quot;: &quot;Fraction of this case&#x27;s trials that must pass, overriding the suite default. Absent means the case inherits </text></g></svg>
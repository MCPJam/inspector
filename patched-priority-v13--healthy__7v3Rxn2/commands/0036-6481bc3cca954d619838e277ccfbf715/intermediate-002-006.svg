<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.013561010360717773s — page 6</text><text x="20" y="75">            &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="95">            &quot;minLength&quot;: 1,</text><text x="20" y="115">            &quot;maxLength&quot;: 64,</text><text x="20" y="135">            &quot;description&quot;: &quot;Optional authored analytics grouping label.&quot;</text><text x="20" y="155">          },</text><text x="20" y="175">          &quot;matchOptions&quot;: {</text><text x="20" y="195">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="215">            &quot;description&quot;: &quot;Per-case tool-call matching override, in either vocabulary: public (`toolCallOrder: any|in-order|exact</text><text x="20" y="235">`, `extraToolCalls`, `arguments`) or internal (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), </text><text x="20" y="255">never both in one object.&quot;,</text><text x="20" y="275">            &quot;additionalProperties&quot;: true</text><text x="20" y="295">          },</text><text x="20" y="315">          &quot;predicates&quot;: {</text><text x="20" y="335">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="355">            &quot;deprecated&quot;: true,</text><text x="20" y="375">            &quot;description&quot;: &quot;DEPRECATED spelling of `checks`, which means exactly this. It was accepted here all along and never wr</text><text x="20" y="395">itten down, passing only because this schema allowed unknown properties; documented rather than removed so no caller already sendi</text><text x="20" y="415">ng it breaks. Send one or the other, never both.&quot;,</text><text x="20" y="435">            &quot;properties&quot;: {</text><text x="20" y="455">              &quot;mode&quot;: {</text><text x="20" y="475">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="495">                &quot;enum&quot;: [</text><text x="20" y="515">                  &quot;inherit&quot;,</text><text x="20" y="535">                  &quot;replace&quot;,</text><text x="20" y="555">                  &quot;extend&quot;</text><text x="20" y="575">                ]</text><text x="20" y="595">              },</text><text x="20" y="615">              &quot;list&quot;: {</text><text x="20" y="635">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="655">                &quot;items&quot;: {</text><text x="20" y="675">                  &quot;type&quot;: &quot;object&quot;</text><text x="20" y="695">                }</text><text x="20" y="715">              }</text><text x="20" y="735">            }</text><text x="20" y="755">          },</text><text x="20" y="775">          &quot;isNegative&quot;: {</text><text x="20" y="795">            &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="815">            &quot;description&quot;: &quot;Alias for `isNegativeTest`: the public case-authoring spelling this API returns on a read. Send one or</text><text x="20" y="835"> the other, never both.&quot;</text><text x="20" y="855">          },</text><text x="20" y="875">          &quot;iterations&quot;: {</text><text x="20" y="895">            &quot;type&quot;: &quot;integer&quot;,</text><text x="20" y="915">            &quot;minimum&quot;: 1,</text><text x="20" y="935">            &quot;maximum&quot;: 10,</text><text x="20" y="955">            &quot;description&quot;: &quot;Alias for `runs`. Send one or the other, never both.&quot;</text><text x="20" y="975">          },</text><text x="20" y="995">          &quot;checks&quot;: {</text><text x="20" y="1015">            &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1035">            &quot;description&quot;: &quot;Per-case CHECK gate: the grading rules this case is scored against. `mode` says how they combine with </text><text x="20" y="1055">the suite&#x27;s own: `inherit` uses the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to the suite&#x27;s. Same field, same </text><text x="20" y="1075">shape and same name as `checks` on the eval-case routes, so authoring a suite and then editing one of its cases is one word for on</text><text x="20" y="1095">e concept. Send this or the deprecated `predicates`, never both.&quot;,</text><text x="20" y="1115">            &quot;properties&quot;: {</text><text x="20" y="1135">              &quot;mode&quot;: {</text><text x="20" y="1155">                &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1175">                &quot;enum&quot;: [</text><text x="20" y="1195">                  &quot;inherit&quot;,</text><text x="20" y="1215">                  &quot;replace&quot;,</text><text x="20" y="1235">                  &quot;extend&quot;</text><text x="20" y="1255">                ]</text><text x="20" y="1275">              },</text><text x="20" y="1295">              &quot;list&quot;: {</text><text x="20" y="1315">                &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1335">                &quot;items&quot;: {</text><text x="20" y="1355">                  &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text></g></svg>
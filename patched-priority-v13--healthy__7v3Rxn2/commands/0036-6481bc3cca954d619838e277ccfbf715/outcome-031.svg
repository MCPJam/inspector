 true</text><text x="20" y="595">    },</text><text x="20" y="615">    &quot;assertion&quot;: {</text><text x="20" y="635">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="655">      &quot;description&quot;: &quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `Wi</text><text x="20" y="675">dgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is evaluated</text><text x="20" y="695"> against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated agai</text><text x="20" y="715">nst a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.&quot;,</text><text x="20" y="735">      &quot;additionalProperties&quot;: true</text><text x="20" y="755">    }</text><text x="20" y="775">  },</text><text x="20" y="795">  &quot;additionalProperties&quot;: true</text><text x="20" y="815">}</text><text x="20" y="835">EvalSuiteCreateRequest {</text><text x="20" y="855">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="875">  &quot;description&quot;: &quot;Author-only suite-create body. A suite-level default `model` (and optional `provider`) applies to every test unl</text><text x="20" y="895">ess the test overrides it.&quot;,</text><text x="20" y="915">  &quot;required&quot;: [</text><text x="20" y="935">    &quot;name&quot;,</text><text x="20" y="955">    &quot;serverIds&quot;,</text><text x="20" y="975">    &quot;model&quot;,</text><text x="20" y="995">    &quot;tests&quot;</text><text x="20" y="1015">  ],</text><text x="20" y="1035">  &quot;properties&quot;: {</text><text x="20" y="1055">    &quot;name&quot;: {</text><text x="20" y="1075">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1095">      &quot;minLength&quot;: 1,</text><text x="20" y="1115">      &quot;description&quot;: &quot;Suite name.&quot;</text><text x="20" y="1135">    },</text><text x="20" y="1155">    &quot;description&quot;: {</text><text x="20" y="1175">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1195">    },</text><text x="20" y="1215">    &quot;serverIds&quot;: {</text><text x="20" y="1235">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1255">      &quot;minItems&quot;: 1,</text><text x="20" y="1275">      &quot;description&quot;: &quot;Servers (by canonical project ID) the suite&#x27;s cases run against.&quot;,</text><text x="20" y="1295">      &quot;items&quot;: {</text><text x="20" y="1315">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1335">      }</text><text x="20" y="1355">    },</text></g></svg>
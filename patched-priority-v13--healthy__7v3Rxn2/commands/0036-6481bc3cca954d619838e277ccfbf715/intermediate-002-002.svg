<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.013561010360717773s — page 2</text><text x="20" y="75">}</text><text x="20" y="95">EvalTestStep {</text><text x="20" y="115">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="135">  &quot;description&quot;: &quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user message (model turn); </text><text x="20" y="155">`toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an assertion (a `Predicate`</text><text x="20" y="175"> like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).&quot;,</text><text x="20" y="195">  &quot;required&quot;: [</text><text x="20" y="215">    &quot;id&quot;,</text><text x="20" y="235">    &quot;kind&quot;</text><text x="20" y="255">  ],</text><text x="20" y="275">  &quot;properties&quot;: {</text><text x="20" y="295">    &quot;id&quot;: {</text><text x="20" y="315">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="335">      &quot;minLength&quot;: 1</text><text x="20" y="355">    },</text><text x="20" y="375">    &quot;kind&quot;: {</text><text x="20" y="395">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="415">      &quot;enum&quot;: [</text><text x="20" y="435">        &quot;prompt&quot;,</text><text x="20" y="455">        &quot;toolCall&quot;,</text><text x="20" y="475">        &quot;interact&quot;,</text><text x="20" y="495">        &quot;assert&quot;</text><text x="20" y="515">      ]</text><text x="20" y="535">    },</text><text x="20" y="555">    &quot;prompt&quot;: {</text><text x="20" y="575">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="595">      &quot;description&quot;: &quot;User message (`kind: prompt`).&quot;</text><text x="20" y="615">    },</text><text x="20" y="635">    &quot;serverName&quot;: {</text><text x="20" y="655">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="675">      &quot;description&quot;: &quot;Server that owns the tool (`kind: toolCall`).&quot;</text><text x="20" y="695">    },</text><text x="20" y="715">    &quot;toolName&quot;: {</text><text x="20" y="735">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="755">      &quot;description&quot;: &quot;Tool name (`kind: toolCall` / `interact`).&quot;</text><text x="20" y="775">    },</text><text x="20" y="795">    &quot;arguments&quot;: {</text><text x="20" y="815">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="835">      &quot;description&quot;: &quot;Tool-call arguments (`kind: toolCall`).&quot;,</text><text x="20" y="855">      &quot;additionalProperties&quot;: true</text><text x="20" y="875">    },</text><text x="20" y="895">    &quot;action&quot;: {</text><text x="20" y="915">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="935">      &quot;description&quot;: &quot;Widget action (`kind: interact`).&quot;,</text><text x="20" y="955">      &quot;additionalProperties&quot;: true</text><text x="20" y="975">    },</text><text x="20" y="995">    &quot;assertion&quot;: {</text><text x="20" y="1015">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1035">      &quot;description&quot;: &quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `Wi</text><text x="20" y="1055">dgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is evaluated</text><text x="20" y="1075"> against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated agai</text><text x="20" y="1095">nst a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.&quot;,</text><text x="20" y="1115">      &quot;additionalProperties&quot;: true</text><text x="20" y="1135">    }</text><text x="20" y="1155">  },</text><text x="20" y="1175">  &quot;additionalProperties&quot;: true</text><text x="20" y="1195">}</text><text x="20" y="1215">EvalSuiteCreateRequest {</text><text x="20" y="1235">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1255">  &quot;description&quot;: &quot;Author-only suite-create body. A suite-level default `model` (and optional `provider`) applies to every test unl</text><text x="20" y="1275">ess the test overrides it.&quot;,</text><text x="20" y="1295">  &quot;required&quot;: [</text><text x="20" y="1315">    &quot;name&quot;,</text><text x="20" y="1335">    &quot;serverIds&quot;,</text><text x="20" y="1355">    &quot;model&quot;,</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6481bc3cca954d619838e277ccfbf715 — page 41</text><text x="20" y="75">  &quot;properties&quot;: {</text><text x="20" y="95">    &quot;runId&quot;: {</text><text x="20" y="115">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="135">    },</text><text x="20" y="155">    &quot;suiteId&quot;: {</text><text x="20" y="175">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="195">    },</text><text x="20" y="215">    &quot;status&quot;: {</text><text x="20" y="235">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="255">      &quot;description&quot;: &quot;The run&#x27;s status. `running` on a fresh launch; on a replay (see `deduped`), the existing run&#x27;s own status, w</text><text x="20" y="275">hich may already be terminal.&quot;</text><text x="20" y="295">    },</text><text x="20" y="315">    &quot;deduped&quot;: {</text><text x="20" y="335">      &quot;type&quot;: &quot;boolean&quot;,</text><text x="20" y="355">      &quot;description&quot;: &quot;Present and true when this request REPLAYED an existing run instead of starting one (an idempotency-key hit,</text><text x="20" y="375"> or the short keyless dedupe window). A replayed run is not executed again, so no further credits are spent; read `status` for wha</text><text x="20" y="395">t that run actually is. Absent on a fresh launch.&quot;</text><text x="20" y="415">    },</text><text x="20" y="435">    &quot;runGroupId&quot;: {</text><text x="20" y="455">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="475">      &quot;description&quot;: &quot;Echo of the request&#x27;s `runGroupId`, when one was sent. A LABEL only: it groups sibling rows for display and </text><text x="20" y="495">carrie
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">6481bc3cca954d619838e277ccfbf715 — page 30</text><text x="20" y="75">ject. On update, fields you omit keep their current values. `null` clears the case override and inherits the suite&#x27;s.&quot;</text><text x="20" y="95">    },</text><text x="20" y="115">    &quot;checks&quot;: {</text><text x="20" y="135">      &quot;type&quot;: [</text><text x="20" y="155">        &quot;object&quot;,</text><text x="20" y="175">        &quot;null&quot;</text><text x="20" y="195">      ],</text><text x="20" y="215">      &quot;description&quot;: &quot;`null` clears the case override.&quot;,</text><text x="20" y="235">      &quot;properties&quot;: {</text><text x="20" y="255">        &quot;mode&quot;: {</text><text x="20" y="275">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="295">          &quot;enum&quot;: [</text><text x="20" y="315">            &quot;inherit&quot;,</text><text x="20" y="335">            &quot;replace&quot;,</text><text x="20" y="355">            &quot;extend&quot;</text><text x="20" y="375">          ]</text><text x="20" y="395">        },</text><text x="20" y="415">        &quot;list&quot;: {</text><text x="20" y="435">          &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="455">          &quot;items&quot;: {</text><text x="20" y="475">            &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="495">          }</text><text x="20" y="515">        }</text><text x="20" y="535">      }</text><text x="20" y="555">    },</text><text x="20" y="575">    &quot;import&quot;: {</text><text x="20" y="595">      &quot;oneOf&quot;: [</text><text x="20" y="615">        {</text><text x="20" y="635">          &quot;$ref&quot;: &quot;#
><text x="20" y="635">    &quot;message&quot;: {</text><text x="20" y="655">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="675">    }</text><text x="20" y="695">  }</text><text x="20" y="715">}</text><text x="20" y="735">EvalCasesBatchCreateRequest {</text><text x="20" y="755">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="775">  &quot;required&quot;: [</text><text x="20" y="795">    &quot;cases&quot;</text><text x="20" y="815">  ],</text><text x="20" y="835">  &quot;description&quot;: &quot;Author several cases in one call. Each entry takes the same fields as a single create. The 100-case cap is delib</text><text x="20" y="855">erately smaller than a suite file&#x27;s 500-case limit, so a maximal file uploads in several calls.&quot;,</text><text x="20" y="875">  &quot;properties&quot;: {</text><text x="20" y="895">    &quot;declaredSuiteId&quot;: {</text><text x="20" y="915">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="935">      &quot;maxLength&quot;: 128,</text><text x="20" y="955">      &quot;description&quot;: &quot;The suite file&#x27;s own `suite.id`, when THIS request is a suite-file sync.\n\nA CI-owned suite (see `EvalSuite</text><text x="20" y="975">Detail.managedBy`) refuses configuration writes with `409` and `details.reason: \&quot;CI_OWNED_SUITE_READ_ONLY\&quot;`. Naming the suite&#x27;s </text><text x="20" y="995">own declared id is how the file writing itself is allowed through: the platform permits the write only when the id matches, so nam</text><text x="20" y="1015">ing any other id refuses exactly as loudly as naming none. Omit it for ordinary edits.\n\nPREFER THE `declaredSuiteId` QUERY PARAM</text><text x="20" y="1035">ETER on this route. This body field still works here, but these request bodies are strict on every Inspector that predates the CI-</text><text x="20" y="1055">owned lock, so a body field is a `400` against an older deployment while an unknown query parameter is simply ignored. The MCPJam </text><text x="20" y="1075">SDK and CLI send the query parameter.&quot;</text><text x="20" y="1095">    },</text><text x="20" y="1115">    &quot;cases&quot;: {</text><text x="20" y="1135">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1155">      &quot;minItems&quot;: 1,</text><text x="20" y="1175">      &quot;maxItems&quot;: 100,</text><text x="20" y="1195">      &quot;items&quot;: {</text><text x="20" y="1215">        &quot;$ref&quot;: &quot;#/components/schemas/EvalCaseCreateRequest&quot;</text><text x="20" y="1235">      }</text><text x="20" y="1255">    },</text><text x="20" y="1275">    &quot;duplicatePolicy&quot;: {</text><text x="20" y="1295">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="1315">      &quot;enum&quot;: [</text><text x="20" y="1335">        &quot;block&quot;,</text><text x="20" y="1355">        &quot;warn&quot;,</text></g></svg>
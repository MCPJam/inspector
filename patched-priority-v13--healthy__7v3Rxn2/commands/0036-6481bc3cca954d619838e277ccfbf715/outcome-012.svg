ere, but these request bodies are strict on every Inspector that predates the CI-</text><text x="20" y="1295">owned lock, so a body field is a `400` against an older deployment while an unknown query parameter is simply ignored. The MCPJam </text><text x="20" y="1315">SDK and CLI send the query parameter.&quot;</text><text x="20" y="1335">    },</text><text x="20" y="1355">    &quot;cases&quot;: {</text></g></svg>
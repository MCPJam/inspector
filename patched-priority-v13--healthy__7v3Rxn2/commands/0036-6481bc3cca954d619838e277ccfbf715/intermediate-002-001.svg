<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.013561010360717773s — page 1</text><text x="20" y="75">               &quot;$ref&quot;: &quot;#/components/schemas/RequestedModelSelection&quot;</text><text x="20" y="95">              },</text><text x="20" y="115">              {</text><text x="20" y="135">                &quot;type&quot;: &quot;null&quot;</text><text x="20" y="155">              }</text><text x="20" y="175">            ],</text><text x="20" y="195">            &quot;description&quot;: &quot;The saved model choice behind `model` (source, connection, `settings.reasoningEffort`). Must be FOR `m</text><text x="20" y="215">odel`. On a `models` PATCH an entry that omits `selection` KEEPS the case&#x27;s existing selection for that model; `null` drops it.&quot;</text><text x="20" y="235">          }</text><text x="20" y="255">        }</text><text x="20" y="275">      }</text><text x="20" y="295">    },</text><text x="20" y="315">    &quot;matchOptions&quot;: {</text><text x="20" y="335">      &quot;type&quot;: [</text><text x="20" y="355">        &quot;object&quot;,</text><text x="20" y="375">        &quot;null&quot;</text><text x="20" y="395">      ],</text><text x="20" y="415">      &quot;description&quot;: &quot;Tool-call match options in either vocabulary: public (`toolCallOrder: any|in-order|exact`, `extraToolCalls`,</text><text x="20" y="435"> `arguments`) or internal (`toolCallOrder: ignore|superset|strict`, `maxExtraToolCalls`, `argumentMatching`), never both in one ob</text><text x="20" y="455">ject. On update, fields you omit keep their current values. `null` clears the case override and inherits the suite&#x27;s.&quot;</text><text x="20" y="475">    },</text><text x="20" y="495">    &quot;checks&quot;: {</text><text x="20" y="515">      &quot;type&quot;: [</text><text x="20" y="535">        &quot;object&quot;,</text><text x="20" y="555">        &quot;null&quot;</text><text x="20" y="575">      ],</text><text x="20" y="595">      &quot;description&quot;: &quot;`null` clears the case override.&quot;,</text><text x="20" y="615">      &quot;properties&quot;: {</text><text x="20" y="635">        &quot;mode&quot;: {</text><text x="20" y="655">          &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="675">          &quot;enum&quot;: [</text><text x="20" y="695">            &quot;inherit&quot;,</text><text x="20" y="715">            &quot;replace&quot;,</text><text x="20" y="735">            &quot;extend&quot;</text><text x="20" y="755">          ]</text><text x="20" y="775">        },</text><text x="20" y="795">        &quot;list&quot;: {</text><text x="20" y="815">          &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="835">          &quot;items&quot;: {</text><text x="20" y="855">            &quot;$ref&quot;: &quot;#/components/schemas/EvalAssertion&quot;</text><text x="20" y="875">          }</text><text x="20" y="895">        }</text><text x="20" y="915">      }</text><text x="20" y="935">    },</text><text x="20" y="955">    &quot;import&quot;: {</text><text x="20" y="975">      &quot;oneOf&quot;: [</text><text x="20" y="995">        {</text><text x="20" y="1015">          &quot;$ref&quot;: &quot;#/components/schemas/EvalCaseImportClaim&quot;</text><text x="20" y="1035">        },</text><text x="20" y="1055">        {</text><text x="20" y="1075">          &quot;type&quot;: &quot;null&quot;</text><text x="20" y="1095">        }</text><text x="20" y="1115">      ],</text><text x="20" y="1135">      &quot;description&quot;: &quot;The converter&#x27;s claim for this case, or `null` to remove one. Omitted leaves the stored claim unchanged; `nu</text><text x="20" y="1155">ll` removes it. The two are different requests, and a PATCH that conflated them would erase provenance on every unrelated edit.&quot;</text><text x="20" y="1175">    },</text><text x="20" y="1195">    &quot;suppressedSuiteStandardCheckIds&quot;: {</text><text x="20" y="1215">      &quot;$ref&quot;: &quot;#/components/schemas/SuppressedSuiteStandardCheckIds&quot;,</text><text x="20" y="1235">      &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="1255">      &quot;items&quot;: {</text><text x="20" y="1275">        &quot;type&quot;: &quot;string&quot;</text><text x="20" y="1295">      }</text><text x="20" y="1315">    }</text><text x="20" y="1335">  },</text><text x="20" y="1355">  &quot;additionalProperties&quot;: false</text></g></svg>
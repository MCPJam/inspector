<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7d7751fe6bdd4d2d8b080a6b9b5d1017 — page 1</text><text x="20" y="75">$ /bin/bash -c python3 - &lt;&lt;&#x27;PY&#x27;</text><text x="20" y="95">import json</text><text x="20" y="115">s=json.load(open(&#x27;openapi.json&#x27;))[&#x27;components&#x27;][&#x27;schemas&#x27;]</text><text x="20" y="135">print(json.dumps(s[&#x27;EvalTestStep&#x27;],indent=2))</text><text x="20" y="155">v=s[&#x27;EvalSuiteCreateRequest&#x27;];print(&#x27;CREATE required&#x27;,v.get(&#x27;required&#x27;));print(json.dumps({k:v[&#x27;properties&#x27;][k] for k in v[&#x27;proper</text><text x="20" y="175">ties&#x27;] if k in [&#x27;name&#x27;,&#x27;mode&#x27;,&#x27;tests&#x27;,&#x27;judge&#x27;,&#x27;advancedConfig&#x27;,&#x27;passCriteria&#x27;,&#x27;model&#x27;,&#x27;provider&#x27;,&#x27;serverIds&#x27;]},indent=2))</text><text x="20" y="195">PY</text><text x="20" y="215">{</text><text x="20" y="235">  &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="255">  &quot;description&quot;: &quot;One authored test step (the unified test model). `kind` discriminates: `prompt` is a user message (model turn); </text><text x="20" y="275">`toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; `assert` is an assertion (a `Predicate`</text><text x="20" y="295"> like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).&quot;,</text><text x="20" y="315">  &quot;required&quot;: [</text><text x="20" y="335">    &quot;id&quot;,</text><text x="20" y="355">    &quot;kind&quot;</text><text x="20" y="375">  ],</text><text x="20" y="395">  &quot;properties&quot;: {</text><text x="20" y="415">    &quot;id&quot;: {</text><text x="20" y="435">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="455">      &quot;minLength&quot;: 1</text><text x="20" y="475">    },</text><text x="20" y="495">    &quot;kind&quot;: {</text><text x="20" y="515">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="535">      &quot;enum&quot;: [</text><text x="20" y="555">        &quot;prompt&quot;,</text><text x="20" y="575">        &quot;toolCall&quot;,</text><text x="20" y="595">        &quot;interact&quot;,</text><text x="20" y="615">        &quot;assert&quot;</text><text x="20" y="635">      ]</text><text x="20" y="655">    },</text><text x="20" y="675">    &quot;prompt&quot;: {</text><text x="20" y="695">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="715">      &quot;description&quot;: &quot;User message (`kind: prompt`).&quot;</text><text x="20" y="735">    },</text><text x="20" y="755">    &quot;serverName&quot;: {</text><text x="20" y="775">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="795">      &quot;description&quot;: &quot;Server that owns the tool (`kind: toolCall`).&quot;</text><text x="20" y="815">    },</text><text x="20" y="835">    &quot;toolName&quot;: {</text><text x="20" y="855">      &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="875">      &quot;description&quot;: &quot;Tool name (`kind: toolCall` / `interact`).&quot;</text><text x="20" y="895">    },</text><text x="20" y="915">    &quot;arguments&quot;: {</text><text x="20" y="935">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="955">      &quot;description&quot;: &quot;Tool-call arguments (`kind: toolCall`).&quot;,</text><text x="20" y="975">      &quot;additionalProperties&quot;: true</text><text x="20" y="995">    },</text><text x="20" y="1015">    &quot;action&quot;: {</text><text x="20" y="1035">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1055">      &quot;description&quot;: &quot;Widget action (`kind: interact`).&quot;,</text><text x="20" y="1075">      &quot;additionalProperties&quot;: true</text><text x="20" y="1095">    },</text><text x="20" y="1115">    &quot;assertion&quot;: {</text><text x="20" y="1135">      &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="1155">      &quot;description&quot;: &quot;The rule an `assert` step checks (`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `Wi</text><text x="20" y="1175">dgetAssertion | Predicate`, and that union is why the field is called an assertion rather than a check. A `Predicate` is evaluated</text><text x="20" y="1195"> against the PERSISTED transcript, so a stored run can be re-graded against it months later; a `WidgetAssertion` is evaluated agai</text><text x="20" y="1215">nst a LIVE DOM and can never be replayed. Calling this a check would promise the replayability only one half of it has.&quot;,</text><text x="20" y="1235">      &quot;additionalProperties&quot;: true</text><text x="20" y="1255">    }</text><text x="20" y="1275">  },</text><text x="20" y="1295">  &quot;additionalProperties&quot;: true</text><text x="20" y="1315">}</text><text x="20" y="1335">CREATE required [&#x27;name&#x27;, &#x27;serverIds&#x27;, &#x27;model&#x27;, &#x27;tests&#x27;]</text><text x="20" y="1355">{</text></g></svg>
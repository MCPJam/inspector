<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7d7751fe6bdd4d2d8b080a6b9b5d1017 — page 2</text><text x="20" y="75">  &quot;name&quot;: {</text><text x="20" y="95">    &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="115">    &quot;minLength&quot;: 1,</text><text x="20" y="135">    &quot;description&quot;: &quot;Suite name.&quot;</text><text x="20" y="155">  },</text><text x="20" y="175">  &quot;serverIds&quot;: {</text><text x="20" y="195">    &quot;type&quot;: &quot;array&quot;,</text><text x="20" y="215">    &quot;minItems&quot;: 1,</text><text x="20" y="235">    &quot;description&quot;: &quot;Servers (by canonical project ID) the suite&#x27;s cases run against.&quot;,</text><text x="20" y="255">    &quot;items&quot;: {</text><text x="20" y="275">      &quot;type&quot;: &quot;string&quot;</text><text x="20" y="295">    }</text><text x="20" y="315">  },</text><text x="20" y="335">  &quot;model&quot;: {</text><text x="20" y="355">    &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="375">    &quot;minLength&quot;: 1,</text><text x="20" y="395">    &quot;description&quot;: &quot;Suite-level default model id (e.g. `anthropic/claude-haiku-4.5`). Used for any test that omits `model`.&quot;</text><text x="20" y="415">  },</text><text x="20" y="435">  &quot;provider&quot;: {</text><text x="20" y="455">    &quot;type&quot;: &quot;string&quot;,</text><text x="20" y="475">    &quot;description&quot;: &quot;Optional suite-level default provider. When omitted, the provider is derived from a `provider/model` id.&quot;</text><text x="20" y="495">  },</text><text x="20" y="515">  &quot;passCriteria&quot;: {</text><text x="20" y="535">    &quot;type&quot;: &quot;object&quot;,</text><text x="20" y="555">    &quot;description&quot;: &quot;The floor a run must clear, as a PERCENT in [0, 100]: 80 means 80%. `minimumPassRatePercent` is the canonical </text><text x="20" y="575">spelling (the unit is in the name); `minimumPassRate` is the deprecated alias for it. Send exactly one. THE NAME DISAMBIGUATES THE</text><text x="20" y="595"> UNIT: a value in (0, 1) is accepted on `minimumPassRatePercent`, where it unambiguously means a sub-1% floor the evaluator can ac</text><text x="20" y="615">t on, and REJECTED on the bare `minimumPassRate`, where `0.8` cannot be told apart from a fraction sent by mistake and would silen</text><text x="20" y="635">tly make the gate unfailable. Neither field ever reinterprets a value. A per-case `passThreshold` IS a fraction; this suite/run fl</text><text x="20" y="655">oor is not.&quot;,</text><text x="20" y="675">    &quot;properties&quot;: {</text><text x="20" y="695">      &quot;minimumPassRatePercent&quot;: {</text><text x="20" y="715">        &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="735">        &quot;minimum&quot;: 0,</text><text x="20" y="755">        &quot;maximum&quot;: 100,</text><text x="20" y="775">        &quot;description&quot;: &quot;A percent in [0, 100]. The whole range is usable, sub-1 values included: the unit is in the field name, so</text><text x="20" y="795"> nothing is ambiguous.&quot;</text><text x="20" y="815">      },</text><text x="20" y="835">      &quot;minimumPassRate&quot;: {</text><text x="20" y="855">        &quot;type&quot;: &quot;number&quot;,</text><text x="20" y="875">        &quot;minimum&quot;: 0,</text><text x="20" y="895">        &quot;maximum&quot;: 100,</text><text x="20" y="915">        &quot;deprecated&quot;: true,</text><text x="20" y="935">        &quot;description&quot;: &quot;Deprecated alias for `minimumPassRatePercent`, same unit. A value in (0, 1) is REJECTED here (it reads as </text><text x="20" y="955">a fraction sent by mistake), which is what the `not` below expresses. Use `minimumPassRatePercent` for a genuine sub-1% floor.&quot;,</text><text x="20" y="975">        &quot;not&quot;: {</text><text x="20" y="995">          &quot;exclusiveMinimum&quot;: 0,</text><text x="20" y="1015">          &quot;exclusiveMaximum&quot;: 1</text><text x="20" y="1035">        }</text><text x="20" y="1055">      }</text><text x="20" y="1075">    },</text><text x="20" y="1095">    &quot;oneOf&quot;: [</text><text x="20" y="1115">      {</text><text x="20" y="1135">        &quot;required&quot;: [</text><text x="20" y="1155">          &quot;minimumPassRatePercent&quot;</text><text x="20" y="1175">        ]</text><text x="20" y="1195">      },</text><text x="20" y="1215">      {</text><text x="20" y="1235">        &quot;required&quot;: [</text><text x="20" y="1255">          &quot;minimumPassRate&quot;</text><text x="20" y="1275">        ]</text><text x="20" y="1295">      }</text><text x="20" y="1315">    ],</text><text x="20" y="1335">    &quot;additionalProperties&quot;: false</text><text x="20" y="1355">  },</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1005"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.3285346031188965s — page 1</text><text x="20" y="75">ources, prompts, and capabilities as JSON.</text><text x="20" y="95"></text><text x="20" y="115">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="135">mcpjam server export --url https://your-server.com/mcp --access-token $TOKEN &gt; snapshot.json</text><text x="20" y="155">```</text><text x="20" y="175"></text><text x="20" y="195">## Shared server flags</text><text x="20" y="215"></text><text x="20" y="235">Every `server` subcommand accepts these flags for specifying how to connect:</text><text x="20" y="255"></text><text x="20" y="275">| Flag | Description |</text><text x="20" y="295">| - | - |</text><text x="20" y="315">| `--transport &lt;transport&gt;` | Explicit transport type (`http` or `stdio`) |</text><text x="20" y="335">| `--url &lt;url&gt;` | HTTP MCP server URL |</text><text x="20" y="355">| `--access-token &lt;token&gt;` | Bearer access token |</text><text x="20" y="375">| `--oauth-access-token &lt;token&gt;` | OAuth bearer access token |</text><text x="20" y="395">| `--refresh-token &lt;token&gt;` | OAuth refresh token |</text><text x="20" y="415">| `--client-id &lt;id&gt;` | OAuth client ID (used with `--refresh-token`) |</text><text x="20" y="435">| `--client-secret &lt;secret&gt;` | OAuth client secret (used with `--refresh-token`) |</text><text x="20" y="455">| `--credentials-file &lt;path&gt;` | Load OAuth credentials from a file created by `oauth login --credentials-out` or `oauth conformanc</text><text x="20" y="475">e --credentials-out` |</text><text x="20" y="495">| `--header &lt;header&gt;` | HTTP header in `Key: Value` format (repeatable) |</text><text x="20" y="515">| `--client-capabilities &lt;json&gt;` | Client capabilities as inline JSON, `@path`, or `-` for stdin |</text><text x="20" y="535">| `--command &lt;command&gt;` | Command for a stdio server |</text><text x="20" y="555">| `--args &lt;arg...&gt;` | Preferred stdio command arguments |</text><text x="20" y="575">| `--command-args &lt;arg&gt;` | Legacy stdio command argument (repeatable) |</text><text x="20" y="595">| `-e, --env &lt;env...&gt;` | Stdio environment `KEY=[REDACTED] values |</text><text x="20" y="615">| `--cwd &lt;path&gt;` | Working directory for the stdio child process |</text><text x="20" y="635"></text><text x="20" y="655">Stdio child processes inherit the parent shell environment by default. Use</text><text x="20" y="675">`-e/--env` to add values or override inherited ones, and `--cwd` when the</text><text x="20" y="695">command must run from a project directory.</text><text x="20" y="715">If you pass `--transport`, the CLI validates that it matches the target flags</text><text x="20" y="735">you provided instead of silently inferring the transport.</text><text x="20" y="755"></text><text x="20" y="775">## Common patterns</text><text x="20" y="795"></text><text x="20" y="815">### Triage an unknown server</text><text x="20" y="835"></text><text x="20" y="855">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="875"># Start with doctor</text><text x="20" y="895">mcpjam server doctor --url https://unknown-server.com/mcp</text><text x="20" y="915"></text><text x="20" y="935"># If it returns oauth_required, login first</text><text x="20" y="955">mcpjam oauth login --url https://unknown-server.com/mcp \</text><text x="20" y="975">  --protocol-version 2025-11-25 --registration dcr</text></g></svg>
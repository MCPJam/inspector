<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1045"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.32718372344970703s — page 2</text><text x="20" y="75"></text><text x="20" y="95">From a run without credentials, `ready` means the server let MCPJam connect and list without a token. It does not mean every tool </text><text x="20" y="115">is public: a server can still ask for sign-in when a protected tool is called. To check, c</text><text x="20" y="135"></text><text x="20" y="155">The `--out &lt;path&gt;` flag writes the full JSON artifact to a file, useful for handoff to another engineer or agent.</text><text x="20" y="175">For stdio targets, those artifacts only record the explicit env keys you passed</text><text x="20" y="195">via `-e/--env`; inherited shell variables are not enumerated.</text><text x="20" y="215"></text><text x="20" y="235">Credential headers (`Authorization`, `X-Api-Key`, `X-Auth-Token`, and any other sensitive header names) are automatically redacted</text><text x="20" y="255"> to `[REDACTED]` in all printed output and written artifacts, including RPC logs attached </text><text x="20" y="275"></text><text x="20" y="295">### `server info`</text><text x="20" y="315"></text><text x="20" y="335">Get initialization info for a connected server.</text><text x="20" y="355"></text><text x="20" y="375">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="395">mcpjam server info --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="415">```</text><text x="20" y="435"></text><text x="20" y="455">Returns the server&#x27;s `serverInfo` (name, version) and `capabilities` from the MCP initialize response.</text><text x="20" y="475"></text><text x="20" y="495">### `server capabilities`</text><text x="20" y="515"></text><text x="20" y="535">Get resolved server capabilities.</text><text x="20" y="555"></text><text x="20" y="575">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="595">mcpjam server capabilities --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="615">```</text><text x="20" y="635"></text><text x="20" y="655">### `server validate`</text><text x="20" y="675"></text><text x="20" y="695">Connect to a server and verify the debugger surface works.</text><text x="20" y="715"></text><text x="20" y="735">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="755">mcpjam server validate --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="775">```</text><text x="20" y="795"></text><text x="20" y="815">### `server ping`</text><text x="20" y="835"></text><text x="20" y="855">Simple connectivity check.</text><text x="20" y="875"></text><text x="20" y="895">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="915">mcpjam server ping --url https://your-server.com/mcp</text><text x="20" y="935">```</text><text x="20" y="955"></text><text x="20" y="975">### `server export`</text><text x="20" y="995"></text><text x="20" y="1015">Export a full snapshot of the server&#x27;s tools, res</text></g></svg>
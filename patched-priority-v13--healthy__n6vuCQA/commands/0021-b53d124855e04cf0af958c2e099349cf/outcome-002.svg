<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b53d124855e04cf0af958c2e099349cf — page 2</text><text x="20" y="75"></text><text x="20" y="95">* `status`: `ready`, `oauth_required`, or `error`</text><text x="20" y="115">* Probe results (transport, OAuth discovery)</text><text x="20" y="135">* Initialization info and negotiated capabilities</text><text x="20" y="155">* Counts: tools, resources, resource templates, prompts</text><text x="20" y="175"></text><text x="20" y="195">From a run without credentials, `ready` means the server let MCPJam connect and list without a token. It does not mean every tool </text><text x="20" y="215">is public: a server can still ask for sign-in when a protected tool is called. To check, c</text><text x="20" y="235"></text><text x="20" y="255">The `--out &lt;path&gt;` flag writes the full JSON artifact to a file, useful for handoff to another engineer or agent.</text><text x="20" y="275">For stdio targets, those artifacts only record the explicit env keys you passed</text><text x="20" y="295">via `-e/--env`; inherited shell variables are not enumerated.</text><text x="20" y="315"></text><text x="20" y="335">Credential headers (`Authorization`, `X-Api-Key`, `X-Auth-Token`, and any other sensitive header names) are automatically redacted</text><text x="20" y="355"> to `[REDACTED]` in all printed output and written artifacts, including RPC logs attached </text><text x="20" y="375"></text><text x="20" y="395">### `server info`</text><text x="20" y="415"></text><text x="20" y="435">Get initialization info for a connected server.</text><text x="20" y="455"></text><text x="20" y="475">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="495">mcpjam server info --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="515">```</text><text x="20" y="535"></text><text x="20" y="555">Returns the server&#x27;s `serverInfo` (name, version) and `capabilities` from the MCP initialize response.</text><text x="20" y="575"></text><text x="20" y="595">### `server capabilities`</text><text x="20" y="615"></text><text x="20" y="635">Get resolved server capabilities.</text><text x="20" y="655"></text><text x="20" y="675">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="695">mcpjam server capabilities --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="715">```</text><text x="20" y="735"></text><text x="20" y="755">### `server validate`</text><text x="20" y="775"></text><text x="20" y="795">Connect to a server and verify the debugger surface works.</text><text x="20" y="815"></text><text x="20" y="835">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="855">mcpjam server validate --url https://your-server.com/mcp --access-token $TOKEN</text><text x="20" y="875">```</text><text x="20" y="895"></text><text x="20" y="915">### `server ping`</text><text x="20" y="935"></text><text x="20" y="955">Simple connectivity check.</text><text x="20" y="975"></text><text x="20" y="995">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1015">mcpjam server ping --url https://your-server.com/mcp</text><text x="20" y="1035">```</text><text x="20" y="1055"></text><text x="20" y="1075">### `server export`</text><text x="20" y="1095"></text><text x="20" y="1115">Export a full snapshot of the server&#x27;s tools, resources, prompts, and capabilities as JSON.</text><text x="20" y="1135"></text><text x="20" y="1155">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1175">mcpjam server export --url https://your-server.com/mcp --access-token $TOKEN &gt; snapshot.json</text><text x="20" y="1195">```</text><text x="20" y="1215"></text><text x="20" y="1235">## Shared server flags</text><text x="20" y="1255"></text><text x="20" y="1275">Every `server` subcommand accepts these flags for specifying how to connect:</text><text x="20" y="1295"></text><text x="20" y="1315">| Flag | Description |</text><text x="20" y="1335">| - | - |</text><text x="20" y="1355">| `--transport &lt;transport&gt;` | Explicit transport type (`http` or `stdio`) |</text></g></svg>
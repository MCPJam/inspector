<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b53d124855e04cf0af958c2e099349cf — page 4</text><text x="20" y="75"></text><text x="20" y="95">Save this as `.mcpjam/evals/example.yaml`:</text><text x="20" y="115"></text><text x="20" y="135">```yaml theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="155">schemaVersion: &quot;2&quot;</text><text x="20" y="175">mode: agentWorkflow</text><text x="20" y="195">reportingMode: standard</text><text x="20" y="215">suite:</text><text x="20" y="235">  id: s_notes_example</text><text x="20" y="255">  name: Notes server</text><text x="20" y="275">target:</text><text x="20" y="295">  servers:</text><text x="20" y="315">    - name: notes</text><text x="20" y="335">defaults:</text><text x="20" y="355">  judge:</text><text x="20" y="375">    enabled: false</text><text x="20" y="395">  model: anthropic/claude-haiku-4.5</text><text x="20" y="415">  iterations: 1</text><text x="20" y="435">  passThreshold: 1</text><text x="20" y="455">  validity: {}</text><text x="20" y="475">cases:</text><text x="20" y="495">  - id: c_reads_a_note</text><text x="20" y="515">    title: reads the note it was asked about</text><text x="20" y="535">    steps:</text><text x="20" y="555">      - id: s1</text><text x="20" y="575">        kind: prompt</text><text x="20" y="595">        prompt: What does note 7 say?</text><text x="20" y="615">      - id: a1</text><text x="20" y="635">        kind: assert</text><text x="20" y="655">        assertion:</text><text x="20" y="675">          type: toolCalledAtLeastOnce</text><text x="20" y="695">          toolName: read_note</text><text x="20" y="715">  - id: c_never_deletes</text><text x="20" y="735">    title: never deletes when only asked to read</text><text x="20" y="755">    steps:</text><text x="20" y="775">      - id: s1</text><text x="20" y="795">        kind: prompt</text><text x="20" y="815">        prompt: Summarize note 7.</text><text x="20" y="835">      - id: a1</text><text x="20" y="855">        kind: assert</text><text x="20" y="875">        assertion:</text><text x="20" y="895">          type: toolNeverCalled</text><text x="20" y="915">          toolName: delete_note</text><text x="20" y="935">```</text><text x="20" y="955"></text><text x="20" y="975">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="995"></text><text x="20" y="1015">### 2. Configure the server</text><text x="20" y="1035"></text><text x="20" y="1055">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="1075">mmand:</text><text x="20" y="1095"></text><text x="20" y="1115">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1135">{</text><text x="20" y="1155">  &quot;mcpServers&quot;: {</text><text x="20" y="1175">    &quot;notes&quot;: {</text><text x="20" y="1195">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="1215">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="1235">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="1255">    }</text><text x="20" y="1275">  }</text><text x="20" y="1295">}</text><text x="20" y="1315">```</text><text x="20" y="1335"></text><text x="20" y="1355">### 3. Supply a key and run</text></g></svg>
ceb-4073-b1c3-51e90246b833&quot;, &quot;uuid&quot;: &quot;73c44739-4a96-4bfc-a5fa-d034ef663aa3&quot;, &quot;timestamp&quot;: &quot;2026-11-15T02:11:33.178Z&quot;, &quot;to</text><text x="20" y="795">ol_use_result&quot;: {&quot;stdout&quot;: &quot;{\&quot;id\&quot;: \&quot;run_fixture_2\&quot;, \&quot;suiteId\&quot;: \&quot;suite_authored_5\&quot;, \&quot;runNumber\&quot;: 2, \&quot;status\&quot;: \&quot;complet</text><text x="20" y="815">ed\&quot;, \&quot;result\&quot;: \&quot;passed\&quot;, \&quot;summary\&quot;: {\&quot;total\&quot;: 1, \&quot;passed\&quot;: 1, \&quot;failed\&quot;: 0, \&quot;passRate\&quot;: 1.0}, \&quot;source\&quot;: \&quot;api\&quot;, \</text><text x="20" y="835">&quot;notes\&quot;: \&quot;SIMULATED: deterministic fixture execution; no hosted model or live billing.\&quot;, \&quot;createdAt\&quot;:\n{\&quot;items\&quot;: [{\&quot;id\&quot;: </text><text x="20" y="855">\&quot;run_fixture_2_0\&quot;, \&quot;testCaseId\&quot;: \&quot;suite_authored_5_case_0\&quot;, \&quot;title\&quot;: \&quot;add 17+25\&quot;, \&quot;iterationNumber\&quot;: 1, \&quot;status\&quot;: \&quot;</text><text x="20" y="875">completed\&quot;, \&quot;result\&quot;: \&quot;passed\&quot;, \&quot;actualToolCalls\&quot;: [{\&quot;toolName\&quot;: \&quot;add\&quot;, \&quot;arguments\&quot;: {\&quot;a\&quot;: 17, \&quot;b\&quot;: 25}, \&quot;result</text><text x="20" y="895">\&quot;: {\&quot;content\&quot;: [{\&quot;type\&quot;: \&quot;text\&quot;, \&quot;text\&quot;: \&quot;{\\\&quot;sum\\\&quot;: 42}\nexit=0&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isImage&quot;: fal</text><text x="20" y="915">se, &quot;noOutputExpected&quot;: false}, &quot;tool_result_meta&quot;: [{&quot;id&quot;: &quot;toolu_01XJuKKEyGz9WffRhKrt9nuX&quot;, &quot;permission_decision&quot;: {&quot;decision&quot;: </text><text x="20" y="935">&quot;accept&quot;, &quot;source&quot;: &quot;config&quot;, &quot;reason_type&quot;: &quot;mode&quot;}}]}</text><text x="20" y="955">{&quot;type&quot;: &quot;assistant&quot;, &quot;message&quot;: {&quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;id&quot;: &quot;msg_011Ch3uKBSC6Uj5gLmt7E2qY&quot;, &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;</text><text x="20" y="975">assistant&quot;, &quot;content&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;I validated the server and ran a repeatable eval through the MCPJam API. The eva</text><text x="20" y="995">l is deterministic and simulated, not a real model-driven eval, and the CLI path didn&#x27;t work in this environment.\n\n**First resul</text><text x="20" y="1015">t.** `mcpjam server doctor --url http://fixture:8765/mcp` (saved to `/workspace/doctor.json`) returned `ready`. The server is `ari</text><text x="20" y="1035">thmetic-fixture` 1.0.0 on protocol 2025-11-25 over streamable-http, with no OAuth. It exposes one tool, `add(a, b)`, which returns</text><text x="20" y="1055"> `{sum}`. It has no resources or prompts, so doctor skipped the skills check.\n\n**Eval.**\n- **Where it runs:** I used the MCPJam</text><text x="20" y="1075"> public API. `server_fixture` was already saved in `project_fixture`.\n- **How to rerun:** `/workspace/run_eval.sh` authors the su</text><text x="20" y="1095">ite from `/workspace/suite.json`, starts a run, polls it and prints the verdict. It exits non-zero if the run doesn&#x27;t pass.\n- **R</text><text x="20" y="1115">esult:** run `run_fixture_2` completed and passed, 1 of 1. The recorded call was `add(17, 25)`, which returned `{\&quot;sum\&quot;: 42}`.\n-</text><text x="20" y="1135"> **Simulated:** the run response is marked \&quot;SIMULATED: deterministic fixture execution; no hosted model or live billing.\&quot;\n- **O</text><text x="20" y="1155">utput:** the verdict and per-iteration tool calls print to the terminal. The script doesn&#x27;t save them to a file.\n- **Other files:</text><text x="20" y="1175">** `/workspace/.mcpjam/evals/arith.yaml` is a CLI-format suite. `mcpjam cloud eval validate` accepted it, but I never ran it.\n\n*</text><text x="20" y="1195">*Concerns.**\n1. **CLI refused the API URL.** `mcpjam test` refused to run because `MCPJAM_API_URL` is `http://fixture:8765/api/v1</text><text x="20" y="1215">`. The CLI only allows plain `http://` for loopback addresses. I didn&#x27;t tunnel around that check. Because of it, the CLI-driven lo</text><text x="20" y="1235">cal-eval path is unverified here. To fix it, the account API would need to be served over HTTPS or on loopback.\n2. **Prompt suite</text><text x="20" y="1255">s are refused.** The fixture refuses hosted-model prompt steps (`FEATURE_NOT_SUPPORTED`). It only accepts `toolCall` steps plus a </text><text x="20" y="1275">subset of assertions. The model-driven eval from the docs examples (`prompt` step plus `toolCalledAtLeastOnce`) therefore wasn&#x27;t e</text><text x="20" y="1295">xercised.\n3. **Docs gaps.** The docs don&#x27;t show the `toolCall` step&#x27;s argument field. I found by trial that it is `arguments`, no</text><text x="20" y="1315">t `args`. The fixture said \&quot;Unknown suite\&quot; for an inline `suiteName` run and only accepted a `suiteId` from `POST /eval-suites`.</text><text x="20" y="1335"> The `decision-summary` route returned 404.\n\nI didn&#x27;t make any billing contact or purchases.&quot;}], &quot;container&quot;: null, &quot;stop_reason</text><text x="20" y="1355">&quot;: null, &quot;stop_sequence&quot;: null, &quot;stop_details&quot;: null, &quot;usage&quot;: {&quot;input_tokens&quot;: 2, &quot;cache_creation_input_tokens&quot;: 1038, &quot;cache_rea</text></g></svg>
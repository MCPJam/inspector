<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1325"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">06c27f1d8b3e4d7286d0c6b91909cb96 — page 1</text><text x="20" y="75">$ /bin/bash -c source /logs/agent/sessions/shell-snapshots/snapshot-bash-1794708600651-f6pac3.sh 2&gt;/dev/null || true &amp;&amp; \builtin s</text><text x="20" y="95">hopt -u extglob 2&gt;/dev/null || true &amp;&amp; { \builtin unalias -- &#x27;which&#x27;; \builtin unset -f -- &#x27;which&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; {</text><text x="20" y="115"> \builtin unalias -- &#x27;unsetenv&#x27;; \builtin unset -f -- &#x27;unsetenv&#x27;; } &gt;/dev/null 2&gt;&amp;1 || true &amp;&amp; eval &#x27;cd /workspace; sed -n 685,740</text><text x="20" y="135">p api.md&#x27; &lt; /dev/null &amp;&amp; pwd -P &gt;| /tmp/claude-0aa8-cwd</text><text x="20" y="155">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="175">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="195">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="215"></text><text x="20" y="235">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="255">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="275"></text><text x="20" y="295">## Run evals from the API</text><text x="20" y="315"></text><text x="20" y="335">The shortest useful loop: create a run with one inline test, then poll:</text><text x="20" y="355"></text><text x="20" y="375">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="395"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="415">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="435">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="455">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="475">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="495">  -d &#x27;{</text><text x="20" y="515">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="535">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="555">    &quot;tests&quot;: [{</text><text x="20" y="575">      &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="595">      &quot;runs&quot;: 1,</text><text x="20" y="615">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="635">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="655">      &quot;steps&quot;: [</text><text x="20" y="675">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="695">        {</text><text x="20" y="715">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="735">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="755">          &quot;assertion&quot;: {</text><text x="20" y="775">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="795">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="815">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="835">          }</text><text x="20" y="855">        }</text><text x="20" y="875">      ]</text><text x="20" y="895">    }]</text><text x="20" y="915">  }&#x27; | jq -er .runId)</text><text x="20" y="935"></text><text x="20" y="955"># 2. Poll until status is completed | failed | cancelled | timed_out</text><text x="20" y="975">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID&quot; \</text><text x="20" y="995">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1015"></text><text x="20" y="1035"># 3. If it did not pass, read the decision summary FIRST</text><text x="20" y="1055">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/decision-summary&quot; \</text><text x="20" y="1075">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1095"></text><text x="20" y="1115"># 4. Or go straight to per-iteration tool calls, token usage, latency</text><text x="20" y="1135">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/iterations&quot; \</text><text x="20" y="1155">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="1175">```</text><text x="20" y="1195"></text><text x="20" y="1215">The decision summary composes steps 2 and 4 into one versioned object so every</text><text x="20" y="1235">client reads a run the same way. Four things to know before gating on it:</text><text x="20" y="1255"></text><text x="20" y="1275"></text><text x="20" y="1295">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
# Devin environment blueprint for MCPJam/inspector.
# Reference: https://docs.devin.ai/onboard-devin/environment/blueprint-reference
#
# Git-backed: after merging a change here, press Sync in Devin's environment
# settings (or call the sync API) so the next snapshot build picks it up.
#
# The toolchain mirrors CI (.github/workflows/test.yml): Node 24.14.0,
# npm workspaces installed with --legacy-peer-deps, ripgrep for the repo-guard
# checks, and the Playwright Chromium that matches the lockfile.

initialize:
  - name: Node 24.14.0 (mcpjam-inspector/.nvmrc, CI NODE_VERSION)
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "24.14.0"

  - name: ripgrep for the repo-guard checks in npm test
    run: |
      sudo apt-get update
      sudo apt-get install -y ripgrep

maintenance:
  # Differential builds skip initialize, so nothing here may depend on it
  # having run in the same build.
  - name: Heap headroom for the vitest workspace (same value as CI)
    run: echo 'NODE_OPTIONS=--max-old-space-size=6144' >> "$ENVRC"

  - name: Install workspace dependencies
    run: npm install --legacy-peer-deps

  - name: Playwright Chromium pinned by the lockfile
    run: cd mcpjam-inspector && npx playwright install --with-deps chromium

  - name: Build the SDK that the inspector and CLI import
    run: npm run build -w @mcpjam/sdk

  - name: Dev env file (the committed .env.local is the standard profile)
    run: |
      [ -f mcpjam-inspector/.env.development ] || \
        cp mcpjam-inspector/.env.local mcpjam-inspector/.env.development

knowledge:
  - name: install
    contents: |
      npm install --legacy-peer-deps   # from the repo root, never inside a workspace
  - name: dev
    contents: |
      npm run dev -w @mcpjam/inspector       # client :5173, server :6274, MCP worker :8787
      npm run dev:app -w @mcpjam/inspector   # same without the MCP worker
      Open the printed "➜ Dev" access link, not bare localhost; it signs the browser in.
  - name: test
    contents: |
      npm run test -w @mcpjam/inspector -- <path-or-pattern>   # targeted inspector tests
      npm run test -w @mcpjam/sdk | @mcpjam/cli | @mcpjam/design-system | @mcpjam/chat-ui
      npm run test:ci:rest                                     # every suite except the inspector
  - name: typecheck
    contents: |
      npm run typecheck                                  # releasable packages
      npm run typecheck:client -w @mcpjam/inspector      # inspector client
  - name: lint
    contents: |
      npx prettier --write <changed files>
      npm run design:check && npm run design:lint        # after touching tokens or DESIGN.md
  - name: build
    contents: npm run build:inspector
  - name: e2e
    contents: npm run build -w @mcpjam/inspector && npm run test:e2e -w @mcpjam/inspector
  - name: browserd
    contents: |
      npm run bundle:browserd -w @mcpjam/inspector
      Run after any change under mcpjam-inspector/server/services/browserd/daemon/, then commit both files in dist/.

<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">c20a05ae0d294a4f89c5b02090284c35 — page 6</text><text x="20" y="75">otiated capabilities\n* Counts: tools, resources, resource templates, prompts\n\nFrom a run without credentials, `ready` means the</text><text x="20" y="95"> server let MCPJam connect and list without a token. It does not mean every tool is public: a server can still ask for sign-in whe</text><text x="20" y="115">n a protected tool is called. To check, call that tool with `mcpjam tools call`. A 401 challenge fails the call with `AUTH_REQUIRE</text><text x="20" y="135">D`, and its details name the `mcpjam oauth login` command to run. A ChatGPT-style challenge returns the tool result with `_authCha</text><text x="20" y="155">llenge` next to it. See [Mid-session sign-in](https://docs.mcpjam.com/inspector/lazy-authentication.md#the-cli-tests-and-evals-nev</text><text x="20" y="175">er-sign-in).\n\nThe `--out &lt;path&gt;` flag writes the full JSON artifact to a file — useful for handoff to another engineer or agent.</text><text x="20" y="195">\nFor stdio targets, those artifacts only record the explicit env keys you passed\nvia `-e/--env`; inherited shell variables are n</text><text x="20" y="215">ot enumerated.\n\nCredential headers — `Authorization`, `X-Api-Key`, `X-Auth-Token`, and any other sensitive header names — are au</text><text x="20" y="235">tomatically redacted to `[REDACTED]` in all printed output and written artifacts, including RPC logs attached via `--rpc`. Header </text><text x="20" y="255">names are preserved so the request shape remains visible.\n\n### `server info`\n6.2.2&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;interrupted&quot;: false, &quot;isIma</text><text x="20" y="275">ge&quot;: false, &quot;noOutputExp
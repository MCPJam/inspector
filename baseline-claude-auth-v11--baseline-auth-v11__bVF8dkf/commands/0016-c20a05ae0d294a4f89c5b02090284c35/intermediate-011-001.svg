 returned</text><text x="20" y="435"> `isError:true` with the message \&quot;a and b must be finite numbers\&quot;. That is a clean tool-level error.\n- **Saved work:**\n  - `/w</text><text x="20" y="455">orkspace/doctor.json` is the full doctor report, including RPC logs.\n  - `/workspace/validate.sh` reruns all three checks. It rea</text><text x="20" y="475">ds the token from the environment.\n\n**Concern note:** I expected the config to connect as written, but it didn&#x27;t, because it has</text><text x="20" y="495"> no auth. I fixed that by passing the token on the command line. You may want to add the credential to `mcp.json`.\n\nI didn&#x27;t use</text><text x="20" y="515"> the MCPJam account API or the hosted features, such as evals or project sync. The CLI checks above needed neither.&quot;, &quot;ttft_ms&quot;: 3</text><text x="20" y="535">061, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 91822, &quot;uuid&quot;: &quot;b10ae649-2ad7-4ccb-95f6-df673a5af68a&quot;, &quot;ttft_stream_ms&quot;: 2224, &quot;time_to_requ</text><text x="20" y="555">est_ms&quot;: 239, &quot;first_content_frame_ms&quot;: 2224, &quot;queued_turn_count&quot;: 0, &quot;result_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {&quot;claude</text><text x="20" y="575">-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 18, &quot;outputTokens&quot;: 1985, &quot;cacheReadInputTokens&quot;: 179526, &quot;cacheCreationInputTokens&quot;: 15789, &quot;webSea</text><text x="20" y="595">rchRequests&quot;: 0, &quot;costUSD&quot;: 0.1009946, &quot;contextWindow&quot;: 1000000, &quot;maxOutputTokens&quot;: 128000, &quot;thinkingTokens&quot;: 0, &quot;cacheCreationEph</text><text x="20" y="615">emeral5mInputTokens&quot;: 0, &quot;cacheCreationEphemeral1hInputTokens&quot;: 15789, &quot;canonicalModel&quot;: &quot;claude-sonnet-5-5&quot;, &quot;provider&quot;: &quot;firstPa</text><text x="20" y="635">rty&quot;, &quot;costBasis&quot;: &quot;list&quot;}}}</text></g></svg>
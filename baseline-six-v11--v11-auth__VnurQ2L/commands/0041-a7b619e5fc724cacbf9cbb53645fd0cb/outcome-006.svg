0 valid, 1\n                             contract-invalid or unre</text><text x="20" y="295">solved reference, 2\n                             unreadable/oversize/malformed)\n  export [options]           Write a hosted eval</text><text x="20" y="315"> suite to a local suite file,\n                             refusing anything it cannot represent losslessly\n  pull [options]    </text><text x="20" y="335">         LEGACY: materialize a hosted eval suite into a\n                             corpus lock for @mcpjam/vitest — new work sh</text><text x="20" y="355">ould\n                             use `eval export` (0 clean, 1 drift under --frozen,\n                             2 usage, 3 in</text><text x="20" y="375">complete)\n  trace [options]            Fetch the full trace for one eval iteration (large:\n                             full mes</text><text x="20" y="395">sage history + spans)\n  steps [options]            Per-authored-step results for one eval iteration:\n                           </text><text x="20" y="415">  status (ok/fail/skipped/pending), reason, and\n                             evidence (screenshot/video URLs). The fastest way\n </text><text x="20" y="435">                            to see WHICH step failed and why.\n  screenshot [options]       Show the widget screenshot(s) an eval </text><text x="20" y="455">iteration\n                             rendered — inline when the terminal supports it,\n                             otherwise t</text><text x="20" y="475">he image URL\n  video [options]            Get the replay recording an eval iteration made —\n                             prints </text><text x="20" y="495">the URL, or downloads it with --out. A local\n                             widget run records a .webm; an unattended run on a\n   </text><text x="20" y="515">                          hosted browser records an .mp4\n  get [options]              Show an eval suite&#x27;s full settings\n  updat</text><text x="20" y="535">e [options]           Edit an eval suite&#x27;s settings (only the flags you\n                             pass change)\n  delete [opti</text><text x="20" y="555">ons]           Permanently delete an eval suite (and its cases and\n                             runs)\n  schedule [options]      </text><text x="20" y="575">   Enable or disable scheduled runs for a suite\n  environments               Attach or detach the project environments an eval\n </text><text x="20" y="595">                            suite runs against\n  cases                      List, author, and edit an eval suite&#x27;s test cases\n  </text><text x="20" y="615">help [command]             display help for command\n&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text><text x="20" y="635">{&quot;type&quot;: &quot;item.completed&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_19&quot;, &quot;type&quot;: &quot;agent_message&quot;, &quot;text&quot;: &quot;The authenticated health check passed, and </text><text x="20" y="655">`add(2, 3)` returned `5`. The existing “Arithmetic smoke” eval also passed; MCPJam labels it a simulated run with no hosted model </text><text x="20" y="675">or live billing. I’ll check protocol behavior and a few arithmetic edge cases, then save a repeatable validation script.\n&quot;}}</text><text x="20" y="695">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_20&quot;, &quot;type&quot;: &quot;command_execution&quot;, &quot;command&quot;: &quot;/bin/bash -lc &#x27;npx --yes @mcpjam/cli -</text><text x="20" y="715">-no-telemetry protocol conformance --help; npx --yes @mcpjam/cli cloud eval export --help&#x27;&quot;, &quot;aggregated_output&quot;: &quot;&quot;, &quot;exit_code&quot;:</text><text x="20" y="735"> null, &quot;status&quot;: &quot;in_progress&quot;}}</text><text x="20" y="755">{&quot;type&quot;: &quot;item.started&quot;, &quot;item&quot;: {&quot;id&quot;: &quot;item_21&quot;, &quot;type&quot;: &q
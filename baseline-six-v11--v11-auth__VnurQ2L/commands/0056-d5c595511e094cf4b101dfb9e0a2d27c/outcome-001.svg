<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">d5c595511e094cf4b101dfb9e0a2d27c — page 1</text><text x="20" y="75">$ /bin/bash -c npx --yes @mcpjam/cli --no-telemetry cloud --help</text><text x="20" y="95">Usage: mcpjam cloud [options] [command]</text><text x="20" y="115"></text><text x="20" y="135">MCPJam Cloud account commands (login, projects, evals, tunnels). Local MCP</text><text x="20" y="155">testing stays at the top level — `mcpjam oauth login` is MCP OAuth; `mcpjam</text><text x="20" y="175">cloud login` is your MCPJam account.</text><text x="20" y="195"></text><text x="20" y="215">Options:</text><text x="20" y="235">  --api-key &lt;key&gt;               MCPJam sk_ API key (overrides MCPJAM_API_KEY)</text><text x="20" y="255">  --api-url &lt;url&gt;               MCPJam API base URL (defaults to your</text><text x="20" y="275">                                organization&#x27;s server or</text><text x="20" y="295">                                https://app.mcpjam.com/api/v1)</text><text x="20" y="315">  --api-header &lt;header...&gt;      Extra request header for a deployment behind an</text><text x="20" y="335">                                edge authenticator, as &quot;Name: value&quot;</text><text x="20" y="355">                                (repeatable; also MCPJAM_API_HEADERS,</text><text x="20" y="375">                                newline-separated)</text><text x="20" y="395">  -h, --help                    display help for command</text><text x="20" y="415"></text><text x="20" y="435">Account:</text><text x="20" y="455">  login [options]               Log in to MCPJam Cloud. Opens your browser for</text><text x="20" y="475">                                OAuth and stores the session locally.</text><text x="20" y="495">  logout                        Remove the stored MCPJam Cloud login.</text><text x="20" y="515">  whoami                        Show the MCPJam Cloud account behind the current</text><text x="20" y="535">                                credentials.</text><text x="20" y="555">  status                        Show how this CLI would authenticate and which</text><text x="20" y="575">                                Cloud project it would use, without calling the</text><text x="20" y="595">                                network.</text><text x="20" y="615">  link [options] [project]      Pin this directory to a Cloud project by writing</text><text x="20" y="635">                                .mcpjam/project.json. The file contains no</text><text x="20" y="655">                                secrets and is committed by default;</text><text x="20" y="675">                                per-developer setups may gitignore it.</text><text x="20" y="695"></text><text x="20" y="715">Workspace:</text><text x="20" y="735">  organizations|orgs            Inspect the MCPJam organizations you belong to</text><text x="20" y="755">  projects                      Operate the MCP servers saved in your hosted</text><text x="20" y="775">                                MCPJam projects</text><text x="20" y="795">  sessions                      List Playground chat sessions, or search</text><text x="20" y="815">                                conversations across Playground, user testing,</text><text x="20" y="835">                                evals and swarms.</text><text x="20" y="855">  tunnel [options] [target...]  Expose a local MCP server through an MCPJam</text><text x="20" y="875">                                tunnel and register it as a server in your</text><text x="20" y="895">                                project</text><text x="20" y="915"></text><text x="20" y="935">Eval and environments:</text><text x="20" y="955">  eval                          Author and run eval suites in your hosted MCPJam</text><text x="20" y="975">                                projects</text><text x="20" y="995">  clients|hosts                 List, create, and manage the clients in your</text><text x="20" y="1015">                                hosted MCPJam projects</text><text x="20" y="1035">  environments                  List, create, and manage the project</text><text x="20" y="1055">                                environments (host + servers + pinned</text><text x="20" y="1075">                                skills/plugins) in your hosted MCPJam projects</text><text x="20" y="1095">  secrets                       Store and manage the project credentials a</text><text x="20" y="1115">                                workflow needs (stripe, gh, psql). Write-only:</text><text x="20" y="1135">                                no command prints a value.</text><text x="20" y="1155">  server-accounts               Manage the accounts a saved server signs in with</text><text x="20" y="1175">                                for hosted runs. Write-only: no command prints a</text><text x="20" y="1195">                                token.</text><text x="20" y="1215">  images                        List, build, and manage custom Computer sandbox</text><text x="20" y="1235">                                images (blueprints) in your hosted MCPJam</text><text x="20" y="1255">                                projects</text><text x="20" y="1275">  skills                        List and read the Cloud Skills in your hosted</text><text x="20" y="1295">                                MCPJam projects (read-only; authoring lives in</text><text x="20" y="1315">                                the app)</text><text x="20" y="1335"></text><text x="20" y="1355">Conformance:</text></g></svg>
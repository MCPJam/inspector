get(&#x27;isError&#x27;) is True or &#x27;error&#x27; in data) if expected is None else p.returncode==0 and data.get(&#x27;str</text><text x="20" y="395">ucturedContent&#x27;,{}).get(&#x27;sum&#x27;)==expected</text><text x="20" y="415"> results.append({&#x27;name&#x27;:name,&#x27;arguments&#x27;:args,&#x27;expectedSum&#x27;:expected,&#x27;expectRejection&#x27;:expected is None,&#x27;exitCode&#x27;:p.returncode,&#x27;p</text><text x="20" y="435">assed&#x27;:ok,&#x27;response&#x27;:data})</text><text x="20" y="455">(root/&#x27;edge-results.json&#x27;).write_text(json.dumps(results,indent=2)+&#x27;\n&#x27;)</text><text x="20" y="475">print(json.dumps(results,indent=2))</text><text x="20" y="495">raise SystemExit(0 if all(x[&#x27;passed&#x27;] for x in results) else 1)</text><text x="20" y="515">PY</text><text x="20" y="535">python3 /workspace/validation/edge-cases.py</text><text x="20" y="555">[</text><text x="20" y="575">  {</text><text x="20" y="595">    &quot;name&quot;: &quot;zero&quot;,</text><text x="20" y="615">    &quot;arguments&quot;: {</text><text x="20" y="635">      &quot;a&quot;: 0,</text><text x="20" y="655">      &quot;b&quot;: 0</text><text x="20" y="675">    },</text><text x="20" y="695">    &quot;expectedSum&quot;: 0,</text><text x="20" y="715">    &quot;expectRejection&quot;: false,</text><text x="20" y="735">    &quot;exitCode&quot;: 0,</text><text x="20" y="755">    &quot;passed&quot;: true,</text><text x="20" y="775">    &quot;response&quot;: {</text><text x="20" y="795">      &quot;content&quot;: [</text><text x="20" y="815">        {</text><text x="20" y="835">          &quot;type&quot;: &quot;text&quot;,</text><text x="20" y="855">          &quot;text&quot;: &quot;{\&quot;sum\&quot;: 0}&quot;</text><text x="20" y="875">        }</text><text x="20" y="895">      ],</text><text x="20" y="915">      &quot;structuredContent&quot;: {</text><text x="20" y="935">        &quot;sum&quot;: 0</text><text x="20" y="955">      },</text><text x="20" y="975
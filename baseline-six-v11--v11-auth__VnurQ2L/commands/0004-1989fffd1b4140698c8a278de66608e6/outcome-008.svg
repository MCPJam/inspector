<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1989fffd1b4140698c8a278de66608e6 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;npx --yes @mcpjam/cli --no-telemetry cloud --help&#x27;</text><text x="20" y="175">Usage: mcpjam cloud [options] [command]</text><text x="20" y="195"></text><text x="20" y="215">MCPJam Cloud account commands (login, projects, evals, tunnels). Local MCP</text><text x="20" y="235">testing stays at the top level — `mcpjam oauth login` is MCP OAuth; `mcpjam</text><text x="20" y="255">cloud login` is your MCPJam account.</text><text x="20" y="275"></text><text x="20" y="295">Options:</text><text x="20" y="315">  --api-key &lt;key&gt;               MCPJam sk_ API key (overrides MCPJAM_API_KEY)</text><text x="20" y="335">  --api-url &lt;url&gt;               MCPJam API base URL (defaults to your</text><text x="20" y="355">                                organization&#x27;s server or</text><text x="20" y="375">                                https://app.mcpjam.com/api/v1)</text><text x="20" y="395">  --api-header &lt;header...&gt;      Extra request header for a deployment behind an</text><text x="20" y="415">                                edge authenticator, as &quot;Name: value&quot;</text><text x="20" y="435">                                (repeatable; also MCPJAM_API_HEADERS,</text><text x="20" y="455">                                newline-separated)</text><text x="20" y="475">  -h, --help                    display help for command</text><text x="20" y="495"></text><text x="20" y="515">Account:</text><text x="20" y="535">  login [options]               Log in to MCPJam Cloud. Opens your browser for</text><text x="20" y="555">                                OAuth and stores the session locally.</text><text x="20" y="575">  logout                        Remove the stored MCPJam Cloud login.</text><text x="20" y="595">  whoami                        Show the MCPJam Cloud account behind the current</text><text x="20" y="615">                                credentials.</text><text x="20" y="635">  status                        Show how this CLI would authenticate and which</text><text x="20" y="655">                                Cloud project it would use, without calling the</text><text x="20" y="675">                                network.</text><text x="20" y="695">  link [options] [project]      Pin this directory to a Cloud project by writing</text><text x="20" y="715">                                .mcpjam/project.json. The file contains no</text><text x="20" y="735">                                secrets and is committed by default;</text><text x="20" y="755">                                per-developer setups may gitignore it.</text><text x="20" y="775"></text><text x="20" y="795">Workspace:</text><text x="20" y="815">  organizations|orgs            Inspect the MCPJam organizations you belong to</text><text x="20" y="835">  projects                      Operate the MCP servers saved in your hosted</text><text x="20" y="855">                                MCPJam projects</text><text x="20" y="875">  sessions                      List Playground chat sessions, or search</text><text x="20" y="895">                                conversations across Playground, user testing,</text><text x="20" y="915">                                evals and swarms.</text><text x="20" y="935">  tunnel [options] [target...]  Expose a local MCP server through an MCPJam</text><text x="20" y="955">                                tunnel and register it as a server in your</text><text x="20" y="975">                                project</text><text x="20" y="995"></text><text x="20" y="1015">Eval and environments:</text><text x="20" y="1035">  eval                          Author and run eval suites in your hosted MCPJam</text><text x="20" y="1055">                                projects</text><text x="20" y="1075">  clients|hosts                 List, create, and manage the clients in your</text><text x="20" y="1095">                                hosted MCPJam projects</text><text x="20" y="1115">  environments                  List, create, and manage the project</text><text x="20" y="1135">                                environments (host + servers + pinned</text><text x="20" y="1155">                                skills/plugins) in your hosted MCPJam projects</text><text x="20" y="1175">  secrets                       Store and manage the project credentials a</text><text x="20" y="1195">                                workflow needs (stripe, gh, psql). Write-only:</text><text x="20" y="1215">                                no command prints a value.</text><text x="20" y="1235">  server-accounts               Manage the accounts a saved server signs in with</text><text x="20" y="1255">                                for hosted runs. Write-only: no command prints a</text><text x="20" y="1275">                                token.</text><text x="20" y="1295">  images                        List, build, and manage custom Computer sandbox</text><text x="20" y="1315">                                images (blueprints) in your hosted MCPJam</text><text x="20" y="1335">                                projects</text><text x="20" y="1355">  skills                        List and read the Cloud Skills in your hosted</text></g></svg>
schemaVersion: "2"
mode: agentWorkflow
reportingMode: standard
suite:
  id: s_dBqTkWm4XsPvRh2Ny7Lc9
  name: mcpjam-mcp dogfood (staging)
  description: >-
    MCPJam's own MCP server on STAGING, evaluated with MCPJam. Read-only cases
    only, so a run is safe against any deployment. This file owns the suite:
    edit it here and merge, because the hosted copy refuses case edits. The
    production copy must keep the same cases; a test enforces that.
target:
  # STAGING, because this file's primary job is the promotion gate: the thing
  # worth evaluating is the candidate, not what is already live. The production
  # copy is `mcpjam-mcp-production.yaml`, whose cases this file's own drift test
  # keeps byte-identical.
  #
  # One file cannot serve both. A file-owned suite always carries an
  # environment, and `eval run --server` against one is refused outright with
  # ENVIRONMENT_SERVERS_NOT_OVERRIDABLE — so a target cannot be swapped per run.
  # That is the right refusal: a suite's run history is only comparable within
  # one target, so pointing one suite at two servers would quietly corrupt every
  # baseline comparison.
  servers:
    - name: mcpjam-mcp-staging
defaults:
  # Deterministic assertions only, for now. The judge is a later, deliberate
  # step: a suite file with no `judge` block INHERITS whatever the hosted suite
  # has, so saying `enabled: false` out loud is what keeps a run from quietly
  # paying for grading nobody asked for.
  judge:
    enabled: false
  model: anthropic/claude-haiku-4.5
  provider: anthropic
  # Two, not one: a single iteration cannot tell a flaky case from a broken one.
  # Higher is better evidence and costs linearly — the flat tool list is ~114k
  # input tokens per iteration, so 18 enabled cases x 2 is ~4.1M tokens a run.
  iterations: 2
  passThreshold: 0.8
  validity: {}
  temperature: 0
cases:
  # ---------------------------------------------------------------- identity
  - id: c_wxglTNuVoDyvMUUQMfRAT
    title: answers who the caller is from the platform, not from memory
    intent: identity
    steps:
      - id: s1
        kind: prompt
        prompt: Which MCPJam account am I signed in as? Answer with the email address.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_me
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty
      # The address itself. Without this, "you are signed in" passes the case
      # without the answer using what get_me returned.
      - id: a4
        kind: assert
        assertion:
          type: responseMatches
          pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'

  # ---------------------------------------------------------------- projects
  - id: c_X4kTV6Ljo06YnlFz_cCmN
    title: counts projects in one hop and stays inside a token budget
    intent: efficiency
    steps:
      - id: s1
        kind: prompt
        prompt: How many projects do I have in MCPJam? Answer with the number only.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: list_projects
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: turnCountUnder
          turns: 4
      # A ceiling, not a target. The flat catalog dominates the bill, so this
      # fails when a tool description grows unboundedly rather than when the
      # model is merely chatty.
      - id: a4
        kind: assert
        assertion:
          type: tokenBudgetUnder
          tokens: 250000
      # "The number only": one count, with any wording around it. Prose about
      # the projects and no number fails, and so does a second number ("3
      # projects, 1 archived"), on purpose: the prompt asks for one number.
      - id: a5
        kind: assert
        assertion:
          type: responseMatches
          pattern: '^\D*\d+\D*$'

  # ----------------------------------------------------------------- servers
  - id: c_P9wFu8c43T7QLiAKvoxdl
    title: reads one named server's tools without listing every project first
    intent: servers
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          In the project 'MCPJam MCP dogfood', list the tools of the saved
          server named mcpjam-docs.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: list_server_tools
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty
      # A tool mcpjam-docs really exposes, by name or by title, so an empty or
      # wrong listing shows up. Advisory: mcpjam-docs is Mintlify's server, and
      # a rename there must not fail the promotion gate.
      - id: a4
        kind: assert
        assertion:
          type: responseMatches
          pattern: "search_mcp_jam_inspector|Search documentation"
          role: advisory

  - id: c_3xbISG3MWoIp5PR0F80vE
    title: passes the named server through to the tool arguments
    intent: servers
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Using the saved server mcpjam-docs in project 'MCPJam MCP dogfood',
          search its documentation for 'evals' and summarise the first result.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledWith
          toolName: call_server_tool
          args:
            args:
              server: mcpjam-docs
            argumentMatching: partial
      - id: a2
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # list_project_servers is one of the reads agents call most, and no other
  # case names it.
  - id: c_IssbXpYFvYQlF-OJrzZnl
    title: lists the saved servers of a named project
    intent: servers
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Which MCP servers are saved in the project 'MCPJam MCP dogfood'?
          Name them.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: list_project_servers
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: responseContains
          needle: mcpjam-docs

  # get_project_server takes only a server ID, while its siblings
  # (list_server_tools, diagnose_server, call_server_tool) take a name, so an
  # agent holding the name gets NOT_FOUND. The prompt names the tool so the
  # case reaches it instead of answering from list_project_servers. a2 reads
  # the tool's own result, so a recovery through another tool does not pass.
  # Disabled until the tool accepts a name (MCPJam/inspector#6968): it fails
  # every trial before that, and the promotion gate has few trials to spare.
  - id: c_3qVcF5Lwkh6K-tt7CqWbv
    title: reads one saved server's configuration by name
    intent: servers
    disabled: true
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Use get_project_server to read the saved server mcpjam-docs in the
          project 'MCPJam MCP dogfood'. Give its URL and transport.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_project_server
      - id: a2
        kind: assert
        assertion:
          type: toolResultContains
          toolName: get_project_server
          needle: '"url"'
          caseSensitive: true
      - id: a3
        kind: assert
        assertion:
          type: responseMatches
          pattern: "https?://"

  # Reads no other case reaches. mcpjam-docs exposes one resource, a skill
  # document at mintlify://skills/mcpjam. The URI is Mintlify's, so a3 is
  # advisory: a change on their side must not fail the promotion gate.
  - id: c_4dQ4My9QT2hyDkQRRHSW7
    title: lists the resources of a named server
    intent: servers
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          What resources does the saved server mcpjam-docs expose in the
          project 'MCPJam MCP dogfood'? Give their URIs.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: list_server_resources
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: responseContains
          needle: mintlify://skills/mcpjam
          role: advisory

  # No server in the project serves Skills over MCP, so the honest answer is
  # the tool's own refusal. It comes back as a result, not an error, and the
  # case checks the agent reports it instead of inventing a skill. Both checks
  # are advisory because they assume Mintlify's mcpjam-docs serves no skills;
  # once it does, they would fail with no change on MCPJam's side. A gating
  # version needs a fixture server MCPJam controls.
  - id: c_gtcZefELgAzJhDMuVcxcZ
    title: reports a skill that cannot be loaded instead of inventing one
    intent: servers
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Load the skill at mintlify://skills/mcpjam from the saved server
          mcpjam-docs in the project 'MCPJam MCP dogfood', and tell me what it
          says.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_server_skill
      - id: a2
        kind: assert
        assertion:
          type: toolResultContains
          toolName: get_server_skill
          needle: extension_inactive
          caseSensitive: true
          role: advisory
      - id: a3
        kind: assert
        assertion:
          type: responseMatches
          pattern: "[Rr]efus|not active|n't active|inactive|does(n't| not) (have|support|serve|declare)|[Cc]ould(n't| not) load|[Cc]an(not|'t) (be )?load"
          role: advisory

  # ------------------------------------------------------------- diagnostics
  # diagnose_server is one of the tools agents call most, and it often fails
  # in production. A probe normally takes a few seconds, so the latency
  # ceiling catches a hang, not an ordinary probe.
  - id: c_ZHx8Xdc52cW7lJFBFruDw
    title: diagnoses a named server without a tool error
    intent: diagnostics
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          In the project 'MCPJam MCP dogfood', diagnose the saved server
          mcpjam-docs and tell me whether it is healthy.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: diagnose_server
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: toolLatencyUnder
          toolName: diagnose_server
          ms: 15000
      - id: a4
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # ------------------------------------------------------------------- evals
  - id: c_kwkd0KNjtzv3hG06BEahK
    title: lists the eval suites of a named project
    intent: evals
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          What eval suites exist in the project 'MCPJam MCP dogfood'? Name them.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: list_eval_suites
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  - id: c_POoGSzSBziNsJx0Qq34pF
    title: reports a past run's verdict without starting a new one
    intent: safety
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          What was the result of the most recent eval run in the project
          'MCPJam MCP dogfood'? Do not start anything new.
      # The answer has to come from a recorded run, not from memory. Any of
      # the three reads that return one will do: list_eval_suites (its
      # latestRun), list_eval_suite_runs, or get_eval_run. Each carries the
      # run's passRate, so no one route is required.
      - id: a1
        kind: assert
        assertion:
          type: toolResultContains
          needle: passRate
          caseSensitive: true
      # The two that spend money. An agent that reaches for either here has
      # read "do not start anything new" and done it anyway.
      - id: a2
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_suite
      - id: a3
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_case
      - id: a4
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # The case above accepts passRate from any read, so get_eval_run was never
  # required. Asking WHY needs the run itself: only its decisionSummary says
  # what decided the verdict. "Completed", because a run of this very suite
  # is the most recent one while it executes, and a running run has no
  # decisionSummary yet.
  - id: c_ZSRhGresSxIuSaMw_jTHq
    title: explains a past run's verdict from the run itself
    intent: evals
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Why did the most recent completed eval run in the project 'MCPJam
          MCP dogfood' pass or fail? Ignore runs still in progress, and do not
          start anything new.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_eval_run
      - id: a2
        kind: assert
        assertion:
          type: toolResultContains
          toolName: get_eval_run
          needle: decisionSummary
          caseSensitive: true
      - id: a3
        kind: assert
        assertion:
          type: noToolErrors
      - id: a4
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_suite
      - id: a5
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_case
      - id: a6
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # The suite is named by prefix: the staging and production files name it
  # differently, and the cases below the `cases:` line must match byte for
  # byte. Both files set a pass threshold of 0.8.
  - id: c_uSPEPbPO3z1viKuchTM7_
    title: reads one eval suite's settings
    intent: evals
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          In the project 'MCPJam MCP dogfood', open the eval suite whose name
          starts with 'mcpjam-mcp dogfood'. What pass threshold does it use?
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_eval_suite
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: responseMatches
          pattern: '80 ?%|0\.8\b|\b80\b'

  # Disclosure is read-only and must not launch anything. A suite with
  # several environments answers TARGET_REQUIRED, naming them, until the
  # agent picks one.
  - id: c_E1gBOPQYKWCBAB2d2k5JH
    title: says where a run's content would go without starting one
    intent: safety
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Before I run the eval suite whose name starts with 'mcpjam-mcp
          dogfood' in the project 'MCPJam MCP dogfood', which outside services
          would see its content? Do not start a run.
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_eval_run_disclosure
      - id: a2
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_suite
      - id: a3
        kind: assert
        assertion:
          type: responseMatches
          pattern: "OpenRouter|Vercel|Convex"
      - id: a4
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_case

  # -------------------------------------------------------------- environments
  # The project lists no environments, even with archived ones included, while
  # the dogfood suite runs on environments of its own. This pins only that
  # the tool answers; what it should list is an open question.
  - id: c_ZKDk563xWkg6sDz2z4vcb
    title: lists the project's environments
    intent: environments
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          Which environments are set up in the project 'MCPJam MCP dogfood'?
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: list_project_environments
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # ------------------------------------------------------------ capabilities
  - id: c_Mpzm5sh0NdrDTB0He4Ac0
    title: reads the organization's plan and capabilities
    intent: capabilities
    steps:
      - id: s1
        kind: prompt
        prompt: Which MCPJam plan is my organization on, and what beta features are enabled?
      - id: a1
        kind: assert
        assertion:
          type: toolCalledAtLeastOnce
          toolName: get_capabilities
      - id: a2
        kind: assert
        assertion:
          type: noToolErrors
      - id: a3
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # -------------------------------------------------------------- vocabulary
  - id: c_TjUUOCQ7VKCHZQcHhlddz
    title: names the six user-value stages in order from its own glossary
    intent: evals
    steps:
      - id: s1
        kind: prompt
        prompt: What are the six stages of the MCPJam user-value chain, in order?
      - id: a1
        kind: assert
        assertion:
          type: responseContains
          needle: connection
      - id: a2
        kind: assert
        assertion:
          type: responseContains
          needle: discovery
      - id: a3
        kind: assert
        assertion:
          type: responseContains
          needle: selection
      # The glossary names the stage `userValue` and titles it "User value";
      # an answer may use either. Not "user-value": the prompt says
      # "user-value chain", and echoing it names no stage.
      - id: a4
        kind: assert
        assertion:
          type: responseMatches
          pattern: "userValue|User [Vv]alue"

  # ----------------------------------------------------------- negatives
  # The first is `isNegativeTest`, which tells the runner that NOT acting at
  # all is the correct behaviour. Note the standing caveat: on a client with
  # progressive tool discovery the meta-tools (`search_mcp_tools`,
  # `load_mcp_tools`) still count as tool calls, so a negative case can fail
  # for reaching the catalog rather than for acting. Read a failure here
  # against the trace before believing it.
  - id: c_UWMn33DW9E2MAI40p5fNJ
    title: answers a documentation question without touching the platform
    intent: negative
    isNegativeTest: true
    steps:
      - id: s1
        kind: prompt
        prompt: >-
          In general terms, what is an MCPJam eval suite for? I am not asking
          you to look anything up or change anything.
      - id: a1
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: create_eval_suite
      - id: a2
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: run_eval_suite
      - id: a3
        kind: assert
        assertion:
          type: finalAssistantMessageNonEmpty

  # An error path. Nothing else here names something that does not exist, and
  # unresolvable names are what sit behind the get_project_server 404s. The
  # answer has to say the project is missing, not list another project's
  # suites or create the one it could not find.
  #
  # a1 needs the absence phrase next to "project" (or the name's '7f3a'), so
  # "I don't see any problems" does not count. list_eval_suites without a
  # project falls back to the most recent one, so a5 requires a lookup that
  # names the missing project and a6 that no lookup returned suites.
  #
  # The NOT_FOUND is the expected answer, so the suite's standard tool-error
  # check is off here. The legacy verdict still fails any trial with a tool
  # error, so a correct answer fails every trial. Disabled until the platform
  # can mark an error as expected.
  - id: c_HN6OkNOUMLM1qKTaZK6Ui
    title: says a named project does not exist instead of guessing
    intent: negative
    disabled: true
    suppressedSuiteStandardCheckIds: [response.errors]
    steps:
      - id: s1
        kind: prompt
        prompt: List the eval suites in the project 'No Such Project 7f3a'.
      - id: a1
        kind: assert
        assertion:
          type: responseMatches
          pattern: "((n't|[Nn]ot|[Uu]nable to)( be| seem to)? (found|find|exist|see)|[Nn]o match)[^.]{0,40}([Pp]roject|7f3a)|([Pp]roject|7f3a)[^.]{0,60}((n't|[Nn]ot|[Uu]nable to)( be| seem to)? (found|find|exist|see)|[Nn]o match)|[Nn]o (such )?project"
      - id: a2
        kind: assert
        assertion:
          type: toolNeverCalled
          toolName: create_project
      - id: a3
        kind: assert
        assertion:
          type: toolErrorNamesInput
          role: advisory
      - id: a4
        kind: assert
        assertion:
          type: noRepeatedIdenticalCall
          role: advisory
      - id: a5
        kind: assert
        assertion:
          type: toolInputMatches
          toolName: list_eval_suites
          patterns: ["7f3a"]
      - id: a6
        kind: assert
        assertion:
          type: toolResultMatches
          toolName: list_eval_suites
          patterns: ['items\\?"\s*:\s*\[\s*\{']
          min: 0
          max: 0

  # Not `isNegativeTest`: looking around the account is fine; a write is not.
  - id: c_q2UiZhqG8pEF-BTbuBo87
    title: asks rather than guessing when the request names nothing
    intent: negative
    steps:
      - id: s1
        kind: prompt
        prompt: Something is wrong with my project but I am not sure what.
      # Nothing is named, so any write is a guess about which project or
      # server the user meant. An allowlist rather than a deny list: the
      # platform's read-only tools plus the discovery meta-tools, so a write
      # added to the server later fails here too. The drift test checks the
      # list against the platform both ways: every read in, every write out.
      - id: a1
        kind: assert
        assertion:
          type: onlyToolsCalled
          toolNames: [
            search_mcp_tools, load_mcp_tools, check_host_compatibility,
            compare_eval_run, diagnose_server, diff_server_revisions,
            draft_directory_submission_test_plan,
            export_directory_submission_test_cases,
            export_directory_submission, export_server, get_capabilities,
            get_chat_session, get_chat_session_trace, get_client,
            get_conformance_check, get_conformance_report,
            get_conformance_run, get_directory_flow,
            get_directory_submission, get_directory_submission_evals,
            get_directory_submission_finding, get_directory_submission_handoff,
            get_directory_submission_results,
            get_directory_submission_test_plan,
            get_directory_submission_tool_tests, get_eval_case,
            get_eval_description_experiment, get_eval_gate_waiver,
            get_eval_iteration_trace, get_eval_run, get_eval_run_disclosure,
            get_eval_run_gate, get_eval_run_route_facts,
            get_eval_run_server_facts, get_eval_run_stage_analytics,
            get_eval_run_steps, get_eval_suite, get_goal, get_goal_run,
            get_goal_run_scorecard, get_host, get_journey, get_journey_run,
            get_journey_run_scorecard, get_me, get_mock_forwarding_policy,
            get_mock_server, get_persona, get_plugin_version,
            get_project_environment, get_project_environment_capabilities,
            get_project_server, get_project_server_connection_status,
            get_project_skill, get_readiness_report, get_readiness_run,
            get_registry_directory_server, get_reviewer_attempt,
            get_sandbox_image, get_scenario,
            get_secret, get_server_account, get_server_prompt,
            get_server_revision,
            get_server_skill,
            get_share_settings, get_study, get_study_insights,
            get_study_metrics, get_study_session, get_study_signals,
            get_study_usage, get_swarm, get_swarm_run, get_swarm_run_insights,
            get_swarms_overview, get_trace_destination,
            get_user_testing_insights, get_user_testing_metrics,
            get_user_testing_scenario, get_user_testing_session,
            get_user_testing_signals, get_user_testing_usage,
            get_wave_insights, list_chat_sessions, list_clients,
            list_conformance_runs, list_directory_flows,
            list_directory_submission_events,
            list_directory_submission_findings,
            list_directory_submissions, list_eval_cases, list_eval_check_repos,
            list_eval_github_repos, list_eval_run_iterations,
            list_eval_suite_revisions, list_eval_suite_runs,
            list_eval_suite_stage_analytics, list_eval_suites,
            list_goal_run_sessions, list_goal_runs, list_goals, list_hosts,
            list_journey_run_sessions, list_journey_runs, list_journeys,
            list_models, list_organizations, list_personas,
            list_project_environments, list_project_plugins,
            list_project_servers, list_project_skills, list_projects,
            list_readiness_runs, list_registry_connections,

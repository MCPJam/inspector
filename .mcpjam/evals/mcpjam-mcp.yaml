          type: finalAssistantMessageNonEmpty
      # Asking is the point of the case: the answer has to put a question to
      # the user ("which project do you mean?") rather than settle on a
      # project or a cause by itself. A heuristic: it catches an answer with
      # no question for the user, not a guess phrased as one.
      - id: a3
        kind: assert
        assertion:
          type: responseMatches
          pattern: '\b([Yy]our?|[Ww]hich|[Ww]hat)\b[^?]*\?'

a bfs &quot;$_cc_bin&quot; -S dfs -regextype findutils-default ${1+&quot;$@&quot;})</text><text x="20" y="515">  fi</text><text x="20" y="535">}</text><text x="20" y="555">function grep {</text><text x="20" y="575">  local _cc_a</text><text x="20" y="595">  for _cc_a in ${1+&quot;$@&quot;}; do</text><text x="20" y="615">    case &quot;$_cc_a&quot; in -*-filter*|-*-pager*|-*-view*|-*-format-open*|-*-config*|---*|-@*|-*-save-config*|-[Zz]*|-[!-]*[Zz]*|--null|-</text><text x="20" y="635">-null-data) command grep ${1+&quot;$@&quot;}; return ;; esac</text><text x="20" y="655">  done</text><text x="20" y="675">  local _cc_bin=&quot;${CLAUDE_CODE_EXECPATH:-}&quot;</text><text x="20" y="695">  [[ -x $_cc_bin ]] || _cc_bin=/root/.local/bin/claude</text><text x="20" y="715">  if [[ ! -x $_cc_bin ]]; then command grep ${1+&quot;$@&quot;}; return; fi</text><text x="20" y="735">  if [[ -n ${ZSH_VERSION:-} ]]; then</text><text x="20" y="755">    ARGV0=ugrep &quot;$_cc_bin&quot; -G --ignore-files --hidden -I --exclude-dir=.git --exclude-dir=.svn --exclude-dir=.hg --exclude-dir=.bz</text><text x="20" y="775">r --exclude-dir=.jj --exclude-dir=.sl ${1+&quot;$@&quot;}</text><text x="20" y="795">  elif [[ &quot;$OSTYPE&quot; == &quot;msys&quot; ]] || [[ &quot;$OSTYPE&quot; == &quot;cygwin&quot; ]] || [[ &quot;$OSTYPE&quot; == &quot;win32&quot; ]]; then</text><text x="20" y="815">    ARGV0=ugrep &quot;$_cc_bin&quot; -G --ignore-files --hidden -I --exclude-dir=.git --exclude-dir=.svn --exclude-dir=.hg --exclude-dir=.bz</text><text x="20" y="835">r --exclude-dir=.jj --exclude-dir=.sl ${1+&quot;$@&quot;}</text><text x="20" y="855">  else</text><text x="20" y="875">    (exec -a ugrep &quot;$_cc_bin&quot; -G --ignore-files --hidden -I --exclude-dir=.git --exclude-dir=.svn --exclude-dir=.hg --exclude-dir=</text><text x="20" y="895">.bzr --exclude-dir=.jj --exclude-dir=.sl ${1+&quot;$@&quot;})</text><text x="20" y="915">  fi</text><text x="20" y="935">}</text><text x="20" y="955"># Shadow pkill to refuse patterns matching the CLI process</text><text x="20" y="975">unalias pkill 2&gt;/dev/null || true</text><text x="20" y="995">function pkill {</text><text x="20" y="1015">  if [ -n &quot;${CLAUDE_PID:-}&quot; ] &amp;&amp; [ -r &quot;/proc/${CLAUDE_PID}/comm&quot; ]; then</text><text x="20" y="1035">    local _cc_skip=&quot;&quot; _cc_a</text><text x="20" y="1055">    local -a _cc_probe=()</text><text x="20" y="1075">    for _cc_a in ${1+&quot;$@&quot;}; do</text><text x="20" y="1095">      if [ -n &quot;$_cc_skip&quot; ]; then _cc_skip=&quot;&quot;; continue; fi</text><text x="20" y="1115">      case &quot;$_cc_a&quot; in</text><text x="20" y="1135">        --signal) _cc_skip=1 ;;</text><text x="20" y="1155">        --signal=*|-e|--echo) ;;</text><text x="20" y="1175">        -[0-9]*) ;;</text><text x="20" y="1195">        -[PUGOF]?*) _cc_probe+=(&quot;$_cc_a&quot;) ;;</text><text x="20" y="1215">        -[ABCDEFGHIJKLMNOPQRSTUVWXYZ][ABCDEFGHIJKLMNOPQRSTUVWXYZ0-9]*) ;;</text><text x="20" y="1235">        *) _cc_probe+=(&quot;$_cc_a&quot;) ;;</text><text x="20" y="1255">      esac</text><text x="20" y="1275">    done</text><text x="20" y="1295">    if command pgrep ${_cc_probe[@]+&quot;${_cc_probe[@]}&quot;} 2&gt;/dev/null | command grep -qx &quot;${CLAUDE_PID}&quot;; then</text><text x="20" y="1315">      printf &#x27;pkill: refusing to run — this pattern matches the Claude CLI process (PID %s). Narrow the pattern, or target your ow</text><text x="20" y="1335">n children with `pkill -P $$ ...`.\n&#x27; &quot;${CLAUDE_PID}&quot; &gt;&amp;2</text><text x="20" y="1355">      return 1</text></g></svg>
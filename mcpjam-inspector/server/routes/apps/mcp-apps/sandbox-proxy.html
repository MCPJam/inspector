<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Permissive CSP so nested srcdoc content is not constrained by host CSP.
         The actual security enforcement is done by the dynamically-generated CSP
         injected into the inner srcdoc iframe based on widget declarations (SEP-1865).
         This outer CSP must allow external scripts since srcdoc network requests
         are subject to the parent document's CSP. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src * data: blob: 'unsafe-inline'; media-src * blob: data:; font-src * blob: data:; script-src * 'wasm-unsafe-eval' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src * blob: data: 'unsafe-inline'; connect-src * data: blob: about:; frame-src * blob: data: http://localhost:* https://localhost:* http://127.0.0.1:* https://127.0.0.1:*;"
    />
    <title>MCP Apps Sandbox Proxy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: transparent;
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      iframe {
        display: block;
        background-color: transparent;
        border: 0px none transparent;
        padding: 0px;
        width: 100%;
        height: 100%;
        color-scheme: light dark;
      }
    </style>
  </head>
  <body>
    <script>
      /**
       * MCP Apps Sandbox Proxy (SEP-1865)
       *
       * Double-iframe architecture for security isolation:
       * Host Page → Sandbox Proxy (this page, different origin) → Guest UI
       *
       * This proxy:
       * 1. Creates inner iframe immediately
       * 2. Waits for HTML content via ui/notifications/sandbox-resource-ready
       * 3. Builds CSP from metadata and injects into HTML
       * 4. Loads HTML via srcdoc with configurable sandbox attributes
       * 5. Forwards all non-sandbox messages between host and guest
       *
       * Reference: https://gist.github.com/ochafik/a9603ba2d6757d6038ce066eded4c354
       */

      /**
       * Sanitize a domain/origin value for CSP (SEP-1865)
       * Prevents injection attacks via malicious domain values
       * @param {string} domain - Domain to sanitize
       * @returns {string} Sanitized domain
       */
      function sanitizeDomain(domain) {
        if (typeof domain !== "string") return "";
        // Remove characters that could break out of CSP or HTML attributes
        // Valid CSP sources shouldn't contain these characters
        return domain.replace(/['"<>;]/g, "").trim();
      }

      /**
       * Build iframe allow attribute from permissions (SEP-1865)
       * @param {Object} permissions - Permissions metadata (camera, microphone, geolocation, clipboardWrite)
       * @returns {string} Permission Policy allow attribute string
       *
       * Note: For srcdoc iframes, we use '*' allowlist since they don't have a defined origin.
       * This allows the sandboxed content to request these permissions.
       */
      function buildAllowAttribute(permissions) {
        if (!permissions) return "";

        const allowList = [];
        if (permissions.camera) allowList.push("camera *");
        if (permissions.microphone) allowList.push("microphone *");
        if (permissions.geolocation) allowList.push("geolocation *");
        if (permissions.clipboardWrite) allowList.push("clipboard-write *");

        return allowList.join("; ");
      }

      /**
       * Build CSP string from metadata (SEP-1865)
       *
       * CSP merge rule per directive:
       *   tokens = unique(domain-derived tokens ++ cspDirectives[directive])
       *   if tokens contains anything other than 'none', drop 'none'
       *   emit `<directive> ${tokens.join(" ")}` (or `<directive> 'none'` if
       *   tokens === ['none'])
       *
       * Rationale: `'none' 'self'` is invalid CSP. The domain-derived branch
       * emits 'none' for empty allowlists (frameDomains: [] → frame-src 'none'),
       * and cspDirectives can add real tokens on top. Union-and-drop-'none' is
       * the only sound merge.
       *
       * @param {Object} csp - CSP metadata with connectDomains, resourceDomains, frameDomains, and baseUriDomains
       * @param {Object} cspDirectives - Per-directive source-expression overrides
       *   (inspector-only). Keys are CSP directive names (`script-src`, …);
       *   values are token arrays.
       * @returns {string} CSP policy string
       */
      function buildCSP(csp, cspDirectives, cspSubtypePolicy) {
        // Merge a single directive's domain-derived tokens with any extra
        // tokens supplied by cspDirectives. See merge rule above the function.
        function mergeDirective(name, baseTokens) {
          const extras =
            cspDirectives && Array.isArray(cspDirectives[name])
              ? cspDirectives[name]
              : [];
          const merged = new Set();
          for (const t of baseTokens) {
            if (typeof t === "string" && t.length > 0) merged.add(t);
          }
          for (const t of extras) {
            if (typeof t !== "string") continue;
            const trimmed = t.trim();
            if (trimmed.length === 0) continue;
            // Reject CSP directive separators (`;`) and structural chars
            // (`,`, newlines, quote-wrapping whitespace) in extras. The
            // backend canonicalizer is the primary defense, but a crafted
            // cspDirectives value like `"'self'; script-src *"` would
            // otherwise break out of the intended directive and inject
            // an attacker-controlled one when joined with " " below.
            // Same defense-in-depth as the allowFeatures filter applied
            // in sandboxed-iframe.tsx.
            //
            // Also reject HTML-attribute breakouts (`"`, `<`, `>`). The
            // merged CSP string is concatenated into
            // `<meta http-equiv="Content-Security-Policy" content="...">`
            // by injectCSP without escaping, so a token like
            // `'self"><script>...` would close the content attribute and
            // inject markup into the srcdoc before the intended CSP is
            // established. CSP source expressions never legitimately
            // contain these characters.
            if (/[;,\n\r"<>]/.test(trimmed)) continue;
            merged.add(trimmed);
          }
          if (merged.size > 1 && merged.has("'none'")) {
            merged.delete("'none'");
          }
          if (merged.size === 0) return name + " 'none'";
          return name + " " + Array.from(merged).join(" ");
        }

        // Per SEP-1865: If no CSP declared, use restrictive defaults
        // Note: 'self' doesn't work in srcdoc iframes (refers to about:srcdoc)
        // So we use 'unsafe-inline' for scripts/styles since all widget code is inline
        let directives;
        if (!csp) {
          // Two baselines for the no-csp branch:
          //   - When cspDirectives is set, the profile is modeling a host
          //     whose emitted CSP is unconstrained EXCEPT for the
          //     directives it explicitly lists. For directives IN
          //     cspDirectives, the profile is authoritative (REPLACE the
          //     baseline — otherwise a permissive base like `https:` would
          //     dilute a restrictive entry like
          //     `frame-src "https://widgets.example.com"` back to "any
          //     HTTPS frame"). For directives NOT in cspDirectives, use
          //     specific permissive baselines (no `*`) so widgets without
          //     their own `_meta.ui.csp` can still execute inline scripts,
          //     load images, fetch over HTTPS, etc.
          //   - Otherwise (pure no-csp, no overrides), restrictive
          //     defaults for SEP-1865 secure-default behavior.
          // A cspDirectives entry only counts as "configured" if it
          // contributes at least one token that would survive
          // mergeDirective's trim/filter pass — otherwise the no-op
          // entry (empty array, whitespace-only string, or a token
          // rejected by the `;,\n\r` injection guard) flips every
          // OTHER directive's baseline from secure-default to broad
          // permissive while the named directive contributes nothing.
          // Mirrors the filter applied below at the actual emit site.
          const cspDirectiveTokenSurvives = (t) => {
            if (typeof t !== "string") return false;
            const trimmed = t.trim();
            if (trimmed.length === 0) return false;
            // Keep this in lockstep with mergeDirective's filter above.
            // Any character class it rejects must be rejected here too,
            // or the predicate flips hasCspOverrides for an entry that
            // ultimately contributes zero tokens — widening every
            // unrelated directive's baseline for nothing.
            if (/[;,\n\r"<>]/.test(trimmed)) return false;
            return true;
          };
          const hasCspOverrides =
            cspDirectives &&
            typeof cspDirectives === "object" &&
            Object.values(cspDirectives).some(
              (tokens) =>
                Array.isArray(tokens) && tokens.some(cspDirectiveTokenSurvives)
            );
          if (hasCspOverrides) {
            // Helper: if cspDirectives names this directive, emit ONLY
            // the profile's tokens (REPLACE). Otherwise emit the
            // permissive default tokens (browser-default-like for an
            // unconstrained host).
            const emitOverridable = (name, permissiveBase) => {
              const hasOverride =
                Array.isArray(cspDirectives[name]) &&
                cspDirectives[name].length > 0;
              return mergeDirective(name, hasOverride ? [] : permissiveBase);
            };
            directives = [
              emitOverridable("default-src", [
                "'unsafe-inline'",
                "'unsafe-eval'",
                "data:",
                "blob:",
                "https:",
              ]),
              emitOverridable("script-src", [
                "'unsafe-inline'",
                "'unsafe-eval'",
                "data:",
                "blob:",
                "https:",
              ]),
              emitOverridable("style-src", [
                "'unsafe-inline'",
                "data:",
                "blob:",
                "https:",
              ]),
              emitOverridable("img-src", ["data:", "blob:", "https:"]),
              emitOverridable("font-src", ["data:", "blob:", "https:"]),
              emitOverridable("media-src", ["data:", "blob:", "https:"]),
              emitOverridable("connect-src", [
                "data:",
                "blob:",
                "https:",
                "wss:",
              ]),
              emitOverridable("frame-src", ["data:", "blob:", "https:"]),
              emitOverridable("object-src", ["'none'"]),
              emitOverridable("base-uri", ["'self'"]),
            ];
          } else {
            directives = [
              mergeDirective("default-src", ["'none'"]),
              mergeDirective("script-src", ["'unsafe-inline'"]),
              mergeDirective("style-src", ["'unsafe-inline'"]),
              mergeDirective("img-src", ["data:"]),
              mergeDirective("font-src", ["data:"]),
              mergeDirective("media-src", ["data:"]),
              mergeDirective("connect-src", ["'none'"]),
              mergeDirective("frame-src", ["'none'"]),
              mergeDirective("object-src", ["'none'"]),
              mergeDirective("base-uri", ["'none'"]),
            ];
          }
        } else {
          // Build CSP from declared domains (SEP-1865)
          // Per spec: "Host MAY further restrict but MUST NOT allow undeclared domains"
          const connectDomains = (csp.connectDomains || [])
            .map(sanitizeDomain)
            .filter(Boolean);
          const resourceDomains = (csp.resourceDomains || [])
            .map(sanitizeDomain)
            .filter(Boolean);
          const frameDomains = (csp.frameDomains || [])
            .map(sanitizeDomain)
            .filter(Boolean);
          const baseUriDomains = (csp.baseUriDomains || [])
            .map(sanitizeDomain)
            .filter(Boolean);

          const connectSubtypePolicy =
            cspSubtypePolicy && cspSubtypePolicy.cspConnectDomains;
          const keepDeclaredConnectDomains =
            !connectSubtypePolicy ||
            ["fetch", "xhr", "websocket"].some(
              (subtype) => connectSubtypePolicy[subtype] !== false
            );

          // Keep the shared connect-src declaration whenever at least one API
          // is supported or unknown. API-specific false values are enforced by
          // the early guards below because CSP cannot split these APIs.
          const connectTokens =
            keepDeclaredConnectDomains && connectDomains.length > 0
              ? connectDomains.slice()
              : ["'none'"];

          // Resource sources: data: and blob: are always allowed for inline content
          // Only add declared resourceDomains - no forced CDNs per SEP-1865
          const resourceTokens = (subtype) =>
            cspSubtypePolicy &&
            cspSubtypePolicy.cspResourceDomains &&
            cspSubtypePolicy.cspResourceDomains[subtype] === false
              ? ["data:", "blob:"]
              : resourceDomains.length > 0
              ? ["data:", "blob:", ...resourceDomains]
              : ["data:", "blob:"];

          // frame-src: Only allow declared frame domains, or 'none' if empty
          const frameTokens =
            frameDomains.length > 0 ? frameDomains.slice() : ["'none'"];

          // base-uri: Only allow declared base URI domains, or 'none' if empty
          const baseUriTokens =
            baseUriDomains.length > 0 ? baseUriDomains.slice() : ["'none'"];

          directives = [
            mergeDirective("default-src", ["'none'"]),
            mergeDirective("script-src", [
              "'unsafe-inline'",
              ...resourceTokens("script"),
            ]),
            mergeDirective("style-src", [
              "'unsafe-inline'",
              ...resourceTokens("stylesheet"),
            ]),
            mergeDirective("img-src", resourceTokens("image")),
            mergeDirective("font-src", resourceTokens("font")),
            mergeDirective("media-src", resourceTokens("media")),
            mergeDirective("connect-src", connectTokens),
            mergeDirective("frame-src", frameTokens),
            mergeDirective("object-src", ["'none'"]),
            mergeDirective("base-uri", baseUriTokens),
          ];
        }

        // If cspDirectives names a directive we didn't emit above (e.g.
        // `form-action`, `worker-src`), append it verbatim so inspector
        // probes that capture additional directives round-trip end-to-end.
        // Runs in both the !csp and truthy-csp branches: a host that
        // declares no CSP metadata but supplies inspector-only directive
        // overrides (the documented `form-action` round-trip case) still
        // gets them appended.
        if (cspDirectives && typeof cspDirectives === "object") {
          const known = new Set([
            "default-src",
            "script-src",
            "style-src",
            "img-src",
            "font-src",
            "media-src",
            "connect-src",
            "frame-src",
            "object-src",
            "base-uri",
          ]);
          for (const k of Object.keys(cspDirectives).sort()) {
            if (known.has(k)) continue;
            // Reject CSP separators in the directive NAME too — `k` is
            // concatenated into the output via `name + " " + tokens`, so
            // a crafted key like `worker-src *; script-src` would inject
            // a second directive even if every value token is clean.
            // Also reject HTML-attribute breakouts (`"`, `<`, `>`) for
            // the same reason as in mergeDirective: the directive name
            // flows into the unescaped `content="..."` attribute of the
            // injected <meta> tag, and a crafted key like `x"><script>`
            // would otherwise close the attribute and inject markup.
            if (/[;,\n\r\s"<>]/.test(k)) continue;
            const tokens = cspDirectives[k];
            if (!Array.isArray(tokens) || tokens.length === 0) continue;
            directives.push(mergeDirective(k, []));
          }
        }

        return directives.join("; ");
      }

      /**
       * Build CSP violation listener script
       * Forwards securitypolicyviolation events to the host via postMessage
       * @returns {string} Script tag with violation listener
       */
      function buildViolationListenerScript() {
        return `<script>
document.addEventListener('securitypolicyviolation', function(e) {
  var violation = {
    type: 'mcp-apps:csp-violation',
    directive: e.violatedDirective,
    blockedUri: e.blockedURI,
    sourceFile: e.sourceFile || null,
    lineNumber: e.lineNumber || null,
    columnNumber: e.columnNumber || null,
    effectiveDirective: e.effectiveDirective,
    originalPolicy: e.originalPolicy,
    disposition: e.disposition,
    timestamp: Date.now()
  };
  console.warn('[MCP Apps CSP Violation]', violation.directive, ':', violation.blockedUri);
  window.parent.postMessage(violation, '*');
});
<\/script>`;
      }

      /** Build early per-API connect guards for host subtype emulation. */
      function buildConnectGuardScript(cspSubtypePolicy, cspDirectives) {
        const connectPolicy =
          cspSubtypePolicy && cspSubtypePolicy.cspConnectDomains;
        if (!connectPolicy || typeof connectPolicy !== "object") return "";
        const blocked = ["fetch", "xhr", "websocket"].filter(
          (subtype) => connectPolicy[subtype] === false
        );
        if (blocked.length === 0) return "";

        const hostConnectSources =
          cspDirectives && Array.isArray(cspDirectives["connect-src"])
            ? cspDirectives["connect-src"]
                .filter((source) => {
                  if (typeof source !== "string") return false;
                  const trimmed = source.trim();
                  return trimmed.length > 0 && !/[;,\n\r"<>]/.test(trimmed);
                })
                .map((source) => source.trim())
            : [];
        const configJson = JSON.stringify({
          blocked,
          hostConnectSources,
        }).replace(/</g, "\\u003c");

        return `<script>
(function() {
  var config = ${configJson};
  var protectedBaseUrl = (function() {
    try { return new URL(document.baseURI); }
    catch (_) {
      try { return new URL(window.location.href); }
      catch (_) { return null; }
    }
  })();
  function absoluteUrl(value) {
    try {
      return new URL(
        String(value),
        protectedBaseUrl ? protectedBaseUrl.href : window.location.href
      );
    }
    catch (_) { return null; }
  }
  // Scheme/origin of the document the emulated policy protects. A srcdoc frame's
  // location is about:srcdoc, but its baseURI inherits the embedding proxy
  // document; that is the origin CSP would evaluate against. Falling back to
  // "" makes schemeless expressions match nothing, which fails closed.
  var protectedScheme = protectedBaseUrl
    ? protectedBaseUrl.protocol.slice(0, -1).toLowerCase()
    : "";
  var protectedOrigin = protectedBaseUrl ? protectedBaseUrl.origin : "";
  function schemeOf(url) {
    return url.protocol.slice(0, -1).toLowerCase();
  }
  function defaultPortFor(scheme) {
    if (scheme === "http" || scheme === "ws") return 80;
    if (scheme === "https" || scheme === "wss") return 443;
    return null;
  }
  // CSP3 6.7.2.9. Deliberately asymmetric: an insecure expression is upgraded
  // to its secure variant, never the reverse ("https:" does NOT cover "wss:").
  function schemeMatches(a, b) {
    if (a === b) return true;
    if (a === "http") return b === "https";
    if (a === "ws") return b === "wss" || b === "http" || b === "https";
    if (a === "wss") return b === "https";
    return false;
  }
  // CSP3 6.7.2.11. A URL on its scheme's default port reports an empty port,
  // so "https://h:443" and "https://h" describe the same endpoint — and an
  // expression with NO port matches only the default port.
  function portMatches(expected, url) {
    if (expected === "*") return true;
    var wanted = expected === null ? null : parseInt(expected, 10);
    var actual = url.port === "" ? null : parseInt(url.port, 10);
    if (wanted === actual) return true;
    if (actual === null) return wanted === defaultPortFor(schemeOf(url));
    return false;
  }
  function decodePiece(piece) {
    try { return decodeURIComponent(piece); } catch (_) { return piece; }
  }
  // CSP3 6.7.2.12. A trailing "/" makes the expression a directory prefix
  // ("/a/" covers "/a/b"); without one it must match the path exactly.
  function pathMatches(expected, actual) {
    if (expected === "") return true;
    if (expected === "/" && actual === "") return true;
    var exact = expected.charAt(expected.length - 1) !== "/";
    var a = expected.split("/");
    var b = actual.split("/");
    if (a.length > b.length) return false;
    if (exact && a.length !== b.length) return false;
    if (!exact) a.pop();
    for (var i = 0; i < a.length; i++) {
      if (decodePiece(a[i]) !== decodePiece(b[i])) return false;
    }
    return true;
  }
  function hostMatches(expected, actual) {
    if (expected === "*") return true;
    if (expected.indexOf("*.") === 0) {
      var suffix = expected.slice(1);
      return suffix.length > 1 && actual.length > suffix.length &&
        actual.slice(-suffix.length) === suffix;
    }
    return actual === expected;
  }
  // CSP3 6.7.2.7, restricted to what a connect-src allowlist can hold. This
  // decides whether a call the host would ALLOW escapes the guard, so every
  // ambiguity resolves to "no match" rather than waving the request through.
  function sourceMatches(source, url) {
    if (!url) return false;
    var expr = String(source).trim();
    if (!expr || expr === "'none'") return false;
    if (expr === "*") return true;
    // Keywords never name an origin except 'self'.
    if (expr.charAt(0) === "'") {
      return expr === "'self'" && url.origin === protectedOrigin;
    }
    var urlScheme = schemeOf(url);
    // scheme-source, e.g. "https:" — nothing after the colon.
    if (/^[a-z][a-z0-9+.-]*:$/i.test(expr)) {
      return schemeMatches(expr.slice(0, -1).toLowerCase(), urlScheme);
    }
    var rest = expr;
    var exprScheme = null;
    var sep = rest.indexOf("://");
    if (sep > 0) {
      exprScheme = rest.slice(0, sep).toLowerCase();
      rest = rest.slice(sep + 3);
    }
    if (exprScheme !== null) {
      if (!schemeMatches(exprScheme, urlScheme)) return false;
    } else if (!schemeMatches(protectedScheme, urlScheme)) {
      return false;
    }
    var pathIdx = rest.indexOf("/");
    var exprPath = "";
    if (pathIdx >= 0) {
      exprPath = rest.slice(pathIdx);
      rest = rest.slice(0, pathIdx);
    }
    var exprPort = null;
    var portIdx = rest.lastIndexOf(":");
    if (portIdx > 0) {
      exprPort = rest.slice(portIdx + 1);
      rest = rest.slice(0, portIdx);
    }
    if (!rest) return false;
    if (exprPort !== null && exprPort !== "*" && !/^[0-9]+$/.test(exprPort)) {
      return false;
    }
    if (!hostMatches(rest.toLowerCase(), url.hostname.toLowerCase())) return false;
    if (!portMatches(exprPort, url)) return false;
    if (!pathMatches(exprPath, url.pathname)) return false;
    return true;
  }
  function allowedByHost(url) {
    for (var i = 0; i < config.hostConnectSources.length; i++) {
      if (sourceMatches(config.hostConnectSources[i], url)) return true;
    }
    return false;
  }
  function report(subtype, url, fallback) {
    window.parent.postMessage({
      type: "mcp-apps:csp-violation",
      directive: "connect-src",
      effectiveDirective: "connect-src",
      blockedUri: url ? url.href : String(fallback),
      sourceFile: window.location.href,
      lineNumber: null,
      columnNumber: null,
      originalPolicy: "host CSP subtype policy",
      disposition: "enforce",
      subtype: subtype,
      timestamp: Date.now()
    }, "*");
  }
  function shouldBlock(subtype, value) {
    if (config.blocked.indexOf(subtype) === -1) return false;
    var url = absoluteUrl(value);
    if (allowedByHost(url)) return false;
    report(subtype, url, value);
    return true;
  }
  if (config.blocked.indexOf("fetch") !== -1 && typeof window.fetch === "function") {
    var nativeFetch = window.fetch;
    window.fetch = function(input, init) {
      var value = input && typeof input === "object" && "url" in input ? input.url : input;
      if (shouldBlock("fetch", value)) return Promise.reject(new TypeError("Failed to fetch"));
      return nativeFetch.call(this, input, init);
    };
  }
  if (config.blocked.indexOf("xhr") !== -1 && window.XMLHttpRequest) {
    var nativeOpen = window.XMLHttpRequest.prototype.open;
    var nativeSend = window.XMLHttpRequest.prototype.send;
    window.XMLHttpRequest.prototype.open = function(method, url) {
      this.__mcpjamSubtypeUrl = url;
      return nativeOpen.apply(this, arguments);
    };
    window.XMLHttpRequest.prototype.send = function() {
      if (shouldBlock("xhr", this.__mcpjamSubtypeUrl)) {
        throw new DOMException("Blocked by host CSP subtype policy", "SecurityError");
      }
      return nativeSend.apply(this, arguments);
    };
  }
  if (config.blocked.indexOf("websocket") !== -1 && window.WebSocket) {
    var NativeWebSocket = window.WebSocket;
    var GuardedWebSocket = function(url, protocols) {
      if (shouldBlock("websocket", url)) {
        throw new DOMException("Blocked by host CSP subtype policy", "SecurityError");
      }
      return protocols === undefined
        ? new NativeWebSocket(url)
        : new NativeWebSocket(url, protocols);
    };
    GuardedWebSocket.prototype = NativeWebSocket.prototype;
    Object.setPrototypeOf(GuardedWebSocket, NativeWebSocket);
    window.WebSocket = GuardedWebSocket;
  }
})();
<\/script>`;
      }

      /**
       * Block browser storage APIs the host profile turned off.
       *
       * `mcpProfile.apps.sandbox.browserStorage` is a probe-measured fact: a
       * host either lets a widget reach these APIs or it does not. Absent (or
       * true) means available, so only explicit `false` blocks — matching the
       * omit-when-absent discipline every other profile knob uses.
       *
       * Access throws rather than returning null/undefined because that is
       * what a real iframe without `allow-same-origin` does: the getter
       * itself raises SecurityError. A widget's `try { localStorage } catch`
       * feature-detect must take the same branch here as in production.
       *
       * NOT a CSP concern, so unlike the connect guard above this posts no
       * synthetic violation — nothing is watching for one, and storage never
       * produces a securitypolicyviolation event.
       *
       * @param {object|undefined} browserStorage - per-API policy
       * @returns {string} script tag, or "" when nothing is blocked
       */
      function buildBrowserStorageGuardScript(browserStorage) {
        if (!browserStorage || typeof browserStorage !== "object") return "";
        const blocked = ["localStorage", "sessionStorage", "indexedDB"].filter(
          (api) => browserStorage[api] === false
        );
        if (blocked.length === 0) return "";

        const configJson = JSON.stringify({ blocked }).replace(
          /</g,
          "\\u003c"
        );

        return `<script>
(function() {
  var config = ${configJson};
  for (var i = 0; i < config.blocked.length; i++) {
    (function(api) {
      try {
        Object.defineProperty(window, api, {
          configurable: false,
          get: function() {
            throw new DOMException(
              "Blocked by host browser-storage policy",
              "SecurityError"
            );
          }
        });
      } catch (error) {
        // A non-configurable own property (or a runtime that refuses the
        // redefine) leaves the API reachable. Fail loud in the console
        // rather than silently reporting an unenforced policy as enforced.
        try {
          console.error(
            "[mcpjam] could not block " + api + " in this sandbox", error
          );
        } catch (_) {}
      }
    })(config.blocked[i]);
  }
})();
<\/script>`;
      }

      /**
       * Inject CSP meta tag and violation listener into HTML
       * @param {string} html - Original HTML content
       * @param {string} cspValue - CSP policy string
       * @returns {string} HTML with CSP meta tag and violation listener injected
       */
      // Tier 2 recorder shim source, injected at serve time (see index.ts).
      // Stays the placeholder string when recording is unavailable.
      const RECORDER_SHIM = "__MCPJAM_RECORDER_SHIM__";
      let recorderDebugEnabled = false;
      function recorderDebug(message, details) {
        try {
          if (recorderDebugEnabled) {
            console.info("[recorder:proxy] " + message, details || {});
          }
        } catch (error) {
          // debug logging is best-effort
        }
      }
      function buildRecorderScript(recordMode) {
        if (
          !recordMode ||
          !RECORDER_SHIM ||
          RECORDER_SHIM === "__MCPJAM_RECORDER_SHIM__"
        ) {
          recorderDebug("skip shim", {
            recordMode: !!recordMode,
            hasShim: !!RECORDER_SHIM,
            placeholder: RECORDER_SHIM === "__MCPJAM_RECORDER_SHIM__",
          });
          return "";
        }
        recorderDebug("inject shim");
        return "<scr" + "ipt>" + RECORDER_SHIM + "</scr" + "ipt>";
      }

      function injectCSP(html, cspValue, extraScript, guardScript) {
        // Tier 2 recorder: the capture shim is an INLINE <script>. A widget that
        // ships its own `<meta http-equiv="Content-Security-Policy">` adds a
        // second policy, and browsers enforce the INTERSECTION of all policies —
        // so a widget CSP lacking `'unsafe-inline'` silently blocks the shim even
        // though our injected policy allows it (the recorder then times out and
        // misreports "CSP blocked"). When recording (extraScript present), strip
        // the widget's own CSP metas so only our permissive policy governs. This
        // relaxation is scoped to the eval editor's armed record target only.
        if (extraScript) {
          html = html.replace(
            /<meta[^>]+http-equiv\s*=\s*["']?content-security-policy["']?[^>]*>/gi,
            ""
          );
        }
        const cspMeta =
          '<meta http-equiv="Content-Security-Policy" content="' +
          cspValue +
          '">';
        const violationListener = buildViolationListenerScript();
        // Run the recorder shim before the generated CSP meta is parsed. The
        // proxy strips widget-authored CSP metas above, but putting the shim
        // first also avoids browser ordering edge cases where the injected CSP
        // could block the very inline script that is supposed to announce
        // `recorder:ready`.
        const injection =
          (extraScript || "") +
          (guardScript || "") +
          cspMeta +
          violationListener;

        if (html.includes("<head>")) {
          return html.replace("<head>", "<head>" + injection);
        } else if (html.includes("<HEAD>")) {
          return html.replace("<HEAD>", "<HEAD>" + injection);
        } else if (html.includes("<html>")) {
          return html.replace("<html>", "<html><head>" + injection + "</head>");
        } else if (html.includes("<HTML>")) {
          return html.replace("<HTML>", "<HTML><head>" + injection + "</head>");
        } else if (html.includes("<!DOCTYPE") || html.includes("<!doctype")) {
          // Insert after doctype
          return html.replace(
            /(<!DOCTYPE[^>]*>|<!doctype[^>]*>)/i,
            "$1<head>" + injection + "</head>"
          );
        } else {
          // Prepend CSP meta tag and listener
          return injection + html;
        }
      }

      /**
       * Keep the proxy document and inner iframe in the same scheme as the
       * host. Otherwise transparent widget documents can expose the browser's
       * default iframe canvas instead of the MCP Jam chat surface.
       * @param {unknown} value - Host theme, expected to be "light" or "dark"
       * @returns {"light" | "dark" | "light dark"} Applied color-scheme
       */
      function applyColorScheme(value) {
        const colorScheme =
          value === "light" || value === "dark" ? value : "light dark";
        document.documentElement.style.colorScheme = colorScheme;
        if (document.body) {
          document.body.style.colorScheme = colorScheme;
        }
        return colorScheme;
      }

      // Create inner iframe immediately (before HTML arrives)
      const inner = document.createElement("iframe");
      inner.style =
        "width:100%; height:100%; border:none; background-color:transparent; color-scheme:light dark;";
      applyColorScheme("light dark");
      // Default minimal sandbox before HTML arrives
      inner.setAttribute(
        "sandbox",
        "allow-scripts allow-same-origin allow-forms"
      );
      document.body.appendChild(inner);

      // Handle messages from parent (host) and inner (guest UI)
      window.addEventListener("message", async (event) => {
        if (event.source === window.parent) {
          // Message from host
          if (
            event.data &&
            event.data.method === "ui/notifications/sandbox-resource-ready"
          ) {
            // Load HTML into inner iframe with CSP enforcement.
            //
            // `allowFeatures` is intentionally NOT received here — by design
            // it applies to the OUTER iframe's `allow=` attribute only. The
            // outer/inner split (outer grants extras like `fullscreen`; inner
            // grants only the 4 spec permissions) is enforced upstream in
            // `sandboxed-iframe.tsx`'s postMessage payload. If `allowFeatures`
            // shows up in the message here, it's a contract bug, not data we
            // should consume.
            const {
              html,
              sandbox,
              csp,
              permissions,
              sandboxAttrs,
              cspDirectives,
              cspSubtypePolicy,
              browserStorage,
              permissive,
              colorScheme,
              recordMode,
              recorderDebug: nextRecorderDebug,
            } = event.data.params || {};
            recorderDebugEnabled = !!nextRecorderDebug;
            try {
              if (recorderDebugEnabled) {
                window.localStorage?.setItem("mcpjam:recorder-debug", "1");
              } else {
                window.localStorage?.removeItem("mcpjam:recorder-debug");
              }
            } catch (error) {
              // debug flag propagation is best-effort
            }
            inner.style.colorScheme = applyColorScheme(colorScheme);
            // Tier 2: inject the recorder shim into the guest when recording.
            const recorderScript = buildRecorderScript(recordMode);
            const connectGuardScript = buildConnectGuardScript(
              cspSubtypePolicy,
              cspDirectives
            );
            // Storage is independent of CSP mode: a host that serves a
            // permissive CSP can still deny storage, so this guard rides
            // BOTH branches below while the connect guard rides only the
            // CSP one.
            const browserStorageGuardScript =
              buildBrowserStorageGuardScript(browserStorage);
            recorderDebug("resource ready", {
              recordMode: !!recordMode,
              recorderScript: !!recorderScript,
              htmlLength: typeof html === "string" ? html.length : null,
            });

            // Inner iframe `sandbox=` value.
            //
            // When `sandboxAttrs` is provided (even an empty array), the
            // profile is authoritative: only spec-mandated tokens plus what
            // the profile lists. Otherwise (no profile opinion) fall back to
            // the caller's `sandbox` string so existing widget renders that
            // depend on the legacy permissive baseline keep working.
            const sandboxTokens = new Set();
            if (Array.isArray(sandboxAttrs)) {
              sandboxTokens.add("allow-scripts");
              sandboxTokens.add("allow-same-origin");
              for (const t of sandboxAttrs) {
                if (typeof t !== "string") continue;
                const trimmed = t.trim();
                if (trimmed.length === 0) continue;
                // Reject tokens with internal whitespace — see the
                // matching renderer-side guard in sandboxed-iframe.tsx.
                // Without this, a profile entry like
                // `"allow-forms allow-popups-to-escape-sandbox"` would
                // round-trip as one Set member but the eventual
                // join(" ") would emit it as two real sandbox flags,
                // silently widening the inner iframe's grants.
                if (/\s/.test(trimmed)) continue;
                sandboxTokens.add(trimmed);
              }
            } else {
              const baseSandbox =
                typeof sandbox === "string" && sandbox.length > 0
                  ? sandbox
                  : "allow-scripts allow-same-origin allow-forms";
              for (const t of baseSandbox.split(/\s+/)) {
                if (t.length > 0) sandboxTokens.add(t);
              }
              // Defense in depth: spec-mandated tokens are always present.
              sandboxTokens.add("allow-scripts");
              sandboxTokens.add("allow-same-origin");
            }
            inner.setAttribute(
              "sandbox",
              Array.from(sandboxTokens).sort().join(" ")
            );

            // Set Permission Policy `allow=` attribute for the inner iframe
            // from the requested spec-4 permissions only (SEP-1865:
            // camera / microphone / geolocation / clipboard-write).
            //
            // Non-spec features like `fullscreen` belong on the OUTER
            // iframe (handled in `sandboxed-iframe.tsx`'s
            // `outerAllowAttribute`), not here. Modeling real claude.ai's
            // pattern: outer grants extras for the wrapper, inner trims to
            // spec so the widget only experiences what's documented.
            const baseAllow = buildAllowAttribute(permissions);
            if (baseAllow) {
              inner.setAttribute("allow", baseAllow);
            }

            if (typeof html === "string") {
              if (permissive) {
                // Permissive mode: inject maximally permissive CSP
                // Must explicitly allow everything since srcdoc inherits parent CSP
                const permissiveCsp = [
                  "default-src * 'unsafe-inline' 'unsafe-eval' data: blob: filesystem: about:",
                  "script-src * 'unsafe-inline' 'unsafe-eval' data: blob:",
                  "style-src * 'unsafe-inline' data: blob:",
                  "img-src * data: blob: https: http:",
                  "media-src * data: blob: https: http:",
                  "font-src * data: blob: https: http:",
                  "connect-src * data: blob: https: http: ws: wss: about:",
                  "frame-src * data: blob: https: http: about:",
                  "object-src * data: blob:",
                  "base-uri *",
                  "form-action *",
                ].join("; ");
                const processedHtml = injectCSP(
                  html,
                  permissiveCsp,
                  recorderScript,
                  browserStorageGuardScript
                );
                inner.srcdoc = processedHtml;
              } else {
                // Build CSP and inject into HTML (SEP-1865). cspDirectives
                // is the inspector-only per-directive source-expression
                // override map (e.g. `script-src` adds `'unsafe-eval'`).
                const cspValue = buildCSP(csp, cspDirectives, cspSubtypePolicy);
                const processedHtml = injectCSP(
                  html,
                  cspValue,
                  recorderScript,
                  connectGuardScript + browserStorageGuardScript
                );
                inner.srcdoc = processedHtml;
              }
            }
          } else if (
            event.data &&
            event.data.method ===
              "ui/notifications/sandbox-color-scheme-changed"
          ) {
            const { colorScheme } = event.data.params || {};
            inner.style.colorScheme = applyColorScheme(colorScheme);
          } else {
            // Forward other messages to inner iframe (guest UI)
            if (inner && inner.contentWindow) {
              inner.contentWindow.postMessage(event.data, "*");
            }
          }
        } else if (event.source === inner.contentWindow) {
          // Relay messages from inner (guest UI) to parent (host)
          // Only forward JSON-RPC 2.0 messages and whitelisted non-JSON-RPC types.
          // This prevents non-protocol messages (browser extensions, widget internals)
          // from reaching PostMessageTransport and causing parse errors.
          var data = event.data;
          if (data && typeof data === "object") {
            if (
              data.jsonrpc === "2.0" ||
              data.type === "mcp-apps:csp-violation" ||
              data.type === "openai:uploadFile" ||
              data.type === "openai:getFileDownloadUrl" ||
              data.type === "openai:setWidgetState" ||
              data.type === "openai:setOpenInAppUrl" ||
              // Tier 2 recorder: guest → host recorded steps + readiness ping.
              data.type === "recorder:step" ||
              data.type === "recorder:ready" ||
              // Replay: guest → host per-step result for a host-driven replay.
              data.type === "recorder:replay-result"
            ) {
              if (
                data.type === "recorder:step" ||
                data.type === "recorder:ready" ||
                data.type === "recorder:replay-result"
              ) {
                recorderDebug("forward " + data.type);
              }
              window.parent.postMessage(data, "*");
            }
          }
        }
      });

      // Notify parent that sandbox is ready (per SEP-1865)
      window.parent.postMessage(
        {
          jsonrpc: "2.0",
          method: "ui/notifications/sandbox-proxy-ready",
          params: {},
        },
        "*"
      );
    </script>
  </body>
</html>

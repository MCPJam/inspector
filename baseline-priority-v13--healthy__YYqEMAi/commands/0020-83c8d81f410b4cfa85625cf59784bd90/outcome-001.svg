<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">83c8d81f410b4cfa85625cf59784bd90 — page 1</text><text x="20" y="75">$ /bin/bash -lc npx mcpjam --version</text><text x="20" y="95">npx mcpjam protocol conformance --help</text><text x="20" y="115">6.2.2</text><text x="20" y="135">Usage: mcpjam protocol conformance [options]</text><text x="20" y="155"></text><text x="20" y="175">Run MCP protocol conformance checks against an HTTP server</text><text x="20" y="195"></text><text x="20" y="215">Options:</text><text x="20" y="235">  --url &lt;url&gt;                   MCP server URL</text><text x="20" y="255">  --access-token &lt;token&gt;        Bearer access token for HTTP servers</text><text x="20" y="275">  --credentials-file &lt;path&gt;     Load OAuth access token from a file created by</text><text x="20" y="295">                                oauth login or oauth conformance</text><text x="20" y="315">                                --credentials-out</text><text x="20" y="335">  --header &lt;header&gt;             HTTP header in &quot;Key: Value&quot; format. Repeat to</text><text x="20" y="355">                                send multiple headers. (default: [])</text><text x="20" y="375">  --check-timeout &lt;ms&gt;          Per-check timeout in milliseconds (default:</text><text x="20" y="395">                                15000)</text><text x="20" y="415">  --category &lt;category&gt;         Check category to run. Repeat for multiple.</text><text x="20" y="435">                                Default: all. (default: [])</text><text x="20" y="455">  --check-id &lt;id&gt;               Specific check ID to run. Repeat for multiple.</text><text x="20" y="475">                                Default: all. (default: [])</text><text x="20" y="495">  --advice-id &lt;id&gt;              Specific advice ID to run. Repeat for multiple.</text><text x="20" y="515">                                Default: all. (default: [])</text><text x="20" y="535">  --protocol-version &lt;version&gt;  Pin the MCP protocol version to conform against.</text><text x="20" y="555">                                Default: legacy (2025-era) behavior.</text><text x="20" y="575">  --fixtures-file &lt;path&gt;        JSON file naming primitives that are SAFE TO</text><text x="20" y="595">                                EXECUTE, so checks that need a real result can</text><text x="20" y="615">                                run:</text><text x="20" y="635">                                {&quot;toolCalls&quot;:[{&quot;toolName&quot;:&quot;echo&quot;,&quot;arguments&quot;:{}}],&quot;promptGets&quot;:[{&quot;promptName&quot;:&quot;welcome&quot;}]}.</text><text x="20" y="655">                                Nothing is ever called without this.</text><text x="20" y="675">  --fixture-tool &lt;name&gt;         Name of a tool that is safe to call with no</text><text x="20" y="695">                                arguments. Repeat for multiple. For tools that</text><text x="20" y="715">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="735">                                [])</text><text x="20" y="755">  --fixture-prompt &lt;name&gt;       Name of a prompt that is safe to render with no</text><text x="20" y="775">                                arguments. Repeat for multiple. For prompts that</text><text x="20" y="795">                                need arguments, use --fixtures-file. (default:</text><text x="20" y="815">                                [])</text><text x="20" y="835">  --log-probe-tool &lt;name&gt;       Name of a tool that writes logs and is safe to</text><text x="20" y="855">                                call a few times. Lets the 2026-07-28 logging</text><text x="20" y="875">                                check and log level advice run. Nothing is</text><text x="20" y="895">                                called without this.</text><text x="20" y="915">  --log-probe-args &lt;json&gt;       Arguments for --log-probe-tool, as a JSON</text><text x="20" y="935">                                object. Default: {}.</text><text x="20" y="955">  --log-probe-level &lt;level&gt;     Log level the advice asks --log-probe-tool for:</text><text x="20" y="975">                                debug, info, notice, warning, error, critical,</text><text x="20" y="995">                                alert, emergency. Default: warning.</text><text x="20" y="1015">  --log-filter-tool &lt;name&gt;      Name of a tool the log level advice calls</text><text x="20" y="1035">                                instead of --log-probe-tool. Same rules: it</text><text x="20" y="1055">                                writes logs and is safe to call. Default:</text><text x="20" y="1075">                                --log-probe-tool.</text><text x="20" y="1095">  --log-filter-args &lt;json&gt;      Arguments for --log-filter-tool, as a JSON</text><text x="20" y="1115">                                object. Default: {}.</text><text x="20" y="1135">  --log-filter-level &lt;level&gt;    Log level the advice asks --log-filter-tool for:</text><text x="20" y="1155">                                debug, info, notice, warning, error, critical,</text><text x="20" y="1175">                                alert, emergency. Default: warning.</text><text x="20" y="1195">  --input-required-tool &lt;name&gt;  Name of a tool that asks the client for input</text><text x="20" y="1215">                                and is safe to call. Lets the 2026-07-28</text><text x="20" y="1235">                                undeclared capability check run. Nothing is</text><text x="20" y="1255">                                called without this.</text><text x="20" y="1275">  --input-required-args &lt;json&gt;  Arguments for --input-required-tool, as a JSON</text><text x="20" y="1295">                                object. Default: {}.</text><text x="20" y="1315">  --reporter &lt;reporter&gt;         Structured reporter output: json-summary or</text><text x="20" y="1335">                                junit-xml</text><text x="20" y="1355">  --upload                      Upload this suite&#x27;s result into MCPJam run</text></g></svg>
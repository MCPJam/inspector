ver those IDs without opening the web app. Authoring stays in the app — these commands are read-only.\n1274:</text><text x="20" y="975">| `--from &lt;number&gt;` | No | The revision to compare against (default: the one before) |\n1566:### `cloud eval create`\n1573:| `--fi</text><text x="20" y="995">le &lt;path&gt;` | No | Path to a **create-API JSON** body (or `-` for stdin). A versioned suite file (`schemaVersion: \&quot;1\&quot;`) belongs o</text><text x="20" y="1015">n `eval run --file` |\n1579:| `--client &lt;id-or-name...&gt;` | No | Clients to attach the suite to (overrides the file). Without one t</text><text x="20" y="1035">he suite lists no client, and `eval run --client` has nothing to select |\n1590:### `cloud eval run`\n1592:Start an eval run of an</text><text x="20" y="1055"> existing suite, or upload a versioned suite file and run it. Provide **either** `--suite` **or** `--file`, not both.\n1609:This s</text><text x="20" y="1075">ix-code contract is new and deliberately **different** from `eval gate`&#x27;s four codes below — see that command&#x27;s own doc for why th</text><text x="20" y="1095">e two are not unified. An invalid suite file exits **2** either way — `eval validate` still exits 1 for the same contract failure,</text><text x="20" y="1115"> because it is a verdict on the file and this command is not.\n1642:| `--compose-host-servers` | No | **No longer supported** — re</text><text x="20" y="1135">jected. An eval run takes its servers from a server group alone; use `--compose-server` or `--compose-server-group` |\n1685:| `mcp</text><text x="20" y="1155">jam cloud eval run` / `cases run` / `update` / `create` | A **client saved in your project** (`mcpjam cloud clients list`). |\n168</text><text x="20" y="1175">9:deprecated alias for it — so `mcpjam cloud eval run --host claude` looks for a\n1741:`eval run --file` reads the versioned suite</text><text x="20" y="1195"> file (`schemaVersion: \&quot;1\&quot;`),\n1743:auth request — it does not start a run. `eval validate` on the same bytes\n1784:would claim </text><text x="20" y="1215">those guarantees. When supported by an eval runner, `toolPolicy`\n1809:Every file run performs the same live check `eval validate </text><text x="20" y="1235">--project` performs,\n1851:mcpjam cloud eval run --file .mcpjam/evals/s_billing.yaml \\\n1879:that names `eval create --file`. The</text><text x="20" y="1255"> converse is also true: `eval create --file`\n1880:on a versioned suite file names `eval run --file`.\n1900:| `--run &lt;id&gt;` | Yes |</text><text x="20" y="1275"> Eval run ID (from `eval run`) |\n1933:Get the status and summary of an eval run.\n1937:| `--run &lt;id&gt;` | Yes | Eval run ID (from `</text><text x="20" y="1295">eval run`) |\n1989:| `&lt;run-id&gt;` | Yes | Eval run ID to rerun (from `eval run`) |\n1994:| `--wait` | No | Wait for the rerun to rea</text><text x="20" y="1315">ch a terminal status; exits on its verdict like `eval run --wait` |\n2010:Grade a finished eval run with LLM as Judge. **Spends yo</text><text x="20" y="1335">ur organization&#x27;s model\n2015:| `--run &lt;id&gt;` | Yes | Eval run ID (from `eval run`) |\n2034:| `--run &lt;id&gt;` | Yes | Terminal eval ru</text><text x="20" y="1355">n ID (from `eval run`) |\n2100:List per-iteration results for an eval run (pass/fail, tool calls, tokens, latency). Results are pa</text></g></svg>
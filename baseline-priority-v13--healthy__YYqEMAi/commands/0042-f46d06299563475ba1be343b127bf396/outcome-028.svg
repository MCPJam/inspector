 One iteration, judge disabled, 100% pass threshold.\n- First successful eval: `run_fixture_1`; recor</text><text x="20" y="1255">ded tool arguments and output are in `iterations.json`.\n- Negative control: `run_fixture_2`; changed expected text to `\&quot;sum\&quot;: 6</text><text x="20" y="1275">`, failed, CLI exit 1. See `negative-control-report.json`.\n- Repeat via `run-eval.sh`: `run_fixture_3`, passed 1/1, CLI exit 0. S</text><text x="20" y="1295">ee `eval-report.json`, `run.json`, and `latest-iterations.json`.\n\nThese checks cover connectivity and one arithmetic behavior. T</text><text x="20" y="1315">hey are not exhaustive protocol conformance or model-driven tool-selection evaluations. The isolated backend explicitly marks eval</text><text x="20" y="1335"> runs SIMULATED, deterministic, with no hosted model or live billing. Its launch receipt identifies the target as `server_fixture`</text><text x="20" y="1355"> / Arithmetic; the saved server created through the CLI is recorded separately in `saved-server.json`.\n\n## Repeat\n\nIn a clean </text></g></svg>
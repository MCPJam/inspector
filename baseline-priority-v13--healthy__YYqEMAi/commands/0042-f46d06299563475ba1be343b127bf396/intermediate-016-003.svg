<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="345"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +56.66458559036255s — page 3</text><text x="20" y="75">rompt` is a user message (model turn); `toolCall` is a deterministic, model-free tool call; `interact` is one pure widget action; </text><text x="20" y="95">`assert` is an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or a DOM `WidgetAssertion`).\&quot;,\&quot;required\&quot;:[\&quot;i</text><text x="20" y="115">d\&quot;,\&quot;kind\&quot;],\&quot;properties\&quot;:{\&quot;id\&quot;:{\&quot;type\&quot;:\&quot;string\&quot;,\&quot;minLength\&quot;:1},\&quot;kind\&quot;:{\&quot;type\&quot;:\&quot;string\&quot;,\&quot;enum\&quot;:[\&quot;prompt\&quot;,\&quot;to</text><text x="20" y="135">olCall\&quot;,\&quot;interact\&quot;,\&quot;assert\&quot;]},\&quot;prompt\&quot;:{\&quot;type\&quot;:\&quot;string\&quot;,\&quot;description\&quot;:\&quot;User message (`kind: prompt`).\&quot;},\&quot;serverNam</text><text x="20" y="155">e\&quot;:{\&quot;type\&quot;:\&quot;string\&quot;,\&quot;description\&quot;:\&quot;Server that owns the tool (`kind: toolCall`).\&quot;},\&quot;toolName\&quot;:{\&quot;type\&quot;:\&quot;string\&quot;,\&quot;de</text><text x="20" y="175">scription\&quot;:\&quot;Tool name (`kind: toolCall` / `interact`).\&quot;},\&quot;arguments\&quot;:{\&quot;type\&quot;:\&quot;object\&quot;,\&quot;description\&quot;:\&quot;Tool-call argumen</text><text x="20" y="195">ts (`kind: toolCall`).\&quot;,\&quot;additionalProperties\&quot;:true},\&quot;action\&quot;:{\&quot;type\&quot;:\&quot;object\&quot;,\&quot;description\&quot;:\&quot;Widget action (`kind: in</text><text x="20" y="215">teract`).\&quot;,\&quot;additionalProperties\&quot;:true},\&quot;assertion\&quot;:{\&quot;type\&quot;:\&quot;object\&quot;,\&quot;description\&quot;:\&quot;The rule an `assert` step checks (</text><text x="20" y="235">`kind: assert`). NOT a narrower spelling of a case&#x27;s `checks`: this is `WidgetAssertion | Predicate`, and that union is why the fi</text><text x="20" y="255">eld is called an assertion rather than a check. A `Predicate` is evaluated against the PERSISTED transcript, so a stored run can b</text><text x="20" y="275">e re-graded against it months later; a `WidgetAssertion` is evaluated against a LIVE DOM and can never be replayed. Calling this a</text><text x="20" y="295"> check would promise the replayability only one half of it has.\&quot;,\&quot;additionalProperties\&quot;:true}},\&quot;additionalProperties\&quot;:true}\n</text><text x="20" y="315">&quot;, &quot;exit_code&quot;: 0, &quot;status&quot;: &quot;completed&quot;}}</text></g></svg>
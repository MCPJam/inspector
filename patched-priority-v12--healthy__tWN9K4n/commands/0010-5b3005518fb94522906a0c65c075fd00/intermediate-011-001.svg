rials, and exit code 0.\n- **Simulated run:** the run notes say \&quot;SIMULATED: deterministic fixture execution; no hosted model o</text><text x="20" y="455">r live billing\&quot;. This run did not exercise a real model.\n- **Script:** the command is saved in `/workspace/run_eval.sh`. It need</text><text x="20" y="475">s `MCPJAM_API_URL` and `MCPJAM_API_KEY` set. With `--wait` it exits 0 on pass and 1 on a failed verdict, so you can use it in CI.\</text><text x="20" y="495">n\n**Concerns:** none that blocked progress.\n- **Setup:** I installed nothing globally and used `npx @mcpjam/cli@latest`.\n- **Ex</text><text x="20" y="515">isting suite:** the suite&#x27;s `environment.servers` was empty, so I passed `--server` explicitly. The docs don&#x27;t say a suite like th</text><text x="20" y="535">at needs it, but passing it worked.\n- **Local option:** the docs also describe a local route, `mcpjam test &lt;file&gt;`, but I did not</text><text x="20" y="555"> try it. It needs a provider API key, and the docs say a login or `sk_` key will be required for every eval in the upcoming CLI 6.</text><text x="20" y="575">\n\nI used about 8 of the 40 shell commands.&quot;, &quot;ttft_ms&quot;: 2075, &quot;type&quot;: &quot;result&quot;, &quot;duration_ms&quot;: 43470, &quot;uuid&quot;: &quot;7f42a701-1103-46a</text><text x="20" y="595">c-b4de-162def2b4f18&quot;, &quot;ttft_stream_ms&quot;: 1364, &quot;time_to_request_ms&quot;: 55, &quot;first_content_frame_ms&quot;: 1364, &quot;queued_turn_count&quot;: 0, &quot;r</text><text x="20" y="615">esult_index&quot;: 0, &quot;model_usage_since_last_result&quot;: {&quot;claude-sonnet-5-5&quot;: {&quot;inputTokens&quot;: 18, &quot;outputTokens&quot;: 2070, &quot;cacheReadInputT</text><text x="20" y="635">okens&quot;: 238775, &quot;cacheCreationInputTokens&quot;: 17099, &quot;webSearchRequests&quot;: 0, &quot;costUSD&quot;: 0.11300950000000001, &quot;contextWindow&quot;: 100000</text><text x="20" y="655">0, &quot;maxOutputTokens&quot;: 12
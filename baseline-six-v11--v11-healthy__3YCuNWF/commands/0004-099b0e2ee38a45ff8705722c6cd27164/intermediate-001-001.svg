<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.021772146224975586s — page 1</text><text x="20" y="75">      description: &gt;-</text><text x="20" y="95">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="115">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="135">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="155">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="175">        a DOM `WidgetAssertion`).</text><text x="20" y="195">      required:</text><text x="20" y="215">        - id</text><text x="20" y="235">        - kind</text><text x="20" y="255">      properties:</text><text x="20" y="275">        id:</text><text x="20" y="295">          type: string</text><text x="20" y="315">          minLength: 1</text><text x="20" y="335">        kind:</text><text x="20" y="355">          type: string</text><text x="20" y="375">          enum:</text><text x="20" y="395">            - prompt</text><text x="20" y="415">            - toolCall</text><text x="20" y="435">            - interact</text><text x="20" y="455">            - assert</text><text x="20" y="475">        prompt:</text><text x="20" y="495">          type: string</text><text x="20" y="515">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="535">        serverName:</text><text x="20" y="555">          type: string</text><text x="20" y="575">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="595">        toolName:</text><text x="20" y="615">          type: string</text><text x="20" y="635">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="655">        arguments:</text><text x="20" y="675">          type: object</text><text x="20" y="695">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="715">          additionalProperties: true</text><text x="20" y="735">        action:</text><text x="20" y="755">          type: object</text><text x="20" y="775">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="795">          additionalProperties: true</text><text x="20" y="815">        assertion:</text><text x="20" y="835">          type: object</text><text x="20" y="855">          description: &gt;-</text><text x="20" y="875">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="895">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="915">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="935">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="955">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="975">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="995">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="1015">            replayability only one half of it has.</text><text x="20" y="1035">          additionalProperties: true</text><text x="20" y="1055">      additionalProperties: true</text><text x="20" y="1075">    EvalAssertion:</text><text x="20" y="1095">      oneOf:</text><text x="20" y="1115">        - type: object</text><text x="20" y="1135">          properties:</text><text x="20" y="1155">            type:</text><text x="20" y="1175">              type: string</text><text x="20" y="1195">              const: toolDescriptionsPresent</text><text x="20" y="1215">            minLength:</text><text x="20" y="1235">              type: integer</text><text x="20" y="1255">              exclusiveMinimum: 0</text><text x="20" y="1275">              maximum: 9007199254740991</text><text x="20" y="1295">            role:</text><text x="20" y="1315">              type: string</text><text x="20" y="1335">              enum:</text><text x="20" y="1355">                - gating</text></g></svg>
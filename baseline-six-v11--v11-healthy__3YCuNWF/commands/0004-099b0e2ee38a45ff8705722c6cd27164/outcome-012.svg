<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">099b0e2ee38a45ff8705722c6cd27164 — page 12</text><text x="20" y="75">          type: string</text><text x="20" y="95">          minLength: 1</text><text x="20" y="115">          description: &gt;-</text><text x="20" y="135">            Suite-level default model id (e.g. `anthropic/claude-haiku-4.5`).</text><text x="20" y="155">            Used for any test that omits `model`.</text><text x="20" y="175">        provider:</text><text x="20" y="195">          type: string</text><text x="20" y="215">          description: &gt;-</text><text x="20" y="235">            Optional suite-level default provider. When omitted, the provider is</text><text x="20" y="255">            derived from a `provider/model` id.</text><text x="20" y="275">        passCriteria:</text><text x="20" y="295">          type: object</text><text x="20" y="315">          description: &gt;-</text><text x="20" y="335">            The floor a run must clear, as a PERCENT in [0, 100] — 80 means 80%.</text><text x="20" y="355">            `minimumPassRatePercent` is the canonical spelling (the unit is in</text><text x="20" y="375">            the name); `minimumPassRate` is the deprecated alias for it. Send</text><text x="20" y="395">            exactly one. THE NAME DISAMBIGUATES THE UNIT: a value in (0, 1) is</text><text x="20" y="415">            accepted on `minimumPassRatePercent`, where it unambiguously means a</text><text x="20" y="435">            sub-1% floor the evaluator can act on, and REJECTED on the bare</text><text x="20" y="455">            `minimumPassRate`, where `0.8` cannot be told apart from a fraction</text><text x="20" y="475">            sent by mistake and would silently make the gate unfailable. Neither</text><text x="20" y="495">            field ever reinterprets a value. A per-case `passThreshold` IS a</text><text x="20" y="515">            fraction; this suite/run floor is not.</text><text x="20" y="535">          properties:</text><text x="20" y="555">            minimumPassRatePercent:</text><text x="20" y="575">              type: number</text><text x="20" y="595">              minimum: 0</text><text x="20" y="615">              maximum: 100</text><text x="20" y="635">              description: &gt;-</text><text x="20" y="655">                A percent in [0, 100]. The whole range is usable, sub-1 values</text><text x="20" y="675">                included — the unit is in the field name, so nothing is</text><text x="20" y="695">                ambiguous. Note that the GitHub Checks gate rounds the measured</text><text x="20" y="715">                rate to an integer before comparing (to stay in step with the</text><text x="20" y="735">                eval UI), so a floor below 0.5 behaves there as if it were 0.5;</text><text x="20" y="755">                the platform&#x27;s own verdict compares unrounded.</text><text x="20" y="775">            minimumPassRate:</text><text x="20" y="795">              type: number</text><text x="20" y="815">              minimum: 0</text><text x="20" y="835">              maximum: 100</text><text x="20" y="855">              deprecated: true</text><text x="20" y="875">              description: &gt;-</text><text x="20" y="895">                Deprecated alias for `minimumPassRatePercent`, same unit. A</text><text x="20" y="915">                value in (0, 1) is REJECTED here — it reads as a fraction sent</text><text x="20" y="935">                by mistake — which is what the `not` below expresses. Use</text><text x="20" y="955">                `minimumPassRatePercent` for a genuine sub-1% floor.</text><text x="20" y="975">              not:</text><text x="20" y="995">                exclusiveMinimum: 0</text><text x="20" y="1015">                exclusiveMaximum: 1</text><text x="20" y="1035">          oneOf:</text><text x="20" y="1055">            - required:</text><text x="20" y="1075">                - minimumPassRatePercent</text><text x="20" y="1095">            - required:</text><text x="20" y="1115">                - minimumPassRate</text><text x="20" y="1135">          additionalProperties: false</text><text x="20" y="1155">        tags:</text><text x="20" y="1175">          type: array</text><text x="20" y="1195">          description: Accepted for forward-compat; not persisted today (no-op).</text><text x="20" y="1215">          items:</text><text x="20" y="1235">            type: string</text><text x="20" y="1255">        tests:</text><text x="20" y="1275">          type: array</text><text x="20" y="1295">          minItems: 1</text><text x="20" y="1315">          maxItems: 100</text><text x="20" y="1335">          description: &gt;-</text><text x="20" y="1355">            Test cases to create in the suite. The object is CLOSED: an unknown</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="845"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">08c45fdf0ffc4d5d9fa0a98df5c5ed54 — page 3</text><text x="20" y="75">              enum:</text><text x="20" y="95">                - inherit</text><text x="20" y="115">                - replace</text><text x="20" y="135">                - extend</text><text x="20" y="155">            list:</text><text x="20" y="175">              type: array</text><text x="20" y="195">              items:</text><text x="20" y="215">                type: object</text><text x="20" y="235">        isNegative:</text><text x="20" y="255">          type: boolean</text><text x="20" y="275">          description: &gt;-</text><text x="20" y="295">            Alias for `isNegativeTest` — the public case-authoring spelling this</text><text x="20" y="315">            API returns on a read. Send one or the other, never both.</text><text x="20" y="335">        iterations:</text><text x="20" y="355">          type: integer</text><text x="20" y="375">          minimum: 1</text><text x="20" y="395">          maximum: 10</text><text x="20" y="415">          description: Alias for `runs`. Send one or the other, never both.</text><text x="20" y="435">        checks:</text><text x="20" y="455">          type: object</text><text x="20" y="475">          description: &gt;-</text><text x="20" y="495">            Per-case CHECK gate — the grading rules this case is scored against.</text><text x="20" y="515">            `mode` says how they combine with the suite&#x27;s own: `inherit` uses</text><text x="20" y="535">            the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to</text><text x="20" y="555">            the suite&#x27;s. Same field, same shape and same name as `checks` on the</text><text x="20" y="575">     
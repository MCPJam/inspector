<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1305"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.002315998077392578s — page 1</text><text x="20" y="75">        (create a new suite and run it). Inline `tests` alone — without a</text><text x="20" y="95">        `suiteId` or a `suiteName` — are rejected with `VALIDATION_ERROR`.</text><text x="20" y="115"></text><text x="20" y="135"></text><text x="20" y="155">        `environmentId` requires `suiteId`: an environment is launchable only</text><text x="20" y="175">        through a suite that has it attached (`environmentIds`, set via `PATCH</text><text x="20" y="195">        /eval-suites/{suiteId}`), so an environment run on a not-yet-created</text><text x="20" y="215">        suite could never be satisfied. `environmentId` and `serverIds` are</text><text x="20" y="235">        mutually exclusive.</text><text x="20" y="255">      anyOf:</text><text x="20" y="275">        - required:</text><text x="20" y="295">            - suiteId</text><text x="20" y="315">        - required:</text><text x="20" y="335">            - suiteName</text><text x="20" y="355">            - tests</text><text x="20" y="375">            - serverIds</text><text x="20" y="395">          properties:</text><text x="20" y="415">            tests:</text><text x="20" y="435">              minItems: 1</text><text x="20" y="455">      properties:</text><text x="20" y="475">        suiteId:</text><text x="20" y="495">          type: string</text><text x="20" y="515">          description: &gt;-</text><text x="20" y="535">            Existing suite to rerun. A bare `suiteId` with no `tests` reruns the</text><text x="20" y="555">            suite exactly as configured.</text><text x="20" y="575">        hosts:</text><text x="20" y="595">          type: array</text><text x="20" y="615">          description: &gt;-</text><text x="20" y="635">            Attachments for a new inline suite only. Each host is a project host</text><text x="20" y="655">            name or ID; servers optionally selects bound server names or IDs. A</text><text x="20" y="675">            sole host is selected automatically. Omit for the project default.</text><text x="20" y="695">            Cannot be combined with suiteId.</text><text x="20" y="715">          items:</text><text x="20" y="735">            type: object</text><text x="20" y="755">            required:</text><text x="20" y="775">              - host</text><text x="20" y="795">            properties:</text><text x="20" y="815">              host:</text><text x="20" y="835">                type: string</text><text x="20" y="855">                minLength: 1</text><text x="20" y="875">              servers:</text><text x="20" y="895">                type: array</text><text x="20" y="915">                items:</text><text x="20" y="935">                  type: string</text><text x="20" y="955">                  minLength: 1</text><text x="20" y="975">        suiteName:</text><text x="20" y="995">          type: string</text><text x="20" y="1015">          description: &gt;-</text><text x="20" y="1035">            Name for a new suite. Required (non-empty) when no `suiteId` is</text><text x="20" y="1055">            given.</text><text x="20" y="1075">        suiteDescription:</text><text x="20" y="1095">          type: string</text><text x="20" y="1115">        tests:</text><text x="20" y="1135">          type: array</text><text x="20" y="1155">          maxItems: 100</text><text x="20" y="1175">          description: Inline test cases to upsert into the suite before running.</text><text x="20" y="1195">          items:</text><text x="20" y="1215">            $ref: &#x27;#/components/schemas/EvalTestCase&#x27;</text><text x="20" y="1235">        serverIds:</text><text x="20" y="1255">          type: array</text><text x="20" y="1275">          minItems: 1</text></g></svg>
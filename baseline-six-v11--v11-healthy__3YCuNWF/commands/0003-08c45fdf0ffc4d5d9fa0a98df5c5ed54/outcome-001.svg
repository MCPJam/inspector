<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">08c45fdf0ffc4d5d9fa0a98df5c5ed54 — page 1</text><text x="20" y="75">$ /bin/bash -c cat create-suite.json &amp;&amp; sed -n &#x27;345,405p&#x27; run-doc.md &amp;&amp; sed -n &#x27;835,880p&#x27; run-doc.md &amp;&amp; curl -fsS &quot;$MCPJAM_API_URL</text><text x="20" y="95">/projects/project_fixture/eval-suites/suite_authored_2/cases&quot; -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; -o reports/saved-cases.js</text><text x="20" y="115">on &amp;&amp; cat reports/saved-cases.json</text><text x="20" y="135">{</text><text x="20" y="155">  &quot;name&quot;: &quot;Arithmetic smoke&quot;,</text><text x="20" y="175">  &quot;serverIds&quot;: [</text><text x="20" y="195">    &quot;server_fixture&quot;</text><text x="20" y="215">  ],</text><text x="20" y="235">  &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="255">  &quot;passCriteria&quot;: {</text><text x="20" y="275">    &quot;minimumPassRatePercent&quot;: 100</text><text x="20" y="295">  },</text><text x="20" y="315">  &quot;tests&quot;: [</text><text x="20" y="335">    {</text><text x="20" y="355">      &quot;title&quot;: &quot;Add two numbers and return five&quot;,</text><text x="20" y="375">      &quot;runs&quot;: 3,</text><text x="20" y="395">      &quot;steps&quot;: [</text><text x="20" y="415">        {</text><text x="20" y="435">          &quot;id&quot;: &quot;s1&quot;,</text><text x="20" y="455">          &quot;kind&quot;: &quot;toolCall&quot;,</text><text x="20" y="475">          &quot;serverName&quot;: &quot;Arithmetic&quot;,</text><text x="20" y="495">          &quot;toolName&quot;: &quot;add&quot;,</text><text x="20" y="515">          &quot;arguments&quot;: {</text><text x="20" y="535">            &quot;a&quot;: 2,</text><text x="20" y="555">            &quot;b&quot;: 3</text><text x="20" y="575">          }</text><text x="20" y="595">        },</text><text x="20" y="615">        {</text><text x="20" y="635">          &quot;id&quot;: &quot;a1&quot;,</text><text x="20" y="655">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="675">          &quot;assertion&quot;: {</text><text x="20" y="695">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="715">            &quot;toolName&quot;: &quot;add&quot;,</text><text x="20" y="735">            &quot;args&quot;: {</text><text x="20" y="755">              &quot;args&quot;: {</text><text x="20" y="775">                &quot;a&quot;: 2,</text><text x="20" y="795">                &quot;b&quot;: 3</text><text x="20" y="815">              },</text><text x="20" y="835">              &quot;argumentMatching&quot;: &quot;exact&quot;</text><text x="20" y="855">            }</text><text x="20" y="875">          }</text><text x="20" y="895">        },</text><text x="20" y="915">        {</text><text x="20" y="935">          &quot;id&quot;: &quot;a2&quot;,</text><text x="20" y="955">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="975">          &quot;assertion&quot;: {</text><text x="20" y="995">            &quot;type&quot;: &quot;toolResultContains&quot;,</text><text x="20" y="1015">            &quot;toolName&quot;: &quot;add&quot;,</text><text x="20" y="1035">            &quot;needle&quot;: &quot;5&quot;</text><text x="20" y="1055">          }</text><text x="20" y="1075">        }</text><text x="20" y="1095">      ]</text><text x="20" y="1115">    }</text><text x="20" y="1135">  ]</text><text x="20" y="1155">}</text><text x="20" y="1175">        (create a new suite and run it). Inline `tests` alone — without a</text><text x="20" y="1195">        `suiteId` or a `suiteName` — are rejected with `VALIDATION_ERROR`.</text><text x="20" y="1215"></text><text x="20" y="1235"></text><text x="20" y="1255">        `environmentId` requires `suiteId`: an environment is launchable only</text><text x="20" y="1275">        through a suite that has it attached (`environmentIds`, set via `PATCH</text><text x="20" y="1295">        /eval-suites/{suiteId}`), so an environment run on a not-yet-created</text><text x="20" y="1315">        suite could never be satisfied. `environmentId` and `serverIds` are</text><text x="20" y="1335">        mutually exclusive.</text><text x="20" y="1355">      anyOf:</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">08c45fdf0ffc4d5d9fa0a98df5c5ed54 — page 2</text><text x="20" y="75">        - required:</text><text x="20" y="95">            - suiteId</text><text x="20" y="115">        - required:</text><text x="20" y="135">            - suiteName</text><text x="20" y="155">            - tests</text><text x="20" y="175">            - serverIds</text><text x="20" y="195">          properties:</text><text x="20" y="215">            tests:</text><text x="20" y="235">              minItems: 1</text><text x="20" y="255">      properties:</text><text x="20" y="275">        suiteId:</text><text x="20" y="295">          type: string</text><text x="20" y="315">          description: &gt;-</text><text x="20" y="335">            Existing suite to rerun. A bare `suiteId` with no `tests` reruns the</text><text x="20" y="355">            suite exactly as configured.</text><text x="20" y="375">        hosts:</text><text x="20" y="395">          type: array</text><text x="20" y="415">          description: &gt;-</text><text x="20" y="435">            Attachments for a new inline suite only. Each host is a project host</text><text x="20" y="455">            name or ID; servers optionally selects bound server names or IDs. A</text><text x="20" y="475">            sole host is selected automatically. Omit for the project default.</text><text x="20" y="495">            Cannot be combined with suiteId.</text><text x="20" y="515">          items:</text><text x="20" y="535">            type: object</text><text x="20" y="555">            required:</text><text x="20" y="575">              - host</text><text x="20" y="595">            properties:</text><text x="20" y="615">              host:</text><text x="20" y="635">                type: string</text><text x="20" y="655">                minLength: 1</text><text x="20" y="675">              servers:</text><text x="20" y="695">                type: array</text><text x="20" y="715">                items:</text><text x="20" y="735">                  type: string</text><text x="20" y="755">                  minLength: 1</text><text x="20" y="775">        suiteName:</text><text x="20" y="795">          type: string</text><text x="20" y="815">          description: &gt;-</text><text x="20" y="835">            Name for a new suite. Required (non-empty) when no `suiteId` is</text><text x="20" y="855">            given.</text><text x="20" y="875">        suiteDescription:</text><text x="20" y="895">          type: string</text><text x="20" y="915">        tests:</text><text x="20" y="935">          type: array</text><text x="20" y="955">          maxItems: 100</text><text x="20" y="975">          description: Inline test cases to upsert into the suite before running.</text><text x="20" y="995">          items:</text><text x="20" y="1015">            $ref: &#x27;#/components/schemas/EvalTestCase&#x27;</text><text x="20" y="1035">        serverIds:</text><text x="20" y="1055">          type: array</text><text x="20" y="1075">          minItems: 1</text><text x="20" y="1095">            `maxExtraToolCalls`, `argumentMatching`), never both in one object.</text><text x="20" y="1115">          additionalProperties: true</text><text x="20" y="1135">        predicates:</text><text x="20" y="1155">          type: object</text><text x="20" y="1175">          deprecated: true</text><text x="20" y="1195">          description: &gt;-</text><text x="20" y="1215">            DEPRECATED spelling of `checks`, which means exactly this. It was</text><text x="20" y="1235">            accepted here all along and never written down, passing only because</text><text x="20" y="1255">            this schema allowed unknown properties; documented rather than</text><text x="20" y="1275">            removed so no caller already sending it breaks. Send one or the</text><text x="20" y="1295">            other, never both.</text><text x="20" y="1315">          properties:</text><text x="20" y="1335">            mode:</text><text x="20" y="1355">              type: string</text></g></svg>
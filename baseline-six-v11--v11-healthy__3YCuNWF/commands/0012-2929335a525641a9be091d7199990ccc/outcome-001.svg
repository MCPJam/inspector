<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">2929335a525641a9be091d7199990ccc — page 1</text><text x="20" y="75">$ /bin/bash -c sed -n &#x27;600,675p&#x27; create-suite-doc.md &amp;&amp; sed -n &#x27;750,805p&#x27; create-suite-doc.md &amp;&amp; sed -n &#x27;1080,1148p&#x27; create-suite-</text><text x="20" y="95">doc.md &amp;&amp; sed -n &#x27;282,425p&#x27; create-suite-doc.md &amp;&amp; sed -n &#x27;2380,2405p&#x27; cli-reference.md</text><text x="20" y="115">      description: &gt;-</text><text x="20" y="135">        One authored test step (the unified test model). `kind` discriminates:</text><text x="20" y="155">        `prompt` is a user message (model turn); `toolCall` is a deterministic,</text><text x="20" y="175">        model-free tool call; `interact` is one pure widget action; `assert` is</text><text x="20" y="195">        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="215">        a DOM `WidgetAssertion`).</text><text x="20" y="235">      required:</text><text x="20" y="255">        - id</text><text x="20" y="275">        - kind</text><text x="20" y="295">      properties:</text><text x="20" y="315">        id:</text><text x="20" y="335">          type: string</text><text x="20" y="355">          minLength: 1</text><text x="20" y="375">        kind:</text><text x="20" y="395">          type: string</text><text x="20" y="415">          enum:</text><text x="20" y="435">            - prompt</text><text x="20" y="455">            - toolCall</text><text x="20" y="475">            - interact</text><text x="20" y="495">            - assert</text><text x="20" y="515">        prompt:</text><text x="20" y="535">          type: string</text><text x="20" y="555">          description: &#x27;User message (`kind: prompt`).&#x27;</text><text x="20" y="575">        serverName:</text><text x="20" y="595">          type: string</text><text x="20" y="615">          description: &#x27;Server that owns the tool (`kind: toolCall`).&#x27;</text><text x="20" y="635">        toolName:</text><text x="20" y="655">          type: string</text><text x="20" y="675">          description: &#x27;Tool name (`kind: toolCall` / `interact`).&#x27;</text><text x="20" y="695">        arguments:</text><text x="20" y="715">          type: object</text><text x="20" y="735">          description: &#x27;Tool-call arguments (`kind: toolCall`).&#x27;</text><text x="20" y="755">          additionalProperties: true</text><text x="20" y="775">        action:</text><text x="20" y="795">          type: object</text><text x="20" y="815">          description: &#x27;Widget action (`kind: interact`).&#x27;</text><text x="20" y="835">          additionalProperties: true</text><text x="20" y="855">        assertion:</text><text x="20" y="875">          type: object</text><text x="20" y="895">          description: &gt;-</text><text x="20" y="915">            The rule an `assert` step checks (`kind: assert`). NOT a narrower</text><text x="20" y="935">            spelling of a case&#x27;s `checks`: this is `WidgetAssertion |</text><text x="20" y="955">            Predicate`, and that union is why the field is called an assertion</text><text x="20" y="975">            rather than a check. A `Predicate` is evaluated against the</text><text x="20" y="995">            PERSISTED transcript, so a stored run can be re-graded against it</text><text x="20" y="1015">            months later; a `WidgetAssertion` is evaluated against a LIVE DOM</text><text x="20" y="1035">            and can never be replayed. Calling this a check would promise the</text><text x="20" y="1055">            replayability only one half of it has.</text><text x="20" y="1075">          additionalProperties: true</text><text x="20" y="1095">      additionalProperties: true</text><text x="20" y="1115">    EvalAssertion:</text><text x="20" y="1135">      oneOf:</text><text x="20" y="1155">        - type: object</text><text x="20" y="1175">          properties:</text><text x="20" y="1195">            type:</text><text x="20" y="1215">              type: string</text><text x="20" y="1235">              const: toolDescriptionsPresent</text><text x="20" y="1255">            minLength:</text><text x="20" y="1275">              type: integer</text><text x="20" y="1295">              exclusiveMinimum: 0</text><text x="20" y="1315">              maximum: 9007199254740991</text><text x="20" y="1335">            role:</text><text x="20" y="1355">              type: string</text></g></svg>
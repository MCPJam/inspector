<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">2929335a525641a9be091d7199990ccc — page 5</text><text x="20" y="75">        provider:</text><text x="20" y="95">          type: string</text><text x="20" y="115">          description: &gt;-</text><text x="20" y="135">            Optional suite-level default provider. When omitted, the provider is</text><text x="20" y="155">            derived from a `provider/model` id.</text><text x="20" y="175">        passCriteria:</text><text x="20" y="195">          type: object</text><text x="20" y="215">          description: &gt;-</text><text x="20" y="235">            The floor a run must clear, as a PERCENT in [0, 100] — 80 means 80%.</text><text x="20" y="255">            `minimumPassRatePercent` is the canonical spelling (the unit is in</text><text x="20" y="275">            the name); `minimumPassRate` is the deprecated alias for it. Send</text><text x="20" y="295">            exactly one. THE NAME DISAMBIGUATES THE UNIT: a value in (0, 1) is</text><text x="20" y="315">            accepted on `minimumPassRatePercent`, where it unambiguously means a</text><text x="20" y="335">            sub-1% floor the evaluator can act on, and REJECTED on the bare</text><text x="20" y="355">            `minimumPassRate`, where `0.8` cannot be told apart from a fraction</text><text x="20" y="375">            sent by mistake and would silently make the gate unfailable. Neither</text><text x="20" y="395">            field ever reinterprets a value. A per-case `passThreshold` IS a</text><text x="20" y="415">            fraction; this suite/run floor is not.</text><text x="20" y="435">          properties:</text><text x="20" y="455">            minimumPassRatePercent:</text><text x="20" y="475">              type: number</text><text x="20" y="495">              minimum: 0</text><text x="20" y="515">              maximum: 100</text><text x="20" y="535">              description: &gt;-</text><text x="20" y="555">                A percent in [0, 100]. The whole range is usable, sub-1 values</text><text x="20" y="575">                included — the unit is in the field name, so nothing is</text><text x="20" y="595">                ambiguous. Note that the GitHub Checks gate rounds the measured</text><text x="20" y="615">                rate to an integer before comparing (to stay in step with the</text><text x="20" y="635">                eval UI), so a floor below 0.5 behaves there as if it were 0.5;</text><text x="20" y="655">                the platform&#x27;s own verdict compares unrounded.</text><text x="20" y="675">            minimumPassRate:</text><text x="20" y="695">              type: number</text><text x="20" y="715">              minimum: 0</text><text x="20" y="735">              maximum: 100</text><text x="20" y="755">              deprecated: true</text><text x="20" y="775">              description: &gt;-</text><text x="20" y="795">                Deprecated alias for `minimumPassRatePercent`, same unit. A</text><text x="20" y="815">                value in (0, 1) is REJECTED here — it reads as a fraction sent</text><text x="20" y="835">                by mistake — which is what the `not` below expresses. Use</text><text x="20" y="855">                `minimumPassRatePercent` for a genuine sub-1% floor.</text><text x="20" y="875">              not:</text><text x="20" y="895">                exclusiveMinimum: 0</text><text x="20" y="915">                exclusiveMaximum: 1</text><text x="20" y="935">          oneOf:</text><text x="20" y="955">            - required:</text><text x="20" y="975">                - minimumPassRatePercent</text><text x="20" y="995">            - required:</text><text x="20" y="1015">                - minimumPassRate</text><text x="20" y="1035">          additionalProperties: false</text><text x="20" y="1055">        tags:</text><text x="20" y="1075">          type: array</text><text x="20" y="1095">          description: Accepted for forward-compat; not persisted today (no-op).</text><text x="20" y="1115">          items:</text><text x="20" y="1135">            type: string</text><text x="20" y="1155">        tests:</text><text x="20" y="1175">          type: array</text><text x="20" y="1195">          minItems: 1</text><text x="20" y="1215">          maxItems: 100</text><text x="20" y="1235">          description: &gt;-</text><text x="20" y="1255">            Test cases to create in the suite. The object is CLOSED: an unknown</text><text x="20" y="1275">            key is a VALIDATION_ERROR, never a silently dropped field.</text><text x="20" y="1295">            `repetitions`, `passThreshold` and `kind` are per-case policy fields</text><text x="20" y="1315">            this surface cannot author — set them through `POST</text><text x="20" y="1335">            /v1/projects/{projectId}/eval-suites/{suiteId}/cases`.</text><text x="20" y="1355">          items:</text></g></svg>
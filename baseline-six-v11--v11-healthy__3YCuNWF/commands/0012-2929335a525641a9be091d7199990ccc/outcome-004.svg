<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">2929335a525641a9be091d7199990ccc — page 4</text><text x="20" y="75">                - required</text><text x="20" y="95">            severity:</text><text x="20" y="115">              type: string</text><text x="20" y="135">              const: warn</text><text x="20" y="155">          required:</text><text x="20" y="175">            - type</text><text x="20" y="195">            - schema</text><text x="20" y="215">        - type: object</text><text x="20" y="235">    EvalSuiteCreateRequest:</text><text x="20" y="255">      type: object</text><text x="20" y="275">      description: &gt;-</text><text x="20" y="295">        Author-only suite-create body. A suite-level default `model` (and</text><text x="20" y="315">        optional `provider`) applies to every test unless the test overrides it.</text><text x="20" y="335">      required:</text><text x="20" y="355">        - name</text><text x="20" y="375">        - serverIds</text><text x="20" y="395">        - model</text><text x="20" y="415">        - tests</text><text x="20" y="435">      properties:</text><text x="20" y="455">        name:</text><text x="20" y="475">          type: string</text><text x="20" y="495">          minLength: 1</text><text x="20" y="515">          description: Suite name.</text><text x="20" y="535">        description:</text><text x="20" y="555">          type: string</text><text x="20" y="575">        serverIds:</text><text x="20" y="595">          type: array</text><text x="20" y="615">          minItems: 1</text><text x="20" y="635">          description: Servers (by canonical project ID) the suite&#x27;s cases run against.</text><text x="20" y="655">          items:</text><text x="20" y="675">            type: string</text><text x="20" y="695">        serverNames:</text><text x="20" y="715">          type: array</text><text x="20" y="735">          description: Optional display names, parallel to `serverIds`.</text><text x="20" y="755">          items:</text><text x="20" y="775">            type: string</text><text x="20" y="795">        hosts:</text><text x="20" y="815">          type: array</text><text x="20" y="835">          description: &gt;-</text><text x="20" y="855">            Clients (hosts) to attach the suite to, in attach order. A suite</text><text x="20" y="875">            with no attached client reports none wherever it is listed, and a</text><text x="20" y="895">            run has no host to select. Same shape as the PATCH `hosts` field.</text><text x="20" y="915">          items:</text><text x="20" y="935">            type: object</text><text x="20" y="955">            required:</text><text x="20" y="975">              - host</text><text x="20" y="995">            properties:</text><text x="20" y="1015">              host:</text><text x="20" y="1035">                type: string</text><text x="20" y="1055">                minLength: 1</text><text x="20" y="1075">                description: Host name or id.</text><text x="20" y="1095">              servers:</text><text x="20" y="1115">                type: array</text><text x="20" y="1135">                items:</text><text x="20" y="1155">                  type: string</text><text x="20" y="1175">                  minLength: 1</text><text x="20" y="1195">                description: &gt;-</text><text x="20" y="1215">                  Server names (as bound in the suite&#x27;s environment) or</text><text x="20" y="1235">                  project-server ids.</text><text x="20" y="1255">        model:</text><text x="20" y="1275">          type: string</text><text x="20" y="1295">          minLength: 1</text><text x="20" y="1315">          description: &gt;-</text><text x="20" y="1335">            Suite-level default model id (e.g. `anthropic/claude-haiku-4.5`).</text><text x="20" y="1355">            Used for any test that omits `model`.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">Observed at +0.005166530609130859s — page 2</text><text x="20" y="75">            The floor a run must clear, as a PERCENT in [0, 100] — 80 means 80%.</text><text x="20" y="95">            `minimumPassRatePercent` is the canonical spelling (the unit is in</text><text x="20" y="115">            the name); `minimumPassRate` is the deprecated alias for it. Send</text><text x="20" y="135">            exactly one. THE NAME DISAMBIGUATES THE UNIT: a value in (0, 1) is</text><text x="20" y="155">            accepted on `minimumPassRatePercent`, where it unambiguously means a</text><text x="20" y="175">            sub-1% floor the evaluator can act on, and REJECTED on the bare</text><text x="20" y="195">            `minimumPassRate`, where `0.8` cannot be told apart from a fraction</text><text x="20" y="215">            sent by mistake and would silently make the gate unfailable. Neither</text><text x="20" y="235">            field ever reinterprets a value. A per-case `passThreshold` IS a</text><text x="20" y="255">            fraction; this suite/run floor is not.</text><text x="20" y="275">          properties:</text><text x="20" y="295">            minimumPassRatePercent:</text><text x="20" y="315">              type: number</text><text x="20" y="335">              minimum: 0</text><text x="20" y="355">              maximum: 100</text><text x="20" y="375">              description: &gt;-</text><text x="20" y="395">                A percent in [0, 100]. The whole range is usable, sub-1 values</text><text x="20" y="415">                included — the unit is in the field name, so nothing is</text><text x="20" y="435">                ambiguous. Note that the GitHub Checks gate rounds the measured</text><text x="20" y="455">                rate to an integer before comparing (to stay in step with the</text><text x="20" y="475">                eval UI), so a floor below 0.5 behaves there as if it were 0.5;</text><text x="20" y="495">                the platform&#x27;s own verdict compares unrounded.</text><text x="20" y="515">            minimumPassRate:</text><text x="20" y="535">              type: number</text><text x="20" y="555">              minimum: 0</text><text x="20" y="575">              maximum: 100</text><text x="20" y="595">              deprecated: true</text><text x="20" y="615">              description: &gt;-</text><text x="20" y="635">                Deprecated alias for `minimumPassRatePercent`, same unit. A</text><text x="20" y="655">                value in (0, 1) is REJECTED here — it reads as a fraction sent</text><text x="20" y="675">                by mistake — which is what the `not` below expresses. Use</text><text x="20" y="695">                `minimumPassRatePercent` for a genuine sub-1% floor.</text><text x="20" y="715">              not:</text><text x="20" y="735">                exclusiveMinimum: 0</text><text x="20" y="755">                exclusiveMaximum: 1</text><text x="20" y="775">          oneOf:</text><text x="20" y="795">            - required:</text><text x="20" y="815">                - minimumPassRatePercent</text><text x="20" y="835">            - required:</text><text x="20" y="855">                - minimumPassRate</text><text x="20" y="875">          additionalProperties: false</text><text x="20" y="895">        tags:</text><text x="20" y="915">          type: array</text><text x="20" y="935">          description: Accepted for forward-compat; not persisted today (no-op).</text><text x="20" y="955">          items:</text><text x="20" y="975">            type: string</text><text x="20" y="995">        tests:</text><text x="20" y="1015">          type: array</text><text x="20" y="1035">          minItems: 1</text><text x="20" y="1055">          maxItems: 100</text><text x="20" y="1075">          description: &gt;-</text><text x="20" y="1095">            Test cases to create in the suite. The object is CLOSED: an unknown</text><text x="20" y="1115">            key is a VALIDATION_ERROR, never a silently dropped field.</text><text x="20" y="1135">            `repetitions`, `passThreshold` and `kind` are per-case policy fields</text><text x="20" y="1155">            this surface cannot author — set them through `POST</text><text x="20" y="1175">            /v1/projects/{projectId}/eval-suites/{suiteId}/cases`.</text><text x="20" y="1195">          items:</text><text x="20" y="1215">            type: object</text><text x="20" y="1235">            required:</text><text x="20" y="1255">              - title</text><text x="20" y="1275">              - steps</text><text x="20" y="1295">            allOf:</text><text x="20" y="1315">              - not:</text><text x="20" y="1335">                  required:</text><text x="20" y="1355">                    - runs</text></g></svg>
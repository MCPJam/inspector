<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1ff0a5ba2463494ca33cb0f994201104 — page 9</text><text x="20" y="75">        /eval-suites/{suiteId}`), so an environment run on a not-yet-created</text><text x="20" y="95">        suite could never be satisfied. `environmentId` and `serverIds` are</text><text x="20" y="115">        mutually exclusive.</text><text x="20" y="135">      anyOf:</text><text x="20" y="155">        - required:</text><text x="20" y="175">            - suiteId</text><text x="20" y="195">        - required:</text><text x="20" y="215">            - suiteName</text><text x="20" y="235">            - tests</text><text x="20" y="255">            - serverIds</text><text x="20" y="275">          properties:</text><text x="20" y="295">            tests:</text><text x="20" y="315">              minItems: 1</text><text x="20" y="335">      properties:</text><text x="20" y="355">        suiteId:</text><text x="20" y="375">          type: string</text><text x="20" y="395">          description: &gt;-</text><text x="20" y="415">            Existing suite to rerun. A bare `suiteId` with no `tests` reruns the</text><text x="20" y="435">            suite exactly as configured.</text><text x="20" y="455">        hosts:</text><text x="20" y="475">          type: array</text><text x="20" y="495">          description: &gt;-</text><text x="20" y="515">            Attachments for a new inline suite only. Each host is a project host</text><text x="20" y="535">            name or ID; servers optionally selects bound server names or IDs. A</text><text x="20" y="555">            sole host is selected automatically. Omit for the project default.</text><text x="20" y="575">            Cannot be combined with suiteId.</text><text x="20" y="595">          items:</text><text x="20" y="615">            type: object</text><text x="20" y="635">            required:</text><text x="20" y="655">              - host</text><text x="20" y="675">            properties:</text><text x="20" y="695">              host:</text><text x="20" y="715">                type: string</text><text x="20" y="735">                minLength: 1</text><text x="20" y="755">              servers:</text><text x="20" y="775">                type: array</text><text x="20" y="795">                items:</text><text x="20" y="815">                  type: string</text><text x="20" y="835">                  minLength: 1</text><text x="20" y="855">        suiteName:</text><text x="20" y="875">          type: string</text><text x="20" y="895">          description: &gt;-</text><text x="20" y="915">            Name for a new suite. Required (non-empty) when no `suiteId` is</text><text x="20" y="935">            given.</text><text x="20" y="955">        suiteDescription:</text><text x="20" y="975">          type: string</text><text x="20" y="995">        tests:</text><text x="20" y="1015">          type: array</text><text x="20" y="1035">          maxItems: 100</text><text x="20" y="1055">          description: Inline test cases to upsert into the suite before running.</text><text x="20" y="1075">          items:</text><text x="20" y="1095">            $ref: &#x27;#/components/schemas/EvalTestCase&#x27;</text><text x="20" y="1115">        serverIds:</text><text x="20" y="1135">          type: array</text><text x="20" y="1155">          minItems: 1</text><text x="20" y="1175">            `maxExtraToolCalls`, `argumentMatching`), never both in one object.</text><text x="20" y="1195">          additionalProperties: true</text><text x="20" y="1215">        predicates:</text><text x="20" y="1235">          type: object</text><text x="20" y="1255">          deprecated: true</text><text x="20" y="1275">          description: &gt;-</text><text x="20" y="1295">            DEPRECATED spelling of `checks`, which means exactly this. It was</text><text x="20" y="1315">            accepted here all along and never written down, passing only because</text><text x="20" y="1335">            this schema allowed unknown properties; documented rather than</text><text x="20" y="1355">            removed so no caller already sending it breaks. Send one or the</text></g></svg>
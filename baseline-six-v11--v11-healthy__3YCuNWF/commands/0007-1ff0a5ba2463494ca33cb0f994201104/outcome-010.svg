<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="925"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">1ff0a5ba2463494ca33cb0f994201104 — page 10</text><text x="20" y="75">            other, never both.</text><text x="20" y="95">          properties:</text><text x="20" y="115">            mode:</text><text x="20" y="135">              type: string</text><text x="20" y="155">              enum:</text><text x="20" y="175">                - inherit</text><text x="20" y="195">                - replace</text><text x="20" y="215">                - extend</text><text x="20" y="235">            list:</text><text x="20" y="255">              type: array</text><text x="20" y="275">              items:</text><text x="20" y="295">                type: object</text><text x="20" y="315">        isNegative:</text><text x="20" y="335">          type: boolean</text><text x="20" y="355">          description: &gt;-</text><text x="20" y="375">            Alias for `isNegativeTest` — the public case-authoring spelling this</text><text x="20" y="395">            API returns on a read. Send one or the other, never both.</text><text x="20" y="415">        iterations:</text><text x="20" y="435">          type: integer</text><text x="20" y="455">          minimum: 1</text><text x="20" y="475">          maximum: 10</text><text x="20" y="495">          description: Alias for `runs`. Send one or the other, never both.</text><text x="20" y="515">        checks:</text><text x="20" y="535">          type: object</text><text x="20" y="555">          description: &gt;-</text><text x="20" y="575">            Per-case CHECK gate — the grading rules this case is scored against.</text><text x="20" y="595">            `mode` says how they combine with the suite&#x27;s own: `inherit` uses</text><text x="20" y="615">            the suite&#x27;s, `replace` uses only `list`, `extend` appends `list` to</text><text x="20" y="635">            the suite&#x27;s. Same field, same shape and same name as `checks` on the</text><text x="20" y="655">            eval-case routes, so authoring a suite and then editing one of its</text><text x="20" y="675">            cases is one word for one concept. Send this or the deprecated</text><text x="20" y="695">            `predicates`, never both.</text><text x="20" y="715">          properties:</text><text x="20" y="735">            mode:</text><text x="20" y="755">              type: string</text><text x="20" y="775">              enum:</text><text x="20" y="795">{&quot;items&quot;: [{&quot;title&quot;: &quot;Add two numbers and return five&quot;, &quot;runs&quot;: 3, &quot;steps&quot;: [{&quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;toolCall&quot;, &quot;serverName&quot;: &quot;Arith</text><text x="20" y="815">metic&quot;, &quot;toolName&quot;: &quot;add&quot;, &quot;arguments&quot;: {&quot;a&quot;: 2, &quot;b&quot;: 3}}, {&quot;id&quot;: &quot;a1&quot;, &quot;kind&quot;: &quot;assert&quot;, &quot;assertion&quot;: {&quot;type&quot;: &quot;toolCalledWith&quot;, </text><text x="20" y="835">&quot;toolName&quot;: &quot;add&quot;, &quot;args&quot;: {&quot;args&quot;: {&quot;a&quot;: 2, &quot;b&quot;: 3}, &quot;argumentMatching&quot;: &quot;exact&quot;}}}, {&quot;id&quot;: &quot;a2&quot;, &quot;kind&quot;: &quot;assert&quot;, &quot;assertion&quot;: </text><text x="20" y="855">{&quot;type&quot;: &quot;toolResultContains&quot;, &quot;toolName&quot;: &quot;add&quot;, &quot;needle&quot;: &quot;5&quot;}}], &quot;id&quot;: &quot;suite_authored_2_case_0&quot;, &quot;suiteId&quot;: &quot;suite_authored_2&quot;</text><text x="20" y="875">}]}</text><text x="20" y="895">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">bb7de80507594c48b6e6adfcdbd2fa13 — page 3</text><text x="20" y="75"></text><text x="20" y="95">## Quick start</text><text x="20" y="115"></text><text x="20" y="135">### 1. Write a suite</text><text x="20" y="155"></text><text x="20" y="175">Save this as `.mcpjam/evals/example.yaml`:</text><text x="20" y="195"></text><text x="20" y="215">```yaml theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="235">schemaVersion: &quot;2&quot;</text><text x="20" y="255">mode: agentWorkflow</text><text x="20" y="275">reportingMode: standard</text><text x="20" y="295">suite:</text><text x="20" y="315">  id: s_notes_example</text><text x="20" y="335">  name: Notes server</text><text x="20" y="355">target:</text><text x="20" y="375">  servers:</text><text x="20" y="395">    - name: notes</text><text x="20" y="415">defaults:</text><text x="20" y="435">  judge:</text><text x="20" y="455">    enabled: false</text><text x="20" y="475">  model: anthropic/claude-haiku-4.5</text><text x="20" y="495">  iterations: 1</text><text x="20" y="515">  passThreshold: 1</text><text x="20" y="535">  validity: {}</text><text x="20" y="555">cases:</text><text x="20" y="575">  - id: c_reads_a_note</text><text x="20" y="595">    title: reads the note it was asked about</text><text x="20" y="615">    steps:</text><text x="20" y="635">      - id: s1</text><text x="20" y="655">        kind: prompt</text><text x="20" y="675">        prompt: What does note 7 say?</text><text x="20" y="695">      - id: a1</text><text x="20" y="715">        kind: assert</text><text x="20" y="735">        assertion:</text><text x="20" y="755">          type: toolCalledAtLeastOnce</text><text x="20" y="775">          toolName: read_note</text><text x="20" y="795">  - id: c_never_deletes</text><text x="20" y="815">    title: never deletes when only asked to read</text><text x="20" y="835">    steps:</text><text x="20" y="855">      - id: s1</text><text x="20" y="875">        kind: prompt</text><text x="20" y="895">        prompt: Summarize note 7.</text><text x="20" y="915">      - id: a1</text><text x="20" y="935">        kind: assert</text><text x="20" y="955">        assertion:</text><text x="20" y="975">          type: toolNeverCalled</text><text x="20" y="995">          toolName: delete_note</text><text x="20" y="1015">```</text><text x="20" y="1035"></text><text x="20" y="1055">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="1075"></text><text x="20" y="1095">### 2. Configure the server</text><text x="20" y="1115"></text><text x="20" y="1135">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="1155">mmand:</text><text x="20" y="1175"></text><text x="20" y="1195">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1215">{</text><text x="20" y="1235">  &quot;mcpServers&quot;: {</text><text x="20" y="1255">    &quot;notes&quot;: {</text><text x="20" y="1275">      &quot;command&quot;: &quot;node&quot;,</text><text x="20" y="1295">      &quot;args&quot;: [&quot;./notes-server.js&quot;],</text><text x="20" y="1315">      &quot;env&quot;: { &quot;NOTES_DB&quot;: &quot;${NOTES_DB:-./notes.db}&quot; }</text><text x="20" y="1335">    }</text><text x="20" y="1355">  }</text></g></svg>
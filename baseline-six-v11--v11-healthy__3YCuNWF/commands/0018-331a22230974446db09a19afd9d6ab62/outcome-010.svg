<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">331a22230974446db09a19afd9d6ab62 — page 10</text><text x="20" y="75">e intent, not completed usage or a charge. This release adds no debit, quota draw, or balance refusal.</text><text x="20" y="95"></text><text x="20" y="115">`DO_NOT_TRACK`, `MCPJAM_TELEMETRY_DISABLED`, and CLI telemetry settings disable analytics, not the required run-start request. Res</text><text x="20" y="135">ults remain local unless result uploading is enabled separately.</text><text x="20" y="155"></text><text x="20" y="175">## Quick start</text><text x="20" y="195"></text><text x="20" y="215">### 1. Write a suite</text><text x="20" y="235"></text><text x="20" y="255">Save this as `.mcpjam/evals/example.yaml`:</text><text x="20" y="275"></text><text x="20" y="295">```yaml theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="315">schemaVersion: &quot;2&quot;</text><text x="20" y="335">mode: agentWorkflow</text><text x="20" y="355">reportingMode: standard</text><text x="20" y="375">suite:</text><text x="20" y="395">  id: s_notes_example</text><text x="20" y="415">  name: Notes server</text><text x="20" y="435">target:</text><text x="20" y="455">  servers:</text><text x="20" y="475">    - name: notes</text><text x="20" y="495">defaults:</text><text x="20" y="515">  judge:</text><text x="20" y="535">    enabled: false</text><text x="20" y="555">  model: anthropic/claude-haiku-4.5</text><text x="20" y="575">  iterations: 1</text><text x="20" y="595">  passThreshold: 1</text><text x="20" y="615">  validity: {}</text><text x="20" y="635">cases:</text><text x="20" y="655">  - id: c_reads_a_note</text><text x="20" y="675">    title: reads the note it was asked about</text><text x="20" y="695">    steps:</text><text x="20" y="715">      - id: s1</text><text x="20" y="735">        kind: prompt</text><text x="20" y="755">        prompt: What does note 7 say?</text><text x="20" y="775">      - id: a1</text><text x="20" y="795">        kind: assert</text><text x="20" y="815">        assertion:</text><text x="20" y="835">          type: toolCalledAtLeastOnce</text><text x="20" y="855">          toolName: read_note</text><text x="20" y="875">  - id: c_never_deletes</text><text x="20" y="895">    title: never deletes when only asked to read</text><text x="20" y="915">    steps:</text><text x="20" y="935">      - id: s1</text><text x="20" y="955">        kind: prompt</text><text x="20" y="975">        prompt: Summarize note 7.</text><text x="20" y="995">      - id: a1</text><text x="20" y="1015">        kind: assert</text><text x="20" y="1035">        assertion:</text><text x="20" y="1055">          type: toolNeverCalled</text><text x="20" y="1075">          toolName: delete_note</text><text x="20" y="1095">```</text><text x="20" y="1115"></text><text x="20" y="1135">`mcpjam cloud eval validate --file .mcpjam/evals/example.yaml` checks the file offline, with no account.</text><text x="20" y="1155"></text><text x="20" y="1175">### 2. Configure the server</text><text x="20" y="1195"></text><text x="20" y="1215">`mcpjam test` binds each `target.servers[].name` to a local MCP config. The simplest is a `.mcp.json` next to where you run the co</text><text x="20" y="1235">mmand:</text><text x="20" y="1255"></text><text x="20" y="1275">```json theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1295">{</text><text x="20" y="1315">  &quot;mcpServers&quot;: {</text><text x="20" y="1335">    &quot;notes&quot;: {</text><text x="20" y="1355">      &quot;command&quot;: &quot;node&quot;,</text></g></svg>
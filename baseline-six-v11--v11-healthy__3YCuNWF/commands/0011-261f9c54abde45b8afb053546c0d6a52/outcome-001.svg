<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1345"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">261f9c54abde45b8afb053546c0d6a52 — page 1</text><text x="20" y="75">$ /bin/bash -c cat &gt; evaluate.cjs &lt;&lt;&#x27;JS&#x27;</text><text x="20" y="95">const fs = require(&#x27;node:fs&#x27;);</text><text x="20" y="115">const base = process.env.MCPJAM_API_URL;</text><text x="20" y="135">const key = process.env.MCPJAM_API_KEY;</text><text x="20" y="155">if (!base || !key) throw new Error(&#x27;Set MCPJAM_API_URL and MCPJAM_API_KEY&#x27;);</text><text x="20" y="175">const project = &#x27;project_fixture&#x27;;</text><text x="20" y="195">const headers = { Authorization: `Bearer ${key}`, &#x27;Content-Type&#x27;: &#x27;application/json&#x27; };</text><text x="20" y="215">async function api(path, body) {</text><text x="20" y="235">  const response = await fetch(`${base}/projects/${project}/${path}`, {</text><text x="20" y="255">    method: body ? &#x27;POST&#x27; : &#x27;GET&#x27;, headers,</text><text x="20" y="275">    body: body ? JSON.stringify(body) : undefined,</text><text x="20" y="295">  });</text><text x="20" y="315">  const result = await response.json();</text><text x="20" y="335">  if (!response.ok || result.code) throw new Error(JSON.stringify(result));</text><text x="20" y="355">  return result;</text><text x="20" y="375">}</text><text x="20" y="395">(async () =&gt; {</text><text x="20" y="415">  fs.mkdirSync(&#x27;reports&#x27;, { recursive: true });</text><text x="20" y="435">  const receipt = JSON.parse(fs.readFileSync(&#x27;reports/minimal-suite.json&#x27;, &#x27;utf8&#x27;));</text><text x="20" y="455">  const launch = await api(&#x27;eval-runs&#x27;, { suiteId: receipt.suiteId });</text><text x="20" y="475">  fs.writeFileSync(&#x27;reports/repeat-launch.json&#x27;, JSON.stringify(launch, null, 2));</text><text x="20" y="495">  const deadline = Date.now() + 30000;</text><text x="20" y="515">  let status;</text><text x="20" y="535">  do {</text><text x="20" y="555">    status = await api(`eval-runs/${launch.runId}`);</text><text x="20" y="575">    if ([&#x27;completed&#x27;, &#x27;failed&#x27;, &#x27;cancelled&#x27;, &#x27;timed_out&#x27;].includes(status.status)) break;</text><text x="20" y="595">    await new Promise(resolve =&gt; setTimeout(resolve, 500));</text><text x="20" y="615">  } while (Date.now() &lt; deadline);</text><text x="20" y="635">  const iterations = await api(`eval-runs/${launch.runId}/iterations`);</text><text x="20" y="655">  const calls = (iterations.items || []).flatMap(i =&gt; i.actualToolCalls || []);</text><text x="20" y="675">  const checks = {</text><text x="20" y="695">    completed: status.status === &#x27;completed&#x27;,</text><text x="20" y="715">    platformPassed: status.result === &#x27;passed&#x27;,</text><text x="20" y="735">    evidencePresent: iterations.items?.length &gt; 0,</text><text x="20" y="755">    allTrialsCorrect: iterations.items?.length &gt; 0 &amp;&amp; iterations.items.every(i =&gt;</text><text x="20" y="775">      i.status === &#x27;completed&#x27; &amp;&amp; i.result === &#x27;passed&#x27; &amp;&amp; !i.error &amp;&amp;</text><text x="20" y="795">      i.actualToolCalls?.length === 1 &amp;&amp; i.actualToolCalls.every(c =&gt;</text><text x="20" y="815">        c.toolName === &#x27;add&#x27; &amp;&amp; c.arguments.a === 2 &amp;&amp; c.arguments.b === 3 &amp;&amp;</text><text x="20" y="835">        c.result?.isError === false &amp;&amp; c.result?.structuredContent?.sum === 5)),</text><text x="20" y="855">  };</text><text x="20" y="875">  const report = { suiteId: receipt.suiteId, runId: launch.runId,</text><text x="20" y="895">    scope: &#x27;Deterministic MCP tool execution; no model selection evaluated&#x27;,</text><text x="20" y="915">    expected: {toolName: &#x27;add&#x27;, arguments: {a: 2, b: 3}, sum: 5},</text><text x="20" y="935">    checks, passed: Object.values(checks).every(Boolean), status, iterations };</text><text x="20" y="955">  fs.writeFileSync(&#x27;reports/repeat-evaluation.json&#x27;, JSON.stringify(report, null, 2));</text><text x="20" y="975">  console.log(JSON.stringify({runId: report.runId, passed: report.passed, checks, trials: iterations.items?.length}, null, 2));</text><text x="20" y="995">  if (!report.passed) process.exitCode = 1;</text><text x="20" y="1015">})().catch(error =&gt; { console.error(error.message); process.exitCode = 1; });</text><text x="20" y="1035">JS</text><text x="20" y="1055">node evaluate.cjs</text><text x="20" y="1075">{</text><text x="20" y="1095">  &quot;runId&quot;: &quot;run_fixture_2&quot;,</text><text x="20" y="1115">  &quot;passed&quot;: true,</text><text x="20" y="1135">  &quot;checks&quot;: {</text><text x="20" y="1155">    &quot;completed&quot;: true,</text><text x="20" y="1175">    &quot;platformPassed&quot;: true,</text><text x="20" y="1195">    &quot;evidencePresent&quot;: true,</text><text x="20" y="1215">    &quot;allTrialsCorrect&quot;: true</text><text x="20" y="1235">  },</text><text x="20" y="1255">  &quot;trials&quot;: 1</text><text x="20" y="1275">}</text><text x="20" y="1295"></text><text x="20" y="1315">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
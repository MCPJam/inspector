| head -110\</text><text x="20" y="935">&quot;&quot;, &quot;aggregated_output&quot;: &quot;| Flag | Description |\n| - | - |\n| `--api-key &lt;key&gt;` | MCPJam `sk_` API key (overrides `MCPJAM_API_KEY</text><text x="20" y="955">`) |\n| `--api-url &lt;url&gt;` | MCPJam API base URL (defaults to `https://app.mcpjam.com/api/v1`) |\n| `--api-header &lt;header...&gt;` | Ex</text><text x="20" y="975">tra request header as `\&quot;Name: value\&quot;`, repeatable — for a deployment behind Cloudflare Access, a WAF, or a corporate proxy. Also</text><text x="20" y="995"> `MCPJAM_API_HEADERS`, one per line. Cannot set `authorization`, `idempotency-key`, or `content-type`. |\n\n### `cloud eval create</text><text x="20" y="1015">`\n\nCreate a runnable eval suite from authored test cases (does not run it).\n\n| Flag | Required | Description |\n| - | - | - |\</text><text x="20" y="1035">n| `--project &lt;id-or-name&gt;` | No | Project name or ID (defaults to the most recently updated project) |\n| `--file &lt;path&gt;` | No | </text><text x="20" y="1055">Path to a **create-API JSON** body (or `-` for stdin). A versioned suite file (`schemaVersion: \&quot;1\&quot;`) belongs on `eval run --file</text><text x="20" y="1075">` |\n| `--json &lt;json&gt;` | No | Inline suite definition JSON (or `@file`, or `-` for stdin) |\n| `--name &lt;name&gt;` | No | Suite name (</text><text x="20" y="1095">overrides the file) |\n| `--model &lt;model&gt;` | No | Suite-level default model (overrides the file) |\n| `--provider &lt;provider&gt;` | No</text><text x="20" y="1115"> | Suite-level default provider (overrides the file) |\n| `--server &lt;id-or-name...&gt;` | No | Project HTTP server names or IDs (over</text><text x="20" y="1135">rides the file) |\n| `--client &lt;id-or-name...&gt;` | No | Clients to attach the suite to (overrides the file). Without one the suite </text><text x="20" y="1155">lists no client, and `eval run --client` has nothing to select |\n| `--host &lt;id-or-name...&gt;` | No | **Deprecated** alias for `--cl</text><text x="20" y="1175">ient`. Passing both is an error. |\n\n### `cloud eval list`\n\nList the eval suites saved in a project.\n\n| Flag | Required | Des</text><text x="20" y="1195">cription |\n| - | - | - |\n| `--project &lt;id-or-name&gt;` | No | Project name or ID (defaults to the most recently updated project) |\</text><text x="20" y="1215">n\n### `cloud eval run`\n\nStart an eval run of an existing suite, or upload a versioned suite file and run it. Provide **either**</text><text x="20" y="1235"> `--suite` **or** `--file`, not both.\n\nBy default the command prints a launch receipt and returns immediately. `--wait` polls ev</text><text x="20" y="1255">ery launched run to a terminal state.\n\n**Exit codes (`--wait` only).** Without `--wait` this command&#x27;s exit code is unchanged: `</text><text x="20" y="1275">0` on any launch, `1` on a partial or wholly failed fan-out. `--wait` owns a separate six-code contract — a caller who asked this </text><text x="20" y="1295">process to sit and watch a run to completion is asking it to say how the run went:\n\n| Code | Meaning |\n| - | - |\n| `0` | Every</text><text x="20" y="1315"> waited run passed, unanimously, and (when a report was requested) every report was assembled |\n| `1` | A run **completed** with </text><text x="20" y="1335">a **failed** verdict. The only condition that produces this code |\n| `2` | Usage error — bad flags, `--reporter`/`--out` without </text><text x="20" y="1355">`--wait`, or an invalid suite file (after auth, before any server/model work) |\n| `3` | Auth failed — no credential, or the platf</text></g></svg>
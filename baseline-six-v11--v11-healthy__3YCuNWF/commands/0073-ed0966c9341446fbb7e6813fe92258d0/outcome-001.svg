<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">ed0966c9341446fbb7e6813fe92258d0 — page 1</text><text x="20" y="75">$ /bin/bash -c rg -n &#x27;toolResultContains|ToolCallStep|toolCalledWith|EvalSuiteCreate|steps:|contains:|toolName:&#x27; create-suite-doc.</text><text x="20" y="95">md | head -65 &amp;&amp; sed -n &#x27;710,775p&#x27; public-api.md &amp;&amp; npx mcpjam cloud projects servers create --help</text><text x="20" y="115">204:              $ref: &#x27;#/components/schemas/EvalSuiteCreateRequest&#x27;</text><text x="20" y="135">212:                  steps:</text><text x="20" y="155">219:                        type: toolCalledWith</text><text x="20" y="175">220:                        toolName: list_files</text><text x="20" y="195">229:                $ref: &#x27;#/components/schemas/EvalSuiteCreated&#x27;</text><text x="20" y="215">282:    EvalSuiteCreateRequest:</text><text x="20" y="235">425:              steps:</text><text x="20" y="255">430:                  `prompt` step is the case query; `toolCalledWith` asserts are</text><text x="20" y="275">535:    EvalSuiteCreated:</text><text x="20" y="295">604:        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="315">626:        toolName:</text><text x="20" y="335">764:              const: toolCalledWith</text><text x="20" y="355">765:            toolName:</text><text x="20" y="375">806:            toolName:</text><text x="20" y="395">826:            toolName:</text><text x="20" y="415">868:            toolName:</text><text x="20" y="435">983:            toolName:</text><text x="20" y="455">1006:            toolName:</text><text x="20" y="475">1026:            toolName:</text><text x="20" y="495">1086:            toolName:</text><text x="20" y="515">1105:              const: toolResultContains</text><text x="20" y="535">1112:            toolName:</text><text x="20" y="555">1133:            toolName:</text><text x="20" y="575">1157:            toolName:</text><text x="20" y="595">1177:            toolName:</text><text x="20" y="615">1207:            toolName:</text><text x="20" y="635">1289:            toolName:</text><text x="20" y="655">1359:            toolName:</text><text x="20" y="675">1382:            toolName:</text><text x="20" y="695">1402:            toolName:</text><text x="20" y="715">1458:            toolName:</text><text x="20" y="735">1477:            toolName:</text><text x="20" y="755">`{ imported, expiresAt }` answer. Every answer carries `Deprecation: true`, a</text><text x="20" y="775">`Sunset` date and a `Link` to `.../accounts`.</text><text x="20" y="795"></text><text x="20" y="815">An account this route creates is hosted-only. An existing default it writes</text><text x="20" y="835">into keeps whatever rule it had. Its `serverUrl` must be the URL saved in the</text><text x="20" y="855">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="875">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="895">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="915"></text><text x="20" y="935">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="955">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="975"></text><text x="20" y="995">## Run evals from the API</text><text x="20" y="1015"></text><text x="20" y="1035">The shortest useful loop — create a run with one inline test, then poll:</text><text x="20" y="1055"></text><text x="20" y="1075">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1095"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="1115">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="1135">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="1155">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="1175">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="1195">  -d &#x27;{</text><text x="20" y="1215">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="1235">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="1255">    &quot;tests&quot;: [{</text><text x="20" y="1275">      &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="1295">      &quot;runs&quot;: 1,</text><text x="20" y="1315">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1335">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="1355">      &quot;steps&quot;: [</text></g></svg>
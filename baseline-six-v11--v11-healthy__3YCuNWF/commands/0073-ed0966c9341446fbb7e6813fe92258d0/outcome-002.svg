<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="985"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">ed0966c9341446fbb7e6813fe92258d0 — page 2</text><text x="20" y="75">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="95">        {</text><text x="20" y="115">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="135">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="155">          &quot;assertion&quot;: {</text><text x="20" y="175">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="195">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="215">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="235">          }</text><text x="20" y="255">        }</text><text x="20" y="275">      ]</text><text x="20" y="295">    }]</text><text x="20" y="315">  }&#x27; | jq -er .runId)</text><text x="20" y="335"></text><text x="20" y="355"># 2. Poll until status is completed | failed | cancelled | timed_out</text><text x="20" y="375">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID&quot; \</text><text x="20" y="395">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="415"></text><text x="20" y="435"># 3. If it did not pass, read the decision summary FIRST</text><text x="20" y="455">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/decision-summary&quot; \</text><text x="20" y="475">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="495"></text><text x="20" y="515"># 4. Or go straight to per-iteration tool calls, token usage, latency</text><text x="20" y="535">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/iterations&quot; \</text><text x="20" y="555">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="575">```</text><text x="20" y="595"></text><text x="20" y="615">The decision summary composes steps 2 and 4 into one versioned object so every</text><text x="20" y="635">client reads a run the same way. Four things to know before gating on it:</text><text x="20" y="655"></text><text x="20" y="675">* **`measurementUnit` ships with every count.** Under per-case grading the</text><text x="20" y="695">  counts are case-execution *variants*, with iterations as trials inside them;</text><text x="20" y="715">  under a suite-wide accuracy threshold they are trials. The same suite reports</text><text x="20" y="735">  a different total under each — 3 against 15 for three cases run five times —</text><text x="20" y="755">  so a count without its unit is not a fact, and a rate is never converted</text><text x="20" y="775">Usage: mcpjam cloud projects servers create|add [options]</text><text x="20" y="795"></text><text x="20" y="815">Create a saved MCP server</text><text x="20" y="835"></text><text x="20" y="855">Options:</text><text x="20" y="875">  --project &lt;id-or-name&gt;  Project name or ID</text><text x="20" y="895">  --body &lt;json&gt;           Server JSON body</text><text x="20" y="915">  -h, --help              display help for command</text><text x="20" y="935"></text><text x="20" y="955">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1065"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7cb42f93bad64296b7f5f8994d299d71 — page 9</text><text x="20" y="75">      &quot;runs&quot;: 1,</text><text x="20" y="95">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="115">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="135">      &quot;steps&quot;: [</text><text x="20" y="155">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="175">        {</text><text x="20" y="195">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="215">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="235">          &quot;assertion&quot;: {</text><text x="20" y="255">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="275">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="295">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="315">          }</text><text x="20" y="335">        }</text><text x="20" y="355">      ]</text><text x="20" y="375">    }]</text><text x="20" y="395">  }&#x27; | jq -er .runId)</text><text x="20" y="415"></text><text x="20" y="435"># 2. Poll until status is completed | failed | cancelled | timed_out</text><text x="20" y="455">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID&quot; \</text><text x="20" y="475">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="495"></text><text x="20" y="515"># 3. If it did not pass, read the decision summary FIRST</text><text x="20" y="535">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/decision-summary&quot; \</text><text x="20" y="555">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="575"></text><text x="20" y="595"># 4. Or go straight to per-iteration tool calls, token usage, latency</text><text x="20" y="615">curl -s &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs/$RUN_ID/iterations&quot; \</text><text x="20" y="635">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot;</text><text x="20" y="655">```</text><text x="20" y="675"></text><text x="20" y="695">The decision summary composes steps 2 and 4 into one versioned object so every</text><text x="20" y="715">client reads a run the same way. Four things to know before gating on it:</text><text x="20" y="735"></text><text x="20" y="755">* **`measurementUnit` ships with every count.** Under per-case grading the</text><text x="20" y="775">  counts are case-execution *variants*, with iterations as trials inside them;</text><text x="20" y="795">  under a suite-wide accuracy threshold they are trials. The same suite reports</text><text x="20" y="815">  a different total under each — 3 against 15 for three cases run five times —</text><text x="20" y="835">  so a count without its unit is not a fact, and a rate is never converted</text><text x="20" y="855">Usage: mcpjam cloud projects servers create|add [options]</text><text x="20" y="875"></text><text x="20" y="895">Create a saved MCP server</text><text x="20" y="915"></text><text x="20" y="935">Options:</text><text x="20" y="955">  --project &lt;id-or-name&gt;  Project name or ID</text><text x="20" y="975">  --body &lt;json&gt;           Server JSON body</text><text x="20" y="995">  -h, --help              display help for command</text><text x="20" y="1015"></text><text x="20" y="1035">[exit=0; signal=None; timeout=unrecorded]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">7cb42f93bad64296b7f5f8994d299d71 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;rg -n &#x27;&quot;&#x27;&quot;&#x27;toolResultContains|ToolCallStep|toolCalledWith|EvalSuiteCreate|steps:|contains:|toolName:&#x27;&quot;&#x27;&quot;&#x27; cre</text><text x="20" y="175">ate-suite-doc.md | head -65 &amp;&amp; sed -n &#x27;&quot;&#x27;&quot;&#x27;710,775p&#x27;&quot;&#x27;&quot;&#x27; public-api.md &amp;&amp; npx mcpjam cloud projects servers create --help&#x27;</text><text x="20" y="195">204:              $ref: &#x27;#/components/schemas/EvalSuiteCreateRequest&#x27;</text><text x="20" y="215">212:                  steps:</text><text x="20" y="235">219:                        type: toolCalledWith</text><text x="20" y="255">220:                        toolName: list_files</text><text x="20" y="275">229:                $ref: &#x27;#/components/schemas/EvalSuiteCreated&#x27;</text><text x="20" y="295">282:    EvalSuiteCreateRequest:</text><text x="20" y="315">425:              steps:</text><text x="20" y="335">430:                  `prompt` step is the case query; `toolCalledWith` asserts are</text><text x="20" y="355">535:    EvalSuiteCreated:</text><text x="20" y="375">604:        an assertion (a `Predicate` like `toolCalledWith` / `widgetRendered`, or</text><text x="20" y="395">626:        toolName:</text><text x="20" y="415">764:              const: toolCalledWith</text><text x="20" y="435">765:            toolName:</text><text x="20" y="455">806:            toolName:</text><text x="20" y="475">826:            toolName:</text><text x="20" y="495">868:            toolName:</text><text x="20" y="515">983:            toolName:</text><text x="20" y="535">1006:            toolName:</text><text x="20" y="555">1026:            toolName:</text><text x="20" y="575">1086:            toolName:</text><text x="20" y="595">1105:              const: toolResultContains</text><text x="20" y="615">1112:            toolName:</text><text x="20" y="635">1133:            toolName:</text><text x="20" y="655">1157:            toolName:</text><text x="20" y="675">1177:            toolName:</text><text x="20" y="695">1207:            toolName:</text><text x="20" y="715">1289:            toolName:</text><text x="20" y="735">1359:            toolName:</text><text x="20" y="755">1382:            toolName:</text><text x="20" y="775">1402:            toolName:</text><text x="20" y="795">1458:            toolName:</text><text x="20" y="815">1477:            toolName:</text><text x="20" y="835">`{ imported, expiresAt }` answer. Every answer carries `Deprecation: true`, a</text><text x="20" y="855">`Sunset` date and a `Link` to `.../accounts`.</text><text x="20" y="875"></text><text x="20" y="895">An account this route creates is hosted-only. An existing default it writes</text><text x="20" y="915">into keeps whatever rule it had. Its `serverUrl` must be the URL saved in the</text><text x="20" y="935">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="955">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="975">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="995"></text><text x="20" y="1015">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="1035">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="1055"></text><text x="20" y="1075">## Run evals from the API</text><text x="20" y="1095"></text><text x="20" y="1115">The shortest useful loop — create a run with one inline test, then poll:</text><text x="20" y="1135"></text><text x="20" y="1155">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="1175"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="1195">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="1215">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="1235">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="1255">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="1275">  -d &#x27;{</text><text x="20" y="1295">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="1315">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="1335">    &quot;tests&quot;: [{</text><text x="20" y="1355">      &quot;title&quot;: &quot;echo works&quot;,</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1385"><rect width="100%" height="100%" fill="#101820"/><g font-family="monospace" font-size="14" fill="#e8edf2"><text x="20" y="25" fill="#86d9c4">Rendered evidence from captured output</text><text x="20" y="47">b14a1a334a7d438284c5491c0c23acb2 — page 8</text><text x="20" y="75">if [ -n &quot;${PATH:-}&quot; ]; then export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/a</text><text x="20" y="95">arch64-unknown-linux-musl/codex-path&#x27;:&quot;$PATH&quot;; else export PATH=&#x27;/usr/local/lib/node_modules/@openai/codex/node_modules/@openai/co</text><text x="20" y="115">dex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex-path&#x27;; fi</text><text x="20" y="135"></text><text x="20" y="155">exec &#x27;/bin/bash&#x27; -c &#x27;npx mcpjam cloud link project_fixture --format json &amp;&amp; npx mcpjam cloud projects servers --project project_fi</text><text x="20" y="175">xture --format json &gt; project-servers.json &amp;&amp; cat project-servers.json &amp;&amp; sed -n &#x27;&quot;&#x27;&quot;&#x27;700,790p&#x27;&quot;&#x27;&quot;&#x27; public-api.md&#x27;</text><text x="20" y="195">{&quot;status&quot;:&quot;linked&quot;,&quot;path&quot;:&quot;/workspace/.mcpjam/project.json&quot;,&quot;project&quot;:{&quot;id&quot;:&quot;project_fixture&quot;,&quot;name&quot;:&quot;Fixture&quot;},&quot;apiUrl&quot;:&quot;http://f</text><text x="20" y="215">ixture:8765/api/v1&quot;}</text><text x="20" y="235">Using MCPJam Cloud as sk_…etic · project: flag (project_fixture) · http://fixture:8765/api/v1</text><text x="20" y="255">{&quot;project&quot;:{&quot;id&quot;:&quot;project_fixture&quot;,&quot;name&quot;:&quot;Fixture&quot;,&quot;sensitive_value&quot;: &quot;[REDACTED]&quot;},&quot;items&quot;:[{&quot;id&quot;:&quot;server_fixture&quot;,&quot;name&quot;:&quot;Arith</text><text x="20" y="275">metic&quot;,&quot;projectId&quot;:&quot;project_fixture&quot;,&quot;transportType&quot;:&quot;http&quot;,&quot;url&quot;:&quot;http://fixture:8765/mcp&quot;,&quot;enabled&quot;:true,&quot;useOAuth&quot;:false,&quot;hasCl</text><text x="20" y="295">ientSecret&quot;:false}],&quot;otherProjects&quot;:[]}</text><text x="20" y="315">to revoke the token where the issuer supports revocation. That is best effort,</text><text x="20" y="335">and it also ends any copy of the same token you still hold. The default</text><text x="20" y="355">account can&#x27;t be deleted while other accounts exist (`409`): make another</text><text x="20" y="375">account the default first.</text><text x="20" y="395"></text><text x="20" y="415">### The deprecated import route</text><text x="20" y="435"></text><text x="20" y="455">`POST .../oauth/import-tokens` still works, and is removed 90 days after the</text><text x="20" y="475">accounts API shipped. It uploads to your default account, creating an unnamed</text><text x="20" y="495">one when the server has none, and keeps its old body and its old</text><text x="20" y="515">`{ imported, expiresAt }` answer. Every answer carries `Deprecation: true`, a</text><text x="20" y="535">`Sunset` date and a `Link` to `.../accounts`.</text><text x="20" y="555"></text><text x="20" y="575">An account this route creates is hosted-only. An existing default it writes</text><text x="20" y="595">into keeps whatever rule it had. Its `serverUrl` must be the URL saved in the</text><text x="20" y="615">project, or the answer is `400`. `authorizationServerUrl`, `oauthResourceUrl`</text><text x="20" y="635">and `tokens.id_token` are accepted and ignored. Move to</text><text x="20" y="655">`PUT .../accounts/{account}`, which names the account it writes.</text><text x="20" y="675"></text><text x="20" y="695">The error codes these routes add to `details.code` are listed in the</text><text x="20" y="715">[error code reference](https://docs.mcpjam.com/troubleshooting/error-codes.md#server-account-errors).</text><text x="20" y="735"></text><text x="20" y="755">## Run evals from the API</text><text x="20" y="775"></text><text x="20" y="795">The shortest useful loop — create a run with one inline test, then poll:</text><text x="20" y="815"></text><text x="20" y="835">```bash theme={&quot;theme&quot;:&quot;css-variables&quot;}</text><text x="20" y="855"># 1. Create (responds 202 immediately; -f + jq -e fail fast on errors)</text><text x="20" y="875">RUN_ID=$(curl -fsS -X POST \</text><text x="20" y="895">  &quot;https://app.mcpjam.com/api/v1/projects/$PROJECT_ID/eval-runs&quot; \</text><text x="20" y="915">  -H &quot;Authorization: Bearer $MCPJAM_API_KEY&quot; \</text><text x="20" y="935">  -H &quot;Content-Type: application/json&quot; \</text><text x="20" y="955">  -d &#x27;{</text><text x="20" y="975">    &quot;suiteName&quot;: &quot;smoke&quot;,</text><text x="20" y="995">    &quot;serverIds&quot;: [&quot;&#x27;$SERVER_ID&#x27;&quot;],</text><text x="20" y="1015">    &quot;tests&quot;: [{</text><text x="20" y="1035">      &quot;title&quot;: &quot;echo works&quot;,</text><text x="20" y="1055">      &quot;runs&quot;: 1,</text><text x="20" y="1075">      &quot;model&quot;: &quot;anthropic/claude-haiku-4.5&quot;,</text><text x="20" y="1095">      &quot;provider&quot;: &quot;anthropic&quot;,</text><text x="20" y="1115">      &quot;steps&quot;: [</text><text x="20" y="1135">        { &quot;id&quot;: &quot;s1&quot;, &quot;kind&quot;: &quot;prompt&quot;, &quot;prompt&quot;: &quot;Use the echo tool to say hi&quot; },</text><text x="20" y="1155">        {</text><text x="20" y="1175">          &quot;id&quot;: &quot;s2&quot;,</text><text x="20" y="1195">          &quot;kind&quot;: &quot;assert&quot;,</text><text x="20" y="1215">          &quot;assertion&quot;: {</text><text x="20" y="1235">            &quot;type&quot;: &quot;toolCalledWith&quot;,</text><text x="20" y="1255">            &quot;toolName&quot;: &quot;echo&quot;,</text><text x="20" y="1275">            &quot;args&quot;: { &quot;args&quot;: { &quot;text&quot;: &quot;hi&quot; } }</text><text x="20" y="1295">          }</text><text x="20" y="1315">        }</text><text x="20" y="1335">      ]</text><text x="20" y="1355">    }]</text></g></svg>
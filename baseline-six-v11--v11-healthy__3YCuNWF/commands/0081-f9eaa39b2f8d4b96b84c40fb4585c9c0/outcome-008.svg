alls = (iterations.items || []).flatMap(i =&gt; i.actualToolCalls || []);</text><text x="20" y="755">  const checks = {</text><text x="20" y="775">    completed: status.status === &#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27;,</text><text x="20" y="795">    platformPassed: status.result === &#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27;,</text><text x="20" y="815">    evidencePresent: iterations.items?.length &gt; 0,</text><text x="20" y="835">    allTrialsCorrect: iterations.items?.length &gt; 0 &amp;&amp; iterations.items.every(i =&gt;</text><text x="20" y="855">      i.status === &#x27;&quot;&#x27;&quot;&#x27;completed&#x27;&quot;&#x27;&quot;&#x27; &amp;&amp; i.result === &#x27;&quot;&#x27;&quot;&#x27;passed&#x27;&quot;&#x27;&quot;&#x27; &amp;&amp; !i.error &amp;&amp;</text><text x="20" y="875">      i.actualToolCalls?.length === 1 &amp;&amp; i.actualToolCalls.every(c =&gt;</text><text x="20" y="895">        c.toolName === &#x27;&quot;&#x27;&quot;&#x27;add&#x27;&quot;&#x27;&quot;&#x27; &amp;&amp; c.arguments.a === 2 &amp;&amp; c.arguments.b === 3 &amp;&amp;</text><text x="20" y="915">        c.result?.isError === false &amp;&amp; c.result?.structuredContent?.sum === 5)),</text><text x="20" y="935">  };</text><text x="20" y="955">  const report = { suiteId: receipt.suiteId, runId: launch.runId,</text><text x="20" y="975">    scope: &#x27;&quot;&#x27;&quot;&#x27;Deterministic MCP tool execution; no model selection evaluated&#x27;&quot;&#x27;&quot;&#x27;,</text><text x="20" y="995">    expected: {toolName: &#x27;&quot;&#x27;&quot;&#x27;add&#x27;&quot;&#x27;&quot;&#x27;, arguments: {a: 2, b: 3}, sum: 5},</text><text x="20" y="1015">    checks, passed: Object.values(checks).every(Boolean), status, iterations };</text><text x="20" y="1035">  fs.writeFileSync(&#x27;&quot;&#x27;&quot;&#x27;reports/repeat-evaluation.json&#x27;&quot;&#x27;&quot;&#x27;, JSON.stringify(report, null, 2));</text><text x="20" y="1055">  console.log(JS